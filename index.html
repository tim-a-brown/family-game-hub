<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="theme-color" content="#141029">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Game Night</title>
<link rel="stylesheet" href="kit.css">
<script src="sync.js"></script>
<script src="games.js"></script>
<script src="game-icons.js"></script>
<script src="kit.js"></script>
<script src="players.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/service-worker.js').then(function (r) { try { r.update(); } catch (e) {} }).catch(function () {});
  });
}
// Not signed in yet (no PIN, no guest choice): send to the gate first.
if (typeof FGHSync !== 'undefined' && !FGHSync.mode()) location.replace('./gate.html');
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && window.FGHSync && FGHSync.syncNow) FGHSync.syncNow();
});
</script>
<style>
.home{max-width:1240px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 40px);}

/* Top */
.top{display:flex;align-items:center;gap:12px;}
.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;color:#2b1a00;border:0;
  background:linear-gradient(135deg,var(--yellow),var(--orange));box-shadow:inset 0 -4px 0 rgba(0,0,0,.18), 0 8px 22px rgba(255,138,61,.35);
  transform:rotate(-6deg);transition:transform .4s var(--spring);}
.logo:active{transform:rotate(20deg) scale(.9);}
.top .who{flex:1;min-width:0;}
.top .hi{font-size:.9rem;font-weight:800;color:var(--yellow);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top h1{font-size:1.75rem;font-weight:900;}
.logo .ico{width:28px;height:28px;}
.me{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;flex:none;
  background:var(--surface-3);color:var(--text);font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
.me:active{transform:scale(.9);}
.syncdot{position:relative;}
.syncdot::after{content:"";position:absolute;right:1px;top:1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--text-3);}
.syncdot.s-synced::after{background:var(--green);}
.syncdot.s-syncing::after{background:var(--yellow);animation:pulse 1s infinite;}
.syncdot.s-offline::after{background:var(--text-3);}
.syncdot.s-error::after{background:var(--red);}

/* Search row with the Surprise button */
.srow{display:flex;gap:10px;align-items:center;}
.srow .search{flex:1;min-width:0;}
.surprise{min-height:48px;padding:0 16px;border-radius:999px;font-size:1rem;}
.surprise .d{display:inline-flex;transition:transform .5s var(--spring);}
.surprise .d .ico{width:20px;height:20px;}
.surprise:active .d{transform:rotate(180deg);}
@media (max-width:360px){.surprise .lbl{display:none;}}

/* Search + filters (sticky) */
.filters{position:sticky;top:0;z-index:20;margin:10px -16px 0;padding:calc(var(--safe-t) + 8px) 16px 8px;background:linear-gradient(var(--bg) 78%, rgba(20,16,41,0));}
.search{position:relative;}
.search svg{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
.search .input{padding-left:46px;padding-right:44px;min-height:48px;border-radius:999px;}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:var(--text-2);font-weight:900;display:none;}
.search.has-q .x{display:block;}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px 2px;scroll-padding:16px;}
.chips::-webkit-scrollbar{display:none;}
.chip .ico{width:16px;height:16px;}
.chip.who{background:color-mix(in srgb,var(--blue) 22%,transparent);color:var(--text);}
.chip.who.set{background:var(--blue);color:#03182f;}
.chips .sep{flex:none;width:1px;margin:8px 2px;background:var(--line-2);}

/* Section headings */
.sec{margin-top:22px;}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px;}
.sec-h h2{font-size:1.25rem;}
.sec-h .ico{width:22px;height:22px;color:var(--text-3);}
.sec-h .n{font-weight:800;color:var(--text-3);font-size:.9rem;}
.sec-h .bank{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:900;color:var(--green);}
.sec-h .bank button{border:0;background:rgba(255,255,255,.08);color:var(--text-2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.8rem;}

/* Game rows: name first, easy to scan */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;}
@media (min-width:720px){.list{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (min-width:1280px){.list{grid-template-columns:repeat(3,minmax(0,1fr));}}
.g{--c:#ffc83d;position:relative;display:flex;align-items:stretch;border-radius:16px;background:var(--surface);transition:transform .15s var(--spring), background .15s, box-shadow .2s;}
.g:hover{background:var(--surface-2);}
.g{min-width:0;}
.g .go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:9px 4px 9px 9px;border:0;background:none;color:var(--text);text-align:left;border-radius:16px;}
.g .go:active{transform:scale(.98);}
.g .gicon{flex:none;width:48px;height:48px;transition:transform .35s var(--spring);}
.g .go:active .gicon{transform:scale(.9) rotate(-6deg);}
.g:hover .gicon{transform:rotate(-4deg) scale(1.05);}
.g .txt{flex:1;min-width:0;}
.g .txt b{display:block;font-size:1.06rem;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g .txt small{display:block;margin-top:2px;font-size:.84rem;font-weight:600;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g .meta{flex:none;display:flex;align-items:center;gap:4px;font-size:.8rem;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;}
.g .meta .ico{width:15px;height:15px;}
.g .live{flex:none;font-size:.7rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#03290f;background:var(--green);border-radius:999px;padding:3px 8px;}
.g .fav{flex:none;width:46px;border:0;background:none;color:var(--text-3);display:grid;place-items:center;border-radius:0 16px 16px 0;}
.g .fav .ico{width:20px;height:20px;transition:transform .3s var(--spring);}
.g .fav:active .ico{transform:scale(1.4);}
.g .fav.on{color:var(--yellow);}
.g .fav.on .ico{fill:currentColor;}
.g.spot{background:var(--surface-3);box-shadow:0 0 0 3px var(--yellow);transform:scale(1.02);}

/* Continue rail */
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 8px;}
.rail::-webkit-scrollbar{display:none;}
.cont .gicon{width:44px;height:44px;flex:none;}
.cont{--c:#ffc83d;flex:none;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:var(--r);
  background:var(--surface);min-width:200px;box-shadow:var(--shadow-sm);}
.cont:active{transform:scale(.97);}
.cont .t{font-weight:800;}
.cont .d{font-size:.8rem;color:var(--text-3);font-weight:700;}
.cont .go{margin-left:auto;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--green);color:#03290f;}
.cont .go .ico{width:14px;height:14px;}

.empty{display:none;text-align:center;padding:50px 20px;color:var(--text-2);}
.empty .e{font-size:3rem;margin-bottom:8px;}
.empty.show{display:block;}
.foot{text-align:center;color:var(--text-3);font-size:.8rem;font-weight:700;margin-top:36px;}

/* Mode chooser */
.pick{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
.pick button{display:flex;align-items:center;gap:14px;padding:16px;border:0;border-radius:var(--r-lg);text-align:left;color:var(--text);
  background:var(--surface-2);box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .1s, box-shadow .1s;}
.pick button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
.pick .e{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.08);color:var(--text-2);flex:none;}
.pick .e .ico{width:24px;height:24px;}
.pick .t{font-weight:900;font-size:1.1rem;}
.pick .d{color:var(--text-2);font-size:.9rem;}

/* Mode chooser header */
.pick-h{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.pick-h .gicon{width:64px;height:64px;flex:none;}
.pick-h b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;}
.pick-h span{color:var(--text-2);font-size:.92rem;}

/* Account sheet */
.acct{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.acct .avatar{--c:var(--yellow);}
.acct .t{font-weight:900;font-size:1.15rem;}
.acct .d{color:var(--text-2);font-size:.9rem;}
</style>
</head>
<body>
<div class="home">
  <header class="top">
    <button class="logo" id="logo" type="button" aria-label="Game Night"></button>
    <div class="who">
      <div class="hi" id="hi">Hi there</div>
      <h1>Game Night</h1>
    </div>
    <button class="me" id="me" type="button" aria-label="Account">G</button>
  </header>

  <div class="filters" id="filters">
    <div class="srow">
      <div class="search" id="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Find a game" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Find a game">
        <button class="x" id="qx" type="button" aria-label="Clear search">✕</button>
      </div>
      <button class="btn btn-yellow surprise" id="surprise" type="button" aria-label="Surprise me: pick a random game"><span class="d" id="surprise-ic"></span><span class="lbl">Surprise</span></button>
    </div>
    <div class="chips" id="chips" role="tablist" aria-label="Categories"></div>
  </div>

  <section class="sec" id="cont-sec" hidden>
    <div class="sec-h"><h2>Keep playing</h2></div>
    <div class="rail" id="rail"></div>
  </section>

  <div id="list"></div>
  <div class="empty" id="empty">No games match that. Try another search.</div>
  <div class="foot">games.timbrown.xyz</div>
</div>

<script src="diag.js" defer></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var el = Kit.el;
  var LS = (function () { try { return localStorage; } catch (e) { return null; } })();
  function get(k, d) { try { var v = LS.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function set(k, v) { try { LS.setItem(k, v); } catch (e) {} }

  var state = { cat: get('gn_home_cat', 'all'), who: get('gn_home_who', 'any'), q: '' };

  // ── Favourites (hrefs like "games/hearts-ai.html", shared with sync) ──────
  function favList() { try { var a = JSON.parse(get('fav_games', '[]')); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function isFav(g) {
    var f = favList();
    return [g.play, g.score, g.id].some(function (k) { return k && f.indexOf('games/' + k + '.html') >= 0; });
  }
  function toggleFav(g) {
    var f = favList(), keys = [g.play, g.score, g.id].filter(Boolean).map(function (k) { return 'games/' + k + '.html'; });
    var on = isFav(g);
    f = f.filter(function (h) { return keys.indexOf(h) < 0; });
    if (!on) f.push('games/' + g.play + '.html');
    set('fav_games', JSON.stringify(f)); set('fav_games_updated_at', String(Date.now()));
    try { if (window.FGHSync && FGHSync.noteWrite) FGHSync.noteWrite('fav_games'); } catch (e) {}
    return !on;
  }

  // ── Filtering ─────────────────────────────────────────────────────────────
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function fitsWho(g) {
    if (state.who === 'any') return true;
    var n = +state.who, max = g.max === 0 ? 99 : g.max;
    if (n === 3) return max >= 3;
    return g.min <= n && max >= n;
  }
  function fitsQ(g) {
    if (!state.q) return true;
    var hay = norm(g.name + ' ' + g.tag + ' ' + g.cat);
    return norm(state.q).split(/\s+/).every(function (t) { return hay.indexOf(t) >= 0; });
  }
  function visibleGames() { return GAMES.filter(function (g) { return fitsWho(g) && fitsQ(g); }); }

  // ── Game rows ─────────────────────────────────────────────────────────────
  var resumeMap = {};
  try { resumeMap = JSON.parse(get('gn_resume', '{}')) || {}; } catch (e) {}
  function players(g) { return g.max === 0 ? g.min + '+' : g.min === g.max ? String(g.min) : g.min + '–' + g.max; }
  function row(g) {
    var fav = isFav(g);
    var r = el('div', { class: 'g', 'data-id': g.id, style: { '--c': g.color } });
    var go = el('button', { type: 'button', class: 'go', 'aria-label': g.name + '. ' + g.tag + '. ' + players(g) + ' players' }, [
      el('span', { html: GameIcon(g.id), style: { display: 'contents' } }),
      el('span', { class: 'txt' }, [el('b', { text: g.name }), el('small', { text: g.tag })]),
      resumeMap[g.id] ? el('span', { class: 'live', text: 'Resume' }) : el('span', { class: 'meta', html: Kit.icon(g.max === 1 ? 'user' : 'users') + '<span>' + players(g) + '</span>' })
    ]);
    go.addEventListener('click', function () { launch(g); });
    var star = el('button', { type: 'button', class: 'fav' + (fav ? ' on' : ''), 'aria-label': fav ? 'Remove ' + g.name + ' from favorites' : 'Add ' + g.name + ' to favorites', 'aria-pressed': String(fav), html: Kit.icon('star') });
    star.addEventListener('click', function () {
      var on = toggleFav(g); Kit.haptic('success'); Kit.sfx(on ? 'good' : 'tap');
      Kit.toast(on ? g.name + ' added to favorites' : g.name + ' removed from favorites');
      render();
    });
    r.appendChild(go); r.appendChild(star);
    return r;
  }

  // ── Launch (with "phone or real game?" for games that have a scorekeeper) ─
  function go(file) { Kit.sfx('pop'); location.href = 'games/' + file + '.html'; }
  function launch(g) {
    Kit.haptic('light');
    if (!g.score) return go(g.play);
    Kit.sfx('pop');
    var box = el('div', { class: 'pick' });
    var s;
    function opt(e, t, d, file) {
      box.appendChild(el('button', { type: 'button', onclick: function () { s.close(); go(file); } }, [
        el('span', { class: 'e', html: Kit.icon(e) }), el('span', null, [el('div', { class: 't', text: t }), el('div', { class: 'd', text: d })])
      ]));
    }
    opt('phone', 'Play on this phone', 'You against computer players', g.play);
    opt('pencil', 'Keep score', 'Playing with real cards? Track the points here', g.score);
    box.insertBefore(el('div', { class: 'pick-h', html: GameIcon(g.id) + '<div><b>' + Kit.esc(g.name) + '</b><span>' + Kit.esc(g.tag) + '</span></div>' }), box.firstChild);
    s = Kit.sheet({ node: box });
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function renderChips() {
    var vis = visibleGames(), favCount = vis.filter(isFav).length;
    var items = [{ id: 'all', label: 'All', n: vis.length }];
    if (favCount) items.push({ id: 'fav', label: 'Favorites', n: favCount });
    GAME_CATS.forEach(function (c) {
      var n = vis.filter(function (g) { return g.cat === c.id; }).length;
      if (n) items.push({ id: c.id, label: c.name, n: n });
    });
    if (!items.some(function (i) { return i.id === state.cat; })) state.cat = 'all';
    var box = $('chips'); box.innerHTML = '';
    box.appendChild(whoChip());
    box.appendChild(el('span', { class: 'sep' }));
    items.forEach(function (i) {
      var b = el('button', { type: 'button', class: 'chip' + (i.id === state.cat ? ' on' : ''), role: 'tab', 'aria-selected': String(i.id === state.cat) },
        [el('span', { text: i.label }), el('span', { class: 'n', text: String(i.n) })]);
      b.addEventListener('click', function () {
        state.cat = i.id; set('gn_home_cat', i.id); Kit.sfx('tap'); render();
        var f = $('filters'); if (window.scrollY > f.offsetTop) window.scrollTo({ top: f.offsetTop, behavior: 'smooth' });
      });
      box.appendChild(b);
    });
    var on = box.querySelector('.on'); if (on) on.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  }

  function section(title, ic, games, extra) {
    var s = el('section', { class: 'sec' });
    var h = el('div', { class: 'sec-h' }, [el('span', { html: Kit.icon(ic) }), el('h2', { text: title }), el('span', { class: 'n', text: String(games.length) })]);
    if (extra) h.appendChild(extra);
    s.appendChild(h);
    var list = el('div', { class: 'list' });
    games.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (g) { list.appendChild(row(g)); });
    s.appendChild(list);
    return s;
  }
  function bankBadge() {
    var b = parseInt(get('casino_bank', '1000'), 10) || 1000;
    var box = el('span', { class: 'bank', text: '$' + b.toLocaleString() });
    if (b !== 1000) box.appendChild(el('button', {
      type: 'button', text: 'Reset', onclick: function () {
        Kit.confirm('Reset your casino bankroll to $1,000?', { ok: 'Reset' }).then(function (ok) {
          if (!ok) return;
          set('casino_bank', '1000'); try { if (window.FGHSync) FGHSync.noteWrite('casino_bank'); } catch (e) {}
          render();
        });
      }
    }));
    return box;
  }

  function renderRail() {
    try { resumeMap = JSON.parse(get('gn_resume', '{}')) || {}; } catch (e) {}
    var week = Date.now() - 7 * 864e5;
    var items = Object.keys(resumeMap).map(function (id) { return { g: findGame(id), r: resumeMap[id] }; })
      .filter(function (x) { return x.g && x.r && x.r.ts > week; })
      .sort(function (a, b) { return b.r.ts - a.r.ts; });
    var rail = $('rail'); rail.innerHTML = '';
    items.forEach(function (x) {
      var a = el('a', { class: 'cont', href: 'games/' + (x.r.file || x.g.play) + '.html', style: { '--c': x.g.color } }, [
        el('span', { html: GameIcon(x.g.id), style: { display: 'contents' } }),
        el('span', null, [el('div', { class: 't', text: x.g.name }), el('div', { class: 'd', text: (x.r.label || 'In progress') + ' · ' + ago(x.r.ts) })]),
        el('span', { class: 'go', html: Kit.icon('play') })
      ]);
      rail.appendChild(a);
    });
    $('cont-sec').hidden = !items.length || !!state.q || state.cat !== 'all';
  }
  function ago(ts) {
    var s = (Date.now() - ts) / 1000;
    return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago';
  }

  function render() {
    renderChips();
    renderRail();
    var list = $('list'); list.innerHTML = '';
    var vis = visibleGames();
    if (state.cat === 'all') {
      var favs = vis.filter(isFav);
      if (favs.length && !state.q) list.appendChild(section('Favorites', 'star', favs));
      GAME_CATS.forEach(function (c) {
        var gs = vis.filter(function (g) { return g.cat === c.id; });
        if (gs.length) list.appendChild(section(c.name, c.id, gs, c.id === 'casino' ? bankBadge() : null));
      });
    } else if (state.cat === 'fav') {
      list.appendChild(section('Favorites', 'star', vis.filter(isFav)));
    } else {
      var c = GAME_CATS.filter(function (x) { return x.id === state.cat; })[0];
      list.appendChild(section(c.name, c.id, vis.filter(function (g) { return g.cat === c.id; }), c.id === 'casino' ? bankBadge() : null));
    }
    $('empty').classList.toggle('show', !vis.length);
  }

  // ── Controls ──────────────────────────────────────────────────────────────
  var q = $('q');
  q.addEventListener('input', function () { state.q = q.value.trim(); $('search').classList.toggle('has-q', !!state.q); render(); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
    if (e.key === 'Enter') { var v = visibleGames(); if (v.length === 1) launch(v[0]); q.blur(); }
  });
  $('qx').addEventListener('click', function () { q.value = ''; q.dispatchEvent(new Event('input')); q.focus(); });
  var WHO = [['any', 'Any number', 'users'], ['1', 'Just me', 'user'], ['2', 'Two of us', 'users'], ['3', 'Three or more', 'users']];
  function whoChip() {
    var cur = WHO.filter(function (w) { return w[0] === state.who; })[0] || WHO[0];
    var b = el('button', { type: 'button', class: 'chip who' + (state.who !== 'any' ? ' set' : ''), 'aria-label': 'Players: ' + cur[1] },
      [el('span', { html: Kit.icon(cur[2]) }), el('span', { text: state.who === 'any' ? 'Players' : cur[1] }), el('span', { html: Kit.icon('down') })]);
    b.addEventListener('click', function () {
      Kit.sfx('pop');
      var box = el('div', { class: 'pick' }), s;
      WHO.forEach(function (w) {
        box.appendChild(el('button', { type: 'button', onclick: function () {
          state.who = w[0]; set('gn_home_who', state.who); s.close(); Kit.sfx('tap'); render();
        } }, [el('span', { class: 'e', html: Kit.icon(w[0] === state.who ? 'check' : w[2]) }), el('span', null, [el('div', { class: 't', text: w[1] })])]));
      });
      s = Kit.sheet({ title: "How many are playing?", node: box });
    });
    return b;
  }

  // Surprise me: shuffle a spotlight across the visible tiles, then launch one
  var spinning = false;
  $('surprise').addEventListener('click', function () {
    if (spinning) return;
    var tiles = Array.prototype.slice.call(document.querySelectorAll('#list .g'));
    if (!tiles.length) return;
    spinning = true;
    var pick = tiles[Math.floor(Math.random() * tiles.length)];
    var steps = 14, i = 0, prev = null;
    (function hop() {
      if (prev) prev.classList.remove('spot');
      var t = i < steps ? tiles[Math.floor(Math.random() * tiles.length)] : pick;
      t.classList.add('spot'); prev = t; Kit.sfx('tick'); Kit.haptic('tick');
      if (i === steps) {
        t.scrollIntoView({ block: 'center', behavior: 'smooth' });
        Kit.sfx('good');
        setTimeout(function () { t.classList.remove('spot'); spinning = false; launch(findGame(t.dataset.id)); }, 700);
        return;
      }
      i++; setTimeout(hop, 60 + i * 12);
    })();
  });
  $('logo').innerHTML = Kit.icon('dice'); $('surprise-ic').innerHTML = Kit.icon('shuffle');
  $('logo').addEventListener('click', function () { Kit.sfx('pop'); Kit.confetti({ count: 60 }); });

  // ── Greeting + account ────────────────────────────────────────────────────
  var mode = window.FGHSync ? FGHSync.mode() : 'guest';
  function initials(s) {
    var w = String(s || '').trim().split(/\s+/).filter(function (x) { return x && !/^(family|fam|crew|team|house|household)$/i.test(x); });
    if (!w.length) return '#';
    return (w[0][0] + (w[1] ? w[1][0] : '')).toUpperCase();
  }
  function refreshWho() {
    var h = new Date().getHours();
    var greet = h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    var lbl = mode === 'pin' && window.FGHSync ? FGHSync.label() : '';
    $('hi').textContent = greet + (lbl ? ', ' + lbl : '');
    $('me').textContent = mode === 'pin' ? initials(lbl) : 'G';
  }
  refreshWho();
  if (mode === 'pin' && window.FGHSync) {
    $('me').classList.add('syncdot');
    if (FGHSync.onStatusChange) FGHSync.onStatusChange(function (s) { $('me').className = 'me syncdot s-' + s.state; });
    if (FGHSync.onReady) FGHSync.onReady(function () { refreshWho(); render(); });
  }
  $('me').addEventListener('click', function () {
    Kit.sfx('pop');
    var lbl = mode === 'pin' ? (FGHSync.label() || '') : '';
    var node = el('div');
    node.appendChild(el('div', { class: 'acct' }, [
      el('span', { class: 'avatar lg', text: $('me').textContent }),
      el('div', null, [
        el('div', { class: 't', text: mode === 'pin' ? (lbl || 'Your family') : 'Guest' }),
        el('div', { class: 'd', text: mode === 'pin' ? 'PIN ' + FGHSync.pin() + ' · scores sync across devices' : 'Scores stay on this device' })
      ])
    ]));
    var s;
    if (mode === 'pin') {
      var inp = el('input', { class: 'input', maxlength: 24, placeholder: 'Name, e.g. Brown Family', value: lbl, autocomplete: 'off' });
      node.appendChild(el('div', { class: 'label', text: 'Name on the home screen' }));
      node.appendChild(el('div', { class: 'row' }, [inp, el('button', {
        type: 'button', class: 'btn btn-primary btn-sm', text: 'Save', onclick: function () {
          if (FGHSync.setLabel) FGHSync.setLabel(inp.value.trim());
          refreshWho(); Kit.toast('Saved'); s.close();
        }
      })]));
    }
    var list = el('div', { class: 'k-list', style: { 'margin-top': '14px' } });
    function item(ic, t, fn, cls) { list.appendChild(el('button', { type: 'button', class: cls || '', onclick: function () { s.close(); fn(); } }, [el('span', { class: 'ic', html: Kit.icon(ic) }), el('span', { text: t })])); }
    item('users', 'Manage players', function () { Kit.managePlayers(); });
    item(get('gn_sound', '1') === '1' ? 'sound' : 'mute', 'Sound: ' + (get('gn_sound', '1') === '1' ? 'on' : 'off'), function () {
      set('gn_sound', get('gn_sound', '1') === '1' ? '0' : '1'); Kit.sfx('good');
    });
    if (mode === 'pin') {
      item('sync', 'Sync now', function () { if (FGHSync.syncNow) FGHSync.syncNow(); Kit.toast('Syncing…'); });
      item('pulse', 'Sync diagnostics', function () { window.openSyncDiagnostics && openSyncDiagnostics(); });
    }
    item('logout', mode === 'pin' ? 'Sign out' : 'Sign in with a PIN', function () {
      if (FGHSync.signOut) FGHSync.signOut(); location.replace('./gate.html');
    }, mode === 'pin' ? 'danger' : '');
    node.appendChild(list);
    s = Kit.sheet({ node: node, actions: [{ label: 'Done', cls: 'btn-ghost' }] });
  });

  document.addEventListener('fghsync:updated', function () { render(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) render(); });
  render();
})();
</script>
</body>
</html>

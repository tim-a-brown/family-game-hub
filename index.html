<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="theme-color" content="#141029">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.png">
<title>Game Night</title>
<link rel="stylesheet" href="kit.css">
<script src="sync.js"></script>
<script src="games.js"></script>
<script src="game-icons.js"></script>
<script src="kit.js"></script>
<script src="players.js"></script>
<script src="hist.js"></script>
<script src="casino.js"></script>
<script src="spin.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/service-worker.js').then(function (r) { try { r.update(); } catch (e) {} }).catch(function () {});
  });
}
// Not signed in yet (no PIN, no guest choice): send to the gate first.
if (typeof FGHSync !== 'undefined' && !FGHSync.mode()) location.replace('./gate.html');
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && window.FGHSync && FGHSync.syncNow) FGHSync.syncNow();
});
</script>
<style>
.home{max-width:1240px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 40px);}

/* Top */
.top{display:flex;align-items:center;gap:12px;}
.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;color:#2b1a00;border:0;
  background:linear-gradient(135deg,var(--yellow),var(--orange));box-shadow:inset 0 -4px 0 rgba(0,0,0,.18), 0 8px 22px rgba(255,138,61,.35);
  transform:rotate(-6deg);transition:transform .4s var(--spring);}
.logo:active{transform:rotate(20deg) scale(.9);}
.top .who{flex:1;min-width:0;}
.top .hi{font-size:.9rem;font-weight:800;color:var(--yellow);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top h1{font-size:1.75rem;font-weight:900;}
.logo .ico{width:28px;height:28px;}
.me{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;flex:none;
  background:var(--surface-3);color:var(--text);font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
.me:active{transform:scale(.9);}
.me{position:relative;padding:0 0 3px;line-height:1;}   /* the letter sits on the circle's middle, above its bottom shade */
.me.has-av{overflow:hidden;}
.me.has-av .av-img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;}
.me.has-av.syncdot{overflow:visible;}
.me.has-av .av-img{clip-path:circle(50%);}
.me.has-av .ico{width:56%;height:56%;}
.acct-name{width:100%;border:0;background:none;color:var(--text);font:inherit;font-weight:900;font-size:1.35rem;padding:4px 0;border-bottom:1.5px dashed rgba(255,255,255,.18);border-radius:0;outline:none;}
.acct-name:focus{border-bottom-color:var(--yellow);}
.acct-name::placeholder{color:var(--text-3);}
.acct-d{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--text-2);font-size:.86rem;}
.acct-d span{min-width:0;}
.syncdot{position:relative;}
.syncdot::after{content:"";position:absolute;right:1px;top:1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--text-3);}
.syncdot.s-synced::after{background:var(--green);}
.syncdot.s-syncing::after{background:var(--yellow);animation:pulse 1s infinite;}
.syncdot.s-offline::after{background:var(--text-3);}
.syncdot.s-error::after{background:var(--red);}

/* Search row with the Surprise button */
.srow{display:flex;gap:10px;align-items:center;}
.srow .search{flex:1;min-width:0;}
.surprise{min-height:48px;padding:0 16px;border-radius:999px;font-size:1rem;}
.surprise .d{display:inline-flex;transition:transform .5s var(--spring);}
.surprise .d .ico{width:20px;height:20px;}
.surprise:active .d{transform:rotate(180deg);}
@media (max-width:360px){.surprise .lbl{display:none;}}

/* Search + filters (sticky) */
.filters{position:sticky;top:0;z-index:20;margin:calc(10px - var(--safe-t)) -16px 0;pointer-events:none;padding:calc(var(--safe-t) + 8px) 16px 10px;background:transparent;transition:background-color .2s, box-shadow .2s;}
@media (min-width:1272px){.filters{border-radius:0 0 20px 20px;}}
/* On phones all the category chips wrap into several rows; too tall to pin, so they scroll with the page */
@media (max-width:719px){.filters{position:relative;}}
.filters>*{pointer-events:auto;}
.search{position:relative;}
.search svg{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
.search .input{padding-left:46px;padding-right:44px;min-height:48px;border-radius:999px;}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:var(--text-2);font-weight:900;display:none;}
.search.has-q .x{display:block;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0 0 2px;}
.chips .chip{--cc:var(--text-2);min-height:32px;padding:0 11px 0 9px;gap:6px;font-size:.84rem;
  background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 35%,transparent);}
.chips .chip .ico{width:15px;height:15px;color:var(--cc);}
.chips .chip.on{background:var(--cc);color:#fff;box-shadow:none;}
.chips .chip.on .ico{color:#fff;}
.chips .chip.on .n{opacity:.8;}
.chips .chip.all{--cc:#ffffff;}
.chips .chip.all.on{color:var(--bg);}
.chips .chip.all.on .ico{color:var(--bg);}
.chips .chip.fav{--cc:var(--yellow);}
.chips .chip.fav.on{color:#2b1a00;}
.chips .chip.fav.on .ico{color:#2b1a00;}
.chips .chip.who{--cc:var(--blue);}
.chips::-webkit-scrollbar{display:none;}
.chip .ico{width:16px;height:16px;}
.chip.who{background:color-mix(in srgb,var(--blue) 22%,transparent);color:var(--text);}
.chip.who.set{background:var(--blue);color:#03182f;}
.chips .sep{flex:none;width:1px;margin:8px 2px;background:var(--line-2);}

/* Section headings */
.sec{margin-top:22px;}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px;}
.sec-h h2{font-size:1.25rem;}
.sec-h .ico{width:22px;height:22px;color:var(--text-3);}
.sec-h .n{font-weight:800;color:var(--text-3);font-size:.9rem;}
.sec-h .bank{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:900;color:var(--green);}
.sec-h .bank .bank-amt{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--green);font:inherit;font-weight:900;padding:4px 2px;cursor:pointer;}
.sec-h .bank .bank-amt .ico{width:16px;height:16px;}
.sec-h .bank button:not(.bank-amt){border:0;background:rgba(255,255,255,.08);color:var(--text-2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.8rem;}

/* Game rows: name first, easy to scan */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;}
@media (min-width:720px){.list{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (min-width:1280px){.list{grid-template-columns:repeat(3,minmax(0,1fr));}}
.g{--c:#ffc83d;position:relative;display:flex;align-items:stretch;border-radius:16px;background:var(--surface);transition:transform .15s var(--spring), background .15s, box-shadow .2s;}
.g:hover{background:var(--surface-2);}
.g{min-width:0;}
.g .go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:9px 4px 9px 9px;border:0;background:none;color:var(--text);text-align:left;border-radius:16px;}
.g .go:active{transform:scale(.98);}
.g .gicon{flex:none;width:48px;height:48px;transition:transform .35s var(--spring);}
.g .go:active .gicon{transform:scale(.9) rotate(-6deg);}
.g:hover .gicon{transform:rotate(-4deg) scale(1.05);}
.g .txt{flex:1;min-width:0;}
@font-face{font-family:'Bungee';src:url('fonts/bungee.woff2') format('woff2');font-display:swap;}
/* game names: Bungee, arcade-sign caps */
.g .txt b{display:block;font-family:'Bungee',var(--display);font-weight:400;letter-spacing:0;font-size:1.12rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g .txt small{display:block;margin-top:2px;font-size:.84rem;font-weight:600;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g .meta{flex:none;display:flex;align-items:center;gap:4px;font-size:.8rem;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;}
.g .meta .ico{width:15px;height:15px;}
.g .live{flex:none;font-size:.7rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#03290f;background:var(--green);border-radius:999px;padding:3px 8px;}
.g .fav{flex:none;width:46px;border:0;background:none;color:var(--text-3);display:grid;place-items:center;border-radius:0 16px 16px 0;}
.g .fav .ico{width:20px;height:20px;transition:transform .3s var(--spring);}
.g .fav:active .ico{transform:scale(1.4);}
.g .fav.on{color:var(--yellow);}
.g .fav.on .ico{fill:currentColor;}
.g.spot{background:var(--surface-3);box-shadow:0 0 0 3px var(--yellow);transform:scale(1.02);}

/* Tile view (default): compact cards, icon on top, name and players below */
.vbtn{flex:none;width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text-2);}
.vbtn .ico{width:20px;height:20px;}
.vbtn:active{transform:scale(.9);}
.list.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
@media (min-width:560px){.list.tiles{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media (min-width:720px){.list.tiles{grid-template-columns:repeat(5,minmax(0,1fr));}}
@media (min-width:900px){.list.tiles{grid-template-columns:repeat(6,minmax(0,1fr));}}
@media (min-width:1080px){.list.tiles{grid-template-columns:repeat(7,minmax(0,1fr));}}
@media (min-width:1300px){.list.tiles{grid-template-columns:repeat(8,minmax(0,1fr));}}
.tiles .g{display:block;aspect-ratio:1/1;border-radius:18px;overflow:hidden;isolation:isolate;
  /* dark in the middle, shading out to a frame in the game's colour */
  background:radial-gradient(75% 75% at 50% 55%,#130e28 0%,#130e28 32%,color-mix(in srgb,var(--c) 38%,#130e28) 62%,var(--c) 92%,color-mix(in srgb,var(--c) 80%,#fff) 100%);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 75%,#fff), inset 0 0 0 4px color-mix(in srgb,var(--c) 70%,#000), 0 4px 0 rgba(0,0,0,.28), 0 10px 22px -10px rgba(0,0,0,.6);}
.tiles .g:hover{filter:brightness(1.07);}
.tiles .g .go{position:absolute;inset:0;display:block;padding:0;border-radius:18px;}
/* The game's icon sits big in the middle of the tile, the name across the top, players and the favourite star along the foot */
.tiles .g .gicon{position:absolute;left:1%;top:6%;width:98%;height:98%;z-index:-1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));transition:transform .35s var(--spring);}
@media (max-width:559px){.tiles .g .gicon{left:6%;top:12%;width:88%;height:88%;}}
.tiles .g.wrap2 .gicon{left:9%;top:18%;width:82%;height:82%;}
@media (max-width:559px){.tiles .g.wrap2 .gicon{left:11%;top:22%;width:78%;height:78%;}}
.tiles .g:hover .gicon{transform:scale(1.04) rotate(-1.5deg);}
.tiles .g .go:active .gicon{transform:scale(.96);}
/* shade in from the top-left and bottom-left corners, under the name and the player count */
.tiles .g .go::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(95% 46% at 0% 0%,rgba(14,10,30,.9) 0%,rgba(14,10,30,.68) 40%,rgba(14,10,30,0) 100%),
    radial-gradient(78% 38% at 0% 100%,rgba(14,10,30,.95) 0%,rgba(14,10,30,.78) 42%,rgba(14,10,30,0) 100%);}
.tiles .g .txt{position:absolute;left:10px;right:8px;top:9px;bottom:9px;z-index:1;display:flex;flex-direction:column;justify-content:space-between;gap:3px;}
.tiles .g .txt b{font-size:1.02rem;line-height:1.08;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.tiles .g .txt small{display:none;}
.tiles .g .txt b.long{font-size:.9rem;letter-spacing:0;}
.tiles .g .txt b.two{font-size:.96rem;}
.tiles .g .meta{color:rgba(255,255,255,.78);font-size:.74rem;}
.tiles .g .meta .ico{width:13px;height:13px;}
.tiles .g .live{font-size:.6rem;padding:2px 7px;align-self:flex-start;}
.tiles .g .meta{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);}
.tiles .g .fav{position:absolute;bottom:0;right:0;z-index:2;width:40px;height:40px;border-radius:50%;color:#fff;}
.tiles .g .fav .ico{width:18px;height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
.tiles .g .fav:not(.on){opacity:.6;}
.tiles .g .fav.on{color:var(--yellow);}
.tiles .g.spot{transform:scale(1.04);}

/* Favorites: its own shelf, set apart from the category sections */
.sec.favs{margin-top:18px;padding:14px 12px 14px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,200,61,.12),rgba(255,200,61,.03));
  box-shadow:inset 0 0 0 1px rgba(255,200,61,.28);}
.sec.favs .sec-h h2{color:var(--yellow);}
.sec.favs .sec-h .ico{color:var(--yellow);fill:var(--yellow);}
.sec.favs + .sec{margin-top:28px;}
/* Arranging favorites: the tiles wiggle; drag one to a new spot; Done (or a tap outside) ends it */
.sec.favs .wig-done{display:none;margin-left:auto;border:0;border-radius:999px;padding:6px 14px;background:var(--yellow);color:#2b1a00;font-weight:900;font-size:.85rem;cursor:pointer;}
.sec.favs.wiggle .wig-done{display:inline-block;}
.sec.favs.wiggle .list > .g{animation:wig .26s ease-in-out infinite alternate;animation-delay:var(--wd,0ms);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;}
.sec.favs.wiggle .list > .g.lift{animation:none;z-index:5;transform:scale(1.08);box-shadow:0 12px 28px rgba(0,0,0,.5);cursor:grabbing;}
.sec.favs .list > .g{-webkit-touch-callout:none;}
@keyframes wig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@media (prefers-reduced-motion:reduce){.sec.favs.wiggle .list > .g{animation:none;outline:2px dashed rgba(255,200,61,.6);outline-offset:-2px;}}

/* Keep playing: compact overview, 5-6 games visible at once */
.cont-w{position:relative;min-width:0;display:flex;align-items:stretch;touch-action:pan-y;--rv:0;}
/* The tile narrows (it doesn't slide off) so its icon and name stay put and tidy */
.cont-w .cont{position:relative;z-index:1;flex:none;touch-action:pan-y;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;width:calc(100% - var(--rv) * 1px);
  transition:width .32s var(--spring), box-shadow .25s;will-change:width;}
.cont-w.drag .cont{transition:none;}
.cont-w.open .cont{box-shadow:inset 3px 0 0 var(--c), 0 0 0 1px rgba(255,255,255,.08);}
.cont-w .cont .a{transition:opacity .2s;}
/* Opening: the icon tucks away and the name gets the room, so nothing is squeezed */
.cont-w .cont .gicon{transition:width .32s var(--spring), margin .32s var(--spring), opacity .2s;}
.cont-w.open .cont{gap:0;padding-left:12px;}
.cont-w.open .cont .gicon{width:0;opacity:0;margin-right:0;}
.cont-w.open .cont .r1 .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:.88rem;line-height:1.15;}
.cont-w.open .cont .d{display:none;}
.cont-w.open .cont .a{display:none;}
.cont-w.open .cont .a,.cont-w.drag .cont .a{opacity:0;}
/* Trash: a rounded red button that grows into the freed space */
.cont-del{position:absolute;top:0;right:0;bottom:0;width:52px;border:0;border-radius:14px;padding:0;display:grid;place-items:center;
  background:linear-gradient(180deg,#ff5a6b,#e0243c);color:#fff;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 6px 16px -6px rgba(224,36,60,.7);
  opacity:min(1, calc(var(--rv) / 40));transform:scale(calc(.55 + .45 * min(1, var(--rv) / 60)));transform-origin:right center;
  transition:opacity .25s, transform .32s var(--spring);pointer-events:none;}
.cont-w.drag .cont-del{transition:none;}
.cont-w.open .cont-del{pointer-events:auto;}
.cont-del:active{transform:scale(.92);}
.cont-del .ico{width:22px;height:22px;}
.rail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
@media (min-width:720px){.rail{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (min-width:1100px){.rail{grid-template-columns:repeat(4,minmax(0,1fr));}}
.cont{--c:#ffc83d;position:relative;min-width:0;width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px 8px 8px;border-radius:14px;
  background:var(--surface);color:var(--text);text-decoration:none;box-shadow:inset 3px 0 0 var(--c);transition:transform .15s var(--spring), background .15s;}
.cont:hover{background:var(--surface-2);}
.cont:active{transform:scale(.97);}
.cont .gicon{width:34px;height:34px;flex:none;}
.cont .tx{flex:1;min-width:0;}
.cont .t{font-weight:800;font-size:.95rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cont .r1{display:flex;align-items:baseline;gap:6px;}
.cont .r1 .t{flex:1;min-width:0;}
.cont .a{flex:none;font-size:.7rem;font-weight:800;color:var(--text-3);}
.cont .d{font-size:.75rem;color:var(--text-2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rail-more{grid-column:1/-1;justify-self:center;border:0;background:none;color:var(--text-2);font-weight:800;font-size:.85rem;padding:6px 12px;}

.empty{display:none;text-align:center;padding:50px 20px;color:var(--text-2);}
.empty .e{font-size:3rem;margin-bottom:8px;}
.empty.show{display:block;}
.foot{text-align:center;color:var(--text-3);font-size:.8rem;font-weight:700;margin-top:36px;}

/* Mode chooser */
.pick{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
.pick button{display:flex;align-items:center;gap:14px;padding:16px;border:0;border-radius:var(--r-lg);text-align:left;color:var(--text);
  background:var(--surface-2);box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .1s, box-shadow .1s;}
.pick button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
.pick-note{margin:2px 4px 0;font-size:.82rem;line-height:1.35;}
.pick button.resume{box-shadow:inset 0 0 0 2px var(--yellow);}
.pick button.resume .e{background:var(--yellow);color:#16102e;}
.pick .e{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.08);color:var(--text-2);flex:none;}
.pick .e .ico{width:24px;height:24px;}
.pick .t{font-weight:900;font-size:1.1rem;}
.pick .d{color:var(--text-2);font-size:.9rem;}

/* Mode chooser header */
.pick-h{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.pick-h .gicon{width:64px;height:64px;flex:none;}
.pick-h b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;}
.pick-h span{color:var(--text-2);font-size:.92rem;}

/* Recent games */
.recent{display:flex;flex-direction:column;gap:6px;}
.rg{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-radius:var(--r);background:rgba(255,255,255,.06);color:var(--text);text-align:left;}
.rg:active{transform:scale(.98);}
.rg .gicon{width:42px;height:42px;flex:none;}
.rg .grow{display:flex;flex-direction:column;min-width:0;}
.rg b{font-weight:900;}
.rg .w{font-size:.9rem;font-weight:700;color:var(--yellow);}
.rg small{font-size:.78rem;color:var(--text-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rg .when{flex:none;font-size:.78rem;font-weight:800;color:var(--text-3);}

/* Account sheet */
.acct{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.acct .avatar{--c:var(--yellow);}
.acct .t{font-weight:900;font-size:1.15rem;}
.acct .d{color:var(--text-2);font-size:.9rem;}
</style>
</head>
<body>
<div class="home">
  <header class="top">
    <button class="logo" id="logo" type="button" aria-label="Game Night"></button>
    <div class="who">
      <div class="hi" id="hi">Hi there</div>
      <h1>Game Night</h1>
    </div>
    <button class="vbtn" id="view" type="button"></button>
    <button class="me" id="me" type="button" aria-label="Account">G</button>

  function bankBadge() {

    function close() { base = 0; setX(0); w.classList.remove('open'); del.tabIndex = -1; if (openTile === close) openTile = null; }
    tile.addEventListener('pointerdown', function (e) {
      if (e.button) return;
      active = true; horiz = null; moved = false; x0 = e.clientX; y0 = e.clientY; dx = 0;
    });
    tile.addEventListener('pointermove', function (e) {
      if (!active) return;
      var mx = e.clientX - x0, my = e.clientY - y0;
      if (horiz === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
        horiz = Math.abs(mx) > Math.abs(my);
        if (horiz) { w.classList.add('drag'); try { tile.setPointerCapture(e.pointerId); } catch (er) {} }
      }
      if (!horiz) return;
      moved = true; dx = mx;
      var v = base + dx; if (v < -REVEAL) v = -REVEAL - (-REVEAL - v) * .25; setX(Math.min(0, v));
    });
    function end() {
      if (!active) return; active = false; w.classList.remove('drag');
      if (!horiz) return;
      if (base + dx < -REVEAL / 2) open(); else close();
    }
    tile.addEventListener('pointerup', end);
    tile.addEventListener('pointercancel', end);
    // A swipe (or tapping an open tile) shouldn't launch the game
    tile.addEventListener('click', function (e) {
      if (moved || w.classList.contains('open')) { e.preventDefault(); if (!moved) close(); moved = false; }
      else if (openTile) { e.preventDefault(); openTile(); }
    });
    // Desktop: right-click offers the same delete
    tile.addEventListener('contextmenu', function (e) { e.preventDefault(); open(); });
    return w;
  }
  document.addEventListener('pointerdown', function (e) { if (openTile && !e.target.closest('.cont-w.open')) openTile(); }, true);

  var railAll = false;
  function renderRail() {
    try { resumeMap = JSON.parse(get('gn_resume', '{}')) || {}; } catch (e) {}
    var week = Date.now() - 7 * 864e5;
    var items = Object.keys(resumeMap).map(function (id) { return { g: findGame(id), r: resumeMap[id] }; })
      .filter(function (x) { return x.g && x.r && x.r.ts > week; })
      .sort(function (a, b) { return b.r.ts - a.r.ts; });
    var rail = $('rail'); rail.innerHTML = '';
    var shown = railAll || items.length <= 6 ? items : items.slice(0, 6);
    shown.forEach(function (x) {
      rail.appendChild(swipeTile(x, el('a', { class: 'cont', href: 'games/' + (x.r.file || x.g.play) + '.html', style: { '--c': x.g.color }, title: x.g.name }, [
        el('span', { html: GameIcon(x.g.id), style: { display: 'contents' } }),
        el('span', { class: 'tx' }, [el('div', { class: 'r1' }, [el('div', { class: 't', text: x.g.name }), el('span', { class: 'a', text: ago(x.r.ts, true) })]), el('div', { class: 'd', text: x.r.label || 'In progress' })])
      ])));
    });
    if (shown.length < items.length) {
      var more = el('button', { class: 'rail-more', type: 'button', text: 'Show all ' + items.length });
      more.addEventListener('click', function () { railAll = true; renderRail(); });
      rail.appendChild(more);
    }
    $('cont-n').textContent = items.length > 1 ? items.length + ' going' : '';
    $('cont-sec').hidden = !items.length || !!state.q || state.cat !== 'all';
  }
  function ago(ts, short) {
    var s = (Date.now() - ts) / 1000;
    if (short) return s < 60 ? 'now' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd';
    return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago';
  }

  function render() {
    renderChips();
    renderRail();
    var list = $('list'); list.innerHTML = '';
    var vis = visibleGames();
    if (state.cat === 'all') {
      var favs = vis.filter(isFav);
      if (favs.length && !state.q) list.appendChild(section('Favorites', 'star', favs, null, true));
      GAME_CATS.forEach(function (c) {
        var gs = vis.filter(function (g) { return g.cat === c.id; });
        if (gs.length) list.appendChild(section(c.name, c.id, gs, c.id === 'casino' ? bankBadge() : null));
      });
    } else if (state.cat === 'fav') {
      list.appendChild(section('Favorites', 'star', vis.filter(isFav), null, true));
    } else {
      var c = GAME_CATS.filter(function (x) { return x.id === state.cat; })[0];
      list.appendChild(section(c.name, c.id, vis.filter(function (g) { return g.cat === c.id; }), c.id === 'casino' ? bankBadge() : null));
    }
    $('empty').classList.toggle('show', !vis.length);
    markWraps();
  }
  // Tiles whose name runs to two lines: the icon steps down and in so the name stays on the shade, clear of the art.
  // (Also fits over-wide names.)
  function markWraps() {
    document.querySelectorAll('.tiles .g').forEach(function (g) {
      var b = g.querySelector('.txt b'); if (!b) return;
      // a name too wide for the tile, or longer than two lines (Bungee is broad): shrink it just enough to fit, never below 70%
      b.style.fontSize = '';
      var fs0 = parseFloat(getComputedStyle(b).fontSize), fs = fs0;
      while ((b.scrollWidth > b.clientWidth || b.scrollHeight > b.clientHeight + 2) && fs > fs0 * .7) { fs -= .5; b.style.fontSize = fs + 'px'; }
      if (fs < fs0) b.style.fontSize = (fs - .5) + 'px';   // a hair of room, so high-density screens don't clip the last letter
      var lh = parseFloat(getComputedStyle(b).lineHeight) || 16;
      g.classList.toggle('wrap2', b.offsetHeight > lh * 1.4);
    });
  }
  var wrapT = 0;
  window.addEventListener('resize', function () { clearTimeout(wrapT); wrapT = setTimeout(markWraps, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(markWraps);

  // ── Controls ──────────────────────────────────────────────────────────────
  function paintView() {
    $('view').innerHTML = Kit.icon(tiles ? 'rows' : 'tiles');
    $('view').setAttribute('aria-label', tiles ? 'Show as a list' : 'Show as tiles');
  }
  paintView();
  $('view').addEventListener('click', function () {
    tiles = !tiles; set('gn_home_view', tiles ? 'tiles' : 'list'); Kit.sfx('tap'); Kit.haptic('light'); paintView(); render();
  });
  var q = $('q');
  q.addEventListener('input', function () { state.q = q.value.trim(); $('search').classList.toggle('has-q', !!state.q); render(); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
    if (e.key === 'Enter') { var v = visibleGames(); if (v.length === 1) launch(v[0]); q.blur(); }
  });
  $('qx').addEventListener('click', function () { q.value = ''; q.dispatchEvent(new Event('input')); q.focus(); });
  var WHO = [['any', 'Any number', 'users'], ['1', 'Just me', 'user'], ['2', 'Two of us', 'users'], ['3', 'Three or more', 'users']];
  function whoChip() {
    var cur = WHO.filter(function (w) { return w[0] === state.who; })[0] || WHO[0];
    var b = el('button', { type: 'button', class: 'chip who' + (state.who !== 'any' ? ' set' : ''), 'aria-label': 'Players: ' + cur[1] },
      [el('span', { html: Kit.icon(cur[2]) }), el('span', { text: state.who === 'any' ? 'Players' : cur[1] }), el('span', { html: Kit.icon('down') })]);
    b.addEventListener('click', function () {
      Kit.sfx('pop');
      var box = el('div', { class: 'pick' }), s;
      WHO.forEach(function (w) {
        box.appendChild(el('button', { type: 'button', onclick: function () {
          state.who = w[0]; set('gn_home_who', state.who); s.close(); Kit.sfx('tap'); render();
        } }, [el('span', { class: 'e', html: Kit.icon(w[0] === state.who ? 'check' : w[2]) }), el('span', null, [el('div', { class: 't', text: w[1] })])]));
      });
      s = Kit.sheet({ title: "How many are playing?", node: box });
    });
    return b;
  }

  // Games with a save from the last week, as shown in Keep playing: id -> file to open
  function goingGames() {
    var m = {}, week = Date.now() - 7 * 864e5, map = {};
    try { map = JSON.parse(get('gn_resume', '{}')) || {}; } catch (e) {}
    Object.keys(map).forEach(function (id) { var g = findGame(id), r = map[id]; if (g && r && r.ts > week) m[id] = r.file || g.play; });
    return m;
  }
  // Surprise: a raffle wheel of games, with its own filters (spin.js)
  $('surprise').addEventListener('click', function () { Kit.sfx('pop'); Kit.haptic('light'); Spin.open({ launch: launch, isFav: isFav, going: goingGames }); });
  $('logo').innerHTML = Kit.icon('dice'); $('surprise-ic').innerHTML = Kit.icon('shuffle');
  $('logo').addEventListener('click', function () { Kit.sfx('pop'); Kit.confetti({ count: 60 }); });

  // ── Greeting + account ────────────────────────────────────────────────────
  var mode = window.FGHSync ? FGHSync.mode() : 'guest';
  function initials(s) {
    var w = String(s || '').trim().split(/\s+/).filter(function (x) { return x && !/^(family|fam|crew|team|house|household)$/i.test(x); });
    if (!w.length) return '#';
    return (w[0][0] + (w[1] ? w[1][0] : '')).toUpperCase();
  }
  function refreshWho() {
    var h = new Date().getHours();
    var greet = h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    var lbl = mode === 'pin' && window.FGHSync ? FGHSync.label() : '';
    var who = (typeof FrequentPlayers !== 'undefined' && FrequentPlayers.myName ? FrequentPlayers.myName() : '') || lbl;
    $('hi').textContent = greet + (who ? ', ' + who : '');
    // your avatar (by your name) when you've set one; otherwise the account's initials
    var mn = typeof FrequentPlayers !== 'undefined' && FrequentPlayers.myName ? FrequentPlayers.myName() : null, me = $('me');
    if (mn && Kit.avatar && Kit.avatar.has(mn)) {
      me.innerHTML = Kit.avatar.html(mn); me.classList.add('has-av');
      me.style.background = Kit.avatar.color(mn) || '#000'; me.style.color = Kit.avatar.color(mn) ? '#16102e' : '';
    } else {
      me.textContent = mode === 'pin' ? initials(lbl) : 'G'; me.classList.remove('has-av'); me.style.background = ''; me.style.color = '';
    }
  }
  window.addEventListener('kit-avatar', refreshWho);
  // games someone recorded with you, waiting for your OK: a one-time nudge per visit
  var pendNoted = false;
  window.addEventListener('fghlinks', function (e) {
    var n = e.detail && e.detail.pending || 0;
    if (n && !pendNoted) { pendNoted = true; Kit.toast(n + (n === 1 ? ' game' : ' games') + ' to review. Tap your avatar.'); }
  });
  refreshWho();
  if (mode === 'pin' && window.FGHSync) {
    $('me').classList.add('syncdot');
    if (FGHSync.onStatusChange) FGHSync.onStatusChange(function (s) { var hv = $('me').classList.contains('has-av'); $('me').className = 'me syncdot s-' + s.state + (hv ? ' has-av' : ''); });
    if (FGHSync.onReady) FGHSync.onReady(function () { refreshWho(); render(); });
  }
  $('me').addEventListener('click', function () {
    Kit.sfx('pop');
    var lbl = mode === 'pin' ? (FGHSync.label() || '') : '';
    var node = el('div'), s;
    // One header: you (avatar + name, both editable here), with the account underneath
    var mn = typeof FrequentPlayers !== 'undefined' && FrequentPlayers.myName ? FrequentPlayers.myName() : '';
    var myIn = el('input', { class: 'acct-name', maxlength: 14, placeholder: 'Your name', value: mn || '', autocomplete: 'off', 'aria-label': 'Your name' });
    function saveName() { var v = myIn.value.trim(); if (v && v !== mn && FrequentPlayers.setMyName) { FrequentPlayers.setMyName(v); mn = v; refreshWho(); } return v; }
    myIn.addEventListener('change', saveName);
    myIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') myIn.blur(); });
    function editMine() { var v = saveName() || mn; if (!v) { Kit.toast('Type your name first'); myIn.focus(); return; } s.close(); Kit.avatar.edit(v, refreshWho); }
    var acct = el('div', { class: 'acct-d' }, [el('span', { text: mode === 'pin' ? 'PIN ' + FGHSync.pin() + ' · your account, on all your devices' : 'Guest · scores stay on this device' })]);
    node.appendChild(el('div', { class: 'acct' }, [
      el('button', { type: 'button', class: 'av-btn', 'aria-label': 'Change your avatar', onclick: editMine }, [Kit.avatar.el(mn || '?', 'lg', 'var(--surface-3)')]),
      el('div', { class: 'grow', style: { 'min-width': '0' } }, [myIn, acct])
    ]));
    var list = el('div', { class: 'k-list', style: { 'margin-top': '14px' } });
    function item(ic, t, fn, cls) { list.appendChild(el('button', { type: 'button', class: cls || '', onclick: function () { s.close(); fn(); } }, [el('span', { class: 'ic', html: Kit.icon(ic) }), el('span', { text: t })])); }
    var nPend = window.FGHSync && FGHSync.linkPending ? FGHSync.linkPending().length : 0;
    if (nPend) item('inbox', nPend + (nPend === 1 ? ' game' : ' games') + ' to review', function () { Kit.links.review(refreshWho); }, 'hl');
    item('history', 'Game history', function () { location.href = 'games/history.html'; });
    if (mode === 'pin') item('link', 'Share my profile', function () { Kit.links.profile(); });
    item('users', 'Frequent players', function () { Kit.managePlayers(); });
    item(get('gn_sound', '1') === '1' ? 'sound' : 'mute', 'Sound: ' + (get('gn_sound', '1') === '1' ? 'on' : 'off'), function () {
      set('gn_sound', get('gn_sound', '1') === '1' ? '0' : '1'); Kit.sfx('good');
    });
    if (mode === 'pin') {
      item('sync', 'Sync now', function () { if (FGHSync.syncNow) FGHSync.syncNow(); Kit.toast('Syncing…'); });
      item('pulse', 'Sync diagnostics', function () { window.openSyncDiagnostics && openSyncDiagnostics(); });
    }
    item('logout', mode === 'pin' ? 'Sign out' : 'Sign in with a PIN', function () {
      if (FGHSync.signOut) FGHSync.signOut(); location.replace('./gate.html');
    }, mode === 'pin' ? 'danger' : '');
    node.appendChild(list);
    s = Kit.sheet({ node: node, actions: [{ label: 'Done', cls: 'btn-ghost' }] });
  });

  // ── Recent games: the last 10 finished games across every game ───────────
  // History keys (gh_<key>) that don't match a game id directly.
  var GH_GAME = { sol: 'solitaire', fc: 'freecell', ht: 'hearts', sp: 'spades', gin: 'gin-rummy', rm: 'gin-rummy', eu: 'euchre',
    wz: 'wizard', f7: 'flip7', fivecrwns: 'five-crowns', rk: 'rook', p10: 'phase10', mg: 'minigolf', dond: 'dealornodeal',
    wof: 'wheeloffortune', c4: 'connectfour', cs_sc: 'scorecard', sc: 'scorecard', mj4: 'mahjong4' };
  // Synced gh_ keys that aren't game results: the casino bankroll ledger (bets and top-ups) and a one-time cleanup flag
  var GH_SKIP = { casino_ledger: 1, dedup_v1: 1 };
  function recentGames() {
    var rows = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i); if (!k || k.indexOf('gh_') !== 0) continue;
        var key = k.slice(3); if (GH_SKIP[key]) continue;
        var g = findGame(GH_GAME[key] || key);
        var list = JSON.parse(localStorage.getItem(k) || '[]');
        if (!Array.isArray(list)) continue;
        list.forEach(function (e) { if (e && e._date) rows.push({ key: key, g: g, e: e }); });
      }
    } catch (e) {}
    rows.sort(function (a, b) { return b.e._date - a.e._date; });
    rows = rows.slice(0, 10);
    var box = el('div', { class: 'recent' }), s;
    if (!rows.length) box.appendChild(el('p', { class: 'muted', text: 'No finished games yet. Results show up here after each game.' }));
    rows.forEach(function (r) {
      var e = r.e, g = r.g, name = g ? g.name : r.key;
      var line = e.winner ? e.winner + ' won' : (e._summary || 'Finished');
      var who = Array.isArray(e.players) ? e.players.map(function (p) { return (p.name || p) + (p.score != null ? ' ' + p.score : ''); }).join(' · ') : '';
      var b = el('button', { type: 'button', class: 'rg' }, [
        el('span', { html: g ? GameIcon(g.id) : '', style: { display: 'contents' } }),
        el('span', { class: 'grow' }, [el('b', { text: name }), el('span', { class: 'w', text: line }), who && who !== line ? el('small', { text: who }) : null]),
        el('span', { class: 'when', text: ago(e._date) })
      ]);
      b.addEventListener('click', function () {
        s.close();
        Kit.sheet({ title: name, node: Kit.historyDetail(e), actions: [
          { label: 'All past ' + name + ' games', cls: 'btn-soft', onClick: function () { Kit.history(r.key, { title: name + ': past games' }); } },
          { label: 'Close', cls: 'btn-ghost' }] });
      });
      box.appendChild(b);
    });
    s = Kit.sheet({ title: 'Recent games', node: box, actions: [{ label: 'Done', cls: 'btn-soft' }] });
  }

  document.addEventListener('fghsync:updated', function () { render(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) render(); });
  render();
})();
</script>
</body>
</html>

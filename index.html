<script>
if ('serviceWorker' in navigator) {
  var swReg = null, hadSW = !!navigator.serviceWorker.controller, swReload = false;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/service-worker.js').then(function (r) { swReg = r; try { r.update(); } catch (e) {} }).catch(function () {});
  });
  // An app left open in the background keeps running the old code after a release. Coming back to it checks for
  // a new version, and a new one reloads the home screen (once nothing is open), so the fixes actually arrive.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && swReg) { try { swReg.update(); } catch (e) {} }
  });
  var swIdle = function () { return !document.querySelector('.k-scrim, .lkm') && !(document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)); };
  // (not while a game is opening: the reload would cancel it. That page loads the new version anyway.) The reload
  // starts at the top, so the pinned search bar isn't restored halfway down the page.
  var swLeaving = false;
  window.addEventListener('pagehide', function () { swLeaving = true; });
  window.addEventListener('pageshow', function () { swLeaving = false; });
  var swGo = function () { if (!swReload || swLeaving || window.__leaving) return; if (swIdle()) { swReload = false; try { window.scrollTo(0, 0); } catch (e) {} location.reload(); } };
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadSW) { hadSW = true; return; }   // first install: nothing old is running
    swReload = true; swGo();
  });
  window.addEventListener('kit-sheet-closed', function () { setTimeout(swGo, 400); });
}
// The tile view's look (Tim, 2026-11-15, chosen from six: "use the art up close, but i want the art even bigger"):
// each game is a tile of its own color with its art drawn large and tilted, running off the top right corner, and the
// name at the lower left on the color. The class keeps the look's rules apart from the list view's.
document.documentElement.classList.add('look');
try { localStorage.removeItem('gn_tile_look'); } catch (e) {}
try { localStorage.removeItem('gn_tile_emb'); } catch (e) {}   // (the textures' trial switch of 2026-11-16, gone)
// Not signed in yet (no PIN, no guest choice): send to the gate first.
if (typeof FGHSync !== 'undefined' && !FGHSync.mode()) location.replace('./gate.html');
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && window.FGHSync && FGHSync.syncNow) FGHSync.syncNow({ soft: true });
});
</script>
<style>
.home{max-width:1240px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 40px);}

/* Top */
.top{display:flex;align-items:center;gap:12px;}
.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;color:#2b1a00;border:0;overflow:hidden;
  background:linear-gradient(180deg,#171530,#0b0a1c);box-shadow:inset 0 0 0 1px var(--w08), 0 8px 22px rgba(20,16,41,.45);
  transform:rotate(-6deg);transition:transform .4s var(--spring);}
.logo svg,.lg-gs svg{width:100%;height:100%;display:block;}   /* (the mark fills its tile at every size, so it stays centered when a phone's tile is smaller than 48) */
.logo:active{transform:rotate(20deg) scale(.9);}
/* Arriving home: the tile bounces in, the mark spins once (with a little motion blur), and a glint catches it */
.logo-wrap{position:relative;flex:none;display:grid;}
.logo-wrap > *{grid-area:1 / 1;}
.logo-mover{display:grid;position:relative;z-index:1;transform-origin:50% 100%;}
/* motion blur: faint copies that follow the same path a moment behind, so the smear trails the movement */
.lg-gt{display:grid;pointer-events:none;transform-origin:50% 100%;opacity:0;}
.lg-gt .logo{box-shadow:none;}
.lg-gs{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;}
.lg-gs svg,.lg-gt{filter:blur(.6px);}   /* softens the copies into one streak */
.logo > svg{position:relative;z-index:1;}
.logo{position:relative;}
/* the glint: a soft streak of light across the tile as it settles, and one tiny star winking at its corner */
.logo::after{content:"";position:absolute;inset:-20%;pointer-events:none;opacity:0;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.5) 48%,rgba(255,255,255,.16) 54%,transparent 62%);transform:translateX(-70%);}
.logo.spin::after{animation:logoGlint .7s ease-out .6s both;}
@keyframes logoGlint{0%{opacity:1;transform:translateX(-70%)}100%{opacity:1;transform:translateX(70%)}}
.logo-fx{position:absolute;right:-3px;top:-3px;width:12px;height:12px;pointer-events:none;z-index:2;color:#fff;opacity:0;filter:drop-shadow(0 0 3px rgba(255,255,255,.9));}
.logo-fx svg{width:100%;height:100%;display:block;fill:currentColor;}
.logo-fx.on{animation:logoWink .6s ease-out .85s both;}
@keyframes logoWink{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.1) rotate(45deg)}100%{opacity:0;transform:scale(0) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.logo.spin::after,.logo-fx.on{animation:none;}.logo-fx,.lg-gt,.lg-gs{display:none;}}
.top .who{flex:1;min-width:0;}
.top .hi{font-size:.9rem;font-weight:800;color:var(--yellow);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top h1{font-size:1.75rem;font-weight:900;}
.logo .ico{width:28px;height:28px;}
.me{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;flex:none;
  background:var(--surface-3);color:var(--text);font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
.me:active{transform:scale(.9);}
.me{position:relative;padding:0 0 3px;line-height:1;}   /* the letter sits on the circle's middle, above its bottom shade */
.me.has-av{overflow:hidden;}
.me.has-av .av-img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;}
.me.has-av.syncdot{overflow:visible;}
.me.has-av .av-img{clip-path:circle(50%);}
.me.has-av .ico{width:56%;height:56%;}
.acct-name{width:100%;border:0;background:none;color:var(--text);font:inherit;font-weight:900;font-size:1.35rem;padding:4px 0;border-bottom:1.5px dashed var(--w18);border-radius:0;outline:none;}
.acct-name:focus{border-bottom-color:var(--yellow);}
/* a small pencil at the end of your name: it can be changed right here (hidden while typing) */
.acct-nm{position:relative;display:block;cursor:text;}
.acct-nm .acct-name{padding-right:28px;}
.acct-pen{position:absolute;right:2px;top:50%;width:18px;height:18px;margin-top:-10px;color:var(--text-3);opacity:.75;pointer-events:none;transition:opacity .2s;}
.acct-pen svg{width:100%;height:100%;}
.acct-name:focus + .acct-pen{opacity:0;}
.acct-name::placeholder{color:var(--text-3);}
.acct-d{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--text-2);font-size:.86rem;}
.acct-d span{min-width:0;}
/* a link request waiting: gold dot on your avatar, banner under the header */
.me.attn::before{content:"";position:absolute;left:-3px;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--yellow);border:2px solid var(--bg);box-shadow:0 0 0 0 color-mix(in srgb,var(--yellow) 60%,transparent);animation:attn 1.6s ease-out infinite;z-index:2;}
@keyframes attn{70%{box-shadow:0 0 0 9px color-mix(in srgb,var(--yellow) 0%,transparent);}100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--yellow) 0%,transparent);}}
.lk-banner{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:9px 10px 9px 12px;border:0;border-radius:16px;text-align:left;color:var(--text);
  background:color-mix(in srgb,var(--yellow) 16%,var(--surface));box-shadow:inset 0 0 0 2px var(--yellow);}
.lk-banner .grow{flex:1;min-width:0;display:flex;flex-direction:column;}
.lk-banner b{font-weight:900;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lk-banner small{font-size:.8rem;font-weight:700;color:var(--text-2);}
.lk-banner .lk-rev{flex:none;padding:8px 14px;border-radius:999px;background:var(--yellow);color:#1a1200;font-weight:900;font-size:.86rem;}
.syncdot{position:relative;}
.syncdot::after{content:"";position:absolute;right:1px;top:1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--text-3);}
.syncdot.s-synced::after{background:var(--green);}
.syncdot.s-syncing::after{background:var(--yellow);animation:pulse 1s infinite;}
.syncdot.s-offline::after{background:var(--text-3);}
.syncdot.s-error::after{background:var(--red);}

.pin-ch{display:flex;flex-direction:column;gap:10px;}
.pin-ch .pin-in{letter-spacing:.5em;font-size:1.4rem;text-align:center;font-weight:900;}
.pin-ch .pin-in:placeholder-shown{letter-spacing:normal;font-size:1rem;font-weight:700;}
.pin-msg{min-height:1.3em;font-size:.88rem;font-weight:700;color:var(--text-2);margin:0;}
.pin-msg.err{color:var(--red);}
/* Move to Google sign-in: your PIN flowing into your Google account, what happens, then each step ticking off */
.mv-box{display:flex;flex-direction:column;gap:14px;}
.mv-flow{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 10px;border-radius:18px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px var(--w08);}
.mv-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:96px;height:78px;padding:0 12px;border-radius:16px;transition:opacity .4s,transform .4s var(--spring),filter .4s;}
.mv-tile small{font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);}
.mv-pin{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--yellow);}
.mv-pin b{font-family:var(--display);font-weight:400;font-size:1.7rem;letter-spacing:.14em;line-height:1;}
.mv-g{position:relative;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25);}
.mv-g svg{width:30px;height:30px;}
.mv-g small{color:#5f6368;}
.mv-g .ok{position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;transform:scale(0);transition:transform .45s var(--spring);}
.mv-g .ok svg{width:16px;height:16px;}
.mv-arr{display:flex;gap:5px;}
.mv-arr i{width:7px;height:7px;border-radius:50%;background:var(--text-3);opacity:.5;}
.mv-box.run .mv-arr i{animation:mvDot 1s ease-in-out infinite;background:var(--yellow);}
.mv-box.run .mv-arr i:nth-child(2){animation-delay:.15s;} .mv-box.run .mv-arr i:nth-child(3){animation-delay:.3s;}
@keyframes mvDot{0%,100%{opacity:.25;transform:translateX(-3px);}50%{opacity:1;transform:translateX(3px);}}
.mv-box.done .mv-pin{opacity:.35;transform:scale(.9);filter:grayscale(1);}
.mv-box.done .mv-pin b{text-decoration:line-through;text-decoration-thickness:2px;}
.mv-box.done .mv-g{transform:scale(1.08);}
.mv-box.done .mv-g .ok{transform:scale(1);}
.mv-what,.mv-steps{display:flex;flex-direction:column;gap:6px;}
.mv-row{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:14px;background:var(--w05);}
.mv-row .ic{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--w1);color:var(--text-2);}
.mv-row .ic svg{width:18px;height:18px;}
.mv-row b{display:block;font-size:.92rem;}
.mv-row span{display:block;font-size:.8rem;font-weight:700;color:var(--text-3);line-height:1.3;}
.mv-step{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;font-weight:800;font-size:.9rem;color:var(--text-3);transition:background .3s,color .3s;}
.mv-step .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--w1);}
.mv-step .dot svg{width:14px;height:14px;opacity:0;}
.mv-step.on{color:var(--text);background:var(--w05);}
.mv-step.on .dot{box-shadow:none;border:2px solid var(--yellow);border-top-color:transparent;animation:mvSpin .9s linear infinite;}
.mv-step.done{color:var(--text-2);}
.mv-step.done .dot{background:var(--green);box-shadow:none;animation:none;color:#fff;}
.mv-step.done .dot svg{opacity:1;}
@keyframes mvSpin{to{transform:rotate(360deg);}}
.mv-msg{min-height:1.2em;font-weight:800;font-size:.88rem;color:var(--text-2);text-align:center;}
.mv-msg.err{color:var(--red);}
.mv-acts{display:flex;flex-direction:column;gap:8px;}
.mv-go{gap:10px;background:#fff;color:#1f1f1f;box-shadow:0 2px 0 rgba(0,0,0,.25),inset 0 0 0 1px #dadce0;}
.mv-go svg{width:20px;height:20px;}
.acct-g{display:inline-flex;align-items:center;gap:6px;min-width:0;}
.acct-g svg{width:15px;height:15px;flex:none;}
.acct-g span{min-width:0;overflow-wrap:anywhere;}
@media (prefers-reduced-motion:reduce){.mv-box.run .mv-arr i,.mv-step.on .dot{animation:none;}}
.pin-big{font-family:var(--display);font-size:1.3em;letter-spacing:.12em;color:var(--text);}

/* Search row with the Surprise button */
.srow{display:flex;gap:10px;align-items:center;}
.srow .search{flex:1;min-width:0;}
.surprise{min-height:48px;padding:0 16px;border-radius:999px;font-size:1rem;}
.surprise .d{display:inline-flex;transition:transform .5s var(--spring);}
.surprise .d .ico{width:20px;height:20px;}
.surprise:active .d{transform:rotate(180deg);}
@media (max-width:360px){.surprise .lbl{display:none;}}

/* Search + Surprise on top; the category chips, with the Daily puzzles button beside them under Surprise */
.filters{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:start;}
.filters .srow{display:contents;}
.filters .search{grid-column:1;grid-row:2;}
.filters .surprise{grid-column:2;grid-row:2;}
.filters .chips{grid-column:1;grid-row:3;}
.dlbtn{grid-column:2;grid-row:3;align-self:stretch;margin-top:10px;margin-bottom:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:74px;padding:8px 10px;
  border:0;border-radius:20px;cursor:pointer;color:var(--text);font:inherit;text-align:center;
  background:color-mix(in srgb,var(--blue,#3b82f6) 13%,var(--bg));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--blue,#3b82f6) 40%,transparent),0 3px 0 color-mix(in srgb,var(--blue,#3b82f6) 30%,transparent);transition:transform .12s var(--spring);}
.dlbtn:active{transform:translateY(2px) scale(.98);}
.dlbtn .ico{width:24px;height:24px;color:var(--blue,#3b82f6);}
.dlbtn b{font-weight:900;font-size:.95rem;line-height:1.1;}
.dlbtn .ct{font-weight:800;font-size:.78rem;color:var(--text-2);font-variant-numeric:tabular-nums;}
.dlbtn .bar{width:80%;height:6px;border-radius:3px;background:color-mix(in srgb,var(--blue,#3b82f6) 18%,transparent);overflow:hidden;}
.dlbtn .bar i{display:block;height:100%;border-radius:3px;background:var(--blue,#3b82f6);transition:width .5s var(--spring);}
.dlbtn.all-done{background:color-mix(in srgb,var(--green) 15%,var(--bg));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--green) 45%,transparent),0 3px 0 color-mix(in srgb,var(--green) 30%,transparent);}
.dlbtn.all-done .ico,.dlbtn.all-done .bar i{color:var(--green);background-color:var(--green);}
.dlbtn.all-done .ico{background:none;}

/* Search + filters (sticky) */
.filters{position:sticky;top:0;z-index:20;margin:calc(10px - var(--safe-t)) -16px 0;pointer-events:none;padding:calc(var(--safe-t) + 8px) 16px 10px;background:transparent;transition:background-color .2s, box-shadow .2s;}
@media (min-width:1272px){.filters{border-radius:0 0 20px 20px;}}
/* On phones all the category chips wrap into several rows; too tall to pin, so they scroll with the page */
@media (max-width:719px){.filters{position:relative;}}
.filters>*{pointer-events:auto;}
.search{position:relative;}
.search svg{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
.search .input{padding-left:46px;padding-right:44px;min-height:48px;border-radius:999px;}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:var(--w1);color:var(--text-2);font-weight:900;display:none;}
.search.has-q .x{display:block;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0 0 2px;}
.chips .chip{--cc:var(--text-2);min-height:32px;padding:0 11px 0 9px;gap:6px;font-size:.84rem;
  background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 35%,transparent);}
.chips .chip .ico{width:15px;height:15px;color:var(--cc);}
.chips .chip.on{background:var(--cc);color:#fff;box-shadow:none;}
.chips .chip.on .ico{color:#fff;}
.chips .chip.all.on .ico{color:var(--bg);}
.chips .chip.on .n{opacity:.8;}
.chips .chip.all{--cc:var(--text);}
.chips .chip.all.on{color:var(--bg);}
.chips .chip.all.on .ico{color:var(--bg);}
.chips .chip.fav{--cc:var(--yellow);}
.chips .chip.fav.on{color:#2b1a00;}
.chips .chip.fav.on .ico{color:#2b1a00;}
.chips .chip.who{--cc:var(--blue);}
/* Phones: a narrower right column and compact chips, so two or three chips still fit on a row */
@media (max-width:520px){
  .surprise{padding:0 12px;font-size:.95rem;gap:6px;}
  .dlbtn{padding:8px 6px;}
  .chips{gap:5px;}
  .chips .chip{min-height:30px;padding:0 8px 0 7px;gap:4px;font-size:.78rem;}
  .chips .chip .ico{width:13px;height:13px;}
}
.chips::-webkit-scrollbar{display:none;}
.chip .ico{width:16px;height:16px;}
.chip.who{background:color-mix(in srgb,var(--blue) 22%,transparent);color:var(--text);}
.chip.who.set{background:var(--blue);color:#03182f;}
.chips .sep{flex:none;width:1px;margin:8px 2px;background:var(--line-2);}

/* Section headings */
.sec{margin-top:22px;}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px;}
.sec-h h2{font-size:1.25rem;}
.sec-h .ico{width:22px;height:22px;color:var(--text-3);}
.sec-h .n{font-weight:800;color:var(--text-3);font-size:.9rem;}
.sec-h .hs-link{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border:0;border-radius:999px;background:rgba(255,200,61,.14);color:var(--yellow);font:inherit;font-weight:800;font-size:.84rem;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,200,61,.3);}
.sec-h .hs-link .ico{width:16px;height:16px;color:var(--yellow);}
.sec-h .hs-link:active{transform:scale(.96);}
/* ── Console games: each tile is the cartridge, in its console's own plastic, its name underneath ── */
.tiles .g.ct{aspect-ratio:.8;background:none;box-shadow:none;overflow:visible;border-radius:0;isolation:isolate;}
.tiles .g.ct .go{border-radius:0;}
.tiles .g.ct .go::after{display:none;}
.ct-body{position:absolute;left:6%;right:6%;top:1%;height:76%;display:block;border-radius:5px 5px 8px 8px;
  background:linear-gradient(180deg,#b7b5b8,#8e8c8f 70%,#7d7b7e);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.25),0 6px 10px -4px rgba(0,0,0,.6),0 2px 0 rgba(0,0,0,.35);
  transition:transform .25s var(--spring);}
/* hover lifts the whole cartridge (Safari mis-draws a clip-path shape that's itself moving, or that gains a filter, so
   the body keeps still and no hover brightness) */
.tiles .g.ct .go{transition:transform .25s var(--spring);}
.tiles .g.ct:hover{filter:none;}
.tiles .g.ct:hover .go{transform:translateY(-4px);}
.tiles .g.ct .go:active,.tiles .g.ct.in .go{transform:translateY(4%) scale(.97);transition-duration:.12s;}
.ct-lab{position:absolute;left:6%;right:6%;top:5%;display:flex;flex-direction:column;border-radius:3px;overflow:hidden;background:#111;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);}
.ct-lab::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%,rgba(255,255,255,0) 70%,rgba(255,255,255,.06));}
.ct-win{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;}
.ct-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ct-plain{position:absolute;inset:0;display:grid;place-items:center;padding:6%;text-align:center;background:linear-gradient(160deg,#ffcf3a,#ff8a1e);}
.ct-plain b{font-family:var(--display);font-weight:400;font-size:.9rem;line-height:1.05;color:#1a1208;}
.ct-name{position:absolute;left:0;right:0;top:80%;max-height:2.3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  padding:0 2px;font-size:.74rem;font-weight:800;line-height:1.15;text-align:center;color:var(--text);}
.ct-grip{position:absolute;left:12%;right:12%;bottom:6%;height:14%;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 2px,rgba(255,255,255,.18) 2px 3px,transparent 3px 6px);}
.tiles .g.ct .fav{bottom:21%;right:4%;width:34px;height:34px;color:#3a393d;}
.tiles .g.ct .fav .ico{filter:none;width:16px;height:16px;}
.tiles .g.ct .fav.on{color:#ffb000;}
/* NES: the grey toaster cartridge, its label in a black frame, grooves along the bottom */
/* NES: the grey Game Pak, label on the right, the ridged grip down the left with the square finger notch at its top,
   an arrow under the label and the narrower connector tab along the bottom */
.tiles .g.ct-nes .go{filter:drop-shadow(0 5px 6px rgba(0,0,0,.45));}
.ct-nes .ct-body{border-radius:3px 3px 2px 2px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.2);
  clip-path:polygon(0 0,100% 0,100% 94%,95% 94%,95% 100%,5% 100%,5% 94%,0 94%);}
.ct-nes .ct-lab{left:26%;right:4%;top:4%;padding:3%;background:#151416;}
.ct-nes .ct-grip{left:4%;width:18%;right:auto;top:13%;bottom:9%;height:auto;
  background:repeating-linear-gradient(180deg,#8a888b 0 2px,#a9a7aa 2px 3px,#7c7a7d 3px 5px);box-shadow:inset 1px 0 0 rgba(0,0,0,.18),inset -1px 0 0 rgba(255,255,255,.25);}
.ct-arrow{position:absolute;left:61%;bottom:13%;width:0;height:0;margin-left:-5px;border:5px solid transparent;border-top:6px solid rgba(0,0,0,.28);border-bottom:0;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.35));}
.ct-brand{flex:none;display:flex;align-items:center;justify-content:center;padding:4% 0 3%;}
.ct-brand img{display:block;height:auto;}
.ct-nes .ct-brand{padding:4% 0 1%;}
.ct-nes .ct-brand img{width:30%;}
/* the NES finger notch: a square recess cut into the top edge above the grip, shaded inside, its walls catching the light */
.ct-scoop{position:absolute;left:4%;width:18%;top:0;height:11%;border-radius:0 0 2px 2px;
  background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.2));
  box-shadow:inset 2px 0 2px rgba(0,0,0,.35),inset -1px 0 0 rgba(255,255,255,.22),inset 0 -2px 2px rgba(0,0,0,.2),0 1px 0 rgba(255,255,255,.45);}
/* Super Nintendo (US): the squared grey cartridge, the segmented grip blocks down both sides with a screw at the
   bottom of each, the label in its dark surround and the long groove under it */
.ct-snes .ct-body{top:9%;height:68%;border-radius:4px;background:linear-gradient(180deg,#b6b3bc,#a19ea8 60%,#94919b);}
.ct-snes .ct-body::before,.ct-snes .ct-body::after{content:"";position:absolute;top:0;bottom:0;width:13%;
  background:radial-gradient(circle at 50% 92%,#55535a 0 1.6px,#d2cfd6 1.6px 2.6px,transparent 2.8px),
    repeating-linear-gradient(180deg,#c9c6cf 0 1px,#a8a5ae 1px calc(16.66% - 2px),#6f6c75 calc(16.66% - 2px) 16.66%);}
.ct-snes .ct-body::before{left:0;border-radius:4px 0 0 4px;box-shadow:inset -1.5px 0 0 #7b7881;}
.ct-snes .ct-body::after{right:0;border-radius:0 4px 4px 0;box-shadow:inset 1.5px 0 0 #7b7881;}
.ct-snes .ct-lab{left:15%;right:15%;top:5%;padding:2.5%;background:#1c1b20;}
.ct-snes .ct-brand{padding:3% 0 1%;justify-content:flex-end;padding-right:4%;}
.ct-snes .ct-brand img{width:36%;}
.ct-snes .ct-grip{left:22%;right:22%;bottom:8%;height:7%;border-radius:999px;
  background:linear-gradient(90deg,transparent 39.5%,rgba(0,0,0,.25) 39.5% 40.5%,transparent 40.5% 59.5%,rgba(0,0,0,.25) 59.5% 60.5%,transparent 60.5%),#8f8c96;
  box-shadow:inset 0 2px 2px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.45);}
/* Genesis: the black cartridge with its thick side rails, the label across the front, and the GENESIS band
   along the bottom of the label on black with its faint grid */
.ct-genesis .ct-body{top:5%;height:72%;border-radius:12% 12% 7% 7% / 10% 10% 6% 6%;background:linear-gradient(180deg,#2a2a2f,#151517 55%,#0c0c0d);
  box-shadow:inset 7px 0 0 rgba(0,0,0,.35),inset -7px 0 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.12),0 6px 10px -4px rgba(0,0,0,.7),0 2px 0 rgba(0,0,0,.45);}
.ct-genesis .ct-lab{left:11%;right:11%;top:5%;background:#000;}
.ct-genesis .ct-brand{padding:5% 0;background-color:#050505;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.1) 0 1px,transparent 1px 6px),repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 1px,transparent 1px 6px);}
.ct-genesis .ct-brand img{width:46%;}
.ct-genesis .ct-grip{display:none;}
.tiles .g.ct-genesis .fav{color:#8d8d96;}
/* Atari 2600: the black cartridge almost all label: white paper with the red ATARI 2600 logo, the game's name on
   the red band, the picture inset below it and the fine print along the bottom */
.ct-atari2600 .ct-body{top:3%;height:74%;border-radius:5px;background:linear-gradient(180deg,#232120,#121110);box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 6px 10px -4px rgba(0,0,0,.7),0 2px 0 rgba(0,0,0,.45);}
.ct-atari2600 .ct-grip{display:none;}
.ct-atari2600 .ct-lab{left:6%;right:6%;top:4%;bottom:4%;background:#efebe2;border-radius:2px;}
.ct-atari2600 .ct-brand{padding:5% 0 3%;}
.ct-atari2600 .ct-brand img{width:40%;}
/* the Atari band's lettering: Russo One, nudged so its capitals sit in the middle of the band */
:root{--atari-font:'Russo One';--atari-weight:400;--atari-scale:1;--atari-nudge:.025em;}
.ct-title{flex:none;display:flex;align-items:center;justify-content:center;padding:4px 6%;background:#c4232b;color:#fff;
  font-family:var(--atari-font,inherit);font-weight:var(--atari-weight,800);font-size:calc(.56rem * var(--atari-scale,1));line-height:1;}
.ct-title span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateY(var(--atari-nudge,0));}
.ct-atari2600 .ct-win{margin:4% 7% 0;}
.ct-print{flex:1;display:block;margin:4% 12% 4%;background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1px,transparent 1px 4px);opacity:.55;min-height:6px;}
.tiles .g.ct-atari2600 .fav{color:#8a857f;}
html[data-theme="light"] .tiles .g.ct,html[data-theme="parchment"] .tiles .g.ct{background:none;box-shadow:none;}
/* list view: the label as the game's icon */
.gicon.ct-ic{position:relative;display:block;border-radius:6px;overflow:hidden;background:#111;box-shadow:0 0 0 2px #8e8c8f;}
.gicon.ct-ic.ct-genesis,.gicon.ct-ic.ct-atari2600{box-shadow:0 0 0 2px #1d1d20;}
.gicon.ct-ic .ct-plain b{font-size:.5rem;}
/* Favorites: a console game's tile carries its cartridge, small, where the other tiles have their icon */
:root .tiles .g:not(.ct) .gicon.mini-ct{width:calc(var(--gi) * .62);height:calc(var(--gi) * .8);left:calc(var(--arth) / 2 - var(--gi) * .31);top:calc(50% - var(--gi) * .4);transform:rotate(-4deg);}
:root .tiles .g:not(.ct) .go:active .gicon.mini-ct{transform:scale(.9) rotate(-8deg);}
.mini-ct .ct-body{left:0;right:0;top:0;height:100%;}
.mini-ct.ct-snes .ct-body{top:6%;height:88%;}
.mini-ct .ct-title{font-size:.3rem;padding:2px 4%;}
.mini-ct .ct-plain b{font-size:.42rem;}
/* (a small cartridge: Atari's red title band is a plain band, the name being under it; a label with no picture sets the
   name in its window's own scale, so it is never cut off) */
.mini-ct .ct-title{font-size:0;padding:6% 0 0;}
.mini-ct .ct-title span{display:none;}
.mini-ct .ct-win{container-type:inline-size;}
.mini-ct .ct-plain{padding:5%;}
.mini-ct .ct-plain b{font-size:12cqw;line-height:1.05;}
.mini-ct .ct-arrow{border-width:3px;border-top-width:4px;margin-left:-3px;}
/* the Consoles header's sort switch, and the console dividers when sorted by console */
.sec-h .cs-head{margin-left:auto;display:flex;align-items:center;gap:8px;}
.sec-h .cs-head .hs-link{margin-left:0;padding:0 11px;}
@media (max-width:380px){.sec-h .cs-head .hs-link span{display:none;}.sec-h .cs-head .hs-link{padding:0 9px;}}
.cs-sort{display:inline-flex;padding:3px;border-radius:999px;background:var(--w06,rgba(255,255,255,.06));box-shadow:inset 0 0 0 1px var(--w10,rgba(255,255,255,.1));}
.cs-sort button{min-height:28px;padding:0 9px;border:0;border-radius:999px;background:none;color:var(--text-2);font:inherit;font-size:.8rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s;}
.cs-sort button.on{background:var(--text);color:var(--bg);}
.cs-div{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:8px 2px 0;}
.cs-div img{height:18px;width:auto;}
.cs-div span{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.cs-div::after{content:"";flex:1;height:1px;background:var(--w10,rgba(255,255,255,.1));}
.list:not(.tiles) .cs-div{margin:12px 6px 2px;}
.cs-edit .cs-h{display:flex;align-items:center;gap:8px;margin:10px 4px 6px;}
.cs-edit .cs-h h3{margin:0 !important;flex:1;}
.cs-edit .cs-n{white-space:nowrap;font-size:.78rem;font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums;}
.cs-edit .k-grp button.cs-all,.cs-edit .k-grp button.cs-shelf{width:auto;min-height:32px;padding:0 12px;border:0;border-radius:999px !important;background:var(--w08,rgba(255,255,255,.08));color:var(--text);font:inherit;font-size:.8rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;cursor:pointer;}
.cs-edit .k-grp button.cs-all{min-width:58px;}
.cs-edit .k-grp button.cs-all[hidden]{display:none;}
.cs-edit .k-grp button.cs-shelf .ico{width:15px;height:15px;}
.cs-edit .cs-h + button{border-top-left-radius:var(--r);border-top-right-radius:var(--r);}
.cs-edit .cs-none{margin:0 6px 4px;font-size:.88rem;color:var(--text-3);}
.sec-h .dl-link{background:color-mix(in srgb,var(--blue,#3b82f6) 16%,transparent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue,#3b82f6) 45%,transparent);}
.sec-h .dl-link .ico{color:var(--blue,#3b82f6);}
.sec-h .dl-link{white-space:nowrap;flex:none;}
.sec-h .dl-link i{font-style:normal;}
@media (max-width:430px){ .sec-h .dl-link i{display:none;} }
.sec-h .dl-link b{font-weight:900;font-variant-numeric:tabular-nums;color:var(--text-2);}
.sec-h .bank{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:900;color:var(--green);}
.sec-h .bank .bank-amt{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--green);font:inherit;font-weight:900;padding:4px 2px;cursor:pointer;}
.sec-h .bank .bank-amt .ico{width:16px;height:16px;}
.sec-h .bank .bank-br{display:inline-flex;align-items:center;gap:4px;border:0;background:rgba(255,200,61,.14);color:var(--yellow);font:inherit;font-weight:900;font-size:.86rem;padding:3px 9px 3px 7px;border-radius:999px;cursor:pointer;}
.sec-h .bank .bank-br .ico{width:17px;height:17px;}
.sec-h .bank .bank-br.bank-rg{background:color-mix(in srgb,var(--silver) 16%,transparent);color:var(--silver);}
:root{--silver:#dfe6ee;}
html[data-theme="light"],html[data-theme="parchment"]{--silver:#55606e;}
.br-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--w05);}
.br-row .br-ic{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,200,61,.16);color:var(--yellow);}
.br-row .br-ic .ico{width:22px;height:22px;}
.br-row .br-ic.rg{background:color-mix(in srgb,var(--silver) 16%,transparent);color:var(--silver);}
.br-row b{display:block;}
.br-row small{display:block;color:var(--text-3);font-weight:700;}
.sec-h .bank button:not(.bank-amt):not(.bank-br){border:0;background:var(--w08);color:var(--text-2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.8rem;}

/* Game rows: name first, easy to scan */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;}
@media (min-width:720px){.list{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (min-width:1280px){.list{grid-template-columns:repeat(3,minmax(0,1fr));}}
.g{--c:#ffc83d;position:relative;display:flex;align-items:stretch;border-radius:16px;background:var(--surface);transition:transform .15s var(--spring), background .15s, box-shadow .2s;}
.g:hover{background:var(--surface-2);}
.g{min-width:0;}
.g .go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:9px 4px 9px 9px;border:0;background:none;color:var(--text);text-align:left;border-radius:16px;}
.g .go:active{transform:scale(.98);}
.g .gicon{flex:none;width:48px;height:48px;transition:transform .35s var(--spring);}
.g .go:active .gicon{transform:scale(.9) rotate(-6deg);}
.g:hover .gicon{transform:rotate(-4deg) scale(1.05);}
.g .txt{flex:1;min-width:0;}
@font-face{font-family:'Bungee';src:url('fonts/bungee.woff2') format('woff2');font-display:swap;}
@font-face{font-family:'Russo One';src:url('fonts/russo-one.woff2') format('woff2');font-display:swap;}
/* game names: Bungee, arcade-sign caps */
.g .txt b{display:block;font-family:'Bungee',var(--display);font-weight:400;letter-spacing:0;font-size:1.12rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g .txt small{display:block;margin-top:2px;font-size:.84rem;font-weight:600;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g .meta{flex:none;display:flex;align-items:center;gap:4px;font-size:.8rem;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;}
.g .meta .ico{width:15px;height:15px;}
/* the Resume tag keeps its own bright green and dark ink in every theme, so it reads on any tile */
.g .live{flex:none;font-size:.7rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#03290f;background:#3ddc84;border-radius:999px;padding:3px 8px;box-shadow:0 1px 0 rgba(0,0,0,.18), inset 0 0 0 1px rgba(3,41,15,.18);}
.g .fav{flex:none;width:46px;border:0;background:none;color:var(--text-3);display:grid;place-items:center;border-radius:0 16px 16px 0;}
.g .fav .ico{width:20px;height:20px;transition:transform .3s var(--spring);}
.g .fav:active .ico{transform:scale(1.4);}
.g .fav.on{color:var(--yellow);}
.g .fav.on .ico{fill:currentColor;}
.g.spot{background:var(--surface-3);box-shadow:0 0 0 3px var(--yellow);transform:scale(1.02);}

/* Tile view (default): compact cards, icon on top, name and players below */
.vbtn{flex:none;width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text-2);}
.vbtn .ico{width:20px;height:20px;}
.vbtn:active{transform:scale(.9);}
.k-list button .k-st.bell-st{color:var(--yellow);font-weight:900;}
/* the bell: what came in lately, with the count of new ones (a gentle ring when one arrives) */
.bell{position:relative;}
.bell-n{position:absolute;top:-2px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;display:grid;place-items:center;
  background:var(--yellow);color:#2b1a00;font-size:.72rem;font-weight:900;box-shadow:0 0 0 2px var(--bg);font-variant-numeric:tabular-nums;}
.bell.ring .ico{animation:bellRing .9s ease-in-out;transform-origin:50% 10%;}
@keyframes bellRing{15%{transform:rotate(16deg);}30%{transform:rotate(-14deg);}45%{transform:rotate(10deg);}60%{transform:rotate(-6deg);}75%{transform:rotate(3deg);}}
@media (prefers-reduced-motion:reduce){.bell.ring .ico{animation:none;}}
@media (max-width:440px){.top{gap:6px;} .top .vbtn,.top .me{width:38px;height:38px;} .top .logo{width:38px;height:38px;} .top h1{font-size:clamp(1.05rem,calc((100vw - 214px) / 6.8),1.75rem);white-space:nowrap;}}
.list.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
@media (min-width:560px){.list.tiles{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media (min-width:720px){.list.tiles{grid-template-columns:repeat(5,minmax(0,1fr));}}
@media (min-width:900px){.list.tiles{grid-template-columns:repeat(6,minmax(0,1fr));}}
@media (min-width:1080px){.list.tiles{grid-template-columns:repeat(7,minmax(0,1fr));}}
@media (min-width:1300px){.list.tiles{grid-template-columns:repeat(8,minmax(0,1fr));}}
.tiles .g{display:block;aspect-ratio:1/1;border-radius:18px;overflow:hidden;isolation:isolate;
  /* dark in the middle, shading out to a frame in the game's colour; light themes use a pale tint of the colour and dark text */
  --core:var(--bg);--tile-ink:#fff;--tile-shade:14,10,30;--tile-ts:0 1px 3px rgba(0,0,0,.6);
  background:radial-gradient(75% 75% at 50% 55%,var(--core) 0%,var(--core) 32%,color-mix(in srgb,var(--c) 38%,var(--core)) 62%,var(--c) 92%,color-mix(in srgb,var(--c) 80%,#fff) 100%);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 75%,#fff), inset 0 0 0 4px color-mix(in srgb,var(--c) 70%,#000), 0 4px 0 rgba(0,0,0,.28), 0 10px 22px -10px rgba(0,0,0,.6);}
html[data-theme="light"] .tiles .g,html[data-theme="parchment"] .tiles .g{
  --core:color-mix(in srgb,var(--c) 16%,var(--bg-2));--tile-ink:#1b1733;--tile-shade:255,255,255;--tile-ts:0 1px 2px rgba(255,255,255,.9);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 75%,#fff), inset 0 0 0 4px color-mix(in srgb,var(--c) 80%,#000), 0 4px 0 color-mix(in srgb,var(--c) 60%,#000), 0 10px 22px -10px rgba(0,0,0,.35);}
.tiles .g:hover{filter:brightness(1.07);}
.tiles .g .go{position:absolute;inset:0;display:block;padding:0;border-radius:18px;}
/* The game's icon sits big in the middle of the tile, the name across the top, players and the favourite star along the foot */
.tiles .g .gicon{position:absolute;left:1%;top:6%;width:98%;height:98%;z-index:-1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));transition:transform .35s var(--spring);}
@media (max-width:559px){.tiles .g .gicon{left:6%;top:12%;width:88%;height:88%;}}
.tiles .g.wrap2 .gicon{left:9%;top:18%;width:82%;height:82%;}
@media (max-width:559px){.tiles .g.wrap2 .gicon{left:11%;top:22%;width:78%;height:78%;}}
.tiles .g:hover .gicon{transform:scale(1.04) rotate(-1.5deg);}
.tiles .g .go:active .gicon{transform:scale(.96);}
/* shade in from the top-left and bottom-left corners, under the name and the player count */
.tiles .g .go::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(95% 46% at 0% 0%,rgba(var(--tile-shade),.9) 0%,rgba(var(--tile-shade),.68) 40%,rgba(var(--tile-shade),0) 100%),
    radial-gradient(78% 38% at 0% 100%,rgba(var(--tile-shade),.95) 0%,rgba(var(--tile-shade),.78) 42%,rgba(var(--tile-shade),0) 100%);}
.tiles .g .txt{position:absolute;left:10px;right:8px;top:9px;bottom:9px;z-index:1;display:flex;flex-direction:column;justify-content:space-between;gap:3px;}
.tiles .g .txt b{font-size:1.02rem;line-height:1.08;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--tile-ink);text-shadow:var(--tile-ts);}
.tiles .g .txt small{display:none;}
.tiles .g .txt b.long{font-size:.9rem;letter-spacing:0;}
.tiles .g .txt b.two{font-size:.96rem;}
.tiles .g .meta{font-size:.74rem;}
.tiles .g .meta .ico{width:13px;height:13px;}
.tiles .g .live{font-size:.64rem;padding:3px 8px;align-self:flex-start;}
.tiles .g .meta{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;color:var(--tile-ink);text-shadow:var(--tile-ts);}
.tiles .g .fav{position:absolute;bottom:0;right:0;z-index:2;width:40px;height:40px;border-radius:50%;color:var(--tile-ink);}
.tiles .g .fav .ico{width:18px;height:18px;filter:drop-shadow(var(--tile-ts));}
.tiles .g .fav:not(.on){opacity:.6;}
.tiles .g .fav.on{color:var(--yellow);}
.tiles .g.spot{transform:scale(1.04);}

/* Favorites: its own shelf, set apart from the category sections */
.sec.favs{margin-top:18px;padding:14px 12px 14px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,200,61,.12),rgba(255,200,61,.03));
  box-shadow:inset 0 0 0 1px rgba(255,200,61,.28);}
.sec.favs .sec-h h2{color:var(--yellow);}
.sec.favs .sec-h .ico{color:var(--yellow);fill:var(--yellow);}
.sec.favs + .sec{margin-top:28px;}
/* Arranging a section (Favorites or any category but Consoles): the tiles wiggle; drag one to a new spot; Done (or a tap
   outside, Escape, or eight idle seconds) ends it. Each tile wears a mark at its top left: hide the game (a category) or
   take it out of Favorites. A category's hidden games stand in their places while it wiggles, dimmed under a veil, their
   marks lit gold, and fold away when it stops. Only transform, opacity and filter move; the mark's glass is painted. */
.sec.arr .wig-done{display:none;margin-left:auto;border:0;border-radius:999px;padding:6px 14px;background:var(--yellow-fill,var(--yellow));color:#2b1a00;font-weight:900;font-size:.85rem;cursor:pointer;}
.sec.arr.wiggle .wig-done{display:inline-block;}
.sec.wiggle > .sec-h .sec-ed,.sec.wiggle > .sec-h .sec-x{display:none;}
.sec.wiggle .list > .g{animation:wig .26s ease-in-out infinite alternate;animation-delay:var(--wd,0ms);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;}
.sec.wiggle .list > .g.lift{animation:none;touch-action:none;z-index:7;transform:scale(1.08);box-shadow:0 12px 28px rgba(0,0,0,.5);cursor:grabbing;}
.sec.arr .list > .g{-webkit-touch-callout:none;}
@keyframes wig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.sec:not(.wiggle):not(.folding) > .list > .g.hid{display:none;}
.sec.wiggle > .list > .g.hid{animation:wig .26s ease-in-out infinite alternate,hidIn .26s ease-out backwards;animation-delay:var(--wd,0ms),0ms;}
@keyframes hidIn{from{opacity:0;scale:.6}}
.sec.wiggle .list > .g > .go{transition:opacity .25s ease,filter .25s ease;}
.sec.wiggle > .list > .g.hid > .go,.sec.folding > .list > .g.hid > .go{opacity:.6;filter:saturate(.15);}
.sec.wiggle > .list > .g.hid::after,.sec.folding > .list > .g.hid::after{content:"";position:absolute;inset:0;z-index:5;border-radius:inherit;background:rgba(10,10,28,.6);pointer-events:none;}
/* (the star steps aside while a section wiggles: the mark takes its corner) */
.sec.folding > .list > .g.hid > .fav{visibility:hidden;}
.wig-x{display:none;}
.sec.wiggle .list > .g > .wig-x{display:grid;place-items:center;position:absolute;z-index:6;top:0;right:0;left:auto;width:36px;height:36px;padding:0;margin:0;border:0;background:none;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.wig-x::before{content:"";position:absolute;inset:6px;border-radius:50%;background:rgba(16,15,36,.9);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 3px 8px rgba(0,0,0,.55);}
.wig-x .ico{position:relative;width:14px;height:14px;stroke-width:2.4;}
.wig-x:active::before{scale:.9;}
.sec.wiggle .list > .g.hid > .wig-x{color:var(--gold-ink,#2b1a00);}
.sec.wiggle .list > .g.hid > .wig-x::before{background:linear-gradient(180deg,var(--gold-hi,#ffe27a),var(--gold-lo,#f0b429));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 12px var(--litg,rgba(255,200,61,.5)),0 3px 8px rgba(0,0,0,.5);}
/* (a row in the list view: the mark sits on its icon's top left corner) */
.sec.wiggle .list > .g.gr:not(.tl) > .wig-x{top:-2px;left:-2px;right:auto;}   /* a list row's star stands at its right, so its mark takes the top left */
.wig-undo{position:fixed;z-index:60;left:50%;bottom:max(calc(env(safe-area-inset-bottom,0px) + 10px),18px);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 34px);min-height:44px;padding:0 6px 0 16px;border-radius:16px;
  background:rgba(22,21,46,.96);box-shadow:inset 0 1px 0 rgba(255,211,77,.45),inset 0 0 0 1px rgba(255,255,255,.14),0 14px 30px rgba(0,0,0,.55);color:var(--text);font-weight:650;font-size:.9rem;
  opacity:0;transform:translate(-50%,12px);transition:opacity .22s ease,transform .26s var(--spring,ease);}
.wig-undo.show{opacity:1;transform:translate(-50%,0);}
.wig-undo button{flex:none;min-height:34px;padding:0 14px;border:0;border-radius:11px;background:linear-gradient(180deg,var(--gold-hi,#ffe27a),var(--gold-lo,#f0b429));color:var(--gold-ink,#2b1a00);font:inherit;font-weight:750;cursor:pointer;}
@media (prefers-reduced-motion:reduce){.sec.wiggle .list > .g{animation:none;outline:2px dashed rgba(255,200,61,.6);outline-offset:-2px;}}

/* Keep playing: a shelf of little game boxes (your saved games, the last one played first; it scrolls sideways and
   never gets taller), and under it a short stack of bars for online games (the latest move on top) */
.shelf{display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;
  margin:0 calc(var(--pad,16px) * -1);padding:4px var(--pad,16px) 12px;scroll-padding-left:var(--pad,16px);}
.shelf::-webkit-scrollbar{display:none;}
.sbox{--c:#8b5cf6;flex:none;width:124px;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
  background:var(--surface);color:var(--text);text-decoration:none;box-shadow:0 6px 14px rgba(0,0,0,.18), 0 2px 0 color-mix(in srgb,var(--c) 55%,#000 45%);
  transition:transform .15s var(--spring);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;animation:sbox-in .35s var(--spring) both;}
.sbox:active{transform:scale(.95);}
@keyframes sbox-in{from{opacity:0;transform:translateX(14px) scale(.96);}}
.rail:not(.editing) .sbox.seen{animation:none;}
.sbox .art{height:124px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 0;position:relative;
  background:radial-gradient(120% 90% at 50% 30%,color-mix(in srgb,var(--c) 78%,#fff 22%),var(--c) 60%,color-mix(in srgb,var(--c) 80%,#000 20%));}
/* (the icon grows into the top padding and overlaps the gap a little, so the text below stays exactly where it was; its
   drawing sits midway between the top of the tile and the tops of the letters) */
.sbox .art .gicon{flex:none;width:82px;height:82px;margin:-10.5px 0 -7.5px;filter:drop-shadow(0 5px 7px rgba(0,0,0,.3));transition:transform .35s var(--spring);}
.sbox:active .art .gicon{transform:scale(.9) rotate(-6deg);}
/* a console game: its cartridge, small and tilted, the label whole in its window */
.sbox .art .gicon.mini-ct{position:relative;width:56px;height:76px;margin:-7.5px 0 -4.5px;transform:rotate(-4deg);}
.sbox:active .art .gicon.mini-ct{transform:scale(.9) rotate(-8deg);}
/* on the Keep playing shelf: the cartridge up close, its label filling the top of the box at a tilt, the plastic and the
   box colour around it; where you are sits over the cartridge below the label, on a shade so it reads on any plastic */
.sbox.ct .art{overflow:hidden;justify-content:flex-end;padding-bottom:9px;}
.sbox.ct .art .gicon.mini-ct{--cw:126px;--cx:63px;position:absolute;left:calc(50% - var(--cx));top:0;width:var(--cw);height:calc(var(--cw) * 1.357);margin:0;
  transform:rotate(-6deg);transform-origin:var(--cx) 30%;}
.sbox.ct .art .gicon.mini-ct.ct-nes{--cx:77px;}
.sbox.ct .art .gicon.mini-ct.ct-genesis{--cw:113px;--cx:56px;}
.sbox.ct .art .gicon.mini-ct.ct-atari2600{--cw:117px;--cx:58px;top:-30px;}
.sbox.ct:active .art .gicon.mini-ct{transform:scale(.94) rotate(-8deg);}
.sbox.ct .art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.62) 70%);}
.sbox.ct .st,.sbox.ct .ago{position:relative;z-index:1;}
.sbox.ct .st{padding:0;font-size:.68rem;letter-spacing:-.01em;}
.sbox.ct .ago{position:absolute;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.45);}
.sbox .ago{position:absolute;top:6px;right:8px;font-size:.68rem;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);}
.sbox .nm.two{white-space:normal;text-overflow:clip;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15;}
.sbox .nm{padding:9px 9px 10px;font-family:'Bungee',var(--display);font-weight:400;font-size:.8rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* where you are, left-aligned under the icon: a label with dots puts each fact on its own line ("Round 6" over "182 pts"),
   one without wraps onto two */
.sbox .st{align-self:stretch;padding:0 1px;font-size:.72rem;font-weight:800;line-height:1.25;text-align:left;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);}
.sbox .st > span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sbox .st.one{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
.sbox.old .art{filter:saturate(.45) brightness(.92);}
.sbox.old .ago{opacity:.75;}
/* Edit: a delete badge on every box (Undo is right there, so no "are you sure") */
.sdel{position:absolute;top:6px;left:6px;z-index:2;width:30px;height:30px;border:0;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;
  background:linear-gradient(180deg,#ff5a6b,#e0243c);color:#fff;box-shadow:0 0 0 2px var(--surface),0 4px 10px rgba(224,36,60,.5);animation:sdel-in .3s var(--spring) both;}
.sdel .ico{width:16px;height:16px;}
@keyframes sdel-in{from{transform:scale(0);}}
.rail.editing .sbox{animation:wig .26s ease-in-out infinite alternate;}
.rail.editing .sbox:nth-child(2n){animation-delay:-.13s;}
/* an online game while editing: a remove button at its right, in place of its turn tag (removing it gives the game
   up, so it asks first and has no Undo); while the table is being reached the bar waits, dimmed */
.rail.editing .nbar :is(.yt,.pl,.a){display:none;}
.ndel{flex:none;width:36px;height:36px;margin-right:2px;border:0;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;
  background:linear-gradient(180deg,#ff5a6b,#e0243c);color:#fff;box-shadow:0 4px 10px rgba(224,36,60,.45);animation:sdel-in .3s var(--spring) both;}
.ndel .ico{width:17px;height:17px;}
.ndel:active{transform:scale(.92);}
.nbar.quit{opacity:.55;pointer-events:none;}
.nbar.quit .ndel{animation:ndel-wait .8s ease-in-out infinite alternate;}
@keyframes ndel-wait{to{opacity:.45;transform:scale(.9);}}
@media (prefers-reduced-motion:reduce){.rail.editing .sbox{animation:none;}.sbox{animation:none;}}
/* Online games: bars, the latest move on top. Your move: in the game's colour with a gold tag and a play button; waiting
   on someone else: quiet */
.nstack{display:flex;flex-direction:column;gap:6px;}
/* a quiet label over the online games, under the shelf */
.nhead{margin:4px 2px 2.5px;font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);opacity:.75;}
.nbar{--c:#8b5cf6;display:flex;align-items:center;gap:11px;min-height:54px;padding:7px 8px 7px 9px;border-radius:15px;text-decoration:none;color:var(--text);
  background:var(--surface);box-shadow:inset 3px 0 0 var(--c);transition:transform .15s var(--spring);}
.nbar:active{transform:scale(.98);}
.nbar .gicon{width:38px;height:38px;flex:none;}
.nbar .tx{flex:1;min-width:0;}
.nbar b{display:block;font-family:'Bungee',var(--display);font-weight:400;font-size:.92rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.nbar.turn{color:#fff;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--yellow) 85%,transparent),0 6px 16px color-mix(in srgb,var(--c) 30%,transparent);
  background:linear-gradient(100deg,color-mix(in srgb,var(--c) 80%,#000 20%),color-mix(in srgb,var(--c) 52%,#000 48%));animation:ytGlow 2.6s ease-in-out infinite;}
.nbar.turn b{color:#fff;}
.nbar.turn small{color:rgba(255,255,255,.88);}
.nbar.turn .gicon{filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));}
.nbar .yt{flex:none;display:inline-flex;align-items:center;gap:5px;padding:6px 9px 6px 7px;line-height:1;border-radius:999px;background:#ffd84d;color:#2b1a00;
  font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
/* the capitals sit in the middle of the pill: the text's box is trimmed to the letters themselves */
.nbar .yt span{display:block;text-box:trim-both cap alphabetic;}
.nbar .yt i{width:6px;height:6px;border-radius:50%;background:#2b1a00;animation:ytDot 1.3s ease-in-out infinite;}

@keyframes ytGlow{0%,100%{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--yellow) 70%,transparent),0 6px 16px color-mix(in srgb,var(--c) 30%,transparent);}
  50%{box-shadow:inset 0 0 0 1.5px var(--yellow),0 0 18px 2px color-mix(in srgb,var(--yellow) 35%,transparent);}}
@keyframes ytDot{50%{transform:scale(.55);opacity:.45;}}
@media (prefers-reduced-motion:reduce){.nbar.turn,.nbar .yt i{animation:none;}}
#cont-n.yt-n{color:var(--yellow);font-weight:900;white-space:nowrap;}
@media (min-width:720px){.nstack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}}

/* Activity log (profile menu) */
.al-tag{margin-left:auto;font-size:.8rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text-3);}
.al-tag.ok{color:#4ade80;}
.al-tag.slow{color:var(--yellow);}
.al-tag.bad{color:#ff8a96;}
.al-tag.st2{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;}
.al-tag.st2 small{font-size:.72rem;font-weight:700;opacity:.8;}
.k-list .k-grp.k-out{margin-top:16px;}
.k-list .k-grp.k-out button{border-radius:var(--r);}
.al{display:flex;flex-direction:column;gap:10px;}

/* Open tables banner (above the search): linked friends hosting a table you can join */
.otb{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;margin:0 0 10px;padding:8px 12px 8px 10px;border:0;border-radius:18px;cursor:pointer;
  font:inherit;color:var(--text);text-align:left;background:color-mix(in srgb,#4ade80 13%,var(--bg));
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#4ade80 50%,transparent),0 3px 0 color-mix(in srgb,#4ade80 28%,transparent);transition:transform .12s var(--spring);}
.otb[hidden]{display:none;}

.otb-go{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#4ade80;color:#06240f;}

@keyframes otbIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes otbOut{to{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes otbPing{40%{transform:scale(1.025)}}
@keyframes otbGlow{0%{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#4ade80 50%,transparent),0 3px 0 color-mix(in srgb,#4ade80 28%,transparent),0 0 0 0 rgba(74,222,128,.55)}
  70%,100%{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#4ade80 50%,transparent),0 3px 0 color-mix(in srgb,#4ade80 28%,transparent),0 0 0 12px rgba(74,222,128,0)}}

   the page; the dot and its dark edge are drawn again over it) */
.live-dot::before,.live-dot::after{content:"";position:absolute;inset:-2px;border-radius:50%;pointer-events:none;}
.live-dot::before{background:rgba(74,222,128,.6);animation:livePulse 1.6s ease-out infinite;}
.live-dot::after{inset:0;background:inherit;box-shadow:0 0 0 2px var(--bg);}

.ots-h b{font-weight:900;font-size:1.05rem;}
.ots-on{margin-left:auto;font-size:.75rem;font-weight:900;color:#4ade80;}
.ots-r{--c:#4ade80;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 10px;border-radius:16px;background:var(--surface-2);color:var(--text);text-decoration:none;
  box-shadow:inset 3px 0 0 var(--c);transition:transform .15s var(--spring);}

.ots-r .gicon{width:44px;height:44px;flex:none;}

@media (prefers-reduced-motion:reduce){.live-dot,.live-dot::before,.otb,.ots-r{animation:none!important;}}
/* Edit: every tile shows its trash, plus Clear all */
.sec-h .cont-edit{margin-left:auto;min-height:34px;padding:0 15px;border:0;border-radius:999px;background:var(--w08);color:var(--text);font:inherit;font-weight:800;font-size:.86rem;cursor:pointer;}
.sec-h .cont-edit.on{background:var(--yellow-fill,var(--yellow));color:#16102e;}
.sec-h .cont-edit:active{transform:scale(.96);}
.cont-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;}
.cont-foot:empty{display:none;}
.cont-foot{margin-top:10px;}
.cont-clear{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 16px;border:0;border-radius:999px;background:color-mix(in srgb,#e0243c 14%,transparent);color:#e0243c;font:inherit;font-weight:800;font-size:.86rem;cursor:pointer;box-shadow:inset 0 0 0 1px color-mix(in srgb,#e0243c 40%,transparent);}
html:not([data-theme="light"]):not([data-theme="parchment"]) .cont-clear{color:#ff8a96;}
.cont-clear .ico{width:16px;height:16px;}
.cont-undo{display:inline-flex;align-items:center;gap:10px;min-height:38px;padding:0 6px 0 14px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-weight:700;font-size:.86rem;}
.cont-undo button{min-height:30px;padding:0 12px;border:0;border-radius:999px;background:var(--w08);color:var(--text);font:inherit;font-weight:900;cursor:pointer;}

.empty{display:none;text-align:center;padding:50px 20px;color:var(--text-2);}
.empty .e{font-size:3rem;margin-bottom:8px;}
.empty.show{display:block;}
.foot{text-align:center;color:var(--text-3);font-size:.8rem;font-weight:700;margin-top:36px;}

/* Mode chooser */
.pick{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
.pick button{display:flex;align-items:center;gap:14px;padding:16px;border:0;border-radius:var(--r-lg);text-align:left;color:var(--text);
  background:var(--surface-2);box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .1s, box-shadow .1s;}
.pick button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
.pick-note{margin:2px 4px 0;font-size:.82rem;line-height:1.35;}
.pick button.resume{box-shadow:inset 0 0 0 2px var(--yellow);}
.pick button.resume .e{background:var(--yellow-fill,var(--yellow));color:#16102e;}
.pick button.join{box-shadow:inset 0 0 0 2px var(--green,#3ddc84);}
.pick button.join .e{background:var(--green,#3ddc84);color:#0c2416;}
.pick .e{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--w08);color:var(--text-2);flex:none;}
.pick .e .ico{width:24px;height:24px;}
.pick .t{font-weight:900;font-size:1.1rem;}
.pick .d{color:var(--text-2);font-size:.9rem;}

/* The game sheet: condensed rows, Quick start first, then the game's own setup in a frame */
.pick.gsheet{gap:9px;margin-top:4px;}
/* a game's sheet may rise nearly to the top of the screen before it scrolls (Tim, 2026-11-15: "especially when there aren't tons of
   options ... there's no need to do a scroll, just make the new game dialog taller") */
.k-sheet:has(.gsheet){max-height:calc(100dvh - max(env(safe-area-inset-top), 0px) - 14px);}
html.k-kb .k-sheet:has(.gsheet){max-height:calc(var(--vvh,100vh) - 12px);}
/* a phone held sideways: the game, its Players card and the start buttons at the left, its options at the right, so a
   setup with a few options needs no scroll (the sheet is wider; the dock still runs along the bottom) */
@media (orientation:landscape) and (max-height:520px) and (min-width:640px){
  .k-sheet:has(.gsheet .gs-wrap){max-width:min(920px,calc(100vw - 2 * max(env(safe-area-inset-left),env(safe-area-inset-right),16px)));}
  .pick.gsheet:has(.gs-wrap){display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);grid-auto-rows:min-content;grid-auto-flow:row dense;column-gap:20px;row-gap:0;align-items:start;}
  .pick.gsheet:has(.gs-wrap) > *{grid-column:1;margin-bottom:9px;}
  .pick.gsheet .gs-wrap{display:contents;}
  .pick.gsheet .gs-wrap > .gs-h{grid-column:1;margin:0 0 4px;}
  .pick.gsheet .gs-wrap > .gs-whobox{grid-column:1;}
  .pick.gsheet .gs-whobox button.gs-who{width:100%;margin:0 0 9px;}
  .gs-whobox .k-wn{top:9px;right:12px;}
  .pick.gsheet .gs-wrap > .gs-right{grid-column:2;grid-row:1 / span 30;display:flex;flex-direction:column;gap:9px;}
  .pick.gsheet .gs-right > .gs-fb{margin:0 -20px 0 -6px;}
  .pick.gsheet .gs-right > button.alt{margin:0;}
  .pick.gsheet:has(.gs-wrap) > .gs-dock{grid-column:1 / -1;}
}
.pick.gsheet button{padding:11px 12px;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.3);}
.pick.gsheet .e{width:40px;height:40px;border-radius:12px;}
.pick.gsheet .e .ico{width:21px;height:21px;}
.pick.gsheet .tx{min-width:0;flex:1;}
.pick.gsheet .t{font-size:1.02rem;}
.pick.gsheet .d{font-size:.84rem;}
.pick .d.rs{display:flex;justify-content:space-between;gap:10px;}
.pick .d.rs .ago{flex:none;color:var(--text-3);font-weight:700;}
.pick button.quick{background:color-mix(in srgb,var(--yellow-fill,#ffc83d) 16%,var(--surface-2));box-shadow:0 4px 0 rgba(0,0,0,.3),inset 0 0 0 2px color-mix(in srgb,var(--yellow-fill,#ffc83d) 70%,transparent);}
.pick button.quick .e{background:var(--yellow-fill,var(--yellow));color:#2b1a00;}
.pick button.alt{background:var(--w06);box-shadow:none;}
.qs{display:flex;flex-direction:column;gap:4px;margin-top:5px;}
.qs-chips{display:flex;flex-wrap:wrap;gap:5px;}
.qs-chip.bot{display:inline-flex;align-items:center;gap:4px;}
.qs-chip.bot .ico{width:13px;height:13px;}
.qs-kv{display:flex;align-items:baseline;gap:8px;font-size:.84rem;line-height:1.3;}
.qs-kv i{flex:none;font-style:normal;font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);}
.qs-kv b{min-width:0;font-weight:800;color:var(--text-2);}
.qs-chip{padding:3px 9px;border-radius:999px;background:var(--w08);color:var(--text-2);font-size:.76rem;font-weight:800;line-height:1.3;}
.qs-chip.who{background:color-mix(in srgb,var(--yellow-fill,#ffc83d) 26%,transparent);color:var(--text);}
.gs-wrap{margin:6px -20px 0;}
/* the start buttons stay in view at the bottom of the sheet while the setup scrolls under them */
.gs-dock{position:sticky;bottom:calc(-1 * (var(--safe-b) + 20px));z-index:3;display:flex;gap:10px;margin:-6px -20px calc(-1 * (var(--safe-b) + 20px));padding:16px 20px calc(var(--safe-b) + 16px);
  background:linear-gradient(rgba(0,0,0,0),var(--bg-2) 34%);}
.gs-dock:empty{display:none;}
.gs-dock .gs-start{flex:1;min-width:0;margin:0;}
.gs-dock .gs-alt{flex:none;width:auto;padding:0 14px;gap:6px;white-space:nowrap;font-size:.92rem;}
.gs-dock .gs-alt .ico{width:18px;height:18px;}
.pick.gsheet button.gs-who{width:calc(100% - 40px);margin:6px 20px 8px;background:var(--surface-2);box-shadow:0 4px 0 rgba(0,0,0,.3),inset 0 0 0 1.5px var(--w12);}
.pick.gsheet button.gs-who[hidden]{display:none;}
.gs-whobox .k-wn{top:15px;right:32px;}
.pick.gsheet .gs-whobox .k-wn-b{display:grid;place-items:center;justify-content:center;width:36px;height:34px;min-height:0;margin:0;padding:0;border-radius:11px;background:transparent;box-shadow:none;font-size:1rem;}
.pick.gsheet .gs-whobox .k-wn-b:active:not(:disabled){background:var(--gl-2);}
.gs-whobox.has-n .gs-who .t{padding-right:130px;min-height:44px;display:flex;align-items:center;}
.gs-who .qs-chips{margin-top:5px;}
.gs-who .qs-chip.bot i{font-style:normal;font-weight:700;color:var(--text-3);margin-left:2px;}
.gs-who-go{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--w08);color:var(--text-2);}
.gs-who-go .ico{width:16px;height:16px;}
.gs-h{margin:0 20px 2px;font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);}
.gs-fb{position:relative;}
.gs-frame{display:block;width:100%;border:0;background:transparent;opacity:0;transition:opacity .25s;}
.gs-wrap.on .gs-frame{opacity:1;}
.gs-spin{position:absolute;left:50%;top:60px;width:28px;height:28px;margin-left:-14px;border-radius:50%;border:3px solid var(--w2);border-top-color:var(--text-2);animation:gsSpin .8s linear infinite;}
.gs-wrap.on .gs-spin{display:none;}
.gs-fb .gs-open{margin:14px 20px 6px;width:calc(100% - 40px);gap:8px;}
@keyframes gsSpin{to{transform:rotate(360deg);}}
/* Mode chooser header */
.pick-h{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.pick-h .gicon{width:64px;height:64px;flex:none;}
.pick-h b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;}
.pick-h span{color:var(--text-2);font-size:.92rem;}

/* Recent games */
.recent{display:flex;flex-direction:column;gap:6px;}
.rg{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-radius:var(--r);background:var(--w06);color:var(--text);text-align:left;}
.rg:active{transform:scale(.98);}
.rg .gicon{width:42px;height:42px;flex:none;}
.rg .grow{display:flex;flex-direction:column;min-width:0;}
.rg b{font-weight:900;}
.rg .w{font-size:.9rem;font-weight:700;color:var(--yellow);}
.rg small{font-size:.78rem;color:var(--text-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rg .when{flex:none;font-size:.78rem;font-weight:800;color:var(--text-3);}

/* Account sheet */
.acct{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.acct .avatar{--c:var(--yellow);}
.acct .t{font-weight:900;font-size:1.15rem;}
.acct .d{color:var(--text-2);font-size:.9rem;}

/* Linked with someone: full-screen moment */
.lkm{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 24px calc(var(--safe-b) + 24px);text-align:center;
  background:radial-gradient(120% 80% at 50% 38%,color-mix(in srgb,var(--accent) 30%,var(--bg)) 0%,var(--bg) 70%);opacity:0;transition:opacity .3s;}
.lkm.show{opacity:1;}
.lkm-pair{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.lkm-them{display:flex;}
.lkm-them .lkm-av + .lkm-av{margin-left:-26px;}
.lkm .lkm-av{width:108px;height:108px;font-size:2.6rem;color:#fff;border:4px solid var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .55s var(--spring);}
.lkm .lkm-me{transform:translateX(-46px) rotate(-8deg);}
.lkm .lkm-them{transform:translateX(46px) rotate(8deg);transition:transform .55s var(--spring);}
.lkm.show .lkm-me,.lkm.show .lkm-them{transform:none;}
.lkm-link{position:relative;z-index:1;display:grid;place-items:center;width:54px;height:54px;margin:0 -18px;border-radius:50%;background:#ffc83d;color:#2a1d00;
  box-shadow:0 0 0 5px var(--bg),0 8px 18px rgba(0,0,0,.3);transform:scale(0) rotate(-90deg);transition:transform .45s var(--spring) .45s;}
.lkm.show .lkm-link{transform:none;animation:lkmRing 1.4s ease-out .9s 2;}
.lkm-link .ico{width:28px;height:28px;stroke-width:2.6;}
@keyframes lkmRing{0%{box-shadow:0 0 0 5px var(--bg),0 0 0 5px color-mix(in srgb,var(--yellow) 70%,transparent);}100%{box-shadow:0 0 0 5px var(--bg),0 0 0 34px color-mix(in srgb,var(--yellow) 0%,transparent);}}
.lkm-t{font-size:1.5rem;font-weight:800;line-height:1.15;color:var(--text-2);opacity:0;transform:translateY(12px);transition:opacity .4s .55s,transform .5s var(--spring) .55s;}
.lkm-t b{display:block;font-family:var(--display);font-weight:400;font-size:2.8rem;color:var(--text);margin-top:4px;}
.lkm-s{max-width:300px;color:var(--text-2);font-weight:700;opacity:0;transition:opacity .4s .8s;}
.lkm-ok{min-width:180px;margin-top:10px;opacity:0;transition:opacity .4s 1s;}
.lkm.show .lkm-t,.lkm.show .lkm-s,.lkm.show .lkm-ok{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){.lkm *{transition-duration:.01ms!important;animation:none!important;}}

/* ── Game tiles: the Keep playing box on its side (art square in the section's colour on the left, the name and
   players on the right), two across on a phone ── */
/* the tile's own background is the art colour behind the art square, so a tilted or lifted tile (arranging
   favorites) never shows a light hairline round the square where its edge is smoothed */
:root .tiles .g:not(.ct){--arth:76px;--tbg:var(--surface);aspect-ratio:auto;display:flex;flex-direction:row;border-radius:14px;overflow:hidden;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 85%,#000 15%) var(--arth),var(--tbg) 0);
  box-shadow:0 6px 14px rgba(0,0,0,.18),0 2px 0 color-mix(in srgb,var(--c) 55%,#000 45%);}
:root[data-theme="light"] .tiles .g:not(.ct),:root[data-theme="parchment"] .tiles .g:not(.ct){--tbg:#fff;box-shadow:0 6px 14px rgba(40,20,80,.12),0 2px 0 color-mix(in srgb,var(--c) 55%,#000 45%);}
:root .tiles .g:not(.ct):hover{filter:none;}
:root .tiles .g:not(.ct) .go{position:relative;inset:auto;flex:1;display:flex;flex-direction:row;align-items:stretch;gap:0;padding:0;border-radius:0;min-height:76px;text-align:left;}
:root .tiles .g:not(.ct) .go::after{display:none;}
:root .tiles .g:not(.ct) .go::before{content:"";flex:none;display:block;width:var(--arth);min-height:var(--arth);
  background:radial-gradient(120% 90% at 50% 30%,color-mix(in srgb,var(--c) 78%,#fff 22%),var(--c) 60%,color-mix(in srgb,var(--c) 80%,#000 20%));}
/* the icon fills most of its square (casino's round chip a touch smaller, so its edge stays inside) */
:root .tiles .g:not(.ct){--gi:81px;}
:root .tiles .g[data-cat="casino"]:not(.ct){--gi:79px;}
:root .tiles .g:not(.ct) .gicon{position:absolute;z-index:1;width:var(--gi);height:var(--gi);left:calc(var(--arth) / 2 - var(--gi) / 2);top:calc(50% - var(--gi) / 2 + 1px);filter:drop-shadow(0 5px 7px rgba(0,0,0,.3));}
:root .tiles .g:not(.ct) .go:active .gicon{transform:scale(.9) rotate(-6deg);}
:root .tiles .g:not(.ct) .txt{position:static;inset:auto;display:block;flex:1;min-width:0;align-self:center;padding:8px 26px 8px 10px;}
:root .tiles .g:not(.ct) .txt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:.86rem;line-height:1.15;color:var(--text);text-shadow:none;white-space:normal;overflow:hidden;}
:root .tiles .g:not(.ct) .txt b.long,:root .tiles .g:not(.ct) .txt b.two{font-size:.78rem;}
@media (max-width:359px){ :root .tiles .g:not(.ct) .txt b.long{font-size:.7rem;letter-spacing:-.01em;} :root .tiles .g:not(.ct) .txt{padding-right:20px;} }   /* (a 320-wide phone: one long word, Minesweeper, still fits its tile) */
:root .tiles .g:not(.ct) .meta{position:static;margin-top:4px;font-size:.7rem;font-weight:900;color:var(--text-3);text-shadow:none;}
:root .tiles .g:not(.ct) .meta .ico{width:12px;height:12px;}
:root .tiles .g:not(.ct) .live{position:static;display:inline-block;margin-top:4px;font-size:.58rem;padding:2px 7px;}
:root .tiles .g:not(.ct) .fav{top:auto;bottom:0;left:auto;right:0;width:32px;height:32px;color:var(--text-3);opacity:1;}
:root .tiles .g:not(.ct) .fav .ico{width:16px;height:16px;}
:root .tiles .g:not(.ct) .fav:not(.on){opacity:.55;}
:root .tiles .g:not(.ct) .fav.on{color:#ffd84d;opacity:1;}
:root .list.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
/* a small phone: the art square gives up a little width so every name shows whole (the star sits under the name, not beside it) */
@media (max-width:389px){:root .tiles .g:not(.ct){--arth:64px;--gi:68px;} :root .tiles .g[data-cat="casino"]:not(.ct){--gi:66px;} :root .tiles .g:not(.ct) .txt{padding:8px 8px 8px 9px;}}
@media (min-width:720px){:root .list.tiles{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (min-width:1080px){:root .list.tiles{grid-template-columns:repeat(4,minmax(0,1fr));}}
/* console cartridges: three across on a phone */
:root .sec-console .list.tiles{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:10px;}
@media (min-width:720px){:root .sec-console .list.tiles{grid-template-columns:repeat(5,minmax(0,1fr));}}
@media (min-width:1080px){:root .sec-console .list.tiles{grid-template-columns:repeat(7,minmax(0,1fr));}}
/* a phone's Consoles header: the sort and Edit keep their room (the count steps aside, Edit is its pencil) */
@media (max-width:460px){.sec-console > .sec-h{gap:8px;} .sec-console > .sec-h .n{display:none;} .sec-console .cs-head .hs-link span{display:none;} .sec-console .cs-head .hs-link{padding:0 10px;}}
/* section headers: the icon in a badge of the section's colour (the same as its tiles' art), the count as a pill */
.sec[style*="--sc"] > .sec-h > span:first-child,.sec-h > .kp-ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 30%,color-mix(in srgb,var(--sc) 78%,#fff 22%),var(--sc) 60%,color-mix(in srgb,var(--sc) 80%,#000 20%));
  box-shadow:0 2px 0 color-mix(in srgb,var(--sc) 55%,#000 45%);}
.sec[style*="--sc"] > .sec-h > span:first-child .ico,.sec-h > .kp-ic .ico{width:17px;height:17px;color:#fff;}
.sec-h > .kp-ic{--sc:hsl(28 92% 52%);}
.sec-h .n{padding:1px 8px;border-radius:999px;background:var(--w07,rgba(255,255,255,.07));font-size:.8rem;}
:root[data-theme="light"] .sec-h .n,:root[data-theme="parchment"] .sec-h .n{background:rgba(40,20,80,.07);}
.sec-h .n:empty{display:none;}
/* Keep playing: a tall, thin arrow at the shelf's right edge while there's more to see; tap it to slide along */
.shelf-w{position:relative;}
.shelf-more{position:absolute;z-index:2;top:4px;bottom:12px;right:calc(var(--pad,16px) * -1);width:30px;padding:0;border:0;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--bg,#141029) 85%,transparent) 55%);color:var(--text);transition:opacity .2s;}
.shelf-more svg{width:12px;height:46px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
.shelf-more.off{opacity:0;pointer-events:none;}
.shelf-more:active svg{transform:translateX(2px);}
.pick-h .pk-tag{display:none;}

/* ═══ Night glass in color (Tim, 2026-11-14): the Night theme's home. Frosted glass on the night sky, each category's
   color tinting its games (--h), gold for what is yours or happening now, Schibsted Grotesk throughout, no tracked
   capitals. Games are rows (glassRow), many columns of them where there is room. The other themes keep the rules above. */
:root:not(.ng-x) .top{gap:8px;}
:root:not(.ng-x) .top .hi{color:var(--text-2);font-weight:550;font-size:.92rem;line-height:1.2;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px;}
:root:not(.ng-x) .top h1{font-family:var(--display);font-weight:800;font-size:2.15rem;line-height:1.04;letter-spacing:-.03em;white-space:nowrap;}
@media (max-width:440px){:root:not(.ng-x) .top{gap:6px;} :root:not(.ng-x) .top :is(.vbtn,.me,.logo){width:36px;height:36px;}

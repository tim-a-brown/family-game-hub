<script>
if ('serviceWorker' in navigator) {
  var swReg = null, hadSW = !!navigator.serviceWorker.controller, swReload = false;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/service-worker.js').then(function (r) { swReg = r; try { r.update(); } catch (e) {} }).catch(function () {});
  });
  // An app left open in the background keeps running the old code after a release. Coming back to it checks for
  // a new version, and a new one reloads the home screen (once nothing is open), so the fixes actually arrive.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && swReg) { try { swReg.update(); } catch (e) {} }
  });
  var swIdle = function () { return !document.querySelector('.k-scrim, .lkm') && !(document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)); };
  var swGo = function () { if (!swReload) return; if (swIdle()) { swReload = false; location.reload(); } };
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadSW) { hadSW = true; return; }   // first install: nothing old is running
    swReload = true; swGo();
  });
  window.addEventListener('kit-sheet-closed', function () { setTimeout(swGo, 400); });
}
// Not signed in yet (no PIN, no guest choice): send to the gate first.
if (typeof FGHSync !== 'undefined' && !FGHSync.mode()) location.replace('./gate.html');
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && window.FGHSync && FGHSync.syncNow) FGHSync.syncNow({ soft: true });
});
</script>
<style>
.home{max-width:1240px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 40px);}

/* Top */
.top{display:flex;align-items:center;gap:12px;}
.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;color:#2b1a00;border:0;overflow:hidden;
  background:linear-gradient(180deg,#171530,#0b0a1c);box-shadow:inset 0 0 0 1px var(--w08), 0 8px 22px rgba(20,16,41,.45);
  transform:rotate(-6deg);transition:transform .4s var(--spring);}
.logo svg{width:48px;height:48px;display:block;}
.logo:active{transform:rotate(20deg) scale(.9);}
/* Arriving home: the tile bounces in, the mark spins once, and a little glint catches it */
.logo-wrap{position:relative;flex:none;display:grid;}
.logo.spin svg{animation:logoSpin .95s cubic-bezier(.3,1.35,.45,1) both;}
.logo-wrap.bounce{animation:logoBounce .9s both;transform-origin:50% 100%;}
@keyframes logoBounce{
  0%{transform:translateY(-34px) scale(.7);opacity:0;animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  30%{transform:translateY(0) scale(1.12,.86);opacity:1;animation-timing-function:cubic-bezier(.2,.7,.4,1)}
  50%{transform:translateY(-12px) scale(.95,1.06);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  68%{transform:translateY(0) scale(1.05,.95);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
  82%{transform:translateY(-3px) scale(.99,1.01)}
  100%{transform:none;opacity:1}}
@keyframes logoSpin{0%{transform:rotate(-90deg) scale(.55)}65%{transform:rotate(375deg) scale(1.07)}100%{transform:rotate(360deg) scale(1)}}
.logo{position:relative;}
/* the glint: a soft streak of light across the tile as it settles, and one tiny star winking at its corner */
.logo::after{content:"";position:absolute;inset:-20%;pointer-events:none;opacity:0;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.5) 48%,rgba(255,255,255,.16) 54%,transparent 62%);transform:translateX(-70%);}
.logo.spin::after{animation:logoGlint .7s ease-out .6s both;}
@keyframes logoGlint{0%{opacity:1;transform:translateX(-70%)}100%{opacity:1;transform:translateX(70%)}}
.logo-fx{position:absolute;right:-3px;top:-3px;width:12px;height:12px;pointer-events:none;z-index:2;color:#fff;opacity:0;filter:drop-shadow(0 0 3px rgba(255,255,255,.9));}
.logo-fx svg{width:100%;height:100%;display:block;fill:currentColor;}
.logo-fx.on{animation:logoWink .6s ease-out .85s both;}
@keyframes logoWink{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.1) rotate(45deg)}100%{opacity:0;transform:scale(0) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.logo.spin svg,.logo.spin::after,.logo-fx.on,.logo-wrap.bounce{animation:none;}.logo-fx{display:none;}}
.top .who{flex:1;min-width:0;}
.top .hi{font-size:.9rem;font-weight:800;color:var(--yellow);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top h1{font-size:1.75rem;font-weight:900;}
.logo .ico{width:28px;height:28px;}
.me{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;flex:none;
  background:var(--surface-3);color:var(--text);font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
.me:active{transform:scale(.9);}
.me{position:relative;padding:0 0 3px;line-height:1;}   /* the letter sits on the circle's middle, above its bottom shade */
.me.has-av{overflow:hidden;}
.me.has-av .av-img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;}
.me.has-av.syncdot{overflow:visible;}
.me.has-av .av-img{clip-path:circle(50%);}
.me.has-av .ico{width:56%;height:56%;}
.acct-name{width:100%;border:0;background:none;color:var(--text);font:inherit;font-weight:900;font-size:1.35rem;padding:4px 0;border-bottom:1.5px dashed var(--w18);border-radius:0;outline:none;}
.acct-name:focus{border-bottom-color:var(--yellow);}
/* a small pencil at the end of your name: it can be changed right here (hidden while typing) */
.acct-nm{position:relative;display:block;cursor:text;}
.acct-nm .acct-name{padding-right:28px;}
.acct-pen{position:absolute;right:2px;top:50%;width:18px;height:18px;margin-top:-10px;color:var(--text-3);opacity:.75;pointer-events:none;transition:opacity .2s;}
.acct-pen svg{width:100%;height:100%;}
.acct-name:focus + .acct-pen{opacity:0;}
.acct-name::placeholder{color:var(--text-3);}
.acct-d{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--text-2);font-size:.86rem;}
.acct-d span{min-width:0;}
/* a link request waiting: gold dot on your avatar, banner under the header */
.me.attn::before{content:"";position:absolute;left:-3px;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--yellow);border:2px solid var(--bg);box-shadow:0 0 0 0 color-mix(in srgb,var(--yellow) 60%,transparent);animation:attn 1.6s ease-out infinite;z-index:2;}
@keyframes attn{70%{box-shadow:0 0 0 9px color-mix(in srgb,var(--yellow) 0%,transparent);}100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--yellow) 0%,transparent);}}
.lk-banner{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:9px 10px 9px 12px;border:0;border-radius:16px;text-align:left;color:var(--text);
  background:color-mix(in srgb,var(--yellow) 16%,var(--surface));box-shadow:inset 0 0 0 2px var(--yellow);}
.lk-banner .grow{flex:1;min-width:0;display:flex;flex-direction:column;}
.lk-banner b{font-weight:900;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lk-banner small{font-size:.8rem;font-weight:700;color:var(--text-2);}
.lk-banner .lk-rev{flex:none;padding:8px 14px;border-radius:999px;background:var(--yellow);color:#1a1200;font-weight:900;font-size:.86rem;}
.syncdot{position:relative;}
.syncdot::after{content:"";position:absolute;right:1px;top:1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--text-3);}
.syncdot.s-synced::after{background:var(--green);}
.syncdot.s-syncing::after{background:var(--yellow);animation:pulse 1s infinite;}
.syncdot.s-offline::after{background:var(--text-3);}
.syncdot.s-error::after{background:var(--red);}

.pin-ch{display:flex;flex-direction:column;gap:10px;}
.pin-ch .pin-in{letter-spacing:.5em;font-size:1.4rem;text-align:center;font-weight:900;}
.pin-ch .pin-in:placeholder-shown{letter-spacing:normal;font-size:1rem;font-weight:700;}
.pin-msg{min-height:1.3em;font-size:.88rem;font-weight:700;color:var(--text-2);margin:0;}
.pin-msg.err{color:var(--red);}
.pin-big{font-family:var(--display);font-size:1.3em;letter-spacing:.12em;color:var(--text);}

/* Search row with the Surprise button */
.srow{display:flex;gap:10px;align-items:center;}
.srow .search{flex:1;min-width:0;}
.surprise{min-height:48px;padding:0 16px;border-radius:999px;font-size:1rem;}
.surprise .d{display:inline-flex;transition:transform .5s var(--spring);}
.surprise .d .ico{width:20px;height:20px;}
.surprise:active .d{transform:rotate(180deg);}
@media (max-width:360px){.surprise .lbl{display:none;}}

/* Search + Surprise on top; the category chips, with the Daily puzzles button beside them under Surprise */
.filters{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:start;}
.filters .srow{display:contents;}
.filters .search{grid-column:1;grid-row:1;}
.filters .surprise{grid-column:2;grid-row:1;}
.filters .chips{grid-column:1;grid-row:2;}
.dlbtn{grid-column:2;grid-row:2;align-self:stretch;margin-top:10px;margin-bottom:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:74px;padding:8px 10px;
  border:0;border-radius:20px;cursor:pointer;color:var(--text);font:inherit;text-align:center;
  background:color-mix(in srgb,var(--blue,#3b82f6) 13%,var(--bg));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--blue,#3b82f6) 40%,transparent),0 3px 0 color-mix(in srgb,var(--blue,#3b82f6) 30%,transparent);transition:transform .12s var(--spring);}
.dlbtn:active{transform:translateY(2px) scale(.98);}
.dlbtn .ico{width:24px;height:24px;color:var(--blue,#3b82f6);}
.dlbtn b{font-weight:900;font-size:.95rem;line-height:1.1;}
.dlbtn .ct{font-weight:800;font-size:.78rem;color:var(--text-2);font-variant-numeric:tabular-nums;}
.dlbtn .bar{width:80%;height:6px;border-radius:3px;background:color-mix(in srgb,var(--blue,#3b82f6) 18%,transparent);overflow:hidden;}
.dlbtn .bar i{display:block;height:100%;border-radius:3px;background:var(--blue,#3b82f6);transition:width .5s var(--spring);}
.dlbtn.all-done{background:color-mix(in srgb,var(--green) 15%,var(--bg));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--green) 45%,transparent),0 3px 0 color-mix(in srgb,var(--green) 30%,transparent);}
.dlbtn.all-done .ico,.dlbtn.all-done .bar i{color:var(--green);background-color:var(--green);}
.dlbtn.all-done .ico{background:none;}

/* Search + filters (sticky) */
.filters{position:sticky;top:0;z-index:20;margin:calc(10px - var(--safe-t)) -16px 0;pointer-events:none;padding:calc(var(--safe-t) + 8px) 16px 10px;background:transparent;transition:background-color .2s, box-shadow .2s;}
@media (min-width:1272px){.filters{border-radius:0 0 20px 20px;}}
/* On phones all the category chips wrap into several rows; too tall to pin, so they scroll with the page */
@media (max-width:719px){.filters{position:relative;}}
.filters>*{pointer-events:auto;}
.search{position:relative;}
.search svg{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
.search .input{padding-left:46px;padding-right:44px;min-height:48px;border-radius:999px;}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:var(--w1);color:var(--text-2);font-weight:900;display:none;}
.search.has-q .x{display:block;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0 0 2px;}
.chips .chip{--cc:var(--text-2);min-height:32px;padding:0 11px 0 9px;gap:6px;font-size:.84rem;
  background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 35%,transparent);}
.chips .chip .ico{width:15px;height:15px;color:var(--cc);}
.chips .chip.on{background:var(--cc);color:#fff;box-shadow:none;}
.chips .chip.on .ico{color:#fff;}
.chips .chip.all.on .ico{color:var(--bg);}
.chips .chip.on .n{opacity:.8;}
.chips .chip.all{--cc:var(--text);}
.chips .chip.all.on{color:var(--bg);}
.chips .chip.all.on .ico{color:var(--bg);}
.chips .chip.fav{--cc:var(--yellow);}
.chips .chip.fav.on{color:#2b1a00;}
.chips .chip.fav.on .ico{color:#2b1a00;}
.chips .chip.who{--cc:var(--blue);}
/* Phones: a narrower right column and compact chips, so two or three chips still fit on a row */
@media (max-width:520px){
  .surprise{padding:0 12px;font-size:.95rem;gap:6px;}
  .dlbtn{padding:8px 6px;}
  .chips{gap:5px;}
  .chips .chip{min-height:30px;padding:0 8px 0 7px;gap:4px;font-size:.78rem;}
  .chips .chip .ico{width:13px;height:13px;}
}
.chips::-webkit-scrollbar{display:none;}
.chip .ico{width:16px;height:16px;}
.chip.who{background:color-mix(in srgb,var(--blue) 22%,transparent);color:var(--text);}
.chip.who.set{background:var(--blue);color:#03182f;}
.chips .sep{flex:none;width:1px;margin:8px 2px;background:var(--line-2);}

/* Section headings */
.sec{margin-top:22px;}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 2px 12px;}
.sec-h h2{font-size:1.25rem;}
.sec-h .ico{width:22px;height:22px;color:var(--text-3);}
.sec-h .n{font-weight:800;color:var(--text-3);font-size:.9rem;}
.sec-h .hs-link{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border:0;border-radius:999px;background:rgba(255,200,61,.14);color:var(--yellow);font:inherit;font-weight:800;font-size:.84rem;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,200,61,.3);}
.sec-h .hs-link .ico{width:16px;height:16px;color:var(--yellow);}
.sec-h .hs-link:active{transform:scale(.96);}
.sec-h .dl-link{background:color-mix(in srgb,var(--blue,#3b82f6) 16%,transparent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue,#3b82f6) 45%,transparent);}
.sec-h .dl-link .ico{color:var(--blue,#3b82f6);}
.sec-h .dl-link{white-space:nowrap;flex:none;}
.sec-h .dl-link i{font-style:normal;}
@media (max-width:430px){ .sec-h .dl-link i{display:none;} }
.sec-h .dl-link b{font-weight:900;font-variant-numeric:tabular-nums;color:var(--text-2);}
.sec-h .bank{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:900;color:var(--green);}
.sec-h .bank .bank-amt{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--green);font:inherit;font-weight:900;padding:4px 2px;cursor:pointer;}
.sec-h .bank .bank-amt .ico{width:16px;height:16px;}
.sec-h .bank button:not(.bank-amt){border:0;background:var(--w08);color:var(--text-2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.8rem;}

/* Game rows: name first, easy to scan */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;}
@media (min-width:720px){.list{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (min-width:1280px){.list{grid-template-columns:repeat(3,minmax(0,1fr));}}
.g{--c:#ffc83d;position:relative;display:flex;align-items:stretch;border-radius:16px;background:var(--surface);transition:transform .15s var(--spring), background .15s, box-shadow .2s;}
.g:hover{background:var(--surface-2);}
.g{min-width:0;}
.g .go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:9px 4px 9px 9px;border:0;background:none;color:var(--text);text-align:left;border-radius:16px;}
.g .go:active{transform:scale(.98);}
.g .gicon{flex:none;width:48px;height:48px;transition:transform .35s var(--spring);}
.g .go:active .gicon{transform:scale(.9) rotate(-6deg);}
.g:hover .gicon{transform:rotate(-4deg) scale(1.05);}
.g .txt{flex:1;min-width:0;}
@font-face{font-family:'Bungee';src:url('fonts/bungee.woff2') format('woff2');font-display:swap;}
/* game names: Bungee, arcade-sign caps */
.g .txt b{display:block;font-family:'Bungee',var(--display);font-weight:400;letter-spacing:0;font-size:1.12rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g .txt small{display:block;margin-top:2px;font-size:.84rem;font-weight:600;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g .meta{flex:none;display:flex;align-items:center;gap:4px;font-size:.8rem;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;}
.g .meta .ico{width:15px;height:15px;}
/* the Resume tag keeps its own bright green and dark ink in every theme, so it reads on any tile */
.g .live{flex:none;font-size:.7rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#03290f;background:#3ddc84;border-radius:999px;padding:3px 8px;box-shadow:0 1px 0 rgba(0,0,0,.18), inset 0 0 0 1px rgba(3,41,15,.18);}
.g .fav{flex:none;width:46px;border:0;background:none;color:var(--text-3);display:grid;place-items:center;border-radius:0 16px 16px 0;}
.g .fav .ico{width:20px;height:20px;transition:transform .3s var(--spring);}
.g .fav:active .ico{transform:scale(1.4);}
.g .fav.on{color:var(--yellow);}
.g .fav.on .ico{fill:currentColor;}
.g.spot{background:var(--surface-3);box-shadow:0 0 0 3px var(--yellow);transform:scale(1.02);}

/* Tile view (default): compact cards, icon on top, name and players below */
.vbtn{flex:none;width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text-2);}
.vbtn .ico{width:20px;height:20px;}
.vbtn:active{transform:scale(.9);}
.list.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
@media (min-width:560px){.list.tiles{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media (min-width:720px){.list.tiles{grid-template-columns:repeat(5,minmax(0,1fr));}}
@media (min-width:900px){.list.tiles{grid-template-columns:repeat(6,minmax(0,1fr));}}
@media (min-width:1080px){.list.tiles{grid-template-columns:repeat(7,minmax(0,1fr));}}
@media (min-width:1300px){.list.tiles{grid-template-columns:repeat(8,minmax(0,1fr));}}
.tiles .g{display:block;aspect-ratio:1/1;border-radius:18px;overflow:hidden;isolation:isolate;
  /* dark in the middle, shading out to a frame in the game's colour; light themes use a pale tint of the colour and dark text */
  --core:var(--bg);--tile-ink:#fff;--tile-shade:14,10,30;--tile-ts:0 1px 3px rgba(0,0,0,.6);
  background:radial-gradient(75% 75% at 50% 55%,var(--core) 0%,var(--core) 32%,color-mix(in srgb,var(--c) 38%,var(--core)) 62%,var(--c) 92%,color-mix(in srgb,var(--c) 80%,#fff) 100%);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 75%,#fff), inset 0 0 0 4px color-mix(in srgb,var(--c) 70%,#000), 0 4px 0 rgba(0,0,0,.28), 0 10px 22px -10px rgba(0,0,0,.6);}
html[data-theme="light"] .tiles .g,html[data-theme="parchment"] .tiles .g{
  --core:color-mix(in srgb,var(--c) 16%,var(--bg-2));--tile-ink:#1b1733;--tile-shade:255,255,255;--tile-ts:0 1px 2px rgba(255,255,255,.9);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 75%,#fff), inset 0 0 0 4px color-mix(in srgb,var(--c) 80%,#000), 0 4px 0 color-mix(in srgb,var(--c) 60%,#000), 0 10px 22px -10px rgba(0,0,0,.35);}
.tiles .g:hover{filter:brightness(1.07);}
.tiles .g .go{position:absolute;inset:0;display:block;padding:0;border-radius:18px;}
/* The game's icon sits big in the middle of the tile, the name across the top, players and the favourite star along the foot */
.tiles .g .gicon{position:absolute;left:1%;top:6%;width:98%;height:98%;z-index:-1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));transition:transform .35s var(--spring);}
@media (max-width:559px){.tiles .g .gicon{left:6%;top:12%;width:88%;height:88%;}}
.tiles .g.wrap2 .gicon{left:9%;top:18%;width:82%;height:82%;}
@media (max-width:559px){.tiles .g.wrap2 .gicon{left:11%;top:22%;width:78%;height:78%;}}
.tiles .g:hover .gicon{transform:scale(1.04) rotate(-1.5deg);}
.tiles .g .go:active .gicon{transform:scale(.96);}
/* shade in from the top-left and bottom-left corners, under the name and the player count */
.tiles .g .go::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(95% 46% at 0% 0%,rgba(var(--tile-shade),.9) 0%,rgba(var(--tile-shade),.68) 40%,rgba(var(--tile-shade),0) 100%),
    radial-gradient(78% 38% at 0% 100%,rgba(var(--tile-shade),.95) 0%,rgba(var(--tile-shade),.78) 42%,rgba(var(--tile-shade),0) 100%);}
.tiles .g .txt{position:absolute;left:10px;right:8px;top:9px;bottom:9px;z-index:1;display:flex;flex-direction:column;justify-content:space-between;gap:3px;}
.tiles .g .txt b{font-size:1.02rem;line-height:1.08;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--tile-ink);text-shadow:var(--tile-ts);}
.tiles .g .txt small{display:none;}
.tiles .g .txt b.long{font-size:.9rem;letter-spacing:0;}
.tiles .g .txt b.two{font-size:.96rem;}
.tiles .g .meta{font-size:.74rem;}
.tiles .g .meta .ico{width:13px;height:13px;}
.tiles .g .live{font-size:.64rem;padding:3px 8px;align-self:flex-start;}
.tiles .g .meta{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;color:var(--tile-ink);text-shadow:var(--tile-ts);}
.tiles .g .fav{position:absolute;bottom:0;right:0;z-index:2;width:40px;height:40px;border-radius:50%;color:var(--tile-ink);}
.tiles .g .fav .ico{width:18px;height:18px;filter:drop-shadow(var(--tile-ts));}
.tiles .g .fav:not(.on){opacity:.6;}
.tiles .g .fav.on{color:var(--yellow);}
.tiles .g.spot{transform:scale(1.04);}

/* Favorites: its own shelf, set apart from the category sections */
.sec.favs{margin-top:18px;padding:14px 12px 14px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,200,61,.12),rgba(255,200,61,.03));
  box-shadow:inset 0 0 0 1px rgba(255,200,61,.28);}
.sec.favs .sec-h h2{color:var(--yellow);}
.sec.favs .sec-h .ico{color:var(--yellow);fill:var(--yellow);}
.sec.favs + .sec{margin-top:28px;}
/* Arranging favorites: the tiles wiggle; drag one to a new spot; Done (or a tap outside) ends it */
.sec.favs .wig-done{display:none;margin-left:auto;border:0;border-radius:999px;padding:6px 14px;background:var(--yellow-fill,var(--yellow));color:#2b1a00;font-weight:900;font-size:.85rem;cursor:pointer;}
.sec.favs.wiggle .wig-done{display:inline-block;}
.sec.favs.wiggle .list > .g{animation:wig .26s ease-in-out infinite alternate;animation-delay:var(--wd,0ms);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;}
.sec.favs.wiggle .list > .g.lift{animation:none;z-index:5;transform:scale(1.08);box-shadow:0 12px 28px rgba(0,0,0,.5);cursor:grabbing;}
.sec.favs .list > .g{-webkit-touch-callout:none;}
@keyframes wig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@media (prefers-reduced-motion:reduce){.sec.favs.wiggle .list > .g{animation:none;outline:2px dashed rgba(255,200,61,.6);outline-offset:-2px;}}

/* Keep playing: compact overview, 5-6 games visible at once */
.cont-w{position:relative;min-width:0;display:flex;align-items:stretch;touch-action:pan-y;--rv:0;}
/* The tile narrows (it doesn't slide off) so its icon and name stay put and tidy */
.cont-w .cont{position:relative;z-index:1;flex:none;touch-action:pan-y;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;width:calc(100% - var(--rv) * 1px);
  transition:width .32s var(--spring), box-shadow .25s;will-change:width;}
.cont-w.drag .cont{transition:none;}
.cont-w.open .cont{box-shadow:inset 3px 0 0 var(--c), 0 0 0 1px var(--w08);}
.cont-w .cont .a{transition:opacity .2s;}
/* Opening: the icon tucks away and the name gets the room, so nothing is squeezed */
.cont-w .cont .gicon{transition:width .32s var(--spring), margin .32s var(--spring), opacity .2s;}
.cont-w.open .cont{gap:0;padding-left:12px;}
.cont-w.open .cont .gicon{width:0;opacity:0;margin-right:0;}
.cont-w.open .cont .r1 .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:.88rem;line-height:1.15;}
.cont-w.open .cont .d{display:none;}
.cont-w.open .cont .a{display:none;}
.cont-w.open .cont .a,.cont-w.drag .cont .a{opacity:0;}
/* Trash: a rounded red button that grows into the freed space */
.cont-del{position:absolute;top:0;right:0;bottom:0;width:52px;border:0;border-radius:14px;padding:0;display:grid;place-items:center;
  background:linear-gradient(180deg,#ff5a6b,#e0243c);color:#fff;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 6px 16px -6px rgba(224,36,60,.7);
  opacity:min(1, calc(var(--rv) / 40));transform:scale(calc(.55 + .45 * min(1, var(--rv) / 60)));transform-origin:right center;
  transition:opacity .25s, transform .32s var(--spring);pointer-events:none;}
.cont-w.drag .cont-del{transition:none;}
.cont-w.open .cont-del{pointer-events:auto;}
.cont-del:active{transform:scale(.92);}
.cont-del .ico{width:22px;height:22px;}
.rail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
@media (min-width:720px){.rail{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (min-width:1100px){.rail{grid-template-columns:repeat(4,minmax(0,1fr));}}
.cont{--c:#ffc83d;position:relative;min-width:0;width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px 8px 8px;border-radius:14px;
  background:var(--surface);color:var(--text);text-decoration:none;box-shadow:inset 3px 0 0 var(--c);transition:transform .15s var(--spring), background .15s;}
.cont:hover{background:var(--surface-2);}
.cont:active{transform:scale(.97);}
.cont .gicon{width:34px;height:34px;flex:none;}
.cont .tx{flex:1;min-width:0;}
.cont .t{font-weight:800;font-size:.95rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cont .r1{display:flex;align-items:baseline;gap:6px;}
.cont .r1 .t{flex:1;min-width:0;}
.cont .a{flex:none;font-size:.7rem;font-weight:800;color:var(--text-3);}
.cont .d{font-size:.75rem;color:var(--text-2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cont-net{box-shadow:inset 3px 0 0 var(--c), inset 0 0 0 1.5px color-mix(in srgb,var(--yellow) 70%,transparent);}
.cont-net .d{color:var(--yellow);}
/* Edit: every tile shows its trash, plus Clear all */
.sec-h .cont-edit{margin-left:auto;min-height:34px;padding:0 15px;border:0;border-radius:999px;background:var(--w08);color:var(--text);font:inherit;font-weight:800;font-size:.86rem;cursor:pointer;}
.sec-h .cont-edit.on{background:var(--yellow-fill,var(--yellow));color:#16102e;}
.sec-h .cont-edit:active{transform:scale(.96);}
.rail.editing .cont-w{animation:cont-in .25s ease both;}
@keyframes cont-in{from{transform:scale(.97)}to{transform:none}}
.rail.editing .cont{cursor:default;}
.rail.editing .cont-net{opacity:.45;pointer-events:none;}
.rail.editing .cont:active{transform:none;}
.cont-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;}
.cont-foot:empty{display:none;}
.cont-foot{margin-top:10px;}
.cont-clear{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 16px;border:0;border-radius:999px;background:color-mix(in srgb,#e0243c 14%,transparent);color:#e0243c;font:inherit;font-weight:800;font-size:.86rem;cursor:pointer;box-shadow:inset 0 0 0 1px color-mix(in srgb,#e0243c 40%,transparent);}
html:not([data-theme="light"]):not([data-theme="parchment"]) .cont-clear{color:#ff8a96;}
.cont-clear .ico{width:16px;height:16px;}
.cont-undo{display:inline-flex;align-items:center;gap:10px;min-height:38px;padding:0 6px 0 14px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-weight:700;font-size:.86rem;}
.cont-undo button{min-height:30px;padding:0 12px;border:0;border-radius:999px;background:var(--w08);color:var(--text);font:inherit;font-weight:900;cursor:pointer;}
.rail-more{grid-column:1/-1;justify-self:center;border:0;background:none;color:var(--text-2);font-weight:800;font-size:.85rem;padding:6px 12px;}

.empty{display:none;text-align:center;padding:50px 20px;color:var(--text-2);}
.empty .e{font-size:3rem;margin-bottom:8px;}
.empty.show{display:block;}
.foot{text-align:center;color:var(--text-3);font-size:.8rem;font-weight:700;margin-top:36px;}

/* Mode chooser */
.pick{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
.pick button{display:flex;align-items:center;gap:14px;padding:16px;border:0;border-radius:var(--r-lg);text-align:left;color:var(--text);
  background:var(--surface-2);box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .1s, box-shadow .1s;}
.pick button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3);}
.pick-note{margin:2px 4px 0;font-size:.82rem;line-height:1.35;}
.pick button.resume{box-shadow:inset 0 0 0 2px var(--yellow);}
.pick button.resume .e{background:var(--yellow-fill,var(--yellow));color:#16102e;}
.pick .e{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--w08);color:var(--text-2);flex:none;}
.pick .e .ico{width:24px;height:24px;}
.pick .t{font-weight:900;font-size:1.1rem;}
.pick .d{color:var(--text-2);font-size:.9rem;}

/* Mode chooser header */
.pick-h{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.pick-h .gicon{width:64px;height:64px;flex:none;}
.pick-h b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;}
.pick-h span{color:var(--text-2);font-size:.92rem;}

/* Recent games */
.recent{display:flex;flex-direction:column;gap:6px;}
.rg{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-radius:var(--r);background:var(--w06);color:var(--text);text-align:left;}
.rg:active{transform:scale(.98);}
.rg .gicon{width:42px;height:42px;flex:none;}
.rg .grow{display:flex;flex-direction:column;min-width:0;}
.rg b{font-weight:900;}
.rg .w{font-size:.9rem;font-weight:700;color:var(--yellow);}
.rg small{font-size:.78rem;color:var(--text-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rg .when{flex:none;font-size:.78rem;font-weight:800;color:var(--text-3);}

/* Account sheet */
.acct{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.acct .avatar{--c:var(--yellow);}
.acct .t{font-weight:900;font-size:1.15rem;}
.acct .d{color:var(--text-2);font-size:.9rem;}

/* Linked with someone: full-screen moment */
.lkm{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 24px calc(var(--safe-b) + 24px);text-align:center;
  background:radial-gradient(120% 80% at 50% 38%,color-mix(in srgb,var(--accent) 30%,var(--bg)) 0%,var(--bg) 70%);opacity:0;transition:opacity .3s;}
.lkm.show{opacity:1;}
.lkm-pair{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.lkm-them{display:flex;}
.lkm-them .lkm-av + .lkm-av{margin-left:-26px;}
.lkm .lkm-av{width:108px;height:108px;font-size:2.6rem;color:#fff;border:4px solid var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .55s var(--spring);}
.lkm .lkm-me{transform:translateX(-46px) rotate(-8deg);}
.lkm .lkm-them{transform:translateX(46px) rotate(8deg);transition:transform .55s var(--spring);}
.lkm.show .lkm-me,.lkm.show .lkm-them{transform:none;}
.lkm-link{position:relative;z-index:1;display:grid;place-items:center;width:54px;height:54px;margin:0 -18px;border-radius:50%;background:#ffc83d;color:#2a1d00;
  box-shadow:0 0 0 5px var(--bg),0 8px 18px rgba(0,0,0,.3);transform:scale(0) rotate(-90deg);transition:transform .45s var(--spring) .45s;}
.lkm.show .lkm-link{transform:none;animation:lkmRing 1.4s ease-out .9s 2;}
.lkm-link .ico{width:28px;height:28px;stroke-width:2.6;}
@keyframes lkmRing{0%{box-shadow:0 0 0 5px var(--bg),0 0 0 5px color-mix(in srgb,var(--yellow) 70%,transparent);}100%{box-shadow:0 0 0 5px var(--bg),0 0 0 34px color-mix(in srgb,var(--yellow) 0%,transparent);}}
.lkm-t{font-size:1.5rem;font-weight:800;line-height:1.15;color:var(--text-2);opacity:0;transform:translateY(12px);transition:opacity .4s .55s,transform .5s var(--spring) .55s;}
.lkm-t b{display:block;font-family:var(--display);font-weight:400;font-size:2.8rem;color:var(--text);margin-top:4px;}
.lkm-s{max-width:300px;color:var(--text-2);font-weight:700;opacity:0;transition:opacity .4s .8s;}
.lkm-ok{min-width:180px;margin-top:10px;opacity:0;transition:opacity .4s 1s;}
.lkm.show .lkm-t,.lkm.show .lkm-s,.lkm.show .lkm-ok{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){.lkm *{transition-duration:.01ms!important;animation:none!important;}}
</style>

<body>
<div class="home">
  <header class="top">
    <button class="logo" id="logo" type="button" aria-label="Game Night"></button>
    <div class="who">
      <div class="hi" id="hi">Hi there</div>
      <h1>Game Night</h1>
    </div>
    <button class="vbtn" id="view" type="button"></button>
    <button class="me" id="me" type="button" aria-label="Account">G</button>
  </header>

  <div class="filters k-stick" id="filters">
    <div class="srow">
      <div class="search" id="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Find a game" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Find a game">
        <button class="x" id="qx" type="button" aria-label="Clear search">✕</button>
      </div>
      <button class="btn btn-yellow surprise" id="surprise" type="button" aria-label="Surprise me: spin a wheel to pick a game"><span class="d" id="surprise-ic"></span><span class="lbl">Surprise</span></button>
    </div>
    <div class="chips" id="chips" role="tablist" aria-label="Categories"></div>
    <button class="dlbtn" id="dlbtn" type="button" hidden></button>
  </div>

  <section class="sec" id="cont-sec" hidden>
    <div class="sec-h"><h2>Keep playing</h2><span class="n" id="cont-n"></span><button type="button" class="cont-edit" id="cont-edit" hidden>Edit</button></div>
    <div class="rail" id="rail"></div>
    <div class="cont-foot" id="cont-foot"></div>
  </section>

  <div id="list"></div>
  <div class="empty" id="empty">No games match that. Try another search.</div>
  <div class="foot">games.timbrown.xyz</div>
</div>

<script src="diag.js" defer></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var el = Kit.el;
  var LS = (function () { try { return localStorage; } catch (e) { return null; } })();
  function get(k, d) { try { var v = LS.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function set(k, v) { try { LS.setItem(k, v); } catch (e) {} if (window.FGHSync && FGHSync.noteWrite) FGHSync.noteWrite(k); }

  var state = { cat: get('gn_home_cat', 'all'), who: get('gn_home_who', 'any'), q: '' };

  // ── Favourites (hrefs like "games/hearts-ai.html", shared with sync) ──────
  function favList() { try { var a = JSON.parse(get('fav_games', '[]')); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function isFav(g) {
    var f = favList();
    return [g.play, g.score, g.id].some(function (k) { return k && f.indexOf('games/' + k + '.html') >= 0; });
  }
  // Where a game sits in your favorites (the order you arranged them in)
  function favIndex(g) {
    var f = favList(), best = 1e9;
    [g.play, g.score, g.id].forEach(function (k) { var i = k ? f.indexOf('games/' + k + '.html') : -1; if (i >= 0 && i < best) best = i; });
    return best;
  }
  function toggleFav(g) {
    var f = favList(), keys = [g.play, g.score, g.id].filter(Boolean).map(function (k) { return 'games/' + k + '.html'; });
    var on = isFav(g);
    f = f.filter(function (h) { return keys.indexOf(h) < 0; });
    if (!on) f.push('games/' + g.play + '.html');
    set('fav_games', JSON.stringify(f)); set('fav_games_updated_at', String(Date.now()));
    try { if (window.FGHSync && FGHSync.noteWrite) FGHSync.noteWrite('fav_games'); } catch (e) {}
    return !on;
  }

  // ── Filtering ─────────────────────────────────────────────────────────────
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function fitsWho(g) {
    if (state.who === 'any') return true;
    var n = +state.who, max = g.max === 0 ? 99 : g.max;
    if (n === 3) return max >= 3;
    return g.min <= n && max >= n;
  }
  function fitsQ(g) {
    if (!state.q) return true;
    var hay = norm(g.name + ' ' + g.tag + ' ' + g.cat);
    return norm(state.q).split(/\s+/).every(function (t) { return hay.indexOf(t) >= 0; });
  }
  function visibleGames() { return GAMES.filter(function (g) { return fitsWho(g) && fitsQ(g); }); }

  // ── Game rows ─────────────────────────────────────────────────────────────
  var resumeMap = {};
  try { resumeMap = JSON.parse(get('gn_resume', '{}')) || {}; } catch (e) {}
  function players(g) { return g.max === 0 ? g.min + '+' : g.min === g.max ? String(g.min) : g.min + '–' + g.max; }
  function badge(g) {
    return resumeMap[g.id] ? el('span', { class: 'live', text: 'Resume' }) : el('span', { class: 'meta', html: Kit.icon(g.max === 1 ? 'user' : 'users') + '<span>' + players(g) + '</span>' });
  }
  var tiles = get('gn_home_view', 'tiles') !== 'list';
  function row(g) {
    var fav = isFav(g);
    // the tile frame is one colour per section (the icon keeps the game's own shade)
    var cat = GAME_CATS.filter(function (x) { return x.id === g.cat; })[0];
    var r = el('div', { class: 'g', 'data-id': g.id, style: { '--c': cat ? 'hsl(' + cat.hue + ' ' + cat.sat + '% 46%)' : g.color } });
    var go = el('button', { type: 'button', class: 'go', 'aria-label': g.name + '. ' + g.tag + '. ' + players(g) + ' players' }, [
      el('span', { html: GameIcon(g.id, { bare: tiles }), style: { display: 'contents' } }),
      el('span', { class: 'txt' }, [el('b', { text: g.name, class: /\S{10,}/.test(g.name) ? 'long' : g.name.length > 11 ? 'two' : '' }), el('small', { text: g.tag })].concat(tiles ? [badge(g)] : [])),
    ].concat(tiles ? [] : [badge(g)]));
    go.addEventListener('click', function () { launch(g); });
    var star = el('button', { type: 'button', class: 'fav' + (fav ? ' on' : ''), 'aria-label': fav ? 'Remove ' + g.name + ' from favorites' : 'Add ' + g.name + ' to favorites', 'aria-pressed': String(fav), html: Kit.icon('star') });
    star.addEventListener('click', function () {
      var on = toggleFav(g); Kit.haptic('success'); Kit.sfx(on ? 'good' : 'tap');
      Kit.toast(on ? g.name + ' added to favorites' : g.name + ' removed from favorites');
      render();
    });
    r.appendChild(go); r.appendChild(star);
    return r;
  }

  // ── Launch (with "phone or real game?" for games that have a scorekeeper) ─
  // fresh: a new game, so the players filter (Just me / Two of us / Three or more) goes along as ?np= for its setup screen
  function go(file, fresh) {
    Kit.sfx('pop'); var h = String(file).split('#'), f = /\.html/.test(h[0]) ? h[0] : h[0] + '.html';
    if (fresh && state.who && state.who !== 'any') f += (f.indexOf('?') >= 0 ? '&' : '?') + 'np=' + state.who;
    location.href = 'games/' + f + (h[1] ? '#' + h[1] : '');
  }
  // Lorcana's cards lean and catch the light with the phone's tilt: iPhone asks for motion access
  // from a tap, so ask when Lorcana is tapped here (once; a yes is remembered for the game).
  function askMotion() {
    try {
      if (localStorage.getItem('lorc_tilt') || typeof DeviceOrientationEvent === 'undefined' || typeof DeviceOrientationEvent.requestPermission !== 'function') return;
      localStorage.setItem('lorc_tilt_asked', '1');
      DeviceOrientationEvent.requestPermission().then(function (r) { if (r === 'granted') localStorage.setItem('lorc_tilt', '1'); }).catch(function () {});
    } catch (e) {}
  }
  function launch(g) {
    Kit.haptic('light');
    if (g.id === 'lorcana') askMotion();
    // a game already going: offer to pick it up (or start fresh) instead of dropping straight in
    var live = null; try { live = (JSON.parse(get('gn_resume', '{}')) || {})[g.id] || null; } catch (e) {}
    if (!g.score && !live) return go(g.play, true);
    Kit.sfx('pop');
    var box = el('div', { class: 'pick' });
    var s;
    function opt(e, t, d, file, cls) {
      box.appendChild(el('button', { type: 'button', class: cls || '', onclick: function () { s.close(); go(file, cls !== 'resume' && cls !== 'tool'); } }, [
        el('span', { class: 'e', html: Kit.icon(e) }), el('span', null, [el('div', { class: 't', text: t }), el('div', { class: 'd', text: d })])
      ]));

        busy = false; s.close(); Kit.haptic('success'); Kit.sfx('good');
        refreshWho();
        Kit.sheet({ title: 'PIN changed', html: '<p class="muted">Your new PIN is <b class="pin-big">' + np + '</b>. Use it to sign in on your other devices. Any phone still signed in with the old PIN will be signed out the next time it opens the app.' +
          (r && r.retired === false ? '<br><br>The old PIN still holds a copy of your scores for now. It will be cleared once the app updates.' : '') + '</p>',
          actions: [{ label: 'Done', primary: true }] });
      }).catch(function (e) { busy = false; Kit.haptic('error'); say((e && e.message) || 'Couldn’t change your PIN. Check your connection and try again.', true); });
    }
    var body = el('div', { class: 'pin-ch' }, [
      el('p', { class: 'muted', text: forced
        ? 'Your PIN ' + FGHSync.pin() + ' is one of the most common PINs, so it’s easy for someone else to guess. Pick a new one. Your scores, history and settings move with you.'
        : 'Your scores, history and settings move to the new PIN. Other phones signed in with your current PIN will be signed out and can sign in again with the new one.' }),
      a, b, msg
    ]);
    var acts = [{ label: 'Change PIN', primary: true, keep: true, onClick: go }];
    acts.push(forced ? { label: 'Sign out instead', cls: 'btn-ghost', onClick: function () { FGHSync.signOut(); location.replace('./gate.html'); } } : { label: 'Cancel', cls: 'btn-ghost' });
    s = Kit.sheet({ title: forced ? 'Choose a safer PIN' : 'Change PIN', node: body, actions: acts, dismissible: !forced });
    setTimeout(function () { a.focus(); }, 350);
  }
  // On a PIN that's now too easy to guess: ask for a new one once the account has synced
  if (mode === 'pin' && FGHSync.weakPin && FGHSync.weakPin(FGHSync.pin() || '')) {
    (FGHSync.onReady || function (f) { f(); })(function () { if (FGHSync.isPin() && FGHSync.weakPin(FGHSync.pin() || '')) setTimeout(function () { changePinSheet(true); }, 600); });
  }

  $('me').addEventListener('click', function () {
    Kit.sfx('pop');
    var lbl = mode === 'pin' ? (FGHSync.label() || '') : '';
    var node = el('div'), s;
    // One header: you (avatar + name, both editable here), with the account underneath
    var mn = typeof FrequentPlayers !== 'undefined' && FrequentPlayers.myName ? FrequentPlayers.myName() : '';
    var myIn = el('input', { class: 'acct-name', maxlength: 14, placeholder: 'Your name', value: mn || '', autocomplete: 'off', 'aria-label': 'Your name' });
    function saveName() { var v = myIn.value.trim(); if (v && v !== mn && FrequentPlayers.setMyName) { FrequentPlayers.setMyName(v); mn = v; refreshWho(); } return v; }
    myIn.addEventListener('change', saveName);
    myIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') myIn.blur(); });
    function editMine() { var v = saveName() || mn; if (!v) { Kit.toast('Type your name first'); myIn.focus(); return; } s.close(); Kit.avatar.edit(v, refreshWho); }
    var acct = el('div', { class: 'acct-d' }, [el('span', { text: mode === 'pin' ? 'PIN ' + FGHSync.pin() + ' · your account, on all your devices' : 'Guest · scores stay on this device' })]);
    node.appendChild(el('div', { class: 'acct' }, [
      el('button', { type: 'button', class: 'av-btn', 'aria-label': 'Change your avatar', onclick: editMine }, [Kit.avatar.el(mn || '?', 'lg', 'var(--surface-3)')]),
      el('div', { class: 'grow', style: { 'min-width': '0' } }, [el('label', { class: 'acct-nm' }, [myIn, el('span', { class: 'acct-pen', 'aria-hidden': 'true', html: Kit.icon('pencil') })]), acct])
    ]));
    var list = el('div', { class: 'k-list', style: { 'margin-top': '14px' } });
    function item(ic, t, fn, cls, extra) { list.appendChild(el('button', { type: 'button', class: cls || '', onclick: function () { s.close(); fn(); } }, [el('span', { class: 'ic', html: Kit.icon(ic) }), el('span', { text: t }), extra || null])); }
    var reqs = linkReqs();
    if (reqs.length) item('link', reqs[0].name + ' wants to link with you', function () { Kit.links.request(reqs[0].id, refreshWho); }, 'hl');
    var nPend = window.FGHSync && FGHSync.linkPending ? FGHSync.linkPending().length : 0;
    if (nPend) item('inbox', nPend + (nPend === 1 ? ' game' : ' games') + ' to review', function () { Kit.links.review(refreshWho); }, 'hl');
    item('history', 'Game history', function () { location.href = 'games/history.html'; });
    if (mode === 'pin') {
      item('link', 'Share my profile', function () { Kit.links.profile(); });
      var ini = FGHSync.initials ? FGHSync.initials() : '';
      item('gamepad', 'Arcade initials', function () { Kit.links.initials(); }, '', el('span', { class: 'k-ini', text: ini || 'Set' }));
    }
    item('users', 'Frequent players', function () { Kit.managePlayers(); });
    item('sliders', 'Preferences', function () { Kit.prefs(); });
    // Linked players: their own section, then the rest of the settings
    if (mode === 'pin' && Kit.links.panel) {
      node.appendChild(list);
      node.appendChild(el('div', { class: 'label k-sec', text: 'Linked players' }));
      node.appendChild(Kit.links.panel(refreshWho));
      list = el('div', { class: 'k-list', style: { 'margin-top': '14px' } });
    }
    item('palette', 'Theme', function () { Kit.theme.pick(); }, '', el('span', { class: 'k-ini', text: Kit.theme.name() }));
    item(get('gn_sound', '1') === '1' ? 'sound' : 'mute', 'Sound: ' + (get('gn_sound', '1') === '1' ? 'on' : 'off'), function () {
      set('gn_sound', get('gn_sound', '1') === '1' ? '0' : '1'); Kit.sfx('good');
    });
    if (mode === 'pin') {
      item('sync', 'Sync now', function () { if (FGHSync.syncNow) FGHSync.syncNow(); Kit.toast('Syncing…'); });
      if (FGHSync.changePin) item('key', 'Change PIN', function () { changePinSheet(false); });
      item('pulse', 'Sync diagnostics', function () { window.openSyncDiagnostics && openSyncDiagnostics(); });
    }
    item('logout', mode === 'pin' ? 'Sign out' : 'Sign in with a PIN', function () {
      if (FGHSync.signOut) FGHSync.signOut(); location.replace('./gate.html');
    }, mode === 'pin' ? 'danger' : '');
    node.appendChild(list);
    s = Kit.sheet({ node: node, actions: [{ label: 'Done', cls: 'btn-ghost' }] });
  });

  // ── Recent games: the last 10 finished games across every game ───────────
  // History keys (gh_<key>) that don't match a game id directly.
  var GH_GAME = { sol: 'solitaire', fc: 'freecell', ht: 'hearts', sp: 'spades', gin: 'gin-rummy', rm: 'gin-rummy', eu: 'euchre',
    wz: 'wizard', f7: 'flip7', fivecrwns: 'five-crowns', rk: 'rook', p10: 'phase10', mg: 'minigolf', dond: 'dealornodeal',
    wof: 'wheeloffortune', c4: 'connectfour', cs_sc: 'scorecard', sc: 'scorecard', mj4: 'mahjong4' };
  // Synced gh_ keys that aren't game results: the casino bankroll ledger (bets and top-ups) and a one-time cleanup flag
  var GH_SKIP = { casino_ledger: 1, dedup_v1: 1 };
  function recentGames() {
    var rows = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i); if (!k || k.indexOf('gh_') !== 0) continue;
        var key = k.slice(3); if (GH_SKIP[key]) continue;
        var g = findGame(GH_GAME[key] || key);
        var list = JSON.parse(localStorage.getItem(k) || '[]');
        if (!Array.isArray(list)) continue;
        list.forEach(function (e) { if (e && e._date) rows.push({ key: key, g: g, e: e }); });
      }
    } catch (e) {}
    rows.sort(function (a, b) { return b.e._date - a.e._date; });
    rows = rows.slice(0, 10);
    var box = el('div', { class: 'recent' }), s;
    if (!rows.length) box.appendChild(el('p', { class: 'muted', text: 'No finished games yet. Results show up here after each game.' }));
    rows.forEach(function (r) {
      var e = r.e, g = r.g, name = g ? g.name : r.key;
      var line = e.winner ? e.winner + ' won' : (e._summary || 'Finished');
      var who = Array.isArray(e.players) ? e.players.map(function (p) { return (p.name || p) + (p.score != null ? ' ' + p.score : ''); }).join(' · ') : '';
      var b = el('button', { type: 'button', class: 'rg' }, [
        el('span', { html: g ? GameIcon(g.id) : '', style: { display: 'contents' } }),
        el('span', { class: 'grow' }, [el('b', { text: name }), el('span', { class: 'w', text: line }), who && who !== line ? el('small', { text: who }) : null]),
        el('span', { class: 'when', text: ago(e._date) })
      ]);
      b.addEventListener('click', function () {
        s.close();
        Kit.sheet({ title: name, node: Kit.historyDetail(e), actions: [
          { label: 'All past ' + name + ' games', cls: 'btn-soft', onClick: function () { Kit.history(r.key, { title: name + ': past games' }); } },
          { label: 'Close', cls: 'btn-ghost' }] });
      });
      box.appendChild(b);
    });
    s = Kit.sheet({ title: 'Recent games', node: box, actions: [{ label: 'Done', cls: 'btn-soft' }] });
  }

  document.addEventListener('fghsync:updated', function () { render(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) render(); openDailyIfAsked(); });
  render();
  // a daily puzzle's win screen sends players back here with "Daily puzzles": reopen the list
  function openDailyIfAsked() {
    var go = false; try { go = sessionStorage.getItem('fgh_open_daily') === '1'; sessionStorage.removeItem('fgh_open_daily'); } catch (e) {}
    if (location.hash === '#daily') { go = true; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    try { sessionStorage.removeItem('fgh_from_daily'); } catch (e) {}
    if (go && window.Daily) setTimeout(function () { Daily.open(); }, 60);
  }
  openDailyIfAsked();
})();
</script>
</body>
</html>

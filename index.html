  box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.65),0 0 20px rgba(255,190,60,.16);animation:none;position:relative;}
/* (the edge brightens and dims by the opacity of a second, brighter edge laid over it, which the compositor fades on its
   own: animating the box-shadow itself repainted the page every frame for as long as it was your turn somewhere) */
:root:not(.ng-x) .nbar.turn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.86),0 0 26px rgba(255,190,60,.17);animation:ngTurn 2.6s ease-in-out infinite;}
@keyframes ngTurn{50%{opacity:1;}}
:root:not(.ng-x) .nbar.turn b{color:var(--text);}
:root:not(.ng-x) .nbar.turn small{color:var(--text-2);}
:root:not(.ng-x) .nbar .yt{padding:0 2px;background:none;color:var(--lit-ink);text-transform:none;letter-spacing:0;font-size:.84rem;font-weight:700;}
:root:not(.ng-x) .nbar .yt span{text-box:normal;}
:root:not(.ng-x) .nbar .yt i{background:var(--lit);box-shadow:0 0 8px var(--litg);}
:root:not(.ng-x) .nbar .pl{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 18px -10px rgba(255,190,60,.6);}
:root:not(.ng-x) .nbar.wait{opacity:.85;}
@media (prefers-reduced-motion:reduce){:root:not(.ng-x) .nbar.turn,:root:not(.ng-x) .nbar.turn::after{animation:none;}}
:root:not(.ng-x) #cont-n.yt-n{color:var(--lit-ink);font-weight:700;}
:root:not(.ng-x) .sec-h .cont-edit{border-radius:12px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);font-weight:700;}
:root:not(.ng-x) .sec-h .cont-edit.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);box-shadow:none;}
:root:not(.ng-x) .cont-undo{border-radius:14px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);}
:root:not(.ng-x) .cont-undo button{border-radius:10px;}
:root:not(.ng-x) .cont-clear{border-radius:14px;}

/* section headings: a small glowing bar in the category's color, the name, the count at the right */
:root:not(.ng-x) .sec{margin-top:22px;}
:root:not(.ng-x) .sec-h{gap:9px;margin:0 2px 10px;min-height:34px;}
:root:not(.ng-x) .sec-h::before{content:"";flex:none;width:4px;height:17px;border-radius:2px;background:var(--h,var(--lit));box-shadow:0 0 10px var(--h,var(--lit));}
:root:not(.ng-x) .sec-h > span:first-child{display:none;}
:root:not(.ng-x) .sec-h h2{font-family:var(--display);font-weight:800;font-size:1.16rem;letter-spacing:-.02em;}
:root:not(.ng-x) .sec.favs .sec-h h2{color:var(--text);}
:root:not(.ng-x) .sec-h .n{margin-left:auto;padding:0;background:none;color:var(--text-2);font-size:.84rem;font-weight:500;white-space:nowrap;}
:root:not(.ng-x) .sec-h .n:not(:empty) ~ *{margin-left:0;}
/* the section's pencil: quiet until pressed, a full-size target with a small mark */
.sec-h .sec-ed{flex:none;display:grid;place-items:center;width:36px;height:36px;margin:-4px -6px -4px -4px;border:0;border-radius:12px;background:none;color:var(--text-3);opacity:.6;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.sec-h .sec-ed .ico{width:16px;height:16px;}
.sec-h .sec-ed:active{opacity:1;background:var(--gl-2,rgba(255,255,255,.1));transform:scale(.92);}
@media (hover:hover){.sec-h .sec-ed:hover{opacity:1;}}
@media (max-width:460px){:root:not(.ng-x) .sec-console > .sec-h .cs-head{margin-left:auto;}}
:root:not(.ng-x) .sec-h .hs-link{border-radius:12px;background:rgba(255,211,77,.12);color:var(--lit-ink);box-shadow:inset 0 0 0 1px rgba(255,211,77,.35);font-weight:700;}
:root:not(.ng-x) .sec-h .hs-link .ico{color:var(--lit);}
:root:not(.ng-x) .sec-h .dl-link{background:color-mix(in srgb,hsl(205 78% 62%) 16%,transparent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,hsl(205 78% 62%) 45%,transparent);}
:root:not(.ng-x) .sec-h .dl-link .ico{color:hsl(205 78% 62%);}
:root:not(.ng-x) .sec-h .dl-link b{font-weight:700;}
:root:not(.ng-x) .cs-sort{border-radius:12px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);}
:root:not(.ng-x) .cs-sort button{border-radius:9px;font-weight:700;}
:root:not(.ng-x) .cs-sort button.on{background:rgba(255,211,77,.16);color:var(--lit-ink);box-shadow:inset 0 0 0 1px rgba(255,211,77,.55);}
:root:not(.ng-x) .cs-div span{text-transform:none;letter-spacing:0;font-size:.86rem;font-weight:600;color:var(--text-2);}
:root:not(.ng-x) .sec-h .bank .bank-br{border-radius:10px;}
:root:not(.ng-x) .sec-h .bank button:not(.bank-amt):not(.bank-br){border-radius:10px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);}
/* Favorites: a section like the others, its bar gold, each game keeping its own category's color */
:root:not(.ng-x) .sec.favs{margin-top:22px;padding:0;border-radius:0;background:none;box-shadow:none;}
:root:not(.ng-x) .sec.favs + .sec{margin-top:22px;}
:root:not(.ng-x) .sec.arr .wig-done{border-radius:12px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);font-weight:750;}

/* the games: one row each, many columns of rows where there is room */
:root:not(.ng-x) .list.rows{grid-template-columns:minmax(0,1fr);gap:7px;}
@media (min-width:640px){:root:not(.ng-x) .list.rows{grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:8px 10px;}}
:root:not(.ng-x) .g.gr{align-items:center;min-height:58px;border-radius:20px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--h) 22%,transparent),rgba(255,255,255,.05) 70%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 40%,rgba(255,255,255,.1)),0 10px 24px -18px rgba(0,0,0,.9);}
:root:not(.ng-x) .g.gr:hover{background:linear-gradient(135deg,color-mix(in srgb,var(--h) 30%,transparent),var(--gl) 70%);}
:root:not(.ng-x) .g.gr .go{align-self:stretch;align-items:center;gap:11px;padding:8px 2px 8px 8px;border-radius:20px;}
:root:not(.ng-x) .g.gr .go:active{transform:scale(.985);}
:root:not(.ng-x) .g.gr .gi{flex:none;position:relative;width:42px;height:42px;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 8px 18px -10px rgba(0,0,0,.8);transition:transform .35s var(--spring);}
:root:not(.ng-x) .g.gr .gi .gicon{display:block;width:100%;height:100%;transform:none;}
:root:not(.ng-x) .g.gr .gi .gicon.ct-ic{border-radius:0;box-shadow:none;}
:root:not(.ng-x) .g.gr:hover .gi{transform:rotate(-4deg) scale(1.05);}
:root:not(.ng-x) .g.gr .go:active .gi{transform:scale(.9) rotate(-6deg);}
:root:not(.ng-x) .g.gr .tx{flex:1 1 auto;min-width:auto;display:flex;flex-direction:column;}
:root:not(.ng-x) .g.gr .tx b{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.15;letter-spacing:-.015em;}
:root:not(.ng-x) .g.gr .tx small{margin-top:2px;font-size:.8rem;font-weight:500;line-height:1.2;color:var(--text-2);}
:root:not(.ng-x) .g.gr .lv{flex:0 1 auto;min-width:0;max-width:min(10.5em,44%);display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-style:normal;text-align:right;font-size:.8rem;font-weight:550;line-height:1.25;color:var(--text-2);}
:root:not(.ng-x) .g.gr .lv:empty{display:none;}
:root:not(.ng-x) .g.gr .lv.y{color:var(--lit-ink);font-weight:700;text-shadow:0 0 12px rgba(255,190,60,.25);}
:root:not(.ng-x) .g.gr .fav{width:38px;align-self:stretch;border-radius:0 20px 20px 0;color:var(--text-3);}
:root:not(.ng-x) .g.gr .fav .ico{width:17px;height:17px;}
:root:not(.ng-x) .g.gr .fav:not(.on){opacity:.55;}
:root:not(.ng-x) .g.gr .fav.on{color:var(--lit);opacity:1;filter:drop-shadow(0 0 6px var(--litg));}
:root:not(.ng-x) .ppl{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:auto;color:var(--text-2);font-size:.8rem;font-weight:650;line-height:1;font-variant-numeric:tabular-nums;}
:root:not(.ng-x) .ppl:empty{display:none;}
:root:not(.ng-x) .ppl .ico{width:14px;height:14px;flex:none;color:color-mix(in srgb,var(--h) 55%,#fff);}
/* the tile view (the view button at the top): an app grid where each game's own colorful icon is the tile (Tim,
   2026-11-15: "the main game tiles should focus more on the colorful tiles -- all that empty space looks not fun to look
   through"). No glass box: the icon stands large on the sky with a glow of its category's color under it, the name
   under the icon, how many play on a small pill at the icon's lower corner, the star beside its upper corner and a
   game waiting on you a gold light on its other corner. Three across on a phone, more where there is room. */
:root:not(.ng-x) .list.rows.gtiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 6px;}
@media (min-width:520px){:root:not(.ng-x) .list.rows.gtiles{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:18px 8px;}}
:root.tl2:not(.ng-x) .list.rows.gtiles{row-gap:8px;}   /* (the names' second line of room is space enough between the rows) */
@media (min-width:520px){:root.tl2:not(.ng-x) .list.rows.gtiles{row-gap:12px;}}
:root:not(.ng-x) .g.gr.tl{container-type:inline-size;--ti:min(66cqw,92px);--tp:7px;--tfs:.88rem;position:relative;align-items:stretch;min-height:0;border-radius:18px;background:none;box-shadow:none;}
:root:not(.ng-x) .g.gr.tl:hover{background:none;}
:root:not(.ng-x) .g.gr.tl .go{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:var(--tp) 2px 4px;border-radius:18px;width:100%;text-align:center;}
:root:not(.ng-x) .g.gr.tl .go:active{transform:none;}
:root:not(.ng-x) .g.gr.tl .gi{width:var(--ti);height:var(--ti);border-radius:calc(var(--ti) * .24);
  box-shadow:0 0 0 1px rgba(255,255,255,.16),0 14px 24px -14px color-mix(in srgb,var(--h) 85%,transparent),0 7px 14px -8px rgba(0,0,0,.75);}
:root:not(.ng-x) .g.gr.tl .tx{display:contents;}
:root:not(.ng-x) .g.gr.tl .tx b{width:100%;padding:0 1px;font-size:var(--tfs);line-height:1.15;overflow-wrap:normal;word-break:normal;text-wrap:balance;}
:root:not(.ng-x) .g.gr.tl .tx b.l1{font-size:.8rem;}
.nw{white-space:nowrap;}
/* every tile the same height (Tim, 2026-11-15: "make sure that all of the game tiles heights are all the same height"),
   and no taller than it must be ("make all the game tiles tighter"): the name has one line of room, or two on every tile
   when some name on the screen needs two at this width (markWraps sets html.tl2) */
:root:not(.ng-x) .g.gr.tl .tx b{min-height:calc(var(--tfs) * 1.15);}
:root.tl2:not(.ng-x) .g.gr.tl .tx b{min-height:calc(var(--tfs) * 2.3);}
/* how many play: a small pill of smoked glass hung on the icon's lower right corner */
:root:not(.ng-x) .g.gr.tl .ppl{position:absolute;z-index:2;top:calc(var(--tp) + var(--ti) - 15px);right:calc(50% - var(--ti) / 2 - 7px);margin:0;gap:3px;height:20px;padding:0 7px 0 5px;border-radius:999px;
  background:rgba(13,13,32,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.17),0 3px 8px rgba(0,0,0,.45);
  color:#fff;font-size:.68rem;font-weight:700;line-height:1;white-space:nowrap;}
:root:not(.ng-x) .g.gr.tl .ppl .ico{width:11px;height:11px;color:color-mix(in srgb,var(--h) 45%,#fff);}
/* (what is happening in a game stays on its sheet; a game waiting on you is a gold light on the icon's upper left corner) */
:root:not(.ng-x) .g.gr.tl .lv{display:none;}
:root:not(.ng-x) .g.gr.tl .lv.y{display:block;position:absolute;z-index:2;top:calc(var(--tp) - 4px);left:calc(50% - var(--ti) / 2 - 4px);width:12px;height:12px;max-width:none;padding:0;border-radius:50%;font-size:0;
  background:var(--lit);box-shadow:0 0 0 2px #141430,0 0 12px var(--litg);}
/* the star stands in the room beside the icon's upper right corner (its tap area reaches 44px with the ::after below) */
:root:not(.ng-x) .g.gr.tl .fav{position:absolute;top:calc(var(--tp) - 8px);left:calc(75% + var(--ti) / 4 - 17px);width:34px;height:34px;border-radius:12px;align-self:auto;}
:root:not(.ng-x) .g.gr.tl .fav .ico{width:15px;height:15px;}
@media (max-width:359px){:root:not(.ng-x) .g.gr.tl{--ti:min(68cqw,92px);--tp:6px;--tfs:.8rem;} :root:not(.ng-x) .g.gr.tl .go{gap:7px;} :root:not(.ng-x) .g.gr.tl .fav .ico{width:13px;height:13px;}
  :root:not(.ng-x) .g.gr.tl .ppl{height:18px;padding:0 6px 0 4px;font-size:.62rem;right:calc(50% - var(--ti) / 2 - 5px);top:calc(var(--tp) + var(--ti) - 13px);} :root:not(.ng-x) .g.gr.tl .ppl .ico{width:10px;height:10px;}}
/* a console game is its cartridge, in its console's own plastic, standing in the icon's place (the tile and list views
   alike, the label's picture whole on the cartridge instead of cropped to a square) */
:root:not(.ng-x) .g.gr .gi.gi-ct{display:grid;place-items:center;overflow:visible;border-radius:0;background:none;box-shadow:none;}
:root:not(.ng-x) .g.gr .gi.gi-ct .gicon.mini-ct{position:relative;display:block;width:88%;height:100%;filter:drop-shadow(0 5px 7px rgba(0,0,0,.5));}
:root:not(.ng-x) .g.gr .gi.gi-ct .gicon.mini-ct.ct-snes{width:100%;}
/* (a Genesis cartridge is wider than it is tall, as the real one is: Tim, 2026-11-15; it stands on the same floor) */
:root:not(.ng-x) .g.gr .gi.gi-ct .gicon.mini-ct.ct-genesis{width:100%;height:80%;}
:root:not(.ng-x) .g.gr.tl .gi.gi-ct .gicon.mini-ct.ct-genesis{align-self:end;}
.mini-ct.ct-genesis .ct-lab{left:17%;right:17%;top:7%;}
.mini-ct.ct-genesis .ct-body::after{content:"";position:absolute;left:24%;right:24%;bottom:5%;height:9%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.13) 0 1px,transparent 1px 3px);border-radius:2px;}
:root:not(.ng-x) .g.gr.tl .gi.gi-ct .gicon.mini-ct{filter:drop-shadow(0 9px 10px rgba(0,0,0,.55));}
@media (max-width:359px){:root:not(.ng-x) .g.gr .go{gap:9px;} :root:not(.ng-x) .g.gr .lv{max-width:46%;font-size:.76rem;} :root:not(.ng-x) .g.gr .fav{width:32px;}}
/* every list row the same shape (Tim, 2026-11-15: "verify tile and detail views"): the name has the row's whole width on
   the first line, and what is happening in the game (gold when it waits on you) sits on the second line at the right,
   level with how many play, instead of squeezing the name onto two lines */
:root:not(.ng-x) .g.gr:not(.tl) .go{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"gi nm nm" "gi pl lv";column-gap:11px;row-gap:2px;align-items:center;}
:root:not(.ng-x) .g.gr:not(.tl) .go > :first-child{grid-area:gi;}
:root:not(.ng-x) .g.gr:not(.tl) .tx{display:contents;}
:root:not(.ng-x) .g.gr:not(.tl) .tx b{grid-area:nm;align-self:end;}
:root:not(.ng-x) .g.gr:not(.tl) .tx small{grid-area:pl;align-self:start;margin-top:0;}
:root:not(.ng-x) .g.gr:not(.tl) .lv{grid-area:lv;align-self:start;max-width:none;flex-direction:row;flex-wrap:nowrap;gap:8px;white-space:nowrap;}
:root:not(.ng-x) .g.gr:not(.tl) .lv:empty{display:none;}
:root:not(.ng-x) .g.gr:not(.tl) .tx small{min-width:0;}
/* (and when a row still needs more room at this width, every row takes that height: markWraps sets --row-h) */
:root:not(.ng-x) #list .g.gr:not(.tl){min-height:var(--row-h,0px);}
:root:not(.ng-x) .sec.wiggle .list > .g.lift{box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.6),0 16px 30px rgba(0,0,0,.55);}

/* friends' open tables: a gold-ringed glass banner */
:root:not(.ng-x) .otb{border-radius:20px;background:linear-gradient(160deg,rgba(255,211,77,.13),var(--gl) 62%);
  box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.6),0 0 20px rgba(255,190,60,.16);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
:root:not(.ng-x) .otb.in{animation:otbIn .55s var(--spring) both;}
/* an online game's row on a narrow phone: the gold ring, the pulsing dot and the play button say it is your turn, and
   the words Your turn give their room to who you are playing and when the last move was (nothing cut off at 320) */
@media (max-width:370px){ .nbar .yt > span{display:none;} .nbar .tx small{white-space:normal;text-overflow:clip;} }
:root:not(.ng-x) .otb.ping{animation:otbPing .5s var(--spring);}
:root:not(.ng-x) .otb-tx b{font-weight:750;}
:root:not(.ng-x) .otb-tx small{font-weight:550;}
:root:not(.ng-x) .otb-avs .avatar{box-shadow:0 0 0 2.5px #1d1d2c;}
:root:not(.ng-x) .otb-go{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);}
:root:not(.ng-x) .ots-r{border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,transparent),var(--gl) 70%);box-shadow:inset 0 0 0 1px var(--gl-line);}
:root:not(.ng-x) .ots-r .tx b{font-family:var(--display);font-weight:800;}
:root:not(.ng-x) .ots-join{border-radius:12px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);}

/* a game's sheet: glass rows, Quick start and a game to go back to ringed in gold, the setup's Players card in the
   category's color */
:root:not(.ng-x) .pick button{border-radius:18px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);}
:root:not(.ng-x) .pick button:active{transform:scale(.985);box-shadow:inset 0 0 0 1px var(--gl-line);}
:root:not(.ng-x) .pick .e{border-radius:12px;background:var(--gl-3);color:var(--lit-ink);}
:root:not(.ng-x) .pick .t{font-weight:750;}
:root:not(.ng-x) .pick .d{color:var(--text-2);}
:root:not(.ng-x) .pick button:is(.quick,.resume){background:linear-gradient(160deg,rgba(255,211,77,.13),var(--gl) 60%);box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.6),0 0 18px rgba(255,190,60,.14);}
:root:not(.ng-x) .pick button.join{background:linear-gradient(160deg,color-mix(in srgb,var(--h) 22%,transparent),var(--gl) 62%);box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.6),0 0 20px rgba(255,190,60,.18);}
:root:not(.ng-x) .pick button:is(.quick,.resume,.join) .e{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);}
:root:not(.ng-x) .pick button.alt{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-3);}
:root:not(.ng-x) .pick.gsheet button.gs-who{background:linear-gradient(160deg,color-mix(in srgb,var(--h) 18%,transparent),var(--gl) 62%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 42%,rgba(255,255,255,.1)),0 10px 24px -16px rgba(0,0,0,.9);}
:root:not(.ng-x) .gs-who-go{border-radius:10px;}
/* the Players card in two rows (Tim, 2026-11-15: "the header section of top should only be reserved for the word players
   and the +/- for the number of players"): the title across the top, beside the − and +; the people icon, the players and
   the arrow on the row under it, the icon and the arrow level with the middle of the players */
:root:not(.ng-x) .pick.gsheet button.gs-who{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"t t t" "e c go";align-items:center;column-gap:12px;row-gap:6px;}
:root:not(.ng-x) .gs-who > .tx{display:contents;}
:root:not(.ng-x) .gs-who > .tx > .t{grid-area:t;}
/* the title is a label over the players (kit.css, .k-who .k-who-t) */
:root:not(.ng-x) .pick.gsheet .gs-who > .tx > .t{font-size:.95rem;font-weight:700;color:color-mix(in srgb,var(--h,#8b7cff) 38%,var(--text-2,#c6c4da));}
:root:not(.ng-x) .gs-who > .tx > :not(.t){grid-area:c;min-width:0;margin-top:0;}
:root:not(.ng-x) .gs-who > .e{grid-area:e;margin:0;}
:root:not(.ng-x) .gs-who > .gs-who-go{grid-area:go;}
/* with a count to change, the count stands under the title at the left and the players have the rest of the card, as in
   every game's setup (kit.css; Tim, 2026-11-16). The people icon steps aside; the stepper's top is the card's padding,
   the title's 28px row and the gap (45px), its left the card's margin and padding */

   along its top, the name in white and how many play in the quieter gray under it.

   on an iPad mini, 2026-11-16. The art stops at the band's top edge, and under the band's tint lies the game's glow, the
   part of its art under the band blurred and saturated as the live blur did, from one picture made beforehand

:root.look:not(.ng-x) .g.gr.tl .ppl,:root.look:not(.ng-x) .g.gr.tl .lv.y{padding:0 10px;}

:root.look:not(.ng-x) .g.gr.tl .gi.gi-ct{place-items:start end;}
:root.look:not(.ng-x) .g.gr.tl .gi.gi-ct .gicon.mini-ct{width:74cqw;height:92cqw;align-self:start;margin:-14cqw -6cqw 0 0;transform:rotate(-10deg);}
:root.look:not(.ng-x) .g.gr.tl .gi.gi-ct .gicon.mini-ct.ct-genesis{width:92cqw;height:74cqw;margin:-10cqw -12cqw 0 0;}
:root.look:not(.ng-x) .g.gr.tl .gi.gi-ct .gicon.mini-ct.ct-snes{width:86cqw;height:86cqw;margin-top:-12cqw;}
:root.look:not(.ng-x) .sbox .art .gicon{left:auto;top:auto;right:-30cqw;top:-36cqw;width:156cqw;height:156cqw;transform:rotate(-12deg);}
:root.look:not(.ng-x) .sbox:active .art .gicon{transform:rotate(-16deg) scale(.95);}
:root.look:not(.ng-x) .sbox.ct .art .gicon.mini-ct{left:auto;right:-14cqw;top:-18cqw;width:86cqw;height:112cqw;transform:rotate(-12deg);}
:root.look:not(.ng-x) .sbox.ct .art .gicon.mini-ct.ct-genesis{width:106cqw;height:86cqw;right:-24cqw;}
:root.look:not(.ng-x) .sbox.ct .art .gicon.mini-ct.ct-nes{top:-4cqw;}
:root.look:not(.ng-x) .sbox.ct .art .gicon.mini-ct.ct-snes{width:104cqw;height:92cqw;top:-4cqw;right:-26cqw;}
:root.look:not(.ng-x) .sbox.ct .art .gicon.mini-ct.ct-atari2600{top:-4cqw;}
:root.look:not(.ng-x) .g.gr.tl .gi.gi-ct .gicon.mini-ct.ct-nes{margin-top:4cqw;}
/* (an Atari cartridge is narrow and nearly all label: it comes in further from the corner and larger, so it fills its tile as the others do) */
:root.look:not(.ng-x) .g.gr.tl .gi.gi-ct .gicon.mini-ct.ct-atari2600{width:64cqw;height:80cqw;margin:-4cqw 5cqw 0 0;}
:root.look:not(.ng-x) .sbox .ago{left:auto;right:auto;}
:root.look:not(.ng-x) .sbox,:root.look:not(.ng-x) .shelf.two .sbox{background:linear-gradient(to top,rgba(6,4,20,.62),rgba(6,4,20,.18) 48%,transparent 66%),linear-gradient(150deg,var(--gc1),var(--gc2) 85%);}
:root.look:not(.ng-x) .sbox.ct{background:linear-gradient(to top,rgba(6,4,20,.62),rgba(6,4,20,.18) 48%,transparent 66%),radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--h) 34%,#1d2236),#10131f 80%);}
:root.look:not(.ng-x) .sbox .nm,:root.look:not(.ng-x) .sbox .nm.two{background:linear-gradient(180deg,rgba(24,22,46,.84),rgba(15,14,32,.92));-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.13);text-shadow:none;}
/* (no live blur: the game's baked glow lies under the name's tint, as under a tile's band) */
:root.look:not(.ng-x) .sbox.gl .nm,:root.look:not(.ng-x) .sbox.gl .nm.two{background:linear-gradient(180deg,rgba(24,22,46,.84),rgba(15,14,32,.92)),var(--glow) 0 0 / var(--gls) no-repeat;}
:root.look:not(.ng-x) .sbox .art::after{display:block;z-index:0;height:60%;background:linear-gradient(to top,rgba(6,4,20,.55),rgba(6,4,20,.2) 50%,transparent);}
/* (the art lies over the shade, never under it, so every game's art is as bright as its own icon: Tim, 2026-11-15, "I don't
   want that dark haze over the logos"; the words keep a shadow of their own where they cross the art) */
:root.look:not(.ng-x) .sbox .art .gicon{z-index:1;}
:root.look:not(.ng-x) .sbox .nm .st{display:flex;flex-direction:column;margin-top:4px;padding:0;color:var(--text-2);text-shadow:none;font-size:.74rem;font-weight:550;line-height:1.25;}
:root.look:not(.ng-x) .sbox .nm .st > span:first-child,:root.look:not(.ng-x) .sbox .nm .st.one{color:color-mix(in srgb,var(--text) 86%,var(--text-2));font-weight:650;}
:root.look:not(.ng-x) .sbox .nm .st > span + span{color:var(--text-2);font-weight:550;font-size:1em;}
:root.look:not(.ng-x) .sbox .nm .st > span{white-space:nowrap;}
:root.look:not(.ng-x) .sbox .nm .bn{display:block;}
:root.look:not(.ng-x) .sbox .nm,:root.look:not(.ng-x) .sbox .nm.two{justify-content:flex-start;padding-top:9px;}
:root.look:not(.ng-x) .sbox .art{aspect-ratio:1/.66;}
:root.look:not(.ng-x) .sbox .art::after{display:none;}
:root.look:not(.ng-x) .sbox.old .art,:root.look:not(.ng-x) .sbox.old .art .gicon{filter:none;}
/* (Tim, 2026-11-16: "adjust the bottom part of keep playing tiles to fit game names up to two lines long. move the
   details into the bottom left of the colorful top part"): the glass foot holds the name alone, always two lines tall so
   every card's foot is the same, and where you are stands at the lower left of the card's color, over the stamped art */
:root.look:not(.ng-x) .sbox .art{aspect-ratio:1/.66;justify-content:flex-end;padding:0 10px 5px;}
:root.look:not(.ng-x) .sbox .art::after,:root.look:not(.ng-x) .sbox.ct .art::after{display:block;z-index:1;inset:auto 0 0 0;height:62%;background:linear-gradient(to top,rgba(8,6,24,.58),rgba(8,6,24,.3) 45%,transparent);}
:root.look:not(.ng-x) .sbox .nm,:root.look:not(.ng-x) .sbox .nm.two{flex:none;height:calc(.86rem * 2.3 + 18px);justify-content:center;padding:9px 10px;}
:root.look:not(.ng-x) .sbox .art .st,:root.look:not(.ng-x) .sbox.ct .art .st{position:relative;z-index:2;display:flex;flex-direction:column;align-self:stretch;margin:0;padding:0;color:#fff;font-size:.76rem;font-weight:650;line-height:1.22;text-shadow:0 1px 2px rgba(0,0,0,.4);}
:root.look:not(.ng-x) .sbox .art .st > span:first-child,:root.look:not(.ng-x) .sbox .art .st.one{color:#fff;font-weight:750;}
:root.look:not(.ng-x) .sbox .art .st > span + span{color:rgba(255,255,255,.88);font-weight:600;font-size:1em;}
:root.look:not(.ng-x) .sbox .art .st > span{white-space:nowrap;}
:root.look:not(.ng-x) .sbox.old .art .gicon{filter:drop-shadow(-4px 8px 10px rgba(0,0,0,.3));}

:root.look:not(.ng-x) :is(.sbox,.sbox.ct) :is(.st,.ago){z-index:2;}

/* ── Keep playing: the foot is two lines on every card, the name and where you are (Tim, 2026-11-21: "should always be
   one line for the game name, one line for the 'where you are'"; fitFoot fits them, .n3 is a row with a name on two
   lines). Sized in the name's em, so a desk's larger cards (--dk-kf) step it all up together. ── */
:root.look:not(.ng-x) .sbox .nm,:root.look:not(.ng-x) .sbox .nm.two{flex:none;display:flex;flex-direction:column;justify-content:center;gap:0;height:calc(2.29em + 20px);padding:10px 10px;}
:root.look:not(.ng-x) .shelf.n3 .sbox .nm{height:calc(3.47em + 20px);}
:root.look:not(.ng-x) .sbox .nm .bn{display:block;white-space:nowrap;overflow:hidden;line-height:1.18;}
:root.look:not(.ng-x) .sbox .nm .bn.w2{white-space:normal;max-height:2.36em;}
:root.look:not(.ng-x) .sbox .nm .st.ft{display:block;flex:none;margin:1px 0 0;padding:0;white-space:nowrap;overflow:hidden;font-family:var(--font);font-size:.884em;font-weight:650;line-height:1.25;letter-spacing:0;color:color-mix(in srgb,var(--text) 80%,var(--text-2));text-shadow:none;}
/* (the art, with nothing over it now: no shade at its foot) */
:root.look:not(.ng-x) .sbox:not(.snap) .art::after,:root.look:not(.ng-x) .sbox.ct:not(.snap) .art::after{display:none;}
/* ── A card with a picture of the table as it was left (gn_snap_<id>: snapOf): the picture fills the color part, the
   game's icon small at its top left with a thin white ring, how long ago at the top right over a soft shade. One plain
   <img> decoded off the main thread; nothing live over it (an old picture's gray is a still filter on it alone). ── */
:root.look:not(.ng-x) .sbox.snap .art{background:#0b0d18;padding:0;}
:root.look:not(.ng-x) .sbox.snap .art .shot{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;-webkit-user-drag:none;}
:root.look:not(.ng-x) .sbox.snap.old .art .shot{filter:saturate(.4) brightness(.86);}
:root.look:not(.ng-x) .sbox.snap .art::after{display:block;z-index:1;inset:0 0 auto 0;height:48%;background:linear-gradient(rgba(5,5,16,.55),rgba(5,5,16,.18) 55%,transparent);}
:root.look:not(.ng-x) .sbox.snap .kbadge{position:absolute;z-index:2;left:7px;top:7px;width:30px;height:30px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.88),0 3px 8px rgba(0,0,0,.5);}
:root.look:not(.ng-x) .sbox.snap .art .kbadge svg.gicon{position:static;inset:auto;width:100%;height:100%;margin:0;display:block;transform:none;filter:none;border-radius:0;}
:root.look:not(.ng-x) .sbox.snap .art .kbadge svg.gicon > rect:nth-of-type(-n+2){display:inline;}
:root.look:not(.ng-x) .sbox.snap .kbadge.ct{background:var(--gcg);display:grid;place-items:center;}
:root.look:not(.ng-x) .sbox.snap.ct .art .kbadge .gicon.mini-ct{position:static;inset:auto;width:19px;height:25px;margin:0;transform:rotate(-8deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
:root.look:not(.ng-x) .sbox.snap.ct .art .kbadge .gicon.mini-ct.ct-genesis{width:25px;height:20px;}
:root.look:not(.ng-x) .sbox.snap.ct .art .kbadge .gicon.mini-ct.ct-snes{width:24px;height:22px;}
:root.look:not(.ng-x) .sbox.snap .ago,:root.look:not(.ng-x) .sbox.snap.ct .ago{left:auto;right:9px;top:8px;}
:root.hdk.look:not(.ng-x) .sbox.snap .kbadge{width:calc(30px * var(--dk-kf,1));height:calc(30px * var(--dk-kf,1));border-radius:calc(9px * var(--dk-kf,1));}

/* ── The game's own art stamped faintly into a tile's empty color (Tim, 2026-11-16, chosen from three textures:
   "definitely do art stamped in but more subtle"): the icon very large and turned the other way at the lower left, its
   light parts pressed in darker and its dark marks lighter, the stamp's lower edge catching the light. Paint in the
   tile's own layer: nothing that changes, nothing moving. A console game keeps its plain tile, its cartridge's label
   fills that part of it. ── */
:root.look:not(.ng-x) .g.gr.tl .emb{grid-row:1;grid-column:1;z-index:0;position:relative;overflow:hidden;pointer-events:none;}
:root.look:not(.ng-x) .sbox .art .emb{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
:root.look:not(.ng-x) .g.gr.tl .emb > svg.gicon,:root.look:not(.ng-x) .sbox .art .emb > svg.gicon{position:absolute;inset:auto auto -52cqw -34cqw;width:120cqw;height:120cqw;margin:0;z-index:auto;transform:rotate(16deg);opacity:var(--emb-o,.05);
  filter:grayscale(1) invert(1) drop-shadow(0 -1px 0 #000) drop-shadow(0 1px 0 #fff);}
:root.look:not(.ng-x) .sbox .art .emb > svg.gicon{inset:auto auto -46cqw -30cqw;width:104cqw;height:104cqw;}
:root.look:not(.ng-x) .emb > svg.gicon > rect:nth-of-type(-n+2){display:none;}

/* ==/LOOKS== */

/* ==DESK== The home screen in a large window (a computer: html.hdk, set by deskHome() only in a window no phone or tablet
   has, so their pixels never change). The page takes the window's width; a tile is sized from the window (--dk-tw,
   124 to 216px, the columns filling the width exactly) with its words stepping up with it (--dk-f); the sections lie
   side by side where they fit in whole tile columns (--sp, deskLay), so a section of four games doesn't leave a row of
   air; the search, the kinds, Daily puzzles, open tables and Surprise stand in one bar; Keep playing lays every game in
   progress out at once, larger than a tile, and the online games share the row's width. Nothing scales the page. */
:root.hdk .home{max-width:none;padding-left:var(--dk-pad,32px);padding-right:var(--dk-pad,32px);}
:root.hdk .filters{margin-left:calc(0px - var(--dk-pad,32px));margin-right:calc(0px - var(--dk-pad,32px));padding-left:var(--dk-pad,32px);padding-right:var(--dk-pad,32px);}
:root.hdk:not(.ng-x) #list{display:grid;grid-template-columns:repeat(var(--dk-cols,8),var(--dk-tw,124px));column-gap:var(--dk-g,10px);align-items:start;}
:root.hdk:not(.ng-x) #list > .sec{grid-column:span var(--sp,1);min-width:0;}
:root.hdk:not(.ng-x) #list.dk-rows{display:block;}
:root.hdk:not(.ng-x) #list > .sec.favs + .sec{margin-top:22px;}
:root.hdk.look:not(.ng-x) .list.rows.gtiles{grid-template-columns:repeat(var(--sp,1),var(--dk-tw,124px));gap:calc(var(--dk-g,10px) + 1px) var(--dk-g,10px);}
:root.hdk.look:not(.ng-x).tl2 .list.rows.gtiles{row-gap:calc(var(--dk-g,10px) + 1px);}
:root.hdk:not(.ng-x) .list.rows:not(.gtiles){grid-template-columns:repeat(auto-fill,minmax(calc(256px * var(--dk-f,1)),1fr));}
/* (a tile's words and its foot step up with the tile; the art is drawn in the tile's own units already) */
:root.hdk.look:not(.ng-x) .g.gr.tl{--tfs:calc(.87rem * var(--dk-f,1));--mr:calc(25px * var(--dk-f,1));border-radius:calc(20px * var(--dk-r,1));}
:root.hdk.look:not(.ng-x) .g.gr.tl .tx b{padding-left:calc(9px * var(--dk-f,1));padding-right:calc(9px * var(--dk-f,1));}
:root.hdk.look:not(.ng-x) .g.gr.tl :is(.ppl,.lv.y){height:calc(17px * var(--dk-f,1));padding:0 calc(9px * var(--dk-f,1));font-size:calc(.7rem * var(--dk-f,1));}
:root.hdk.look:not(.ng-x) .g.gr.tl .ppl .ico{width:calc(12px * var(--dk-f,1));height:calc(12px * var(--dk-f,1));}
:root.hdk.look:not(.ng-x) .g.gr.tl .fav{width:calc(44px * var(--dk-r,1));height:calc(44px * var(--dk-r,1));}
:root.hdk.look:not(.ng-x) .g.gr.tl .fav .ico{width:calc(23px * var(--dk-r,1));height:calc(23px * var(--dk-r,1));}
:root.hdk:not(.ng-x) .g.gr:not(.tl) .tx b{font-size:calc(1rem * var(--dk-f,1));}
/* (the bar: one row from 1800 wide; the open tables' banner beside the search instead of over it) */
@media (min-width:1800px){
  :root.hdk:not(.ng-x) .filters{grid-template-columns:minmax(300px,600px) minmax(260px,1fr) auto auto auto;column-gap:12px;align-items:center;}
  :root.hdk:not(.ng-x) .filters .search{grid-column:1;grid-row:1;}
  :root.hdk:not(.ng-x) .filters .chips{grid-column:2;grid-row:1;margin:0;flex-wrap:nowrap;}
  :root.hdk:not(.ng-x) .filters .dlbtn{grid-column:3;grid-row:1;margin:0;align-self:stretch;min-height:48px;}
  :root.hdk:not(.ng-x) .filters .otb{grid-column:4;grid-row:1;width:auto;max-width:560px;min-height:48px;margin:0;padding-top:4px;padding-bottom:4px;}
  :root.hdk:not(.ng-x) .filters .surprise{grid-column:5;grid-row:1;}
  :root.hdk:not(.ng-x) .filters .chips .chip{min-height:48px;border-radius:999px;padding:0 16px 0 14px;}
}
/* Keep playing: every game in progress at once, as cards a step larger than a tile, wrapping instead of sliding */
:root.hdk.look:not(.ng-x) .shelf,:root.hdk.look:not(.ng-x) .shelf.two{display:grid;grid-template-columns:repeat(var(--dk-kc,4),var(--dk-kw,150px));grid-template-rows:none;grid-auto-flow:row;grid-auto-columns:auto;gap:var(--dk-g,10px);overflow:visible;scroll-snap-type:none;}
:root.hdk.look:not(.ng-x) .sbox,:root.hdk.look:not(.ng-x) .shelf.two .sbox{width:auto;border-radius:calc(20px * var(--dk-r,1));}
:root.hdk.look:not(.ng-x) .shelf-more{display:none;}
:root.hdk.look:not(.ng-x) .sbox .nm,:root.hdk.look:not(.ng-x) .sbox .nm.two{font-size:calc(.86rem * var(--dk-kf,1));height:calc(2.29em + 20px);padding-left:calc(10px * var(--dk-kf,1));padding-right:calc(10px * var(--dk-kf,1));}
:root.hdk.look:not(.ng-x) .sbox .art{padding-left:calc(10px * var(--dk-kf,1));padding-right:calc(10px * var(--dk-kf,1));}
:root.hdk.look:not(.ng-x) .sbox .art .st{font-size:calc(.74rem * var(--dk-kf,1));}
:root.hdk.look:not(.ng-x) .sbox .ago{font-size:calc(.72rem * var(--dk-kf,1));}
:root.hdk:not(.ng-x) .nstack{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));}
/* ==/DESK== */
</style>
</head>
<body>
<div class="home">
  <header class="top">
    <button class="logo" id="logo" type="button" aria-label="Game Night"></button>
    <div class="who">
      <div class="hi" id="hi">Hi there</div>
      <h1>Game Night</h1>
    </div>
    <button class="vbtn" id="hedit" type="button" aria-label="Show or hide sections and games"></button>
    <button class="vbtn bell" id="bell" type="button" aria-label="Notifications" hidden><span class="bell-n" id="bell-n" hidden></span></button>
    <button class="me" id="me" type="button" aria-label="Account">G</button>
  </header>

  <div class="filters k-stick" id="filters">
    <button class="otb" id="otb" type="button" hidden><span class="otb-avs" id="otb-avs"></span><span class="otb-tx"><b id="otb-t"></b><small id="otb-s"></small></span><span class="otb-go" id="otb-go"></span></button>
    <div class="srow">
      <div class="search" id="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Find a game" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Find a game">
        <button class="x" id="qx" type="button" aria-label="Clear search">✕</button>
      </div>
      <button class="btn btn-yellow surprise" id="surprise" type="button" aria-label="Surprise me: spin a wheel to pick a game"><span class="d" id="surprise-ic"></span><span class="lbl">Surprise</span></button>
    </div>
    <div class="chips" id="chips" role="tablist" aria-label="Categories"></div>
    <button class="dlbtn" id="dlbtn" type="button" hidden></button>
  </div>

  <section class="sec" id="cont-sec" hidden>
    <div class="sec-h"><span class="kp-ic" id="kp-ic"></span><h2>Keep playing</h2><span class="n" id="cont-n"></span><button type="button" class="sec-ed" id="cont-edit" aria-label="Edit Keep playing" hidden></button></div>
    <div class="rail" id="rail"></div>
    <div class="cont-foot" id="cont-foot"></div>
  </section>

  <div id="list"></div>
  <div class="empty" id="empty">No games match that. Try another search.</div>
  <div class="foot">games.timbrown.xyz</div>
</div>

<script src="diag.js" defer></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var el = Kit.el;
  var LS = (function () { try { return localStorage; } catch (e) { return null; } })();
  function get(k, d) { try { var v = LS.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function set(k, v) { try { LS.setItem(k, v); } catch (e) {} if (window.FGHSync && FGHSync.noteWrite) FGHSync.noteWrite(k); }

  var state = { cats: readCats(), who: get('gn_home_who', 'any'), q: '' };
  if (deskHome()) document.documentElement.classList.add('hdk');   // (a large window, before anything is drawn: ==DESK==)
  // the kinds of games shown (Tim, 2026-11-14: "a multi-select dropdown since there's so much to scroll"): category ids
  // and 'fav'; none chosen is every game. The one kind chosen before (gn_home_cat) carries over once.
  function readCats() {
    try { var a = JSON.parse(get('gn_home_cats', 'null')); if (Array.isArray(a)) return a.filter(function (x) { return typeof x === 'string'; }); } catch (e) {}
    var o = get('gn_home_cat', 'all'); return o && o !== 'all' ? [o] : [];
  }
  function saveCats() { set('gn_home_cats', JSON.stringify(state.cats)); }
  function inCats(g) { return !state.cats.length || state.cats.some(function (id) { return id === 'fav' ? isFav(g) : g.cat === id; }); }

  // ── Favourites (hrefs like "games/hearts-ai.html", shared with sync) ──────
  function favList() { try { var a = JSON.parse(get('fav_games', '[]')); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function isFav(g) {
    var f = favList();
    return [g.play, g.score, g.id].some(function (k) { return k && f.indexOf('games/' + k + '.html') >= 0; });
  }
  // Where a game sits in your favorites (the order you arranged them in)
  function favIndex(g) {
    var f = favList(), best = 1e9;
    [g.play, g.score, g.id].forEach(function (k) { var i = k ? f.indexOf('games/' + k + '.html') : -1; if (i >= 0 && i < best) best = i; });
    return best;
  }
  function toggleFav(g) {
    var f = favList(), keys = [g.play, g.score, g.id].filter(Boolean).map(function (k) { return 'games/' + k + '.html'; });
    var on = isFav(g);

      group('Waiting for you');
      if (pAsk.length) item('shield', pcm.ask[pAsk[0]].name + ' wants to be your parent', function () { Kit.kids.request(pAsk[0]); }, 'hl');
      if (reqs.length) item('link', reqs[0].name + ' wants to link with you', function () { Kit.links.request(reqs[0].id, refreshWho); }, 'hl');
      if (nPend) item('inbox', nPend + (nPend === 1 ? ' game' : ' games') + ' to review', function () { Kit.links.review(refreshWho); }, 'hl');
    }
    // What you've played, the people you play with, how the app looks and behaves, then the account and its sync,
    // help, and signing out last on its own
    group('Play');
    item('history', 'Game history', function () { location.href = 'games/history.html'; });
    if (Kit.playTime) { var pt = Kit.playToday(), pm = Math.round(pt / 60); item('chart', 'Play time', function () { Kit.playTime(); }, '', tag(pm >= 60 ? Math.floor(pm / 60) + ' hr ' + (pm % 60) + ' min today' : pm ? pm + ' min today' : 'None today')); }
    if (Kit.timerSheet) item('clock', 'Game timer', function () { Kit.timerSheet(); }, '', tag(Kit.timerStatus()));
    group('People');
    item('users', 'Frequent players', function () { Kit.managePlayers(); });
    if (mode === 'pin') {
      item('link', 'Share my profile', function () { Kit.links.profile(); });
      var ini = FGHSync.initials ? FGHSync.initials() : '';
      item('gamepad', 'Arcade initials', function () { Kit.links.initials(); }, '', el('span', { class: 'k-ini', text: ini || 'Set' }));
      if (Kit.family) item('shield', 'Family', function () { Kit.family(); }, '', tag(Kit.familyStatus() || 'Parent controls'));
    }
    // Linked players: the people you've linked with, right under People
    if (mode === 'pin' && Kit.links.panel) {
      node.appendChild(list);
      node.appendChild(el('div', { class: 'label k-sec', text: 'Linked players' }));
      node.appendChild(Kit.links.panel(refreshWho));
      list = el('div', { class: 'k-list', style: { 'margin-top': '10px' } });
    }
    group('Home & games');
    if (Kit.homeSheet) item('tiles', 'Home screen', function () { Kit.homeSheet(); }, '', tag(Kit.homeStatus()));
    item(tiles ? 'rows' : 'tiles', tiles ? 'Show games as a list' : 'Show games as tiles', toggleView);
    item('sliders', 'Game defaults', function () { Kit.prefs(); });
    if (Kit.inbox) item('bell', 'Notifications', function () { Kit.inbox(); }, '', Kit.inboxNew() ? el('span', { class: 'k-st bell-st', text: Kit.inboxNew() + ' new' }) : null);
    group('Look & sound');
    item('palette', 'Theme', function () { Kit.theme.pick(); }, '', tag(Kit.theme.name()));
    if (Kit.music) item('headphones', 'Music', function () { Kit.music(); }, '', tag(get('spotify_auth', '') ? 'Spotify' : 'Connect'));
    // sound: a switch that flips right here (the menu stays open)
    var snd = el('button', { type: 'button', class: 'tg', role: 'switch', 'aria-checked': String(get('gn_sound', '1') === '1') }, [el('span', { class: 'ic', html: Kit.icon('sound') }), el('span', { class: 'lbl' }, [el('span', { text: 'Sound effects' })]), el('i', { class: 'sw' })]);
    snd.onclick = function () { var on = get('gn_sound', '1') !== '1'; set('gn_sound', on ? '1' : '0'); snd.setAttribute('aria-checked', String(on)); snd.querySelector('.ic').innerHTML = Kit.icon(on ? 'sound' : 'mute'); if (on) Kit.sfx('good'); };
    if (get('gn_sound', '1') !== '1') snd.querySelector('.ic').innerHTML = Kit.icon('mute');
    grp.appendChild(snd);
    // the account itself: how you sign in
    if (mode === 'pin' && !gacct && (FGHSync.moveToGoogle || FGHSync.changePin)) {
      group('Sign-in');
      if (FGHSync.moveToGoogle) grp.appendChild(el('button', { type: 'button', onclick: function () { s.close(); moveSheet(); } }, [el('span', { class: 'ic', html: G_LOGO }), el('span', { text: 'Move to Google sign-in' })]));
      if (FGHSync.changePin) item('key', 'Change PIN', function () { changePinSheet(false); });
    }
    // keeping this device up to date: syncing, what it did, and saving everything for offline
    group('Sync & offline');
    if (mode === 'pin') item('sync', 'Sync now', function () { if (FGHSync.syncNow) FGHSync.syncNow(); Kit.toast('Syncing…'); }, '', lastSyncTag());
    if (FGHSync.logGet) item('pulse', 'Sync log', activityLog);
    if (Kit.offline) item('plane', 'Offline', function () { Kit.offline(); }, '', tag(+get('fgh_offline_at', '0') ? 'Ready' : 'Save'));
    group('Help');
    item('help', 'How Game Night works', function () { Kit.tour(null, { actions: { move: gacct ? null : function () { moveSheet(); }, changePin: gacct ? null : function () { changePinSheet(false); } } }); });
    grp = el('div', { class: 'k-grp k-out' }); list.appendChild(grp);
    item('logout', mode === 'pin' ? 'Sign out' : 'Sign in', function () {
      if (FGHSync.signOut) FGHSync.signOut(); location.replace('./gate.html');
    }, mode === 'pin' ? 'danger' : '');
    node.appendChild(list);
    s = Kit.sheet({ node: node, actions: [{ label: 'Done', cls: 'btn-ghost' }] });
  });

  // ── Activity log (profile menu) ─────────────────────────────────────────────
  // How long the last sync took, beside Sync now: quick in green, slow in yellow, failed in red
  function syncSpeed(ls) { return !ls ? '' : !ls.ok ? 'bad' : ls.ms >= 8000 ? 'slow' : 'ok'; }
  function lastSyncTag() {
    var ls = FGHSync.lastSync ? FGHSync.lastSync() : null; if (!ls) return null;
    var t = new Date(ls.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return el('span', { class: 'al-tag st2 ' + syncSpeed(ls) }, [el('span', { text: t }), el('small', { text: ls.ok ? (ls.ms / 1000).toFixed(ls.ms < 10000 ? 1 : 0) + ' s' : 'Failed' })]);
  }
  var AL_TAGS = { sync: 'Sync', error: 'Error', warn: 'Warning', online: 'Online', tables: 'Tables', page: 'App', net: 'Network' };
  function appVersion() {
    try { return caches.keys().then(function (k) { return (k.filter(function (n) { return n.indexOf('game-night-') === 0; })[0] || '').replace('game-night-', '') || 'not installed'; }, function () { return '?'; }); } catch (e) { return Promise.resolve('?'); }
  }
  function stamp(ts, full) { var d = new Date(ts), p = function (n) { return ('0' + n).slice(-2); }; return (full ? d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' : '') + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
  function activityLog() {
    var box = el('div', { class: 'al' }), ver = '…';
    function exportText() {
      var ls = FGHSync.lastSync(), lines = [
        'Game Night activity log · ' + stamp(Date.now(), true),
        'Version: ' + ver + ' · ' + (FGHSync.isPin() ? 'signed in with a PIN' : 'guest') + ' · ' + (navigator.onLine ? 'online' : 'offline'),
        'Device: ' + navigator.userAgent + ' · screen ' + screen.width + '×' + screen.height,
        'Storage: ' + (function () { try { var u = FGHSync.storeUse(); return Math.round(u.chars / 1000) + 'k characters in ' + u.keys + ' keys; largest: ' + u.top.map(function (t) { return t[0] + ' ' + Math.round(t[1] / 1000) + 'k'; }).join(', '); } catch (e) { return '?'; } })(),
        'Last sync: ' + (ls ? stamp(ls.at, true) + ' · ' + ls.what + ' · ' + (ls.ok ? (ls.ms / 1000).toFixed(1) + ' s' : 'failed: ' + ls.err) + ' · ' + (ls.steps || []).join(', ') : 'none'),
        ''];
      FGHSync.logGet().forEach(function (r) { lines.push(stamp(r[0], true) + '  ' + (r[1] + '        ').slice(0, 12) + ' ' + (AL_TAGS[r[2]] || r[2]) + ': ' + r[3]); });
      return lines.join('\n');
    }
    function paint() {
      box.innerHTML = '';
      var ls = FGHSync.lastSync(), sp = syncSpeed(ls);
      box.appendChild(el('div', { class: 'al-sum ' + sp }, ls ? [
        el('div', { class: 'al-big' }, [el('b', { text: ls.ok ? (ls.ms / 1000).toFixed(ls.ms < 10000 ? 1 : 0) + ' s' : 'Failed' }), el('span', { text: 'Last sync on ' + new Date(ls.at).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) })]),
        el('div', { class: 'al-steps' }, (ls.steps || []).map(function (st) { var m = /^(.*?) (?:failed after )?([\d.]+) s$/.exec(st) || [0, st, '']; return el('span', { class: /failed/.test(st) ? 'bad' : '' }, [el('i', { text: m[1] }), el('b', { text: m[2] ? m[2] + ' s' : '' })]); })),
        ls.err ? el('div', { class: 'al-err', text: ls.err }) : null
      ] : [el('div', { class: 'al-big' }, [el('b', { text: '–' }), el('span', { text: 'no sync on this device yet' })])]));
      var su = null; try { su = FGHSync.storeUse(); } catch (e) {}
      box.appendChild(el('div', { class: 'al-dev' }, [el('span', { text: 'Version ' + ver }), su ? el('span', { text: 'Storage ' + (su.chars / 1e6).toFixed(2) + ' million characters' }) : null, el('span', { text: navigator.onLine ? 'Online' : 'Offline' })]));
      box.appendChild(el('div', { class: 'al-acts' }, [
        el('button', { type: 'button', class: 'btn btn-primary grow', html: Kit.icon('share') + '<span>Share log</span>', onclick: function () { Kit.sfx('tap'); share(); } }),
        el('button', { type: 'button', class: 'btn btn-soft', text: 'Copy', onclick: function () { Kit.sfx('tap'); copy(); } })
      ]));
      var rows = FGHSync.logGet().slice().reverse(), list = el('div', { class: 'al-list' }), day = '';
      if (!rows.length) list.appendChild(el('p', { class: 'muted', text: 'Nothing logged yet.' }));
      rows.forEach(function (r) {
        var d = new Date(r[0]).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
        if (d !== day) { day = d; list.appendChild(el('div', { class: 'al-day', text: d })); }
        list.appendChild(el('div', { class: 'al-row t-' + r[2] }, [
          el('span', { class: 'al-t', text: stamp(r[0]) }),
          el('span', { class: 'al-k', text: AL_TAGS[r[2]] || r[2] }),
          el('span', { class: 'al-m' }, [el('span', { text: r[3] }), r[1] !== 'home' && r[1] !== 'index' ? el('small', { class: 'al-pg', text: r[1] }) : null])
        ]));
      });
      box.appendChild(list);
      box.appendChild(el('div', { class: 'al-foot' }, [
        el('button', { type: 'button', text: 'Data counts', onclick: function () { if (sh) sh.close(); window.openSyncDiagnostics && openSyncDiagnostics(); } }),
        el('button', { type: 'button', text: 'Clear log', onclick: function () { Kit.confirm('Clear the activity log on this device?', { ok: 'Clear', danger: true }).then(function (ok) { if (ok) { FGHSync.logClear(); paint(); } }); } })
      ]));
    }
    var sh = null;
    paint();
    appVersion().then(function (v) { ver = v; paint(); });
    function share() {
      var txt = exportText(), name = 'game-night-log-' + stamp(Date.now(), true).replace(/[: ]/g, '-') + '.txt';
      try {
        var f = new File([txt], name, { type: 'text/plain' });
        if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: 'Game Night activity log' }).catch(function () {}); return; }
      } catch (e) {}
      if (navigator.share) { navigator.share({ title: 'Game Night activity log', text: txt }).catch(function () {}); return; }
      copy();
    }
    function copy() { try { navigator.clipboard.writeText(exportText()).then(function () { Kit.toast('Log copied'); }, function () { Kit.toast('Couldn’t copy'); }); } catch (e) { Kit.toast('Couldn’t copy'); } }
    sh = Kit.sheet({ title: 'Sync log', node: box, actions: [{ label: 'Close', cls: 'btn-ghost' }] });
  }

  // ── Recent games: the last 10 finished games across every game ───────────
  // History keys (gh_<key>) that don't match a game id directly.
  var GH_GAME = { sol: 'solitaire', fc: 'freecell', ht: 'hearts', sp: 'spades', gin: 'gin-rummy', rm: 'gin-rummy', eu: 'euchre',
    wz: 'wizard', f7: 'flip7', fivecrwns: 'five-crowns', rk: 'rook', p10: 'phase10', mg: 'minigolf', dond: 'dealornodeal',
    wof: 'wheeloffortune', c4: 'connectfour', cs_sc: 'scorecard', sc: 'scorecard', mj4: 'mahjong4' };
  // Synced gh_ keys that aren't game results: the casino bankroll ledger (bets and top-ups) and a one-time cleanup flag
  var GH_SKIP = { casino_ledger: 1, dedup_v1: 1 };
  function recentGames() {
    var rows = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i); if (!k || k.indexOf('gh_') !== 0) continue;
        var key = k.slice(3); if (GH_SKIP[key]) continue;
        var g = findGame(GH_GAME[key] || key);
        var list = JSON.parse(localStorage.getItem(k) || '[]');
        if (!Array.isArray(list)) continue;
        list.forEach(function (e) { if (e && e._date) rows.push({ key: key, g: g, e: e }); });
      }
    } catch (e) {}
    rows.sort(function (a, b) { return b.e._date - a.e._date; });
    rows = rows.slice(0, 10);
    var box = el('div', { class: 'recent' }), s;
    if (!rows.length) box.appendChild(el('p', { class: 'muted', text: 'No finished games yet. Results show up here after each game.' }));
    rows.forEach(function (r) {
      var e = r.e, g = r.g, name = g ? g.name : r.key;
      var line = e.winner ? e.winner + ' won' : (Kit.factParts(e._summary)[0] || 'Finished');
      // (each player and their score as a chip of their own)
      var who = Array.isArray(e.players) && e.players.length ? el('span', { class: 'lk-ps' }, e.players.map(function (p) { return el('span', null, [el('span', { text: p.name || p }), p.score != null ? el('b', { text: String(p.score) }) : null]); })) : null;
      var b = el('button', { type: 'button', class: 'rg' }, [
        el('span', { html: g ? GameIcon(g.id) : '', style: { display: 'contents' } }),
        el('span', { class: 'grow' }, [el('b', { text: name }), el('span', { class: 'w', text: line }), who]),
        el('span', { class: 'when', text: ago(e._date) })
      ]);
      b.addEventListener('click', function () {
        s.close();
        Kit.sheet({ title: name, node: Kit.historyDetail(e), actions: [
          { label: 'All past ' + name + ' games', cls: 'btn-soft', onClick: function () { Kit.history(r.key, { title: name + ': past games' }); } },
          { label: 'Close', cls: 'btn-ghost' }] });
      });
      box.appendChild(b);
    });
    s = Kit.sheet({ title: 'Recent games', node: box, actions: [{ label: 'Done', cls: 'btn-soft' }] });
  }

  document.addEventListener('fghsync:updated', function () { render(true); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) render(true); openDailyIfAsked(); reseatFilters(); });
  // iPad can bring the page back (back from a game, a reload) with the pinned search bar drawn partway down the
  // screen until the next scroll: lay it out again
  function reseatFilters() {
    var f = $('filters'); if (!f) return;
    requestAnimationFrame(function () { f.style.position = 'relative'; void f.offsetHeight; f.style.position = ''; try { window.dispatchEvent(new Event('scroll')); } catch (e) {} });
  }
  window.addEventListener('load', function () { setTimeout(reseatFilters, 300); });
  render();
  // a daily puzzle's win screen sends players back here with "Daily puzzles": reopen the list
  function openDailyIfAsked() {
    var go = false; try { go = sessionStorage.getItem('fgh_open_daily') === '1'; sessionStorage.removeItem('fgh_open_daily'); } catch (e) {}
    if (location.hash === '#daily') { go = true; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    try { sessionStorage.removeItem('fgh_from_daily'); } catch (e) {}
    if (go && window.Daily) setTimeout(function () { Daily.open(); }, 60);
  }
  openDailyIfAsked();
  // a game's Play online review, cancelled after the home screen's sheet sent the player there (#sheet=<game>): that game's
  // sheet opens again, so they are back where they pressed it
  (function () {
    var m = /^#sheet=([\w-]+)$/.exec(location.hash); if (!m) return;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    var g = (window.GAMES || []).filter(function (x) { return x && x.id === m[1]; })[0];
    if (g) setTimeout(function () { launch(g); }, 60);
  })();
})();

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Games</title>
<script>
(function(){
  try {
    var m = localStorage.getItem('fgh_mode');
    if (m === 'pin' || m === 'guest') {
      location.replace('hub.html');
    } else {
      location.replace('gate.html');
    }
  } catch(e){ location.replace('gate.html'); }
})();
</script>

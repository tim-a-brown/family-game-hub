<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="85%">
      <stop offset="0" stop-color="#4a2f9e"/><stop offset=".55" stop-color="#261a5c"/><stop offset="1" stop-color="#140f30"/>
    </radialGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd95a"/><stop offset=".55" stop-color="#ffb52e"/><stop offset="1" stop-color="#ff7f2a"/>
    </linearGradient>
    <linearGradient id="dieSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0711c"/><stop offset="1" stop-color="#b8530f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe7d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a3d" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#07041a" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="170" cy="190" r="7" opacity=".7"/><circle cx="860" cy="160" r="6" opacity=".6"/><circle cx="820" cy="300" r="4" opacity=".5"/>
    <circle cx="230" cy="830" r="5" opacity=".45"/><circle cx="120" cy="560" r="4" opacity=".5"/><circle cx="905" cy="760" r="6" opacity=".5"/>
    <path d="M790 210l10 26 26 10-26 10-10 26-10-26-26-10 26-10z" opacity=".85"/>
    <path d="M250 300l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" opacity=".7"/>
  </g>
  <ellipse cx="540" cy="560" rx="380" ry="330" fill="url(#glow)"/>
  <!-- playing card (Ace of hearts) behind -->
  <g transform="rotate(14 640 470)" filter="url(#sh)">
    <rect x="470" y="210" width="330" height="460" rx="40" fill="url(#card)"/>
    <text x="510" y="300" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="86" fill="#e0263f">A</text>
    <path d="M552 330c-26 0-44 18-44 44 0 36 44 62 44 62s44-26 44-62c0-26-18-44-44-44z" fill="none"/>
    <path transform="translate(512 312) scale(1.6)" d="M12 21s-8.5-5.3-8.5-11.2A4.6 4.6 0 0 1 12 7.1a4.6 4.6 0 0 1 8.5 2.7C20.5 15.7 12 21 12 21z" fill="#e0263f"/>
    <path transform="translate(560 420) scale(6.2)" d="M12 21s-8.5-5.3-8.5-11.2A4.6 4.6 0 0 1 12 7.1a4.6 4.6 0 0 1 8.5 2.7C20.5 15.7 12 21 12 21z" fill="#e0263f"/>
  </g>
  <!-- die in front -->
  <g transform="rotate(-12 420 600)" filter="url(#sh)">
    <rect x="210" y="410" width="420" height="420" rx="96" fill="url(#dieSide)"/>
    <rect x="210" y="386" width="420" height="410" rx="96" fill="url(#die)"/>
    <rect x="236" y="402" width="368" height="120" rx="60" fill="#fff" opacity=".22"/>
    <g fill="#2a1a55">
      <circle cx="320" cy="496" r="40"/><circle cx="520" cy="496" r="40"/>
      <circle cx="420" cy="591" r="40"/>
      <circle cx="320" cy="686" r="40"/><circle cx="520" cy="686" r="40"/>
    </g>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
<title>2048</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
.wrap{max-width:460px;margin:0 auto;}
.page{padding-top:14px;}
.header{display:flex;align-items:stretch;gap:8px;margin-bottom:14px;}
.score-box{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;position:relative;}
.score-lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);}
.score-val{font-family:var(--display);font-size:1.55rem;font-weight:800;color:var(--text);line-height:1.15;font-variant-numeric:tabular-nums;}
.score-box.best .score-val{color:var(--gold);}
.score-add{position:absolute;left:0;right:0;top:4px;font-family:var(--display);font-weight:800;color:var(--gold);font-size:1rem;pointer-events:none;animation:add-up .7s var(--ease) forwards;}
@keyframes add-up{0%{opacity:0;transform:translateY(14px);}25%{opacity:1;}100%{opacity:0;transform:translateY(-18px);}}
#new-btn{flex:0 0 auto;min-height:auto;padding:0 18px;border-radius:14px;}
.board-wrap{position:relative;touch-action:none;-webkit-user-select:none;user-select:none;background:#3a3122;border-radius:18px;padding:10px;margin:0 auto 12px;width:100%;max-width:min(460px,calc(100dvh - 250px));min-width:min(100%,290px);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.cell{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.07);position:relative;container-type:inline-size;}
.tile{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:44cqw;box-shadow:0 2px 0 rgba(0,0,0,.18);}
@keyframes appear{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
@keyframes merge{0%{transform:scale(1);}45%{transform:scale(1.16);}100%{transform:scale(1);}}
.tile.new{animation:appear .18s var(--ease) .06s both;}
.tile.merged{animation:merge .18s var(--spring);z-index:1;}
.t2{background:#eee4da;color:#776e65;}
.t4{background:#ede0c8;color:#776e65;}
.t8{background:#f2b179;color:#fff;}
.t16{background:#f59563;color:#fff;}
.t32{background:#f67c5f;color:#fff;}
.t64{background:#f65e3b;color:#fff;}
.t128,.t256,.t512{font-size:36cqw;}
.t1024,.t2048{font-size:29cqw;}
.t128{background:#edcf72;color:#fff;box-shadow:0 0 18px rgba(237,207,114,.35);}
.t256{background:#edcc61;color:#fff;box-shadow:0 0 20px rgba(237,204,97,.4);}
.t512{background:#edc850;color:#fff;box-shadow:0 0 22px rgba(237,200,80,.45);}
.t1024{background:#edc53f;color:#fff;box-shadow:0 0 26px rgba(237,197,63,.5);}
.t2048{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink);box-shadow:0 0 30px rgba(245,200,66,.6);}
.thigh{background:#3c3a32;color:#fff;font-size:26cqw;}
.overlay{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;background:rgba(11,13,18,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:gn-fade .35s ease both;z-index:5;}
.overlay.win{background:rgba(245,200,66,.28);}
.ov-title{font-family:var(--display);font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1;}
.overlay.win .ov-title{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35);}
.ov-sub{color:var(--text-2);font-weight:600;margin-bottom:12px;}
.overlay.win .ov-sub{color:#fff;}
.ov-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.status{display:none;}
.hint{text-align:center;font-size:.82rem;color:var(--text-3);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">2048</span>
</nav>
<div class="page"><div class="wrap">

<div class="header">
  <div class="score-box"><div class="score-lbl">Score</div><div class="score-val" id="score">0</div></div>
  <div class="score-box best"><div class="score-lbl">Best</div><div class="score-val" id="best">0</div></div>
  <button class="btn btn-gold" id="new-btn">New</button>
</div>

<div class="board-wrap" id="board-wrap">
  <div class="board" id="board"></div>
</div>
<div class="status" id="status"></div>
<div class="hint">Swipe the board or use arrow keys</div>

</div></div>
<script>
'use strict';
let grid=[], score=0, best=parseInt(localStorage.getItem('2048best')||'0'), won=false, over=false;

function newGame(){
  grid=Array.from({length:4},()=>Array(4).fill(0));
  score=0;won=false;over=false;
  addRandom();addRandom();
  render();
  document.getElementById('status').textContent='';
  hideOverlay();
}

function addRandom(){
  const empty=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])empty.push([r,c]);
  if(!empty.length)return;
  const[r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
  return[r,c];
}

function slide(row){
  const arr=row.filter(v=>v);
  const merged=[];
  let i=0;
  while(i<arr.length){
    if(i+1<arr.length&&arr[i]===arr[i+1]){merged.push({val:arr[i]*2,m:true});i+=2;}
    else{merged.push({val:arr[i],m:false});i++;}
  }
  while(merged.length<4)merged.push({val:0,m:false});
  return merged;
}

function move(dir){
  if(over)return false;
  let moved=false;
  const newGrid=Array.from({length:4},()=>Array(4).fill(0));
  const mergedAt=[];

  if(dir==='left'||dir==='right'){
    for(let r=0;r<4;r++){
      let row=grid[r].slice();
      if(dir==='right')row.reverse();
      const res=slide(row);
      for(let c=0;c<4;c++){
        const idx=dir==='right'?3-c:c;
        const v=res[c].val;
        newGrid[r][idx]=v;
        if(v&&v!==grid[r][idx])moved=true;
        if(res[c].m)mergedAt.push([r,idx]);
        if(v)score+=res[c].m?v:0;
      }
    }
  } else {
    for(let c=0;c<4;c++){
      let col=[grid[0][c],grid[1][c],grid[2][c],grid[3][c]];
      if(dir==='down')col.reverse();
      const res=slide(col);
      for(let r=0;r<4;r++){
        const idx=dir==='down'?3-r:r;
        const v=res[r].val;
        newGrid[idx][c]=v;
        if(v&&v!==grid[idx][c])moved=true;
        if(res[r].m)mergedAt.push([idx,c]);
        if(v)score+=res[r].m?v:0;
      }
    }
  }
  if(!moved)return false;
  const gained=mergedAt.reduce((t,[r,c])=>t+newGrid[r][c],0);
  grid=newGrid;
  GN.haptic(mergedAt.length?'medium':'light');
  if(gained)showAdd(gained);
  if(score>best){best=score;localStorage.setItem('2048best',best);}
  const newCell=addRandom();
  render(newCell,mergedAt);
  checkEnd();
  return true;
}

function checkEnd(){
  if(grid.flat().includes(2048)&&!won){
    won=true;
    document.getElementById('status').textContent='You reached 2048! Keep going!';
    GN.haptic('success');
    showOverlay('win','You win!','You reached 2048 · '+score+' pts',[
      {label:'Keep going',cls:'btn-gold',fn:hideOverlay},
      {label:'New game',cls:'btn-outline',fn:startNew}]);
    return;
  }
  // Check moves available
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(!grid[r][c])return;
    if(c<3&&grid[r][c]===grid[r][c+1])return;
    if(r<3&&grid[r][c]===grid[r+1][c])return;
  }
  over=true;
  document.getElementById('status').textContent='Game over!';
  GN.haptic('error');
  showOverlay('lose','Game over',`Score ${score}${score>=best&&score>0?' · New best!':''}`,[
    {label:'Try again',cls:'btn-gold',fn:startNew}]);
}

function tileClass(v){
  if(v<=4)return`t${v}`;
  if(v<=64)return`t${v}`;
  if(v<=2048)return`t${v}`;
  return'thigh';
}

function render(newCell, mergedAt=[]){
  const board=document.getElementById('board');
  board.innerHTML='';
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      const v=grid[r][c];
      if(v){
        const tile=document.createElement('div');
        tile.className='tile '+tileClass(v);
        tile.textContent=v;
        const isNew=newCell&&newCell[0]===r&&newCell[1]===c;
        const isMerged=mergedAt.some(([mr,mc])=>mr===r&&mc===c);
        if(isNew)tile.classList.add('new');
        if(isMerged)tile.classList.add('merged');
        cell.appendChild(tile);
      }
      board.appendChild(cell);
    }
  }
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;
}

function showAdd(n){
  const box=document.getElementById('score').parentElement;
  const el=document.createElement('div');el.className='score-add';el.textContent='+'+n;
  box.appendChild(el);setTimeout(()=>el.remove(),700);
}
function hideOverlay(){document.querySelector('#board-wrap .overlay')?.remove();}
function showOverlay(kind,title,sub,acts){
  hideOverlay();
  const ov=document.createElement('div');ov.className='overlay '+kind;
  ov.innerHTML=`<div class="ov-title">${title}</div><div class="ov-sub">${sub}</div><div class="ov-acts"></div>`;
  acts.forEach(a=>{const b=document.createElement('button');b.className='btn '+a.cls;b.textContent=a.label;
    b.addEventListener('click',a.fn);ov.querySelector('.ov-acts').appendChild(b);});
  document.getElementById('board-wrap').appendChild(ov);
}
function startNew(){try{sessionStorage.removeItem('g2048');}catch(e){}newGame();}

// Keyboard
document.addEventListener('keydown',e=>{
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]){e.preventDefault();move(map[e.key]);}
});

// Swipe (pointer events — works for touch, pen and mouse drags on the board)
const bw=document.getElementById('board-wrap');
let sx=null,sy=null,sid=null;
bw.addEventListener('pointerdown',e=>{
  if(e.target.closest('.overlay'))return;
  sx=e.clientX;sy=e.clientY;sid=e.pointerId;
});
function endSwipe(e){
  if(sid===null||e.pointerId!==sid)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;sid=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
}
bw.addEventListener('pointerup',endSwipe);
bw.addEventListener('pointercancel',()=>{sid=null;});
// Stop the page from scrolling/bouncing while swiping on the board (iOS)
bw.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

document.getElementById('new-btn').addEventListener('click',()=>{
  if(!over&&score>0)GN.confirm('Your current game will be lost.',{title:'Start a new game?',ok:'New game'}).then(ok=>{if(ok)startNew();});
  else startNew();
});

// ── Session persistence ────────────────────────────────────────────────────
function _save_g2048(){if(over){try{sessionStorage.removeItem('g2048');}catch(e){}return;}
  try{sessionStorage.setItem('g2048',JSON.stringify({grid,score,won,over,_ts:Date.now()}));}catch(e){}
}
function _load_g2048(){
  try{
    const raw=sessionStorage.getItem('g2048');if(!raw)return false;
    const s=JSON.parse(raw);if(!s)return false;
    grid=s.grid;score=s.score;won=s.won||false;over=s.over||false;
    if(!Array.isArray(grid)||grid.length!==4)return false;
    render();
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_g2048);
window.addEventListener('pagehide',_save_g2048);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')_save_g2048();});
if(!_load_g2048())newGame();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d12">
<title>Checkers</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
:root{--bs:clamp(260px,min(100vw - 32px,100vh - 340px),520px);}
@supports (height:100dvh){:root{--bs:clamp(260px,min(100vw - 32px,100dvh - 340px),520px);}}
.site-nav button.icon-btn{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;display:inline-grid;place-items:center;}
.icon-btn svg{width:18px;height:18px;}
.gk{width:var(--bs);max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
.gk .tabs{margin:0;}

/* Score / turn tiles */
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pl{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:border-color .25s var(--ease),background .25s,box-shadow .25s;}
.pl.on{border-color:rgba(245,200,66,.5);background:linear-gradient(180deg,rgba(245,200,66,.1),rgba(245,200,66,.02)),var(--surface);box-shadow:0 0 0 3px rgba(245,200,66,.07);}
.pl .chip{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:0 2px 5px rgba(0,0,0,.4),inset 0 0 0 3px rgba(255,255,255,.12);}
.pl .chip.red{background:radial-gradient(circle at 38% 32%,#ff7a6b,#d4322a 55%,#8e1712);}
.pl .chip.black{background:radial-gradient(circle at 38% 32%,#6a6f7a,#2a2d33 55%,#0e0f12);}
.pl .who{flex:1;min-width:0;}
.pl .nm{font-weight:700;font-size:.9rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl .sub{font-size:.74rem;color:var(--text-3);font-weight:600;}
.pl.on .sub{color:var(--gold);}
.pl .val{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1;font-variant-numeric:tabular-nums;}

/* Board */
.board-frame{padding:7px;border-radius:16px;background:linear-gradient(145deg,#5a3a24,#2c1a0e);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);}
.ck-board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:9px;overflow:hidden;touch-action:none;}
.ck-sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;}
.ck-sq.light{background:#ecd3a8;}
.ck-sq.dark{background:#7b4a2b;background-image:linear-gradient(135deg,rgba(255,255,255,.04),rgba(0,0,0,.06));cursor:pointer;}
.ck-sq.last::before{content:'';position:absolute;inset:0;background:rgba(245,200,66,.22);}
.ck-sq.selected::before{content:'';position:absolute;inset:0;background:rgba(245,200,66,.42);}
.ck-sq.can-move::after{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(255,236,190,.5);box-shadow:0 0 0 3px rgba(255,236,190,.15);}
.ck-sq.can-capture::after{content:'';position:absolute;inset:10%;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,120,100,.75);}
.ck-sq.hover-target::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.22);}
.ck-piece{position:relative;z-index:1;width:80%;height:80%;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s var(--spring);pointer-events:none;}
.ck-piece::after{content:'';position:absolute;inset:16%;border-radius:50%;border:2px solid rgba(255,255,255,.14);box-shadow:inset 0 2px 3px rgba(0,0,0,.25);}
.ck-piece.red{background:radial-gradient(circle at 38% 30%,#ff7a6b,#d4322a 52%,#8e1712);box-shadow:0 4px 0 #5c0d09,0 6px 10px rgba(0,0,0,.45);}
.ck-piece.black{background:radial-gradient(circle at 38% 30%,#6a6f7a,#2a2d33 52%,#0e0f12);box-shadow:0 4px 0 #000,0 6px 10px rgba(0,0,0,.5);}
.ck-piece .crown{position:relative;z-index:1;width:52%;height:52%;color:#ffd75e;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}
.ck-piece.lift{transform:translateY(-6%) scale(1.06);}
.ck-piece.must{animation:must 1.2s ease-in-out infinite;}
@keyframes must{50%{box-shadow:0 4px 0 #5c0d09,0 0 0 4px rgba(245,200,66,.55),0 6px 12px rgba(0,0,0,.45);}}
.ck-sq.dragging .ck-piece{opacity:.3;}
.drag-ghost{position:fixed;z-index:500;pointer-events:none;width:calc(var(--bs) / 8 * .9);height:calc(var(--bs) / 8 * .9);transform:translate(-50%,-60%);}
.ck-status{text-align:center;font-size:.92rem;font-weight:600;color:var(--text-2);min-height:24px;}
.ck-status b{color:var(--text);}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Checkers</span>
  <button class="icon-btn" id="ck-new" aria-label="New game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</nav>
<div class="page">
<div class="gk">
  <div class="tabs" role="tablist">
    <button class="tab active" id="mode-ai">vs Computer</button>
    <button class="tab" id="mode-2p">2 Players</button>
  </div>
  <div class="players">
    <div class="pl" id="pl-r"><span class="chip red"></span><div class="who"><div class="nm" id="nm-r">You</div><div class="sub" id="sub-r">Red</div></div><div class="val" id="ck-red">12</div></div>
    <div class="pl" id="pl-b"><span class="chip black"></span><div class="who"><div class="nm" id="nm-b">Computer</div><div class="sub" id="sub-b">Black</div></div><div class="val" id="ck-blk">12</div></div>
  </div>
  <div class="board-frame"><div class="ck-board" id="ck-board"></div></div>
  <div class="ck-status" id="ck-status">Red to move</div>
</div>
</div>
<script>
'use strict';
window.GN=window.GN||{haptic(){},toast(){},sheet(){return{close(){},el:document.createElement('div')};},confirm:()=>Promise.resolve(true)};
// Board: 8x8. Red at bottom (rows 5-7), Black at top (rows 0-2)
// Pieces: 1=red, -1=black, 2=red king, -2=black king, 0=empty
let board=[], turn='r', sel=null, moves=[], aiMode=true, gameOver=false;
let jumping=null, lastMove=null, aiTimer=null, moveCount=0;
const CROWN='<svg class="crown" viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z"/></svg>';

function initBoard(){
  board=Array.from({length:8},()=>Array(8).fill(0));
  for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2===1)board[r][c]=-1;
  for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1)board[r][c]=1;
}

function isRed(v){return v===1||v===2;}
function isBlack(v){return v===-1||v===-2;}
function isKing(v){return v===2||v===-2;}
function owned(v,t){return t==='r'?isRed(v):isBlack(v);}
function opponent(t){return t==='r'?'b':'r';}

function getPieceMoves(r,c,b,mustCapture){
  const v=b[r][c];
  if(!v||!owned(v,turn))return[];
  const dirs=[];
  if(isRed(v)||isKing(v))dirs.push([-1,-1],[-1,1]);
  if(isBlack(v)||isKing(v))dirs.push([1,-1],[1,1]);
  const caps=[],simple=[];
  dirs.forEach(([dr,dc])=>{
    const mr=r+dr,mc=c+dc,jr=r+dr*2,jc=c+dc*2;
    if(mr>=0&&mr<8&&mc>=0&&mc<8){
      const opp=turn==='r'?isBlack(b[mr][mc]):isRed(b[mr][mc]);
      if(opp&&jr>=0&&jr<8&&jc>=0&&jc<8&&b[jr][jc]===0)caps.push({fr:r,fc:c,tr:jr,tc:jc,cr:mr,cc:mc});
      else if(!mustCapture&&b[mr][mc]===0)simple.push({fr:r,fc:c,tr:mr,tc:mc,cr:null,cc:null});
    }
  });
  return caps.length?caps:(mustCapture?[]:simple);
}

function getAllMoves(t,b=board){
  const orig=turn;turn=t;
  const caps=[],simples=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(!owned(b[r][c],t))continue;
    const ms=getPieceMoves(r,c,b,false);
    ms.forEach(m=>m.cr!==null?caps.push(m):simples.push(m));
  }
  turn=orig;
  return caps.length?caps:simples;
}

function applyMove(m,b){
  const nb=b.map(r=>r.slice());
  const v=nb[m.fr][m.fc];
  nb[m.tr][m.tc]=v;nb[m.fr][m.fc]=0;
  if(m.cr!==null)nb[m.cr][m.cc]=0;
  // King promotion
  if(v===1&&m.tr===0)nb[m.tr][m.tc]=2;
  if(v===-1&&m.tr===7)nb[m.tr][m.tc]=-2;
  return nb;
}
// A man that reaches the far row is crowned and its turn ends (no further jumps)
function crowned(m,before){const v=before[m.fr][m.fc];return(v===1&&m.tr===0)||(v===-1&&m.tr===7);}

function canHumanAct(){return !gameOver&&!(aiMode&&turn==='b');}

function selectPiece(r,c){
  if(!canHumanAct())return;
  if(jumping&&(jumping.r!==r||jumping.c!==c))return; // must finish the multi-jump
  sel={r,c};
  const mustCapture=getAllMoves(turn).some(m=>m.cr!==null);
  moves=getPieceMoves(r,c,board,mustCapture);
  if(!moves.length&&mustCapture){GN.haptic('error');GN.toast('A capture is available — you must jump');}
  else GN.haptic('select');
  render();
}

function doMove(m){
  const before=board;
  board=applyMove(m,board);
  lastMove=m;moveCount++;
  GN.haptic(m.cr!==null?'medium':'light');
  // Multi-jump?
  if(m.cr!==null&&!crowned(m,before)){
    const followups=getPieceMoves(m.tr,m.tc,board,true);
    if(followups.length){jumping={r:m.tr,c:m.tc};sel={r:m.tr,c:m.tc};moves=followups;render();return;}
  }
  jumping=null;
  turn=opponent(turn);sel=null;moves=[];
  checkEndGame();
  render();
  if(!gameOver&&aiMode&&turn==='b'){clearTimeout(aiTimer);aiTimer=setTimeout(aiMove,450);}
}

function checkEndGame(){
  const ms=getAllMoves(turn);
  if(!ms.length){
    gameOver=true;
    const winner=turn==='r'?'Black':'Red';
    document.getElementById('ck-status').innerHTML=`<b>${winner} wins!</b>`;
    const youWon=aiMode&&winner==='Red', youLost=aiMode&&winner==='Black';
    GN.haptic(youLost?'error':'success');
    setTimeout(()=>GN.sheet({
      title:youWon?'You win! 🏆':youLost?'Computer wins':`${winner} wins! 🏆`,
      body:`${turn==='r'?'Red':'Black'} has no moves left.`,
      actions:[{label:'Play again',primary:true,onClick:freshGame},{label:'View board'}]
    }),450);
  }
}

function aiMove(){
  if(gameOver||turn!=='b'||!aiMode)return;
  const ms=getAllMoves('b');
  if(!ms.length)return;
  // Simple AI: prefer captures, then forward moves. Add shallow lookahead.
  let best=null,bestScore=-Infinity;
  ms.forEach(m=>{
    const nb=applyMove(m,board);
    let score=0;
    if(m.cr!==null)score+=10;
    // Evaluate board
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){
      const v=nb[r][c];
      if(v===-1)score+=3+(r);
      if(v===-2)score+=7;
      if(v===1)score-=3+(7-r);
      if(v===2)score-=7;
    }
    score+=Math.random()*.5;
    if(score>bestScore){bestScore=score;best=m;}
  });
  aiStep(best);
}
// Play one AI hop, then keep jumping while the same piece can capture
function aiStep(m){
  const before=board;
  board=applyMove(m,board);lastMove=m;moveCount++;
  GN.haptic(m.cr!==null?'medium':'light');
  if(m.cr!==null&&!crowned(m,before)){
    const followups=getPieceMoves(m.tr,m.tc,board,true);
    if(followups.length){
      render();
      aiTimer=setTimeout(()=>aiStep(followups[Math.floor(Math.random()*followups.length)]),380);
      return;
    }
  }
  turn='r';sel=null;moves=[];
  checkEndGame();render();
}

function render(){
  const el=document.getElementById('ck-board');
  el.innerHTML='';
  const legalTos=moves.map(m=>`${m.tr},${m.tc}`);
  const legalCaps=moves.filter(m=>m.cr!==null).map(m=>`${m.tr},${m.tc}`);
  // Pieces that are forced to capture (shown when nothing is selected)
  const mustSet=new Set();
  if(!gameOver&&!sel&&canHumanAct()){
    const all=getAllMoves(turn);
    if(all.length&&all[0].cr!==null)all.forEach(m=>mustSet.add(`${m.fr},${m.fc}`));
  }
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const sq=document.createElement('div');
      const dark=(r+c)%2===1;
      sq.className=`ck-sq ${dark?'dark':'light'}`;
      sq.dataset.r=r;sq.dataset.c=c;
      const key=`${r},${c}`;
      if(sel&&sel.r===r&&sel.c===c)sq.classList.add('selected');
      else if(lastMove&&((lastMove.fr===r&&lastMove.fc===c)||(lastMove.tr===r&&lastMove.tc===c)))sq.classList.add('last');
      if(legalCaps.includes(key))sq.classList.add('can-capture');
      else if(legalTos.includes(key))sq.classList.add('can-move');
      const v=board[r][c];
      if(v){
        const piece=document.createElement('div');
        piece.className='ck-piece '+(isRed(v)?'red':'black');
        if(sel&&sel.r===r&&sel.c===c)piece.classList.add('lift');
        if(mustSet.has(key))piece.classList.add('must');
        if(isKing(v))piece.innerHTML=CROWN;
        sq.appendChild(piece);
      }
      el.appendChild(sq);
    }
  }
  // Counts
  let rc=0,bc=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){if(isRed(board[r][c]))rc++;if(isBlack(board[r][c]))bc++;}
  document.getElementById('ck-red').textContent=rc;
  document.getElementById('ck-blk').textContent=bc;
  document.getElementById('nm-r').textContent=aiMode?'You':'Red';
  document.getElementById('nm-b').textContent=aiMode?'Computer':'Black';
  document.getElementById('pl-r').classList.toggle('on',!gameOver&&turn==='r');
  document.getElementById('pl-b').classList.toggle('on',!gameOver&&turn==='b');
  document.getElementById('sub-r').textContent=!gameOver&&turn==='r'?(aiMode?'Your turn':'Red · to move'):'Red';
  document.getElementById('sub-b').textContent=!gameOver&&turn==='b'?(aiMode?'Thinking…':'Black · to move'):'Black';
  if(!gameOver){
    const st=document.getElementById('ck-status');
    if(jumping)st.innerHTML='<b>Keep jumping!</b> Continue the capture';
    else if(aiMode&&turn==='b')st.textContent='Computer is thinking…';
    else if(mustSet.size)st.innerHTML='<b>Capture available</b> — jumps are mandatory';
    else st.innerHTML=aiMode?'<b>Your move</b>':`<b>${turn==='r'?'Red':'Black'}</b> to move`;
  }
}

function newGame(){
  clearTimeout(aiTimer);
  initBoard();turn='r';sel=null;moves=[];gameOver=false;jumping=null;lastMove=null;moveCount=0;
  render();
}
function freshGame(){try{sessionStorage.removeItem('checkers');}catch(e){}newGame();}

// ── Pointer input: tap or drag ─────────────────────────────────────────────
const boardEl=document.getElementById('ck-board');
let drag=null;
function sqAt(x,y){
  const rc=boardEl.getBoundingClientRect();
  const c=Math.floor((x-rc.left)/rc.width*8), r=Math.floor((y-rc.top)/rc.height*8);
  return(r<0||r>7||c<0||c>7)?null:[r,c];
}
function sqEl(r,c){return boardEl.querySelector(`.ck-sq[data-r="${r}"][data-c="${c}"]`);}
function tapSquare(r,c){
  if(gameOver)return;
  const dest=moves.find(m=>m.tr===r&&m.tc===c);
  if(dest){doMove(dest);return;}
  if((r+c)%2===1&&board[r][c]&&owned(board[r][c],turn))selectPiece(r,c);
  else if(sel&&!jumping){sel=null;moves=[];render();}
}
boardEl.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const at=sqAt(e.clientX,e.clientY);if(!at||!canHumanAct())return;
  const[r,c]=at;
  if(board[r][c]&&owned(board[r][c],turn)){
    tapSquare(r,c);
    if(sel&&sel.r===r&&sel.c===c&&moves.length){
      drag={r,c,x0:e.clientX,y0:e.clientY,moved:false,id:e.pointerId,ghost:null};
      try{boardEl.setPointerCapture(e.pointerId);}catch(_){}
    }
  } else tapSquare(r,c);
});
boardEl.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;
  if(!drag.moved){
    drag.moved=true;
    const src=sqEl(drag.r,drag.c);src?.classList.add('dragging');
    const g=src.querySelector('.ck-piece').cloneNode(true);
    g.classList.remove('lift','must');g.classList.add('drag-ghost');
    document.body.appendChild(g);drag.ghost=g;
  }
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  boardEl.querySelectorAll('.hover-target').forEach(x=>x.classList.remove('hover-target'));
  const at=sqAt(e.clientX,e.clientY);
  if(at&&moves.some(m=>m.tr===at[0]&&m.tc===at[1]))sqEl(at[0],at[1])?.classList.add('hover-target');
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(d.ghost)d.ghost.remove();
  if(!d.moved)return;
  const at=cancel?null:sqAt(e.clientX,e.clientY);
  const dest=at&&moves.find(m=>m.tr===at[0]&&m.tc===at[1]);
  if(dest)doMove(dest);else render();
}
boardEl.addEventListener('pointerup',e=>endDrag(e,false));
boardEl.addEventListener('pointercancel',e=>endDrag(e,true));

// ── Controls ───────────────────────────────────────────────────────────────
function syncTabs(){
  document.getElementById('mode-ai').classList.toggle('active',aiMode);
  document.getElementById('mode-2p').classList.toggle('active',!aiMode);
}
async function setMode(ai){
  if(ai===aiMode)return;
  if(!gameOver&&moveCount>0&&!(await GN.confirm('Switching modes starts a new game.',{title:'Start a new game?',ok:'New game'})))return;
  aiMode=ai;syncTabs();freshGame();
}
document.getElementById('mode-ai').addEventListener('click',()=>setMode(true));
document.getElementById('mode-2p').addEventListener('click',()=>setMode(false));
document.getElementById('ck-new').addEventListener('click',async()=>{
  if(!gameOver&&moveCount>0&&!(await GN.confirm('Your current game will be lost.',{title:'Start a new game?',ok:'New game',danger:true})))return;
  freshGame();
});

newGame();

// ── Session persistence ────────────────────────────────────────────────────
function _save_checkers(){if(gameOver)return;
  try{sessionStorage.setItem('checkers',JSON.stringify({board,turn,aiMode,gameOver,_ts:Date.now()}));}catch(e){}
}
function _load_checkers(){
  try{
    const raw=sessionStorage.getItem('checkers');if(!raw)return false;
    const s=JSON.parse(raw);if(!s||!Array.isArray(s.board))return false;
    board=s.board;turn=s.turn;aiMode=s.aiMode!==false;gameOver=s.gameOver||false;
    sel=null;moves=[];jumping=null;syncTabs();render();
    if(!gameOver&&aiMode&&turn==='b')aiTimer=setTimeout(aiMove,600);
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_checkers);
window.addEventListener('pagehide',_save_checkers);
_load_checkers();
</script>
</body>
</html>

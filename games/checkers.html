<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkers</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.cb-col{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.pbar{--c:var(--accent);display:flex;align-items:center;gap:10px;min-height:46px;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid transparent;transition:border-color .2s, background .2s;}
.pbar.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);}
.pbar .tok{width:32px;height:32px;flex:none;position:relative;}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;}
.pbar .nm{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.pbar .nm .ico{width:15px;height:15px;color:var(--text-3);}
.pbar .sub{font-size:.72rem;font-weight:700;color:var(--text-3);}
.pbar.on .sub{color:var(--c);}
.pbar .left{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.pbar .left b{font-size:1.25rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.pbar .left small{font-size:.66rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}
.tray{display:flex;align-items:center;margin-right:4px;}
.tray .mini{width:16px;height:16px;margin-left:-9px;}
.tray .mini:first-child{margin-left:0;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* Board: wooden frame, painted red and black squares */
.frame{--rim:clamp(12px,3.6vw,16px);position:relative;padding:var(--rim);border-radius:14px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(88deg,rgba(0,0,0,.08) 0 1px,transparent 1px 11px),
    linear-gradient(180deg,var(--wood-a,#9a5b2e),var(--wood-b,#6e3d1c));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.35),0 16px 34px rgba(0,0,0,.5);}
.bd{position:relative;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  box-shadow:0 0 0 3px #1a1310,inset 0 0 14px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;}
.sq{position:relative;}
.sq.l{background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/3px 3px,linear-gradient(160deg,#c8352f,#a8241f);}
.sq.d{background:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/3px 3px,linear-gradient(160deg,#2c2724,#1c1816);}
.sq::before{content:"";position:absolute;inset:0;pointer-events:none;}
.sq.last::before{background:rgba(255,206,64,.26);}
.sq.sel::before{background:rgba(255,206,64,.38);}
.sq.mv::after{content:"";position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:rgba(255,226,150,.55);box-shadow:0 0 0 3px rgba(255,226,150,.18);pointer-events:none;}
.sq.jp::after{content:"";position:absolute;inset:12%;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,214,90,.85);pointer-events:none;animation:ring 1s ease-in-out infinite alternate;}
.sq.trail::after{content:"";position:absolute;left:42%;top:42%;width:16%;height:16%;border-radius:50%;background:rgba(255,214,90,.8);}
@keyframes ring{to{inset:18%;}}
.layer{position:absolute;inset:0;pointer-events:none;}

/* Checkers: ridged edge, recessed face with a ring, crowned kings stacked two high */
.ck{position:absolute;width:12.5%;height:12.5%;display:grid;place-items:center;}
.ck.r{--a:#c71f2c;--b:#8e0f19;--hi:#ff7470;--mid:#cf2230;--lo:#860d16;--edge:#4f070d;--ring:rgba(255,170,160,.35);}
.ck.b{--a:#45454b;--b:#1d1d21;--hi:#8a8a92;--mid:#2c2c31;--lo:#0b0b0d;--edge:#000;--ring:rgba(255,255,255,.22);}
.disc{position:relative;width:80%;height:80%;border-radius:50%;
  background:repeating-conic-gradient(var(--a) 0 6deg,var(--b) 6deg 12deg);
  box-shadow:0 3px 0 var(--edge),0 5px 8px rgba(0,0,0,.6);transition:transform .15s var(--spring);}
.disc::before{content:"";position:absolute;inset:13%;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,var(--hi),var(--mid) 55%,var(--lo));
  box-shadow:0 0 0 1.5px rgba(0,0,0,.35),inset 0 0 0 5px transparent,inset 0 0 0 6.5px var(--ring),inset 0 2px 3px rgba(0,0,0,.3);}
.ck.k .disc{transform:translateY(-9%);box-shadow:0 3px 0 var(--edge),0 4px 0 var(--b),0 6px 0 var(--a),0 8px 0 var(--edge),0 10px 10px rgba(0,0,0,.6);}
.crown{position:absolute;inset:28%;display:grid;place-items:center;z-index:1;}
.crown svg{width:100%;height:100%;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6));}
.ck.lift .disc{transform:translateY(-10%) scale(1.08);box-shadow:0 8px 0 var(--edge),0 12px 12px rgba(0,0,0,.5);}
.ck.k.lift .disc{transform:translateY(-18%) scale(1.08);}
.ck.must .disc{animation:must 1.1s ease-in-out infinite;}
@keyframes must{50%{box-shadow:0 3px 0 var(--edge),0 0 0 4px rgba(255,214,90,.75),0 5px 10px rgba(0,0,0,.6);}}
.ck.taken{opacity:.35;}
.ck.gone{animation:gone .35s ease-out forwards;}
@keyframes gone{to{opacity:0;transform:scale(.5);}}
.mini{position:relative;border-radius:50%;background:repeating-conic-gradient(var(--a) 0 10deg,var(--b) 10deg 20deg);box-shadow:0 1.5px 0 var(--edge);}
.mini::before{content:"";position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 38% 30%,var(--hi),var(--mid) 60%,var(--lo));}
.pbar .tok .mini{position:absolute;inset:3px;}
.mini.r{--a:#c71f2c;--b:#8e0f19;--hi:#ff7470;--mid:#cf2230;--lo:#860d16;--edge:#4f070d;}
.mini.b{--a:#55555c;--b:#26262b;--hi:#8a8a92;--mid:#2c2c31;--lo:#0b0b0d;--edge:#000;}
.bd.shake{animation:shake .4s;}
.turn{margin:2px 0 0;min-height:34px;}
.acts{display:flex;gap:10px;justify-content:center;margin-top:2px;}
.acts .btn{flex:1;max-width:180px;}
.rulechip{text-align:center;font-size:.78rem;font-weight:800;color:var(--text-3);}

/* iPad / large screens: bigger board; landscape puts the player bars and buttons beside the board */
@media (min-width:700px) and (orientation:portrait){
  #app.stage{max-width:none;}
  .cb-col{max-width:min(712px,calc(100dvh - 380px));}
  .frame{--rim:20px;}
}
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  #app.stage{max-width:none;padding-bottom:calc(var(--safe-b) + 14px);}
  .cb-col{--bsz:min(calc(100dvh - 76px - var(--safe-t) - var(--safe-b)),calc(100vw - 400px));max-width:none;height:var(--bsz);
    display:grid;grid-template-columns:var(--bsz) minmax(280px,320px);grid-template-rows:auto auto minmax(0,1fr) auto auto auto;
    grid-template-areas:"b t" "b s" "b ." "b a" "b r" "b p";column-gap:24px;row-gap:10px;justify-content:center;}
  .cb-col>.frame{grid-area:b;--rim:clamp(16px,2.4vh,22px);}
  .cb-col>.pbar:nth-child(1){grid-area:t;}
  .cb-col>.pbar:nth-child(3){grid-area:p;}
  .cb-col>.turn{grid-area:s;justify-self:start;}
  .cb-col>.acts{grid-area:a;}
  .cb-col>.rulechip{grid-area:r;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'checkers_state', KEY = 'checkers';
  var BLACK = 1, RED = -1;

  // ═════════════════════════════════════════════════════════════════════════
  // Engine (pure; also runs in a Web Worker). Board: 64 ints, index row*8+col.
  // Black (1) starts on rows 0-2 and moves down; Red (-1) starts on rows 5-7.
  // ±1 man, ±2 king. Pieces sit on squares where (row+col) is odd.
  // Move = {f, path:[landing squares], caps:[jumped squares], crown}
  // ═════════════════════════════════════════════════════════════════════════
  function CheckersEngine() {
    var ALL = [[-1, -1], [-1, 1], [1, -1], [1, 1]], DOWN = [[1, -1], [1, 1]], UP = [[-1, -1], [-1, 1]];
    function dirsFor(side, king) { return king ? ALL : side === 1 ? DOWN : UP; }
    function jumpFrom(b, origin, s, side, king, path, caps, out) {
      var r = s >> 3, c = s & 7, any = false, dirs = dirsFor(side, king), far = side === 1 ? 7 : 0;
      for (var i = 0; i < dirs.length; i++) {
        var mr = r + dirs[i][0], mc = c + dirs[i][1], jr = r + 2 * dirs[i][0], jc = c + 2 * dirs[i][1];
        if (jr < 0 || jr > 7 || jc < 0 || jc > 7) continue;
        var ms = mr * 8 + mc, js = jr * 8 + jc;
        if (b[ms] * side < 0 && caps.indexOf(ms) < 0 && (b[js] === 0 || js === origin)) {
          any = true;
          var np = path.concat([js]), nc = caps.concat([ms]);
          if (!king && jr === far) out.push({ f: origin, path: np, caps: nc, crown: true });
          else if (!jumpFrom(b, origin, js, side, king, np, nc, out)) out.push({ f: origin, path: np, caps: nc, crown: false });
        }
      }
      return any;
    }
    function moves(b, side, optional) {
      var jumps = [], steps = [], far = side === 1 ? 7 : 0;
      for (var s = 0; s < 64; s++) {
        var p = b[s] * side; if (p <= 0) continue;
        var king = p === 2;
        jumpFrom(b, s, s, side, king, [], [], jumps);
        if (jumps.length && !optional) continue;
        var dirs = dirsFor(side, king), r = s >> 3, c = s & 7;
        for (var i = 0; i < dirs.length; i++) {
          var rr = r + dirs[i][0], cc = c + dirs[i][1];
          if (rr < 0 || rr > 7 || cc < 0 || cc > 7 || b[rr * 8 + cc]) continue;
          steps.push({ f: s, path: [rr * 8 + cc], caps: [], crown: !king && rr === far });
        }
      }
      if (jumps.length && !optional) return jumps;
      return jumps.concat(steps);
    }
    function apply(b, m) {
      var nb = b.slice(), p = nb[m.f];
      nb[m.f] = 0;
      for (var i = 0; i < m.caps.length; i++) nb[m.caps[i]] = 0;
      nb[m.path[m.path.length - 1]] = m.crown ? 2 * (p > 0 ? 1 : -1) : p;
      return nb;
    }
    function evaluate(b, side) {
      var sc = 0, nB = 0, nR = 0, kings = [], s, p, r, c;
      for (s = 0; s < 64; s++) {
        p = b[s]; if (!p) continue;
        r = s >> 3; c = s & 7;
        var center = (c >= 2 && c <= 5 && r >= 2 && r <= 5) ? 6 : 0;
        if (p === 1) { sc += 100 + r * 5 + center + (r === 0 ? 10 : 0) + (c === 0 || c === 7 ? 3 : 0); nB++; }
        else if (p === -1) { sc -= 100 + (7 - r) * 5 + center + (r === 7 ? 10 : 0) + (c === 0 || c === 7 ? 3 : 0); nR++; }
        else if (p === 2) { sc += 165 + center; nB++; kings.push(s); }
        else { sc -= 165 + center; nR++; kings.push(s); }
      }
      if (!nB) return side === 1 ? -50000 : 50000;
      if (!nR) return side === 1 ? 50000 : -50000;
      // When ahead, trade down and hunt with kings
      var lead = sc, total = nB + nR;
      if (Math.abs(lead) > 80) {
        sc += (lead > 0 ? 1 : -1) * (24 - total) * 6;
        var winner = lead > 0 ? 1 : -1;
        for (var k = 0; k < kings.length; k++) {
          if (b[kings[k]] * winner <= 0) continue;
          var best = 14;
          for (s = 0; s < 64; s++) if (b[s] * winner < 0) { var d = Math.max(Math.abs((s >> 3) - (kings[k] >> 3)), Math.abs((s & 7) - (kings[k] & 7))); if (d < best) best = d; }
          sc += winner * (14 - best) * 2;
        }
      }
      return sc * side;
    }
    var WIN = 100000, STOP = {};
    function search(b, side, o) {
      o = o || {};
      var t0 = Date.now(), limit = o.time || 800, maxD = o.depth || 6, nodes = 0, opt = !!o.optional;
      function tick() { if ((++nodes & 1023) === 0 && Date.now() - t0 > limit) throw STOP; }
      function ab(bd, sd, depth, alpha, beta, ply) {
        tick();
        var ms = moves(bd, sd, opt);
        if (!ms.length) return -WIN + ply;
        var jumping = ms[0].caps.length > 0;
        if (depth <= 0) {
          if (!jumping || ply > maxD + 10) return evaluate(bd, sd);
          if (opt) { var st = evaluate(bd, sd); if (st >= beta) return st; if (st > alpha) alpha = st; ms = ms.filter(function (m) { return m.caps.length; }); }
        }
        ms.sort(function (a, b) { return b.caps.length - a.caps.length || (b.crown ? 1 : 0) - (a.crown ? 1 : 0); });
        var best = -Infinity;
        for (var i = 0; i < ms.length; i++) {
          var v = -ab(apply(bd, ms[i]), -sd, depth - 1, -beta, -alpha, ply + 1);
          if (v > best) best = v;
          if (v > alpha) alpha = v;
          if (alpha >= beta) break;
        }
        return best;
      }
      var root = moves(b, side, opt);
      if (!root.length) return null;
      if (root.length === 1) return { move: root[0], score: 0, depth: 0 };
      var noise = o.noise || 0;
      root.forEach(function (m) { m.n = (Math.random() * 2 - 1) * noise; });
      var best = root[0], bestS = 0, done = 0;
      for (var d = 1; d <= maxD; d++) {
        try {
          var cur = null, curS = -Infinity;
          root.sort(function (a, b) { return (b === best ? 1e9 : typeof b.s === 'number' ? b.s : -1e9) - (a === best ? 1e9 : typeof a.s === 'number' ? a.s : -1e9); });
          for (var i = 0; i < root.length; i++) {
            var m = root[i];
            var v = -ab(apply(b, m), -side, d - 1, -Infinity, -(cur ? curS - 2 * noise - 1 : -Infinity), 1);
            m.s = v;
            var vn = v + (Math.abs(v) > WIN / 2 ? 0 : m.n);
            if (!cur || vn > curS) { cur = m; curS = vn; }
          }
          best = cur; bestS = curS; done = d;
          if (Math.abs(curS) > WIN / 2) break;
          if (Date.now() - t0 > limit * 0.5) break;
        } catch (e) { if (e !== STOP) throw e; break; }
      }
      return { move: { f: best.f, path: best.path, caps: best.caps, crown: best.crown }, score: bestS, depth: done, nodes: nodes };
    }
    return { moves: moves, apply: apply, search: search, evaluate: evaluate };
  }
  var E = CheckersEngine();

  var worker = null, workerOk = true, reqId = 0, pending = null;
  function getWorker() {
    if (worker || !workerOk) return worker;
    try {
      var src = 'var E=(' + CheckersEngine.toString() + ')();onmessage=function(e){var d=e.data;postMessage({id:d.id,res:E.search(d.b,d.side,d.opts)});};';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = function (e) { if (pending && e.data.id === pending.id) { var p = pending; pending = null; p.cb(e.data.res); } };
      worker.onerror = function () { workerOk = false; worker = null; if (pending) { var p = pending; pending = null; p.cb(E.search(p.b, p.side, p.opts)); } };
    } catch (e) { workerOk = false; worker = null; }
    return worker;
  }
  function think(b, side, opts, cb) {
    var id = ++reqId, w = getWorker();
    pending = { id: id, cb: cb, b: b, side: side, opts: opts };
    if (w) w.postMessage({ id: id, b: b, side: side, opts: opts });
    else setTimeout(function () { if (pending && pending.id === id) { pending = null; cb(E.search(b, side, opts)); } }, 30);
  }
  function cancelThink() { pending = null; }

  // ── State ────────────────────────────────────────────────────────────────
  // S = {mode, level, forced, players:[{name,cpu,side}], b, turn, last, n (plies), quiet,
  //      hist:[snapshots], events:[], over, result, started, kinged:{}}
  var S = null, sel = -1, prefix = [];
  var LEVELS = { easy: { depth: 2, time: 300, noise: 70 }, normal: { depth: 8, time: 900, noise: 8 }, hard: { depth: 14, time: 2200, noise: 0 } };
  var LEVEL_NAME = { easy: 'Easy', normal: 'Normal', hard: 'Hard' };
  var QUIET_LIMIT = 80; // 40 moves each with no capture and no man moved
  function save() {
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && !S.over) Kit.resume.set(S.n ? 'Move ' + (Math.floor(S.n / 2) + 1) : 'Ready');
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function pl(side) { return S.players[0].side === side ? S.players[0] : S.players[1]; }
  function vsCpu() { return S.players.some(function (p) { return p.cpu; }); }
  function human() { return S.players.filter(function (p) { return !p.cpu; })[0]; }
  function bottomSide() { return vsCpu() ? human().side : BLACK; }
  function colorName(side) { return side === BLACK ? 'Black' : 'Red'; }
  function legal() { return E.moves(S.b, S.turn, !S.forced); }

  Kit.init({
    id: 'checkers', mark: false,
    onNew: function () { cancelThink(); clearSave(); showSetup(); },
    undo: function () { undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Checkers: past games' }); } },
      { icon: 'close', label: 'Resign', onClick: function () { resign(); } }],
    rules:
      '<p class="goal">Capture all of the other player\'s checkers, or leave them with <b>no move they can make</b>.</p>' +
      '<h3>Moving</h3><ul><li>Checkers only use the dark squares. <b>Black moves first.</b></li>' +
      '<li>A checker moves one square diagonally <b>forward</b>.</li></ul>' +
      '<h3>Jumping</h3><ul><li>Jump over an enemy checker that\'s diagonally next to you, onto the empty square just past it. The jumped checker is captured.</li>' +
      '<li>If you can jump again from where you land, you must keep going. Two jumps is a double jump, three is a triple!</li>' +
      '<li><b>If you can jump, you have to.</b> If there\'s more than one jump, you pick which one.</li>' +
      '<li>Plain checkers jump forward only.</li></ul>' +
      '<h3>Kings</h3><ul><li>Reach the far side and your checker is <b>crowned</b> (a second checker is stacked on top). That ends your turn.</li>' +
      '<li>Kings move and jump forward <b>and backward</b>, still one square at a time.</li></ul>' +
      '<h3>Ending</h3><ul><li>You win when the other player has no checkers left or can\'t move.</li>' +
      '<li>If 40 moves each go by with no jump and no plain checker moving, it\'s a draw.</li></ul>' +
      '<h3>House rule</h3><p>For a casual game, choose <b>Jumps optional</b> at setup: you may skip a jump, but once you start jumping you finish the jump.</p>'
  });

  function showSetup() {
    S = null; sel = -1; prefix = [];
    Kit.setup(app, {
      modes: [
        { id: 'cpu', icon: 'bot', title: 'vs Computer', desc: 'Easy, Normal or Hard' },
        { id: '2p', icon: 'users', title: 'Pass & play', desc: 'Two players, one device' }
      ],
      options: [
        { id: 'level', label: 'Computer skill', value: 'normal', choices: [['easy', 'Easy', 'Only looks a move or two ahead and makes mistakes.'], ['normal', 'Normal', 'Looks several moves ahead.'], ['hard', 'Hard', 'Looks far ahead and takes its time. Tough to beat.']], when: function (m) { return m === 'cpu'; } },
        { id: 'side', label: 'You play', value: 'b', choices: [['b', 'Black (first)', 'Black always moves first, so you start.'], ['r', 'Red', 'The computer plays Black and moves first.']], when: function (m) { return m === 'cpu'; } },
        { id: 'forced', label: 'Jumps', value: 'on', choices: [['on', 'Must jump', 'If you can jump a piece, you have to. This is the official rule.'], ['off', 'Jumps optional', 'House rule: you can choose not to jump.']] }
      ],
      players: { min: 2, max: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },
      onStart: function (cfg) {
        var cpu = cfg.mode === 'cpu', hs = cpu && cfg.options.side === 'r' ? RED : BLACK;
        S = {
          mode: cfg.mode, level: cfg.options.level || 'normal', forced: cfg.options.forced !== 'off',
          players: cfg.players.map(function (p, i) { return { name: p.name, cpu: p.cpu, side: i === 0 ? hs : -hs }; })
        };
        newGame();
      }
    });
  }
  function startBoard() {
    var b = []; for (var s = 0; s < 64; s++) { var r = s >> 3, c = s & 7; b.push((r + c) % 2 ? (r < 3 ? BLACK : r > 4 ? RED : 0) : 0); }
    return b;
  }
  function newGame(swap) {
    cancelThink();
    if (swap && !vsCpu()) S.players.forEach(function (p) { p.side = -p.side; });
    S.b = startBoard(); S.turn = BLACK; S.last = null; S.n = 0; S.quiet = 0; S.hist = []; S.events = [];
    S.over = false; S.result = null; S.started = Date.now(); S.busy = false;
    sel = -1; prefix = [];
    Kit.gameStart(); save(); render(); maybeCpu();
  }
  function count(side) { var n = 0, k = 0; S.b.forEach(function (v) { if (v * side > 0) { n++; if (v * side === 2) k++; } }); return { n: n, k: k }; }

  // ── Moves ────────────────────────────────────────────────────────────────
  var JUMP_WORD = ['', 'jumped', 'double-jumped', 'triple-jumped', 'quadruple-jumped', 'jumped five times', 'jumped six times', 'jumped seven times'];
  function commit(m, byCpu) {
    if (!S || S.over) return;
    var list = legal(), key = m.f + ':' + m.path.join(',');
    var mv = list.filter(function (x) { return x.f + ':' + x.path.join(',') === key; })[0];
    if (!mv) return;
    S.hist.push({ b: S.b.slice(), turn: S.turn, last: S.last, n: S.n, quiet: S.quiet, ev: S.events.length, cpu: !!byCpu });
    var side = S.turn, who = pl(side).name, moveNo = Math.floor(S.n / 2) + 1, wasKing = Math.abs(S.b[mv.f]) === 2;
    var hadJump = list.some(function (x) { return x.caps.length; });
    S.b = E.apply(S.b, mv); S.n++;
    S.quiet = (mv.caps.length || !wasKing) ? 0 : S.quiet + 1;
    S.last = { f: mv.f, path: mv.path, caps: mv.caps };
    S.turn = -side; sel = -1; prefix = [];
    var k = mv.caps.length;
    if (k >= 2) S.events.push({ type: 'multi', side: side, n: k, text: who + ' ' + JUMP_WORD[Math.min(k, 7)] + (mv.crown ? ' to a king' : '') + ' on move ' + moveNo });
    else if (k === 1 && mv.crown) S.events.push({ type: 'jk', side: side, text: who + ' jumped to a king on move ' + moveNo });
    if (mv.crown && !S.events.some(function (e) { return e.type === 'firstking'; })) S.events.push({ type: 'firstking', side: side, text: who + ' crowned the first king on move ' + moveNo });
    if (!S.forced && hadJump && !k) S.events.push({ type: 'skip', side: side, text: who + ' skipped a jump on move ' + moveNo });
    render({ m: mv, side: side, byCpu: byCpu, victims: mv.caps.map(function (s) { return S.hist[S.hist.length - 1].b[s]; }) });
    var hops = mv.path.length, dur = byCpu ? hops * 300 : 260;
    Kit.sfx(k ? 'chip' : 'tap'); Kit.haptic(k ? 'medium' : 'light');
    if (k >= 2) setTimeout(function () { Kit.callout(k === 2 ? 'Double jump!' : k === 3 ? 'Triple jump!' : k + ' jumps!'); Kit.sfx('good'); }, dur - 100);
    if (mv.crown) setTimeout(function () { Kit.callout('King me!'); Kit.sfx('pop'); Kit.haptic('success'); }, dur + (k >= 2 ? 700 : 0));
    var end = checkEnd();
    if (end) { setTimeout(function () { finish(end); }, dur + 200); S.over = true; S.result = end; save(); return; }
    save();
    setTimeout(maybeCpu, dur + 120);
  }
  function checkEnd() {
    var c = count(S.turn);
    if (!c.n) return { type: 'wipe', winner: -S.turn };
    if (!legal().length) return { type: 'blocked', winner: -S.turn };
    if (S.quiet >= QUIET_LIMIT) return { type: 'draw' };
    return null;
  }
  function finish(res) {
    S.over = true; S.result = res; save(); clearSave(); render();
    var winner = res.winner ? pl(res.winner) : null, loser = res.winner ? pl(-res.winner) : null;
    var moves = Math.ceil(S.n / 2), hl = [];
    if (winner) {
      var c = count(winner.side);
      hl.push(winner.name + ' won with ' + c.n + (c.n === 1 ? ' checker' : ' checkers') + ' left' + (c.k ? ' (' + c.k + (c.k === 1 ? ' king' : ' kings') + ')' : '') + ' after ' + moves + ' moves');
      if (res.type === 'blocked') hl.push(loser.name + ' was boxed in with no moves left');
    } else hl.push('Draw: 40 moves each with no jump or plain checker move');
    var multis = S.events.filter(function (e) { return e.type === 'multi'; }).sort(function (a, b) { return b.n - a.n; });
    multis.slice(0, 2).forEach(function (e) { hl.push(e.text); });
    S.events.filter(function (e) { return e.type === 'jk' || e.type === 'firstking'; }).slice(0, 2).forEach(function (e) { hl.push(e.text); });
    if (!S.forced) hl.push('Played with jumps optional');
    if (vsCpu()) hl.push('Computer skill: ' + LEVEL_NAME[S.level]);
    Kit.record(KEY, {
      started: S.started, mode: (vsCpu() ? 'vs Computer (' + LEVEL_NAME[S.level] + ')' : 'Pass & play') + (S.forced ? '' : ', jumps optional'),
      players: S.players.map(function (p) { return { name: p.name + ' (' + colorName(p.side) + ')', score: winner ? (p === winner ? 1 : 0) : 0.5, cpu: p.cpu }; }),
      winner: winner ? winner.name + ' (' + colorName(winner.side) + ')' : null,
      summary: winner ? winner.name + ' won in ' + moves + ' moves' : 'Draw',
      highlights: hl
    });
    setTimeout(function () {
      var lose = winner && winner.cpu;
      Kit.win({
        icon: !winner ? 'users' : lose ? 'bot' : 'trophy',
        title: !winner ? "It's a draw" : lose ? winner.name + ' wins this one' : winner.name === 'You' ? 'You win!' : winner.name + ' wins!',
        sub: res.type === 'wipe' ? 'Every checker captured' : res.type === 'blocked' ? loser.name + ' has no moves left' : res.type === 'resign' ? loser.name + ' resigned' : 'No progress for 40 moves each',
        lose: !!lose, againLabel: 'Play again',
        again: function () { newGame(true); },
        extra: [{ label: 'View the board', onClick: function () {} }],
        closeLabel: 'Back to games'
      });
    }, 500);
  }
  function resign() {
    if (!S || !S.b || S.over) return Kit.toast('No game in progress');
    var side = vsCpu() ? human().side : S.turn;
    Kit.confirm(pl(side).name + ' resigns?', { ok: 'Resign', danger: true, body: pl(-side).name + ' will win this game.' }).then(function (ok) {
      if (!ok) return; cancelThink(); S.busy = false; finish({ type: 'resign', winner: -side });
    });
  }
  function undo() {
    if (!S || !S.b) return;
    if (S.over) return Kit.toast('The game is over');
    if (prefix.length) { prefix = []; sel = -1; render(); return; }
    var cpu = vsCpu();
    if (!S.hist.some(function (h) { return !h.cpu; })) return Kit.toast('Nothing to undo');
    cancelThink(); S.busy = false;
    var snap;
    while (S.hist.length) { snap = S.hist.pop(); if (!cpu || !snap.cpu) break; }
    S.b = snap.b; S.turn = snap.turn; S.last = snap.last; S.n = snap.n; S.quiet = snap.quiet; S.events.length = snap.ev;
    sel = -1; prefix = [];
    Kit.sfx('whoosh'); save(); render(); maybeCpu();
  }
  function maybeCpu() {
    if (!S || S.over || !pl(S.turn).cpu || S.busy) return;
    S.busy = true; paintStatus();
    var t0 = Date.now(), myN = S.n, mySide = S.turn;
    think(S.b, S.turn, Object.assign({ optional: !S.forced }, LEVELS[S.level] || LEVELS.normal), function (res) {
      if (!S || S.n !== myN || S.turn !== mySide) return;
      setTimeout(function () {
        if (!S || S.n !== myN) return;
        S.busy = false;
        if (res && res.move) commit(res.move, true);
      }, Math.max(0, 600 - (Date.now() - t0)));
    });
  }

  // ── Render ───────────────────────────────────────────────────────────────
  var bdEl, layerEl, topBar, botBar, turnEl;
  var CROWN = '<svg viewBox="0 0 24 24"><path d="M3 8.5l4.6 3.8L12 5l4.4 7.3L21 8.5 19.3 18H4.7z" fill="#ffd34d" stroke="#8a5a00" stroke-width="1.2" stroke-linejoin="round"/><circle cx="3" cy="8" r="1.4" fill="#ffd34d"/><circle cx="12" cy="4.5" r="1.4" fill="#ffd34d"/><circle cx="21" cy="8" r="1.4" fill="#ffd34d"/></svg>';
  function disp(s) { return bottomSide() === RED ? s : 63 - s; }
  function pieceEl(v, s) {
    var n = el('div', { class: 'ck ' + (v > 0 ? 'b' : 'r') + (Math.abs(v) === 2 ? ' k' : ''), 'data-s': s }, [el('div', { class: 'disc' }, [Math.abs(v) === 2 ? el('span', { class: 'crown', html: CROWN }) : null])]);
    place(n, s); return n;
  }
  function place(node, s) { var d = disp(s); node.style.left = (d & 7) * 12.5 + '%'; node.style.top = (d >> 3) * 12.5 + '%'; }
  function render(anim) {
    if (!S || !S.b) return;
    app.innerHTML = '';
    var col = el('div', { class: 'cb-col' });
    topBar = el('div', { class: 'pbar' }); botBar = el('div', { class: 'pbar' });
    var frame = el('div', { class: 'frame' });
    bdEl = el('div', { class: 'bd', role: 'grid', 'aria-label': 'Checkers board' });
    for (var i = 0; i < 64; i++) { var s = disp(i), r = s >> 3, c = s & 7; bdEl.appendChild(el('div', { class: 'sq ' + ((r + c) % 2 ? 'd' : 'l'), 'data-s': s })); }
    layerEl = el('div', { class: 'layer' }); bdEl.appendChild(layerEl);
    frame.appendChild(bdEl);
    col.appendChild(topBar); col.appendChild(frame); col.appendChild(botBar);
    turnEl = el('div', { class: 'turn' }); col.appendChild(turnEl);
    var acts = el('div', { class: 'acts' });
    if (S.over) acts.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-sm', text: 'Play again', onclick: function () { newGame(true); } }));
    else acts.appendChild(el('button', { type: 'button', class: 'btn btn-soft btn-sm', html: Kit.icon('undo') + '<span>Undo</span>', onclick: undo }));
    col.appendChild(acts);
    col.appendChild(el('div', { class: 'rulechip', text: S.forced ? 'Standard rules: jumps are required' : 'House rule: jumps optional' }));
    app.appendChild(col);
    paintBoard(anim); paintStatus();
    bindInput();
  }
  function sqEl(s) { return bdEl.children[disp(s)]; }
  function viewBoard() {
    // While a multi-jump is part-way through, show the checker where it has got to
    if (!prefix.length) return { b: S.b, taken: [] };
    var b = S.b.slice(), m = candidates()[0], taken = m.caps.slice(0, prefix.length);
    var pc = b[sel]; b[sel] = 0; b[prefix[prefix.length - 1]] = pc;
    return { b: b, taken: taken, at: prefix[prefix.length - 1] };
  }
  function candidates() { return legal().filter(function (m) { return m.f === sel && prefix.every(function (s, i) { return m.path[i] === s; }); }); }
  function targets() { var t = {}; candidates().forEach(function (m) { t[m.path[prefix.length]] = m.caps.length ? 'jp' : 'mv'; }); return t; }
  function mustPieces() {
    if (!S.forced || S.over || pl(S.turn).cpu) return {};
    var ms = legal(), out = {};
    if (ms.length && ms[0].caps.length) ms.forEach(function (m) { out[m.f] = 1; });
    return out;
  }
  function paintBoard(anim) {
    var v = viewBoard(), lm = S.last, tg = sel >= 0 ? targets() : {}, must = sel < 0 ? mustPieces() : {};
    for (var s = 0; s < 64; s++) {
      var q = sqEl(s); q.className = q.className.replace(/ (last|sel|mv|jp|trail)\b/g, '');
      if (lm && (s === lm.f || lm.path.indexOf(s) >= 0) && !prefix.length) q.classList.add('last');
      if (tg[s]) q.classList.add(tg[s]);
    }
    if (sel >= 0) { sqEl(sel).classList.add(prefix.length ? 'trail' : 'sel'); prefix.slice(0, -1).forEach(function (s) { sqEl(s).classList.add('trail'); }); }
    layerEl.innerHTML = '';
    for (s = 0; s < 64; s++) {
      if (!v.b[s] && v.taken.indexOf(s) < 0) continue;
      var p = pieceEl(v.b[s] || S.b[s], s);
      if (v.taken.indexOf(s) >= 0) p.classList.add('taken');
      if ((s === sel && !prefix.length) || s === v.at) p.classList.add('lift');
      if (must[s]) p.classList.add('must');
      layerEl.appendChild(p);
    }
    if (anim && anim.m) animateMove(anim);
  }
  function animateMove(a) {
    var m = a.m, end = m.path[m.path.length - 1];
    var p = layerEl.querySelector('.ck[data-s="' + end + '"]'); if (!p || !p.animate) return;
    var z = disp(end), hops = a.byCpu ? [m.f].concat(m.path) : [prefixStart(m)].concat(m.path.slice(m.path.length - 1));
    var frames = [], per = a.byCpu ? 300 : 260;
    hops.forEach(function (s, i) {
      var d = disp(s), dx = ((d & 7) - (z & 7)) * 100, dy = ((d >> 3) - (z >> 3)) * 100;
      if (i > 0) {
        var pd = disp(hops[i - 1]), mx = ((((pd & 7) + (d & 7)) / 2) - (z & 7)) * 100, my = ((((pd >> 3) + (d >> 3)) / 2) - (z >> 3)) * 100;
        frames.push({ transform: 'translate(' + mx + '%,' + my + '%) scale(' + (m.caps.length ? 1.22 : 1.08) + ')', offset: (i - 0.5) / (hops.length - 1) });
      }
      frames.push({ transform: 'translate(' + dx + '%,' + dy + '%) scale(1)', offset: i / (hops.length - 1) });
    });
    p.style.zIndex = 3;
    p.animate(frames, { duration: per * (hops.length - 1), easing: 'ease-in-out' });
    // Captured checkers vanish as they're jumped
    var shown = a.byCpu ? m.caps : m.caps.slice(-1);
    var earlier = a.byCpu ? [] : m.caps.slice(0, -1);
    earlier.forEach(function (s, i) { var g = pieceEl(a.victims[i], s); g.classList.add('gone'); layerEl.insertBefore(g, layerEl.firstChild); setTimeout(function () { g.remove(); }, 380); });
    shown.forEach(function (s, i) {
      var vi = a.byCpu ? i : m.caps.length - 1, g = pieceEl(a.victims[vi], s);
      layerEl.insertBefore(g, layerEl.firstChild);
      setTimeout(function () { g.classList.add('gone'); setTimeout(function () { g.remove(); }, 380); }, per * (i + 0.5));
    });
  }
  function prefixStart(m) { return m.path.length > 1 ? m.path[m.path.length - 2] : m.f; }
  function bar(node, side) {
    var p = pl(side), on = !S.over && S.turn === side, c = count(side);
    node.className = 'pbar' + (on ? ' on' : '');
    node.style.setProperty('--c', side === BLACK ? '#b9b9c2' : '#ff5a5f');
    var lost = 12 - count(-side).n, tray = el('div', { class: 'tray' });
    for (var i = 0; i < Math.min(lost, 12); i++) tray.appendChild(el('span', { class: 'mini ' + (side === BLACK ? 'r' : 'b') }));
    var sub = on && p.cpu && S.busy ? '<span class="think">Thinking <i></i><i></i><i></i></span>' : colorName(side) + (on ? ' · to move' : '');
    node.innerHTML = '';
    node.appendChild(el('span', { class: 'tok' }, [el('span', { class: 'mini ' + (side === BLACK ? 'b' : 'r') })]));
    node.appendChild(el('div', { class: 'who' }, [el('span', { class: 'nm', html: (p.cpu ? Kit.icon('bot') : '') + '<span>' + Kit.esc(p.name) + '</span>' }), el('span', { class: 'sub', html: sub })]));
    node.appendChild(tray);
    node.appendChild(el('div', { class: 'left' }, [el('b', { text: String(c.n) }), el('small', { text: c.k ? c.k + (c.k === 1 ? ' king' : ' kings') : 'left' })]));
  }
  function paintStatus() {
    if (!turnEl) return;
    var bs = bottomSide(); bar(topBar, -bs); bar(botBar, bs);
    var p = pl(S.turn);
    turnEl.innerHTML = ''; turnEl.style.setProperty('--c', S.turn === BLACK ? '#c9c9d2' : '#ff5a5f');
    if (S.over) {
      var r = S.result, w = r.winner ? pl(r.winner) : null;
      turnEl.appendChild(el('span', { text: w ? (w.name === 'You' ? 'You win!' : w.name + ' wins!') : "It's a draw" }));
      return;
    }
    turnEl.appendChild(el('span', { class: 'dot' }));
    var txt = p.cpu ? p.name + ' is thinking…' : prefix.length ? 'Keep jumping!' : Object.keys(mustPieces()).length ? (p.name === 'You' ? 'You' : p.name) + ' must jump' : Kit.poss(p.name) + ' turn';
    turnEl.appendChild(el('span', { text: txt }));
  }

  // ── Input ────────────────────────────────────────────────────────────────
  function canAct() { return S && !S.over && !S.busy && !pl(S.turn).cpu; }
  function sqAt(x, y) {
    var rc = bdEl.getBoundingClientRect();
    var c = Math.floor((x - rc.left) / rc.width * 8), r = Math.floor((y - rc.top) / rc.height * 8);
    if (c < 0 || c > 7 || r < 0 || r > 7) return -1;
    return disp(r * 8 + c);
  }
  function tapSquare(s) {
    if (!canAct()) return;
    var tg = sel >= 0 ? targets() : {};
    if (tg[s]) {
      prefix.push(s);
      var c = candidates();
      if (c.length === 1 && c[0].path.length === prefix.length) { var m = c[0]; prefix = []; commit(m); return; }
      Kit.sfx('chip'); Kit.haptic('medium');
      paintBoard(); paintStatus();
      var p = layerEl.querySelector('.ck[data-s="' + s + '"]');
      if (p && p.animate) {
        var from = disp(prefix.length > 1 ? prefix[prefix.length - 2] : sel), to = disp(s);
        p.animate([{ transform: 'translate(' + ((from & 7) - (to & 7)) * 100 + '%,' + ((from >> 3) - (to >> 3)) * 100 + '%)' }, { transform: 'translate(' + ((from & 7) - (to & 7)) * 50 + '%,' + ((from >> 3) - (to >> 3)) * 50 + '%) scale(1.2)', offset: .5 }, { transform: 'none' }], { duration: 260, easing: 'ease-in-out' });
      }
      return;
    }
    if (prefix.length) { Kit.toast('Finish your jump'); Kit.haptic('error'); return; }
    var v = S.b[s];
    if (v * S.turn > 0) {
      if (sel === s) { sel = -1; paintBoard(); return; }
      var has = legal().some(function (m) { return m.f === s; });
      if (!has) {
        var must = mustPieces();
        Kit.haptic('error'); Kit.sfx('bad');
        Kit.toast(Object.keys(must).length ? 'You have a jump: you must take it' : 'That checker can\'t move');
        sel = -1; paintBoard(); return;
      }
      sel = s; Kit.sfx('tick'); Kit.haptic('tick'); paintBoard(); return;
    }
    if (sel >= 0) { sel = -1; paintBoard(); }
  }
  function bindInput() {
    bdEl.addEventListener('pointerdown', function (e) {
      if (e.button > 0) return;
      var s = sqAt(e.clientX, e.clientY); if (s >= 0) tapSquare(s);
    });
  }

  window.__checkers = {
    E: E, state: function () { return S; },
    set: function (b, turn) { cancelThink(); S.busy = false; S.b = b.slice(); S.turn = turn; S.hist = []; S.events = []; S.last = null; S.over = false; S.result = null; S.n = 0; S.quiet = 0; sel = -1; prefix = []; save(); render(); maybeCpu(); },
    tap: function (s) { tapSquare(s); }
  };

  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.b && saved.players && !saved.over) { S = saved; S.busy = false; render(); maybeCpu(); }
  else showSetup();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorecard</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* ── Setup: game picker ───────────────────────────────────────────────── */
.sc-games{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.sc-games .chip{min-height:40px;padding:0 14px;color:var(--text);background:var(--w08);}
.sc-games .chip.on{background:var(--text);color:var(--bg);}
.sc-games .chip .ico{width:15px;height:15px;opacity:.6;}
.sc-val{display:flex;align-items:center;gap:10px;margin-top:10px;}
.sc-val .lbl{flex:1;min-width:0;font-weight:800;color:var(--text-2);}
.sc-val .stepper input{width:78px;min-height:44px;border:0;background:transparent;color:var(--text);text-align:center;font-size:1.3rem;font-weight:900;outline:none;padding:0;}
.sc-hint{margin-top:8px;color:var(--text-3);font-size:.88rem;font-weight:700;line-height:1.35;}

/* ── Clipboard + paper score sheet ────────────────────────────────────── */
.clip{position:relative;border-radius:22px;padding:30px 10px 12px;margin:22px 0 4px;}
.clamp{position:absolute;z-index:3;top:-14px;left:50%;transform:translateX(-50%);width:136px;height:44px;border-radius:12px 12px 18px 18px;
  background:linear-gradient(180deg,#f3f5f8 0%,#c3cad3 40%,#8c95a1 100%);
  box-shadow:inset 0 1px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.18), 0 6px 10px rgba(0,0,0,.4);}
.clamp::before{content:"";position:absolute;left:50%;top:7px;transform:translateX(-50%);width:46px;height:12px;border-radius:7px;background:linear-gradient(180deg,#5b6370,#2e333b);box-shadow:inset 0 2px 3px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.7);}
.clamp::after{content:"";position:absolute;left:14px;right:14px;bottom:7px;height:3px;border-radius:2px;background:rgba(0,0,0,.14);}
.sheet{position:relative;border-radius:4px 4px 12px 12px;overflow:hidden;color:#2a2a3a;
  background:linear-gradient(180deg,#fffaf0,#f6eedb);box-shadow:0 2px 0 rgba(0,0,0,.06), 0 10px 22px rgba(0,0,0,.4);}
.sheet-h{padding:22px 14px 8px;text-align:center;border-bottom:3px double #c8102e;}
.sheet-h h2{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,7vw,1.9rem);color:#c8102e;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere;}
.sheet-h .rule{font-family:var(--hand);font-size:1.08rem;color:#6a6a80;margin-top:2px;}
.status{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:4px 12px;font-family:var(--hand);font-size:1.25rem;color:var(--ink);text-align:center;border-bottom:1px solid rgba(60,80,160,.16);}
.status .ico{width:18px;height:18px;color:#c8102e;flex:none;}
.status.pop{animation:spop .5s var(--spring);}
@keyframes spop{from{transform:scale(.9);opacity:.3;}}
table.sct{width:100%;border-collapse:collapse;table-layout:fixed;}
.sct th,.sct td{height:42px;border-bottom:1px solid rgba(60,80,160,.16);text-align:center;padding:0 2px;}
.sct th.rn{width:50px;font-family:var(--font);font-size:.72rem;font-weight:900;color:#c8102e;letter-spacing:.05em;}
.sct thead th{height:46px;font-family:var(--hand);font-weight:400;font-size:1.15rem;color:#2a2a3a;border-bottom:2px solid rgba(60,80,160,.3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:inset 0 -4px 0 var(--c);}
.sct td{font-family:var(--hand);font-size:1.45rem;color:var(--ink);border-left:1px solid rgba(200,16,46,.2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;}
.sct td.neg{color:#c8102e;}
.sct td.miss{color:rgba(80,80,110,.35);}
.sct tbody tr.done{cursor:pointer;}
.sct tbody tr.done:active{background:rgba(255,220,60,.22);}
.sct tbody tr.just td{animation:write .55s ease-out both;}
.sct tbody tr.just td:nth-child(3){animation-delay:.06s;}.sct tbody tr.just td:nth-child(4){animation-delay:.12s;}
.sct tbody tr.just td:nth-child(5){animation-delay:.18s;}.sct tbody tr.just td:nth-child(6){animation-delay:.24s;}
.sct tbody tr.just td:nth-child(n+7){animation-delay:.3s;}
@keyframes write{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}
.sct tr.next{cursor:pointer;}
.sct tr.next td{position:relative;}
.sct tr.next td::after{content:"";position:absolute;inset:5px 4px;border-radius:8px;border:2px dashed rgba(31,42,107,.22);}
.sct tr.next th.rn{color:#c8102e;}
.sct tr.next:active td::after{background:rgba(255,220,60,.25);}
.sct tr.blank th.rn{color:rgba(200,16,46,.35);}
.sct tr.tb th.rn{font-size:.64rem;}
.sct tfoot th,.sct tfoot td{border-top:2px solid #c8102e;height:54px;background:rgba(200,16,46,.05);}
.sct tfoot td{font-size:1.8rem;position:relative;}
.sct tfoot td span{position:relative;z-index:1;}
.sct tfoot td.lead::before{content:"";position:absolute;left:calc(50% - min(42%,48px));right:calc(50% - min(42%,48px));top:28%;bottom:22%;border-radius:4px 10px 4px 12px;background:rgba(255,214,40,.62);transform:skew(-8deg) rotate(-2deg);transform-origin:left;animation:hl .45s ease-out both;}
@keyframes hl{from{transform:skew(-8deg) rotate(-2deg) scaleX(0);}}
.sct tfoot tr.togo th,.sct tfoot tr.togo td{height:34px;border-top:1px solid rgba(200,16,46,.25);background:transparent;}
.sct tfoot tr.togo td{font-size:1.05rem;color:#6a6a80;}
.sct tfoot tr.togo th{font-size:.6rem;}
.sct.n6 thead th{font-size:1rem;}.sct.n6 td{font-size:1.25rem;}.sct.n6 tfoot td{font-size:1.45rem;}
.sct.n7 thead th,.sct.n8 thead th{font-size:.9rem;line-height:1;white-space:normal;overflow-wrap:anywhere;padding:0 1px 4px;}
.sct.n7 td,.sct.n8 td{font-size:1.1rem;}
.sct.n7 tfoot td,.sct.n8 tfoot td{font-size:1.2rem;}
.sct.n7 th.rn,.sct.n8 th.rn{width:38px;font-size:.56rem;letter-spacing:0;}
.sct.n7 tfoot tr.togo td,.sct.n8 tfoot tr.togo td{font-size:.85rem;}
.sheet-f{padding:8px 12px 12px;font-family:var(--hand);font-size:1.02rem;color:#8a8796;text-align:center;}
.sheet.over .sheet-h::after{content:"FINAL";position:absolute;right:12px;top:14px;padding:2px 8px;border:2px solid #c8102e;border-radius:6px;color:#c8102e;font-family:var(--display);font-size:.9rem;letter-spacing:.08em;transform:rotate(8deg);opacity:.8;}

/* Sticky action bar: quick add, a note, then the buttons */
.sc-bar{position:sticky;bottom:0;z-index:5;display:flex;flex-direction:column;gap:6px;padding:12px 0 calc(var(--safe-b) + 10px);background:linear-gradient(rgba(20,16,41,0),var(--bg) 22px);}
.sc-btns{display:flex;gap:10px;}
.sc-btns .btn-lg{flex:1;min-width:0;white-space:nowrap;}
.sc-btns .btn-end{flex:none;min-height:60px;padding:0 18px;border-radius:var(--r-lg);}
.sc-btns .sc-del.armed{--b:var(--red);--b-ink:#fff;--b-lip:#a8202e;color:#fff;}
@media (max-width:559px){.sc-btns.fixing{flex-wrap:wrap;}.sc-btns.fixing .btn-lg{flex:1 1 100%;}.sc-btns.fixing .btn-end{flex:1 1 0;min-height:48px;}}
.qk{display:flex;gap:5px;}
.qk button{flex:1;min-width:0;min-height:44px;padding:0;border:0;border-radius:12px;background:var(--surface-3);color:var(--text);font-weight:900;font-size:.95rem;
  box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .12s var(--spring);}
.qk button:active{transform:translateY(2px) scale(.95);box-shadow:0 1px 0 rgba(0,0,0,.3);}
.qk-hint{font-size:.78rem;font-weight:800;color:var(--text-3);text-align:center;}
.qk-note{font-size:.84rem;font-weight:800;color:var(--text-2);text-align:center;min-height:0;}
.qk-note:empty{display:none;}
/* The round being written: a box per player on the sheet */
.sct tr.next td::after{pointer-events:none;}
.sct tr.next td{padding:0 2px;}
.sct tr.next td.on::after{border-color:rgba(200,16,46,.55);background:rgba(255,220,60,.18);}
.sct input.cell{position:relative;z-index:1;display:block;width:100%;height:42px;margin:0;padding:0 2px;border:0;border-radius:0;background:transparent;font:inherit;color:var(--ink);text-align:center;outline:0;-webkit-appearance:none;}
.sct input.cell.neg{color:#c8102e;}
.sct input.cell.bump{animation:bump .3s var(--spring);}
@keyframes bump{40%{transform:scale(1.15);}}
.sct thead th.on{background:rgba(255,220,60,.25);}
.sct tbody tr.fixing{background:rgba(255,200,40,.22);}
.sct tbody tr.dim{cursor:default;}
.sct tbody tr.dim > *{opacity:.38;}
.sct tfoot td.pend span{color:#8a8796;}
.addp .quick{margin-top:10px;}

/* ── Wide landscape (iPad, laptop): a tighter header and rows so more rounds and the totals fit on screen ── */
@media (orientation:landscape) and (min-width:900px) and (max-height:900px){
  .clip{padding-top:22px;margin-top:16px;}
  .sheet-h{padding:12px 14px 6px;}
  .sheet-h h2{font-size:1.6rem;}
  .sct th,.sct td{height:38px;}
  .sct thead th{height:42px;}
  .sct tfoot th,.sct tfoot td{height:48px;}
  .sc-bar{padding-top:10px;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, esc = Kit.esc, app = document.getElementById('app');
  var KEY = 'sc', OLD_KEYS = ['cs_sc'];            // history keys (gh_sc, plus the older gh_cs_sc)
  var SAVE = 'scorecard_state', UNDO = 'scorecard_undo', PREF = 'scorecard_setup', PRESETS = 'scorecard_presets', DRAFT = 'scorecard_draft';
  var S = null, undoStack = [];

  // Starter ideas with their standard end rules (only shown until you've used them)
  var IDEAS = [
    { name: 'Uno', low: false, end: 'target', target: 500 },
    { name: 'Ticket to Ride', low: false, end: 'open' },
    { name: 'Scrabble', low: false, end: 'open' },
    { name: 'Farkle', low: false, end: 'target', target: 10000 },
    { name: 'Golf', low: true, end: 'rounds', rounds: 9 },
    { name: 'Mexican Train', low: true, end: 'rounds', rounds: 13 },
    { name: 'Rummikub', low: false, end: 'open' },
    { name: 'Qwirkle', low: false, end: 'open' }
  ];
  var LADDER = [5, 10, 15, 20, 25, 30, 40, 50, 75, 100, 121, 150, 200, 250, 300, 400, 500, 750, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 7500, 10000, 15000, 20000];

  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function fmt(n) { n = Number(n) || 0; return Math.abs(n) >= 10000 ? n.toLocaleString() : String(n); }
  function plural(n, w) { return n + ' ' + w + (Math.abs(n) === 1 ? '' : 's'); }

  Kit.init({
    id: 'scorecard', title: 'Scorecard',
    onNew: function () { endState(); showSetup(); },
    undo: undo,
    menu: [
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { keys: OLD_KEYS, title: 'Scorecard: past games', extra: oldEntry }); } },
      { icon: 'plus', label: 'Add a player', onClick: addPlayer },
      { icon: 'check', label: 'End game now', onClick: function () { endGame(); } }
    ],
    rules:
      '<p class="goal">Keep score for any game: board games, card games, dice games, backyard games. Play at the table, write the scores here.</p>' +
      '<h3>Setting up</h3><ul>' +
      '<li><b>What are you playing?</b> Type the game name, or tap one you have played before. Its settings come back automatically.</li>' +
      '<li><b>Who wins?</b> Most games: highest score. Some, like Golf or Hearts: lowest score.</li>' +
      '<li><b>Game ends:</b> when someone reaches a score (like 500 in Uno), after a set number of rounds (like 9 holes of Golf), or whenever you decide to stop.</li></ul>' +
      '<h3>Scoring</h3><ul>' +
      '<li>After each round (or each turn), type everyone\'s points in the dashed row on the sheet, then tap <b>Save round</b>. A fresh row opens below.</li>' +
      '<li>Or tap a player\'s box and use the quick buttons under the sheet (<b>−1</b>, <b>+1</b>, <b>+5</b>, <b>+10</b>...) to add to it. <b>±</b> makes a score negative.</li>' +
      '<li>Blank counts as 0.</li>' +
      '<li>Made a mistake? Tap any round on the sheet. It opens right there to fix, or tap <b>Delete</b>. Undo in the menu works too.</li></ul>' +
      '<h3>Ending</h3><p>The sheet ends the game for you when someone reaches the target or the last round is done. With "When we stop", tap <b>End game</b>. If there is a tie for first you can play a tiebreak round or share the win.</p>' +
      '<p>Someone joining late? Use <b>Add a player</b> in the menu.</p>'
  });

  // ── Past games / remembered games ──────────────────────────────────────
  function allHistory() {
    var list = [];
    [KEY].concat(OLD_KEYS).forEach(function (k) { try { list = list.concat(GameHistory.load(k) || []); } catch (e) {} });
    return list;
  }
  // Games played before, newest first, each with its last-used settings
  function knownGames() {
    var map = {}, presets = lsGet(PRESETS) || {};
    allHistory().forEach(function (e) {
      var name = String(e.gameName || '').trim(); if (!name) return;
      var k = name.toLowerCase(), m = map[k] || (map[k] = { name: name, count: 0, ts: 0 });
      m.count++;
      if ((e._date || 0) >= m.ts) {
        m.ts = e._date || 0; m.name = name;
        m.low = !!(e.lowWins != null ? e.lowWins : e.dir === 'low');
        if (e.end) { m.end = e.end; m.target = e.target; m.rounds = e.nrounds; }
        else if (e.dir) { m.end = 'rounds'; m.rounds = e.rounds; }
      }
    });
    Object.keys(presets).forEach(function (k) {
      var p = presets[k], m = map[k];
      if (!m || (p.ts || 0) >= m.ts) map[k] = { name: p.name, count: m ? m.count : 0, ts: p.ts || 0, low: p.low, end: p.end, target: p.target, rounds: p.rounds };
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.ts - a.ts || b.count - a.count; });
  }
  function findSettings(name) {
    var k = String(name || '').trim().toLowerCase(); if (!k) return null;
    var g = knownGames().filter(function (x) { return x.name.toLowerCase() === k; })[0];
    if (g) return g;
    return IDEAS.filter(function (x) { return x.name.toLowerCase() === k; })[0] || null;
  }
  // Older records (before the rebuild) kept the game name and sheet differently
  function oldEntry(e) {
    if (e.v) return null;
    var box = el('div', { style: { 'margin-top': '8px' } });
    if (e.gameName) box.appendChild(el('div', { class: 'muted', text: 'Game: ' + e.gameName }));
    if (Array.isArray(e.scores) && Array.isArray(e.names)) {
      var t = el('table', { class: 'k-hd-rounds' }), hr = el('tr', null, [el('th', { text: '' })]);
      e.names.forEach(function (n, i) { hr.appendChild(el('th', { text: n, style: { color: Kit.color(i) } })); });
      t.appendChild(hr);
      e.scores.forEach(function (r, ri) {
        if (!r || !r.some(function (v) { return v != null; })) return;
        var tr = el('tr', null, [el('th', { text: String(ri + 1) })]);
        r.forEach(function (v) { tr.appendChild(el('td', { text: v == null ? '–' : String(v) })); });
        t.appendChild(tr);
      });
      box.appendChild(el('div', { class: 'k-hd-scroll', style: { 'margin-top': '8px' } }, [t]));
    }
    return box;
  }

  // ── Setup ──────────────────────────────────────────────────────────────
  function showSetup() {
    S = null; undoStack = [];
    var cfg = Object.assign({ name: '', low: false, end: 'target', target: 100, rounds: 10 }, lsGet(PREF) || {});
    var su = Kit.setup(app, {
      players: { min: 1, max: 8, count: 2 },
      intro: 'Keep score for any game you play at the table',
      start: 'Start scoring',
      onStart: function (c) { start(cfg, c.players); }
    });
    var block = el('div', { class: 'stack' });
    var seats = su.el.querySelector('.k-seats');   // what you're playing goes under who's playing
    su.el.insertBefore(block, seats.nextSibling);

    var nameIn = el('input', { class: 'input', type: 'text', maxlength: 28, autocomplete: 'off', autocapitalize: 'words', spellcheck: 'false', placeholder: 'Any game, e.g. Ticket to Ride', value: cfg.name, 'aria-label': 'Game name' });
    var chips = el('div', { class: 'sc-games' });
    var rulesBox = el('div', { class: 'stack' });
    block.appendChild(el('div', null, [el('div', { class: 'label', text: 'What are you playing?' }), nameIn, chips]));
    block.appendChild(rulesBox);

    nameIn.addEventListener('input', function () { cfg.name = nameIn.value; paintChips(); });
    nameIn.addEventListener('change', function () { var s = findSettings(nameIn.value); if (s) apply(s, true); });
    nameIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') nameIn.blur(); });

    function apply(s, quiet) {
      cfg.name = s.name; nameIn.value = s.name;
      cfg.low = !!s.low; cfg.end = s.end || 'open';
      if (s.target) cfg.target = s.target;
      if (s.rounds) cfg.rounds = s.rounds;
      paintChips(); paintRules();
      if (!quiet) { Kit.sfx('pop'); Kit.haptic('light'); }
    }
    function paintChips() {
      chips.innerHTML = '';
      var cur = String(cfg.name || '').trim().toLowerCase();
      var known = knownGames(), list = known.slice(0, 8), have = {};
      list.forEach(function (g) { have[g.name.toLowerCase()] = 1; });
      IDEAS.forEach(function (g) { if (list.length < 8 && !have[g.name.toLowerCase()]) list.push(g); });
      list.forEach(function (g) {
        var played = known.indexOf(g) >= 0;
        chips.appendChild(el('button', {
          type: 'button', class: 'chip' + (g.name.toLowerCase() === cur ? ' on' : ''),
          html: (played ? Kit.icon('history') : '') + '<span>' + esc(g.name) + '</span>',
          'aria-label': g.name + (played ? ' (played before)' : ''),
          onclick: function () { apply(g); }
        }));
      });
    }
    function seg(items, val, set) {
      var s = el('div', { class: 'seg' });
      items.forEach(function (it) {
        s.appendChild(el('button', { type: 'button', class: String(val) === String(it[0]) ? 'on' : '', text: it[1], onclick: function () { set(it[0]); Kit.sfx('tap'); paintRules(); } }));
      });
      return s;
    }
    function paintRules() {
      rulesBox.innerHTML = '';
      rulesBox.appendChild(el('div', null, [el('div', { class: 'label', text: 'Who wins?' }),
        seg([[0, 'Highest score'], [1, 'Lowest score']], cfg.low ? 1 : 0, function (v) { cfg.low = !!v; })]));
      var endBox = el('div', null, [el('div', { class: 'label', text: 'Game ends' }),
        seg([['target', 'At a score'], ['rounds', 'After rounds'], ['open', 'When we stop']], cfg.end, function (v) { cfg.end = v; })]);
      if (cfg.end !== 'open') {
        var isT = cfg.end === 'target';
        var inp = el('input', { type: 'text', inputmode: 'numeric', pattern: '[0-9]*', value: String(isT ? cfg.target : cfg.rounds), 'aria-label': isT ? 'Target score' : 'Number of rounds' });
        function setV(v) {
          v = Math.round(Number(v) || 0);
          if (isT) cfg.target = Math.max(1, Math.min(1000000, v || 100)); else cfg.rounds = Math.max(1, Math.min(99, v || 10));
          inp.value = String(isT ? cfg.target : cfg.rounds); hint.textContent = hintText();
        }
        function step(d) {
          var v = isT ? cfg.target : cfg.rounds, nv;
          if (!isT) nv = v + d;
          else if (d > 0) nv = LADDER.filter(function (x) { return x > v; })[0] || v * 2;
          else nv = LADDER.filter(function (x) { return x < v; }).pop() || Math.max(1, v - 1);
          setV(nv); Kit.sfx('tick');
        }
        inp.addEventListener('focus', function () { inp.select(); });
        inp.addEventListener('input', function () { var v = parseInt(inp.value, 10); if (v > 0) { if (isT) cfg.target = v; else cfg.rounds = Math.min(99, v); hint.textContent = hintText(); } });
        inp.addEventListener('change', function () { setV(inp.value); });
        endBox.appendChild(el('div', { class: 'sc-val' }, [
          el('span', { class: 'lbl', text: isT ? 'Play to' : 'Number of rounds' }),
          el('span', { class: 'stepper' }, [
            el('button', { type: 'button', 'aria-label': 'Less', text: '−', onclick: function () { step(-1); } }), inp,
            el('button', { type: 'button', 'aria-label': 'More', text: '+', onclick: function () { step(1); } })])
        ]));
      }
      var hint = el('div', { class: 'sc-hint', text: hintText() });
      endBox.appendChild(hint);
      rulesBox.appendChild(endBox);
    }
    function hintText() {
      var w = cfg.low ? 'lowest' : 'highest';
      if (cfg.end === 'target') return 'The game ends after the round where someone reaches ' + fmt(cfg.target) + '. The ' + w + ' total wins.';
      if (cfg.end === 'rounds') return 'The game ends after round ' + cfg.rounds + '. The ' + w + ' total wins.';
      return 'Keep scoring as long as you like, then tap End game. The ' + w + ' total wins.';
    }
    paintChips(); paintRules();
  }

  function start(cfg, players) {
    var name = String(cfg.name || '').trim();
    lsSet(PREF, { name: name, low: cfg.low, end: cfg.end, target: cfg.target, rounds: cfg.rounds });
    if (name) {
      var p = lsGet(PRESETS) || {};

  // ── State helpers ──────────────────────────────────────────────────────

  // ── Score sheet ────────────────────────────────────────────────────────

    var board = el('div', { class: 'clip wood' }, [el('div', { class: 'clamp', 'aria-hidden': 'true' })]);

    var st = editing ? { ic: 'pencil', tx: 'Fixing round ' + rowLabel(entry.ri) } : statusText(t);
    sheet.appendChild(el('div', { class: 'status' + (justAdded ? ' pop' : ''), html: Kit.icon(st.ic) + '<span>' + esc(st.tx) + '</span>' }));

    var tbl = el('table', { class: 'sct' + (n >= 6 ? ' n' + n : '') });
    var hr = el('tr', null, [el('th', { class: 'rn', text: 'RND' })]), heads = [];
    S.sides.forEach(function (s, i) { heads[i] = el('th', { text: s.name, title: s.name, style: { '--c': Kit.color(i) } }); hr.appendChild(heads[i]); });
    tbl.appendChild(el('thead', null, [hr]));
    var tb = el('tbody'), cells = [], inputs = [], foot = [], togo = [];

    function pick(i) {

      }

      tb.appendChild(entryRow(rowLabel(S.rows.length)));

          var bl = el('tr', { class: 'blank' + (editing ? ' dim' : '') }, [el('th', { class: 'rn', text: String(k + 1) })]);
          for (var q = 0; q < n; q++) bl.appendChild(el('td'));

        }
      }
    }
    tbl.appendChild(tb);
    var tf = el('tfoot');
    var fr = el('tr', null, [el('th', { class: 'rn', text: 'TOTAL' })]);
    base.forEach(function (v, i) {
      var td = el('td', { class: (i === L && S.rows.length ? 'lead' : '') + (v < 0 ? ' neg' : '') }, [el('span', { class: 'tot', 'data-i': i, text: fmt(v) })]);

    });
    tf.appendChild(fr);

    tbl.appendChild(tf);
    sheet.appendChild(tbl);
    sheet.appendChild(el('div', { class: 'sheet-f', text: S.over ? 'Final scores · tap a round to look back' : editing ? 'Change the numbers, then Save' : (S.rows.length ? 'Tap a round to fix it' : 'Type the scores in the dashed row') }));

  // ── Writing the round in ───────────────────────────────────────────────

  }
  // Start a fresh round (the tiebreak button); the dashed row is already there

    if (!S || S.over) return;
    entry = null; render();

  }

  function editRound(ri) {
    var r = S.rows[ri];
    var summary = S.sides.map(function (s, i) { return '<b>' + esc(s.name) + '</b> ' + (r[i] == null ? '–' : esc(fmt(r[i]))); }).join(' · ');
    if (S.over) { Kit.sheet({ title: 'Round ' + rowLabel(ri), html: '<p class="muted">' + summary + '</p>', actions: [{ label: 'Close', cls: 'btn-soft' }] }); return; }
    if (entry && entry.ri != null) { Kit.toast('Save or cancel round ' + rowLabel(entry.ri) + ' first'); return; }
    // The round opens again right where it is written

  }

  function afterChange(added, beforeL) {

    var t = totals(), L = leaderOf(t);

    }

  }
  function autoOver(t) {

  }

  function finish(w) {

      players: S.sides.map(function (s, i) { return { name: s.name, score: t[i] }; }),
      winner: winName,
      rounds: { labels: S.rows.map(function (r, i) { return rowLabel(i); }), scores: S.rows.map(function (r) { return r.map(function (v) { return v == null ? 0 : v; }); }) },
      highlights: hl,

      meta: { gameName: S.name, end: S.end, target: S.target, nrounds: S.rounds }

    setTimeout(function () {
      Kit.win({
        title: n === 1 ? done.sides[0].name + ': ' + fmt(t[0]) : winName ? winName + ' wins!' : "It's a tie!",
        sub: title() + (n > 1 && w >= 0 ? ' · by ' + plural(margin(t, w), 'point') : n === 1 ? ' · ' + plural(done.rows.length, 'round') : ''),

    }, 450);
  }

  // 2–6 short, specific lines about how the game went
  function highlights(t, w) {

    S.rows.forEach(function (r) { r.forEach(function (v, i) { run[i] += Number(v) || 0; }); cum.push(run.slice()); });
    // Margin of victory

      else if (m >= scale * 0.4 && m >= 10) out.push('Runaway win: ' + nm(w) + ' won by ' + plural(m, 'point'));
      else out.push(nm(w) + ' won by ' + plural(m, 'point'));

      var b = bestOf(t), tied = []; t.forEach(function (v, i) { if (v === b) tied.push(nm(i)); });

    }

    if (R >= 2) {
      var bv = null, bi = -1, br = -1;
      S.rows.forEach(function (row, ri) { row.forEach(function (v, i) { if (v == null) return; v = Number(v) || 0; if (bv === null || better(v, bv)) { bv = v; bi = i; br = ri; } }); });
      if (bi >= 0 && (S.low || bv > 0)) out.push((S.low ? 'Best round: ' : 'Biggest round: ') + nm(bi) + ' scored ' + fmt(bv) + ' in round ' + (br + 1));
    }
    // Lead story
    if (n > 1 && R >= 3) {
      var leaders = cum.map(leaderOf), changes = 0, prevL = -1;
      leaders.forEach(function (l) { if (l >= 0) { if (prevL >= 0 && l !== prevL) changes++; prevL = l; } });
      if (w >= 0 && leaders.every(function (l) { return l === w; })) out.push(nm(w) + ' led from start to finish');
      else if (changes >= 2) out.push('The lead changed hands ' + changes + ' times');
      // Comeback: the winner's biggest deficit before the final round
      if (w >= 0) {
        var def = 0, defR = -1;
        for (var k = 0; k < R - 1; k++) {
          var d = S.low ? cum[k][w] - Math.min.apply(null, cum[k]) : Math.max.apply(null, cum[k]) - cum[k][w];
          if (d > def) { def = d; defR = k; }
        }
        if (def > 0 && def >= Math.max(5, Math.abs(t[w]) * 0.1)) out.push('Comeback: ' + nm(w) + ' was ' + fmt(def) + ' behind after round ' + (defR + 1) + ' and still won');
      }
    }
    if (n === 1) out.push(nm(0) + ' finished with ' + fmt(t[0]));
    out.push(plural(R, 'round') + ' played');
    return out.slice(0, 6);
  }

  function playAgain() {
    var old = S;
    S = { v: 1, name: old.name, low: old.low, end: old.end, target: old.target, rounds: old.rounds,
      sides: old.sides.map(function (s) { return { name: s.name }; }), rows: [], started: Date.now(), over: false };
    undoStack = []; lastTotals = null; entry = null; lsDel(DRAFT); Kit.gameStart(); persist(); render(); window.scrollTo(0, 0);
  }

  function undo() {
    if (!S || S.over) return Kit.toast('Nothing to undo');
    if (!undoStack.length) return Kit.toast('Nothing to undo');
    S = JSON.parse(undoStack.pop());
    lastTotals = null; entry = null; Kit.sfx('whoosh'); Kit.toast('Undone'); persist(); render();
  }

  function addPlayer() {
    if (!S || S.over) return Kit.toast('Start a game first');
    if (S.sides.length >= 8) return Kit.toast('The sheet holds 8 players');
    var inp = el('input', { class: 'input', type: 'text', maxlength: 14, placeholder: 'Name', autocomplete: 'off' });
    var taken = S.sides.map(function (s) { return s.name.toLowerCase(); });
    var quick = el('div', { class: 'quick' });
    Kit.knownNames().filter(function (n) { return taken.indexOf(n.toLowerCase()) < 0; }).slice(0, 6).forEach(function (n) {
      quick.appendChild(el('button', { type: 'button', class: 'chip name', onclick: function () { inp.value = n; go(); } },
        [el('span', { class: 'avatar sm', style: { '--c': 'var(--surface-3)' }, text: n.charAt(0).toUpperCase() }), el('span', { text: n })]));
    });
    var node = el('div', { class: 'addp' }, [el('p', { class: 'muted', style: { 'margin-bottom': '10px' }, text: S.rows.length ? 'They start at 0. Rounds they missed show a dash.' : 'Add someone to the sheet.' }), inp, quick]);
    var sh = Kit.sheet({ title: 'Add a player', node: node, actions: [{ label: 'Add to the sheet', primary: true, keep: true, onClick: go }, { label: 'Cancel', cls: 'btn-ghost' }] });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    function go() {
      var v = inp.value.trim(); if (!v) { inp.focus(); return; }
      if (taken.indexOf(v.toLowerCase()) >= 0) return Kit.toast(v + ' is already playing');
      sh.close(); snap();
      S.sides.push({ name: v });
      S.rows.forEach(function (r) { r.push(null); });
      lastTotals = null; entry = null; Kit.sfx('pop'); persist(); render();
    }
  }

  // ── Boot: resume a game in progress (also picks up the old page's session) ─
  function migrateOld() {
    try {
      var raw = sessionStorage.getItem('cs_sc'); if (!raw) return null;
      sessionStorage.removeItem('cs_sc');
      var o = JSON.parse(raw); if (!o || !o.scNames) return null;
      var rows = (o.scScores || []).filter(function (r) { return r && r.some(function (v) { return v != null; }); });
      var st = { v: 1, name: o.scGameName || '', low: o.scDir === 'low', end: o.scEndMode === 'target' ? 'target' : 'rounds', target: o.scTarget || 500, rounds: o.scRounds || 10,
        sides: o.scNames.map(function (n) { return { name: n }; }), rows: rows, started: o._ts || Date.now(), over: false };
      if (!rows.length) return null;
      var t = totalsOf(rows, st.sides.length);
      if (st.end === 'rounds' ? rows.length >= st.rounds && rows.every(function (r) { return r.every(function (v) { return v != null; }); }) : t.some(function (v) { return v >= st.target; })) return null;
      return st;
    } catch (e) { return null; }
  }
  var saved = lsGet(SAVE) || migrateOld();
  if (saved && saved.sides && Array.isArray(saved.rows) && !saved.over) {
    S = saved; undoStack = lsGet(UNDO) || []; persist(); render();
    if (autoOver(totals())) setTimeout(function () { settle(false); }, 300);
  } else showSetup();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scorecard</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* Tabs: scrollable pill chips */
.game-tabs{display:flex;gap:8px;padding:2px max(16px,var(--safe-l)) 4px;margin:0 auto;max-width:720px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scroll-padding-inline:16px;}
.game-tabs::-webkit-scrollbar{display:none;}
.game-tab{flex:0 0 auto;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--text-2);font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap;scroll-snap-align:start;transition:background .15s,color .15s,border-color .15s;}
.game-tab.active{background:rgba(245,200,66,.14);border-color:rgba(245,200,66,.5);color:var(--gold);}
.game-tab.has-progress::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:2px;}
.game-panel{display:none;padding:14px max(16px,var(--safe-r)) calc(40px + var(--safe-b)) max(16px,var(--safe-l));max-width:720px;margin:0 auto;}
.game-panel.active{display:block;animation:gn-fade .2s ease both;}
.cs-page{padding:12px max(16px,var(--safe-r)) calc(40px + var(--safe-b)) max(16px,var(--safe-l));max-width:720px;margin:0 auto;}

/* Score display */
.score-display{display:grid;gap:8px;margin-bottom:14px;}
.score-card-grid-3{grid-template-columns:repeat(3,1fr);}
.score-card-grid-2{grid-template-columns:repeat(2,1fr);}
.score-card-grid-4{grid-template-columns:repeat(4,1fr);}
.scorer{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 8px 10px;text-align:center;transition:border-color .3s,box-shadow .3s;min-width:0;}
.scorer.leading{box-shadow:0 6px 22px var(--lc,rgba(245,200,66,0.25));}
.scorer-name{font-size:.82rem;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.scorer-pts{font-family:var(--display);font-size:clamp(1.7rem,7vw,2.4rem);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;}
.score-card-grid-4 .scorer-pts{font-size:clamp(1.35rem,5.5vw,2rem);}
.scorer-sub{font-size:.75rem;color:var(--text-2);margin-top:3px;}
.scorer-togo{font-size:.75rem;color:var(--text-3);margin-top:4px;}
.pbar{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;margin-top:8px;}
.pbar-fill{height:100%;border-radius:2px;transition:width .4s ease;}

/* Round entry */
.entry-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:var(--display);font-weight:700;font-size:1.08rem;}
.entry-row{display:grid;gap:10px;margin-bottom:12px;}
.entry-cell{text-align:center;min-width:0;}
.entry-label{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.score-input,.bid-input{width:100%;min-height:48px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;color:var(--text);
  font-size:max(16px,1.1rem)!important;font-weight:700;text-align:center;padding:8px 4px;outline:none;font-family:var(--font);transition:border-color .15s,box-shadow .15s;}
.score-input:focus,.bid-input:focus{border-color:rgba(245,200,66,.6);box-shadow:0 0 0 3px rgba(245,200,66,.12);}
.score-input:disabled{opacity:.4;}
.mini-lbl{font-size:.75rem;color:var(--text-3);margin-bottom:4px;font-weight:600;}
.toggle-row{display:flex;gap:6px;justify-content:center;margin-top:6px;}
.toggle-btn{flex:1;min-height:36px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;color:var(--text-2);font-size:.78rem;font-weight:600;padding:0 4px;cursor:pointer;transition:all .15s;font-family:var(--font);white-space:nowrap;}
.toggle-btn.on{background:rgba(245,200,66,0.16);border-color:var(--gold);color:var(--gold);}
.toggle-btn.bust-on{background:rgba(248,113,113,0.16);border-color:var(--red);color:var(--red);}
.toggle-btn:disabled{opacity:.35;}
.err-msg{color:var(--red);font-size:.86rem;text-align:center;margin-bottom:10px;display:none;}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
.btn-row .btn{flex:1;max-width:220px;}

/* History */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.hist-head{padding:12px 14px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--line);}
.hist-row{display:grid;padding:8px 12px;align-items:center;}
.hist-row.alt{background:rgba(255,255,255,.02);}
.hist-row.totals{background:var(--surface-2);border-top:1px solid var(--line-2);}
.hist-num{font-size:.8rem;color:var(--text-3);}
.hist-val{font-size:.92rem;font-weight:700;text-align:center;color:var(--text);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-val.neg{color:var(--red);}
.hist-total{font-family:var(--display);font-size:1.05rem;font-weight:800;text-align:center;}

/* Toggles */
.moon-toggle,.rules-toggle-row{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;margin-bottom:12px;cursor:pointer;min-height:48px;}
.moon-toggle input[type=checkbox],.rules-toggle-row input[type=checkbox],.chk{width:20px;height:20px;cursor:pointer;flex-shrink:0;accent-color:var(--gold);}
.moon-label{font-size:.92rem;font-weight:600;}
.rules-toggle-label{font-size:.92rem;}
.rules-toggle-label .sub{color:var(--text-2);font-size:.8rem;display:block;margin-top:1px;}
.nil-row{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--text-2);cursor:pointer;min-height:36px;margin:0;font-weight:500;}
.moon-picker{display:none;margin-bottom:12px;padding:12px;background:var(--surface-2);border-radius:12px;}

/* Rules */
.rules-body p{margin:0 0 8px;}
.rules-body ul{margin:0 0 8px;padding-left:18px;}
.rules-body li{margin-bottom:4px;}
.rules-body strong{color:var(--text);}

/* Setup */
.setup-screen{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 18px;}
.setup-title{font-family:var(--display);font-weight:700;font-size:1.15rem;margin-bottom:14px;}
.setup-lbl{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin:0 0 8px;display:block;}
.cnt-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px;}
.cnt-row .btn{padding:0;}
.btn.btn-outline.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink);border-color:transparent;}
.seg-row{display:flex;gap:8px;margin-bottom:12px;}
.seg-row .btn{flex:1;padding:0 10px;}
.player-setup-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.player-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.field{margin-bottom:16px;}
.inline-field{display:flex;align-items:center;gap:10px;}
.inline-field input[type=number].input{width:96px;flex:none;text-align:center;}
.inline-field span{font-size:.9rem;color:var(--text-2);}

/* Winner */
.winner-banner .btn-row{margin-top:16px;}
.gh-hist-btn{min-height:40px!important;padding:0 16px!important;font-size:.86rem!important;margin-top:12px;}

/* Phase 10 */
.p10-tracker{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:14px;overflow-x:auto;}
.p10-grid{display:grid;gap:4px 6px;font-size:.8rem;min-width:0;}
.p10-player{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.p10-player-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.p10-name{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.p10-phase{font-size:.75rem;color:var(--text-2);white-space:nowrap;}
.p10-player-bot{display:flex;gap:8px;align-items:center;}
.p10-done{flex:1;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:.86rem;font-weight:600;color:var(--text-2);cursor:pointer;margin:0;}
.p10-done:has(input:checked){border-color:rgba(74,222,128,.55);background:rgba(74,222,128,.1);color:var(--green);}
.p10-player-bot .score-input{width:96px;flex:none;}

/* Scorecard / Mini Golf */
.sc-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
.sc-table{border-collapse:collapse;width:100%;min-width:260px;font-size:.9rem;font-variant-numeric:tabular-nums;}
.sc-table th{background:var(--surface-2);padding:10px 6px;text-align:center;font-weight:700;color:var(--text-2);font-size:.8rem;white-space:nowrap;border-bottom:1px solid var(--line-2);max-width:90px;overflow:hidden;text-overflow:ellipsis;}
.sc-table th.player-th{color:var(--gold);}
.sc-table td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line);}
.sc-table tr:last-child td{border-bottom:none;}
.sc-table tr.totals-row td{background:var(--surface-2);font-weight:800;border-top:1px solid var(--line-2);font-size:1rem;padding:10px 4px;}
.sc-table .row-label{text-align:left;color:var(--text-3);font-size:.8rem;white-space:nowrap;padding-left:12px;}
.sc-table input.sc-cell{width:100%;max-width:64px;min-width:44px;min-height:40px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;color:var(--text);font-size:max(16px,.95rem)!important;font-weight:700;text-align:center;padding:4px 2px;outline:none;font-family:var(--font);}
.sc-table input.sc-cell:focus{border-color:var(--gold);background:rgba(245,200,66,.1);}
.sc-table .par-cell{color:var(--text-3);font-size:.8rem;}
.sc-table .vs-par{font-size:.78rem;font-weight:700;}
.vs-par.under{color:var(--green);}.vs-par.over{color:var(--red);}.vs-par.even{color:var(--text-3);}
.low-wins-note{font-size:.8rem;color:var(--text-3);text-align:center;margin-bottom:10px;}
.mg-venue-display{text-align:center;margin-bottom:12px;}
.mg-venue-name{font-family:var(--display);font-size:1.3rem;font-weight:800;color:var(--gold);}
.mg-course-name{font-size:.86rem;color:var(--text-2);margin-top:2px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a>
  <span class="nav-title">Scorecard</span>
</nav>
<div class="cs-page">
<div id="sc-setup" class="setup-screen mb-16">
    <div class="setup-title">New scorecard</div>
    <div class="field">
      <label class="setup-lbl">Game / Event Name (optional)</label>
      <input class="input" id="sc-game-name" placeholder="e.g. Yahtzee Night" maxlength="32">
    </div>
    <div class="field">
      <label class="setup-lbl">End Condition</label>
      <div class="seg-row">
        <button class="btn btn-gold btn-sm sc-end-mode active-end" data-end="rounds">📋 Fixed rounds</button>
        <button class="btn btn-outline btn-sm sc-end-mode" data-end="target">🎯 Score target</button>
      </div>
      <div id="sc-end-rounds" class="inline-field" style="display:flex;">
        <input class="input" id="sc-rounds" type="number" min="1" max="99" value="10">
        <span>rounds</span>
      </div>
      <div id="sc-end-target" class="inline-field" style="display:none;">
        <input class="input" id="sc-target" type="number" min="1" value="500">
        <span>points to win</span>
      </div>
    </div>
    <div class="field">
      <label class="setup-lbl">Winner</label>
      <div class="seg-row">
        <button class="btn btn-gold btn-sm sc-win-dir active-dir" data-dir="high">⬆ High score</button>
        <button class="btn btn-outline btn-sm sc-win-dir" data-dir="low">⬇ Low score</button>
      </div>
    </div>
    <div class="field">
      <label class="setup-lbl">Players (2–6)</label>
      <div id="sc-names"></div>
      <div class="seg-row" style="margin-top:4px">
        <button class="btn btn-outline btn-sm" id="sc-add-player">+ Player</button>
        <button class="btn btn-outline btn-sm" id="sc-rem-player">− Player</button>
      </div>
    </div>
    <button class="btn btn-gold btn-block" id="sc-start">Start Scorecard</button>
  </div>
  <div id="sc-game" class="hidden">
    <div class="mg-venue-display">
      <div class="mg-venue-name" id="sc-title-display"></div>
    </div>
    <div class="sc-table-wrap">
      <table class="sc-table" id="sc-table"></table>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="sc-undo">↩ Undo</button>
      <button class="btn btn-outline btn-sm" id="sc-new-setup">New Game</button>
    </div>
    <div id="sc-winner" class="winner-banner hidden" style="margin-top:16px">
      <div class="winner-name" id="sc-wname"></div>
      <div class="winner-pts" id="sc-wpts"></div>
    </div>
  </div>
</div>
<script>
'use strict';
const COLORS=['#f5c842','#ff7a5a','#5ac8fa','#7ed47e','#c084fc','#fb923c'];
const CDARK=['#c49a10','#c94020','#1a88c4','#3a9a3a','#8b3fc8','#c45a10'];

function showWinner(banner,nameEl,ptsEl,name,pts){
  banner.classList.remove('hidden');
  nameEl.textContent=name+' Wins!';
  ptsEl.textContent=pts+' points';
  if(!banner.querySelector('.gh-hist-btn')&&banner._histKey){
    const b=GameHistory.btn(banner._histKey,banner._histTitle,banner._histRender);
    b.className+=' gh-hist-btn';b.style.marginTop='10px';
    banner.appendChild(b);
  }
}
function buildScorers(container,names,totals,win,colors,cdark,sub=null){
  const n=names.length;
  const cols=n<=3?n:n<=4?2:3;
  container.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  container.innerHTML='';
  names.forEach((nm,i)=>{
    const leading=totals[i]===Math.max(...totals)&&totals[i]>0;
    const pct=Math.min(100,(totals[i]/win)*100);
    const s=document.createElement('div');
    s.className='scorer'+(leading?' leading':'');
    s.style.setProperty('--lc',colors[i]+'50');
    if(leading)s.style.borderColor=colors[i];
    s.innerHTML=`<div class="scorer-name" style="color:${colors[i]}">${nm}</div>
      <div class="scorer-pts">${totals[i]}</div>
      ${sub?`<div class="scorer-sub">${sub[i]}</div>`:''}
      <div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:linear-gradient(90deg,${cdark[i]},${colors[i]})"></div></div>
      <div class="scorer-togo">${win-totals[i]>0?win-totals[i]+' to win':'🏆'}</div>`;
    container.appendChild(s);
  });
}
function buildHistory(container,rounds,names,totals,colors){
  if(!rounds.length){container.innerHTML='';return;}
  const n=names.length;
  const gtc=`28px repeat(${n},1fr)`;
  let html=`<div class="hist"><div class="hist-head">Round History</div>
    <div class="hist-row" style="grid-template-columns:${gtc};border-bottom:1px solid rgba(255,255,255,.07)">
      <div class="hist-num">#</div>
      ${names.map((nm,i)=>`<div class="hist-val" style="color:${colors[i]};font-size:.72rem">${nm}</div>`).join('')}
    </div>`;
  rounds.forEach((r,ri)=>{
    html+=`<div class="hist-row ${ri%2===0?'':'alt'}" style="grid-template-columns:${gtc}${ri<rounds.length-1?';border-bottom:1px solid rgba(255,255,255,.04)':''}">
      <div class="hist-num">${ri+1}</div>
      ${r.map((v,i)=>`<div class="hist-val ${v<0?'neg':''}">${v===0&&r.bust?'—':v>=0?'+'+v:v}</div>`).join('')}
    </div>`;
  });
  html+=`<div class="hist-row totals" style="grid-template-columns:${gtc}">
    <div style="color:rgba(255,255,255,.5);font-size:.75rem;font-weight:700;align-self:center">Σ</div>
    ${totals.map((t,i)=>`<div class="hist-total" style="color:${colors[i]}">${t}</div>`).join('')}
  </div></div>`;
  container.innerHTML=html;
}
// ── GENERIC SCORECARD ──────────────────────────────────────────────────────
{
  let scNames=['Player 1','Player 2'], scRounds=10, scDir='high', scGameName='';
  let scScores=[]; // [round][player] = value|null
  let scN=2;
  let scEndMode='rounds', scTarget=500;
  let scSavedSig=null; // signature of the last finished card saved to history (avoids duplicate saves on re-render)

  function scBuildNames(){
    const c=document.getElementById('sc-names');c.innerHTML='';
    for(let i=0;i<scN;i++){
      const row=document.createElement('div');row.className='player-setup-row';
      row.innerHTML=`<div class="player-dot" style="background:${COLORS[i]}"></div>
        <input class="input" id="scn${i}" value="${scNames[i]||'Player '+(i+1)}" maxlength="16">`;
      c.appendChild(row);
    }
    if(typeof FrequentPlayers!=="undefined") FrequentPlayers.attachPickersByPrefix("scn");
  }
  document.getElementById('sc-add-player').addEventListener('click',()=>{if(scN<6){scN++;scBuildNames();}});
  document.getElementById('sc-rem-player').addEventListener('click',()=>{if(scN>2){scN--;scBuildNames();}});
  document.querySelectorAll('.sc-win-dir').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.sc-win-dir').forEach(x=>{x.classList.remove('active-dir','btn-gold');x.classList.add('btn-outline');});
      b.classList.add('active-dir','btn-gold');b.classList.remove('btn-outline');
      scDir=b.dataset.dir;
    });
  });
  document.querySelectorAll('.sc-end-mode').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.sc-end-mode').forEach(x=>{x.classList.remove('active-end','btn-gold');x.classList.add('btn-outline');});
      b.classList.add('active-end','btn-gold');b.classList.remove('btn-outline');
      scEndMode=b.dataset.end;
      document.getElementById('sc-end-rounds').style.display=scEndMode==='rounds'?'flex':'none';
      document.getElementById('sc-end-target').style.display=scEndMode==='target'?'flex':'none';
    });
  });
  scBuildNames();

  function scStart(){
    scNames=Array.from({length:scN},(_,i)=>document.getElementById('scn'+i).value.trim()||`Player ${i+1}`);
    scGameName=document.getElementById('sc-game-name').value.trim();
    if(scEndMode==='rounds'){
      scRounds=Math.max(1,Math.min(99,parseInt(document.getElementById('sc-rounds').value)||10));
      scScores=Array.from({length:scRounds},()=>Array(scN).fill(null));
    } else {
      scTarget=Math.max(1,parseInt(document.getElementById('sc-target').value)||500);
      scRounds=1; scScores=[Array(scN).fill(null)];
    }
    document.getElementById('sc-setup').classList.add('hidden');
    document.getElementById('sc-game').classList.remove('hidden');
    document.getElementById('sc-winner').classList.add('hidden');
    document.getElementById('sc-title-display').textContent=scGameName||'Scorecard';
    scRenderTable();
  }

  function scTotals(){return scNames.map((_,p)=>scScores.reduce((s,r)=>s+(r[p]!=null?r[p]:0),0));}

  function scCheckWinner(){
    const totals=scTotals();
    if(scEndMode==='rounds'){
      const allFilled=scScores.every(r=>r.every(v=>v!=null));
      if(!allFilled)return null;
      const best=scDir==='high'?Math.max(...totals):Math.min(...totals);
      return{wi:totals.indexOf(best),totals,best};
    } else {
      const hit=totals.findIndex(t=>t>=scTarget);
      if(hit<0)return null;
      const allRowFilled=scScores[scScores.length-1].every(v=>v!=null);
      if(!allRowFilled)return null;
      const best=scDir==='high'?Math.max(...totals):Math.min(...totals);
      return{wi:totals.indexOf(best),totals,best};
    }
  }

  function scRenderTable(){
    const tbl=document.getElementById('sc-table');
    const totals=scTotals();
    const w=scCheckWinner();
    let html=`<thead><tr><th class="row-label">#</th>${scNames.map((n,i)=>`<th class="player-th" style="color:${COLORS[i]}">${n}</th>`).join('')}${scEndMode==='target'?`<th style="font-size:.75rem;color:var(--text-3)">→${scTarget}</th>`:''}</tr></thead><tbody>`;
    for(let r=0;r<scScores.length;r++){
      html+=`<tr><td class="row-label">${r+1}</td>${scNames.map((_,p)=>`<td><input class="sc-cell" type="number" inputmode="decimal" data-r="${r}" data-p="${p}" value="${scScores[r][p]!=null?scScores[r][p]:''}" placeholder="—"></td>`).join('')}${scEndMode==='target'?'<td></td>':''}</tr>`;
    }
    if(scEndMode==='target'){
      html+=`<tr class="totals-row"><td class="row-label">Σ</td>${totals.map((t,i)=>{const pct=Math.min(100,Math.round(t/scTarget*100));return `<td style="color:${COLORS[i]}">${t}${w&&totals[i]===w.best?' 🏆':''}<div style="height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:3px;"><div style="height:100%;width:${pct}%;background:${COLORS[i]};border-radius:2px"></div></div></td>`;}).join('')}<td style="font-size:.75rem;color:var(--text-3);text-align:center;vertical-align:middle">${Math.round(Math.max(...totals)/scTarget*100)}%</td></tr>`;
    } else {
      html+=`<tr class="totals-row"><td class="row-label">Total</td>${totals.map((t,i)=>`<td style="color:${COLORS[i]};${w&&totals[i]===w.best?'font-size:1rem':''}">${t}${w&&totals[i]===w.best?' 🏆':''}</td>`).join('')}</tr>`;
    }
    html+='</tbody>';
    tbl.innerHTML=html;
    tbl.querySelectorAll('input.sc-cell').forEach(el=>{
      el.addEventListener('change',()=>{
        const r=+el.dataset.r,p=+el.dataset.p,v=el.value.trim();
        scScores[r][p]=v===''?null:parseFloat(v)||0;
        if(scEndMode==='target'&&!scCheckWinner()){
          const last=scScores[scScores.length-1];
          if(last.every(v=>v!=null))scScores.push(Array(scN).fill(null));
        }
        scSave();scRenderTable();
      });
    });
    if(!w){scSavedSig=null;document.getElementById('sc-winner').classList.add('hidden');}
    if(w){
      const wb=document.getElementById('sc-winner');
      wb.classList.remove('hidden');
      document.getElementById('sc-wname').textContent=scNames[w.wi]+' Wins! 🏆';
      document.getElementById('sc-wpts').textContent=`${scEndMode==='target'?'First to '+scTarget+' · ':''}${scDir==='high'?'Highest':'Lowest'} score: ${w.best}`;
      const sig=JSON.stringify(scScores);
      if(scSavedSig!==sig){ if(scSavedSig!=='loaded')GameHistory.save('sc',{_summary:`${scGameName||'Scorecard'} · ${scNames[w.wi]} wins`,_badge:w.best+'pts',winner:scNames[w.wi],gameName:scGameName,names:scNames,rounds:scScores.length,dir:scDir,totals:w.totals,scores:scScores}); scSavedSig=sig; }
      const wi=w.wi;if(!wb.querySelector('.gh-hist-btn')){const b=GameHistory.btn('sc','Scorecard',e=>{const div=document.createElement('div');div.appendChild(GameHistory.renderStatGrid([{val:e.gameName||'Scorecard',lbl:'Game'},{val:e.winner,lbl:'Winner'},{val:e.totals[wi]+'pts',lbl:e.dir==='high'?'High Score':'Low Score'}]));div.appendChild(GameHistory.renderRoundTable(e.names,e.scores,e.totals,COLORS));return div;});b.classList.add('gh-hist-btn');b.style.marginTop='10px';wb.appendChild(b);}
    }
  }

  function scSave(){try{sessionStorage.setItem('cs_sc',JSON.stringify({scNames,scRounds,scDir,scGameName,scScores,scN,scEndMode,scTarget,_ts:Date.now()}));}catch(e){}}
  function scLoad(){
    try{
      const raw=sessionStorage.getItem('cs_sc');if(!raw)return false;
      const s=JSON.parse(raw);if(!s.scNames)return false;
      scNames=s.scNames;scRounds=s.scRounds||10;scDir=s.scDir||'high';scGameName=s.scGameName||'';scEndMode=s.scEndMode||'rounds';scTarget=s.scTarget||500;
      scScores=s.scScores;scN=s.scN||s.scNames.length;
      document.getElementById('sc-setup').classList.add('hidden');
      document.getElementById('sc-game').classList.remove('hidden');
      document.getElementById('sc-title-display').textContent=scGameName||'Scorecard';
      scSavedSig='loaded'; // a finished card restored from session was already saved
      scRenderTable();return true;
    }catch(e){return false;}
  }
  document.getElementById('sc-start').addEventListener('click',()=>{scStart();scSave();});
  document.getElementById('sc-undo').addEventListener('click',()=>{
    for(let r=scScores.length-1;r>=0;r--){for(let p=scN-1;p>=0;p--){if(scScores[r][p]!=null){scScores[r][p]=null;if(scEndMode==="target"&&r===scScores.length-1&&scScores[r].every(v=>v==null)&&scScores.length>1)scScores.pop();scSave();scRenderTable();return;}}}
  });
  document.getElementById('sc-new-setup').addEventListener('click',()=>{
    document.getElementById('sc-game').classList.add('hidden');
    document.getElementById('sc-setup').classList.remove('hidden');
    try{sessionStorage.removeItem('cs_sc');}catch(e){}
  });
  scLoad();
}
</script>
</body>
</html>

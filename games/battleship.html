<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d12">
<title>Battleship</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
:root{--gw:clamp(260px,min(100vw - 32px,100vh - 430px),440px);}
@supports (height:100dvh){:root{--gw:clamp(260px,min(100vw - 32px,100dvh - 430px),440px);}}
.site-nav button.icon-btn{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;display:inline-grid;place-items:center;}
.icon-btn svg{width:18px;height:18px;}

/* ── Grid ───────────────────────────────────────────────── */
.bs-board{width:var(--gw);max-width:100%;margin:0 auto;padding:6px;border-radius:16px;
  background:radial-gradient(120% 100% at 50% 0%,#0d3b66,#072544);box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);}
.bs-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:100%;margin:0 auto;touch-action:manipulation;}
.bs-cell{position:relative;aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,transform .1s;-webkit-tap-highlight-color:transparent;user-select:none;}
.bs-cell.sea{background:rgba(120,190,255,.1);}
.bs-cell.sea:active{background:rgba(120,190,255,.28);transform:scale(.9);}
@media (hover:hover){.bs-cell.sea:hover{background:rgba(120,190,255,.22);}}
.bs-cell.ship{background:linear-gradient(180deg,#8fa3b8,#5d7086);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.2);}
.bs-cell.prev{background:rgba(245,200,66,.55);}
.bs-cell.prev.bad{background:rgba(248,113,113,.55);}
.bs-cell.hit{background:rgba(255,90,60,.25);cursor:default;}
.bs-cell.hit::after{content:'';width:56%;height:56%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffd0a0,#ff5a2a 55%,#c41d0a);box-shadow:0 0 8px rgba(255,90,40,.8);animation:boom .35s var(--spring);}
.bs-cell.miss{background:rgba(120,190,255,.05);cursor:default;}
.bs-cell.miss::after{content:'';width:24%;height:24%;border-radius:50%;background:rgba(255,255,255,.55);animation:boom .3s var(--ease);}
.bs-cell.sunk{background:linear-gradient(180deg,#7a2a22,#4d1510);cursor:default;}
.bs-cell.sunk::after{content:'';width:40%;height:40%;border-radius:50%;background:#ff6a4a;opacity:.8;}
.bs-cell.sunk-ship{background:linear-gradient(180deg,#5a2a26,#3a1714);}
.bs-cell.no-act{cursor:default !important;}
@keyframes boom{from{transform:scale(.2);opacity:.2;}to{transform:none;opacity:1;}}

/* ── Placement ──────────────────────────────────────────── */
.phase{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.place-hint{color:var(--text-2);font-size:.88rem;line-height:1.45;text-align:center;}
.orient-row{margin:0;width:var(--gw);max-width:100%;align-self:center;}
.ship-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;width:max(var(--gw),min(100vw - 32px,440px));max-width:100%;align-self:center;}
.ship-entry{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line-2);cursor:pointer;transition:border-color .15s,background .15s,transform .1s;touch-action:manipulation;}
.ship-entry:active{transform:scale(.97);}
.ship-entry.selected{border-color:var(--gold);background:rgba(245,200,66,.1);}
.ship-entry.placed{border-color:rgba(90,200,250,.4);background:rgba(90,200,250,.06);}
.ship-pips{display:flex;gap:2px;flex-shrink:0;}
.ship-pip{width:9px;height:14px;border-radius:3px;background:rgba(255,255,255,.25);}
.ship-entry.selected .ship-pip{background:var(--gold);}
.ship-entry.placed .ship-pip{background:#5ac8fa;}
.ship-info{flex:1;min-width:0;}
.ship-nm{font-size:.84rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ship-sz{font-size:.72rem;color:var(--text-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ship-entry.selected .ship-nm{color:var(--gold);}
.ship-entry.placed .ship-sz{color:#5ac8fa;}
.place-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;width:max(var(--gw),min(100vw - 32px,440px));max-width:100%;align-self:center;}

/* ── Battle ─────────────────────────────────────────────── */
.battle-status{text-align:center;font-size:.95rem;font-weight:600;color:var(--text-2);min-height:24px;}
.battle-status b{color:var(--text);}
.grid-lbl{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:0 auto 6px;width:var(--gw);max-width:100%;}
.fleet-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px;}
.fleet-chip{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);transition:opacity .3s;}
.fleet-chip.sunk{opacity:.5;}
.fchip-pips{display:flex;gap:2px;}
.fchip-pip{width:6px;height:10px;border-radius:2px;background:#5ac8fa;}
.fchip-pip.dmg,.fleet-chip.sunk .fchip-pip{background:var(--red);}
.fchip-name{font-size:.72rem;font-weight:700;color:var(--text-2);white-space:nowrap;}
.fleet-chip.sunk .fchip-name{text-decoration:line-through;}
.home{display:grid;grid-template-columns:minmax(0,44%) 1fr;gap:12px;width:max(var(--gw),min(100vw - 32px,440px));max-width:100%;margin:2px auto 0;align-items:start;}
.home .grid-lbl{width:100%;}
.home .bs-board{width:100%;padding:4px;border-radius:12px;}
.home .bs-grid{gap:1px;}
.home .bs-cell{border-radius:2px;}
.home .bs-cell.hit::after{width:70%;height:70%;box-shadow:none;}
.home .fleet-row{justify-content:flex-start;margin-top:0;}
.home .fleet-chip{padding:3px 7px;}
.battle-log{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:62px;overflow-y:auto;}
.battle-log:empty{display:none;}
.log-entry{padding:6px 10px;font-size:.78rem;font-weight:600;border-bottom:1px solid var(--line);}
.log-entry:last-child{border-bottom:none;}
.log-entry.sunk-log{color:var(--gold);}
.log-entry.hit-log{color:#ffb4a0;}
.log-entry.miss-log{color:var(--text-3);}

/* ── End ────────────────────────────────────────────────── */
.end-card{text-align:center;}
.end-card.lose{background:linear-gradient(135deg,rgba(248,113,113,.16),rgba(248,113,113,.04));border-color:rgba(248,113,113,.35);}
.end-card.lose .winner-name{color:#fca5a5;}
.end-icon{font-size:2.6rem;line-height:1;margin-bottom:6px;}
.end-sub{color:var(--text-2);font-size:.95rem;margin:4px 0 16px;}
.end-stats{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
.end-stats .stat{max-width:none;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a>
  <span class="nav-title">Battleship</span>
  <button class="icon-btn hidden" id="restart-btn" aria-label="New game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</nav>

<div class="page">

<!-- ══ PHASE 1: PLACEMENT ══════════════════════════════════════════════════ -->
<div id="ph-place" class="phase">
  <p class="place-hint">Pick a ship, then tap the grid to place it. Tap a placed ship to move it.</p>

  <div class="tabs orient-row">
    <button class="tab active" id="btn-horiz">↔ Horizontal</button>
    <button class="tab" id="btn-vert">↕ Vertical</button>
  </div>

  <div id="ship-list" class="ship-list"></div>

  <div class="bs-board"><div class="bs-grid" id="place-grid"></div></div>

  <div class="place-actions">
    <button class="btn btn-outline" id="auto-btn">Shuffle</button>
    <button class="btn btn-gold" id="start-btn" disabled>Start battle</button>
  </div>
</div>

<!-- ══ PHASE 2: BATTLE ═════════════════════════════════════════════════════ -->
<div id="ph-battle" class="phase hidden">
  <div class="battle-status" id="battle-status">Your turn — tap to fire!</div>

  <div>
    <div class="grid-lbl"><span>Enemy waters</span><span id="shots-lbl"></span></div>
    <div class="bs-board"><div class="bs-grid" id="enemy-grid"></div></div>
    <div class="fleet-row" id="cpu-fleet"></div>
  </div>

  <div class="home">
    <div>
      <div class="grid-lbl"><span>Your fleet</span></div>
      <div class="bs-board"><div class="bs-grid" id="your-grid"></div></div>
    </div>
    <div>
      <div class="grid-lbl"><span>Ships</span></div>
      <div class="fleet-row" id="player-fleet"></div>
      <div class="battle-log" id="battle-log"></div>
    </div>
  </div>
</div>

<!-- ══ PHASE 3: END ════════════════════════════════════════════════════════ -->
<div id="ph-end" class="phase hidden">
  <div class="winner-banner end-card" id="end-card">
    <div class="end-icon" id="end-icon"></div>
    <div class="winner-name end-title" id="end-title"></div>
    <div class="end-sub" id="end-sub"></div>
    <div class="end-stats" id="end-stats"></div>
    <button class="btn btn-gold btn-block" id="play-again-btn">Play again</button>
  </div>
</div>

</div><!-- /page -->

<script>
'use strict';
// app.js is deferred; stub GN until it loads so early calls never throw
window.GN=window.GN||{haptic(){},toast(){},sheet(){return{close(){},el:document.createElement('div')};},confirm:()=>Promise.resolve(true)};

// ── Constants ──────────────────────────────────────────────────────────────
const SHIPS = [
  { name: 'Carrier',    size: 5 },
  { name: 'Battleship', size: 4 },
  { name: 'Cruiser',    size: 3 },
  { name: 'Submarine',  size: 3 },
  { name: 'Destroyer',  size: 2 },
];
const N = 10;

function toast(msg, type = 'good', dur = 3000) { GN.toast(msg, dur); }

// ── Battle log ─────────────────────────────────────────────────────────────
const MAX_LOG = 8;
function logEvent(msg, type) {
  const log = document.getElementById('battle-log');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + type + '-log';
  entry.textContent = msg;
  log.insertBefore(entry, log.firstChild);
  while (log.children.length > MAX_LOG) log.removeChild(log.lastChild);
}

// ── Board helpers ──────────────────────────────────────────────────────────
function mkBoard() {
  return Array.from({length: N}, () => Array(N).fill(0));
}

function canPlace(board, r, c, size, horiz) {
  for (let i = 0; i < size; i++) {
    const nr = horiz ? r     : r + i;
    const nc = horiz ? c + i : c;
    if (nr < 0 || nr >= N || nc < 0 || nc >= N) return false;
    if (board[nr][nc]) return false;
  }
  return true;
}

function doPlace(board, r, c, size, horiz, val) {
  for (let i = 0; i < size; i++) {
    const nr = horiz ? r     : r + i;
    const nc = horiz ? c + i : c;
    board[nr][nc] = val;
  }
}

function autoPlaceAll(board) {
  SHIPS.forEach((s, idx) => {
    let placed = false;
    while (!placed) {
      const r = Math.floor(Math.random() * N);
      const c = Math.floor(Math.random() * N);
      const h = Math.random() < .5;
      if (canPlace(board, r, c, s.size, h)) {
        doPlace(board, r, c, s.size, h, idx + 1);
        placed = true;
      }
    }
  });
}

// ══════════════════════════════════════════════════════════════════════════
// PLACEMENT PHASE
// ══════════════════════════════════════════════════════════════════════════
let placeBoard;
let placedShips;  // null | {r, c, horiz}
let selShip;      // index or null
let horiz = true;

function initPlacement() {
  placeBoard  = mkBoard();
  placedShips = Array(SHIPS.length).fill(null);
  selShip     = 0;
  horiz       = true;
  updateOrientBtns();
  buildShipList();
  renderPlaceGrid();
  updateStartBtn();

  show('ph-place');
  hide('ph-battle');
  hide('ph-end');
  hide('restart-btn');
}
function freshPlacement() { try{sessionStorage.removeItem('bs');}catch(e){} initPlacement(); }

function updateOrientBtns() {
  document.getElementById('btn-horiz').classList.toggle('active', horiz);
  document.getElementById('btn-vert').classList.toggle('active', !horiz);
}

function buildShipList() {
  const list = document.getElementById('ship-list');
  list.innerHTML = '';
  SHIPS.forEach((s, i) => {
    const placed = !!placedShips[i];
    const isSel  = selShip === i;

    const entry = document.createElement('div');
    entry.className = 'ship-entry ' + (isSel ? 'selected' : placed ? 'placed' : 'selectable');

    const pips = document.createElement('div'); pips.className = 'ship-pips';
    for (let j = 0; j < s.size; j++) {
      const p = document.createElement('div'); p.className = 'ship-pip';
      pips.appendChild(p);
    }
    const info = document.createElement('div'); info.className = 'ship-info';
    info.innerHTML = `<div class="ship-nm">${s.name}</div><div class="ship-sz">${isSel ? 'Tap the grid' : placed ? 'Placed ✓' : s.size + ' cells'}</div>`;
    entry.appendChild(pips);
    entry.appendChild(info);

    entry.addEventListener('click', () => {
      GN.haptic('select');
      if (placed) pickupShip(i); else selectShip(i);
    });
    list.appendChild(entry);
  });
}

function selectShip(i) {
  selShip = i;
  buildShipList();
}

function pickupShip(i) {
  if (!placedShips[i]) return;
  const { r, c, horiz: h } = placedShips[i];
  doPlace(placeBoard, r, c, SHIPS[i].size, h, 0);
  placedShips[i] = null;
  selShip = i;
  horiz = h; updateOrientBtns();
  buildShipList();
  renderPlaceGrid();
  updateStartBtn();
}

// Preview state: array of [r,c] or empty
let previewCells = [], previewValid = false;

function setPreview(r, c) {
  previewCells.forEach(([pr, pc]) => {
    const cell = placeGridCell(pr, pc);
    if (cell) {
      cell.classList.remove('prev', 'bad');
      cell.classList.add(placeBoard[pr][pc] ? 'ship' : 'sea');
    }
  });
  if (selShip === null) { previewCells = []; return; }

  const s = SHIPS[selShip];
  const cells = [];
  for (let i = 0; i < s.size; i++) {
    const nr = horiz ? r     : r + i;
    const nc = horiz ? c + i : c;
    if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
    cells.push([nr, nc]);
  }
  previewValid = canPlace(placeBoard, r, c, s.size, horiz);
  previewCells = cells;
  cells.forEach(([pr, pc]) => {
    const cell = placeGridCell(pr, pc);
    if (cell) {
      cell.classList.remove('sea', 'ship');
      cell.classList.add('prev');
      if (!previewValid) cell.classList.add('bad');
    }
  });
}

function clearPreview() { setPreview(-99, -99); }

function placeGridCell(r, c) {
  return document.querySelector(`#place-grid [data-r="${r}"][data-c="${c}"]`);
}

function renderPlaceGrid() {
  const g = document.getElementById('place-grid');
  g.innerHTML = '';
  previewCells = [];
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      const sid  = placeBoard[r][c];
      cell.className = 'bs-cell ' + (sid ? 'ship' : 'sea');
      cell.dataset.r = r; cell.dataset.c = c;
      cell.addEventListener('click', () => onPlaceCellClick(r, c));
      cell.addEventListener('mouseenter', () => { if (selShip !== null) setPreview(r, c); });
      g.appendChild(cell);
    }
  }
}
document.getElementById('place-grid').addEventListener('mouseleave', clearPreview);

function onPlaceCellClick(r, c) {
  const sid = placeBoard[r][c];

  if (sid && (selShip === null || sid !== selShip + 1)) {
    // Tap a placed ship → pick it up to move it
    GN.haptic('select');
    pickupShip(sid - 1);
    return;
  }
  if (selShip === null) return;

  const s = SHIPS[selShip];
  if (!canPlace(placeBoard, r, c, s.size, horiz)) {
    setPreview(r, c);
    GN.haptic('error');
    GN.toast(`The ${s.name} doesn't fit there`, 1400);
    setTimeout(clearPreview, 600);
    return;
  }
  GN.haptic('light');

  doPlace(placeBoard, r, c, s.size, horiz, selShip + 1);
  placedShips[selShip] = { r, c, horiz };

  // Auto-select next unplaced ship
  const next = placedShips.findIndex((p, i) => i > selShip && !p);
  const any  = placedShips.findIndex(p => !p);
  selShip = next >= 0 ? next : any >= 0 ? any : null;

  buildShipList();
  renderPlaceGrid();
  updateStartBtn();
}

function updateStartBtn() {
  document.getElementById('start-btn').disabled = placedShips.some(p => !p);
}

// Shuffle: auto-place all
document.getElementById('auto-btn').addEventListener('click', () => {
  placeBoard  = mkBoard();
  placedShips = Array(SHIPS.length).fill(null);
  autoPlaceAll(placeBoard);
  SHIPS.forEach((s, i) => {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (placeBoard[r][c] === i + 1 && !placedShips[i]) {
        const h = (c + 1 < N && placeBoard[r][c + 1] === i + 1);
        placedShips[i] = { r, c, horiz: h };
      }
    }
  });
  selShip = null;
  GN.haptic('medium');
  buildShipList(); renderPlaceGrid(); updateStartBtn();
});

document.getElementById('btn-horiz').addEventListener('click', () => { horiz = true;  updateOrientBtns(); GN.haptic('select'); });
document.getElementById('btn-vert').addEventListener('click',  () => { horiz = false; updateOrientBtns(); GN.haptic('select'); });

document.getElementById('start-btn').addEventListener('click', startBattle);

// ══════════════════════════════════════════════════════════════════════════
// BATTLE PHASE
// ══════════════════════════════════════════════════════════════════════════
let playerBoard, cpuBoard;
let playerShots, cpuShots;   // 'hit'|'miss'|'sunk'|0
let playerHP, cpuHP;         // remaining hp per ship index
let playerSunk, cpuSunk;     // boolean[] per ship
let playerTurn, battleOver;
let cpuTimer = null;

// CPU AI state
let cpuHits, cpuDir, cpuDirQueue;

function startBattle() {
  playerBoard  = placeBoard.map(r => [...r]);
  cpuBoard     = mkBoard(); autoPlaceAll(cpuBoard);
  playerShots  = mkBoard();
  cpuShots     = mkBoard();
  playerHP     = SHIPS.map(s => s.size);
  cpuHP        = SHIPS.map(s => s.size);
  playerSunk   = Array(SHIPS.length).fill(false);
  cpuSunk      = Array(SHIPS.length).fill(false);
  playerTurn   = true;
  battleOver   = false;
  cpuHits      = [];
  cpuDir       = null;
  cpuDirQueue  = null;

  document.getElementById('battle-log').innerHTML = '';
  showBattle();
  GN.haptic('medium');
  setStatus('<b>Your turn</b> — tap enemy waters to fire');
  renderBattle();
}

function showBattle() {
  show('ph-battle');
  hide('ph-place');
  hide('ph-end');
  show('restart-btn');
  window.scrollTo({top: 0});
}

function setStatus(html) {
  document.getElementById('battle-status').innerHTML = html;
}

function shotStats() {
  let shots = 0, hits = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const v = playerShots[r][c];
    if (v) shots++;
    if (v === 'hit' || v === 'sunk') hits++;
  }
  return { shots, hits };
}

function renderBattle() {
  const { shots, hits } = shotStats();
  document.getElementById('shots-lbl').textContent = shots ? `${hits}/${shots} hits` : '';
  renderEnemyGrid();
  renderYourGrid();
  renderFleet('cpu-fleet',    cpuSunk,    cpuHP,    false);
  renderFleet('player-fleet', playerSunk, playerHP, true);
}

// ── Enemy grid ─────────────────────────────────────────────────────────────
function renderEnemyGrid() {
  const g = document.getElementById('enemy-grid');
  g.innerHTML = '';
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      const shot = playerShots[r][c];
      cell.className = 'bs-cell ' + (shot === 'sunk' ? 'sunk' : shot === 'hit' ? 'hit' : shot === 'miss' ? 'miss' : 'sea');
      cell.dataset.r = r; cell.dataset.c = c;
      if (!shot && playerTurn && !battleOver) {
        cell.addEventListener('click', () => playerFire(r, c));
      } else {
        cell.classList.add('no-act');
      }
      g.appendChild(cell);
    }
  }
}

// ── Your grid ──────────────────────────────────────────────────────────────
function renderYourGrid() {
  const g = document.getElementById('your-grid');
  g.innerHTML = '';
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      const shot = cpuShots[r][c];
      const sid  = playerBoard[r][c];
      const isSunkShip = sid && playerSunk[sid - 1];

      if (shot === 'sunk')      cell.className = 'bs-cell sunk no-act';
      else if (shot === 'hit')  cell.className = 'bs-cell hit no-act';
      else if (shot === 'miss') cell.className = 'bs-cell miss no-act';
      else if (isSunkShip)      cell.className = 'bs-cell sunk-ship no-act';
      else if (sid)             cell.className = 'bs-cell ship no-act';
      else                      cell.className = 'bs-cell sea no-act';
      g.appendChild(cell);
    }
  }
}

// ── Fleet status ───────────────────────────────────────────────────────────
function renderFleet(id, sunkArr, hpArr, isPlayer) {
  const row = document.getElementById(id);
  row.innerHTML = SHIPS.map((s, i) => {
    const sunk = sunkArr[i];
    const hp   = hpArr[i];
    const pips = Array.from({length: s.size}, (_, j) => {
      // For enemy ships: only reveal damage once the ship is fully sunk.
      const hit = isPlayer ? j >= hp : (sunk && j >= hp);
      return `<div class="fchip-pip${hit ? ' dmg' : ''}"></div>`;
    }).join('');
    return `<div class="fleet-chip ${sunk ? 'sunk' : 'afloat'}">
      <div class="fchip-pips">${pips}</div>
      <div class="fchip-name">${s.name}</div>
    </div>`;
  }).join('');
}

// ── Player fires ───────────────────────────────────────────────────────────
function playerFire(r, c) {
  if (!playerTurn || battleOver || playerShots[r][c]) return;

  const sid = cpuBoard[r][c];
  if (sid) {
    cpuHP[sid - 1]--;
    const justSunk = cpuHP[sid - 1] === 0;
    if (justSunk) {
      markSunk(cpuBoard, playerShots, sid);
      cpuSunk[sid - 1] = true;
      sSunk(); GN.haptic('heavy');
      toast(`💥 You sunk the enemy ${SHIPS[sid-1].name}!`, 'good', 3000);
      logEvent(`💥 You sunk the enemy ${SHIPS[sid-1].name}!`, 'sunk');
    } else {
      sHit(); GN.haptic('medium');
      playerShots[r][c] = 'hit';
      logEvent(`🎯 Hit at ${coordLabel(r,c)}`, 'hit');
    }
  } else {
    sMiss(); GN.haptic('light');
    playerShots[r][c] = 'miss';
    logEvent(`Miss at ${coordLabel(r,c)}`, 'miss');
  }

  // Check win
  if (cpuSunk.every(Boolean)) {
    battleOver = true; renderBattle();
    setTimeout(() => endGame(true), 700); return;
  }

  playerTurn = false;
  renderBattle();
  setStatus(sid ? (cpuSunk[sid-1] ? '<b>Sunk!</b> Computer is targeting…' : '<b>Hit!</b> Computer is targeting…') : 'Miss · Computer is targeting…');
  cpuTimer = setTimeout(cpuFire, sid ? 700 : 500);
}

function markSunk(board, shots, sid) {
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++)
      if (board[r][c] === sid) shots[r][c] = 'sunk';
}

// ── CPU fires ──────────────────────────────────────────────────────────────
function cpuFire() {
  if (battleOver) return;

  let r, c;

  // Target mode: follow known hits
  if (cpuHits.length > 0) {
    const shot = cpuTargetShot();
    if (shot) { r = shot[0]; c = shot[1]; }
  }

  // Hunt mode: checkerboard (r+c even), random fallback
  if (r === undefined) {
    const candidates = [];
    for (let ri = 0; ri < N; ri++)
      for (let ci = 0; ci < N; ci++)
        if (!cpuShots[ri][ci] && (ri + ci) % 2 === 0) candidates.push([ri, ci]);
    if (!candidates.length) {
      for (let ri = 0; ri < N; ri++)
        for (let ci = 0; ci < N; ci++)
          if (!cpuShots[ri][ci]) candidates.push([ri, ci]);
    }
    [r, c] = candidates[Math.floor(Math.random() * candidates.length)];
  }

  const sid = playerBoard[r][c];
  if (sid) {
    playerHP[sid - 1]--;
    const justSunk = playerHP[sid - 1] === 0;
    if (justSunk) {
      markSunk(playerBoard, cpuShots, sid);
      playerSunk[sid - 1] = true;
      cpuHits = cpuHits.filter(([hr,hc]) => playerBoard[hr][hc] !== sid);
      cpuDir  = null; cpuDirQueue = null;
      sSunk(); GN.haptic('error');
      toast(`🚢 Computer sunk your ${SHIPS[sid-1].name}!`, 'bad', 3000);
      logEvent(`🚢 Computer sunk your ${SHIPS[sid-1].name}`, 'sunk');
    } else {
      cpuShots[r][c] = 'hit';
      cpuHits.push([r, c]);
      sYourHit(); GN.haptic('medium');
      logEvent(`Computer hit your ship at ${coordLabel(r,c)}`, 'hit');
      if (cpuHits.length >= 2 && cpuDir === null) {
        const [r1,c1] = cpuHits[cpuHits.length-2];
        cpuDir = [r-r1, c-c1];
      }
    }
  } else {
    cpuShots[r][c] = 'miss';
    if (cpuDir) cpuDir = [-cpuDir[0], -cpuDir[1]]; // reverse direction
    sMiss();
    logEvent(`Computer missed at ${coordLabel(r,c)}`, 'miss');
  }

  if (playerSunk.every(Boolean)) {
    battleOver = true; renderBattle();
    setTimeout(() => endGame(false), 700); return;
  }

  playerTurn = true;
  renderBattle();
  setStatus(sid ? '<b>Your turn</b> · you were hit — fire back!' : '<b>Your turn</b> — tap to fire');
}

function cpuTargetShot() {
  // Try to continue in current direction
  if (cpuDir && cpuHits.length > 0) {
    const [lr, lc] = cpuHits[cpuHits.length - 1];
    const [dr, dc] = cpuDir;
    const nr = lr + dr, nc = lc + dc;
    if (nr >= 0 && nr < N && nc >= 0 && nc < N && !cpuShots[nr][nc]) return [nr, nc];
    // Reverse from first hit
    const [fr, fc] = cpuHits[0];
    const rnr = fr - dr, rnc = fc - dc;
    if (rnr >= 0 && rnr < N && rnc >= 0 && rnc < N && !cpuShots[rnr][rnc]) {
      cpuDir = [-dr, -dc]; return [rnr, rnc];
    }
    cpuDir = null;
  }
  // Try all 4 directions from any hit cell
  for (const [hr, hc] of cpuHits) {
    for (const [dr, dc] of [[0,1],[0,-1],[1,0],[-1,0]]) {
      const nr = hr + dr, nc = hc + dc;
      if (nr >= 0 && nr < N && nc >= 0 && nc < N && !cpuShots[nr][nc]) return [nr, nc];
    }
  }
  return null;
}

function coordLabel(r, c) {
  return 'ABCDEFGHIJ'[r] + (c + 1);
}

// ── End game ───────────────────────────────────────────────────────────────
function endGame(won) {
  won ? sWin() : sLose();
  GN.haptic(won ? 'success' : 'error');
  try{sessionStorage.removeItem('bs');}catch(e){}
  show('ph-end');
  hide('ph-battle');
  hide('restart-btn');
  window.scrollTo({top: 0});
  const card = document.getElementById('end-card');
  card.className = 'winner-banner end-card ' + (won ? 'win' : 'lose');
  document.getElementById('end-icon').textContent  = won ? '🏆' : '💀';
  document.getElementById('end-title').textContent = won ? 'Victory!' : 'Defeated';
  const cpuSunkCount = cpuSunk.filter(Boolean).length;
  document.getElementById('end-sub').textContent = won
    ? `You sunk all ${SHIPS.length} enemy ships!`
    : `The computer sunk all ${SHIPS.length} of your ships. You sunk ${cpuSunkCount}.`;
  const { shots, hits } = shotStats();
  document.getElementById('end-stats').innerHTML =
    `<div class="stat"><div class="stat-val">${shots}</div><div class="stat-lbl">Shots</div></div>` +
    `<div class="stat"><div class="stat-val">${shots ? Math.round(hits / shots * 100) : 0}%</div><div class="stat-lbl">Accuracy</div></div>` +
    `<div class="stat"><div class="stat-val">${cpuSunkCount}/${SHIPS.length}</div><div class="stat-lbl">Sunk</div></div>`;
}

document.getElementById('play-again-btn').addEventListener('click', freshPlacement);
document.getElementById('restart-btn').addEventListener('click', async () => {
  if (!(await GN.confirm('You will lose the current battle.', {title: 'Abandon this battle?', ok: 'New game', danger: true}))) return;
  battleOver = true;
  clearTimeout(cpuTimer);
  freshPlacement();
});

// ── Helpers ────────────────────────────────────────────────────────────────
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

// ── Sound ────────────────────────────────────────────────────────────────────
let _ac=null,_muted=false;
function sac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function sTone(freq,start,dur,vol,type,ramp){
  try{
  const ctx=sac(),t=ctx.currentTime+start,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(ramp)o.frequency.exponentialRampToValueAtTime(ramp,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.18,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function sNoise(start,dur,fc,q,vol,decay){
  try{
  const ctx=sac(),t=ctx.currentTime+start;
  const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*(decay||0.5)));
  const src=ctx.createBufferSource();src.buffer=buf;
  const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=fc||1000;filt.Q.value=q||2;
  const g=ctx.createGain();g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(filt);filt.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+dur+0.05);
  }catch(e){}
}
function sWin(){if(_muted)return;[523,659,784,1047].forEach((f,i)=>sTone(f,i*.08,.5,.2));}
function sLose(){if(_muted)return;[400,320,240].forEach((f,i)=>sTone(f,i*.1,.35,.18,'triangle'));}
function sMiss(){if(_muted)return;sNoise(0,.25,400,1,.15,.3);sTone(200,0,.25,.08,'sine',80);}
function sHit(){if(_muted)return;sNoise(0,.08,1200,3,.2,.1);sNoise(.05,.3,150,1,.25,.4);sTone(120,.02,.3,.15,'sawtooth',40);}
function sSunk(){if(_muted)return;sNoise(0,.12,800,2,.25,.1);sNoise(.08,.5,100,1,.35,.5);sTone(80,.1,.5,.2,'sawtooth',30);[440,554,659].forEach((f,i)=>sTone(f,.4+i*.09,.4,.15));}
function sYourHit(){if(_muted)return;sNoise(0,.06,600,4,.2,.12);sTone(180,0,.2,.12,'sawtooth',80);}

// ── Boot ───────────────────────────────────────────────────────────────────
initPlacement();

// ── Session persistence ────────────────────────────────────────────────────
// Saves the whole battle (boards, shots, hp, sunk flags) under the same 'bs' key.
function _save_bs(){
  if(!playerBoard||battleOver||!playerShots)return;
  try{sessionStorage.setItem('bs',JSON.stringify({playerBoard,cpuBoard,playerTurn,battleOver:false,cpuHits,cpuDir,cpuDirQueue,
    playerShots,cpuShots,playerHP,cpuHP,playerSunk,cpuSunk,_ts:Date.now()}));}catch(e){}
}
function _load_bs(){
  try{
    const raw=sessionStorage.getItem('bs');if(!raw)return false;
    const s=JSON.parse(raw);if(!s||!s.playerBoard)return false;
    // Older saves lack shots/hp and can't be resumed — start fresh
    if(!s.playerShots||!s.cpuShots||!s.playerHP||!s.cpuHP){sessionStorage.removeItem('bs');return false;}
    playerBoard=s.playerBoard;cpuBoard=s.cpuBoard;
    battleOver=false;cpuHits=s.cpuHits||[];cpuDir=s.cpuDir||null;cpuDirQueue=s.cpuDirQueue||null;
    playerShots=s.playerShots;cpuShots=s.cpuShots;playerHP=s.playerHP;cpuHP=s.cpuHP;
    playerSunk=s.playerSunk||playerHP.map(h=>h===0);cpuSunk=s.cpuSunk||cpuHP.map(h=>h===0);
    showBattle();
    if(s.playerTurn===false){
      playerTurn=false;renderBattle();setStatus('Computer is targeting…');
      cpuTimer=setTimeout(cpuFire,600);
    } else {
      playerTurn=true;renderBattle();setStatus('<b>Your turn</b> — tap to fire');
    }
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_bs);
window.addEventListener('pagehide',_save_bs);
_load_bs();
</script>

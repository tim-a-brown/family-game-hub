<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rook Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.rform .rrow .avatar{display:none;}
.rform .rrow .nm{white-space:normal;line-height:1.2;}
.rform .seg > button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-prev{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rk-prev > div{padding:8px 10px;border-radius:var(--r-sm);background:var(--w06);text-align:center;}
.rk-prev .n{display:block;font-size:.75rem;font-weight:800;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-prev .v{font-weight:900;font-size:1.3rem;font-variant-numeric:tabular-nums;}
.rk-prev .v.neg{color:var(--red);}
.rk-prev .v.pos{color:var(--green);}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null;
  var SETUP = 'rook_pad_setup', TOTAL = 180;

  Kit.init({
    id: 'rook', title: 'Rook score',
    onNew: function () { if (pad) pad.clear(); localStorage.removeItem(SETUP); showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history('rk', { keys: ['rook'], title: 'Rook: past games' }); } }],
    rules:
      '<p class="goal">Play Rook with a real deck and keep score here. Partners sit across from each other. <b>First team to 500 wins.</b></p>' +
      '<h3>The deck</h3><p>Take out the 2s, 3s and 4s. Play with 1 and 5 to 14 in four colors, plus the Rook. The <b>1 is the highest</b> card of each color. Deal 10 cards each and 5 face down to the <b>nest</b>.</p>' +
      '<h3>Point cards (180 per hand)</h3><ul><li><b>Rook:</b> 20</li><li><b>1s:</b> 15 each</li><li><b>14s and 10s:</b> 10 each</li><li><b>5s:</b> 5 each</li></ul>' +
      '<h3>Bidding and play</h3><ul><li>Bid in 5s starting at 100. Once you pass, you are out.</li>' +
      '<li>The high bidder takes the nest, puts 5 cards back, and names trump. The <b>Rook is the highest trump</b>.</li>' +
      '<li>Follow the color led if you can (the Rook counts as trump). Whoever takes the <b>last trick</b> also gets the nest.</li></ul>' +
      '<h3>After each hand</h3><p>Enter which team won the bid, the bid, and how many points the bidding team took. The other team took the rest of the 180.</p>' +
      '<ul><li><b>Made it:</b> the bidding team scores what it took.</li><li><b>Set:</b> the bidding team loses its bid.</li><li>The other team always scores what it took.</li></ul>'
  });

  function showSetup() {
    Kit.setup(app, {
      players: { min: 4, max: 4, count: 4, label: 'Players (partners: 1 & 3 vs 2 & 4)' },
      intro: 'Partners sit across from each other',
      options: [{ id: 'target', label: 'Play to', help: 'The first team to reach this many points wins.', value: 500, choices: [[300, '300'], [500, '500']] }],
      start: 'Start scoring',
      onStart: function (cfg) {
        localStorage.setItem(SETUP, JSON.stringify({ names: cfg.players.map(function (p) { return p.name; }), target: +cfg.options.target || 500 }));
        startPad();
      }
    });
  }

  function mult5(v, lo, hi) { return v >= lo && v <= hi && v % 5 === 0; }

  function startPad() {
    var cfg = JSON.parse(localStorage.getItem(SETUP)), N = cfg.names;
    var teams = [N[0] + ' & ' + N[2], N[1] + ' & ' + N[3]];
    function and(k) { return N[k] + ' and ' + N[k + 2]; }
    pad = Scorepad(app, {
      key: 'rk', title: 'Rook', mode: 'Scorekeeper', target: cfg.target,
      sides: teams.map(function (n) { return { name: n }; }),
      goal: 'First team to ' + cfg.target + ' wins',
      isOver: function (t) { return t.some(function (v) { return v >= cfg.target; }) && t[0] !== t[1]; },
      winner: function (t) { return t[0] === t[1] ? -1 : t[0] > t[1] ? 0 : 1; },
      form: function (ctx) {
        // Rebuild the inputs when fixing an old hand
        var bt = 0, bid = 100, took = 100;
        if (ctx.prev) {
          var d = ctx.prev.detail || [], sc = ctx.prev.scores;
          bt = d[1] && /^bid/.test(d[1]) ? 1 : 0;
          bid = parseInt(String(d[bt] || '').replace(/\D/g, ''), 10) || 100;
          took = sc[bt] < 0 ? TOTAL - sc[1 - bt] : sc[bt];
        }
        ctx.node.appendChild(el('div', { class: 'label', text: 'Who won the bid?' }));
        var seg = el('div', { class: 'seg' });
        teams.forEach(function (n, i) {
          seg.appendChild(el('button', { type: 'button', text: n, class: i === bt ? 'on' : '', onclick: function () {
            bt = i; Array.prototype.forEach.call(seg.children, function (b, j) { b.classList.toggle('on', j === i); }); Kit.sfx('tap'); check();
          } }));
        });
        ctx.node.appendChild(seg);
        var bidRow = ctx.number(0, { label: 'Bid', value: bid, min: 70, max: TOTAL, step: 5, neg: false, placeholder: '100' });
        var tookRow = ctx.number(0, { label: 'Points they took', value: took, min: 0, max: TOTAL, step: 5, neg: false, placeholder: '0' });
        bidRow.input.addEventListener('input', check); tookRow.input.addEventListener('input', check);
        ctx.node.appendChild(bidRow); ctx.node.appendChild(tookRow);
        var prev = el('div', { class: 'rk-prev' }); ctx.node.appendChild(prev);
        var note = el('div', { class: 'rnote' }); ctx.node.appendChild(note);
        var btn = el('button', { type: 'button', class: 'btn btn-primary btn-block', text: ctx.prev ? 'Save changes' : 'Score this hand' });
        ctx.node.appendChild(btn);
        function raw(row) { var v = String(row.input.value).trim(); return /^\d+$/.test(v) ? parseInt(v, 10) : NaN; }
        function scores() {
          var b = raw(bidRow), t = raw(tookRow), s = [0, 0];
          s[bt] = t >= b ? t : -b; s[1 - bt] = TOTAL - t;
          return s;
        }
        function check() {
          var b = raw(bidRow), t = raw(tookRow), msg = '', ok = true;
          tookRow.querySelector('.nm').textContent = 'Points ' + teams[bt] + ' took';
          if (!mult5(b, 70, TOTAL)) { ok = false; msg = 'The bid should be 70 to 180, in 5s.'; }
          else if (!mult5(t, 0, TOTAL)) { ok = false; msg = 'Points taken should be 0 to 180, in 5s.'; }
          prev.innerHTML = '';
          if (ok) {
            var s = scores();
            [0, 1].forEach(function (k) {
              prev.appendChild(el('div', null, [el('span', { class: 'n', text: teams[k] }), el('span', { class: 'v ' + (s[k] < 0 ? 'neg' : 'pos'), text: (s[k] > 0 ? '+' : '') + s[k] })]));
            });
            msg = t >= b ? teams[bt] + ' made the bid. ' + teams[1 - bt] + ' took ' + (TOTAL - t) + '.' : teams[bt] + ' went set by ' + (b - t) + '.';
          }
          note.className = 'rnote' + (ok ? '' : ' bad'); note.textContent = msg;
          btn.disabled = !ok;
          return ok;
        }
        btn.addEventListener('click', function () {
          if (!check()) return;
          var b = raw(bidRow), t = raw(tookRow), s = scores(), extra = { highlights: [], detail: ['', ''] };
          extra.detail[bt] = 'bid ' + b;
          if (t >= b) {
            if (t === TOTAL) { extra.highlights.push(and(bt) + ' took all 180 points in hand ' + ctx.round); extra.callout = 'All 180!'; Kit.confetti({ count: 90 }); }
            else if (b >= 140) { extra.highlights.push(and(bt) + ' bid ' + b + ' and made it'); extra.callout = 'Made it!'; }
            else extra.callout = 'Made it!';
          } else {
            extra.highlights.push(and(bt) + ' went set on a bid of ' + b + ' in hand ' + ctx.round);
            extra.callout = 'Set!';
          }
          ctx.done(s, extra);
        });
        check();
      }
    });
  }

  if (localStorage.getItem(SETUP)) startPad(); else showSetup();
})();
</script>
</body>
</html>

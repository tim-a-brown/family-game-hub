<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rook Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* The open hand: tap the team that won the bid, then its bid and the points it took */
.spad td .wait{display:block;padding:8px 2px;font-family:var(--hand);font-size:.95rem;line-height:1.1;color:#8a8796;}
.rk-col{display:flex;flex-direction:column;gap:3px;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null;
  var SETUP = 'rook_pad_setup', TOTAL = 180;

  Kit.init({
    id: 'rook', title: 'Rook score',
    onNew: function () { if (pad) pad.clear(); localStorage.removeItem(SETUP); showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history('rk', { keys: ['rook'], title: 'Rook: past games' }); } }],
    rules:
      '<p class="goal">Play Rook with a real deck and keep score here. Partners sit across from each other. <b>First team to 500 wins.</b></p>' +
      '<h3>The deck</h3><p>Take out the 2s, 3s and 4s. Play with 1 and 5 to 14 in four colors, plus the Rook. The <b>1 is the highest</b> card of each color. Deal 10 cards each and 5 face down to the <b>nest</b>.</p>' +
      '<h3>Point cards (180 per hand)</h3><ul><li><b>Rook:</b> 20</li><li><b>1s:</b> 15 each</li><li><b>14s and 10s:</b> 10 each</li><li><b>5s:</b> 5 each</li></ul>' +
      '<h3>Bidding and play</h3><ul><li>Bid in 5s starting at 100. Once you pass, you are out.</li>' +
      '<li>The high bidder takes the nest, puts 5 cards back, and names trump. The <b>Rook is the highest trump</b>.</li>' +
      '<li>Follow the color led if you can (the Rook counts as trump). Whoever takes the <b>last trick</b> also gets the nest.</li></ul>' +
      '<h3>After each hand</h3><p>The open rows on the sheet are this hand. Tap <b>Won bid</b> in the bidding team\'s column, set the <b>bid</b> and the <b>points they took</b>. The other team took the rest of the 180; made or set is worked out for you. Tap <b>Lock hand</b> to write it in, or tap a hand on the sheet to change or delete it right there.</p>' +
      '<ul><li><b>Made it:</b> the bidding team scores what it took.</li><li><b>Set:</b> the bidding team loses its bid.</li><li>The other team always scores what it took.</li></ul>'
  });

  function showSetup() {
    Kit.setup(app, {
      players: { min: 4, max: 4, count: 4, label: 'Players (partners: 1 & 3 vs 2 & 4)' },
      intro: 'Partners sit across from each other',
      options: [{ id: 'target', label: 'Play to', help: 'The first team to reach this many points wins.', value: 500, choices: [[300, '300'], [500, '500']] }],
      start: 'Start scoring',
      onStart: function (cfg) {
        localStorage.setItem(SETUP, JSON.stringify({ names: cfg.players.map(function (p) { return p.name; }), target: +cfg.options.target || 500 }));
        startPad();
      }
    });
  }

  function mult5(v, lo, hi) { return v >= lo && v <= hi && v % 5 === 0; }

  function startPad() {
    var cfg = JSON.parse(localStorage.getItem(SETUP)), N = cfg.names;
    var teams = [N[0] + ' & ' + N[2], N[1] + ' & ' + N[3]];
    function and(k) { return N[k] + ' and ' + N[k + 2]; }
    pad = Scorepad(app, {
      key: 'rk', title: 'Rook', mode: 'Scorekeeper', target: cfg.target,
      sides: teams.map(function (n) { return { name: n }; }),
      goal: 'First team to ' + cfg.target + ' wins',
      isOver: function (t) { return t.some(function (v) { return v >= cfg.target; }) && t[0] !== t[1]; },
      winner: function (t) { return t[0] === t[1] ? -1 : t[0] > t[1] ? 0 : 1; },
      // ── The open hand on the sheet ── st = {bt: bidding team or -1, bid, took (points the bidders took)}
      entryRows: function (ctx) {
        var st;
        if (ctx.editing) {
          var d = ctx.prev.detail || [], sc = ctx.prev.scores, bt = d[1] && /^bid/.test(d[1]) ? 1 : 0;
          st = { bt: bt, bid: parseInt(String(d[bt] || '').replace(/\D/g, ''), 10) || 100, took: sc[bt] < 0 ? TOTAL - sc[1 - bt] : sc[bt] };
        } else st = ctx.draft() || { bt: -1, bid: 100, took: null };
        var rowBid = el('tr', { class: 'open' }, [el('th', { class: 'rn' }, [String(ctx.round), el('small', { text: 'BID' })])]);
        var rowTook = el('tr', { class: 'open' }, [el('th', { class: 'rn' }, [el('small', { text: 'TOOK' })])]);
        var won = [], bidCell = [], tookCell = [], eqs = [];
        var bidStep = Scorepad.step({ value: st.bid, min: 70, max: TOTAL, step: 5, label: 'Bid', onChange: function (v) { st.bid = v; refresh(); } });
        var tookStep = Scorepad.step({ value: st.took, min: 0, max: TOTAL, step: 5, label: 'Points the bidding team took', onChange: function (v) { st.took = v; refresh(); } });
        var other = el('span', { class: 'sum' });
        teams.forEach(function (nm, i) {
          won[i] = Scorepad.tog('Won bid', { cls: 'gold', aria: nm + ' won the bid', onClick: function () { st.bt = st.bt === i ? -1 : i; refresh(); } });
          bidCell[i] = el('div');
          rowBid.appendChild(el('td', null, [el('div', { class: 'rk-col' }, [won[i], bidCell[i]])]));
          tookCell[i] = el('div'); eqs[i] = el('small', { class: 'eq' });
          rowTook.appendChild(el('td', null, [tookCell[i], eqs[i]]));
        });
        function place(box, node) { if (box.firstChild !== node) { box.innerHTML = ''; if (node) box.appendChild(node); } }
        function raw(v) { return v == null ? NaN : v; }
        function scores() { var b = raw(st.bid), t = raw(st.took), s = [0, 0]; s[st.bt] = t >= b ? t : -b; s[1 - st.bt] = TOTAL - t; return s; }
        function refresh() {
          var bt = st.bt;
          won.forEach(function (b, i) { b.set(i === bt); });
          teams.forEach(function (nm, i) {
            place(bidCell[i], i === bt ? bidStep : null);
            place(tookCell[i], bt < 0 ? null : i === bt ? tookStep : other);
            eqs[i].textContent = ''; eqs[i].className = 'eq';
          });
          if (bt < 0) { ctx.pending(null); ctx.status('Tap Won bid for the team that won the bidding.', 'wait'); }
          else {
            var b = raw(st.bid), t = raw(st.took), msg = '', ok = true;
            other.textContent = isNaN(t) ? '–' : String(TOTAL - t);
            if (!mult5(b, 70, TOTAL)) { ok = false; msg = 'The bid should be 70 to 180, in 5s.'; }
            else if (st.took == null) { ok = 'wait'; msg = 'Set the points ' + teams[bt] + ' took.'; }
            else if (!mult5(t, 0, TOTAL)) { ok = false; msg = 'Points taken should be 0 to 180, in 5s.'; }
            if (ok === true) {
              var s = scores();
              [0, 1].forEach(function (k) { eqs[k].textContent = (s[k] > 0 ? '+' : '') + s[k] + (k === bt ? (t >= b ? ' made' : ' set') : ''); eqs[k].classList.add(s[k] < 0 ? 'bad' : 'good'); });
              msg = t >= b ? teams[bt] + ' made the bid. ' + teams[1 - bt] + ' took ' + (TOTAL - t) + '.' : teams[bt] + ' went set by ' + (b - t) + '.';
              ctx.pending(s);
            } else ctx.pending(null);
            ctx.status(msg, ok);
          }
          if (!ctx.editing) ctx.draft(st);
        }
        refresh();
        ctx.entry = { st: st, scores: scores };
        return [rowBid, rowTook];
      },
      lockLabel: 'Lock hand',
      onLock: function (ctx) {
        var st = ctx.entry.st, bt = st.bt, b = st.bid, t = st.took;
        if (bt < 0 || !mult5(b, 70, TOTAL) || t == null || !mult5(t, 0, TOTAL)) return;
        var s = ctx.entry.scores(), extra = { highlights: [], detail: ['', ''] };
        extra.detail[bt] = 'bid ' + b;
        if (t >= b) {
          if (t === TOTAL) { extra.highlights.push(and(bt) + ' took all 180 points in hand ' + ctx.round); extra.callout = 'All 180!'; if (!ctx.editing) Kit.confetti({ count: 90 }); }
          else if (b >= 140) { extra.highlights.push(and(bt) + ' bid ' + b + ' and made it'); extra.callout = 'Made it!'; }
          else extra.callout = 'Made it!';
        } else {
          extra.highlights.push(and(bt) + ' went set on a bid of ' + b + ' in hand ' + ctx.round);
          extra.callout = 'Set!';
        }
        ctx.done(s, extra);
      }
    });
  }

  if (localStorage.getItem(SETUP)) startPad(); else showSetup();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>

<style>
body{overflow:hidden;}
.mm{display:flex;flex-direction:column;height:calc(100dvh - var(--safe-t) - 58px);max-width:820px;margin:0 auto;padding:0 8px calc(var(--safe-b) + 6px);}
@media (orientation:landscape) and (min-width:900px){ .mm{max-width:1120px;} }
.mm .scores{flex:none;margin:0;padding:2px 2px 8px;}
.mm .score{min-width:0;flex:1 1 0;padding:6px 8px 7px;flex-direction:row;gap:8px;justify-content:center;align-items:center;}
.mm .score .who{display:flex;flex-direction:column;align-items:flex-start;min-width:0;}
.mm .score .nm{max-width:100%;font-size:.8rem;}
.mm .score .pt{font-size:1.25rem;}
.mm .score .sub{font-size:.66rem;}
/* The player's pile of won pairs */
.pile{position:relative;flex:none;width:26px;height:34px;}
.pile i{position:absolute;left:0;top:0;width:24px;height:32px;border-radius:4px;background:linear-gradient(160deg,#fff,#efe7d6);box-shadow:0 0 0 1px rgba(0,0,0,.15),0 2px 3px rgba(0,0,0,.3);}
.pile.empty i{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);}
.pile svg{position:absolute;inset:3px;width:18px;height:26px;}
.pile.bump{animation:bounce .5s var(--spring);}
.stats{flex:none;display:flex;justify-content:center;gap:clamp(16px,6vw,40px);padding:2px 0 8px;}
.stats .st{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:52px;}
.stats .st b{font-size:1.3rem;font-weight:900;font-variant-numeric:tabular-nums;}
.stats .st small{font-size:.64rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);}
.mtab{flex:1;min-height:0;display:flex;border-radius:22px;padding:7px;}
.mtab .felt-in{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;display:grid;place-items:center;}
.grid{display:grid;gap:var(--gap);}
/* Cards with a real 3D flip */
.mc{position:relative;width:var(--w);height:var(--h);perspective:900px;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.mc .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.35,.5,1);}
.mc.up .in{transform:rotateY(180deg);}
.mc .bk,.mc .fr{position:absolute;inset:0;border-radius:calc(var(--w) * .1);-webkit-backface-visibility:hidden;backface-visibility:hidden;}
.mc .bk{background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.2) 0 14%, transparent 15%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.13) 0 3px,transparent 3px 8px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.13) 0 3px,transparent 3px 8px),
    linear-gradient(135deg,var(--back-a,#5b3fd1),var(--back-b,#c0367d));
  box-shadow:inset 0 0 0 calc(var(--w) * .06) #fff, 0 0 0 1px rgba(0,0,0,.15), 0 3px 0 rgba(0,0,0,.18), 0 6px 12px rgba(0,0,0,.32);}
.mc .fr{transform:rotateY(180deg);background:linear-gradient(160deg,#ffffff 0%,#fbf7ee 60%,#f1ead9 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08), 0 3px 0 rgba(0,0,0,.15), 0 6px 12px rgba(0,0,0,.3);display:grid;place-items:center;}
.mc .fr svg{width:82%;height:auto;max-height:82%;}
.mc .fr .gicon{width:84%;height:auto;}
.mc:active:not(.up) .in{transform:scale(.95);}
.mc.hit .fr{box-shadow:inset 0 0 0 3px var(--green), 0 0 16px rgba(61,220,132,.7), 0 6px 12px rgba(0,0,0,.3);}
.mc.miss .in{animation:miss .42s;}
@keyframes miss{0%,100%{transform:rotateY(180deg);}25%{transform:rotateY(180deg) translateX(5px);}75%{transform:rotateY(180deg) translateX(-5px);}}
.mc.taken{pointer-events:none;}
.mc.taken .in{visibility:hidden;}
.mc.taken::after{content:"";position:absolute;inset:0;border-radius:calc(var(--w) * .1);border:2px dashed rgba(255,255,255,.12);}
.mc.deal{animation:dealin .45s var(--ease) both;}
@keyframes dealin{from{transform:translateY(-40px) rotate(-8deg) scale(.6);opacity:0;}to{transform:none;opacity:1;}}
.fly{position:fixed;z-index:300;pointer-events:none;border-radius:8px;background:linear-gradient(160deg,#fff,#f1ead9);display:grid;place-items:center;
  box-shadow:0 10px 24px rgba(0,0,0,.45);transition:transform .55s cubic-bezier(.5,0,.3,1), opacity .55s;}
.fly svg,.fly .gicon{width:80%;height:auto;}
.turnline{flex:none;min-height:40px;display:flex;align-items:center;justify-content:center;}
.turnline .turn{margin:4px 0 0;}
/* Setup: deck chooser */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.deck{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border:2px solid transparent;border-radius:16px;background:rgba(255,255,255,.06);color:var(--text);font-weight:800;font-size:.9rem;transition:transform .15s var(--spring), border-color .15s;}
.deck:active{transform:scale(.96);}
.deck.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);}
.deck .fan{position:relative;width:62px;height:46px;}
.deck .fan span{position:absolute;top:2px;width:32px;height:42px;border-radius:5px;background:linear-gradient(160deg,#fff,#f1ead9);box-shadow:0 2px 4px rgba(0,0,0,.35);display:grid;place-items:center;}
.deck .fan span:nth-child(1){left:2px;transform:rotate(-12deg);}
.deck .fan span:nth-child(2){left:15px;z-index:1;}
.deck .fan span:nth-child(3){left:28px;transform:rotate(12deg);z-index:2;}
.deck .fan svg,.deck .fan .gicon{width:26px;height:26px;}
.deck small{display:block;font-size:.7rem;font-weight:700;color:var(--text-3);margin-top:-4px;}
</style>
</head>

      '<h3>Playing alone</h3><p>Try to clear the table in as few <b>moves</b> as you can (one move is two flips). The clock keeps time too, and your best scores are saved.</p>' +
      '<h3>Cards</h3><p>Pick a deck (animals, food, sports, space, nature, game icons, or the tricky shapes deck, where some cards are the same shape in a different color) and a size from 12 to 36 cards.</p>' +
      '<h3>Tips</h3><ul><li>Remember where every card was, even the ones that did not match.</li><li>If you flip a card you have seen the partner of, go straight to it.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  // S.cards[i] art index; S.owner[i] player who took it (-1 = on the table);
  // S.seen[i] has been face up before; S.up = face-up cards this turn.
  var S = null, busy = false, missT = 0, tickT = 0;
  function save() {
    if (!S || S.done) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    var left = S.owner.filter(function (o) { return o < 0; }).length / 2;
    Kit.resume.set(deckName(S.deck) + ' · ' + left + ' pairs left');
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function getDeckPref() { try { var d = localStorage.getItem(DECKPREF); if (ART[d]) return d; } catch (e) {} return 'animals'; }

  function showSetup() {
    stopTick(); clearTimeout(missT); busy = false; app.className = 'stage';
    var deck = getDeckPref();
    Kit.setup(app, {
      intro: 'Flip two cards. Find the pairs.',
      players: { min: 1, max: 4, count: 1, names: true },
      options: [{ id: 'size', label: 'How many cards', help: 'More cards means more pairs to remember and a longer game.', value: '4x4', choices: [['4x3', '12'], ['4x4', '16'], ['5x4', '20'], ['6x4', '24'], ['6x5', '30'], ['6x6', '36']] }],
      start: 'Deal the cards',
      onStart: function (cfg) { newGame(deck, cfg.options.size, cfg.players); }
    });
    var box = el('div', { class: 'decks' });
    DECKS.forEach(function (d) {
      var b = el('button', { type: 'button', class: 'deck' + (d[0] === deck ? ' on' : ''), onclick: function () {
        deck = d[0]; try { localStorage.setItem(DECKPREF, deck); } catch (e) {}
        box.querySelectorAll('.deck').forEach(function (x) { x.classList.toggle('on', x === b); }); Kit.sfx('tap'); Kit.haptic('light');
      } }, [el('span', { class: 'fan', html: [0, 3, 6].map(function (i) { return '<span>' + art(d[0], d[0] === 'shapes' ? [0, 4, 11][[0, 3, 6].indexOf(i)] : i) + '</span>'; }).join('') }),
        el('span', { text: d[1] }), d[2] ? el('small', { text: d[2] }) : null]);
      box.appendChild(b);
    });
    var hero = app.querySelector('.setup-hero');
    hero.after(el('div', null, [el('div', { class: 'label', text: 'Cards' }), box]));
  }

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function newGame(deck, size, players) {
    if (!ART[deck]) deck = 'animals';
    if (!SIZES[size]) size = '4x4';
    var d = SIZES[size], pairs = d[0] * d[1] / 2;
    var pick = shuffle(ART[deck].map(function (_, i) { return i; })).slice(0, pairs), cards = shuffle(pick.concat(pick));
    players = players.map(function (p, i) { return { name: soloName(p.name, players.length), pairs: 0, best: 0, run: 0, lucky: 0, slips: 0, color: p.color || Kit.color(i) }; });
    S = { deck: deck, size: size, cards: cards, owner: cards.map(function () { return -1; }), seen: cards.map(function () { return false; }), up: [],
      players: players, turn: 0, moves: 0, misses: 0, time: 0, started: Date.now(), done: false, order: [] };
    Kit.gameStart();
    build(true); save();
    Kit.sfx('deal');
  }
  function soloName(n, count) { return /^Player \d+$/.test(n) && count === 1 ? 'You' : n; }
  function restartSame() {
    if (!S) return;
    var deck = S.deck, size = S.size, ps = S.players.map(function (p) { return { name: p.name, color: p.color }; });
    newGame(deck, size, ps);
  }

  // ── Play ──────────────────────────────────────────────────────────────────
  function solo() { return S.players.length === 1; }
  function tap(i) {
    if (!S || S.done || busy) return;
    if (S.owner[i] >= 0 || S.up.indexOf(i) >= 0) return;
    if (S.up.length === 2) { hurry(); }
    if (S.up.length === 2) return;
    startTick();
    var firstSeen = S.seen[i];
    S.up.push(i);
    cardEls[i].classList.add('up');
    Kit.sfx('flip'); Kit.haptic('light');
    if (S.up.length === 2) {
      S.moves++;
      var a = S.up[0], b = S.up[1], p = S.players[S.turn];
      if (S.cards[a] === S.cards[b]) {
        if (!S.seen[a] && !firstSeen) p.lucky++;
        S.seen[a] = S.seen[b] = true;
        busy = true;
        setTimeout(function () { match(a, b); }, 520);
      } else {
        // A slip: the partner of the first card had already been seen
        var partner = -1;
        for (var j = 0; j < S.cards.length; j++) if (j !== a && S.cards[j] === S.cards[a] && S.owner[j] < 0) partner = j;
        if (partner >= 0 && S.seen[partner] && S.seen[a]) p.slips++;
        S.seen[a] = S.seen[b] = true;
        S.misses++; p.run = 0;
        setTimeout(function () { if (S.up.length === 2 && S.up[0] === a) { cardEls[a].classList.add('miss'); cardEls[b].classList.add('miss'); Kit.sfx('bad'); } }, 420);
        missT = setTimeout(hurry, solo() ? 1100 : 1500);
      }
    } else S.seen[i] = S.seen[i] || false;
    paintBar(); save();
  }
  // Flip a missed pair back and pass the turn
  function hurry() {
    clearTimeout(missT);
    if (S.up.length !== 2) return;
    var a = S.up[0], b = S.up[1];
    S.up = [];
    [a, b].forEach(function (j) { cardEls[j].classList.remove('up', 'miss'); });
    if (!solo()) { S.turn = (S.turn + 1) % S.players.length; Kit.haptic('light'); }
    paintBar(); save();
  }
  function match(a, b) {
    var p = S.players[S.turn];
    S.owner[a] = S.owner[b] = S.turn; S.up = [];
    p.pairs++; p.run++; p.best = Math.max(p.best, p.run);
    S.order.push(S.turn);
    S.mo = (S.mo || []).concat([S.moves]); S.ma = (S.ma || []).concat([S.cards[a]]);
    cardEls[a].classList.add('hit'); cardEls[b].classList.add('hit');
    Kit.sfx('good'); Kit.haptic('success');
    if (p.run === 3) Kit.callout(solo() ? 'Three in a row!' : p.name + ': three in a row!');
    else if (p.run === 5) Kit.callout('Five in a row!');
    var target = pileEls[S.turn] || statPairs;
    setTimeout(function () {
      flyTo(cardEls[a], target, S.cards[a]); flyTo(cardEls[b], target, S.cards[b]);
      cardEls[a].classList.add('taken'); cardEls[b].classList.add('taken');
      setTimeout(function () {
        busy = false; paintBar();
        if (target.classList) { target.classList.remove('bump'); void target.offsetWidth; target.classList.add('bump'); }
        if (S.owner.every(function (o) { return o >= 0; })) finish(); else save();
      }, 560);
    }, 260);
    paintBar(); save();
  }
  function flyTo(card, target, face) {
    var r = card.getBoundingClientRect(), t = target.getBoundingClientRect();
    var f = el('div', { class: 'fly', html: art(S.deck, face) });
    f.style.left = r.left + 'px'; f.style.top = r.top + 'px'; f.style.width = r.width + 'px'; f.style.height = r.height + 'px';
    document.body.appendChild(f);
    var s = Math.max(.2, Math.min(1, t.height / r.height));
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      f.style.transform = 'translate(' + (t.left + t.width / 2 - r.left - r.width / 2) + 'px,' + (t.top + t.height / 2 - r.top - r.height / 2) + 'px) scale(' + s + ') rotate(' + (Math.random() * 20 - 10) + 'deg)';
      f.style.opacity = '.85';
    }); });
    setTimeout(function () { f.remove(); }, 600);
  }

  // ── Finish ────────────────────────────────────────────────────────────────
  function fmt(t) { t = t | 0; return Math.floor(t / 60) + ':' + ('0' + t % 60).slice(-2); }
  // History detail: the table as it was dealt. nm = the card names in play, cards = one letter per spot (index into nm),
  // own = who took each spot, pairs = names in the order found with who and on which move, per-player runs and slips.
  function histDetail() {
    var used = [], map = {}, d = SIZES[S.size] || [4, 4];
    S.cards.forEach(function (a) { if (map[a] == null) { map[a] = used.length; used.push(a); } });
    function ch(a) { return String.fromCharCode(97 + map[a]); }
    return {
      cols: Math.min(d[0], d[1]), nm: used.map(function (a) { return artName(S.deck, a); }),
      cards: S.cards.map(ch).join(''),
      own: S.owner.map(function (o) { return o < 0 ? '.' : String(o); }).join(''),
      seq: (S.ma || []).map(ch).join(''), who: S.order.join(''), mv: S.mo || [],
      pl: S.players.map(function (p) { return { b: p.best, l: p.lucky, s: p.slips }; })
    };
  }
  function finish() {
    stopTick(); S.done = true;
    var ps = S.players, n = S.cards.length / 2, hl = [], dname = deckName(S.deck);
    var past = []; try { past = GameHistory.load(KEY); } catch (e) {}
    if (solo()) {
      var me = ps[0], same = past.filter(function (e) { return e.solo && e.size === S.size; });
      var bestMoves = same.length ? Math.min.apply(null, same.map(function (e) { return e.moves || 999; })) : 0;
      var bestTime = same.length ? Math.min.apply(null, same.map(function (e) { return e.time || 99999; })) : 0;
      hl.push(me.name + ' cleared ' + S.cards.length + ' ' + dname + ' cards in ' + S.moves + ' moves and ' + fmt(S.time));
      if (S.moves === n) hl.push('A perfect game: not a single miss!');
      else if (!same.length) hl.push('First game at this size');
      else if (S.moves < bestMoves) hl.push('New fewest moves (old best ' + bestMoves + ')');
      else if (S.time < bestTime) hl.push('New best time (old best ' + fmt(bestTime) + ')');
      if (me.best >= 3) hl.push('Longest run: ' + me.best + ' pairs in a row');
      if (me.lucky) hl.push(me.lucky + (me.lucky === 1 ? ' lucky match' : ' lucky matches') + ' on cards never seen before');
      Kit.record(KEY, {
        started: S.started, mode: dname + ' · ' + S.cards.length + ' cards',
        players: [{ name: me.name, score: S.moves }], winner: me.name, lowWins: true,
        summary: S.moves + ' moves · ' + fmt(S.time), badge: S.moves + ' moves', highlights: hl.slice(0, 6),
        meta: { solo: true, size: S.size, deck: S.deck, moves: S.moves, time: S.time },
        detail: histDetail()
      });
      clearSave();
      setTimeout(function () {
        Kit.win({ title: S.moves === n ? 'Perfect memory!' : 'All matched!', sub: S.moves + ' moves · ' + fmt(S.time) + (same.length && S.moves < bestMoves ? ' · new best!' : ''),
          again: restartSame, againLabel: 'Play again', extra: [{ label: 'Change cards or players', onClick: showSetup }] });
      }, 300);
      return;
    }
    var top = Math.max.apply(null, ps.map(function (p) { return p.pairs; }));
    var winners = ps.filter(function (p) { return p.pairs === top; });
    var winner = winners.length === 1 ? winners[0].name : null;
    var runner = ps.slice().sort(function (a, b) { return b.best - a.best; })[0];
    if (runner.best >= 2) hl.push(runner.name + ' found ' + runner.best + ' pairs in a row');
    var luck = ps.slice().sort(function (a, b) { return b.lucky - a.lucky; })[0];
    if (luck.lucky) hl.push(luck.name + ' made ' + luck.lucky + (luck.lucky === 1 ? ' lucky match' : ' lucky matches') + ' on brand new cards');
    var sharp = ps.filter(function (p) { return p.pairs >= 2 && !p.slips; });
    if (sharp.length) hl.push(sharp.map(function (p) { return p.name; }).join(' and ') + (sharp.length === 1 ? ' never forgot' : ' never forgot') + ' a card they had seen');
    var lastP = S.order[S.order.length - 1]; if (lastP != null) hl.push(ps[lastP].name + ' took the last pair');
    if (!winner) hl.unshift('A tie at ' + top + ' pairs between ' + winners.map(function (p) { return p.name; }).join(' and '));
    hl.push(S.cards.length + ' ' + dname + ' cards in ' + S.moves + ' moves');
    Kit.record(KEY, {
      started: S.started, mode: dname + ' · ' + S.cards.length + ' cards',
      players: ps.map(function (p) { return { name: p.name, score: p.pairs }; }), winner: winner,
      highlights: hl.slice(0, 6), meta: { solo: false, size: S.size, deck: S.deck, moves: S.moves, time: S.time },
      detail: histDetail()
    });
    clearSave();
    var rank = ps.map(function (p, i) { return { name: p.name, score: p.pairs, color: p.color }; }).sort(function (a, b) { return b.score - a.score; });
    setTimeout(function () {
      Kit.win({ title: winner ? winner + ' wins!' : 'It’s a tie!', sub: winner ? top + ' pairs' : 'Everyone tied on ' + top + ' pairs', rank: rank,
        again: restartSame, againLabel: 'Play again', extra: [{ label: 'Change cards or players', onClick: showSetup }] });
    }, 300);
  }

  // ── Clock ─────────────────────────────────────────────────────────────────
  function startTick() { if (tickT || !S || S.done) return; tickT = setInterval(function () { if (document.visibilityState !== 'visible') return; S.time++; if (statTime) statTime.textContent = fmt(S.time); if (S.time % 10 === 0) save(); }, 1000); }
  function stopTick() { clearInterval(tickT); tickT = 0; }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && S && !S.done) save(); });

  // ── Table ─────────────────────────────────────────────────────────────────
  var cardEls = [], pileEls = [], scoreEls = [], gridEl, feltEl, statMoves, statPairs, statTime, turnEl;
  function build(fresh) {
    app.className = 'mm'; app.innerHTML = '';
    pileEls = []; scoreEls = []; statPairs = statMoves = statTime = null;
    if (solo()) {
      statMoves = el('b'); statPairs = el('b'); statTime = el('b');
      app.appendChild(el('div', { class: 'stats' }, [
        el('div', { class: 'st' }, [statMoves, el('small', { text: 'Moves' })]),
        el('div', { class: 'st' }, [statPairs, el('small', { text: 'Pairs' })]),
        el('div', { class: 'st' }, [statTime, el('small', { text: 'Time' })])]));
    } else {
      var sc = el('div', { class: 'scores' });
      S.players.forEach(function (p, i) {
        var pile = el('div', { class: 'pile' });
        var s = el('div', { class: 'score', style: { '--c': p.color } }, [pile, el('div', { class: 'who' }, [el('span', { class: 'nm', text: p.name }), el('span', { class: 'pt' })])]);
        pileEls.push(pile); scoreEls.push(s); sc.appendChild(s);
      });
      app.appendChild(sc);
    }
    feltEl = el('div', { class: 'felt-in' });
    gridEl = el('div', { class: 'grid' });
    feltEl.appendChild(gridEl);
    app.appendChild(el('div', { class: 'mtab wood' }, [feltEl]));
    turnEl = el('div', { class: 'turnline' });
    app.appendChild(turnEl);
    cardEls = S.cards.map(function (face, i) {
      var c = el('button', { type: 'button', class: 'mc', 'aria-label': 'Card ' + (i + 1) }, [el('span', { class: 'in' }, [el('span', { class: 'bk' }), el('span', { class: 'fr', html: art(S.deck, face) })])]);
      if (S.owner[i] >= 0) c.classList.add('taken');
      if (S.up.indexOf(i) >= 0) c.classList.add('up');
      if (fresh) { c.classList.add('deal'); c.style.animationDelay = (i * 28) + 'ms'; }
      c.addEventListener('click', function () { tap(i); });
      gridEl.appendChild(c);
      return c;
    });
    feltEl.addEventListener('click', function (e) { if (!e.target.closest('.mc') && S && S.up.length === 2) hurry(); });
    fit(); requestAnimationFrame(fit); paintBar();
    if (S.up.length === 2) missT = setTimeout(hurry, 900);
    else if (S.up.length === 1) { /* keep the single face-up card */ }
  }
  function fit() {
    if (!feltEl) return;
    var W = feltEl.clientWidth - 16, H = feltEl.clientHeight - 16, d = SIZES[S.size];
    function size(cols, rows) {
      var gap = Math.max(5, Math.min(12, W / cols * .1));
      var w = Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows) / 1.32);
      return { w: Math.floor(Math.min(w, W > 600 && H > 500 ? 150 : 120)), cols: cols, rows: rows, gap: gap };
    }
    var a = size(d[0], d[1]), b = size(d[1], d[0]), g = a.w >= b.w ? a : b;
    // Wide tables (tablet landscape): also try longer, flatter layouts of the same cards
    if (W > H * 1.2) {
      var n = d[0] * d[1];
      for (var c = Math.max(d[0], d[1]) + 1; c <= 12; c++) {
        if (n % c || n / c < 2) continue;
        var t = size(c, n / c); if (t.w > g.w + 4) g = t;
      }
    }
    gridEl.style.gridTemplateColumns = 'repeat(' + g.cols + ', auto)';
    gridEl.style.setProperty('--gap', Math.round(g.gap) + 'px');
    gridEl.style.setProperty('--w', g.w + 'px');
    gridEl.style.setProperty('--h', Math.round(g.w * 1.32) + 'px');
  }
  function paintBar() {
    if (!S) return;
    var total = S.cards.length / 2, got = S.owner.filter(function (o) { return o >= 0; }).length / 2;
    if (solo()) {
      statMoves.textContent = S.moves; statPairs.textContent = got + '/' + total; statTime.textContent = fmt(S.time);
      turnEl.innerHTML = '';
      turnEl.appendChild(el('div', { class: 'dim', style: { 'font-weight': '800', 'font-size': '.9rem' }, text: S.moves ? (total - got) + ' pairs to go' : 'Tap any card to start' }));
    } else {
      S.players.forEach(function (p, i) {
        scoreEls[i].classList.toggle('on', i === S.turn && !S.done);
        scoreEls[i].querySelector('.pt').textContent = p.pairs;
        var pile = pileEls[i]; pile.innerHTML = '';
        pile.classList.toggle('empty', !p.pairs);
        var n = Math.min(p.pairs, 4);
        if (!n) pile.appendChild(el('i'));
        // the top card of the pile shows the last pair they won
        var lastFace = -1; for (var j = 0; j < S.cards.length; j++) if (S.owner[j] === i) lastFace = S.cards[j];
        for (var k = 0; k < n; k++) { var c = el('i', { style: { transform: 'translate(' + (k * 1.5) + 'px,' + (-k * 1.5) + 'px) rotate(' + ((k % 2 ? 1 : -1) * k * 2) + 'deg)' } }); if (k === n - 1 && lastFace >= 0) c.innerHTML = art(S.deck, lastFace); pile.appendChild(c); }
      });
      var p = S.players[S.turn];
      turnEl.innerHTML = '';
      turnEl.appendChild(el('div', { class: 'turn', style: { '--c': p.color } }, [el('span', { class: 'dot' }), el('span', { text: Kit.poss(p.name) + ' turn' + (S.up.length === 2 && S.cards[S.up[0]] !== S.cards[S.up[1]] ? '' : p.run ? ' · go again!' : '') })]));
    }
  }
  var rzT = 0;
  window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(function () { if (S && gridEl && gridEl.isConnected) fit(); }, 80); });
  document.addEventListener('keydown', function (e) { if (e.key === ' ' && S && S.up.length === 2) { e.preventDefault(); hurry(); } });

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.cards && !saved.done && ART[saved.deck] && SIZES[saved.size]) { S = saved; build(false); }
  else showSetup();
})();
</script>
</body>
</html>

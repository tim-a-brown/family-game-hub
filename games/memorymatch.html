<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
<title>Memory Match</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
.page{padding-top:12px;}
.wrap{max-width:520px;margin:0 auto;}
.mm-header{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.mm-stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 8px;text-align:center;}
.mm-stat-val{font-family:var(--display);font-size:1.4rem;font-weight:800;color:var(--text);line-height:1.15;font-variant-numeric:tabular-nums;}
.mm-stat:last-child .mm-stat-val{color:var(--gold);}
.mm-stat-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);}
/* Deck picker — scrolling pill chips */
.deck-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px;scroll-padding:16px;-webkit-overflow-scrolling:touch;}
.deck-row::-webkit-scrollbar{display:none;}
.deck-btn{flex:none;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);font-size:.88rem;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s;display:inline-flex;align-items:center;gap:6px;}
.deck-btn .ic{font-size:1rem;}
.deck-btn.active{border-color:transparent;background:var(--text);color:var(--bg);}
/* Grid */
.mm-grid{display:grid;gap:clamp(6px,2vw,10px);margin:0 auto 14px;width:100%;}
.mm-grid.g4{grid-template-columns:repeat(4,1fr);max-width:min(100%,calc((100dvh - 290px) * .8));}
.mm-grid.g6{grid-template-columns:repeat(6,1fr);}
/* Card */
.mm-card{aspect-ratio:1;perspective:700px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.mm-card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .42s var(--ease);}
.mm-card:active:not(.flipped) .mm-card-inner{transform:scale(.94);}
.mm-card.flipped .mm-card-inner,.mm-card.matched .mm-card-inner{transform:rotateY(180deg);}
.mm-front,.mm-back{position:absolute;inset:0;border-radius:clamp(10px,3vw,16px);display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.mm-front{background:
  radial-gradient(circle at 50% 50%,rgba(245,200,66,.16) 0 18%,transparent 19%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px),
  linear-gradient(145deg,#2a3150,#161a2c);border:1px solid rgba(255,255,255,.1);box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);}
.mm-front::after{content:'';width:22%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(245,200,66,.45);}
.mm-back{background:linear-gradient(160deg,#f7f3ea,#e4ddcc);border:1px solid rgba(255,255,255,.3);transform:rotateY(180deg);font-size:clamp(1.3rem,9vw,2.6rem);box-shadow:0 4px 14px rgba(0,0,0,.3);}
.g6 .mm-back{font-size:clamp(1.1rem,6vw,2rem);}
.mm-card.matched .mm-back{background:linear-gradient(160deg,#d9f7e3,#a9e6bf);border-color:rgba(74,222,128,.6);}
.mm-card.matched .mm-card-inner{animation:mm-win .5s var(--spring) .3s;}
.mm-card.miss .mm-back{animation:mm-shake .35s ease;}
@keyframes mm-win{0%,100%{transform:rotateY(180deg) scale(1);}50%{transform:rotateY(180deg) scale(1.08);}}
@keyframes mm-shake{0%,100%{translate:0;}25%{translate:-4px;}75%{translate:4px;}}
/* Status */
.mm-status{text-align:center;font-size:.92rem;font-weight:600;min-height:24px;margin-bottom:8px;color:var(--text-2);}
.mm-status .winner-banner{margin:4px 0 0;}
.mm-status .btn{margin-top:14px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Memory Match</span>
  <button class="icon-btn" id="mm-new" aria-label="New game" title="New game"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</nav>
<div class="page"><div class="wrap">

<div class="mm-header">
  <div class="mm-stat"><div class="mm-stat-val" id="mm-moves">0</div><div class="mm-stat-lbl">Moves</div></div>
  <div class="mm-stat"><div class="mm-stat-val"><span id="mm-pairs">0</span><span style="color:var(--text-3);font-size:.9rem">/<span id="mm-total">8</span></span></div><div class="mm-stat-lbl">Pairs</div></div>
  <div class="mm-stat"><div class="mm-stat-val" id="mm-time">0:00</div><div class="mm-stat-lbl">Time</div></div>
</div>

<div class="deck-row" id="deck-row"></div>

<div class="mm-grid g4" id="mm-grid"></div>
<div class="mm-status" id="mm-status">Tap a card to start</div>

</div></div>
<script>
'use strict';
const DECKS={
  Animals:{emoji:['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐸','🐙','🦋','🦄','🦀','🐠','🦅','🐘'],size:4},
  Food:   {emoji:['🍕','🍔','🌮','🍣','🍩','🍦','🍇','🍓','🥑','🌽','🍎','🥦','🍰','🧇','🎂','🍟','🥐','🍜','🍿','🥨'],size:4},
  Sports: {emoji:['⚽','🏀','🏈','⚾','🎾','🏐','🏉','🥏','🏓','🏸','🥊','⛷️','🏊','🚴','🤸','🎿','🏇','🤺','🎯','🥋'],size:4},
  Space:  {emoji:['🚀','🛸','⭐','🌙','☄️','🪐','🌍','🔭','👨‍🚀','🌌','🌠','🛰️','🌞','💫','🪨','🌑','🌟','🔭','🪁','💥'],size:4},
  Nature: {emoji:['🌲','🌺','🍀','🌸','🌻','🌿','🍁','🌵','🎋','🌾','🍄','🐚','🌊','🏔️','⚡','🌈','❄️','🔥','💧','🌀'],size:4},
  Objects:{emoji:['🎸','📚','🔮','💎','🎨','🎭','🎪','🎠','🎡','🎢','🎯','🎲','♟️','🎻','🥁','🎺','🎷','🪗','🎤','🎬'],size:4},
  Hard:   {emoji:['🥐','🧆','🫕','🫔','🧁','🧃','🥂','🫖','🧋','🥟','🫙','🫗','🧊','🫚','🍱','🥮','🫛','🧇','🥙','🥗'],size:5},
};

let deckName='Animals', cards=[], flipped=[], matched=new Set(), moves=0, locked=false;
let timerInt=null, elapsed=0, started=false;

function buildDeckPicker(){
  const el=document.getElementById('deck-row');
  el.innerHTML='';
  Object.keys(DECKS).forEach(name=>{
    const btn=document.createElement('button');
    btn.className='deck-btn'+(name===deckName?' active':'');
    btn.innerHTML=`<span class="ic">${DECKS[name].emoji[0]}</span>${name}`;
    btn.dataset.deck=name;
    btn.addEventListener('click',()=>{
      if(name===deckName)return;
      const go=()=>{deckName=name;syncDeckPicker();try{sessionStorage.removeItem('mm');}catch(e){}newGame();GN.haptic('select');};
      if(started&&matched.size<cards.length)GN.confirm('Your current game will be lost.',{title:'Switch to '+name+'?',ok:'Switch'}).then(ok=>{if(ok)go();});
      else go();
    });
    el.appendChild(btn);
  });
}

function syncDeckPicker(){
  document.querySelectorAll('.deck-btn').forEach(b=>b.classList.toggle('active',b.dataset.deck===deckName));
  document.querySelector('.deck-btn.active')?.scrollIntoView({block:'nearest',inline:'nearest'});
}
function setGridClass(){
  // 16 cards → 4×4; Hard's 24 cards → 6×4 so every row is full
  document.getElementById('mm-grid').className='mm-grid '+(cards.length>16?'g6':'g4');
  document.getElementById('mm-total').textContent=cards.length/2;
}
function newGame(){
  clearInterval(timerInt);elapsed=0;started=false;moves=0;matched=new Set();flipped=[];locked=false;
  const deck=DECKS[deckName];
  const sz=deck.size; // 4→16 cards, 5→20 cards
  const pairs=sz*sz/2;
  const pool=deck.emoji.slice(0,pairs);
  cards=[...pool,...pool].sort(()=>Math.random()-.5);
  // Set grid class
  setGridClass();
  renderGrid();
  document.getElementById('mm-status').textContent='Tap a card to start';
  document.getElementById('mm-moves').textContent='0';
  document.getElementById('mm-pairs').textContent='0';
  document.getElementById('mm-time').textContent='0:00';
}

function renderGrid(){
  // Build the cards once, then just toggle classes so the 3D flip animates
  const grid=document.getElementById('mm-grid');
  if(grid.children.length!==cards.length||grid.dataset.sig!==cards.join('')){
    grid.innerHTML='';grid.dataset.sig=cards.join('');
    cards.forEach((emoji,i)=>{
      const card=document.createElement('div');
      card.className='mm-card';card.setAttribute('role','button');card.setAttribute('aria-label','Card '+(i+1));
      card.innerHTML=`<div class="mm-card-inner"><div class="mm-front"></div><div class="mm-back">${emoji}</div></div>`;
      card.addEventListener('click',()=>flipCard(i));
      grid.appendChild(card);
    });
  }
  [...grid.children].forEach((card,i)=>{
    card.classList.toggle('flipped',flipped.includes(i)||matched.has(i));
    card.classList.toggle('matched',matched.has(i));
  });
}

function flipCard(i){
  if(locked||flipped.includes(i)||matched.has(i))return;
  if(!started){started=true;timerInt=setInterval(()=>{elapsed++;document.getElementById('mm-time').textContent=fmt(elapsed);},1000);}
  flipped.push(i);
  GN.haptic('select');
  renderGrid();
  if(flipped.length===2){
    moves++;
    document.getElementById('mm-moves').textContent=moves;
    locked=true;
    setTimeout(()=>{
      const[a,b]=flipped;
      if(cards[a]===cards[b]){
        matched.add(a);matched.add(b);
        document.getElementById('mm-pairs').textContent=matched.size/2;
        flipped=[];locked=false;
        renderGrid();
        if(matched.size===cards.length){
          clearInterval(timerInt);
          GN.haptic('success');
          try{sessionStorage.removeItem('mm');}catch(e){}
          document.getElementById('mm-status').innerHTML=`<div class="winner-banner"><div style="font-size:2rem;line-height:1">🎉</div><div class="winner-name">All matched!</div><div class="winner-pts">${moves} moves · ${fmt(elapsed)}</div><button class="btn btn-gold" id="mm-again">Play again</button></div>`;
          document.getElementById('mm-again').addEventListener('click',()=>{newGame();window.scrollTo({top:0,behavior:'smooth'});});
          setTimeout(()=>document.getElementById('mm-status').scrollIntoView({behavior:'smooth',block:'nearest'}),350);
        } else GN.haptic('medium');
      } else {
        const grid=document.getElementById('mm-grid');
        [a,b].forEach(k=>{const el=grid.children[k];el.classList.add('miss');setTimeout(()=>el.classList.remove('miss'),400);});
        setTimeout(()=>{flipped=[];locked=false;renderGrid();},350);
      }
    },700);
  }
}

function fmt(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}

buildDeckPicker();
document.getElementById('mm-new').addEventListener('click',()=>{
  const go=()=>{try{sessionStorage.removeItem('mm');}catch(e){}newGame();};
  if(started&&matched.size<cards.length)GN.confirm('Your current game will be lost.',{title:'Start a new game?',ok:'New game'}).then(ok=>{if(ok)go();});
  else go();
});
newGame();

// ── Session persistence ────────────────────────────────────────────────────
function _save_mm(){if(!cards.length||matched.size===cards.length)return;
  try{sessionStorage.setItem('mm',JSON.stringify({deckName,cards,matched:[...matched],moves,elapsed,_ts:Date.now()}));}catch(e){}
}
function _load_mm(){
  try{
    const raw=sessionStorage.getItem('mm');if(!raw)return false;
    const s=JSON.parse(raw);if(!s)return false;
    deckName=s.deckName||'Animals';cards=s.cards;matched=new Set(s.matched||[]);moves=s.moves||0;elapsed=s.elapsed||0;flipped=[];locked=false;
    if(!Array.isArray(cards)||!cards.length){newGame();return false;}
    started=elapsed>0||moves>0;
    if(started)timerInt=setInterval(()=>{elapsed++;document.getElementById('mm-time').textContent=fmt(elapsed);},1000);
    document.getElementById('mm-moves').textContent=moves;document.getElementById('mm-time').textContent=fmt(elapsed);
    document.getElementById('mm-pairs').textContent=matched.size/2;
    document.getElementById('mm-status').textContent=started?'Tap a card to continue':'Tap a card to start';
    syncDeckPicker();setGridClass();renderGrid();
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_mm);
window.addEventListener('pagehide',_save_mm);
_load_mm();
</script>
</body>
</html>

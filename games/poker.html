<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../casino.js"></script>
<script src="../coach.js"></script>
<style>
.stage{padding-bottom:calc(var(--safe-b) + 10px);}
/* ── Info strip above the table ── */
.pinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 4px 10px;font-weight:800;font-size:.82rem;color:var(--text-2);white-space:nowrap;}
.pinfo b{color:var(--text);font-variant-numeric:tabular-nums;}
.pinfo .bank{display:inline-flex;align-items:center;gap:6px;}
.pinfo .bank .ico{width:16px;height:16px;color:var(--yellow);}

/* ── Oval poker table ── */
.ptable{position:relative;height:clamp(390px,55dvh,500px);border-radius:50% / 34%;margin:0 6px 8px;}
.ptable > .felt-in{position:absolute;inset:11px;border-radius:50% / 33%;}
.ptable > .felt-in::after{content:"";position:absolute;inset:13% 11%;border-radius:50% / 34%;border:2px solid rgba(255,255,255,.09);pointer-events:none;}
.pa{position:absolute;transform:translate(-50%,-50%);}
.pseat{z-index:4;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px;transition:opacity .3s;}
.pseat .tag{display:flex;align-items:center;gap:4px;max-width:120px;padding:3px 8px 3px 3px;border-radius:999px;background:rgba(8,10,26,.82);color:#fff;font-weight:800;font-size:.8rem;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:box-shadow .2s, transform .3s var(--spring);}
.pseat .tag > span:last-child{overflow:hidden;text-overflow:ellipsis;}
.pseat .tag .avatar{width:24px;height:24px;font-size:.72rem;flex:none;}
.pseat .tag .avatar .ico{width:60%;height:60%;}
.pseat .stack{padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:#1d1b2e;font-size:.74rem;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.pseat.me{flex-direction:row;gap:6px;}
.pseat.top{display:grid;grid-template-columns:auto auto;column-gap:6px;row-gap:3px;align-items:center;justify-items:start;}
.pseat.top > .cards{grid-row:1 / 3;}
.pseat.turn .tag{box-shadow:0 0 0 3px var(--yellow),0 0 18px rgba(255,200,61,.6);transform:scale(1.06);}
.pseat.win .tag{box-shadow:0 0 0 3px var(--green),0 0 20px rgba(61,220,132,.65);}
.pseat.fold > .cards,.pseat.fold > .tag{opacity:.45;}
.pseat.out{opacity:.35;}
.pseat .cards{display:flex;--cw:24px;min-height:34px;}
.pseat .cards .pcard+.pcard{margin-left:-13px;}
.pseat .cards.om .pcard+.pcard{margin-left:-17px;}
.pseat .cards.face{--cw:35px;min-height:49px;}
.pseat .cards.face .pcard+.pcard{margin-left:-9px;}
.pseat .cards.face.om .pcard+.pcard{margin-left:-19px;}
.pseat .cards .pcard{box-shadow:0 0 0 1px rgba(0,0,0,.15),0 3px 6px rgba(0,0,0,.35);}
.psay{position:absolute;left:50%;top:100%;transform:translate(-50%,3px);padding:2px 8px;border-radius:9px;background:#fff;color:#1d1b2e;font-weight:900;font-size:.72rem;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:6;}
.psay.new{animation:pop .35s var(--spring);}
.psay.hand{background:var(--yellow);color:#2b1a00;}
.psay.fold{background:rgba(255,255,255,.55);}
.pseat.me .psay{top:auto;bottom:100%;transform:translate(-50%,-4px);}
.pdealer{z-index:3;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fff,#e6e1d4);color:#1d1b2e;font-weight:900;font-size:.7rem;box-shadow:0 0 0 2px rgba(0,0,0,.18) inset,0 3px 6px rgba(0,0,0,.45);transition:left .5s var(--ease), top .5s var(--ease);}

/* chips: side-view stacks in standard casino colours */
.stk{display:flex;align-items:flex-end;gap:2px;}
.stk .col{display:flex;flex-direction:column-reverse;}
.stk .col i{display:block;width:20px;height:6px;margin-top:-2.5px;border-radius:50%;background:
  repeating-linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.75) 3px 5px),var(--c);box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.35);}
.stk .col i:last-child{height:9px;background:radial-gradient(ellipse at 50% 45%,var(--c) 0 42%,rgba(255,255,255,.85) 44% 52%,var(--c) 54%),var(--c);}
.stk .col i.lt{box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.35);}
.pbet{z-index:2;display:flex;align-items:flex-end;gap:4px;}
.pa.bl{transform:translate(0,-50%);}
.pa.br{transform:translate(-100%,-50%);flex-direction:row-reverse;}
.pbet .amt{font-weight:900;font-size:.76rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);font-variant-numeric:tabular-nums;white-space:nowrap;}
.pbet.won .amt{color:var(--yellow);font-size:.86rem;}
.ppot{z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;}
.ppot .lbl{padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.38);color:#fff;font-weight:900;font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pboard{z-index:2;display:flex;gap:4px;--cw:clamp(42px,11.6vw,54px);}
.pboard .pcard.slot{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);}
.pcard.deal{animation:flipin .45s var(--ease) both;}
@keyframes flipin{from{transform:rotateY(90deg) translateY(-10px) scale(.85);opacity:0;}to{transform:none;opacity:1;}}
.pcard.best{box-shadow:0 0 0 3px var(--yellow),0 0 16px rgba(255,200,61,.75)!important;}
.pcard.unused{filter:brightness(.55) saturate(.6);}
.pmsg{z-index:5;max-width:84%;padding:6px 14px;border-radius:14px;background:rgba(6,8,22,.72);color:#fff;font-weight:800;font-size:.84rem;line-height:1.3;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35);}
.pmsg b{color:var(--yellow);}
.pmsg.rise{animation:rise .4s var(--ease) both;}

/* ── Your cards ── */
.phand{display:flex;justify-content:center;gap:8px;--cw:clamp(62px,17.5vw,78px);min-height:calc(var(--cw) * 1.4);}
.phand.om{--cw:clamp(54px,15vw,70px);gap:6px;}
.phand .pcard.folded{filter:brightness(.5) saturate(.5);transform:translateY(8px) rotate(-2deg);}
.plabel{text-align:center;font-weight:900;color:var(--yellow);min-height:22px;margin:6px 0 8px;font-size:.95rem;}
.plabel.dim{color:var(--text-3);}
.plabel.res{color:var(--text);font-weight:800;line-height:1.35;font-size:.92rem;}
.plabel.res b{color:var(--yellow);}
.pseat.up .psay{top:auto;bottom:100%;transform:translate(-50%,-3px);}

/* ── Action bar ── */
.pbar{display:flex;gap:8px;align-items:center;justify-content:center;min-height:56px;}
.pbar .btn{flex:1 1 0;min-height:54px;padding:0 8px;font-size:1rem;}
.pbar .btn small{display:block;font-size:.72rem;opacity:.8;}
.pbar .btn .two{display:flex;flex-direction:column;line-height:1.1;}
.pbar .hint{color:var(--text-2);font-weight:800;text-align:center;}
.praise{border-radius:var(--r);background:var(--surface);padding:8px 12px 10px;margin-bottom:8px;box-shadow:var(--shadow-sm);}
.stage.raising .ptable{height:clamp(360px,44dvh,480px);}
.stage.raising .phand{--cw:clamp(48px,13vw,62px);}
.praise .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px;}
.praise .top b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--yellow);font-variant-numeric:tabular-nums;}
.praise input[type=range]{width:100%;height:36px;accent-color:var(--yellow);}
.praise .pre{display:flex;gap:6px;margin-top:6px;}
.praise .pre .chip{flex:1;justify-content:center;padding:0 6px;}

/* ── Video poker cabinet ── */
.vp{position:relative;max-width:440px;margin:2px auto 12px;padding:12px 11px 13px;border-radius:24px;
  background:linear-gradient(180deg,#7a1222 0%,#4a0915 55%,#2c050c 100%);
  box-shadow:inset 0 0 0 2px rgba(255,214,140,.38),inset 0 2px 0 rgba(255,255,255,.22),inset 0 -6px 12px rgba(0,0,0,.4),0 18px 36px rgba(0,0,0,.5);}
.vp::before{content:"";position:absolute;inset:5px;border-radius:19px;border:1px solid rgba(255,255,255,.1);pointer-events:none;}
.vp-title{text-align:center;font-family:var(--display);font-size:1.55rem;line-height:1.1;color:#ffd84d;letter-spacing:.04em;text-shadow:0 2px 0 #7a3a00,0 0 18px rgba(255,200,60,.35);}
.vp-sub{text-align:center;font-size:.64rem;font-weight:900;letter-spacing:.22em;color:rgba(255,220,150,.75);text-transform:uppercase;margin:1px 0 8px;}
.vp-pay{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;background:#0b1c8f;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 2px #e2bf45;font-size:.7rem;font-weight:900;text-transform:uppercase;color:#ffe14d;}
.vp-pay td{padding:2.5px 4px;text-align:right;font-variant-numeric:tabular-nums;border-left:1px solid rgba(255,225,77,.22);white-space:nowrap;}
.vp-pay td:first-child{text-align:left;width:39%;border-left:0;padding-left:8px;font-size:.66rem;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;}
.vp-pay tr:first-child td{padding-top:5px;} .vp-pay tr:last-child td{padding-bottom:5px;}
.vp-pay td.on{background:#b3122b;color:#fff;}
.vp-pay tr.dealt td:first-child{color:#fff;}
.vp-pay tr.hit td{background:#ffe14d;color:#0b1c8f;animation:vpblink .5s steps(2) 4;}
@keyframes vpblink{50%{background:#0b1c8f;color:#ffe14d;}}
.vp-screen{margin-top:9px;border-radius:12px;padding:10px 6px 8px;background:radial-gradient(120% 100% at 50% 0%,#1636a8 0%,#0a1a74 65%,#06104f 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.5),inset 0 0 26px rgba(0,0,0,.55);}
.vp-cards{display:flex;justify-content:center;gap:6px;--cw:min(66px,calc((100vw - 96px) / 5));}
.vp-slot{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.vp-held{height:15px;font-size:.7rem;font-weight:900;letter-spacing:.14em;color:#ffe14d;text-shadow:0 0 8px rgba(255,225,77,.7);}
.vp-slot .pcard{transition:transform .2s var(--spring);}
.vp-slot.on .pcard{transform:translateY(-3px);box-shadow:0 0 0 3px #ffe14d,0 8px 16px rgba(0,0,0,.45);}
.vp-msg{text-align:center;color:#fff;font-weight:900;margin-top:8px;min-height:20px;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;}
.vp-msg b{color:#ffe14d;}
.vp-leds{display:grid;grid-template-columns:1fr .62fr 1.25fr;gap:6px;margin-top:9px;}
.vp-leds div{background:#140207;border-radius:8px;padding:3px 8px 4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 2px 6px rgba(0,0,0,.6);min-width:0;}
.vp-leds small{display:block;font-size:.58rem;font-weight:900;letter-spacing:.16em;color:#ffd84d;}
.vp-leds b{display:block;font-family:var(--mono);font-size:1.02rem;color:#ff4b3a;text-shadow:0 0 8px rgba(255,75,58,.75);text-align:right;white-space:nowrap;overflow:hidden;}
.vp-holds{display:flex;justify-content:center;gap:6px;margin:8px 0 0;}
.vp-holds .vbtn{width:min(66px,calc((100vw - 96px) / 5));min-height:40px;font-size:.66rem;padding:0;}
.vp-btns{display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;gap:8px;max-width:440px;margin:0 auto;}
.vbtn{min-height:54px;padding:0 4px;border:0;border-radius:10px;font-weight:900;font-size:.74rem;line-height:1.15;letter-spacing:.06em;text-transform:uppercase;color:#3a2600;
  background:linear-gradient(180deg,#fff4b0 0%,#ffd43d 45%,#e8a900 100%);box-shadow:0 4px 0 #8a5b00,inset 0 1px 0 rgba(255,255,255,.85),0 0 14px rgba(255,210,61,.22);transition:transform .08s, box-shadow .08s, filter .15s;}
.vbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #8a5b00,inset 0 1px 0 rgba(255,255,255,.85);}
.vbtn:disabled{filter:grayscale(.8) brightness(.55);cursor:default;}
.vbtn.go{font-size:.95rem;color:#fff;background:linear-gradient(180deg,#ff9a9a 0%,#ea2a3e 45%,#b10f22 100%);box-shadow:0 4px 0 #640312,inset 0 1px 0 rgba(255,255,255,.6),0 0 16px rgba(234,42,62,.35);}
.vbtn.go:active:not(:disabled){box-shadow:0 1px 0 #640312;}
.vp-holds .vbtn{background:linear-gradient(180deg,#e9e2c8,#bfb38a);box-shadow:0 4px 0 #6d6248,inset 0 1px 0 rgba(255,255,255,.7);color:#4a4230;}
.vp-holds .vbtn.held{background:linear-gradient(180deg,#fff4b0,#ffd43d 45%,#e8a900);color:#3a2600;box-shadow:0 1px 0 #8a5b00,0 0 16px rgba(255,214,61,.7);transform:translateY(3px);}
.vbtn small{display:block;font-size:.62rem;opacity:.75;letter-spacing:.04em;}

/* Strategy help chip: on the felt between the board and you (portrait), above the buttons (sideways), on the machine's screen (video poker) */
.pcoach{display:flex;justify-content:center;min-height:26px;margin:-4px 0 8px;}
.pland .pcoach{grid-column:2;grid-row:3;align-self:end;justify-content:flex-start;min-height:0;margin:0 0 8px;}
.vp-coach{display:flex;justify-content:center;margin-top:7px;}
.pc-wait{padding:3px 10px;border-radius:999px;background:rgba(20,16,10,.45);color:rgba(255,255,255,.8);font-size:.78rem;font-weight:800;white-space:nowrap;}

/* table list sheet */
.tlist{display:flex;flex-direction:column;gap:8px;}
.tlist .row{gap:10px;padding:8px 10px;border-radius:14px;background:var(--w05);}
.tlist .row b{display:block;}
.tlist .row small{display:block;color:var(--text-3);font-weight:700;}
.tlist .row .s{font-weight:900;font-variant-numeric:tabular-nums;}

/* ── Phone sideways (Hold'em / Omaha): wide table on the left, your cards at its bottom centre,
      blinds, hand name and the action buttons in a column on the right. One screen, no scrolling. ── */
@media (orientation:landscape) and (max-height:500px){
  .gbar{padding-top:calc(var(--safe-t) + 3px);padding-bottom:3px;}
  .gbar .icon-btn{width:36px;height:36px;}
  .gbar .icon-btn svg{width:20px;height:20px;}
  .gbar .ttl{font-size:1.05rem;}
  .gbar .ttl .gi .gicon{width:28px;height:28px;}
}
.stage.pland{max-width:none;margin:0;height:calc(100dvh - var(--gbh,44px));display:grid;
  grid-template-columns:minmax(0,1fr) clamp(190px,27vw,250px);grid-template-rows:auto auto minmax(0,1fr) auto auto;column-gap:12px;
  padding:2px calc(var(--corner-x) + 2px) calc(var(--safe-b) + 8px) 10px;}
.stage.pland .ptable{grid-column:1;grid-row:1 / -1;height:auto;min-height:0;margin:0;border-radius:30% / 50%;}
.pland .ptable > .felt-in{inset:9px;border-radius:30% / 50%;}
.pland .ptable > .felt-in::after{inset:15% 9%;border-radius:30% / 50%;}
.pland .pinfo{grid-column:2;grid-row:1;flex-direction:column;align-items:stretch;gap:3px;margin:4px 2px 8px;font-size:.78rem;}
.pland .pinfo > span:not(.bank){display:block;white-space:normal;}
.pland .plabel{grid-column:2;grid-row:2;margin:0 2px;min-height:0;font-size:.92rem;line-height:1.25;text-align:left;}
.pland .plabel.res{font-size:.84rem;}
.pland .praise{grid-column:2;grid-row:4;margin:0 0 8px;padding:6px 10px 8px;}
.pland .praise .top b{font-size:1.25rem;}
.pland .praise .muted{font-size:.8rem;}
.pland .praise .btn-sm{min-height:36px;padding:0 12px;font-size:.88rem;}
.pland .praise input[type=range]{height:28px;}
.pland .praise .pre{gap:4px;margin-top:2px;}
.pland .praise .pre .chip{min-height:30px;padding:0 2px;font-size:.76rem;}
.pland .pbar{grid-column:2;grid-row:5;gap:6px;min-height:52px;}
.pland .pbar .btn{min-height:52px;padding:0 4px;font-size:.95rem;}
.pland .pbar .btn .ico{width:18px;height:18px;}
.pland .pbar .hint{font-size:.86rem;line-height:1.3;}
.stage.pland .pboard{--cw:clamp(30px,min(11.5dvh,(100vw - 270px) * .085),48px);gap:4px;}
/* opponents: cards beside the name, so each seat is short */
.pland .pseat.ls{display:grid;grid-template-columns:auto auto;column-gap:5px;row-gap:3px;align-items:center;justify-items:start;min-width:0;}
.pland .pseat.ls > .cards{grid-row:1 / 3;}
.pland .pseat.al{transform:translate(0,-50%);}
.pland .pseat.ar{transform:translate(-100%,-50%);}
.pland .pseat .tag{font-size:.74rem;max-width:104px;padding-right:7px;}
.pland .pseat .tag .avatar{width:20px;height:20px;}
.pland .pseat .stack{font-size:.7rem;}
.pland .pseat .cards{--cw:22px;min-height:31px;}
.pland .pseat .cards .pcard+.pcard{margin-left:-12px;}
.pland .pseat .cards.face{--cw:30px;min-height:42px;}
.pland .pseat .cards.face .pcard+.pcard{margin-left:-8px;}
.pland .pseat .cards.face.om .pcard+.pcard{margin-left:-17px;}
/* top and upper side seats say what they did beside them (below is where their chips go) */
.pland .ls-t .psay,.pland .ls-lt .psay{top:50%;left:100%;transform:translate(5px,-50%);}
.pland .ls-rt .psay{top:50%;left:auto;right:100%;transform:translate(-5px,-50%);}
.pland .ls-l .psay,.pland .ls-r .psay{top:auto;bottom:100%;transform:translate(-50%,-3px);}
.pland .pseat .pdealer{position:absolute;top:-9px;right:-9px;width:20px;height:20px;font-size:.62rem;}
.pland .ls-rt .pdealer,.pland .ls-r .pdealer,.pland .ls-rb .pdealer{right:auto;left:-9px;}
/* your seat: cards, then your name and chips */
.pme{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;}
.pme .pdealer{position:absolute;left:-30px;top:12px;}
.stage.pland .phand{--cw:clamp(44px,15dvh,62px);gap:5px;min-height:0;}
.stage.pland .phand.om{--cw:clamp(40px,13dvh,54px);gap:0;}
.pland .phand.om .pcard+.pcard{margin-left:-10px;}
.pland .phand .pcard{box-shadow:0 0 0 1px rgba(0,0,0,.15),0 6px 14px rgba(0,0,0,.45);}
.pland .pseat.turn{min-height:0;margin:0;}   /* not Kit's turn banner */
.pland .pseat.me{position:relative;z-index:2;margin-top:-20px;gap:4px;min-width:0;}
.pland .pseat.me .psay{top:50%;bottom:auto;left:100%;transform:translate(6px,-50%);}
.pland .ppot{flex-direction:row;align-items:flex-end;}
.pland .ppot .lbl{font-size:.76rem;}
.pland .pbet .amt{font-size:.72rem;}
.pland .stk .col i{width:17px;height:5px;margin-top:-2px;}
.pland .stk .col i:last-child{height:8px;}
.pland .pmsg{font-size:.78rem;padding:4px 12px;}

/* iPad sideways: the same layout, sized up */
@media (min-height:600px){
  .stage.pland{grid-template-columns:minmax(0,1fr) 300px;column-gap:20px;padding:6px calc(var(--corner-x) + 10px) calc(var(--safe-b) + 16px) 16px;}
  .stage.pland .pboard{--cw:clamp(48px,min(10dvh,(100vw - 340px) * .085),66px);gap:6px;}
  .stage.pland .phand{--cw:clamp(62px,13dvh,88px);gap:8px;}
  .stage.pland .phand.om{--cw:clamp(56px,11.5dvh,76px);}
  .pland .phand.om .pcard+.pcard{margin-left:-14px;}
  .pland .pseat.me{margin-top:-26px;}
  .pland .pinfo{font-size:.92rem;}
  .pland .plabel{font-size:1.05rem;} .pland .plabel.res{font-size:.98rem;}
  .pland .pseat .tag{font-size:.9rem;max-width:150px;}
  .pland .pseat .tag .avatar{width:26px;height:26px;}
  .pland .pseat .stack,.pland .pbet .amt{font-size:.82rem;}
  .pland .pseat .cards{--cw:30px;min-height:42px;}
  .pland .pseat .cards .pcard+.pcard{margin-left:-16px;}
  .pland .pseat .cards.face{--cw:42px;min-height:59px;}
  .pland .pseat .cards.face .pcard+.pcard{margin-left:-11px;}
  .pland .pseat .cards.face.om .pcard+.pcard{margin-left:-24px;}
  .pland .ppot .lbl{font-size:.9rem;}
  .pland .pseat .pdealer{width:24px;height:24px;font-size:.7rem;top:-11px;right:-11px;}
  .pland .stk .col i{width:20px;height:6px;margin-top:-2.5px;} .pland .stk .col i:last-child{height:9px;}

      st: { rows: [], big: null, best: null, beats: [], kos: [], won: cfg.players.map(function () { return 0; }), allins: 0 }
    };

  }
  function resume() {
    stop(); undoStack = []; R = {};

    if (S.hand) R.no = S.hand.no;
    if (!S.hand) return startHand();
    step();
  }

  // ── Seats & helpers ───────────────────────────────────────────────────────
  function N() { return S.players.length; }
  function alive() { return S.players.map(function (p, i) { return i; }).filter(function (i) { return !S.players[i].out; }); }
  function live() { var H = S.hand; return S.players.map(function (p, i) { return i; }).filter(function (i) { return H.inHand[i] && !H.folded[i]; }); }
  function canMove(i) { var H = S.hand; return H.inHand[i] && !H.folded[i] && S.players[i].stack > 0; }
  function nextIn(from, list) { for (var k = 1; k <= N(); k++) { var j = (from + k) % N(); if (list.indexOf(j) >= 0) return j; } return -1; }
  function needsAct(j) { var H = S.hand; return canMove(j) && (!H.acted[j] || H.bet[j] < H.curBet); }
  function nextToAct(from) { for (var k = 1; k <= N(); k++) { var j = (from + k) % N(); if (needsAct(j)) return j; } return -1; }
  function potAll() { var H = S.hand; return H.pot + H.bet.reduce(function (a, b) { return a + b; }, 0); }
  function put(i, n) { var H = S.hand, p = S.players[i]; n = Math.max(0, Math.min(n, p.stack)); p.stack -= n; H.bet[i] += n; H.total[i] += n; return n; }
  function nm(i) { return i === 0 ? 'You' : S.players[i].name; }
  function nmPoss(i) { return i === 0 ? 'Your' : S.players[i].name + '\'s'; }
  function step0() { return S.tourn ? (S.bb >= 100 ? 25 : 5) : 1; }
  function roundTo(v) { var u = step0(); return Math.round(v / u) * u; }

  function startHand() {
    stop();
    var n = N();
    if (!S.tourn) S.players.forEach(function (p, i) {
      if (i > 0 && p.stack <= 0) { p.stack = BUYIN; p.buyin += BUYIN; p.rebuys++; p.rebought = true; }
    });
    if (!S.tourn && S.players[0].stack <= 0) { S.hand = null; save(); renderTable(); return askRebuy(); }
    var act = alive().filter(function (i) { return S.players[i].stack > 0; });
    if (act.length < 2) return endTourney();
    S.handNo++;
    if (S.tourn) {
      var lv = Math.min(LEVELS.length - 1, Math.floor((S.handNo - 1) / S.per));
      if (lv !== S.level) { S.level = lv; setTimeout(function () { Kit.toast('Blinds up: ' + LEVELS[lv][0] + ' / ' + LEVELS[lv][1]); }, 300); }
      S.sb = LEVELS[lv][0]; S.bb = LEVELS[lv][1];
    }
    S.button = S.button == null ? act[Math.floor(Math.random() * act.length)] : nextIn(S.button, act);
    var H = S.hand = {
      no: S.handNo, button: S.button, deck: freshDeck(), board: [], hole: [], street: 0, pot: 0,
      inHand: [], folded: [], bet: [], total: [], acted: [], canRaise: [], say: [], shown: [], start: [],
      curBet: 0, minRaise: S.bb, raises: 1, actor: -1, phase: 'bet', results: null, won: null, ai: null, eqc: {}
    };
    for (var i = 0; i < n; i++) {
      H.inHand.push(act.indexOf(i) >= 0); H.folded.push(false); H.bet.push(0); H.total.push(0);
      H.acted.push(false); H.canRaise.push(true); H.say.push(''); H.shown.push(false); H.hole.push([]); H.start.push(S.players[i].stack);
    }
    var sbI, bbI;
    if (act.length === 2) { sbI = S.button; bbI = nextIn(sbI, act); }
    else { sbI = nextIn(S.button, act); bbI = nextIn(sbI, act); }
    H.sbI = sbI; H.bbI = bbI;
    var hc = S.om ? 4 : 2, first = nextIn(S.button, act);
    for (var r = 0; r < hc; r++) { var j = first; for (var k = 0; k < act.length; k++) { H.hole[j].push(H.deck.pop()); j = nextIn(j, act); } }
    put(sbI, S.sb); put(bbI, S.bb);
    H.curBet = S.bb;
    S.players.forEach(function (p, i) { if (p.rebought) { H.say[i] = 'Rebuys'; delete p.rebought; } });
    H.actor = nextToAct(bbI);
    undoStack = [];
    save();
    renderTable();
    Kit.sfx('deal');
    later(step, 400 + act.length * hc * 70);
  }

  // The engine: look at the state and do whatever comes next
  function step() {
    if (!S || S.kind !== 'table' || !S.hand) return;
    var H = S.hand;
    if (H.phase === 'bet') {
      if (roundDone()) return endStreet();
      if (H.actor < 0 || !needsAct(H.actor)) H.actor = nextToAct(H.actor < 0 ? H.button : H.actor);
      save(); renderTable();
      if (S.players[H.actor].cpu) later(cpuAct, thinkMs());
    } else if (H.phase === 'collect') endStreet();
    else if (H.phase === 'runout') { save(); renderTable(); later(runout, 1100); }
    else {
      save(); renderTable();
      if (S.tourn && (S.players[0].out || alive().length <= 1)) later(endTourney, 1800);
    }
  }
  function thinkMs() { var H = S.hand, watching = !H.inHand[0] || H.folded[0] || S.players[0].stack === 0; return (600 + Math.random() * 320) * (watching ? 0.55 : 1); }
  function roundDone() {
    var H = S.hand, lv = live();
    if (lv.length <= 1) return true;
    var can = lv.filter(function (j) { return S.players[j].stack > 0; });
    if (!can.length) return true;
    if (can.length === 1) return H.bet[can[0]] >= H.curBet;
    return can.every(function (j) { return H.acted[j] && H.bet[j] === H.curBet; });
  }

  // What player i may do right now
  function options(i) {
    var H = S.hand, p = S.players[i], toCall = Math.max(0, H.curBet - H.bet[i]), all = H.bet[i] + p.stack;
    var others = live().filter(function (j) { return j !== i && S.players[j].stack > 0; }).length;
    var o = { toCall: toCall, call: Math.min(toCall, p.stack), canCheck: toCall === 0, canRaise: false, isBet: H.curBet === 0, all: all };
    if (p.stack > toCall && H.canRaise[i] && others > 0 && !(S.limit && H.raises >= 4)) {
      o.canRaise = true;
      if (S.limit) { var size = H.street >= 2 ? 2 * S.bb : S.bb; o.minTo = o.maxTo = Math.min(H.curBet + size, all); }
      else {
        o.minTo = Math.min(H.curBet + Math.max(H.minRaise, S.bb), all);
        o.maxTo = S.pl ? Math.min(all, H.curBet + potAll() + toCall) : all;
        if (o.maxTo < o.minTo) o.maxTo = o.minTo;
      }
    }
    return o;
  }

  function act(i, a) {
    var H = S.hand, p = S.players[i], toCall = Math.max(0, H.curBet - H.bet[i]);
    if (a.t === 'raise' && a.to <= H.curBet) a = { t: toCall ? 'call' : 'check' };
    if (a.t === 'check' && toCall > 0) a = { t: 'call' };
    if (a.t === 'fold') { H.folded[i] = true; H.say[i] = 'Fold'; Kit.sfx('flip'); }
    else if (a.t === 'check') { H.say[i] = 'Check'; Kit.sfx('tap'); }
    else if (a.t === 'call') { var c = put(i, toCall); H.say[i] = p.stack === 0 ? 'All in' : 'Call ' + amt(c); Kit.sfx('chip'); }
    else {
      var wasBet = H.curBet === 0, to = Math.min(a.to, H.bet[i] + p.stack);

      var inc = to - H.curBet;
      if (inc >= H.minRaise || S.limit) {
        if (!S.limit) H.minRaise = inc;
        H.raises++;
        live().forEach(function (j) { if (j !== i) { H.acted[j] = false; H.canRaise[j] = true; } });
      } else {
        // An all-in that's less than a full raise: others must respond, but anyone who already acted can't re-raise
        live().forEach(function (j) { if (j !== i && H.acted[j]) { H.acted[j] = false; H.canRaise[j] = false; } });
      }
      H.curBet = to;
      H.say[i] = p.stack === 0 ? 'All in' : (wasBet ? 'Bet ' : 'Raise to ') + amt(to);
      Kit.sfx('chip'); if (p.stack === 0) setTimeout(function () { Kit.sfx('chip'); }, 90);
    }
    if (p.stack === 0 && !H.folded[i] && H.say[i] === 'All in') { S.st.allins++; if (i === 0) Kit.haptic('heavy'); }
    H.sayNew = i;
    H.acted[i] = true;
    H.actor = nextToAct(i);
    step();
  }
  function humanAct(a) {
    var H = S.hand;
    if (!H || H.phase !== 'bet' || H.actor !== 0) return;
    undoStack.push({ s: JSON.stringify(S), no: H.no, street: H.street });
    if (undoStack.length > 12) undoStack.shift();
    raiseUI = null;
    Kit.haptic(a.t === 'fold' ? 'light' : 'medium');
    act(0, a);
  }

  function endStreet() {
    var H = S.hand, t = token;
    H.phase = 'collect';
    var hasBets = H.bet.some(function (b) { return b > 0; });
    (hasBets ? animateCollect() : Promise.resolve()).then(function () {
      if (t !== token) return;
      for (var i = 0; i < N(); i++) { H.pot += H.bet[i]; H.bet[i] = 0; H.acted[i] = false; H.canRaise[i] = true; if (H.say[i] !== 'Fold' && H.say[i] !== 'All in') H.say[i] = ''; }
      H.curBet = 0; H.minRaise = S.bb; H.raises = 0; H.sayNew = -1;
      var lv = live();
      if (lv.length <= 1 || H.street === 3) return finishHand();
      var can = lv.filter(function (j) { return S.players[j].stack > 0; });
      if (can.length <= 1) {
        H.phase = 'runout';
        lv.forEach(function (j) { H.shown[j] = true; });
        var eq = openEquity(lv.map(function (j) { return H.hole[j]; }), H.board, S.om, S.om ? 400 : 900);
        H.ai = { seats: lv, eq: eq, street: H.street, board: H.board.length };
        Kit.sfx('flip');
        return step();
      }
      dealStreet();
      H.phase = 'bet'; H.actor = nextToAct(H.button);
      step();
    });
  }
  function dealStreet() {
    var H = S.hand;
    H.deck.pop(); // burn
    H.street++;
    var k = H.street === 1 ? 3 : 1;
    for (var i = 0; i < k; i++) H.board.push(H.deck.pop());
    Kit.sfx('deal');
  }
  function runout() {
    var H = S.hand;
    if (H.board.length < 5) { dealStreet(); save(); renderTable(); if (H.board.length < 5) later(runout, 1250); else later(finishHand, 1100); }
    else finishHand();
  }

  // Showdown and side pots
  function finishHand() {
    var H = S.hand, n = N(), lv = live(), i;
    for (i = 0; i < n; i++) { H.pot += H.bet[i]; H.bet[i] = 0; }
    // An uncalled bet goes straight back to whoever made it
    var order = H.total.map(function (t, j) { return j; }).sort(function (a, b) { return H.total[b] - H.total[a]; });
    var extra = H.total[order[0]] - H.total[order[1]];
    if (extra > 0) { H.total[order[0]] -= extra; S.players[order[0]].stack += extra; H.pot -= extra; H.refund = { i: order[0], amt: extra }; }
    var won = []; for (i = 0; i < n; i++) won.push(0);
    var results = [], scores = {}, five = {};
    var showdown = lv.length > 1;
    if (showdown) {
      lv.forEach(function (j) { H.shown[j] = true; var b5 = bestFive(H.hole[j], H.board, S.om); scores[j] = b5.v; five[j] = b5.cards; });
      // Build the main pot and side pots from what everyone put in
      var levels = H.total.filter(function (x) { return x > 0; }).sort(function (a, b) { return a - b; }).filter(function (x, k, a) { return a.indexOf(x) === k; });
      var pots = [], prev = 0;
      levels.forEach(function (L) {
        var size = 0; for (var j = 0; j < n; j++) size += Math.min(H.total[j], L) - Math.min(H.total[j], prev);
        var elig = lv.filter(function (j) { return H.total[j] >= L; });
        var last = pots[pots.length - 1];
        if (!elig.length && last) last.amt += size;
        else if (last && last.elig.join() === elig.join()) last.amt += size;
        else pots.push({ amt: size, elig: elig });
        prev = L;
      });
      pots.forEach(function (pt, k) {
        if (pt.elig.length === 1) { won[pt.elig[0]] += pt.amt; results.push({ amt: pt.amt, w: pt.elig, back: true, side: k > 0 }); return; }
        var best = Math.max.apply(null, pt.elig.map(function (j) { return scores[j]; }));
        var ws = pt.elig.filter(function (j) { return scores[j] === best; });
        ws.sort(function (a, b) { return ((a - H.button - 1 + n) % n) - ((b - H.button - 1 + n) % n); });
        var share = Math.floor(pt.amt / ws.length), odd = pt.amt - share * ws.length;
        ws.forEach(function (j, k2) { won[j] += share + (k2 < odd ? 1 : 0); });

      results.push({ amt: H.pot, w: [lv[0]], fold: true });
    }

    H.potWas = H.pot; H.pot = 0;
    H.won = won; H.results = results; H.scores = scores; H.five = five; H.phase = 'done'; H.actor = -1;
    H.say = H.say.map(function (s, j) { return s === 'Fold' ? s : ''; });

    undoStack = [];
    save(); renderTable();

    var me = won[0] - H.total[0];
    var main = results.filter(function (r) { return !r.back; })[0] || results[0];
    if (won[0] > 0 && (main.w.indexOf(0) >= 0)) {
      Kit.sfx(showdown ? 'win' : 'good'); Kit.haptic('success');
      if (showdown && catOf(scores[0]) >= 6) Kit.callout(shortName(scores[0]) + '!');
      else if (me >= 40 * S.bb) Kit.callout('Big pot!');
    } else if (showdown && lv.indexOf(0) >= 0) { Kit.sfx('lose'); Kit.haptic('error'); }
    if (busted.length && busted.indexOf(0) < 0) setTimeout(function () { Kit.toast(busted.map(nm).join(' and ') + (busted.length > 1 ? ' are' : ' is') + ' out'); }, 900);
    if (S.tourn && (busted.indexOf(0) >= 0 || alive().length <= 1)) later(endTourney, 2600);
  }

  // Session stats for highlights
  function tally(H) {
    var st = S.st, n = N(), total = H.total.reduce(function (a, b) { return a + b; }, 0);
    st.rows.push(S.players.map(function (p, i) { return H.won[i] - H.total[i]; }));
    var main = H.results.filter(function (r) { return !r.back; })[0] || H.results[0];
    main.w.forEach(function (j) { st.won[j]++; });
    var snap = handSnap(H, total, main);
    if (!st.big || total > st.big.amt) { st.big = { amt: total, who: main.w.map(function (j) { return S.players[j].name; }).join(' and '), desc: main.v != null ? aName(main.v) : '', no: H.no, fold: !!main.fold }; st.bigH = snap; }
    if (main.v != null && (!st.bestH || main.v > st.bestH.v)) st.bestH = snap;
    st.lastH = snap;
    Object.keys(H.scores || {}).forEach(function (k) {
      var j = +k, v = H.scores[j];
      if (!st.best || v > st.best.v) st.best = { v: v, who: S.players[j].name, desc: handName(v), no: H.no };
    });
    // Bad beats: a big favourite all in who lost, or a monster that got cracked
    if (H.ai && main.v != null) {
      H.ai.seats.forEach(function (j, k) {
        if (H.ai.eq[k] >= 0.7 && main.w.indexOf(j) < 0) {
          var w = main.w[0];
          st.beats.push(S.players[j].name + ' was ' + Math.round(H.ai.eq[k] * 100) + '% to win with ' + aiDesc(H, j) +
            ', but ' + S.players[w].name + ' caught ' + aName(main.v) + ' (hand ' + H.no + ')');
        }
      });
    } else if (main.v != null) {
      Object.keys(H.scores).forEach(function (k) {
        var j = +k; if (main.w.indexOf(j) >= 0) return;
        if (catOf(H.scores[j]) >= 6) st.beats.push('Cooler: ' + nmPoss2(j) + ' ' + shortName(H.scores[j]).toLowerCase() + ' lost to ' + nmPoss2(main.w[0]) + ' ' + shortName(main.v).toLowerCase() + ' (hand ' + H.no + ')');
      });
    }
    if (st.beats.length > 6) st.beats = st.beats.slice(-6);
  }
  // A finished hand for the history view: board, who showed what, who won
  function handSnap(H, total, main) {
    var seats = Object.keys(H.scores || {}).map(Number);
    if (seats.indexOf(0) < 0 && H.inHand[0] && H.hole && H.hole[0]) seats.unshift(0);
    if (main.fold) main.w.forEach(function (j) { if (seats.indexOf(j) < 0) seats.push(j); });
    return { no: H.no, pot: total, v: main.v != null ? main.v : -1, fold: main.fold ? 1 : 0, b: (H.board || []).map(code),
      p: seats.map(function (j) {
        var sc = H.scores && H.scores[j] != null ? H.scores[j] : null, shown = sc != null || j === 0;
        return { i: j, c: shown && H.hole && H.hole[j] ? H.hole[j].map(code) : [], h: sc != null ? handName(sc) : '', w: H.won[j] - H.total[j], f: H.folded[j] ? 1 : 0, win: main.w.indexOf(j) >= 0 ? 1 : 0 };
      }) };
  }
  function aiDesc(H, j) {
    if (H.ai.board >= 3) return aName(score(H.hole[j], H.board.slice(0, H.ai.board), S.om));
    if (S.om) return 'a strong start';
    var d = startName(H.hole[j]); return /^Pair/.test(d) ? 'a ' + d.toLowerCase() : d;
  }
  function nmPoss2(j) { return S.players[j].name + '\'s'; }
  function eliminate(H) {
    var gone = S.players.map(function (p, i) { return i; }).filter(function (i) { return H.inHand[i] && S.players[i].stack <= 0 && !S.players[i].out; });
    if (!gone.length) return [];
    var left = alive().length - gone.length;
    gone.sort(function (a, b) { return H.start[b] - H.start[a]; }); // bigger starting stack finishes higher
    var main = H.results.filter(function (r) { return !r.back; })[0] || H.results[0];
    gone.forEach(function (i, k) {
      S.players[i].out = true; S.players[i].place = left + k + 1;
      var by = main.w[0];
      S.st.kos.push({ who: i, by: by, no: H.no, place: S.players[i].place });
    });
    return gone;
  }

  function askRebuy() {
    var b = Casino.balance(), buy = Math.min(BUYIN, b);
    Kit.haptic('error');
    var acts = [];
    if (buy >= 40) acts.push({ label: 'Rebuy ' + usd(buy), primary: true, onClick: function () { Casino.bet(buy); S.players[0].stack = buy; S.players[0].buyin += buy; S.players[0].rebuys++; Kit.sfx('chip'); startHand(); } });
    else acts.push({ label: 'Refill bank to $1,000', primary: true, onClick: function () { Casino.reset(); askRebuy(); } });
    acts.push({ label: 'Leave the table', cls: 'btn-soft', onClick: function () { cashOut(false); } });
    Kit.sheet({ title: 'Out of chips', html: '<p class="muted">Buy back in for ' + usd(buy) + ' from your bank (' + usd(b) + ')?</p>', actions: acts, dismissible: false });
  }

  // ── Finishing ──────────────────────────────────────────────────────────────
  function tableHighlights() {
    var st = S.st, hl = [], hands = st.rows.length;
    if (st.big) hl.push('Biggest pot: ' + amt(st.big.amt) + ' to ' + st.big.who + (st.big.fold ? ' when everyone folded' : ' with ' + st.big.desc) + ' (hand ' + st.big.no + ')');
    if (st.best && catOf(st.best.v) >= 2) hl.push('Best hand: ' + st.best.who + '\'s ' + st.best.desc.charAt(0).toLowerCase() + st.best.desc.slice(1) + ' (hand ' + st.best.no + ')');
    st.beats.slice(-2).forEach(function (b) { hl.push((/^Cooler/.test(b) ? '' : 'Bad beat: ') + b); });
    if (S.tourn) {
      var kos = st.kos.slice().sort(function (a, b) { return a.no - b.no; });
      kos.slice(0, 2).forEach(function (k) { hl.push(S.players[k.by].name + ' knocked out ' + S.players[k.who].name + ' in hand ' + k.no); });
      hl.push('Blinds reached ' + S.sb + ' / ' + S.bb + ' after ' + S.handNo + ' hand' + (S.handNo === 1 ? '' : 's'));
    } else {
      var reb = S.players.filter(function (p) { return p.rebuys; });
      if (reb.length) hl.push(reb.map(function (p) { return p.name + ' rebought ' + (p.rebuys > 1 ? p.rebuys + ' times' : 'once'); }).join(', '));
    }
    if (hands) hl.push(S.players[0].name + ' won ' + st.won[0] + ' of ' + hands + ' hands');
    return hl;
  }
  function chunkRows() {
    var rows = S.st.rows, n = rows.length; if (!n) return null;
    var size = Math.max(1, Math.ceil(n / 12)), labels = [], scores = [];
    for (var i = 0; i < n; i += size) {
      var part = rows.slice(i, i + size), sum = S.players.map(function (p, j) { return part.reduce(function (a, r) { return a + (r[j] || 0); }, 0); });
      labels.push(size === 1 ? 'H' + (i + 1) : (i + 1) + '–' + Math.min(n, i + size)); scores.push(sum);
    }
    return { labels: labels, scores: scores };
  }
  function recordTable(silent) {
    var players, winner, summary, me = S.players[0];
    if (S.tourn) {
      players = S.players.map(function (p) { return { name: p.name, score: p.place, cpu: p.cpu }; });
      var w = S.players.filter(function (p) { return p.place === 1; })[0];
      winner = w ? w.name : null;

  function pcs(a, b) {
    if (Math.round(a * 100) !== Math.round(b * 100) || Math.abs(a - b) < 1e-9) return [pc(a), pc(b)];
    return [Math.round(a * 1000) / 10 + '%', Math.round(b * 1000) / 10 + '%'];
  }
  function tablePlan(sd, o, nOpp) {
    var H = S.hand, me = S.players[0], eq = sd.eq, fair = 1 / (nOpp + 1), strong = Math.min(0.9, fair + 0.12);
    // The pot you play for if you call. The win chances assume everyone still in goes to the showdown, so the
    // pot counts them matching your bet too (players still to act haven't yet). From each player you can win at
    // most what you put in yourself (all in for less).
    var c = o.call, T0 = H.total[0] + c, now = 0, W = 0;
    for (var j = 0; j < N(); j++) {
      var t = j === 0 ? T0 : Math.min(H.total[j], T0);
      now += t;
      W += j > 0 && H.inHand[j] && !H.folded[j] ? Math.min(T0, H.total[j] + S.players[j].stack) : t;
    }
    var need = c > 0 ? c / W : 0, capped = c < o.toCall, behind = W - now;
    var raiseTo = o.canRaise ? (S.limit ? o.minTo : Math.min(o.maxTo, Math.max(o.minTo, roundTo(o.isBet ? potAll() * 0.6 : H.curBet * 3)))) : 0;
    var raiseCost = raiseTo - H.bet[0], word = o.isBet ? 'Bet' : 'Raise';
    var best;
    if (o.toCall > 0) best = o.canRaise && eq >= strong && eq >= need + 0.1 ? 'raise' : eq >= need ? 'call' : 'fold';
    else best = o.canRaise && eq >= strong ? 'raise' : 'check';
    var close = best === 'raise' || best === 'check' ? o.canRaise && Math.abs(eq - strong) < 0.03 : Math.abs(eq - need) < 0.03;
    var callEv = eq * W - c, wpl = { w: sd.win, p: sd.tie, l: Math.max(0, 1 - sd.win - sd.tie) };
    var moves = [];
    if (o.toCall > 0) moves.push({ id: 'fold', short: 'Fold', name: 'Fold', value: 0, valueText: S.tourn ? '0 chips' : '$0', bar: false,
      note: 'Costs nothing more' + (H.total[0] > 0 ? ', but the ' + cAmt(H.total[0]) + ' you\'ve already put in stays in the pot' : '') + ', and you give up any chance at ' + potOf(potAll()) + '.' });
    if (o.canCheck) moves.push(Object.assign({ id: 'check', short: 'Check', name: 'Check', valueText: 'Free',
      note: 'Pass without paying. ' + (H.street === 3 ? 'If everyone checks, the cards are shown and the best hand wins.' : 'If nobody bets, you see the next card for free.') +
        ' Your share of ' + potOf(potAll()) + ' right now is worth about ' + cAmt2(eq * potAll()) + ' (your ' + pc(eq) + ' chance times the pot).' }, wpl));
    else moves.push(Object.assign({ id: 'call', short: c >= me.stack ? 'All in' : 'Call', name: (c >= me.stack ? 'All in for ' : 'Call ') + cAmt(c), value: callEv, valueText: cSigned(callEv),
      note: 'Average result: your ' + pc(eq) + ' share of ' + potOf(W) + ', minus the ' + cAmt(c) + ' it costs' + (behind > 0 ? ' (counting calls from the players still to act)' : '') + '. Later betting rounds aren\'t counted.' }, wpl));
    if (o.canRaise) {
      var allIn = raiseTo >= o.all, foldBE = raiseCost / (potAll() + raiseCost);
      moves.push(Object.assign({ id: 'raise', short: allIn ? 'All in' : word, name: allIn ? 'All in (' + cAmt(raiseTo) + ')' : o.isBet ? 'Bet ' + cAmt(raiseTo) : 'Raise to ' + cAmt(raiseTo), valueText: 'Depends',
        note: 'Puts in ' + cAmt(raiseCost) + (S.limit ? ' (the fixed bet size)' : ' (a usual size; you can pick another)') + '. If everyone folds you win ' + potOf(potAll()) + ' straight away; if you\'re called, the bar shows your showdown chances. ' +
          'Its average depends on how often they fold, which nobody can know for sure. Even with no chance of winning when called, it would break even if they all folded more than ' + pc(foldBE) + ' of the time.' }, wpl));
    }
    moves.forEach(function (m) { m.best = m.id === best; });
    return { sd: sd, o: o, nOpp: nOpp, eq: eq, fair: fair, strong: strong, need: need, W: W, c: c, capped: capped, now: now, behind: behind, best: best, close: close, callEv: callEv, moves: moves, raiseTo: raiseTo };
  }
  function omahaStart(h) {
    var bits = [], ranks = {}, suits = {};
    h.forEach(function (c) { ranks[c >> 2] = (ranks[c >> 2] || 0) + 1; suits[c & 3] = (suits[c & 3] || 0) + 1; });
    Object.keys(ranks).forEach(function (r) { if (ranks[r] >= 2) bits.push('a pair of ' + RP[r]); });
    var ss = Object.keys(suits).filter(function (s) { return suits[s] >= 2; }).length;
    if (ss === 2) bits.push('double-suited'); else if (ss === 1) bits.push('suited');
    var rs = h.map(function (c) { return c >> 2; }), span = Math.max.apply(null, rs) - Math.min.apply(null, rs);
    if (Object.keys(ranks).length === 4 && span <= 4) bits.push('connected');
    return ctxts(h) + (bits.length ? ' (' + bits.join(', ') + ')' : '');
  }
  function handWords(outs) {
    var H = S.hand, hole = H.hole[0], board = H.board;
    if (board.length < 3) return S.om ? omahaStart(hole) : startName(hole);
    var v = score(hole, board, S.om), draws = [], g = outs ? outs.groups : {};
    var fl = (g[5] || []).length, st = (g[4] || []).length;
    if (fl && catOf(v) < 5) draws.push('a flush draw');
    if (st && catOf(v) < 4) draws.push(st >= 9 ? 'a big straight draw' : st >= 7 ? 'an open-ended straight draw' : 'an inside straight draw');
    return handName(v) + (draws.length ? ', with ' + draws.join(' and ') : '');
  }
  function seatWords() {
    var H = S.hand, n = N(), rel = function (j) { return (j - H.button - 1 + n) % n; };
    var after = live().filter(function (j) { return j !== 0 && S.players[j].stack > 0 && rel(j) > rel(0); }).length;
    if (H.button === 0) return 'You have the dealer button, so after the flop you act last: the best seat at the table.';
    if (!after) return 'Everyone who would act after you has folded or is all in, so you act last from here on: the best spot.';
    return after + (after === 1 ? ' player acts' : ' players act') + ' after you on the later betting rounds, so you often have to decide before seeing what they do.';
  }
  function tableSheet(P) {
    var H = S.hand, sd = P.sd, o = P.o, nOpp = P.nOpp, eq = P.eq, outs = outsOf(H.hole[0], H.board, S.om);
    var vs = nOpp === 1 ? 'one other player' : nOpp + ' other players', mv = P.moves.filter(function (m) { return m.best; })[0];
    var bestValue = mv.id === 'call' ? mv.name : mv.id === 'raise' ? mv.name : mv.short;
    var reason, en = pcs(eq, P.need), ef = pcs(eq, P.fair);
    if (P.best === 'fold') reason = 'You\'d win about ' + en[0] + ' of the time, but this call needs more than ' + en[1] + ' to pay off.';
    else if (P.best === 'call') reason = 'You\'d win about ' + en[0] + ' of the time, more than the ' + en[1] + ' this call needs to break even.';
    else if (P.best === 'raise') reason = 'You\'d win about ' + ef[0] + ' of the time against ' + vs + ', well above an equal share (' + ef[1] + '), so ' + (o.toCall ? 'make them pay more to stay in.' : 'bet to build the pot.');
    else reason = 'You\'d win about ' + ef[0] + ' of the time, ' + (eq >= P.fair ? 'not far enough above an equal share (' + ef[1] + ') to bet' : 'less than an equal share (' + ef[1] + '), so betting doesn\'t pay') + ', and checking is free.';
    if (pc(eq) !== pc(sd.win)) reason = reason.replace(' of the time', ' of the time (counting ties as part-wins)');
    if (P.close) reason += ' It\'s close, so either choice is reasonable.';

    var bv = H.board.length >= 3 ? score(H.hole[0], H.board, S.om) : 0, bo = H.board.length >= 3 ? ev(H.board) : 0;
    var shared = !S.om && bv && catOf(bv) >= 1 && catOf(bv) === catOf(bo) && kOf(bv, 0) === kOf(bo, 0) && (catOf(bv) !== 2 || kOf(bv, 1) === kOf(bo, 1));
    var intro = '<b>Your hand:</b> ' + Kit.esc(handWords(outs)) + '.' + (shared ? ' Careful: that ' + (catOf(bv) === 1 ? 'pair' : 'hand') + ' is on the board, so everyone still in shares it.' : '') +
      ' Against ' + vs + ' still in, if it goes to a showdown you\'d win about <b>' + pc(sd.win) + '</b>' + (sd.tie >= 0.005 ? ', tie ' + pc(sd.tie) : '') + ' and lose ' + pc(Math.max(0, 1 - sd.win - sd.tie)) + '. An equal share would be ' + pc(P.fair) + '.';

    var why = [];
    why.push('Your chance to win (counting ties as part-wins) is about <b>' + ef[0] + '</b>. ' + (eq >= P.strong ? 'That\'s well above an equal share of ' + ef[1] + ': you\'re likely ahead.' : eq >= P.fair ? 'That\'s a bit above an equal share of ' + ef[1] + ', but not by enough to be sure you\'re ahead.' : 'That\'s below an equal share of ' + ef[1] + ': you\'re likely behind right now.'));
    var flat = Math.abs(P.callEv) < (S.tourn ? 0.5 : 0.005);
    if (o.toCall > 0) why.push('Calling costs ' + cAmt(P.c) + ' and you\'d need to win more than <b>' + en[1] + '</b> to break even. ' + (flat ? 'You\'re right on the line, so calling about breaks even.' : P.callEv > 0 ? 'You do, so calling wins about ' + cSigned(P.callEv).replace('+', '') + ' on average.' : 'You don\'t, so calling loses about ' + cSigned(P.callEv).replace('−', '') + ' on average. Folding loses nothing more.'));
    else why.push('Nobody has bet, so you can check for free. ' + (o.canRaise ? (P.best === 'raise' ? 'But with a hand this strong, betting makes weaker hands pay to see more cards, and wins the pot now if everyone folds.' : 'Betting with a so-so hand mostly gets called by better hands and folds out worse ones.') : ''));
    if (P.best === 'raise' && o.toCall > 0) why.push('Raising rather than just calling puts more money in while you\'re probably ahead, and may make others fold.');
    if (outs && outs.total) why.push(outs.total + ' card' + (outs.total > 1 ? 's' : '') + ' still to come would improve your hand (see Outs below). That\'s already counted in your chance to win.');
    if (o.toCall > 0) why.push('Someone has bet. Players who bet usually hold better than random cards, so your real chances are probably a bit lower than shown, more so if the bet is big.');

    var secs = [{ title: 'Why', items: why }];
    if (o.toCall > 0) secs.push({ title: 'Pot odds: is calling worth the price?', text:
      'Calling costs <b>' + cAmt(P.c) + '</b>. The pot has <b>' + cAmt(P.now - P.c) + '</b> in it that you could win' +
      (P.behind > 0 ? ', and if the players still to act call too, another ' + cAmt(P.behind) + ' goes in (the chances above assume they stay in)' : '') +
      '. So you put in ' + cAmt(P.c) + ' to win ' + cAmt(P.W - P.c) + ': you need to win more than ' +
      Math.round(P.c).toLocaleString() + ' ÷ (' + Math.round(P.W - P.c).toLocaleString() + ' + ' + Math.round(P.c).toLocaleString() + ') = <b>' + en[1] + '</b> of the time to break even. You win about ' + en[0] + ', so calling ' + (flat ? 'about <b>breaks even</b>' : eq >= P.need ? '<b>makes money</b>' : '<b>loses money</b>') + ' on average.' +
      (P.capped ? ' (You\'d be all in for less than the bet, so from each player you can only win as much as you put in yourself.)' : '') +
      (P.behind > 0 ? ' If someone behind you raises instead, the price goes up.' : '') });
    if (H.board.length === 3 || H.board.length === 4) {
      var gs = outs ? Object.keys(outs.groups).map(Number).sort(function (a, b) { return b - a; }) : [];
      var GN = { 1: 'Top pair', 2: 'Two pair', 3: 'Three of a kind', 4: 'Straight', 5: 'Flush', 6: 'Full house', 7: 'Four of a kind', 8: 'Straight flush', 9: 'Royal flush' };
      var items = gs.map(function (k) {
        var cs = outs.groups[k], su = cs.every(function (c) { return (c & 3) === (cs[0] & 3); });
        return '<b>' + GN[k] + '</b>: ' + cs.length + ' card' + (cs.length > 1 ? 's' : '') + (cs.length <= 6 ? ' (' + ctxts(cs) + ')' : su ? ' (any other ' + SUITN[cs[0] & 3] + ')' : '');
      });
      var left = H.board.length === 3 ? 'two cards to come' : 'one card to come';
      secs.push({ title: 'Outs: cards that would help you', text: outs && outs.total ?
        '<b>' + outs.total + ' card' + (outs.total > 1 ? 's' : '') + '</b> would lift you to a better hand. With ' + left + ', the chance at least one shows up by the river is about <b>' + pc(outs.hit) + '</b>. Quick trick: outs × ' + (H.board.length === 3 ? '4' : '2') + ' gives roughly the same percentage.' :
        'No single card would lift you to a better hand of your own. To improve you\'d need two lucky cards in a row, or to win with what you have.', items: items.length ? items : null });
    } else if (H.board.length === 5) secs.push({ title: 'Outs', text: 'All five shared cards are out, so the hand you have now is your final hand.' });
    secs.push({ title: 'How to think about it', items: [
      '<b>Hand strength.</b> Compare your chance to win with an equal share (with ' + (nOpp + 1) + ' players in, that\'s ' + pc(P.fair) + '). Well above it: bet or raise so weaker hands pay. Around it: check or call when the price is right. Well below: give up unless it\'s cheap.',
      '<b>Pot odds.</b> The bigger the pot compared with the price of calling, the less often you need to win. Needing 20% and winning 30% makes money over time, even though you lose most of those hands.',
      '<b>Position.</b> Acting after the others is an advantage because you see what they do first. ' + seatWords() + ' With a borderline hand, be more careful when several players still act after you.',
      '<b>Future bets.</b> The averages here count only the money in the pot now. A draw that hits can win more bets later, so draws are worth a little more than the numbers show; a strong hand that could be overtaken is worth betting now.'
    ] });
    secs.push({ title: 'About these numbers', text: 'The coach dealt this hand out ' + sd.n.toLocaleString() + ' times with random cards for the other ' + (nOpp === 1 ? 'player' : nOpp + ' players') + ' and for the board still to come' +
      (S.om ? ' (Omaha hands use exactly 2 of the 4 private cards and 3 shared cards)' : '') + ', and counted how often you\'d win. They are <b>estimates</b>: each percentage can be off by a point or two, and real players don\'t hold random cards. The "best move" follows a simple rule: call when you win more often than the pot odds need, bet or raise when you\'re 12 points or more above an equal share, otherwise check or fold.' });
    Coach.sheet({
      title: 'Your best move',
      best: { label: 'Best move', value: bestValue, text: reason },
      movesTitle: 'Your hand and your options',
      intro: intro + ' The amount on the right is the average result of each choice, where it can be worked out honestly.',
      moves: P.moves,
      sections: secs
    });
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  var lastKey = null; try { lastKey = localStorage.getItem(LAST); } catch (e) {}
  var saved = lastKey ? load(lastKey) : null;
  if (saved && saved.kind) { S = saved; Kit.gameStart(); resume(); }
  else showSetup();
})();
</script>

<style>
/* the lettering of the places' felt logos (poker/logos.js); each font loads only where a logo uses it */
@font-face{font-family:"Rye";src:url("../fonts/rye.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Cinzel";src:url("../fonts/cinzel-700.woff2") format("woff2");font-weight:700;font-display:swap;}
@font-face{font-family:"Great Vibes";src:url("../fonts/great-vibes.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Bungee";src:url("../fonts/bungee.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Russo One";src:url("../fonts/russo-one.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Pagella";src:url("../fonts/pagella-400.woff2") format("woff2");font-weight:400;font-display:swap;}
@font-face{font-family:"Pagella";src:url("../fonts/pagella-400italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap;}
@font-face{font-family:"Pagella";src:url("../fonts/pagella-700.woff2") format("woff2");font-weight:700;font-display:swap;}
@font-face{font-family:"Pagella";src:url("../fonts/pagella-700italic.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap;}
@font-face{font-family:"Sofia Sans Condensed";src:url("../fonts/sofia-sans-condensed.woff2") format("woff2");font-weight:100 900;font-display:swap;}
@font-face{font-family:"Sofia Sans";src:url("../fonts/sofia-sans.woff2") format("woff2");font-weight:100 900;font-display:swap;}
@font-face{font-family:"Baloo 2";src:url("../fonts/baloo2-700.woff2") format("woff2");font-weight:700;font-display:swap;}
@font-face{font-family:"Fredoka";src:url("../fonts/fredoka-600.woff2") format("woff2");font-weight:600;font-display:swap;}
@font-face{font-family:"Jersey 10";src:url("../fonts/jersey-10.woff2") format("woff2");font-display:swap;}
.stage{padding-bottom:calc(var(--safe-b) + 10px);}
/* ── Info strip above the table ── */
.pinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 4px 10px;font-weight:800;font-size:.82rem;color:var(--text-2);white-space:nowrap;}
.pinfo b{color:var(--text);font-variant-numeric:tabular-nums;}
.pinfo .bank{display:inline-flex;align-items:center;gap:6px;}
.pinfo .bank .ico{width:16px;height:16px;color:var(--yellow);}

/* ── Oval poker table ── */
.ptable{position:relative;height:clamp(390px,55dvh,500px);border-radius:50% / 34%;margin:0 6px 8px;}
.ptable > .felt-in{position:absolute;inset:11px;border-radius:50% / 33%;}
.ptable > .felt-in::after{content:"";position:absolute;inset:13% 11%;border-radius:50% / 34%;border:2px solid rgba(255,255,255,.09);pointer-events:none;}
.pa{position:absolute;transform:translate(-50%,-50%);}
.pseat{z-index:4;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px;transition:opacity .3s;}
.pseat .tag{display:flex;align-items:center;gap:4px;max-width:120px;padding:3px 8px 3px 3px;border-radius:999px;background:rgba(8,10,26,.82);color:#fff;font-weight:800;font-size:.8rem;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:box-shadow .2s, transform .3s var(--spring);}
.pseat .tag > .nm{min-width:0;overflow:hidden;}   /* (fitTiles fits the name: the initial goes, then the size eases down) */
.pseat .tag .avatar{width:24px;height:24px;font-size:.72rem;flex:none;}
.pseat .tag .avatar .ico{width:60%;height:60%;}
.pseat .stack{padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:#1d1b2e;font-size:.74rem;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.pseat.me{flex-direction:row;gap:6px;}
.pseat.top{display:grid;grid-template-columns:auto auto;column-gap:6px;row-gap:3px;align-items:center;justify-items:start;}
.pseat.top > .cards{grid-row:1 / 3;}
.pseat.acting .tag{box-shadow:0 0 0 3px var(--yellow),0 0 18px rgba(255,200,61,.6);}
.pseat.win .tag{box-shadow:0 0 0 2px #ffd84a,0 0 10px rgba(255,200,61,.4);}
.pseat.lost > .cards,.pseat.lost > .tag{opacity:.7;}
.pseat.lost .psay.hand{opacity:.85;}
.psay.champ{font-size:.78rem;padding:2px 9px;z-index:7;background:var(--yellow);color:#2b1a00;}
.psay.champ.anim{animation:fadein .3s ease-out both;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
/* all in: a red stamp with gold letters; the moment it happens it flashes in with a gold ring, and a red ring pulses off the seat */
.psay.allin{background:linear-gradient(180deg,#ff5d52,#c11a2c);color:#fff;text-transform:uppercase;letter-spacing:.07em;font-size:.68rem;box-shadow:0 0 0 1.5px #ffd84a,0 3px 10px rgba(0,0,0,.45);}
:is(.pseat.allinfx,.pme.allinfx) .psay.allin{animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both;}
@keyframes stamp{from{opacity:0;filter:brightness(1.8);box-shadow:0 0 0 12px rgba(255,216,74,0),0 3px 10px rgba(0,0,0,.45);}30%{opacity:1;box-shadow:0 0 0 6px rgba(255,216,74,.85),0 3px 10px rgba(0,0,0,.45);}to{filter:none;box-shadow:0 0 0 1.5px #ffd84a,0 3px 10px rgba(0,0,0,.45);}}   /* (it flashes in where it sits: no scaling, which would slide it off its spot) */
.pseat.allinfx > .tag{animation:allinring 1.1s ease-out 2;}
.pme.allinfx .phand{animation:allinglow 1.1s ease-out 2;}
@keyframes allinring{0%{box-shadow:0 0 0 0 rgba(255,93,82,.95),0 2px 8px rgba(0,0,0,.4);}100%{box-shadow:0 0 0 20px rgba(255,93,82,0),0 2px 8px rgba(0,0,0,.4);}}
@keyframes allinglow{0%{filter:drop-shadow(0 0 0 rgba(255,93,82,.9));}40%{filter:drop-shadow(0 0 16px rgba(255,93,82,.85));}100%{filter:drop-shadow(0 0 0 rgba(255,93,82,0));}}
.pspot{position:absolute;inset:0;border-radius:inherit;pointer-events:none;}
.pspot.anim{animation:fadein .9s ease-out .35s both;}
/* the spots a seat's pill can move to when its usual one would cover something (placeSays) */
.psay.at-t{top:auto !important;bottom:100% !important;left:50% !important;right:auto !important;transform:translate(-50%,-3px) !important;}
.psay.at-b{top:100% !important;bottom:auto !important;left:50% !important;right:auto !important;transform:translate(-50%,3px) !important;}
.psay.at-l{top:50% !important;bottom:auto !important;left:auto !important;right:100% !important;transform:translate(-4px,-50%) !important;}
.psay.at-r{top:50% !important;bottom:auto !important;left:100% !important;right:auto !important;transform:translate(4px,-50%) !important;}
.psay.at-tl{top:0 !important;bottom:auto !important;left:auto !important;right:100% !important;transform:translate(-4px,0) !important;}
.psay.at-tr{top:0 !important;bottom:auto !important;left:100% !important;right:auto !important;transform:translate(4px,0) !important;}
.psay.at-bl{top:auto !important;bottom:0 !important;left:auto !important;right:100% !important;transform:translate(-4px,0) !important;}
.psay.at-br{top:auto !important;bottom:0 !important;left:100% !important;right:auto !important;transform:translate(4px,0) !important;}
.pbet .wh.at-l{top:50%;bottom:auto;left:auto;right:100%;translate:-5px -50%;} .pbet .wh.at-r{top:50%;bottom:auto;left:100%;translate:5px -50%;}
/* the winning hand's name, riding on the pot as it slides to the winner: lettered on the felt, no box */
.pbet .wh{position:absolute;left:50%;top:100%;translate:-50% 3px;display:flex;align-items:center;gap:4px;white-space:nowrap;pointer-events:none;
  color:#ffe7a3;font-weight:900;font-size:.82rem;letter-spacing:.01em;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.55);}
.pbet .wh.up{top:auto;bottom:100%;translate:-50% -3px;}
.pbet .wh.lft{left:0;translate:0 3px;} .pbet .wh.lft.up{translate:0 -3px;}
.pbet .wh svg{width:14px;height:14px;flex:none;color:#ffd84a;filter:drop-shadow(0 1px 1px rgba(0,0,0,.8));}
.pbet .wh.anim{animation:fadein .35s ease-out .55s both;}
.pbet.won.over{z-index:6;} .pbet.won.over .wh{padding:2px 8px 2px 6px;border-radius:999px;background:rgba(8,10,26,.82);}
.pseat.fold > .cards,.pseat.fold > .tag{opacity:.45;}
.pseat.out{opacity:.35;}
.pseat .cards{display:flex;--cw:24px;min-height:34px;}
.pseat .cards .pcard+.pcard{margin-left:-13px;}
.pseat .cards.om .pcard+.pcard{margin-left:-17px;}
.pseat .cards.face{--cw:35px;min-height:49px;}
.pseat .cards.face .pcard+.pcard{margin-left:-9px;}
.pseat .cards.face.om .pcard+.pcard{margin-left:-19px;}
.pseat .cards .pcard{box-shadow:0 0 0 1px rgba(0,0,0,.15),0 3px 6px rgba(0,0,0,.35);}
.psay{position:absolute;left:50%;top:100%;transform:translate(-50%,3px);padding:2px 8px;border-radius:9px;background:#fff;color:#1d1b2e;font-weight:900;font-size:.67rem;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:6;}
.psay.new{animation:saypop .35s var(--spring);}
@keyframes saypop{from{opacity:0;}to{opacity:1;}}   /* (a fade, nothing that moves: the pill's own transform places it, and any scaling would slide it as it grew) */
.psay.hand{background:var(--yellow);color:#2b1a00;}
.psay.fold{background:rgba(255,255,255,.55);}
.pseat.me .psay{top:auto;bottom:100%;transform:translate(-50%,-4px);}
.pdealer{z-index:3;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fff,#e6e1d4);color:#1d1b2e;font-weight:900;font-size:.7rem;box-shadow:0 0 0 2px rgba(0,0,0,.18) inset,0 3px 6px rgba(0,0,0,.45);transition:left .5s var(--ease), top .5s var(--ease);}

/* chips: side-view stacks in standard casino colours */
/* chips: clay chips seen from a little above. Each one is its edge (the colour, three inserts, the curve of the
   side); the top one shows its face: a ring of edge spots, a white inlay ring and a soft gloss. One size, --w. */
.stk{--w:20px;display:flex;align-items:flex-end;gap:2px;}
.stk .col{display:flex;flex-direction:column-reverse;filter:drop-shadow(0 1.5px 1.2px rgba(0,0,0,.45));}
.stk .col i{display:block;width:var(--w);height:calc(var(--w) * .36);margin-top:calc(var(--w) * -.19);border-radius:50%;
  background:
    linear-gradient(90deg,rgba(0,0,0,.38),rgba(0,0,0,0) 22%,rgba(255,255,255,.22) 42%,rgba(255,255,255,0) 60%,rgba(0,0,0,.38)),
    linear-gradient(90deg,transparent 0 13%,var(--s,#fff) 13% 21%,transparent 21% 45%,var(--s,#fff) 45% 55%,transparent 55% 79%,var(--s,#fff) 79% 87%,transparent 87%),
    var(--c);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.22),0 0 0 .5px rgba(0,0,0,.22);}
.stk .col i:nth-child(3n+2){transform:translateX(.6px);} .stk .col i:nth-child(3n){transform:translateX(-.5px);}
.stk .col i:last-child{height:calc(var(--w) * .52);transform:none;
  background:
    radial-gradient(ellipse 60% 55% at 38% 32%,rgba(255,255,255,.38),rgba(255,255,255,0) 70%),
    radial-gradient(ellipse at 50% 50%,var(--c) 0 38%,var(--s,#fff) 40% 46%,var(--c) 48% 60%,rgba(0,0,0,0) 61%),
    repeating-conic-gradient(from 8deg,var(--s,#fff) 0 16deg,transparent 16deg 45deg),
    var(--c);
  box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.4),0 0 0 .5px rgba(0,0,0,.35);}
.pland .stk{--w:17px;}
.pseat .stk.mini{--w:15px;gap:1px;}
.ppot .stk.big{--w:24px;gap:3px;}
.pland .ppot .stk.big{--w:20px;}
.pstk{display:flex;align-items:flex-end;gap:4px;}
.pseat .pcard.gone{visibility:hidden;}
/* a player's chips and amount keep one size whatever the stack (four chip colours at most; room for 102,450) */
.pseat .stk.mini{min-width:calc(var(--w) * 4 + 3px);min-height:calc(var(--w) * .9);justify-content:flex-end;}
:is(.ps-lt,.ps-lb,.ps-l) > .pstk .stk.mini{justify-content:flex-start;}
.pseat .pstk .stack{min-width:4.3em;text-align:center;box-sizing:border-box;}
/* the blinds: like the dealer button but smaller and quieter (a dark token with a thin ring, not a white disc) */
.pblind{flex:none;align-self:center;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:rgba(10,12,28,.62);color:rgba(255,255,255,.82);font-weight:900;font-size:.46rem;letter-spacing:.02em;box-shadow:0 0 0 1.5px rgba(255,255,255,.45) inset;}
.pblind.bb{box-shadow:0 0 0 1.5px rgba(255,216,74,.7) inset;color:#ffe9a8;}
.pbet{z-index:2;display:flex;align-items:flex-end;gap:4px;}
.pa.bl{transform:translate(0,-50%);}
.pa.br{transform:translate(-100%,-50%);flex-direction:row-reverse;}
.pbet .amt{font-weight:900;font-size:.7rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);font-variant-numeric:tabular-nums;white-space:nowrap;}
.pbet.won .amt{color:var(--yellow);font-size:.8rem;}
.ppot{z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;}
.ppot .lbl:has(small){border-radius:10px;text-align:center;}
.ppot .lbl small{display:block;font-size:.66rem;font-weight:800;opacity:.75;text-align:center;line-height:1.1;}
.ppot .lbl{padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.38);color:#fff;font-weight:900;font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pboard{z-index:2;display:flex;gap:4px;--cw:clamp(42px,11.6vw,54px);}
.pboard > .pcard.slot{visibility:hidden;}   /* the board's cards still to come: their places kept, nothing drawn over the felt's logo */
.pcard.deal{animation:flipin .45s var(--ease) backwards;}   /* (not "both": once dealt, the card must still lift when picked) */
@keyframes flipin{from{transform:rotateY(90deg) translateY(-10px) scale(.85);opacity:0;}to{transform:none;opacity:1;}}
.pcard.best{box-shadow:0 0 0 3px var(--yellow),0 0 16px rgba(255,200,61,.75)!important;}
.pcard.unused{filter:brightness(.55) saturate(.6);}
.pmsg{z-index:5;max-width:84%;padding:6px 14px;border-radius:14px;background:rgba(6,8,22,.72);color:#fff;font-weight:800;font-size:.84rem;line-height:1.3;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35);}
.pmsg b{color:var(--yellow);}
.pmsg.rise{animation:rise .4s var(--ease) both;}

/* ── Your cards ── */
.phand{display:flex;justify-content:center;gap:8px;--cw:clamp(62px,17.5vw,78px);min-height:calc(var(--cw) * 1.4);}
.phand.om{--cw:clamp(54px,15vw,70px);gap:6px;}
.phand .pcard.folded{filter:brightness(.5) saturate(.5);transform:translateY(8px) rotate(-2deg);}
.plabel{text-align:center;font-weight:900;color:var(--yellow);min-height:22px;margin:6px 0 8px;font-size:.95rem;}
.plabel.dim{color:var(--text-3);}
.plabel.res{color:var(--text);font-weight:800;line-height:1.35;font-size:.92rem;}
.plabel.res b{color:var(--yellow);}
.pseat.up .psay{top:auto;bottom:100%;transform:translate(-50%,-3px);}

/* ── Action bar ── */
.pbar{display:flex;gap:8px;align-items:center;justify-content:center;min-height:56px;}
.pbar .btn{flex:1 1 0;min-height:54px;padding:0 8px;font-size:1rem;}
.pbar .btn small{display:block;font-size:.72rem;opacity:.8;}
.pbar .btn .two{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.1;}
.pbar .hint{color:var(--text-2);font-weight:800;text-align:center;}
.praise{border-radius:var(--r);background:var(--surface);padding:8px 12px 10px;margin-bottom:8px;box-shadow:var(--shadow-sm);}
.stage.raising .ptable{height:clamp(360px,44dvh,480px);}
.stage.raising .phand{--cw:clamp(48px,13vw,62px);}
.praise .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px;}
.praise .top b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--yellow);font-variant-numeric:tabular-nums;}
.praise input[type=range]{width:100%;height:36px;accent-color:var(--yellow);}
.praise .pre{display:flex;gap:6px;margin-top:6px;}
.praise .pre .chip{flex:1;justify-content:center;padding:0 6px;}

/* ── Video poker cabinet ── */
.vp{position:relative;max-width:440px;margin:2px auto 12px;padding:12px 11px 13px;border-radius:24px;
  background:linear-gradient(180deg,#7a1222 0%,#4a0915 55%,#2c050c 100%);
  box-shadow:inset 0 0 0 2px rgba(255,214,140,.38),inset 0 2px 0 rgba(255,255,255,.22),inset 0 -6px 12px rgba(0,0,0,.4),0 18px 36px rgba(0,0,0,.5);}
.vp::before{content:"";position:absolute;inset:5px;border-radius:19px;border:1px solid rgba(255,255,255,.1);pointer-events:none;}
.vp-title{text-align:center;font-family:var(--display);font-size:1.55rem;line-height:1.1;color:#ffd84d;letter-spacing:.04em;text-shadow:0 2px 0 #7a3a00,0 0 18px rgba(255,200,60,.35);}
.vp-sub{text-align:center;font-size:.64rem;font-weight:900;letter-spacing:.22em;color:rgba(255,220,150,.75);text-transform:uppercase;margin:1px 0 8px;}
.vp-pay{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;background:#0b1c8f;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 2px #e2bf45;font-size:.7rem;font-weight:900;text-transform:uppercase;color:#ffe14d;}
.vp-pay td{padding:2.5px 4px;text-align:right;font-variant-numeric:tabular-nums;border-left:1px solid rgba(255,225,77,.22);white-space:nowrap;}
.vp-pay td:first-child{text-align:left;width:39%;border-left:0;padding-left:8px;font-size:.66rem;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;}
.vp-pay tr:first-child td{padding-top:5px;} .vp-pay tr:last-child td{padding-bottom:5px;}
.vp-pay td.on{background:#b3122b;color:#fff;}
.vp-pay tr.dealt td:first-child{color:#fff;}
.vp-pay tr.hit td{background:#ffe14d;color:#0b1c8f;animation:vpblink .5s steps(2) 4;}
@keyframes vpblink{50%{background:#0b1c8f;color:#ffe14d;}}
.vp-screen{margin-top:9px;border-radius:12px;padding:10px 6px 8px;background:radial-gradient(120% 100% at 50% 0%,#1636a8 0%,#0a1a74 65%,#06104f 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.5),inset 0 0 26px rgba(0,0,0,.55);}
.vp-cards{display:flex;justify-content:center;gap:6px;--cw:min(66px,calc((100vw - 96px) / 5));}
.vp-slot{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.vp-held{height:15px;font-size:.7rem;font-weight:900;letter-spacing:.14em;color:#ffe14d;text-shadow:0 0 8px rgba(255,225,77,.7);}
.vp-slot .pcard{transition:transform .2s var(--spring);}
.vp-slot.on .pcard{transform:translateY(-3px);box-shadow:0 0 0 3px #ffe14d,0 8px 16px rgba(0,0,0,.45);}
.vp-msg{text-align:center;color:#fff;font-weight:900;margin-top:8px;min-height:20px;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;}
.vp-msg b{color:#ffe14d;}
.vp-leds{display:grid;grid-template-columns:1fr .62fr 1.25fr;gap:6px;margin-top:9px;}
.vp-leds div{background:#140207;border-radius:8px;padding:3px 8px 4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 2px 6px rgba(0,0,0,.6);min-width:0;}
.vp-leds small{display:block;font-size:.58rem;font-weight:900;letter-spacing:.16em;color:#ffd84d;}
.vp-leds b{display:block;font-family:var(--mono);font-size:1.02rem;color:#ff4b3a;text-shadow:0 0 8px rgba(255,75,58,.75);text-align:right;white-space:nowrap;overflow:hidden;}
.vp-holds{display:flex;justify-content:center;gap:6px;margin:8px 0 0;}
.vp-holds .vbtn{width:min(66px,calc((100vw - 96px) / 5));min-height:40px;font-size:.66rem;padding:0;}
.vp-btns{display:grid;grid-template-columns:.9fr 1fr 1fr 1fr 1.35fr;gap:7px;max-width:470px;margin:0 auto;}
.vbtn.vcash{background:linear-gradient(180deg,#e9e2c8,#bfb38a);box-shadow:0 4px 0 #6d6248,inset 0 1px 0 rgba(255,255,255,.7);color:#4a4230;}
.vbtn{min-height:54px;padding:0 4px;border:0;border-radius:10px;font-weight:900;font-size:.74rem;line-height:1.15;letter-spacing:.06em;text-transform:uppercase;color:#3a2600;
  background:linear-gradient(180deg,#fff4b0 0%,#ffd43d 45%,#e8a900 100%);box-shadow:0 4px 0 #8a5b00,inset 0 1px 0 rgba(255,255,255,.85),0 0 14px rgba(255,210,61,.22);transition:transform .08s, box-shadow .08s, filter .15s;}
.vbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #8a5b00,inset 0 1px 0 rgba(255,255,255,.85);}
.vbtn:disabled{filter:grayscale(.8) brightness(.55);cursor:default;}
.vbtn.go{font-size:.95rem;color:#fff;background:linear-gradient(180deg,#ff9a9a 0%,#ea2a3e 45%,#b10f22 100%);box-shadow:0 4px 0 #640312,inset 0 1px 0 rgba(255,255,255,.6),0 0 16px rgba(234,42,62,.35);}
.vbtn.go:active:not(:disabled){box-shadow:0 1px 0 #640312;}
.vp-holds .vbtn{background:linear-gradient(180deg,#e9e2c8,#bfb38a);box-shadow:0 4px 0 #6d6248,inset 0 1px 0 rgba(255,255,255,.7);color:#4a4230;}
.vp-holds .vbtn.held{background:linear-gradient(180deg,#fff4b0,#ffd43d 45%,#e8a900);color:#3a2600;box-shadow:0 1px 0 #8a5b00,0 0 16px rgba(255,214,61,.7);transform:translateY(3px);}
.vbtn small{display:block;font-size:.62rem;opacity:.75;letter-spacing:.04em;}

/* Strategy help chip: on the felt between the board and you (portrait), above the buttons (sideways), on the machine's screen (video poker) */
.pcoach{display:flex;justify-content:center;min-height:26px;margin:-4px 0 8px;}
.pland .pcoach{grid-column:2;grid-row:3;align-self:end;justify-content:flex-start;min-height:0;margin:0 0 8px;}
.vp-coach{display:flex;justify-content:center;margin-top:7px;}
.pc-wait{padding:3px 10px;border-radius:999px;background:rgba(20,16,10,.45);color:rgba(255,255,255,.8);font-size:.78rem;font-weight:800;white-space:nowrap;}

/* table list sheet */
.tlist{display:flex;flex-direction:column;gap:8px;}
.tlist .row{gap:10px;padding:8px 10px;border-radius:14px;background:var(--w05);}
.tlist .row b{display:block;}
.tlist .row small{display:block;color:var(--text-3);font-weight:700;}
.tlist .row .s{font-weight:900;font-variant-numeric:tabular-nums;}

/* ── Phone sideways (Hold'em / Omaha): wide table on the left, your cards at its bottom centre,
      blinds, hand name and the action buttons in a column on the right. One screen, no scrolling. ── */
@media (orientation:landscape) and (max-height:500px){
  .gbar{padding-top:calc(var(--safe-t) + 3px);padding-bottom:3px;}
  .gbar .icon-btn{width:36px;height:36px;}
  .gbar .icon-btn svg{width:20px;height:20px;}
  .gbar .ttl{font-size:1.05rem;}
  .gbar .ttl .gi .gicon{width:28px;height:28px;}
}
.stage.pland{max-width:none;margin:0;height:calc(100dvh - var(--gbh,44px));display:grid;
  grid-template-columns:minmax(0,1fr) clamp(190px,27vw,250px);grid-template-rows:auto auto minmax(0,1fr) auto auto;column-gap:12px;
  padding:2px calc(var(--corner-x) + 2px) calc(var(--safe-b) + 8px) 10px;}
.stage.pland .ptable{grid-column:1;grid-row:1 / -1;height:auto;min-height:0;margin:0;border-radius:30% / 50%;}
.pland .ptable > .felt-in{inset:9px;border-radius:30% / 50%;}
.pland .ptable > .felt-in::after{inset:15% 9%;border-radius:30% / 50%;}
.pland .pinfo{grid-column:2;grid-row:1;flex-direction:column;align-items:stretch;gap:3px;margin:4px 2px 8px;font-size:.78rem;}
.pland .pinfo > span:not(.bank){display:block;white-space:normal;}
.pland .plabel{grid-column:2;grid-row:2;margin:0 2px;min-height:0;font-size:.92rem;line-height:1.25;text-align:left;}
.pland .plabel.res{font-size:.84rem;}
.pland .praise{grid-column:2;grid-row:4;margin:0 0 8px;padding:6px 10px 8px;}
.pland .praise .top b{font-size:1.25rem;}
.pland .praise .muted{font-size:.8rem;}
.pland .praise .btn-sm{min-height:36px;padding:0 12px;font-size:.88rem;}
.pland .praise input[type=range]{height:28px;}
.pland .praise .pre{gap:4px;margin-top:2px;}
.pland .praise .pre .chip{min-height:30px;padding:0 2px;font-size:.76rem;}
.pland .pbar{grid-column:2;grid-row:5;gap:6px;min-height:52px;}
.pland .pbar .btn{min-height:52px;padding:0 4px;font-size:.95rem;}
.pland .pbar .btn .ico{width:18px;height:18px;}
.pland .pbar .hint{font-size:.86rem;line-height:1.3;}
.stage.pland .pboard{--cw:clamp(30px,min(11.5dvh,(100vw - 270px) * .085),48px);gap:4px;}
/* opponents: cards beside the name, so each seat is short */
.pland .pseat.ls{display:grid;grid-template-columns:auto auto;column-gap:5px;row-gap:3px;align-items:center;justify-items:start;min-width:0;}
.pland .pseat.ls > .cards{grid-row:1 / 3;}
.pland .pseat.al{transform:translate(0,-50%);}
.pland .pseat.ar{transform:translate(-100%,-50%);}
.pland .pseat .tag{font-size:.74rem;max-width:104px;padding-right:7px;}
.pland .pseat .tag .avatar{width:20px;height:20px;font-size:.6rem;letter-spacing:-.02em;}
.pland .pseat .stack{font-size:.7rem;}
.pland .pseat .cards{--cw:22px;min-height:31px;}
.pland .pseat .cards .pcard+.pcard{margin-left:-12px;}
.pland .pseat .cards.face{--cw:30px;min-height:42px;}
.pland .pseat .cards.face .pcard+.pcard{margin-left:-8px;}
.pland .pseat .cards.face.om .pcard+.pcard{margin-left:-17px;}
/* top and upper side seats say what they did beside them (below is where their chips go) */
.pland .ls-t .psay,.pland .ls-lt .psay,.pland .ls-ta .psay,.pland .ls-tb .psay{top:50%;left:100%;transform:translate(5px,-50%);}
.pland .ls-rt .psay,.pland .ls-td .psay,.pland .ls-te .psay{top:50%;left:auto;right:100%;transform:translate(-5px,-50%);}
.pland .ls-l .psay,.pland .ls-r .psay{top:auto;bottom:100%;transform:translate(-50%,-3px);}
.pland .pseat .pdealer{position:absolute;top:-9px;right:-9px;width:20px;height:20px;font-size:.62rem;}
.pland .ls-rt .pdealer,.pland .ls-td .pdealer,.pland .ls-te .pdealer,.pland .ls-r .pdealer,.pland .ls-rb .pdealer{right:auto;left:-9px;}
/* home games: the cards you tap to swap lift and dim; Five-Card Draw has no board, just its name */
.phand.picking .pcard{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .18s var(--ease),filter .18s;}
.phand .pcard.pick{transform:translateY(-16px) rotate(-4deg);filter:brightness(.62) saturate(.6);box-shadow:0 0 0 3px #ff6b6b,0 10px 18px rgba(0,0,0,.45);}
.phand.picking .pcard:not(.pick){box-shadow:0 0 0 2px rgba(255,216,77,.55),0 6px 14px rgba(0,0,0,.4);}
.phand.o5{gap:0;}
.phand.o5 .pcard+.pcard{margin-left:-8px;}
.stage.pland .phand.o5{--cw:clamp(38px,12dvh,50px);}
.pseat .cards.o5 .pcard+.pcard{margin-left:-15px;}
.pboard.nob{min-height:0;}
.pvar{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.75);text-shadow:0 2px 6px rgba(0,0,0,.5);}
.pvar b{font-family:var(--display);font-weight:400;font-size:1.7rem;color:#ffd84d;text-align:center;white-space:nowrap;line-height:1.1;}
.pport .pvar b{font-size:clamp(1.15rem,6vw,1.7rem);}
.pvar span{font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;}
.pvar em{font-style:normal;font-size:.72rem;font-weight:800;color:rgba(255,255,255,.62);}
.pvar em.wl{color:#7ef0c8;text-shadow:0 0 10px rgba(80,230,180,.55);}
.pvar .arow{display:flex;gap:8px;align-items:center;margin:6px 0 2px;--cw:clamp(44px,12vw,58px);}
.pvar .arow .pcard:nth-child(2){transform:translateY(-6px);}
.pland .pvar .arow{--cw:clamp(34px,11dvh,52px);}
.pvar.acey b{font-size:1.25rem;}
.pcard.post{box-shadow:0 0 0 3px #ff6b6b,0 0 16px rgba(255,90,90,.75)!important;}
.pcard.miss{filter:brightness(.7) saturate(.7);}
.pcard.wild{box-shadow:0 0 0 2px #5ee8b8,0 0 14px rgba(80,230,180,.7)!important;}
.pcard.wild::after{content:'W';position:absolute;right:3px;bottom:2px;font:900 9px/1 system-ui,sans-serif;color:#0d8a62;}
.phand .pcard.down,.pseat .cards .pcard.down{transform:translateY(5px);}
/* face down to everyone else: a strip of the card's back along the bottom */
.pcard.down::after{content:'';position:absolute;left:0;right:0;bottom:0;height:15%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 2px,transparent 2px 5px),linear-gradient(135deg,var(--back-a,#5b3fd1),var(--back-b,#c0367d));}
.pcard.hid{display:grid;place-items:center;}
.pcard.hid .q{display:block;font:400 calc(var(--cw) * .6)/1 var(--display);color:#ffd84d;text-shadow:0 2px 6px rgba(0,0,0,.6);font-style:normal;z-index:1;}
.pseat .cards.st .pcard+.pcard{margin-left:-19px;}
.pseat .cards.st.s7 .pcard+.pcard{margin-left:-23px;}
.pland .pseat .cards.st .pcard+.pcard{margin-left:-17px;}
.pland .pseat .cards.st.s7 .pcard+.pcard{margin-left:-20px;}
.stage:not(.pland) .pseat.many .cards.st .pcard+.pcard{margin-left:-21px;}
.pland .pseat.many .cards.st .pcard+.pcard{margin-left:-13px;}
.phand.s7{gap:0;--cw:clamp(48px,13vw,64px);}
.phand.s7 .pcard+.pcard{margin-left:-6px;}
.stage.pland .phand.s7{--cw:clamp(36px,11dvh,48px);}
/* the game picker: the picked game on the setup screen, and the sheet of every game */
.ppick{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:0;cursor:pointer;text-align:left;color:#fff;
  background:radial-gradient(120% 140% at 0% 0%,#2a7a52 0%,#155a3a 45%,#0b3322 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 6px 16px rgba(0,0,0,.25);}
.ppick:active{transform:scale(.985);}
.ppick .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.ppick .tx small{font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#ffd84d;opacity:.9;}
.ppick .tx b{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.1;}
.ppick .tx span{font-size:.8rem;font-weight:700;opacity:.75;}
.ppick .chg{opacity:.7;display:grid;place-items:center;}
.ppick .chg svg{width:20px;height:20px;}
.pmini{display:flex;align-items:flex-end;gap:2px;flex:none;}
.pmini i{display:block;width:9px;height:13px;border-radius:2px;background:linear-gradient(135deg,var(--back-a,#5b3fd1),var(--back-b,#c0367d));box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);}
.pmini i.u,.pmini i.b{background:#fbf7ee;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
.pmini i.b{box-shadow:inset 0 0 0 1px #c9a227;transform:translateY(-3px);}
.pmini i.w{background:#fbf7ee;box-shadow:0 0 0 1.5px #5ee8b8,0 0 6px rgba(80,230,180,.8);}
.pmini i.x{opacity:.35;transform:rotate(18deg) translateY(-4px);}
.pmini i.q{background:#1d1b2e;box-shadow:inset 0 0 0 1px #ffd84d;}
.pmini i.g{width:4px;background:none;box-shadow:none;}
.ppicks h3{margin:14px 2px 8px;font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.ppicks h3:first-child{margin-top:2px;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.pgt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 11px 9px;border-radius:14px;border:0;cursor:pointer;text-align:left;color:#fff;
  background:radial-gradient(130% 150% at 0% 0%,#22694a 0%,#124a31 55%,#0a2c1d 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.pgt .pmini{margin-bottom:4px;}
.pgt b{font-size:.92rem;font-weight:900;line-height:1.15;}
.pgt small{font-size:.72rem;font-weight:700;opacity:.72;line-height:1.2;}
.pgt{position:relative;}
.pgt .pq,.cz-q,.czbig-e .pq{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.86rem;color:#fff;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);cursor:pointer;}
.pgt .pq:active,.cz-q:active,.czbig-e .pq:active{transform:scale(.9);background:rgba(0,0,0,.45);}
.cz-q{top:7px;right:7px;width:24px;height:24px;z-index:2;font-size:.8rem;}
.czbig-e{position:relative;}
.czi-pic{aspect-ratio:16 / 9;border-radius:14px;margin:0 0 12px;background:#14101c center / cover no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.28);animation:czpic .6s ease both;}
.czi-pic.wait{background-image:linear-gradient(100deg,#17131f 30%,#2a2438 50%,#17131f 70%);background-size:220% 100%;animation:czshim 1.3s linear infinite;}
@keyframes czshim{from{background-position:120% 0;}to{background-position:-120% 0;}}
@keyframes czpic{from{opacity:.4;filter:blur(6px);}to{opacity:1;filter:none;}}
.czi-city{margin:0 0 4px;font-size:.84rem;font-weight:800;color:var(--text-2);}
.czi-city .sty{margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--w07);font-size:.72rem;}
.czi > p{margin:0 0 10px;line-height:1.4;}
.czi-row{padding:9px 0;border-top:1px solid var(--line);}
.czi-row small{display:block;font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.czi-row p{margin:3px 0 0;line-height:1.4;}
.czi-learn{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.czi-lock{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-weight:800;color:var(--yellow);}
.czi-lock .ico{width:16px;height:16px;}
/* the room behind the table at a circuit stop: out of focus, washed toward the theme's background so the text on it reads */
.pk-vbgs{position:fixed;inset:0;z-index:0;pointer-events:none;}
.pk-vbg{position:fixed;inset:-30px;z-index:0;pointer-events:none;background:#0b0910 center / cover no-repeat;filter:blur(5px) saturate(1.1);opacity:0;transition:opacity .9s ease;}
.pk-vbg.on{opacity:1;}
.pk-vbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 50%,color-mix(in srgb,var(--bg) 15%,transparent),color-mix(in srgb,var(--bg) 48%,transparent));}
.stage.pcirc{position:relative;z-index:1;}
.pgt.on{box-shadow:inset 0 0 0 2px #ffd84d,0 0 14px rgba(255,216,77,.35);}
.pgt:active{transform:scale(.97);}
/* the first-time explainer: the game dealt out on a strip of felt */
.plearnw{display:flex;flex-direction:column;gap:12px;}
.plearn{position:relative;border-radius:16px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;
  background:radial-gradient(120% 130% at 50% 0%,#2f8a5c 0%,#1a6440 50%,#0e3d27 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),inset 0 0 30px rgba(0,0,0,.35);}
.plearn .lrow{display:flex;flex-direction:column;gap:5px;}
.plearn .llab{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75);opacity:0;animation:lfade .35s ease forwards;}
.plearn .lcards{display:flex;align-items:center;gap:5px;--cw:clamp(34px,10vw,46px);min-height:calc(var(--cw) * 1.45);flex-wrap:wrap;}
.plearn .lgap{width:6px;}
.plearn .pcard.ldeal{opacity:0;animation:ldeal .42s cubic-bezier(.2,.8,.3,1.2) forwards;}
/* each card on its own layer: Safari otherwise leaves thin traces of a glowing card's shadow where it flew in */
.plearn .pcard,.plearn .lchip{will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.plearn{transform:translateZ(0);}
.plearn .pcard.toss{animation:ldeal .42s cubic-bezier(.2,.8,.3,1.2) forwards,ltoss .5s ease var(--tt,1.2s) forwards;}
.plearn .pcard.fresh{box-shadow:0 0 0 2px #ffd84d,0 0 12px rgba(255,216,77,.6);}
.plearn .pcard.down{margin-top:6px;}
.plearn .lchip{opacity:0;animation:ldeal .42s ease forwards;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:.78rem;font-weight:900;color:#fff;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.4);}
.plearn .lchip.in{background:#1f9d5c;}
.plearn .lchip.out{background:#b8323f;}
.lsteps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-weight:700;line-height:1.35;}
.lsteps li{opacity:0;animation:lfade .4s ease forwards;}
@media (orientation:landscape) and (max-height:560px){.plearnw{flex-direction:row;align-items:flex-start;}.plearn{flex:1.5;}.lsteps{flex:1;font-size:.88rem;}.plearn .lcards{--cw:clamp(30px,6.4vh,40px);}}
@keyframes ldeal{0%{opacity:0;transform:translate(-26px,-18px) rotate(-14deg) scale(.85);}100%{opacity:1;transform:none;}}
@keyframes ltoss{to{opacity:.12;transform:translateY(-14px) rotate(16deg) scale(.9);}}
@keyframes lfade{to{opacity:1;}}
@media (prefers-reduced-motion:reduce){.plearn .pcard.ldeal,.plearn .llab,.lsteps li,.plearn .lchip{animation:none;opacity:1;}.plearn .pcard.toss{animation:none;opacity:.25;}}
.pswap{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:.92rem;color:var(--text-2);text-align:center;padding:2px 2px 4px;}
.pswap b{color:var(--yellow);}
.pswap .dr{display:flex;align-items:center;gap:8px;font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);}
.pswap .dots{display:flex;gap:4px;}
.pswap .dots i{width:7px;height:7px;border-radius:50%;background:var(--w14);}
.pswap .dots i.done{background:var(--text-3);} .pswap .dots i.now{background:var(--yellow-fill);box-shadow:0 0 0 3px rgba(242,182,42,.25);}
.pswap .t{font-size:.98rem;font-weight:900;color:var(--text);line-height:1.25;}
.pswap .lim{font-size:.76rem;font-weight:800;color:var(--text-3);}
.pswap .lim b{color:var(--text-2);}
/* 7 to 10 seats (online): smaller seats; along the top, name above and cards beside the chips, what they did below */
.pseat.many .tag{max-width:96px;font-size:.74rem;padding:2px 7px 2px 2px;}
.pseat.many .tag .avatar{width:20px;height:20px;font-size:.62rem;}
.pseat.many .stack{font-size:.68rem;padding:0 6px;}
.stage:not(.pland) .pseat.many{display:grid;grid-template-columns:auto auto;column-gap:5px;row-gap:3px;justify-items:center;align-items:center;}
.stage:not(.pland) .pseat.many > .tag{grid-column:1 / 3;grid-row:1;}
.stage:not(.pland) .pseat.many > .cards{grid-row:2;grid-column:1;--cw:24px;min-height:34px;}
.stage:not(.pland) .pseat.many > .cards.face{--cw:32px;min-height:45px;}
.stage:not(.pland) .pseat.many > .stack{grid-row:2;grid-column:2;}
.stage:not(.pland) .pseat.many .cards .pcard+.pcard{margin-left:-12px;}
.stage:not(.pland) .pseat.many .cards.om .pcard+.pcard{margin-left:-17px;}
.pland .pseat.many.ls{grid-template-columns:auto auto;column-gap:4px;row-gap:2px;justify-items:center;}
.pland .pseat.many.ls > .tag{grid-column:1 / 3;grid-row:1;}
.pland .pseat.many.ls > .cards{grid-row:2;grid-column:1;--cw:16px;min-height:22px;}
.pland .pseat.many.ls > .cards.face{--cw:22px;min-height:31px;}
.pland .pseat.many.ls > .stack{grid-row:2;grid-column:2;}
.pland .pseat.many .cards .pcard+.pcard{margin-left:-9px;}
.pland .pseat.many .cards.om .pcard+.pcard{margin-left:-12px;}
.pland .pseat.many.ls-t .psay,.pland .pseat.many.ls-ta .psay,.pland .pseat.many.ls-tb .psay,.pland .pseat.many.ls-td .psay,.pland .pseat.many.ls-te .psay,.pland .pseat.many.ls-lt .psay,.pland .pseat.many.ls-rt .psay{top:100%;bottom:auto;left:50%;right:auto;transform:translate(-50%,3px);}
.pseat.many .psay{font-size:.66rem;padding:1px 7px;}
/* your seat: cards, then your name and chips */
.pme{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;}
.pme .pdealer{position:absolute;left:-30px;top:12px;}

.czlk{display:inline-grid;place-items:center;width:1.3em;height:1.3em;margin-right:4px;border-radius:50%;background:#5b8cff;color:#fff;vertical-align:-.3em;}
.czlk.pl{background:#8b6cf0;}
.czlk .ico{width:.85em!important;height:.85em!important;color:#fff!important;stroke-width:3;}
.vp-leds small{text-transform:uppercase;white-space:nowrap;}

/* ══ The rail: everything beside (sideways) or under (upright) the table ══════════════════════════════════════
   What you look at sits on the left (the table); the rail is where you act: the event, your hand and how it
   stands, what just happened, and the controls at the bottom where your thumb is. */
.prail{display:flex;flex-direction:column;gap:7px;min-height:0;}
.pev{padding:8px 12px 9px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));box-shadow:inset 0 0 0 1px var(--w07);}
.pev .t{font-family:var(--display);font-size:1.12rem;line-height:1.1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcirc .pev .t{color:var(--yellow);}
/* a room picture behind the table: the side panels get a frosted, nearly solid surface so they read on any room in
   any theme, and the soft buttons (Check) are solid buttons, not a tint that vanishes into the picture */
.pcirc .prail :is(.pev,.ptile,.pyou,.plog,.pstand){background:linear-gradient(var(--glass),var(--glass)),var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:inset 0 0 0 1px var(--line-2),0 4px 14px rgba(0,0,0,.22);}
.pcirc .prail .plog{border-radius:12px;padding:5px 8px;}
.pcirc .pwait{align-self:center;width:fit-content;max-width:100%;min-height:0;margin:0 auto;padding:4px 12px;border-radius:999px;font-size:.8rem;color:var(--text-2);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.pcirc .cch-chip{background:rgba(20,16,10,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,216,74,.6),0 4px 12px rgba(0,0,0,.2);}
.pcirc .pctl .btn-soft{--b:var(--surface);--b-lip:rgba(0,0,0,.24);box-shadow:0 5px 0 var(--b-lip),inset 0 0 0 1px var(--line-2);}
.pev .hl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;}
.pev .hl .t{flex:0 1 auto;min-width:0;}
.pev .meta{flex:1 0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px 5px;}
.pev .tg{padding:2px 8px;border-radius:999px;background:var(--w07);font-size:.68rem;font-weight:800;color:var(--text-2);white-space:nowrap;line-height:1.35;}
.pev .pgm{display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 4px;margin-top:3px;font-size:.76rem;font-weight:800;color:var(--text-3);}   /* a mixed event: the game now and next */
.pev .pgm b{font-weight:900;font-size:.86rem;color:var(--text);white-space:nowrap;}
.pev .pgm .nx{margin-left:auto;padding-left:8px;white-space:nowrap;}
.pev .tg.hot{background:rgba(255,77,94,.16);color:var(--red);} .pev .tg.ok{background:rgba(61,220,132,.16);color:var(--green);} .pev .tg.gold{background:var(--yellow-fill);color:#2b1a00;}
.pev .bl{margin-left:auto;display:flex;align-items:baseline;gap:4px;font-weight:900;font-size:.82rem;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;}
.pev .bl small{font-size:.6rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
.pev .lvrow{display:flex;align-items:center;gap:10px;margin-top:6px;}
.pev .lvrow .bl{margin-left:auto;}
.pev .lv{flex:1;display:flex;gap:3px;align-items:center;}
.pev .lv i{flex:1;height:4px;border-radius:2px;background:var(--w12);}
.pev .lv i.on{background:var(--yellow);box-shadow:0 0 6px rgba(255,200,61,.5);}
.pev .lv i.last{animation:lvpulse 1.2s ease-in-out infinite;}
@keyframes lvpulse{50%{background:#ff8a3d;}}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.ptiles .pcash{grid-column:1 / -1;min-height:34px;margin:2px 0;}
.ptiles .pcash.on{box-shadow:inset 0 0 0 1.5px var(--yellow);color:var(--yellow);}
.pside .ptiles .pcash{margin:4px 10px 6px;}
.ptile{padding:4px 9px 5px;border-radius:11px;background:var(--w05);min-width:0;}
.ptile{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:5px;}
.ptile small{display:flex;flex-wrap:wrap;column-gap:.9em;max-width:100%;font-size:.58rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.ptile small span{white-space:nowrap;} .ptile small span + span{opacity:.75;}
.ptile b{display:block;max-width:100%;font-size:1.05rem;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ptile b em{font-style:normal;color:var(--text-3);margin-right:1px;}
.ptile b span{margin-left:4px;font-size:.72rem;font-weight:800;color:var(--text-3);}
.ptile.up b{color:var(--green);} .ptile.down b{color:var(--red);} .ptile.gold b{color:var(--yellow);}
.ptile.flash{animation:tflash 1s var(--ease);}
@keyframes tflash{0%{background:rgba(255,200,61,.35);}}
.pyou{padding:8px 12px 8px;border-radius:14px;background:var(--w05);}
.pyou.wbm{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:stretch;}
.pyou.wbm .yl{min-width:0;align-self:center;}
.pyou.wbm .cap{gap:4px;} .pyou.wbm .cap .pct{font-size:1.05rem;margin-right:0;}
.pyou.wbm .cap span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;} .pyou.wbm .cap span + span{flex:none;}
.pbm{display:flex;}
/* a note beside your hand, not a button to act with: no box, just the bulb and the move, set off by a hairline */
.pbm-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;margin:0;padding:0 2px 0 11px;border:0;border-left:1px solid var(--line);border-radius:0;background:none;color:var(--yellow);font:inherit;cursor:pointer;transition:opacity .15s;}
.pbm-b .ic{display:flex;} .pbm-b .ic .ico{width:18px;height:18px;}
.pbm-b b{font-size:.98rem;font-weight:900;line-height:1;white-space:nowrap;}
.pbm-b.wait{color:var(--text-3);}
.pbm-b:active{opacity:.55;}
.pyou .yh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.pyou .n{font-weight:900;color:var(--text);font-size:.95rem;line-height:1.2;min-width:0;}
.pyou .pct{flex:none;font-size:1.2rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.pyou .pct.w{color:var(--red);} .pyou .pct.b{color:var(--orange,#ff8a3d);} .pyou .pct.f{color:var(--yellow);} .pyou .pct.s{color:var(--green);}
.pyou .n.dim{color:var(--text-2);}
.pyou .n.cs2{font-size:1.05rem;letter-spacing:.01em;} .pyou .n.cs2 .su.r{color:var(--red);} .pyou .n.cs2 .dash{margin:0 1px;color:var(--text-3);}
.pyou.res{display:flex;flex-direction:column;gap:7px;font-weight:800;font-size:.86rem;line-height:1.35;color:var(--text);animation:rise .4s var(--ease) both;}
.pyou.res > b,.pyou.res > span b{color:var(--yellow);}
.pyou .yd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.pyou.done .yd .n{white-space:normal;overflow:visible;}   /* (sideways the hand's name wraps rather than cut off) */
.pyou .yd .net{flex:none;font-weight:900;font-size:1.05rem;color:var(--text-2);font-variant-numeric:tabular-nums;}
.pyou .yd .net.up{color:var(--green);} .pyou .yd .net.down{color:var(--red);}
.pyou.done{display:flex;flex-direction:column;gap:6px;animation:rise .35s var(--ease) both;}
/* the hand as it went: your chance at each street, like the TV graphic */
.podds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.podds .st{display:flex;flex-direction:column;gap:2px;min-width:0;}
.podds small{font-size:.58rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.podds b{font-size:.92rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;}
.podds .bar{height:4px;border-radius:2px;background:var(--w12);overflow:hidden;}
.podds .bar i{display:block;height:100%;border-radius:2px;}
.precap .say{margin-top:5px;font-size:.74rem;font-weight:800;color:var(--text-2);}
/* your stack over the session */
.ptrend.none{display:none;}
.ptrend .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.ptrend .hd small{min-width:0;font-size:.58rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.ptrend .hd b{font-size:.8rem;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;}
.ptrend .sp{position:relative;height:26px;margin-top:3px;}
.ptrend svg{display:block;width:100%;height:100%;overflow:visible;}
.ptrend polyline{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;}
.ptrend .a{opacity:.14;}
.ptrend .z{stroke:var(--text-3);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;}
.ptrend .end{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;box-shadow:0 0 0 2px var(--bg-2);}
.pmeter{position:relative;height:8px;border-radius:4px;background:var(--w12);margin:7px 0 4px;}
.pmeter > i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .5s var(--ease),background .5s;}
.pmeter > b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5);}
.pyou .cap{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-size:.7rem;font-weight:800;color:var(--text-2);white-space:nowrap;}
.pyou .cap .pct{margin-right:2px;} .pyou .cap .tight .sw{display:none;}
.pyou .cap i{font-style:normal;} .pyou.wbm .cap i{display:none;}   /* beside the best move, the count of players gives way */
.pyou .cap .ok{color:var(--green);} .pyou .cap .no{color:var(--red);}
.plog{flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:0 4px;font-size:.76rem;font-weight:700;color:var(--text-2);}
.plog{position:relative;}
/* "see the whole log": a small round chip, centred on the last line */
.plog .more{position:absolute;right:10px;bottom:calc(var(--lpb,14px) + var(--lh,17px) / 2 - 11px);width:22px;height:22px;display:grid;place-items:center;border-radius:50%;
  background:var(--w12);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);}
.plog .more .ico,.plog .more svg{width:14px;height:14px;}
.plog.tap:active .more{background:var(--yellow-fill);color:#2b1a00;}
.plog-in{padding-right:26px;}

.plog.tk{flex:none;display:block;}
.plog.tk .more{top:50%;bottom:auto;margin-top:-11px;}
.plog.tk .plog-in{display:grid;grid-template-columns:minmax(0,1fr);justify-content:stretch;overflow:hidden;min-height:17px;-webkit-mask-image:none;mask-image:none;}
.plog.tk .plog-in > div{grid-area:1 / 1;align-self:center;margin:0;}
.plog.tk .in{animation:tkin .45s var(--ease) both;}
.plog.tk .out{animation:tkout .45s var(--ease) both;color:var(--text-2);}
@keyframes tkin{from{transform:translateY(115%);opacity:0;}}
@keyframes tkout{to{transform:translateY(-115%);opacity:0;}}
.plog-in{flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 20px);mask-image:linear-gradient(180deg,transparent 0,#000 20px);}   /* older lines slide up under the section above */
.plog-in > div{display:flex;align-items:center;gap:6px;min-height:17px;flex:none;}   /* a long line wraps; nothing in the log is cut off */
.plog-in > div > span{min-width:0;}
.plog-in > div:not(.win) > .dot,.pfull-l > div:not(.win) > .dot{align-self:flex-start;margin-top:.3em;}
.plog-in > div:last-child{color:var(--text);}
.plog-in > div.win{display:grid;grid-template-columns:8px minmax(0,1fr);column-gap:6px;row-gap:3px;color:var(--text);font-weight:900;margin-top:3px;}
.plog .win .cs{grid-column:2;}
.plog .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;}
.plog .st{color:var(--text);margin-top:2px;}
.plog .st b{font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);}
.plog .hd b{color:var(--text-3);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;}
.mc{display:inline-block;padding:0 3px;border-radius:4px;background:#fbf8f0;color:#1d1b2e;font-weight:900;font-size:.72rem;line-height:1.35;}
.mc.r{color:#d0263b;}
.mc.up{position:relative;top:-3px;box-shadow:0 0 0 1.5px var(--yellow),0 3px 6px rgba(0,0,0,.25);}   /* the cards that make the hand, raised above the kickers */
.mc.up + .mc:not(.up){margin-left:5px;}
/* controls */
.pctl{display:flex;flex-direction:column;gap:6px;margin-top:auto;}
.prail .pcoach{margin:0;min-height:0;justify-content:flex-start;}
.psz{padding:6px 7px 7px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);animation:rise .3s var(--ease) both;}
.psz .pre{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.psz .pre button{min-height:40px;padding:0 2px;border:0;border-radius:11px;background:var(--w07);color:var(--text);font-weight:900;font-size:.84rem;white-space:nowrap;transition:background .15s,transform .1s;}
.psz .pre button.on{background:var(--yellow-fill);color:#2b1a00;box-shadow:0 2px 0 #9a6b00;}
.psz .pre button:active{transform:translateY(1px);}
.psz .pre button:disabled{opacity:.35;}
.psz .row{display:flex;align-items:center;gap:6px;margin-top:5px;}
.psz .row button{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--w07);color:var(--text);font-weight:900;font-size:1.1rem;line-height:1;}
.psz .trk{flex:1;min-width:0;display:flex;flex-direction:column;}
.psz input[type=range]{width:100%;min-width:0;height:26px;margin:0;accent-color:var(--yellow);}
.psz .ends{display:flex;justify-content:space-between;gap:6px;margin-top:-1px;padding:0 2px;font-size:.66rem;font-weight:900;line-height:1.1;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.psz .ends small{font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.psz .ends .on,.psz .ends .on small{color:var(--yellow);}
.pctl .pbar{display:flex;gap:6px;min-height:0;}
.pctl .pbar .btn{flex:1 1 0;min-height:52px;padding:0 6px;font-size:.98rem;}
.pctl .pbar .btn .two{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.1;white-space:nowrap;max-width:100%;}
.pctl .pbar .btn{min-width:0;white-space:nowrap;}
.pctl .pbar .btn.pleave{flex:0 0 auto;padding:0 16px;}
.pctl .pbar .btn small{display:block;font-size:.72rem;opacity:.85;font-variant-numeric:tabular-nums;}
.pctl .pbar .btn-yellow{flex-grow:1.25;}
/* a betting button on one line: the move, then its amount in a tag tinted from the button's own ink (reads on every theme) */
.pctl .pbar .btn:has(.one){padding:0 12px;}
.pctl .pbar .btn .one{display:inline-flex;align-items:center;justify-content:center;gap:.38em;white-space:nowrap;} .pctl .pbar .btn .one > *{flex:none;} .pctl .pbar .btn .one i{font-style:normal;}
.pctl .pbar .btn .one b{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.6em;padding:0 .48em;border-radius:.5em;

<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var HKEY = 'poker', LAST = 'poker_last';
  // One saved game per mode (the old page used these as sessionStorage keys)
  var KEYS = { vp: 'poker_vp', he_cash: 'poker_he_cash', he_tourn: 'poker_he_tourn', om_cash: 'poker_om_cash', om_tourn: 'poker_om_tourn', circ_he: 'poker_circ', circ_om: 'poker_circ_om', circ_mx: 'poker_circ_mx' };

  var RULES =
    '<p class="goal">Make the best five-card poker hand. Play <b>Video Poker</b> against the machine, or sit at a <b>poker table</b> against computer players: Hold\'em, Omaha, Stud, Draw and the home games. Tap <b>Game</b> on the setup screen to pick one.</p>' +
    '<h3>Hands, best first</h3><ol>' +
    '<li><b>Royal flush</b>: A K Q J 10, all one suit</li><li><b>Straight flush</b>: five in a row, all one suit</li>' +
    '<li><b>Four of a kind</b>: four cards of one rank</li><li><b>Full house</b>: three of a kind plus a pair</li>' +
    '<li><b>Flush</b>: any five of one suit</li><li><b>Straight</b>: five in a row (the Ace can be high, 10-J-Q-K-A, or low, A-2-3-4-5)</li>' +
    '<li><b>Three of a kind</b></li><li><b>Two pair</b></li><li><b>Pair</b></li><li><b>High card</b>: nothing else, so your highest card counts</li></ol>' +
    '<h3>Video Poker: Jacks or Better</h3><ul>' +
    '<li>Bet 1 to 5 coins and press <b>Deal</b> for five cards.</li>' +
    '<li>Tap the cards you want to keep (they say HELD), then press <b>Draw</b> to replace the others. One draw only.</li>' +
    '<li>You get paid for a pair of Jacks or better, up to a Royal Flush. This is the full-pay "9/6" machine: a full house pays 9 to 1 and a flush 6 to 1.</li>' +
    '<li>Bet all 5 coins: a Royal Flush pays 4,000 coins instead of 1,250.</li></ul>' +
    '<h3>Texas Hold\'em</h3><ul>' +
    '<li>Everyone gets 2 secret cards. Then five shared cards are dealt face up in the middle: 3 at once (the <b>flop</b>), then 1 (the <b>turn</b>), then 1 more (the <b>river</b>).</li>' +
    '<li>Your hand is the best 5 cards you can make from your 2 and the 5 shared ones.</li></ul>' +
    '<h3>Omaha (pot-limit)</h3><ul>' +
    '<li>Same as Hold\'em, but you get <b>4</b> secret cards and must use <b>exactly 2</b> of them with <b>exactly 3</b> shared cards. Four hearts in your hand and one on the board is not a flush!</li>' +
    '<li>The biggest bet or raise allowed is the size of the pot.</li></ul>' +
    '<h3>Betting</h3><ul>' +
    '<li>The white <b>D</b> button moves one seat left each hand. The next two players put in the <b>small blind</b> and <b>big blind</b> so there is something to win.</li>' +
    '<li>There is a round of betting before the flop, after the flop, after the turn and after the river. On your turn you can <b>fold</b> (give up the hand), <b>check</b> (pass, if nobody has bet), <b>call</b> (match the bet) or <b>bet / raise</b>.</li>' +
    '<li><b>No-limit</b>: bet anything up to all your chips. A raise must be at least as big as the last bet or raise. <b>Fixed limit</b>: bets are one size ($2 before the turn, $4 after), with at most 4 bets a round.</li>' +
    '<li>If someone is <b>all in</b> and others keep betting, the extra chips go into a <b>side pot</b> that the all-in player can\'t win.</li>' +
    '<li>If everyone else folds, you win the pot without showing your cards. Otherwise the best hand at the <b>showdown</b> wins, and a tie splits the pot.</li></ul>' +
    '<h3>Cash game or tournament</h3><ul>' +
    '<li><b>Cash game</b>: buy in with chips from your casino bank (shared with the other casino games) and leave whenever you like. Whatever you have goes back to the bank.</li>' +
    '<li><b>Tournament</b>: everyone starts with 1,500 chips. The blinds go up every few hands, and when you lose all your chips you\'re out. Last player standing wins.</li>' +
    '<li><b>Tournament rebuys</b> (a setting): run out of chips in the first 4 levels and you can rebuy for 1,500 new chips, or call it a day. On the circuit you can re-enter in the first 3 levels for the buy-in.</li></ul>' +
    '<h3>Tournament Circuit</h3><ul>' +
    '<li>Fifteen stops. Each road starts with 5 to 7 local games, picked at random for that road: a home game, a bar\'s poker night, a club or lodge tourney, a restaurant back room, the local card rooms. Then the casinos and big names everyone knows, all the way to the World Championship. Win a road\'s championship and you get a <b>gold bracelet</b>. Pick a road at the top: <b>Hold\'em</b>, <b>Omaha</b> or <b>Mixed</b> (Hold\'em and pot-limit Omaha by turns: the game changes each time the blinds go up). Each road keeps its own progress.</li>' +
    '<li>No place is on two roads: each road has its own home game, bars, clubs and card rooms, and its own casinos and cities. Tap the <b>?</b> on any stop, open or not, to see the place, the game and how it\'s played, and who turns up. The number of players is a range: about 15% more or fewer turn up on the day.</li>' +
    '<li>Right after the local stops comes the road\'s festival (the <b>Summer Series</b> in Las Vegas, the <b>Spring Series</b> in Los Angeles, the <b>Fall Series</b> in Philadelphia): four cheap events with thousands of players, where the amateurs take their shot. Win one and you get its silver champion\'s ring. Pick one (<b>Gladiators of Poker</b> $300, <b>Mystery Millions</b> $1,000 with mystery bounties, <b>Millionaire Maker</b> or <b>Monster Stack</b> $1,500) and cash in it to go on. On the Mixed road, two of the big stops play <b>H.O.R.S.E.</b> and the championship is <b>8-Game</b>.</li>' +
    '<li>Pay the buy-in from your bank, or use a seat you won. You play one table; the rest of the field plays at others, and an empty seat at yours is filled from them.</li>' +
    '<li>Roughly the top 15% are paid. Everyone in the money gets at least 1.5 times the buy-in, and first place gets the most. Finish in the money to open the next stop and win a seat there.</li>' +
    '<li><b>Bounty</b> events pay you on the spot for every player you knock out.</li>' +
    '<li>The local stops of the Mixed road also deal <b>home games</b> (below). The Mixed road\'s first stop keeps its game a surprise until you sit down: Hold\'em, Omaha, <b>dealer\'s choice</b> (whoever deals calls the game), or Hold\'em and Omaha with home games dealt in. Each stop after deals home games less often; the commoner games come up more. Acey-Deucey, Guts and Indian Poker only turn up at the first stop.</li>' +
    '<li>The players get better at every stop, and better still as each event goes on (the weaker ones go out first). The regulars in the back room are sharper than you\'d think. Pros read how you bet, play their position and tighten up near the money.</li>' +
    '<li>The computer players never see your cards. They only know their own cards, the board and how everyone has bet, and the good ones remember how you play from one stop to the next.</li>' +
    '<li>One event at a time on each road. No take-backs on the circuit.</li></ul>' +
    '<h3>Home games</h3><ul>' +
    '<li>The first time you play one, it\'s dealt out for you before your first hand. The menu has it again any time (How it works).</li>' +
    '<li><b>Limit Hold\'em</b>: Hold\'em where every bet and raise is one set size. <b>Omaha Hi-Lo</b>: Omaha where half the pot goes to the best low hand of five different cards 8 or under (if anyone has one). <b>Big O</b>: five-card Omaha.</li>' +
    '<li><b>Pineapple</b>: three cards, throw one away before the flop. <b>Crazy Pineapple</b>: throw it away after the flop betting. <b>Irish</b>: four cards, throw two away after the flop betting. <b>Deuces Wild Hold\'em</b>: every 2 is wild; five of a kind beats everything.</li>' +
    '<li><b>Five-Card Draw</b>: no board; swap up to three (four if you keep an Ace). <b>Deuces Wild Draw</b>: every 2 is wild. <b>2-7 Triple Draw</b>: the worst hand wins (7-5-4-3-2 is best; aces are high and straights and flushes count against you), three draws. <b>Badugi</b>: four cards, three draws; the best hand is four low cards of four different suits and ranks.</li>' +
    '<li><b>Seven-Card Stud</b>: no shared cards; two down and one up, then a card a round (four up, the last one down). An ante from everyone; the lowest card showing brings it in, then the best hand showing acts first. <b>Razz</b>: stud where the lowest hand wins (aces low, straights and flushes don\'t count). <b>Follow the Queen</b>: Queens are wild, and so is whatever is dealt face up right after a Queen. <b>Baseball</b>: 3s and 9s are wild; a 4 face up earns an extra card. <b>Chicago</b>: half the pot to the highest spade face down.</li>' +
    '<li><b>Guts</b>: two cards; everyone says In or Out at once. The best hand that\'s in takes the pot; the others who were in pay the pot again for the next hand. <b>Indian Poker</b>: one card each, held up so everyone sees it but you; one round of betting, highest card wins. <b>Acey-Deucey</b>: two cards turned up for you; bet up to the pot that the next lands between them. Miss and you pay your bet; hit either end and you pay double.</li>' +

  // whether hand values are ordinary poker hands (lowball, Badugi and Indian Poker aren't)

    var mine = H.scores && H.scores[0] != null ? hName(H, 0) : '', vs = '';

  function histDetail(st, d) {

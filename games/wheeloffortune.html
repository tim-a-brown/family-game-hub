<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
<title>Wheel of Fortune</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
body{background:radial-gradient(800px 500px at 50% -10%,rgba(124,58,237,.2),transparent 70%),var(--bg);}
.page{padding-top:10px;}
.wof-wrap{max-width:560px;margin:0 auto;}
canvas#wof-wheel{display:block;margin:0 auto;cursor:pointer;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));touch-action:manipulation;}
/* Puzzle board — classic panel; tiles sized so a 13-letter row always fits */
.puzzle-board{
  background:linear-gradient(180deg,#22197a 0%,#170f55 100%);
  border:2px solid rgba(167,139,250,.5);
  border-radius:18px;padding:10px 8px 12px;margin-bottom:10px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 8px 24px rgba(30,21,112,.45);
  container-type:inline-size;
}
.puzzle-category{text-align:center;font-size:.74rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#c4b5fd;margin-bottom:8px;}
.puzzle-rows{display:flex;flex-direction:column;gap:4px;align-items:center;--tw:min(34px,calc((100cqw - 40px) / 13));}
.puzzle-row{display:flex;gap:3px;flex-wrap:nowrap;justify-content:center;}
.puzzle-tile{
  width:var(--tw);height:calc(var(--tw) * 1.32);border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:calc(var(--tw) * .7);font-weight:800;
  background:#fff;color:#0f172a;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.25);
}
.puzzle-tile.space{background:transparent;box-shadow:none;width:calc(var(--tw) * .45);}
.puzzle-tile.blank{background:#fff;color:transparent;}
.puzzle-tile.solved{background:#fde68a;color:#1f2937;animation:tile-pop .25s ease both;}
.puzzle-tile.flip{animation:tile-flip .45s var(--ease) both;}
@keyframes tile-pop{0%{transform:scale(.8)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes tile-flip{0%{transform:rotateY(90deg);background:#60a5fa;}100%{transform:none;}}
/* Status + wedge */
.wof-status{text-align:center;font-family:var(--display);font-size:1.08rem;font-weight:700;min-height:26px;color:var(--text);padding:0 8px;line-height:1.25;}
.wedge-display{text-align:center;margin:2px 0 8px;font-size:.88rem;font-weight:700;min-height:20px;line-height:1.3;}
.wedge-bankrupt{color:var(--red);}
.wedge-lose{color:#fbbf24;}
.wedge-money{color:var(--green);}
/* Wheel + scores */
.wof-mid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin-bottom:10px;}
.score-board{display:flex;flex-direction:column;gap:6px;}
.player-card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;transition:border-color .2s,background .2s;
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px;}
.player-card.active{border-color:var(--gold);background:var(--surface-2);box-shadow:0 0 0 3px rgba(245,200,66,.12);}
.player-name{font-size:.8rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:1;grid-row:1;}
.player-total{font-size:.7rem;color:var(--text-3);grid-column:1;grid-row:2;}
.player-round{font-family:var(--display);font-size:1.25rem;font-weight:800;color:var(--gold);line-height:1;grid-column:2;grid-row:1 / span 2;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
/* Actions */
.spin-area{display:flex;gap:8px;margin-bottom:10px;}
.spin-area:empty{display:none;}
.spin-area .btn{flex:1;padding:0 10px;}
.spin-area .btn-gold{flex:1.4;}
/* Keyboard */
.letter-keyboard{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:0 auto 10px;}
.letter-keyboard:empty{display:none;}
.letter-key{
  min-height:44px;border-radius:10px;font-size:1.05rem;font-weight:700;padding:0;
  background:var(--surface-3);border:1px solid var(--line-2);color:var(--text);
  cursor:pointer;transition:transform .1s,background .15s,opacity .15s;font-family:var(--font);touch-action:manipulation;
}
.letter-key:active:not(:disabled){transform:scale(.9);background:#3a4258;}
@media (hover:hover){.letter-key:hover:not(:disabled){background:#3a4258;}}
.letter-key:disabled{background:var(--surface);color:var(--text-3);opacity:.45;cursor:default;border-color:transparent;}
.letter-key.vowel{border-color:rgba(245,200,66,.45);color:var(--gold);}
.letter-key.vowel:disabled{color:var(--text-3);border-color:transparent;}
/* Solve input */
.solve-row{display:flex;gap:8px;margin-bottom:10px;}
.solve-row .input{flex:1;text-transform:uppercase;}
/* Setup */
#wof-setup .modal{text-align:center;}
#wof-setup .tabs{margin:0 0 14px;}
#wof-setup .tabs .tab{flex:1 1 0;font-size:1.05rem;min-height:44px;}
.wof-pname-input{margin-bottom:8px;}
@media (min-width:600px){.wof-mid{grid-template-columns:auto 220px;justify-content:center;}}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a>
  <span class="nav-title">Wheel of Fortune</span>
</nav>
<div class="page">
<div class="wof-wrap">
  <div class="puzzle-board">
    <div class="puzzle-category" id="puzzle-cat"></div>
    <div class="puzzle-rows" id="puzzle-board"></div>
  </div>
  <div class="wof-status" id="wof-status"></div>
  <div class="wedge-display" id="wedge-display"></div>
  <div class="wof-mid">
    <canvas id="wof-wheel" width="220" height="220"></canvas>
    <div class="score-board" id="score-board"></div>
  </div>
  <div class="spin-area" id="spin-area"></div>
  <div class="solve-row" id="solve-row" style="display:none;">
    <input class="input solve-input" id="solve-input" placeholder="Type the full answer…" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="60">
    <button class="btn btn-gold" id="solve-btn">Solve</button>
  </div>
  <div class="letter-keyboard" id="letter-kb"></div>
</div>
</div>
<script>
'use strict';

// ── Wheel segments ──────────────────────────────────────────────────────────
const SEGMENTS=[
  {label:'$300',val:300,color:'#1d4ed8'},{label:'$500',val:500,color:'#7c3aed'},
  {label:'BANKRUPT',val:'bankrupt',color:'#111'},{label:'$600',val:600,color:'#0d9488'},
  {label:'$350',val:350,color:'#b45309'},{label:'$700',val:700,color:'#be123c'},
  {label:'LOSE TURN',val:'lose',color:'#374151'},{label:'$800',val:800,color:'#1d4ed8'},
  {label:'$400',val:400,color:'#7c3aed'},{label:'$1,000',val:1000,color:'#ea580c'},
  {label:'BANKRUPT',val:'bankrupt',color:'#111'},{label:'$550',val:550,color:'#0d9488'},
  {label:'$2,500',val:2500,color:'#b45309'},{label:'$450',val:450,color:'#be123c'},
  {label:'$900',val:900,color:'#1d4ed8'},{label:'$1,500',val:1500,color:'#7c3aed'},
  {label:'$650',val:650,color:'#0d9488'},{label:'$1,000',val:1000,color:'#ea580c'},
  {label:'$750',val:750,color:'#be123c'},{label:'FREE SPIN',val:'free',color:'#16a34a'},
  {label:'$500',val:500,color:'#1d4ed8'},{label:'$3,500',val:3500,color:'#7c3aed'},
  {label:'$600',val:600,color:'#b45309'},{label:'$800',val:800,color:'#0d9488'},
];
const N=SEGMENTS.length;
const ANG=Math.PI*2/N;

// ── Puzzles ─────────────────────────────────────────────────────────────────
const PUZZLES=[
  {cat:'PHRASE',text:'BETTER LATE THAN NEVER'},
  {cat:'PHRASE',text:'ACTIONS SPEAK LOUDER THAN WORDS'},
  {cat:'THING',text:'BIRTHDAY CAKE'},
  {cat:'PLACE',text:'NIAGARA FALLS'},
  {cat:'PHRASE',text:'PIECE OF CAKE'},
  {cat:'PERSON',text:'ALBERT EINSTEIN'},
  {cat:'FOOD & DRINK',text:'CHOCOLATE CHIP COOKIES'},
  {cat:'THING',text:'SWIMMING POOL'},
  {cat:'BEFORE & AFTER',text:'ROCK AND ROLL MODEL'},
  {cat:'PHRASE',text:'BURNING THE MIDNIGHT OIL'},
  {cat:'PLACE',text:'GRAND CANYON'},
  {cat:'THING',text:'MOUNTAIN BIKE'},
  {cat:'PHRASE',text:'ON THE TIP OF MY TONGUE'},
  {cat:'THING',text:'ROLLER COASTER'},
  {cat:'PHRASE',text:'JUMP FOR JOY'},
  {cat:'PERSON',text:'ABRAHAM LINCOLN'},
  {cat:'FOOD & DRINK',text:'PEPPERONI PIZZA'},
  {cat:'THING',text:'SURFBOARD'},
  {cat:'PHRASE',text:'HIT THE NAIL ON THE HEAD'},
  {cat:'PLACE',text:'GOLDEN GATE BRIDGE'},
  {cat:'THING',text:'FIREWORKS'},
  {cat:'FOOD & DRINK',text:'SCRAMBLED EGGS'},
  {cat:'PHRASE',text:'THE SKY IS THE LIMIT'},
  {cat:'THING',text:'REMOTE CONTROL'},
  {cat:'PLACE',text:'TIMES SQUARE'},
  {cat:'PHRASE',text:'KEEP YOUR FINGERS CROSSED'},
  {cat:'THING',text:'BASEBALL GLOVE'},
  {cat:'FOOD & DRINK',text:'APPLE PIE'},
  {cat:'PHRASE',text:'EVERY CLOUD HAS A SILVER LINING'},
  {cat:'PLACE',text:'EIFFEL TOWER'},
];

// ── State ────────────────────────────────────────────────────────────────────
let PLAYER_NAMES=['You','Vanna','Pat'];
let puzzle,revealed,usedLetters,round,scores,totalScores,curPlayer,phase,spinResult,freeSpin;
// phase: 'spin'|'pick-letter'|'ai-turn'|'over'

function initGame(){
  const p=PUZZLES[Math.floor(Math.random()*PUZZLES.length)];
  puzzle=p;
  revealed=new Set();
  usedLetters=new Set();
  round=1; scores=[0,0,0]; totalScores=[0,0,0];
  curPlayer=0; phase='spin'; spinResult=null; freeSpin=false;
  buildKeyboard();
  // Clear stale UI elements left over from the previous puzzle
  document.getElementById('wedge-display').innerHTML='';
  document.getElementById('solve-row').style.display='none';
  document.getElementById('solve-input').value='';
  renderAll();
  drawWheel(0);
  setStatus(`${PLAYER_NAMES[0]}'s turn — spin the wheel!`);
}

const VOWELS=new Set('AEIOU');

function buildKeyboard(){
  const kb=document.getElementById('letter-kb');
  kb.innerHTML='';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l=>{
    const b=document.createElement('button');
    b.className='letter-key'+(VOWELS.has(l)?' vowel':'');
    b.textContent=l;b.dataset.l=l;
    b.addEventListener('click',()=>pickLetter(l));
    kb.appendChild(b);
  });
}

function updateKeyboard(){
  document.querySelectorAll('.letter-key').forEach(b=>{
    const l=b.dataset.l;
    b.disabled=usedLetters.has(l)||phase!=='pick-letter'||
      (VOWELS.has(l)&&(curPlayer>=nHumans||scores[curPlayer]<250));
  });
}

// ── Wheel drawing ─────────────────────────────────────────────────────────────
const cv=document.getElementById('wof-wheel');
const ctx=cv.getContext('2d');
let wheelAngle=0,spinning=false,WS=220;
function sizeWheel(){
  // Wheel fills the left half on phones; crisp on retina
  const W=Math.min(560,document.documentElement.clientWidth-32);
  WS=Math.round(Math.max(150,Math.min(260,W*0.5)));
  const dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=WS*dpr;cv.height=WS*dpr;cv.style.width=WS+'px';cv.style.height=WS+'px';
  drawWheel(wheelAngle);
}
window.addEventListener('resize',()=>{if(!spinning)sizeWheel();});
cv.addEventListener('click',()=>{if(curPlayer<nHumans&&phase==='spin'&&!spinning&&document.querySelector('#spin-area .btn-gold'))spinWheel();});

function drawWheel(angle){
  const k=WS/220, dpr=cv.width/WS;
  ctx.setTransform(dpr*k,0,0,dpr*k,0,0);
  const cx=110,cy=110,r=100;
  ctx.clearRect(0,0,220,220);
  SEGMENTS.forEach((seg,i)=>{
    const start=angle+i*ANG-Math.PI/2;
    const end=start+ANG;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);ctx.closePath();
    ctx.fillStyle=seg.color;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1.5;ctx.stroke();
    // Label
    ctx.save();ctx.translate(cx,cy);ctx.rotate(start+ANG/2);
    ctx.textAlign='right';ctx.fillStyle='#fff';
    ctx.font=`800 ${seg.label.length>6?7.5:9.5}px Inter,sans-serif`;
    ctx.fillText(seg.label,r-6,3.2);
    ctx.restore();
  });
  // Center hub
  ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);
  const hub=ctx.createRadialGradient(cx-5,cy-5,2,cx,cy,18);hub.addColorStop(0,'#fde68a');hub.addColorStop(1,'#b7791f');
  ctx.fillStyle=hub;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.stroke();
  // Pointer at top — tip points INTO the wheel (downward) to indicate the selected slice
  ctx.beginPath();
  ctx.moveTo(cx,cy-r+10);        // tip inside wheel edge
  ctx.lineTo(cx-9,cy-r-6);       // left base above wheel
  ctx.lineTo(cx+9,cy-r-6);       // right base above wheel
  ctx.closePath();
  ctx.fillStyle='#f5c842';ctx.fill();
  ctx.strokeStyle='#1a1a2e';ctx.lineWidth=1.5;ctx.stroke();
}

let _wac=null;
function wofAudio(){if(!_wac)_wac=new(window.AudioContext||window.webkitAudioContext)();if(_wac.state==='suspended')_wac.resume();return _wac;}
function spinWheel(){
  if(spinning)return;
  if(phase!=='spin')return;
  if(curPlayer<nHumans)GN.haptic('medium');
  document.getElementById('solve-row').style.display='none';
  spinning=true;
  document.getElementById('spin-area').innerHTML='';
  const extra=Math.PI*2*(7+Math.random()*6);
  const totalDur=4500+Math.random()*1500;
  const start=performance.now();
  const startAngle=wheelAngle;
  const targetAngle=startAngle+extra;
  const N_SEGS=SEGMENTS.length;
  const ANG_SEG=Math.PI*2/N_SEGS;
  let lastPegSound=-1;

  function frame(now){
    const elapsed=now-start;
    const t=Math.min(1,elapsed/totalDur);

    // Single smooth cubic ease-out — monotonically decelerating, never speeds back up.
    // f(t) = 1 - (1-t)^3
    //   f(0)=0, f(1)=1
    //   f'(0)=3 (fast start), f'(1)=0 (stops smoothly)
    const ease = 1 - Math.pow(1 - t, 3);
    const angle = startAngle + extra * ease;

    // Play a soft peg click at each segment boundary as we rotate
    const pegsRotated = Math.floor(angle / ANG_SEG);
    if(pegsRotated !== lastPegSound){
      lastPegSound = pegsRotated;
      try{
        const ac = wofAudio();
        const o = ac.createOscillator(), g = ac.createGain();
        // Pitch the clicks higher near the start, lower near the end (peg slowdown feel)
        o.frequency.value = 650 + (1 - t) * 350;
        o.type = 'triangle';
        g.gain.setValueAtTime(0.05, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + 0.04);
        o.connect(g); g.connect(ac.destination);
        o.start(); o.stop(ac.currentTime + 0.05);
      }catch(e){}
    }

    wheelAngle = angle;
    drawWheel(angle);

    if(t<1){requestAnimationFrame(frame);}
    else{
      wheelAngle = targetAngle % (Math.PI * 2);
      drawWheel(wheelAngle);
      spinning = false;
      setTimeout(resolveSpin, 200);
    }
  }
  requestAnimationFrame(frame);
}

function resolveSpin(){
  // Which segment is at the pointer (top)?
  const normalized=(((-wheelAngle+Math.PI/2)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const segIdx=Math.floor(normalized/ANG)%N;
  const seg=SEGMENTS[segIdx];
  spinResult=seg;
  const wd=document.getElementById('wedge-display');
  if(seg.val==='bankrupt'){
    scores[curPlayer]=0;freeSpin=false;
    if(curPlayer<nHumans)GN.haptic('error');
    wd.innerHTML=`<span class="wedge-bankrupt">💸 BANKRUPT — ${PLAYER_NAMES[curPlayer]} loses all round winnings!</span>`;
    renderScores();
    setTimeout(()=>nextPlayer(),1800);
  } else if(seg.val==='lose'){
    freeSpin=false;
    wd.innerHTML=`<span class="wedge-lose">🚫 LOSE A TURN — ${PLAYER_NAMES[curPlayer]} passes!</span>`;
    setTimeout(()=>nextPlayer(),1500);
  } else {
    const isFree=seg.val==='free';
    if(isFree)freeSpin=true;
    wd.innerHTML=`<span class="wedge-money">${isFree?'🎰 FREE SPIN':('💰 '+seg.label)} — ${curPlayer<nHumans?'Pick a consonant!':PLAYER_NAMES[curPlayer]+' is picking…'}</span>`;
    phase='pick-letter';
    if(curPlayer>=nHumans){
      // AI picks a letter
      setTimeout(()=>aiPickLetter(),800);
    } else {
      setStatus(`${PLAYER_NAMES[curPlayer]}, pick a consonant!`);
      renderSpinArea();
      updateKeyboard();
    }
  }
}

function pickLetter(l){
  if(phase!=='pick-letter')return;
  if(usedLetters.has(l))return;
  if(VOWELS.has(l)){
    if(curPlayer>=nHumans)return;
    if(scores[curPlayer]<250){setStatus('Need $250 to buy a vowel!');return;}
    scores[curPlayer]-=250;
  }
  usedLetters.add(l);
  const count=puzzle.text.split('').filter(c=>c===l).length;
  if(count>0){
    // Reveal tiles
    puzzle.text.split('').forEach((c,i)=>{ if(c===l){ revealed.add(i); justRevealed.add(i); } });
    if(curPlayer<nHumans)GN.haptic('success');
    if(VOWELS.has(l)){
      setStatus(`Yes! "${l}" appears ${count} time${count>1?'s':''}!`);
    } else {
      scores[curPlayer]+=spinResult?.val*count||0;
      setStatus(`${l}×${count}! +$${(spinResult?.val||0)*count}!`);
    }
    renderAll();
    // Check if solved
    if(isPuzzleSolved()){
      totalScores[curPlayer]+=scores[curPlayer];
      setTimeout(endRound,1000);
    } else {
      phase='spin';
      if(curPlayer>=nHumans){
        // AI keeps spinning after a correct letter
        setTimeout(()=>aiTurn(),1000);
      } else {
        setTimeout(()=>{ renderSpinArea(); updateKeyboard(); },800);
      }
    }
  } else {
    if(curPlayer<nHumans)GN.haptic('error');
    setStatus(`No "${l}" in the puzzle — ${PLAYER_NAMES[curPlayer]}'s turn ends.`);
    phase='spin'; // lock out further picks during transition
    renderPuzzle();
    updateKeyboard(); // disable keys since phase is now 'spin'
    setTimeout(()=>nextPlayer(),1200);
  }
}

function isPuzzleSolved(){
  return puzzle.text.split('').every((c,i)=>c===' '||revealed.has(i));
}

function nextPlayer(){
  curPlayer=(curPlayer+1)%3;
  phase='spin';
  spinResult=null;
  document.getElementById('wedge-display').innerHTML='';
  renderAll();
  if(curPlayer>=nHumans){
    // AI turn
    setTimeout(aiTurn,900);
  } else {
    setStatus(`${PLAYER_NAMES[curPlayer]}'s turn! Spin the wheel.`);
    renderSpinArea();
    updateKeyboard();
  }
}

function aiTurn(){
  if(curPlayer<nHumans)return;
  setStatus(`${PLAYER_NAMES[curPlayer]} is spinning…`);
  spinWheel();
  // AI letter picking is handled after spin resolves via pickLetter
  // We need to intercept after phase becomes 'pick-letter'
}

function aiPickLetter(){
  // Pick most common unrevealed consonant
  const consonants='RSTLNEABCDFGHJKMPQUVWXYZ';
  let pick=null;
  for(const l of consonants){
    if(!usedLetters.has(l)&&!VOWELS.has(l)){pick=l;break;}
  }
  if(!pick){nextPlayer();return;}
  setStatus(`${PLAYER_NAMES[curPlayer]} picks "${pick}"…`);
  setTimeout(()=>pickLetter(pick),600);
}

function attemptSolve(){
  if(curPlayer>=nHumans||phase==='over'||spinning)return;
  const guess=document.getElementById('solve-input').value.trim().toUpperCase().replace(/\s+/g,' ');
  if(!guess)return;
  document.getElementById('solve-input').blur();
  if(guess===puzzle.text){
    GN.haptic('success');
    // Reveal all
    puzzle.text.split('').forEach((_,i)=>revealed.add(i));
    totalScores[curPlayer]+=scores[curPlayer];
    renderPuzzle();
    setStatus('🎉 You solved it!');
    setTimeout(endRound,1200);
  } else {
    GN.haptic('error');
    setStatus('❌ Not quite — turn passes!');
    phase='spin';updateKeyboard();
    document.getElementById('spin-area').innerHTML='';
    document.getElementById('solve-row').style.display='none';
    document.getElementById('solve-input').value='';
    setTimeout(()=>nextPlayer(),1200);
  }
}

function endRound(){
  phase='over';
  const winner=totalScores.indexOf(Math.max(...totalScores));
  const wd=document.getElementById('wedge-display');
  wd.innerHTML=`<span style="color:#22c55e">✅ Puzzle: ${puzzle.text}</span>`;
  const winnerName=PLAYER_NAMES[winner];
  const amount=totalScores[winner].toLocaleString();
  const msg = winner===0 && PLAYER_NAMES[0]==='You'
    ? `🏆 You win with $${amount}!`
    : `🏆 ${winnerName} wins with $${amount}`;
  setStatus(msg);
  GN.haptic(winner<nHumans?'success':'medium');
  renderPuzzle();  // ensure all tiles are shown in their final solved state
  renderScores();
  document.getElementById('spin-area').innerHTML=`<button class="btn btn-gold btn-block" onclick="initGame()">New Puzzle</button>`;
  document.getElementById('solve-row').style.display='none';
  document.getElementById('letter-kb').innerHTML='';
  try{
    GameHistory.save('wof',{
      _summary:`Wheel of Fortune · ${puzzle.text}`,
      _badge:'$'+totalScores[0].toLocaleString(),
      puzzle:puzzle.text,score:totalScores[0],winner:PLAYER_NAMES[winner]
    });
  }catch(e){}
}

function renderPuzzle(){ renderPuzzleClean(); }

const justRevealed=new Set();
function renderPuzzleClean(){
  const board=document.getElementById('puzzle-board');
  document.getElementById('puzzle-cat').textContent=puzzle.cat;
  const text=puzzle.text;
  const words=text.split(' ');
  const rows=[]; let curRow=[]; let pos=0;
  words.forEach((word,wi)=>{
    if(wi>0){
      if(curRow.reduce((s,t)=>s+t.len,0)+1+word.length>13&&curRow.length){
        rows.push([...curRow]);curRow=[];
      } else curRow.push({ch:' ',pos:-1,len:1});
      pos++;
    }
    word.split('').forEach(c=>{
      curRow.push({ch:c,pos:pos,len:1});pos++;
    });
  });
  if(curRow.length)rows.push(curRow);
  board.innerHTML=rows.map(r=>`<div class="puzzle-row">${
    r.map(t=>{
      if(t.ch===' ')return`<div class="puzzle-tile space"></div>`;
      const rev=revealed.has(t.pos);
      const fl=rev&&justRevealed.has(t.pos)&&phase!=='over'?' flip':'';
      return`<div class="puzzle-tile${phase==='over'?' solved':rev?fl:' blank'}">${rev||phase==='over'?t.ch:''}</div>`;
    }).join('')
  }</div>`).join('');
  justRevealed.clear();
}

function renderScores(){
  const sb=document.getElementById('score-board');
  sb.innerHTML=PLAYER_NAMES.map((n,i)=>`
    <div class="player-card${i===curPlayer&&phase!=='over'?' active':''}${i===0?' human':''}">
      <div class="player-name">${n}</div>
      <div class="player-round">$${scores[i].toLocaleString()}</div>
      <div class="player-total">Total: $${totalScores[i].toLocaleString()}</div>
    </div>`).join('');
}

function renderSpinArea(){
  const sa=document.getElementById('spin-area');
  if(phase==='over')return;
  if(curPlayer<nHumans&&phase==='spin'&&!spinning){
    sa.innerHTML=`
      <button class="btn btn-gold" onclick="spinWheel()">🎡 Spin</button>
      <button class="btn btn-outline" onclick="buyVowel()" ${scores[curPlayer]>=250?'':'disabled'}>Vowel $250</button>
      <button class="btn btn-outline" onclick="showSolve()">Solve</button>`;
  } else if(curPlayer<nHumans&&phase==='pick-letter'){
    sa.innerHTML=`<button class="btn btn-outline" onclick="showSolve()">Solve the puzzle</button>`;
  } else {
    sa.innerHTML='';
  }
}

function buyVowel(){
  if(curPlayer>=nHumans||phase!=='spin'||spinning||scores[curPlayer]<250)return;
  phase='pick-letter';spinResult={val:0};
  setStatus('Pick a vowel!');
  updateKeyboard();
  renderSpinArea();
  // Enable vowels only
  document.querySelectorAll('.letter-key').forEach(b=>{
    b.disabled=!VOWELS.has(b.dataset.l)||usedLetters.has(b.dataset.l);
  });
}

function showSolve(){
  if(curPlayer>=nHumans||phase==='over'||spinning)return;
  const row=document.getElementById('solve-row');
  row.style.display='flex';
  const inp=document.getElementById('solve-input');
  inp.focus();
  setTimeout(()=>row.scrollIntoView({behavior:'smooth',block:'center'}),250);
}

function setStatus(msg){ document.getElementById('wof-status').textContent=msg; }

function renderAll(){
  renderPuzzleClean();
  renderScores();
  renderSpinArea();
  updateKeyboard();
}

document.getElementById('solve-btn').addEventListener('click',attemptSolve);
document.getElementById('solve-input').addEventListener('keydown',e=>{if(e.key==='Enter')attemptSolve();});

// ── Player setup ──────────────────────────────────────────────────────────
let nHumans = 1; // default
function showPlayerSetup() {
  const overlay = document.createElement('div');
  overlay.id = 'wof-setup';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wof-setup-title">
      <div style="font-size:2.4rem;line-height:1;margin-bottom:6px;">🎡</div>
      <div class="modal-title" id="wof-setup-title">Wheel of Fortune</div>
      <div style="font-size:.92rem;color:var(--text-2);margin-bottom:16px;">How many people are playing? Empty seats are filled by Vanna &amp; Pat.</div>
      <div class="tabs">
        ${[1,2,3].map(n=>`<button class="tab${n===1?' active':''}" data-n="${n}" onclick="selectPlayers(${n})">${n}</button>`).join('')}
      </div>
      <div id="wof-name-inputs" style="margin-bottom:8px;text-align:left;"></div>
      <button class="btn btn-gold btn-block" onclick="startWithPlayers()">Start Game</button>
    </div>`;
  document.body.appendChild(overlay);
  renderNameInputs(1);
}

function selectPlayers(n) {
  nHumans = n;
  document.querySelectorAll('#wof-setup [data-n]').forEach(b => {
    b.classList.toggle('active', +b.dataset.n === n);
  });
  GN.haptic('select');
  renderNameInputs(n);
}

function renderNameInputs(n) {
  const el = document.getElementById('wof-name-inputs');
  if (!el) return;
  if (n === 1) { el.innerHTML = '<div style="height:6px"></div>'; return; }
  el.innerHTML = Array.from({length:n}, (_,i) =>
    `<input type="text" placeholder="Player ${i+1} name" maxlength="12"
      class="input wof-pname-input" autocomplete="off"
      id="wof-pname-${i}">`
  ).join('');
  // Wire up the frequent-player picker under each input
  if (typeof FrequentPlayers !== 'undefined') {
    for (let i = 0; i < n; i++) {
      const inp = document.getElementById('wof-pname-' + i);
      if (inp) FrequentPlayers.attachPicker(inp, {
        siblingSelector: '.wof-pname-input',
        managePath: 'players.html'
      });
    }
  }
}

function startWithPlayers() {
  const names = ['You','Vanna','Pat'];
  for (let i = 0; i < nHumans; i++) {
    const el = document.getElementById('wof-pname-' + i);
    if (el && el.value.trim()) names[i] = el.value.trim();
    else if (i === 0) names[0] = 'You';
  }
  // Fill remaining AI slots
  PLAYER_NAMES[0] = names[0];
  PLAYER_NAMES[1] = nHumans >= 2 ? names[1] : 'Vanna';
  PLAYER_NAMES[2] = nHumans >= 3 ? names[2] : 'Pat';
  document.getElementById('wof-setup')?.remove();
  initGame();
}

sizeWheel();
showPlayerSetup();
setStatus(`${PLAYER_NAMES[0]}'s turn — spin the wheel!`);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel of Fortune</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
#app.wofgame{max-width:1180px;padding:0 10px calc(var(--safe-b) + 14px);}
.show{display:flex;flex-direction:column;gap:9px;}
.side{display:flex;flex-direction:column;gap:9px;min-width:0;}

/* ── TV studio "camera" ─────────────────────────────────────────────── */
.studio{position:relative;height:340px;border-radius:20px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(70% 45% at 50% 105%, rgba(140,110,255,.45), transparent 70%),
    repeating-conic-gradient(from 0deg at 50% 115%, rgba(255,255,255,.05) 0 3deg, transparent 3deg 11deg),
    radial-gradient(120% 90% at 50% 0%, #2c2173 0%, #170f40 58%, #0b0723 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), inset 0 -40px 60px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.45);}
.studio.flash::after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;background:radial-gradient(circle,rgba(255,30,30,.15),rgba(160,0,0,.55));animation:flash .9s ease-out forwards;}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.boardcam{position:absolute;left:0;right:0;top:0;z-index:2;padding:8px 6px 0;transition:transform .6s var(--ease), opacity .45s ease;}
.wheelcam{position:absolute;left:50%;top:0;z-index:1;width:var(--wc,300px);height:var(--wc,300px);margin-left:calc(var(--wc,300px) / -2);
  transform-origin:50% 0;transform:translateY(var(--wy,190px)) scale(.94);transition:transform .6s var(--ease);}
.wheelcam canvas{width:100%;height:100%;touch-action:pan-y;}
.wheelcam canvas.flick{touch-action:none;cursor:grab;}
.studio[data-cam="wheel"] .boardcam{transform:translateY(-104%);opacity:0;}
.studio[data-cam="wheel"] .wheelcam{transform:translateY(var(--wy2,0px)) scale(1);}

/* ── Puzzle board ─────────────────────────────────────────────────────── */
.board{container-type:inline-size;padding:6px;border-radius:14px;
  background:linear-gradient(180deg,#5d74ff 0%,#2c3fc4 18%,#1b278a 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.35), 0 10px 22px rgba(0,0,0,.5);}
.board.shake{animation:shake .4s;}
.grid{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;padding:5px;border-radius:9px;background:#08103a;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.7);perspective:700px;}
.tile{position:relative;aspect-ratio:.76;border-radius:3px;display:grid;place-items:center;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;line-height:1;color:transparent;
  font-size:calc((100cqw - 61px) / 14 * .8);user-select:none;-webkit-user-select:none;}
.tile.x{visibility:hidden;}
.tile.off{background:linear-gradient(155deg,#3cc07a 0%,#1d8f53 55%,#147040 100%);box-shadow:inset 0 0 0 1.5px #0b4f2c, inset 0 2px 0 rgba(255,255,255,.25);}
.tile.on{background:linear-gradient(180deg,#ffffff 0%,#f1f4f6 70%,#dfe5ea 100%);box-shadow:inset 0 0 0 1.5px #168048, inset 0 -2px 0 rgba(0,0,0,.12);}
.tile.on.rev{color:#101018;}
.tile.on.lit{background:radial-gradient(circle at 50% 35%,#d4f3ff 0%,#43a6ff 45%,#0d55d8 100%);box-shadow:0 0 14px 2px rgba(70,160,255,.9), inset 0 0 0 1.5px #0a3a9c;animation:litp .32s var(--spring);z-index:1;}
@keyframes litp{from{transform:scale(.8)}to{transform:none}}
.tile.flip{animation:flip .46s ease-in-out both;}
@keyframes flip{
  0%{transform:rotateY(0);background:radial-gradient(circle at 50% 35%,#d4f3ff 0%,#43a6ff 45%,#0d55d8 100%);color:transparent;}
  49%{transform:rotateY(90deg);background:radial-gradient(circle at 50% 35%,#d4f3ff 0%,#43a6ff 45%,#0d55d8 100%);color:transparent;}
  51%{transform:rotateY(90deg);color:#101018;}
  100%{transform:rotateY(0);color:#101018;}}
.tile.pop{animation:tpop .35s var(--spring);}
@keyframes tpop{0%{transform:scale(.4);color:transparent}100%{transform:none}}
.tile.in{animation:tin .4s var(--spring) both;}
@keyframes tin{0%{transform:rotateY(90deg);background:#1d8f53}50%{transform:rotateY(90deg)}100%{transform:none}}
.tile.slot{cursor:pointer;background:linear-gradient(180deg,#fffdf0,#fff3c4);}
.tile.slot.typed{color:#1d4ed8;}
.tile.slot.cur{box-shadow:inset 0 0 0 2.5px #ff9f00, 0 0 10px rgba(255,170,0,.85);z-index:1;}
.tile.slot.bad{color:#d0172b;}
.cat{margin:7px auto 0;width:max-content;max-width:100%;padding:4px 16px;border-radius:8px;
  background:linear-gradient(180deg,#26359f,#121b62);border:2px solid #7d93ff;color:#fff;
  font-weight:900;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 4px 12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.3);}

/* Wheel readouts and big moments */
.readout{position:absolute;left:50%;top:var(--cy,50%);z-index:7;padding:6px 18px;border-radius:14px;pointer-events:none;white-space:nowrap;
  background:linear-gradient(180deg,#fff8d6,#ffd34d);color:#3b2400;font-family:var(--display);font-size:2.3rem;line-height:1.1;
  box-shadow:0 10px 26px rgba(0,0,0,.55), inset 0 0 0 3px #fff;opacity:0;transform:translate(-50%,-50%) scale(.2);}
.readout.go{animation:ro 1.7s var(--spring) forwards;}
@keyframes ro{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}34%{transform:translate(-50%,-50%) scale(1)}84%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}
.band{position:absolute;left:-8%;right:-8%;top:var(--cy,50%);z-index:8;padding:12px 0;text-align:center;pointer-events:none;
  font-family:var(--display);font-size:clamp(2.1rem,11vw,3.4rem);letter-spacing:.08em;line-height:1;opacity:0;}
.band.go{animation:band 2.2s var(--ease) forwards;}
.band.bk{background:#050505;color:#fff;box-shadow:inset 0 3px 0 #fff, inset 0 -3px 0 #fff, 0 0 40px rgba(0,0,0,.8);}
.band.lose{background:#f7f7f2;color:#111;box-shadow:inset 0 3px 0 #111, inset 0 -3px 0 #111, 0 0 30px rgba(0,0,0,.5);}
.band.free{background:#8bd43a;color:#163300;box-shadow:inset 0 3px 0 #fff, inset 0 -3px 0 #fff, 0 0 30px rgba(139,212,58,.6);}
@keyframes band{0%{opacity:0;transform:translateY(-50%) rotate(-5deg) scale(1.6,0)}12%{opacity:1;transform:translateY(-50%) rotate(-5deg) scale(1,1.2)}20%{transform:translateY(-50%) rotate(-5deg) scale(1)}82%{opacity:1;transform:translateY(-50%) rotate(-5deg) scale(1)}100%{opacity:0;transform:translateY(-50%) rotate(-5deg) scale(1.08)}}
.tcard{position:fixed;inset:0;z-index:300;display:grid;place-items:center;pointer-events:none;}
.tcard .in{min-width:230px;padding:18px 30px 16px;border-radius:18px;text-align:center;
  background:linear-gradient(180deg,#3346e0,#16207a);border:3px solid #ffd54a;
  box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.35);animation:tcard 1.8s var(--ease) forwards;}
.tcard h2{font-family:var(--display);font-weight:400;font-size:2.5rem;color:#fff;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.35);}
.tcard p{color:#ffd54a;font-weight:900;font-size:1.1rem;margin-top:2px;}
@keyframes tcard{0%{transform:scale(.4) rotate(-6deg);opacity:0}16%{transform:scale(1.07) rotate(0);opacity:1}28%{transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
.mfloat{position:fixed;z-index:320;pointer-events:none;font-family:var(--display);font-size:1.7rem;color:#ffe066;
  text-shadow:0 3px 0 rgba(0,0,0,.45), 0 0 18px rgba(255,210,60,.6);white-space:nowrap;}
.mfloat.neg{color:#ff8a8a;}

/* ── Podiums ──────────────────────────────────────────────────────────── */
.pods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:4px;}
.pod{--pc:#d8312c;--pi:#fff;position:relative;border-radius:12px 12px 9px 9px;padding:5px 6px 6px;text-align:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 70%,#fff) 0%,var(--pc) 38%,color-mix(in srgb,var(--pc) 72%,#000) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.4);
  transition:transform .35s var(--spring), filter .3s, box-shadow .3s, opacity .3s;filter:saturate(.7) brightness(.78);}
.pod.yel{--pi:#2a1c00;}
.pod.on{filter:none;transform:translateY(-3px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(0,0,0,.25), 0 0 0 3px #fff, 0 0 26px color-mix(in srgb,var(--pc) 75%,transparent);}
.pod.on::before{content:"";position:absolute;left:50%;top:-12px;margin-left:-7px;border:7px solid transparent;border-top:8px solid #fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));}
.pod.out{opacity:.4;filter:grayscale(.7) brightness(.7);}
.pod.bk{animation:shake .45s 2;}
.pod.bk .pbank{color:#ff3b3b;}
.pname{font-weight:900;font-size:.82rem;color:#fff;background:rgba(10,6,30,.55);border-radius:6px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbank{font-family:var(--display);font-size:1.5rem;line-height:1.15;color:var(--pi);margin-top:2px;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 rgba(0,0,0,.25);white-space:nowrap;transition:color .3s;}
.ptot{font-size:.7rem;font-weight:800;color:var(--pi);opacity:.85;white-space:nowrap;}
.say{position:absolute;left:50%;bottom:calc(100% + 12px);z-index:12;pointer-events:none;padding:6px 11px;border-radius:12px;
  background:#fff;color:#1b1340;font-weight:900;font-size:.88rem;white-space:nowrap;opacity:0;transform:translateX(-50%) scale(.5);
  box-shadow:0 6px 16px rgba(0,0,0,.45);}
.say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;}
.say.go{animation:say 2s var(--spring) forwards;}
@keyframes say{0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.5)}14%{opacity:1;transform:translateX(-50%) scale(1.05)}22%{transform:translateX(-50%) scale(1)}85%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-6px) scale(.95)}}

/* ── Host line, action deck, letter keys ──────────────────────────────── */
.host{min-height:2.5em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.95rem;line-height:1.25;color:var(--text-2);padding:0 4px;}
.host b{color:var(--yellow);}
.deck{display:flex;flex-direction:column;gap:8px;}
.acts{display:flex;gap:8px;min-height:52px;}
.acts > *{flex:1 1 0;min-width:0;}
.acts .btn{min-height:52px;padding:0 8px;font-size:1rem;}
.acts .grow2{flex-grow:1.8;}
.btn .two{display:flex;flex-direction:column;line-height:1.05;white-space:nowrap;font-size:.95rem;}
.btn .two small{font-size:.74rem;font-weight:800;opacity:.75;}
.spinbtn{overflow:hidden;font-family:var(--display);font-weight:400;font-size:1.35rem!important;letter-spacing:.04em;}
.spinbtn .pw{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(255,255,255,.55));transform-origin:left;transform:scaleX(0);}
.spinbtn .lb{position:relative;}
.spinbtn.full .pw{animation:pwfull .26s ease-in-out infinite alternate;}
@keyframes pwfull{from{background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.55));}to{background:linear-gradient(90deg,rgba(255,120,60,.35),rgba(255,255,255,.85));}}
.info{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 10px;border-radius:var(--r);
  background:var(--w06);font-weight:900;color:var(--text);text-align:center;}
.info b{color:var(--yellow);font-family:var(--display);font-weight:400;font-size:1.35rem;}
.buzz{font-family:var(--display);font-weight:400;font-size:1.3rem!important;letter-spacing:.03em;}
.kb{display:flex;flex-direction:column;gap:5px;padding:0 calc(var(--corner-x) / 2);}
.kb .kr{display:flex;justify-content:center;gap:5px;}
.key{min-height:42px;padding:0;border:0;border-radius:9px;font-weight:900;font-size:1.1rem;color:#1b1340;
  background:linear-gradient(180deg,#fbf9ff,#ddd6f3);box-shadow:0 3px 0 #8f86b8;transition:transform .08s, opacity .15s;}
.key.v{background:linear-gradient(180deg,#e7f4ff,#a9d3ff);box-shadow:0 3px 0 #5a8cc2;}
.key:active:not(:disabled){transform:translateY(3px);box-shadow:none;}
.key:disabled{opacity:.42;cursor:default;}
.key.used{opacity:1;background:var(--w05);box-shadow:none;color:rgba(255,255,255,.28);}
.key.used.hit{color:#7cc4ff;}
.key.used.miss{color:rgba(255,110,120,.6);text-decoration:line-through;text-decoration-thickness:2px;}
.key.picked{outline:3px solid var(--yellow);opacity:1;}
.key.bs{background:linear-gradient(180deg,#ffd9de,#f3a7b2);box-shadow:0 3px 0 #b5606d;display:grid;place-items:center;}
.key.bs .ico{width:22px;height:22px;}
.key.ghost{visibility:hidden;}
.slots{display:flex;gap:6px;justify-content:center;align-items:center;}
.slots span{width:40px;height:50px;border-radius:6px;display:grid;place-items:center;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:1.6rem;
  background:#fff;color:#101018;box-shadow:inset 0 0 0 2px #168048;}
.slots span.e{background:var(--w08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);}
.slots span.v{box-shadow:inset 0 0 0 2px #2f7de1;}
.slots span.v.e{box-shadow:inset 0 0 0 2px rgba(80,160,255,.6);}
.slots i{width:10px;}
.clock{position:relative;display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:var(--r);overflow:hidden;
  background:#0d0a26;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);font-family:var(--display);font-size:1.9rem;color:#fff;}
.clock i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;background:linear-gradient(90deg,#ff5c5c,#ffc83d 45%,#3ddc84);opacity:.55;}
.clock span{position:relative;text-shadow:0 2px 0 rgba(0,0,0,.4);}

/* Bonus envelope */
.envo{position:fixed;inset:0;z-index:420;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
  background:rgba(10,6,28,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s;}
.envo.show{opacity:1;}
.envo .lab{color:#fff;font-weight:900;font-size:1.25rem;text-align:center;}
.env{position:relative;width:260px;height:168px;margin-top:70px;}
.env .bk{position:absolute;inset:0;border-radius:10px;background:linear-gradient(180deg,#d8ab3c,#b5861f);}
.env .note{position:absolute;left:14px;right:14px;top:14px;height:136px;border-radius:8px;background:linear-gradient(180deg,#fff,#f4efe2);
  display:grid;place-items:center;font-family:var(--display);font-size:2.5rem;color:#16207a;box-shadow:0 2px 8px rgba(0,0,0,.25);
  transition:transform .9s var(--spring) .55s;}
.env .front{position:absolute;inset:0;border-radius:10px;background:linear-gradient(180deg,#f3d27a,#dcb04a);clip-path:polygon(0 30%,50% 62%,100% 30%,100% 100%,0 100%);}
.env .flap{position:absolute;left:0;right:0;top:0;height:100px;background:linear-gradient(180deg,#f7dc8d,#e2b84f);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .55s ease, opacity .3s .3s;}
.envo.open .flap{transform:rotateX(180deg);opacity:0;}
.envo.open .note{transform:translateY(-104px);}

/* ── Desktop: wheel and board side by side ────────────────────────────── */
.bwrap{display:none;}
.show.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:18px;align-items:start;padding-top:6px;}
.show.desk .studio{position:sticky;top:calc(var(--safe-t) + 66px);}
.show.desk .bwrap{display:block;padding:14px 12px 12px;border-radius:20px;
  background:radial-gradient(120% 90% at 50% 0%, #2c2173 0%, #170f40 60%, #0b0723 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), 0 12px 30px rgba(0,0,0,.45);}
.show.desk .boardcam{position:static;transform:none!important;opacity:1!important;padding:0;}
.show.desk .wheelcam{transform:translateY(var(--wy2,0px))!important;}
.show.desk .pbank{font-size:1.9rem;}
.show.desk .pname{font-size:.95rem;}
.show.desk .key{min-height:46px;}
.show.desk .cat{font-size:.95rem;}
@media (min-width:700px) and (max-width:959px){ .key{min-height:52px;font-size:1.3rem;} }

/* QWERTY keyboard: every key is one tenth of the row, rows centered (like a phone keyboard) */
.kb .r,.kb .kr{--kg:5px;gap:var(--kg);justify-content:center;}
.kb .r .key,.kb .kr .key{flex:0 1 calc((100% - 9 * var(--kg)) / 10);min-width:0;}
.kb .r .key.wide,.kb .kr .key.bs,.kb .kspc{flex:0 1 calc((100% - 9 * var(--kg)) / 10 * 1.5);}
.kb .kspc{visibility:hidden;}
@media (min-width:700px){.kb .r,.kb .kr{--kg:7px;}}
</style>
</head>
<body>
<main class="stage" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el, esc = Kit.esc;
  var app = document.getElementById('app');
  var SAVE = 'wof_state', HKEY = 'wof', RECENT = 'wof_recent';
  var FAST = /fast/.test(location.hash);          // test hook: speeds every timer up
  var SPD = FAST ? 0.08 : 1;
  var VOW = 'AEIOU';
  var FREQ = 'TNSRHLDCMGPBFYWKVXZJQ';
  var PODS = [{ c: '#d8312c', k: 'red' }, { c: '#f2c230', k: 'yel' }, { c: '#2f7de1', k: 'blu' }];
  var TOP = [0, 2500, 3500, 5000, 5000];
  var ENVELOPES = [[40000, 7], [45000, 6], [50000, 5], [75000, 3], [100000, 2]];
  function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
  function isL(c) { return c >= 'A' && c <= 'Z'; }
  function rnd(n) { return Math.floor(Math.random() * n); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function wpick(list) { var tot = 0; list.forEach(function (x) { tot += x[1]; }); var r = Math.random() * tot; for (var i = 0; i < list.length; i++) { r -= list[i][1]; if (r < 0) return list[i][0]; } return list[0][0]; }
  // Pick from a ranked list, favouring the front: weights .5 .25 .13 …
  function topPick(list) { var w = [50, 25, 13, 7, 5]; return wpick(list.slice(0, 5).map(function (x, i) { return [x, w[i]]; })); }

  // ── Sound: show-style effects, synthesized (respects the kit sound switch) ──
  var snd = (function () {
    var ac = null;
    function on() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }
    function A() { if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); } if (ac.state === 'suspended') ac.resume(); return ac; }
    function tone(f, t0, dur, type, vol, slide) {
      var a = A(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
    }
    function noise(t0, dur, vol, hp) {
      var a = A(); if (!a) return;
      var n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = hp || 1500; g.gain.value = vol; s.buffer = b; s.connect(f); f.connect(g); g.connect(a.destination); s.start(a.currentTime + t0);
    }
    var FX = {
      ding: function () { tone(1568, 0, 1.3, 'sine', 0.16); tone(3136, 0, 0.5, 'sine', 0.045); tone(2349, 0, 0.8, 'triangle', 0.025); },
      touch: function () { tone(760, 0, 0.08, 'triangle', 0.06); noise(0, 0.03, 0.05, 3000); },

      var e = tileOf(i); e.textContent = S.pz.text[i]; e.className = 'tile on rev flip';
      if (k % 3 === 0) snd('touch');
      await wait(55);
    }
    await wait(400);
  }
  async function showWrong(s) {
    blankIdx().forEach(function (i) { var t = tileOf(i); if (s.fill[i]) { t.textContent = s.fill[i]; t.className = 'tile on slot typed bad'; } });
    fx(shell.board, 'shake', 500);
    await wait(900);
  }

  // ── Turn flow ─────────────────────────────────────────────────────────────
  function nextPlayer() { S.cur = (S.cur + 1) % 3; S.phase = 'turn'; S.wedge = null; ui.vowel = false; }
  function proceed() {
    if (!S || !shell) return;
    renderAll();
    var p = S.players[S.cur];
    switch (S.phase) {
      case 'turn': case 'call': if (p.cpu) run(cpuTurn); break;
      case 'tossup': run(tossupLoop); break;
      case 'tuwon': run(async function () { await wait(500); continueAfterTossup(); }); break;
      case 'bonusIntro': if (p.cpu) run(async function () { ui.busy = true; paintDeck(); await wait(1100); await bonusSpin(0.3 + Math.random() * 0.6); }); break;
      case 'bonusPick': if (p.cpu) run(cpuBonusPicks); else if (S.bonus.picks.length >= 4) run(bonusRevealPicks); break;
      case 'bonusReady':
        if (!blankIdx().length) { run(function () { return bonusEnd(true); }); break; }   // puzzle already filled in
        if (p.cpu) run(cpuBonus); break;
    }
  }

  function beginRound(r) {
    epoch++; undoStack = [];
    S.round = r; S.players.forEach(function (p) { p.bank = 0; }); S.row = [0, 0, 0]; S.wedge = null; S.lastWin = null;
    Wheel.setWedges(wedgesFor(r));
    if (S.opts.tossups) beginTossup(r === 1 ? 1000 : 2000, [0, 1, 2], 'round');
    else beginMain((r - 1) % 3);
  }
  function beginMain(starter) {
    epoch++;
    newPuzzle(pickPuzzle()); track('r');
    S.cur = starter; S.phase = 'turn'; S.wedge = null; S.tu = null; S.next = null; save();
    run(async function () {
      ui.busy = true; ui.blank = true; setCam('wide'); renderAll();
      host('Round ' + S.round + '. ' + vb(S.players[starter].name, 'starts', 'start') + '.');
      await titleCard('Round ' + S.round, 'Top dollar ' + money(TOP[Math.min(S.round, 4)]));
      await boardIntro();
      ui.busy = false; proceed();
    });
  }
  function canFlick() {
    if (!S || ui.busy || ui.solve || Wheel.busy()) return false;
    var p = S.players[S.cur]; if (!p || p.cpu) return false;
    if (S.phase === 'turn' && consLeft() && !ui.vowel) return 'main';
    if (S.phase === 'bonusIntro') return 'bonus';
    return false;
  }
  function onFlick(om) {
    var m = canFlick();
    if (!m) return;
    if (Math.abs(om) < 2.2) {
      if (om) Kit.toast('Give it a bigger flick!');
      setTimeout(function () { if (!ui.busy) setCam('wide'); }, 600);
      return;
    }
    // Flick speed sets the spin: a lazy flick still makes a full turn, a hard one is a big spin
    var w0 = (om > 0 ? 1 : -1) * clamp(Math.abs(om) * 0.7, W_MIN, W_MAX * 1.05) * (0.97 + Math.random() * 0.06);
    if (m === 'main') run(function () { return doSpin(null, w0); }); else run(function () { return bonusSpin(null, w0); });
  }
  async function doSpin(power, w0) {
    var me = S.cur, p = S.players[me];
    ui.busy = true; ui.vowel = false; paintDeck();
    setCam('wheel'); host(vb(p.name, 'spins…', 'spin…'));
    if (!p.cpu) Kit.haptic('medium');
    await wait(p.cpu ? 650 : 200);
    var idx = await Wheel.spin(w0 || omegaFor(power));
    await landed(idx);
  }
  async function landed(idx) {
    var w = Wheel.wedge(idx), me = S.cur, p = S.players[me];
    S.angle = Wheel.angle();
    if (w.t === '$' || w.t === 'free') {
      S.wedge = w.t === 'free' ? { t: 'free' } : { t: '$', v: w.v };
      S.phase = 'call'; save();
      if (w.t === 'free') { band('free', 'FREE PLAY'); snd('chime'); host('Free Play!'); }
      else {
        readout(money(w.v)); snd('pop'); host(vb(p.name, 'lands', 'land') + ' on <b>' + money(w.v) + '</b>.');
        if (w.top) { snd('chime'); setTimeout(function () { Kit.callout(money(w.v) + '!'); }, 250); }
      }
      await wait(w.t === 'free' ? 1800 : 1300);
    } else if (w.t === 'bk') {
      var lost = p.bank;
      S.log.bk.push({ p: me, amt: lost, r: S.round }); ev(me + '!' + lost);
      p.bank = 0; nextPlayer(); save();
      band('bk', 'BANKRUPT'); snd('bankrupt'); fx(shell.studio, 'shake', 500); fx(shell.studio, 'flash', 950); fx(shell.pods[me].root, 'bk', 1600);
      if (!p.cpu) Kit.haptic('error');
      host(lost ? vb(p.name, 'loses', 'lose') + ' <b>' + money(lost) + '</b>!' : vb(p.name, 'hits', 'hit') + ' BANKRUPT.');
      await wait(450); tweenMoney(me, 'bank', 0, 1000);
      await wait(1900);
    } else {
      ev(me + '/'); nextPlayer(); save();
      band('lose', 'LOSE A TURN'); snd('lose'); host(vb(p.name, 'loses', 'lose') + ' a turn.');
      if (!p.cpu) Kit.haptic('error');
      await wait(2000);
    }
    setCam('wide'); await wait(450);
    ui.busy = false; proceed();
  }

  async function callLetter(L) {
    var me = S.cur, p = S.players[me], isV = VOW.indexOf(L) >= 0;
    if (S.used.indexOf(L) >= 0) return;
    if (!p.cpu) snapshot();
    ui.busy = true; ui.vowel = false;
    var free = S.wedge && S.wedge.t === 'free';
    var cost = isV && !free ? vowelCost(p) : 0;
    var per = isV ? 0 : free ? 500 : S.wedge.v;
    var idxs = letterIdx().filter(function (i) { return S.pz.text[i] === L; }), n = idxs.length;
    var hadCons = consLeft(), hadVow = vowelsLeft();
    var before = ui.disp[me].bank;
    p.bank += n * per - cost;
    S.used += L; idxs.forEach(function (i) { S.rev[i] = true; });
    ev(me + L + (isV ? '' : free ? 'f' : S.wedge.v));
    if (n * per >= 1000 && (!S.log.best || n * per > S.log.best.amt)) S.log.best = { p: me, L: L, n: n, v: per, amt: n * per, r: S.round };
    var done = n > 0 && blankIdx().length === 0, winInfo = null;
    if (done) winInfo = applyWin(me);
    else if (n === 0 && !free) nextPlayer();
    else { S.phase = 'turn'; S.wedge = null; }
    save();
    ui.hide = {}; idxs.forEach(function (i) { ui.hide[i] = 1; });
    paintBoard(); paintDeck();
    say(me, isV ? (cost ? 'Buy an ' + L : L + ', free') : L + ', please');
    snd('pop');
    await wait(p.cpu ? 550 : 350);
    if (cost) { floatMoney(me, -cost); tweenMoney(me, 'bank', before - cost, 500); snd('cash'); await wait(350); }
    if (n) {
      host(n === 1 ? 'There is one ' + L + '.' : 'There are ' + n + ' ' + L + "'s!");
      await revealLetters(idxs, { quick: n > 3 });
      if (per) {
        floatMoney(me, n * per); tweenMoney(me, 'bank', before - cost + n * per, 800); snd('cash');
        if (n * per >= 2500) setTimeout(function () { Kit.callout(money(n * per)); }, 200);
      }
      if (!p.cpu) Kit.haptic('success');
      paintKeys();
      await wait(700);
    } else {
      host('Sorry, no ' + L + '.'); snd('buzz'); paintKeys(); fx(shell.keys[L], 'shake', 450);
      if (!p.cpu) Kit.haptic('error');
      await wait(1400);
    }
    if (!done && hadCons && !consLeft()) { host('<b>Only vowels remain!</b> The wheel is off.'); Kit.toast('Only vowels remain'); await wait(1300); }
    else if (!done && hadVow && !vowelsLeft()) { host('<b>No more vowels!</b>'); Kit.toast('No more vowels'); await wait(1100); }
    if (winInfo) return winSequence(me, winInfo);
    ui.busy = false; proceed();
  }

  function applyWin(me) {
    var p = S.players[me], letters = letterIdx();
    var hidden = letters.filter(function (i) { return !S.rev[i]; });
    var amt = Math.max(1000, p.bank);
    fin(me, amt);
    S.log.solves.push({ p: me, text: S.pz.text, shown: letters.length - hidden.length, total: letters.length, r: S.round, amt: amt });
    p.total += amt; S.row[me] += amt;
    S.rows.push({ label: 'Round ' + S.round, sc: S.row.slice() }); S.row = [0, 0, 0];
    var info = { hidden: hidden, amt: amt, min: p.bank < 1000 };
    S.players.forEach(function (q) { q.bank = 0; });
    letters.forEach(function (i) { S.rev[i] = true; });
    S.phase = 'roundEnd'; S.wedge = null; S.cur = me; S.lastWin = { p: me, amt: amt };
    return info;
  }
  async function winSequence(me, info) {
    ui.busy = true; paintDeck();
    var p = S.players[me];
    if (info.hidden.length) await revealWave(info.hidden);
    snd('solve'); Kit.callout('SOLVED!');
    if (!p.cpu) { Kit.confetti({ count: 90 }); Kit.haptic('success'); }
    host(vb(p.name, 'wins', 'win') + ' round ' + S.round + (p.name === 'You' ? ' and bank <b>' : ' and banks <b>') + money(info.amt) + '</b>' + (info.min ? ' (the $1,000 minimum)' : '') + '!');
    await wait(800);
    tweenMoney(me, 'bank', info.amt, 400);
    await wait(500);
    S.players.forEach(function (q, j) { tweenMoney(j, 'bank', 0, 900); });
    tweenMoney(me, 'total', p.total, 1100);
    await wait(1300);
    ui.busy = false; proceed();
  }
  function nextRound() {
    if (S.phase !== 'roundEnd') return;
    if (S.round < S.opts.rounds) beginRound(S.round + 1); else toBonus();
  }
  function toBonus() {
    var mx = Math.max.apply(null, S.players.map(function (p) { return p.total; }));
    var top = [0, 1, 2].filter(function (i) { return S.players[i].total === mx; });
    if (top.length > 1) beginTossup(1000, top, 'tie'); else beginBonus(top[0]);
  }

  // ── Solving on the board (humans) ─────────────────────────────────────────
  function openSolve(who, ctx) {
    if (!S) return;
    var b = blankIdx();
    if (!b.length) {
      // Every letter is already showing (e.g. the bonus picks filled the puzzle):
      // tapping Solve simply solves it instead of opening an empty board.
      if (ui.clock) { ui.clock.done = true; }
      if (ctx === 'main') { snapshot(); run(function () { return humanSolved(who, true, null); }); }
      else if (ctx === 'tossup') run(function () { return tossupAnswer(who, true, null); });
      else run(function () { stopClock(); return bonusAnswer(true, null); });
      return;
    }
    ui.solve = { who: who, ctx: ctx, fill: {}, cur: b[0] };
    ui.vowel = false; setCam('wide');
    snd('pop');
    paintBoard(); paintPodiums(); paintDeck();
    host('Type the missing letters. Tap a tile to move the cursor.');
  }
  function typeFill(L) {
    var s = ui.solve; if (!s || ui.busy || s.cur == null) return;
    s.fill[s.cur] = L; snd('blip');
    var b = blankIdx(), k = b.indexOf(s.cur);
    if (k < b.length - 1) s.cur = b[k + 1];
    paintBoard(); paintDeck();
  }
  function backspace() {
    var p0 = S.players[S.cur];
    if (!ui.solve && S.phase === 'bonusPick' && p0 && !p0.cpu && !ui.busy && S.bonus.picks.length) {
      S.bonus.picks = S.bonus.picks.slice(0, -1); snd('blip'); save(); paintDeck(); return;
    }
    var s = ui.solve; if (!s || ui.busy) return;
    var b = blankIdx(), k = b.indexOf(s.cur);
    if (s.fill[s.cur]) delete s.fill[s.cur];
    else if (k > 0) { s.cur = b[k - 1]; delete s.fill[s.cur]; }
    snd('blip');
    paintBoard(); paintDeck();
  }
  function tileTap(k) {
    var s = ui.solve; if (!s || !S) return;
    var ci = lay().cell[k];
    if (ci >= 0 && isL(S.pz.text[ci]) && !S.rev[ci]) { s.cur = ci; paintBoard(); }
  }
  function cancelSolve() {
    var s = ui.solve; if (!s) return;
    if (s.ctx === 'tossup') { ui.solve = null; run(function () { return tossupAnswer(s.who, false, null); }); return; }
    ui.solve = null;
    if (s.ctx === 'bonus' && ui.clock) ui.clock.paused = false;
    renderAll();
  }
  function submitSolve() {
    var s = ui.solve; if (!s || ui.busy) return;
    var b = blankIdx();
    if (b.some(function (i) { return !s.fill[i]; })) { Kit.toast('Fill in every blank first'); return; }
    var ok = b.every(function (i) { return s.fill[i] === S.pz.text[i]; });
    if (s.ctx === 'main') snapshot();
    ui.solve = null;
    if (s.ctx === 'main') run(function () { return humanSolved(s.who, ok, s); });
    else if (s.ctx === 'tossup') run(function () { return tossupAnswer(s.who, ok, s); });
    else run(function () { return bonusAnswer(ok, s); });
  }
  async function humanSolved(me, ok, s) {
    ui.busy = true; paintDeck();
    if (ok) { var info = applyWin(me); save(); return winSequence(me, info); }
    ev(me + '?');
    await showWrong(s); snd('buzz'); Kit.haptic('error');
    var free = S.wedge && S.wedge.t === 'free';
    if (free) { S.phase = 'turn'; S.wedge = null; } else nextPlayer();
    save(); renderAll();
    host(free ? "That's not it, but Free Play means you keep your turn." : "Sorry, that's not it.");
    await wait(1400);
    ui.busy = false; proceed();
  }

  // ── Computer contestants (they only see what's on the board) ─────────────
  async function cpuTurn() {
    var me = S.cur, p = S.players[me];
    ui.busy = true; paintDeck();
    await wait(850);
    if (S.phase === 'call') return callLetter(cpuConsonant());
    var k = knownFrac(), b = blankIdx().length;
    var pk = b <= 1 ? 1 : b <= 2 ? 0.88 : Math.pow(clamp((k - 0.5) / 0.35, 0, 1), 1.6) * 0.9 + (b <= 4 ? 0.25 : 0);
    pk = clamp(pk * p.skill, 0, 1);
    if (consLeft() && p.bank < 1000 && b > 3) pk *= 0.45;
    if (Math.random() < pk) return cpuSolve();
    if (!consLeft()) {
      if (canBuy(p)) return callLetter(cpuVowel());
      return cpuSolve();
    }
    if (vowelsLeft() && p.bank >= 250) {
      var anyV = VOW.split('').some(function (v) { return S.used.indexOf(v) >= 0; });
      var want = 0.18 + (p.bank >= 1500 ? 0.17 : 0) + (!anyV && k > 0.15 ? 0.25 : 0);
      if (Math.random() < want) return callLetter(cpuVowel());
    }
    return doSpin(0.2 + Math.random() * 0.75);
  }
  function cpuConsonant() { return topPick(FREQ.split('').filter(function (c) { return S.used.indexOf(c) < 0; })); }
  function cpuVowel() { return topPick('EAOIU'.split('').filter(function (c) { return S.used.indexOf(c) < 0; })); }
  async function cpuSolve() {
    var me = S.cur, p = S.players[me], k = knownFrac(), b = blankIdx().length;
    var ok = Math.random() < (b <= 2 ? 0.98 : clamp(0.5 + 0.45 * k, 0, 0.97));
    say(me, "I'd like to solve!"); host(esc(p.name) + ' wants to solve…');
    await wait(1400);
    if (ok) { var info = applyWin(me); save(); return winSequence(me, info); }
    ev(me + '?'); snd('buzz'); say(me, 'Hmm… no?'); fx(shell.board, 'shake', 500);
    host("That's not it. " + esc(p.name) + "'s turn is over.");
    nextPlayer(); save();
    await wait(1500);
    ui.busy = false; proceed();
  }

  // ── Toss-ups ──────────────────────────────────────────────────────────────
  function beginTossup(prize, elig, purpose) {
    epoch++; undoStack = [];
    newPuzzle(pickPuzzle()); track(purpose === 'tie' ? 'tb' : 'tu', prize);
    S.tu = { prize: prize, elig: elig, purpose: purpose, order: shuffle(letterIdx()), step: 0, locked: [],
      thr: S.players.map(function (p) { return 0.45 + Math.random() * 0.35; }) };
    S.phase = 'tossup'; S.cur = -1; S.wedge = null; S.next = null; save();
    run(async function () {
      ui.busy = true; ui.blank = true; setCam('wide'); renderAll();
      host(purpose === 'tie' ? "It's a tie! A toss-up decides who plays the Bonus Round." : 'Toss-up! Letters will pop up one at a time.');
      await titleCard(purpose === 'tie' ? 'Tiebreaker' : 'Toss-up', money(prize));
      await boardIntro();
      ui.busy = false; proceed();
    });
  }
  function tuOut(i) { return S.tu.locked.indexOf(i) >= 0 || S.tu.elig.indexOf(i) < 0; }
  async function tossupLoop() {
    var tu = S.tu;
    while (S.phase === 'tossup') {
      if (tu.step >= tu.order.length) {
        await wait(1600);
        var cs = tu.elig.filter(function (i) { return S.players[i].cpu && !tuOut(i); });
        if (cs.length) return cpuBuzz(cs[rnd(cs.length)], true);
        await wait(3500);
        return tossupNobody();
      }
      await wait(1000);
      var i = tu.order[tu.step++]; S.rev[i] = true; save();
      var t = tileOf(i); t.textContent = S.pz.text[i]; t.className = 'tile on rev pop'; snd('blip');
      var k = knownFrac();
      var ready = tu.elig.filter(function (j) { return S.players[j].cpu && !tuOut(j) && k >= tu.thr[j]; });
      if (ready.length) { await wait(250 + Math.random() * 650); return cpuBuzz(ready[rnd(ready.length)], false); }
    }
  }
  async function cpuBuzz(i, sure) {
    ui.busy = true; S.cur = i;
    snd('buzzin'); say(i, 'Buzz!'); host(vb(S.players[i].name, 'buzzes', 'buzz') + ' in…');
    paintPodiums(); paintDeck();
    await wait(1200);
    var ok = sure || Math.random() < clamp(0.35 + knownFrac() * 0.7, 0, 0.97);
    if (ok) return tossupWon(i);
    say(i, 'Is it…?'); await wait(800);
    return tossupAnswer(i, false, null);
  }
  function humanBuzz(i) {
    if (!S || S.phase !== 'tossup' || ui.solve || ui.busy || tuOut(i)) return;
    epoch++;                       // stops the letters
    snd('buzzin'); Kit.haptic('medium'); S.cur = i; say(i, 'Buzz!');
    openSolve(i, 'tossup');
  }
  async function tossupAnswer(i, ok, s) {
    if (ok) return tossupWon(i);
    ui.busy = true; paintDeck();
    ev(i + '?');
    if (s) await showWrong(s);
    snd('buzz'); host("No, that's not it. " + vb(S.players[i].name, 'is', 'are') + ' out of this toss-up.');
    S.tu.locked.push(i); S.cur = -1; save();
    renderAll(); ui.busy = true; paintDeck();
    await wait(1300);
    ui.busy = false;
    if (S.tu.elig.every(tuOut)) return tossupNobody();
    paintPodiums(); paintDeck(); host(hostText());
    return tossupLoop();
  }
  async function tossupWon(i) {
    var tu = S.tu, p = S.players[i];
    var hidden = blankIdx();
    fin(i, tu.prize);
    p.total += tu.prize; p.tu = (p.tu || 0) + 1;
    if (tu.purpose === 'tie') S.rows.push({ label: 'Tiebreak', sc: S.players.map(function (q, j) { return j === i ? tu.prize : 0; }) });
    else S.row[i] += tu.prize;
    hidden.forEach(function (k) { S.rev[k] = true; });
    S.next = { fn: tu.purpose === 'tie' ? 'bonus' : 'main', who: i };
    S.cur = i; S.phase = 'tuwon'; save();
    ui.busy = true; paintPodiums(); paintDeck();
    await revealWave(hidden);
    snd('solve'); say(i, 'Got it!'); Kit.callout(money(tu.prize));
    host(vb(p.name, 'wins', 'win') + ' the toss-up: <b>' + money(tu.prize) + '</b>!');
    tweenMoney(i, 'total', p.total, 1000);
    if (!p.cpu) { Kit.confetti({ count: 60 }); Kit.haptic('success'); }
    await wait(2400);
    ui.busy = false; continueAfterTossup();
  }
  async function tossupNobody() {
    ui.busy = true;
    var tu = S.tu, hidden = blankIdx();
    fin(-1, 0);
    hidden.forEach(function (k) { S.rev[k] = true; });
    S.next = tu.purpose === 'tie' ? { fn: 'tie', elig: tu.elig } : { fn: 'main', who: (S.round - 1) % 3 };
    S.phase = 'tuwon'; S.cur = -1; save();
    paintPodiums(); paintDeck();
    await revealWave(hidden);
    snd('lose'); host('Nobody got that one.');
    await wait(2200);
    ui.busy = false; continueAfterTossup();
  }
  function continueAfterTossup() {
    var n = S.next || { fn: 'main', who: 0 };
    if (n.fn === 'bonus') beginBonus(n.who);
    else if (n.fn === 'tie') beginTossup(1000, n.elig, 'tie');
    else beginMain(n.who);
  }

  // ── Bonus Round ───────────────────────────────────────────────────────────
  function beginBonus(who) {
    epoch++; undoStack = []; stopClock();
    newPuzzle(pickPuzzle(bonusOK)); track('b');
    S.bonus = { who: who, env: null, picks: '', solved: null };
    S.cur = who; S.phase = 'bonusIntro'; S.wedge = null; S.tu = null; S.next = null; save();
    Wheel.setWedges(ENV_WEDGES);
    run(async function () {
      ui.busy = true; ui.blank = true; setCam('wide'); renderAll();
      await titleCard('Bonus Round', S.players[who].name);
      await boardIntro();
      ui.busy = false; proceed();
    });
  }
  async function bonusSpin(power, w0) {
    ui.busy = true; paintDeck(); setCam('wheel');
    host(vb(S.players[S.cur].name, 'spins', 'spin') + ' for an envelope…');
    await wait(300);
    await Wheel.spin(w0 || omegaFor(power));
    S.angle = Wheel.angle();
    var R = 'RSTLNE', idxs = letterIdx().filter(function (i) { return R.indexOf(S.pz.text[i]) >= 0; });
    S.bonus.env = wpick(ENVELOPES); S.used = R; idxs.forEach(function (i) { S.rev[i] = true; });
    S.phase = 'bonusPick'; save();
    readout('Sealed envelope'); snd('chime'); host("The envelope stays sealed until the end.");
    await wait(1600);
    setCam('wide'); await wait(500);
    host('Here come R, S, T, L, N and E…');
    if (idxs.length) await revealLetters(idxs, { together: true });
    ui.busy = false; proceed();
  }
  function bonusPickKey(L) {
    var b = S.bonus, pk = b.picks, isV = VOW.indexOf(L) >= 0;
    var nv = pk.split('').filter(function (c) { return VOW.indexOf(c) >= 0; }).length, nc = pk.length - nv;
    if (S.used.indexOf(L) >= 0 || pk.indexOf(L) >= 0) return;
    if (isV ? nv >= 1 : nc >= 3) { Kit.toast(isV ? 'Just one vowel' : 'Three consonants max'); return; }
    b.picks += L; snd('pop'); say(S.cur, L); save(); paintDeck();
    if (b.picks.length === 4) run(bonusRevealPicks);
  }
  async function cpuBonusPicks() {
    ui.busy = true; paintDeck();
    var b = S.bonus;
    while (b.picks.length < 4) {
      await wait(800);
      var nc = b.picks.split('').filter(function (c) { return VOW.indexOf(c) < 0; }).length;
      var pool = (nc < 3 ? 'CDMGHPBFKWY' : 'AOIU').split('').filter(function (c) { return b.picks.indexOf(c) < 0 && S.used.indexOf(c) < 0; });
      var L = pool[Math.random() < 0.6 ? 0 : rnd(Math.min(3, pool.length))];
      b.picks += L; save(); snd('pop'); say(S.cur, L); paintDeck();
    }
    await wait(700);
    return bonusRevealPicks();
  }
  async function bonusRevealPicks() {
    ui.busy = true; paintDeck();
    var pk = S.bonus.picks;
    var idxs = letterIdx().filter(function (i) { return pk.indexOf(S.pz.text[i]) >= 0 && !S.rev[i]; });
    S.used += pk; idxs.forEach(function (i) { S.rev[i] = true; }); S.phase = 'bonusReady'; save();
    say(S.cur, pk.split('').join(', '));
    host(idxs.length ? "Let's see…" : 'None of those are in the puzzle!');
    await wait(700);
    if (idxs.length) await revealLetters(idxs, { together: true }); else { snd('buzz'); await wait(900); }
    ui.busy = false;
    // The picked letters finished the puzzle: that's a win, no clock needed
    if (!blankIdx().length) { host('The letters filled the whole puzzle!'); await wait(900); return bonusEnd(true); }
    proceed();
  }
  function stopClock() { if (ui.clock) ui.clock.done = true; ui.clock = null; ui.clockEl = null; }
  function startClock(plan) {
    if (ui.clock) return;
    var c = ui.clock = { left: S.opts.clock * 1000, paused: false, done: false };
    paintDeck(); host(hostText()); snd('pop');
    run(async function () {
      var elapsed = 0, lastSec = Math.ceil(c.left / 1000);
      while (!c.done) {
        await wait(100);
        if (c.done) return;
        if (c.paused) { paintClock(); continue; }
        c.left -= 100; elapsed += 100; paintClock();
        var sec = Math.ceil(c.left / 1000); if (sec !== lastSec) { lastSec = sec; snd('tick'); }
        if (plan && plan.ok && elapsed >= plan.at) { c.done = true; say(S.cur, 'I know it!'); await wait(700); return bonusEnd(true); }
        if (c.left <= 0) { c.done = true; ui.solve = null; return bonusEnd(false); }
      }
    });
  }
  async function cpuBonus() {
    var p = S.players[S.cur];
    ui.busy = true; paintDeck(); await wait(1000);
    var chance = clamp((knownFrac() - 0.2) * 1.6 * p.skill, 0.08, 0.92);
    startClock({ ok: Math.random() < chance, at: (1.5 + Math.random() * (S.opts.clock - 2.5)) * 1000 });
  }
  async function bonusAnswer(ok, s) {
    if (ok) return bonusEnd(true);
    ev(S.cur + '?');
    ui.busy = true; paintDeck();
    await showWrong(s); snd('buzz');
    ui.busy = false;
    if (ui.clock && ui.clock.left > 0) { ui.clock.paused = false; renderAll(); host("Not that. <b>Keep going!</b>"); }
    else bonusEnd(false);
  }
  async function bonusEnd(ok) {
    if (!S || S.phase !== 'bonusReady') return;
    ui.solve = null;
    if (ui.clock) ui.clock.done = true;
    ui.busy = true;
    var b = S.bonus, p = S.players[b.who], hidden = blankIdx();
    fin(ok ? b.who : -1, ok ? b.env : 0);
    b.solved = ok; if (ok) p.total += b.env;
    S.rows.push({ label: 'Bonus', sc: S.players.map(function (q, j) { return j === b.who && ok ? b.env : 0; }) });
    hidden.forEach(function (i) { S.rev[i] = true; });
    S.phase = 'over';
    recordGame();
    paintDeck(); paintPodiums();
    if (!ok) { snd('horn'); host("Time's up!"); }
    await revealWave(hidden);
    if (ok) { snd('solve'); Kit.callout('SOLVED!'); host(vb(p.name, 'solves', 'solve') + ' the Bonus Round!'); }
    else host('The answer was <b>' + esc(S.pz.text) + '</b>.');
    await wait(1000);
    await openEnvelope(b.env, ok, p);
    if (ok) { ui.disp[b.who].total = p.total - b.env; tweenMoney(b.who, 'total', p.total, 1000); }
    stopClock(); ui.busy = false; paintDeck(); host(hostText());
    showResults();
  }
  function openEnvelope(env, ok, p) {
    var o = el('div', { class: 'envo' }, [
      el('div', { class: 'lab', text: p.name + (ok ? ' won…' : ' would have won…') }),
      el('div', { class: 'env' }, [el('div', { class: 'bk' }), el('div', { class: 'note', text: money(env) }), el('div', { class: 'front' }), el('div', { class: 'flap' })])
    ]);
    document.body.appendChild(o);
    function close() { o.classList.remove('show'); setTimeout(function () { o.remove(); }, 350); }
    o.addEventListener('click', close);
    requestAnimationFrame(function () { requestAnimationFrame(function () { o.classList.add('show'); }); });
    setTimeout(function () { o.classList.add('open'); snd(ok ? 'cash' : 'pop'); }, 700 * SPD);
    setTimeout(function () { if (ok) snd('chime'); }, 1500 * SPD);
    setTimeout(close, 4200 * SPD + 100);
    return new Promise(function (res) { setTimeout(res, 4500 * SPD + 150); });
  }

  // ── End of game: history + results ───────────────────────────────────────
  function highlights() {
    var P = S.players, L = S.log, out = [];
    var bks = L.bk.filter(function (b) { return b.amt > 0; }).sort(function (a, b) { return b.amt - a.amt; });
    if (bks[0]) out.push(P[bks[0].p].name + ' hit BANKRUPT with ' + money(bks[0].amt) + ' in round ' + bks[0].r);
    var sv = L.solves.filter(function (s) { return s.shown < s.total; }).sort(function (a, b) { return a.shown / a.total - b.shown / b.total; });
    if (sv[0]) out.push(P[sv[0].p].name + " solved '" + sv[0].text + "' with " + (sv[0].shown === 0 ? 'no letters' : sv[0].shown === 1 ? 'only 1 letter' : sv[0].shown + ' letters') + ' showing');
    var big = L.solves.slice().sort(function (a, b) { return b.amt - a.amt; })[0];
    if (big && big.amt >= 5000) out.push(P[big.p].name + ' banked ' + money(big.amt) + ' in round ' + big.r);
    if (L.best && L.best.n >= 2 && L.best.amt >= 1500) out.push(P[L.best.p].name + ' called ' + L.best.n + ' ' + L.best.L + "'s on " + money(L.best.v) + ' for ' + money(L.best.amt));
    P.forEach(function (p) { if (p.tu >= 2) out.push(p.name + ' won ' + p.tu + ' toss-ups'); });
    var b = S.bonus;
    if (b && b.env) out.push(b.solved ? 'Bonus round: ' + P[b.who].name + " solved '" + S.pz.text + "' and won a " + money(b.env) + ' envelope'
      : 'Bonus round: ' + P[b.who].name + " missed '" + S.pz.text + "' (a " + money(b.env) + ' envelope)');
    return out.slice(0, 6);
  }
  function recordGame() {
    var P = S.players;
    var ranked = P.slice().sort(function (a, b) { return b.total - a.total; });
    var tie = ranked[1] && ranked[1].total === ranked[0].total;
    Kit.record(HKEY, {
      started: S.started, mode: (S.mode === 'cpu' ? 'vs Computer' : 'Family game') + ' · ' + S.opts.rounds + ' rounds',
      players: P.map(function (p) { return { name: p.name, score: p.total, cpu: p.cpu }; }),
      winner: tie ? null : ranked[0].name,
      rounds: { labels: S.rows.map(function (r) { return r.label; }), scores: S.rows.map(function (r) { return r.sc; }) },
      highlights: highlights(),
      detail: { pz: (S.log.pz || []).filter(function (z) { return z.m; }), b: S.bonus ? { w: S.bonus.who, env: S.bonus.env, pk: S.bonus.picks, ok: !!S.bonus.solved } : null },
      summary: (tie ? 'Tie' : ranked[0].name + ' won') + ' · ' + money(ranked[0].total),
      badge: money(ranked[0].total)
    });
    clearSave();
  }
  function showResults() {
    if (!S) return;
    var rank = S.players.map(function (p, i) { return { name: p.name, score: money(p.total), color: PODS[i].c, cpu: p.cpu, t: p.total }; })
      .sort(function (a, b) { return b.t - a.t; });
    var tie = rank[1].t === rank[0].t, cfg = S.cfg;
    Kit.win({
      title: tie ? "It's a tie!" : rank[0].name === 'You' ? 'You win!' : rank[0].name + ' wins!',
      sub: money(rank[0].t) + ' in cash and prizes',
      rank: rank, lose: S.mode === 'cpu' && rank[0].cpu,
      again: function () { start(cfg); },
      extra: [{ label: 'Change players', onClick: showSetup }]
    });
  }

  // ── Input ─────────────────────────────────────────────────────────────────
  function pressKey(L) {
    if (!S || !shell) return;
    if (ui.solve) return typeFill(L);
    if (ui.busy) return;
    var p = S.players[S.cur]; if (!p || p.cpu) return;
    var isV = VOW.indexOf(L) >= 0;
    if (S.phase === 'bonusPick') return bonusPickKey(L);
    if (S.used.indexOf(L) >= 0) return;
    if (S.phase === 'call') {
      if (isV && S.wedge.t !== 'free') { Kit.toast('Call a consonant. Vowels are bought before you spin.'); return; }
      run(function () { return callLetter(L); }); return;
    }
    if (S.phase === 'turn' && isV) {
      if (!canBuy(p)) { Kit.toast(vowelsLeft() ? 'You need $250 to buy a vowel' : 'No more vowels'); return; }
      run(function () { return callLetter(L); });
    }
  }
  document.addEventListener('keydown', function (e) {
    if (!S || !shell || e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.querySelector('.k-scrim, .k-win') || (e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) return;
    var k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
    if (/^[A-Z]$/.test(k)) { e.preventDefault(); pressKey(k); }
    else if (k === 'Backspace' && ui.solve) { e.preventDefault(); backspace(); }
    else if (k === 'Enter' && ui.solve) { e.preventDefault(); submitSolve(); }
    else if (k === 'Escape' && ui.solve) { cancelSolve(); }
    else if (k === ' ') {
      e.preventDefault();
      var m = canFlick();
      if (m && !e.repeat && !hold.on) holdStart(function (pw) { if (canFlick() !== m) return; run(function () { return m === 'main' ? doSpin(pw) : bonusSpin(pw); }); });
    }
  });
  document.addEventListener('keyup', function (e) { if (e.key === ' ' && hold.on) { e.preventDefault(); holdEnd(false); } });

  function undo() {
    if (!S || !undoStack.length) {
      Kit.toast(S && S.phase.indexOf('bonus') === 0 ? 'Nothing to undo in the Bonus Round' : "Nothing to undo. Spins can't be taken back.");
      return;
    }
    epoch++; stopClock();
    ui.solve = null; ui.vowel = false; ui.busy = false; ui.blank = false;
    S = JSON.parse(undoStack.pop()); save();
    Wheel.setWedges(S.phase.indexOf('bonus') === 0 ? ENV_WEDGES : wedgesFor(S.round)); Wheel.setAngle(S.angle);
    setCam('wide'); snd('pop'); Kit.toast('Took back your last move');
    proceed();
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved && saved.players && saved.pz && saved.phase && saved.phase !== 'over' && saved.phase !== 'intro') {
    S = saved; buildShell();
    Wheel.setWedges(S.phase.indexOf('bonus') === 0 ? ENV_WEDGES : wedgesFor(S.round));
    Wheel.setAngle(S.angle);
    proceed();
  } else showSetup();

  // Test hook: run one spin headlessly with the same physics the wheel uses
  window.__wofSim = function (o) {
    o = o || {};
    var sm = makeSim(), th0 = o.th0 != null ? o.th0 : Math.random() * Math.PI * 2, w0 = o.w0 || omegaFor(o.power), hits = 0, maxB = 0, settled = false;
    sm.s.th = th0; sm.s.om = w0;
    while (sm.s.t < SIM_CAP) { if (sm.step(SIM_H, function () { hits++; })) { settled = true; break; } if (Math.abs(sm.s.b) > maxB) maxB = Math.abs(sm.s.b); }
    return { idx: sm.index(), t: sm.s.t, gap: sm.pegGap(), rot: (sm.s.th - th0) / (Math.PI * 2), settled: settled, touch: sm.s.touch, hits: hits, maxB: maxB, w0: w0 };
  };
  window.__wofSim.params = { W_MIN: W_MIN, W_MAX: W_MAX, H: SIM_H, wedgeHalf: Math.PI / 24 };
  window.__wof = { wheel: Wheel, state: function () { return S; }, layout: layoutPuzzle, puzzles: PUZZLES, bonusOK: bonusOK };
})();
</script>

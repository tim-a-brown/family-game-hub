<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Frequent Players</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<script src="../players.js"></script>
<style>
body{background:radial-gradient(700px 460px at 50% -8%, rgba(74,222,128,.10), transparent 62%), var(--bg);}
.wrap{max-width:520px;margin:0 auto;}
.hero{text-align:center;margin-bottom:22px;padding:8px 10px 0;}
.hero-icon{width:68px;height:68px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;font-size:2rem;
  background:linear-gradient(145deg,rgba(74,222,128,.25),rgba(74,222,128,.08));border:1px solid rgba(74,222,128,.3);}
.hero-title{font-family:var(--display);font-size:1.8rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;}
.hero-sub{font-size:.92rem;color:var(--text-2);line-height:1.5;max-width:340px;margin:0 auto;}

.sec-lbl{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:0 4px 8px;}
.add-row{display:flex;gap:8px;margin-bottom:24px;}
.add-input{flex:1;min-width:0;}
.add-btn{flex:none;min-height:50px;padding:0 20px;}

.list-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.list-empty{text-align:center;padding:36px 20px;color:var(--text-3);font-size:.95rem;line-height:1.5;}
.list-empty .empty-icon{font-size:2.4rem;margin-bottom:10px;}

.player-row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 8px 8px 14px;animation:gn-fade .2s ease both;}
.player-row + .player-row{border-top:1px solid var(--line);}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;color:#0b0d12;}
.player-name{flex:1;min-width:0;font-size:1.02rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-edit{flex:1;min-width:0;min-height:44px !important;padding:8px 12px !important;}
.row-btn{
  all:unset;cursor:pointer;box-sizing:border-box;flex:none;
  width:40px;height:40px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:background .12s,transform .1s;
}
.row-btn svg{width:18px;height:18px;}
.row-btn:active{transform:scale(.92);background:var(--surface-3);}
.row-btn.danger{color:var(--red);}
.row-btn.danger:active{background:rgba(248,113,113,.15);}
.row-btn.primary{background:rgba(245,200,66,.15);color:var(--gold);}

.footer-actions{display:flex;justify-content:center;margin-top:18px;}
.footer-actions .btn{min-width:200px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a>
  <span class="nav-title">Players</span>
</nav>
<div class="page">
<div class="wrap">

  <div class="hero">
    <div class="hero-icon">👥</div>
    <div class="hero-title">Frequent Players</div>
    <div class="hero-sub">Names you play with often appear as quick-pick chips in any game that asks for players.</div>
  </div>

  <div class="sec-lbl">Add a player</div>
  <div class="add-row">
    <input class="input add-input" id="add-input" type="text" maxlength="24" enterkeyhint="done"
           placeholder="e.g. Jamie" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn btn-gold add-btn" id="add-btn" disabled>Add</button>
  </div>

  <div class="sec-lbl"><span>Players</span><span id="count-lbl"></span></div>
  <div class="list-card" id="list-card"></div>

  <div class="footer-actions" id="footer-actions"></div>

</div>
</div>

<script>
'use strict';

const addInput = document.getElementById('add-input');
const addBtn   = document.getElementById('add-btn');
const listCard = document.getElementById('list-card');
const footerA  = document.getElementById('footer-actions');

let editingLower = null; // lowercase name being edited

function showToast(msg){
  if(window.GN) GN.toast(msg);
}
const haptic = k => { try{ window.GN && GN.haptic(k); }catch(e){} };
function askConfirm(msg, opts){
  return (window.GN && GN.confirm) ? GN.confirm(msg, opts) : Promise.resolve(window.confirm(msg));
}
const AV_COLORS = ['#f5c842','#60a5fa','#f87171','#4ade80','#c084fc','#fb923c','#2dd4bf','#f472b6'];
function avatar(name){
  let h = 0; for(const ch of name.toLowerCase()) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const el = document.createElement('div');
  el.className = 'avatar';
  el.style.background = AV_COLORS[h % AV_COLORS.length];
  const w = name.trim().split(/\s+/);
  el.textContent = ((w[0]||'?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
  return el;
}
const IC_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const IC_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
const IC_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
const IC_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

function render(){
  const names = FrequentPlayers.list();
  listCard.innerHTML = '';
  footerA.innerHTML = '';
  document.getElementById('count-lbl').textContent = names.length ? names.length + (names.length===1?' player':' players') : '';

  if(!names.length){
    listCard.innerHTML = `
      <div class="list-empty">
        <div class="empty-icon">👋</div>
        No frequent players yet.<br>Add someone above to get started.
      </div>`;
    return;
  }

  names.forEach(name => {
    const row = document.createElement('div');
    row.className = 'player-row';
    const lower = name.toLowerCase();

    if(editingLower === lower){
      const input = document.createElement('input');
      input.className = 'input player-edit';
      row.appendChild(avatar(name));
      input.type = 'text';
      input.maxLength = 24;
      input.value = name;
      input.autocomplete = 'off';
      row.appendChild(input);

      const save = document.createElement('button');
      save.className = 'row-btn primary';
      save.title = 'Save';
      save.innerHTML = IC_OK; save.setAttribute('aria-label','Save');
      save.addEventListener('click', () => {
        const v = input.value.trim();
        if(v && v.toLowerCase() !== lower){
          FrequentPlayers.rename(name, v);
          showToast('Renamed to ' + v);
        } else if(v && v !== name){
          // Same name, different casing
          FrequentPlayers.rename(name, v);
        }
        editingLower = null;
        render();
      });

      const cancel = document.createElement('button');
      cancel.className = 'row-btn';
      cancel.title = 'Cancel';
      cancel.innerHTML = IC_X; cancel.setAttribute('aria-label','Cancel');
      cancel.addEventListener('click', () => {
        editingLower = null;
        render();
      });

      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') save.click();
        else if(e.key === 'Escape') cancel.click();
      });

      row.appendChild(save);
      row.appendChild(cancel);
      // Focus the input after it's in the DOM
      setTimeout(() => { input.focus(); input.select(); }, 0);
    } else {
      const nm = document.createElement('div');
      nm.className = 'player-name';
      nm.textContent = name;
      row.appendChild(avatar(name));
      row.appendChild(nm);

      const edit = document.createElement('button');
      edit.className = 'row-btn';
      edit.title = 'Edit';
      edit.innerHTML = IC_EDIT; edit.setAttribute('aria-label','Edit '+name);
      edit.addEventListener('click', () => {
        editingLower = lower;
        render();
      });

      const del = document.createElement('button');
      del.className = 'row-btn danger';
      del.title = 'Remove';
      del.innerHTML = IC_DEL; del.setAttribute('aria-label','Remove '+name);
      del.addEventListener('click', async () => {
        if(await askConfirm('Remove "' + name + '" from your frequent players?', {ok:'Remove', danger:true})){
          haptic('medium');
          FrequentPlayers.remove(name);
          showToast('Removed ' + name);
          render();
        }
      });

      row.appendChild(edit);
      row.appendChild(del);
    }

    listCard.appendChild(row);
  });

  // Footer: clear-all when list is non-trivial
  if(names.length >= 2){
    const clearBtn = document.createElement('button');
    clearBtn.className = 'btn btn-danger btn-sm';
    clearBtn.textContent = 'Clear all players';
    clearBtn.addEventListener('click', async () => {
      if(await askConfirm('This cannot be undone.', {title:'Remove all ' + names.length + ' players?', ok:'Clear all', danger:true})){
        FrequentPlayers.clear();
        showToast('All players cleared');
        render();
      }
    });
    footerA.appendChild(clearBtn);
  }
}

addInput.addEventListener('input', () => {
  addBtn.disabled = !addInput.value.trim();
});

function doAdd(){
  const v = addInput.value.trim();
  if(!v) return;
  FrequentPlayers.add(v);
  haptic('success');
  showToast('Added ' + v);
  addInput.value = '';
  addBtn.disabled = true;
  addInput.focus();
  render();
}

addBtn.addEventListener('click', doAdd);
addInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !addBtn.disabled) doAdd();
});

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamisado</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="kamisado-core.js"></script>
<style>
.km-col{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.km-credit{margin:-6px 0 2px;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-3);}
/* the eight inks, shared by the board, the jewels and the room */
:root{--k0:#dd7a26;--k1:#2a5fb5;--k2:#6a3c9e;--k3:#d0628e;--k4:#e3b52f;--k5:#b52d2b;--k6:#2f8a4b;--k7:#76462a;}

/* A player's plate: their tower, their name and whose turn, their points, and the tower that must move */
.pbar{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px 6px 10px;border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s,background .2s;}
.pbar.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 18%,transparent);}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;}
.pbar .nm{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.pbar .nm .ico{width:15px;height:15px;color:var(--text-3);flex:none;}
.pbar .sub{font-size:.72rem;font-weight:700;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbar.on .sub{color:var(--lit-ink);}
.pbar .pts{display:flex;flex-direction:column;align-items:flex-end;flex:none;line-height:1.05;}
.pbar .pts b{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;}
.pbar .pts span{font-size:.66rem;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pbar.on .pts b{color:var(--lit-ink);}
.pbar .must{display:flex;align-items:center;gap:6px;flex:none;padding:3px 9px 3px 4px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px var(--gl-line);font-size:.72rem;font-weight:800;white-space:nowrap;}
.pbar .must .tok{--d:22px;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* A tower, seen from above: a turned piece of black lacquer or ivory, with a jewel of its color set in the top. A Sumo
   carries gold rings round its jewel, one for each rank, and a gold rim. */
.tok{--d:28px;width:var(--d);height:var(--d);border-radius:50%;flex:none;position:relative;}
.tw,.tok.b,.tok.w{border-radius:50%;}
.tw.b,.tok.b{background:radial-gradient(circle at 36% 30%,#5d6170 0,#2a2c33 26%,#111216 62%,#030304 100%);box-shadow:inset 0 -3px 5px rgba(0,0,0,.6),inset 0 2px 2px rgba(255,255,255,.12),0 3px 5px rgba(0,0,0,.55);}
.tw.w,.tok.w{background:radial-gradient(circle at 36% 30%,#fffdf6 0,#f2e8d2 30%,#d8c7a3 70%,#a48d63 100%);box-shadow:inset 0 -3px 5px rgba(90,60,20,.35),inset 0 2px 2px rgba(255,255,255,.7),0 3px 5px rgba(0,0,0,.55);}
.tok .jw{position:absolute;inset:28%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),var(--jc) 38%,color-mix(in srgb,var(--jc) 60%,#000) 100%);}
.tw{position:absolute;width:9.4%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:2;transition:left .38s cubic-bezier(.3,.7,.25,1),top .38s cubic-bezier(.3,.7,.25,1),opacity .3s;}
.tw::before{content:"";position:absolute;inset:11%;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1),inset 0 3px 4px rgba(0,0,0,.35);}
.tw.w::before{box-shadow:inset 0 0 0 1.5px rgba(120,90,40,.3),inset 0 3px 4px rgba(120,90,40,.18);}
.tw .jw{position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.8) 0,var(--jc) 34%,color-mix(in srgb,var(--jc) 55%,#000) 100%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.4),0 0 0 1.5px rgba(0,0,0,.35);}
.tw.r1 .jw,.tok.r1 .jw{box-shadow:inset 0 -2px 3px rgba(0,0,0,.4),0 0 0 2px #1a1206,0 0 0 4px #f2c94c;}
.tw.r2 .jw,.tok.r2 .jw{inset:31%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.4),0 0 0 2px #1a1206,0 0 0 4px #f2c94c,0 0 0 6px #1a1206,0 0 0 8px #f2c94c;}
.tw.r3 .jw,.tok.r3 .jw,.tw.r4 .jw{inset:34%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.4),0 0 0 2px #1a1206,0 0 0 4px #f2c94c,0 0 0 6px #1a1206,0 0 0 8px #f2c94c,0 0 0 10px #1a1206,0 0 0 12px #f2c94c;}
.tw.r1,.tw.r2,.tw.r3,.tw.r4{box-shadow:inset 0 -3px 5px rgba(0,0,0,.5),0 0 0 2.5px #d9a93a,0 4px 7px rgba(0,0,0,.6);}
.tw .rkn{position:absolute;right:-8%;bottom:-8%;min-width:38%;height:38%;padding:0 3%;border-radius:999px;background:linear-gradient(#ffe08a,#c8901f);color:#2a1a02;font-weight:900;font-size:calc(var(--sq,40px) * .2);display:none;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.6);line-height:1;}
.tw.r2 .rkn,.tw.r3 .rkn,.tw.r4 .rkn{display:flex;}
.tw.must{z-index:3;animation:must 1.3s ease-in-out infinite;}
@keyframes must{0%,100%{filter:drop-shadow(0 0 3px var(--lit)) drop-shadow(0 0 8px var(--litg));}50%{filter:drop-shadow(0 0 6px #fff3c4) drop-shadow(0 0 16px var(--litg));}}
.tw.pick{cursor:pointer;}
.tw.sel{z-index:3;filter:drop-shadow(0 0 5px var(--lit)) drop-shadow(0 0 12px var(--litg));}
.tw.forced{z-index:3;}
.tw.forced::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:3px dashed var(--fc,#fff);animation:spin 6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.tw.danger::after{border-color:#ff5a3c;box-shadow:0 0 14px rgba(255,80,50,.7);}
.tw.blocked .bx{display:flex;}
.tw .bx{position:absolute;left:50%;top:-30%;transform:translateX(-50%);display:none;padding:1px 6px;border-radius:999px;background:rgba(150,30,20,.92);color:#ffe2d8;font-size:calc(var(--sq,40px) * .2);font-weight:800;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.6);}
.tw.shake{animation:shake .5s ease-in-out;}
@keyframes shake{20%,60%{transform:translate(-56%,-50%);}40%,80%{transform:translate(-44%,-50%);}}
.tw.shove{animation:shove .5s cubic-bezier(.3,.7,.3,1.4);}
@keyframes shove{40%{transform:translate(-50%,-50%) scale(1.14);}}
.tw.promo{animation:promo 1.1s var(--spring);}
@keyframes promo{0%{transform:translate(-50%,-50%) scale(1);}35%{transform:translate(-50%,-50%) scale(1.45) rotate(-12deg);}70%{transform:translate(-50%,-50%) scale(.95) rotate(4deg);}100%{transform:translate(-50%,-50%) scale(1);}}
.tw.ghost{opacity:.45;pointer-events:none;z-index:4;transition:none;}
.tw.prev{opacity:.6;}
.tw.win{z-index:4;animation:winp 1.4s ease-in-out infinite;}
@keyframes winp{0%,100%{filter:drop-shadow(0 0 4px var(--lit)) drop-shadow(0 0 14px var(--litg));}50%{filter:drop-shadow(0 0 8px #fff3c4) drop-shadow(0 0 28px var(--litg));}}

/* The board: eight inks lacquered on wood, in an ebony frame with a gold line */
.frame{position:relative;aspect-ratio:1;width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none;view-transition-name:km-board;}
.frame>svg.bsv{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));}
.frame .lay{position:absolute;inset:0;}
.frame svg.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.frame svg.fx2{z-index:5;}
/* where the tower can go: a dot on each square; gold where it wins, red where it hands the other player a way home,
   a ring where it leaves the other player's tower nowhere to go; a push is a chevron */
.dot{position:absolute;width:12.5%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:1;pointer-events:none;display:flex;align-items:center;justify-content:center;}
.dot::before{content:"";width:26%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 8px rgba(255,255,255,.4);}
.dot.danger::before{width:30%;background:#e8321b;box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(0,0,0,.4),0 0 12px rgba(255,90,60,.7);}
.dot.block::before{width:40%;background:transparent;box-shadow:inset 0 0 0 3px #fff,0 0 0 2px rgba(0,0,0,.45);}
.dot.win::before{width:46%;background:radial-gradient(circle,#fff6c9,#f2c94c 60%,#b98317);box-shadow:0 0 0 2px rgba(60,40,0,.55),0 0 16px var(--litg);}
.dot.lose::before{background:#3a0b05;box-shadow:0 0 0 2px #ff6b4f;}
.dot.push{z-index:3;}
.dot.push::before{display:none;}
.dot.push::after{content:"";width:34%;height:34%;border:solid #fff;border-width:0 5px 5px 0;transform:translateY(var(--py,20%)) rotate(var(--pr,225deg));filter:drop-shadow(0 0 3px rgba(0,0,0,.7));}
.dot.aim::before{box-shadow:0 0 0 3px var(--lit),0 0 16px var(--litg);}
.sqlit{position:absolute;width:11.5%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:0;border-radius:4px;box-shadow:inset 0 0 0 3px #ffe9a3,0 0 18px var(--litg);background:rgba(255,236,170,.22);animation:sqin .5s ease-out both;}
@keyframes sqin{from{opacity:0;transform:translate(-50%,-50%) scale(.6);}}
.lastf{position:absolute;width:11.5%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:0;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);}
.tag{position:absolute;transform:translate(-50%,-100%);z-index:6;pointer-events:none;padding:3px 9px;border-radius:999px;background:rgba(12,14,22,.9);box-shadow:0 0 0 1px var(--gl-line),0 3px 8px rgba(0,0,0,.5);font-size:.72rem;font-weight:800;white-space:nowrap;color:#fff;}
.tag.bad{background:rgba(120,22,12,.94);}
.tag.good{background:rgba(70,52,8,.94);color:#ffe9a3;}

.turn{margin:2px 0 0;min-height:34px;}
.acts{display:flex;gap:10px;justify-content:center;margin-top:2px;flex-wrap:wrap;}
.acts .btn{flex:1;max-width:200px;}
/* the Defender's choice between rounds: both set-ups side by side, each as the two home rows */
.fills{display:flex;gap:10px;width:100%;justify-content:center;}
.fill{flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px 9px;border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);cursor:pointer;color:inherit;font:inherit;border:0;}
.fill.on{background:color-mix(in srgb,var(--lit) 14%,transparent);box-shadow:inset 0 0 0 2px var(--lit),0 0 16px color-mix(in srgb,var(--lit) 25%,transparent);}
.fill b{font-size:.85rem;font-weight:800;}
.fill .rowp{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:100%;}
.fill .rowp span{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;}
.fill .rowp .tok{--d:78%;}
.fill .rowp .tok .jw{inset:24%;}

/* A layout for each shape (<html data-o>, set by the script, so a turn of the device glides inside Kit.glide) */
::view-transition-group(*){animation-duration:.45s;animation-timing-function:cubic-bezier(.22,1,.36,1);}
.km-col>.turn{view-transition-name:km-turn;}
.km-col>.acts{view-transition-name:km-acts;}
.km-col>.pbar.top{view-transition-name:km-top;}
.km-col>.pbar.bot{view-transition-name:km-bot;}
html[data-o=port] #app.stage.ipl{min-height:calc(100dvh - var(--bar));display:flex;flex-direction:column;justify-content:stretch;
  padding-left:8px;padding-right:8px;padding-bottom:calc(var(--safe-b) + 18px);}
html[data-o=port] .km-col{width:100%;gap:10px;flex:1 1 auto;justify-content:space-evenly;}
html[data-o=port] .km-col>.frame{width:min(100%,calc(100dvh - var(--bar) - 262px));align-self:center;}
@media (max-width:699px) and (min-height:740px){
  html[data-o=port] .pbar{padding:10px 14px;min-height:66px;gap:12px;}
  html[data-o=port] .pbar>.tok{--d:40px;}
  html[data-o=port] .pbar .nm{font-size:1.08rem;}
  html[data-o=port] .pbar .sub{font-size:.8rem;}
  html[data-o=port] .turn{font-size:1.05rem;}
}
@media (max-height:600px){ html[data-o=port] .km-col{gap:6px;} html[data-o=port] .pbar{min-height:44px;padding-top:4px;padding-bottom:4px;} html[data-o=port] .km-col>.frame{width:min(100%,calc(100dvh - var(--bar) - 222px));} html[data-o=port] .turn{min-height:24px;font-size:.9rem;} html[data-o=port] .acts .btn{min-height:40px;} html[data-o=port] .pbar .must{display:none;} }
@media (min-width:700px){
  html[data-o=port] #app.stage.ipl{max-width:none;padding-left:16px;padding-right:16px;}
  html[data-o=port] .km-col{max-width:800px;gap:12px;}
  html[data-o=port] .km-col>.frame{width:min(100%,calc(100dvh - var(--bar) - 300px));}
  html[data-o=port] .pbar{min-height:64px;padding:8px 16px 8px 12px;}
  html[data-o=port] .pbar .nm{font-size:1.1rem;}
  html[data-o=port] .pbar .sub{font-size:.85rem;}
  html[data-o=port] .pbar>.tok{--d:38px;}
}
/* Sideways: the players, whose turn and the buttons at the left to look at; the board, where the taps go, at the right */
html[data-o=land] #app.stage.ipl{max-width:none;padding:2px max(18px,env(safe-area-inset-right)) calc(var(--safe-b) + 8px) max(18px,env(safe-area-inset-left));}
html[data-o=land] .km-col{--lc:260px;--cg:clamp(16px,3vw,40px);--bh:calc(100dvh - var(--bar) - 12px - var(--safe-b));--bw:min(var(--bh),calc(100vw - 40px - var(--lc) - var(--cg)));
  max-width:none;height:var(--bw);display:grid;grid-template-columns:minmax(var(--lc),360px) var(--bw);
  grid-template-rows:max-content max-content minmax(0,1fr) max-content max-content;
  grid-template-areas:"t b" "s b" "a b" ". b" "p b";column-gap:var(--cg);row-gap:10px;justify-content:center;align-content:center;}
html[data-o=land] .km-col>.frame{grid-area:b;width:var(--bw);}
html[data-o=land] .km-col>.pbar.top{grid-area:t;}
html[data-o=land] .km-col>.pbar.bot{grid-area:p;}
html[data-o=land] .km-col>.turn{grid-area:s;justify-self:start;}
html[data-o=land] .km-col>.acts{grid-area:a;justify-content:flex-start;align-self:start;}
html[data-o=land] .km-col>.km-room{display:none;}
/* while the Defender chooses, the two set-ups need room under the board */
html[data-o=port] .km-col.rg>.frame{width:min(100%,calc(100dvh - var(--bar) - 392px));}
@media (min-width:700px){ html[data-o=port] .km-col.rg>.frame{width:min(100%,calc(100dvh - var(--bar) - 430px));} }
@media (max-height:600px){ html[data-o=port] .km-col.rg>.frame{width:min(100%,calc(100dvh - var(--bar) - 290px));} html[data-o=port] .km-col.rg .fill{padding:5px 6px;gap:3px;} html[data-o=port] .km-col.rg .turn{display:none;} }
html[data-o=land] .fill{padding:6px 8px;}
@media (min-height:600px){
  html[data-o=land] .km-col{--lc:300px;}
  html[data-o=land] .pbar{min-height:62px;}
  html[data-o=land] .pbar>.tok{--d:34px;}
}
@media (max-height:420px){ html[data-o=land] .km-col{row-gap:6px;--lc:240px;} html[data-o=land] .turn{min-height:26px;font-size:.92rem;} html[data-o=land] .pbar{min-height:44px;padding-top:3px;padding-bottom:3px;} html[data-o=land] .pbar .must{display:none;} html[data-o=land] .fill b{font-size:.78rem;} html[data-o=land] .fill{gap:3px;} }
.km-room{display:none;}

/* ── The desk: a window larger than a phone's or a tablet's (html.km-dk, set by deskPlan) ── */
html.km-dk #app.stage.ipl{max-width:none;padding:0;min-height:0;}
html.km-dk .km-col{justify-content:normal;position:fixed;left:var(--x0);top:var(--y0);width:var(--aw);height:var(--ah);max-width:none;margin:0;display:grid;gap:var(--g);
  grid-template-columns:var(--cols);grid-template-rows:max-content max-content max-content max-content minmax(0,1fr);grid-template-areas:var(--areas);}
html.km-dk .km-col>.frame{grid-area:b;width:var(--bw);align-self:center;justify-self:center;}
html.km-dk .km-col>.pbar.top{grid-area:t;}
html.km-dk .km-col>.pbar.bot{grid-area:p;}
html.km-dk .km-col>.turn{grid-area:s;justify-self:start;font-size:calc(1rem * var(--dk));}
html.km-dk .km-col>.acts{grid-area:a;justify-content:flex-start;}
html.km-dk .km-col>.km-room{grid-area:r;display:flex;flex-direction:column;gap:var(--g);min-height:0;overflow:hidden;view-transition-name:km-room;}
html.km-dk .km-room.row{flex-direction:row;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;}
html.km-dk .km-room.row>.pn{flex:1 1 calc(250px * var(--dk));min-width:0;}
html.km-dk .pbar{min-height:calc(60px * var(--dk));padding:calc(8px * var(--dk)) calc(14px * var(--dk));}
html.km-dk .pbar .nm{font-size:calc(1.05rem * var(--dk));}
html.km-dk .pbar .sub{font-size:calc(.82rem * var(--dk));}
html.km-dk .pbar>.tok{--d:calc(36px * var(--dk));}
html.km-dk .tag{font-size:calc(.78rem * var(--dk));}
.pn{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:18px;padding:calc(12px * var(--dk,1)) calc(14px * var(--dk,1));min-height:0;display:flex;flex-direction:column;font-size:calc(.9rem * var(--dk,1));flex:none;}
.pn h3{margin:0 0 8px;font-size:calc(.82rem * var(--dk,1));font-weight:800;color:var(--text-3);}
.pn .rows{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;}
.pn .ln{font-weight:700;line-height:1.35;}
.pn .ln+.ln{margin-top:6px;}
.pn .none{color:var(--text-3);font-weight:600;}
.mvr{display:grid;grid-template-columns:2.2em 1.25em 1fr auto;align-items:center;gap:8px;padding:3px 4px;border-radius:8px;font-variant-numeric:tabular-nums;}
.mvr .no{color:var(--text-3);font-weight:700;text-align:right;}
.mvr .tok{--d:1.2em;}
.mvr .nt{font-weight:700;white-space:nowrap;}
.mvr .tg{font-size:.8em;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap;}
.mvr .tg.x{background:rgba(255,122,89,.18);color:#ffb39f;}
.mvr .tg.f{background:color-mix(in srgb,var(--lit) 22%,transparent);color:var(--lit-ink);}
.mvr .tg.t{background:rgba(255,255,255,.1);color:var(--text-2);}
.mvr.now{background:color-mix(in srgb,var(--lit) 10%,transparent);}
.mvr.ps{opacity:.8;}
.scr{display:grid;grid-template-columns:1.4em 1fr auto;gap:4px 10px;align-items:center;}
.scr .tok{--d:1.3em;}
.scr .nmx{font-weight:700;}
.scr .p{font-weight:800;font-variant-numeric:tabular-nums;}
.scr .p small{font-weight:700;color:var(--text-3);}
.rdr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:5px 2px;border-top:1px solid var(--gl-line);}
.rdr .rn{font-weight:800;color:var(--text-3);}
.rdr .rt{font-weight:600;line-height:1.3;}
.sumo{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.sumo .tok{--d:calc(26px * var(--dk,1));}
.pgr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:4px 2px;border-top:1px solid var(--gl-line);}
.pgr:first-child{border-top:0;}
.pgr .w{font-weight:800;}
.pgr .sc{font-weight:700;color:var(--text-3);}
.pgr .dt{grid-column:1/-1;font-size:.82em;color:var(--text-3);font-weight:600;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), Core = window.KamisadoCore;

      for (var p = 1; p <= 16; p++) if (S.rk[p]) { any = true; sumo.appendChild(tok(Core.sideOf(p), Core.colorOf(p), S.rk[p])); }
      if (any) mp.appendChild(sumo);
      var rr = el('div', { class: 'rows' });
      S.rounds.slice().reverse().forEach(function (rd, j) {
        var n = S.rounds.length - j, wp = pl(rd.w);
        rr.appendChild(el('div', { class: 'rdr' }, [el('span', { class: 'rn', text: 'Round ' + n }), el('span', { class: 'rt', text: nameOf(wp) + (rd.why === 'deadlock' ? ' won by deadlock: ' : ' got home: ') + 'the ' + CN[Core.colorOf(rd.p)] + ' tower became ' + (rd.rk === 1 ? 'a Sumo' : 'a ' + rankName(rd.rk)) + ', ' + rd.pts + (rd.pts === 1 ? ' point.' : ' points.') })]));
      });
      if (S.rounds.length) mp.appendChild(rr);
      roomEl.appendChild(mp);
    }
    if (list.length) {
      var mv = el('section', { class: 'pn mvp' }, [el('h3', { text: S.match.target > 1 ? 'Round ' + S.match.round + ', move by move' : 'Moves so far' })]), rows = el('div', { class: 'rows' });
      list.slice().reverse().slice(0, 60).forEach(function (x, i) {
        if (x.pass) { rows.appendChild(el('div', { class: 'mvr ps' }, [el('span', { class: 'no', text: '' }), tok(x.side, x.k), el('span', { class: 'nt', text: 'Blocked' }), el('span', { class: 'tg x', text: '0 squares' })])); return; }
        var m = Core.parse(x.s);
        rows.appendChild(el('div', { class: 'mvr' + (i === 0 ? ' now' : '') }, [el('span', { class: 'no', text: x.n + '' }), tok(x.side, x.res.k, x.rk),
          el('span', { class: 'nt', text: Core.NAMES[m.f] + ' to ' + Core.NAMES[m.t] }),
          x.res.win ? el('span', { class: 'tg f', text: 'Home' }) : m.push ? el('span', { class: 'tg f', text: 'Push' }) : x.res.d >= 6 ? el('span', { class: 'tg t', text: x.res.d + ' squares' }) : el('span')]));
      });
      mv.appendChild(rows); roomEl.appendChild(mv);
    }
    var past = []; try { past = GameHistory.load(KEY).slice(0, 8); } catch (e) {}
    if (past.length) {
      var pg = el('section', { class: 'pn pgp' }, [el('h3', { text: 'Past games' })]), pr = el('div', { class: 'rows' });
      past.forEach(function (e) {
        var d = e.dt || e.detail || {};
        pr.appendChild(el('div', { class: 'pgr' }, [el('span', { class: 'w', text: e.winner ? e.winner.replace(/ \((Black|White)\)$/, '') + ' won' : 'Unfinished' }),
          el('span', { class: 'sc', text: d.pts ? d.pts[0] + ' to ' + d.pts[1] : '' }), el('span', { class: 'dt', text: Kit.fmtDate ? Kit.fmtDate(e._date || e.started) : '' })]));
      });
      pg.appendChild(pr); roomEl.appendChild(pg);
    }
    fitRoom();
  }
  // Too little room: whole rows go (past games down to two, the oldest moves down to three, the oldest rounds, then the
  // past games, then the moves), never a cut row.
  function fitRoom() {
    if (!roomEl) return;
    var mv = roomEl.querySelector('.mvp .rows'), pg = roomEl.querySelector('.pgp .rows'), rd = roomEl.querySelector('.mtp .rows'), guard = 0;
    function over() { return roomEl.scrollHeight > roomEl.clientHeight + 1 || [].some.call(roomEl.children, function (c) { return c.offsetTop + c.offsetHeight > roomEl.offsetTop + roomEl.clientHeight + 1; }); }
    while (over() && guard++ < 300) {
      if (pg && pg.children.length > 2) pg.removeChild(pg.lastChild);
      else if (mv && mv.children.length > 3) mv.removeChild(mv.lastChild);
      else if (rd && rd.children.length > 1) rd.removeChild(rd.lastChild);
      else if (pg && pg.parentNode.isConnected) { pg.parentNode.remove(); pg = null; }
      else if (mv && mv.children.length > 1) mv.removeChild(mv.lastChild);
      else if (mv && mv.parentNode.isConnected) { mv.parentNode.remove(); mv = null; }
      else if (rd && rd.isConnected) { rd.remove(); rd = null; }
      else break;
    }
  }

  // ── The desk (a window larger than a phone's or a tablet's) ──────────────
  function deviceShape(w, h) { var lo = Math.min(w, h), hi = Math.max(w, h); return (lo <= 480 && hi <= 1000) || (lo >= 620 && lo <= 840 && hi >= 900 && hi <= 1200); }
  var DK = null;
  function deskPlan() {
    var W = window.innerWidth, H = window.innerHeight;
    if (!S || deviceShape(W, H) || W < 640 || H < 500) return null;
    var gb = document.querySelector('.gbar'), top = (gb ? Math.round(gb.getBoundingClientRect().bottom) : 56) + 6;
    var g = Math.round(Math.max(14, Math.min(28, W / 90))), x0 = g, y0 = top, aw = W - 2 * g, ah = H - top - g;
    var dk = Math.max(1, Math.min(1.5, W / 1700, H / 1100));
    var side = Math.round(Math.max(320, Math.min(460, 320 * dk)));
    var CAP = 1500, bwWide = Math.min(CAP, ah, aw - side - g), bwTall = Math.min(CAP, aw, ah - 360 * dk - g);
    if (aw / ah > 1.2 || bwTall < 300) {
      var bw = Math.floor(bwWide), spare = aw - side - g - bw;
      if (spare >= side * .9 + g) {
        var rw = Math.min(spare - g, Math.round(side * 1.4));
        return { k: 'w2', dk: dk, x0: x0, y0: y0, aw: aw, ah: ah, g: g, bw: bw, cols: side + 'px ' + rw + 'px ' + bw + 'px', areas: '"t r b" "p r b" "s r b" "a r b" ". r b"' };
      }
      return { k: 'w1', dk: dk, x0: x0, y0: y0, aw: aw, ah: ah, g: g, bw: bw, cols: Math.max(side, aw - bw - g) + 'px ' + bw + 'px', areas: '"t b" "p b" "s b" "a b" "r b"' };
    }
    var bt = Math.floor(bwTall);
    return { k: 't', dk: dk, x0: x0, y0: y0, aw: aw, ah: ah, g: g, bw: bt, cols: side + 'px ' + (aw - side - g) + 'px', areas: '"b b" "t r" "p r" "s r" "a r" ". r"', rowsT: true };
  }
  function deskApply() {
    var P = deskPlan(), was = DK ? DK.k : null;
    DK = P;
    if (!P) { deskOff(); return; }
    R.classList.add('km-dk');
    var col = app.querySelector('.km-col'); if (!col) return;
    col.style.setProperty('--x0', P.x0 + 'px'); col.style.setProperty('--y0', P.y0 + 'px'); col.style.setProperty('--aw', P.aw + 'px'); col.style.setProperty('--ah', P.ah + 'px');
    col.style.setProperty('--g', P.g + 'px'); col.style.setProperty('--bw', P.bw + 'px'); col.style.setProperty('--cols', P.cols); col.style.setProperty('--areas', P.areas);
    col.style.setProperty('--dk', P.dk.toFixed(3));
    col.style.gridTemplateRows = P.rowsT ? (P.bw + 'px max-content max-content max-content max-content minmax(0,1fr)') : '';
    col.style.gridTemplateAreas = P.k === 't' ? P.areas : '';
    if (roomEl) roomEl.classList.toggle('row', P.k === 't');
    if (was !== P.k) setTimeout(paintRoom, 0);
  }
  function deskOff() {
    R.classList.remove('km-dk');
    var col = app.querySelector('.km-col');
    if (col) { ['--x0', '--y0', '--aw', '--ah', '--g', '--bw', '--cols', '--areas', '--dk'].forEach(function (k) { col.style.removeProperty(k); }); col.style.gridTemplateRows = ''; col.style.gridTemplateAreas = ''; }
    DK = null;
  }
  var rzT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rzT);
    rzT = setTimeout(function () {
      if (!S || !S.b || !frameEl) return;
      var o = shape(), was = DK ? DK.k : null, P = deskPlan();
      var go = function () { R.setAttribute('data-o', o); deskApply(); sizeVar(); paintAll(); };
      if (R.getAttribute('data-o') !== o || was !== (P ? P.k : null)) Kit.glide(go); else go();
    }, 60);
  });

  // ── The end ──────────────────────────────────────────────────────────────
  function highlights(w) {
    var hl = [];
    S.rounds.forEach(function (rd, i) {
      var p = pl(rd.w);
      hl.push((S.rounds.length > 1 ? 'Round ' + (i + 1) + ': ' : '') + (rd.why === 'deadlock' ? p.name + ' won by deadlock, and the ' + CN[Core.colorOf(rd.p)] + ' tower was promoted' : p.name + '’s ' + CN[Core.colorOf(rd.p)] + ' tower reached the home row') + (S.match.target > 1 ? ' and became ' + (rd.rk === 1 ? 'a Sumo' : 'a ' + rankName(rd.rk)) + ' for ' + rd.pts + (rd.pts === 1 ? ' point.' : ' points.') : '.'));
    });
    S.players.forEach(function (p) { var k = S.blocks[p.side]; if (k) hl.push(p.name + ' left the other player’s tower with nowhere to go ' + (k === 1 ? 'once.' : k + ' times.')); });
    S.players.forEach(function (p) { var k = S.pushes[p.side]; if (k) hl.push(p.name + ' made ' + (k === 1 ? 'a Sumo push.' : k + ' Sumo pushes.')); });
    S.players.forEach(function (p) { if (S.long[p.side] >= 6) hl.push(p.name + ' moved a tower ' + S.long[p.side] + ' squares in one move.'); });
    if (vsCpu()) hl.push('The computer played at ' + SKILL[S.level] + '.');
    return hl;
  }
  function detail() {
    return { target: S.match.target, pts: [S.match.pts[1], S.match.pts[2]], sides: S.players.map(function (p) { return tc(p.side); }).join(''), grid: Core.grid(S.b), rk: S.rk.slice(1).join(''),
      rounds: S.rounds.map(function (rd) { return { w: tc(rd.w), why: rd.why, c: Core.colorOf(rd.p), rk: rd.rk, pts: rd.pts, n: rd.n, ml: rd.ml, g0: rd.g0, k0: rd.k0, fill: rd.fill || '', first: tc(rd.first) }; }),
      blocks: [S.blocks[1], S.blocks[2]], pushes: [S.pushes[1], S.pushes[2]], n: S.n };
  }
  function finish() {
    S.over = true; clearSave(); paintAll();
    var w = pl(S.winner), l = pl(3 - S.winner), single = S.match.target === 1, rd = S.rounds[S.rounds.length - 1];
    Kit.record(KEY, {
      started: S.started, mode: vsCpu() ? 'vs Computer (' + SKILL[S.level] + ')' : 'Pass & play',
      players: S.players.map(function (p) { return { name: p.name + ' (' + colorName(p.side) + ')', score: S.match.pts[p.side], cpu: p.cpu }; }),
      winner: w.name + ' (' + colorName(w.side) + ')', highlights: highlights(w), detail: detail()
    });
    paintRoom();
    Kit.sfx('sparkle'); Kit.haptic('success');
    Kit.moment({ big: true, title: single ? (rd.why === 'deadlock' ? 'Deadlock' : 'Home!') : 'Match won', line: single ? (rd.why === 'deadlock' ? 'Nobody could move, and the deadlock goes against the player who caused it. ' + nameOf(w) + ' wins.' : nameOf(w) + '’s ' + CN[Core.colorOf(rd.p)] + ' tower reached the home row first.') : nameOf(w) + ' wins the match, ' + S.match.pts[w.side] + ' points to ' + S.match.pts[l.side] + '.', icon: 'trophy', pts: single ? '' : String(S.match.pts[w.side]) });
    setTimeout(function () {
      var lose = w.cpu;
      Kit.win({
        icon: lose ? 'bot' : 'trophy',
        title: lose ? w.name + ' wins this one' : w.name === 'You' ? 'You win!' : w.name + ' wins!',
        sub: (single ? (rd.why === 'deadlock' ? 'By deadlock' : 'A tower home') : MATCH[S.match.target] + ' · ' + S.rounds.length + ' rounds') + ' · ' + S.n + ' moves',
        rank: [w, l].map(function (p) { return { name: p.name, me: vsCpu() && !p.cpu, score: S.match.pts[p.side] + (S.match.pts[p.side] === 1 ? ' point' : ' points'), color: p.side === BLACK ? '#2a2a30' : '#efe5cf' }; }),
        lose: !!lose, again: function () { newGame(true); }, look: true,
        setup: function () { cancelThink(); clearSave(); showSetup(); }
      });
    }, 2800);
  }

  // ── Online (turnnet.js) ──────────────────────────────────────────────────
  // Seat 0 plays the color chosen in the setup in the first game; each new game at the table swaps colors.
  function netSeatOf(st, side) { return st.players[0].side === side ? 0 : 1; }
  function netOpts() {
    var o = { side: 'b', target: 1 }; try { var g = JSON.parse(localStorage.getItem('gn_setup_kamisado')); if (g && g.options) { if (g.options.side === 'w') o.side = 'w'; if (+g.options.target) o.target = +g.options.target; } } catch (e) {}
    return o;
  }
  function netStart(players, opts, last) {
    var s0 = last && last.players ? 3 - last.players[0].side : opts && opts.side === 'w' ? WHITE : BLACK;
    var st = Core.newGame({ target: (last && last.match && last.match.target) || (opts && opts.target) || 1 });
    st.mode = 'online'; st.level = 'normal'; st.players = players.map(function (p, i) { return { name: p.name, cpu: false, side: i === 0 ? s0 : 3 - s0 }; });
    st.wins = last && last.wins ? last.wins.slice() : [0, 0]; st.started = Date.now();
    return st;
  }
  function netApply(st, str) {
    if (st.over) return null;
    var side = st.turn, r = Core.play(st, str);
    if (!r) return null;
    if (st.over && st.winner) st.wins[netSeatOf(st, st.winner)]++;
    return { state: st, mv: { s: str, side: side, n: st.n, ph: st.phase } };
  }
  function netMove(str) { if (!S || S.over || LEFT || !NET.myTurn()) return; S.busy = true; AIM = null; paintAll(); NET.act(function (st) { return netApply(st, str); }); setTimeout(function () { if (S) { S.busy = false; } }, 4000); }
  function netAgain() { if (!NET) return; if (LEFT) { TurnNet.leave(); TurnNet.open(); } else NET.again(); }
  function netShow(net, info) {
    NET = net; cancelThink();
    if (WINO && (info.again || info.fresh)) { WINO.close(); WINO = null; }
    var prev = S, next = JSON.parse(JSON.stringify(net.state));
    next.busy = false; next.hist = [];
    LEFT = net.status === 'over' && !next.over && net.result && net.result.left != null ? net.result : null;
    var tok2 = ++SHOWN, mv = info.mv && info.mv.s && !info.fresh && !info.again ? info.mv : null;
    if (mv && prev && prev.b && frameEl && frameEl.isConnected && !info.again) {
      var cp = Core.clone(coreOf(prev)), r = Core.play(cp, mv.s);
      if (r && cp.n === next.n && cp.phase === next.phase) {
        var prevB = prev.b.slice(), prevRk = prev.rk.slice();
        S = next; AIM = null; SEL = -1; FILLP = null;
        var t = animate(r, prevB, prevRk);
        setTimeout(function () { if (tok2 !== SHOWN) return; paintAll(); if (S.over || LEFT) netEnd(); else if (!info.mine && net.myTurn()) Kit.haptic('light'); }, t + 80);
        return;
      }
    }
    S = next; AIM = null; SEL = -1; FILLP = null; LASTBLK = []; build();
    if (info.again) { Kit.sfx('deal'); Kit.callout(pl(BLACK) === S.players[net.seat] ? 'You start' : pl(BLACK).name + ' starts'); }
    if (S.over || LEFT) setTimeout(function () { if (tok2 === SHOWN) netEnd(); }, 200);
  }
  function netEnd() {
    if (!NET || !S) return;
    var me = NET.seat, left = LEFT, wi = left ? (left.win && left.win.length ? left.win[0] : -1) : S.winner ? netSeatOf(S, S.winner) : -1, w = wi >= 0 ? S.players[wi] : null;
    var key = NET.code + ':' + S.started, done = NETREC[key];
    try { done = done || (JSON.parse(localStorage.getItem('kamisado_net_rec')) || []).indexOf(key) >= 0; } catch (e) {}
    if (!done && !left && S.over) {
      NETREC[key] = 1;
      try { var rl = JSON.parse(localStorage.getItem('kamisado_net_rec')) || []; rl.push(key); localStorage.setItem('kamisado_net_rec', JSON.stringify(rl.slice(-30))); } catch (e) {}
      var hl = highlights(w); hl.push('Played online at table ' + NET.code + '.');
      Kit.record(KEY, { started: S.started, mode: 'Online', players: S.players.map(function (p) { return { name: p.name + ' (' + colorName(p.side) + ')', score: S.match.pts[p.side], cpu: false }; }),
        winner: w ? w.name + ' (' + colorName(w.side) + ')' : null, highlights: hl, detail: detail() });
      paintRoom();
    }
    if (w && !left) { Kit.sfx('sparkle'); }
    if (WINO) WINO.close();
    setTimeout(function () {
      WINO = Kit.win({
        icon: w && wi === me ? 'trophy' : 'users',
        title: left ? left.text : wi === me ? 'You win!' : w.name + ' wins',
        sub: left ? '' : (S.match.target > 1 ? MATCH[S.match.target] + ' · ' + S.rounds.length + ' rounds' : 'A tower home') + ' · ' + S.n + ' moves',
        rank: left ? null : S.players.slice().sort(function (x, y) { return S.match.pts[y.side] - S.match.pts[x.side]; }).map(function (p) { return { name: p.name, me: isMe(p), score: S.match.pts[p.side] + (S.match.pts[p.side] === 1 ? ' point' : ' points'), color: p.side === BLACK ? '#2a2a30' : '#efe5cf' }; }),
        notes: left ? null : [S.players[0].name + ' has won ' + S.wins[0] + ' and ' + S.players[1].name + ' has won ' + S.wins[1] + '.'], notesTitle: 'Games at this table',
        lose: !!w && wi !== me, againLabel: left ? 'Back to the lobby' : 'Play again',
        again: function () { WINO = null; netAgain(); },
        look: { label: 'Look at the board', onClick: function () { WINO = null; } }
      });
    }, left ? 100 : 2400);
  }
  function netLeave() {
    NET = null; LEFT = null; SHOWN++; if (WINO) { WINO.close(); WINO = null; }
    var sv = null; try { sv = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv && sv.b && sv.rk && sv.players && !sv.over) { S = sv; S.busy = false; build(); afterTurn(); }
    else showSetup();
  }

  // ── Test and demo hooks ──────────────────────────────────────────────────
  window.__kamisado = {
    core: Core, state: function () { return S; }, get aim() { return AIM; }, get sel() { return SEL; }, get busy() { return ANIM || (S && S.busy); },
    // a fresh game: {mode: '2p' | 'cpu', level, target, players: [{name, cpu, side}]}
    start: function (cfg) { cancelThink(); S = { mode: cfg.mode || '2p', level: cfg.level || 'normal', cover: false, target: cfg.target || 1, players: cfg.players }; newGame(); },
    // set a position: rows like Core.grid's (8 strings, top row first), whose turn, the color that must move (-1 any),
    // ranks {piece: rank}; the round starts from here
    set: function (rows, turn, req, ranks) {
      cancelThink(); S.busy = false; S.b = Core.fromGrid(rows); S.turn = turn || 1; S.req = req == null ? -1 : req;
      if (ranks) Object.keys(ranks).forEach(function (k) { S.rk[+k] = ranks[k]; });
      S.phase = 'play'; S.over = false; S.winner = 0; S.n = 0; S.ml = []; S.last = null; S.first = S.turn; S.b0 = S.b.slice(); S.rk0 = S.rk.slice(); S.hist = [];
      AIM = null; SEL = -1; FILLP = null; LASTBLK = []; save(); build(); afterTurn();
    },
    play: function (str) { return playMove(str); },
    sq: function (name) { return function () { if (!layEl) return null; var s = Core.idx(name), d = layEl.querySelector('.dh[data-s="' + s + '"]'); if (!d) { d = el('span', { class: 'dh', 'data-s': s, style: 'position:absolute;width:11.5%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none' }); layEl.appendChild(d); } var q = px(s); pos(d, q.x, q.y); return d; }; },
    tower: function (name) { return function () { var s = Core.idx(name); return S && S.b[s] ? TW[S.b[s]] : null; }; },
    at: function (name) { var r = frameEl.getBoundingClientRect(), q = px(Core.idx(name)); return { x: r.left + q.x / VW * r.width, y: r.top + q.y / VW * r.height }; },
    fillCard: function (f) { return function () { return actsEl ? actsEl.querySelectorAll('.fill')[f === 'R' ? 1 : 0] : null; }; },
    desk: function () { return DK; }
  };
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.b && saved.rk && saved.players && !saved.over) { S = saved; S.busy = false; build(); afterTurn(); }
  else showSetup();

  TurnNet.setup({
    game: 'kamisado', title: 'Kamisado', min: 2, max: 2,
    opts: netOpts, start: netStart,
    turn: function (st) { return st.over ? [] : [netSeatOf(st, st.turn)]; },
    over: function (st) { if (!st.over) return null; var w = netSeatOf(st, st.winner); return { win: [w], text: st.players[w].name + ' wins' }; },
    show: netShow, leave: netLeave
  });
})();

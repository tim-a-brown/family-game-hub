<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monopoly</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="monopoly/engine.js"></script>
<script src="monopoly/art.js"></script>
<script src="monopoly/music.js"></script>
<style>
@font-face{font-family:'Sofia Sans Condensed';src:url('../fonts/sofia-sans-condensed.woff2') format('woff2');font-weight:100 900;font-display:swap;}
#app.mono{max-width:none;padding:2px 12px calc(var(--safe-b) + 20px);}
/* phones and tablets: the action box is a dock fixed at the bottom; the page (board, money, log) scrolls under it */
#app.mono.dockd{padding-bottom:calc(var(--dock-h, 180px) + 14px);}
.mlay{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto;}
.mside{display:flex;flex-direction:column;gap:10px;min-width:0;}

/* ── Players ── */
.pstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px;}
.pstrip::-webkit-scrollbar{display:none;}
.pchip{--c:var(--p1);position:relative;flex:1 1 0;min-width:96px;display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;border:0;border-radius:14px;text-align:left;
  background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm), inset 0 0 0 2px transparent;transition:transform .25s var(--spring), box-shadow .2s, opacity .3s;}
.pchip.on{box-shadow:var(--shadow-sm), inset 0 0 0 2.5px var(--c);transform:translateY(-2px);}
.pchip.on::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}
.pchip.out{opacity:.38;filter:grayscale(.8);}
/* a tapped chip lights that player's squares on the board (tap again for the full list) */
.pchip.lit{box-shadow:var(--shadow-sm), inset 0 0 0 2.5px var(--c), 0 0 18px -2px var(--c);transform:translateY(-2px);}
.pchip.dim{opacity:.55;}
.pchip .tkb{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 60%, color-mix(in srgb,var(--c) 70%,#000));box-shadow:inset 0 -2px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.3);}
.pchip .tkb svg{width:30px;height:30px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}
.pchip .tx{display:flex;flex-direction:column;min-width:0;line-height:1.1;}
.pchip .nm{font-weight:800;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pchip .cs{font-family:var(--display);font-size:1.08rem;font-variant-numeric:tabular-nums;letter-spacing:.01em;}
.pchip .bdg{position:absolute;top:-5px;right:-3px;display:flex;gap:2px;}
.pchip .bdg i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#f3901d;color:#1d1d1b;font-style:normal;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.pchip .bdg i svg{width:11px;height:11px;}
.pchip .bdg i.card{background:#7fc4ea;}
.pchip.hit{animation:chipHit .5s;}
@keyframes chipHit{30%{transform:translateY(2px) scale(.96);}60%{transform:translateY(-3px);}}
.pchip .dlt{position:absolute;left:44px;top:-14px;font-family:var(--display);font-size:1rem;pointer-events:none;animation:dlt 1.3s var(--ease) forwards;white-space:nowrap;}
.pchip .dlt.up{color:var(--green);} .pchip .dlt.dn{color:var(--red);}
@keyframes dlt{0%{opacity:0;transform:translateY(10px);}15%{opacity:1;transform:none;}75%{opacity:1;}100%{opacity:0;transform:translateY(-14px);}}

/* ── The table and board ── */
.mtable{position:relative;align-self:center;padding:calc(var(--bs) * .028);border-radius:calc(var(--bs) * .04);}
.mvp{position:relative;width:var(--bs);height:var(--bs);overflow:hidden;border-radius:3px;box-shadow:0 0 0 2px rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.35);touch-action:pan-y;background:#cfe5ca;}
.mvp.zoomed{touch-action:none;cursor:grab;}
.mboard{position:absolute;left:0;top:0;width:var(--bs);height:var(--bs);transform-origin:0 0;will-change:transform;}
.mboard.ease{transition:transform .45s var(--ease);}
.mboard svg.bsvg,.mboard svg.dyn{position:absolute;inset:0;width:100%;height:100%;}
.mboard svg.dyn{pointer-events:none;}
.bsvg .hit{cursor:pointer;}
.dyn .bld.pop{transform-box:fill-box;transform-origin:50% 100%;animation:bpop .6s var(--spring) both;}
@keyframes bpop{0%{transform:translateY(-40px) scale(.2);opacity:0;}60%{opacity:1;}100%{transform:none;}}
.dyn .glow{animation:glowp 1.2s ease-in-out infinite;}
@keyframes glowp{50%{opacity:.35;}}
.dyn .newown{transform-box:fill-box;transform-origin:center;animation:ownIn .6s var(--spring) both;}
@keyframes ownIn{from{transform:scale(0);}to{transform:none;}}
/* the colour group of the square on offer, and the squares in a trade: marching outlines */
.dyn .grp{stroke-dasharray:14 9;animation:ants 1.4s linear infinite;}
.dyn .trd{stroke-dasharray:16 10;animation:ants 1.1s linear infinite;}
@keyframes ants{to{stroke-dashoffset:-46;}}
/* build planning: houses that would go up are ghosts, ones that would be sold fade */
.dyn .bld.ghost{opacity:.62;animation:ghostp 1.4s ease-in-out infinite;}
.dyn .bld.gone{opacity:.28;filter:grayscale(1);}
@keyframes ghostp{50%{opacity:.95;}}
/* a player's holdings lit up from their chip: everything else dims */
.dyn .spot{animation:spotIn .35s var(--ease) both;}
@keyframes spotIn{from{opacity:0;}}
.spotlbl{--c:var(--p1);position:absolute;left:50%;top:19%;z-index:9;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 14px 6px;border-radius:14px;max-width:70%;text-align:center;cursor:pointer;
  background:rgba(20,16,41,.9);color:#fff;box-shadow:0 0 0 2.5px var(--c), 0 8px 24px rgba(0,0,0,.5);animation:spotIn .35s var(--ease) both;}
.spotlbl b{font-family:var(--display);font-weight:400;font-size:calc(var(--bs) * .05);line-height:1.05;color:var(--c);filter:brightness(1.25);}
.spotlbl span{font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;font-size:calc(var(--bs) * .03);letter-spacing:.04em;color:#f3f0ff;white-space:nowrap;}
/* tokens */
.tk{position:absolute;left:0;top:0;width:6.2%;height:6.2%;margin:-3.1% 0 0 -3.1%;pointer-events:none;z-index:3;}
.tk .base{position:absolute;left:8%;right:8%;bottom:-4%;height:30%;border-radius:50%;background:radial-gradient(circle at 40% 35%, color-mix(in srgb,var(--c) 60%,#fff), var(--c) 55%, color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 2px 3px rgba(0,0,0,.45);}
.tk .tok-svg{position:absolute;inset:-4% 0 6%;width:100%;height:100%;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.55));}
.tk.cur{z-index:5;}
.tk.cur .base{box-shadow:0 0 0 2px #fff, 0 0 10px 2px var(--c), 0 2px 3px rgba(0,0,0,.45);}
.tk.jail .tok-svg{filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.55)) grayscale(.3) brightness(.85);}
.tk .hop{position:absolute;inset:0;}
.metal{fill:url(#mtl);stroke:#2f3339;stroke-width:1.6;stroke-linejoin:round;}
.metal .dk{fill:url(#mtldk);}
.metal .hl{fill:#f4f6f9;}
.metal .ln{fill:none;stroke:#2f3339;stroke-width:2;stroke-linecap:round;}
.metal .ln2{fill:none;stroke:url(#mtl);stroke-width:5;stroke-linecap:round;}
.metal .dots circle{fill:#5d626b;stroke:none;}
/* dice and cards in the middle of the board */
.mdice{position:absolute;left:50%;top:50%;display:flex;gap:calc(var(--bs) * .02);transform:translate(-50%,-50%);z-index:6;pointer-events:none;}
.mdice{perspective:420px;}
.mdice .die{--ds:calc(var(--bs) * .072);}
.mdice .die.rolling{animation:mroll .85s cubic-bezier(.2,.8,.3,1) both;}
@keyframes mroll{0%{transform:translate(var(--dx,-40px),-70px) rotateX(560deg) rotateY(300deg) rotateZ(var(--dr,-200deg)) scale(.55);opacity:.2;}
  45%{transform:translate(calc(var(--dx,-40px) * -.18),10px) rotateX(140deg) rotateY(50deg) rotateZ(calc(var(--dr,-200deg) * -.12)) scale(1.1);opacity:1;}
  70%{transform:translateY(-10px) rotateX(-18deg) rotateZ(5deg);}85%{transform:translateY(0) rotateX(6deg);}100%{transform:none;}}
.mdeed{position:absolute;left:50%;top:50%;width:min(42%,230px);z-index:19;transform:translate(-50%,-50%);pointer-events:none;animation:mdeed 1.7s var(--ease) both;}
.mdeed .deed{font-size:clamp(9px,calc(var(--bs) * .026),14px);}
@keyframes mdeed{0%{opacity:0;transform:translate(-50%,-30%) perspective(700px) rotateX(70deg);}18%{opacity:1;transform:translate(-50%,-50%);}82%{opacity:1;transform:translate(-50%,-50%);}100%{opacity:0;transform:translate(-50%,-56%) scale(.94);}}
/* the deed of the square on offer stays on the table while you decide (tap it for the full card) */
.mdeed.hold{width:min(48%,230px);pointer-events:auto;cursor:pointer;animation:mdeedIn .55s var(--ease) both;}
.mdeed.hold .deed{font-size:clamp(9.5px,calc(var(--bs) * .028),14px);}
.mdeed.hold:active{transform:translate(-50%,-50%) scale(.97);}
@keyframes mdeedIn{0%{opacity:0;transform:translate(-50%,-30%) perspective(700px) rotateX(70deg);}100%{opacity:1;transform:translate(-50%,-50%);}}
.mdice.off{opacity:0;transition:opacity .4s;}
.mpot{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:var(--display);color:#1d1d1b;font-size:calc(var(--bs) * .03);}
.mpot small{font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;font-size:.55em;letter-spacing:.12em;}
.mbank{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;display:flex;gap:calc(var(--bs) * .018);align-items:center;
  font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;color:#1d1d1b;font-size:calc(var(--bs) * .022);}
.mbank span{display:flex;align-items:center;gap:2px;} .mbank svg{width:calc(var(--bs) * .032);height:calc(var(--bs) * .032);}
.mbank .low{color:#c8102e;}
.mcard{position:absolute;left:50%;top:50%;width:min(58%,420px);z-index:20;transform:translate(-50%,-50%);perspective:900px;cursor:pointer;}
.ccard{position:relative;aspect-ratio:1.6;border-radius:calc(var(--bs) * .014);padding:5% 7%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;text-align:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.45);font-family:'Sofia Sans Condensed',sans-serif;color:#1d1d1b;}
.ccard.ch{background:linear-gradient(160deg,#ffb054,#f3901d);}
.ccard.cc{background:linear-gradient(160deg,#fff7c4,#f8e88a);}
.ccard .ct{font-family:var(--display);font-size:clamp(15px,calc(var(--bs) * .042),28px);letter-spacing:.08em;}
.ccard.cc .ct{color:#1b5fae;}
.ccard .cx{font-weight:700;font-size:clamp(14px,calc(var(--bs) * .036),23px);line-height:1.15;}
.ccard .ci{position:absolute;right:4%;bottom:4%;width:13%;opacity:.25;}
.mcard.show .ccard{animation:cflip .7s var(--ease) both;}
@keyframes cflip{0%{transform:translate(var(--fx,0),var(--fy,0)) rotate(-45deg) rotateY(180deg) scale(.4);}55%{transform:rotateY(70deg) scale(.95);}100%{transform:none;}}
.mcard.gone{transition:opacity .3s, transform .3s;opacity:0;transform:translate(-50%,-60%) scale(.9);}
.mfloat{position:absolute;z-index:8;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--display);font-size:calc(var(--bs) * .036);color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.6), 0 0 8px rgba(0,0,0,.6);animation:mfl 1.5s var(--ease) forwards;white-space:nowrap;}
@keyframes mfl{0%{opacity:0;transform:translate(-50%,-30%) scale(.6);}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-130%);}}
.mfloat.bad{color:#ffd2d2;} .mfloat.good{color:#c9ffd9;}
.mjailfx{position:absolute;left:0;top:87%;width:13%;height:13%;z-index:7;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 14%,rgba(20,20,20,.85) 14% 20%);animation:bars 1.4s var(--ease) forwards;transform-origin:top;}
@keyframes bars{0%{transform:scaleY(0);}30%{transform:scaleY(1);}80%{opacity:1;}100%{opacity:0;}}
.mleft{display:flex;flex-direction:column;align-items:center;gap:6px;}
/* zoom buttons sit on the empty felt in the board's bottom-left, so no row is spent on them */
.mzoom{position:absolute;left:15.5%;top:76%;z-index:7;display:flex;gap:5px;}
.mzoom button{width:calc(var(--bs) * .085);height:calc(var(--bs) * .085);min-width:28px;min-height:28px;max-width:38px;max-height:38px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(29,29,27,.72);color:#fffdf6;box-shadow:0 1px 3px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.18);}
.mzoom button svg{width:58%;height:58%;}
.mzoom button:disabled{opacity:.3;}
.mzoom button:active:not(:disabled){transform:scale(.92);}

/* ── Turn and actions ── */
.mact{border-radius:20px;padding:12px;background:var(--surface);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;}
/* the dock: fixed to the bottom of the screen, the board scrolls under it */
.mono.dockd .mact{position:fixed;left:0;right:0;bottom:0;z-index:40;width:min(100%,640px);margin:0 auto;min-height:118px;
  border-radius:22px 22px 0 0;padding:10px 12px calc(var(--safe-b) + 10px);background:color-mix(in srgb,var(--bg-2) 94%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 -1px 0 var(--w1), 0 -12px 34px rgba(0,0,0,.45);}
.mono.dockd .mact::before{content:"";position:absolute;left:50%;top:5px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--w16);}
.turnl{--c:var(--p1);display:flex;align-items:center;gap:10px;min-height:36px;}
/* the current player's cash rides in the dock: a little stack of bills and the amount */
.turnl .wal{flex:none;display:flex;align-items:center;gap:8px;padding:3px 8px 3px 6px;border-radius:12px;background:var(--w06);}
.turnl .wal .stk{position:relative;width:24px;height:13px;border-radius:2px;background:var(--bc,#ecd9a6);flex:none;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55), inset 0 0 0 2.5px rgba(60,50,30,.25), 2px -2px 0 -1px var(--bc,#ecd9a6), 2px -2px 0 0 rgba(0,0,0,.25), 4px -4px 0 -1px var(--bc,#ecd9a6), 4px -4px 0 0 rgba(0,0,0,.25);}
.turnl .wal .stk::before{content:"";position:absolute;left:32%;right:32%;top:20%;bottom:20%;border-radius:50%;border:1px solid rgba(60,50,30,.35);}
.turnl .wal .tx{display:flex;flex-direction:column;align-items:flex-end;line-height:1;}
.turnl .wal b{font-family:var(--display);font-weight:400;font-size:1.12rem;font-variant-numeric:tabular-nums;color:var(--text);}
.turnl .wal b.bump{display:inline-block;animation:tBump .35s var(--spring);}
.turnl .wal small{font-size:.62rem;font-weight:800;color:var(--text-3);letter-spacing:.02em;margin-top:2px;white-space:nowrap;}
/* which of the colour group is whose: one chip per square, tinted by its owner, the one on offer pulsing */
.gdots{display:flex;align-items:center;gap:5px;margin-top:3px;}
.gdots i{--gc:#888;--oc:transparent;position:relative;width:20px;height:26px;border-radius:4px;background:#fffdf6;box-shadow:0 0 0 1px rgba(0,0,0,.35);overflow:visible;}
.gdots i::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;border-radius:4px 4px 0 0;background:var(--gc);border-bottom:1px solid rgba(0,0,0,.3);}
.gdots i.own::after{content:"";position:absolute;left:4px;right:4px;bottom:4px;height:9px;border-radius:2px;background:var(--oc);box-shadow:0 0 0 1px rgba(0,0,0,.25);}
.gdots i.ic{display:grid;place-items:center;padding-top:7px;} .gdots i.ic::before{height:6px;} .gdots i.ic svg{width:14px;height:14px;}
.gdots i.now{box-shadow:0 0 0 2.5px #ffc83d, 0 0 10px #ffc83d;animation:gnow 1.2s ease-in-out infinite;}
@keyframes gnow{50%{transform:translateY(-2px);}}
.gdots .gl{font-size:.78rem;font-weight:800;color:var(--text-2);margin-left:3px;}
.gdots .gl b{color:var(--text);}
.turnl .tkb{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 60%, color-mix(in srgb,var(--c) 70%,#000));}
.turnl .tkb svg{width:32px;height:32px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}
.turnl b{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.1;color:var(--c);}
html[data-theme="light"] .turnl b,html[data-theme="parchment"] .turnl b{color:color-mix(in srgb,var(--c) 45%,var(--text));}
.turnl .sub{display:block;font-size:.85rem;font-weight:700;color:var(--text-2);}
.turnl .grow{flex:1;min-width:0;}
.turnl .lim{flex:none;font-size:.75rem;font-weight:800;color:var(--text-2);text-align:right;line-height:1.2;}
.what{font-weight:700;color:var(--text-2);font-size:.95rem;}
.what b{color:var(--text);}
.btns{display:flex;gap:8px;flex-wrap:wrap;}
.btns .btn{flex:1 1 140px;}
.btns .btn .ico{width:20px;height:20px;}
/* rows that must stay one line: buy/auction, the five bids, pay/bankrupt, the jail choices */
.btns.two .btn,.btns.bids .btn,.btns.debt .btn{flex:1 1 0;min-width:0;padding:0 10px;}
.btns.bids .btn{padding:0 4px;font-size:1rem;}
.btns.debt .btn{font-size:1rem;}
.btns.debt .btn.trd{flex:0 0 50px;padding:0;}
.btns.jail .btn{flex:1 1 0;min-width:0;padding:0 10px;font-size:1rem;}
.btns.jail .btn:nth-child(2){flex:0 1 auto;}
.btns.jail .usecard{flex:0 0 auto;gap:6px;padding:0 10px 0 6px;}
.btns.jail .usecard .jfi{width:30px;height:24px;border-radius:4px;box-shadow:0 0 0 1.5px rgba(80,30,10,.55);object-fit:cover;}
.btns.jail .usecard .jfi.cc{width:36px;}
.tools{display:flex;gap:8px;}
.tools .btn{flex:1;min-height:44px;font-size:.92rem;padding:0 8px;}
.mono.dockd .tools .btn{min-height:40px;box-shadow:0 3px 0 var(--b-lip), inset 0 1px 0 var(--w18);}
.mono.dockd .mact{gap:8px;}
.mono.dockd .turnl b{font-size:1.22rem;}
.mono.dockd .turnl .sub{font-size:.8rem;}
.thinking{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle;}
.thinking i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:thk 1s infinite;}
.thinking i:nth-child(2){animation-delay:.15s;} .thinking i:nth-child(3){animation-delay:.3s;}
@keyframes thk{50%{opacity:.25;transform:translateY(-3px);}}
.offer{display:flex;gap:12px;align-items:center;}
.offer > div:first-child{flex:none;}
.offer .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.bidbox{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:14px;background:var(--w06);min-height:50px;}
.bidbox .amt{font-family:var(--display);font-size:1.6rem;line-height:1;}
.bidbox small{display:block;font-weight:700;color:var(--text-2);font-size:.8rem;}
.bidbox small{white-space:nowrap;}.bidbox .what{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;line-height:1.25;}.bidbox .what b{display:block;text-align:right;}
/* who is still in: their pieces; a passed player's piece goes grey */
.bidders{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.bidders span{--c:var(--p1);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 60%, color-mix(in srgb,var(--c) 70%,#000));box-shadow:inset 0 -2px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.3);transition:opacity .3s, filter .3s;}
.bidders span svg{width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}
.bidders span.outb{opacity:.3;filter:grayscale(1);}
.bidders span.now{box-shadow:0 0 0 2.5px #fff, 0 0 10px 2px var(--c), inset 0 -2px 3px rgba(0,0,0,.3);}
/* the debt bar: the whole track is what you owe; cash fills it like liquid; a tick marks the most you could
   raise by selling and mortgaging everything. When that tick sits short of the end, the bar can never reach. */
.dbar{display:flex;flex-direction:column;gap:4px;}
.dbar .trk{position:relative;height:16px;border-radius:8px;background:var(--w08);box-shadow:inset 0 1px 3px rgba(0,0,0,.45);overflow:visible;}
.dbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;min-width:6px;max-width:100%;transition:width .45s var(--ease);overflow:hidden;
  background:linear-gradient(180deg,#ff8a6a,#d8212f 55%,#9c1020);box-shadow:inset 0 -2px 2px rgba(0,0,0,.25);}
.dbar .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);background-size:220% 100%;animation:liq 2.2s linear infinite;}
.dbar .fill::before{content:"";position:absolute;right:-5px;top:-2px;bottom:-2px;width:10px;border-radius:50%;background:inherit;box-shadow:inset -2px 0 2px rgba(255,255,255,.25);}
.dbar.ok .fill{background:linear-gradient(180deg,#6fe39a,#1f9c4b 55%,#136a32);}
@keyframes liq{to{background-position:-220% 0;}}
.dbar .dead{position:absolute;right:0;top:0;bottom:0;border-radius:0 8px 8px 0;background:repeating-linear-gradient(135deg,rgba(255,77,94,.35) 0 4px,transparent 4px 9px);box-shadow:inset 0 0 0 1.5px rgba(255,77,94,.55);}
.dbar .cap{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--text);box-shadow:0 0 0 1.5px var(--bg-2);transition:left .45s var(--ease);}
.dbar .cap::after{content:"";position:absolute;left:50%;top:-6px;width:0;height:0;margin-left:-5px;border:5px solid transparent;border-top:6px solid var(--text);border-bottom:0;}
.dbar .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;font-weight:800;color:var(--text-2);}
.dbar .lb b{font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--text);font-variant-numeric:tabular-nums;}
.dbar .lb .capl{color:var(--text-3);} .dbar .lb .capl b{font-size:.92rem;color:var(--text-2);}
.dbar .lb .owe b{color:var(--red);} .dbar.ok .lb .owe b{color:var(--green);}
/* raise money: your deeds in a row; the green tag is what each gives back. Tap one to mortgage it or sell a house. */
.raise{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 4px;margin:-4px -2px 0;-webkit-overflow-scrolling:touch;}
.raise::-webkit-scrollbar{display:none;}
.raise .mini{flex:none;width:78px;box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 3px 6px rgba(0,0,0,.35);}
.raise .mini .mh .rt{display:inline-flex;align-items:center;height:13px;padding:0 4px;border-radius:3px;background:#1f9c4b;color:#fff;font-size:10px;letter-spacing:.02em;box-shadow:0 1px 2px rgba(0,0,0,.35);}
.raise .mini.no{opacity:.38;filter:saturate(.5);}
.raise .mini.no .mh .rt{background:#8a8577;}
.raise .mini.mortg .mh .rt{background:#fffdf6;color:#c8102e;}
.raise .mini.mortg .mn::after{display:none;}
.raise .mini.sold{animation:raised .5s var(--spring);}
@keyframes raised{30%{transform:translateY(-6px) scale(1.06);}}

/* ── Title deed card ── */
.deed{--gc:#888;--gi:#1d1d1b;background:#fffdf6;color:#1d1d1b;border-radius:6px;padding:6px;box-shadow:0 0 0 1px rgba(0,0,0,.2), 0 8px 18px rgba(0,0,0,.3);font-family:'Sofia Sans Condensed',sans-serif;font-size:13px;line-height:1.2;}
.deed .dh{background:var(--gc);color:var(--gi);text-align:center;padding:5px 4px 6px;border:1.5px solid #1d1d1b;}
.deed .dh small{display:block;font-size:.66em;font-weight:800;letter-spacing:.14em;}
.deed .dh b{display:block;font-size:1.15em;font-weight:900;letter-spacing:.03em;text-transform:uppercase;}
.deed .di{display:grid;place-items:center;padding:6px 0 2px;} .deed .di svg{width:46px;height:46px;}
.deed .rows{padding:5px 4px 2px;}
.deed .dr{display:flex;justify-content:space-between;gap:6px;padding:1px 4px;border-radius:3px;}
.deed .dr.now{background:#ffe48a;box-shadow:0 0 0 1.5px #c99a00;font-weight:800;}
.deed .dr.c{justify-content:center;font-weight:800;}
.deed .df{border-top:1px solid #1d1d1b;margin-top:4px;padding:4px 4px 0;text-align:center;font-size:.86em;}
.deed .dn{font-size:.72em;text-align:center;padding:3px 2px 0;color:#444;font-style:italic;}
.deed.mortg{position:relative;}
.deed.mortg::after{content:"MORTGAGED";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-24deg);padding:2px 10px;border:3px solid #c8102e;border-radius:6px;color:#c8102e;font-weight:900;font-size:1.4em;letter-spacing:.08em;background:rgba(255,253,246,.85);}
.deed.sm{font-size:11px;padding:4px;}.deed.sm .dh{padding:3px 3px 4px;}
.deed.flip{animation:dflip .65s var(--ease) both;transform-origin:50% 60%;}
@keyframes dflip{0%{transform:perspective(700px) rotateX(80deg) translateY(30px);opacity:0;}60%{opacity:1;}100%{transform:none;}}

/* ── My properties ── */
.mine{border-radius:20px;padding:12px;background:var(--surface);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;}
.mine h3{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);}
.mine h3 .grow{flex:1;}
.wallet{display:flex;align-items:flex-end;gap:10px;}
.wallet .big{font-family:var(--display);font-size:1.9rem;line-height:1;}
.bills{display:flex;align-items:flex-end;flex-wrap:wrap;gap:3px;flex:1;justify-content:flex-end;}
.bill{--bc:#efdcae;position:relative;width:46px;height:24px;border-radius:3px;background:var(--bc);color:#3a3326;display:grid;place-items:center;font-family:'Sofia Sans Condensed',sans-serif;font-weight:900;font-size:12px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 0 3px rgba(60,50,30,.25), 0 1px 2px rgba(0,0,0,.35);}
.bill::before{content:"";position:absolute;left:30%;right:30%;top:22%;bottom:22%;border-radius:50%;border:1px solid rgba(60,50,30,.3);}
.bill.stk{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 0 3px rgba(60,50,30,.25), 2px -2px 0 -1px var(--bc), 2px -2px 0 0 rgba(0,0,0,.2), 4px -4px 0 -1px var(--bc), 4px -4px 0 0 rgba(0,0,0,.2);}
.bill .n{position:absolute;right:-6px;top:-8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--text);color:var(--bg);font-size:11px;display:grid;place-items:center;}
.bill.fly{position:fixed;z-index:480;pointer-events:none;margin:-12px 0 0 -23px;}
.groups{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;}
.grow-row{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;}
/* in a hand of property, cards fill each row left to right (in board order) before starting the next */
/* each colour group is a stack of deeds, fanned down so every card's bar, rent and name show */
.groups .grow-row{display:flex;flex-direction:column;flex-wrap:nowrap;gap:0;}
.groups .grow-row .mini + .mini{margin-top:-16px;box-shadow:0 -1px 0 rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.25),0 -3px 6px rgba(0,0,0,.18);}
.groups .grow-row .mini.full + .mini.full{box-shadow:0 0 0 2px var(--gc),0 -3px 6px rgba(0,0,0,.22);}
.groups .grow-row .mini:active{z-index:2;}
.mini{--gc:#888;--gi:#1d1d1b;position:relative;display:flex;flex-direction:column;justify-content:flex-start;width:74px;min-height:48px;border:0;padding:0 0 4px;border-radius:5px;background:#fffdf6;color:#1d1d1b;text-align:center;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.25);font-family:'Sofia Sans Condensed',sans-serif;transition:transform .15s;}
.mini:active{transform:scale(.95);}
.mini .mh{flex:none;height:16px;background:var(--gc);color:var(--gi);border-bottom:1px solid rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums;}
.mini .mh svg{width:12px;height:12px;flex:none;}
.mini .mh .rt{white-space:nowrap;}
.mini .mh .bh{display:inline-flex;gap:0;margin-left:1px;padding:0 2px;border-radius:3px;background:#fffdf6;box-shadow:0 0 0 1px rgba(0,0,0,.2);} .mini .mh .bh svg{width:9px;height:9px;} .mini .mh .bh.ht svg{width:13px;height:9px;}
.mini .mn{display:block;padding:3px 3px 0;font-size:11px;font-weight:800;line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini .hs{display:none;}
.mini.mortg .mn,.mini.mortg .mh svg{opacity:.5;} .mini.mortg .mh{background:repeating-linear-gradient(135deg,var(--gc) 0 5px,#b9b2a1 5px 10px);} .mini.mortg .mh .rt{display:inline-flex;align-items:center;justify-content:center;height:13px;padding:1px 4px 0;box-sizing:border-box;line-height:1;text-align:center;color:#c8102e;background:#fffdf6;border-radius:3px;font-size:9px;letter-spacing:0;}
.mini.mortg .mn::after{content:"Mortgaged";display:block;margin-top:1px;color:#c8102e;font-size:8.5px;letter-spacing:.06em;}
.mini.mortg .hs{display:none;}
.mini.full{box-shadow:0 0 0 2px var(--gc), 0 2px 4px rgba(0,0,0,.25);}
.empty{color:var(--text-3);font-weight:700;font-size:.9rem;}
.goojf{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:8px;background:linear-gradient(160deg,#ffb054,#f3901d);color:#1d1d1b;font-family:'Sofia Sans Condensed',sans-serif;font-weight:900;font-size:.8rem;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.goojf.cc{background:linear-gradient(160deg,#fff7c4,#f8e88a);}
.goojf svg{width:18px;height:18px;}
.goojf .jfi{width:25px;height:22px;border-radius:5px;box-shadow:0 0 0 1.5px rgba(80,30,10,.55);object-fit:cover;flex:none;}
.goojf.sm .jfi{width:21px;height:18px;}
.goojf .jfi.cc{width:32px;height:22px;border-radius:5px;} .goojf.sm .jfi.cc{width:27px;height:18px;}
.ccard .cjf.cc{width:42%;aspect-ratio:1.5;border-radius:6%;box-shadow:0 0 0 2px #6b5a12,0 3px 8px rgba(0,0,0,.2);}
.ccard .cjf{width:30%;aspect-ratio:1.13;border-radius:6%;box-shadow:0 0 0 2px rgba(80,30,10,.5),0 3px 8px rgba(0,0,0,.2);object-fit:cover;}
.goojf.sm{gap:4px;padding:2px 7px 2px 3px;border-radius:6px;font-size:.72rem;letter-spacing:.02em;text-transform:none;animation:jfin .5s var(--spring) both;} .goojf.sm svg{width:14px;height:14px;}
@keyframes jfin{0%{transform:translateY(-8px) rotate(-8deg);opacity:0;}100%{transform:none;opacity:1;}}

/* ── Log ── */
.mlog{border-radius:20px;padding:10px 12px;background:var(--w04);display:flex;flex-direction:column;gap:2px;}
.mlog .ln{--c:var(--text-3);display:flex;gap:8px;align-items:baseline;font-size:.86rem;color:var(--text-2);line-height:1.3;padding:2px 0;}
.mlog .ln::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);transform:translateY(-1px);}
.mlog .ln:first-child{color:var(--text);font-weight:700;}
.mlog .more{align-self:flex-start;margin-top:4px;}

/* ── Sheets ── */
.bgrp{border-radius:14px;padding:10px;background:var(--w05);margin-bottom:10px;}
.bgrp h4{display:flex;align-items:center;gap:8px;font-size:.9rem;margin-bottom:6px;}
.bgrp h4 i{width:16px;height:16px;border-radius:4px;background:var(--gc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);}
.brow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--w06);}
.brow:first-of-type{border-top:0;}
.brow .nm{flex:1;min-width:0;font-weight:800;font-size:.95rem;}
.brow .nm small{display:block;font-weight:700;color:var(--text-3);font-size:.78rem;}
.brow .hs{display:flex;gap:1px;min-width:62px;justify-content:center;} .brow .hs svg{width:15px;height:15px;}
.brow .btn{min-height:38px;padding:0 10px;}
.sq-btn{width:40px;min-width:40px;padding:0 !important;}
.bankline{display:flex;gap:12px;font-weight:800;font-size:.85rem;color:var(--text-2);margin:2px 0 10px;}
.bankline svg{display:inline-block;width:16px;height:16px;vertical-align:-3px;}
.bankline .chg{color:var(--accent);} .bankline .out{color:var(--red);}
/* build sheet plan: kept pieces solid, planned ones ghosted with a glow, sold ones faded */
.bplan .brow{margin:0 -10px;padding:6px 10px;transition:background .2s;}
.bplan .brow.up{background:linear-gradient(90deg,color-mix(in srgb,var(--green) 16%,transparent),transparent 85%);box-shadow:inset 3px 0 0 var(--green);}
.bplan .brow.dn{background:linear-gradient(90deg,color-mix(in srgb,var(--red) 14%,transparent),transparent 85%);box-shadow:inset 3px 0 0 var(--red);}
.bplan .brow:last-child{border-radius:0 0 14px 14px;}
.bplan .brow .nm small s{opacity:.7;} .bplan .brow .nm small b{color:var(--text);}
.bplan .bgrp h4{margin:0 0 4px;}
.bplan .bgrp .bnote{font-size:.8rem;font-weight:800;color:var(--accent);margin:-2px 0 4px;}
.bplan .hs{min-width:76px;align-items:flex-end;height:24px;gap:2px;}
.bplan .hs .none{color:var(--text-3);font-weight:800;align-self:center;}
.pc{width:17px;height:17px;flex:none;overflow:visible;}
.pc.t{width:31px;height:18px;}
.pc.new{opacity:.8;filter:brightness(1.35) drop-shadow(0 0 .6px var(--text)) drop-shadow(0 0 .6px var(--text)) drop-shadow(0 0 3px var(--accent));animation:pcPend 1.8s ease-in-out .45s infinite;}
.pc.gone{opacity:.25;filter:grayscale(1);}
.pc.fx.solid{animation:pcIn .42s var(--spring) both;}
.pc.fx.new{animation:pcIn .42s var(--spring) both,pcPend 1.8s ease-in-out .45s infinite;}
.pc.fx.gone{animation:pcOut .38s ease-out both;}
.pc.vanish{animation:pcGone .26s ease-in forwards;}
@keyframes pcIn{0%{transform:translateY(-12px) scale(.2);opacity:0;}}
@keyframes pcOut{0%{opacity:1;filter:none;transform:none;}40%{transform:translateY(-5px) scale(1.1);opacity:.8;}}
@keyframes pcPend{50%{transform:translateY(-2px);opacity:.6;}}
@keyframes pcGone{to{opacity:0;width:0;transform:translateY(-8px) scale(.2);}}
.bfoot{gap:8px !important;}
.btally{border-radius:14px;padding:8px 12px;background:var(--w05);display:flex;flex-direction:column;gap:2px;animation:pcIn .3s var(--ease) both;}
.btally .tl{display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:.9rem;color:var(--text-2);}
.btally .tl span{flex:1;min-width:0;} .btally .tl b{font-variant-numeric:tabular-nums;color:var(--text);}
.btally .tl .neg{color:var(--red);} .btally .tl .pos{color:var(--green);}
.btally .tot{border-top:1px solid var(--w08);margin-top:4px;padding-top:6px;font-size:1rem;color:var(--text);}
.btally .tot svg{width:14px;height:14px;vertical-align:-2px;}
.btally .tot b{font-size:1.1rem;}
.btally .tot.bump b{display:inline-block;animation:tBump .3s var(--spring);}
@keyframes tBump{40%{transform:scale(1.18);}}
.bwhy{color:var(--red);font-weight:800;font-size:.85rem;text-align:center;margin:0;}
.bfoot .bgo[disabled]{opacity:1;--b:var(--w08);--b-ink:var(--text-2);--b-lip:var(--w04);}
.brow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
/* build planning in the dock: one colour group at a time (tabs), the plan previewed on the board above */
.bpan{display:flex;flex-direction:column;gap:6px;}
.bpan .bhead{display:flex;align-items:center;gap:6px;min-height:30px;}
.bpan .btabs{display:flex;gap:5px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;}
.bpan .btabs::-webkit-scrollbar{display:none;}
.bpan .btabs button{--gc:#888;flex:none;display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 4px;border:0;border-radius:99px;background:var(--w06);color:var(--text-2);font-weight:800;font-size:.8rem;}
.bpan .btabs button i{width:14px;height:14px;border-radius:4px;background:var(--gc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);}
.bpan .btabs button.on{background:var(--w1);color:var(--text);box-shadow:inset 0 0 0 2px var(--gc);}
.bpan .btabs button b{font-family:var(--display);font-weight:400;font-size:.9rem;color:var(--accent);margin-left:1px;}
.bpan .bhead .bankline{margin:0;gap:8px;font-size:.8rem;flex:none;}
.bpan .bgrp{margin:0;padding:2px 10px;}
.bpan .brow{padding:2px 0;}
.bpan .brow .nm{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .bpan .brow .nm small{font-size:.74rem;} .bpan .brow .nm small .ico{width:12px;height:12px;vertical-align:-2px;}
.bpan .btabs button small{font-weight:800;font-size:.72rem;color:var(--text-3);}
.bpan .brow .btn{min-height:34px;}
.bpan .sq-btn{width:38px;min-width:38px;}
.bpan .hs{min-width:70px;}
.bpan .bfoot{display:flex;align-items:center;gap:8px;margin-top:2px;}
.bpan .bfoot .bgo{flex:1;min-height:44px;}
.bpan .bfoot .btn-soft,.bpan .bfoot .btn-ghost{min-height:44px;padding:0 14px;}
.bpan .btally{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:5px 10px;font-size:.82rem;}
.bpan .btally .tl{gap:5px;font-size:.82rem;} .bpan .btally .tl b{font-size:.9rem;} .bpan .btally .tot{border:0;margin:0 0 0 auto;padding:0;font-size:.82rem;} .bpan .btally .tot b{font-size:.95rem;} .bpan .btally .tot .ico{width:12px;height:12px;}
.bpan .bwhy{margin:0;font-size:.8rem;}
.bpan .muted{font-size:.84rem;}
@media (prefers-reduced-motion:reduce){.pc.new,.pc.fx,.pc.vanish,.btally,.btally .tot.bump b{animation:none !important;}}
.tr-who{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tr-who button{--c:var(--p1);display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border:0;border-radius:99px;background:var(--w06);color:var(--text);font-weight:800;}
.tr-who button.on{box-shadow:inset 0 0 0 2.5px var(--c);background:var(--w1);}
.tr-who .tkb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);} .tr-who .tkb svg{width:24px;height:24px;}
.tr-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tr-col{border-radius:14px;padding:8px;background:var(--w05);min-width:0;}
.tr-col h4{font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:2px 2px 6px;}
.tr-props{display:flex;flex-direction:column;gap:4px;}
.tr-p{--gc:#888;display:flex;align-items:center;gap:6px;padding:6px 8px;border:0;border-radius:10px;background:var(--w06);color:var(--text);font-weight:700;font-size:.85rem;text-align:left;}
.tr-p i{flex:none;width:12px;height:22px;border-radius:3px;background:var(--gc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);}
.tr-p.on{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2));box-shadow:inset 0 0 0 2px var(--accent);}
.tr-p:disabled{opacity:.4;}
.tr-p small{display:block;color:var(--text-3);font-size:.72rem;}
.tr-cash{display:flex;align-items:center;gap:4px;margin-top:8px;}
.tr-cash .input{min-height:38px;padding:0 8px;text-align:center;font-weight:800;min-width:0;}
.tr-cash button{flex:none;width:34px;height:38px;border:0;border-radius:10px;background:var(--w08);color:var(--text);font-weight:900;}
.meter{margin-top:12px;}
.meter .tr{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green));position:relative;}
.meter .tr i{position:absolute;top:-4px;width:6px;height:18px;margin-left:-3px;border-radius:3px;background:var(--text);box-shadow:0 0 0 2px var(--bg);transition:left .3s var(--ease);}
.meter .lb{display:flex;justify-content:space-between;font-size:.75rem;font-weight:800;color:var(--text-3);margin-top:4px;}
.offer-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.offer-sum div{border-radius:12px;padding:8px 10px;background:var(--w06);font-weight:700;font-size:.9rem;}
.offer-sum small{display:block;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:2px;}

<body>
<main class="stage mono" id="app"></main>
<script>
(function () {
  'use strict';
  var M = MonoEngine, A = MonoArt, SQ = M.SQ, GROUPS = M.GROUPS, money = M.money;
  var el = Kit.el, esc = Kit.esc, app = document.getElementById('app');
  var SAVE = 'monopoly_state', KEY = 'monopoly', NETME = 'monopoly_net';
  document.body.insertAdjacentHTML('afterbegin', A.defs());
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // ═══ State ══════════════════════════════════════════════════════════════
  // S: the game (engine state). mode: 'cpu' | 'pass' | 'online'. Online (turnnet.js), the table's doc holds S and
  // every device runs the engine for its own seat's moves; NET is the table while sitting at one.
  var S = null, mode = null, undoStack = [], busy = 0, chain = Promise.resolve(), botT = 0, view = null, lastTurnSeen = -1;
  var speed = lsGet('mono_speed', 'normal'), TEST = { instant: false };
  var disp = null;   // what the board shows while an animation plays: {pos:[], cash:[], jail:[]}
  function T(ms) { return TEST.instant ? 0 : speed === 'fast' ? Math.round(ms * 0.4) : ms; }
  function wait(ms) { ms = T(ms); return new Promise(function (r) { if (!ms) r(); else setTimeout(r, ms); }); }
  function isHuman(p) { return S && S.players[p] && !S.players[p].cpu; }
  // can this device act for player p?
  function mine(p) {
    if (!S || p < 0 || !S.players[p]) return false;
    if (mode === 'online') return !!NET && p === NET.seat && !S.players[p].out;
    return !S.players[p].cpu && !S.players[p].out;
  }
  // online, a seat only acts when the move is theirs (building, mortgaging and trading too)
  function canAct(p) { return mode !== 'online' || (!!NET && NET.myTurn() && M.needs(S) === p); }
  // whose properties and money the panel shows: you (vs computer, online), or the person whose turn it is (pass and play)
  function viewer() {
    if (mode === 'online') return NET ? NET.seat : -1;
    if (mode === 'cpu') return 0;
    var n = M.needs(S);
    if (n >= 0 && isHuman(n)) return n;
    if (isHuman(S.cur)) return S.cur;
    return lastHuman >= 0 ? lastHuman : 0;
  }
  var lastHuman = -1;
  // quiet ragtime piano while a game is on the table (monopoly/music.js)
  var music = MonoMusic.create({ key: 'monopoly_music', active: function () { return !!(S && view && mode && S.phase !== 'over'); } });

  Kit.init({
    id: 'monopoly',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } stopAll(); clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Monopoly: past games' }); } },
      { icon: 'rocket', label: 'Fast computer players', sub: 'Robots move and decide quicker', toggle: function () { return speed === 'fast'; }, onClick: function () { speed = speed === 'fast' ? 'normal' : 'fast'; lsSet('mono_speed', speed); } },
      music.menuItem
    ]),
    rules:
      '<p class="goal">Buy property, charge rent, build houses and hotels, and be the <b>last player standing</b> when everyone else has gone bankrupt.</p>' +
      '<h3>Your turn</h3><ul><li>Roll the two dice and move that many squares. Passing <b>Go</b> pays you <b>$200</b>.</li>' +
      '<li>Roll <b>doubles</b> and you go again. Three doubles in a row sends you to Jail.</li>' +
      '<li>Land on a property no one owns and you can <b>buy</b> it at the printed price. If you don’t, it goes up for <b>auction</b>: everyone (you too) can bid, and the highest bid wins.</li>' +
      '<li>Land on someone else’s property and you pay them <b>rent</b> (shown on the title deed). No rent is paid on mortgaged property.</li>' +
      '<li><b>Railroads</b>: $25, $50, $100 or $200 rent, for 1 to 4 owned. <b>Utilities</b>: 4 times the dice, or 10 times if the owner has both.</li>' +
      '<li><b>Chance</b> and <b>Community Chest</b>: take a card and do what it says.</li></ul>' +
      '<h3>Building</h3><ul><li>Own every street of a colour group (a <b>monopoly</b>) and unimproved rent there doubles. Then you can buy houses.</li>' +
      '<li>Build <b>evenly</b>: no street can get a second house before every street in the group has one, and so on. After 4 houses comes a <b>hotel</b>.</li>' +
      '<li>The bank has only <b>32 houses and 12 hotels</b>. When they run out, no one can build until some come back.</li>' +
      '<li>You can sell buildings back to the bank any time for <b>half</b> what they cost (evenly, too).</li></ul>' +
      '<h3>Jail</h3><ul><li>You go to Jail by landing on Go to Jail, from a card, or by rolling three doubles. You don’t collect $200.</li>' +
      '<li>To get out: pay <b>$50</b> before rolling, use a <b>Get Out of Jail Free</b> card, or roll <b>doubles</b> (up to three tries; doubles move you out but don’t give another roll). After the third miss you pay $50 and move.</li>' +
      '<li>In Jail you still collect rent, build and trade.</li></ul>' +
      '<h3>Money trouble</h3><ul><li><b>Mortgage</b> a property to get half its price from the bank (sell the group’s buildings first). To lift the mortgage, pay that back plus <b>10% interest</b>.</li>' +
      '<li>If you owe more than you can pay, sell buildings and mortgage property. If it still isn’t enough, you are <b>bankrupt</b>: everything you have goes to the player you owe (or back to the bank, which auctions it).</li></ul>' +
      '<h3>Trading</h3><ul><li>Trade properties, cash and Get Out of Jail Free cards with anyone, any time on a turn. Streets in a group with buildings can’t be traded until those are sold.</li>' +
      '<li>Taking a mortgaged property means paying the 10% interest straight away. Pay off the mortgage the same turn and that interest is all you pay.</li></ul>' +
      '<h3>House rules (in setup, off unless you choose them)</h3><ul><li><b>Free Parking jackpot</b>: taxes and fines pile up in the middle; land on Free Parking to take them.</li>' +
      '<li><b>$400 on Go</b>: landing exactly on Go pays double.</li><li><b>No auctions</b>: a property no one buys stays with the bank.</li>' +
      '<li><b>Game length</b>: after the time or the number of rounds, the round is finished and the richest player wins (cash, property at its price, half if mortgaged, and buildings at cost).</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b>: open a table and 2 to 8 people join, each on their own device. You can add computer players in the setup.</li>' +
      '<li>Take your turn whenever you like; the home screen shows when it’s your move. Building, mortgaging and trading happen on your own turn, and a trade or a bid waits for the player it’s for.</li>' +
      '<li>Moves can’t be taken back online. If someone leaves, the computer plays for them.</li></ul>' +
      '<h3>Playing here</h3><p>Tap any square to see its title deed; the deed of a square up for sale lies on the table while you decide. Tap a player at the top to light up everything they own on the board. Pinch to zoom, or tap + to zoom in on your piece. Build, Mortgage and Trade sit under the board; when you owe money, tap a deed in the row to mortgage it or sell a house.</p>'
  });

  // ═══ Save / resume ══════════════════════════════════════════════════════
  function save() {
    if (!S || mode === 'online') return;
    if (S.phase === 'over') { clearSave(); return; }
    try { localStorage.setItem(SAVE, JSON.stringify({ S: S, mode: mode })); } catch (e) {}
    Kit.resume.set('Round ' + S.round + ' · ' + M.active(S).length + ' players left', { keys: [SAVE] });
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function stopAll() { clearTimeout(botT); busy = 0; chain = Promise.resolve(); undoStack = []; closeSheet(); }

  // ═══ Setup ══════════════════════════════════════════════════════════════
  function showSetup() {
    pickStop(); S = null; mode = null; view = null; app.className = 'stage'; app.innerHTML = '';
    Kit.setup(app, {
      modes: [
        { id: 'cpu', icon: 'bot', title: 'vs Computer', desc: 'You against 1 to 7 computer players' },
        { id: 'pass', icon: 'users', title: 'Pass and play', desc: '2 to 8 players sharing this phone' },
        { id: 'online', icon: 'globe', title: 'Play online', desc: '2 to 8 players, each on their own device' }
      ],
      players: { min: 2, max: 8, count: 3, cpu: function (m) { return m === 'cpu' ? 'seats' : false; }, range: function (m) { return m === 'online' ? [1, 1] : [2, 8]; } },
      options: [
        { id: 'len', label: 'Game length', value: 'all', choices: [['all', 'Classic', 'Play until one player is left. A full game can take a couple of hours.'], ['m60', '1 hour', 'After an hour, the round is finished and the richest player wins.'], ['m90', '90 min', 'After 90 minutes, the round is finished and the richest player wins.'], ['r25', '25 rounds', 'After 25 rounds, the richest player wins.']] },
        { id: 'auction', label: 'Auctions', value: 'on', choices: [['on', 'On', 'The official rule: a property no one buys is auctioned to everyone.'], ['off', 'Off', 'House rule: a property no one buys stays with the bank.']] },
        { id: 'fp', label: 'Free Parking jackpot', value: 'off', choices: [['off', 'Off', 'The official rule: Free Parking is just a rest.'], ['on', 'On', 'House rule: taxes and fines pile up in the middle, and landing on Free Parking takes them.']] },
        { id: 'go400', label: 'Landing on Go', value: 'off', choices: [['off', '$200', 'The official rule: $200 for passing or landing on Go.'], ['on', '$400', 'House rule: landing exactly on Go pays $400.']] },
        { id: 'bots', label: 'Computer players', value: '0', when: function (m) { return m === 'online'; }, choices: [['0', 'None', 'Only the people who join play.'], ['1', '1', 'One computer player sits at the table with the people who join.'], ['2', '2', 'Two computer players sit at the table with the people who join.'], ['3', '3', 'Three computer players sit at the table with the people who join.']] },
        { id: 'speed', label: 'Computer speed', value: 'normal', when: function (m) { return m === 'cpu'; }, choices: [['normal', 'Easy to follow'], ['fast', 'Fast']] }
      ],
      onStart: function (cfg) {
        var o = cfg.options;
        if (cfg.mode === 'cpu') { speed = o.speed === 'fast' ? 'fast' : 'normal'; lsSet('mono_speed', speed); }
        var opts = { len: o.len, noAuction: o.auction === 'off', fp: o.fp === 'on', go400: o.go400 === 'on' };
        if (cfg.mode === 'online') {
          var nm = cfg.players[0] && cfg.players[0].name, me = lsGet(NETME, {}) || {};
          opts.bots = Math.max(0, Math.min(3, +o.bots || 0)); me.opts = opts; lsSet(NETME, me);
          if (nm && nm !== 'You' && !/^Player \d+$/.test(nm)) lsSet('tn_me', { name: nm });
          TurnNet.open(); return;
        }
        showPicker(cfg.mode, cfg.players.map(function (p) { return { name: p.name, cpu: p.cpu }; }), opts);
      }
    });
  }
  function fixNames(players) {
    var my = (function () { try { return (localStorage.getItem('my_name') || '').trim(); } catch (e) { return ''; } })();
    players.forEach(function (p, i) { if (p.name === 'You' || !p.name) p.name = i === 0 && my ? my : 'Player ' + (i + 1); });
    return players;
  }
  function start(m, players, opts) {
    stopAll(); pickStop(); mode = m;
    fixNames(players);
    // every player gets a different piece: keep the ones chosen, deal the rest from what's left
    var used = {}; players.forEach(function (p) { if (p.tok && M.TOKENS.indexOf(p.tok) >= 0 && !used[p.tok]) used[p.tok] = 1; else p.tok = null; });
    var left = shuffled(M.TOKENS.filter(function (t) { return !used[t]; }));
    players.forEach(function (p) { if (!p.tok) p.tok = left.shift(); });
    rememberToks(players);
    S = M.newGame(players, opts);
    Kit.gameStart(); S.started = Date.now();
    lastHuman = -1; lastTurnSeen = -1;
    build(); save(); render();
    setTimeout(function () { Kit.callout(S.players[0].name === 'You' ? 'You go first' : S.players[0].name + ' goes first'); Kit.sfx('whoosh'); }, 400);
    afterChange();
  }

  // ═══ Choosing pieces ════════════════════════════════════════════════════
  // After setup, the box opens: the eight metal pieces sit in a velvet tray and each player takes one, in seat
  // order (people first, then the computer players take from what's left). A piece in a seat goes back to the
  // tray with a tap, or with Undo. Each name's last piece is remembered and offered to them next time.
  var TOKMEM = 'mono_toks', pick = null;
  function shuffled(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function memKey(n) { return String(n || '').trim().toLowerCase(); }
  function lastTok(name) { var m = lsGet(TOKMEM, {}) || {}; var t = m[memKey(name)]; return M.TOKENS.indexOf(t) >= 0 ? t : null; }
  function rememberToks(players) {
    var m = lsGet(TOKMEM, {}) || {};
    players.forEach(function (p) { if (p.tok && p.name && !/^Player \d+$/.test(p.name)) m[memKey(p.name)] = p.tok; });

    });
  }
  function syncCpu() { if (S && NET) S.players.forEach(function (x, i) { x.cpu = !!(NET.seats[i] && NET.seats[i].bot); }); }
  function snapOf(st) { return { pos: st.players.map(function (p) { return p.pos; }), cash: st.players.map(function (p) { return p.cash; }), jail: st.players.map(function (p) { return p.jail; }), own: st.own.slice(), hs: st.hs.slice() }; }
  // Draw the table: the first look, or the move just made (yours or anyone's) played out from the state before it

      return animate(ev, pre);

  }
  function enterGame(st, hello) {

    lastHuman = -1; lastTurnSeen = hello ? S.turn : -1; undoStack = [];
    Kit.gameStart(); build(); render();
    if (NET && S.players[NET.seat]) rememberToks([S.players[NET.seat]]);
    if (hello && S.phase !== 'over') setTimeout(function () { if (S !== st) return; Kit.callout(NET && S.cur === NET.seat ? 'You go first' : S.players[S.cur].name + ' goes first'); Kit.sfx('whoosh'); }, 400);
    afterChange();
  }
  // ── Choosing pieces at the table: the same box, everyone picking on their own device at once ──
  function enterPick() {
    if (mode === 'online' && !S && PK && document.body.contains(PK.root)) return;
    stopAll(); pickStop(); S = null; view = null; mode = 'online'; PK = null;
  }
  function pickDraw(st, prev) {
    var me = NET ? NET.seat : -1;
    if (!PK) {
      app.className = 'stage'; app.innerHTML = '';
      var n = st.players.length, root = el('div', { class: 'pick' });
      PK = { root: root, head: el('div', { class: 'pk-head', 'aria-live': 'polite' }), hd: '' };
      var seatsEl = el('div', { class: 'pk-seats', style: { '--n': n, '--cols': n <= 4 ? n : Math.ceil(n / 2) } });
      PK.seats = st.players.map(function (x, i) {
        var sock = el('button', { type: 'button', class: 'pk-sock', disabled: true, 'aria-label': x.name });
        var s = el('div', { class: 'pk-seat', style: { '--c': pcolor(i) } }, [el('i', { class: 'pk-ptr', html: Kit.icon('down') }), sock, el('div', { class: 'pk-nm', text: i === me ? 'You' : x.name }), el('div', { class: 'pk-tn' })]);
        seatsEl.appendChild(s);
        return { el: s, sock: sock, tn: s.querySelector('.pk-tn') };
      });
      PK.tray = trayEl(netPickTap);
      root.appendChild(PK.head); root.appendChild(seatsEl); root.appendChild(el('div', { class: 'pk-box wood' }, [PK.tray.el]));
      app.appendChild(root); window.scrollTo(0, 0);
      Kit.sfx('flip'); Kit.haptic('light');
      M.TOKENS.forEach(function (t, k) { var pc = PK.tray.wells[t].querySelector('.pk-pc'); if (pc.animate && !TEST.instant) pc.animate([{ opacity: 0, transform: 'translateY(-26px) scale(1.15)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 60 + k * 45, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' }); });
    }
    PK.st = st;
    var P = PK, up = pickUp(st), myGo = up.indexOf(me) >= 0, col = myGo ? pcolor(me) : '#ffd27a';
    var free = M.TOKENS.filter(function (t) { return !st.players.some(function (x) { return x.tok === t; }); });
    var last = myGo ? lastTok(st.players[me].name) : null; if (last && free.indexOf(last) < 0) last = null;
    var names = up.map(function (i) { return st.players[i].name; });
    var head = myGo ? 'Pick your piece' : up.length ? 'Waiting for ' + (names.length > 2 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names.join(' and ')) : 'Ready to play';
    if (head !== P.hd) { P.hd = head; P.head.innerHTML = ''; P.head.appendChild(el('b', { class: 'in', text: head, style: { '--c': myGo ? col : 'var(--text)' } })); }
    function bot(i) { return NET && NET.seats[i] && NET.seats[i].bot ? '<i class="pk-bot">' + Kit.icon('bot') + '</i>' : ''; }

    st.players.forEach(function (x, i) {
      var s = P.seats[i]; if (!s || !x.tok || !prev || !prev.players[i] || prev.players[i].tok) return;
      s.flying = true;
      Kit.sfx('pop', i === me ? 1 : 0.6); if (i === me) Kit.haptic('light');
      flyTok(x.tok, P.tray.wells[x.tok].querySelector('.pk-pc'), s.sock).then(function () {
        s.flying = false; if (PK !== P) return;
        s.sock.classList.add('has'); s.sock.innerHTML = A.token(x.tok) + bot(i); s.tn.textContent = A.TOK_NAME[x.tok];
        s.sock.classList.remove('land'); void s.sock.offsetWidth; s.sock.classList.add('land');
        Kit.sfx('chip', i === me ? 1 : 0.6); if (i === me) Kit.haptic('medium');
        if (!P.st.pick && !P.done) { P.done = true; Kit.sfx('sparkle'); Kit.haptic('success'); }
      });
    });
    st.players.forEach(function (x, i) {
      var s = P.seats[i]; if (!s) return;
      var has = !!x.tok && !s.flying;
      s.el.classList.toggle('now', up.indexOf(i) >= 0);
      s.sock.classList.toggle('has', has);
      s.sock.innerHTML = (has ? A.token(x.tok) : '') + bot(i);
      s.tn.textContent = has ? A.TOK_NAME[x.tok] : '';
    });
    M.TOKENS.forEach(function (t) {
      var w = P.tray.wells[t], gone = free.indexOf(t) < 0;
      w.classList.toggle('gone', gone); w.disabled = gone;
      w.classList.toggle('last', t === last);
      w.style.setProperty('--c', col);
      w.setAttribute('aria-label', A.TOK_NAME[t] + (gone ? ' (taken)' : ''));

    P.tray.el.classList.toggle('lit', myGo); P.tray.el.style.setProperty('--c', col);
  }
  function netPickTap(tok) {
    if (!NET || !PK || !PK.st || !PK.st.pick) return;
    var st = PK.st, me = NET.seat, w = PK.tray.wells[tok];
    if (st.players.some(function (x) { return x.tok === tok; })) { shakeWell(w); return; }
    if (!NET.myTurn() || pickUp(st).indexOf(me) < 0) { Kit.haptic('error'); shake(PK.head); return; }
    NET.act(function (s) { return pickMove(s, me, tok); });
  }
  function netLeave() {
    NET = null; stopAll(); pickStop(); PK = null; S = null; view = null; mode = null;
    var sv = lsGet(SAVE, null);
    if (sv && sv.S && sv.S.players && sv.S.phase !== 'over' && sv.mode !== 'online') { S = sv.S; mode = sv.mode; build(); render(); afterChange(); }
    else showSetup();
  }
  // once per device per game
  function netRecord() {
    if (!NET || !S) return;
    var key = NET.code + ':' + S.started, l = lsGet(NETREC, []); if (!Array.isArray(l)) l = [];
    if (l.indexOf(key) >= 0) return;
    lsSet(NETREC, l.concat([key]).slice(-30));
    recordGame();
  }
  var NETCFG = {
    game: 'monopoly', title: 'Monopoly', min: 2, max: 8, botMs: 300, botTakeover: true,
    seats: function (n) { return Math.min(8, n + netBots()); },
    opts: function () { var o = netOpts(); NETCFG.max = Math.max(2, 8 - o.bots); return o; },
    start: netStart, turn: netTurn, over: netOver, bot: netBot, show: netShow, leave: netLeave
  };

  // a game against the clock: count the time spent playing (not time the app sat closed)
  setInterval(function () {
    if (!S || S.phase === 'over' || document.hidden) return;
    if (!/^m/.test(S.opts.len || '')) return;
    if (mode === 'online') S.elapsed = Math.max(S.elapsed || 0, Date.now() - S.started); else S.elapsed += 5000;
    if (view && view.act) { var lim = view.act.querySelector('.lim'); if (lim && !M.limitHit(S)) lim.textContent = Math.ceil(Math.max(0, +S.opts.len.slice(1) * 60000 - S.elapsed) / 60000) + ' min left'; }
  }, 5000);

  // ═══ Test hooks ═════════════════════════════════════════════════════════

    instant: function (on) { TEST.instant = on !== false; }, speed: function (v) { speed = v; }, seat: function () { return NET ? NET.seat : -1; }, net: function () { return NET; },
    setState: function (s) { stopAll(); S = s; build(); render(); afterChange(); },
    pick: function () { return pick ? { toks: pick.toks.slice(), chooser: chooser(), anim: pick.anim } : null; }, render: function () { render(); }, deed: deedSheet, build: buildSheet, mortgage: mortSheet, trade: tradeSheet

  // ═══ Start ══════════════════════════════════════════════════════════════

  if (/[?&](online=1|room=|join=)/.test(location.search)) showSetup();

  else showSetup();
  TurnNet.setup(NETCFG);
})();

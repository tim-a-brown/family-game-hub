<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monopoly</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="monopoly/engine.js"></script>
<script src="monopoly/art.js"></script>
<style>
@font-face{font-family:'Sofia Sans Condensed';src:url('../fonts/sofia-sans-condensed.woff2') format('woff2');font-weight:100 900;font-display:swap;}
#app.mono{max-width:none;padding:2px 12px calc(var(--safe-b) + 20px);}
.mlay{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto;}
.mside{display:flex;flex-direction:column;gap:10px;min-width:0;}

/* ── Players ── */
.pstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px;}
.pstrip::-webkit-scrollbar{display:none;}
.pchip{--c:var(--p1);position:relative;flex:1 1 0;min-width:96px;display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;border:0;border-radius:14px;text-align:left;
  background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm), inset 0 0 0 2px transparent;transition:transform .25s var(--spring), box-shadow .2s, opacity .3s;}
.pchip.on{box-shadow:var(--shadow-sm), inset 0 0 0 2.5px var(--c);transform:translateY(-2px);}
.pchip.on::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}
.pchip.out{opacity:.38;filter:grayscale(.8);}
.pchip .tkb{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 60%, color-mix(in srgb,var(--c) 70%,#000));box-shadow:inset 0 -2px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.3);}
.pchip .tkb svg{width:30px;height:30px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}
.pchip .tx{display:flex;flex-direction:column;min-width:0;line-height:1.1;}
.pchip .nm{font-weight:800;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pchip .cs{font-family:var(--display);font-size:1.08rem;font-variant-numeric:tabular-nums;letter-spacing:.01em;}
.pchip .bdg{position:absolute;top:-5px;right:-3px;display:flex;gap:2px;}
.pchip .bdg i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#f3901d;color:#1d1d1b;font-style:normal;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.pchip .bdg i svg{width:11px;height:11px;}
.pchip .bdg i.card{background:#7fc4ea;}
.pchip.hit{animation:chipHit .5s;}
@keyframes chipHit{30%{transform:translateY(2px) scale(.96);}60%{transform:translateY(-3px);}}
.pchip .dlt{position:absolute;left:44px;top:-14px;font-family:var(--display);font-size:1rem;pointer-events:none;animation:dlt 1.3s var(--ease) forwards;white-space:nowrap;}
.pchip .dlt.up{color:var(--green);} .pchip .dlt.dn{color:var(--red);}
@keyframes dlt{0%{opacity:0;transform:translateY(10px);}15%{opacity:1;transform:none;}75%{opacity:1;}100%{opacity:0;transform:translateY(-14px);}}

/* ── The table and board ── */
.mtable{position:relative;align-self:center;padding:calc(var(--bs) * .028);border-radius:calc(var(--bs) * .04);}
.mvp{position:relative;width:var(--bs);height:var(--bs);overflow:hidden;border-radius:3px;box-shadow:0 0 0 2px rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.35);touch-action:pan-y;background:#cfe5ca;}
.mvp.zoomed{touch-action:none;cursor:grab;}
.mboard{position:absolute;left:0;top:0;width:var(--bs);height:var(--bs);transform-origin:0 0;will-change:transform;}
.mboard.ease{transition:transform .45s var(--ease);}
.mboard svg.bsvg,.mboard svg.dyn{position:absolute;inset:0;width:100%;height:100%;}
.mboard svg.dyn{pointer-events:none;}
.bsvg .hit{cursor:pointer;}
.dyn .bld.pop{transform-box:fill-box;transform-origin:50% 100%;animation:bpop .6s var(--spring) both;}
@keyframes bpop{0%{transform:translateY(-40px) scale(.2);opacity:0;}60%{opacity:1;}100%{transform:none;}}
.dyn .glow{animation:glowp 1.2s ease-in-out infinite;}
@keyframes glowp{50%{opacity:.35;}}
.dyn .newown{transform-box:fill-box;transform-origin:center;animation:ownIn .6s var(--spring) both;}
@keyframes ownIn{from{transform:scale(0);}to{transform:none;}}
/* tokens */
.tk{position:absolute;left:0;top:0;width:6.2%;height:6.2%;margin:-3.1% 0 0 -3.1%;pointer-events:none;z-index:3;}
.tk .base{position:absolute;left:8%;right:8%;bottom:-4%;height:30%;border-radius:50%;background:radial-gradient(circle at 40% 35%, color-mix(in srgb,var(--c) 60%,#fff), var(--c) 55%, color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 2px 3px rgba(0,0,0,.45);}
.tk .tok-svg{position:absolute;inset:-4% 0 6%;width:100%;height:100%;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.55));}
.tk.cur{z-index:5;}
.tk.cur .base{box-shadow:0 0 0 2px #fff, 0 0 10px 2px var(--c), 0 2px 3px rgba(0,0,0,.45);}
.tk.jail .tok-svg{filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.55)) grayscale(.3) brightness(.85);}
.tk .hop{position:absolute;inset:0;}
.metal{fill:url(#mtl);stroke:#2f3339;stroke-width:1.6;stroke-linejoin:round;}
.metal .dk{fill:url(#mtldk);}
.metal .hl{fill:#f4f6f9;}
.metal .ln{fill:none;stroke:#2f3339;stroke-width:2;stroke-linecap:round;}
.metal .ln2{fill:none;stroke:url(#mtl);stroke-width:5;stroke-linecap:round;}
.metal .dots circle{fill:#5d626b;stroke:none;}
/* dice and cards in the middle of the board */
.mdice{position:absolute;left:50%;top:50%;display:flex;gap:calc(var(--bs) * .02);transform:translate(-50%,-50%);z-index:6;pointer-events:none;}
.mdice{perspective:420px;}
.mdice .die{--ds:calc(var(--bs) * .072);}
.mdice .die.rolling{animation:mroll .85s cubic-bezier(.2,.8,.3,1) both;}
@keyframes mroll{0%{transform:translate(var(--dx,-40px),-70px) rotateX(560deg) rotateY(300deg) rotateZ(var(--dr,-200deg)) scale(.55);opacity:.2;}
  45%{transform:translate(calc(var(--dx,-40px) * -.18),10px) rotateX(140deg) rotateY(50deg) rotateZ(calc(var(--dr,-200deg) * -.12)) scale(1.1);opacity:1;}
  70%{transform:translateY(-10px) rotateX(-18deg) rotateZ(5deg);}85%{transform:translateY(0) rotateX(6deg);}100%{transform:none;}}
.mdeed{position:absolute;left:50%;top:50%;width:min(42%,230px);z-index:19;transform:translate(-50%,-50%);pointer-events:none;animation:mdeed 1.7s var(--ease) both;}
.mdeed .deed{font-size:clamp(9px,calc(var(--bs) * .026),14px);}
@keyframes mdeed{0%{opacity:0;transform:translate(-50%,-30%) perspective(700px) rotateX(70deg);}18%{opacity:1;transform:translate(-50%,-50%);}82%{opacity:1;transform:translate(-50%,-50%);}100%{opacity:0;transform:translate(-50%,-56%) scale(.94);}}
.mdice.off{opacity:0;transition:opacity .4s;}
.mpot{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:var(--display);color:#1d1d1b;font-size:calc(var(--bs) * .03);}
.mpot small{font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;font-size:.55em;letter-spacing:.12em;}
.mbank{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;display:flex;gap:calc(var(--bs) * .018);align-items:center;
  font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;color:#1d1d1b;font-size:calc(var(--bs) * .022);}
.mbank span{display:flex;align-items:center;gap:2px;} .mbank svg{width:calc(var(--bs) * .032);height:calc(var(--bs) * .032);}
.mbank .low{color:#c8102e;}
.mcard{position:absolute;left:50%;top:50%;width:min(58%,420px);z-index:20;transform:translate(-50%,-50%);perspective:900px;cursor:pointer;}
.ccard{position:relative;aspect-ratio:1.6;border-radius:calc(var(--bs) * .014);padding:5% 7%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;text-align:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.45);font-family:'Sofia Sans Condensed',sans-serif;color:#1d1d1b;}
.ccard.ch{background:linear-gradient(160deg,#ffb054,#f3901d);}
.ccard.cc{background:linear-gradient(160deg,#fff7c4,#f8e88a);}
.ccard .ct{font-family:var(--display);font-size:clamp(15px,calc(var(--bs) * .042),28px);letter-spacing:.08em;}
.ccard.cc .ct{color:#1b5fae;}
.ccard .cx{font-weight:700;font-size:clamp(14px,calc(var(--bs) * .036),23px);line-height:1.15;}
.ccard .ci{position:absolute;right:4%;bottom:4%;width:13%;opacity:.25;}
.mcard.show .ccard{animation:cflip .7s var(--ease) both;}
@keyframes cflip{0%{transform:translate(var(--fx,0),var(--fy,0)) rotate(-45deg) rotateY(180deg) scale(.4);}55%{transform:rotateY(70deg) scale(.95);}100%{transform:none;}}
.mcard.gone{transition:opacity .3s, transform .3s;opacity:0;transform:translate(-50%,-60%) scale(.9);}
.mfloat{position:absolute;z-index:8;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--display);font-size:calc(var(--bs) * .036);color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.6), 0 0 8px rgba(0,0,0,.6);animation:mfl 1.5s var(--ease) forwards;white-space:nowrap;}
@keyframes mfl{0%{opacity:0;transform:translate(-50%,-30%) scale(.6);}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-130%);}}
.mfloat.bad{color:#ffd2d2;} .mfloat.good{color:#c9ffd9;}
.mjailfx{position:absolute;left:0;top:87%;width:13%;height:13%;z-index:7;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 14%,rgba(20,20,20,.85) 14% 20%);animation:bars 1.4s var(--ease) forwards;transform-origin:top;}
@keyframes bars{0%{transform:scaleY(0);}30%{transform:scaleY(1);}80%{opacity:1;}100%{opacity:0;}}
.mleft{display:flex;flex-direction:column;align-items:center;gap:6px;}
.mzoom{display:flex;gap:6px;align-self:flex-end;margin:-2px 2px 0;}
.mzoom button{width:34px;height:30px;border:0;border-radius:10px;display:grid;place-items:center;background:var(--w08);color:var(--text);}
.mzoom button svg{width:18px;height:18px;}
.mzoom button:disabled{opacity:.35;}

/* ── Turn and actions ── */
.mact{border-radius:20px;padding:12px;background:var(--surface);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;}
.turnl{--c:var(--p1);display:flex;align-items:center;gap:10px;min-height:36px;}
.turnl .tkb{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 60%, color-mix(in srgb,var(--c) 70%,#000));}
.turnl .tkb svg{width:32px;height:32px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}
.turnl b{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.1;color:var(--c);}
html[data-theme="light"] .turnl b,html[data-theme="parchment"] .turnl b{color:color-mix(in srgb,var(--c) 45%,var(--text));}
.turnl .sub{display:block;font-size:.85rem;font-weight:700;color:var(--text-2);}
.turnl .grow{flex:1;min-width:0;}
.turnl .lim{flex:none;font-size:.75rem;font-weight:800;color:var(--text-2);text-align:right;line-height:1.2;}
.what{font-weight:700;color:var(--text-2);font-size:.95rem;}
.what b{color:var(--text);}
.btns{display:flex;gap:8px;flex-wrap:wrap;}
.btns .btn{flex:1 1 140px;}
.btns .btn .ico{width:20px;height:20px;}
.tools{display:flex;gap:8px;}
.tools .btn{flex:1;min-height:44px;font-size:.92rem;padding:0 8px;}
.thinking{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle;}
.thinking i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:thk 1s infinite;}
.thinking i:nth-child(2){animation-delay:.15s;} .thinking i:nth-child(3){animation-delay:.3s;}
@keyframes thk{50%{opacity:.25;transform:translateY(-3px);}}
.offer{display:flex;gap:12px;align-items:center;}
.offer > div:first-child{flex:none;}
.offer .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.bidbox{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--w06);}
.bidbox .amt{font-family:var(--display);font-size:1.8rem;line-height:1;}
.bidbox small{display:block;font-weight:700;color:var(--text-2);font-size:.8rem;}
.bidbox small{white-space:nowrap;}.bidbox .what{margin-left:auto;text-align:right;font-size:.85rem;line-height:1.25;}.bidbox .what b{display:block;}
.bidders{display:flex;gap:4px;flex-wrap:wrap;}
.bidders span{--c:var(--p1);display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:99px;background:var(--w06);font-size:.78rem;font-weight:800;}
.bidders span i{width:12px;height:12px;border-radius:50%;background:var(--c);}
.bidders span.outb{opacity:.35;text-decoration:line-through;}
.bidders span.now{box-shadow:inset 0 0 0 2px var(--c);}
.debtbar{height:10px;border-radius:5px;background:var(--w08);overflow:hidden;}
.debtbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yellow));border-radius:5px;transition:width .4s;}
.debtbar i.ok{background:var(--green);}

/* ── Title deed card ── */
.deed{--gc:#888;--gi:#1d1d1b;background:#fffdf6;color:#1d1d1b;border-radius:6px;padding:6px;box-shadow:0 0 0 1px rgba(0,0,0,.2), 0 8px 18px rgba(0,0,0,.3);font-family:'Sofia Sans Condensed',sans-serif;font-size:13px;line-height:1.2;}
.deed .dh{background:var(--gc);color:var(--gi);text-align:center;padding:5px 4px 6px;border:1.5px solid #1d1d1b;}
.deed .dh small{display:block;font-size:.66em;font-weight:800;letter-spacing:.14em;}
.deed .dh b{display:block;font-size:1.15em;font-weight:900;letter-spacing:.03em;text-transform:uppercase;}
.deed .di{display:grid;place-items:center;padding:6px 0 2px;} .deed .di svg{width:46px;height:46px;}
.deed .rows{padding:5px 4px 2px;}
.deed .dr{display:flex;justify-content:space-between;gap:6px;padding:1px 4px;border-radius:3px;}
.deed .dr.now{background:#ffe48a;box-shadow:0 0 0 1.5px #c99a00;font-weight:800;}
.deed .dr.c{justify-content:center;font-weight:800;}
.deed .df{border-top:1px solid #1d1d1b;margin-top:4px;padding:4px 4px 0;text-align:center;font-size:.86em;}
.deed .dn{font-size:.72em;text-align:center;padding:3px 2px 0;color:#444;font-style:italic;}
.deed.mortg{position:relative;}
.deed.mortg::after{content:"MORTGAGED";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-24deg);padding:2px 10px;border:3px solid #c8102e;border-radius:6px;color:#c8102e;font-weight:900;font-size:1.4em;letter-spacing:.08em;background:rgba(255,253,246,.85);}
.deed.sm{font-size:11px;padding:4px;}.deed.sm .dh{padding:3px 3px 4px;}
.deed.flip{animation:dflip .65s var(--ease) both;transform-origin:50% 60%;}
@keyframes dflip{0%{transform:perspective(700px) rotateX(80deg) translateY(30px);opacity:0;}60%{opacity:1;}100%{transform:none;}}

/* ── My properties ── */
.mine{border-radius:20px;padding:12px;background:var(--surface);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;}
.mine h3{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);}
.mine h3 .grow{flex:1;}
.wallet{display:flex;align-items:flex-end;gap:10px;}
.wallet .big{font-family:var(--display);font-size:1.9rem;line-height:1;}
.bills{display:flex;align-items:flex-end;flex-wrap:wrap;gap:3px;flex:1;justify-content:flex-end;}
.bill{--bc:#efdcae;position:relative;width:46px;height:24px;border-radius:3px;background:var(--bc);color:#3a3326;display:grid;place-items:center;font-family:'Sofia Sans Condensed',sans-serif;font-weight:900;font-size:12px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 0 3px rgba(60,50,30,.25), 0 1px 2px rgba(0,0,0,.35);}
.bill::before{content:"";position:absolute;left:30%;right:30%;top:22%;bottom:22%;border-radius:50%;border:1px solid rgba(60,50,30,.3);}
.bill.stk{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 0 3px rgba(60,50,30,.25), 2px -2px 0 -1px var(--bc), 2px -2px 0 0 rgba(0,0,0,.2), 4px -4px 0 -1px var(--bc), 4px -4px 0 0 rgba(0,0,0,.2);}
.bill .n{position:absolute;right:-6px;top:-8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--text);color:var(--bg);font-size:11px;display:grid;place-items:center;}
.bill.fly{position:fixed;z-index:480;pointer-events:none;margin:-12px 0 0 -23px;}
.groups{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;}
.grow-row{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;}
/* in a hand of property, cards fill each row left to right (in board order) before starting the next */
/* each colour group is a stack of deeds, fanned down so every card's bar, rent and name show */
.groups .grow-row{display:flex;flex-direction:column;flex-wrap:nowrap;gap:0;}
.groups .grow-row .mini + .mini{margin-top:-16px;box-shadow:0 -1px 0 rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.25),0 -3px 6px rgba(0,0,0,.18);}
.groups .grow-row .mini.full + .mini.full{box-shadow:0 0 0 2px var(--gc),0 -3px 6px rgba(0,0,0,.22);}
.groups .grow-row .mini:active{z-index:2;}
.mini{--gc:#888;--gi:#1d1d1b;position:relative;display:flex;flex-direction:column;justify-content:flex-start;width:74px;min-height:48px;border:0;padding:0 0 4px;border-radius:5px;background:#fffdf6;color:#1d1d1b;text-align:center;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.25);font-family:'Sofia Sans Condensed',sans-serif;transition:transform .15s;}
.mini:active{transform:scale(.95);}
.mini .mh{flex:none;height:16px;background:var(--gc);color:var(--gi);border-bottom:1px solid rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums;}
.mini .mh svg{width:12px;height:12px;flex:none;}
.mini .mh .rt{white-space:nowrap;}
.mini .mh .bh{display:inline-flex;gap:0;margin-left:1px;padding:0 2px;border-radius:3px;background:#fffdf6;box-shadow:0 0 0 1px rgba(0,0,0,.2);} .mini .mh .bh svg{width:9px;height:9px;} .mini .mh .bh.ht svg{width:13px;height:9px;}
.mini .mn{display:block;padding:3px 3px 0;font-size:11px;font-weight:800;line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini .hs{display:none;}
.mini.mortg .mn,.mini.mortg .mh svg{opacity:.5;} .mini.mortg .mh{background:repeating-linear-gradient(135deg,var(--gc) 0 5px,#b9b2a1 5px 10px);} .mini.mortg .mh .rt{color:#c8102e;background:#fffdf6;padding:0 3px;border-radius:3px;font-size:8.5px;}
.mini.mortg .hs{display:none;}
.mini.full{box-shadow:0 0 0 2px var(--gc), 0 2px 4px rgba(0,0,0,.25);}
.empty{color:var(--text-3);font-weight:700;font-size:.9rem;}
.goojf{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:8px;background:linear-gradient(160deg,#ffb054,#f3901d);color:#1d1d1b;font-family:'Sofia Sans Condensed',sans-serif;font-weight:900;font-size:.8rem;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.goojf.cc{background:linear-gradient(160deg,#fff7c4,#f8e88a);}
.goojf svg{width:18px;height:18px;}
.goojf.sm{gap:4px;padding:2px 7px 2px 3px;border-radius:6px;font-size:.72rem;letter-spacing:.02em;text-transform:none;animation:jfin .5s var(--spring) both;} .goojf.sm svg{width:14px;height:14px;}
@keyframes jfin{0%{transform:translateY(-8px) rotate(-8deg);opacity:0;}100%{transform:none;opacity:1;}}

/* ── Log ── */
.mlog{border-radius:20px;padding:10px 12px;background:var(--w04);display:flex;flex-direction:column;gap:2px;}
.mlog .ln{--c:var(--text-3);display:flex;gap:8px;align-items:baseline;font-size:.86rem;color:var(--text-2);line-height:1.3;padding:2px 0;}

/* ── Choosing pieces: the token tray from the box ── */
.pick{max-width:660px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 0 calc(var(--safe-b) + 16px);min-height:calc(100svh - var(--safe-t) - 150px);}

html[data-theme="light"] .pk-head b,html[data-theme="parchment"] .pk-head b{color:color-mix(in srgb,var(--c) 55%,var(--text));}
.pk-head b.in{animation:pkIn .5s var(--spring) both;}
@keyframes pkIn{from{opacity:0;transform:translateY(12px) scale(.9);}}
.pk-seats{--cols:4;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:16px 8px;padding-top:16px;}
@media (min-width:640px){.pk-seat .pk-nm{font-size:1.02rem;} .pk-seat .pk-tn{font-size:.8rem;}}
.pk-seat{--c:var(--p1);position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-sm);
  transition:transform .4s var(--spring), box-shadow .3s, opacity .3s;min-width:0;}
.pk-seat.now{transform:translateY(-6px);box-shadow:var(--shadow-sm), inset 0 0 0 2.5px var(--c), 0 0 26px -4px var(--c);}
.pk-seat .pk-ptr{position:absolute;left:50%;top:-22px;width:22px;height:22px;margin-left:-11px;color:var(--c);opacity:0;transform:translateY(-6px);transition:opacity .25s, transform .25s;pointer-events:none;filter:drop-shadow(0 0 6px var(--c));}
.pk-seat .pk-ptr svg{width:100%;height:100%;stroke-width:3.2;}
.pk-seat.now .pk-ptr{opacity:1;transform:none;animation:pkPtr 1s ease-in-out infinite;}
@keyframes pkPtr{50%{transform:translateY(5px);}}
.pk-sock{position:relative;width:min(96px,16vw,100%);aspect-ratio:1;border-radius:50%;border:0;padding:0;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent);color:inherit;-webkit-tap-highlight-color:transparent;}
.pk-sock::before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--c) 60%,transparent);}
.pk-seat.now .pk-sock::before{animation:pkSpin 9s linear infinite;}
@keyframes pkSpin{to{transform:rotate(360deg);}}
.pk-sock.has{cursor:pointer;background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 60%, color-mix(in srgb,var(--c) 70%,#000));box-shadow:inset 0 -3px 5px rgba(0,0,0,.3), 0 2px 4px rgba(0,0,0,.35);}
.pk-sock.has::before{display:none;}
.pk-sock svg.tok-svg{width:88%;height:88%;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.55));}
.pk-sock.has:active{transform:scale(.94);}
.pk-sock.land{animation:pkLand .5s var(--spring);}
@keyframes pkLand{0%{transform:scale(1.18);}40%{transform:scale(.92);}100%{transform:none;}}
.pk-sock .pk-bot{position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2);box-shadow:0 1px 2px rgba(0,0,0,.4);}
.pk-sock .pk-bot svg{width:13px;height:13px;}
.pk-seat .pk-nm{max-width:100%;font-weight:800;font-size:.86rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pk-seat .pk-tn{font-size:.7rem;font-weight:700;color:var(--text-3);line-height:1;min-height:.7rem;white-space:nowrap;}
/* the box: a wooden frame with a velvet tray and a moulded well for each piece */
.pk-box{padding:10px;border-radius:24px;--wood-a:#6b4126;--wood-b:#412614;}
.pk-tray{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;border-radius:16px;overflow:hidden;
  --felt-a:#a31d3a;--felt-b:#6c1026;--felt-c:#470a19;--felt-mark:none;--c:#ffd27a;}
.pk-tray::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.07) 45%,transparent 62%);}
.pk-tray.lit{box-shadow:inset 0 6px 18px rgba(0,0,0,.55), inset 0 0 0 2px var(--c);transition:box-shadow .4s;}
.pk-well{--c:#ffd27a;position:relative;aspect-ratio:.84;border:0;padding:6% 0 8%;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;color:#f3dfa6;
  background:radial-gradient(90% 75% at 50% 42%, rgba(0,0,0,.34), rgba(0,0,0,.14) 72%, rgba(0,0,0,.06));
  box-shadow:inset 0 6px 12px rgba(0,0,0,.62), inset 0 -2px 0 rgba(255,255,255,.07), 0 1px 0 rgba(255,255,255,.09);-webkit-tap-highlight-color:transparent;transition:box-shadow .3s;}
.pk-well .pk-mould,.pk-well .pk-pc{position:relative;width:80%;aspect-ratio:1;flex:none;}
.pk-well .pk-mould{position:absolute;left:10%;top:6%;filter:brightness(0) blur(.4px);opacity:.38;}
.pk-well .pk-pc{transition:transform .3s var(--spring), filter .3s, opacity .3s;}
.pk-well svg.tok-svg{width:100%;height:100%;display:block;}
.pk-well .pk-pc svg.tok-svg{filter:drop-shadow(0 4px 3px rgba(0,0,0,.6));}
.pk-well .pk-tn{position:relative;font-family:'Sofia Sans Condensed',sans-serif;font-weight:800;font-size:clamp(.66rem,2.7vw,.92rem);letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap;
  text-shadow:0 1px 0 rgba(0,0,0,.6);transition:opacity .3s;}
@media (hover:hover){.pk-well:not(.gone):not(.taken):hover .pk-pc{transform:translateY(-5px) scale(1.06) rotate(-3deg);}}
.pk-well:not(.gone):not(.taken):active .pk-pc{transform:translateY(-3px) scale(.97);}
.pk-well:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.pk-well.gone{cursor:default;} .pk-well.gone .pk-pc{opacity:0;transform:translateY(-14px) scale(1.1);} .pk-well.gone .pk-tn{opacity:.4;}
.pk-well.last,.pk-well.hov,.pk-well.mine{box-shadow:inset 0 6px 12px rgba(0,0,0,.62), inset 0 0 0 2.5px var(--c), 0 0 18px -2px var(--c);}
.pk-well.last .pk-pc{animation:pkBob 1.6s ease-in-out infinite;}
@keyframes pkBob{50%{transform:translateY(-5px);}}
.pk-well.hov .pk-pc{transform:translateY(-8px) scale(1.08);}
.pk-well.taken{cursor:not-allowed;} .pk-well.taken .pk-pc{filter:grayscale(1) brightness(.7);opacity:.42;} .pk-well.taken .pk-tn{opacity:.45;}
.pk-well.wait .pk-pc{animation:pkWait .7s ease-in-out infinite;}
@keyframes pkWait{50%{transform:translateY(-10px) scale(1.08);}}
.pk-well .pk-own{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--oc);color:#fff;font-weight:900;font-size:.68rem;box-shadow:0 1px 3px rgba(0,0,0,.5), inset 0 0 0 1.5px rgba(255,255,255,.5);animation:pkLand .45s var(--spring);}
.pk-well.shake{animation:pkShake .42s;}
@keyframes pkShake{20%{transform:translateX(-6px) rotate(-2deg);}40%{transform:translateX(5px) rotate(1.5deg);}60%{transform:translateX(-3px);}80%{transform:translateX(2px);}}
.pk-acts{display:flex;flex-direction:column;align-items:center;gap:6px;}
.pk-acts .pk-go{min-width:min(100%,320px);}
.pk-acts .pk-go.ready{animation:pkReady 1.4s ease-in-out infinite;}
@keyframes pkReady{50%{transform:scale(1.035);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent);}}
.pk-acts .btn-ghost{font-size:.92rem;min-height:40px;color:var(--text-2);}
.pk-acts .btn-ghost svg{width:18px;height:18px;}
.pk-acts .btn-ghost[hidden]{display:inline-flex;visibility:hidden;}
.pk-fly{position:fixed;z-index:500;pointer-events:none;will-change:transform;}
.pk-fly svg.tok-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 6px rgba(0,0,0,.45));}
/* the online wait room: a smaller tray, and each player's piece beside their name */
.pk-ol{display:flex;flex-direction:column;gap:8px;}
.pk-ol .pk-box{padding:8px;border-radius:20px;}
.pk-ol .pk-tray{gap:6px;padding:8px;}
.pk-ol .pk-well .pk-tn{font-size:clamp(.6rem,2.4vw,.8rem);}
.pk-badge{--c:var(--p1);flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 60%,transparent);}
.pk-badge::before{content:"";position:absolute;inset:6px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--c) 55%,transparent);}
.pk-badge.has{background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 60%, color-mix(in srgb,var(--c) 70%,#000));box-shadow:inset 0 -2px 4px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.35);}
.pk-badge.has::before{display:none;}
.pk-badge svg.tok-svg{width:86%;height:86%;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.55));}
.pk-badge.land{animation:pkLand .5s var(--spring);}
@media (prefers-reduced-motion:reduce){.pk-seat.now .pk-ptr,.pk-well.last .pk-pc,.pk-well.wait .pk-pc,.pk-seat.now .pk-sock::before,.pk-acts .pk-go.ready{animation:none;}}

/* ── Wide screens: board on the left, everything else beside it ── */
@media (orientation:landscape) and (min-width:900px){
  #app.mono{padding-top:4px;}
  .mlay{flex-direction:row;align-items:flex-start;max-width:1400px;gap:18px;justify-content:center;}
  .mlay > .mleft{position:sticky;top:calc(var(--safe-t) + 58px);}
  .mside{width:min(420px, 34vw);flex:none;}
  .pstrip{flex-wrap:wrap;overflow:visible;}
  .pchip{flex:1 1 calc(50% - 6px);}
}
@media (prefers-reduced-motion:reduce){.tk .hop{animation:none!important;}}

<body>
<main class="stage mono" id="app"></main>
<script>
(function () {
  'use strict';
  var M = MonoEngine, A = MonoArt, SQ = M.SQ, GROUPS = M.GROUPS, money = M.money;
  var el = Kit.el, esc = Kit.esc, app = document.getElementById('app');
  var SAVE = 'monopoly_state', KEY = 'monopoly', NETME = 'monopoly_net';
  document.body.insertAdjacentHTML('afterbegin', A.defs());
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // ═══ State ══════════════════════════════════════════════════════════════
  // S: the game (engine state). mode: 'cpu' | 'pass' | 'online'. The online host and offline devices run the
  // engine; online guests get S from the host after every action, with the events to animate.
  var S = null, mode = null, undoStack = [], busy = 0, chain = Promise.resolve(), botT = 0, view = null, lastTurnSeen = -1;
  var speed = lsGet('mono_speed', 'normal'), TEST = { instant: false };
  var disp = null;   // what the board shows while an animation plays: {pos:[], cash:[], jail:[]}
  function T(ms) { return TEST.instant ? 0 : speed === 'fast' ? Math.round(ms * 0.4) : ms; }
  function wait(ms) { ms = T(ms); return new Promise(function (r) { if (!ms) r(); else setTimeout(r, ms); }); }
  function isHuman(p) { return S && S.players[p] && !S.players[p].cpu; }
  // can this device act for player p?
  function mine(p) {
    if (!S || p < 0 || !S.players[p]) return false;
    if (mode === 'online') return p === net.seat && !S.players[p].out;
    return !S.players[p].cpu && !S.players[p].out;
  }
  // whose properties and money the panel shows: you (vs computer, online), or the person whose turn it is (pass and play)
  function viewer() {
    if (mode === 'online') return net.seat;
    if (mode === 'cpu') return 0;
    var n = M.needs(S);
    if (n >= 0 && isHuman(n)) return n;
    if (isHuman(S.cur)) return S.cur;
    return lastHuman >= 0 ? lastHuman : 0;
  }
  var lastHuman = -1;

  Kit.init({
    id: 'monopoly',
    onNew: function () { stopAll(); clearSave(); if (mode === 'online') leaveOnline(); showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Monopoly: past games' }); } },
      { icon: 'globe', label: 'Play online', sub: '2 to 8 players, each on their own device', when: function () { return mode !== 'online'; }, onClick: function () { stopAll(); goLobby(); } },
      { icon: 'logout', label: 'Leave the online game', when: function () { return mode === 'online'; }, onClick: function () { leaveOnline(); showSetup(); } },
      { icon: 'rocket', label: 'Fast computer players', sub: 'Robots move and decide quicker', toggle: function () { return speed === 'fast'; }, onClick: function () { speed = speed === 'fast' ? 'normal' : 'fast'; lsSet('mono_speed', speed); } }
    ],
    rules:
      '<p class="goal">Buy property, charge rent, build houses and hotels, and be the <b>last player standing</b> when everyone else has gone bankrupt.</p>' +
      '<h3>Your turn</h3><ul><li>Roll the two dice and move that many squares. Passing <b>Go</b> pays you <b>$200</b>.</li>' +
      '<li>Roll <b>doubles</b> and you go again. Three doubles in a row sends you to Jail.</li>' +
      '<li>Land on a property no one owns and you can <b>buy</b> it at the printed price. If you don’t, it goes up for <b>auction</b>: everyone (you too) can bid, and the highest bid wins.</li>' +
      '<li>Land on someone else’s property and you pay them <b>rent</b> (shown on the title deed). No rent is paid on mortgaged property.</li>' +
      '<li><b>Railroads</b>: $25, $50, $100 or $200 rent, for 1 to 4 owned. <b>Utilities</b>: 4 times the dice, or 10 times if the owner has both.</li>' +
      '<li><b>Chance</b> and <b>Community Chest</b>: take a card and do what it says.</li></ul>' +
      '<h3>Building</h3><ul><li>Own every street of a colour group (a <b>monopoly</b>) and unimproved rent there doubles. Then you can buy houses.</li>' +
      '<li>Build <b>evenly</b>: no street can get a second house before every street in the group has one, and so on. After 4 houses comes a <b>hotel</b>.</li>' +
      '<li>The bank has only <b>32 houses and 12 hotels</b>. When they run out, no one can build until some come back.</li>' +
      '<li>You can sell buildings back to the bank any time for <b>half</b> what they cost (evenly, too).</li></ul>' +
      '<h3>Jail</h3><ul><li>You go to Jail by landing on Go to Jail, from a card, or by rolling three doubles. You don’t collect $200.</li>' +
      '<li>To get out: pay <b>$50</b> before rolling, use a <b>Get Out of Jail Free</b> card, or roll <b>doubles</b> (up to three tries; doubles move you out but don’t give another roll). After the third miss you pay $50 and move.</li>' +
      '<li>In Jail you still collect rent, build and trade.</li></ul>' +
      '<h3>Money trouble</h3><ul><li><b>Mortgage</b> a property to get half its price from the bank (sell the group’s buildings first). To lift the mortgage, pay that back plus <b>10% interest</b>.</li>' +
      '<li>If you owe more than you can pay, sell buildings and mortgage property. If it still isn’t enough, you are <b>bankrupt</b>: everything you have goes to the player you owe (or back to the bank, which auctions it).</li></ul>' +
      '<h3>Trading</h3><ul><li>Trade properties, cash and Get Out of Jail Free cards with anyone, any time on a turn. Streets in a group with buildings can’t be traded until those are sold.</li>' +
      '<li>Taking a mortgaged property means paying the 10% interest straight away. Pay off the mortgage the same turn and that interest is all you pay.</li></ul>' +
      '<h3>House rules (in setup, off unless you choose them)</h3><ul><li><b>Free Parking jackpot</b>: taxes and fines pile up in the middle; land on Free Parking to take them.</li>' +
      '<li><b>$400 on Go</b>: landing exactly on Go pays double.</li><li><b>No auctions</b>: a property no one buys stays with the bank.</li>' +
      '<li><b>Game length</b>: after the time or the number of rounds, the round is finished and the richest player wins (cash, property at its price, half if mortgaged, and buildings at cost).</li></ul>' +
      '<h3>Playing here</h3><p>Tap any square to see its title deed. Pinch or use + to zoom the board. Build, Mortgage and Trade are under your money.</p>'
  });

  // ═══ Save / resume ══════════════════════════════════════════════════════
  function save() {
    if (!S || mode === 'online') return;
    if (S.phase === 'over') { clearSave(); return; }
    try { localStorage.setItem(SAVE, JSON.stringify({ S: S, mode: mode })); } catch (e) {}
    Kit.resume.set('Round ' + S.round + ' · ' + M.active(S).length + ' players left', { keys: [SAVE] });
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function stopAll() { clearTimeout(botT); busy = 0; chain = Promise.resolve(); undoStack = []; closeSheet(); }

  // ═══ Setup ══════════════════════════════════════════════════════════════

    return Online.host({ game: 'monopoly', name: name, max: 8, accept: function () { return S && mode === 'online' && S.phase !== 'over' ? 'That game has already started' : true; } }).then(function (table) {
      table.on('fail', function (e) { Kit.toast('Couldn’t open a table. ' + Online.errText(e)); leaveOnline(); goLobby(); });
      net.role = 'host'; net.table = table; net.seat = 0; net.pidN = 1;
      net.roster = [{ pid: 1, name: name, host: true, tok: null }];
      table.on('peer', function (peer) {
        if (S && mode === 'online' && S.phase !== 'over') { peer.send({ t: 'full' }, true); setTimeout(function () { peer.close('host'); }, 300); return; }
        peer._pid = ++net.pidN;
        net.roster.push({ pid: peer._pid, name: uniqueName(peer.name), peer: peer, tok: null });
        peer.send({ t: 'you', pid: peer._pid }, true);
        sendRoster(); Kit.toast(peerName(peer) + ' joined'); Kit.sfx('pop');
      });
      table.on('leave', function (peer) {
        var r = net.roster.filter(function (x) { return x.peer === peer; })[0];
        net.roster = net.roster.filter(function (x) { return x.peer !== peer; });
        sendRoster();
        if (r && S && mode === 'online' && S.phase !== 'over' && r.seat != null) {
          var pl = S.players[r.seat];
          if (pl && !pl.out) { pl.cpu = true; S.log.push({ t: pl.name + ' left. The computer plays for them now.', p: r.seat, n: S.turn }); netBroadcast([]); render(); afterChange(); Kit.toast(pl.name + ' left · the computer takes over'); }
        } else if (r) Kit.toast(r.name + ' left');
      });
      table.on('msg', function (peer, m) {
        if (m.t === 'tok') { var rr = net.roster.filter(function (x) { return x.peer === peer; })[0]; if (rr) claimTok(rr, m.tok, peer); return; }
        if (m.t !== 'act' || !S || mode !== 'online') return;
        var r = net.roster.filter(function (x) { return x.peer === peer; })[0];
        if (!r || r.seat == null || !m.a || m.a.p !== r.seat) { peer.send({ t: 'err', msg: 'That isn’t yours to do' }, true); return; }
        var res = doAct(m.a);
        if (res && !res.ok) peer.send({ t: 'err', msg: res.err }, true);
      });
      showWait();
    }).catch(function (e) { Kit.toast('Couldn’t open a table. ' + Online.errText(e)); goLobby(); });
  }
  function peerName(peer) { var r = net.roster.filter(function (x) { return x.peer === peer; })[0]; return r ? r.name : peer.name; }
  function uniqueName(n) { var base = n || 'Player', k = 2, out = base; while (net.roster.some(function (r) { return r.name.toLowerCase() === out.toLowerCase(); })) out = base + ' ' + k++; return out; }
  function sendRoster() {
    var ro = net.roster.map(function (r) { return { pid: r.pid, name: r.name, host: !!r.host, tok: r.tok || null }; });
    if (net.table) net.table.broadcast({ t: 'ro', ro: ro }, true);
    if (net.wait) { net.wait.update(waitPlayers(ro, 1)); olPaint(ro, 1); }
  }
  function waitPlayers(ro, mePid) { return ro.map(function (r, i) { return { name: r.name, host: !!r.host, me: r.pid === mePid, color: Kit.color(i), tok: r.tok || null }; }); }
  function showWait() {
    S = null; view = null; app.className = 'stage';
    if (net.role === 'host') {
      net.table.setStatus('open', '');
      var ro = net.roster.map(function (r) { return { pid: r.pid, name: r.name, host: !!r.host, tok: r.tok || null }; });
      net.wait = Online.waitRoom(app, { code: net.table.code, host: true, max: 8, players: waitPlayers(ro, 1),
        onStart: hostStart, onLeave: function () { leaveOnline(); goLobby(); }, note: 'Everyone starts with $1,500. House rules come from your setup screen.' });
      olMount(); olPaint(ro, 1);
    } else {
      net.wait = Online.waitRoom(app, { code: null, host: false, hostName: net.hostName, max: 8, players: guestPlayers(net.ro || []), onLeave: function () { leaveOnline(); goLobby(); } });
      olMount(); olPaint(net.ro || [], net.myPid);
    }
    window.scrollTo(0, 0);
  }
  // ── Pieces in the wait room. The host's roster holds who has which piece: first come, first served.
  function claimTok(r, tok, peer) {
    if (S && mode === 'online' && S.phase !== 'over') return;
    tok = tok || null;
    if (tok && M.TOKENS.indexOf(tok) < 0) return;
    if (tok && net.roster.some(function (x) { return x !== r && x.tok === tok; })) {
      if (peer) peer.send({ t: 'tokno', tok: tok }, true); else if (net.ol) shakeWell(net.ol.tray.wells[tok]);
      return;
    }
    r.tok = tok; sendRoster();
  }
  function guestPid(ro) { if (net.myPid) return net.myPid; var me = ro.filter(function (r) { return r.name === meName(); })[0]; return me ? me.pid : -1; }
  function guestPlayers(ro) { return waitPlayers(ro, guestPid(ro)); }
  function olRo() { return net.role === 'host' ? net.roster.map(function (r) { return { pid: r.pid, name: r.name, host: !!r.host, tok: r.tok || null }; }) : (net.ro || []); }
  function olMe() { return net.role === 'host' ? 1 : guestPid(net.ro || []); }
  // the tray goes under the list of players
  function olMount() {
    var wrap = app.querySelector('.ol'), list = wrap && wrap.querySelector('.stack');
    if (!wrap || !list) { net.ol = null; return; }
    var tray = trayEl(olTap);
    var box = el('div', { class: 'pk-ol' }, [el('div', { class: 'ol-h', text: 'Your piece' }), el('div', { class: 'pk-box wood' }, [tray.el])]);
    list.parentNode.insertBefore(box, list.nextSibling);
    net.ol = { el: box, tray: tray, pending: null, prev: null };
  }
  function olTap(tok) {
    if (!net.ol) return;
    var ro = olRo(), me = olMe(), owner = ro.filter(function (r) { return r.tok === tok; })[0], mine = ro.filter(function (r) { return r.pid === me; })[0];
    if (owner && owner.pid !== me) { shakeWell(net.ol.tray.wells[tok]); return; }
    if (net.ol.pending) return;
    var want = owner ? null : tok;   // tap your own piece to put it back
    if (owner) { Kit.sfx('deal'); Kit.haptic('light'); }
    if (net.role === 'host') { var r = net.roster.filter(function (x) { return x.pid === 1; })[0]; if (r) claimTok(r, want, null); return; }
    if (!mine) return;
    if (want) { net.ol.pending = want; Kit.sfx('pop'); Kit.haptic('light'); olPaint(ro, me); var P = net.ol; setTimeout(function () { if (net.ol === P && P.pending === want) { P.pending = null; olPaint(olRo(), olMe()); } }, 5000); }
    netSend({ t: 'tok', tok: want });
  }
  function olPaint(ro, me) {
    var O = net.ol; if (!O) return;
    var mi = -1; ro.forEach(function (r, i) { if (r.pid === me) mi = i; });
    var my = mi >= 0 ? ro[mi] : null, myTok = my && my.tok, mc = mi >= 0 ? pcolor(mi) : '#ffd27a';
    if (O.pending && (myTok === O.pending || ro.some(function (r) { return r.tok === O.pending; }))) O.pending = null;
    var last = !myTok && my ? lastTok(my.name) : null;
    O.tray.el.style.setProperty('--c', mc);
    M.TOKENS.forEach(function (t) {
      var w = O.tray.wells[t], oi = -1; ro.forEach(function (r, i) { if (r.tok === t) oi = i; });
      var own = oi >= 0 ? ro[oi] : null, isMine = own && own.pid === me;
      w.style.setProperty('--c', mc);
      w.classList.toggle('taken', !!own && !isMine);
      w.classList.toggle('mine', !!isMine);
      w.classList.toggle('wait', t === O.pending);
      w.classList.toggle('last', t === last && !own && !O.pending);
      w.setAttribute('aria-label', A.TOK_NAME[t] + (isMine ? ' (yours, tap to put it back)' : own ? ' (' + own.name + '’s)' : ''));
      var disc = w.querySelector('.pk-own'), key = own && !isMine ? own.pid + ':' + oi : '';
      if ((disc ? disc.getAttribute('data-k') : '') !== key) {
        if (disc) disc.remove();
        if (key) w.appendChild(el('i', { class: 'pk-own', 'data-k': key, style: { '--oc': pcolor(oi) }, text: (own.name || '?').charAt(0).toUpperCase() }));
      }
    });
    // each player's piece beside their name
    var rows = app.querySelectorAll('.ol .stack .ol-seat'), badges = {};
    ro.forEach(function (r, i) {
      var row = rows[i]; if (!row) return;
      var old = row.querySelector('.pk-badge'); if (old) old.remove();
      var b = el('span', { class: 'pk-badge' + (r.tok ? ' has' : ''), style: { '--c': pcolor(i) }, title: r.tok ? A.TOK_NAME[r.tok] : '', html: r.tok ? A.token(r.tok) : '' });
      row.appendChild(b); badges[r.pid] = b;
    });
    // what changed since last time: your piece flies to your name; others' pieces pop in beside theirs
    var prev = O.prev; O.prev = {}; ro.forEach(function (r) { O.prev[r.pid] = r.tok || null; });
    if (!prev) return;
    ro.forEach(function (r) {
      var was = prev[r.pid], b = badges[r.pid];
      if (!r.tok || r.tok === was || !b) return;
      if (r.pid === me) {
        b.style.visibility = 'hidden';
        flyTok(r.tok, O.tray.wells[r.tok].querySelector('.pk-pc'), b).then(function () { b.style.visibility = ''; b.classList.add('land'); Kit.sfx('chip'); Kit.haptic('medium'); });
      } else { b.classList.add('land'); Kit.sfx('chip', 0.6); }
    });
  }
  function hostStart() {
    if (net.roster.length < 2) { Kit.toast('Wait for at least one more player'); return; }
    var opts = (lsGet(NETME, {}) || {}).opts || { len: 'all' };
    net.roster.forEach(function (r, i) { r.seat = i; });
    // anyone who didn't pick a piece gets one of those left
    var left = shuffled(M.TOKENS.filter(function (t) { return !net.roster.some(function (r) { return r.tok === t; }); }));
    net.roster.forEach(function (r) { if (!r.tok) r.tok = left.shift(); });
    net.wait = null; net.ol = null; mode = 'online';
    S = M.newGame(net.roster.map(function (r) { return { name: r.name, cpu: false, tok: r.tok }; }), opts);
    rememberToks([S.players[0]]);
    Kit.gameStart(); S.started = Date.now(); undoStack = [];
    net.roster.forEach(function (r) { if (r.peer) r.peer.send({ t: 'seat', seat: r.seat }, true); });
    net.table.setStatus('playing', 'Round 1');
    build(); render(); netBroadcast([]);
    setTimeout(function () { Kit.callout(S.players[0].name + ' goes first'); }, 400);
    afterChange();
  }
  function netBroadcast(ev) {
    if (!net.table) return;
    var s = JSON.parse(JSON.stringify(S)); s.log = s.log.slice(-40);
    net.table.broadcast({ t: 'st', s: s, ev: ev }, true);
    if (S.phase !== 'over') net.table.setStatus('playing', 'Round ' + S.round);
    else net.table.setStatus('open', '');
  }
  function netSend(m) { if (net.peer && !net.peer.closed) net.peer.send(m, true); else Kit.toast('Not connected to the table'); }
  function joinTable(code, name) {
    closeLobby(); busyScreen('Connecting to the table…');
    return Online.join(code, { game: 'monopoly', name: name }).then(function (peer) {
      net.role = 'guest'; net.peer = peer; net.hostName = peer.name; net.ro = []; net.seat = -1; net.myPid = null;
      peer.on('msg', guestMsg);
      peer.on('close', function (why) {
        if (net.peer !== peer) return;
        var playing = S && mode === 'online' && S.phase !== 'over';
        net.peer = null; net.role = null;
        if (playing) { mode = null; Kit.sheet({ title: 'The game ended', html: '<p class="muted">' + esc(net.hostName || 'The host') + (why === 'host' || why === 'left' ? ' closed the table.' : '’s table lost its connection.') + '</p>', actions: [{ label: 'Back to the lobby', primary: true, onClick: goLobby }] }); }
        else if (!S) { Kit.toast((net.hostName || 'The host') + ' closed the table'); goLobby(); }
      });
      showWait();
    }).catch(function (e) {
      var msg = e && e.nat ? e.message : Online.errText(e);
      if (e && e.nat) Kit.sheet({ title: 'Couldn’t connect', html: '<p>' + esc(msg) + '</p>' }); else Kit.toast(msg);
      goLobby();
    });
  }
  function guestMsg(m) {
    if (m.t === 'ro') { net.ro = m.ro; if (net.wait) { net.wait.update(guestPlayers(m.ro)); olPaint(m.ro, guestPid(m.ro)); } return; }
    if (m.t === 'you') { net.myPid = m.pid; return; }
    if (m.t === 'tokno') { if (net.ol) { net.ol.pending = null; olPaint(net.ro || [], guestPid(net.ro || [])); shakeWell(net.ol.tray.wells[m.tok]); } return; }
    if (m.t === 'full') { Kit.toast('That game has already started'); return; }
    if (m.t === 'seat') { net.seat = m.seat; return; }
    if (m.t === 'err') { Kit.toast(m.msg || 'Not now'); Kit.sfx('bad'); return; }
    if (m.t === 'st') {
      var fresh = !S || mode !== 'online';
      if (fresh) {
        mode = 'online'; net.wait = null; net.ol = null; S = m.s; build(); render(); Kit.gameStart();
        if (S.players[net.seat]) rememberToks([S.players[net.seat]]);
        setTimeout(function () { Kit.callout(S.players[S.cur].name + ' goes first'); }, 400);
        return;
      }
      var pre = snapPre(), next = m.s;
      // animate from what's on screen to the host's new state
      busy++;
      chain = chain.then(function () {
        var shownS = S; S = next;
        S.recorded = shownS.recorded;
        return animate(m.ev || [], pre);
      }).catch(function (e) { console.error(e); }).then(function () { disp = null; busy = Math.max(0, busy - 1); render(); afterChange(); });
    }
  }
  function backToTable() {
    if (net.role === 'host' && net.table && !net.table.closed) { mode = null; net.roster.forEach(function (r) { delete r.seat; }); showWait(); sendRoster(); return; }
    if (net.role === 'guest' && net.peer && !net.peer.closed) { mode = null; showWait(); return; }
    leaveOnline(); goLobby();
  }

  // a game against the clock: count the time spent playing (not time the app sat closed)
  setInterval(function () {
    if (!S || S.phase === 'over' || document.hidden || (mode === 'online' && net.role === 'guest')) return;
    if (!/^m/.test(S.opts.len || '')) return;
    S.elapsed += 5000;
    if (view && view.act) { var lim = view.act.querySelector('.lim'); if (lim && !M.limitHit(S)) lim.textContent = Math.ceil(Math.max(0, +S.opts.len.slice(1) * 60000 - S.elapsed) / 60000) + ' min left'; }
  }, 5000);

  // ═══ Test hooks ═════════════════════════════════════════════════════════
  window.__mono = {
    S: function () { return S; }, M: M, act: function (a) { return doAct(a); }, mode: function () { return mode; }, busy: function () { return busy; },
    instant: function (on) { TEST.instant = on !== false; }, speed: function (v) { speed = v; }, seat: function () { return net.seat; }, role: function () { return net.role; },
    setState: function (s) { S = s; build(); render(); afterChange(); },
    pick: function () { return pick ? { toks: pick.toks.slice(), chooser: chooser(), anim: pick.anim } : null; }, roster: function () { return net.role === 'host' ? olRo() : net.ro; }, render: function () { render(); }, deed: deedSheet, build: buildSheet, mortgage: mortSheet, trade: tradeSheet
  };

  // ═══ Start ══════════════════════════════════════════════════════════════
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (/[?&]online=1/.test(location.search)) goLobby();
  else if (saved && saved.S && saved.S.players && saved.S.phase !== 'over' && saved.mode !== 'online') { S = saved.S; mode = saved.mode; build(); render(); afterChange(); }
  else showSetup();
})();
</script>

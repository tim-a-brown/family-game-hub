<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordle</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../data/wordle-words.js"></script>
<style>
:root{--hit:#3ddc84;--near:#ffc83d;--miss:#4a4170;}
body{overflow:hidden;}
.wd{display:flex;flex-direction:column;height:calc(100dvh - var(--safe-t) - 58px);max-width:500px;margin:0 auto;padding:0 10px calc(var(--safe-b) + 8px);}
.modes{display:flex;justify-content:center;margin:2px 0 8px;}
.modes{align-items:center;gap:8px;}
.modes .seg{width:100%;max-width:340px;}
.hardpill{flex:none;display:none;align-items:center;gap:4px;padding:0 10px;height:30px;border-radius:999px;border:0;background:color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange);font-weight:900;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;}
.hardpill.on{display:inline-flex;}
.hardpill .ico{width:14px;height:14px;}
.modes .seg > button{min-height:38px;font-size:.88rem;}
.gridwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
.grid{display:grid;gap:6px;width:min(100%, 340px, calc((100dvh - var(--safe-t) - 58px - 290px - var(--safe-b)) * .82));}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.row.shake{animation:shake .4s;}
.tile{display:grid;place-items:center;aspect-ratio:1;border-radius:12px;font-size:clamp(1.5rem,7vw,2.1rem);font-weight:900;color:var(--text);
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 2px rgba(255,255,255,.1);text-transform:uppercase;perspective:400px;}
.tile.typed{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);animation:pop .15s var(--spring);}
.tile.hit,.tile.near,.tile.miss{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);}
.tile.hit{background:var(--hit);color:#05290f;}
.tile.near{background:var(--near);color:#2b1a00;}
.tile.miss{background:var(--miss);color:#d9d2f5;}
.tile.flip{animation:flip .5s var(--ease) both;}
@keyframes flip{0%{transform:rotateX(0);}50%{transform:rotateX(90deg);}100%{transform:rotateX(0);}}
.tile.dance{animation:dance .6s var(--spring) both;}
@keyframes dance{30%{transform:translateY(-22px);}60%{transform:translateY(4px);}100%{transform:none;}}
.kb{display:flex;flex-direction:column;gap:7px;margin-top:10px;user-select:none;}
.kb .r{display:flex;justify-content:center;gap:5px;}
.key{flex:1;max-width:44px;height:56px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:var(--text);
  font-weight:900;font-size:1.05rem;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .06s, background .3s;}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.key.wide{max-width:66px;flex:1.5;font-size:.8rem;}
.key.hit{background:var(--hit);color:#05290f;}
.key.near{background:var(--near);color:#2b1a00;}
.key.miss{background:#2a2348;color:#7d74a6;}
.sw{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font-weight:900;font-size:.9rem;vertical-align:middle;margin-right:4px;}
.sw.hit{background:var(--hit);color:#05290f;}.sw.near{background:var(--near);color:#2b1a00;}.sw.miss{background:var(--miss);color:#d9d2f5;}
.mini{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
.mrow{display:flex;gap:4px;}
.mrow .sw{margin:0;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 14px;}
.stats div{text-align:center;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.05);}
.stats b{display:block;font-size:1.5rem;font-weight:900;}
.stats span{font-size:.72rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}
.dist{display:flex;flex-direction:column;gap:5px;text-align:left;margin-bottom:6px;}
.dist .l{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.85rem;}
.dist .bar{min-width:24px;padding:3px 8px;border-radius:6px;background:var(--miss);text-align:right;}
.dist .bar.me{background:var(--hit);color:#05290f;}
.answer{display:flex;justify-content:center;gap:5px;margin:4px 0 14px;}
.answer span{width:40px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--hit);color:#05290f;font-weight:900;font-size:1.3rem;}
.answer.lost span{background:var(--red);color:#fff;}
</style>
</head>
<body>
<div class="wd" id="app">
  <div class="modes"><div class="seg" id="modes"></div><button class="hardpill" id="hardpill" type="button" aria-label="Hard mode is on. Tap to change."></button></div>
  <div class="gridwrap"><div class="grid" id="grid"></div></div>
  <div class="kb" id="kb"></div>
</div>
<script>
(function () {
  'use strict';
  var el = Kit.el, $ = function (id) { return document.getElementById(id); };
  var ANSWERS = WORDLE_ANSWERS.filter(function (w, i, a) { return a.indexOf(w) === i; });
  var VALID = new Set(ANSWERS.concat(WORDLE_EXTRA));
  var SAVE = 'wordle_state';

  Kit.init({
    id: 'wordle',
    confirmNew: false,
    onNew: function () { start(true); },
    menu: [
      { icon: 'chart', label: 'Stats', onClick: function () { showStats(); } },
      { icon: 'flame', label: function () { return 'Hard mode: ' + (hard ? 'on' : 'off'); }, onClick: function () { toggleHard(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history('wordle', { title: 'Wordle: past games', extra: miniGrid }); } }
    ],
    rules:
      '<p class="goal">Guess the secret <b>five-letter word</b> in six tries.</p>' +
      '<h3>How it works</h3><ul><li>Type any real five-letter word and press <b>Enter</b>.</li>' +
      '<li>The tiles change colour to show how close you are:</li></ul>' +
      '<p><span class="sw hit">A</span> <b>Green</b>: right letter, right spot.</p><p><span class="sw near">B</span> <b>Yellow</b>: in the word, but somewhere else.</p><p><span class="sw miss">C</span> <b>Grey</b>: not in the word at all.</p>' +
      '<p>Letters can repeat. A letter only lights up as many times as it appears in the answer.</p>' +
      '<h3>Daily or practice</h3><p><b>Daily</b> is the same word for everyone today. <b>Practice</b> gives you a new random word whenever you like.</p>' +
      '<h3>Hard mode</h3><p>Any green or yellow letter you find must be used in every guess after it.</p>'
  });

  // ── Puzzle selection (same daily numbering as before) ─────────────────────
  function today() {
    var day = Math.floor((Date.now() - new Date('2024-01-01').getTime()) / 86400000);
    var h = day * 1664525 + 1013904223;
    h = ((h ^ (h >>> 16)) * 2246822507) >>> 0;
    h = ((h ^ (h >>> 13)) * 3266489909) >>> 0;
    h = (h ^ (h >>> 16)) >>> 0;
    return { word: ANSWERS[h % ANSWERS.length], day: day + 1 };
  }
  function playedToday() {
    var d = today().day;
    return GameHistory.load('wordle').some(function (e) { return e.dayNum === d && !e.randomMode; });
  }

  var S = null; // {answer, guesses:[], cur:'', over, won, random, day}
  var hard = localStorage.getItem('wordle_hard') === '1';
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} if (!S.over && S.guesses.length) Kit.resume.set((S.random ? 'Practice' : 'Daily #' + S.day) + ' · ' + S.guesses.length + '/6'); }

  function start(random) {
    var t = today();
    if (!random && playedToday()) { random = true; Kit.toast("You've done today's word. Here's a practice one!"); }
    S = { answer: random ? ANSWERS[Math.floor(Math.random() * ANSWERS.length)] : t.word, guesses: [], cur: '', over: false, won: false, random: !!random, day: t.day, started: Date.now() };
    Kit.resume.clear(); save(); build();
  }

  // ── Scoring (two-pass so repeated letters are handled correctly) ──────────
  function check(guess, ans) {
    var res = ['miss', 'miss', 'miss', 'miss', 'miss'], left = ans.split('');
    for (var i = 0; i < 5; i++) if (guess[i] === ans[i]) { res[i] = 'hit'; left[i] = null; }
    for (i = 0; i < 5; i++) {
      if (res[i] === 'hit') continue;
      var k = left.indexOf(guess[i]);
      if (k >= 0) { res[i] = 'near'; left[k] = null; }
    }
    return res;
  }
  function hardModeProblem(guess) {
    for (var g = 0; g < S.guesses.length; g++) {
      var prev = S.guesses[g], r = check(prev, S.answer);
      for (var i = 0; i < 5; i++) {
        if (r[i] === 'hit' && guess[i] !== prev[i]) return (i + 1) + ordinal(i + 1) + ' letter must be ' + prev[i];
      }
      for (i = 0; i < 5; i++) {
        if (r[i] === 'near') {
          var need = 0, have = 0;
          for (var j = 0; j < 5; j++) { if (prev[j] === prev[i] && r[j] !== 'miss') need++; if (guess[j] === prev[i]) have++; }
          if (have < need) return 'Guess must contain ' + prev[i];
        }
      }
    }
    return null;
  }
  function ordinal(n) { return n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'; }

  // ── Input ─────────────────────────────────────────────────────────────────
  var busy = false;
  function type(ch) {
    if (!S || S.over || busy) return;
    if (ch === 'ENTER') return submit();
    if (ch === 'BACK') { if (S.cur.length) { S.cur = S.cur.slice(0, -1); Kit.sfx('tap'); paintRow(S.guesses.length); } return; }
    if (S.cur.length >= 5) return;
    S.cur += ch; Kit.sfx('tap'); Kit.haptic('tick'); paintRow(S.guesses.length, true);
  }
  function submit() {
    var g = S.cur, rowEl = rows[S.guesses.length];
    function nope(msg) { Kit.toast(msg); Kit.sfx('bad'); Kit.haptic('error'); rowEl.classList.remove('shake'); void rowEl.offsetWidth; rowEl.classList.add('shake'); }
    if (g.length < 5) return nope('Not enough letters');
    if (!VALID.has(g)) return nope('Not in the word list');
    if (hard) { var p = hardModeProblem(g); if (p) return nope(p); }
    S.guesses.push(g); S.cur = '';
    var res = check(g, S.answer), r = S.guesses.length - 1;
    busy = true;
    rows[r].querySelectorAll('.tile').forEach(function (t, i) {
      setTimeout(function () { t.classList.add('flip'); Kit.sfx('flip'); }, i * 260);
      setTimeout(function () { t.classList.remove('typed'); t.classList.add(res[i]); }, i * 260 + 250);
    });
    setTimeout(function () {
      busy = false; paintKeys();
      if (g === S.answer) win(); else if (S.guesses.length === 6) lose();
      save();
    }, 5 * 260 + 300);
    save();
  }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.k-scrim,.k-win')) return;
    if (e.key === 'Enter') type('ENTER');
    else if (e.key === 'Backspace') type('BACK');
    else if (/^[a-z]$/i.test(e.key)) type(e.key.toUpperCase());
  });

  // Small coloured grid of a finished puzzle, for Past games
  function miniGrid(e) {
    if (!e || !e.guesses || !e.guesses.length) return null;
    var map = { hit: 'hit', correct: 'hit', near: 'near', present: 'near', miss: 'miss', absent: 'miss' };
    var box = Kit.el('div', { class: 'mini' });
    e.guesses.forEach(function (g, i) {
      var res = (e.results && e.results[i]) || check(g, e.answer);
      var row = Kit.el('div', { class: 'mrow' });
      g.split('').forEach(function (ch, j) { row.appendChild(Kit.el('span', { class: 'sw ' + (map[res[j]] || 'miss'), text: ch })); });
      box.appendChild(row);
    });
    return box;
  }

  // ── Endings ───────────────────────────────────────────────────────────────
  var CHEERS = ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'];
  function record() {
    S.over = true;
    var hist = GameHistory.load('wordle'), streak = 0;
    for (var i = 0; i < hist.length; i++) { if (hist[i].won) streak++; else break; }
    if (S.won) streak++;
    var hl = [];
    if (!S.won) hl.push('The word ' + S.answer + ' got away');
    else if (S.guesses.length <= 2) hl.push(CHEERS[S.guesses.length - 1] + ' Solved in ' + S.guesses.length);
    if (hard) hl.push('Played in hard mode');
    if (S.won && streak > 1) hl.push('Win streak: ' + streak);
    if (S.guesses.length) hl.push('Opened with ' + S.guesses[0]);
    Kit.record('wordle', {
      started: S.started, mode: (S.random ? 'Practice' : 'Daily #' + S.day) + (hard ? ' · Hard' : ''),
      summary: (S.won ? 'Solved in ' + S.guesses.length + '/6' : 'Missed') + ' · ' + S.answer, badge: S.won ? S.guesses.length + '/6' : 'X',
      highlights: hl,
      meta: { answer: S.answer, guesses: S.guesses, results: S.guesses.map(function (g) { return check(g, S.answer); }), won: S.won, dayNum: S.day, randomMode: S.random, hard: hard }
    });
    Kit.resume.clear();
  }
  function win() {
    S.won = true; record();
    var r = rows[S.guesses.length - 1];
    r.querySelectorAll('.tile').forEach(function (t, i) { setTimeout(function () { t.classList.remove('flip'); t.classList.add('dance'); }, i * 90); });
    Kit.callout(CHEERS[S.guesses.length - 1]);
    setTimeout(function () { result(); }, 1500);
  }
  function lose() { S.won = false; record(); setTimeout(result, 600); }

  function statsNode(highlight) {
    var hist = GameHistory.load('wordle'), played = hist.length, wins = hist.filter(function (h) { return h.won; }).length;
    var streak = 0; for (var i = 0; i < hist.length; i++) { if (hist[i].won) streak++; else break; }
    var dist = [0, 0, 0, 0, 0, 0];
    hist.forEach(function (h) { if (h.won && h.guesses && h.guesses.length) dist[h.guesses.length - 1]++; });
    var max = Math.max.apply(null, [1].concat(dist));
    var box = el('div');
    box.appendChild(el('div', { class: 'stats', html:
      '<div><b>' + played + '</b><span>Played</span></div><div><b>' + (played ? Math.round(wins / played * 100) : 0) + '</b><span>Win %</span></div>' +
      '<div><b>' + streak + '</b><span>Streak</span></div><div><b>' + (dist.reduce(function (a, b, i) { return a || (b ? i + 1 : 0); }, 0) || '–') + '</b><span>Best</span></div>' }));
    var d = el('div', { class: 'dist' });
    dist.forEach(function (n, i) {
      d.appendChild(el('div', { class: 'l' }, [el('span', { text: String(i + 1) }), el('span', { class: 'bar' + (highlight === i + 1 ? ' me' : ''), style: { width: Math.max(8, n / max * 100) + '%' }, text: String(n) })]));
    });
    box.appendChild(d);
    box.appendChild(el('div', { class: 'dim', style: { 'font-size': '.75rem', 'margin-top': '6px' }, text: 'Based on your last ' + played + ' games' }));
    return box;
  }
  function showStats() { Kit.sheet({ title: 'Your Wordle stats', node: statsNode(), actions: [{ label: 'Close', cls: 'btn-soft' }] }); }
  function share() {
    var emo = { hit: '🟩', near: '🟨', miss: '⬛' };
    var text = 'Wordle ' + (S.random ? '(practice)' : '#' + S.day) + ' ' + (S.won ? S.guesses.length : 'X') + '/6' + (hard ? '*' : '') + '\n\n' +
      S.guesses.map(function (g) { return check(g, S.answer).map(function (r) { return emo[r]; }).join(''); }).join('\n');
    if (navigator.share && matchMedia('(pointer:coarse)').matches) { navigator.share({ text: text }).catch(function () {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { Kit.toast('Copied!'); }, function () { Kit.toast("Couldn't copy"); });
  }
  function result() {
    var w = Kit.win({
      title: S.won ? CHEERS[S.guesses.length - 1] : 'So close!',
      sub: S.won ? 'Solved in ' + S.guesses.length + (S.guesses.length === 1 ? ' guess' : ' guesses') : 'The word was',
      lose: !S.won, againLabel: 'Practice word',
      again: function () { start(true); },
      extra: [{ label: 'Share', onClick: function () { share(); } }]
    });
    var card = document.querySelector('.k-win .card'), sub = card.querySelector('.sub');
    var ans = el('div', { class: 'answer' + (S.won ? '' : ' lost') });
    S.answer.split('').forEach(function (c) { ans.appendChild(el('span', { text: c })); });
    sub.after(ans);
    ans.after(statsNode(S.won ? S.guesses.length : 0));
  }

  // ── Render ────────────────────────────────────────────────────────────────
  var rows = [], keys = {};
  function build() {
    var t = today(), m = $('modes'); m.innerHTML = '';
    [['daily', 'Daily #' + t.day], ['random', 'Practice']].forEach(function (x) {
      m.appendChild(el('button', {
        type: 'button', class: (S.random ? 'random' : 'daily') === x[0] ? 'on' : '', text: x[1],
        onclick: function () {
          var want = x[0] === 'random';
          if (want === S.random && !(want && S.over)) return;
          if (S.guesses.length && !S.over) Kit.confirm(want ? 'Switch to a practice word?' : 'Switch to the daily word?', { ok: 'Switch', body: 'This puzzle will be dropped.' }).then(function (ok) { if (ok) start(want); });
          else start(want);
        }
      }));
    });
    var g = $('grid'); g.innerHTML = ''; rows = [];
    for (var r = 0; r < 6; r++) {
      var row = el('div', { class: 'row' });
      for (var c = 0; c < 5; c++) row.appendChild(el('div', { class: 'tile' }));
      rows.push(row); g.appendChild(row);
    }
    S.guesses.forEach(function (gs, i) {
      var res = check(gs, S.answer);
      rows[i].querySelectorAll('.tile').forEach(function (tl, j) { tl.textContent = gs[j]; tl.classList.add(res[j]); });
    });
    paintRow(S.guesses.length);
    var kb = $('kb'); kb.innerHTML = ''; keys = {};
    ['QWERTYUIOP', 'ASDFGHJKL', '+ZXCVBNM-'].forEach(function (line) {
      var r = el('div', { class: 'r' });
      line.split('').forEach(function (k) {
        var label = k === '+' ? 'ENTER' : k === '-' ? '⌫' : k, val = k === '+' ? 'ENTER' : k === '-' ? 'BACK' : k;
        var b = el('button', { type: 'button', class: 'key' + (k === '+' || k === '-' ? ' wide' : ''), text: label, 'aria-label': val === 'BACK' ? 'Delete' : val });
        b.addEventListener('click', function () { type(val); });
        keys[val] = b; r.appendChild(b);
      });
      kb.appendChild(r);
    });
    paintKeys();
  }
  function paintRow(r, justTyped) {
    if (r >= 6) return;
    rows[r].querySelectorAll('.tile').forEach(function (t, i) {
      var ch = S.cur[i] || '';
      t.textContent = ch;
      t.classList.toggle('typed', !!ch);
      if (justTyped && i === S.cur.length - 1) { t.classList.remove('typed'); void t.offsetWidth; t.classList.add('typed'); }
    });
  }
  function paintKeys() {
    var rank = { miss: 1, near: 2, hit: 3 }, best = {};
    S.guesses.forEach(function (g) {
      check(g, S.answer).forEach(function (r, i) { var c = g[i]; if (!best[c] || rank[r] > rank[best[c]]) best[c] = r; });
    });
    Object.keys(keys).forEach(function (k) { keys[k].classList.remove('hit', 'near', 'miss'); if (best[k]) keys[k].classList.add(best[k]); });
  }
  function toggleHard() {
    if (S.guesses.length && !S.over && !hard) return Kit.toast('Turn on hard mode before your first guess');
    hard = !hard; localStorage.setItem('wordle_hard', hard ? '1' : '0'); paintHard();
    Kit.toast(hard ? 'Hard mode on' : 'Hard mode off');
  }

  function paintHard() { var b = $('hardpill'); b.innerHTML = Kit.icon('flame') + '<span>Hard</span>'; b.classList.toggle('on', hard); }
  $('hardpill').addEventListener('click', function () { Kit.confirm('Turn hard mode off?', { ok: 'Turn off', body: 'Hard mode makes you reuse every green and yellow letter you find.' }).then(function (ok) { if (ok) toggleHard(); }); });
  paintHard();

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.answer && !saved.over && (saved.random || saved.day === today().day)) { S = saved; build(); }
  else start(false);
})();
</script>
</body>
</html>

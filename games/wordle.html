<title>Wordle</title>

<style>
body{background:radial-gradient(ellipse at 50% 0%,#0a1a0a 0%,#0d1117 70%);}
.wd-wrap{max-width:400px;margin:0 auto;padding:0 8px 60px;}
.wd-header{text-align:center;margin-bottom:6px;}
.wd-title{font-family:var(--serif);font-size:1.6rem;font-weight:900;letter-spacing:.05em;}
.wd-sub{color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;}
/* Board */
.wd-board{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;width:min(300px,80vw);margin:12px auto;}
.wd-row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.wd-cell{aspect-ratio:1;border:2px solid rgba(255,255,255,.15);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.2rem,5vw,1.5rem);font-weight:900;font-family:var(--serif);text-transform:uppercase;color:#fff;position:relative;transition:border-color .1s;}
.wd-cell.filled{border-color:rgba(255,255,255,.4);}
.wd-cell.active-row{border-color:rgba(245,200,66,.5);}
.wd-cell[data-state='correct']{background:#22c55e;border-color:#22c55e;}
.wd-cell[data-state='present']{background:#f59e0b;border-color:#f59e0b;}
.wd-cell[data-state='absent']{background:#374151;border-color:#374151;}
/* Flip animation */
@keyframes wd-flip{0%{transform:rotateX(0);}50%{transform:rotateX(-90deg);}100%{transform:rotateX(0);}  }
.wd-cell.flipping{animation:wd-flip .45s ease forwards;}
/* Pop on type */
@keyframes wd-pop{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}  }
.wd-cell.popping{animation:wd-pop .08s ease;}
/* Shake on bad word */
@keyframes wd-shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}  }
.wd-row.shaking{animation:wd-shake .4s ease;}
/* Bounce on win */
@keyframes wd-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}  }
.wd-cell.bouncing{animation:wd-bounce .4s ease;}
/* Status */
.wd-status{text-align:center;font-size:.85rem;font-weight:700;min-height:26px;margin:4px 0 8px;}
/* Keyboard */
.wd-kb{display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:10px;}
.wd-kb-row{display:flex;gap:4px;}
.wd-key{height:44px;min-width:30px;padding:0 6px;border-radius:6px;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:.78rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;touch-action:manipulation;font-family:var(--body);}
.wd-key.wide{min-width:52px;font-size:.7rem;}
.wd-key[data-state='correct']{background:#22c55e;}
.wd-key[data-state='present']{background:#f59e0b;}
.wd-key[data-state='absent']{background:#374151;color:rgba(255,255,255,.4);}
.wd-key:active{transform:scale(.94);}
/* Result panel */
.wd-result{display:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;margin-top:10px;text-align:center;}
.wd-result.show{display:block;}
.wd-result-word{font-family:var(--serif);font-size:1.4rem;font-weight:900;color:var(--gold);margin-bottom:4px;}
.wd-result-msg{font-size:.82rem;color:var(--muted);margin-bottom:10px;}
.wd-share{font-size:.82rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 12px;color:rgba(255,255,255,.7);cursor:pointer;display:inline-block;margin-bottom:8px;}
.wd-share:hover{background:rgba(255,255,255,.14);}
.wd-day{color:var(--muted);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
</style>

// Combined valid-guess set: answers + extras
const ALLVALID=new Set([...WORDSET,...EXTRA_GUESSES.filter(w=>/^[A-Z]{5}$/.test(w))]);

// ── Daily word ────────────────────────────────────────────────────────────────
function getDailyWord(){
  const epoch=new Date('2024-01-01').getTime();
  const day=Math.floor((Date.now()-epoch)/86400000);
  const idx=day%WORDLIST.length;
  return{word:WORDLIST[idx],day:day+1};
}

// ── State ─────────────────────────────────────────────────────────────────────
let answer='',dayNum=0,guesses=[],currentRow=0,currentCol=0,gameOver=false,randomMode=false;

function init(useRandom=false){
  randomMode=useRandom;
  if(useRandom){
    answer=WORDLIST[Math.floor(Math.random()*WORDLIST.length)];
    dayNum=0;
  } else {
    const d=getDailyWord();
    answer=d.word;dayNum=d.day;
  }
  guesses=[];currentRow=0;currentCol=0;gameOver=false;
  document.getElementById('wd-day').textContent=randomMode?'Random Mode':`Puzzle #${dayNum}`;
  buildBoard();
  buildKeyboard();
  document.getElementById('wd-result').classList.remove('show');
  setStatus('');
}

function buildBoard(){
  const board=document.getElementById('wd-board');
  board.innerHTML='';
  for(let r=0;r<6;r++){
    const row=document.createElement('div');
    row.className='wd-row';row.id='wd-row-'+r;
    for(let c=0;c<5;c++){
      const cell=document.createElement('div');
      cell.className='wd-cell';cell.id=`wd-${r}-${c}`;
      row.appendChild(cell);
    }
    board.appendChild(row);
  }
}

const KB_ROWS=['QWERTYUIOP','ASDFGHJKL','⌫ZXCVBNM↵'];
const keyState={};

function buildKeyboard(){
  Object.keys(keyState).forEach(k=>delete keyState[k]);
  KB_ROWS.forEach((row,ri)=>{
    const rowEl=document.getElementById('wd-kb-r'+ri);
    rowEl.innerHTML='';
    row.split('').forEach(k=>{
      const btn=document.createElement('button');
      btn.className='wd-key'+(k==='⌫'||k==='↵'?' wide':'');
      btn.textContent=k;btn.dataset.key=k;
      btn.addEventListener('click',()=>handleKey(k));
      rowEl.appendChild(btn);
    });
  });
}

function setStatus(msg,color){
  const el=document.getElementById('wd-status');
  el.textContent=msg;
  el.style.color=color||'var(--muted)';
}

function getCell(r,c){return document.getElementById(`wd-${r}-${c}`);}

// ── Input ─────────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey)return;
  if(e.key==='Backspace')handleKey('⌫');
  else if(e.key==='Enter')handleKey('↵');
  else if(/^[a-zA-Z]$/.test(e.key))handleKey(e.key.toUpperCase());
});

function handleKey(k){
  if(gameOver)return;
  if(k==='⌫'){deleteLetter();}
  else if(k==='↵'){submitGuess();}
  else if(currentCol<5&&/^[A-Z]$/.test(k)){typeLetter(k);}
}

function typeLetter(k){
  const cell=getCell(currentRow,currentCol);
  cell.textContent=k;
  cell.classList.add('filled','popping');
  setTimeout(()=>cell.classList.remove('popping'),80);
  currentCol++;
}

function deleteLetter(){
  if(currentCol===0)return;
  currentCol--;
  const cell=getCell(currentRow,currentCol);
  cell.textContent='';cell.classList.remove('filled');
}

function submitGuess(){
  if(currentCol<5){setStatus('Not enough letters');shakeRow(currentRow);return;}
  const guess=Array.from({length:5},(_,i)=>getCell(currentRow,i).textContent).join('');
  if(!ALLVALID.has(guess)){setStatus('Not in word list');shakeRow(currentRow);return;}
  setStatus('');
  const result=checkGuess(guess,answer);
  guesses.push(guess);
  revealRow(currentRow,guess,result,()=>{
    updateKeyboard(guess,result);
    currentRow++;currentCol=0;
    const won=result.every(r=>r==='correct');
    if(won){
      bounceRow(currentRow-1);
      gameOver=true;
      const msgs=['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'];
      setTimeout(()=>showResult(true,msgs[currentRow-1]||'Got it!'),400);
    } else if(currentRow===6){
      gameOver=true;
      setTimeout(()=>showResult(false),400);
    }
  });
}

function checkGuess(guess,answer){
  const result=Array(5).fill('absent');
  const left=[...answer];
  // greens first
  for(let i=0;i<5;i++){if(guess[i]===answer[i]){result[i]='correct';left[i]=null;}}
  // yellows
  for(let i=0;i<5;i++){
    if(result[i]==='correct')continue;
    const j=left.indexOf(guess[i]);
    if(j!==-1){result[i]='present';left[j]=null;}
  }
  return result;
}

function revealRow(row,guess,result,done){
  for(let c=0;c<5;c++){
    const cell=getCell(row,c);
    const delay=c*90;
    setTimeout(()=>{
      cell.classList.add('flipping');
      setTimeout(()=>{cell.dataset.state=result[c];},225);
      setTimeout(()=>{cell.classList.remove('flipping');},450);
    },delay);
  }
  setTimeout(done,5*90+460);
}

function updateKeyboard(guess,result){
  const priority={correct:3,present:2,absent:1};
  for(let i=0;i<5;i++){
    const k=guess[i];
    const cur=keyState[k]?priority[keyState[k]]:0;
    if(priority[result[i]]>cur){keyState[k]=result[i];}
  }
  document.querySelectorAll('.wd-key').forEach(btn=>{
    const k=btn.dataset.key;
    if(keyState[k])btn.dataset.state=keyState[k];
  });
}

function shakeRow(row){
  const rowEl=document.getElementById('wd-row-'+row);
  rowEl.classList.add('shaking');
  setTimeout(()=>rowEl.classList.remove('shaking'),400);
}

function bounceRow(row){
  for(let c=0;c<5;c++){
    setTimeout(()=>{ const cell=getCell(row,c);cell.classList.add('bouncing');setTimeout(()=>cell.classList.remove('bouncing'),400); },c*60);
  }
}

function showResult(won,msg=''){
  const panel=document.getElementById('wd-result');
  document.getElementById('wr-word').textContent=answer;
  document.getElementById('wr-msg').textContent=won?msg:`The word was "${answer}"`;
  // Share text
  const emoji={correct:'🟩',present:'🟨',absent:'⬜'};
  const rows=guesses.map(g=>checkGuess(g,answer).map(r=>emoji[r]).join('')).join('\n');
  const shareText=`Wordle #${dayNum||'?'} ${won?guesses.length:'-'}/6\n${rows}`;
  document.getElementById('wr-share').onclick=()=>{
    navigator.clipboard.writeText(shareText).then(()=>{
      document.getElementById('wr-share').textContent='✅ Copied!';
      setTimeout(()=>{document.getElementById('wr-share').textContent='📋 Copy Result';},2000);
    }).catch(()=>{});
  };
  // Save to history and clear active session
  const results=guesses.map(g=>checkGuess(g,answer));
  GameHistory.save('wordle',{_summary:(won?`Solved in ${guesses.length}/6`:'Failed')+` · ${answer}`,_badge:won?guesses.length+'/6':'❌',answer,guesses,results,won,dayNum,randomMode});
  try{sessionStorage.removeItem('wd_state');}catch(e){}
  // Add History button if not already there
  if(!panel.querySelector('.gh-hist-btn')){
    const b=GameHistory.btn('wordle','Wordle',e=>GameHistory.renderWordleGrid(e.guesses,e.results,e.answer));
    b.classList.add('gh-hist-btn');b.style.marginTop='10px';
    panel.appendChild(b);
  }
  panel.classList.add('show');
}

// New random word button
document.getElementById('wr-new').addEventListener('click',()=>{
  try{sessionStorage.removeItem('wd_state');}catch(e){}
  init(true);
});

function saveWdState(){
  if(gameOver&&!guesses.length)return;
  try{sessionStorage.setItem('wd_state',JSON.stringify({answer,guesses,currentRow,currentCol,gameOver,randomMode,dayNum,_ts:Date.now()}));}catch(e){}
}
function loadWdState(){
  try{
    const raw=sessionStorage.getItem('wd_state');if(!raw)return false;
    const s=JSON.parse(raw);if(!s.answer)return false;
    // For daily mode, ensure we're still on the same day
    if(!s.randomMode){const d=getDailyWord();if(d.day!==s.dayNum)return false;}
    answer=s.answer;guesses=s.guesses;currentRow=s.currentRow;currentCol=s.currentCol;
    gameOver=s.gameOver;randomMode=s.randomMode;dayNum=s.dayNum;
    document.getElementById('wd-day').textContent=randomMode?'Random Mode':`Puzzle #${dayNum}`;
    buildBoard();buildKeyboard();
    // Replay guesses instantly (no animation)
    guesses.forEach((g,r)=>{
      const res=checkGuess(g,answer);
      for(let c=0;c<5;c++){const cell=getCell(r,c);cell.textContent=g[c];cell.dataset.state=res[c];}
      updateKeyboard(g,res);
    });
    // Restore in-progress letters on current row
    if(!gameOver){
      const inProg=Array.from({length:currentCol},(_,i)=>getCell(currentRow,i));
      // currentCol letters already set if currentRow was mid-type — nothing to restore since we only saved completed guesses
    }
    document.getElementById('wd-result').classList.remove('show');
    setStatus('');
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',saveWdState);

// Init
if(!loadWdState())init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
body{overflow-x:hidden;}
.sdk{max-width:500px;margin:0 auto;padding:0 12px calc(var(--safe-b) + 16px);}
.sdk .play{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:calc(100dvh - var(--safe-t) - var(--safe-b) - 76px);padding-bottom:4vh;}
.note{position:absolute;left:0;right:0;bottom:calc(100% + 4px);z-index:5;display:none;align-items:center;gap:10px;padding:10px 14px;border-radius:3px;background:linear-gradient(180deg,#fff3a6,#ffe678);color:#3a3000;font-family:var(--hand);font-size:1.12rem;line-height:1.25;box-shadow:0 8px 16px rgba(0,0,0,.35);transform:rotate(-.6deg);}
.note.show{display:flex;animation:rise .3s var(--ease) both;}
.note .ico{flex:none;width:22px;height:22px;color:#7a6200;}
.note.bad{background:linear-gradient(180deg,#ffd9d2,#ffc2b6);color:#5a0e0e;}
.note.bad .ico{color:#a8202e;}
.sdk .play > *{width:min(100%, 476px, calc(100dvh - var(--safe-t) - var(--safe-b) - 290px));min-width:min(100%,320px);}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center;font-family:var(--hand);font-size:1.5rem;color:var(--text-2);}

/* A page torn from a puzzle book */
.page{position:relative;border-radius:4px 4px 10px 10px;padding:10px 10px 8px;color:#22222c;
  background:
    radial-gradient(rgba(120,90,40,.05) 1px, transparent 1.2px) 0 0/5px 5px,
    radial-gradient(140% 90% at 50% 0%, #fffdf6 0%, #f7f0de 70%, #efe5cc 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 -1px 0 rgba(0,0,0,.05) inset, 0 2px 0 #e2d6b8, 0 4px 0 #d8caa6, 0 16px 34px rgba(0,0,0,.5);}
.page::after{content:"";position:absolute;left:8%;right:8%;bottom:-6px;height:12px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(6px);z-index:-1;}
.ph{display:flex;align-items:baseline;gap:8px;padding:0 2px 7px;border-bottom:1.5px solid #22222c;margin-bottom:8px;font-family:Georgia,"Times New Roman",serif;}
.ph .t{font-weight:700;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;}
.ph .no{font-style:italic;font-size:.9rem;color:#5c5848;}
.ph .tm{margin-left:auto;font-family:var(--hand);font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right;}
.pf{display:flex;justify-content:space-between;gap:8px;padding:6px 2px 0;font-family:Georgia,serif;font-style:italic;font-size:.8rem;color:#6d6856;}
.pf b{font-style:normal;font-family:var(--hand);font-weight:400;font-size:1rem;color:var(--ink);}

.grid{display:grid;grid-template-columns:repeat(9,1fr);border:2.5px solid #22222c;background:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.c{position:relative;aspect-ratio:1;display:grid;place-items:center;border-right:1px solid rgba(34,34,44,.32);border-bottom:1px solid rgba(34,34,44,.32);cursor:pointer;container-type:size;}
.c.br{border-right:2px solid #22222c;}.c.bb{border-bottom:2px solid #22222c;}
.c.er{border-right:0;}.c.eb{border-bottom:0;}
.c::before{content:"";position:absolute;inset:0;pointer-events:none;transition:background .12s;}
.c.unit::before{background:rgba(255,206,60,.2);}
.c.same::before{background:rgba(70,120,230,.2);}
.c.sel::before{background:rgba(255,190,30,.55);}
.c.flash::before{animation:flash 1.2s ease;}
@keyframes flash{0%,60%{background:rgba(61,180,110,.35);}100%{background:transparent;}}
.c .v{font-size:66cqh;line-height:1;}
.c.g .v{font-family:Georgia,"Times New Roman",serif;font-weight:700;color:#1d1d26;font-size:60cqh;}
.c.u .v{font-family:var(--hand);color:var(--ink);font-size:76cqh;transform:translateY(3%) rotate(-2deg);}
.c.u.bad .v{color:#c8102e;}
.c.u.hint .v{color:#1d7a46;}
.c .v.wr{animation:write .32s ease-out;}
@keyframes write{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}
.nt{position:absolute;inset:4%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-family:var(--hand);color:#55555f;font-size:34cqh;line-height:1;}
.nt i{font-style:normal;display:grid;place-items:center;}
.nt i.hl{color:#1f4fbf;font-weight:700;text-shadow:0 0 .5px #1f4fbf;}
.grid.won .c .v{animation:wave .7s ease both;animation-delay:calc(var(--d) * 40ms);}
@keyframes wave{40%{transform:translateY(-14%) scale(1.25);color:#c8102e;}}

/* Tools and number pad: clean chrome */
.tools{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;border-radius:14px;background:rgba(255,255,255,.07);color:var(--text-2);font-weight:800;font-size:.72rem;letter-spacing:.01em;white-space:nowrap;transition:transform .12s var(--spring), background .15s;}
.tool .ico{width:22px;height:22px;}
.tool:active{transform:scale(.93);background:rgba(255,255,255,.14);}
.tool:disabled{opacity:.35;}
.tool.redo .ico{transform:scaleX(-1);}
.tool.on{background:var(--accent);color:var(--accent-ink);}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;}
.pad button{position:relative;min-height:62px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:var(--text);
  box-shadow:0 3px 0 rgba(0,0,0,.35);font-family:var(--display);font-size:1.75rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .06s, opacity .2s;}
.pad button small{font-family:var(--font);font-size:.66rem;font-weight:800;color:var(--text-3);}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
/* Tablet portrait: bigger page and pad */
@media (min-width:700px) and (orientation:portrait){
  .sdk{max-width:720px;}
  .sdk .play > *{width:min(100%, 660px, calc(100dvh - var(--safe-t) - var(--safe-b) - 300px));}
  .ph .t{font-size:1.15rem;}.ph .no{font-size:1rem;}.ph .tm{font-size:1.45rem;}
  .pf{font-size:.95rem;}.pf b{font-size:1.2rem;}
  .tool{min-height:60px;font-size:.8rem;}
  .pad{gap:8px;}
  .pad button{min-height:72px;font-size:2rem;}
}
/* Tablet / desktop landscape: page on the left, tools and a 3x3 pad beside it */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  .sdk{max-width:1100px;}
  .sdk .play{display:grid;grid-template-columns:auto 330px;grid-template-rows:1fr 1fr;column-gap:30px;row-gap:16px;align-content:center;justify-content:center;padding-bottom:0;}
  .sdk .play > *{min-width:0;}
  .sdk .play > .page{grid-row:1 / span 2;align-self:center;width:min(640px, calc(100dvh - var(--safe-t) - var(--safe-b) - 172px));}
  .sdk .play > .tools{width:330px;align-self:end;}
  .sdk .play > .pad{width:330px;align-self:start;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pad button{min-height:min(84px, calc((100dvh - 330px) / 3));font-size:2.1rem;}
  .tool{min-height:60px;}
}
.pad button.done{opacity:.28;}
.pad.notes button{font-family:var(--hand);font-size:1.5rem;color:#bfd2ff;}
.mini{display:grid;grid-template-columns:repeat(9,18px);border:2px solid #22222c;background:#fbf6e8;width:max-content;}
.mini span{height:18px;display:grid;place-items:center;font-size:.72rem;border-right:1px solid rgba(0,0,0,.18);border-bottom:1px solid rgba(0,0,0,.18);color:#1f2a6b;font-family:var(--hand);}
.mini span.g{font-family:Georgia,serif;font-weight:700;color:#1d1d26;}
.mini span.br{border-right:1.5px solid #22222c;}.mini span.bb{border-bottom:1.5px solid #22222c;}
@media (min-width:700px){ .pad button{min-height:58px;} }
</style>
</head>
<body>
<main class="sdk" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'sudoku_state', OPTS = 'sudoku_opts', HKEY = 'sudoku';
  var DIFFS = { easy: 'Easy', medium: 'Medium', hard: 'Hard', expert: 'Expert' };
  var DAILY_DIFF = ['expert', 'easy', 'easy', 'medium', 'medium', 'hard', 'hard']; // Sun..Sat

  // ── Sudoku engine: generator, uniqueness check, technique grader ─────────
  var Sdk = (function () {
    var UNITS = [], PEERS = [], UNITS_OF = [];
    (function () {
      var r, c, i;
      for (r = 0; r < 9; r++) { var u = []; for (c = 0; c < 9; c++) u.push(r * 9 + c); UNITS.push(u); }
      for (c = 0; c < 9; c++) { u = []; for (r = 0; r < 9; r++) u.push(r * 9 + c); UNITS.push(u); }
      for (var b = 0; b < 9; b++) { u = []; var br = Math.floor(b / 3) * 3, bc = (b % 3) * 3; for (r = 0; r < 3; r++) for (c = 0; c < 3; c++) u.push((br + r) * 9 + bc + c); UNITS.push(u); }
      for (i = 0; i < 81; i++) {
        var ri = Math.floor(i / 9), ci = i % 9, bi = Math.floor(ri / 3) * 3 + Math.floor(ci / 3);
        UNITS_OF.push([ri, 9 + ci, 18 + bi]);
        var p = {}; UNITS_OF[i].forEach(function (k) { UNITS[k].forEach(function (j) { if (j !== i) p[j] = 1; }); });
        PEERS.push(Object.keys(p).map(Number));
      }
    })();
    var ALL = 511;
    function bits(m) { var n = 0; while (m) { m &= m - 1; n++; } return n; }
    function low(m) { for (var d = 0; d < 9; d++) if (m & (1 << d)) return d + 1; return 0; }
    function digits(m) { var a = []; for (var d = 0; d < 9; d++) if (m & (1 << d)) a.push(d + 1); return a; }
    function rng(seed) {
      var a = seed >>> 0;
      return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    function shuffle(a, R) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(R() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

    // Count solutions (stops at limit). g = array of 81 (0 = empty)
    function count(g, limit, R, out) {
      var rows = [0,0,0,0,0,0,0,0,0], cols = rows.slice(), boxes = rows.slice(), cells = g.slice(), n = 0;
      for (var i = 0; i < 81; i++) if (cells[i]) {
        var m = 1 << (cells[i] - 1), r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
        if ((rows[r] | cols[c] | boxes[b]) & m) return 0;
        rows[r] |= m; cols[c] |= m; boxes[b] |= m;
      }
      function rec() {
        var best = -1, bm = 0, bc = 10;
        for (var i = 0; i < 81; i++) if (!cells[i]) {
          var r = (i / 9) | 0, c = i % 9, b = ((r / 3) | 0) * 3 + ((c / 3) | 0);
          var m = ALL & ~(rows[r] | cols[c] | boxes[b]), k = bits(m);
          if (k < bc) { bc = k; best = i; bm = m; if (k <= 1) break; }
        }
        if (best < 0) { n++; if (out && !out.length) for (var j = 0; j < 81; j++) out.push(cells[j]); return n >= limit; }
        if (!bm) return false;
        var ds = digits(bm); if (R) shuffle(ds, R);
        var r0 = (best / 9) | 0, c0 = best % 9, b0 = ((r0 / 3) | 0) * 3 + ((c0 / 3) | 0);
        for (var x = 0; x < ds.length; x++) {
          var mm = 1 << (ds[x] - 1);
          cells[best] = ds[x]; rows[r0] |= mm; cols[c0] |= mm; boxes[b0] |= mm;
          if (rec()) return true;
          rows[r0] &= ~mm; cols[c0] &= ~mm; boxes[b0] &= ~mm;
        }
        cells[best] = 0; return false;
      }
      rec(); return n;
    }
    function fullGrid(R) { var out = []; var g = []; for (var i = 0; i < 81; i++) g.push(0); count(g, 1, R, out); return out; }

    // ── Logical solver. Returns {level, solved, steps}
    // level 1 singles · 2 locked candidates, pairs · 3 triples, X-Wing · 4 XY-Wing, Swordfish · 5 needs more
    function candidates(g) {
      var cand = [];
      for (var i = 0; i < 81; i++) {
        if (g[i]) { cand.push(0); continue; }
        var m = ALL; PEERS[i].forEach(function (j) { if (g[j]) m &= ~(1 << (g[j] - 1)); });
        cand.push(m);
      }
      return cand;
    }
    // One easy step on a board: a naked or hidden single. Returns {i, v, why, unit} or null.
    function single(g, cand) {
      cand = cand || candidates(g);
      for (var i = 0; i < 81; i++) if (!g[i] && bits(cand[i]) === 1) return { i: i, v: low(cand[i]), why: 'naked' };
      for (var u = 0; u < 27; u++) for (var d = 0; d < 9; d++) {
        var m = 1 << d, at = -1, n = 0;
        for (var k = 0; k < 9; k++) { var j = UNITS[u][k]; if (g[j] === d + 1) { n = 9; break; } if (!g[j] && (cand[j] & m)) { n++; at = j; } }
        if (n === 1) return { i: at, v: d + 1, why: 'hidden', unit: u };
      }
      return null;
    }
    function place(g, cand, i, v) {
      g[i] = v; cand[i] = 0; var m = ~(1 << (v - 1));
      for (var k = 0; k < PEERS[i].length; k++) cand[PEERS[i][k]] &= m;
    }
    function lockedCandidates(cand) {
      var hit = false;
      for (var b = 18; b < 27; b++) for (var d = 0; d < 9; d++) {
        var m = 1 << d, cells = UNITS[b].filter(function (j) { return cand[j] & m; });
        if (cells.length < 2) continue;
        var r0 = (cells[0] / 9) | 0, c0 = cells[0] % 9;
        var sameR = cells.every(function (j) { return ((j / 9) | 0) === r0; }), sameC = cells.every(function (j) { return j % 9 === c0; });
        var line = sameR ? UNITS[r0] : sameC ? UNITS[9 + c0] : null;
        if (line) line.forEach(function (j) { if (cells.indexOf(j) < 0 && (cand[j] & m)) { cand[j] &= ~m; hit = true; } });
      }
      for (var l = 0; l < 18; l++) for (d = 0; d < 9; d++) {
        m = 1 << d; cells = UNITS[l].filter(function (j) { return cand[j] & m; });
        if (cells.length < 2) continue;
        var bx = UNITS_OF[cells[0]][2];
        if (cells.every(function (j) { return UNITS_OF[j][2] === bx; }))
          UNITS[bx].forEach(function (j) { if (cells.indexOf(j) < 0 && (cand[j] & m)) { cand[j] &= ~m; hit = true; } });
      }
      return hit;
    }
    function combos(arr, k) {
      var out = [];
      (function go(s, pick) { if (pick.length === k) { out.push(pick.slice()); return; } for (var i = s; i < arr.length; i++) { pick.push(arr[i]); go(i + 1, pick); pick.pop(); } })(0, []);
      return out;
    }
    function nakedSubset(cand, k) {
      var hit = false;
      for (var u = 0; u < 27; u++) {
        var open = UNITS[u].filter(function (j) { var n = bits(cand[j]); return n >= 2 && n <= k; });
        if (open.length < k) continue;
        combos(open, k).forEach(function (set) {
          var m = 0; set.forEach(function (j) { m |= cand[j]; });
          if (bits(m) !== k) return;
          UNITS[u].forEach(function (j) { if (set.indexOf(j) < 0 && (cand[j] & m)) { cand[j] &= ~m; hit = true; } });
        });
      }
      return hit;
    }
    function hiddenSubset(cand, k) {
      var hit = false;
      for (var u = 0; u < 27; u++) {
        var ds = [];
        for (var d = 0; d < 9; d++) { var n = 0; UNITS[u].forEach(function (j) { if (cand[j] & (1 << d)) n++; }); if (n >= 2 && n <= k) ds.push(d); }
        if (ds.length < k) continue;
        combos(ds, k).forEach(function (set) {
          var m = 0; set.forEach(function (d) { m |= 1 << d; });
          var cells = UNITS[u].filter(function (j) { return cand[j] & m; });
          if (cells.length !== k) return;
          cells.forEach(function (j) { if (cand[j] & ~m) { cand[j] &= m; hit = true; } });
        });
      }
      return hit;
    }
    function fish(cand, size) {
      var hit = false;
      for (var d = 0; d < 9; d++) {
        var m = 1 << d;
        for (var dir = 0; dir < 2; dir++) {
          var base = [], pos = [];
          for (var l = 0; l < 9; l++) {
            var u = UNITS[dir * 9 + l], p = 0;
            for (var k = 0; k < 9; k++) if (cand[u[k]] & m) p |= 1 << k;
            var n = bits(p); if (n >= 2 && n <= size) { base.push(l); pos.push(p); }
          }
          if (base.length < size) continue;
          combos(base.map(function (_, i) { return i; }), size).forEach(function (set) {
            var cover = 0; set.forEach(function (i) { cover |= pos[i]; });
            if (bits(cover) !== size) return;
            var lines = set.map(function (i) { return base[i]; });
            for (var k = 0; k < 9; k++) if (cover & (1 << k)) {
              var cu = UNITS[(1 - dir) * 9 + k];
              for (var x = 0; x < 9; x++) if (lines.indexOf(x) < 0 && (cand[cu[x]] & m)) { cand[cu[x]] &= ~m; hit = true; }
            }
          });
        }
      }
      return hit;
    }
    function xyWing(cand) {
      var hit = false, bi = [];
      for (var i = 0; i < 81; i++) if (bits(cand[i]) === 2) bi.push(i);
      bi.forEach(function (p) {
        var pw = PEERS[p].filter(function (j) { return bits(cand[j]) === 2 && bits(cand[j] & cand[p]) === 1; });
        for (var a = 0; a < pw.length; a++) for (var b = a + 1; b < pw.length; b++) {
          var x = pw[a], y = pw[b];
          if ((cand[x] & cand[p]) === (cand[y] & cand[p])) continue;
          var z = cand[x] & cand[y] & ~cand[p];
          if (bits(z) !== 1 || (cand[x] | cand[y] | cand[p]) !== (cand[p] | z)) continue;
          PEERS[x].forEach(function (j) { if (j !== y && j !== p && PEERS[y].indexOf(j) >= 0 && (cand[j] & z)) { cand[j] &= ~z; hit = true; } });
        }
      });
      return hit;
    }
    function rate(given) {
      var g = given.slice(), cand = candidates(g), level = 1;
      for (;;) {
        var s = single(g, cand);
        if (s) { place(g, cand, s.i, s.v); continue; }
        if (g.indexOf(0) < 0) return { level: level, solved: true };
        for (var i = 0; i < 81; i++) if (!g[i] && !cand[i]) return { level: 9, solved: false };
        if (lockedCandidates(cand) || nakedSubset(cand, 2) || hiddenSubset(cand, 2)) { level = Math.max(level, 2); continue; }
        if (nakedSubset(cand, 3) || hiddenSubset(cand, 3) || fish(cand, 2)) { level = Math.max(level, 3); continue; }
        if (xyWing(cand) || fish(cand, 3) || nakedSubset(cand, 4) || hiddenSubset(cand, 4)) { level = Math.max(level, 4); continue; }
        return { level: 5, solved: false };
      }
    }

    var SPEC = {
      easy:   { max: 1, want: [1], floor: 36 },
      medium: { max: 2, want: [2], floor: 28 },
      hard:   { max: 4, want: [3, 4], floor: 22 },
      expert: { max: 5, want: [5], floor: 17 }
    };
    // One attempt: carve a random full grid while it stays unique and within
    // the level cap, in symmetric pairs, like a printed puzzle.
    function attempt(diff, R) {
      var sp = SPEC[diff], sol = fullGrid(R), g = sol.slice(), givens = 81;
      var order = shuffle(Array.from({ length: 41 }, function (_, i) { return i; }), R);
      for (var k = 0; k < order.length && givens > sp.floor; k++) {
        var a = order[k], b = 80 - a, keepA = g[a], keepB = g[b];
        g[a] = 0; g[b] = 0;
        var ok = count(g, 2) === 1;
        if (ok && sp.max < 5) ok = rate(g).level <= sp.max;
        if (!ok) { g[a] = keepA; g[b] = keepB; } else givens -= a === b ? 1 : 2;
      }
      return { puzzle: g, solution: sol, level: rate(g).level, givens: givens };
    }
    function generate(diff, seed, tries) {
      var R = rng(seed), best = null;
      for (var t = 0; t < (tries || 150); t++) {
        var p = attempt(diff, R);
        if (SPEC[diff].want.indexOf(p.level) >= 0) { p.tries = t + 1; return p; }
        if (!best || Math.abs(p.level - SPEC[diff].want[0]) < Math.abs(best.level - SPEC[diff].want[0])) best = p;
      }
      best.tries = tries || 150; return best;
    }
    return { generate: generate, rate: rate, count: count, single: single, candidates: candidates, PEERS: PEERS, UNITS: UNITS, rng: rng, bits: bits };
  })();

  Kit.init({
    id: 'sudoku',
    onNew: function () { showSetup(); },
    undo: function () { undo(); },
    menu: [

      saved = { S: { diff: old.diff === 'hard' ? 'hard' : old.diff === 'easy' ? 'easy' : 'medium', daily: 0, no: 1, given: gv, sol: flat(old.solution), vals: flat(old.board),
        notes: gv.map(function () { return 0; }), hinted: gv.map(function () { return 0; }), time: old.seconds || 0, mistakes: 0, hints: 0, undos: 0, started: Date.now(), done: false, level: 2 } };
      sessionStorage.removeItem('sdk_state');
    } } catch (e) {}
  }
  if (saved && saved.S && Array.isArray(saved.S.vals) && saved.S.vals.length === 81 && !saved.S.done) {
    S = saved.S; U = saved.U || []; R = saved.R || []; notesMode = !!saved.notesMode; build();
  } else showSetup();
})();
</script>

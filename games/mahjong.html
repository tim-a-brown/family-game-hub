<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahjong Tiles</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
:root{--tb:#1e7a5b;--tb2:#2a9a74;--cjk:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Serif CJK SC","Source Han Sans SC","WenQuanYi Zen Hei","Microsoft YaHei",serif;}
body{overflow:hidden;}
.mjw{display:flex;flex-direction:column;height:calc(100dvh - var(--safe-t) - 58px);max-width:1100px;margin:0 auto;padding:0 8px calc(var(--safe-b) + 4px);}
.mtab{flex:1;min-height:0;display:flex;border-radius:22px;padding:7px;}
.mtab .felt-in{flex:1;position:relative;border-radius:16px;overflow:hidden;}
.vp{position:absolute;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.bd{position:absolute;left:0;top:0;transform-origin:0 0;}
/* Tiles: ivory face, bone layer, green back, built up with stacked shadows */
.t{position:absolute;left:0;top:0;width:var(--tw);height:var(--th);padding:0;border:0;border-radius:calc(var(--tw) * .13);cursor:pointer;
  background:linear-gradient(160deg,#fffef8 0%,#f8f1df 55%,#ece2c8 100%);
  box-shadow:inset 0 0 0 1px rgba(120,95,50,.22), inset 1px -1px 0 rgba(255,255,255,.7),
    calc(var(--e) * -.3) calc(var(--e) * .3) 0 #e6d9b6, calc(var(--e) * -.55) calc(var(--e) * .55) 0 #d8c69a,
    calc(var(--e) * -.8) calc(var(--e) * .8) 0 var(--tb2), calc(var(--e) * -1) var(--e) 0 var(--tb),
    calc(var(--e) * -1 - 1px) calc(var(--e) + 1px) 0 rgba(0,0,0,.3), calc(var(--e) * -1 - 2px) calc(var(--e) + 3px) 6px rgba(0,0,0,.35);
  transition:filter .2s, transform .18s var(--spring), opacity .25s;}
.t svg{position:absolute;inset:6% 8%;width:84%;height:88%;overflow:visible;pointer-events:none;}
.free-hl .t.blk{filter:brightness(.78) saturate(.75);}
.t.sel{transform:translate(1px,-3px);background:linear-gradient(160deg,#fff8d0,#fde58a 70%,#f5d061);
  box-shadow:inset 0 0 0 2px #e0a800, 0 0 0 2px rgba(255,216,74,.55), calc(var(--e) * -.3) calc(var(--e) * .3) 0 #e6d9b6, calc(var(--e) * -.55) calc(var(--e) * .55) 0 #d8c69a, calc(var(--e) * -.8) calc(var(--e) * .8) 0 var(--tb2), calc(var(--e) * -1) var(--e) 0 var(--tb), calc(var(--e) * -1 - 2px) calc(var(--e) + 6px) 10px rgba(0,0,0,.45);}
.t.hint{animation:hintp 1s ease-in-out infinite;background:linear-gradient(160deg,#effff4,#bff2d2);}
@keyframes hintp{50%{transform:translateY(-3px);}}
.t.no{animation:nudge .3s;}
@keyframes nudge{25%{translate:-3px 0;}75%{translate:3px 0;}}
.t.gone{animation:gone .38s var(--ease) forwards;pointer-events:none;}
@keyframes gone{0%{transform:none;opacity:1;}35%{transform:translateY(-10px) scale(1.12);opacity:1;}100%{transform:translateY(-26px) scale(.7);opacity:0;}}
.t.out{display:none;}
.t.back-in{animation:backin .3s var(--spring);}
@keyframes backin{from{transform:translateY(-18px) scale(.8);opacity:0;}to{transform:none;opacity:1;}}
.t.mix{animation:mix .45s ease;}
@keyframes mix{0%,100%{transform:none;}50%{transform:scaleX(.05);}}
.fit{position:absolute;right:10px;top:10px;z-index:5;display:none;}
.fit.on{display:inline-grid;}
.fit.icon-btn{background:rgba(0,0,0,.35);}
.tip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.4);color:rgba(255,255,255,.85);font-size:.78rem;font-weight:800;white-space:nowrap;pointer-events:none;transition:opacity .4s;}
.tip.hide{opacity:0;}
.tip .ico{width:15px;height:15px;margin-right:4px;vertical-align:-3px;}
/* Bottom bar */
.sbar{flex:none;display:flex;align-items:center;gap:6px;height:58px;padding:6px 2px 0;}
.sbar .icon-btn{width:46px;height:46px;}
.sbar .icon-btn:disabled{opacity:.35;}
.sbar .stats{flex:1;display:flex;justify-content:center;gap:clamp(10px,4vw,30px);}
.sbar .st{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:42px;}
.sbar .st b{font-size:1.08rem;font-weight:900;font-variant-numeric:tabular-nums;}
.sbar .st small{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.sbar .st.warn b{color:var(--orange);}
.rules .mrow{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0;}
.rules .mt{position:relative;width:28px;height:37px;border-radius:4px;background:linear-gradient(160deg,#fffef8,#ece2c8);box-shadow:inset 0 0 0 1px rgba(120,95,50,.25), -2px 2px 0 var(--tb);}
.rules .mt svg{position:absolute;inset:6% 8%;width:84%;height:88%;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'mahjong_state', KEY = 'mahjong';
  var WIND_CH = ['東', '南', '西', '北'], WIND_EN = ['East', 'South', 'West', 'North'];
  var NUM_CH = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
  var LAYOUTS = { turtle: 'Turtle', pyramid: 'Pyramid', castle: 'Castle', mini: 'Mini' };

  function sample(ks) { return '<span class="mrow">' + ks.map(function (k) { return '<span class="mt">' + faceSVG(k) + '</span>'; }).join('') + '</span>'; }


  // ── Tile kinds ────────────────────────────────────────────────────────────
  // 0-8 Characters, 9-17 Dots, 18-26 Bamboo, 27-30 Winds E S W N,
  // 31-33 Dragons red/green/white, 34-37 Flowers, 38-41 Seasons.
  function suit(k) { return k < 9 ? 0 : k < 18 ? 1 : k < 27 ? 2 : k < 31 ? 3 : k < 34 ? 4 : 5; }
  function num(k) { return k % 9 + 1; }
  function group(k) { return k < 34 ? k : k < 38 ? 34 : 38; }   // flowers match flowers, seasons match seasons
  var FLOWER = [['梅', 'Plum', '#d6336c'], ['蘭', 'Orchid', '#8e44ad'], ['菊', 'Chrysanthemum', '#e08a00'], ['竹', 'Bamboo', '#12804a']];
  var SEASON = [['春', 'Spring', '#2f9e44'], ['夏', 'Summer', '#d9480f'], ['秋', 'Autumn', '#b8860b'], ['冬', 'Winter', '#1c63c7']];
  function kname(k) {
    var s = suit(k);
    if (s < 3) return num(k) + ' ' + ['Characters', 'Dots', 'Bamboo'][s];
    if (s === 3) return WIND_EN[k - 27] + ' Wind';
    if (s === 4) return ['Red', 'Green', 'White'][k - 31] + ' Dragon';
    return k < 38 ? FLOWER[k - 34][1] + ' (Flower)' : SEASON[k - 38][1] + ' (Season)';
  }
  function gname(k) { var g = group(k); return g === 34 ? 'Flowers' : g === 38 ? 'Seasons' : kname(k) + 's'; }
  // Flowers and seasons: a small blossom or emblem, the character, and its number
  function bonusSVG(k) {
    var fl = k < 38, d = fl ? FLOWER[k - 34] : SEASON[k - 38], c = d[2], i = (k - 34) % 4, b = '';
    var font = 'font-family=\'PingFang SC,Hiragino Sans GB,Noto Sans CJK SC,Noto Serif CJK SC,WenQuanYi Zen Hei,Microsoft YaHei,serif\' font-weight=\'700\' text-anchor=\'middle\'';
    if (fl) {
      for (var a = 0; a < 5; a++) { var t = a * Math.PI * 2 / 5 - Math.PI / 2; b += '<circle cx="' + (15 + Math.cos(t) * 5.2).toFixed(2) + '" cy="' + (13 + Math.sin(t) * 5.2).toFixed(2) + '" r="3.9" fill="' + c + '" opacity=".9"/>'; }
      b += '<circle cx="15" cy="13" r="2.6" fill="#ffd43b"/><path d="M15 19 C15 23 13 24 11 26" stroke="#2f7d32" stroke-width="1.3" fill="none"/><path d="M13 23 c-3 -1 -4 0 -5 1 c2 1 4 1 5 -1z" fill="#2f7d32"/>';
      b += '<text x="15" y="37" font-size="11" fill="#1b2552" ' + font + '>' + d[0] + '</text>';
    } else {
      b += '<circle cx="15" cy="12" r="8.5" fill="none" stroke="' + c + '" stroke-width="1.6"/>';
      b += '<text x="15" y="16.2" font-size="11.5" fill="' + c + '" ' + font + '>' + d[0] + '</text>';
      for (var j = 0; j < 4; j++) b += '<circle cx="' + (7.5 + j * 5) + '" cy="27" r="1.5" fill="' + (j === i ? c : '#d8cfb8') + '"/>';
      b += '<text x="15" y="38" font-size="7" fill="#1b2552" font-family="system-ui,sans-serif" font-weight="800" text-anchor="middle">' + d[1].toUpperCase() + '</text>';
    }
    b += '<text x="26.5" y="7" font-size="7" fill="#c8282b" font-family="system-ui,sans-serif" font-weight="900" text-anchor="middle">' + (i + 1) + '</text>';
    return '<svg viewBox="0 0 30 40" aria-hidden="true">' + b + '</svg>';
  }
  var B = '#1d4fa5', G = '#12804a', R = '#c8282b', INK = '#1b2552';
  function dot(x, y, r, c) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + c + '"/><circle cx="' + x + '" cy="' + y + '" r="' + (r * .66) + '" fill="#fffdf4"/><circle cx="' + x + '" cy="' + y + '" r="' + (r * .46) + '" fill="' + c + '"/><circle cx="' + (x - r * .15) + '" cy="' + (y - r * .15) + '" r="' + (r * .14) + '" fill="#fffdf4"/>';
  }
  function stick(x, y, h, c, w) {
    w = w || 4;
    var s = '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="' + (w / 2) + '" fill="' + c + '"/>';
    s += '<rect x="' + (x - w / 2 - .4) + '" y="' + (y - .7) + '" width="' + (w + .8) + '" height="1.4" rx=".7" fill="' + c + '" stroke="#fffdf4" stroke-width=".5"/>';
    s += '<rect x="' + (x - .5) + '" y="' + (y - h / 2 + 1.5) + '" width="1" height="' + (h - 3) + '" fill="rgba(255,255,255,.45)"/>';
    return s;
  }
  var SVG = {};
  function faceSVG(k) {
    if (SVG[k]) return SVG[k];
    if (k >= 34) return (SVG[k] = bonusSVG(k));
    var s = suit(k), n = num(k), b = '';
    var font = 'font-family=\'PingFang SC,Hiragino Sans GB,Noto Sans CJK SC,Noto Serif CJK SC,WenQuanYi Zen Hei,Microsoft YaHei,serif\' font-weight=\'700\' text-anchor=\'middle\'';
    if (s === 0) {
      b += '<text x="15" y="17.5" font-size="15" fill="' + INK + '" ' + font + '>' + NUM_CH[n - 1] + '</text>';
      b += '<text x="15" y="36" font-size="15" fill="' + R + '" ' + font + '>萬</text>';
      b += '<text x="2.6" y="7" font-size="7" fill="' + INK + '" font-family="system-ui,sans-serif" font-weight="800">' + n + '</text>';
    } else if (s === 1) {
      var L = {
        1: [[15, 20, 11, 'x']],
        2: [[15, 10.5, 6, G], [15, 29.5, 6, B]],
        3: [[7.5, 8, 5.2, B], [15, 20, 5.2, R], [22.5, 32, 5.2, G]],
        4: [[8.5, 10.5, 5.6, B], [21.5, 10.5, 5.6, G], [8.5, 29.5, 5.6, G], [21.5, 29.5, 5.6, B]],
        5: [[8, 8.5, 5, B], [22, 8.5, 5, G], [15, 20, 5, R], [8, 31.5, 5, G], [22, 31.5, 5, B]],
        6: [[9, 7.5, 4.6, G], [21, 7.5, 4.6, G], [9, 20, 4.6, R], [21, 20, 4.6, R], [9, 32.5, 4.6, R], [21, 32.5, 4.6, R]],
        7: [[6.5, 6, 3.9, G], [15, 10, 3.9, G], [23.5, 14, 3.9, G], [9, 24, 4.1, R], [21, 24, 4.1, R], [9, 33.5, 4.1, R], [21, 33.5, 4.1, R]],
        8: [[9, 5.5, 3.9, B], [21, 5.5, 3.9, B], [9, 15.2, 3.9, B], [21, 15.2, 3.9, B], [9, 24.8, 3.9, B], [21, 24.8, 3.9, B], [9, 34.5, 3.9, B], [21, 34.5, 3.9, B]],
        9: [[7, 7, 4, B], [15, 7, 4, B], [23, 7, 4, B], [7, 20, 4, R], [15, 20, 4, R], [23, 20, 4, R], [7, 33, 4, G], [15, 33, 4, G], [23, 33, 4, G]]
      }[n];
      L.forEach(function (d) {
        if (d[3] === 'x') {
          b += '<circle cx="15" cy="20" r="12" fill="' + G + '"/><circle cx="15" cy="20" r="10" fill="#fffdf4"/><circle cx="15" cy="20" r="8.6" fill="' + B + '"/><circle cx="15" cy="20" r="6.2" fill="#fffdf4"/><circle cx="15" cy="20" r="4.6" fill="' + R + '"/><circle cx="15" cy="20" r="1.8" fill="#fffdf4"/>';
          for (var a = 0; a < 8; a++) { var t = a * Math.PI / 4; b += '<circle cx="' + (15 + Math.cos(t) * 7.4).toFixed(2) + '" cy="' + (20 + Math.sin(t) * 7.4).toFixed(2) + '" r=".9" fill="' + G + '"/>'; }
        } else b += dot(d[0], d[1], d[2], d[3]);
      });
    } else if (s === 2) {
      var P = {
        2: [[15, 11, 15, G], [15, 29, 15, B]],
        3: [[15, 11, 15, G], [9, 29, 15, B], [21, 29, 15, B]],
        4: [[9, 11, 15, G], [21, 11, 15, B], [9, 29, 15, B], [21, 29, 15, G]],
        5: [[7, 11, 15, G], [23, 11, 15, B], [15, 20, 15, R], [7, 29, 15, B], [23, 29, 15, G]],
        6: [[7, 11, 15, G], [15, 11, 15, G], [23, 11, 15, G], [7, 29, 15, B], [15, 29, 15, B], [23, 29, 15, B]],
        7: [[15, 7, 10, R], [7, 20, 10, G], [15, 20, 10, G], [23, 20, 10, G], [7, 33, 10, B], [15, 33, 10, B], [23, 33, 10, B]],
        8: [[5.5, 11, 15, G], [12, 11, 15, G], [18, 11, 15, G], [24.5, 11, 15, G], [5.5, 29, 15, B], [12, 29, 15, B], [18, 29, 15, B], [24.5, 29, 15, B]],
        9: [[7, 7, 10, G], [15, 7, 10, R], [23, 7, 10, B], [7, 20, 10, G], [15, 20, 10, R], [23, 20, 10, B], [7, 33, 10, G], [15, 33, 10, R], [23, 33, 10, B]]
      }[n];
      if (n === 1) {
        b += stick(15, 21, 28, G, 6) + '<path d="M15 9 C9 6 6 8 4 12 C9 12 12 11 15 9z" fill="' + G + '"/><path d="M15 9 C21 6 24 8 26 12 C21 12 18 11 15 9z" fill="' + G + '"/><circle cx="15" cy="7" r="2.6" fill="' + R + '"/>';
      } else P.forEach(function (p) { b += stick(p[0], p[1], p[2], p[3], n === 8 ? 3.4 : 4); });
    } else if (s === 3) {
      b += '<text x="15" y="29" font-size="22" fill="' + INK + '" ' + font + '>' + WIND_CH[k - 27] + '</text>';
      b += '<text x="2.6" y="7" font-size="7" fill="' + INK + '" font-family="system-ui,sans-serif" font-weight="800">' + 'ESWN'[k - 27] + '</text>';
    } else {
      if (k === 31) b += '<text x="15" y="29.5" font-size="24" fill="' + R + '" ' + font + '>中</text>';
      else if (k === 32) b += '<text x="15" y="29.5" font-size="23" fill="' + G + '" ' + font + '>發</text>';
      else b += '<rect x="6" y="6" width="18" height="28" rx="2" fill="none" stroke="' + B + '" stroke-width="2.2"/><rect x="9" y="9" width="12" height="22" rx="1" fill="none" stroke="' + B + '" stroke-width=".9"/>';
    }
    SVG[k] = '<svg viewBox="0 0 30 40" aria-hidden="true">' + b + '</svg>';
    return SVG[k];
  }

  // ── Layouts (half-tile grid: x, y in halves; a tile covers 2×2) ──────────
  function rect(out, x0, x1, y0, y1, z) { for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) out.push({ x: x * 2, y: y * 2, z: z }); }
  function buildLayout(name) {
    var p = [];
    if (name === 'turtle') {
      [[0, 1, 12], [1, 3, 10], [2, 2, 11], [3, 1, 12], [4, 1, 12], [5, 2, 11], [6, 3, 10], [7, 1, 12]].forEach(function (r) { rect(p, r[1], r[2], r[0], r[0], 0); });
      p.push({ x: 0, y: 7, z: 0 }, { x: 26, y: 7, z: 0 }, { x: 28, y: 7, z: 0 });
      rect(p, 4, 9, 1, 6, 1); rect(p, 5, 8, 2, 5, 2); rect(p, 6, 7, 3, 4, 3);
      p.push({ x: 13, y: 7, z: 4 });
    } else if (name === 'pyramid') {
      rect(p, 0, 7, 0, 7, 0); rect(p, 1, 6, 1, 6, 1); rect(p, 2, 5, 2, 5, 2); rect(p, 3, 4, 3, 4, 3);
    } else if (name === 'castle') {
      rect(p, 0, 9, 0, 5, 0);
      [[0, 0], [8, 0], [0, 4], [8, 4]].forEach(function (c) { rect(p, c[0], c[0] + 1, c[1], c[1] + 1, 1); p.push({ x: c[0] * 2 + 1, y: c[1] * 2 + 1, z: 2 }); });
      rect(p, 3, 6, 2, 3, 1);
    } else {
      rect(p, 0, 5, 0, 4, 0); rect(p, 1, 4, 1, 3, 1); rect(p, 2, 3, 2, 2, 2);
    }
    return p;
  }
  // Neighbour lists: tiles resting on top, and tiles touching the left / right side
  function links(pos) {
    return pos.map(function (a, i) {
      var L = { up: [], l: [], r: [] };
      pos.forEach(function (b, j) {
        if (i === j) return;
        var dx = b.x - a.x, dy = Math.abs(b.y - a.y);
        if (b.z === a.z + 1 && Math.abs(dx) < 2 && dy < 2) L.up.push(j);
        if (b.z === a.z && dy < 2) { if (dx === -2) L.l.push(j); if (dx === 2) L.r.push(j); }
      });
      return L;
    });
  }
  function isFree(i, gone, LK) {
    if (gone[i]) return false;
    var l = LK[i];
    function clear(arr) { for (var j = 0; j < arr.length; j++) if (!gone[arr[j]]) return false; return true; }
    return clear(l.up) && (clear(l.l) || clear(l.r));
  }

  // ── Solvable deals: play the game backwards ───────────────────────────────
  // Remove random pairs of free tiles from the full layout until it is empty,
  // then give each removed pair matching faces. Playing those pairs forward in
  // the opposite order always works, so every deal can be cleared.
  function removalOrder(idx, LK, n) {
    for (var tries = 0; tries < 400; tries++) {
      var gone = []; for (var i = 0; i < n; i++) gone.push(true);
      idx.forEach(function (i) { gone[i] = false; });
      var left = idx.length, order = [], ok = true;
      while (left) {
        var free = idx.filter(function (i) { return isFree(i, gone, LK); });
        if (free.length < 2) { ok = false; break; }
        // Prefer high tiles and tiles that free others, so stacks are not stranded
        var w = free.map(function (i) { return 1 + POS[i].z * 3 + LK[i].up.length; });
        var a = wpick(free, w), rest = free.filter(function (i) { return i !== a; });
        var b = wpick(rest, rest.map(function (i) { return 1 + POS[i].z * 3; }));
        gone[a] = gone[b] = true; left -= 2; order.push([a, b]);
      }
      if (ok) return order;
      if (tries === 40 && idx.length <= 28) return exhaustive(idx, LK, n);
    }
    return null;
  }
  // Small leftovers: search every way to take them off, so we only give up
  // when the tiles really cannot all be removed.
  function exhaustive(idx, LK, n) {
    var gone = []; for (var i = 0; i < n; i++) gone.push(true);
    idx.forEach(function (i) { gone[i] = false; });
    var dead = {}, order = [];
    function rec(left) {
      if (!left) return true;
      var key = idx.filter(function (i) { return !gone[i]; }).join(',');
      if (dead[key]) return false;
      var free = idx.filter(function (i) { return isFree(i, gone, LK); });
      for (var a = 0; a < free.length; a++) for (var b = a + 1; b < free.length; b++) {
        gone[free[a]] = gone[free[b]] = true; order.push([free[a], free[b]]);
        if (rec(left - 2)) return true;
        order.pop(); gone[free[a]] = gone[free[b]] = false;
      }
      dead[key] = true; return false;
    }
    return rec(idx.length) ? order : null;
  }
  function wpick(arr, w) {
    var tot = w.reduce(function (s, x) { return s + x; }, 0), r = Math.random() * tot;
    for (var i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; }
    return arr[arr.length - 1];
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // Pairs of faces for n tiles: whole sets of four where possible (like a real set)
  function facePairs(n) {
    var groups = [];
    for (var k = 0; k < 34; k++) groups.push([[k, k], [k, k]]);
    var f = shuffle([34, 35, 36, 37]), s = shuffle([38, 39, 40, 41]);
    groups.push([[f[0], f[1]], [f[2], f[3]]], [[s[0], s[1]], [s[2], s[3]]]);
    shuffle(groups);

    '<h3>Making a match</h3><ul><li>Tap a free tile, then tap a free tile with the same face. Both disappear.</li>' +
    '<li>The tiles: Characters ' + sample([0, 4]) + ' Dots ' + sample([9, 13]) + ' Bamboo ' + sample([19, 22]) + ' Winds and Dragons ' + sample([27, 31, 32, 33]) + '</li>' +
    '<li><b>Flowers</b> match any other flower, and <b>Seasons</b> match any other season:' + sample([34, 35, 36, 37]) + sample([38, 39, 40, 41]) + '</li></ul>' +
    '<h3>Help when you need it</h3><ul><li><b>Hint</b> lights up a pair you can take.</li><li><b>Undo</b> takes back as many pairs as you like.</li>' +
    '<li><b>Shuffle</b> swaps the faces of the tiles that are left. Every deal and every shuffle can be cleared, but a wrong choice can still leave you stuck. If no free tiles match, the game tells you.</li>' +
    '<li>The <b>Matches</b> number shows how many pairs you can take right now.</li></ul>' +
    '<h3>Layouts</h3><p><b>Turtle</b> is the classic 144-tile layout. <b>Pyramid</b> (120), <b>Castle</b> (88) and <b>Mini</b> (44, quick, with bigger tiles) are smaller. On a phone you can pinch to zoom, or turn the phone sideways.</p>';
  Kit.init({
    id: 'mahjong',
    theme: { felt: ['#1f6e5c', '#134a3d', '#0c372d'] },
    onNew: function () { showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'lightbulb', label: 'Hint', onClick: function () { hint(); } },
      { icon: 'shuffle', label: 'Shuffle the tiles', onClick: function () { shuffleAsk(); } },
      { icon: 'sync', label: 'Restart this deal', onClick: function () { restart(); } },
      { icon: 'eye', label: function () { return 'Dim blocked tiles: ' + (dimOn() ? 'on' : 'off'); }, onClick: function () { setDim(!dimOn()); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Mahjong Tiles: past games' }); } }
    ],
    rules: RULES
  });

  window.__mjDebug = function () { return { S: S, POS: POS, LK: LK, fp: freePairs(), order: removalOrder(POS.map(function(_,i){return i;}).filter(function(i){return !S.gone[i];}), LK, POS.length) }; };
  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.S && saved.S.k && !saved.S.done && LAYOUTS[saved.S.layout]) {
    S = saved.S; U = saved.U || [];
    POS = buildLayout(S.layout); LK = links(POS);
    if (POS.length === S.k.length) { build(false); if (!freePairs().length) setTimeout(stuck, 400); }
    else showSetup();
  } else showSetup();
})();
</script>

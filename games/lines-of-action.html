<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lines of Action</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="loa-core.js"></script>
<style>
.cb-col{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.pbar{display:flex;align-items:center;gap:10px;min-height:48px;padding:5px 12px 5px 10px;border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s, background .2s;}
.pbar.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 18%,transparent);}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;}
.pbar .nm{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.pbar .nm .ico{width:15px;height:15px;color:var(--text-3);flex:none;}
.pbar .nm span{overflow:hidden;text-overflow:ellipsis;}
.pbar .sub{font-size:.72rem;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pbar.on .sub{color:var(--lit-ink);}
.pbar .grp{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:3.4em;}
.pbar .grp b{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.pbar .grp small{font-size:.7rem;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pbar .grp.one b{color:var(--lit-ink);}
.pbar .grp b.bump{animation:pop .45s var(--spring);}
.pbar .tok{width:30px;height:30px;flex:none;position:relative;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* The board: a walnut frame with an inlaid board of maple and walnut squares */
.frame{--rim:clamp(10px,3vw,15px);position:relative;padding:var(--rim);border-radius:14px;
  background:
    repeating-linear-gradient(91deg,rgba(255,255,255,.035) 0 2px,transparent 2px 8px),
    repeating-linear-gradient(87deg,rgba(0,0,0,.12) 0 1px,transparent 1px 13px),
    linear-gradient(180deg,#5a3720,#33200f);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.4),0 16px 34px rgba(0,0,0,.5);}
.bd{position:relative;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  box-shadow:0 0 0 2px #1c1209,0 0 0 3.5px rgba(214,170,98,.45),inset 0 0 16px rgba(0,0,0,.3);touch-action:manipulation;user-select:none;-webkit-user-select:none;}
.sq{position:relative;cursor:pointer;}
.sq.l{background:repeating-linear-gradient(100deg,rgba(120,72,20,.07) 0 1px,transparent 1px 5px),linear-gradient(150deg,#e8cf9e,#d6b57c);}
.sq.d{background:repeating-linear-gradient(80deg,rgba(0,0,0,.09) 0 1px,transparent 1px 6px),linear-gradient(150deg,#86592f,#6b4423);}
.sq::before{content:"";position:absolute;inset:0;pointer-events:none;}
.sq.lf::before{background:rgba(255,206,64,.2);}
.sq.lt::before{background:rgba(255,206,64,.34);}
.sq.sel::before{background:rgba(255,214,90,.42);box-shadow:inset 0 0 0 2px rgba(255,226,140,.8);}
.layer{position:absolute;inset:0;pointer-events:none;}
.layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.pool{z-index:1;}
.pool svg{overflow:hidden;}
.pool g{transition:opacity .4s;}
.pool g.won{opacity:.6!important;fill:#ffd75a;stroke:#ffd75a;}
.rays{z-index:2;}
.pcs{z-index:3;}
.marks{z-index:4;}

/* The pieces: polished stones, jet black and white marble */
.pc{position:absolute;width:12.5%;height:12.5%;display:grid;place-items:center;transition:transform .16s var(--spring);}
.pc .st{position:relative;width:78%;height:78%;border-radius:50%;}
.pc.b .st{background:radial-gradient(circle at 36% 30%,#8d8d98 0,#3a3a42 18%,#16161a 55%,#040405 100%);
  box-shadow:0 2px 0 #000,0 4px 7px rgba(0,0,0,.6),inset 0 -3px 5px rgba(255,255,255,.08),inset 0 2px 3px rgba(255,255,255,.12);}
.pc.w .st{background:
    radial-gradient(ellipse 60% 22% at 60% 66%,rgba(170,160,140,.22),transparent 70%),
    radial-gradient(ellipse 40% 14% at 35% 48%,rgba(160,150,130,.16),transparent 70%),
    radial-gradient(circle at 36% 30%,#ffffff 0,#f6f3ec 30%,#e2dccf 70%,#bdb5a4 100%);
  box-shadow:0 2px 0 #8c8473,0 4px 7px rgba(0,0,0,.5),inset 0 -3px 5px rgba(0,0,0,.1),inset 0 2px 3px rgba(255,255,255,.7);}
.pc .st::after{content:"";position:absolute;left:20%;top:12%;width:36%;height:22%;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);transform:rotate(-24deg);}
.pc.b .st::after{opacity:.5;}
.pc.lift{transform:translateY(-7%) scale(1.1);z-index:2;}
.pc.lift .st{box-shadow:0 7px 0 rgba(0,0,0,.35),0 12px 14px rgba(0,0,0,.45),inset 0 -3px 5px rgba(255,255,255,.08);}
.pc.mine-on .st{animation:breathe 2.4s ease-in-out infinite;}
@keyframes breathe{50%{box-shadow:0 2px 0 rgba(0,0,0,.6),0 0 0 3px rgba(255,214,90,.35),0 4px 8px rgba(0,0,0,.5);}}
.pc.glow .st{animation:winglow 1.6s ease-out both;}
@keyframes winglow{0%{filter:none;}30%{filter:drop-shadow(0 0 9px rgba(255,214,90,1)) brightness(1.25);transform:scale(1.15);}100%{filter:drop-shadow(0 0 4px rgba(255,214,90,.7));}}
.pc.hit .st{animation:hit .5s ease-out forwards;}
@keyframes hit{0%{transform:scale(1);}25%{transform:scale(1.25);filter:brightness(1.6);}100%{transform:scale(0) rotate(40deg);opacity:0;}}
.shard{position:absolute;width:2.2%;height:2.2%;border-radius:2px;pointer-events:none;z-index:5;}
.bd.shake{animation:shake .4s;}
.mini{position:absolute;inset:2px;border-radius:50%;}
.mini.b{background:radial-gradient(circle at 36% 30%,#8d8d98 0,#3a3a42 18%,#16161a 55%,#040405 100%);box-shadow:0 1.5px 0 #000;}
.mini.w{background:radial-gradient(circle at 36% 30%,#ffffff 0,#f2eee6 40%,#c6beae 100%);box-shadow:0 1.5px 0 #8c8473;}
.turn{margin:2px 0 0;min-height:34px;}
.acts{display:flex;gap:10px;justify-content:center;margin-top:2px;}
.acts .btn{flex:1;max-width:180px;}
.rulechip{text-align:center;font-size:.8rem;font-weight:600;color:var(--text-3);}

/* A layout for each shape (fit() sizes the board to the room). Upright: the players over and under the board, the
   board as wide as the screen allows. Sideways: the players, whose turn and the buttons in a column at the left, the
   board you play on at the right, as tall as the room */
#app.stage.ipl{max-width:none;box-sizing:border-box;height:var(--avh,auto);display:flex;flex-direction:column;align-items:center;
  padding:4px max(17px,var(--corner-x,0px)) max(calc(var(--safe-b) + 10px),18px);}
#app.ipl>.cb-col{width:var(--cw,100%);max-width:none;flex:none;margin:auto 0;}
/* Upright: the column takes the screen's height; the players and the board stand together in the middle of the room
   above the turn line, and the turn line and Undo stand at the foot where the thumb is (no band left floating) */
#app.la-port>.cb-col{height:100%;margin:0;gap:var(--gp,10px);justify-content:center;}
#app.la-port .pbar{min-height:56px;padding:7px 14px 7px 11px;}
#app.la-port .pbar .nm{font-size:1.02rem;}
#app.la-port .pbar .sub{font-size:.78rem;}
#app.la-port .pbar .grp b{font-size:1.75rem;}
#app.la-port .pbar .tok{width:34px;height:34px;}
#app.la-port>.cb-col>.turn{font-size:1.08rem;margin:0;}
#app.la-port>.cb-col>.acts{margin:0;}
#app.la-port>.cb-col>.acts .btn{max-width:220px;}
#app.la-port.la-short .pbar{min-height:44px;padding:3px 10px;}
#app.la-port.la-short .pbar .grp b{font-size:1.4rem;}
#app.la-port.la-short .pbar .tok{width:28px;height:28px;}
#app.la-port.la-short>.cb-col>.turn{min-height:26px;font-size:.95rem;}
#app.la-port.la-short>.cb-col>.rulechip{display:none;}
/* A large window: the room in the column at the left, between whose turn it is and Undo */
.room{display:none;}
#app.la-land.la-desk>.cb-col{grid-template-areas:"t b" "s b" "m b" "a b" "r b" "p b";}
#app.la-land.la-desk>.cb-col>.room{grid-area:m;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden;}
.room .pn{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;}
.room .pn.mv{flex:1 1 auto;}
.room h4{margin:0;font-size:.82rem;font-weight:800;color:var(--text-3);}
.room .mvl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-height:0;}
.room .mvl li{display:grid;grid-template-columns:2.4em 18px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 4px;border-radius:9px;font-size:.92rem;}
.room .mvl li:first-child{background:color-mix(in srgb,var(--lit) 12%,transparent);}
.room .mvl li .no{color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:700;text-align:right;}
.room .mvl li .mini{position:relative;inset:auto;width:16px;height:16px;display:block;}
.room .mvl li .who{font-weight:700;overflow-wrap:anywhere;}
.room .mvl li b{font-variant-numeric:tabular-nums;white-space:nowrap;}
.room .mvl li.cap b{color:#ff8f7a;}
.room .mvl li.none{display:block;color:var(--text-3);}
.room .chart svg{width:100%;height:80px;display:block;}
.room .key{margin:0;font-size:.78rem;color:var(--text-3);}
.room .wins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.room .wins li{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;}
.room .wins li span{font-weight:700;overflow-wrap:anywhere;}
/* each player's twelve pieces as a row of stones: the ones still on the board, and an empty dimple for each one captured */
.pbar{flex-wrap:wrap;}
.pbar .tray{display:none;flex-basis:100%;gap:3%;padding:2px 0 1px;justify-content:space-between;}
#app.la-port:not(.la-short) .pbar .tray,#app.la-land:not(.la-low) .pbar .tray{display:flex;}
.tray i{position:relative;flex:1;max-width:22px;aspect-ratio:1;border-radius:50%;}
.tray i.b{background:radial-gradient(circle at 36% 30%,#8d8d98 0,#3a3a42 18%,#16161a 55%,#040405 100%);box-shadow:0 1.5px 0 #000;}
.tray i.w{background:radial-gradient(circle at 36% 30%,#ffffff 0,#f2eee6 40%,#c6beae 100%);box-shadow:0 1.5px 0 #8c8473;}
.tray i.gone{background:none;box-shadow:inset 0 1.5px 3px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.12);}
#app.la-tall .frame{--rim:20px;}
#app.la-tall .pbar{min-height:60px;padding:8px 16px 8px 12px;}
#app.la-tall .pbar .nm{font-size:1.1rem;}
#app.la-tall .pbar .sub{font-size:.85rem;}
#app.la-tall .pbar .grp b{font-size:2rem;}
#app.la-tall .pbar .tok{width:36px;height:36px;}
#app.la-land>.cb-col{width:auto;height:var(--bsz);display:grid;grid-template-columns:var(--sw,300px) var(--bsz);
  grid-template-rows:max-content max-content minmax(0,1fr) max-content max-content max-content;
  grid-template-areas:"t b" "s b" ". b" "a b" "r b" "p b";column-gap:var(--cg,24px);row-gap:10px;justify-content:center;}
#app.la-land>.cb-col>.frame{grid-area:b;--rim:clamp(10px,2.4vh,22px);}
#app.la-land>.cb-col>.pbar.top{grid-area:t;}
#app.la-land>.cb-col>.pbar.bot{grid-area:p;}
#app.la-land>.cb-col>.turn{grid-area:s;justify-self:start;}
#app.la-land>.cb-col>.acts{grid-area:a;justify-content:flex-start;}
#app.la-land>.cb-col>.rulechip{grid-area:r;text-align:left;}
#app.la-land:not(.la-low) .pbar{min-height:58px;}
#app.la-land:not(.la-low) .pbar .grp b{font-size:1.9rem;}
#app.la-low>.cb-col{row-gap:6px;}
#app.la-low .pbar{min-height:42px;padding:3px 9px;}
#app.la-low>.cb-col>.turn{min-height:26px;font-size:.92rem;margin:0;}
#app.la-low>.cb-col>.rulechip{display:none;}
.frame{view-transition-name:la-board;}
.pbar.top{view-transition-name:la-top;}
.pbar.bot{view-transition-name:la-bot;}
.cb-col>.turn{view-transition-name:la-turn;}
.cb-col>.acts{view-transition-name:la-acts;}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,.7,.25,1);}
::view-transition-old(root),::view-transition-new(root){animation:none;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  function vtGo(fn) { var t = document.startViewTransition(fn); ['ready', 'finished', 'updateCallbackDone'].forEach(function (k) { if (t && t[k] && t[k].catch) t[k].catch(function () {}); }); }
  var el = Kit.el, app = document.getElementById('app'), C = window.LOACore;
  var SAVE = 'loa_state', KEY = 'linesofaction';
  var BLACK = 1, WHITE = -1;
  var NUM = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
  function num(n) { return NUM[n] || String(n); }
  function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ── The computer thinks in a Web Worker (loa-core.js again), or on the page where a worker can't start ──
  var worker = null, workerOk = true, reqId = 0, pending = null;
  function getWorker() {
    if (worker || !workerOk) return worker;
    try {
      var url = new URL('loa-core.js', location.href).href;
      var src = 'importScripts(' + JSON.stringify(url) + ');onmessage=function(e){var d=e.data;postMessage({id:d.id,res:self.LOACore.search(d.b,d.side,d.o)});};';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = function (e) { if (pending && e.data.id === pending.id) { var p = pending; pending = null; p.cb(e.data.res); } };
      worker.onerror = function () { workerOk = false; worker = null; if (pending) { var p = pending; pending = null; p.cb(C.search(p.b, p.side, p.o)); } };
    } catch (e) { workerOk = false; worker = null; }
    return worker;
  }
  function think(b, side, o, cb) {
    var id = ++reqId, w = getWorker();
    pending = { id: id, cb: cb, b: b, side: side, o: o };
    if (w) w.postMessage({ id: id, b: b, side: side, o: o });
    else setTimeout(function () { if (pending && pending.id === id) { pending = null; cb(C.search(b, side, o)); } }, 30);
  }
  function cancelThink() { pending = null; }

  // ── State ────────────────────────────────────────────────────────────────
  // S = the core's state (loa-core.js) and {mode, level, players: [{name, cpu, side}], hist (undo snapshots), started,
  //     caps: {'1': n, '-1': n}, bestJoin: {'1': n, '-1': n}, longest: {'1': n, '-1': n}, low: {'1': fewest groups... }}
  var S = null, sel = -1;
  var LEVEL_NAME = { easy: 'Easy', normal: 'Normal', hard: 'Hard', expert: 'Expert' };
  var NET = null, LEFT = null, WINO = null, NETREC = {}, SHOWN = 0;
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && !S.over) Kit.resume.set(S.n ? 'Move ' + (S.n + 1) : 'Ready');
  }
  function clearSave() { if (NET) return; try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function pl(side) { return S.players[0].side === side ? S.players[0] : S.players[1]; }
  function vsCpu() { return S.players.some(function (p) { return p.cpu; }); }
  function colorName(side) { return side === BLACK ? 'Black' : 'White'; }
  function isMe(p) { return NET ? NET.seat >= 0 && S.players[NET.seat] === p : !p.cpu && (vsCpu() || false); }
  function nm(p) { return isMe(p) ? 'You' : p.name; }   // "You" only where one person plays against the computer or online
  function groupsOf(side) { return C.groups(S.b, side); }

  function rulesHtml() {
    return '<p class="goal">Join <b>all of your pieces into one group</b>. Pieces in a group touch each other side by side or corner to corner.</p>' +
      '<h3>Your turn</h3><ul><li><b>Black goes first.</b> Black starts along the top and bottom edges, White along the left and right, and the corners are empty.</li>' +
      '<li>Move one of your pieces in a straight line: across, up and down, or on a diagonal.</li>' +
      '<li>A piece moves <b>exactly as many squares as there are pieces on that whole line</b>, from one edge of the board to the other. Pieces of both colors count, and so does the piece that moves.</li>' +
      '<li>A piece can jump over your own pieces, but <b>never over the other player’s</b>.</li>' +
      '<li>It can land on an empty square, or on one of the other player’s pieces to <b>capture</b> it. It can’t land on one of your own.</li>' +
      '<li>Tap one of your pieces to see its lines. The number on each landing is how far that line lets it move.</li></ul>' +
      '<h3>Winning</h3><ul><li>The first player whose pieces are all in one group wins. If you’re down to one piece, that piece is a group, and you win.</li>' +
      '<li>If your capture leaves the other player’s pieces all in one group, the other player wins.</li>' +
      '<li>If one move joins both players’ pieces at once, the game is a draw. In setup you can choose instead that the player who moved wins, as in Sid Sackson’s second edition.</li>' +
      '<li>A player with no move passes. If the same position comes up a third time with the same player to move, the game is a draw.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b> opens a table, and the other player joins on their own device. Take your turn whenever you like: the home screen shows when it’s your move. Each new game at the table swaps colors.</li></ul>' +
      '<h3>Tips</h3><ul><li>The soft shadow under each group shows how your pieces are joined, and the number beside your name says how many groups you still have.</li>' +
      '<li>Bring your pieces toward the middle, where they can reach each other.</li>' +
      '<li>Capturing isn’t always good: every piece you take is one fewer the other player has to join.</li>' +
      '<li>A piece of yours on the second row or column can hem the other player’s pieces against the edge.</li></ul>' +
      '<p class="src">Lines of Action was invented by Claude Soucie and published in Sid Sackson’s A Gamut of Games (1969). These are the rules of the Mind Sports Olympiad.</p>';
  }

  Kit.init({
    id: KEY, mark: false, snap: '.frame',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } cancelThink(); clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Lines of Action: past games' }); } }]),
    rules: rulesHtml()
  });

  var TIE_CH = [['draw', 'Draw', 'A move that joins both players’ pieces at once ends the game in a draw. Tournaments play it this way today.'],
    ['mover', 'Mover wins', 'A move that joins both players’ pieces at once wins for the player who made it, as Sid Sackson’s second edition says.']];
  function showSetup() {
    S = null; sel = -1;
    app.classList.remove('ipl', 'la-land', 'la-low', 'la-tall', 'la-port', 'la-short');
    Kit.setup(app, {
      modes: Kit.modes([{ id: 'cpu', desc: 'Easy, Normal, Hard or Expert' }, { id: '2p', kind: 'local' }]),
      options: [
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: [['easy', 'Easy', 'Looks one move ahead and often picks a much weaker move.'], ['normal', 'Normal', 'Looks a few moves ahead.'], ['hard', 'Hard', 'Looks several moves ahead and never misses a win it can see.'], ['expert', 'Expert', 'Looks furthest ahead of all and sees wins coming long before they land.']], when: function (m) { return m === 'cpu'; } },
        { id: 'side', label: 'You play', value: 'b', choices: [['b', 'Black\nMoves first', 'Black always moves first, so you start.'], ['w', 'White', 'The computer plays Black and moves first.']], when: function (m) { return m === 'cpu'; } },
        { id: 'tie', label: 'If both connect at once', value: 'draw', choices: TIE_CH }
      ],
      players: { min: 2, max: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },
      onStart: function (cfg) {
        var cpu = cfg.mode === 'cpu', hs = cpu && cfg.options.side === 'w' ? WHITE : BLACK;
        var pls = cfg.players.map(function (p, i) { return { name: p.name, cpu: p.cpu, side: i === 0 ? hs : -hs }; });
        newGame({ mode: cfg.mode, level: cfg.options.level || 'normal', tie: cfg.options.tie || 'draw', players: pls });
      }
    });
  }
  function newGame(o, swap) {
    cancelThink();
    var players = o ? o.players : S.players, mode = o ? o.mode : S.mode, level = o ? o.level : S.level, tie = o ? o.tie : S.tie;
    if (swap && !players.some(function (p) { return p.cpu; })) players.forEach(function (p) { p.side = -p.side; });
    S = C.newGame({ tie: tie });
    S.mode = mode; S.level = level; S.players = players; S.hist = []; S.started = Date.now(); S.busy = false;

      return { win: w >= 0 ? [w] : [], text: w >= 0 ? st.players[w].name + ' joined every piece' : 'A draw' };
    },
    show: netShow, leave: netLeave
  });
})();
</script>

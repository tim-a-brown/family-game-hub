<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* ── Play view: fills the screen, no page scroll ────────────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 50% at 50% 0%, rgba(56,225,255,.12) 0%, rgba(56,225,255,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 8px calc(var(--safe-b) + 10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.ar-hud{flex:none;display:flex;gap:6px;width:100%;}
.ar-plate{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:14px;
  background:linear-gradient(180deg,#18203a 0%,#0c1122 100%);
  box-shadow:inset 0 0 0 1.5px rgba(140,200,255,.22),inset 0 0 0 3.5px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.4);transition:box-shadow .2s;}
.ar-plate .nm{flex:1;min-width:0;display:flex;flex-direction:column;}
.ar-plate small{font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(200,225,255,.6);white-space:nowrap;}
.ar-plate .who{font-weight:800;font-size:.9rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ar-plate b{font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1;color:var(--pc);font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px var(--pc),0 2px 0 rgba(0,0,0,.5);}
.ar-plate.p2{flex-direction:row-reverse;text-align:right;}
.ar-plate.serve{box-shadow:inset 0 0 0 2px var(--pc),inset 0 0 0 4px rgba(0,0,0,.35),0 0 18px color-mix(in srgb,var(--pc) 40%,transparent),0 6px 16px rgba(0,0,0,.4);}
.ar-plate .sv{display:none;font-size:.58rem;font-weight:900;letter-spacing:.12em;color:#06101c;background:var(--pc);border-radius:999px;padding:1px 6px;align-self:flex-start;margin-top:2px;}
.ar-plate.serve .sv{display:inline-block;}
.ar-plate.p2 .sv{align-self:flex-end;}
.ar-plate.bump b{animation:bounce .45s var(--spring);}
.ar-mid{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 2px;}
.ar-mid small{font-size:.58rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(200,225,255,.5);}
.ar-mid b{font-family:var(--display);font-weight:400;font-size:1.1rem;color:#fff;}
.ar-pbtn{flex:none;width:46px;border:0;border-radius:14px;display:grid;place-items:center;color:#cfe6ff;
  background:linear-gradient(180deg,#18203a 0%,#0c1122 100%);box-shadow:inset 0 0 0 1.5px rgba(140,200,255,.22),0 6px 16px rgba(0,0,0,.4);}
.ar-pbtn:active{transform:scale(.94);}
.ar-pbtn svg{width:22px;height:22px;}
.ar-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;}
.ar-cab{position:relative;padding:7px;border-radius:20px;}
.ar-cab canvas{display:block;border-radius:13px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.ar-ov{position:absolute;inset:7px;border-radius:13px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(6,10,22,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(260px,86%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;color:#7fe9ff;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
.ar-hint{flex:none;font-size:.82rem;color:var(--text-3);text-align:center;font-weight:800;letter-spacing:.02em;}
@media (hover:hover) and (pointer:fine){ .ar-touch{display:none!important;} }
@media (hover:none),(pointer:coarse){ .ar-desk{display:none!important;} }
@media (max-width:360px){ .ar-plate b{font-size:1.5rem;} .ar-plate .who{font-size:.8rem;} }
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), root = document.documentElement;
  var KEY = 'paddleball', SAVE = 'paddleball_state';
  // Abstract court: L runs from player 1's end (0) to player 2's end (FL); C runs across.
  var FL = 600, FC = 360;
  var PAD_OFF = 28, PAD_T = 10, PAD_HW = 36, BIG_HW = 58, R = 7;
  var SERVE_V = 330, MAX_V = 960;
  var TICK = 1 / 240;
  var TOUCH = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  var PC = ['#38e1ff', '#ff4fa3'];
  var DIFF = {
    easy: { name: 'Easy', react: 0.3, speed: 300, accel: 1700, err: 46, aim: 0, hesitate: 0.2 },
    normal: { name: 'Normal', react: 0.18, speed: 450, accel: 2600, err: 22, aim: 0.25, hesitate: 0.08 },
    hard: { name: 'Hard', react: 0.1, speed: 640, accel: 4200, err: 9, aim: 0.45, hesitate: 0.02 }
  };
  var POWERS = { big: { name: 'Big paddle', c: '#ffd24a' }, multi: { name: 'Multi-ball', c: '#7dff9a' }, curve: { name: 'Curve', c: '#c49bff' } };

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function soundOn() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }
  function randn() { return (Math.random() + Math.random() + Math.random() - 1.5) / 0.5; }

  // ═══ Sound ═══════════════════════════════════════════════════════════════
  var AC = null, master = null, noiseBuf = null;
  function ac() {
    if (!soundOn()) return null;
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
      master = AC.createGain(); master.gain.value = 0.8;
      var comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function osc(type, f, t0, dur, vol, o) {
    var a = ac(); if (!a) return; o = o || {};
    var t = a.currentTime + t0, n = a.createOscillator(), g = a.createGain(), out = n;
    n.type = type; n.frequency.setValueAtTime(f, t);
    if (o.to) n.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (o.lp) { var f2 = a.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; n.connect(f2); out = f2; }
    out.connect(g); g.connect(master); n.start(t); n.stop(t + dur + 0.05);
  }
  function noise(t0, dur, vol, type, freq) {
    var a = ac(); if (!a) return;
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;
    s.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq || 1000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  // Paddle hit: the pitch climbs as the rally speeds up
  function sHit(speed, smash) {
    var k = clamp((speed - SERVE_V) / (MAX_V - SERVE_V), 0, 1), f = 300 * Math.pow(2, k * 1.6);
    osc('square', f, 0, 0.07, 0.05, { lp: 3200 }); osc('sine', f / 2, 0, 0.09, 0.06);
    if (smash) { noise(0, 0.22, 0.2, 'lowpass', 1400); osc('sine', 90, 0, 0.3, 0.12, { to: 45 }); }
  }
  function sWall() { osc('square', 220, 0, 0.04, 0.025, { lp: 1800 }); }
  function sServe() { osc('triangle', 520, 0, 0.08, 0.06, { to: 780 }); }
  function sPoint(good) { if (good) { osc('triangle', mtof(76), 0, 0.12, 0.07); osc('triangle', mtof(83), 0.1, 0.2, 0.07); } else { osc('square', 240, 0, 0.35, 0.04, { to: 110, lp: 1400 }); } }
  function sPower() { [72, 76, 79, 84].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.05, 0.16, 0.07); }); }

  // ═══ State ═══════════════════════════════════════════════════════════════
  var G = null, view = 'none', paused = false;
  var balls = [], pads = [], orb = null;
  var fx = { parts: [], pops: [], banner: null, shake: 0, flash: 0 };

  function hw(p) { return pads[p].hw; }
  function front(p) { return p === 0 ? PAD_OFF + PAD_T / 2 : FL - PAD_OFF - PAD_T / 2; }
  function human(p) { return G.mode === 'two' || p === 0; }
  function server() { return (G.firstServer + G.score[0] + G.score[1]) % 2; }
  function newPads() {
    pads = [0, 1].map(function () { return { c: FC / 2, tc: FC / 2, v: 0, hw: PAD_HW, flash: 0 }; });
  }

  // ── Serve
  function readyServe() {
    var s = server();
    balls = [];
    G.phase = 'serve'; G.serveT = 0; G.rally = 0; G.rallyT = 0;
    G.ai.next = 0; G.ai.serveAt = 0.9 + Math.random() * 0.6; G.ai.serveTo = clamp(FC / 2 + randn() * 60, 60, FC - 60);
    G.orbT = 5 + Math.random() * 5; orb = null;
    var b = { l: 0, c: pads[s].c, vl: 0, vc: 0, spin: 0, last: s, trail: [], held: s, speed: SERVE_V };
    placeHeld(b);
    balls.push(b);
    hudDirty = true;
    save();
  }
  function placeHeld(b) {
    var p = b.held; b.c = clamp(pads[p].c, R, FC - R); b.l = p === 0 ? front(0) + R + 2 : front(1) - R - 2;
  }
  function doServe() {
    if (!G || G.phase !== 'serve') return;
    var b = balls[0]; if (!b || b.held == null) return;
    var p = b.held, dir = p === 0 ? 1 : -1;
    var off = (pads[p].c - FC / 2) / (FC / 2); // serve slants back toward the middle
    var a = clamp(-off * 0.35 + (Math.random() - 0.5) * 0.5, -0.5, 0.5);
    b.held = null; b.speed = SERVE_V; b.vl = dir * Math.cos(a) * SERVE_V; b.vc = Math.sin(a) * SERVE_V; b.last = p;
    G.phase = 'play'; G.rallyT = 0;
    sServe(); Kit.haptic('light');
  }

  // ═══ Physics ═════════════════════════════════════════════════════════════
  function movePad(p, dt) {
    var P = pads[p];
    var want = (G.pw.big[p] > 0) ? BIG_HW : PAD_HW;
    P.hw += (want - P.hw) * Math.min(1, dt * 10);
    if (human(p)) {
      if (keys[p]) P.tc = clamp(P.tc + keys[p] * 600 * dt, 0, FC);
      var dx = clamp(P.tc, P.hw, FC - P.hw) - P.c, mv = clamp(dx, -2400 * dt, 2400 * dt);
      P.c += mv; P.v = P.v * 0.6 + (mv / dt) * 0.4;
    } else {
      aiThink(dt);
      var D = DIFF[G.diff], desired = clamp((G.ai.target - P.c) * 9, -D.speed, D.speed);
      P.v += clamp(desired - P.v, -D.accel * dt, D.accel * dt);
      P.c += P.v * dt;
    }
    if (P.c < P.hw) { P.c = P.hw; P.v = 0; }
    if (P.c > FC - P.hw) { P.c = FC - P.hw; P.v = 0; }
    P.flash = Math.max(0, P.flash - dt * 4);
  }
  function step(dt) {
    movePad(0, dt); movePad(1, dt);
    if (G.phase === 'serve') {
      G.serveT += dt;
      var b0 = balls[0]; if (b0 && b0.held != null) placeHeld(b0);
      var s = server();
      if (!human(s) && G.serveT > G.ai.serveAt) doServe();
      else if (human(s) && G.serveT > 4) doServe(); // auto-serve if nobody does
      return;
    }
    if (G.phase !== 'play') return;
    G.rallyT += dt;
    for (var i = 0; i < balls.length; i++) moveBall(balls[i], dt);
    var gone = balls.filter(function (b) { return b.out != null; });
    if (gone.length) {
      balls = balls.filter(function (b) { return b.out == null; });
      for (var j = 0; j < gone.length; j++) { pointTo(gone[j].out, gone[j], balls.length === 0 && j === gone.length - 1); if (G.phase === 'over') return; }
    }
    // Power-up orbs
    if (G.powers) {
      if (orb) {
        orb.life -= dt; orb.t += dt;
        if (orb.life <= 0) orb = null;
        else for (var k = 0; k < balls.length; k++) {
          var bb = balls[k];
          if (Math.hypot(bb.l - orb.l, bb.c - orb.c) < R + 14 && bb.last != null) { grabPower(bb.last, orb, bb); orb = null; break; }
        }
      } else if (G.rallyT > 2) {
        G.orbT -= dt;
        if (G.orbT <= 0) {
          var kinds = Object.keys(POWERS);
          orb = { kind: kinds[Math.floor(Math.random() * kinds.length)], l: FL * (0.32 + Math.random() * 0.36), c: 50 + Math.random() * (FC - 100), life: 10, t: 0 };
          G.orbT = 7 + Math.random() * 6;
        }
      }
    }
    for (var p = 0; p < 2; p++) if (G.pw.big[p] > 0) G.pw.big[p] = Math.max(0, G.pw.big[p] - dt);
  }
  function moveBall(b, dt) {
    if (b.out != null) return;
    if (b.spin) {
      b.vc += b.spin * dt; b.spin *= Math.max(0, 1 - 0.9 * dt);
      if (Math.abs(b.spin) < 20) b.spin = 0;
      var sp = Math.hypot(b.vl, b.vc), minL = sp * 0.42;
      if (Math.abs(b.vl) < minL) { b.vl = Math.sign(b.vl) * minL; b.vc = Math.sign(b.vc) * Math.sqrt(sp * sp - minL * minL); }
      var m = b.speed / (Math.hypot(b.vl, b.vc) || 1); b.vl *= m; b.vc *= m;
    }
    var pl = b.l;
    b.l += b.vl * dt; b.c += b.vc * dt;
    if (b.c < R) { b.c = R; b.vc = Math.abs(b.vc); b.spin = -b.spin * 0.5; sWall(); wallSpark(b); }
    if (b.c > FC - R) { b.c = FC - R; b.vc = -Math.abs(b.vc); b.spin = -b.spin * 0.5; sWall(); wallSpark(b); }
    // paddles
    for (var p = 0; p < 2; p++) {
      var f = front(p), toward = p === 0 ? b.vl < 0 : b.vl > 0;
      if (!toward) continue;
      var crossed = p === 0 ? (pl - R >= f - 1 && b.l - R <= f) : (pl + R <= f + 1 && b.l + R >= f);
      if (!crossed) continue;
      var P = pads[p];
      if (Math.abs(b.c - P.c) <= P.hw + R * 0.8) { hitPaddle(b, p); return; }
    }
    if (b.l < -R * 3) b.out = 1;
    else if (b.l > FL + R * 3) b.out = 0;
  }
  function hitPaddle(b, p) {
    var P = pads[p], dir = p === 0 ? 1 : -1;
    var rel = clamp((b.c - P.c) / (P.hw + R * 0.5), -1, 1);
    var ang = rel * 1.02 + clamp(P.v / 2600, -0.18, 0.18);
    ang = clamp(ang, -1.1, 1.1);
    var sp = Math.min(MAX_V, b.speed * 1.045 + 10);
    b.speed = sp;
    b.vl = dir * Math.cos(ang) * sp; b.vc = Math.sin(ang) * sp;
    b.l = p === 0 ? front(0) + R : front(1) - R;
    b.last = p; b.spin = 0;
    if (G.pw.curve[p] > 0) {
      G.pw.curve[p]--;
      var sgn = Math.abs(P.v) > 40 ? -Math.sign(P.v) : (rel >= 0 ? -1 : 1);
      b.spin = sgn * 760;
      pop(b.l + dir * 30, b.c, 'CURVE', POWERS.curve.c, 13);
    }
    G.rally++; G.hits[p]++;
    if (G.rally > G.stats.longest) G.stats.longest = G.rally;
    if (sp > G.stats.top) G.stats.top = sp;
    var smash = sp >= 640 && Math.abs(rel) > 0.55;
    if (smash) { G.stats.smash[p]++; fx.shake = 0.55; fx.flash = 0.6; Kit.haptic('heavy'); pop(b.l + dir * 40, b.c, 'SMASH!', PC[p], 16); b.smash = 0.6; }
    else Kit.haptic('light');
    P.flash = 1;
    sHit(sp, smash);
    for (var i = 0; i < (smash ? 18 : 7); i++) part(b.l, b.c, dir * (60 + Math.random() * 200), (Math.random() - 0.5) * 260, PC[p], 0.35 + Math.random() * 0.3, 1.2 + Math.random() * 1.6);
    if (!human(1 - p)) G.ai.next = 0; // computer re-reads the new direction (after its reaction delay)
    if (!human(p)) G.ai.next = 0;
    if (G.rally === 20 || G.rally === 40) Kit.callout && Kit.callout(G.rally + '-hit rally!');
  }
  function wallSpark(b) { for (var i = 0; i < 4; i++) part(b.l, b.c, (Math.random() - 0.5) * 120, (b.c < FC / 2 ? 1 : -1) * (40 + Math.random() * 80), '#cfe6ff', 0.25, 1.2); }
  function grabPower(p, o, b) {
    var P = POWERS[o.kind];
    G.stats.powers[p]++; G.stats.powerKinds[o.kind] = (G.stats.powerKinds[o.kind] || 0) + 1;
    pop(o.l, o.c, P.name.toUpperCase(), P.c, 14);
    for (var i = 0; i < 16; i++) { var a = Math.random() * 6.28; part(o.l, o.c, Math.cos(a) * 140, Math.sin(a) * 140, P.c, 0.5, 2); }
    sPower(); Kit.haptic('medium');
    if (o.kind === 'big') G.pw.big[p] = 12;
    else if (o.kind === 'curve') G.pw.curve[p] = 3;
    else if (o.kind === 'multi') {
      var a0 = Math.atan2(b.vc, Math.abs(b.vl)), sgn = Math.sign(b.vl) || 1;
      [-0.42, 0.42].forEach(function (d) {
        var a1 = clamp(a0 + d, -1, 1);
        balls.push({ l: b.l, c: b.c, vl: sgn * Math.cos(a1) * b.speed, vc: Math.sin(a1) * b.speed, spin: 0, last: b.last, trail: [], speed: b.speed });
      });
      G.stats.maxBalls = Math.max(G.stats.maxBalls, balls.length);
    }
  }

  // ═══ Points ══════════════════════════════════════════════════════════════
  function pointTo(p, b, last) {
    G.score[p]++; G.seq.push(p);
    var other = 1 - p;
    G.run = G.runP === p ? G.run + 1 : 1; G.runP = p;
    if (G.run > G.stats.bestRun[p]) G.stats.bestRun[p] = G.run;
    var deficit = G.score[other] - G.score[p];
    if (deficit > G.stats.maxDown[p]) G.stats.maxDown[p] = deficit;
    if (G.score[0] === G.score[1] && G.score[0] >= G.to - 1) G.stats.deuce = true;
    if (G.rally > (G.stats.longestBy || { n: 0 }).n) G.stats.longestBy = { n: G.rally, winner: p };
    if (b.smash > 0) G.stats.smashWins[p]++;
    fx.flash = Math.max(fx.flash, 0.4); fx.flashC = PC[p];
    for (var i = 0; i < 24; i++) part(clamp(b.l, 0, FL), b.c, (p === 0 ? 1 : -1) * Math.random() * 220, (Math.random() - 0.5) * 300, PC[p], 0.6, 2);
    var goodForHuman = G.mode === 'two' || p === 0;
    sPoint(goodForHuman); Kit.haptic(goodForHuman ? 'success' : 'error');
    scoreBump = p; hudDirty = true;
    if (won(p)) { G.phase = 'over'; G.overT = 0; G.winner = p; G.pw.big = [0, 0]; G.pw.curve = [0, 0]; orb = null; balls = []; clearSave(); return; }
    if (last) {
      G.phase = 'point'; G.pointT = 0; G.pw.big = [0, 0]; G.pw.curve = [0, 0]; orb = null;
      var a = G.score[0], c = G.score[1], hi = Math.max(a, c);
      if (a === c && a >= G.to - 1) fx.banner = { text: 'DEUCE', sub: 'Win by 2', c: '#fff', life: 1.3, max: 1.3 };
      else if (hi >= G.to - 1 && Math.abs(a - c) >= 1) fx.banner = { text: 'GAME POINT', sub: name(a > c ? 0 : 1), c: PC[a > c ? 0 : 1], life: 1.3, max: 1.3 };
    }
  }
  function won(p) { return G.score[p] >= G.to && G.score[p] - G.score[1 - p] >= 2; }
  function name(p) { return G.players[p].name; }

  // ═══ Computer player ═════════════════════════════════════════════════════
  // It only "looks" every reaction interval, guesses where the ball will cross
  // its line (bouncing off the side walls) with some error, then moves there
  // with a limited top speed. Curve shots fool it a little.
  function aiThink(dt) {
    var A = G.ai, D = DIFF[G.diff], P = pads[1];
    if (G.phase === 'serve' && server() === 1) { A.target = A.serveTo; return; }
    A.next -= dt;
    if (A.next > 0) return;
    A.next = D.react * (0.8 + Math.random() * 0.5) + (Math.random() < 0.15 ? D.hesitate : 0);

    for (var j = 20; j < FH; j += 20) { x.beginPath(); x.moveTo(0, j); x.lineTo(FW, j); x.stroke(); }
    // side walls (glowing rails)
    x.shadowColor = 'rgba(140,200,255,.8)'; x.shadowBlur = 8; x.strokeStyle = 'rgba(200,230,255,.55)'; x.lineWidth = 2;
    var a = P2(0, 1), b = P2(FL, 1), a2 = P2(0, FC - 1), b2 = P2(FL, FC - 1);
    x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.moveTo(a2.x, a2.y); x.lineTo(b2.x, b2.y); x.stroke();
    x.shadowBlur = 0;
    // end zones tinted in each player's colour
    [0, 1].forEach(function (p) {
      var l0 = p === 0 ? 0 : FL - 16, q1 = P2(l0, 0), q2 = P2(l0 + 16, FC);
      var gx = x.createLinearGradient(P2(p === 0 ? 0 : FL, 0).x, P2(p === 0 ? 0 : FL, 0).y, P2(p === 0 ? 16 : FL - 16, 0).x, P2(p === 0 ? 16 : FL - 16, 0).y);
      gx.addColorStop(0, PC[p] + '30'); gx.addColorStop(1, PC[p] + '00');
      x.fillStyle = gx; x.fillRect(Math.min(q1.x, q2.x), Math.min(q1.y, q2.y), Math.abs(q2.x - q1.x), Math.abs(q2.y - q1.y));
    });
    // net: dashed centre line
    x.shadowColor = 'rgba(200,230,255,.7)'; x.shadowBlur = 6; x.fillStyle = 'rgba(220,235,255,.5)';
    for (var c2 = 6; c2 < FC; c2 += 18) { var n = P2(FL / 2, c2); if (LAND) x.fillRect(n.x - 2, n.y, 4, 10); else x.fillRect(n.x, n.y - 2, 10, 4); }
    x.shadowBlur = 0;
    bgCanvas = c;
  }
  function txt(s, x, y, size, col, rot, alpha) {
    g.save(); g.translate(x, y); if (rot) g.rotate(rot); if (alpha != null) g.globalAlpha = alpha;
    g.font = font(size); g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = Math.max(3, size / 5); g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(s, 0, 0); g.fillStyle = col; g.fillText(s, 0, 0);
    g.restore();
  }
  // Text facing a player: in 2-player portrait, the top player reads it upside down from our side
  function rotFor(p) { return !LAND && G.mode === 'two' && p === 1 ? Math.PI : 0; }
  function draw() {
    if (!g || !G) return;
    if (!bgCanvas) paintBg();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(bgCanvas, 0, 0);
    var sc = DPR * S, sx = 0, sy = 0;
    if (fx.shake > 0) { var m = fx.shake * fx.shake * 14; sx = (Math.random() - 0.5) * m; sy = (Math.random() - 0.5) * m; }
    g.setTransform(sc, 0, 0, sc, sx * sc, sy * sc);
    // big faint scores in each half
    [0, 1].forEach(function (p) {
      var q = P2(p === 0 ? FL * 0.25 : FL * 0.75, FC / 2);
      g.save(); g.translate(q.x, q.y); g.rotate(rotFor(p));
      g.font = font(LAND ? 120 : 130); g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = PC[p]; g.globalAlpha = 0.09; g.fillText(String(G.score[p]), 0, 0);
      g.restore();
    });
    // orb
    if (orb) drawOrb(orb);
    // particles
    fx.parts.forEach(function (p) { var q = P2(p.l, p.c); g.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); g.fillStyle = p.col; g.beginPath(); g.arc(q.x, q.y, p.s, 0, Math.PI * 2); g.fill(); });
    g.globalAlpha = 1;
    // paddles
    [0, 1].forEach(drawPaddle);
    // balls
    balls.forEach(drawBall);
    // pops
    fx.pops.forEach(function (p) { var q = P2(p.l, p.c), k = 1 - p.life / p.max; txt(p.text, q.x, q.y - k * 18, p.s, p.col, 0, clamp(p.life / 0.3, 0, 1)); });
    g.setTransform(sc, 0, 0, sc, 0, 0);
    if (fx.flash > 0) { g.fillStyle = fx.flashC || '#fff'; g.globalAlpha = fx.flash * 0.12; g.fillRect(0, 0, FW, FH); g.globalAlpha = 1; }
    // serve prompt
    if (G.phase === 'serve' && !paused && human(server()) && !fx.banner) {
      var s = server(), q2 = P2(s === 0 ? FL * 0.2 : FL * 0.8, FC / 2);
      txt(TOUCH ? 'Tap to serve' : 'Space or click to serve', q2.x, q2.y, 17, '#fff', rotFor(s), 0.6 + 0.35 * Math.sin(rt * 5));
    }
    if (fx.banner) {
      var b = fx.banner, k2 = 1 - b.life / b.max, s2 = k2 < 0.12 ? 0.6 + k2 / 0.12 * 0.4 : 1;
      g.save(); g.globalAlpha = b.life < 0.4 ? b.life / 0.4 : 1; g.translate(FW / 2, FH / 2); g.scale(s2, s2);
      g.fillStyle = 'rgba(5,9,19,.55)'; rr(g, -120, -30, 240, b.sub ? 66 : 46, 14); g.fill();
      txt(b.text, 0, -8, 28, b.c);
      if (b.sub) txt(b.sub, 0, 20, 15, '#fff');
      g.restore();
    }
    if (G.phase === 'over' || G.phase === 'done') {
      var w = G.winner; g.globalAlpha = clamp(G.overT / 0.3, 0, 1);
      g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(0, 0, FW, FH);
      txt(name(w).toUpperCase() + (name(w) === 'You' ? ' WIN' : ' WINS'), FW / 2, FH / 2, 34, PC[w]);
      g.globalAlpha = 1;
    }
  }
  function drawPaddle(p) {
    var P = pads[p], l = p === 0 ? PAD_OFF : FL - PAD_OFF;
    var a = P2(l - PAD_T / 2, P.c - P.hw), b = P2(l + PAD_T / 2, P.c + P.hw);
    var x = Math.min(a.x, b.x), y = Math.min(a.y, b.y), w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
    g.save();
    g.shadowColor = PC[p]; g.shadowBlur = 14 + P.flash * 18;
    var gr = LAND ? g.createLinearGradient(x, 0, x + w, 0) : g.createLinearGradient(0, y, 0, y + h);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.35, PC[p]); gr.addColorStop(1, PC[p]);
    g.fillStyle = gr; rr(g, x, y, w, h, 5); g.fill();
    g.shadowBlur = 0;
    if (P.flash > 0) { g.globalAlpha = P.flash * 0.7; g.fillStyle = '#fff'; rr(g, x, y, w, h, 5); g.fill(); g.globalAlpha = 1; }
    // power badges
    var tags = [];
    if (G.pw.big[p] > 0) tags.push(['BIG ' + Math.ceil(G.pw.big[p]), POWERS.big.c]);
    if (G.pw.curve[p] > 0) tags.push(['CURVE x' + G.pw.curve[p], POWERS.curve.c]);
    tags.forEach(function (t, i) {
      var q = P2(p === 0 ? l + 22 + i * 16 : l - 22 - i * 16, P.c);
      txt(t[0], q.x, q.y, 11, t[1], rotFor(p));
    });
    g.restore();
  }
  function drawBall(b) {
    var k = clamp((b.speed - SERVE_V) / (MAX_V - SERVE_V), 0, 1);
    var col = k < 0.5 ? mix('#ffffff', '#ffe066', k * 2) : mix('#ffe066', '#ff7a3a', (k - 0.5) * 2);
    for (var i = 0; i < b.trail.length; i += 2) {
      var a = i / b.trail.length, q = P2(b.trail[i], b.trail[i + 1]);
      g.globalAlpha = a * 0.35; g.fillStyle = col; g.beginPath(); g.arc(q.x, q.y, R * (0.3 + a * 0.6), 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
    var p = P2(b.l, b.c);
    if (b.held != null) {
      g.strokeStyle = PC[b.held]; g.globalAlpha = 0.5 + 0.4 * Math.sin(rt * 6); g.lineWidth = 2;
      g.beginPath(); g.arc(p.x, p.y, R + 6 + 2 * Math.sin(rt * 6), 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1;
    }
    g.shadowColor = col; g.shadowBlur = 12 + k * 14;
    var gr = g.createRadialGradient(p.x - 2, p.y - 2, 0.5, p.x, p.y, R);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.6, col); gr.addColorStop(1, mix(col, '#000000', 0.25));
    g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, R, 0, Math.PI * 2); g.fill();
    g.shadowBlur = 0;
    if (b.spin) { g.strokeStyle = POWERS.curve.c; g.lineWidth = 1.5; g.beginPath(); g.arc(p.x, p.y, R + 3, rt * 12, rt * 12 + 2); g.stroke(); }
  }
  function drawOrb(o) {
    var p = P2(o.l, o.c), P = POWERS[o.kind], pulse = 1 + 0.08 * Math.sin(o.t * 6), a = o.life < 1.5 ? (Math.floor(o.life * 8) % 2 ? 0.4 : 1) : 1;
    g.save(); g.translate(p.x, p.y); g.globalAlpha = a; g.scale(pulse, pulse);
    g.shadowColor = P.c; g.shadowBlur = 18;
    g.strokeStyle = P.c; g.lineWidth = 2.5; g.beginPath(); g.arc(0, 0, 14, 0, Math.PI * 2); g.stroke();
    g.fillStyle = P.c + '33'; g.fill();
    g.shadowBlur = 0; g.fillStyle = P.c; g.strokeStyle = P.c;
    if (!LAND) g.rotate(Math.PI / 2);
    if (o.kind === 'big') { rr(g, -2.5, -8, 5, 16, 2); g.fill(); g.lineWidth = 1.6; g.beginPath(); g.moveTo(-6, -6); g.lineTo(-6, 6); g.moveTo(6, -6); g.lineTo(6, 6); g.stroke(); }
    else if (o.kind === 'multi') { [-5.5, 0, 5.5].forEach(function (d, i) { g.beginPath(); g.arc(i === 1 ? 2 : -2, d, 2.8, 0, Math.PI * 2); g.fill(); }); }
    else { g.lineWidth = 2.4; g.lineCap = 'round'; g.beginPath(); g.arc(-6, 0, 9, -0.9, 0.9); g.stroke(); g.beginPath(); g.arc(4.6, 6.8, 2.6, 0, Math.PI * 2); g.fill(); }
    g.restore();
  }
  function mix(a, b, t) {
    var x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
    var r = Math.round((x >> 16) + ((y >> 16) - (x >> 16)) * t), gg = Math.round(((x >> 8) & 255) + (((y >> 8) & 255) - ((x >> 8) & 255)) * t), bl = Math.round((x & 255) + ((y & 255) - (x & 255)) * t);
    return '#' + ((1 << 24) + (r << 16) + (gg << 8) + bl).toString(16).slice(1);
  }

  // ═══ Test hooks ══════════════════════════════════════════════════════════
  window.__pong = {
    get: function () { return G && { phase: G.phase, mode: G.mode, score: G.score.slice(), server: server(), rally: G.rally, land: LAND, paused: paused, pads: pads.map(function (p) { return { c: Math.round(p.c), tc: Math.round(p.tc), hw: Math.round(p.hw) }; }), balls: balls.map(function (b) { return { l: Math.round(b.l), c: Math.round(b.c), speed: Math.round(b.speed), held: b.held }; }), stats: G.stats, pw: G.pw, orb: orb && orb.kind }; },
    serve: doServe,
    score: function (a, b) { G.score = [a, b]; hudDirty = true; },
    orb: function (kind, l, c) { orb = { kind: kind, l: l, c: c, life: 10, t: 0 }; },
    autopilot: function (on) { window.__pAuto = on; },
    toCourt: function (x, y) { return toCourt(x, y); },
    shotAt: function (l, c, vl, vc) { var b = balls[0]; if (!b) return; b.held = null; b.l = l; b.c = c; b.vl = vl; b.vc = vc; b.speed = Math.hypot(vl, vc); G.phase = 'play'; }
  };
  // Test autopilot: human paddle(s) track the ball
  setInterval(function () {
    if (!window.__pAuto || !G || paused) return;
    [0, 1].forEach(function (p) {
      if (!human(p)) return;
      var best = null; balls.forEach(function (b) { if (!best || Math.abs(b.l - (p ? FL : 0)) < Math.abs(best.l - (p ? FL : 0))) best = b; });
      if (best) pads[p].tc = best.c + (Math.random() - 0.5) * 30;
    });
    if (G.phase === 'serve' && human(server()) && G.serveT > 0.4) doServe();
  }, 16);

  // ═══ Boot ════════════════════════════════════════════════════════════════
  var saved = loadSave();
  if (saved) startGame({ mode: saved.mode, diff: saved.diff, to: saved.to, powers: saved.powers, players: saved.players }, saved);
  else showSetup();
})();
</script>

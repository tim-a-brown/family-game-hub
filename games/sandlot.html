<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandlot Showdown</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
:root{--board:#17382b;--board-2:#0e241b;--plate:#0a1a13;--cream:#fbf3dc;--amber:#ffb84a;--seam:#c8102e;}

/* ── Play screen: fills the space under the game bar, no page scroll ─────── */
.stage.sl-on{max-width:640px;height:calc(100dvh - var(--barh,58px));padding:2px calc(12px + var(--corner-x) * .5) calc(var(--safe-b) + 8px + var(--corner-y));display:flex;flex-direction:column;}
.sl{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;}

/* Old-school ballpark scoreboard: painted green board, number plates */
.sb{flex:none;display:block;width:100%;border:0;border-radius:14px;padding:5px;text-align:left;color:inherit;cursor:pointer;}
.sb-in{background:linear-gradient(180deg,var(--board),var(--board-2));border-radius:10px;padding:3px 5px 5px;box-shadow:inset 0 2px 10px rgba(0,0,0,.65);}
.ls{width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed;font-variant-numeric:tabular-nums;}
.ls th{height:13px;padding:0;font-size:.58rem;font-weight:900;letter-spacing:.05em;color:rgba(251,243,220,.55);text-align:center;}
.ls th.tmh{text-align:left;padding-left:3px;}
.ls td{height:23px;padding:0;text-align:center;background:var(--plate);border-radius:3px;color:var(--cream);font-family:var(--display);font-size:1.02rem;line-height:23px;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);}
.ls td.tm{background:none;box-shadow:none;text-align:left;font-family:var(--font);font-weight:900;font-size:.8rem;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px;}
.ls td.tm i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px;box-shadow:0 0 0 2px rgba(0,0,0,.4);}
.ls td.tm.up{color:#fff;}
.ls td.tm.up i{box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 8px var(--c);}
.ls td.now{color:var(--amber);text-shadow:0 0 8px rgba(255,184,74,.6);}
.ls td.x{color:rgba(251,243,220,.4);}
.ls td.rhe{background:#06110c;color:#fff;}
.ls th.rh{color:var(--amber);}
.ls col.c-tm{width:23%;}
.ls col.c-r{width:9%;}

/* Tabletop ballpark: wood rim, grass felt, drawn infield */
.fieldbox{position:relative;flex:1 1 auto;min-height:170px;border-radius:20px;padding:6px;display:flex;}
.fieldbox .felt-in{position:relative;flex:1;border-radius:15px;overflow:hidden;}
.fieldbox svg.fld{position:absolute;inset:0;width:100%;height:100%;}
.tok{transition:transform .65s var(--ease),opacity .45s;}
.tok.gone{opacity:0;}
.tok text{font-family:var(--font);font-weight:900;font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none;}
.hud{position:absolute;z-index:2;display:flex;align-items:center;gap:6px;pointer-events:none;}
.hud.tl{left:9px;top:8px;flex-direction:column;align-items:flex-start;gap:4px;}
.hud.tr{right:9px;top:8px;flex-direction:column;align-items:flex-end;gap:4px;}
.inn{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:999px;background:rgba(10,26,19,.78);color:var(--cream);font-weight:900;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.inn .ar{font-size:.7rem;color:var(--amber);}
.outs{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:rgba(10,26,19,.78);color:rgba(251,243,220,.7);font-weight:900;font-size:.66rem;letter-spacing:.1em;}
.outs i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.outs i.on{background:radial-gradient(circle at 40% 35%,#ff8a8a,#e0262f 70%);box-shadow:0 0 8px rgba(255,60,60,.8);}
.pill{padding:3px 9px;border-radius:999px;font-size:.7rem;font-weight:900;letter-spacing:.04em;background:var(--amber);color:#2b1a00;box-shadow:0 2px 8px rgba(0,0,0,.35);animation:pop .4s var(--spring);}
.dtray{position:absolute;left:8px;bottom:8px;z-index:2;display:flex;gap:5px;pointer-events:none;}
.dtray .die{--ds:26px;padding:4px;}
.splash{position:absolute;left:50%;top:44%;z-index:3;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--display);font-size:2.6rem;color:#fff;letter-spacing:.02em;
  text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.4);white-space:nowrap;animation:splash 1.2s var(--spring) forwards;}
@keyframes splash{0%{transform:translate(-50%,-50%) scale(.4);opacity:0;}20%{transform:translate(-50%,-50%) scale(1.08);opacity:1;}75%{opacity:1;}100%{transform:translate(-50%,-70%) scale(1);opacity:0;}}
.final{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(6,16,10,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:rise .4s var(--ease);}
.final .fb{text-align:center;padding:12px;}
.final h2{font-family:var(--display);font-weight:400;font-size:2.8rem;color:var(--cream);letter-spacing:.08em;text-shadow:0 3px 0 rgba(0,0,0,.5);}
.final p{color:var(--cream);font-weight:800;margin:2px 0 12px;}
.final .btn{margin-top:8px;}

/* Matchup: the batter's and pitcher's cards, the way they sit on the table */
.mu{flex:none;display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);align-items:stretch;}
.bc{--tc:#888;position:relative;min-width:0;border:0;border-radius:7px;padding:5px 8px 5px 9px;text-align:left;cursor:pointer;
  background:linear-gradient(160deg,#fffdf4,#f2e6c8);color:#2a2a3a;box-shadow:inset 0 0 0 3px var(--tc),inset 0 0 0 5px #fffdf4,0 5px 12px rgba(0,0,0,.45);}
.bc.p{transform:rotate(.6deg);} .bc.b{transform:rotate(-.6deg);}
.bc .rl{display:block;font-size:.56rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--tc) 65%,#222);}
.bc .nm{display:block;font-family:var(--display);font-weight:400;font-size:1.12rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:24px;}
.bc .st{display:block;font-family:var(--hand);font-size:1.02rem;line-height:1.15;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bc .td{display:block;font-size:.68rem;font-weight:800;color:#6a6478;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bc .ps{position:absolute;right:6px;top:6px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--tc);color:#fff;font-size:.6rem;font-weight:900;box-shadow:0 0 0 2px #fffdf4;}
.bc .arm{display:flex;align-items:center;gap:5px;margin-top:2px;}
.bc .arm b{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.12);overflow:hidden;}
.bc .arm b i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3ddc84,#ffc83d 70%,#ff4d5e);}
.bc .arm small{font-size:.62rem;font-weight:900;color:#6a6478;white-space:nowrap;}
.bc .arm.tired small{color:#c8102e;}
.vs{display:grid;place-items:center;font-family:var(--display);font-size:.85rem;color:var(--text-3);}

/* Ballpark message board: the swing chart and the announcer */
.mb{flex:none;border-radius:12px;padding:6px 8px 7px;background:#0c0a12;box-shadow:inset 0 0 0 2px #2b2633,0 6px 14px rgba(0,0,0,.4);}
.chart{position:relative;display:flex;height:20px;border-radius:5px;}
.chart .sg{position:relative;height:100%;display:grid;place-items:center;overflow:hidden;font-size:.58rem;font-weight:900;color:rgba(0,0,0,.66);white-space:nowrap;}
.chart .sg:first-child{border-radius:5px 0 0 5px;} .chart .sg:last-of-type{border-radius:0 5px 5px 0;}
.chart .sg + .sg{box-shadow:inset 1px 0 0 rgba(0,0,0,.35);}
.chart .sg.hit{filter:brightness(1.25);box-shadow:0 0 0 2px #fff, 0 0 12px rgba(255,255,255,.7);z-index:1;}
.chart .mk{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 10px #fff;transition:left .55s var(--ease);z-index:2;}
.chart .mk.alt{background:#9aa0b8;box-shadow:0 0 0 1px rgba(0,0,0,.6);opacity:.8;}
.tick{min-height:2.45em;margin-top:6px;font-family:var(--display);font-weight:400;font-size:1rem;line-height:1.22;color:var(--amber);letter-spacing:.01em;
  text-shadow:0 0 10px rgba(255,184,74,.45);display:flex;align-items:center;}
.tick span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tick.new span{animation:rise .35s var(--ease);}

/* Manager moves */
.mv{flex:none;display:flex;flex-direction:column;gap:6px;}
.mvr{display:flex;gap:5px;align-items:center;min-height:40px;}
.mvr .who{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#16102e;font-weight:900;font-size:.8rem;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);}
.mvb{flex:1 1 0;min-width:0;min-height:40px;border:0;border-radius:12px;padding:0 3px;background:rgba(255,255,255,.09);color:var(--text);font-weight:800;font-size:.8rem;line-height:1.05;
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .08s, background .15s;}
.mvb:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.mvb:disabled{opacity:.32;}
.mvb.on{background:var(--amber);color:#2b1a00;}
.mvb b{display:inline-grid;place-items:center;min-width:17px;height:17px;margin-left:3px;padding:0 4px;border-radius:9px;background:var(--amber);color:#2b1a00;font-size:.68rem;}
.mvr .cpu{flex:1;min-width:0;display:flex;align-items:center;gap:6px;color:var(--text-3);font-weight:800;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mvr .cpu .ico{width:18px;height:18px;flex:none;}
.go{flex:none;min-height:56px;font-family:var(--display);font-weight:400;font-size:1.45rem;letter-spacing:.03em;}

/* ── Lineup card (team entry) ─────────────────────────────────────────── */
.rs{display:flex;flex-direction:column;gap:14px;padding:4px 0 24px;}
.rs-head{text-align:center;padding:6px 0 0;}
.rs-head .k{font-size:.74rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);}
.rs-head h1{font-family:var(--display);font-weight:400;font-size:2.2rem;line-height:1.05;margin-top:2px;}
.rs-tip{font-size:.92rem;color:var(--text-2);line-height:1.45;background:rgba(255,255,255,.05);border-radius:var(--r);padding:10px 14px;}
.rs-tip b{color:var(--text);}
.lc{border-radius:5px 5px 12px 12px;padding:8px 0 4px;background:linear-gradient(180deg,#fffaf0,#f4ead2);color:#2a2a3a;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 14px 30px rgba(0,0,0,.45);}
.lc h3{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 14px 6px;border-bottom:3px double var(--seam);}
.lc h3 span{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--seam);letter-spacing:.03em;}
.lc h3 small{font-family:var(--hand);font-size:1rem;color:#6a6a80;font-weight:400;text-align:right;}
.lr{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;padding:3px 12px 3px 8px;border:0;border-bottom:1px solid rgba(60,80,160,.16);background:none;color:inherit;text-align:left;cursor:pointer;}
.lr:last-child{border-bottom:0;}
.lr:active{background:rgba(255,220,60,.2);}
.lr .n{flex:none;display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:50%;background:none;font-family:var(--display);font-size:1.1rem;color:var(--seam);padding:0;}
.lr .n.sel{background:var(--seam);color:#fff;}
.lr .n.sel + .nmw{background:rgba(200,16,46,.08);}
.lr .nmw{flex:1;min-width:0;display:flex;flex-direction:column;}
.lr .nm{font-family:var(--hand);font-size:1.3rem;line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lr .nm.empty{color:rgba(80,80,110,.42);}
.lr .ln{font-family:var(--hand);font-size:1.02rem;line-height:1.1;color:#4a4a62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lr .ps{flex:none;display:grid;place-items:center;min-width:30px;height:24px;padding:0 5px;border-radius:12px;border:1.5px solid rgba(31,42,107,.35);font-size:.7rem;font-weight:900;color:var(--ink);}
.lr .ps.none{border-style:dashed;color:rgba(31,42,107,.35);}
.lr .tag{flex:none;font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#8a7f66;}
.lr .chev{flex:none;color:rgba(31,42,107,.35);}
.lr .chev .ico{width:18px;height:18px;}
.lr.ro{cursor:default;}
.tk-chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 8px;}
.tk-chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;background:rgba(31,42,107,.08);color:var(--ink);font-weight:800;font-size:.86rem;}
.tk-chip small{font-weight:700;color:#6a6a80;}
.tk-none{padding:10px 14px 8px;font-family:var(--hand);font-size:1.05rem;color:#7a7a90;}
.rs-acts{display:flex;flex-direction:column;gap:10px;}
.rs-two{display:flex;gap:8px;}
.rs-two .btn{flex:1;padding:0 10px;font-size:.92rem;}

/* ── Stat entry sheet: big keypad ─────────────────────────────────────── */
.ke-help{font-size:.88rem;color:var(--text-2);line-height:1.4;margin:0 0 10px;}
.ke-name{display:flex;gap:8px;}
.ke-pos{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.ke-pos button{flex:1 0 38px;min-height:38px;border:0;border-radius:10px;background:rgba(255,255,255,.07);color:var(--text-2);font-weight:900;font-size:.85rem;}
.ke-pos button.on{background:var(--text);color:var(--bg);}
.kf-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;margin:10px 0;}
.kf{border:2px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(0,0,0,.28);padding:5px 6px 4px;text-align:center;color:var(--text);cursor:pointer;}
.kf.on{border-color:var(--accent);background:rgba(0,0,0,.42);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent);}
.kf small{display:block;font-size:.66rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.kf small em{font-style:normal;font-weight:700;letter-spacing:0;text-transform:none;}
.kf b{display:block;font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1.2;font-variant-numeric:tabular-nums;}
.kf b i{font-style:normal;color:rgba(255,255,255,.22);}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.kp button{min-height:52px;border:0;border-radius:14px;background:var(--surface-3);color:var(--text);font-size:1.45rem;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.35);}
.kp button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.kp button.nx{background:rgba(255,255,255,.14);font-size:1rem;}
.kp button .ico{width:24px;height:24px;margin:auto;}
.ke-quick{display:flex;gap:8px;margin-top:10px;}
.ke-quick .btn{flex:1;padding:0 8px;font-size:.88rem;}
.ke-acts{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.tk-list{display:flex;flex-direction:column;gap:8px;}
.tk-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:rgba(255,255,255,.06);}
.tk-row .tx{flex:1;min-width:0;}
.tk-row .tx b{display:block;font-weight:900;}
.tk-row .tx small{display:block;color:var(--text-2);font-size:.84rem;line-height:1.3;}
.tk-row .tx em{font-style:normal;color:var(--amber);font-weight:900;}
.tk-row .stepper button{width:38px;height:38px;}
.tk-row .btn{flex:none;}

/* Box score sheet */
.bx h4{margin:14px 0 6px;font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--text-2));}
.bx-scroll{overflow-x:auto;}
.bx table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;}
.bx th,.bx td{padding:5px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap;}
.bx th{color:var(--text-3);font-weight:900;font-size:.72rem;}
.bx td:first-child,.bx th:first-child{text-align:left;max-width:140px;overflow:hidden;text-overflow:ellipsis;}
.bx td{color:var(--text-2);font-weight:700;}
.bx td:first-child{color:var(--text);font-weight:800;}
.bx tr.out td{opacity:.55;}
.bx tr.tot td{color:var(--text);font-weight:900;border-top:2px solid rgba(255,255,255,.15);}
.pbp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.pbp li{display:flex;gap:8px;font-size:.88rem;color:var(--text-2);line-height:1.35;}
.pbp li small{flex:none;width:44px;color:var(--text-3);font-weight:900;font-size:.72rem;padding-top:2px;}
.pbp li.run{color:var(--text);font-weight:700;}
.bx-ls{margin-top:4px;}

/* Rules sheet table */
.rules table.bp{width:100%;border-collapse:collapse;margin:8px 0;font-size:.9rem;}
.rules table.bp th,.rules table.bp td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:top;color:var(--text-2);line-height:1.35;}
.rules table.bp th{color:var(--text);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;}
.rules table.bp td b{color:var(--text);}

/* ── Home Run Derby ───────────────────────────────────────────────────── */
.dz{flex:none;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;}
.dz .tm{border-radius:8px;background:var(--plate);box-shadow:inset 0 1px 3px rgba(0,0,0,.8);padding:3px 4px 4px;text-align:center;min-width:0;}
.dz .tm.on{box-shadow:inset 0 0 0 2px var(--c),0 0 12px color-mix(in srgb,var(--c) 50%,transparent);}
.dz .tm small{display:block;font-size:.66rem;font-weight:900;color:rgba(251,243,220,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dz .tm small i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:4px;vertical-align:1px;}
.dz .tm b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1;color:var(--cream);}
.dz .tm.lead b{color:var(--amber);}
.mu.dslug{display:block;}
.dslug .bc{display:block;width:100%;transform:none;cursor:default;}
.balls{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.balls i{width:13px;height:13px;border-radius:50%;background:#fffdf4;box-shadow:inset 0 0 0 1.5px rgba(200,16,46,.55);}
.balls i.used{background:#c8102e;box-shadow:none;opacity:.85;}
.balls i.bonus{box-shadow:inset 0 0 0 2px #e2a400;}

/* iPad portrait and up: bigger type and controls */
@media (min-width:700px){
  .stage.sl-on{max-width:720px;}
  .sl{gap:10px;}
  .ls td{height:32px;line-height:32px;font-size:1.35rem;}
  .ls td.tm{font-size:1rem;}
  .ls th{font-size:.7rem;height:16px;}
  .bc{padding:9px 12px 9px 13px;}
  .bc .nm{font-size:1.5rem;padding-right:32px;}
  .bc .st{font-size:1.3rem;}
  .bc .td{font-size:.82rem;}
  .bc .rl{font-size:.66rem;}
  .bc .ps{width:28px;height:28px;font-size:.72rem;right:8px;top:8px;}
  .mu{grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr);}
  .chart{height:26px;} .chart .sg{font-size:.7rem;}
  .tick{font-size:1.3rem;}
  .mvb{min-height:50px;font-size:.98rem;border-radius:14px;}
  .mvr{gap:8px;}
  .mvr .who{width:38px;height:38px;font-size:.95rem;}
  .go{min-height:64px;font-size:1.7rem;}
  .dtray .die{--ds:36px;padding:5px;}
  .inn,.outs{font-size:.9rem;} .outs i{width:13px;height:13px;}
  .dz .tm b{font-size:2.1rem;} .dz .tm small{font-size:.8rem;}
  .balls i{width:17px;height:17px;}
  .rs{max-width:620px;margin:0 auto;width:100%;}
}
/* iPad landscape: ballpark on the left, scoreboard and controls on the right */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  .stage.sl-on{max-width:1240px;}

    '<h3>How an at-bat works</h3><p>The <b>swing chart</b> shows this hitter’s chances against this pitcher: strikeout, out, walk, single, double, triple, home run. Better hitters get bigger hit zones; better pitchers shrink them. Tap <b>Pitch!</b> and three dice pick a spot on the chart: low rolls favor the pitcher, high rolls the hitter. The app moves the runners, keeps score and calls the play: double plays, sacrifice flies, errors and all.</p>' +
    '<h3>Manager moves</h3><ul>' +

    '<h3>Winning</h3><p>Play 3, 6 or 9 innings. A coin flip decides who bats last (the home team). Tied after the last inning? Extra innings. If the home team takes the lead in its last turn at bat, it’s a walk-off win!</p>' +
    '<h3>Home Run Derby</h3><p>A 5-minute slugfest that needs only the HR number. Each manager picks 3 to 5 sluggers from their cards. Each slugger swings until he makes his outs (any swing that isn’t a home run is an out). More HR on the back means more power. A 450-foot <b>moonshot</b> earns a bonus swing (up to 3 per slugger). Most home runs wins; a tie goes to a swing-off.</p>' +
    '<h3>Oops?</h3><p><b>Undo</b> in the menu takes back your last move. The dice are fair: undoing a pitch and pitching again rolls the same dice, so a Challenge card is the only way to re-roll.</p>';

  // ── Small helpers ─────────────────────────────────────────────────────────

  // Batting order: table-setter first, best hitters 2-3-4, slugger cleanup

  // The computer manager

      for (var i = 0; i < lim; i++) balls.appendChild(el('i', { class: (i < S.d.outs ? 'used' : '') + (i >= lim - S.d.bonus ? ' bonus' : '') }));
      var today = S.d.off ? s.off : s.hr;
      V.mu.appendChild(el('div', { class: 'bc b', style: { '--tc': S.teams[cur.t].color } }, [
        el('span', { class: 'rl', text: S.teams[cur.t].name + (S.d.off ? ' · swing-off' : '') }),
        el('span', { class: 'nm', text: nm(cur.id) }),
        el('span', { class: 'st', text: (p.hr || 0) + ' HR on the back · ' + today + ' today' + (s.long ? ' · long ' + s.long + ' ft' : '') }),
        balls
      ]));
    }
    paintTick();
    V.go.disabled = busy || !cur;
    V.go.textContent = busy ? '…' : 'Swing!';
  }
  function swing() {
    if (busy || !S || S.phase !== 'derby') return;
    var cur = dSlug(); if (!cur) return;
    snapshot();
    var r = ENG.rng(S.seed), p = S.P[cur.id], pw = Math.min(60, p.hr || 0) / 60, s = dst(cur.id);
    var hr = r() < .1 + .32 * pw, a = Math.round((r() * 2 - 1) * 40), ft, kind, text, nmz = nm(cur.id);
    s.sw++;
    if (hr) {
      ft = Math.round(fenceFt(a) + 3 + Math.pow(r(), 1.5) * (35 + 75 * pw)); kind = 'hr';
      if (S.d.off) s.off++; else s.hr++;
      s.long = Math.max(s.long, ft);
      var gotBonus = false;
      if (ft >= 450) { s.moon++; if (S.d.bonus < 3) { S.d.bonus++; gotBonus = true; } }
      text = ft >= 450 ? 'MOONSHOT! ' + nmz + ' hits it ' + ft + ' feet!' + (gotBonus ? ' Bonus swing!' : '') : oneOf(['Gone! ' + ft + ' feet to ' + fieldName(a) + '!', nmz + ' launches one ' + ft + ' feet!', 'See ya! ' + ft + ' feet!', 'Way back... gone! ' + ft + ' feet.']);
    } else {
      var x = r();
      S.d.outs++;
      if (x < .2) { kind = 'none'; ft = 0; text = oneOf(['Swing and a miss!', 'Fouled straight back.', 'Just under it. Foul ball.']); }
      else if (x < .42) { kind = 'gb'; ft = 90 + Math.round(r() * 30); text = oneOf(['A grounder. That’s an out.', 'Topped it. Out.']); }
      else if (x < .62) { kind = 'pu'; ft = 60 + Math.round(r() * 80); text = oneOf(['Popped up. Out.', 'Got under that one. Out.']); }
      else if (x < .82) { kind = 'ld'; ft = 170 + Math.round(r() * 80); text = oneOf(['A line drive single, but singles don’t count!', 'Hard liner, but it stays in the park.']); }
      else { kind = 'fly'; ft = Math.round(fenceFt(a) - 4 - r() * 14); text = oneOf(['Deep... caught at the wall! So close!', 'Warning track... just short!']); }
      text += ' ' + (S.d.outs >= (S.d.off ? 3 : S.outsPer) + S.d.bonus ? 'That’s the last out.' : 'Out ' + S.d.outs + '.');
    }
    S.seed = r.seed();
    S.tick = text;
    var done = S.d.outs >= (S.d.off ? 3 : S.outsPer) + S.d.bonus;
    var fl = { a: a, ft: ft, kind: kind };
    busy = true; paintDerby();
    var after = function () {
      busy = false;
      if (done) nextSlugger();
      save(); paintDerby(); paintTick(true);
    };
    if (kind === 'none') { SND.mitt(); splash('Strike!'); T(after, 500); }
    else {
      SND.crack(hr);
      if (hr) SND.roar(ft >= 450 ? 1 : .35 + (ft - 360) / 220, ft >= 450 ? 3.5 : 2.4);
      var tok = animTok;
      flyBall(fl).then(function () {
        if (tok !== animTok) return;
        if (hr) { Kit.haptic('heavy'); if (ft >= 450) { Kit.callout('MOONSHOT!'); Kit.confetti({ count: 90 }); } else Kit.callout(ft + ' ft!'); }
        else if (kind === 'fly') SND.ooh();
        T(after, hr ? 700 : 350);
      });
    }
    S.tick = text; paintTick(true);
    save();
  }
  function nextSlugger() {
    var cur = dSlug(), s = dst(cur.id), name = nm(cur.id), got = S.d.off ? s.off : s.hr;
    S.d.outs = 0; S.d.bonus = 0;
    if (S.d.off) {
      S.d.off.i++;
      if (S.d.off.i >= S.d.off.order.length) return endSwingOff();
      S.tick = name + ' hit ' + got + ' in the swing-off. Next: ' + nm(dSlug().id) + '.';
      return;
    }
    S.d.oi++;
    if (S.d.oi >= S.d.order.length) return derbyOver();
    S.tick = name + ' finishes with ' + got + ' home run' + (got === 1 ? '' : 's') + '. Next up: ' + nm(dSlug().id) + '!';
    Kit.sfx('deal');
  }
  function derbyOver() {
    var tots = S.teams.map(function (T, i) { return dTotal(i); }), best = Math.max.apply(null, tots);
    var tied = tots.map(function (v, i) { return v === best ? i : -1; }).filter(function (i) { return i >= 0; });
    if (S.teams.length > 1 && tied.length > 1) {
      // Swing-off: each tied manager's best slugger today gets 3 outs
      var order = tied.map(function (t) {
        var ids = S.teams[t].slug.slice().sort(function (a, b) { return (dst(b).hr - dst(a).hr) || ((S.P[b].hr || 0) - (S.P[a].hr || 0)); });
        return [t, S.teams[t].slug.indexOf(ids[0])];
      });
      tied.forEach(function (t) { S.teams[t].slug.forEach(function (id) { dst(id).off = 0; }); });
      S.d.off = { order: order, i: 0, teams: tied, round: (S.d.off ? S.d.off.round : 0) + 1 };
      S.tick = 'A tie at ' + best + '! Swing-off: each team’s best slugger gets 3 outs.';
      Kit.callout('Swing-off!');
      return;
    }
    finishDerby();
  }
  function endSwingOff() {
    var tied = S.d.off.teams, sc = tied.map(dOffTotal), best = Math.max.apply(null, sc);
    var still = tied.filter(function (t, i) { return sc[i] === best; });
    if (still.length > 1) {
      S.d.off.order = still.map(function (t) { var o = S.d.off.order.filter(function (x) { return x[0] === t; })[0]; return o; });
      S.d.off.teams = still; S.d.off.i = 0; S.d.off.round++;
      still.forEach(function (t) { S.teams[t].slug.forEach(function (id) { dst(id).off = 0; }); });
      S.tick = 'Still tied! Another swing-off round.';
      return;
    }
    S.d.offWin = still[0];
    finishDerby();
  }
  function finishDerby() {
    busy = false; clearTimers();
    var tots = S.teams.map(function (T, i) { return dTotal(i); });
    var win = S.d.offWin != null ? S.d.offWin : tots.indexOf(Math.max.apply(null, tots));
    var hl = [], all = [];
    S.teams.forEach(function (Tm, t) { Tm.slug.forEach(function (id) { all.push({ id: id, t: t, s: dst(id) }); }); });
    var lg = all.slice().sort(function (a, b) { return b.s.long - a.s.long; })[0];
    if (lg && lg.s.long) hl.push('Longest home run: ' + nm(lg.id) + ', ' + lg.s.long + ' feet');
    var top = all.slice().sort(function (a, b) { return b.s.hr - a.s.hr; })[0];
    if (top && top.s.hr) hl.push(nm(top.id) + ' hit ' + top.s.hr + ' home run' + (top.s.hr > 1 ? 's' : '') + ' (' + (S.P[top.id].hr || 0) + ' on the back of his card)');
    all.forEach(function (x) { if (x.s.moon) hl.push(nm(x.id) + ' launched ' + (x.s.moon > 1 ? x.s.moon + ' moonshots' : 'a moonshot') + ' of 450+ feet'); });
    if (S.d.offWin != null) hl.push(S.teams[win].name + ' won it in a swing-off');
    var zero = all.filter(function (x) { return x.s.hr === 0 && (S.P[x.id].hr || 0) >= 30; })[0];
    if (zero) hl.push(nm(zero.id) + ' had ' + S.P[zero.id].hr + ' homers on his card but none today');
    Kit.record(HKEY, {
      started: S.started, mode: 'Home Run Derby',
      players: S.teams.map(function (T, i) { return { name: T.name, score: tots[i], cpu: false }; }),
      winner: S.teams.length > 1 ? S.teams[win].name : S.teams[0].name,
      rounds: { labels: S.teams[0].slug.map(function (x, i) { return 'Slugger ' + (i + 1); }), scores: S.teams[0].slug.map(function (x, i) { return S.teams.map(function (T) { var id = T.slug[i]; return S.d.st[id] ? S.d.st[id].hr : 0; }); }) },
      highlights: hl.slice(0, 6), summary: S.teams.length === 1 ? S.teams[0].name + ': ' + tots[0] + ' home runs' : null
    });
    var ps = S; S.phase = 'done'; clearSave();
    Kit.win({
      icon: 'trophy',
      title: S.teams.length === 1 ? tots[0] + ' home run' + (tots[0] === 1 ? '' : 's') + '!' : S.teams[win].name + ' wins the Derby!',
      sub: hl[0] || '',
      rank: S.teams.length > 1 ? S.teams.map(function (T, i) { return { name: T.name, score: tots[i], color: T.color, i: i }; }).sort(function (a, b) { return b.score - a.score || (a.i === win ? -1 : 1); }) : null,
      again: function () { S = ps; S.started = Date.now(); Kit.gameStart(); startDerby(); },
      againLabel: 'Derby again, same sluggers',
      extra: [{ label: 'New game', onClick: showSetup }]
    });
  }
  function openDerbyBox() {
    if (!S || !S.d) return;
    var node = el('div', { class: 'bx' });
    S.teams.forEach(function (Tm, t) {
      node.appendChild(el('h4', { style: { '--c': Tm.color }, text: Tm.name + ': ' + dTotal(t) + ' HR' }));
      var tb = el('table'), hr = el('tr');
      ['Slugger', 'Card HR', 'HR', 'Outs', 'Longest'].forEach(function (h) { hr.appendChild(el('th', { text: h })); });
      tb.appendChild(hr);
      Tm.slug.forEach(function (id) { var s = dst(id), tr = el('tr', null, [el('td', { text: nm(id) })]); [S.P[id].hr || 0, s.hr, s.sw - s.hr, s.long ? s.long + ' ft' : '-'].forEach(function (x) { tr.appendChild(el('td', { text: String(x) })); }); tb.appendChild(tr); });
      node.appendChild(el('div', { class: 'bx-scroll' }, [tb]));
    });
    Kit.sheet({ title: 'Derby scoreboard', node: node, actions: [{ label: 'Close', cls: 'btn-soft' }] });
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved && saved.teams && saved.phase && saved.phase !== 'done') { S = saved; finished = false; render(); }
  else showSetup();
})();
</script>

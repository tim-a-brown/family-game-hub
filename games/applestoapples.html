<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apples to Apples</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<style>
body{overflow-x:hidden;}
.aa{max-width:980px;margin:0 auto;padding:0 10px calc(var(--safe-b) + 18px);}
.aa .scores{margin-bottom:2px;padding-top:12px;}
.aa .score{min-width:72px;position:relative;}
.aa .score .sub{display:flex;align-items:center;gap:3px;white-space:nowrap;}
.aa .score .sub .ico{width:12px;height:12px;}
.aa .score.judge{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);}
.aa .score.judge .nm{color:var(--c);}
.aa .score.gone{opacity:.4;}
.aa .score.ghost{--c:#9aa3b8;border-style:dashed;border-color:var(--w14);}
.aa .score .pt{display:flex;align-items:center;gap:5px;}
.aa .score .pt i{display:inline-block;width:11px;height:15px;border-radius:2.5px;background:var(--pc,#2f9b44);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),0 1px 2px rgba(0,0,0,.3);}
.aa .score .ok{color:var(--green);}
html[data-theme="light"] .aa .score.judge .nm,html[data-theme="parchment"] .aa .score.judge .nm{color:color-mix(in srgb,var(--c) 45%,var(--text));}

/* The table */
.tbl{border-radius:24px;padding:8px;margin-top:2px;}
.tbl .felt-in{position:relative;border-radius:18px;padding:12px 10px 16px;overflow:hidden;}
.st{display:flex;align-items:center;gap:8px;margin:0 2px 12px;min-height:30px;}
.st .msg{flex:1;min-width:0;font-weight:900;font-size:1rem;line-height:1.25;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);}
.st .msg b{color:var(--c,#ffe08a);}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:999px;background:rgba(0,0,0,.28);color:rgba(255,255,255,.88);font-size:.74rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;flex:none;}
.tag .ico{width:13px;height:13px;}
.mid{display:flex;justify-content:center;align-items:flex-start;gap:14px;--cw:132px;}
.deck{position:relative;flex:none;width:var(--cw);height:calc(var(--cw) * 1.4);border:0;padding:0;background:none;border-radius:calc(var(--cw) * .08);}
.deck .ac{position:absolute;left:0;top:0;}
.deck .ac:nth-child(1){transform:translate(4px,5px) rotate(2deg);}
.deck .ac:nth-child(2){transform:translate(2px,2px) rotate(-1deg);}
.deck.go{cursor:pointer;}
.deck.go::after{content:"";position:absolute;inset:-6px;border-radius:calc(var(--cw) * .12);box-shadow:0 0 0 3px #ffd447,0 0 26px rgba(255,212,71,.6);animation:glow 1.4s ease-in-out infinite;pointer-events:none;}
@keyframes glow{50%{opacity:.35;}}
.deck .cnt{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:.7rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6);white-space:nowrap;}
.pr-slot{flex:none;display:flex;gap:10px;}
.pr-empty{width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);display:grid;place-items:center;color:rgba(255,255,255,.4);font-weight:800;font-size:.8rem;text-align:center;padding:10px;}
.sent{margin:14px auto 0;max-width:560px;padding:12px 14px;border-radius:14px;background:#111;color:#fff;font:700 1.02rem/1.3 "Helvetica Neue",Helvetica,Arial,sans-serif;box-shadow:0 8px 18px rgba(0,0,0,.4);white-space:pre-line;animation:rise .4s var(--ease) both;}
.sent b{color:#111;background:#fff;padding:0 4px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.plays{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:12px 10px;margin-top:18px;--cw:112px;min-height:calc(var(--cw) * 1.4 + 22px);}
.plays.crowd{--cw:96px;gap:10px 8px;}
.plays .none{align-self:center;color:rgba(255,255,255,.55);font-weight:800;font-size:.9rem;text-align:center;max-width:280px;}
.sub{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;padding:0;background:none;color:inherit;border-radius:14px;-webkit-tap-highlight-color:transparent;}
.sub .cards{display:flex;}
.sub .cards .ac + .ac{margin-left:calc(var(--cw) * -.3);transform:rotate(4deg) translateY(6px);}
.sub.tap{cursor:pointer;}
.sub.tap:active .ac{transform:scale(.97);}
.sub.sel .ac .fa{box-shadow:0 0 0 4px #ffd447,0 10px 22px rgba(0,0,0,.45);}
.sub.sel{transform:translateY(-6px);transition:transform .2s var(--spring);}
.sub.win .ac .fa{box-shadow:0 0 0 4px #ffd447,0 0 34px rgba(255,212,71,.7),0 12px 24px rgba(0,0,0,.45);}
.sub.win{animation:bounce .7s var(--spring) .1s;z-index:2;}
.sub.lose{filter:saturate(.55) brightness(.75);}
.who{display:inline-flex;align-items:center;gap:5px;max-width:calc(var(--cw) + 20px);height:22px;padding:0 8px 0 3px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff;font-size:.74rem;font-weight:900;white-space:nowrap;overflow:hidden;}
.who .dot{flex:none;width:16px;height:16px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#14102a;font-size:.6rem;}
.who .dot .ico{width:11px;height:11px;}
.who span{overflow:hidden;text-overflow:ellipsis;}
.sub.win .who{background:#ffd447;color:#2b1a00;}
.why{position:relative;margin:16px auto 0;max-width:460px;padding:10px 14px;border-radius:16px;background:#fffdf6;color:#2a2440;font-weight:700;font-size:.95rem;line-height:1.3;box-shadow:0 8px 18px rgba(0,0,0,.35);animation:rise .4s var(--ease) .2s both;}
.why::before{content:"";position:absolute;left:28px;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fffdf6;}
.why b{color:#7a1730;}
.think{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle;}
.think i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s;}.think i:nth-child(3){animation-delay:.3s;}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* The hand, on its own wooden rail */
.rail{position:relative;margin-top:10px;border-radius:22px;padding:0 0 4px;}
.rail::after{content:"";position:absolute;left:12px;right:12px;bottom:9px;height:3px;border-radius:2px;background:rgba(0,0,0,.4);box-shadow:0 1px 0 rgba(255,255,255,.16),0 -6px 10px rgba(0,0,0,.25);pointer-events:none;z-index:1;}
.rail .hd{display:flex;align-items:center;gap:8px;min-height:42px;padding:6px 10px 0 14px;color:#fff;font-weight:900;font-size:.85rem;}
.rail .hd > span:first-child{flex:1;min-width:0;}
.rail .hd .btn{flex:none;min-width:120px;}
.rail .hd span{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.rail .hd span:last-child{flex:none;}
/* The hand: a fan of cards, held like a real hand (laid out by handFlow). touch-action:none so sliding a finger
   across it reads the cards instead of scrolling the page. */
.hand{position:relative;--cw:128px;margin:0 4px 6px;clip-path:inset(-600px -600px 0 -600px);touch-action:none;-webkit-user-select:none;user-select:none;outline:none;-webkit-tap-highlight-color:transparent;}
.hc{position:absolute;left:50%;top:var(--ht,30px);width:var(--cw);height:calc(var(--cw) * 1.4);margin-left:calc(var(--cw) * -.5);cursor:pointer;
  transition:transform .26s cubic-bezier(.2,.85,.3,1.08),filter .2s;}
.hc.now{transition:filter .2s;}
.hc.sel .ac .fa{box-shadow:0 0 0 4px #ffd447,0 0 18px rgba(255,212,71,.4),0 10px 20px rgba(0,0,0,.45);}
.hc.up{filter:drop-shadow(0 14px 14px rgba(0,0,0,.45));}
.hc.grab{filter:drop-shadow(0 26px 24px rgba(0,0,0,.6));cursor:grabbing;}
.hc.dealing{visibility:hidden;}
.hc.flyin{position:fixed;margin:0;z-index:70;pointer-events:none;transition:transform .45s cubic-bezier(.2,.85,.3,1.05),opacity .3s;}
.hand.off .ac .fa{filter:saturate(.75) brightness(.86);}
.hand.off .hc.up .ac .fa{filter:none;}
.hand .ac .num{position:absolute;left:50%;top:-13px;margin-left:-13px;z-index:3;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#ffd447;color:#2b1a00;font-weight:900;font-size:.85rem;box-shadow:0 2px 6px rgba(0,0,0,.4);}

/* Buttons under the table */
.acts{display:flex;gap:10px;margin-top:12px;}
.acts .btn{flex:1;}
.hint{text-align:center;color:var(--text-3);font-size:.85rem;font-weight:700;margin-top:8px;}

/* ── Cards ─────────────────────────────────────────────────────────── */
.ac{position:relative;flex:none;width:var(--cw);height:calc(var(--cw) * 1.4);perspective:900px;border-radius:calc(var(--cw) * .08);-webkit-user-select:none;user-select:none;}
.ac-in{position:absolute;inset:0;border-radius:inherit;transform-style:preserve-3d;transition:transform .6s var(--ease);}
.ac.down .ac-in{transform:rotateY(180deg);}
.ac .fa,.ac .bk{position:absolute;inset:0;border-radius:inherit;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;}
.ac .bk{transform:rotateY(180deg);}
.ac .fa{display:flex;flex-direction:column;padding:calc(var(--cw) * .1) calc(var(--cw) * .09);box-shadow:0 2px 0 rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.35);}
/* Apples: red nouns, green adjectives */
.ac.kr .fa{color:#fff;background:radial-gradient(130% 70% at 25% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(170deg,#e0283f 0%,#b80f2a 55%,#8e0a20 100%);
  box-shadow:inset 0 0 0 calc(var(--cw) * .028) #fff4e8,inset 0 0 0 calc(var(--cw) * .045) rgba(0,0,0,.12),0 2px 0 rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.35);}
.ac.kg .fa{color:#fff;background:radial-gradient(130% 70% at 25% 0%,rgba(255,255,255,.2),transparent 55%),linear-gradient(170deg,#2f9a44 0%,#1d7a32 55%,#125a23 100%);
  box-shadow:inset 0 0 0 calc(var(--cw) * .028) #f4fff0,inset 0 0 0 calc(var(--cw) * .045) rgba(0,0,0,.12),0 2px 0 rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.35);}
.ac .nm{font-family:var(--display);font-weight:400;font-size:calc(var(--cw) * .145);line-height:1.04;letter-spacing:.005em;overflow-wrap:anywhere;text-wrap:balance;text-shadow:0 1px 0 rgba(0,0,0,.25);}
.ac .nm.lg{font-size:calc(var(--cw) * .125);}
.ac .nm.xl{font-size:calc(var(--cw) * .108);}
.ac .rl{flex:none;height:calc(var(--cw) * .014);min-height:1px;margin:calc(var(--cw) * .055) 0;border-radius:1px;background:rgba(255,255,255,.55);}
.ac .ds{font:italic 600 calc(var(--cw) * .084)/1.25 Georgia,"Times New Roman",serif;color:rgba(255,255,255,.94);overflow:hidden;}
.ac.kg .ds{font-style:normal;font-family:var(--font);font-weight:800;}
.ac .mk{position:absolute;right:8%;bottom:6%;width:17%;opacity:.42;color:#fff;}
.ac .mk svg{width:100%;height:auto;display:block;}
.ac.kg .tp{font-size:calc(var(--cw) * .068);font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-bottom:calc(var(--cw) * .03);}
.sm .ac .ds{display:none;}
/* Backs */
.ac.kr .bk,.ac.kg .bk{display:grid;place-items:center;box-shadow:inset 0 0 0 calc(var(--cw) * .03) #fff4e8,0 2px 0 rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.35);}
.ac.kr .bk{background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.16) 0 22%,transparent 23%),repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 3px,transparent 3px 9px),linear-gradient(160deg,#d42139,#8e0a20);}
.ac.kg .bk{background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.16) 0 22%,transparent 23%),repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 3px,transparent 3px 9px),linear-gradient(160deg,#2f9a44,#125a23);}
.ac .bk .ap{width:34%;color:#fff;opacity:.92;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));}
.ac .bk .ap svg{width:100%;height:auto;display:block;}
/* The grown-up deck: plain black and white */
.ac.kw .fa{background:#fff;color:#111;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 2px 0 rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.35);}
.ac.kb .fa{background:#121212;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 2px 0 rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.4);}
.ac .tx{font:700 calc(var(--cw) * var(--fs,.1))/1.18 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.01em;white-space:pre-line;overflow-wrap:anywhere;overflow:hidden;}
.ac .tx .bl{display:inline-block;min-width:2.6em;border-bottom:.11em solid currentColor;vertical-align:baseline;}
.ac .ft{margin-top:auto;display:flex;align-items:center;gap:calc(var(--cw) * .03);font:700 calc(var(--cw) * .052)/1 "Helvetica Neue",Helvetica,Arial,sans-serif;opacity:.85;padding-top:4px;}
.ac .ft i{display:inline-block;width:calc(var(--cw) * .06);height:calc(var(--cw) * .08);border:1px solid currentColor;border-radius:1.5px;transform:rotate(-12deg);}
.ac .ft i + i{margin-left:calc(var(--cw) * -.04);transform:rotate(0);background:currentColor;}
.ac .ft i + i + i{transform:rotate(12deg);background:none;}
.ac .pk{position:absolute;right:8%;bottom:6%;display:flex;align-items:center;gap:4px;font:900 calc(var(--cw) * .06)/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.06em;}
.ac .pk b{display:grid;place-items:center;width:calc(var(--cw) * .13);height:calc(var(--cw) * .13);border-radius:50%;background:#fff;color:#111;}
.ac.kw .bk,.ac.kb .bk{padding:calc(var(--cw) * .1);font:900 calc(var(--cw) * .14)/1.02 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.02em;}
.ac.kw .bk{background:#fff;color:#111;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.35);}
.ac.kb .bk{background:#121212;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 8px 16px rgba(0,0,0,.4);}
/* Motion */
@keyframes dealIn{from{transform:translate(-30px,-160px) rotate(-16deg) scale(.7);opacity:0;}}
.ac.dealt{animation:dealIn .55s var(--spring) both;animation-delay:var(--dl,0s);}
@keyframes drop{from{transform:translate(var(--dx,0px),-90px) rotate(10deg) scale(.75);opacity:0;}}
.ac.drop{animation:drop .5s var(--spring) both;animation-delay:var(--dl,0s);}
@keyframes flipIn{0%{transform:translateX(calc(var(--cw) * -1.1)) rotateY(180deg);}100%{transform:none;}}
.ac.flipin .ac-in{animation:flipIn .75s var(--ease) both;}
.ac.lift .ac-in{animation:liftIt .5s var(--spring);}
@keyframes liftIt{40%{transform:translateY(-14px) scale(1.04);}}
.fly{position:fixed;z-index:70;margin:0;pointer-events:none;transition:transform .5s cubic-bezier(.5,0,.25,1),opacity .5s;}
.mid .ac.win-pr{animation:bounce .6s var(--spring);}

/* Over */
.sum{display:flex;flex-direction:column;gap:8px;}
.sum h3{font-family:var(--display);font-weight:400;font-size:1.6rem;color:#ffe08a;text-align:center;margin:4px 0 2px;}
.sum .rd{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.25);color:#fff;font-weight:800;font-size:.88rem;line-height:1.25;}
.sum .rd .t{flex:1;min-width:0;}
.sum .rd .t s{text-decoration:none;color:rgba(255,255,255,.6);font-weight:700;}
.sum .rd .n{flex:none;font-family:var(--display);color:#ffe08a;}
.sum .rd .pc{flex:none;width:12px;height:16px;border-radius:3px;background:var(--pc);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75);}

/* Setup: packs, house rules and the hidden deck */
.a-sec{display:flex;flex-direction:column;gap:8px;}
.a-sec .label{display:flex;align-items:center;gap:8px;margin:0;}
.a-sec .label .n{margin-left:auto;font-weight:800;letter-spacing:0;text-transform:none;color:var(--text-3);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips .chip{min-height:40px;max-width:100%;}
.chips .chip span{overflow:hidden;text-overflow:ellipsis;}
.chips .chip .ico{width:16px;height:16px;}
.chips .chip.on{background:var(--accent);color:var(--accent-ink);}
.chips .chip .n{opacity:.7;font-size:.78rem;}
.rnote{margin:2px 2px 0;color:var(--text-2);font-size:.86rem;line-height:1.4;}
.rnote b{color:var(--text);}
.more{border-radius:14px;background:var(--w04);}
.more summary{cursor:pointer;list-style:none;padding:10px 12px;font-weight:800;font-size:.9rem;color:var(--text-2);display:flex;align-items:center;gap:6px;}
.more summary::-webkit-details-marker{display:none;}
.more summary .ico{width:16px;height:16px;transition:transform .2s;}
.more[open] summary .ico{transform:rotate(180deg);}
.more .chips{padding:0 10px 12px;}
.cah-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:#141414;color:#fff;cursor:pointer;border:0;width:100%;text-align:left;font:inherit;}
.cah-row .grow b{display:block;font:900 1.02rem/1.15 "Helvetica Neue",Helvetica,Arial,sans-serif;}
.cah-row .grow small{display:block;color:rgba(255,255,255,.7);font-size:.8rem;font-weight:700;margin-top:2px;}
.cah-row .sw{flex:none;position:relative;width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.22);transition:background .2s;}
.cah-row .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s var(--spring);}
.cah-row[aria-checked="true"] .sw{background:#3ddc84;}
.cah-row[aria-checked="true"] .sw::after{transform:translateX(20px);}
.cah-hide{align-self:flex-start;border:0;background:none;color:var(--text-3);font-weight:800;font-size:.8rem;padding:4px 2px;cursor:pointer;text-decoration:underline;}
.k-hero-ic{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50vh;color:var(--text-2);font-weight:800;}

/* ── Polish: state shown on the table, motion between phases ─────────── */
.aa .score .crown{position:absolute;top:-9px;right:-5px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#ffd447;color:#4a3000;box-shadow:0 2px 6px rgba(0,0,0,.35);animation:crownIn .5s var(--spring);}
.aa .score .crown .ico{width:15px;height:15px;}
@keyframes crownIn{from{transform:translateY(-10px) rotate(-30deg) scale(.4);opacity:0;}}
.aa .score{transition:transform .3s var(--spring),border-color .2s,background .2s;}
.aa .score.judge{transform:translateY(-2px);}
.aa .score.done .sub{color:var(--green);}
.aa .score .think{color:var(--text-3);margin:0;}
.aa .score .pt.bump{animation:bump .7s var(--spring) .9s both;}
@keyframes bump{0%{transform:none;}35%{transform:scale(1.45);color:var(--yellow);}100%{transform:none;}}
.bar{padding:12px 4px 4px;display:flex;}
.bar .btn{flex:1;}
.rail .bar{padding:2px 12px 10px;}
.btn.ready{animation:ready 1.6s ease-in-out infinite;}
@keyframes ready{50%{box-shadow:0 5px 0 var(--b-lip),0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent);}}
.rail.live{box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px color-mix(in srgb,#ffd447 55%,transparent),0 14px 30px rgba(0,0,0,.45);}
.rail .hd .xtra{flex:none;padding:2px 8px;border-radius:999px;background:#ffd447;color:#2b1a00;opacity:1;font-size:.75rem;}
.ac.flipin .ac-in{animation:flipIn .8s var(--ease) both;animation-delay:var(--d,0s);}
@keyframes flipIn{0%{transform:translateX(calc(var(--cw) * -1.12)) rotateY(180deg) scale(.96);}55%{transform:translateX(calc(var(--cw) * -.2)) rotateY(40deg) scale(1.06);}100%{transform:none;}}
.mid .prc:not(.flipin){animation:bob 4.5s ease-in-out infinite;}
.mid .prc:nth-child(2){animation-delay:-2s;}
@keyframes bob{50%{transform:translateY(-3px) rotate(.6deg);}}
.deck .ac.lift{animation:liftOff .4s var(--ease) both;}
@keyframes liftOff{to{transform:translate(40px,-10px) rotate(6deg);opacity:0;}}
.pr-empty{box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);}
.pr-empty .ico{width:34px;height:34px;color:#ffd447;animation:poke 1.1s ease-in-out infinite;}
@keyframes poke{50%{transform:translateX(-8px);}}
.seat{gap:7px;}

  }
  function onStart(cfg, ch) {

      players: cfg.players.map(function (p) { return { name: p.name, color: p.color, cpu: p.cpu }; }) });
  }
  function startLocal(cfg) {

    }).then(function () {
      lastCfg = cfg; finished = false; undoStack = []; gen++; lastV = null; ui.sel = []; ui.jsel = -1; ui.round = 0; ui.ord = {};

  }

  // ═══ Online ══════════════════════════════════════════════════════════════
  // The host's device runs the game and sends each player only their own view: their hand, the table, and the
  // played cards with no names on them until the judge has picked. Guests send back their moves.
  var net = { mode: null, table: null, peer: null, roster: [], lobby: null, wait: null, nextPid: 1, view: null, myName: '', hostName: '', cfg: null, autoT: 0 };
  function meName() { var m = lsGet(NETME, {}) || {}; return m.name || rawGet('my_name') || (Kit.knownNames && Kit.knownNames()[0]) || ''; }
  function hostIdx() { if (!G) return 0; for (var i = 0; i < G.players.length; i++) if (G.players[i].pid === 0) return i; return 0; }
  function closeLobby() { if (net.lobby) { net.lobby.close(); net.lobby = null; } }
  function busy(text) { app.innerHTML = ''; app.appendChild(el('div', { class: 'ol' }, [el('div', { class: 'ol-row' }, [el('i', { class: 'ol-spin' }), el('div', { class: 'grow' }, [el('b', { text: text })])])])); }
  function goLobby() {
    leaveOnline(false); G = null; gen++; clearTimeout(botT); screen = 'lobby'; lastV = null;
    window.scrollTo(0, 0);
    net.lobby = Online.lobby(app, {
      game: KEY, title: 'Play Online', intro: 'Everyone on their own phone or tablet. Up to 24 players.',
      me: { name: meName() },
      onName: function (n) { var m = lsGet(NETME, {}) || {}; m.name = n; lsSet(NETME, m); },
      onHost: function (me) { hostTable(me.name); },
      onJoin: function (code, room, me) { joinTable(code, me.name); },
      onSolo: function () { showSetup(); }, solo: 'Back to setup',
      sub: function (r) { return r.status === 'playing' ? (r.info || 'Playing') + ' · ' + (r.n || 1) + ' playing · join in' : (r.n || 1) + (r.n === 1 ? ' player' : ' players'); },
      note: 'Each device connects straight to the host’s. If one can’t connect, try everyone on the same Wi-Fi.'
    });
  }
  function hostTable(name) {
    closeLobby(); busy('Opening your table…');
    var need = net.cfg && net.cfg.deck === 'cah' ? cahData() : a2aData();
    return need.then(function () { return a2aData(); }).then(function () { return Online.host({ game: KEY, name: name, max: 24, min: (net.cfg && net.cfg.ghost === 'on' ? 2 : 3), screen: app }); }).then(function (table) {
      table.on('fail', function (e) { Kit.toast('Couldn’t open a table. ' + Online.errText(e)); leaveOnline(false); goLobby(); });
      if (!net.cfg) { var r = savedRules(); net.cfg = { deck: cahOn() ? 'cah' : 'a2a', packs: cahOn() ? savedCahPacks() : savedPacks(), rules: r, target: 'auto', ghost: 'auto' }; }

        Kit.toast(r.name + ' joined'); Kit.sfx('pop');

        sendRoster();
      });
      table.on('leave', function (peer) {
        var r = net.roster.filter(function (x) { return x.peer === peer; })[0]; if (!r) return;
        net.roster = net.roster.filter(function (x) { return x !== r; });
        Kit.toast(r.name + ' left');
        if (G) { var i = idxOfPid(r.pid); if (i >= 0) { playerGone(G, i); changed(); } }
        sendRoster();
      });
      table.on('msg', function (peer, m) {
        if (m.t !== 'a' || !G) return;
        var i = idxOfPid(peer._pid); if (i < 0) return;
        if (m.a && m.a.t === 'next' && G.phase === 'result') { nextRound(G); changed(); return; }
        if (apply(G, i, m.a)) changed();
      });
      showWait();
    }).catch(function (e) { Kit.toast('Couldn’t open a table. ' + Online.errText(e)); goLobby(); });
  }
  function idxOfPid(pid) { if (!G) return -1; for (var i = 0; i < G.players.length; i++) if (G.players[i].pid === pid) return i; return -1; }
  function uniqueName(n) { var base = String(n || 'Player').slice(0, 14), k = 2, out = base; while (net.roster.some(function (r) { return r.name.toLowerCase() === out.toLowerCase(); })) out = base + ' ' + k++; return out; }
  function rosterMsg() { return { t: 'ro', ro: net.roster.map(function (r) { return { pid: r.pid, name: r.name, host: !!r.host }; }), playing: !!(G && G.phase !== 'over') }; }
  function sendRoster() { if (net.table) net.table.broadcast(rosterMsg(), true); if (net.wait) net.wait.update(waitPlayers(net.roster, 0)); }
  function waitPlayers(ro, mePid) { return ro.map(function (r, i) { return { name: r.name, host: !!r.host, me: r.pid === mePid, color: Kit.color(i) }; }); }
  function showWait() {
    screen = 'wait'; lastV = null; G = net.mode === 'host' ? null : G; finished = false;
    window.scrollTo(0, 0);
    if (net.mode === 'host') {
      net.table.setStatus('open', '');
      net.wait = Online.waitRoom(app, { code: net.table.code, host: true, max: 24, min: (net.cfg && net.cfg.ghost === 'on' ? 2 : 3), table: net.table, players: waitPlayers(net.roster, 0), onStart: hostStart, onLeave: function () { leaveOnline(false); goLobby(); },
        note: 'Three or more players. People can join while you play.' });
    } else if (net.mode === 'guest') {
      net.wait = Online.waitRoom(app, { code: null, host: false, hostName: net.hostName, max: 24, min: (net.cfg && net.cfg.ghost === 'on' ? 2 : 3), players: waitPlayers(net.roster, net.myPid), onLeave: function () { leaveOnline(false); goLobby(); } });
    }
  }
  function hostStart() {
    var c = net.cfg, n = net.roster.length, ghost = c.ghost === 'on' || (c.ghost === 'auto' && n === 3);
    if (n < 3 && !(ghost && n === 2)) { Kit.toast('You need at least 3 players'); return Promise.resolve(); }
    net.wait = null;
    lastCfg = { mode: 'online', deck: c.deck, packs: c.packs, rules: c.rules, target: c.target, ghost: ghost, players: net.roster.map(function (r, i) { return { name: r.name, color: Kit.color(i), cpu: false, pid: r.pid }; }) };

  }
  function netSync() {
    if (net.mode !== 'host' || !G) return;
    net.roster.forEach(function (r) { if (!r.peer) return; var i = idxOfPid(r.pid); if (i >= 0) r.peer.send({ t: 'v', v: viewFor(i) }, true); });
    net.table.setStatus(G.phase === 'over' ? 'open' : 'playing', G.phase === 'over' ? '' : 'Round ' + G.round);

  }
  function backToTable() {

    leaveOnline(false); goLobby();
  }
  function joinTable(code, name) {

    return Online.join(code, { game: KEY, name: name, min: (net.cfg && net.cfg.ghost === 'on' ? 2 : 3), screen: app }).then(function (peer) {
      net.mode = 'guest'; net.peer = peer; net.hostName = peer.name; net.myName = name; net.roster = []; net.myPid = null; net.view = null; ui.ord = {};

  }
  function guestMsg(m) {
    if (m.t === 'hi') { net.myPid = m.you; if (m.name) net.myName = m.name; return; }
    if (m.t === 'ro') { net.roster = m.ro; if (net.wait) net.wait.update(waitPlayers(m.ro, net.myPid)); return; }

      var first = screen !== 'game';
      if (first) { net.wait = null; screen = 'game'; lastV = null; finished = false; ui.round = 0; window.scrollTo(0, 0); Kit.gameStart(); }
      net.view = m.v; render(m.v);

    }
  }
  function leaveOnline(ask) {
    if (!net.mode) { closeLobby(); return; }
    if (ask) {
      Kit.confirm(screen === 'game' ? 'Leave the game?' : 'Leave the table?', { ok: 'Leave', body: net.mode === 'host' ? 'The game ends for everyone at your table.' : 'You can join again from the list.' }).then(function (ok) { if (ok) { leaveOnline(false); goLobby(); } });
      return;

    clearTimeout(net.autoT);
    if (net.table) net.table.close();
    if (net.peer) { var p = net.peer; net.peer = null; p.close(); }  // no arg: we're the one leaving, so the bye goes out
    net.mode = null; net.table = null; net.wait = null; net.roster = []; net.view = null;
    if (G && G.mode === 'online') G = null;
    closeLobby();
  }
  window.addEventListener('pagehide', function () { if (net.mode) leaveOnline(false); });

  // ═══ Test hooks ══════════════════════════════════════════════════════════
  window.__a2a = {
    state: function () { return G; }, view: function () { return lastV; }, net: net, ui: ui, pp: pp,
    data: function () { return { A: A, C: C }; },
    act: function (i, a) { if (apply(G, i, a)) changed(); },
    cpuPlay: function (i) { return cpuPlay(G, i); }, cpuJudge: function () { return cpuJudge(G); },
    host: function (n) { return hostTable(n || 'Tim'); }, join: function (c, n) { return joinTable(c, n || 'Sam'); }, start: function () { return hostStart(); }, lobby: goLobby,
    local: function (cfg) { startLocal(cfg); }, setup: showSetup
  };

  // ═══ Boot ════════════════════════════════════════════════════════════════
  (function () {
    var saved = lsGet(SAVE, null);
    if (/[?&]online=1/.test(location.search)) { a2aData().then(goLobby, goLobby); return; }
    if (saved && saved.G && saved.G.players && saved.G.phase && saved.G.phase !== 'over' && saved.G.mode !== 'online') {
      var deck = saved.G.deck === 'cah' ? cahData() : Promise.resolve();
      Promise.all([a2aData(), deck]).then(function () {
        var g = saved.G, ok = true;
        try { var aK = g.ansKind, pK = g.prKind, max = function (k) { return k === 'r' ? A.RED.length : k === 'g' ? A.GRN.length : k === 'w' ? C.WHT.length : C.BLK.length; };
          g.players.forEach(function (p) { p.hand.forEach(function (c) { if (c >= max(aK)) ok = false; }); });
          g.prompt.forEach(function (c) { if (c >= max(pK)) ok = false; });
        } catch (e) { ok = false; }
        if (!ok) { clearSave(); showSetup(); return; }
        G = g; lastCfg = saved.cfg || null; screen = 'game'; pp.viewer = -1;
        changed();
      }, showSetup);
      return;
    }
    showSetup();
  })();
})();

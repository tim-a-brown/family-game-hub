<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hive Mind</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="mindmeld-data.js"></script>
<script src="mindmeld/questions-hm.js"></script>
<script src="mindmeld-core.js"></script>
<style>
body{overflow-x:hidden;}
#app:not(.stage){max-width:1280px;margin:0 auto;padding:2px 8px calc(var(--safe-b) + 12px);}

/* ── The table: one felt top in a wooden rim; everything sits on it ───── */
.ta{border-radius:26px;padding:8px;}
.ta > .felt-in{position:relative;border-radius:19px;padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px;
  min-height:calc(100dvh - var(--bar) - 30px - var(--safe-b));}
.hive{order:1;}.pcw{order:2;}.st{order:3;}.mid{order:4;}.pad{order:5;}.acts{order:6;}
.st:empty,.acts:empty,.pcw:empty,.ph-write > .mid:empty{display:none;}
.ph-roll > .mid,.ph-ask > .mid,.ph-write > .mid,.ph-reveal > .mid,.ph-scored > .mid{flex:1;display:flex;flex-direction:column;}
.mid > :first-child{margin-top:auto;}.mid > :last-child{margin-bottom:auto;}
.acts{margin-top:auto;}
@keyframes ta_shake{20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
@keyframes ta_pop{from{transform:scale(.3);}}

/* ── The board, as printed: a white sheet washed with watercolor; level 1 a big blue quarter circle in the top left
   corner, each next level an overlapping circle with its huge outlined number, snaking along the top, down the right
   and back along the bottom; an arrow off the board after the last; the logo in the open middle. Every part is placed
   by layBoard, sized for the board's room. Each player is a Mind pawn in their seat color. ── */
.ta .pcw > .pc{view-transition-name:hm-card;}.ta .pad{view-transition-name:hm-pad;}.ta .acts{view-transition-name:hm-acts;}
.hive{--bz:30px;position:relative;width:100%;height:240px;flex:none;align-self:center;overflow:hidden;border-radius:12px;background:#fbfaf6;isolation:isolate;
  box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 0 #d9d4c8,0 4px 0 #b9b2a3,0 10px 22px rgba(0,0,0,.45);}
.hive .wash{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(45% 38% at 18% 46%,rgba(70,110,210,.42),transparent 70%),radial-gradient(38% 30% at 82% 8%,rgba(120,60,150,.38),transparent 70%),
    radial-gradient(40% 34% at 92% 82%,rgba(245,110,40,.38),transparent 72%),radial-gradient(42% 30% at 46% 96%,rgba(250,210,40,.42),transparent 72%),
    radial-gradient(30% 26% at 6% 92%,rgba(70,190,140,.32),transparent 72%),radial-gradient(28% 24% at 40% 30%,rgba(150,90,200,.18),transparent 70%);
  filter:saturate(1.1);}
.hive .lv{--bc:#3f7fd6;position:absolute;left:0;top:0;width:100px;height:100px;border-radius:50%;box-sizing:border-box;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.2) 1.1px,transparent 1.8px) 0 0/7px 7px,radial-gradient(120% 120% at 35% 25%,color-mix(in srgb,var(--bc) 82%,#fff),var(--bc) 55%,color-mix(in srgb,var(--bc) 86%,#000));
  box-shadow:0 0 0 3px #fff,0 0 0 4.5px color-mix(in srgb,var(--bc) 55%,#1b1530),0 4px 10px rgba(0,0,0,.18);}
.hive .lv > b{position:absolute;transform:translate(-50%,-52%);font-family:var(--display);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
  color:color-mix(in srgb,var(--bc) 88%,#000);-webkit-text-stroke:.03em color-mix(in srgb,var(--bc) 45%,#fff);paint-order:stroke fill;opacity:.95;
  text-shadow:.04em .04em 0 color-mix(in srgb,var(--bc) 70%,#1b1530);}
.hive .lv.q1 > b{transform:translate(-50%,-50%);}
.hive.drop-on .lv.last{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(255,70,50,.85),0 0 20px rgba(255,70,50,.5);}
/* the logo in the open middle, and the arrow that points off the board */
.hive .logo{position:absolute;z-index:0;transform:translate(-50%,-50%) rotate(-4deg);display:flex;flex-direction:column;align-items:center;pointer-events:none;text-align:center;}
.hive .logo b{font-family:Georgia,'Times New Roman',serif;font-weight:900;font-size:1em;line-height:.86;color:#2f4b1d;letter-spacing:-.02em;text-shadow:.03em .03em 0 #b9d46a;}
.hive .logo .bub{align-self:flex-end;margin:0 -.4em -.1em 0;padding:.16em .4em;border-radius:.35em;background:#f6e36b;color:#7a3a10;font:800 max(9px,.2em)/1.05 var(--font);max-width:6.5em;transform:rotate(6deg);box-shadow:.05em .05em 0 #c9a51e;}
.hive .logo small{margin-top:.25em;font:700 max(9px,.14em)/1 var(--font);color:#3d5a26;white-space:nowrap;}
.hive .exit{position:absolute;z-index:12;pointer-events:none;}
.hive .logo.sm .bub,.hive .logo.sm small{display:none;}
.hive .exit svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));}
/* a Mind pawn */
.pawn{--c:#ffc83d;position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;transition:none;}
.pawn .bz{position:relative;width:calc(var(--bz) * .8);height:var(--bz);flex:none;}
.pawn .bz svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
.pawn .tg{margin-top:0;padding:0 max(4px,calc(var(--tgf,11px) * .38));border-radius:max(5px,calc(var(--tgf,11px) * .4));background:rgba(22,18,42,.82);color:#fff;font-weight:750;font-size:var(--tgf,11px);line-height:1.3;white-space:nowrap;}
.pawn.me .tg{background:var(--c);color:var(--ink-on,#1b1530);box-shadow:0 0 0 1.5px #1b1530;}
.pawn.gone{opacity:.45;}
.pawn .mk{position:absolute;right:calc(var(--bz) * -.08);top:calc(var(--bz) * -.1);width:calc(var(--bz) * .46);height:calc(var(--bz) * .46);min-width:13px;min-height:13px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#1f2a6b;box-shadow:0 1px 3px rgba(0,0,0,.45);z-index:2;}
.pawn .mk .ico{width:70%;height:70%;}
.pawn .mk.ok{background:#3ddc84;color:#06301a;animation:ta_pop .4s var(--spring);}
.pawn .mk.wr .ico{animation:scrib .7s ease-in-out infinite;}
@keyframes scrib{25%{transform:translate(-1.5px,1px) rotate(-8deg);}75%{transform:translate(1.5px,-1px) rotate(6deg);}}
.pawn .cr{position:absolute;left:50%;top:calc(var(--bz) * -.3);width:calc(var(--bz) * .42);height:calc(var(--bz) * .3);min-width:12px;min-height:9px;transform:translateX(-50%);color:#ffd447;z-index:2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));animation:crB 1.6s ease-in-out infinite;}
@keyframes crB{50%{margin-top:-2px;}}
.pawn .cr .ico{width:100%;height:100%;fill:#ffd447;stroke:#7a4b00;stroke-width:1.5;}
.pawn .bdg{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);height:var(--bh,15px);display:flex;align-items:center;gap:2px;z-index:3;pointer-events:none;}
.pawn .gain{min-width:calc(var(--bh,15px) * 1.1);height:var(--bh,15px);box-sizing:border-box;padding:0 4px;border-radius:999px;display:grid;place-items:center;background:#3ddc84;color:#06301a;font-family:var(--display);font-weight:800;font-size:max(10px,calc(var(--bh,15px) * .72));line-height:1;
  box-shadow:0 1px 3px rgba(0,0,0,.4);animation:gainUp .7s var(--spring) both;animation-delay:var(--gd,0s);}
@keyframes gainUp{from{transform:translateY(8px) scale(.4);opacity:0;}}
.pawn.lo .gain{background:#ff7a6b;color:#3b0700;}
.pawn.hi .gain{background:linear-gradient(180deg,#fff3a8,#ffc83d);color:#3a2600;}
.pawn .ar{width:var(--bh,15px);height:var(--bh,15px);border-radius:50%;display:grid;place-items:center;animation:arPop .4s var(--spring) both;animation-delay:var(--ad,0s);box-shadow:0 1px 3px rgba(0,0,0,.4);}
@keyframes arPop{from{transform:scale(.3);opacity:0;}}
.pawn .ar .ico{width:72%;height:72%;stroke-width:3;}
.pawn .ar.dn{background:#ff5c48;color:#fff;}
.pawn .ar.up{background:#ffd447;color:#4a2c00;}
.pawn.outb .bz{transform:rotate(-70deg);transform-origin:50% 92%;}
.pawn.outb .tg{background:rgba(220,60,45,.92);}
.hive.shake{animation:boardThump .45s cubic-bezier(.36,.07,.19,.97);}
@keyframes boardThump{30%{transform:translateY(-2px) scale(1.008);}60%{transform:scale(.997);}}
/* many pawns in little room: each pawn's initial on a tag over its foot */
.hive.ini .pawn{padding-bottom:calc(var(--tgf,11px) * .35);}
.hive.ini .pawn .ar{display:none;}
.hive.hb .pawn .bdg,.hive.nob .pawn .bdg{display:none;}
.pawn .tg .tp:only-child{margin-left:0;}
.pawn .tg .tp{margin-left:2px;padding:0 3px;border-radius:4px;background:#3ddc84;color:#06301a;font-weight:850;}
.pawn.lo .tg .tp{background:#ff7a6b;color:#3b0700;}.pawn.hi .tg .tp{background:#ffd447;color:#3a2600;}
.hive.ini .pawn .tg,.pawn.outb .tg{position:absolute;left:50%;bottom:calc(var(--tgf,11px) * -.1);transform:translateX(-50%);min-width:calc(var(--tgf,11px) * 1.3);text-align:center;padding:0 3px;box-sizing:border-box;}

/* The die: white, with one, two or three dots or the star (a dot inside a star); arrows under it say who moves */
.qd{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;}
.qd .face,.faces .face{--ds:46px;position:relative;width:var(--ds);height:var(--ds);border-radius:calc(var(--ds) * .2);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--ds) * .13);box-sizing:border-box;
  background:radial-gradient(90% 90% at 30% 22%,#ffffff,#f1f1f6 55%,#d4d5e0);box-shadow:inset 0 -3px 0 rgba(60,60,90,.28),inset 0 2px 0 #fff,0 6px 10px rgba(0,0,0,.4);}
.face i{width:72%;height:72%;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d3c58,#14132a);box-shadow:inset 0 1px 1px rgba(255,255,255,.25);visibility:hidden;}
.face[data-v="1"] i:nth-child(5),.face[data-v="2"] i:nth-child(3),.face[data-v="2"] i:nth-child(7),
.face[data-v="3"] i:nth-child(3),.face[data-v="3"] i:nth-child(5),.face[data-v="3"] i:nth-child(7){visibility:visible;}
.face[data-v="s"]{display:block;padding:calc(var(--ds) * .08);}
.face[data-v="s"] svg{display:block;width:100%;height:100%;}
.qd .face.roll{animation:qdRoll .9s cubic-bezier(.2,.8,.3,1) both;}
@keyframes qdRoll{0%{transform:translate(-50px,-60px) rotate(-200deg) scale(.6);}55%{transform:translate(6px,4px) rotate(18deg) scale(1.08);}75%{transform:translate(-2px,-6px) rotate(-6deg);}100%{transform:none;}}
.qd .face.land{animation:qdLand .45s var(--spring) both;}
@keyframes qdLand{from{transform:translateY(-30px) rotate(40deg) scale(1.3);}}
.qd.read .face{animation:qdRead .5s var(--spring);}
@keyframes qdRead{40%{transform:scale(1.18) rotate(-6deg);}}
.qd .dn,.faces .dn{display:flex;gap:1px;color:#ff7a6b;height:14px;}
.qd .dn .ico,.faces .dn .ico{width:14px;height:14px;stroke-width:3.2;}
.dn i.up{display:grid;color:#ffd447;transform:rotate(180deg);font-style:normal;}
/* Rolling: the die in the middle of the table, its six faces in a row under it */
.rtray{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0;}
.qd.big .face{--ds:108px;border-radius:24px;}
.qd.big .face.idle{animation:idle 2.4s ease-in-out infinite;}
@keyframes idle{25%{transform:rotate(-5deg);}75%{transform:rotate(5deg) translateY(-3px);}}
.rtray.can .qd.big{cursor:pointer;}
.rtray.can .qd.big .face{box-shadow:inset 0 -3px 0 rgba(60,60,90,.28),inset 0 2px 0 #fff,0 0 0 4px rgba(255,212,71,.55),0 0 30px rgba(255,212,71,.45),0 10px 18px rgba(0,0,0,.45);}
.qd.big.wait .face{animation:idle 1.2s ease-in-out infinite;}
.qd .face.tumble{animation:tumble .64s cubic-bezier(.3,.6,.4,1) both;}
@keyframes tumble{30%{transform:translate(-14px,-40px) rotate(-170deg) scale(1.05);}60%{transform:translate(10px,-10px) rotate(-320deg);}100%{transform:translate(0,0) rotate(-360deg) scale(.6);opacity:.2;}}
.faces{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.faces .ff{display:flex;flex-direction:column;align-items:center;gap:3px;}
.faces .face{--ds:30px;box-shadow:inset 0 -2px 0 rgba(60,60,90,.28),0 3px 5px rgba(0,0,0,.35);}
.faces .dn{height:11px;}.faces .dn .ico{width:11px;height:11px;}

/* A question card, as printed: white with a pale watercolor wash, the questions in speech bubbles with green comic
   outlines and halftone shading, in a condensed sans; a smaller bubble to make up your own, its thought circles trailing */
@font-face{font-family:'HM Cond';src:url('../fonts/waxpack-barlow-condensed-600.woff2') format('woff2');font-weight:600;font-display:swap;}
@font-face{font-family:'HM Cond';src:url('../fonts/waxpack-barlow-condensed-800i.woff2') format('woff2');font-weight:800;font-style:italic;font-display:swap;}
.hmc{--gr:#4f7f22;--gr2:#83b13e;position:relative;width:100%;max-width:640px;align-self:center;margin:0 auto;padding:12px 14px 12px;border-radius:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;color:#26341a;
  background:radial-gradient(40% 50% at 8% 6%,rgba(160,190,240,.45),transparent 70%),radial-gradient(40% 40% at 96% 4%,rgba(250,215,90,.5),transparent 70%),radial-gradient(45% 45% at 4% 100%,rgba(230,160,220,.42),transparent 72%),radial-gradient(40% 40% at 98% 98%,rgba(170,215,240,.45),transparent 72%),#fdfcf8;
  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 2px 0 #ddd6c6,0 14px 26px rgba(0,0,0,.45);transform:rotate(-.6deg);}
.hmc.deal{animation:dealIn .6s var(--spring) both;}
.hmc{overflow:clip;overflow-clip-margin:10px;}
.hmc .hmh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px;font-weight:750;font-size:.84rem;color:#5d6a4c;}
.hmc .hmh .lg{font-family:Georgia,'Times New Roman',serif;font-weight:900;font-size:1.1rem;color:#2f4b1d;text-shadow:.05em .05em 0 #c8dc7c;}
.bq{position:relative;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 14px;border-radius:12px;color:#26341a;
  background:radial-gradient(circle at 50% 50%,rgba(79,127,34,.22) .9px,transparent 1.5px) 0 0/5px 5px,linear-gradient(#fff,#fff) 6px 6px/calc(100% - 14px) calc(100% - 14px) no-repeat,#fff;
  box-shadow:0 0 0 2.5px var(--gr),3px 3px 0 2.5px var(--gr2);animation:bqIn .45s var(--spring) both;transition:transform .2s var(--spring),opacity .3s,box-shadow .2s;}
@keyframes bqIn{from{transform:scale(.6) translateY(10px);opacity:0;}}
.bq::after{content:"";position:absolute;bottom:-13px;left:34px;width:18px;height:15px;background:var(--gr);clip-path:polygon(0 0,100% 0,10% 100%);}
.bq::before{content:"";position:absolute;bottom:-8px;left:37px;width:11px;height:9px;background:#fff;clip-path:polygon(0 0,100% 0,8% 100%);z-index:1;}
.bq.b1::after{left:auto;right:40px;clip-path:polygon(0 0,100% 0,90% 100%);}
.bq.b1::before{left:auto;right:43px;clip-path:polygon(0 0,100% 0,92% 100%);}
.bq.b1{margin-left:22px;}.bq.b0,.bq.b2{margin-right:22px;}
.bq .tx{font-family:'HM Cond',var(--font);font-weight:600;font-size:clamp(1.12rem,4.6vw,1.5rem);line-height:1.08;text-wrap:balance;overflow-wrap:break-word;min-width:0;}
.bq .slots{flex:none;}
.hmc.can .bq[data-c]{cursor:pointer;}
.hmc.can .bq[data-c]:hover{transform:translateY(-2px) rotate(-.5deg);}
.hmc.can .bq[data-c]:active{transform:scale(.97);}
.bq.chose{transform:scale(1.04);box-shadow:0 0 0 2.5px var(--gr),0 0 0 6px #ffd447,0 0 26px rgba(255,212,71,.75);z-index:2;}
.bq.left{opacity:0;transform:scale(.9);}
.bq.own{align-self:flex-start;border-radius:999px;padding:7px 16px;margin:0 46px 4px 0;background:#fffdf2;box-shadow:0 0 0 2px var(--gr2),inset 0 0 0 1px rgba(131,177,62,.35);}
.bq.own::before,.bq.own::after{content:"";position:absolute;bottom:50%;border-radius:50%;background:#fffdf2;box-shadow:0 0 0 2px var(--gr2);clip-path:none;}
.bq.own::after{right:-24px;width:13px;height:11px;transform:translateY(50%);left:auto;}
.bq.own::before{right:-40px;width:8px;height:7px;transform:translateY(50%);left:auto;z-index:0;}
.bq.own .tx{display:flex;align-items:center;gap:7px;font-weight:800;font-style:italic;font-size:clamp(1rem,4vw,1.2rem);color:var(--gr);}
.bq.own .tx .ico{width:17px;height:17px;flex:none;}
.hmc.can .bq.own{cursor:pointer;}
.bq.own.open{align-self:stretch;flex-direction:column;align-items:stretch;border-radius:14px;margin-right:0;padding:10px 12px 12px;}
.bq.own.open::before,.bq.own.open::after{display:none;}
.bq.own input{width:100%;box-sizing:border-box;border:0;border-bottom:2px solid var(--gr);background:transparent;outline:none;padding:6px 2px;font-family:'HM Cond',var(--font);font-weight:600;font-size:1.35rem;color:#26341a;}
.bq.own .orow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.bq.own .ol{font-size:.8rem;font-weight:750;color:#5d6a4c;}
.nch{display:flex;gap:6px;}
.nc{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px;min-height:44px;padding:4px 6px;border:0;border-radius:10px;background:#eef1e6;color:#26341a;font:inherit;cursor:pointer;}
.nc b{font-family:var(--display);font-size:.95rem;line-height:1;}
.nc.on{background:#ffd447;box-shadow:0 0 0 2px #26341a;}
.nc .slots i{width:9px;height:7px;}
.bq.own .btn{margin-left:auto;min-height:44px;}
.bq.own.nudge{animation:ta_shake .45s;}
.hmc.owning .bq[data-c]{display:none;}
.bq.own .bk{align-self:flex-start;min-height:40px;padding-left:4px;color:#4f7f22;}
.hmc .ft{display:flex;justify-content:space-between;gap:10px;padding:0 2px;font-size:.66rem;font-weight:600;color:#8a8f7c;}
@media (max-width:560px){ .bq.b1{margin-left:12px;} .bq.b0,.bq.b2{margin-right:12px;} }

/* The question asked: its own bubble on a card, and the die beside it (and the timer while everyone writes) */
.pcw{display:flex;align-items:center;justify-content:center;gap:12px;}
.pcw .rs{flex:0 1 26em;margin:0;color:#fff;font-weight:700;font-size:.95rem;line-height:1.25;text-wrap:balance;}
.pc{--gr:#4f7f22;--gr2:#83b13e;position:relative;flex:1;min-width:0;max-width:640px;padding:12px 16px 14px;border-radius:14px;color:#26341a;
  background:radial-gradient(circle at 50% 50%,rgba(79,127,34,.2) .9px,transparent 1.5px) 0 0/5px 5px,linear-gradient(#fff,#fff) 7px 7px/calc(100% - 16px) calc(100% - 16px) no-repeat,#fff;
  box-shadow:0 0 0 2.5px var(--gr),3px 3px 0 2.5px var(--gr2),0 12px 24px rgba(0,0,0,.42);transform:rotate(-.8deg);}
.pc::after{content:"";position:absolute;bottom:-14px;left:40px;width:20px;height:16px;background:var(--gr);clip-path:polygon(0 0,100% 0,10% 100%);}
.pc .k{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:0;font-size:.8rem;font-weight:700;color:#5d6a4c;}
.pc .q{margin-top:4px;font-family:'HM Cond',var(--font);font-weight:600;font-size:clamp(1.4rem,5.8vw,2.1rem);line-height:1.06;text-wrap:balance;overflow-wrap:break-word;}
.pc.own .q{font-style:italic;}
.slots{display:flex;gap:4px;flex:none;}
.slots i{width:16px;height:11px;border-radius:2px;background:#fffdf4;box-shadow:inset 0 0 0 1.5px #9db57a,0 1px 0 rgba(0,0,0,.08);}
.slots i::after{content:"";display:block;margin:4px 3px 0;height:1.5px;background:#3550a8;opacity:.55;border-radius:1px;}
.pc.deal{animation:dealIn .6s var(--spring) both;}
@keyframes dealIn{from{transform:translate(60px,-120px) rotate(14deg) scale(.7);opacity:0;}}
.hg{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:48px;}
.hg svg{width:44px;height:72px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4));}
.hg .sS{animation:pour .35s linear infinite;}
@keyframes pour{to{stroke-dashoffset:-4;}}
.hg.still .sS{display:none;}
.hg b{font-family:var(--display);font-weight:400;font-size:1.05rem;line-height:1;color:#fff;font-variant-numeric:tabular-nums;}
.hg.low b{color:#ff8a8a;animation:ta_pulse 1s ease-in-out infinite;}
.hg.low svg{animation:ta_wob .5s ease-in-out infinite;}
@keyframes ta_pulse{50%{opacity:.45;}}
@keyframes ta_wob{50%{transform:rotate(4deg);}}

/* What's happening, in a word or two, on the felt */
.st{display:flex;align-items:center;justify-content:center;gap:8px;min-height:24px;text-align:center;color:rgba(255,255,255,.9);font-weight:700;font-size:.92rem;line-height:1.25;}
.st .think{display:inline-flex;gap:3px;}
.st .think i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.st .think i:nth-child(2){animation-delay:.15s;}.st .think i:nth-child(3){animation-delay:.3s;}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* The clipboard and its lined paper: where you write */
.pad{position:relative;align-self:center;width:100%;max-width:520px;padding:30px 12px 12px;border-radius:16px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),linear-gradient(175deg,#a5774a,#7a5230 70%,#6a4528);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.25),0 14px 28px rgba(0,0,0,.45);}
.pad .clip{position:absolute;left:50%;top:-8px;width:118px;height:32px;margin-left:-59px;border-radius:9px 9px 12px 12px;z-index:3;
  background:linear-gradient(180deg,#f1f2f4,#a9adb5 55%,#7d828b);box-shadow:inset 0 1px 0 #fff,0 4px 8px rgba(0,0,0,.45);}
.pad .clip::after{content:"";position:absolute;left:36px;right:36px;top:6px;height:9px;border-radius:5px;background:rgba(0,0,0,.28);box-shadow:inset 0 2px 2px rgba(0,0,0,.4);}
.sheet{--lh:40px;position:relative;border-radius:4px;padding:0 12px 6px 46px;
  background:linear-gradient(90deg,transparent var(--ml,36px),rgba(214,70,70,.45) var(--ml,36px) calc(var(--ml,36px) + 2px),transparent calc(var(--ml,36px) + 2px)),
    repeating-linear-gradient(180deg,transparent 0 calc(var(--lh) - 1px),rgba(60,80,160,.2) calc(var(--lh) - 1px) var(--lh)),linear-gradient(180deg,#fffdf4,#f6eedb);}
.sheet .hd{height:var(--lh);display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-bottom:6px;font-size:1.25rem;line-height:1;}
.sheet .hd .who{color:#7a6a4a;}
.ln{display:flex;align-items:center;height:var(--lh);margin-left:-38px;}
.ln b{flex:none;width:32px;text-align:center;font-weight:400;font-size:calc(var(--lh) * .33);color:#c0392b;}
.ln input,.ln .w{flex:1;min-width:0;height:var(--lh);margin-left:6px;padding:6px 2px 0;border:0;border-radius:0;background:transparent;outline:none;
  font-family:var(--hand);font-size:calc(var(--lh) * .6);line-height:calc(var(--lh) - 6px);color:#1f2a6b;caret-color:#1f2a6b;-webkit-appearance:none;appearance:none;}
.ln .w{overflow-wrap:anywhere;line-height:1.05;display:flex;align-items:flex-end;padding-bottom:4px;}
.ln input::placeholder{color:rgba(31,42,107,.28);}
.ln input:focus{background:linear-gradient(180deg,transparent 70%,rgba(255,212,71,.28) 70%);}
.pad .fold{width:100%;margin-top:12px;}
.pad.sent .sheet{filter:saturate(.8);}
.pad .stamp{position:absolute;right:20px;bottom:18px;z-index:2;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:rgba(40,140,80,.85);
  box-shadow:inset 0 0 0 3px rgba(40,140,80,.75),inset 0 0 0 6px rgba(255,255,255,0),inset 0 0 0 7.5px rgba(40,140,80,.5);transform:rotate(-14deg);animation:stampIn .45s cubic-bezier(.3,1.6,.5,1) both;}
.pad .stamp .ico{width:36px;height:36px;stroke-width:3;}
@keyframes stampIn{from{transform:rotate(-14deg) scale(2.2);opacity:0;}}
.pad.idle .sheet{min-height:200px;}
.pad.nudge{animation:ta_shake .45s;}
.flyfold{position:fixed;z-index:60;pointer-events:none;transform-origin:50% 0;transition:transform .55s cubic-bezier(.5,0,.3,1),opacity .55s;}

/* The answers, face up: matching slips stacked together */
.mid{min-width:0;}
.stx{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;align-items:flex-start;gap:20px 16px;padding:12px 4px 8px;--sw:136px;}
.stx.crowd{--sw:116px;gap:16px 12px;}
.stk{--tilt:0deg;position:relative;width:var(--sw);border-radius:6px;transform:rotate(var(--tilt));transition:transform .25s var(--spring);-webkit-tap-highlight-color:transparent;outline:none;}
.stk .fr,.stk .bk,.tray .ms,.fs{color:#1f2a6b;}
.stk .fr{position:relative;z-index:2;min-height:70px;padding:10px 10px 8px;border-radius:5px;display:flex;flex-direction:column;justify-content:space-between;gap:7px;
  background:linear-gradient(180deg,#fffdf4,#f4ead2);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 6px 12px rgba(0,0,0,.35);}
.stk .bk{position:absolute;inset:0;z-index:1;border-radius:5px;background:linear-gradient(180deg,#fbf6e8,#efe3c6);box-shadow:0 3px 7px rgba(0,0,0,.3);
  transform:translate(calc(var(--j) * 3px),calc(var(--j) * 4px)) rotate(var(--r));}
.stk .tx{font-family:var(--hand);font-size:var(--tf,1.38rem);line-height:1.05;overflow-wrap:anywhere;text-wrap:balance;}
.stk .tx.lg{font-size:calc(var(--tf,1.38rem) * .86);}.stk .tx.xl{font-size:calc(var(--tf,1.38rem) * .72);}.stk .tx.xxl{font-size:calc(var(--tf,1.38rem) * .6);}
.stk .who{display:flex;flex-wrap:wrap;gap:3px;}
.stk .who i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#1b1530;font-style:normal;font-size:.62rem;font-weight:900;line-height:1;box-shadow:0 0 0 1.5px #fffdf4;}
.stk .n{position:absolute;top:-11px;right:-10px;z-index:3;min-width:30px;height:30px;padding:0 7px;border-radius:15px;display:grid;place-items:center;
  background:#ffd447;color:#3a2600;font-family:var(--display);font-size:1.05rem;line-height:1;box-shadow:0 3px 7px rgba(0,0,0,.4);}
.stk.solo .n{background:#d9d2c0;color:#5b5444;}
.stk.solo .fr{background:linear-gradient(180deg,#f8f4e8,#ebe2ca);}
.stk.tap{cursor:pointer;}
.stk.tap:active{transform:scale(.96);}
.stk.sel{transform:translateY(-8px) scale(1.05);z-index:5;}
.stk.sel .fr{box-shadow:0 0 0 3px #ffd447,0 0 22px rgba(255,212,71,.45),0 14px 24px rgba(0,0,0,.45);}
.stx.picking .stk:not(.sel) .fr{outline:2px dashed rgba(255,212,71,.85);outline-offset:4px;animation:tgt 1.3s ease-in-out infinite;}
@keyframes tgt{50%{outline-color:rgba(255,212,71,.3);}}
.stk.bump{animation:bumpStk .6s var(--spring);}
@keyframes bumpStk{35%{transform:scale(1.14) rotate(-2deg);}}
.stk.pop{animation:popStk .55s var(--spring);}
@keyframes popStk{from{transform:translateY(-24px) scale(.7) rotate(8deg);opacity:0;}}
.stk.intro{animation:stIn .5s var(--spring) both;animation-delay:var(--d);}
@keyframes stIn{from{transform:translateY(-36px) rotate(-10deg) scale(.8);opacity:0;}}
.stk.intro .fr{animation:unfold .5s var(--ease) both;animation-delay:calc(var(--d) + .12s);transform-origin:50% 0;}
@keyframes unfold{0%{transform:perspective(500px) rotateX(-85deg);filter:brightness(.8);}100%{transform:none;}}
.stk.intro .bk{animation:gather .55s cubic-bezier(.3,1.25,.5,1) both;animation-delay:calc(var(--d) + .5s);}
@keyframes gather{from{transform:translate(calc(var(--j) * 46px + 10px),calc(var(--j) * -10px)) rotate(calc(var(--r) * 4 + 10deg));opacity:.4;}}
.stk.intro .n{animation:ta_pop .4s var(--spring) both;animation-delay:calc(var(--d) + .9s);}
.stk.all .fr{box-shadow:0 0 0 3px #ffd447,0 0 34px rgba(255,212,71,.7),0 12px 24px rgba(0,0,0,.45);}
.stk.all .n{background:linear-gradient(180deg,#fff3a8,#ffc83d);}
.stk.all.scored{animation:bumpStk .8s var(--spring) .6s;}
.stk .n .ico{width:14px;height:14px;margin-right:2px;stroke-width:2.6;}
.stk.scored .n{animation:ta_pop .45s var(--spring) both;animation-delay:var(--d);}
.stx.fitted .stk .fr{min-height:0;}
.mid.scrolly{border-radius:14px;background:rgba(0,0,0,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.mid.fade{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent);}
.stx .none{color:rgba(255,255,255,.7);font-weight:650;padding:20px;text-align:center;}
.fly{position:fixed;z-index:60;pointer-events:none;margin:0;transition:transform .42s cubic-bezier(.5,0,.25,1);}

/* A picked stack spread out: who wrote which slip; tap one to pull it out */
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:2px auto 6px;padding:12px 10px;max-width:640px;border-radius:18px;background:var(--well);box-shadow:inset 0 0 0 1px var(--gl-line),inset 0 2px 8px rgba(0,0,0,.25);animation:ta_rise .3s var(--ease);}
@keyframes ta_rise{from{transform:translateY(8px);opacity:0;}}
.tray .ms{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:96px;max-width:170px;padding:8px 30px 7px 9px;border:0;border-radius:4px;
  background:linear-gradient(180deg,#fffdf4,#f4ead2);box-shadow:0 4px 9px rgba(0,0,0,.35);font:inherit;text-align:left;cursor:pointer;transform:rotate(var(--r));transition:transform .2s var(--spring);}
.tray .ms:active{transform:scale(.95);}
.tray .ms .mt{font-family:var(--hand);font-size:1.25rem;line-height:1.05;overflow-wrap:anywhere;}
.tray .ms .mn{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:900;color:#4b4536;}
.tray .ms .mn i{width:10px;height:10px;border-radius:50%;background:var(--c);}
.tray .ms .mo{position:absolute;right:6px;top:7px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#1f2a6b;color:#fff;}
.tray .ms .mo .ico{width:12px;height:12px;}

/* The credit under the title in the setup, and at the foot of How to play */
.hm-credit{margin:-6px auto 2px;max-width:34em;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-3);text-wrap:balance;}
.k-rules .credit,.credit{margin-top:14px;font-size:.82rem;color:var(--text-3);}
/* The hive at the end: on the table and on the results card */
.fin .endsay{text-align:center;color:#fff;font-weight:700;font-size:1.02rem;line-height:1.3;margin:-4px 0 2px;text-wrap:balance;}
.fin .row.gone{opacity:.7;}
.fin .row.gone .sc{color:#ff9b8f;font-size:1rem;}

/* Buttons on the table */
.acts{display:flex;gap:10px;justify-content:center;}
.acts .btn{flex:1;max-width:420px;}
.btn.ready{animation:ready 1.6s ease-in-out infinite;}
@keyframes ready{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 6px rgba(255,211,77,.22),0 0 26px var(--litg);}}

/* The end: final scores and every round */
.fin{display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;margin:0 auto;}
.fin h2{font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:-.025em;text-align:center;color:#fff;}
.fin .lab{font-size:.86rem;font-weight:600;color:rgba(255,255,255,.65);margin:4px 2px -6px;}
.fin .row{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:#fff;font-weight:700;}
.fin .row .pl-n{width:22px;text-align:center;font-family:var(--display);color:rgba(255,255,255,.6);}
.fin .row .nm{flex:1;min-width:0;overflow-wrap:anywhere;}
.fin .row .sc{font-family:var(--display);font-size:1.3rem;color:#fff;font-variant-numeric:tabular-nums;}
.fin .rd{padding:10px 12px;border-radius:14px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:#fff;}
.fin .rd .rq{display:flex;justify-content:space-between;gap:10px;font-weight:750;font-size:.95rem;line-height:1.25;}
.fin .rd .rq span:last-child{flex:none;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.6);padding-top:2px;}
.fin .rd .tops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.fin .rd .tops span{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;border-radius:5px;background:linear-gradient(180deg,#fffdf4,#f4ead2);color:#1f2a6b;font-family:var(--hand);font-size:1.12rem;line-height:1.1;}
.fin .rd .tops b{min-width:22px;height:22px;padding:0 5px;border-radius:11px;display:grid;place-items:center;background:#ffd447;color:#3a2600;font:400 .85rem/1 var(--display);}
.fin .rd .none{margin-top:6px;color:rgba(255,255,255,.6);font-weight:600;font-size:.85rem;}
.fin .acts{flex-direction:column;align-items:stretch;}
.fin .acts .btn{max-width:none;}

/* ── Bigger screens ───────────────────────────────────────────────────── */
@media (min-width:700px){
  .ta > .felt-in{padding:18px 20px 20px;gap:16px;}
  .pc .q{font-size:2.1rem;}
  .stx{--sw:156px;gap:24px 20px;}
  .stx.crowd{--sw:132px;}
  .stx{--tf:1.55rem;}
  .hg svg{width:52px;height:85px;}.hg{width:56px;}
}
/* Sideways: the hive (what you look at) on the left; the card, your paper and the slips (what you do) on the right */
@media (orientation:landscape) and (min-width:600px){
  .ta > .felt-in{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);column-gap:18px;row-gap:10px;align-content:stretch;}
  .ph-roll{grid-template-areas:"hv mid" "hv st" "hv acts";grid-template-rows:minmax(0,1fr) auto auto;}
  .ta > .felt-in.ph-roll{grid-template-columns:minmax(0,1fr) minmax(230px,max-content);}
  .ph-roll .rtray{padding:6px 8px;}
  .ph-roll .acts .btn{min-width:200px;}
  .ph-ask{grid-template-areas:"hv pc" "hv mid" "hv st";grid-template-rows:auto minmax(0,1fr) auto;}
  html:not(.mm-dk) .ta > .felt-in.ph-ask,html:not(.mm-dk) .ta > .felt-in.ph-roll{height:calc(100dvh - var(--bar) - 30px - var(--safe-b));min-height:0;box-sizing:border-box;}
  .ph-ask .mid{overflow-y:auto;overscroll-behavior:contain;min-height:0;padding:4px 2px;}
  .ph-ask .pcw{justify-content:flex-start;}
  .ph-write{grid-template-areas:"hv pc" "hv pad" "st pad" "x acts";grid-template-rows:auto 1fr auto auto;}
  .ph-reveal,.ph-scored{grid-template-areas:"hv pc" "hv mid" "st acts";grid-template-rows:auto 1fr auto;}
  .hive{grid-area:hv;align-self:center;}.pcw{grid-area:pc;align-self:start;}.st{grid-area:st;}.mid{grid-area:mid;}.pad{grid-area:pad;align-self:center;}.acts{grid-area:acts;align-self:end;}
  .ph-reveal .mid,.ph-scored .mid{overflow-y:auto;overscroll-behavior:contain;max-height:none;min-height:0;border-radius:12px;}
  html:not(.mm-dk) .ta > .felt-in.ph-reveal,html:not(.mm-dk) .ta > .felt-in.ph-scored{height:calc(100dvh - var(--bar) - 30px - var(--safe-b));min-height:0;box-sizing:border-box;grid-template-rows:auto minmax(0,1fr) auto;}
  .st{align-self:start;}
  .ta > .felt-in.ph-over{display:flex;}
  .ta > .felt-in.n-mid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .ta > .felt-in.n-many{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);}
}
/* Phones sideways: short screens, so everything a little tighter */
@media (orientation:landscape) and (max-height:500px){
  .ta{padding:6px;border-radius:20px;}
  .ta > .felt-in{padding:10px 12px 10px;border-radius:15px;row-gap:6px;min-height:calc(100dvh - var(--bar) - 26px - var(--safe-b));}
  .pc{padding:8px 12px 10px;}
  .pc .q{font-size:1.25rem;}
  .hg svg{width:32px;height:52px;}.hg{width:36px;}
  .qd .face{--ds:36px;}
  .pad{padding:22px 10px 10px;}
  .sheet{--lh:32px;}
  .pad .fold{margin-top:8px;min-height:44px;}
  html:not(.mm-dk) .ta > .felt-in.ph-reveal,html:not(.mm-dk) .ta > .felt-in.ph-scored{height:calc(100dvh - var(--bar) - 26px - var(--safe-b));min-height:0;box-sizing:border-box;grid-template-rows:auto minmax(0,1fr) auto;}
  .ph-reveal .mid,.ph-scored .mid{max-height:none;min-height:0;}
  .stx{--sw:116px;gap:14px 12px;padding-top:12px;}
  .stx{--tf:1.2rem;}
  .st{line-height:1.2;}
  .st{font-size:.84rem;}
}
/* iPads: a big table, so big pieces */
@media (min-width:700px) and (min-height:900px){
  .qd .face{--ds:62px;}
  .qd .dn{height:18px;}.qd .dn .ico{width:18px;height:18px;}
  .pc{max-width:760px;padding:16px 22px 20px;border-radius:18px;}
  .pc .k{font-size:.92rem;}.pc .slots i{width:22px;height:15px;}
  .pc .q{font-size:2.8rem;}
  .hg svg{width:64px;height:105px;}.hg{width:70px;}.hg b{font-size:1.4rem;}
  .st{font-size:1.1rem;}
  .pad{max-width:640px;padding:36px 16px 16px;}
  .pad .clip{width:150px;margin-left:-75px;height:38px;}
  .sheet{--lh:56px;--ml:46px;padding-left:56px;}
  .ln{margin-left:-48px;}.ln b{width:40px;}
  .sheet .hd{font-size:1.6rem;}
  .pad .stamp{width:84px;height:84px;}.pad .stamp .ico{width:46px;height:46px;}
  .stx{--sw:200px;gap:30px 26px;}
  .stx.crowd{--sw:170px;}
  .stk .fr{min-height:96px;padding:14px 14px 12px;}
  .stx{--tf:2rem;}
  .stk .who i{width:24px;height:24px;font-size:.78rem;}
  .stk .n{min-width:38px;height:38px;border-radius:19px;font-size:1.3rem;top:-14px;right:-13px;}
  .tray .ms .mt{font-size:1.5rem;}.tray .ms{max-width:220px;}
  .acts .btn{min-height:64px;font-size:1.2rem;}
}
/* an iPad on its side: the hive a step smaller than upright, so the paper keeps its room */
@media (orientation:landscape) and (min-width:900px) and (max-height:899px) and (min-height:501px){
  .qd .face{--ds:54px;}
  .pc .q{font-size:2rem;}
  .sheet{--lh:46px;}
}
/* Upright, once the answers are turned over: the table keeps the screen's height and the stacks scroll inside it, so the
   hive, the card and the button stay in view; the hive a step smaller while the stacks need the room */
@media (orientation:portrait){
  html:not(.mm-dk) .ta > .felt-in.ph-reveal,html:not(.mm-dk) .ta > .felt-in.ph-scored{height:calc(100dvh - var(--bar) - 30px - var(--safe-b));min-height:0;box-sizing:border-box;}
  .ta > .felt-in.ph-reveal > *,.ta > .felt-in.ph-scored > *{flex-shrink:0;}
  html:not(.mm-dk) .ta > .felt-in.ph-ask{height:calc(100dvh - var(--bar) - 30px - var(--safe-b));min-height:0;box-sizing:border-box;}
  .ta > .felt-in.ph-ask > *{flex-shrink:0;}
  .ta > .felt-in.ph-ask > .mid{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 2px 8px;}
  .ta > .felt-in.ph-reveal > .mid,.ta > .felt-in.ph-scored > .mid{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;border-radius:12px;}
  .ph-reveal .pc .q,.ph-scored .pc .q{font-size:1.35rem;}
}
@media (orientation:portrait) and (min-width:700px){ .ph-reveal .pc .q,.ph-scored .pc .q{font-size:2rem;} }
@media (max-width:370px){ .stx{--sw:122px;gap:16px 10px;--tf:1.22rem;} .stx.crowd{--sw:104px;} }
/* A short phone held upright (320 by 568): the hive, the cards and the paper all draw in */
@media (orientation:portrait) and (max-height:700px){
  .ta > .felt-in{gap:8px;padding:8px 8px 10px;}
  .pc{padding:8px 12px 10px;}
  .pc .q{font-size:1.2rem;}
  .sheet{--lh:32px;}
  .pad{padding:22px 10px 10px;}
  .pad .fold{margin-top:8px;min-height:44px;}
  .qd .face{--ds:36px;}
}

/* ── The desk: a large window (deskPlan; html.mm-dk only while it shows). The table takes the window: the card, the
   paper and the slips are sized by --u (1 to 1.7, from the window). 'wide': the hive is the hero, as tall as the
   window in a column of its own at the left (its bees sized from that column, --hbz), with the cards so far under it
   where there is room; 'stack' (a squarer or taller window): the table with the hive at its head over the cards so
   far; 'small': the table alone, fitted to the window. ── */
html.mm-dk body{overflow:hidden;}

<script>

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  var coarse = (function () { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
  var NUM = ['no', 'one', 'two', 'three', 'four', 'five', 'six'];
  function lvName(l) { return 'level ' + (l + 1); }
  function faceSay(f) { return f === 's' ? 'the star' : NUM[f] + (f === 1 ? ' dot' : ' dots'); }

  function prompt(g) { return C.prompt(g); }
  function newGame(cfg) { return C.newGame(cfg, pickDeck()); }
  function apply(g, who, a) {

  // ═══ Driving it: moves, robots, the sand timer, saving, undo ══════════════

    '<h3>The board</h3><ul>' +

    '<li>The board has two sides: <b>6 levels</b> for a speedier game, or <b>8 levels</b> for a longer one. Choose the side in the setup.</li></ul>' +
    '<h3>A turn</h3><ul>' +
    '<li>The person who thought to play goes first, and the turn passes to the left.</li>' +
    '<li>On your turn you roll the die, then draw a card and choose one of the three questions on it, or make up your own question. The little slips on a question show how many responses it asks for.</li>' +
    '<li>Everyone, you included, writes their responses on their own paper in secret. With the timer on, everyone has 2 minutes, and whatever is on your paper when it runs out goes in.</li></ul>' +
    '<h3>Scoring</h3><ul>' +
    '<li>You score <b>1 point for each response you wrote</b>, and <b>1 more for each other player who wrote a matching response</b>.</li>' +
    '<li>If you wrote two responses that match each other, only one of them scores the matches; the other still scores its 1 point. You can’t get the same matches on more than one response.</li>' +
    '<li>The points count for this question only.</li></ul>' +
    '<h3>Do these responses match?</h3><ul>' +
    '<li>What you are referring to matters, not how you say it. <b>Cat</b>, <b>kitty</b> and <b>kitten</b> all mean the same animal.</li>' +
    '<li>Spelling doesn’t matter, and neither do plurals: <b>cookie</b> and <b>cookies</b> match.</li>' +
    '<li>Something more specific doesn’t match something more general: <b>beagle</b> doesn’t match <b>dog</b>.</li>' +
    '<li>The game stacks the ones it is sure of. If two stacks mean the same thing, tap one and then the other to put them together. If a slip doesn’t belong in a stack, tap the stack and then that slip to pull it out. The table decides, as it would around a real table.</li></ul>' +
    '<h3>Moving the pawns</h3><ul>' +
    '<li><b>One, two or three dots</b>: every player whose total is among the one, two or three lowest totals moves down one level. Players with the same total move together, so with totals of 6, 7, 7 and 9, two dots move the 6 and both 7s down. If everyone has the same total, everyone moves down.</li>' +

    '<li><b>The star</b>: the players with the single lowest total move down one level, then the players with the highest total move up one level (never past the top).</li>' +
    '<li>Nobody ever moves up except on the star.</li></ul>' +
    '<h3>The end</h3><ul>' +
    '<li>As soon as one or more pawns go off the bottom of the board, the game ends. <b>Everyone still on the board wins.</b></li>' +
    '<li>If every pawn goes off the board at once, everyone wins together.</li></ul>' +

    net.wait = null;
    var players = net.roster.map(function (r, i) { return { name: r.name, color: Kit.color(i), cpu: false, pid: r.pid, dev: r.dev }; });
    if (players.length < 3) Kit.cpuNames(1, players.map(function (p) { return p.name; }), 8).forEach(function (b) { players.push({ name: b, color: Kit.color(players.length), cpu: true, pid: -1 }); });
    lastCfg = { mode: 'online', timer: net.cfg.timer, levels: net.cfg.levels || 6, players: players };
    G = newGame(lastCfg); screen = 'game'; finished = false; resetUi(); ui.paperRound = ''; draft = [];
    Kit.gameStart();
    sendRoster();
    changed({ t: 'start' });
    return Promise.resolve();
  }
  function netSync() {
    if (net.mode !== 'host' || !G) return;
    net.roster.forEach(function (r) { if (!r.peer) return; var i = idxOfPid(r.pid); if (i >= 0) r.peer.send({ t: 'v', v: viewFor(i) }, true); });
    net.table.setStatus(G.phase === 'over' ? 'open' : 'playing', G.phase === 'over' ? '' : 'Turn ' + G.round);
  }
  function backToTable() {
    if (net.mode === 'host' && net.table && !net.table.closed) { G = null; showWait(); net.table.broadcast({ t: 'wait' }, true); sendRoster(); return; }
    leaveOnline(false); goLobby();
  }
  function joinTable(code, name) {
    closeLobby(); busy('Connecting to the table…');
    return Online.join(code, { game: KEY, name: name, min: 2, screen: app }).then(function (peer) {
      net.mode = 'guest'; net.peer = peer; net.hostName = peer.name; net.myName = name; net.roster = []; net.myPid = null; net.view = null;
      peer.on('msg', guestMsg);
      peer.on('close', function (why) {
        if (net.peer !== peer) return;
        net.peer = null; net.mode = null;
        Kit.toast((net.hostName || 'The host') + (why === 'host' || why === 'left' ? ' closed the table' : '’s table lost its connection'));
        if (screen === 'game' && net.view && net.view.phase === 'over') return;
        goLobby();
      });
      showWait();
    }).catch(function (e) {
      var msg = e && e.nat ? e.message : Online.errText(e);
      if (e && e.nat) Kit.sheet({ title: 'Couldn’t connect', html: '<p>' + esc(msg) + '</p>' }); else Kit.toast(msg);
      goLobby();
    });
  }
  function guestMsg(m) {
    if (m.t === 'hi') { net.myPid = m.you; if (m.name) net.myName = m.name; return; }
    if (m.t === 'ro') { net.roster = m.ro; if (net.wait) net.wait.update(waitPlayers(m.ro, net.myPid)); return; }
    if (m.t === 'wait') { net.view = null; lastV = null; finished = false; showWait(); return; }
    if (m.t === 'v') {
      var V = m.v; V.boss = false;
      // (a host on an older copy of the page sends a view this page can't draw)
      if (V.hm !== 2) { Kit.toast('The host’s copy of the game needs updating'); return; }
      if (screen !== 'game') { net.wait = null; screen = 'game'; resetUi(); ui.paperRound = ''; ui.sent = ''; finished = false; draft = []; window.scrollTo(0, 0); Kit.gameStart(); }
      // the host's sand timer, on this device's clock
      if (V.left != null) { var dl = Date.now() + V.left; if (!ui.gDl || Math.abs(ui.gDl - dl) > 1500 || (lastV && lastV.round !== V.round)) ui.gDl = dl; } else ui.gDl = 0;
      var prev = lastV;
      net.view = V; render(V);
      if (V.phase === 'write' && prev && prev.phase === 'write' && prev.round === V.round) V.players.forEach(function (p, k) { if (p.done && prev.players[k] && !prev.players[k].done && k !== V.me) Kit.sfx('deal', 0.5); });
      if (V.phase === 'over' && !finished) { finished = true; recordGame(V.done); showWin(V.done); }
    }
  }
  function leaveOnline(ask) {
    if (!net.mode) { closeLobby(); return; }
    if (ask) {
      Kit.confirm(screen === 'game' ? 'Leave the game?' : 'Leave the table?', { ok: 'Leave', body: net.mode === 'host' ? 'The game ends for everyone at your table.' : 'You can join again from the list.' }).then(function (ok) { if (ok) { leaveOnline(false); goLobby(); } });
      return;
    }
    if (net.table) net.table.close();
    if (net.peer) { var p = net.peer; net.peer = null; p.close(); }
    net.mode = null; net.table = null; net.wait = null; net.roster = []; net.view = null; ui.gDl = 0;
    if (G && G.mode === 'online') G = null;
    closeLobby();
  }
  window.addEventListener('pagehide', function () { if (net.mode) leaveOnline(false); });

  // ═══ The desk: a large window ════════════════════════════════════════════
  // A window no phone or tablet has (Three Card Poker's test: an iPad's band only with a mouse, never at the iPad
  // mini's own shape). Phones and tablets never get here: deskLay adds nothing unless deskPlan says so.
  function deskWin(w, h) {
    var lo = Math.min(w, h), hi = Math.max(w, h), pad = lo >= 620 && lo <= 840 && hi >= 900 && hi <= 1200;
    var fine = !!(window.matchMedia && matchMedia('(pointer: fine)').matches);
    return (w > 480 || h > 1000) && w >= 340 && h > 540 && !((lo <= 480 && hi <= 1000) || (pad && (!fine || (lo <= 790 && hi <= 1060))));
  }
  var DK = null;
  function deskPlan() {
    var w = innerWidth, h = innerHeight;
    if (!deskWin(w, h)) return null;
    if (w < 900 && h < 1100) return 'small';
    // (the hive gets a column of its own wherever the window is about as wide as tall or wider)
    return w / Math.max(1, h - 60) >= 1 && w >= 1100 ? 'wide' : 'stack';
  }
  function deskOff() {
    DK = null; document.documentElement.classList.remove('mm-dk');
    app.classList.remove('dk', 'dk-wide', 'dk-stack', 'dk-small', 't-row', 't-col', 'nohv');
    ['--u', '--dku', '--rw', '--rh', '--hbz'].forEach(function (k) { app.style.removeProperty(k); });
    var r = app.querySelector(':scope > .dk-room'); if (r) r.remove();
  }
  function deskLay(V) {
    var plan = deskPlan(), ta = app.querySelector(':scope > .ta');
    if (!plan || !ta) { if (DK) deskOff(); return; }
    DK = plan;
    var W = innerWidth, H = innerHeight;
    document.documentElement.classList.add('mm-dk');
    app.classList.remove('dk-wide', 'dk-stack', 'dk-small', 't-row', 't-col', 'nohv');
    app.classList.add('dk', 'dk-' + plan);
    app.style.setProperty('--u', String(Math.max(1, Math.min(1.7, W / 1300, H / 950)).toFixed(3)));
    app.style.setProperty('--dku', String(Math.max(1, Math.min(1.35, W / 1700, H / 1100)).toFixed(3)));
    var old = app.querySelector(':scope > .dk-room'); if (old) old.remove();
    var over = V.phase === 'over', log = over ? [] : (V.log || []), room = null;
    // (a low wide window gives the hive the whole column: the cards so far are on the results at the end)
    if (plan === 'wide' && H < 760) log = [];
    if (plan === 'wide' && !over) {
      // the hive is the hero: a column of its own as tall as the window, its bees sized from that column
      var d = V.depth || 6, rh = H - 80, rw = Math.round(Math.max(380, Math.min(W * 0.42, 1100)));
      var nb = Math.min(8, V.players.length), hbz = Math.max(40, Math.min(110, (rh * (log.length ? 0.62 : 0.9) - 60) / (d + 0.9) - 22, (rw - 120) / (nb * 1.45 + 1.6)));
      app.style.setProperty('--rw', rw + 'px'); app.style.setProperty('--hbz', Math.round(hbz) + 'px');
      room = el('aside', { class: 'dk-room' });
      var hv = ta.querySelector('.hive'); if (hv) { room.appendChild(el('section', { class: 'dk-pn hvp' }, [hv])); app.classList.add('nohv'); }
    } else {
      // (the hive at the table's head, its bees as large as a share of the window's height allows)
      var d2 = V.depth || 6;
      if (plan === 'stack' && log.length) room = el('aside', { class: 'dk-room' });
    }
    app.style.setProperty('--rh', Math.round(Math.max(200, Math.min(520, (H - 60) * .3))) + 'px');
    if (room && log.length) room.appendChild(logPanel(log));
    if (room) { if (plan === 'wide') app.insertBefore(room, ta); else app.appendChild(room); }
    var tw = ta.clientWidth, th = ta.clientHeight;
    app.classList.add(tw >= th * 1.05 && tw >= 760 ? 't-row' : 't-col');
    if (plan !== 'wide') {
      // (the hive at the table's head, or beside the rest of the table in a wide one: its bees as large as that room allows)
      var row = app.classList.contains('t-row'), nb2 = Math.min(8, V.players.length) * 1.45 + 1.6, dd = (V.depth || 6) + 0.9;
      var hb = row ? Math.min((th * 0.86) / dd - 22, (tw * 0.42 - 60) / nb2) : Math.min((th * (plan === 'small' ? 0.3 : 0.38)) / dd - 22, (tw * 0.8) / nb2);
      app.style.setProperty('--hbz', Math.round(Math.max(plan === 'small' ? 16 : 28, Math.min(100, hb))) + 'px');
    }
    if (over) deskFin(ta);
    if (room) fitLog(room);
  }
  function logPanel(log) {
    var box = el('div', { class: 'dk-log' });
    for (var k = log.length - 1; k >= 0; k--) {
      var l = log[k], tops = el('div', { class: 'tops' });
      (l.top || []).forEach(function (t) { tops.appendChild(el('span', null, [el('span', { text: t.t }), el('i', { text: String(t.c) })])); });
      box.appendChild(el('div', { class: 'dk-rd' }, [el('div', { class: 'rq' }, [el('b', { text: String(k + 1) }), el('span', { text: l.q }), l.roll != null ? el('span', { class: 'faces lf', title: 'The die' }, [faceEl(l.roll)]) : null]),
        (l.top || []).length ? tops : el('div', { class: 'none', text: 'Nobody matched on this question.' })]));
    }
    return el('section', { class: 'dk-pn lg' }, [el('h4', { text: log.length === 1 ? 'The question so far' : 'The ' + log.length + ' questions so far' }), box]);
  }
  // (a list longer than its panel gives up its oldest cards whole and says how many)
  function fitLog(room) {
    var box = room.querySelector('.dk-log'); if (!box) return;
    // (it can be fitted again after a redraw: the cards it already gave up are counted on the list)
    var gone = +(box.dataset.gone || 0), more = box.querySelector('.dk-more');
    while (box.querySelectorAll('.dk-rd').length > 1 && box.scrollHeight > box.clientHeight + 1) {
      if (more) more.remove();
      var rds = box.querySelectorAll('.dk-rd'); rds[rds.length - 1].remove(); gone++; box.dataset.gone = gone;
      more = el('div', { class: 'dk-more', text: gone === 1 ? 'One earlier question is in the results at the end.' : gone + ' earlier questions are in the results at the end.' });
      box.appendChild(more);
    }
  }
  // (the end: the hive, who stayed in and the buttons in one column, every card in the other)
  function deskFin(ta) {
    var fin = ta.querySelector('.fin'); if (!fin || fin.classList.contains('dk-fin')) return;
    var a = el('div', { class: 'fa' }), b = el('div', { class: 'fb' });
    Array.prototype.slice.call(fin.children).forEach(function (c) {
      if (c.tagName === 'H2') return;
      if (c.classList.contains('row') || c.classList.contains('acts') || c.classList.contains('hive') || c.classList.contains('endsay')) a.appendChild(c); else b.appendChild(c);
    });
    fin.classList.add('dk-fin'); fin.appendChild(a); fin.appendChild(b);
  }
  var dkRaf = 0;
  window.addEventListener('resize', function () {
    if (dkRaf) return;
    dkRaf = requestAnimationFrame(function () {
      dkRaf = 0;
      if (!lastV || app.classList.contains('stage') || !app.querySelector(':scope > .ta')) return;
      var plan = deskPlan();
      // (a phone or tablet turned: the hive and the table glide to the new shape)
      var go = function () { ui.sig = ''; render(lastV); };
      if (plan !== DK || !plan) Kit.glide(go); else go();
    });
  });

  // ═══ Test hooks ══════════════════════════════════════════════════════════
  window.__ta = {
    state: function () { return G; }, view: function () { return lastV; }, net: net, ui: ui, pp: pp, core: C,
    norm: C.norm, keyOf: C.keyOf, cpuWrite: C.cpuWrite, groupsOf: C.groupsOf, data: DATA,
    act: function (a) { return doAct(a); }, draft: function (a) { draft = a.slice(); }, kick: function () { changed(); },
    shake: function () { if (lastV && lastV.phase === 'scored') { clearTimeout(ui.shakeT); ui.shakeT = 0; movePawns(lastV); } },
    roll: function (f) { if (f != null) ui.forceRoll = f; rollDie(); }, choose: function (c) { choose(c); }, own: function (q, n) { ui.ownQ = q; ui.ownN = n || 3; askOwn(); },
    host: function (n) { return hostTable(n || 'Tim'); }, join: function (c, n) { return joinTable(c, n || 'Sam'); }, start: function () { return hostStart(); }, lobby: goLobby,
    local: function (cfg) { startLocal(cfg); }, setup: showSetup, submit: submit
  };

  // ═══ Boot ════════════════════════════════════════════════════════════════
  (function () {
    var saved = lsGet(SAVE, null);
    if (/[?&]online=1/.test(location.search)) { goLobby(); return; }
    if (saved && saved.G && saved.G.players && saved.G.phase && saved.G.phase !== 'over' && saved.G.mode !== 'online') {
      var g = saved.G, ok = g.v === 3 && g.hm === 2 && Array.isArray(g.deck);
      // a game from before the rulebook's rules (Mind Meld's, or Hive Mind's first version) can't go on: it's set aside
      if (!ok) { clearSave(); showSetup(); Kit.toast('Your earlier game was set aside. Hive Mind follows the rulebook now.'); return; }
      // the cards are found again by what they say, in case the card list has changed since
      var cx = saved.cx || {}, find = function (i) { var t = cx[i]; if (t == null || cardKey(i) === t) return CARDS[i] ? i : -1; for (var j = 0; j < CARDS.length; j++) if (cardKey(j) === t) return j; return -1; };
      if (g.card != null) g.card = find(g.card);
      g.used = (g.used || []).map(find).filter(function (i) { return i >= 0; });
      g.deck = g.deck.map(function (i) { return cx[i] != null ? find(i) : i; }).filter(function (i) { return i >= 0 && i < CARDS.length; });
      if (g.pi != null && g.pi >= 0 && saved.px != null && (!DATA[g.pi] || DATA[g.pi].q !== saved.px)) { g.pi = -2; for (var j = 0; j < DATA.length; j++) if (DATA[j].q === saved.px) { g.pi = j; break; } }
      if (g.card !== -1 && g.pi !== -2) {
        G = g; lastCfg = saved.cfg || null; screen = 'game'; pp.viewer = -1;
        changed();
        return;
      }
      clearSave();
    }
    showSetup();
  })();
})();
</script>

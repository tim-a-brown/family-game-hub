<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d12">
<title>Tic-Tac-Toe</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
:root{--X:#5ac8fa;--O:#ff6b6b;--T:#c084fc;--gw:min(100vw - 32px,460px);}
.site-nav button.icon-btn{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;display:inline-grid;place-items:center;}
.icon-btn svg{width:18px;height:18px;}
.gk{width:var(--gw);max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.gk .tabs{margin:0;}
.gk .tabs .tab{padding:0 8px;font-size:.82rem;flex:1 1 auto;min-height:40px;}
.subtabs{display:flex;align-items:center;gap:10px;justify-content:center;}
.subtabs .lbl{font-size:.8rem;font-weight:600;color:var(--text-3);}
.subtabs .tabs{flex:0 1 220px;}
.subtabs .tab{min-height:36px;}

/* Score tiles */
.score-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.sc{position:relative;min-height:66px;padding:8px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:border-color .25s var(--ease),background .25s,box-shadow .25s;}
.sc.on{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,transparent),transparent),var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 12%,transparent);}
.sc-lbl{font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.sc-val{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--c,var(--text));}
.sc-sub{font-size:.7rem;font-weight:600;color:var(--text-3);}
.pips{font-size:.7rem;letter-spacing:2px;color:var(--c);}

.status-bar{text-align:center;font-size:.95rem;font-weight:600;color:var(--text-2);min-height:24px;}
.status-bar b{color:var(--text);}
.result-area:empty{display:none;}
.winner-banner{margin:0;padding:16px;}
.winner-banner .btn{margin-top:12px;}

/* Marks */
.mk{width:62%;height:62%;overflow:visible;}
.mk *{fill:none;stroke:currentColor;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;}
.new .mk *{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .28s var(--ease) forwards;}
.new .mk .l2{animation-delay:.12s;}
@keyframes draw{to{stroke-dashoffset:0;}}
.X{color:var(--X);} .O{color:var(--O);} .T{color:var(--T);}

/* Classic board */
.classic-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,340px);margin:0 auto;}
.c-cell{aspect-ratio:1;border-radius:20px;background:var(--surface-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .12s var(--ease),border-color .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 4px 14px rgba(0,0,0,.25);}
.c-cell:not(.taken):active{transform:scale(.95);background:var(--surface-3);}
@media (hover:hover){.c-cell:not(.taken):hover{background:var(--surface-3);}}
.c-cell.taken{cursor:default;}
.c-cell.win{background:rgba(245,200,66,.14);border-color:rgba(245,200,66,.6);color:var(--gold);}
.c-cell.dim{opacity:.45;}
.classic-board.locked .c-cell{cursor:default;}

/* Mini boards (multi-board & 3 players) */
.mb-container{display:grid;gap:10px;justify-content:center;}
.mb-board{min-width:0;}
.mb-board-lbl{text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;color:var(--text-3);}
.mb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line-2);transition:border-color .2s,box-shadow .2s,opacity .2s;}
.mb-board.active .mb-grid{border-color:rgba(245,200,66,.45);box-shadow:0 0 0 3px rgba(245,200,66,.08);}
.mb-board.won-X .mb-grid{border-color:color-mix(in srgb,var(--X) 60%,transparent);}
.mb-board.won-O .mb-grid{border-color:color-mix(in srgb,var(--O) 60%,transparent);}
.mb-board.won-T .mb-grid{border-color:color-mix(in srgb,var(--T) 60%,transparent);}
.mb-board.done .mb-grid{opacity:.6;}
.mb-cell{aspect-ratio:1;min-height:32px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .1s;}
.mb-cell:not(.taken):active{background:var(--surface-3);}
.mb-cell.taken{cursor:default;}
.mb-cell.win-cell{background:rgba(245,200,66,.16);}
.mb-cell .mk{width:66%;height:66%;}
.mb-cell .mk *{stroke-width:14;}
.mb-board-result{text-align:center;font-size:.75rem;font-weight:700;margin-top:6px;min-height:20px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a>
  <span class="nav-title">Tic-Tac-Toe</span>
  <button class="icon-btn" id="new-btn" aria-label="New game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</nav>
<div class="page">
<div class="gk">
  <div class="tabs" role="tablist" id="mode-tabs">
    <button class="tab mode-btn active" data-mode="ai">vs AI</button>
    <button class="tab mode-btn" data-mode="2p">2 Players</button>
    <button class="tab mode-btn" data-mode="ult">Multi-Board</button>
    <button class="tab mode-btn" data-mode="3p">3 Players</button>
  </div>

  <div class="score-row" id="score-row"></div>
  <div class="status-bar" id="status"></div>
  <div class="result-area" id="result-area"></div>

  <div id="classic-area"><div class="classic-board" id="classic-board"></div></div>
  <div id="ult-area" class="hidden">
    <div class="subtabs">
      <span class="lbl">Boards</span>
      <div class="tabs">
        <button class="tab ult-cnt" data-n="2">2</button>
        <button class="tab ult-cnt active" data-n="3">3</button>
        <button class="tab ult-cnt" data-n="4">4</button>
        <button class="tab ult-cnt" data-n="5">5</button>
      </div>
    </div>
    <div class="ult-wrap" style="margin-top:12px">
      <div id="ult-boards-container"></div>
    </div>
  </div>
  <div id="3p-area" class="hidden">
    <div id="three-boards"></div>
  </div>
</div>
</div><!-- /page -->
<script>
'use strict';
window.GN=window.GN||{haptic(){},toast(){},sheet(){return{close(){},el:document.createElement('div')};},confirm:()=>Promise.resolve(true)};

// ── Shared helpers ─────────────────────────────────────────────────────────
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function checkWin(b) {
  for (const line of WINS)
    if (b[line[0]] && b[line[0]] === b[line[1]] && b[line[0]] === b[line[2]])
      return { p: b[line[0]], line };
  return null;
}
function full(b) { return b.every(v => v); }

const COL = { X: 'var(--X)', O: 'var(--O)', T: 'var(--T)' };
const SYM = { X: 'X', O: 'O', T: '△' };
const MARK = {
  X: '<svg class="mk" viewBox="0 0 100 100"><line pathLength="1" x1="22" y1="22" x2="78" y2="78"/><line class="l2" pathLength="1" x1="78" y1="22" x2="22" y2="78"/></svg>',
  O: '<svg class="mk" viewBox="0 0 100 100"><circle pathLength="1" cx="50" cy="50" r="30" transform="rotate(-90 50 50)"/></svg>',
  T: '<svg class="mk" viewBox="0 0 100 100"><path pathLength="1" d="M50 18 L84 80 L16 80 Z"/></svg>'
};
let lastKey = null; // most recent cell, animated on render

function setStatus(h) { document.getElementById('status').innerHTML = h; }
function banner(title, sub='') {
  return `<div class="winner-banner"><div class="winner-name">${title}</div>${sub?`<div class="winner-pts">${sub}</div>`:''}
    <button class="btn btn-gold btn-block" onclick="playAgain()">Play again</button></div>`;
}
function showResult(h) { document.getElementById('result-area').innerHTML = h; }
function clearResult() { document.getElementById('result-area').innerHTML = ''; }
function tag(sym, txt) { return `<b style="color:${COL[sym]}">${txt}</b>`; }

// ── Mode manager ───────────────────────────────────────────────────────────
let MODE = 'ai';

function gameInProgress() {
  if (MODE === 'ai' || MODE === '2p') return !cOver && cB.some(v => v);
  if (MODE === 'ult') return !uOver && uBs.some(b => b.some(v => v));
  return !p3Over && p3B.some(b => b.some(v => v));
}
function syncModeTabs() {
  document.querySelectorAll('#mode-tabs .mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === MODE));
}
document.querySelectorAll('#mode-tabs .mode-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (btn.dataset.mode === MODE) return;
    if (gameInProgress() && !(await GN.confirm('The current game will end.', {title:'Switch mode?', ok:'Switch'}))) return;
    MODE = btn.dataset.mode;
    syncModeTabs();
    try{sessionStorage.removeItem('ttt');}catch(e){}
    GN.haptic('select');
    startMode();
  });
});
document.getElementById('new-btn').addEventListener('click', async () => {
  if (gameInProgress() && !(await GN.confirm('The current board will be cleared.', {title:'Start a new game?', ok:'New game'}))) return;
  playAgain();
});
function playAgain() { try{sessionStorage.removeItem('ttt');}catch(e){} startMode(); }

function showArea(id) {
  ['classic-area','ult-area','3p-area'].forEach(a => document.getElementById(a).classList.toggle('hidden', a !== id));
}
function startMode() {
  clearResult(); lastKey = null; clearTimeout(aiTimer);
  if (MODE === 'ai' || MODE === '2p') { showArea('classic-area'); initClassic(); }
  else if (MODE === 'ult') { showArea('ult-area'); initUlt(); }
  else { showArea('3p-area'); init3P(); }
}

// ══════════════════════════════════════════════════════════════════════════
// CLASSIC  (vs AI or 2P)
// ══════════════════════════════════════════════════════════════════════════
let cB = Array(9).fill(''), cCur = 'X', cOver = false, cSc = {X:0, O:0, D:0}, aiTimer = null;

function initClassic() {
  cB = Array(9).fill(''); cCur = 'X'; cOver = false;
  renderClassic();
}
function classicStatus() {
  if (cOver) return;
  if (MODE === 'ai') setStatus(cCur === 'X' ? `<b>Your turn</b> · you're ${tag('X','X')}` : 'Computer is thinking…');
  else setStatus(`${tag(cCur, cCur === 'X' ? 'Player 1' : 'Player 2')} · ${cCur}'s turn`);
}
function renderClassic(wl) { renderCSc(); renderCBoard(wl || []); classicStatus(); }

function renderCSc() {
  const ai = MODE === 'ai';
  document.getElementById('score-row').innerHTML =
    scChip('X', ai ? 'You · X' : 'Player 1 · X', cSc.X, '', !cOver && cCur === 'X') +
    scChip('', 'Draws', cSc.D) +
    scChip('O', ai ? 'Computer · O' : 'Player 2 · O', cSc.O, '', !cOver && cCur === 'O');
}

function renderCBoard(wl=[]) {
  const el = document.getElementById('classic-board'); el.innerHTML = '';
  el.classList.toggle('locked', cOver || (MODE === 'ai' && cCur === 'O'));
  cB.forEach((v,i) => {
    const d = document.createElement('div');
    d.className = 'c-cell' + (v ? ' taken ' + v : '') + (wl.includes(i) ? ' win' : '') + (wl.length && !wl.includes(i) ? ' dim' : '') + (lastKey === 'c' + i ? ' new' : '');
    d.innerHTML = v ? MARK[v] : '';
    if (!v && !cOver) d.addEventListener('click', () => {
      if (MODE === 'ai' && cCur === 'O') return; // wait for the computer
      cMove(i);
    });
    el.appendChild(d);
  });
}

function cMove(i) {
  if (cB[i] || cOver) return;
  cCur==='X'?sX():sO();
  GN.haptic('light');
  cB[i] = cCur; lastKey = 'c' + i;
  const w = checkWin(cB);
  if (w) {
    cOver = true; cSc[cCur]++;
    renderClassic(w.line);
    const lost = MODE === 'ai' && cCur === 'O';
    lost ? sLose() : sWin();
    GN.haptic(lost ? 'error' : 'success');
    const lbl = MODE==='ai' ? (cCur==='X'?'You win! 🎉':'Computer wins') : `${cCur === 'X' ? 'Player 1' : 'Player 2'} wins! 🎉`;
    setStatus(''); showResult(banner(lbl, MODE === 'ai' && lost ? 'Unbeatable… for now.' : `Three ${cCur}s in a row`)); return;
  }
  if (full(cB)) {
    cOver = true; cSc.D++; renderClassic();
    sDraw2(); GN.haptic('medium'); setStatus(''); showResult(banner("It's a draw", 'Nobody got three in a row')); return;
  }
  cCur = cCur==='X' ? 'O' : 'X';
  renderClassic();
  if (MODE==='ai' && cCur==='O') aiTimer = setTimeout(aiMove, 420);
}

function aiMove() {
  if (cOver || MODE !== 'ai' || cCur !== 'O') return;
  let best=-Infinity, bi=-1;
  for (let i=0;i<9;i++) {
    if (!cB[i]) {
      cB[i]='O'; const s=mmx(cB,false); cB[i]='';
      if (s>best){best=s;bi=i;}
    }
  }
  cMove(bi);
}
function mmx(b,mx) {
  const w=checkWin(b); if(w) return w.p==='O'?10:-10;
  if(full(b)) return 0;
  let best=mx?-Infinity:Infinity;
  for(let i=0;i<9;i++) if(!b[i]){b[i]=mx?'O':'X';const s=mmx(b,!mx);b[i]='';best=mx?Math.max(best,s):Math.min(best,s);}
  return best;
}

// ══════════════════════════════════════════════════════════════════════════
// 2P FREE-CHOICE MULTI-BOARD
// ══════════════════════════════════════════════════════════════════════════
// Any number of boards (default 3). On your turn, click any empty cell on
// any unfinished board. Win the most boards to win the match.
let uBoardCount = 3;
let uBs = [], uMeta = [], uCur = 'X', uOver = false, uSc = {X:0, O:0, D:0};

// Board count selector
document.querySelectorAll('.ult-cnt').forEach(b => {
  b.addEventListener('click', async () => {
    const n = +b.dataset.n;
    if (n === uBoardCount) return;
    if (gameInProgress() && !(await GN.confirm('Changing the number of boards starts a new match.', {title:'Start over?', ok:'Start over'}))) return;
    uBoardCount = n;
    document.querySelectorAll('.ult-cnt').forEach(x => x.classList.toggle('active', x === b));
    GN.haptic('select');
    if (MODE === 'ult') { clearResult(); initUlt(); }
  });
});

function initUlt() {
  uBs   = Array.from({length: uBoardCount}, () => Array(9).fill(''));
  uMeta = Array(uBoardCount).fill(''); // '' | 'X' | 'O' | 'D'
  uCur  = 'X'; uOver = false;
  renderUltSc(); renderUlt();
  setStatus(`${tag('X','Player 1')} goes first — play on any board`);
}

function renderUltSc() {
  const xW = uMeta.filter(v=>v==='X').length;
  const oW = uMeta.filter(v=>v==='O').length;
  document.getElementById('score-row').innerHTML =
    scChip('X', 'Player 1 · X', uSc.X, `${xW} board${xW!==1?'s':''}`, !uOver && uCur === 'X') +
    scChip('', 'Draws', uSc.D) +
    scChip('O', 'Player 2 · O', uSc.O, `${oW} board${oW!==1?'s':''}`, !uOver && uCur === 'O');
}

function boardGridCols(n) { return n === 4 ? 2 : Math.min(n, 3); }

function renderMiniBoards(container, boards, metas, over, labelFor, onPlay, keyPrefix) {
  container.innerHTML = '';
  const n = boards.length, cols = boardGridCols(n);
  const wrap = document.createElement('div');
  wrap.className = 'mb-container';
  const colW = cols === 2 && n === 2 ? 'minmax(0,170px)' : cols === 2 ? 'minmax(0,160px)' : 'minmax(0,1fr)';
  wrap.style.gridTemplateColumns = `repeat(${cols}, ${colW})`;
  boards.forEach((mb, bi) => {
    const meta = metas[bi];
    const done = !!meta;
    const canPlay = !over && !done;
    const boardEl = document.createElement('div');
    boardEl.className = 'mb-board' + (canPlay ? ' active' : '') + (meta && meta !== 'D' ? ' won-' + meta : '') + (done ? ' done' : '');

    const lbl = document.createElement('div');
    lbl.className = 'mb-board-lbl';
    lbl.style.color = meta && meta !== 'D' ? COL[meta] : '';
    lbl.textContent = `Board ${bi+1}`;
    boardEl.appendChild(lbl);

    const grid = document.createElement('div');
    grid.className = 'mb-grid';
    const lr = checkWin(mb);
    mb.forEach((v, ci) => {
      const cell = document.createElement('div');
      cell.className = 'mb-cell' + (v ? ' taken ' + v : '') + (lr && lr.line.includes(ci) ? ' win-cell' : '') + (lastKey === keyPrefix + bi + '-' + ci ? ' new' : '');
      cell.innerHTML = v ? MARK[v] : '';
      if (!v && canPlay) cell.addEventListener('click', () => onPlay(bi, ci));
      grid.appendChild(cell);
    });
    boardEl.appendChild(grid);

    const tagEl = document.createElement('div');
    tagEl.className = 'mb-board-result';
    if (meta === 'D') { tagEl.style.color = 'var(--text-3)'; tagEl.textContent = 'Draw'; }
    else if (meta) { tagEl.style.color = COL[meta]; tagEl.textContent = labelFor(meta) + ' ✓'; }
    boardEl.appendChild(tagEl);
    wrap.appendChild(boardEl);
  });
  // 5 boards: center the second row by using a 6-col track
  if (n === 5) {
    wrap.style.gridTemplateColumns = 'repeat(6, minmax(0,1fr))';
    [...wrap.children].forEach((c, i) => { c.style.gridColumn = i < 3 ? `${i*2+1} / span 2` : `${(i-3)*2+2} / span 2`; });
  }
  container.appendChild(wrap);
}

function renderUlt() {
  renderMiniBoards(document.getElementById('ult-boards-container'), uBs, uMeta, uOver,
    m => m === 'X' ? 'X wins' : 'O wins', ultMove, 'u');
}

function ultMove(bi, ci) {
  if (uOver || uMeta[bi] || uBs[bi][ci]) return;
  uBs[bi][ci] = uCur; lastKey = 'u' + bi + '-' + ci;
  uCur==='X'?sX():sO(); GN.haptic('light');

  const lr = checkWin(uBs[bi]);
  if (lr)                { uMeta[bi] = uCur; sDing(784); GN.haptic('medium'); }
  else if (full(uBs[bi])) uMeta[bi] = 'D';

  // Tally
  const xW = uMeta.filter(v=>v==='X').length;
  const oW = uMeta.filter(v=>v==='O').length;
  const allDone = uMeta.every(v => v);
  const need = Math.ceil((uBoardCount + 1) / 2); // boards needed to guarantee win

  if (xW >= need || oW >= need || allDone) {
    uOver = true;
    renderUltSc(); renderUlt(); setStatus('');
    if (xW > oW)      { uSc.X++; renderUltSc(); sWin(); GN.haptic('success'); showResult(banner('Player 1 wins! 🏆', `X won ${xW} of ${uBoardCount} boards`)); }
    else if (oW > xW) { uSc.O++; renderUltSc(); sWin(); GN.haptic('success'); showResult(banner('Player 2 wins! 🏆', `O won ${oW} of ${uBoardCount} boards`)); }
    else              { uSc.D++; renderUltSc(); sDraw2(); GN.haptic('medium'); showResult(banner("It's a draw", `${xW} board${xW!==1?'s':''} each`)); }
    return;
  }

  uCur = uCur === 'X' ? 'O' : 'X';
  renderUltSc(); renderUlt();
  setStatus(`${tag(uCur, uCur === 'X' ? 'Player 1' : 'Player 2')} · play on any open board`);
}

// ══════════════════════════════════════════════════════════════════════════
// 3-PLAYER MULTI-BOARD
// ══════════════════════════════════════════════════════════════════════════
// 3 separate boards. X (P1) · O (P2) · △ (P3).
// On your turn, tap any open cell on any open board.
// First to win 2 boards wins outright. If all 3 boards finish, most boards wins.
const P3S = ['X','O','T'];
const P3N = ['Player 1','Player 2','Player 3'];

let p3B = [], p3M = [], p3Cur = 0, p3Over = false, p3Sc = [0,0,0];

function init3P() {
  p3B   = [Array(9).fill(''), Array(9).fill(''), Array(9).fill('')];
  p3M   = ['','',''];   // '' | 'X' | 'O' | 'T' | 'D'
  p3Cur = 0; p3Over = false;
  render3PSc(); render3PBoards(); set3PStatus();
}

function render3PSc() {
  document.getElementById('score-row').innerHTML = P3S.map((s,i) => {
    const bw = p3M.filter(v=>v===s).length;
    const active = !p3Over && p3Cur===i;
    return `<div class="sc${active?' on':''}" style="--c:${COL[s]}">
      <div class="sc-lbl">${P3N[i]} · ${SYM[s]}</div>
      <div class="sc-val">${p3Sc[i]}</div>
      <div class="pips">${'●'.repeat(bw)}${'○'.repeat(Math.max(0,2-bw))}</div>
    </div>`;
  }).join('');
}

function render3PBoards() {
  renderMiniBoards(document.getElementById('three-boards'), p3B, p3M, p3Over,
    m => P3N[P3S.indexOf(m)], play3P, 't');
}

function play3P(bi, ci) {
  if (p3Over || p3M[bi] || p3B[bi][ci]) return;
  const sym = P3S[p3Cur];
  p3B[bi][ci] = sym; lastKey = 't' + bi + '-' + ci;
  sClick(900 + p3Cur * 250); GN.haptic('light');

  const lr = checkWin(p3B[bi]);
  if (lr)             { p3M[bi] = sym; sDing(784); GN.haptic('medium'); }
  else if (full(p3B[bi])) p3M[bi] = 'D';

  // Instant win: any player wins 2 boards
  const wins = P3S.map(s => p3M.filter(v=>v===s).length);
  const iw = wins.findIndex(w=>w>=2);
  if (iw>=0) {
    p3Over=true; p3Sc[iw]++;
    render3PSc(); render3PBoards(); setStatus(''); sWin(); GN.haptic('success');
    showResult(banner(`${P3N[iw]} wins! 🏆`,`Won ${wins[iw]} of 3 boards`)); return;
  }
  // All boards done
  if (p3M.every(v=>v)) {
    p3Over=true;
    const maxW = Math.max(...wins);
    const wIs = wins.map((w,i)=>w===maxW?i:-1).filter(i=>i>=0);
    if (wIs.length===1) {
      p3Sc[wIs[0]]++; sWin(); GN.haptic('success');
      showResult(banner(`${P3N[wIs[0]]} wins! 🏆`,`Won ${maxW} of 3 boards`));
    } else {
      sDraw2(); GN.haptic('medium');
      showResult(banner("Tie game!",wIs.map(i=>P3N[i]).join(' & ')+` each won ${maxW} board${maxW!==1?'s':''}`));
    }
    render3PSc(); render3PBoards(); setStatus(''); return;
  }

  p3Cur = (p3Cur+1)%3;
  render3PSc(); render3PBoards(); set3PStatus();
}

function set3PStatus() {
  const s=P3S[p3Cur];
  setStatus(`${tag(s, P3N[p3Cur] + ' ' + SYM[s])} · tap any open board`);
}

// ── Utility ────────────────────────────────────────────────────────────────
function scChip(sym, label, val, sub='', on=false) {
  return `<div class="sc${on?' on':''}" style="--c:${sym?COL[sym]:'var(--text-2)'}">
    <div class="sc-lbl">${label}</div>
    <div class="sc-val">${val}</div>
    ${sub?`<div class="sc-sub">${sub}</div>`:''}
  </div>`;
}

// ── Sound ────────────────────────────────────────────────────────────────────
let _ac=null,_muted=false;
function sac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function sTone(freq,start,dur,vol,type,ramp){
  try{
  const ctx=sac(),t=ctx.currentTime+start,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(ramp)o.frequency.exponentialRampToValueAtTime(ramp,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.18,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function sNoise(start,dur,fc,q,vol,decay){
  try{
  const ctx=sac(),t=ctx.currentTime+start;
  const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*(decay||0.5)));
  const src=ctx.createBufferSource();src.buffer=buf;
  const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=fc||1000;filt.Q.value=q||2;
  const g=ctx.createGain();g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(filt);filt.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+dur+0.05);
  }catch(e){}
}
function sWin(){if(_muted)return;[523,659,784,1047].forEach((f,i)=>sTone(f,i*.08,.5,.2));}
function sLose(){if(_muted)return;[400,320,240].forEach((f,i)=>sTone(f,i*.1,.35,.18,'triangle'));}
function sClick(pitch){if(_muted)return;sNoise(0,.035,pitch||900,5,.15,.15);}
function sDing(freq,vol){if(_muted)return;sTone(freq||660,0,.35,vol||.18);}

function sX(){if(_muted)return;sNoise(0,.03,1400,7,.14,.1);}
function sO(){if(_muted)return;sTone(440,0,.12,.14,'triangle');}
function sDraw2(){if(_muted)return;[330,294,262].forEach((f,i)=>sTone(f,i*.07,.28,.13));}

// ── Boot ───────────────────────────────────────────────────────────────────
startMode();

// ── Session persistence ────────────────────────────────────────────────────
function _save_ttt(){if(cOver)return;
  try{sessionStorage.setItem('ttt',JSON.stringify({MODE,cB,cCur,cOver,cSc,_ts:Date.now()}));}catch(e){}
}
function _load_ttt(){
  try{
    const raw=sessionStorage.getItem('ttt');if(!raw)return false;
    const s=JSON.parse(raw);if(!s)return false;
    MODE=['ai','2p','ult','3p'].includes(s.MODE)?s.MODE:'ai';
    syncModeTabs();
    startMode();
    // Restore the saved classic board (startMode would otherwise reset it)
    cSc=s.cSc||{X:0,O:0,D:0};
    if(MODE==='ai'||MODE==='2p'){
      cB=Array.isArray(s.cB)?s.cB:Array(9).fill('');cCur=s.cCur||'X';cOver=s.cOver||false;
      renderClassic();
      if(MODE==='ai'&&cCur==='O'&&!cOver)aiTimer=setTimeout(aiMove,500);
    }
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_ttt);
window.addEventListener('pagehide',_save_ttt);
_load_ttt();
</script>

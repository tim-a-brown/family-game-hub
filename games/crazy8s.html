<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crazy Eights</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="crazy8s-core.js"></script>
<style>
/* the card backs: night blue with a gold lattice (the felt is the category's own shade, from games.js) */
:root{--back-a:#1d2a5c;--back-b:#c9a24a;}
.stage.c8-stage{max-width:none;margin:0;padding:0;}
/* ── The page is laid out to the screen: four shapes, set by layoutFor() ── */
.c8{position:relative;display:grid;gap:8px;box-sizing:border-box;width:100%;margin:0 auto;
  height:calc(100dvh - var(--bar,64px));padding:4px max(10px,var(--safe-l,0px)) max(calc(var(--safe-b) + 8px),18px) max(10px,var(--safe-r,0px));}
.c8.L-pu,.c8.L-tu{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"tbl" "side" "hand";}
.c8.L-tu{max-width:900px;padding-left:18px;padding-right:18px;gap:12px;}
/* sideways: what you look at (the other players, the piles) at the left, what you act with at the right */
.c8.L-ps{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"tbl side" "tbl hand";column-gap:12px;
  padding-left:calc(10px + var(--corner-x,0px));padding-right:calc(10px + var(--corner-x,0px));}
.c8.L-ts{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"tbl side" "hand hand";column-gap:16px;row-gap:10px;padding-left:18px;padding-right:18px;}
.c8 > .tbl{grid-area:tbl;min-height:0;min-width:0;}
.c8 > .side{grid-area:side;min-width:0;}
.c8 > .c8h{grid-area:hand;min-width:0;min-height:0;}

/* ── The table ── */
.tbl{position:relative;border-radius:26px;padding:8px;display:flex;}
.tbl .felt-in{--pw:clamp(54px,min(21cqw,24cqh),130px);position:relative;flex:1;border-radius:19px;overflow:hidden;container-type:size;}
.tbl .wm{position:absolute;left:50%;top:56%;translate:-50% -50%;font-size:min(60cqw,52cqh);line-height:1;color:#fff;opacity:.05;pointer-events:none;font-family:Georgia,serif;transition:opacity .6s,color .6s;}
.tbl .wm.red{color:#ffb3b3;opacity:.08;}
/* the other players round the far side of the table, in the order they play (the next one at your left) */
.st{position:absolute;z-index:4;display:flex;flex-direction:column;align-items:center;gap:calc(3px * var(--sz,1));translate:-50% -50%;width:calc(86px * var(--sz,1));}
.st .bk{position:relative;display:flex;justify-content:center;height:calc(var(--bw) * 1.4);--bw:calc(26px * var(--sz,1));--cw:var(--bw);}
.st .bk .pcard{transition:none;}
.st .bk .pcard + .pcard{margin-left:calc(var(--bw) * -.72);}
.st .bk .n{position:absolute;right:calc(-8px * var(--sz,1));bottom:calc(-6px * var(--sz,1));min-width:calc(22px * var(--sz,1));height:calc(22px * var(--sz,1));padding:0 5px;box-sizing:border-box;border-radius:999px;display:grid;place-items:center;
  background:var(--plate-bg);color:#fff;font-weight:800;font-size:calc(.78rem * var(--sz,1));font-variant-numeric:tabular-nums;box-shadow:var(--plate-line),0 2px 6px rgba(0,0,0,.35);z-index:2;}
.st .tg{display:flex;flex-direction:column;align-items:center;gap:2px;max-width:100%;}
.st .tg .avatar{width:calc(30px * var(--sz,1));height:calc(30px * var(--sz,1));font-size:calc(.8rem * var(--sz,1));transition:box-shadow .3s;}
.st .tg .nm{max-width:100%;padding:1px 8px;border-radius:9px;background:var(--plate-bg);box-shadow:var(--plate-line);color:#fff;font-weight:700;font-size:calc(.76rem * var(--sz,1));line-height:1.35;text-align:center;overflow-wrap:anywhere;}
.st .sc{font-size:calc(.72rem * var(--sz,1));font-weight:800;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;}
.st.turn .tg .avatar{box-shadow:0 0 0 2.5px var(--lit),0 0 16px var(--litg);}
.st.turn .tg .nm{box-shadow:inset 0 0 0 1px rgba(255,211,77,.7),0 0 12px var(--litg);color:var(--lit-ink,#ffe28a);}
/* down to one card: the seat glows */
.st.one .bk::after,.me.one .av::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,120,80,.55),rgba(255,120,80,0));animation:c8glow 1.1s ease-in-out infinite alternate;z-index:-1;pointer-events:none;}
@keyframes c8glow{from{opacity:.45;transform:scale(.9);}to{opacity:1;transform:scale(1.12);}}
.st.one .tg .nm::after{content:"";}
.st .say,.me .say{position:absolute;left:50%;top:100%;translate:-50% 4px;z-index:9;padding:4px 11px;border-radius:12px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-weight:800;font-size:.82rem;white-space:nowrap;box-shadow:var(--plate-line),0 4px 12px rgba(0,0,0,.35);animation:c8pop .35s var(--spring);pointer-events:none;}
.st .say.gold,.me .say.gold{color:#2a1c00;background:linear-gradient(180deg,var(--gold-hi,#ffe486),var(--gold-lo,#f6b93b));}
.st .say.hot,.me .say.hot{background:linear-gradient(180deg,#ff8a6a,#e0453a);}
.me .say{top:auto;bottom:100%;translate:-50% -6px;}
.st.skip .tg{animation:c8skip .7s;}
@keyframes c8skip{30%{translate:0 -4px;opacity:.4;}100%{translate:0;opacity:1;}}
@keyframes c8pop{from{scale:.6;opacity:0;}to{scale:1;opacity:1;}}

/* the stock and the discard pile, side by side in the middle */
.ctr{position:absolute;left:50%;top:var(--cy,58%);translate:-50% -50%;display:flex;align-items:center;gap:calc(var(--pw) * .32);z-index:2;}
.stock{position:relative;width:var(--pw);height:calc(var(--pw) * 1.4);border:0;padding:0;background:none;cursor:pointer;border-radius:calc(var(--pw) * .1);--cw:var(--pw);-webkit-tap-highlight-color:transparent;}
.stock .pcard{position:absolute;left:0;top:0;transition:none;}
.stock .cnt{position:absolute;left:50%;bottom:calc(var(--pw) * .1);translate:-50% 0;z-index:2;padding:1px 9px;border-radius:999px;background:var(--plate-bg);box-shadow:var(--plate-line);color:#fff;font-weight:800;font-size:.74rem;font-variant-numeric:tabular-nums;white-space:nowrap;}
.stock.go{animation:c8breathe 1.6s ease-in-out infinite;}
.stock.go .pcard:last-of-type{box-shadow:0 0 0 2.5px var(--lit),0 0 22px var(--litg),0 6px 14px rgba(0,0,0,.3);}
.stock:active{transform:translateY(2px);}
.stock.none{opacity:.35;cursor:default;}
@keyframes c8breathe{50%{transform:translateY(-3px);}}
.stock .pend{position:absolute;right:calc(var(--pw) * -.24);top:calc(var(--pw) * -.2);z-index:3;min-width:calc(var(--pw) * .5);height:calc(var(--pw) * .5);padding:0 .3em;box-sizing:border-box;border-radius:999px;display:grid;place-items:center;
  background:linear-gradient(180deg,#ff8a6a,#d83a30);color:#fff;font-family:var(--display);font-size:calc(var(--pw) * .26);box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 18px rgba(255,90,60,.7);animation:c8pop .4s var(--spring);}
.stock .pend.big{animation:c8pop .4s var(--spring),c8throb .9s ease-in-out .4s infinite;}
@keyframes c8throb{50%{scale:1.12;}}
.pile{position:relative;width:var(--pw);height:calc(var(--pw) * 1.4);--cw:var(--pw);}
.pile .pcard{position:absolute;left:0;top:0;transition:none;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 0 0 1px rgba(0,0,0,.1),0 3px 8px rgba(0,0,0,.35);}
.pile .pcard.top{box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 0 0 1px rgba(0,0,0,.1),0 8px 18px rgba(0,0,0,.45);}
.pile .pcard.land{animation:c8land .32s cubic-bezier(.3,1.4,.5,1);}
@keyframes c8land{0%{scale:1.08;}60%{scale:.97;}100%{scale:1;}}
/* the suit an 8 named: a tile beside the pile, in that suit */
.suitb{position:absolute;right:calc(var(--pw) * -.2);top:calc(var(--pw) * -.2);z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;padding:calc(var(--pw) * .08) calc(var(--pw) * .1);border-radius:calc(var(--pw) * .14);
  background:#fffaf0;color:#1b1b22;box-shadow:0 0 0 2px var(--lit),0 0 18px var(--litg),0 6px 14px rgba(0,0,0,.35);font-family:Georgia,serif;}
.suitb b{font-size:calc(var(--pw) * .44);line-height:1;}
.suitb small{font-family:var(--font);font-size:max(.62rem,calc(var(--pw) * .12));font-weight:800;color:#3a3550;}
.suitb.red{color:#d81e3a;}
.suitb.pop{animation:c8pop .45s var(--spring);}
.suitb[hidden]{display:none;}
.msg{position:absolute;left:50%;top:calc(var(--cy,58%) + var(--pw,90px) * .7 + 16px);translate:-50% 0;max-width:86%;padding:5px 14px;border-radius:999px;background:var(--plate-bg);box-shadow:var(--plate-line);color:#fff;font-weight:700;font-size:.86rem;text-align:center;z-index:5;pointer-events:none;transition:opacity .3s;}
.msg[hidden]{display:none;}
.fly{position:fixed;z-index:60;pointer-events:none;margin:0;}

/* ── Your side: your name, score and what you can do ── */
.side{display:flex;align-items:center;gap:10px;min-height:56px;}
.c8.L-ps .side{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"me sort" "stat act";align-items:center;gap:8px 10px;min-height:0;padding-top:4px;}
.c8.L-ps .side > .me{grid-area:me;justify-self:start;} .c8.L-ps .side > .sortw{grid-area:sort;justify-self:end;align-self:center;} .c8.L-ps .side > .stat{grid-area:stat;} .c8.L-ps .side > .act{grid-area:act;}
.stat{display:none;color:#fff;font-weight:700;font-size:.92rem;line-height:1.3;min-height:2.6em;}
.stat small{display:block;color:rgba(255,255,255,.7);font-weight:600;font-size:.8rem;}
.c8.L-ps .stat{display:block;}
.c8.L-ps .msg{display:none;}
@media (max-height:440px){.c8.L-ps .side{grid-template-areas:"me act" "stat stat";gap:4px 8px;} .c8.L-ps .side > .sortw{display:none;} .c8.L-ps .stat{min-height:0;font-size:.84rem;} .c8.L-ps .me .av .avatar{width:28px;height:28px;} .c8.L-ps .act .btn{min-height:44px;padding-top:6px;padding-bottom:6px;}}
.c8.L-ts .side{flex-direction:column;align-items:stretch;justify-content:center;gap:14px;}
.me{position:relative;display:flex;align-items:center;gap:8px;flex:none;padding:4px 12px 4px 4px;border-radius:999px;background:var(--plate-bg);box-shadow:var(--plate-line);color:#fff;}
.me .av{position:relative;display:grid;}
.me .av .avatar{width:34px;height:34px;font-size:.9rem;transition:box-shadow .3s;}
.me.turn .av .avatar{box-shadow:0 0 0 2.5px var(--lit),0 0 16px var(--litg);}
.me .tx{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.me .tx b{font-size:.92rem;font-weight:800;}
.me .tx small{font-size:.74rem;font-weight:700;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums;}
.me.turn .tx small{color:var(--lit-ink,#ffe28a);}
.c8.L-ps .me,.c8.L-ts .me{align-self:flex-start;}
.act{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0;flex-wrap:wrap;}
.act .hint{flex:1 1 auto;min-width:0;color:#fff;font-weight:700;font-size:.92rem;line-height:1.25;}
.act .hint small{display:block;color:rgba(255,255,255,.7);font-weight:600;font-size:.8rem;}
.act .btn{min-height:46px;flex:none;}
.c8.L-ts .act{flex-direction:column;align-items:stretch;justify-content:flex-start;flex:none;}
.c8.L-ts .act .btn{width:100%;}
.c8.L-ps .act{flex:none;justify-content:flex-end;}
.act.nudge{animation:c8nudge .4s;}
@keyframes c8nudge{20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
/* the scores at a glance on an iPad held sideways */
.board{display:none;}
.c8.L-ts .board{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:16px;background:var(--gl,rgba(255,255,255,.06));box-shadow:inset 0 0 0 1px var(--gl-line,rgba(255,255,255,.1));color:#fff;}
.board .bh{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;color:rgba(255,255,255,.7);margin-bottom:2px;}
.board .br{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;}
.board .br i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);}
.board .br span{flex:1;min-width:0;overflow-wrap:anywhere;}
.board .br b{font-variant-numeric:tabular-nums;}
.board .br.lead b{color:var(--lit-ink,#ffe28a);}
.board .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin:0 0 4px 17px;}
.board .bar > i{display:block;height:100%;background:var(--c);border-radius:2px;transition:width .6s;}

/* ── Your hand: the cards you can play rise a little ── */
.c8h{position:relative;display:flex;justify-content:center;align-items:flex-end;padding:calc(var(--cw) * .2) 4px 2px;--cw:72px;}
.c8h > .pcard{margin-left:var(--ov,6px);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.c8h > .pcard:first-child{margin-left:0;}
.c8h > .pcard.ok{transform:translateY(calc(var(--cw) * -.16));box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 0 0 1.5px rgba(255,211,77,.85),0 10px 18px rgba(0,0,0,.35);}
.c8h.mine > .pcard.no{filter:brightness(.82) saturate(.85);}
.c8h > .pcard.ok:active{transform:translateY(calc(var(--cw) * -.1));}
.c8h > .pcard.fresh{animation:c8fresh 1.8s ease-out;}
@keyframes c8fresh{0%,40%{box-shadow:0 0 0 3px #7fe0ff,0 0 18px rgba(127,224,255,.7);}100%{}}
.c8h > .pcard.shake{animation:c8shake .38s;}
@keyframes c8shake{25%{translate:-5px 0;}50%{translate:5px 0;}75%{translate:-3px 0;}}
.sortw{flex:none;display:flex;align-items:center;}
.sortw[hidden]{display:none;}
.c8.L-ps .sortw,.c8.L-ts .sortw{align-self:flex-start;}
.msg small{display:block;font-weight:600;font-size:.78rem;color:rgba(255,255,255,.72);}
.c8.L-ps .c8h,.c8.L-ts .c8h{align-items:center;}

/* ── Naming the suit for an 8: four big tiles ── */
.pick{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(6,7,16,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:c8fade .2s;}
@keyframes c8fade{from{opacity:0;}}
.pick .pw{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;width:min(440px,94%);}
.pick h2{margin:0;color:#fff;font-size:1.25rem;text-align:center;}
.pick .g{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;}
.pick .t{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:clamp(96px,17dvh,150px);border:0;border-radius:22px;background:linear-gradient(170deg,#ffffff,#f3ecdc);color:#1b1b22;cursor:pointer;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 10px 22px rgba(0,0,0,.4);font-family:var(--font);transition:transform .15s;animation:c8pop .35s var(--spring) backwards;}
.pick .t:nth-child(2){animation-delay:.04s;} .pick .t:nth-child(3){animation-delay:.08s;} .pick .t:nth-child(4){animation-delay:.12s;}
.pick .t:active{transform:scale(.96);}
.pick .t b{font-family:Georgia,serif;font-size:clamp(46px,9dvh,78px);line-height:1;}
.pick .t.red b{color:#d81e3a;}
.pick .t span{font-weight:800;font-size:.95rem;}
.pick .t small{font-weight:700;font-size:.78rem;color:#5b5670;}
.pick .t.best{box-shadow:0 0 0 3px var(--lit),0 0 22px var(--litg),0 10px 22px rgba(0,0,0,.4);}
.pick .x{min-height:46px;}
.c8.L-ps .pick .g{grid-template-columns:repeat(4,1fr);} .c8.L-ps .pick .t{min-height:120px;} .c8.L-ps .pick .pw{width:min(620px,94%);}

/* ── The count at the end of a hand ── */
.cnt8{display:flex;flex-direction:column;gap:8px;}
.cnt8 .r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.cnt8 .r.w{background:rgba(255,211,77,.1);box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.6);}
.cnt8 .r .avatar{width:32px;height:32px;font-size:.85rem;}
.cnt8 .r .who{display:flex;flex-direction:column;min-width:0;line-height:1.2;}
.cnt8 .r .who b{font-size:.95rem;overflow-wrap:anywhere;}
.cnt8 .r .who small{font-size:.76rem;font-weight:700;color:rgba(255,255,255,.7);}
.cnt8 .r .pt{font-family:var(--display);font-size:1.45rem;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right;}
.cnt8 .r.w .pt{color:var(--lit-ink,#ffe28a);}
.cnt8 .r .cs{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:4px;--cw:30px;min-height:0;}
.cnt8 .r .cs:empty{display:none;}
.cnt8 .r .cs .pcard{animation:c8pop .3s var(--spring);}
.cnt8 .r .cs .pcard.e8{box-shadow:0 0 0 2px #ff7a5a,0 0 10px rgba(255,120,90,.6);}
.cnt8 .tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px;font-size:.84rem;font-weight:700;color:rgba(255,255,255,.75);}
.pad8{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.pad8 th,.pad8 td{padding:6px 5px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);font-size:.88rem;}
.pad8 th{font-size:.76rem;color:rgba(255,255,255,.75);overflow-wrap:anywhere;}
.pad8 td.z{color:rgba(255,255,255,.3);}
.pad8 td.w{color:var(--lit-ink,#ffe28a);font-weight:800;}
.pad8 tfoot td{font-weight:900;font-size:1rem;border-bottom:0;}
.pad8 tfoot td.lead{color:var(--lit-ink,#ffe28a);}
.pad8 th.rn{text-align:left;}
/* the setup on a phone held sideways stays the kit's two columns; a game's own sideways table waits for the game */
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var Core = window.C8Core, el = Kit.el, app = document.getElementById('app');
  var SAVE = 'crazy8s_state', HKEY = 'crazy8s';
  var GL = Core.GLYPH, SN = { s: 'Spades', h: 'Hearts', d: 'Diamonds', c: 'Clubs' };
  var RW = { A: 'ace', T: '10', J: 'jack', Q: 'queen', K: 'king' };

  Kit.init({
    id: 'crazy8s',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: 'Score pad', onClick: function () { if (S && S.players) showPad(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(HKEY, { title: 'Crazy Eights: past games' }); } }
    ]),
    rules:
      '<p class="goal">Be the first to play every card in your hand. When you do, you score the cards left in everyone else’s hands, and the first to reach the target score wins the game.</p>' +
      '<h3>The deal</h3><ul><li>One deck of 52 cards. With two players, each gets 7 cards. With three to seven, each gets 5.</li>' +
      '<li>The rest of the deck is the stock. Its top card is turned face up to start the discard pile. If that card is an 8, it goes back into the stock and the next card is turned up.</li>' +
      '<li>The player at the dealer’s left goes first, and play goes round to the left.</li></ul>' +
      '<h3>Your turn</h3><ul><li>Play a card on the discard pile that matches its <b>suit</b> or its <b>rank</b>. On the 7♥ you can play any heart or any 7.</li>' +
      '<li><b>8s are wild.</b> You can play an 8 on anything, and you name the suit the next player has to follow. They can match that suit or play another 8.</li>' +
      '<li>If you can’t play, you draw from the stock until you can (or, if you chose Draw one in the setup, you draw one card, play it if you can, and otherwise your turn is over). You may draw even when you could play.</li>' +
      '<li>When the stock runs out, the discard pile, all but its top card, is shuffled to make a new stock. If there is nothing left to draw and you can’t play, you pass.</li>' +
      '<li>When you are down to your last card, your seat glows so everyone can see.</li></ul>' +
      '<h3>Choices in the setup</h3><ul><li><b>2s make the next player draw two.</b> The next player takes two cards and misses their turn, unless they play a 2 of their own: then the player after them takes four, and so on up to eight.</li>' +
      '<li><b>The queen of spades skips</b> the next player.</li>' +

  function undo() {
    if (busy || VIEW) return Kit.toast('One moment');
    if (!undoStack.length) return Kit.toast('There’s nothing to take back');
    var back = JSON.parse(undoStack[undoStack.length - 1]);
    if (back.round !== S.round) { undoStack = []; return Kit.toast('A finished hand can’t be taken back'); }
    if ((back.me || 0) !== LME && !onePersonLocal()) return Kit.toast('Only your own last move can be taken back');
    undoStack.pop();
    token++; busy = false; closePick(); S = back; Kit.sfx('whoosh'); Kit.toast('Taken back'); save(); render(); next();
  }

  // ═══ Online (turnnet.js) ═══
  // The table holds the whole game in fixed seats; each device draws it from its own seat with only its own hand face
  // up. The rules and the computer players are the same as here.
  var NQ = [], NGEN = 0, NETREC = {}, NST = null, NWIN = null;
  function netOpts() {
    var g = {}; try { g = JSON.parse(localStorage.getItem('gn_setup_crazy8s')) || {}; } catch (e) {}
    var o = g.options || {};
    return { seats: Math.max(2, Math.min(7, +g.count || 2)), to: o.to == null ? 100 : +o.to, draw: o.draw === 'one' ? 'one' : 'until', twos: o.twos === 'on' ? 1 : 0, qs: o.qs === 'on' ? 1 : 0, level: Core.lv(o.level) };
  }
  function netStart(players, opts) {
    var st = Core.newGame({ players: players.map(function (x) { return { name: x.name, cpu: !!x.bot, level: x.bot ? opts.level : undefined }; }), target: opts.to, draw: opts.draw, twos: opts.twos, qs: opts.qs, level: opts.level });
    st.online = 1; return st;
  }
  function netTurn(st) { var p = Core.turn(st); return p < 0 ? [] : [p]; }
  function netOver(st) { return st && st.phase === 'over' ? { win: [st.winner], text: st.players[st.winner].name + ' wins ' + st.scores[st.winner] } : null; }
  function netBot(st, seat) { var a = Core.bot(st, seat); if (!a) return null; var mv = Core.apply(st, seat, a); return mv ? { state: st, mv: mv } : null; }
  function netShow(net, info) {
    NET = net;
    if (info.fresh || info.again) { NQ = []; NGEN++; busy = false; closeWin(); closeCount(); }
    NQ.push({ st: clone(net.state), prev: info.prev ? clone(info.prev) : null, mv: info.mv, info: info });
    if (net.state && net.state.phase === 'over') netRecord(clone(net.state));
    if (NQ.length > 8) NQ = NQ.slice(-1).map(function (x) { x.skip = true; return x; });
    if (!busy || NQ.length === 1 && !VIEW && !COUNT) netPump();
  }
  function closeWin() { if (NWIN) { try { NWIN.close(); } catch (e) {} NWIN = null; } }
  function closeCount() { if (COUNT) { try { COUNT.close(); } catch (e) {} COUNT = null; } VIEW = null; }
  var pumping = false;
  function netPump() {
    if (pumping) return;
    var it = NQ.shift(); if (!it) return;
    var g = NGEN; pumping = true; busy = true;
    netStep(it, function () { if (g !== NGEN) return; pumping = false; busy = false; if (NQ.length) netPump(); else if (NET && S) paint(); });
  }
  function netStep(it, done) {
    var st = it.st, prev = it.prev, mv = it.mv, info = it.info;
    MYSEAT = NET.seat;
    st.players.forEach(function (pl, p) { var s = NET.seats[p]; if (s) pl.cpu = !!s.bot; });
    NST = st; token++; closePick();
    if (!mv || !prev || info.fresh || info.again || it.skip) {
      S = st; VIEW = null; build(); render();
      if (info.again) { Kit.gameStart(); Kit.callout('New game'); }
      else if (info.fresh) Kit.gameStart();
      if (st.phase === 'over') { setTimeout(function () { if (NET) netEnd(); }, 400); done(); return; }
      if (info.fresh || info.again) { dealIn(done); return; }
      done(); return;
    }
    prev.players = st.players;
    S = prev; VIEW = null;
    var ok = Core.turn(prev) === mv.p;
    if (!ok) { S = st; render(); done(); return; }
    S = st;
    step(prev, mv, function () { if (st.phase === 'over' && mv.end) { render(); netEnd(); } done(); });
  }
  function netRecord(st) {
    if (!NET || !st || st.phase !== 'over' || NET.seat < 0) return;
    var key = NET.code + ':' + st.started, list = [];
    try { list = JSON.parse(localStorage.getItem('crazy8s_netrec')) || []; } catch (e) {}
    if (NETREC[key] || list.indexOf(key) >= 0) return;
    NETREC[key] = 1;
    try { localStorage.setItem('crazy8s_netrec', JSON.stringify(list.concat([key]).slice(-20))); } catch (e) {}
    recordGame(st, 'Online', ['Played online at table ' + NET.code + '.']);
  }
  function netEnd() {
    if (!NET || !NST || NST.phase !== 'over') return;
    var st = NST, w = st.winner, res = NET.result, left = res && res.left != null, watching = MYSEAT < 0, won = !watching && w === MYSEAT;
    netRecord(st);
    var rank = st.players.map(function (p, i) { return i; }).sort(function (a, b) { return st.scores[b] - st.scores[a]; });
    closeWin(); S = st;
    NWIN = Kit.win({
      title: left ? res.text : won ? 'You win!' : fn(w) + ' wins!',
      sub: st.hx.length > 1 ? 'Won by ' + (st.scores[w] - st.scores[rank[1]]) + ' · ' + st.hx.length + ' hands' : (won ? 'You went out first.' : fn(w) + ' went out first.'),
      rank: rank.map(function (i) { return { name: st.players[i].name, score: st.scores[i], color: Kit.color(i), cpu: st.players[i].cpu, me: !watching && i === MYSEAT }; }),
      lose: !won, icon: won ? 'trophy' : 'users',
      againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { if (left) { TurnNet.leave(); TurnNet.open(); } else NET.again(); },
      look: 'Look at the table',
      extra: st.hx.length > 1 ? [{ label: 'Score pad', onClick: function () { showPad(); } }] : null,
      closeLabel: 'Back to games'
    });
  }
  function netLeave() { NET = null; NST = null; NQ = []; NGEN++; busy = false; pumping = false; token++; closeWin(); closeCount(); MYSEAT = 0; resumeLocal(true); }

  // ── Boot ──
  function resumeLocal(back) {
    var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (saved && saved.v === 1 && saved.players && saved.hands && saved.phase !== 'over') {
      S = saved; VIEW = null; LME = S.me || 0; BLIND = false; Kit.gameStart();
      if (back) save();
      build(); render();
      // a hand that ended just before the page closed: its count first
      if (S.last && (S.seen || 0) < S.last.round) {
        busy = true; var t = token;
        countSheet(S.last, false, function () { if (t !== token) return; busy = false; next(); });
        return;
      }
      if (!onePersonLocal() && person(Core.turn(S)) && Core.turn(S) !== LME) { next(); return; }
      next();
    } else showSetup();
  }
  resumeLocal();
  TurnNet.setup({
    game: 'crazy8s', title: 'Crazy Eights', min: 2, max: 7, botMs: 900,
    seats: function (n, o) { return Math.max(n, Math.min(7, +(o && o.seats) || 2)); },
    opts: netOpts, start: netStart, turn: netTurn, over: netOver, bot: netBot,
    show: netShow, leave: netLeave
  });
  // (tests)
  window.__c8 = { get S() { return S; }, get busy() { return busy; }, get seat() { return me(); }, get net() { return !!NET; }, get view() { return !!VIEW; }, move: move, core: Core, record: recordGame, tapCard: function (id) { var n = handEl && handEl.querySelector('[data-id="' + id + '"]'); tapCard(id, n || document.body); } };
})();
</script>
</body>
</html>

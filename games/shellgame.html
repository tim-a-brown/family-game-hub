<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shell Game</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* ── Show-style marquee scoreboard ─────────────────────────────────────── */
.sg-board{
  position:relative;margin:2px 0 14px;padding:16px 14px 12px;border-radius:18px;
  background:linear-gradient(180deg,#2a1216,#170a0c);
  box-shadow:inset 0 0 0 3px #7a5a24, inset 0 0 0 5px #2b1a08, inset 0 0 26px rgba(0,0,0,.6), 0 10px 22px rgba(0,0,0,.4);
}
.sg-board::before,.sg-board::after{
  content:"";position:absolute;left:12px;right:12px;height:8px;pointer-events:none;
  background:radial-gradient(circle, #ffe7a3 0 2px, rgba(255,200,90,.35) 2.6px, transparent 3.4px) 0 50%/14px 8px repeat-x;
  opacity:.85;
}
.sg-board::before{top:4px;}
.sg-board::after{bottom:4px;}
.sg-board.chase::before,.sg-board.chase::after{animation:sg-chase .18s steps(1) 8;}
@keyframes sg-chase{50%{background-position:7px 50%;opacity:1;filter:brightness(1.5);}}
.sg-who{text-align:center;font-family:var(--display);font-size:1rem;letter-spacing:.06em;color:#ffd77a;margin:0 0 4px;text-transform:uppercase;}
.sg-stats{display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:end;gap:6px;}
.sg-stat{text-align:center;min-width:0;}
.sg-stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1;color:#fff3d6;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(255,190,80,.35);}
.sg-stat.lv b{font-size:3rem;color:#ffc83d;text-shadow:0 0 18px rgba(255,200,61,.55), 0 3px 0 rgba(0,0,0,.4);}
.sg-stat small{display:block;margin-top:4px;font-size:.68rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#c9a46a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sg-stat.new b{color:#7dffb0;text-shadow:0 0 14px rgba(61,220,132,.6);}
.sg-stat.pop b{animation:pop .45s var(--spring);}
.sg-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,215,140,.14);
  font-size:.74rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#c9a46a;}
.sg-lives{display:flex;gap:5px;align-items:center;}
.sg-lives i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#d4142a 60%,#7a0010);box-shadow:0 1px 2px rgba(0,0,0,.5);}
.sg-lives i.gone{background:none;box-shadow:inset 0 0 0 2px rgba(255,215,140,.3);}

/* ── Table ─────────────────────────────────────────────────────────────── */
.sg-table{border-radius:28px;padding:10px;}
.sg-felt{position:relative;border-radius:20px;overflow:hidden;touch-action:manipulation;}
.sg-felt.shuffling{cursor:wait;}
.sg-w{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform;z-index:10;-webkit-tap-highlight-color:transparent;}
.sg-w .sg-cup{position:absolute;inset:0;z-index:3;transform-origin:22% 100%;transition:transform .42s cubic-bezier(.3,1.35,.5,1);}
.sg-w .sg-cup svg{width:100%;height:100%;overflow:visible;}
.sg-w.up .sg-cup{transform:translateY(-66%) rotate(-9deg);}
.sg-sh{position:absolute;left:-6%;right:-6%;bottom:-7%;height:20%;border-radius:50%;z-index:1;
  background:radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0));transition:opacity .4s, transform .4s;}
.sg-w.up .sg-sh{opacity:.35;transform:scale(1.25,1.1);}
.sg-ball{position:absolute;left:50%;bottom:2%;z-index:2;border-radius:50%;transform:translateX(-50%);
  background:radial-gradient(circle at 34% 28%,#ffd0d0 0,#ff5a5a 18%,#d4142a 55%,#6a000c 100%);
  box-shadow:0 3px 6px rgba(0,0,0,.55), inset -2px -3px 5px rgba(0,0,0,.35);}
.sg-ball.found{animation:sg-hop .6s var(--spring);}
@keyframes sg-hop{0%{transform:translateX(-50%) translateY(0);}35%{transform:translateX(-50%) translateY(-40%);}100%{transform:translateX(-50%) translateY(0);}}
.sg-ball.here::after{content:"";position:absolute;inset:-35%;border-radius:50%;border:3px solid rgba(255,230,140,.9);animation:sg-ring 1s ease-out 2;}
@keyframes sg-ring{from{transform:scale(.6);opacity:1;}to{transform:scale(1.5);opacity:0;}}
.sg-w.pick{cursor:pointer;}
.sg-w.pick .sg-cup{animation:sg-glow 1.8s ease-in-out infinite;animation-delay:var(--d,0s);}
@keyframes sg-glow{0%,100%{filter:none;}50%{filter:drop-shadow(0 0 9px rgba(255,214,120,.55)) brightness(1.08);}}
.sg-w.pick:active .sg-cup{transform:translateY(-4%);}
.sg-w.miss .sg-sh{background:radial-gradient(closest-side, rgba(255,77,94,.35), rgba(0,0,0,0));opacity:1;}
.sg-w.miss .sg-cup{filter:saturate(.5) brightness(.8);}
.sg-num{position:absolute;left:50%;bottom:-30%;transform:translateX(-50%);font-size:.7rem;font-weight:900;color:rgba(255,255,255,.28);display:none;}
@media (hover:hover) and (pointer:fine){
  .sg-w.pick:hover .sg-cup{filter:brightness(1.15) drop-shadow(0 0 10px rgba(255,214,120,.6));}
  .sg-felt.keys .sg-num{display:block;}
}

/* ── Status + controls ─────────────────────────────────────────────────── */
.sg-status{min-height:64px;margin:14px 0 6px;text-align:center;}
.sg-status .t{font-family:var(--display);font-size:1.5rem;line-height:1.1;}
.sg-status .t.good{color:var(--green);}
.sg-status .t.bad{color:var(--red);}
.sg-status .s{margin-top:4px;color:var(--text-2);font-weight:700;font-size:.95rem;}
.sg-go .ico{width:22px;height:22px;}
.sg-go.wait{visibility:hidden;}
</style>
</head>
<body>
<main class="stage" id="app"></main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="sg-brass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4a2a0c"/><stop offset=".14" stop-color="#9a6424"/>
      <stop offset=".3" stop-color="#f2cf7c"/><stop offset=".38" stop-color="#fff0c4"/>
      <stop offset=".48" stop-color="#d9a24c"/><stop offset=".74" stop-color="#8e5a1e"/>
      <stop offset="1" stop-color="#3a2008"/>
    </linearGradient>
    <linearGradient id="sg-brass-top" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0c4"/><stop offset=".45" stop-color="#e2b25e"/><stop offset="1" stop-color="#8a5a20"/>
    </linearGradient>
    <linearGradient id="sg-brass-rim" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3a2008"/><stop offset=".3" stop-color="#c58d3a"/><stop offset=".4" stop-color="#f6d996"/>
      <stop offset=".55" stop-color="#b47a30"/><stop offset="1" stop-color="#2e1906"/>
    </linearGradient>
  </defs>
</svg>

<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var KEY = 'shellgame', SAVE = 'shellgame_state';

  Kit.init({
    id: 'shellgame', mark: false,
    theme: { felt: ['#1d6a70', '#124a50', '#0b3439'], wood: ['#6b4428', '#3e2414'] },
    onNew: function () { clearSave(); showSetup(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Shell Game: past games', extra: histExtra }); } }],
    rules:
      '<p class="goal">Keep your eye on the ball. Find it after the cups are shuffled to clear the level.</p>' +
      '<h3>Each level</h3><ol><li>One cup is lifted so you can see the red ball.</li>' +
      '<li>Tap <b>Shuffle</b>. The cup drops over the ball and the cups swap places.</li>' +
      '<li>Tap the cup you think hides the ball.</li></ol>' +
      '<h3>It gets harder</h3><ul><li>Every level adds more moves, and the hands get faster.</li>' +
      '<li>Level 7 brings a <b>fourth cup</b>. Level 13 brings a <b>fifth</b>.</li>' +
      '<li>Later on, two pairs swap at the same time, or three cups slide around in a circle.</li></ul>' +
      '<h3>Chances</h3><p><b>Three misses</b> (the default): a miss costs a chance and you try the same level again. ' +
      '<b>One miss</b> is the classic street game: one wrong cup and the run is over.</p>' +
      '<h3>No tricks</h3><p>This is an honest table. The ball never leaves its cup and only moves when its cup moves. Follow the cup and you will find the ball.</p>' +
      '<h3>Pass and play</h3><p>Each player takes a full run. Whoever clears the most levels wins.</p>' +
      '<h3>Tips</h3><ul><li>Watch the one cup, not the whole table.</li><li>On a keyboard, press 1 to 5 to pick a cup and Space to shuffle.</li></ul>'
  });

  // ── Level design ──────────────────────────────────────────────────────────
  // Tiers: 3 cups for levels 1-6, 4 cups for 7-12, 5 cups from 13.
  // Within a tier: more moves and shorter moves each level.
  var PACE = { gentle: 1.3, classic: 1, fast: 0.8 };
  function cfg(L, pace) {
    var t = L <= 6 ? 0 : L <= 12 ? 1 : 2, k = L - [1, 7, 13][t];
    return {
      n: 3 + t,
      moves: Math.min(18, 3 + k + 2 * t),
      dur: Math.max(200, (640 - 50 * t) * Math.pow(0.9, k)) * (PACE[pace] || 1),
      cross: L >= 3,                        // non-neighbour swaps
      doubles: t >= 1 && k >= 2,            // two pairs at once
      cycles: L >= 5 && !(t >= 1 && k < 3)  // three cups rotate
    };
  }
  function rnd(n) { return Math.floor(Math.random() * n); }
  function pairMove(n, cross) {
    var a, b;
    if (!cross || Math.random() < 0.55) { a = rnd(n - 1); b = a + 1; }
    else { a = rnd(n); do { b = rnd(n); } while (b === a); }
    return [[a, b], [b, a]];
  }
  // Each move is a list of [fromSlot, toSlot]. Honest by construction: the ball
  // lives inside its cup's element, so it can only go where its cup goes.
  function genMoves(c) {
    var out = [], prev = '';
    while (out.length < c.moves) {
      var r = Math.random(), m;
      if (c.cycles && r < 0.18) {
        var pool = []; for (var i = 0; i < c.n; i++) pool.push(i);
        var s = []; while (s.length < 3) s.push(pool.splice(rnd(pool.length), 1)[0]);
        s.sort(function (x, y) { return x - y; });
        m = Math.random() < 0.5 ? [[s[0], s[1]], [s[1], s[2]], [s[2], s[0]]] : [[s[1], s[0]], [s[2], s[1]], [s[0], s[2]]];
      } else if (c.doubles && r < 0.5 && c.n >= 4) {
        var p1 = pairMove(c.n, c.cross), used = [p1[0][0], p1[0][1]], p2;
        var tries = 0;
        do { p2 = pairMove(c.n, true); tries++; } while (tries < 30 && (used.indexOf(p2[0][0]) >= 0 || used.indexOf(p2[0][1]) >= 0));
        m = tries < 30 ? p1.concat(p2) : p1;
      } else m = pairMove(c.n, c.cross);
      var sig = m.map(function (x) { return x.join(''); }).sort().join('|');
      if (sig === prev && c.n === 3 && out.length && Math.random() < 0.7) continue; // avoid dull undo-swaps
      prev = sig; out.push(m);
    }
    return out;
  }

  // ── State ─────────────────────────────────────────────────────────────────
  // S = {mode, lives, pace, players:[{name,color}], cur, runs:[{level, cleared,
  //      misses, streak, bestStreak, maxCups, hardest, missLog:[]}],
  //      n, slot:[cupId -> slot], ball (cupId), phase:'ready'|'handoff'|'done', started}
  var S = null, busy = false, picking = false;
  function run() { return S.runs[S.cur]; }
  function save() {
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'done') Kit.resume.set((S.mode === 'pass' ? S.players[S.cur].name + ' · ' : '') + 'Level ' + run().level);
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  // House record for this chance setting, from synced history (old records too).
  function record(lives) {
    var best = { v: 0, who: '' };
    var list = []; try { list = GameHistory.load(KEY); } catch (e) {}
    list.forEach(function (e) {
      if ((e.lives || 1) !== lives) return;
      if (Array.isArray(e.players) && e.players.length && e.v === 2) {
        e.players.forEach(function (p) { if (typeof p.score === 'number' && p.score > best.v) best = { v: p.score, who: p.name }; });
      } else if (typeof e.rounds === 'number' && e.rounds > best.v) best = { v: e.rounds, who: '' };
    });
    return best;
  }

  function newRun() { return { level: 1, cleared: 0, misses: 0, streak: 0, bestStreak: 0, maxCups: 3, hardest: null, missLog: [] }; }
  function arrange(n, ballCup) {
    S.n = n; S.slot = []; for (var i = 0; i < n; i++) S.slot.push(i);
    S.ball = ballCup == null ? rnd(n) : ballCup;
  }

  // ── Setup ─────────────────────────────────────────────────────────────────
  function showSetup() {
    S = null; busy = false; picking = false;
    Kit.setup(app, {
      modes: [
        { id: 'solo', icon: 'eye', title: 'Solo', desc: 'How many levels can you clear?' },
        { id: 'pass', icon: 'users', title: 'Pass and play', desc: 'Take turns. Most levels cleared wins.' }
      ],
      players: { range: function (m) { return m === 'pass' ? [2, 4] : [1, 1]; }, count: 1 },
      options: [
        { id: 'lives', label: 'Chances', help: 'How many wrong picks you get before the game is over.', value: 3, choices: [[3, 'Three misses'], [1, 'One miss']] },
        { id: 'pace', label: 'Shuffle speed', value: 'classic', choices: [['gentle', 'Gentle', 'The cups move slower, so they’re easier to follow.'], ['classic', 'Classic', 'Normal speed. The cups still get faster every level.'], ['fast', 'Hustler', 'Quick hands, like a real street hustler. Hard to follow!']] }
      ],
      start: 'Step up to the table',
      onStart: start
    });
  }
  function start(c) {
    var players = c.players.map(function (p, i) {
      var nm = p.name; if (c.mode === 'solo' && /^Player \d$/.test(nm)) nm = 'You';
      return { name: nm, color: p.color || Kit.color(i) };
    });
    S = { mode: c.mode === 'pass' ? 'pass' : 'solo', lives: Number(c.options.lives) === 1 ? 1 : 3,
      pace: PACE[c.options.pace] ? c.options.pace : 'classic', players: players, cur: 0,
      runs: players.map(newRun), phase: 'ready', started: Date.now() };
    S.recordAtStart = record(S.lives).v;
    arrange(3);
    Kit.gameStart(); save(); build();
    status('Watch the ball', S.mode === 'pass' ? Kit.poss(S.players[0].name) + ' run. Tap Shuffle when ready.' : 'Then tap Shuffle');
  }

  // ── Build the table ───────────────────────────────────────────────────────
  var R = {}; // DOM refs
  var CUP_SVG =
    '<svg viewBox="0 0 100 110" aria-hidden="true">' +
    '<path d="M21 12 L79 12 L94 96 A44 9 0 0 1 6 96 Z" fill="url(#sg-brass)"/>' +
    '<path d="M16.6 40 A34 6 0 0 0 83.4 40" fill="none" stroke="rgba(40,20,4,.55)" stroke-width="3"/>' +
    '<path d="M16.3 43 A34 6 0 0 0 83.7 43" fill="none" stroke="rgba(255,236,180,.45)" stroke-width="1.4"/>' +
    '<path d="M11.6 74 A39 7 0 0 0 88.4 74" fill="none" stroke="rgba(40,20,4,.4)" stroke-width="2"/>' +
    '<path d="M5 95 A45 9.5 0 0 0 95 95 L96 100 A46 10 0 0 1 4 100 Z" fill="url(#sg-brass-rim)"/>' +
    '<ellipse cx="50" cy="12" rx="29" ry="6" fill="url(#sg-brass-top)"/>' +
    '<ellipse cx="50" cy="12" rx="22" ry="3.8" fill="none" stroke="rgba(90,55,15,.45)" stroke-width="1"/>' +
    '<path d="M30 16 L24 88" stroke="rgba(255,255,255,.28)" stroke-width="4" stroke-linecap="round"/>' +
    '</svg>';

  function build() {
    app.innerHTML = '';
    R.board = el('div', { class: 'sg-board', 'aria-live': 'polite' });
    R.who = el('div', { class: 'sg-who' });
    R.lv = el('div', { class: 'sg-stat lv' }); R.st = el('div', { class: 'sg-stat' }); R.best = el('div', { class: 'sg-stat' });
    R.lives = el('div', { class: 'sg-lives', 'aria-label': 'Chances left' });
    R.info = el('span');
    R.board.appendChild(R.who);
    R.board.appendChild(el('div', { class: 'sg-stats' }, [R.st, R.lv, R.best]));
    R.board.appendChild(el('div', { class: 'sg-sub' }, [R.info, R.lives]));
    R.felt = el('div', { class: 'sg-felt felt-in' });
    var table = el('div', { class: 'sg-table wood' }, [R.felt]);
    R.status = el('div', { class: 'sg-status' }, [R.t = el('div', { class: 't' }), R.s = el('div', { class: 's' })]);
    R.go = el('button', { type: 'button', class: 'btn btn-primary btn-lg btn-block sg-go', onclick: onGo });
    app.appendChild(R.board); app.appendChild(table); app.appendChild(R.status); app.appendChild(R.go);
    buildCups(); paintBoard(); paintGo();
  }
  function buildCups() {
    if (R.cups) R.cups.forEach(function (c) { c.w.remove(); });
    R.cups = [];
    for (var i = 0; i < S.n; i++) {
      (function (id) {
        var w = el('div', { class: 'sg-w', role: 'button', 'aria-label': 'Cup', 'data-cup': id });
        w.appendChild(el('div', { class: 'sg-sh' }));
        w.appendChild(el('div', { class: 'sg-cup', html: CUP_SVG }));
        w.appendChild(el('div', { class: 'sg-num' }));
        w.addEventListener('click', function () { pick(id); });
        R.felt.appendChild(w);
        R.cups.push({ w: w, x: 0, dy: 0, s: 1 });
      })(i);
    }
    R.ball = el('div', { class: 'sg-ball' });
    R.cups[S.ball].w.appendChild(R.ball);
    layout();
    R.cups[S.ball].w.classList.add('up');
  }

  var G = {}; // geometry
  function layout() {
    var W = R.felt.clientWidth || 340, n = S.n;
    var cw3 = Math.min(104, (W - 20) / 3.7), ch3 = cw3 * 1.1;
    var avail = (window.innerHeight || 800) - 540;
    G.H = Math.round(Math.max(ch3 * 2.45, Math.min(avail, ch3 * 3.1))); G.base = Math.round(Math.min(G.H - ch3 * 0.5, G.H / 2 + ch3 * 0.62));
    G.cw = Math.min(cw3, (W - 16) / (n + (n - 1) * 0.34)); G.ch = G.cw * 1.1;
    var step = G.cw * 1.34, total = G.cw + step * (n - 1);
    G.x = []; for (var i = 0; i < n; i++) G.x.push((W - total) / 2 + i * step);
    R.felt.style.height = G.H + 'px';
    R.cups.forEach(function (c, id) {
      c.w.style.width = G.cw + 'px'; c.w.style.height = G.ch + 'px';
      c.x = G.x[S.slot[id]]; c.dy = 0; c.s = 1; place(c);
      c.w.querySelector('.sg-num').textContent = String(S.slot[id] + 1);
    });
    var bs = Math.round(G.cw * 0.36);
    R.ball.style.width = R.ball.style.height = bs + 'px';
  }
  function place(c) {
    c.w.style.transform = 'translate3d(' + c.x.toFixed(1) + 'px,' + (G.base - G.ch + c.dy).toFixed(1) + 'px,0) scale(' + c.s.toFixed(3) + ')';
  }
  window.addEventListener('resize', function () { if (S && R.felt && !busy) layout(); });

  function paintBoard() {
    var r = run(), rec = Math.max(record(S.lives).v, r.cleared);
    R.who.textContent = S.mode === 'pass' ? Kit.poss(S.players[S.cur].name) + ' run' : 'The shell game';
    R.lv.innerHTML = '<b>' + r.level + '</b><small>Level</small>';
    R.st.innerHTML = '<b>' + r.streak + '</b><small>Streak</small>';
    R.best.innerHTML = '<b>' + rec + '</b><small>Record</small>';
    R.best.classList.toggle('new', S.recordAtStart > 0 && r.cleared > S.recordAtStart);
    var c = cfg(r.level, S.pace);
    R.info.textContent = c.n + ' cups · ' + c.moves + ' moves';
    R.lives.innerHTML = '';
    for (var i = 0; i < S.lives; i++) R.lives.appendChild(el('i', { class: i < S.lives - r.misses ? '' : 'gone' }));
  }
  function bump(node) { node.classList.remove('pop'); void node.offsetWidth; node.classList.add('pop'); }
  function status(t, s, cls) { R.t.textContent = t; R.t.className = 't' + (cls ? ' ' + cls : ''); R.s.textContent = s || ''; }
  function paintGo(label, icon) {
    if (S.phase === 'done') label = label || 'See results';
    else if (S.phase === 'handoff') label = 'Pass to ' + S.players[S.cur + 1].name;
    R.go.innerHTML = Kit.icon(icon || 'shuffle') + '<span>' + Kit.esc(label || 'Shuffle') + '</span>';
    R.go.classList.toggle('wait', busy || picking);
    R.go.disabled = busy || picking;
  }

  // ── Play ──────────────────────────────────────────────────────────────────
  function onGo() {
    if (busy || picking || !S) return;
    if (S.phase === 'done') return finish();
    if (S.phase === 'handoff') return handoff();
    var need = cfg(run().level, S.pace).n;
    if (need !== S.n) { // a new cup joins the table first
      R.cups.forEach(function (c) { c.w.classList.remove('up', 'miss'); });
      arrange(need); buildCups(); save(); paintBoard(); paintGo();
      Kit.sfx('pop'); Kit.haptic('medium');
      Kit.callout(['', '', '', '', 'Four cups!', 'Five cups!'][need] || need + ' cups!');
      status('A new cup joins the table', 'Watch the ball, then tap Shuffle');
      return;
    }
    shuffle();
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function shuffle() {
    var c = cfg(run().level, S.pace), moves = genMoves(c), token = ++shuffle.token;
    busy = true; paintGo(); R.felt.classList.add('shuffling');
    status('Keep your eye on the ball', c.moves + ' moves');
    Kit.sfx('flip'); Kit.haptic('light');
    R.cups.forEach(function (x) { x.w.classList.remove('up', 'miss', 'pick'); });
    R.ball.classList.remove('found', 'here');
    var p = sleep(560);
    moves.forEach(function (m, i) {
      p = p.then(function () {
        if (token !== shuffle.token) return;
        return animateMove(m, c.dur, i / Math.max(1, moves.length - 1));
      }).then(function () { return sleep(c.dur * 0.06); });
    });
    p.then(function () {
      if (token !== shuffle.token) return;
      busy = false; picking = true; R.felt.classList.remove('shuffling');
      R.cups.forEach(function (x, id) { x.w.classList.add('pick'); x.w.style.setProperty('--d', (S.slot[id] * 0.18) + 's'); });
      status('Which cup has the ball?', 'Tap a cup to lift it');
      Kit.haptic('light'); paintGo();
    });
  }
  shuffle.token = 0;

  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function animateMove(m, dur, prog) {
    var front = Math.random() < 0.5 ? 1 : -1;
    var dist = Math.max.apply(null, m.map(function (x) { return Math.abs(x[0] - x[1]); }));
    var D = dur * (1 + 0.22 * (dist - 1));
    var bySlot = []; S.slot.forEach(function (s, id) { bySlot[s] = id; });
    var tracks = m.map(function (x) {
      var id = bySlot[x[0]], c = R.cups[id], d = x[1] - x[0];
      // cups moving one way pass in front, the other way behind (they never collide)
      var sign = (d > 0 ? 1 : -1) * front;
      return { id: id, c: c, x0: G.x[x[0]], x1: G.x[x[1]], to: x[1], sign: sign, amp: G.cw * (0.26 + 0.07 * Math.abs(d)) };
    });
    tracks.forEach(function (t) { t.c.w.style.zIndex = t.sign > 0 ? 30 : 4; });
    Kit.sfx('deal'); Kit.haptic('tick');
    return new Promise(function (resolve) {
      var t0 = null;
      function frame(now) {
        if (t0 == null) t0 = now;
        var t = Math.min(1, (now - t0) / D), e = ease(t), arc = Math.sin(Math.PI * e);
        tracks.forEach(function (k) {
          k.c.x = k.x0 + (k.x1 - k.x0) * e;
          k.c.dy = k.sign * k.amp * arc;
          k.c.s = 1 + k.sign * 0.07 * arc;
          place(k.c);
        });
        if (t < 1) requestAnimationFrame(frame);
        else {
          tracks.forEach(function (k) { S.slot[k.id] = k.to; k.c.dy = 0; k.c.s = 1; k.c.w.style.zIndex = 10; place(k.c); });
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  function slotName(s, n) {
    if (n === 3) return ['left', 'middle', 'right'][s] + ' cup';
    if (s === 0) return 'far-left cup'; if (s === n - 1) return 'far-right cup';
    return (s + 1) + (s === 1 ? 'nd' : s === 2 ? 'rd' : 'th') + ' cup from the left';
  }

  function pick(id) {
    if (!picking || busy || !S) return;
    picking = false; busy = true;
    var r = run(), c = cfg(r.level, S.pace), ok = id === S.ball, w = R.cups[id].w;
    R.cups.forEach(function (x) { x.w.classList.remove('pick'); });
    w.classList.add('up'); Kit.sfx('flip'); Kit.haptic('light');
    var lvl = r.level;
    if (ok) {
      r.cleared++; r.streak++; r.bestStreak = Math.max(r.bestStreak, r.streak); r.maxCups = Math.max(r.maxCups, c.n);
      if (!r.hardest || c.moves > r.hardest.moves || (c.moves === r.hardest.moves && c.n > r.hardest.n)) r.hardest = { moves: c.moves, n: c.n, level: lvl };
      r.level++;
    } else {
      r.misses++; r.streak = 0;
      r.missLog.push({ level: lvl, n: c.n, moves: c.moves, at: slotName(S.slot[S.ball], c.n), picked: slotName(S.slot[id], c.n) });
    }
    var over = r.misses >= S.lives;
    if (over) S.phase = S.cur < S.players.length - 1 ? 'handoff' : 'done';
    save(); // ball is visible from here on, so the saved state reveals nothing
    setTimeout(function () {
      if (ok) {
        R.ball.classList.add('found');
        Kit.sfx('good'); Kit.haptic('success');
        R.board.classList.remove('chase'); void R.board.offsetWidth; R.board.classList.add('chase');
        var rec = S.recordAtStart, msg = null;
        if (r.cleared === rec + 1 && rec > 0 && !r.toldRecord) { r.toldRecord = true; msg = 'New record!'; }
        else if (r.streak === 3) msg = '3 in a row!';
        else if (r.streak === 5) msg = 'Sharp eyes!';
        else if (r.streak === 10) msg = 'Eagle eye!';
        else if (r.streak > 10 && r.streak % 5 === 0) msg = r.streak + ' in a row!';
        else if (lvl === 6 || lvl === 12) msg = 'Tier cleared!';
        if (msg) Kit.callout(msg);
        var next = cfg(r.level, S.pace);
        status('Found it!', next.n > c.n ? 'Level ' + r.level + ' adds another cup' : 'On to level ' + r.level, 'good');
        paintBoard(); bump(R.lv); bump(R.st); if (msg === 'New record!') bump(R.best);
        busy = false; paintGo('Next level', 'play');
        save();
      } else {
        w.classList.add('miss');
        Kit.sfx('bad'); Kit.haptic('error');
        status('Not that one!', 'Here it was...', 'bad');
        setTimeout(function () {
          R.cups[S.ball].w.classList.add('up'); R.ball.classList.add('here'); Kit.sfx('flip');
          var left = S.lives - r.misses;
          if (over) {
            status(S.lives === 1 ? 'Gotcha!' : 'Out of chances', 'You cleared ' + r.cleared + ' level' + (r.cleared === 1 ? '' : 's'), 'bad');
          } else status('Not that one!', left + (left === 1 ? ' chance' : ' chances') + ' left. Same level again.', 'bad');
          paintBoard(); busy = false;
          if (over) paintGo(S.phase === 'done' ? (S.mode === 'pass' ? 'See who won' : 'See results') : null, 'right');
          else paintGo('Try again', 'shuffle');
        }, 650);
      }
    }, 380);
  }

  // ── Between players / end of game ─────────────────────────────────────────
  function handoff() {
    var r = run(), next = S.players[S.cur + 1];
    Kit.sheet({
      title: Kit.poss(next.name) + ' turn',
      html: '<p class="muted">' + Kit.esc(S.players[S.cur].name) + ' cleared <b>' + r.cleared + '</b> level' + (r.cleared === 1 ? '' : 's') +
        '. Pass the phone to ' + Kit.esc(next.name) + '.</p>',
      dismissible: false,
      actions: [{ label: "I'm ready", primary: true, onClick: function () {
        S.cur++; S.phase = 'ready';
        arrange(3); save(); buildCups(); paintBoard(); paintGo();
        status('Watch the ball', Kit.poss(next.name) + ' run. Tap Shuffle when ready.');
        Kit.sfx('pop');
      } }]
    });
  }

  function highlights() {
    var hl = [], solo = S.mode === 'solo';
    S.players.forEach(function (p, i) {
      var r = S.runs[i], who = solo && p.name === 'You' ? 'You' : p.name;
      hl.push(who + ' cleared ' + r.cleared + ' level' + (r.cleared === 1 ? '' : 's') + (r.maxCups > 3 ? ' and made it to ' + r.maxCups + ' cups' : ''));
      if (r.bestStreak >= 3 && r.bestStreak < r.cleared) hl.push((solo ? 'Longest streak: ' : who + "'s longest streak: ") + r.bestStreak + ' in a row');
      if (r.hardest && r.hardest.moves >= 6) hl.push(who + ' tracked a ' + r.hardest.moves + '-move shuffle with ' + r.hardest.n + ' cups (level ' + r.hardest.level + ')');
      var last = r.missLog[r.missLog.length - 1];
      if (last) hl.push((solo ? 'The last miss' : who + "'s last miss") + ' came at level ' + last.level + ': the ball was under the ' + last.at + ', not the ' + last.picked);
      if (!r.misses && r.cleared) hl.push(who + ' never missed');
    });
    return hl;
  }

  function finish() {
    var rec = S.recordAtStart, solo = S.mode === 'solo';
    var players = S.players.map(function (p, i) { return { name: p.name, score: S.runs[i].cleared, cpu: false }; });
    var top = players.slice().sort(function (a, b) { return b.score - a.score; });
    var tie = !solo && top[0].score === top[1].score;
    var newRec = top[0].score > rec && top[0].score > 0;
    var hl = highlights();
    if (!solo && !tie) hl.push(top[0].name + ' won by ' + (top[0].score - top[1].score) + ' level' + (top[0].score - top[1].score === 1 ? '' : 's'));
    if (newRec) hl.push(rec ? 'New table record (the old one was ' + rec + ')' : 'First table record set');
    var modeLbl = (solo ? 'Solo' : 'Pass and play') + ' · ' + (S.lives === 1 ? 'One miss' : 'Three misses') + (S.pace !== 'classic' ? ' · ' + (S.pace === 'fast' ? 'Hustler' : 'Gentle') : '');
    Kit.record(KEY, {
      started: S.started, mode: modeLbl, players: players,
      winner: solo ? null : tie ? null : top[0].name,
      highlights: hl,
      summary: solo ? players[0].name + ' cleared ' + players[0].score + ' level' + (players[0].score === 1 ? '' : 's') : (tie ? 'Tie game' : top[0].name + ' won') + ' · ' + players.map(function (p) { return p.score; }).join(' – '),
      badge: solo ? players[0].score + ' levels' : '',
      meta: { lives: S.lives, pace: S.pace, rounds: solo ? players[0].score : top[0].score, result: solo ? (newRec ? 'record' : 'done') : 'done' }
    });
    var again = function () { start({ mode: S.mode, players: S.players.map(function (p) { return { name: p.name, color: p.color }; }), options: { lives: S.lives, pace: S.pace } }); };
    var sc = top[0].score;
    clearSave(); S.phase = 'over';
    if (solo) {
      Kit.win({
        icon: newRec ? 'trophy' : 'eye', lose: !newRec,
        title: newRec ? 'New record!' : sc + (sc === 1 ? ' level' : ' levels'),
        sub: newRec ? sc + (sc === 1 ? ' level' : ' levels') + ' cleared' + (rec ? ' (old record ' + rec + ')' : '') : 'cleared · table record ' + rec,
        again: again, extra: [{ label: 'Change settings', onClick: showSetup }]
      });
    } else {
      Kit.win({
        title: tie ? "It's a tie!" : top[0].name + ' wins!',
        sub: 'Levels cleared' + (newRec ? ' · new table record!' : ''),
        rank: top.map(function (p) { var i = players.indexOf(p); return { name: p.name, score: p.score, color: S.players[i].color }; }),
        again: again, extra: [{ label: 'Change players', onClick: showSetup }]
      });
    }
  }

  function histExtra(e) {
    if (e.v === 2 || typeof e.rounds !== 'number') return null;
    return el('div', { class: 'k-hd-sum', text: 'Found the ball ' + e.rounds + ' time' + (e.rounds === 1 ? '' : 's') + ' before the first miss' });
  }

  // ── Keyboard ──────────────────────────────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    if (!S || !R.felt || document.querySelector('.k-scrim, .k-win')) return;
    if (/^[1-5]$/.test(e.key) && picking) {
      var s = Number(e.key) - 1, id = S.slot.indexOf(s);
      if (id >= 0) { R.felt.classList.add('keys'); pick(id); }
    } else if ((e.key === ' ' || e.key === 'Enter') && !busy && !picking) { e.preventDefault(); onGo(); }
  });

  // ── Boot / resume ─────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.runs && saved.players && saved.phase !== 'over') {
    S = saved;
    if (S.recordAtStart == null) S.recordAtStart = 0;
    build();
    var r = run();
    if (S.phase === 'done') status('Run over', 'You cleared ' + r.cleared + ' levels');
    else if (S.phase === 'handoff') status(S.players[S.cur].name + ' is done', 'Cleared ' + r.cleared + ' levels');
    else status('Welcome back', 'Level ' + r.level + '. Watch the ball, then tap Shuffle.');
    paintGo(S.phase === 'ready' ? (r.level > 1 || r.misses ? 'Shuffle' : null) : null);
  } else showSetup();
})();
</script>
</body>
</html>

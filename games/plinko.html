<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
<title>Plinko</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
body{background:radial-gradient(800px 500px at 50% -10%,rgba(124,58,237,.18),transparent 70%),var(--bg);}
.page{padding-top:12px;max-width:560px;}
#canvas{display:block;margin:0 auto;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);}
/* Setup */
.setup-card{max-width:420px;margin:0 auto;}
.setup-lbl{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin:0 0 8px 2px;}
#sc-row{margin-bottom:16px;}
#sc-row .tab{flex:1 1 0;font-size:1rem;min-height:42px;}
.name-row{display:flex;align-items:center;gap:10px;}
.name-dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.06);}
.slot-legend{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
.slot-legend span{text-align:center;font-family:var(--display);font-weight:800;font-size:.78rem;padding:6px 0;border-radius:8px;background:var(--surface-2);}
/* Game */
.player-row{display:flex;gap:8px;justify-content:center;margin-bottom:10px;}
.player-chip{flex:1 1 0;max-width:150px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 7px;text-align:center;transition:border-color .2s,transform .25s var(--spring),background .2s;position:relative;}
.player-chip.active{transform:translateY(-2px);background:var(--surface-2);}
.pc-name{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-total{font-family:var(--display);font-size:1.45rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;}
.pc-drops{display:flex;gap:4px;justify-content:center;margin-top:4px;}
.pc-drops i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9;}
.pc-drops i.used{opacity:.18;}
.status-bar{text-align:center;font-size:.95rem;font-weight:600;margin:4px 0 8px;min-height:24px;color:var(--text-2);}
.status-bar b{font-weight:800;}
.drop-zone{display:flex;margin:0 auto 6px;gap:4px;}
.drop-col{flex:1;height:40px;border:0;background:var(--surface);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-3);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:color .15s,background .15s,transform .1s;}
.drop-col svg{width:16px;height:16px;}
.drop-col:active{transform:scale(.9);}
@media (hover:hover){.drop-col:hover{color:var(--text);background:var(--surface-3);}}
.drop-zone.busy .drop-col{opacity:.35;pointer-events:none;}
#winner-area .winner-banner{margin:12px 0 0;}
#action-btns{display:none;gap:8px;justify-content:center;margin-top:12px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Plinko</span>
  <button class="icon-btn" id="mute-btn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
  <button class="icon-btn" id="pl-newgame" title="New game" aria-label="New game"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</nav>
<div class="page">

<!-- Setup -->
<div id="setup" class="setup-card setup-screen">
  <div class="setup-lbl">Players</div>
  <div class="tabs" id="sc-row">
    <button class="tab sc-btn" data-n="1">1</button>
    <button class="tab sc-btn active" data-n="2">2</button>
    <button class="tab sc-btn" data-n="3">3</button>
    <button class="tab sc-btn" data-n="4">4</button>
  </div>
  <div id="setup-names" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>
  <div class="card" style="font-size:.9rem;color:var(--text-2);line-height:1.55;">
    Drop the ball into any column. <b style="color:var(--text)">3 drops per player</b> — highest total wins!
    <div class="slot-legend">
      <span style="color:#86efac">500</span><span style="color:#7dd3fc">1000</span><span style="color:#fca5a5;background:rgba(248,113,113,.12)">100</span><span style="color:var(--gold);background:rgba(245,200,66,.16)">5000</span><span style="color:#fca5a5;background:rgba(248,113,113,.12)">100</span><span style="color:#7dd3fc">1000</span><span style="color:#86efac">500</span>
    </div>
    <div style="margin-top:8px;font-size:.84rem;">🎯 Center = 5,000 · ⚠️ Slots next to center = 100 (trap!)</div>
  </div>
  <button class="btn btn-gold btn-block" id="start-btn">Start Game</button>
</div>

<!-- Game -->
<div id="gamearea" class="hidden">
  <div class="player-row" id="player-row"></div>
  <div class="status-bar" id="status"></div>
  <div class="drop-zone" id="drop-zone"></div>
  <canvas id="canvas"></canvas>
  <div id="winner-area"></div>
  <div id="action-btns">
    <button class="btn btn-gold" id="play-again-btn">Play Again</button>
    <button class="btn btn-outline" id="new-game-btn">New Setup</button>
  </div>
</div>
</div>

<script>
'use strict';
const P_COLORS=['#f5c842','#5ac8fa','#ff6b6b','#c084fc'];
const TURNS_PER_PLAYER=3;
// Score slots (7): 100, 200, 300, 500, 300, 200, 100
const SLOT_SCORES=[500,1000,100,5000,100,1000,500];

let numP=2, pNames=[], scores=[], turnsLeft=[], curP=0, gameOver=false;
let ball=null, animFrame=null, dropping=false;

// Board geometry
const ROWS=9, COLS=7;
let BW, BH, PEG_R, BALL_R, CELL_W, CELL_H, PAD_X, PAD_TOP;

let setupN=2;
document.querySelectorAll('.sc-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    setupN=+b.dataset.n;
    document.querySelectorAll('.sc-btn').forEach(x=>x.classList.toggle('active',x===b));
    GN.haptic('select');
    buildSetupNames();
  });
});
function buildSetupNames(){
  const c=document.getElementById('setup-names');c.innerHTML='';
  for(let i=0;i<setupN;i++){
    const prev=document.getElementById('pn'+i);
    const d=document.createElement('div');d.className='name-row';
    d.innerHTML=`<div class="name-dot" style="background:${P_COLORS[i]}"></div>
      <input class="input" id="pn${i}" placeholder="Player ${i+1}" maxlength="14" autocomplete="off">`;
    if(prev)d.querySelector('input').value=prev.value;
    c.appendChild(d);
  }
}
buildSetupNames();

document.getElementById('start-btn').addEventListener('click',()=>{
  numP=setupN;
  pNames=Array.from({length:numP},(_,i)=>document.getElementById('pn'+i).value.trim()||`Player ${i+1}`);
  scores=Array.from({length:numP},()=>[]);
  turnsLeft=Array(numP).fill(TURNS_PER_PLAYER);
  curP=0;gameOver=false;
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('gamearea').classList.remove('hidden');
  document.getElementById('action-btns').style.display='none';
  document.getElementById('winner-area').innerHTML='';
  showGame();
  GN.haptic('medium');
});
function showGame(){
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('gamearea').classList.remove('hidden');
  setupCanvas();renderChips();buildDropZone();setStatus();
}

const DPR=Math.min(3,window.devicePixelRatio||1);
function setupCanvas(){
  // Fit the board to the phone: width-limited on phones, height-limited on short screens
  const pageW=Math.min(560,document.documentElement.clientWidth)-32;
  const maxW=Math.floor(Math.max(260,Math.min(440,pageW,(window.innerHeight-290)/1.25)));
  BW=maxW; BH=Math.round(maxW*1.25);
  CELL_W=BW/COLS; CELL_H=BH/(ROWS+2);
  PAD_X=CELL_W/2; PAD_TOP=CELL_H*1.2;
  PEG_R=Math.max(3,Math.round(CELL_W*0.06));
  BALL_R=Math.max(8,Math.round(CELL_W*0.16));
  const canvas=document.getElementById('canvas');
  canvas.width=Math.round(BW*DPR); canvas.height=Math.round(BH*DPR);
  canvas.style.width=BW+'px'; canvas.style.height=BH+'px';
  const dz=document.getElementById('drop-zone'); if(dz) dz.style.width=BW+'px';
  draw();
}

// Peg layout: even rows have COLS pegs (one under each drop slot),
// odd rows have COLS+1 pegs (including near the angled walls).
function pegs(){
  const p=[];
  for(let r=0;r<ROWS;r++){
    if(r%2===0){
      // COLS pegs — directly below every drop slot
      for(let c=0;c<COLS;c++)
        p.push({x:CELL_W*(c+0.5), y:PAD_TOP+r*CELL_H});
    } else {
      // COLS+1 pegs — shifted half a cell, extends into angled wall zones
      for(let c=0;c<COLS+1;c++)
        p.push({x:CELL_W*c, y:PAD_TOP+r*CELL_H});
    }
  }
  return p;
}

function slotY(){return BH-CELL_H*0.7;}

// Angled wall x-positions — walls funnel inward from top to slot level
function leftWallX(y){
  const t=Math.max(0,Math.min(1,(y-PAD_TOP)/(slotY()-PAD_TOP)));
  return CELL_W*0.5*(1-t); // 0.5×CELL_W gap at top → 0 at slot level
}
function rightWallX(y){return BW-leftWallX(y);}

function draw(trailBall){
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,BW,BH);

  // Angled side walls
  ctx.beginPath();
  ctx.moveTo(leftWallX(PAD_TOP), PAD_TOP);
  ctx.lineTo(leftWallX(slotY()), slotY());
  ctx.strokeStyle='rgba(90,200,250,.35)';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rightWallX(PAD_TOP), PAD_TOP);
  ctx.lineTo(rightWallX(slotY()), slotY());
  ctx.strokeStyle='rgba(90,200,250,.35)';ctx.lineWidth=3;ctx.stroke();
  // Wall caps (short horizontal lines at top)
  ctx.beginPath();
  ctx.moveTo(0,PAD_TOP);ctx.lineTo(leftWallX(PAD_TOP),PAD_TOP);
  ctx.strokeStyle='rgba(90,200,250,.2)';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(BW,PAD_TOP);ctx.lineTo(rightWallX(PAD_TOP),PAD_TOP);
  ctx.strokeStyle='rgba(90,200,250,.2)';ctx.lineWidth=2;ctx.stroke();

  // Pegs — only render those inside the angled walls
  pegs().forEach(({x,y})=>{
    if(x-PEG_R < leftWallX(y) || x+PEG_R > rightWallX(y)) return;
    ctx.beginPath();ctx.arc(x,y,PEG_R,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.72)';ctx.fill();
  });

  // Score slots
  const sy=slotY();
  SLOT_SCORES.forEach((sc,i)=>{
    const x=CELL_W*i+CELL_W*0.5;
    const isJackpot=sc===5000;
    const isHigh=sc===1000;
    const isTrap=sc===100;
    ctx.fillStyle=isJackpot?'rgba(245,200,66,.28)':isTrap?'rgba(255,80,80,.2)':isHigh?'rgba(90,200,250,.15)':'rgba(126,212,126,.15)';
    ctx.beginPath();
    ctx.roundRect(x-CELL_W*0.4,sy-CELL_H*0.4,CELL_W*0.8,CELL_H*0.8,4);
    ctx.fill();
    ctx.fillStyle=isJackpot?'#f5c842':isTrap?'#ff6b6b':isHigh?'#5ac8fa':'#7ed47e';
    ctx.font=`800 ${Math.round(CELL_W*0.24)}px "Bricolage Grotesque",Inter,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(sc,x,sy);
  });
  // Divider walls between slots
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.lineCap='round';
  for(let i=1;i<COLS;i++){
    const wx=CELL_W*i;
    ctx.beginPath();ctx.moveTo(wx,sy-CELL_H*0.45);ctx.lineTo(wx,BH);ctx.stroke();
  }

  // Falling ball
  if(trailBall){
    const col=P_COLORS[trailBall.player]||'#f5c842';
    ctx.beginPath();ctx.arc(trailBall.x,trailBall.y,BALL_R,0,Math.PI*2);
    ctx.fillStyle=col;
    ctx.shadowColor=col;ctx.shadowBlur=10;
    ctx.fill();ctx.shadowBlur=0;
  }
}

function buildDropZone(){
  const dz=document.getElementById('drop-zone');
  dz.style.width=BW+'px';
  dz.innerHTML='';
  for(let c=0;c<COLS;c++){
    const col=document.createElement('button');
    col.className='drop-col';col.dataset.c=c;col.setAttribute('aria-label','Drop in column '+(c+1));
    col.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>';
    col.addEventListener('click',()=>startDrop(c));
    dz.appendChild(col);
  }
}

function startDrop(col){
  if(dropping||gameOver||turnsLeft[curP]<=0||document.getElementById('drop-zone').classList.contains('busy'))return;
  if(soundOn){try{getCtx();}catch(e){}} // unlock audio inside the tap gesture (iOS)
  dropping=true;GN.haptic('light');
  document.getElementById('drop-zone').classList.add('busy');
  const startX=CELL_W*col+CELL_W*0.5;
  const startY=PAD_TOP*0.3;
  ball={x:startX,y:startY,vx:(Math.random()-.5)*0.8,vy:0.6,player:curP,_sf:0,_sy:startY};
  animate();
}

function animate(){
  const GRAV=0.038, BOUNCE_DAMP=0.88, PEG_LIST=pegs().filter(({x,y})=>x-PEG_R>=leftWallX(y)&&x+PEG_R<=rightWallX(y));
  // Fixed 60 Hz physics so the ball falls at the same speed on 120 Hz phones
  let last=performance.now(),acc=0;
  function frame(now){
    acc+=Math.min(100,now-last);last=now;
    let n=0;
    while(acc>=16.667&&n<6){acc-=16.667;n++;if(physics()){return;}}
    if(ball)draw(ball);
    animFrame=requestAnimationFrame(frame);
  }
  function physics(){
    ball.vy+=GRAV;
    ball.x+=ball.vx;
    ball.y+=ball.vy;

    // Angled wall collision — kick scales up near the bottom where funnel is tightest
    const lw=leftWallX(ball.y), rw=rightWallX(ball.y);
    const funnelT=Math.max(0,Math.min(1,(ball.y-PAD_TOP)/(slotY()-PAD_TOP)));
    const wallKick=1.8+funnelT*1.8;
    if(ball.x-BALL_R<lw){
      ball.x=lw+BALL_R+2;
      ball.vx=wallKick+Math.random()*0.8;
      ball.vy=Math.abs(ball.vy)*0.7+0.4;
      if(funnelT>0.7) ball.x=Math.max(ball.x, BW*0.25);
      playWallBounce();
    }
    if(ball.x+BALL_R>rw){
      ball.x=rw-BALL_R-2;
      ball.vx=-(wallKick+Math.random()*0.8);
      ball.vy=Math.abs(ball.vy)*0.7+0.4;
      if(funnelT>0.7) ball.x=Math.min(ball.x, BW*0.75);
      playWallBounce();
    }

    // Peg collision — energetic bounce with strong horizontal randomness
    PEG_LIST.forEach(({x,y})=>{
      const dx=ball.x-x, dy=ball.y-y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<PEG_R+BALL_R){
        const nx=dx/dist, ny=dy/dist;
        const dot=ball.vx*nx+ball.vy*ny;
        // Reflect with high energy retention + strong random horizontal kick
        ball.vx=(ball.vx-2*dot*nx)*BOUNCE_DAMP+(Math.random()-.5)*1.8;
        ball.vy=(ball.vy-2*dot*ny)*BOUNCE_DAMP+0.25;
        ball.x=x+nx*(PEG_R+BALL_R+1);
        ball.y=y+ny*(PEG_R+BALL_R+1);
        // Clamp: don't let vy go too negative (upward) but allow real bounces
        ball.vy=Math.max(ball.vy,-2.5);
        const speed=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
        playPegTick(speed);
      }
    });

    // Stuck-ball safety: every 20 frames if y barely moved, kick free
    ball._sf++;
    if(ball._sf%20===0){
      if(ball.y-ball._sy<3){ball.vy=Math.max(ball.vy,1.5);ball.vx=(Math.random()>.5?1:-1)*(0.5+Math.random()*0.75);}
      ball._sy=ball.y;
    }

    // Slot divider walls — vertical walls between score buckets from slotY downward
    const DIVIDER_TOP=slotY()-CELL_H*0.4;
    if(ball.y+BALL_R>DIVIDER_TOP){
      // Each divider is at x = CELL_W * i for i=1..COLS-1
      for(let i=1;i<COLS;i++){
        const wx=CELL_W*i;
        const DIVIDER_W=3;
        if(ball.x+BALL_R>wx-DIVIDER_W/2&&ball.x-BALL_R<wx+DIVIDER_W/2){
          if(ball.vx>0){ball.x=wx-DIVIDER_W/2-BALL_R;ball.vx=-Math.abs(ball.vx)*0.6;}
          else{ball.x=wx+DIVIDER_W/2+BALL_R;ball.vx=Math.abs(ball.vx)*0.6;}
          playWallBounce();
          break;
        }
      }
    }

    // Reached slot zone
    if(ball.y>=slotY()-BALL_R){
      const slotIdx=Math.min(COLS-1,Math.max(0,Math.floor(ball.x/CELL_W)));
      const sc=SLOT_SCORES[slotIdx];
      ball=null;dropping=false;
      playScoreSound(sc);
      GN.haptic(sc===5000?'success':sc===100?'error':'medium');
      recordScore(curP,sc,slotIdx);
      return true;
    }
    return false;
  }
  animFrame=requestAnimationFrame(frame);
}

function recordScore(pi,sc,slotIdx){
  scores[pi].push(sc);
  turnsLeft[pi]--;

  // Animate score pop on canvas
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  const x=CELL_W*slotIdx+CELL_W*0.5, y=slotY();
  let alpha=1,dy=0;
  function popAnim(){
    draw();
    dy-=1.5;alpha-=0.05;
    ctx.globalAlpha=Math.max(0,alpha);
    ctx.fillStyle=P_COLORS[pi];
    ctx.font=`800 ${Math.round(CELL_W*0.4)}px "Bricolage Grotesque",Inter,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('+'+sc,x,y+dy);
    ctx.globalAlpha=1;
    if(alpha>0)requestAnimationFrame(popAnim);
    else{draw();document.getElementById('drop-zone').classList.remove('busy');advanceTurn();}
  }
  requestAnimationFrame(popAnim);
}

function advanceTurn(){
  // Check if anyone has turns left
  if(turnsLeft.every(t=>t<=0)){endGame();return;}
  // Advance to next player with turns (round-robin)
  for(let i=1;i<=numP;i++){
    const ni=(curP+i)%numP;
    if(turnsLeft[ni]>0){curP=ni;break;}
  }
  renderChips();  // render AFTER curP is updated so highlight is correct
  setStatus();
}

function setStatus(){
  const remaining=turnsLeft[curP];
  const s=document.getElementById('status');
  s.innerHTML=`<b style="color:${P_COLORS[curP]}">${esc(pNames[curP])}</b>, tap a column to drop · ${remaining} left`;
}

function renderChips(){
  const el=document.getElementById('player-row');el.innerHTML='';
  pNames.forEach((nm,i)=>{
    const chip=document.createElement('div');
    const total=scores[i].reduce((a,b)=>a+b,0);
    chip.className='player-chip'+(i===curP&&!gameOver?' active':'');
    chip.style.borderColor=i===curP&&!gameOver?P_COLORS[i]:'';
    chip.title=scores[i].join(' + ');
    const dots=Array.from({length:TURNS_PER_PLAYER},(_,k)=>`<i class="${k<TURNS_PER_PLAYER-turnsLeft[i]?'used':''}"></i>`).join('');
    chip.innerHTML=`<div class="pc-name" style="color:${P_COLORS[i]}">${esc(nm)}</div>
      <div class="pc-total">${total.toLocaleString()}</div>
      <div class="pc-drops" style="color:${P_COLORS[i]}" aria-label="${turnsLeft[i]} drops left">${dots}</div>`;
    el.appendChild(chip);
  });
}

function endGame(){
  gameOver=true;
  renderChips();  // show final scores for all players including last drop
  const totals=pNames.map((_,i)=>scores[i].reduce((a,b)=>a+b,0));
  const max=Math.max(...totals);
  const winners=totals.map((t,i)=>t===max?i:-1).filter(i=>i>=0);
  const wa=document.getElementById('winner-area');
  if(numP===1){
    wa.innerHTML=`<div class="winner-banner"><div style="font-size:2rem;line-height:1">🎯</div><div class="winner-name">${totals[0].toLocaleString()} points</div><div class="winner-pts">${scores[0].join(' + ')}</div></div>`;
  } else {
    const wText=winners.length===1?`${esc(pNames[winners[0]])} wins!`:`Tie: ${winners.map(i=>esc(pNames[i])).join(' & ')}`;
    wa.innerHTML=`<div class="winner-banner"><div style="font-size:2rem;line-height:1">🏆</div><div class="winner-name">${wText}</div><div class="winner-pts">${max.toLocaleString()} points</div></div>`;
  }
  GN.haptic('success');
  try{sessionStorage.removeItem('plinko2');}catch(e){}
  document.getElementById('status').textContent='Game over';
  document.getElementById('action-btns').style.display='flex';
  setTimeout(()=>document.getElementById('action-btns').scrollIntoView({behavior:'smooth',block:'end'}),150);
}

document.getElementById('play-again-btn').addEventListener('click',()=>{
  scores=Array.from({length:numP},()=>[]);
  turnsLeft=Array(numP).fill(TURNS_PER_PLAYER);
  curP=0;gameOver=false;
  document.getElementById('winner-area').innerHTML='';
  document.getElementById('action-btns').style.display='none';
  renderChips();setStatus();draw();
  window.scrollTo({top:0,behavior:'smooth'});
});
function toSetup(){
  if(animFrame)cancelAnimationFrame(animFrame);ball=null;dropping=false;
  document.getElementById('drop-zone').classList.remove('busy');
  pNames=[];gameOver=false;
  try{sessionStorage.removeItem('plinko2');}catch(e){}
  document.getElementById('gamearea').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
}
document.getElementById('new-game-btn').addEventListener('click',toSetup);
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// Tap the board itself to drop in that column
document.getElementById('canvas').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const c=Math.max(0,Math.min(COLS-1,Math.floor((e.clientX-r.left)/(r.width/COLS))));
  startDrop(c);
});
let _rz;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(!dropping&&!document.getElementById('gamearea').classList.contains('hidden')){setupCanvas();}},150);});

// ── Sound system ────────────────────────────────────────────────────────────
let audioCtx=null, soundOn=true;
let _lastPegSound=0; // throttle peg ticks so rapid collisions don't stack

function getCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

// Short band-passed noise burst — feels like a ball tapping a plastic pin
function playPegTick(speed){
  if(!soundOn) return;
  const now=performance.now();
  if(now-_lastPegSound<45) return; // max ~22 ticks/sec
  _lastPegSound=now;
  const ctx=getCtx(), t=ctx.currentTime;
  const dur=0.045;
  const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.25));
  const src=ctx.createBufferSource(); src.buffer=buf;
  const filt=ctx.createBiquadFilter();
  filt.type='bandpass';
  filt.frequency.value=700+Math.random()*500+(speed||0)*40;
  filt.Q.value=4;
  const gain=ctx.createGain();
  gain.gain.setValueAtTime(0.18+Math.min((speed||0)*0.015,0.1),t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
  src.start(t); src.stop(t+dur);
}

// Slightly lower thunk for wall bounces
function playWallBounce(){
  if(!soundOn) return;
  const ctx=getCtx(), t=ctx.currentTime;
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(280,t);
  osc.frequency.exponentialRampToValueAtTime(90,t+0.07);
  gain.gain.setValueAtTime(0.1,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+0.07);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.07);
}

// Score sounds — graded by slot value
function playScoreSound(value){
  if(!soundOn) return;
  const ctx=getCtx(), t=ctx.currentTime;
  function tone(freq,start,dur,vol,type='sine'){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t+start);
    g.gain.linearRampToValueAtTime(vol,t+start+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+start+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t+start); o.stop(t+start+dur);
  }
  if(value===5000){
    // Jackpot! Rising C-major arpeggio + shimmer
    [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*0.08,0.55,0.22));
    // Add a warm pad underneath
    tone(261.63,0,0.7,0.08,'triangle');
  } else if(value===1000){
    // Two bright dings — major third
    tone(880,0,0.4,0.2);
    tone(1108.73,0.07,0.35,0.15);
  } else if(value===500){
    // Single warm ding
    tone(660,0,0.32,0.18);
    tone(660*1.5,0.01,0.2,0.07,'triangle');
  } else {
    // 100 trap — low thud with a slight drop
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(140,t);
    o.frequency.exponentialRampToValueAtTime(55,t+0.18);
    g.gain.setValueAtTime(0.28,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+0.18);
  }
}

// Mute toggle
document.getElementById('mute-btn').addEventListener('click',function(){
  soundOn=!soundOn;
  this.textContent=soundOn?'🔊':'🔇';
});

document.getElementById('pl-newgame').addEventListener('click',()=>{
  const inGame=!document.getElementById('gamearea').classList.contains('hidden');
  if(!inGame)return;
  if(!gameOver&&scores.some(a=>a.length))GN.confirm('Current scores will be lost.',{title:'Start a new game?',ok:'New game'}).then(ok=>{if(ok)toSetup();});
  else toSetup();
});

// ── Session persistence ────────────────────────────────────────────────────
function _save_plinko2(){if(gameOver||!pNames.length)return;
  try{sessionStorage.setItem('plinko2',JSON.stringify({numP,pNames,scores,turnsLeft,curP,gameOver,_ts:Date.now()}));}catch(e){}
}
function _load_plinko2(){
  try{
    const raw=sessionStorage.getItem('plinko2');if(!raw)return false;
    const s=JSON.parse(raw);if(!s)return false;
    if(!Array.isArray(s.pNames)||!s.pNames.length||s.gameOver)return false;
    numP=s.numP;pNames=s.pNames;scores=s.scores;turnsLeft=s.turnsLeft;curP=s.curP;gameOver=false;
    showGame();
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_plinko2);
window.addEventListener('pagehide',_save_plinko2);
_load_plinko2();
</script>

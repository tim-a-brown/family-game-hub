<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plinko</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
body{background:
  radial-gradient(60% 34% at 50% 0%, rgba(255,206,90,.13) 0%, rgba(255,206,90,0) 70%),
  radial-gradient(50% 40% at 0% 30%, rgba(77,120,255,.10) 0%, rgba(77,120,255,0) 70%),
  radial-gradient(50% 40% at 100% 30%, rgba(255,92,154,.08) 0%, rgba(255,92,154,0) 70%),
  #0e0b20;}
.stage{max-width:560px;padding-top:0;padding-bottom:calc(var(--safe-b) + 8px);}

/* ── Show display: whose turn, chips left, running total ───────────────── */
.pk-show{--c:var(--p1);position:relative;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 12px;margin:0 0 8px;border-radius:16px;
  background:linear-gradient(180deg,#1d1538 0%,#0c0819 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,200,80,.5),inset 0 0 0 4px rgba(0,0,0,.35),inset 0 0 26px rgba(255,180,40,.07),0 8px 22px rgba(0,0,0,.45);}
.pk-who{flex:1;min-width:0;}
.pk-who .nm{display:block;font-weight:900;font-size:1rem;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pk-who .sub{display:block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,220,150,.6);margin-top:1px;}
.pk-pips{display:flex;gap:5px;margin-top:5px;}
.pk-pip{--c:var(--p1);position:relative;width:17px;height:17px;border-radius:50%;flex:none;
  background:repeating-conic-gradient(color-mix(in srgb,var(--c) 70%,#000) 0 10deg,color-mix(in srgb,var(--c) 75%,#fff) 10deg 20deg);
  box-shadow:0 1px 0 rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.3);}
.pk-pip::after{content:"";position:absolute;inset:16%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000) 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),0 0 0 1px rgba(0,0,0,.25);}
.pk-pip.used::after{display:none;}
.pk-pip.used{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16);}
.pk-pip.pop{animation:pop .45s var(--spring);}
.pk-tot{text-align:right;flex:none;}
.pk-tot small{display:block;font-size:.64rem;font-weight:900;letter-spacing:.16em;color:rgba(255,214,120,.7);}
.pk-tot b{display:block;font-family:var(--display);font-weight:400;font-size:2.05rem;line-height:1;color:#ffd45a;font-variant-numeric:tabular-nums;
  text-shadow:0 0 16px rgba(255,190,40,.5),0 2px 0 rgba(0,0,0,.55);}
.pk-plus{position:absolute;left:50%;top:-13px;margin-left:-60px;width:120px;text-align:center;padding:3px 10px;border-radius:999px;font-family:var(--display);font-size:1.05rem;color:#2b1a00;background:#ffd45a;
  box-shadow:0 4px 12px rgba(0,0,0,.4);opacity:0;transform:translateY(8px) scale(.7);transition:opacity .2s,transform .35s var(--spring);pointer-events:none;}
.pk-plus.show{opacity:1;transform:none;}
.pk-plus.zero{background:#3a3150;color:#ff8a95;}

/* Other players' totals (pass & play) */
.pk-strip{display:flex;gap:6px;margin:0 0 8px;}
.pk-pl{--c:var(--p1);flex:1;min-width:0;padding:5px 9px;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid transparent;transition:border-color .2s,background .2s;}
.pk-pl .n{display:flex;align-items:center;gap:5px;font-size:.76rem;font-weight:900;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pk-pl .n i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;}
.pk-pl .t{display:flex;align-items:baseline;justify-content:space-between;gap:4px;font-family:var(--display);font-size:1.02rem;color:var(--text);font-variant-numeric:tabular-nums;}
.pk-pl .t span{font-family:var(--font);font-size:.7rem;font-weight:800;color:var(--text-3);}
.pk-strip.n4 .pk-pl{padding:5px 7px;}
.pk-strip.n4 .pk-pl .t span{display:none;}
.pk-pl.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);}
.pk-pl.on .n{color:var(--c);}

/* ── The board: lacquered frame lined with bulbs ───────────────────────── */
.pk-frame{position:relative;margin:0 auto;padding:13px;border-radius:22px;
  background:linear-gradient(180deg,#2a2140 0%,#16112a 100%);
  box-shadow:inset 0 0 0 2px #d7a548,inset 0 0 0 3.5px #6b4d17,inset 0 0 0 5px rgba(255,220,140,.25),0 18px 40px rgba(0,0,0,.6);}
.pk-frame canvas{display:block;border-radius:6px;touch-action:none;cursor:grab;transition:filter .9s ease;
  box-shadow:0 0 0 2px #0a0716,0 0 0 3px rgba(215,165,72,.5);}
.pk-frame canvas:active{cursor:grabbing;}
.pk-b{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 40% 35%,#fffdf0 0%,#ffe08a 40%,#d99a12 100%);
  box-shadow:0 0 7px 1px rgba(255,205,80,.75);transition:opacity .3s;}
.pk-frame.chase .pk-b{animation:pkb 1.5s linear infinite;}
.pk-frame.chase .pk-b.q1{animation-delay:-.5s;}
.pk-frame.chase .pk-b.q2{animation-delay:-1s;}
.pk-frame.jack .pk-b{animation:pkj .3s linear infinite;}
.pk-frame.jack .pk-b.q1{animation-delay:-.1s;}
.pk-frame.jack .pk-b.q2{animation-delay:-.2s;}
@keyframes pkb{0%,32%{opacity:1;}34%,100%{opacity:.28;box-shadow:none;}}
@keyframes pkj{0%,32%{opacity:1;background:#fff;box-shadow:0 0 12px 3px rgba(255,230,140,.95);}34%,100%{opacity:.3;box-shadow:none;}}
.pk-frame.dim .pk-b{opacity:.18;box-shadow:none;animation:none;}
.pk-frame.shake{animation:shake .45s;}
.pk-hint{white-space:nowrap;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;margin-top:6px;text-align:center;font-weight:800;font-size:.92rem;color:var(--text-2);}
.pk-hint b{color:var(--c,var(--text));}
.pk-hint .ico{width:18px;height:18px;opacity:.8;}

/* ── Earn your chips ───────────────────────────────────────────────────── */
.pk-earn{position:relative;margin:4px auto 0;max-width:440px;padding:18px 16px 16px;border-radius:24px;text-align:center;
  background:linear-gradient(180deg,#22193f 0%,#120d24 100%);
  box-shadow:inset 0 0 0 2px #d7a548,inset 0 0 0 3.5px #6b4d17,0 18px 40px rgba(0,0,0,.55);}
.pk-earn .lbl{font-size:.74rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,214,120,.75);}
.pk-earn h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:2px 0 4px;color:#fff;}
.pk-earn .lead{color:var(--text-2);font-size:.92rem;margin:0 auto 12px;max-width:330px;}
.pk-earn .pk-pips{justify-content:center;gap:8px;margin:0 0 14px;}
.pk-earn .pk-pip{width:34px;height:34px;}
.pk-tag{position:relative;margin:0 6px 14px;padding:16px 16px 14px 34px;border-radius:12px 18px 18px 12px;transform:rotate(-1.2deg);text-align:left;
  background:linear-gradient(180deg,#fffaf0,#f3ead6);}
.pk-tag.shake{animation:tagshake .4s;}
@keyframes tagshake{0%,100%{transform:rotate(-1.2deg);}25%,75%{transform:rotate(-1.2deg) translateX(-7px);}50%{transform:rotate(-1.2deg) translateX(7px);}}
.pk-tag::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#1a1330;box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 0 0 2px rgba(0,0,0,.08);}
.pk-tag .item{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.1;color:#1f2a6b;}
.pk-tag .q{font-size:.86rem;font-weight:800;color:#6a6577;margin:8px 0 0;}
.pk-tag .pr{display:flex;align-items:baseline;gap:12px;margin-top:2px;}
.pk-tag .pr b{font-family:var(--display);font-weight:400;font-size:3.1rem;line-height:1;color:#c8102e;}
.pk-tag .pr span{font-size:.95rem;font-weight:900;color:#2a2a3a;}
.pk-tag .stamp{position:absolute;right:14px;top:12px;padding:4px 10px;border-radius:8px;font-weight:900;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;transform:rotate(6deg);border:2.5px solid currentColor;}
.pk-tag .stamp.ok{color:#118a45;}
.pk-tag .stamp.no{color:#c8102e;}
.pk-hl{display:flex;gap:10px;}
.pk-hl .btn{flex:1;min-height:58px;font-size:1.15rem;}
.pk-hl .btn .ico{width:22px;height:22px;}
.pk-hl .up .ico{transform:rotate(180deg);}
.pk-earn .skip{margin-top:10px;}
.pk-earn .next{margin-top:2px;}
</style>
</head>
<body>
<main class="stage" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el;
  var app = document.getElementById('app');
  var SAVE = 'plinko_state', HKEY = 'plinko';

  // ── The board, in board units (one slot = 1 unit wide) ────────────────────
  // Nine slots, symmetric, exactly like the show.
  var VALUES = [100, 500, 1000, 0, 10000, 0, 1000, 500, 100];
  var COLS = 9, ROWS = 14, GAP = 0.98;
  var Y0 = 1.3;                         // first row of pegs
  var YL = Y0 + (ROWS - 1) * GAP;       // last row (its pegs cap the slot dividers)
  var FLOOR = YL + 1.2;                 // bottom of the slots
  var PLATE = 0.8;                      // value plates under the slots
  var WALL = 0.2, R = 0.34, PR = 0.075, DIVW = 0.035, RAIL_Y = 0.62;
  var WU = COLS + 2 * WALL, HU = FLOOR + 0.06 + PLATE + 0.08;
  // Staggered rows: even rows sit over the slot centres, odd rows line up with
  // the dividers (with half pegs set into the side walls).
  // In the over-the-slot rows, the outside column gets a rounded bumper on the
  // wall instead of a peg, so a chip can never wedge between a peg and a wall.
  var BR = 0.3, PEGS = [];
  for (var r = 0; r < ROWS; r++) {
    var row = [];
    if (r % 2 === 0) { row.push({ x: 0, r: BR, b: 1 }); for (var k = 1; k < COLS - 1; k++) row.push({ x: k + 0.5, r: PR }); row.push({ x: COLS, r: BR, b: 1 }); }
    else for (var k2 = 0; k2 <= COLS; k2++) row.push({ x: k2, r: PR });
    PEGS.push(row);
  }

  // ── Chip physics: a disc with gravity, bounce, friction and spin ──────────
  var PH = { g: 34, damp: 0.1, eMin: 0.3, eMax: 0.5, mu: 0.2, jit: 0.35, wallE: 0.45, spinDamp: 0.6 };
  var H = 1 / 480;  // fixed physics step
  function newChip(x, rnd) {
    return { x: x, y: RAIL_Y, vx: (rnd() - 0.5) * 0.12, vy: 0.2, w: (rnd() - 0.5) * 2, a: rnd() * 6.28,
      t: 0, slot: -1, slotT: 0, done: false, refX: x, refY: RAIL_Y, refT: 0, nudges: 0, rnd: rnd };
  }
  function hitCircle(c, px, py, rad, ev, isPeg) {
    var dx = c.x - px, dy = c.y - py, m = R + rad, d2 = dx * dx + dy * dy;
    if (d2 >= m * m) return;
    var d = Math.sqrt(d2) || 1e-6, nx = dx / d, ny = dy / d;
    c.x = px + nx * m; c.y = py + ny * m;
    var vn = c.vx * nx + c.vy * ny;
    if (vn >= 0) return;
    if (isPeg) { // tiny imperfections: no two bounces are the same
      var j = (c.rnd() - 0.5) * PH.jit, cs = Math.cos(j), sn = Math.sin(j);
      var nx2 = nx * cs - ny * sn; ny = nx * sn + ny * cs; nx = nx2;
      vn = c.vx * nx + c.vy * ny; if (vn >= 0) vn = -0.01;
    }
    // Resting on top of a peg is unstable: roll off to one side
    if (isPeg && ny < -0.9) c.vx += (Math.abs(dx) > 0.004 ? (dx > 0 ? 1 : -1) : (c.rnd() < 0.5 ? -1 : 1)) * (vn > -1.2 ? 0.22 : 0.2 + c.rnd() * 0.2);
    var e = PH.eMin + c.rnd() * (PH.eMax - PH.eMin);
    var jn = -(1 + e) * vn;
    c.vx += jn * nx; c.vy += jn * ny;
    // Friction at the contact turns sliding into spin (disc: I = mR²/2)
    var tx = -ny, ty = nx, vt = c.vx * tx + c.vy * ty - c.w * R;
    var jt = -vt / 3, lim = PH.mu * jn;
    if (jt > lim) jt = lim; else if (jt < -lim) jt = -lim;
    c.vx += jt * tx; c.vy += jt * ty; c.w -= 2 * jt / R;
    if (ev && -vn > 0.3) ev.push({ x: px, y: py, s: -vn, peg: isPeg });
  }
  function step(c, h, ev) {
    c.t += h;
    c.vy += PH.g * h;
    var dmp = Math.exp(-PH.damp * h); c.vx *= dmp; c.vy *= dmp; c.w *= Math.exp(-PH.spinDamp * h);
    c.x += c.vx * h; c.y += c.vy * h; c.a += c.w * h;
    // Pegs in the rows around the chip
    var r0 = Math.floor((c.y - Y0) / GAP) - 1;
    for (var r = Math.max(0, r0); r <= Math.min(ROWS - 1, r0 + 3); r++) {
      var py = Y0 + r * GAP, row = PEGS[r];
      if (Math.abs(c.y - py) > R + BR) continue;
      for (var i = 0; i < row.length; i++) { var pg = row[i]; if (Math.abs(c.x - pg.x) < R + pg.r && Math.abs(c.y - py) < R + pg.r) hitCircle(c, pg.x, py, pg.r, ev, true); }
    }
    // Slot dividers (thin posts from the last peg row down to the floor)
    if (c.y + R > YL) {
      for (var dx = 1; dx < COLS; dx++) {
        if (Math.abs(c.x - dx) > R + DIVW) continue;
        var cy = Math.max(YL, Math.min(FLOOR, c.y));
        hitCircle(c, dx, cy, DIVW, ev, false);
      }
    }
    // Side walls
    // Side walls push the chip back into play (no wedging beside an edge peg)
    if (c.x < R) { c.x = R; if (c.vx < 0.5) { c.vx = Math.max(-c.vx * PH.wallE, 0.5); c.w *= 0.7; } }
    if (c.x > COLS - R) { c.x = COLS - R; if (c.vx > -0.5) { c.vx = Math.min(-c.vx * PH.wallE, -0.5); c.w *= 0.7; } }
    if (c.y < R * 0.6) { c.y = R * 0.6; if (c.vy < 0) c.vy = 0; }
    // Floor of the slots: settle and roll
    if (c.y + R > FLOOR) {
      c.y = FLOOR - R;
      if (c.vy > 0) { if (c.vy > 0.6 && ev) ev.push({ x: c.x, y: FLOOR, s: c.vy, floor: true }); c.vy = -c.vy * 0.28; }
      c.vx *= Math.exp(-6 * h); c.w = -c.vx / R;
    }
    // In a slot?
    if (c.y > YL + R * 0.3) {
      if (c.slot < 0) c.slot = Math.max(0, Math.min(COLS - 1, Math.floor(c.x)));
      c.slot = Math.max(0, Math.min(COLS - 1, Math.floor(c.x)));
      c.slotT += h;
      var sp = Math.abs(c.vx) + Math.abs(c.vy);
      if ((c.y + R >= FLOOR - 0.02 && sp < 0.35) || c.slotT > 3) { c.done = true; c.y = FLOOR - R; }
    }
    // Never stuck: if the chip has barely moved for a moment above the slots
    // (wedged against a wall, balanced on a peg), give it a nudge.
    if (c.t - c.refT > 0.55) {
      var moved = Math.abs(c.x - c.refX) + Math.abs(c.y - c.refY);
      if (moved < 0.06 && c.y < YL) {
        var dir = c.x < 4.4 ? 1 : c.x > 4.6 ? -1 : (c.rnd() < 0.5 ? -1 : 1);
        c.vx += dir * (1.1 + c.rnd() * 0.6); c.vy -= 0.5; c.w += dir * 3; c.nudges++;
        if (c.nudges > 4) c.x += dir * 0.08;
      }
      c.refX = c.x; c.refY = c.y; c.refT = c.t;
    }
    if (c.t > 30) { c.done = true; c.slot = Math.max(0, Math.min(COLS - 1, Math.floor(c.x))); c.y = FLOOR - R; }
  }
  // Test hook: drop n chips from x without drawing (used by the test harness)
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  window.PlinkoSim = {
    _ph: PH, _new: function (x, rnd) { return newChip(x, rnd); }, _step: function (c, ev) { step(c, H, ev); }, _mul: mulberry,
    run: function (x, n, seed) {
      var rnd = mulberry(seed || 1), hist = [0, 0, 0, 0, 0, 0, 0, 0, 0], times = [], nudged = 0, maxT = 0, timeouts = 0;
      for (var i = 0; i < n; i++) {
        var c = newChip(x, rnd), ev = [];
        while (!c.done) step(c, H, ev);
        hist[c.slot]++; times.push(c.t); if (c.nudges) nudged++; if (c.t > maxT) maxT = c.t; if (c.t > 30) timeouts++;
      }
      times.sort(function (a, b) { return a - b; });
      return { hist: hist, median: times[n >> 1], maxT: maxT, nudged: nudged, timeouts: timeouts };
    }
  };

  // ── Sounds (synthesized; respect the kit's sound setting) ─────────────────
  var actx = null;
  function soundOn() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }
  function ac() {
    if (!soundOn()) return null;
    try {
      if (!actx) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { return null; }
    return actx;
  }
  var lastTick = 0, lastBuzz = 0;
  function pegTick(speed) {
    var now = performance.now();
    if (now - lastBuzz > 85) { lastBuzz = now; Kit.haptic('tick'); }
    if (now - lastTick < 38) return; lastTick = now;
    var a = ac(); if (!a) return;
    try {
      var t = a.currentTime, vol = Math.min(0.16, 0.04 + speed * 0.025);
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(1900 + Math.random() * 700, t);
      o.frequency.exponentialRampToValueAtTime(900, t + 0.035);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.06);
      var n = Math.floor(a.sampleRate * 0.02), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      var s = a.createBufferSource(), f = a.createBiquadFilter(), g2 = a.createGain();
      f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 1.5; g2.gain.value = vol * 1.4;
      s.buffer = b; s.connect(f); f.connect(g2); g2.connect(a.destination); s.start(t);
    } catch (e) {}
  }
  function thunk() {
    var a = ac(); if (!a) return;
    try {
      var t = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.12);
      g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.18);
    } catch (e) {}
  }
  // "Wah wah wah waaah"
  function trombone() {
    var a = ac(); if (!a) return;
    try {
      var notes = [[233, 0, 0.32], [220, 0.36, 0.32], [208, 0.72, 0.32], [196, 1.08, 1.0]];
      var f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; f.Q.value = 4; f.connect(a.destination);
      notes.forEach(function (n, i) {
        var t = a.currentTime + n[1], o = a.createOscillator(), g = a.createGain();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(n[0] * 1.02, t); o.frequency.exponentialRampToValueAtTime(n[0], t + 0.08);
        if (i === 3) { var lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 6; lg.gain.value = 5; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t + 0.2); lfo.stop(t + n[2]); }
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.04);
        g.gain.setValueAtTime(0.09, t + n[2] - 0.12); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);
        o.connect(g); g.connect(f); o.start(t); o.stop(t + n[2] + 0.02);
      });
    } catch (e) {}
  }

  // ── Small prizes for "Earn your chips" (everyday retail prices) ──────────
  var PRIZES = [
    ['Electric toothbrush', 49], ['Beach towel set', 29], ['Waffle maker', 34], ['Family board game', 24],
    ['Bluetooth speaker', 59], ['50 ft garden hose', 38], ['Cast-iron skillet', 27], ['LED desk lamp', 42],
    ['Yoga mat', 22], ["Kids' bike helmet", 31], ['Drip coffee maker', 69], ['Slow cooker', 54],

    c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = Math.max(1, rad * 0.04);
    c.beginPath(); c.arc(m, m, rad * 0.8, 0, 6.283); c.stroke();

    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = Math.max(1, rad * 0.07);
    c.beginPath(); c.arc(m, m, rad * 0.5, 0, 6.283); c.stroke();
    for (var s = 0; s < 3; s++) {
      var a2 = s / 3 * 6.283;

    }
    c.fillStyle = shade(color, -0.25); c.beginPath(); c.arc(m, m, rad * 0.16, 0, 6.283); c.fill();
    sprites[color] = cc;
    return cc;
  }
  function shade(hex, amt) {
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim()); if (!m) return hex;
    var n = parseInt(m[1], 16), r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
    function f(v) { return Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt)); }

  }
  function drawChip(c, x, y, ang, color, lift, alpha) {
    var k = 1 + lift * 0.06;
    c.save(); c.globalAlpha = alpha == null ? 1 : alpha;
    // shadow on the board: tight when pressed flat, soft when held off it
    c.fillStyle = 'rgba(0,0,8,' + (0.45 - lift * 0.15) + ')';
    c.beginPath(); c.arc(X(x) + 0.04 + lift * 0.08, y + 0.07 + lift * 0.12, R * k * 1.02, 0, 6.283); c.fill();
    var sp = chipSprite(color), sz = sp.width / (scale * dpr) * k;
    c.translate(X(x), y); c.rotate(ang);
    c.drawImage(sp, -sz / 2, -sz / 2, sz, sz);
    c.rotate(-ang);
    // fixed highlight (light from the studio ceiling)
    var hl = c.createRadialGradient(-R * 0.35 * k, -R * 0.45 * k, 0, -R * 0.2 * k, -R * 0.25 * k, R * k);
    hl.addColorStop(0, 'rgba(255,255,255,.45)'); hl.addColorStop(0.5, 'rgba(255,255,255,.06)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hl; c.beginPath(); c.arc(0, 0, R * k, 0, 6.283); c.fill();
    c.restore();
  }
  function draw() {
    if (!g || !stat) return;
    var now = performance.now();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(stat, 0, 0);
    g.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    // A miss: the studio lights drop, only the slot stays lit
    if (dim) {
      var dt0 = (now - dim.t0) / 1000, da = Math.min(1, dt0 / 0.25) * (dim.out ? Math.max(0, 1 - (now - dim.out) / 700) : 1);
      if (dim.out && da <= 0) dim = null;
      else { g.fillStyle = 'rgba(4,2,14,' + (0.55 * da) + ')'; g.fillRect(0, 0, WU, HU); }
    }
    // Lit slot
    if (lit) {
      var age = (now - lit.t0) / 1000, co = slotColors(lit.v);
      var pulse = 0.55 + 0.45 * Math.sin(age * 9), fade = lit.out ? Math.max(0, 1 - (now - lit.out) / 500) : 1;
      if (fade <= 0) lit = null;
      else {
        var col = lit.v === 0 ? '255,70,90' : lit.v === 10000 ? '255,214,90' : '170,210,255';
        var sg = g.createLinearGradient(0, YL, 0, FLOOR);
        sg.addColorStop(0, 'rgba(' + col + ',0)'); sg.addColorStop(1, 'rgba(' + col + ',' + (0.42 * pulse * fade) + ')');
        g.fillStyle = sg; g.fillRect(X(lit.s), YL, 1, FLOOR - YL);
        g.save(); g.globalAlpha = fade;
        g.shadowColor = 'rgba(' + col + ',.95)'; g.shadowBlur = 18 * dpr * pulse;
        g.strokeStyle = 'rgba(' + col + ',' + (0.7 + 0.3 * pulse) + ')'; g.lineWidth = 0.06;
        rr(g, X(lit.s) + 0.05, FLOOR + 0.1, 0.9, PLATE - 0.04, 0.1); g.stroke();
        g.restore();
        void co;
      }
    }
    // Peg flashes
    glows = glows.filter(function (h) { return now - h.t < 260; });
    glows.forEach(function (h) {
      var a = 1 - (now - h.t) / 260;
      var gr = g.createRadialGradient(X(h.x), h.y, 0, X(h.x), h.y, PR * 3.2);
      gr.addColorStop(0, 'rgba(255,240,190,' + (0.85 * a) + ')'); gr.addColorStop(1, 'rgba(255,240,190,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(X(h.x), h.y, PR * 3.2, 0, 6.283); g.fill();
    });
    // Chips resting in slots, fading as they are collected
    fades = fades.filter(function (f) { return !f.out || now - f.out < 450; });
    fades.forEach(function (f) {
      var a = f.out ? 1 - (now - f.out) / 450 : 1;
      drawChip(g, f.x, f.y - (f.out ? (1 - a) * 0.4 : 0), f.a, f.color, 0, a);
    });
    // Active chip
    if (chip) drawChip(g, chip.x, chip.y, chip.a, P().color, 0, 1);
    else if (S && S.phase === 'drop' && (mode === 'aim' || mode === 'enter' || mode === 'press')) drawChip(g, aim.x, RAIL_Y, aim.a, P().color, aim.lift, 1);
    // Value pops
    pops = pops.filter(function (p) { return now - p.t < 1500; });
    pops.forEach(function (p) {
      var t = (now - p.t) / 1500, a = t < 0.75 ? 1 : 1 - (t - 0.75) / 0.25;
      var s = 0.5 + Math.min(1, t * 6) * 0.25 + (p.big ? 0.15 : 0);
      g.save(); g.globalAlpha = Math.max(0, a);
      g.font = s + 'px "Lilita One", system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      var y = p.y - t * 1.3, x = Math.max(1.4, Math.min(COLS - 1.4, p.x));
      g.lineWidth = 0.09; g.strokeStyle = 'rgba(0,0,0,.65)'; g.strokeText(p.text, X(x), y);
      g.fillStyle = p.color; g.fillText(p.text, X(x), y);
      g.restore();
    });
  }

  // ── Animation loop ────────────────────────────────────────────────────────
  var raf = 0, lastT = 0, acc = 0;
  function kick() { if (!raf && cv) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
  function stopLoop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function busy() {
    return mode === 'enter' || mode === 'press' || mode === 'drop' || aim.grab || Math.abs(aim.x - aim.tx) > 0.002 ||
      pops.length || glows.length || lit || dim || fades.some(function (f) { return f.out; });
  }
  function frame(now) {
    raf = 0;
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    update(dt);
    draw();
    if (busy() && cv && cv.isConnected) raf = requestAnimationFrame(frame);
  }
  function update(dt) {
    if (mode === 'enter') {
      var t = Math.min(1, (performance.now() - aim.t0) / 520), e = 1 - Math.pow(1 - t, 3);
      var nx = aim.fx + (aim.tx - aim.fx) * e;
      aim.a += (nx - aim.x) / R; aim.x = nx;
      if (t >= 1) { mode = 'aim'; paintHint(); }
    } else if (mode === 'aim') {
      var d = aim.tx - aim.x, stepX = d * Math.min(1, dt * 16);
      aim.x += stepX; aim.a += stepX / R;     // the chip rolls along the top as you slide it
      aim.lift += ((aim.grab ? 1 : 0) - aim.lift) * Math.min(1, dt * 14);
    } else if (mode === 'press') {
      var tp = Math.min(1, (performance.now() - aim.t0) / 150);
      var d2 = aim.tx - aim.x; aim.x += d2 * Math.min(1, dt * 20); aim.a += d2 * Math.min(1, dt * 20) / R;
      aim.lift = Math.max(0, aim.lift0 * (1 - tp));
      if (tp >= 1) { aim.a += (aim.tx - aim.x) / R; aim.x = aim.tx; launch(); }
    } else if (mode === 'drop' && chip) {
      acc += dt;
      var ev = [];
      while (acc >= H && !chip.done) { step(chip, H, ev); acc -= H; }
      ev.forEach(function (h) {
        if (h.floor) { thunk(); Kit.haptic('light'); return; }
        if (h.peg && h.x > 0.1 && h.x < COLS - 0.1) glows.push({ x: h.x, y: h.y, t: performance.now() });
        pegTick(h.s);
      });
      if (chip.done) landed();
    }
  }

  // ── Turn flow ─────────────────────────────────────────────────────────────
  function beginTurn(first) {
    chip = null;
    var p = P();
    mode = 'enter';
    aim.fx = first ? -0.8 : COLS + 0.8; aim.x = aim.fx; aim.tx = p.aim || 4.5; aim.lift = 0; aim.grab = false; aim.t0 = performance.now();
    Kit.sfx('whoosh');
    dom.frame.classList.add('chase'); dom.frame.classList.remove('jack', 'dim');
    paintShow(); paintHint();
    kick();
  }
  function canAim() { return S && S.phase === 'drop' && (mode === 'aim' || mode === 'enter'); }
  function toUnits(e) { var b = cv.getBoundingClientRect(); return (e.clientX - b.left) / b.width * WU - WALL; }
  function clampAim(x) { return Math.max(R + 0.02, Math.min(COLS - R - 0.02, x)); }
  function bindPointer() {
    cv.addEventListener('pointerdown', function (e) {
      if (!canAim()) return;
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (er) {}
      if (mode === 'enter') mode = 'aim';
      aim.grab = true; aim.tx = clampAim(toUnits(e));
      ac(); Kit.haptic('light'); kick();
    });
    cv.addEventListener('pointermove', function (e) { if (aim.grab) { aim.tx = clampAim(toUnits(e)); kick(); } });
    cv.addEventListener('pointerup', function (e) { if (!aim.grab) return; aim.grab = false; aim.tx = clampAim(toUnits(e)); release(); });
    cv.addEventListener('pointercancel', function () { aim.grab = false; kick(); });
    cv.addEventListener('keydown', function (e) {
      if (!canAim()) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault(); if (mode === 'enter') mode = 'aim';
        var c0 = Math.round(aim.tx - 0.5) + (e.key === 'ArrowLeft' ? -1 : 1);
        aim.tx = clampAim(Math.max(0, Math.min(COLS - 1, c0)) + 0.5); Kit.sfx('tick'); kick();
      } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (mode === 'enter') mode = 'aim'; release(); }
    });
  }
  document.addEventListener('keydown', function (e) {
    if (!cv || document.activeElement === cv || !canAim() || document.querySelector('.k-scrim,.k-win')) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') { cv.focus(); cv.dispatchEvent(new KeyboardEvent('keydown', { key: e.key })); e.preventDefault(); }
  });
  function release() {
    if (mode !== 'aim') return;
    // Settle onto a drop mark if you let go close to one
    var nearest = Math.round(aim.tx - 0.5) + 0.5;
    if (Math.abs(nearest - aim.tx) < 0.16) aim.tx = clampAim(nearest);
    mode = 'press'; aim.t0 = performance.now(); aim.lift0 = Math.max(aim.lift, 0.6);
    P().aim = aim.tx;
    Kit.haptic('medium');
    kick();
  }
  function launch() {
    chip = newChip(aim.x, Math.random); chip.a = aim.a;
    mode = 'drop'; acc = 0;
    dom.frame.classList.remove('chase');
    Kit.sfx('tap');
    paintHint();
  }
  function landed() {
    var p = P(), s = chip.slot, v = VALUES[s], before = total(p);
    mode = 'reveal';
    fades.push({ x: chip.x, y: chip.y, a: chip.a, color: p.color });
    chip = null;
    p.res.push(v);
    paintWho();
    var streak0 = p.res.length >= 2 && p.res[p.res.length - 2] === 0 && v === 0;
    save();
    lit = { s: s, v: v, t0: performance.now() };
    if (v !== 10000) pops.push({ text: money(v), x: s + 0.5, y: YL - 0.2, t: performance.now(), color: v === 0 ? '#ff8a95' : v === 10000 ? '#ffd45a' : '#ffffff', big: v === 10000 });
    countUp(before, before + v, v === 10000 ? 1400 : 900);
    dom.plus.textContent = v === 0 ? '$0' : '+' + money(v);
    dom.plus.classList.toggle('zero', v === 0);
    dom.plus.classList.add('show');
    var hold = 1700;
    if (v === 10000) {
      hold = 2900;
      dom.frame.classList.add('jack');
      Kit.callout('$10,000!');
      Kit.confetti({ count: 120, colors: ['#ffd45a', '#fff3c4', '#ffb000', '#ffffff', p.color] });
      Kit.sfx('win'); Kit.haptic('success');
    } else if (v === 0) {
      hold = 2200;
      Kit.sfx('bad'); setTimeout(trombone, 120); Kit.haptic('error');
      dom.frame.classList.add('dim'); dim = { t0: performance.now() };
      dom.frame.classList.remove('shake'); void dom.frame.offsetWidth; dom.frame.classList.add('shake');
      if (streak0) setTimeout(function () { Kit.toast('Two in a row on $0. Ouch!'); }, 500);
    } else {
      Kit.sfx(v >= 1000 ? 'good' : 'chip'); Kit.haptic(v >= 1000 ? 'success' : 'medium');

  }
  function afterReveal() {
    if (!S || mode !== 'reveal') return;
    dom.frame.classList.remove('jack', 'dim', 'shake');
    dom.plus.classList.remove('show');

    if (dim) dim.out = performance.now();
    fades.forEach(function (f) { if (!f.out) f.out = performance.now(); });

  var cuT = 0;
  function countUp(from, to, ms) {
    cancelAnimationFrame(cuT);
    var t0 = performance.now(), lastTk = 0;
    (function f(now) {
      var t = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - t, 3), v = from + (to - from) * e;
      dom.tot.textContent = money(to - from >= 100 ? Math.round(v / 100) * 100 : v);
      if (to > from && t < 1 && now - lastTk > 70) { lastTk = now; Kit.sfx('tick'); }
      if (t < 1) cuT = requestAnimationFrame(f); else { dom.tot.textContent = money(to); paintStrip(); }
    })(t0);
  }
  function paintShow() {
    if (!dom.show) return;
    paintWho();
    dom.tot.textContent = money(total(P()));
    paintStrip();
  }
  function paintWho() {
    var p = P();
    dom.show.style.setProperty('--c', p.color);
    var pips = '';
    for (var i = 0; i < p.chips; i++) pips += '<i class="pk-pip' + (i < p.res.length ? ' used' : '') + '" style="--c:' + p.color + '"></i>';
    var sub = S.phase === 'over' ? 'Final' : mode === 'reveal' ? 'Chip ' + p.res.length + ' of ' + p.chips : left(p) > 0 ? 'Chip ' + (p.res.length + 1) + ' of ' + p.chips : 'All chips played';
    dom.who.innerHTML = '<span class="nm">' + Kit.esc(p.name) + '</span><span class="sub">' + sub + '</span><div class="pk-pips">' + pips + '</div>';
  }
  function paintStrip() {
    if (!dom.strip) return;
    dom.strip.innerHTML = '';
    S.players.forEach(function (p, i) {
      dom.strip.appendChild(el('div', { class: 'pk-pl' + (i === S.cur && S.phase === 'drop' ? ' on' : ''), style: { '--c': p.color } }, [
        el('div', { class: 'n' }, [el('i'), el('span', { text: p.name })]),
        el('div', { class: 't' }, [document.createTextNode(money(total(p))), el('span', { text: left(p) + ' left' })])
      ]));
    });
  }
  function paintHint(v) {
    if (!dom.hint) return;
    var p = P(), who = S.players.length > 1 ? '<b>' + Kit.esc(p.name) + '</b>: ' : '';
    dom.hint.style.setProperty('--c', p.color);
    var h;
    if (mode === 'aim' || mode === 'enter') h = Kit.icon('hand') + '<span>' + who + (who ? 'drag to aim, let go' : 'drag the chip to aim, let go to drop') + '</span>';
    else if (mode === 'press' || mode === 'drop') h = '<span>Come on, big money!</span>';
    else if (mode === 'reveal') h = '<span>' + (v === 10000 ? 'The top slot!' : v === 0 ? 'Nothing this time' : money(v) + ' for ' + Kit.esc(p.name)) + '</span>';
    else h = '<span>That\'s every chip</span>';
    dom.hint.innerHTML = h;
  }

  // ── End of game ───────────────────────────────────────────────────────────
  function finish() {
    if (!S || S.phase === 'over') return;
    S.phase = 'over';
    var ps = S.players, multi = ps.length > 1;
    var rank = ps.map(function (p) { return { name: p.name, total: total(p), color: p.color }; }).sort(function (a, b) { return b.total - a.total; });
    var top = rank[0], tie = multi && rank[1].total === top.total;
    var maxChips = Math.max.apply(null, ps.map(function (p) { return p.chips; }));
    var rounds = { labels: [], scores: [] };
    for (var c = 0; c < maxChips; c++) {
      rounds.labels.push('Chip ' + (c + 1));
      rounds.scores.push(ps.map(function (p) { return c < p.res.length ? p.res[c] : null; }));
    }
    // Highlights
    var hl = [], words = ['', 'once', 'twice', 'three times', 'four times', 'five times'];
    ps.forEach(function (p) {
      var tens = p.res.filter(function (v) { return v === 10000; }).length;
      if (total(p) === 50000) hl.push(p.name + ' won the top prize: $50,000!');
      else if (tens) hl.push(p.name + ' hit the $10,000 slot' + (tens > 1 ? ' ' + words[tens] : ''));
      var run = 0, best = 0;
      p.res.forEach(function (v) { run = v === 0 ? run + 1 : 0; if (run > best) best = run; });
      if (best >= 2) hl.push((best === 2 ? 'Two' : best === 3 ? 'Three' : best === 4 ? 'Four' : 'Five') + (multi ? ' of ' + p.name + '\'s' : '') + ' chips in a row landed on $0');
      else if (p.res.length >= 4 && p.res.indexOf(0) < 0) hl.push(p.name + ' never hit a $0 slot');
      if (S.earn && !p.skipped) {
        var right = (p.priced || []).filter(function (x) { return x.ok; }).length;
        if (right === 4) hl.push(p.name + ' priced all 4 prizes for 5 chips');
        else if (right === 0 && (p.priced || []).length === 4) hl.push(p.name + ' missed all 4 prizes and played 1 chip');
      }
    });
    var bestChip = { v: -1 };
    ps.forEach(function (p) { p.res.forEach(function (v, i) { if (v > bestChip.v) bestChip = { v: v, who: p.name, i: i }; }); });
    if (bestChip.v > 0 && bestChip.v < 10000) hl.push('Best chip: ' + (multi ? bestChip.who + ', ' : '') + money(bestChip.v) + ' (chip ' + (bestChip.i + 1) + ')');
    if (!multi) hl.push('Total winnings: ' + money(top.total) + ' from ' + ps[0].chips + ' chip' + (ps[0].chips === 1 ? '' : 's'));
    else if (!tie) hl.push(top.name + ' won by ' + money(top.total - rank[1].total));
    Kit.record(HKEY, {
      started: S.started, mode: (multi ? 'Pass & play' : 'Solo') + (S.earn ? '' : ' · 5 chips'),
      players: ps.map(function (p) { return { name: p.name, score: total(p) }; }),
      winner: multi ? (tie ? null : top.name) : top.name,
      rounds: rounds, highlights: hl.slice(0, 6),
      summary: multi ? (tie ? 'Tie game' : top.name + ' won') + ' · ' + rank.map(function (r) { return money(r.total); }).join(' – ') : top.name + ' won ' + money(top.total)
    });
    clearSave();
    paintShow();
    var players = ps.map(function (p) { return { name: p.name, color: p.color }; }), earn = S.earn;
    Kit.win({
      icon: 'trophy',
      title: multi ? (tie ? "It's a tie!" : top.name + ' wins!') : money(top.total) + '!',
      sub: multi ? 'Total winnings' : top.total === 0 ? 'Every chip found a $0 slot. Next time!' : 'Total winnings' + (bestChip.v > 0 ? ' · best chip ' + money(bestChip.v) : ''),
      rank: multi ? rank.map(function (r) { return { name: r.name, score: money(r.total), color: r.color }; }) : null,
      lose: !multi && top.total === 0,
      again: function () { start(players, earn); },
      extra: [{ label: 'Change players', onClick: showSetup }]
    });
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { lastT = performance.now(); kick(); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (cv && cv.isConnected) { drawStatic(); draw(); } });
  (function boot() {
    var s = load();
    if (!s || s.phase === 'over') { showSetup(); return; }
    S = s;
    if (S.phase === 'earn' && S.quiz) renderEarn();
    else {
      S.phase = 'drop';
      if (S.players.every(function (p) { return left(p) <= 0; })) { renderBoard(); mode = 'idle'; paintHint(); setTimeout(finish, 400); }
      else { if (left(P()) <= 0) afterResumeFix(); enterBoard(); }
    }
  })();
  function afterResumeFix() {
    var n = S.players.length;
    for (var k = 0; k < n; k++) { var j = (S.cur + k) % n; if (left(S.players[j]) > 0) { S.cur = j; return; } }
  }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horse Race</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../casino.js"></script>
<style>
/* ── Casino chips (same as roulette/craps; candidates for the kit) ───────
   Standard colors: 1 white, 5 red, 25 green, 100 black, 500 purple. */
.c3{--cs:28px;--c:#c8202f;--s:#fff;--k:#fff;
  position:relative;width:var(--cs);height:var(--cs);border-radius:50%;flex:none;
  display:grid;place-items:center;color:var(--k);font:900 calc(var(--cs) * .36)/1 var(--font);letter-spacing:-.03em;
  background:
    radial-gradient(circle, var(--c) 0 46%, var(--s) 47% 50%, var(--c) 51% 63%, transparent 64%),
    repeating-conic-gradient(from 8deg, var(--s) 0 16deg, var(--c) 16deg 45deg);
  box-shadow:0 calc(var(--cs) * .06) 0 color-mix(in srgb,var(--c) 55%,#000), 0 calc(var(--cs) * .1) calc(var(--cs) * .14) rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.18);}
.c3.d1{--c:#f1ece0;--s:#2f6bd8;--k:#1d2440;}
.c3.d5{--c:#c8202f;--s:#fff;}
.c3.d25{--c:#1d8a4b;--s:#fff;}
.c3.d100{--c:#1b1b22;--s:#e8e2d0;}
.c3.d500{--c:#6a3aa2;--s:#f3d34a;}
.stk{position:relative;width:var(--cs);height:calc(var(--cs) + 10px);flex:none;}
.stk .c3{position:absolute;left:0;bottom:0;}
.stk .c3:not(:last-child){font-size:0;}
.flychip{position:fixed;z-index:400;pointer-events:none;transition:transform .38s var(--ease), opacity .38s;}

/* ── Track window ──────────────────────────────────────────────────────── */
.stage.hr{max-width:620px;padding-bottom:calc(var(--rail,190px) + var(--safe-b) + 14px);}
.tw{border-radius:20px;padding:7px;margin-bottom:10px;}
.tw-in{position:relative;border-radius:14px;overflow:hidden;background:#5d8f3e;box-shadow:inset 0 0 0 2px rgba(0,0,0,.3);}
.trk{display:block;width:100%;height:200px;}
.hud{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;}
.hud span{background:rgba(12,10,20,.72);color:#fff;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.78rem;white-space:nowrap;}
.hud span b{color:#ffd54a;font-weight:900;}
.pstrip{position:relative;height:34px;margin-top:6px;border-radius:10px;background:linear-gradient(#17141f,#0d0b12);box-shadow:inset 0 2px 6px rgba(0,0,0,.7);overflow:hidden;}
.pstrip .lb{position:absolute;left:8px;top:0;bottom:0;display:flex;align-items:center;font-size:.6rem;font-weight:900;letter-spacing:.12em;color:#8d8678;text-transform:uppercase;}
.pstrip .sc{position:absolute;top:5px;width:30px;height:24px;border-radius:5px;display:grid;place-items:center;font:400 1rem/1 var(--display);transition:left .45s var(--ease);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.3);}
.pstrip .sc.mine::after{content:"";position:absolute;left:3px;right:3px;bottom:-4px;height:3px;border-radius:2px;background:#ffd54a;}
.call{min-height:58px;display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:10px 14px;border-radius:16px;background:linear-gradient(#221b3e,#18132d);box-shadow:inset 0 0 0 1px var(--line-2);}
.call .ico{width:22px;height:22px;flex:none;color:#ffd54a;}
.call p{margin:0;font:400 1.15rem/1.2 var(--display);letter-spacing:.01em;}
.call p.new{animation:rise .35s var(--ease);}

/* ── Bank strip ────────────────────────────────────────────────────────── */
.bank{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.bank div{background:rgba(255,255,255,.06);border-radius:12px;padding:5px 8px;text-align:center;min-width:0;}
.bank small{display:block;font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.bank b{display:block;font-size:1.08rem;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gold{color:var(--yellow);} .pos{color:var(--green)!important;} .neg{color:var(--red)!important;}
.stand{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 10px;padding-bottom:2px;scrollbar-width:none;}
.stand::-webkit-scrollbar{display:none;}
.stand .pp{flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:800;font-size:.85rem;white-space:nowrap;}
.stand .pp.on{background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:inset 0 0 0 2px var(--c);}
.stand .pp.out{opacity:.45;}
.stand .pp b{font-variant-numeric:tabular-nums;}

/* ── Bet types and info ───────────────────────────────────────────────── */
.btypes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.btypes button{min-height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.07);font-weight:900;font-size:.95rem;color:var(--text-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
.btypes button small{font-size:.66rem;font-weight:800;color:var(--text-3);margin-top:2px;}
.btypes button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000);}
.btypes button.on small{color:inherit;opacity:.75;}
.pinfo{font-size:.88rem;color:var(--text-2);font-weight:700;margin:0 2px 10px;line-height:1.35;min-height:2.6em;}
.pinfo b{color:var(--text);}

/* ── The program (paper) ───────────────────────────────────────────────── */
.prog{border-radius:14px;overflow:hidden;color:#25222f;margin-bottom:12px;
  background:radial-gradient(rgba(120,90,40,.06) 1px,transparent 1px) 0 0/5px 5px,linear-gradient(180deg,#fffaf0,#f3ead6);box-shadow:0 14px 30px rgba(0,0,0,.45);}
.prog .ph{display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px 6px;border-bottom:2px solid #25222f;}
.prog .ph h3{margin:0;font:400 1.25rem/1 var(--display);color:#25222f;}
.prog .ph span{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#7a7286;}
.hz{display:grid;grid-template-columns:30px 30px minmax(0,1fr) auto;gap:9px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 12px;min-height:62px;border-bottom:1px dashed rgba(60,50,90,.22);color:inherit;position:relative;transition:background .15s;}
.hz:last-child{border-bottom:0;}
.hz.on{background:rgba(255,200,61,.42);}
.hz.foc:not(.on){background:rgba(60,50,90,.06);}
.cloth{width:30px;height:36px;border-radius:5px;display:grid;place-items:center;font:400 1.25rem/1 var(--display);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.3);}
.silk{width:30px;height:30px;display:block;}
.hn{min-width:0;}
.hn b{display:block;font:400 1.08rem/1.15 var(--display);color:#1d1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hn small{display:block;font-size:.74rem;color:#5a5670;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hn .tg{display:inline-block;font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:rgba(60,50,90,.1);color:#4a4560;margin-right:4px;vertical-align:1px;}
.ml{text-align:right;}
.ml b{display:block;font:400 1.4rem/1 var(--display);color:#1f2a6b;}
.ml small{display:inline-block;margin-top:4px;font-size:.58rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:rgba(60,50,90,.1);color:#4a4560;white-space:nowrap;}
.hn .fm{font-family:var(--mono);font-weight:800;color:#1d1a2e;display:inline;font-size:.8rem;}
.hz .bdg{position:absolute;left:4px;top:4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#1d1a2e;color:#ffd54a;font:900 .68rem/20px var(--font);text-align:center;}
.hz .mk{position:absolute;right:6px;top:4px;width:9px;height:9px;border-radius:50%;background:#c8202f;box-shadow:0 0 0 2px #fff;}

/* ── Bet slip ─────────────────────────────────────────────────────────── */
.slip{border-radius:16px;background:rgba(255,255,255,.05);padding:8px 10px;margin-bottom:12px;}
.slip h4,.mytk h4{margin:2px 2px 6px;font-size:.7rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);display:flex;justify-content:space-between;}
.tk{display:flex;align-items:center;gap:10px;padding:6px 2px;border-top:1px solid var(--line);}
.tk:first-of-type{border-top:0;}
.tk .tx{flex:1;min-width:0;}
.tk .tx b{display:block;font-weight:900;font-size:.95rem;}
.tk .tx small{display:block;color:var(--text-3);font-weight:700;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tk .am{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;}
.tk .am small{display:block;font-size:.72rem;color:var(--text-3);font-weight:800;}
.tk .x{width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--text-3);}
.tk .x .ico{width:18px;height:18px;}
.tk.drop{animation:pop .3s var(--spring);}
.cl{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 3px;border-radius:4px;font:400 .8rem/1 var(--display);vertical-align:-3px;margin-right:2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);}
.empty{color:var(--text-3);font-weight:700;font-size:.88rem;padding:6px 2px;}

/* ── Results: tote board and tickets ──────────────────────────────────── */
.tote{border-radius:18px;padding:7px;margin-bottom:10px;}
.tote .bd{border-radius:12px;padding:10px 10px 8px;background:linear-gradient(#141218,#0b0a0e);box-shadow:inset 0 2px 10px rgba(0,0,0,.9);color:#ffd54a;}
.tote .top{display:flex;justify-content:space-between;align-items:baseline;font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#8d8678;margin-bottom:6px;}
.tote table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.tote th{font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#8d8678;text-align:right;padding:0 0 4px;}
.tote th:first-child{text-align:left;}
.tote td{padding:5px 0;border-top:1px solid rgba(255,213,74,.12);font:400 1.02rem/1.1 var(--display);text-align:right;white-space:nowrap;}
.tote td.nm{text-align:left;color:#fff;font-size:.98rem;max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;padding-right:4px;}
.tote td.ps{width:26px;text-align:left;color:#c8bfa8;}
.tote td.pr{padding-left:8px;min-width:50px;}
.tote .ex{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,213,74,.25);font:400 .98rem/1.25 var(--display);}
.tote .ex span{color:#c8bfa8;}
.tote .note{margin-top:8px;font-size:.8rem;font-weight:800;color:#c8bfa8;line-height:1.35;}
.tote .note b{color:#fff;}
.mytk{border-radius:16px;background:rgba(255,255,255,.05);padding:8px 10px;margin-bottom:12px;}
.mytk .who{display:flex;align-items:center;gap:8px;margin:8px 2px 2px;font-weight:900;}
.mytk .who .grow{flex:1;}
.stamp{font:400 .8rem/1 var(--display);letter-spacing:.06em;padding:4px 7px;border-radius:6px;border:2px solid currentColor;transform:rotate(-6deg);display:inline-block;}
.stamp.w{color:var(--green);animation:pop .4s var(--spring) both;}
.stamp.l{color:var(--text-3);opacity:.7;}
.tk.won .am{color:var(--green);}

/* ── Rail (fixed to the bottom) ───────────────────────────────────────── */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px calc(12px + var(--corner-x)) calc(var(--safe-b) + 10px + var(--corner-y));border-radius:22px 22px 0 0;}
.rail-in{max-width:620px;margin:0 auto;}
.pk{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 10px;margin-bottom:6px;border-radius:12px;background:rgba(0,0,0,.3);font-weight:800;font-size:.9rem;}
.pk .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pk .pay{color:#ffd54a;white-space:nowrap;font-weight:900;}
.pk .muted{color:rgba(255,255,255,.65);}
.pk .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#1a1033;font-weight:900;font-size:.72rem;flex:none;}
.tray{display:flex;justify-content:center;gap:clamp(6px,2.6vw,14px);padding:2px 0 8px;}
.tray button{border:0;padding:0;background:none;border-radius:50%;transition:transform .15s var(--spring), filter .2s;}
.tray button:active:not(:disabled){transform:translateY(-6px);}
.tray .c3{--cs:50px;font-size:.98rem;}
.tray button:disabled{filter:grayscale(.8) brightness(.6);cursor:default;}
.acts{display:flex;gap:8px;align-items:center;}
.acts .icon-btn{width:52px;height:52px;background:rgba(0,0,0,.28);flex:none;}
.acts .btn{min-height:52px;}
.acts .go{flex:1;}
.acts .clr{padding:0 14px;}

/* Phases: show the right panels */
.ph-race .bet-only,.ph-result .bet-only,.ph-bet .race-only,.ph-result .race-only:not(.keep),.ph-bet .res-only,.ph-race .res-only{display:none!important;}
@media (min-width:700px){ .tray .c3{--cs:56px;} }

.hcol{display:contents;}
/* ── Wide landscape (iPad, laptop): track and bets on the left, program / results on the right ── */
@media (orientation:landscape) and (min-width:900px) and (min-height:560px){
  .stage.hr.ph-bet,.stage.hr.ph-result{max-width:1160px;display:flex;align-items:flex-start;gap:24px;}
  .stage.hr.ph-bet .hcol,.stage.hr.ph-result .hcol{display:block;flex:1 1 0;min-width:0;}
  .stage.hr.ph-bet .hcol.b,.stage.hr.ph-result .hcol.b{flex:0 1 460px;}
  .stage.hr.ph-bet .hz{min-height:52px;padding-top:5px;padding-bottom:5px;}
  .stage.hr.ph-bet .prog{margin-bottom:10px;}
  .rail-in{max-width:760px;}
}
</style>
</head>
<body>
<main class="stage hr" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el, esc = Kit.esc, app = document.getElementById('app');
  var SAVE = 'horserace_state', HKEY = 'horserace';

  // ═════════════════════════════════════════════════════════════════════════
  // ENGINE-START (pure maths, no DOM; scratch tests extract this block)
  // Morning-line odds ladder, as printed in a real program.
  var LADDER = [[6, 5], [7, 5], [3, 2], [8, 5], [9, 5], [2, 1], [5, 2], [3, 1], [7, 2], [4, 1], [9, 2], [5, 1], [6, 1], [8, 1], [10, 1], [12, 1], [15, 1], [20, 1], [30, 1]];
  // House edge on each bet type. Win's edge comes from the program odds (the
  // "overround": the odds' implied chances add up to 105-109%).
  var EDGE = { P: 0.08, S: 0.08, EX: 0.12, QU: 0.12, TRI: 0.15 };
  var NEED = { W: 1, P: 1, S: 1, EX: 2, QU: 2, TRI: 3 };
  var MAXODDS = 5000;
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function gauss(r) { return Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r()); }
  function qOf(o) { return o[1] / (o[0] + o[1]); }
  // Hidden strengths -> program odds. Returns ladder indices.
  function makeOdds(n, r) {
    var w = [], s = 0, i, k;
    for (i = 0; i < n; i++) { w.push(Math.exp(gauss(r) * 0.78)); s += w[i]; }
    var p0 = w.map(function (x) { return x / s; }), M = 1.07;
    var idx = p0.map(function (p) {
      var t = p * M, b = 0, bd = 1e9;
      for (k = 0; k < LADDER.length; k++) { var d = Math.abs(Math.log(qOf(LADDER[k]) / t)); if (d < bd) { bd = d; b = k; } }
      return b;
    });
    for (var it = 0; it < 80; it++) {
      var OR = idx.reduce(function (a, k) { return a + qOf(LADDER[k]); }, 0), bi = -1, bv = -1e9;
      if (OR < 1.05) {        // too generous: lengthen the horse whose odds are most "too short"... shorten instead
        idx.forEach(function (k, i) { if (k > 0) { var v = Math.log(p0[i] * M / qOf(LADDER[k])); if (v > bv) { bv = v; bi = i; } } });
        if (bi < 0) break; idx[bi]--;
      } else if (OR > 1.09) {
        idx.forEach(function (k, i) { if (k < LADDER.length - 1) { var v = Math.log(qOf(LADDER[k]) / (p0[i] * M)); if (v > bv) { bv = v; bi = i; } } });
        if (bi < 0) break; idx[bi]++;
      } else break;
    }
    return idx;
  }
  // Odds plus the true chances: each horse wins with chance (implied chance / overround)
  function genOdds(n, r) {
    var idx = makeOdds(n, r), ml = idx.map(function (k) { return LADDER[k]; });
    var OR = ml.reduce(function (a, o) { return a + qOf(o); }, 0);
    return { ml: ml, OR: OR, p: ml.map(function (o) { return qOf(o) / OR; }) };
  }
  // Finishing order: pick the winner by strength, then 2nd from the rest, and so on (Harville model)
  function harville(p, r) {
    var left = p.map(function (x, i) { return i; }), out = [];
    while (left.length) {
      var tot = 0; left.forEach(function (i) { tot += p[i]; });
      var x = r() * tot, j = 0;
      for (; j < left.length - 1; j++) { x -= p[left[j]]; if (x < 0) break; }
      out.push(left[j]); left.splice(j, 1);
    }
    return out;
  }
  function pWin(p, i) { return p[i]; }
  function pEx(p, i, j) { return p[i] * p[j] / (1 - p[i]); }
  function pTri(p, i, j, k) { return p[i] * p[j] / (1 - p[i]) * p[k] / (1 - p[i] - p[j]); }
  function pPlace(p, i) { var s = p[i]; for (var j = 0; j < p.length; j++) if (j !== i) s += pEx(p, j, i); return s; }
  function pShow(p, i) {
    var s = pPlace(p, i);
    for (var j = 0; j < p.length; j++) for (var k = 0; k < p.length; k++) if (j !== i && k !== i && j !== k) s += pTri(p, j, k, i);
    return s;
  }
  // Prices are rounded down: to 0.05 under 2-1, 0.1 under 10-1, whole numbers under 100-1, then 5s and 50s
  function roundOdds(m) {
    if (m < 0.05) return 0.05;
    if (m < 2) return Math.floor(m * 20 + 1e-9) / 20;
    if (m < 10) return Math.floor(m * 10 + 1e-9) / 10;
    if (m < 100) return Math.floor(m + 1e-9);
    if (m < 1000) return Math.floor(m / 5 + 1e-9) * 5;
    return Math.min(MAXODDS, Math.floor(m / 50 + 1e-9) * 50);
  }
  // Profit per $1 for a bet (fixed when you bet)
  function price(F, type, sel) {
    var h = F.horses, p = h.map(function (x) { return x.p; });
    if (type === 'W') return h[sel[0]].ml[0] / h[sel[0]].ml[1];
    var pr = type === 'P' ? pPlace(p, sel[0]) : type === 'S' ? pShow(p, sel[0])
      : type === 'EX' ? pEx(p, sel[0], sel[1]) : type === 'QU' ? pEx(p, sel[0], sel[1]) + pEx(p, sel[1], sel[0])
      : pTri(p, sel[0], sel[1], sel[2]);
    return roundOdds((1 - EDGE[type]) / pr - 1);
  }
  function wins(type, sel, order) {
    switch (type) {
      case 'W': return order[0] === sel[0];
      case 'P': return order.indexOf(sel[0]) < 2;
      case 'S': return order.indexOf(sel[0]) < 3;
      case 'EX': return order[0] === sel[0] && order[1] === sel[1];
      case 'QU': return order.slice(0, 2).indexOf(sel[0]) >= 0 && order.slice(0, 2).indexOf(sel[1]) >= 0;
      case 'TRI': return order[0] === sel[0] && order[1] === sel[1] && order[2] === sel[2];
    }
    return false;
  }
  // Ticket return (stake + winnings), to the nearest dollar
  function payout(amt, m) { return Math.round(amt * (1 + m) + 1e-9); }
  function fmtOdds(m) {
    var s = m < 2 ? String(Math.round(m * 100) / 100) : m < 10 ? m.toFixed(1).replace(/\.0$/, '') : Math.round(m).toLocaleString();
    return s + ' to 1';
  }
  // ENGINE-END
  // ═════════════════════════════════════════════════════════════════════════

  // ── Data ─────────────────────────────────────────────────────────────────

      '<h3>How the odds work</h3><p>Every horse has a hidden <b>strength</b>. The race result is drawn from those strengths: the winner is picked by strength, then 2nd place from the horses left, then 3rd. So a 2-1 favorite wins about a third of the time and a 30-1 longshot about once in 30 races.</p>' +

    var F = S.field, order = rc.order, per = S.players.map(function () { return { stake: 0, ret: 0 }; });
    var before = S.players.map(function (p, i) { return bal(i); });
    rc.res = S.tickets.map(function (k) {
      var w = wins(k.type, k.sel, order), ret = w ? payout(k.amt, k.m) : 0;
      give(k.p, ret); per[k.p].stake += k.amt; per[k.p].ret += ret;
      var pl = S.players[k.p];
      if (w) {
        pl.hits++;
        var prof = ret - k.amt, desc = BT[k.type] + ' bet on #' + k.sel.map(function (i) { return F.horses[i].post; }).join('-');
        var nk = S.raceNo + ':' + k.k;
        if (!pl.best || prof > pl.best.amt) pl.best = { amt: prof, t: desc + ' in race ' + S.raceNo, nk: nk };
        if (k.type === 'TRI' || k.type === 'EX' || k.type === 'QU') S.notes.push({ nk: nk, w: 3 + prof / 50, t: pl.name + ' hit the ' + BT[k.type].toLowerCase() + ' ' + k.sel.map(function (i) { return F.horses[i].post; }).join(k.type === 'QU' ? '/' : '-') + ' in race ' + S.raceNo + ' for ' + money(ret) });
        else if (prof >= 50 || k.m >= 10) S.notes.push({ nk: nk, w: 2 + prof / 80, t: pl.name + ' cashed a ' + money(k.amt) + ' ' + BT[k.type].toLowerCase() + ' ticket on ' + F.horses[k.sel[0]].name + ' for ' + money(ret) });
      }
      return ret;
    });
    rc.before = before;
    var nets = per.map(function (x) { return x.ret - x.stake; });
    S.players.forEach(function (p, i) { p.net += nets[i]; p.wagered += per[i].stake; p.ret += per[i].ret; });
    var wH = F.horses[order[0]], wOdds = wH.ml[0] / wH.ml[1];
    var fav = F.horses.reduce(function (a, h, i) { return h.p > F.horses[a].p ? i : a; }, 0);
    if (wOdds >= 10) {
      var backers = S.tickets.filter(function (k) { return wins(k.type, k.sel, order) && k.sel[0] === order[0]; }).map(function (k) { return S.players[k.p].name; });
      backers = backers.filter(function (n, i) { return backers.indexOf(n) === i; });
      S.notes.push({ w: 2 + wOdds / 10, t: wH.name + ' won race ' + S.raceNo + ' at ' + mlText(wH.ml) + (backers.length ? ' and ' + backers.join(' and ') + (backers.length > 1 ? ' had it' : ' had it') : '') });
    }
    if (rc.photo) S.notes.push({ w: 2.5, t: 'Photo finish in race ' + S.raceNo + ': ' + wH.name + ' by ' + lengthsText(rc.gaps[0]) + ' over ' + F.horses[order[1]].name });
    if (!solo()) S.players.forEach(function (p, i) { if (p.stack < 1 && before[i] + per[i].stake >= 1 && !p.broke) { p.broke = S.raceNo; S.notes.push({ w: 1.5, t: p.name + ' ran out of money in race ' + S.raceNo }); } });
    S.log.push({ race: S.raceNo, nets: nets, order: order.slice(0, 3).map(function (i) { return F.horses[i].post; }), photo: !!rc.photo, fav: order[0] === fav, wOdds: mlText(wH.ml), wName: wH.name });
    if (solo()) S.hi = Math.max(S.hi || 0, Casino.balance());
    rc.per = per; rc.settled = true;
  }

  // ── Results board ───────────────────────────────────────────────────────
  function two(m) { return '$' + (2 * (1 + m)).toFixed(2); }
  function paintResults(animate) {
    var F = S.field, rc = S.race, o = rc.order, H = F.horses;
    R.tote.innerHTML = '';
    var bd = el('div', { class: 'bd' });
    bd.appendChild(el('div', { class: 'top' }, [el('span', { text: 'Official · Race ' + S.raceNo }), el('span', { text: '$2 payouts' })]));
    var tb = el('table');
    tb.appendChild(el('tr', null, [el('th', { text: '' }), el('th', { text: '' }), el('th', { text: 'Win' }), el('th', { text: 'Place' }), el('th', { text: 'Show' })]));
    for (var r = 0; r < 3 && r < o.length; r++) {
      var i = o[r], h = H[i];
      tb.appendChild(el('tr', null, [
        el('td', { class: 'ps', html: clothSpan(h.post) }),
        el('td', { class: 'nm', text: h.name }),
        el('td', { class: 'pr', text: r === 0 ? two(price(F, 'W', [i])) : '' }),
        el('td', { class: 'pr', text: r <= 1 ? two(price(F, 'P', [i])) : '' }),
        el('td', { class: 'pr', text: two(price(F, 'S', [i])) })
      ]));
    }
    bd.appendChild(tb);
    var ex = el('div', { class: 'ex' });
    function exl(lbl, sel, type, sep) { ex.appendChild(el('span', { text: lbl + ' ' + sel.map(function (i) { return H[i].post; }).join(sep) })); ex.appendChild(el('b', { text: two(price(F, type, sel)) })); }
    exl('Exacta', [o[0], o[1]], 'EX', '-');
    exl('Quinella', [o[0], o[1]].sort(function (a, b) { return a - b; }), 'QU', '/');
    if (o.length >= 3) exl('Trifecta', [o[0], o[1], o[2]], 'TRI', '-');
    bd.appendChild(ex);
    var also = o.slice(3).map(function (i) { return H[i].post; });
    bd.appendChild(el('div', { class: 'note', html: '<b>' + esc(H[o[0]].name) + '</b> (' + mlText(H[o[0]].ml) + ') won by ' + lengthsText(rc.gaps[0]) + (rc.photo ? ' in a photo finish' : '') + '. Time ' + clockText(rc.clock) + '.' + (also.length ? ' Also ran: ' + also.join(', ') + '.' : '') }));
    R.tote.appendChild(bd);

    // Tickets
    R.mytk.innerHTML = '';
    var groups = solo() ? [0] : S.players.map(function (p, i) { return i; });
    var anyT = S.tickets.length;
    R.mytk.appendChild(el('h4', null, [el('span', { text: solo() ? 'Your tickets' : 'Tickets' }), el('span', { text: '' })]));
    if (!anyT) R.mytk.appendChild(el('div', { class: 'empty', text: solo() ? 'No bets on this one. Just watching!' : 'Nobody bet on this race.' }));
    var delay = 0;
    groups.forEach(function (pi) {
      var mine = []; S.tickets.forEach(function (k, j) { if (k.p === pi) mine.push(j); });
      var per = rc.per ? rc.per[pi] : { stake: 0, ret: 0 }, net = per.ret - per.stake, pl = S.players[pi];
      if (!solo()) {
        R.mytk.appendChild(el('div', { class: 'who' }, [el('span', { class: 'avatar sm', style: { '--c': pl.color }, text: pl.name.charAt(0).toUpperCase() }), el('span', { class: 'grow', text: pl.name }),
          el('span', { class: net > 0 ? 'pos' : net < 0 ? 'neg' : '', text: mine.length ? signed(net) : 'no bets' })]));
      }
      mine.forEach(function (j) {
        var k = S.tickets[j], ret = rc.res ? rc.res[j] : 0, won = ret > 0;
        var stamp = el('span', { class: 'stamp ' + (won ? 'w' : 'l'), text: won ? 'WINNER' : 'NO' });
        if (won && animate) { stamp.style.animationDelay = (delay += 0.25) + 's'; }
        R.mytk.appendChild(el('div', { class: 'tk' + (won ? ' won' : '') }, [
          stackEl(k.amt, 26),
          el('div', { class: 'tx' }, [el('b', { html: BT[k.type] + ' ' + selText(k.type, k.sel) }), el('small', { text: money(k.amt) + ' at ' + (k.type === 'W' ? mlText(H[k.sel[0]].ml) : fmtOdds(k.m)) })]),
          el('div', { class: 'am' }, [stamp, el('small', { text: won ? '+' + money(ret) : '' })])
        ]));
      });
    });
    if (solo() && anyT) {
      var p0 = rc.per[0], n0 = p0.ret - p0.stake;
      R.mytk.appendChild(el('div', { class: 'tk' }, [el('div', { class: 'tx' }, [el('b', { text: 'This race' })]), el('div', { class: 'am' }, [el('span', { class: n0 > 0 ? 'pos' : n0 < 0 ? 'neg' : '', text: signed(n0) }), el('small', { text: 'paid ' + money(p0.ret) })])]));
    }
    paintBank();
    // Payouts count into the bankroll
    var totalRet = rc.per ? rc.per.reduce(function (a, x) { return a + x.ret; }, 0) : 0;
    if (animate && totalRet > 0) {
      if (solo()) countUp(R.bal, Casino.balance() - rc.per[0].ret, Casino.balance());
      else S.players.forEach(function (p, i) { var b = R.stand.querySelector('b[data-i="' + i + '"]'); if (b && rc.per[i].ret) countUp(b, p.stack - rc.per[i].ret, p.stack); });
      var myNet = solo() ? rc.per[0].ret - rc.per[0].stake : 0;
      var best = rc.res.reduce(function (a, x, j) { return x - S.tickets[j].amt > a ? x - S.tickets[j].amt : a; }, 0);
      setTimeout(function () {
        if (best >= 100 || S.tickets.some(function (k, j) { return rc.res[j] && k.type === 'TRI'; })) { Kit.callout(signed(best)); Kit.confetti({ count: 110 }); Kit.sfx('win'); Kit.haptic('success'); }
        else { Kit.callout(solo() ? (myNet >= 0 ? signed(myNet) : 'Paid ' + money(rc.per[0].ret)) : 'Winners!', '#3ddc84'); Kit.sfx('good'); Kit.haptic('success'); }
      }, 350);
    } else if (animate && anyT) { Kit.sfx('bad'); Kit.haptic('error'); }
    if (animate && solo() && Casino.balance() < 1) setTimeout(brokeSheet, 1800);
  }
  function clockText(secs) { var m = Math.floor(secs / 60), s = secs - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); }
  function countUp(node, from, to) {
    if (!node) return;
    var t0 = performance.now(), dur = 1300, lastTick = 0;
    (function step(now) {
      var u = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - u, 3);
      node.textContent = money(from + (to - from) * e);
      if (now - lastTick > 90 && u < 1) { lastTick = now; Kit.sfx('tick'); }
      if (u < 1) requestAnimationFrame(step); else { node.textContent = money(to); node.classList.add('pos'); setTimeout(function () { node.classList.remove('pos'); }, 900); }
    })(t0);
  }

  // ── Sessions ────────────────────────────────────────────────────────────
  function brokeSheet() {
    Kit.sheet({ title: 'Out of money', html: '<p class="muted">Your casino bankroll is empty. Start fresh with $1,000?</p>',
      actions: [{ label: 'Reset bankroll to $1,000', primary: true, onClick: function () { Casino.reset(); if (S) { S.hi = Math.max(S.hi, 1000); paintBank(); if (S.phase === 'bet') paintRail(); save(); } Kit.toast('Bankroll is $1,000'); } }, { label: 'Not now', cls: 'btn-ghost' }] });
  }
  function resetBank() {
    if (S && S.phase === 'race') { Kit.toast('Wait for the race to finish'); return; }
    Kit.confirm('Reset bankroll to $1,000?', { ok: 'Reset', danger: true, body: 'The bankroll is shared with every casino game.' + (S && solo() && staked() ? ' Your tickets for this race are taken back first.' : '') }).then(function (ok) {
      if (!ok) return;
      if (S && solo() && S.phase === 'bet') { S.tickets = []; S.undo = []; }
      Casino.reset(); if (S) { save(); if (S.phase === 'bet') { paintSlip(); paintProgram(); paintPick(); paintRail(); } paintBank(); }
      Kit.toast('Bankroll reset to $1,000'); Kit.sfx('good');
    });
  }
  function highlights() {
    var h = [], ps = S.players;
    var notes = S.notes.slice().sort(function (a, b) { return b.w - a.w; });
    var bestP = null; ps.forEach(function (p) { if (p.best && (!bestP || p.best.amt > bestP.best.amt)) bestP = p; });
    if (bestP) h.push('Biggest win: ' + bestP.name + ' ' + signed(bestP.best.amt) + ' with a ' + bestP.best.t);
    notes.filter(function (n) { return !bestP || !n.nk || n.nk !== bestP.best.nk; }).slice(0, 3).forEach(function (n) { if (h.indexOf(n.t) < 0) h.push(n.t); });
    var favs = S.log.filter(function (l) { return l.fav; }).length;
    if (S.log.length >= 3) h.push('Favorites won ' + favs + ' of ' + S.log.length + ' races');
    if (solo()) {
      var p = ps[0];
      if (S.hi > S.startBank + 20) h.push('Bankroll peaked at ' + money(S.hi));
      h.push(money(p.wagered) + ' bet over ' + S.log.length + ' race' + (S.log.length === 1 ? '' : 's'));
    } else {
      var hitter = ps.slice().sort(function (a, b) { return b.hits - a.hits; })[0];
      if (hitter && hitter.hits >= 2) h.push('Most winning tickets: ' + hitter.name + ', ' + hitter.hits);
    }
    return h.slice(0, 6);
  }
  function recordSession() {
    if (!S || !S.log.length) return null;
    var ps = S.players, pass = !solo();
    if (pass) {
      var stakes = ps.map(function () { return S.opt.stake; });
      var top = ps.slice().sort(function (a, b) { return b.stack - a.stack; });
      var winner = top.length > 1 && top[0].stack !== top[1].stack ? top[0].name : null;
      return Kit.record(HKEY, {
        started: S.started, mode: 'Pass and play · ' + S.log.length + ' races',
        players: ps.map(function (p) { return { name: p.name, score: p.stack }; }), winner: winner,
        rounds: { labels: ['Start'].concat(S.log.map(function (l) { return 'Race ' + l.race; })), scores: [stakes].concat(S.log.map(function (l) { return l.nets; })) },
        highlights: highlights(),
        summary: (winner ? winner + ' won' : 'Tie at the top') + ' · ' + top.map(function (p) { return money(p.stack); }).join(' – '),
        meta: { races: S.log.length, stake: S.opt.stake }
      });
    }
    var p = ps[0];
    return Kit.record(HKEY, {
      started: S.started, mode: 'Solo · ' + S.log.length + ' race' + (S.log.length === 1 ? '' : 's'),
      players: [{ name: p.name, score: p.net }], winner: null,
      rounds: { labels: S.log.map(function (l) { return 'Race ' + l.race; }), scores: S.log.map(function (l) { return [l.nets[0]]; }) },
      highlights: highlights(),
      summary: p.name + ' ' + (p.net > 0 ? 'up ' + money(p.net) : p.net < 0 ? 'down ' + money(-p.net) : 'broke even') + ' · ' + S.log.length + ' races',
      badge: signed(p.net),
      meta: { net: p.net, races: S.log.length, wagered: p.wagered, biggest: p.best ? p.best.amt : 0 }
    });
  }
  function refundOpen() {
    // Tickets on a race that hasn't run go back to whoever bet them
    if (S && S.phase === 'bet') { S.tickets.forEach(function (k) { give(k.p, k.amt); }); S.tickets = []; S.undo = []; }
  }
  function endSession() {
    if (!S) { showSetup(); return; }
    if (S.phase === 'race') { Kit.toast('Wait for the race to finish (or skip it)'); return; }
    if (!solo()) {
      if (!S.log.length) { Kit.confirm('Leave the track?', { ok: 'Leave', body: 'No races run yet, so nothing is saved.' }).then(function (ok) { if (ok) { clearSave(); showSetup(); } }); return; }
      Kit.confirm('End the session now?', { ok: 'End session', body: 'Final standings after ' + S.log.length + ' race' + (S.log.length === 1 ? '' : 's') + '. Tickets on the next race are cancelled.' }).then(function (ok) { if (ok) { refundOpen(); endPass(); } });
      return;
    }
    var p = S.players[0];
    if (!S.log.length) { refundOpen(); clearSave(); showSetup(); return; }
    Kit.confirm('Cash out?', { ok: 'Cash out', body: 'You are ' + (p.net >= 0 ? 'up ' : 'down ') + money(Math.abs(p.net)) + ' after ' + S.log.length + ' race' + (S.log.length === 1 ? '' : 's') + '. The session is saved to Past races; open tickets go back to your bankroll.' })
      .then(function (ok) {
        if (!ok) return;
        refundOpen(); recordSession(); clearSave();
        var st = S, net = p.net, players = st.cfgPlayers;
        if (RV) RV.stop(); app.innerHTML = ''; rail(null);
        Kit.win({
          icon: net >= 0 ? 'coins' : 'meh', lose: net < 0,
          title: net > 0 ? 'Up ' + money(net) + '!' : net < 0 ? 'Down ' + money(-net) : 'Broke even',
          sub: st.log.length + ' race' + (st.log.length === 1 ? '' : 's') + (p.best ? ' · best ticket ' + signed(p.best.amt) : '') + ' · bankroll ' + money(Casino.balance()),
          againLabel: 'New session', again: function () { start('solo', players, st.opt); },
          extra: [{ label: 'Past races', onClick: function () { showSetup(); Kit.history(HKEY, { title: 'Horse Race: past sessions' }); } }]
        });
        S = null;
      });
  }
  function endPass() {
    recordSession();
    clearSave();
    var st = S, ranked = st.players.map(function (p, i) { return { name: p.name, score: money(p.stack), color: p.color, v: p.stack }; }).sort(function (a, b) { return b.v - a.v; });
    var tie = ranked.length > 1 && ranked[0].v === ranked[1].v;
    if (RV) RV.stop(); app.innerHTML = ''; rail(null);
    Kit.win({
      title: tie ? 'A dead heat!' : ranked[0].name + ' wins!',
      sub: 'Richest after ' + st.log.length + ' race' + (st.log.length === 1 ? '' : 's') + ' · started with ' + money(st.opt.stake) + ' each',
      rank: ranked,
      againLabel: 'Same players again', again: function () { start('pass', st.cfgPlayers, st.opt); },
      extra: [{ label: 'Past races', onClick: function () { showSetup(); Kit.history(HKEY, { title: 'Horse Race: past sessions' }); } }],
      onClose: function () { showSetup(); }
    });
    S = null;
  }
  function newGame() {
    if (!S) { showSetup(); return; }
    if (S.phase === 'race') { Kit.toast('Wait for the race to finish (or skip it)'); return; }
    var body = S.log.length ? (solo() ? 'This session is saved to Past races first. Open tickets go back to your bankroll.' : 'The current standings are saved to Past races.') : 'Open tickets are taken back.';
    Kit.confirm('Start a new session?', { ok: 'New session', body: body }).then(function (ok) {
      if (!ok) return;
      refundOpen(); recordSession(); clearSave(); showSetup();
    });
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved) {
    S = saved;
    // A solo session left alone for 8+ hours is saved and a fresh one starts
    if (solo() && S.log.length && S.phase !== 'race' && Date.now() - (S.last || 0) > 8 * 3600 * 1000) {
      refundOpen(); recordSession();
      var pl = S.cfgPlayers, op = S.opt; S = null; start('solo', pl, op);
    } else render();
  } else showSetup();

  var rz = null;
  window.addEventListener('resize', function () {
    clearTimeout(rz); rz = setTimeout(function () { if (S && RV && document.body.contains(RV.el)) { RV.size(S.phase === 'bet' ? 200 : S.phase === 'result' ? 230 : raceHeight()); if (R.sc) buildStripKeep(); } }, 150);
  });
  function buildStripKeep() { if (S && S.phase !== 'bet') paintStrip(RV.ranksAt(S.field.horses.map(function () { return 0; }))); }
  document.addEventListener('visibilitychange', function () { if (document.hidden && RV && RV.mode() === 'idle') RV.stop(); else if (!document.hidden && S && S.phase === 'bet' && RV) RV.idle(); });
  window.addEventListener('pageshow', function () { if (S && R.bank && S.phase === 'bet') paintBank(); });
})();
</script>
</body>

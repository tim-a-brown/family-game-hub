<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Puzzles</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<style>
body{overflow:hidden;}
.mp{display:flex;flex-direction:column;height:calc(100dvh - var(--safe-t) - 58px);max-width:560px;margin:0 auto;padding:0 10px calc(var(--safe-b) + 8px + var(--corner-y));gap:8px;}
/* Top strip */
.strip{flex:none;display:flex;align-items:center;gap:8px;min-height:40px;}
.strip .pill{flex:1 1 0;min-width:0;justify-content:center;line-height:1;}
.strip .pill.lvp{color:var(--text-2);font-size:.85rem;}
.strip .lv{font-weight:900;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.strip .grow{flex:1;min-width:0;}
.pill{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:999px;background:var(--w07);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pill .ico{width:16px;height:16px;}
.pill.streak{color:var(--orange);}
.pill.streak.hot{background:color-mix(in srgb,var(--orange) 22%,transparent);animation:bounce .5s var(--spring);}
.pill.pts{color:var(--yellow);}
.pill.clock{color:var(--text);}
.pill.clock.low{color:var(--red);animation:pulse 1s infinite;}
.finish{height:34px;min-height:34px;padding:0 12px;font-size:.85rem;}
/* Chalkboard */
.board{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:20px;padding:10px 10px 0;}
.slate{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
  background:
    radial-gradient(120% 80% at 30% 20%, var(--w06), transparent 60%),
    radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0/3px 3px,
    linear-gradient(170deg,#2f4a3d,#223a30 60%,#1b2f27);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.35), inset 0 6px 22px rgba(0,0,0,.45);color:#f4f1e8;font-family:var(--hand);}
.slate::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(60% 30% at 70% 80%, var(--w05), transparent 70%), radial-gradient(40% 20% at 20% 70%, var(--w04), transparent 70%);}
.tbar{position:absolute;left:0;top:0;height:5px;background:linear-gradient(90deg,#ffe08a,#f6c34a);transition:width 1s linear;box-shadow:0 0 8px rgba(255,224,138,.6);}
.tbar.low{background:linear-gradient(90deg,#ff8a8a,#ff4d5e);}
.q{position:relative;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:18px 16px 8px;text-align:center;}
.q .ty{font-family:var(--font);font-weight:900;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#f6d77a;opacity:.9;}
.q .tx{font-size:clamp(1.9rem,9vw,2.8rem);line-height:1.2;text-shadow:0 0 1px rgba(255,255,255,.4);word-break:break-word;}
.q .tx.long{font-size:clamp(1.45rem,6.6vw,2rem);}
.q .tx .shp{display:inline-block;width:.9em;height:.9em;vertical-align:-.08em;}
.seq{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 2px;font-size:clamp(1.4rem,6.6vw,2rem);}
.seq span{min-width:1.7em;padding:0 .2em;}
.seq i{font-style:normal;opacity:.55;font-size:.8em;margin:0 .25em 0 -.35em;}
.seq b{display:inline-block;min-width:1.8em;border:2px dashed rgba(246,215,122,.8);border-radius:8px;color:#f6d77a;font-weight:400;line-height:1.3;}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px;border:2px solid rgba(255,255,255,.5);border-radius:6px;}
.dots i{width:22px;height:22px;border-radius:50%;background:#f4f1e8;box-shadow:0 0 2px rgba(255,255,255,.6);opacity:.92;}
.dots i.o{background:transparent;box-shadow:none;}
/* Answer line */
.ans{position:relative;flex:none;display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:0 16px 10px;min-height:76px;}
.ans .eq{font-size:2rem;opacity:.7;padding-bottom:6px;}
.ans .box{position:relative;min-width:150px;max-width:80%;height:58px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;line-height:1;border-bottom:3px solid rgba(244,241,232,.75);font-variant-numeric:tabular-nums;}
.ans .box:empty::before{content:"?";opacity:.3;}
.ans .box.ok{color:#9ff0b8;border-color:#9ff0b8;}
.ans .box.bad{color:#ff9b9b;border-color:#ff9b9b;animation:shake .4s;}
.ans .box.show{color:#f6d77a;border-color:#f6d77a;}
.mark{position:absolute;right:-46px;bottom:6px;width:42px;height:42px;overflow:visible;}
.mark path{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .45s ease forwards;}
.mark.ok path{stroke:#9ff0b8;}
.mark.bad path{stroke:#ff8080;}
@keyframes draw{to{stroke-dashoffset:0;}}
.plus{position:absolute;right:16px;top:-6px;font-family:var(--display);font-size:1.6rem;color:#f6d77a;animation:floatup 1s var(--ease) forwards;pointer-events:none;}
@keyframes floatup{from{transform:translateY(10px);opacity:0;}25%{opacity:1;}to{transform:translateY(-34px);opacity:0;}}
.note{flex:none;margin:0 14px 10px;padding:8px 12px;border-radius:8px;background:var(--w07);font-size:1.12rem;line-height:1.3;text-align:left;color:#f4f1e8;}
.note.hint{color:#f6d77a;}
.note b{font-weight:400;color:#9ff0b8;}
/* Chalk tray: the hint and skip buttons sit on the ledge */
.tray{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px;padding:0 4px;}
.tray .dotsrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;flex:1;min-width:0;}
.tray .dotsrow i{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 1px rgba(0,0,0,.4);}
.tray .dotsrow i.ok{background:#5fe08f;}
.tray .dotsrow i.half{background:#f6c34a;}
.tray .dotsrow i.no{background:#ff6b6b;}
.tray .dotsrow i.cur{box-shadow:0 0 0 2px #fff;}
.chalk{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:0;border-radius:8px;font-weight:900;font-size:.88rem;color:#3a2a18;
  background:linear-gradient(180deg,#f7f3ea,#e4dccb);box-shadow:0 2px 0 rgba(0,0,0,.35);}
.chalk:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.35);}
.chalk .ico{width:16px;height:16px;}
.chalk:disabled{opacity:.45;}
/* Number pad */
.pad{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 calc(var(--corner-x) / 2);}
.pad button{height:52px;border:0;border-radius:12px;background:var(--w12);color:var(--text);font-weight:900;font-size:1.5rem;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .06s;}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.pad .fn{background:var(--w07);font-size:1.2rem;}
.pad .fn.sm{font-size:.95rem;}
.pad .go{grid-column:span 2;background:var(--accent);color:var(--accent-ink);font-size:1.15rem;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000);}
.pad .ico{width:24px;height:24px;margin:auto;}
@media (max-height:700px){.pad button{height:44px;}.pad{gap:5px;}.ans{min-height:64px;}.ans .box{height:50px;font-size:2.2rem;}}
.lvdesc{font-size:.82rem;color:var(--text-3);margin-top:6px;}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px;}
.res div{padding:10px 4px;border-radius:14px;background:var(--w05);}
.res b{display:block;font-size:1.4rem;font-weight:900;}
.res span{font-size:.7rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}
/* Tablet: bigger chalk writing so the board doesn't look empty */
@media (min-width:700px) and (min-height:700px){
  .mp{max-width:640px;}
  .q .ty{font-size:.86rem;}
  .q .tx{font-size:3.5rem;}
  .q .tx.long{font-size:2.5rem;}
  .seq{font-size:2.8rem;}
  .dots i{width:30px;height:30px;}
  .ans{min-height:92px;}
  .ans .eq{font-size:2.5rem;}
  .ans .box{min-width:200px;height:72px;font-size:3.2rem;}
  .note{font-size:1.3rem;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'mathpuzzles_state', KEY = 'mathpuzzles';
  function ri(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  var LEVELS = [['k2', 'K–2', 'Ages 5–8: adding, taking away, counting'], ['g34', '3–4', 'Ages 8–10: times tables, sharing, money'], ['g56', '5–6', 'Ages 10–12: fractions, percents, first algebra'],
    ['g78', '7–8', 'Ages 12–14: equations, exponents, geometry'], ['g912', '9–12', 'High school: functions, series, counting'], ['seq', 'Seq', 'Famous number sequences: Fibonacci and friends']];
  function lvName(id) { for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i][0] === id) return id === 'seq' ? 'Sequences' : 'Grades ' + LEVELS[i][1]; return id; }
  var MODES = { ten: 'Worksheet', timed: 'Beat the clock', free: 'Practice' };

// ── Puzzle generators ──────────────────────────────────────────────────────
var GENERATORS={
  k2:[
    // 1. Counting on
    ()=>{const s=ri(1,15);return{type:'Counting On',q:null,seq:[s,s+1,s+2,'?'],ans:s+3,hint:`The numbers go up by 1 each time`};},
    // 2. Simple addition
    ()=>{const a=ri(1,9),b=ri(1,9);return{type:'Addition',q:`${a} + ${b} = ?`,ans:a+b,hint:`Count up ${b} from ${a}`};},
    // 3. Simple subtraction
    ()=>{const b=ri(1,9),a=ri(b,10);return{type:'Subtraction',q:`${a} − ${b} = ?`,ans:a-b,hint:`Start at ${a} and count back ${b}`};},
    // 4. Skip count by 2
    ()=>{const s=ri(0,4)*2;return{type:'Skip Counting',q:null,seq:[s,s+2,s+4,s+6,'?'],ans:s+8,hint:`Count by 2s`};},
    // 5. Skip count by 5
    ()=>{const n=ri(0,3);return{type:'Skip Counting',q:null,seq:[n*5,(n+1)*5,(n+2)*5,'?'],ans:(n+3)*5,hint:`Count by 5s`};},
    // 6. Skip count by 10
    ()=>{const s=ri(1,9);return{type:'Skip Counting',q:null,seq:[s,s+10,s+20,'?'],ans:s+30,hint:`Count by 10s`};},
    // 7. Missing addend
    ()=>{const b=ri(1,5),c=ri(b+1,10);return{type:'Missing Number',q:`${c-b} + ? = ${c}`,ans:b,hint:`What do you add to ${c-b} to get ${c}?`};},
    // 8. Doubles
    ()=>{const n=ri(1,10);return{type:'Doubles',q:`${n} + ${n} = ?`,ans:n*2,hint:`Same number added to itself`};},
    // 9. Ten minus
    ()=>{const n=ri(1,9);return{type:'Subtraction',q:`10 − ${n} = ?`,ans:10-n,hint:`How many more to get from ${n} to 10?`};},
    // 10. Add to make ten
    ()=>{const a=ri(1,9);return{type:'Number Bonds',q:`${a} + ? = 10`,ans:10-a,hint:`How many more does ${a} need to reach 10?`};},
    // 11. Simple number pattern (add same number)
    ()=>{const s=ri(1,5),step=ri(2,4);return{type:'Number Pattern',q:null,seq:[s,s+step,s+step*2,'?'],ans:s+step*3,hint:`Each number grows by ${step}`};},
    // 12. Largest/smallest — which comes next in order
    ()=>{const s=ri(10,90);return{type:'Counting',q:`What number comes after ${s}?`,ans:s+1,hint:`Count up one more from ${s}`};},
  ],

  g34:[
    // 1. Times table
    ()=>{const a=ri(2,9),b=ri(2,9);return{type:'Multiplication',q:`${a} × ${b} = ?`,ans:a*b,hint:`Think: ${a} groups of ${b}`};},
    // 2. Division
    ()=>{const b=ri(2,9),a=b*ri(2,9);return{type:'Division',q:`${a} ÷ ${b} = ?`,ans:a/b,hint:`How many ${b}s fit in ${a}?`};},
    // 3. Multiplication sequence
    ()=>{const m=ri(2,9),s=ri(1,3);const seq=[s*m,s*m*2,s*m*3];return{type:'Times Table',q:null,seq:[...seq,'?'],ans:s*m*4,hint:`Multiply by ${m} each time`};},
    // 4. Missing factor
    ()=>{const b=ri(2,9),c=b*ri(2,9);return{type:'Missing Factor',q:`${c/b} × ? = ${c}`,ans:b,hint:`${c} ÷ ${c/b} = ?`};},
    // 5. 2-digit + 2-digit
    ()=>{const a=ri(10,60),b=ri(10,39);return{type:'Addition',q:`${a} + ${b} = ?`,ans:a+b,hint:`Add the ones first, then the tens`};},
    // 6. 2-digit subtraction
    ()=>{const b=ri(10,40),a=ri(b+5,90);return{type:'Subtraction',q:`${a} − ${b} = ?`,ans:a-b,hint:`Subtract the tens then the ones`};},
    // 7. Half of a number
    ()=>{const n=ri(2,20)*2;return{type:'Halving',q:`Half of ${n} = ?`,ans:n/2,hint:`Divide ${n} by 2`};},
    // 8. Area of rectangle
    ()=>{const w=ri(2,9),h=ri(2,9);return{type:'Area',q:`Rectangle: ${w} wide, ${h} tall. Area = ?`,ans:w*h,hint:`Area = width × height = ${w} × ${h}`};},
    // 9. Perimeter of rectangle
    ()=>{const w=ri(2,9),h=ri(2,9);return{type:'Perimeter',q:`Rectangle: ${w} wide, ${h} tall. Perimeter = ?`,ans:2*w+2*h,hint:`Perimeter = 2 × (width + height)`};},
    // 10. Multiplying by 10
    ()=>{const n=ri(2,15);return{type:'Multiply by 10',q:`${n} × 10 = ?`,ans:n*10,hint:`Add a zero to the end of ${n}`};},
    // 11. Square numbers
    ()=>{const n=ri(2,9);return{type:'Square Numbers',q:`${n}² = ${n} × ${n} = ?`,ans:n*n,hint:`Multiply ${n} by itself`};},
    // 12. Rounding to nearest 10
    ()=>{const n=ri(12,97);const r=Math.round(n/10)*10;return{type:'Rounding',q:`Round ${n} to the nearest 10`,ans:r,hint:`Is ${n} closer to ${Math.floor(n/10)*10} or ${Math.ceil(n/10)*10}?`};},
  ],

  g56:[
    // 1. Fraction of a whole
    ()=>{const d=pick([2,3,4,5]),whole=d*ri(2,8);const n=ri(1,d-1);return{type:'Fractions',q:`${n}/${d} of ${whole} = ?`,ans:(n*whole)/d,hint:`First find 1/${d} of ${whole} = ${whole/d}, then multiply by ${n}`};},
    // 2. Order of operations
    ()=>{const a=ri(1,8),b=ri(2,6),c=ri(2,8);return{type:'Order of Operations',q:`${a} + ${b} × ${c} = ?`,ans:a+b*c,hint:`Multiplication before addition: ${b} × ${c} = ${b*c}, then add ${a}`};},
    // 3. Negative + positive
    ()=>{const a=ri(1,10),b=ri(a+1,15);return{type:'Negative Numbers',q:`−${a} + ${b} = ?`,ans:b-a,hint:`Move right ${b} steps from −${a} on the number line`};},
    // 4. Percent of 100
    ()=>{const p=pick([10,20,25,50,75]);return{type:'Percentages',q:`${p}% of 100 = ?`,ans:p,hint:`Percent literally means "out of 100"`};},
    // 5. Percent of non-100
    ()=>{const p=pick([10,25,50]),n=ri(2,8)*4;return{type:'Percentages',q:`${p}% of ${n} = ?`,ans:p*n/100,hint:`${p}% = ${p}/100, so multiply ${n} × ${p} ÷ 100`};},
    // 6. Simple equation (ax = b)
    ()=>{const a=ri(2,9),x=ri(2,9);return{type:'Algebra',q:`${a}x = ${a*x}    Find x`,ans:x,hint:`Divide both sides by ${a}: x = ${a*x} ÷ ${a}`};},
    // 7. LCM
    ()=>{const pairs=[[2,3],[2,5],[3,4],[4,6],[3,5],[2,7],[4,5]];const[a,b]=pick(pairs);let l=a;while(l%b!==0)l+=a;return{type:'LCM',q:`LCM(${a}, ${b}) = ?`,ans:l,hint:`List multiples of ${a}: ${a},${a*2},${a*3}… find first one divisible by ${b}`};},
    // 8. GCF
    ()=>{const base=pick([2,3,4,5,6]),m1=ri(1,4),m2=ri(1,4);const a=base*m1,b=base*m2;let g=a;while(g>0){const t=b%g;if(t===0)break;g=t;}return{type:'GCF',q:`GCF(${a}, ${b}) = ?`,ans:g,hint:`Find common factors of ${a} and ${b}`};},
    // 9. Negative subtraction
    ()=>{const a=ri(1,8),b=ri(a+1,12);return{type:'Negative Numbers',q:`${a} − ${b} = ?`,ans:a-b,hint:`${a} − ${b} = negative because you're taking more than you have`};},
    // 10. Simple equation (x + a = b)
    ()=>{const a=ri(3,12),x=ri(2,10);return{type:'Algebra',q:`x + ${a} = ${x+a}    Find x`,ans:x,hint:`Subtract ${a} from both sides`};},
    // 11. Exponent
    ()=>{const base=pick([2,3,4,5]),exp=pick([2,3]);return{type:'Exponents',q:`${base}${exp===2?'²':'³'} = ?`,ans:Math.pow(base,exp),hint:`Multiply ${base} by itself ${exp} times`};},
    // 12. PEMDAS with brackets
    ()=>{const a=ri(2,8),b=ri(2,6),c=ri(1,5);return{type:'Order of Operations',q:`(${a} + ${b}) × ${c} = ?`,ans:(a+b)*c,hint:`Brackets first: ${a} + ${b} = ${a+b}, then × ${c}`};},
  ],

  g78:[
    // 1. Solve two-step equation
    ()=>{const a=ri(2,6),b=ri(1,8),x=ri(2,8);return{type:'Algebra',q:`${a}x + ${b} = ${a*x+b}    Find x`,ans:x,hint:`Subtract ${b} from both sides, then divide by ${a}`};},
    // 2. Negative × negative
    ()=>{const a=ri(2,9),b=ri(2,9);return{type:'Integer Multiplication',q:`(−${a}) × (−${b}) = ?`,ans:a*b,hint:`Negative × Negative = Positive`};},
    // 3. Negative × positive
    ()=>{const a=ri(2,9),b=ri(2,9);return{type:'Integer Multiplication',q:`(−${a}) × ${b} = ?`,ans:-a*b,hint:`Negative × Positive = Negative`};},
    // 4. Exponents (larger)
    ()=>{const cases=[[2,6],[2,7],[2,8],[3,4],[3,5],[4,4],[5,3]];const[base,exp]=pick(cases);return{type:'Exponents',q:`${base}^${exp} = ?`,ans:Math.pow(base,exp),hint:`Multiply ${base} by itself ${exp} times`};},
    // 5. Perfect square root
    ()=>{const n=ri(2,12);return{type:'Square Roots',q:`√${n*n} = ?`,ans:n,hint:`What number times itself equals ${n*n}?`};},
    // 6. Absolute value
    ()=>{const n=ri(1,20);return{type:'Absolute Value',q:`|−${n}| = ?`,ans:n,hint:`Absolute value is always non-negative — the distance from zero`};},
    // 7. Proportion
    ()=>{const a=ri(2,6),b=ri(2,6),c=a*ri(2,4);return{type:'Proportions',q:`${a}/${b} = ${c}/?    Find ?`,ans:b*c/a,hint:`Cross-multiply: ${b} × ${c} = ${a} × ?`};},
    // 8. Triangle area
    ()=>{const b=ri(2,10)*2,h=ri(2,10);return{type:'Geometry',q:`Triangle: base ${b}, height ${h}. Area = ?`,ans:(b*h)/2,hint:`Area = ½ × base × height = ½ × ${b} × ${h}`};},
    // 9. Distributive property
    ()=>{const a=ri(2,6),b=ri(2,8),c=ri(2,8);return{type:'Distributive Property',q:`${a}(${b} + ${c}) = ?`,ans:a*b+a*c,hint:`Multiply ${a} by each term: ${a}×${b} + ${a}×${c}`};},
    // 10. Percent change
    ()=>{const a=ri(2,9)*10,inc=pick([10,20,25,50]);const b=a+a*inc/100;return{type:'Percent Change',q:`${a} increases by ${inc}%. New value = ?`,ans:b,hint:`Add ${inc}% of ${a} to ${a}: ${a} + ${a*inc/100}`};},
    // 11. Solve equation with subtraction
    ()=>{const a=ri(2,6),b=ri(1,8),x=ri(2,8);return{type:'Algebra',q:`${a}x − ${b} = ${a*x-b}    Find x`,ans:x,hint:`Add ${b} to both sides, then divide by ${a}`};},
    // 12. Negative integer sequence
    ()=>{const start=-(ri(5,15)),step=ri(2,5);return{type:'Integer Sequence',q:null,seq:[start,start+step,start+step*2,start+step*3,'?'],ans:start+step*4,hint:`Each term increases by ${step}`};},
    // 13. Fibonacci-style (any two seeds)
    ()=>{const a=ri(1,4),b=ri(1,5);const t=[a,b,a+b,a+2*b,2*a+3*b];return{type:'Fibonacci-style',q:null,seq:[...t,'?'],ans:3*a+5*b,hint:`Each term = sum of previous two`,teach:`This is a Fibonacci-style sequence. Each term is the sum of the two before it: a(n) = a(n−1) + a(n−2). The original Fibonacci sequence (1, 1, 2, 3, 5, 8…) follows the same rule starting from 1, 1.`};},
    // 14. Quadratic sequence (2nd diff = 2)
    ()=>{const c=ri(0,5);const s=n=>n*n+c;const terms=[s(1),s(2),s(3),s(4),s(5)];return{type:'Quadratic Sequence',q:null,seq:[...terms,'?'],ans:s(6),hint:`Check 2nd differences: they're constant. Formula: n² + ${c}`};},
    // 15. Geometric sequence
    ()=>{const r=pick([2,3]),start=ri(1,4);const terms=Array.from({length:5},(_,i)=>start*Math.pow(r,i));return{type:'Geometric Sequence',q:null,seq:[...terms,'?'],ans:start*Math.pow(r,5),hint:`Each term multiplies by ${r}`};},
  ],

  Kit.init({
    id: 'mathpuzzles',
    onNew: function () { showSetup(); },
    menu: [
      { icon: 'check', label: 'Finish and save this round', onClick: function () { if (S && !S.done) finish(); } },
      { icon: 'trophy', label: 'High scores', onClick: function () { ArcadeHi.show(hiKey(S ? S.level : 'g34', S && S.mode === 'timed' ? S.secs : 60)); } },
      { icon: 'history', label: 'Past rounds', onClick: function () { Kit.history(KEY, { title: 'Math Puzzles: past rounds' }); } }
    ],

      '<p class="goal">Solve the puzzle on the chalkboard and type the answer on the number pad.</p>' +
      '<h3>Points</h3><ul><li><b>2 points</b> for a right answer.</li><li><b>1 point</b> if you used a hint first.</li>' +
      '<li>Wrong? You get one more try. After two misses the board shows the answer and how to get it.</li>' +
      '<li>Answer in a row to build a <b>streak</b>. Skipping or missing resets it.</li></ul>' +
      '<h3>Ways to play</h3><ul><li><b>Worksheet</b>: ten puzzles, then see how you did.</li><li><b>Beat the clock</b>: as many as you can before time runs out.</li>' +

      '<h3>Typing answers</h3><ul><li><b>−</b> makes the answer negative, <b>.</b> adds a decimal point.</li><li>On a computer you can type numbers and press Enter.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  // S.cur = current puzzle, S.tries wrong tries on it, S.log = [{t, r}] per puzzle (r: 2/1/0/-1 skipped)
  var S = null, entry = '', busy = false, tickT = 0, nextT = 0;
  function save() {
    if (!S || S.done) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    Kit.resume.set(lvName(S.level) + ' · ' + MODES[S.mode] + (S.mode === 'timed' ? ' · ' + S.left + 's left' : ' · ' + S.score + ' pts'));
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  // High score boards: Beat the clock, per level and clock length, points (higher is better, linked players included)
  function hiKey(level, secs) { return 'mathpuzzles_' + level + '_' + (secs || 60); }
  var hiBest = null;
  function boardBest() {
    if (hiBest == null) {
      var b = ArcadeHi.top(hiKey(S.level, S.secs)) || 0;
      try { GameHistory.load(KEY).forEach(function (e) { if (e && e.level === S.level && e.modeId === 'timed' && e.secs === S.secs && e.score > b) b = e.score; }); } catch (e) {}
      hiBest = b;
    }
    return hiBest;
  }

  function showSetup() {
    stopTick(); clearTimeout(nextT); busy = false; app.className = 'stage';
    Kit.setup(app, {
      intro: 'Chalkboard brain teasers for every age',
      modes: [
        { id: 'ten', icon: 'pencil', title: 'Worksheet', desc: 'Ten puzzles, then your score' },
        { id: 'timed', icon: 'flame', title: 'Beat the clock', desc: 'As many as you can before time is up' },
        { id: 'free', icon: 'infinity', title: 'Practice', desc: 'No limit. Stop whenever you like' }
      ],
      players: { min: 1, max: 1, names: true, label: 'Who is solving?' },
      options: [
        { id: 'level', label: 'Level (school grade)', help: 'Pick the grade that fits the player. Each level has its own kinds of puzzles.', value: 'g34', choices: LEVELS.map(function (l) { return [l[0], l[1]]; }) },
        { id: 'secs', label: 'Time', value: 60, choices: [[60, '1 minute'], [120, '2 minutes'], [180, '3 minutes']], when: function (m) { return m === 'timed'; } }
      ],
      start: 'Start',
      onStart: function (cfg) {
        var n = (cfg.players[0] && cfg.players[0].name) || 'You';
        newGame(cfg.mode || 'ten', cfg.options.level, +cfg.options.secs || 60, /^Player \d+$/.test(n) ? 'You' : n);
      }
    });
    // Describe the chosen level under the picker
    function desc() {
      var seg = Array.prototype.filter.call(app.querySelectorAll('.setup .label'), function (l) { return /Level/.test(l.textContent); })[0];
      if (!seg) return;
      var box = seg.parentNode, on = box.querySelector('.seg .on'), d = box.querySelector('.lvdesc');
      if (!d) { d = el('div', { class: 'lvdesc' }); box.appendChild(d); }
      var l = LEVELS.filter(function (x) { return x[1] === (on && on.textContent); })[0];
      d.textContent = l ? l[2] : '';
    }
    desc();
    app.addEventListener('click', function () { setTimeout(desc, 0); });
  }

  function newGame(mode, level, secs, name) {
    if (!GENERATORS[level]) level = 'g34';
    S = { mode: mode, level: level, secs: secs, left: secs, name: name, score: 0, streak: 0, best: 0, solved: 0, hints: 0, skips: 0,
      cur: null, tries: 0, hint: false, log: [], started: Date.now(), done: false, fast: 0, qStart: 0, types: {} };
    hiBest = null;
    Kit.gameStart();
    nextPuzzle(true);
    Kit.sfx('pop');
  }
  function gen() {
    var g = GENERATORS[S.level], p, last = S.cur ? S.cur.type : '';
    for (var i = 0; i < 6; i++) { p = pick(g)(); if (p.type !== last) break; }
    return p;
  }
  function nextPuzzle(first) {
    clearTimeout(nextT);
    if (S.mode === 'ten' && S.log.length >= 10) return finish();
    S.cur = gen(); S.tries = 0; S.wrong = []; S.hint = false; S.reveal = false; S.qStart = Date.now(); entry = '';
    busy = false;
    build(first);
    save();
  }

  // ── Input ─────────────────────────────────────────────────────────────────
  function press(k) {
    if (!S || S.done) return;
    if (S.reveal) { if (k === 'go') { Kit.sfx('tap'); nextPuzzle(); } return; }
    if (busy) return;
    var box = $box();
    if (box) box.classList.remove('bad');
    if (k === 'del') entry = entry.slice(0, -1);
    else if (k === 'clr') entry = '';
    else if (k === '-') entry = entry.charAt(0) === '-' ? entry.slice(1) : '-' + entry;
    else if (k === '.') { if (entry.indexOf('.') < 0) entry = (entry === '' || entry === '-' ? entry + '0' : entry) + '.'; }
    else if (k === 'go') return check();
    else if (/^\d$/.test(k)) { if (entry.replace(/[-.]/g, '').length < 9) entry = entry === '0' ? k : entry === '-0' ? '-' + k : entry + k; }
    Kit.sfx('tap'); Kit.haptic('tick');
    paintEntry();
  }
  function check() {
    var box = $box(), val = parseFloat(entry);
    if (isNaN(val)) { Kit.haptic('error'); box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad'); return; }
    var c = S.cur;
    if (Math.abs(val - c.ans) < 1e-9) {
      var pts = S.hint ? 1 : 2, secs = (Date.now() - S.qStart) / 1000;
      S.score += pts; S.streak++; S.solved++; S.best = Math.max(S.best, S.streak);
      if (!S.hint && !S.tries && (!S.fast || secs < S.fast)) { S.fast = Math.round(secs * 10) / 10; S.fastQ = qText(c); }
      S.types[c.type] = (S.types[c.type] || 0) + 1;
      S.log.push(logged(c, pts, secs));
      busy = true;
      box.className = 'box ok'; mark(true);
      var plus = el('div', { class: 'plus', text: '+' + pts }); ansEl.appendChild(plus);
      Kit.sfx('good'); Kit.haptic('success');
      if (S.streak === 5 || S.streak === 10 || S.streak === 20 || (S.streak > 20 && S.streak % 10 === 0)) Kit.callout(S.streak + ' in a row!');
      paintStrip();
      if (c.teach) { S.reveal = true; showNote('<b>Correct!</b> ' + Kit.esc(c.teach)); goLabel('Next'); busy = false; save(); }
      else { save(); nextT = setTimeout(function () { nextPuzzle(); }, 850); }
      return;
    }
    S.tries++; S.streak = 0; S.wrong = (S.wrong || []).concat([fmtNum(val)]);
    box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad'); mark(false);
    Kit.sfx('bad'); Kit.haptic('error');
    if (S.tries >= 2) {
      S.log.push(logged(c, 0));
      S.reveal = true; entry = fmtNum(c.ans);
      setTimeout(function () { paintEntry(); $box().className = 'box show'; }, 450);
      showNote('The answer is <b>' + Kit.esc(fmtNum(c.ans)) + '</b>. ' + Kit.esc(c.hint) + (c.teach ? ' ' + Kit.esc(c.teach) : ''));
      goLabel('Next');
      if (S.mode === 'timed') nextT = setTimeout(function () { if (S.reveal && !S.done) nextPuzzle(); }, 2200);
    } else {
      showNote('Not quite. Try once more!' + (S.hint ? '' : ' Stuck? Tap <b>Hint</b>.'));
      setTimeout(function () { if (!S.reveal) { entry = ''; paintEntry(); } }, 450);
    }
    paintStrip(); save();
  }
  function hint() {
    if (!S || S.done || S.reveal || busy) return;
    if (!S.hint) { S.hint = true; S.hints++; }
    showNote(Kit.esc(S.cur.hint), true);
    Kit.sfx('pop'); save();
  }
  function skip() {
    if (!S || S.done || busy) return;
    if (S.reveal) return nextPuzzle();
    S.skips++; S.streak = 0; S.log.push(logged(S.cur, -1));
    Kit.sfx('whoosh');
    paintStrip();
    nextPuzzle();
  }
  // One line of the worksheet for history: the puzzle, its answer, wrong tries, seconds, hint
  function logged(c, r, secs) {
    var x = { t: c.type, r: r, q: qText(c).slice(0, 70), a: fmtNum(c.ans) };
    if (S.wrong && S.wrong.length) x.w = S.wrong.slice(0, 2).join(' ');
    if (secs) x.s = Math.round(secs);
    if (S.hint) x.h = 1;
    return x;
  }
  function fmtNum(n) { return String(Math.round(n * 1e6) / 1e6).replace('-', '−'); }
  function qText(c) { return c.seq ? c.seq.join(', ') : String(c.q || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' '); }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.k-scrim,.k-win') || !S || S.done || !padEl || !padEl.isConnected) return;
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === '-' || e.key === '−') press('-');
    else if (e.key === '.' || e.key === ',') press('.');
    else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
    else if (e.key === 'Escape') press('clr');
    else if (e.key === 'Enter') { e.preventDefault(); press('go'); }
  });

  // ── Clock (Beat the clock) ────────────────────────────────────────────────
  function startTick() {
    stopTick();
    if (S.mode !== 'timed') return;
    tickT = setInterval(function () {
      if (document.visibilityState !== 'visible' || document.querySelector('.k-scrim')) return;
      S.left--; paintStrip();
      if (S.left <= 5 && S.left > 0) Kit.sfx('tick');
      if (S.left <= 0) { stopTick(); finish(); }
      else if (S.left % 5 === 0) save();
    }, 1000);
  }
  function stopTick() { clearInterval(tickT); tickT = 0; }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && S && !S.done) save(); });

  // ── Finish & history ──────────────────────────────────────────────────────
  function finish() {
    if (!S || S.done) return;
    stopTick(); clearTimeout(nextT);
    var tried = S.log.filter(function (l) { return l.r >= 0; }).length;
    if (S.mode === 'free' && !S.log.length) { clearSave(); showSetup(); return; }
    S.done = true;
    var right = S.log.filter(function (l) { return l.r > 0; }).length, n = S.log.length;
    var past = []; try { past = GameHistory.load(KEY); } catch (e) {}
    var same = past.filter(function (e) { return e.level === S.level && e.modeId === S.mode && (S.mode !== 'timed' || e.secs === S.secs); });
    var prevBest = same.length ? Math.max.apply(null, same.map(function (e) { return e.score || 0; })) : -1;
    var hl = [];
    var nm = S.name;
    if (S.mode === 'ten') hl.push(nm + ' got ' + right + ' of 10 right for ' + S.score + ' of 20 points');
    else if (S.mode === 'timed') hl.push(nm + ' solved ' + S.solved + ' in ' + (S.secs / 60) + (S.secs === 60 ? ' minute' : ' minutes'));
    else hl.push(nm + ' solved ' + S.solved + ' of ' + n + ' puzzles');
    if (prevBest >= 0 && S.score > prevBest) hl.push('New best score at this level (old best ' + prevBest + ')');
    else if (!same.length) hl.push('First ' + MODES[S.mode].toLowerCase() + ' at ' + lvName(S.level));
    if (S.best >= 3) hl.push('Longest streak: ' + S.best + ' in a row');
    if (S.fast && S.fast < 8) hl.push('Fastest answer: ' + S.fast + ' seconds (' + S.fastQ.slice(0, 40) + ')');
    var topType = Object.keys(S.types).sort(function (a, b) { return S.types[b] - S.types[a]; })[0];
    if (topType && S.types[topType] >= 2) hl.push('Best at ' + topType + ': ' + S.types[topType] + ' solved');
    hl.push(S.hints ? S.hints + (S.hints === 1 ? ' hint used' : ' hints used') : 'No hints needed');
    Kit.record(KEY, {
      started: S.started, mode: lvName(S.level) + ' · ' + MODES[S.mode] + (S.mode === 'timed' ? ' ' + (S.secs / 60) + ' min' : ''),
      players: [{ name: nm, score: S.score }], winner: nm,
      summary: S.score + ' points · ' + right + '/' + n + ' right', badge: S.score + ' pts',
      highlights: hl.slice(0, 6), meta: { level: S.level, modeId: S.mode, secs: S.secs, score: S.score, right: right, total: n, streak: S.best },
      detail: { log: S.log.slice(-40).map(function (l) { return { t: l.t, r: l.r, q: l.q, a: l.a, w: l.w, s: l.s, h: l.h }; }), more: Math.max(0, S.log.length - 40), fast: S.fast || 0 }
    });
    clearSave(); paintStrip();
    var acc = n ? Math.round(100 * right / n) : 0, timed = S.mode === 'timed', key = hiKey(S.level, S.secs);
    function showWin() {
      var w = Kit.win({
        icon: acc >= 80 ? 'trophy' : 'star',
        title: acc === 100 && n >= 5 ? 'Perfect!' : acc >= 80 ? 'Great work!' : acc >= 50 ? 'Nice going!' : 'Good practice!',
        sub: nm + ' · ' + lvName(S.level) + ' · ' + MODES[S.mode] + (prevBest >= 0 && S.score > prevBest ? ' · new best!' : ''),
        again: function () { newGame(S.mode, S.level, S.secs, S.name); }, againLabel: 'Go again',
        extra: (timed ? [{ label: 'High scores', onClick: function () { ArcadeHi.show(key); showSetup(); } }] : []).concat([{ label: 'Change level or mode', onClick: showSetup }])
      });
      void w;
      var card = document.querySelector('.k-win .card .sub');
      if (card) card.after(el('div', { class: 'res', html: '<div><b>' + S.score + '</b><span>Points</span></div><div><b>' + right + '/' + n + '</b><span>Right</span></div><div><b>' + S.best + '</b><span>Streak</span></div>' }));
    }
    // Beat the clock rounds go on the level's high score board
    ArcadeHi.check(timed ? key : '', timed ? S.score : 0, function () { hiBest = null; paintStrip(); showWin(); });
    void tried;
  }

  // ── Screen ────────────────────────────────────────────────────────────────
  var stripEl, slateEl, qEl, ansEl, noteEl, padEl, goBtn, trayEl, hintBtn, skipBtn, tbar, built = false;
  function $box() { return ansEl ? ansEl.querySelector('.box') : null; }
  function build(first) {
    if (!built || !app.classList.contains('mp')) {
      app.className = 'mp'; app.innerHTML = '';
      stripEl = el('div', { class: 'strip' });
      slateEl = el('div', { class: 'slate' });
      trayEl = el('div', { class: 'tray' });
      hintBtn = el('button', { type: 'button', class: 'chalk', html: Kit.icon('lightbulb') + '<span>Hint</span>', onclick: hint });
      skipBtn = el('button', { type: 'button', class: 'chalk', html: Kit.icon('right') + '<span>Skip</span>', onclick: skip });
      app.appendChild(stripEl);
      app.appendChild(el('div', { class: 'board wood' }, [slateEl, trayEl]));
      padEl = el('div', { class: 'pad' });
      [['7'], ['8'], ['9'], ['del', 'fn', '⌫'], ['4'], ['5'], ['6'], ['-', 'fn', '−'], ['1'], ['2'], ['3'], ['.', 'fn', '.'], ['clr', 'fn sm', 'Clear'], ['0'], ['go', 'go', 'Check']].forEach(function (k) {
        var b = el('button', { type: 'button', class: k[1] || '', html: k[2] || k[0], 'aria-label': { del: 'Delete', '-': 'Negative', '.': 'Decimal point', clr: 'Clear', go: 'Check' }[k[0]] || k[0] });
        b.addEventListener('click', function () { press(k[0]); });
        if (k[0] === 'go') goBtn = b;
        padEl.appendChild(b);
      });
      app.appendChild(padEl);
      built = true;
      startTick();
    }
    // The puzzle
    slateEl.innerHTML = '';
    tbar = el('div', { class: 'tbar' }); if (S.mode === 'timed') slateEl.appendChild(tbar);
    var c = S.cur;
    qEl = el('div', { class: 'q' });
    qEl.appendChild(el('div', { class: 'ty', text: c.type }));
    if (c.dots) {
      var d = el('div', { class: 'dots' }), tot = Math.ceil(c.dots / 5) * 5;
      for (var i = 0; i < tot; i++) d.appendChild(el('i', { class: i < c.dots ? '' : 'o' }));
      qEl.appendChild(d);
      qEl.appendChild(el('div', { class: 'tx long', text: 'How many dots?' }));
    } else if (c.seq) {
      var s = el('div', { class: 'seq' });
      c.seq.forEach(function (v, j) {
        if (j) s.appendChild(el('i', { text: ',' }));
        s.appendChild(v === '?' ? el('b', { text: '?' }) : el('span', { text: String(v).replace(/^-/, '−') }));
      });
      qEl.appendChild(s);
      qEl.appendChild(el('div', { class: 'tx long', style: { opacity: .75, 'font-size': '1.15rem' }, text: 'What number comes next?' }));
    } else {
      var t = el('div', { class: 'tx', html: c.q });
      if (String(c.q).replace(/<[^>]+>/g, '').length > 22) t.classList.add('long');
      qEl.appendChild(t);
    }
    slateEl.appendChild(qEl);
    noteEl = el('div', { class: 'note', hidden: true });
    slateEl.appendChild(noteEl);
    ansEl = el('div', { class: 'ans' }, [el('span', { class: 'eq', text: '=' }), el('div', { class: 'box' })]);
    slateEl.appendChild(ansEl);
    if (!first) { qEl.classList.add('rise'); }
    if (S.reveal) { showNote('The answer is <b>' + Kit.esc(fmtNum(c.ans)) + '</b>. ' + Kit.esc(c.hint)); entry = fmtNum(c.ans); $box().className = 'box show'; }
    else if (S.hint) showNote(Kit.esc(c.hint), true);
    goLabel(S.reveal ? 'Next' : 'Check');
    paintEntry(); paintStrip();
  }
  function showNote(html, isHint) { noteEl.hidden = false; noteEl.className = 'note' + (isHint ? ' hint' : ''); noteEl.innerHTML = html; }
  function goLabel(t) { if (goBtn) goBtn.textContent = t; }
  function paintEntry() { var b = $box(); if (b) b.textContent = entry.replace(/^-/, '−'); }
  function mark(ok) {
    var m = ansEl.querySelector('.mark'); if (m) m.remove();
    var svg = '<svg class="mark ' + (ok ? 'ok' : 'bad') + '" viewBox="0 0 40 40">' + (ok ? '<path d="M6 21 L16 31 L35 8"/>' : '<path d="M9 9 L31 31"/><path d="M31 9 L9 31" style="animation-delay:.2s"/>') + '</svg>';
    $box().insertAdjacentHTML('beforeend', svg);
  }
  function paintStrip() {
    if (!stripEl) return;
    stripEl.innerHTML = '';
    stripEl.appendChild(el('span', { class: 'pill lvp', text: S.level === 'seq' ? 'Seq' : 'Gr ' + lvName(S.level).replace('Grades ', '') }));
    if (S.mode === 'timed') stripEl.appendChild(el('span', { class: 'pill clock' + (S.left <= 10 ? ' low' : ''), text: Math.floor(Math.max(0, S.left) / 60) + ':' + ('0' + Math.max(0, S.left) % 60).slice(-2) }));
    stripEl.appendChild(el('span', { class: 'pill streak' + (S.streak >= 3 ? ' hot' : ''), 'aria-label': 'Streak', html: Kit.icon('flame') + '<span>' + S.streak + '</span>' }));
    stripEl.appendChild(el('span', { class: 'pill pts', 'aria-label': 'Score', html: Kit.icon('star') + '<span>' + S.score + '</span>' }));
    if (S.mode === 'timed') stripEl.appendChild(el('span', { class: 'pill best', 'aria-label': 'Best score', html: Kit.icon('trophy') + '<span>' + Math.max(boardBest(), S.score) + '</span>' }));
    if (S.mode === 'ten') stripEl.appendChild(el('span', { class: 'pill', 'aria-label': 'Progress', html: Kit.icon('check') + '<span>' + (S.mode === 'ten' ? Math.min(10, S.log.length + (S.reveal ? 0 : 1)) + '/10' : S.solved) + '</span>' }));
    if (S.mode === 'free') stripEl.appendChild(el('button', { type: 'button', class: 'btn btn-soft btn-sm finish', text: 'Finish', onclick: function () { finish(); } }));
    if (tbar) { tbar.style.width = Math.max(0, 100 * S.left / S.secs) + '%'; tbar.classList.toggle('low', S.left <= 10); }
    // Progress marks on the chalk tray
    trayEl.innerHTML = '';
    trayEl.appendChild(hintBtn);
    var row = el('div', { class: 'dotsrow' });
    if (S.mode === 'ten') {
      for (var i = 0; i < 10; i++) { var l = S.log[i]; row.appendChild(el('i', { class: l ? (l.r === 2 ? 'ok' : l.r === 1 ? 'half' : 'no') : i === S.log.length ? 'cur' : '' })); }
    } else row.appendChild(el('span', { style: { 'font-weight': '900', 'font-size': '.85rem', color: 'rgba(255,255,255,.85)', 'text-shadow': '0 1px 2px rgba(0,0,0,.5)' }, text: S.solved + ' solved' }));
    trayEl.appendChild(row);
    trayEl.appendChild(skipBtn);
    hintBtn.disabled = !!S.reveal;
  }

  // Test hook
  window.__mp = { get: function () { return S; }, start: function (mode, level, secs) { newGame(mode, level, secs || 60, 'You'); }, finish: function () { finish(); } };

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.cur && !saved.done && GENERATORS[saved.level] && MODES[saved.mode]) { S = saved; S.qStart = Date.now(); build(true); }
  else showSetup();
})();
</script>
</body>

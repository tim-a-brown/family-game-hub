<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dominoes</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* ── Page frame: one screen, no scrolling during play ─────────────────── */
#app.stage.dmapp{max-width:none;padding:0 12px calc(var(--safe-b) + 8px);}
.dw{height:calc(100dvh - var(--barh,60px) - var(--safe-b) - 10px);min-height:520px;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.pan{display:contents;}
.dw .scores{order:0;margin:0;padding:2px 0 0;gap:6px;}
.dw .tbl{order:1;}
.dw .status{order:2;}
.dw .rack{order:3;margin-top:4px;}
.dw .score{min-width:0;flex:1 1 0;padding:5px 8px 6px;}
.dw .score .nm{max-width:100%;font-size:.76rem;display:flex;align-items:center;gap:4px;}
.dw .score .nm .ico{width:12px;height:12px;flex:none;}
.dw .score .pt{font-size:1.25rem;}
.dw .score .sub{font-size:.66rem;white-space:nowrap;}
.dw .scores.many .score{padding:5px 3px 6px;} .dw .scores.many .score .nm{font-size:.72rem;} .dw .scores.many .score:not(.tgt) .nm .ico{display:none;}
.dw .score.tgt{flex:0 0 auto;min-width:62px;background:transparent;border-color:var(--w08);border-style:dashed;}
.dw .score.tgt .pt{font-size:1rem;color:var(--text-2);}

/* ── Table ────────────────────────────────────────────────────────────── */
.tbl{position:relative;flex:1 1 auto;min-height:0;border-radius:24px;}
.tbl>.felt-in{position:absolute;inset:9px;border-radius:17px;overflow:hidden;}
.plq{position:absolute;left:8px;right:8px;top:6px;height:46px;display:flex;justify-content:center;align-items:flex-start;gap:6px;pointer-events:none;z-index:3;}
.plq .slot{flex:1 1 0;min-width:0;display:flex;}
.plq .slot.l{justify-content:flex-start;} .plq .slot.c{justify-content:center;} .plq .slot.r{justify-content:flex-end;}
.pq{--c:#fff;position:relative;max-width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 9px 5px;border-radius:12px;background:rgba(0,0,0,.24);box-shadow:inset 0 0 0 1px var(--w06);transition:box-shadow .25s,background .25s;}
.pq .nm{display:flex;align-items:center;gap:5px;max-width:100%;font-weight:800;font-size:.76rem;line-height:1.1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);}
.pq .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pq .nm .ico{width:12px;height:12px;flex:none;opacity:.75;}
.pq .nm i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;}
.pq .bk{display:flex;align-items:flex-end;height:18px;padding-left:2px;}
.pq .bk .dm{--tw:8px;margin-left:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.25),0 1px 1px rgba(0,0,0,.4);}
.pq .bk b{margin-left:5px;font-size:.72rem;font-weight:900;color:rgba(255,255,255,.75);}
.pq.on{background:color-mix(in srgb,var(--c) 26%,rgba(0,0,0,.3));box-shadow:0 0 0 2px var(--c),0 0 16px color-mix(in srgb,var(--c) 55%,transparent);}
.pq .say,.rk-say{position:absolute;left:50%;top:calc(100% + 6px);z-index:9;transform:translateX(-50%);padding:4px 11px;border-radius:12px;background:#fff;color:#1d1b2e;font-weight:900;font-size:.82rem;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.35);animation:say 1.7s var(--ease) forwards;pointer-events:none;}
.pq .say::before{content:"";position:absolute;left:50%;top:-5px;margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom-color:#fff;}
.rk-say{top:auto;bottom:calc(100% + 8px);}
@keyframes say{0%{opacity:0;transform:translate(-50%,6px) scale(.7);}12%{opacity:1;transform:translate(-50%,0) scale(1.05);}20%{transform:translate(-50%,0) scale(1);}82%{opacity:1;}100%{opacity:0;}}
.think{display:inline-flex;gap:2px;margin-left:2px;}
.think i{width:4px!important;height:4px!important;border-radius:50%;background:#fff!important;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

.layer{position:absolute;left:8px;right:8px;top:58px;bottom:44px;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.5));}
.layer .dm{position:absolute;transition:left .4s var(--ease),top .4s var(--ease),width .4s var(--ease),height .4s var(--ease),transform .4s var(--ease);}
.layer .dm.nt{transition:none;}
.layer .dm.spin{box-shadow:inset 0 0 0 1px rgba(90,70,40,.35),inset 1px 1px 0 rgba(255,255,255,.9),0 0 0 2px rgba(255,214,120,.55);}
.layer .dm.last{box-shadow:inset 0 0 0 1px rgba(90,70,40,.35),inset 1px 1px 0 rgba(255,255,255,.9),0 0 0 2px rgba(255,255,255,.75);}
.ghost{position:absolute;z-index:4;border-radius:7px;border:2px dashed #ffe58a;background:rgba(255,229,138,.2);box-shadow:0 0 14px rgba(255,229,138,.7);animation:gpulse 1s ease-in-out infinite alternate;cursor:pointer;}
.ghost::after{content:"";position:absolute;inset:-10px;}
.ghost.hot{background:rgba(255,229,138,.5);border-style:solid;}
.ghost b{position:absolute;inset:0;display:grid;place-items:center;font:400 1.1rem/1 var(--display);color:#fff;text-shadow:0 1px 3px #000;}
@keyframes gpulse{from{opacity:.55;}to{opacity:1;}}
.bone{position:absolute;left:12px;bottom:8px;z-index:3;display:flex;align-items:center;gap:8px;border:0;padding:4px 10px 4px 6px;border-radius:12px;background:rgba(0,0,0,.2);color:#fff;font-weight:800;font-size:.8rem;min-height:36px;}
.bone .pile{position:relative;width:34px;height:26px;}
.bone .pile .dm{--tw:11px;position:absolute;}
.bone.go{cursor:pointer;animation:bglow 1s ease-in-out infinite alternate;}
@keyframes bglow{to{box-shadow:0 0 0 2px #ffe58a,0 0 14px rgba(255,229,138,.7);}}
.bone.none{opacity:.55;}
.ends{position:absolute;right:12px;bottom:8px;z-index:3;display:flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:12px;color:#3a2606;
  background:linear-gradient(180deg,#f6dc8e,#c99a3a);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.35);font-weight:900;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;}
.ends b{font:400 1.25rem/1 var(--display);letter-spacing:0;}
.ends.hit{animation:bounce .6s var(--spring);}
.hlabel{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);white-space:nowrap;pointer-events:none;}

/* ── Domino tiles: ivory face, black pips, center bar, brass pin ─────── */
.dm{--tw:30px;position:relative;flex:none;display:flex;flex-direction:column;width:var(--tw);height:calc(var(--tw) * 2);border-radius:calc(var(--tw) * .17);
  background:linear-gradient(135deg,#fffef8 0%,#f7f0dd 55%,#e9dec4 100%);
  box-shadow:inset 0 0 0 1px rgba(90,70,40,.35),inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -2px 2px rgba(120,95,55,.22);}
.dm .hf{flex:1 1 0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--tw) * .13);}
.dm .hf i{width:74%;height:74%;margin:auto;border-radius:50%;visibility:hidden;
  background:radial-gradient(circle at 38% 32%,#4a4540 0%,#0b0a09 62%);box-shadow:inset 0 1px 1px rgba(0,0,0,.8),0 .5px 0 rgba(255,255,255,.8);}
.dm .hf[data-v="1"] i:nth-child(5),
.dm .hf[data-v="2"] i:nth-child(3),.dm .hf[data-v="2"] i:nth-child(7),
.dm .hf[data-v="3"] i:nth-child(3),.dm .hf[data-v="3"] i:nth-child(5),.dm .hf[data-v="3"] i:nth-child(7),
.dm .hf[data-v="4"] i:nth-child(1),.dm .hf[data-v="4"] i:nth-child(3),.dm .hf[data-v="4"] i:nth-child(7),.dm .hf[data-v="4"] i:nth-child(9),
.dm .hf[data-v="5"] i:nth-child(1),.dm .hf[data-v="5"] i:nth-child(3),.dm .hf[data-v="5"] i:nth-child(5),.dm .hf[data-v="5"] i:nth-child(7),.dm .hf[data-v="5"] i:nth-child(9),
.dm .hf[data-v="6"] i:nth-child(1),.dm .hf[data-v="6"] i:nth-child(3),.dm .hf[data-v="6"] i:nth-child(4),.dm .hf[data-v="6"] i:nth-child(6),.dm .hf[data-v="6"] i:nth-child(7),.dm .hf[data-v="6"] i:nth-child(9){visibility:visible;}
.dm::before{content:"";position:absolute;left:11%;right:11%;top:50%;height:max(1px,calc(var(--tw) * .045));transform:translateY(-50%);border-radius:1px;
  background:linear-gradient(180deg,rgba(60,45,25,.55),rgba(255,255,255,.7));}
.dm .pin{position:absolute;left:50%;top:50%;width:calc(var(--tw) * .2);height:calc(var(--tw) * .2);transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6cf 0%,#e2b54c 40%,#9a6a18 100%);box-shadow:0 .5px 1px rgba(0,0,0,.5),inset 0 -.5px 0 rgba(0,0,0,.3);}
.dm.back{background:linear-gradient(135deg,#4a403a 0%,#2a2420 55%,#191512 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 1px 1px 0 var(--w18);}
.dm.back .hf{visibility:hidden;}
.dm.back::before{background:var(--w08);}
.dm.mini .hf,.dm.mini::before{display:none;}
.dm.mini .pin{width:3px;height:3px;}

/* ── Status line ──────────────────────────────────────────────────────── */
.status{display:flex;align-items:center;gap:8px;min-height:46px;}
.msg{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-weight:900;font-size:1rem;line-height:1.2;}
.msg .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent);}
.msg small{display:block;font-weight:700;font-size:.8rem;color:var(--text-2);}
.acts{display:flex;gap:6px;flex:none;}
.acts .btn{min-height:44px;padding:0 14px;font-size:.92rem;gap:6px;}
.acts .btn .ico{width:18px;height:18px;}

/* ── Your rack ────────────────────────────────────────────────────────── */
.rack{position:relative;flex:none;border-radius:16px;padding:14px 10px 12px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:8px 6px;
  background:repeating-linear-gradient(92deg,var(--w05) 0 2px,transparent 2px 9px),linear-gradient(180deg,#8a5428,#5e3517);
  box-shadow:inset 0 2px 0 rgba(255,220,180,.25),inset 0 -5px 0 rgba(0,0,0,.3),0 10px 20px rgba(0,0,0,.4);transition:box-shadow .25s;}
.rack::after{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:5px;border-radius:3px;background:rgba(0,0,0,.25);box-shadow:0 1px 0 rgba(255,220,180,.18);pointer-events:none;}
.rack.on{box-shadow:inset 0 2px 0 rgba(255,220,180,.25),inset 0 -5px 0 rgba(0,0,0,.3),0 0 0 2px var(--c,#ffc83d),0 0 18px color-mix(in srgb,var(--c,#ffc83d) 50%,transparent);}
.rack .dm{cursor:pointer;border:0;padding:0;touch-action:none;transition:transform .2s var(--spring),filter .2s,opacity .2s;box-shadow:inset 0 0 0 1px rgba(90,70,40,.35),inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -2px 2px rgba(120,95,55,.22),0 3px 4px rgba(0,0,0,.45);}
.rack .dm.sel{transform:translateY(-9px);box-shadow:inset 0 0 0 1px rgba(90,70,40,.35),0 0 0 3px #ffd84a,0 0 14px rgba(255,216,74,.7),0 10px 12px rgba(0,0,0,.45);}
.rack .dm.no{filter:brightness(.72) saturate(.6);}
.rack .dm.drag{opacity:.25;}
.rack .dm.dealin{animation:dealin .45s var(--ease) both;}
.rack .dm.flipin{animation:flipin .35s var(--ease) both;}
@keyframes dealin{from{transform:translateY(-60px) rotate(-12deg) scale(.6);opacity:0;}to{transform:none;opacity:1;}}
@keyframes flipin{0%{transform:scaleX(0);}100%{transform:none;}}
.rack .lbl{position:absolute;left:12px;top:-1px;transform:translateY(-55%);padding:2px 9px;border-radius:999px;background:#5e3517;color:#f6dcb8;font-size:.68rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 2px 4px rgba(0,0,0,.35);white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis;}
.rack .lbl b{color:#fff;}
.rack .empty{color:#f6dcb8;font-weight:800;font-size:.9rem;opacity:.8;}
.fly{position:fixed;z-index:60;pointer-events:none;margin:0;}
.drag-dm{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 10px 10px rgba(0,0,0,.5));}
.tbl.bump{animation:bump .25s ease-out;}
@keyframes bump{40%{transform:translateY(1.5px);}}

/* ── Hand-over sheet ──────────────────────────────────────────────────── */
.hres .head{text-align:center;font-weight:800;color:var(--text-2);margin:-4px 0 12px;}
.hres .head b{color:var(--yellow);}
.hres .row2{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--w07);}
.hres .row2 .who{width:84px;flex:none;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hres .row2 .tl{flex:1;display:flex;flex-wrap:wrap;gap:4px;min-height:30px;align-items:center;}
.hres .row2 .tl .dm{--tw:17px;}
.hres .row2 .tl em{font-style:normal;color:var(--green);font-weight:800;font-size:.85rem;}
.hres .row2 .pp{width:52px;text-align:right;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text-2);}
.hres .row2 .pp small{display:block;font-size:.66rem;color:var(--text-3);font-weight:800;}
.hres .tot{display:flex;gap:8px;margin-top:14px;}
.hres .tot>div{flex:1;text-align:center;padding:8px 6px;border-radius:12px;background:var(--w06);}
.hres .tot .n{font-size:.75rem;font-weight:800;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hres .tot .v{font-size:1.4rem;font-weight:900;font-variant-numeric:tabular-nums;}
.hres .tot .g{font-size:.75rem;font-weight:900;color:var(--green);}

/* ── iPad and desktop ─────────────────────────────────────────────────── */
@media (min-width:700px) and (orientation:portrait){
  .dw{max-width:720px;gap:12px;}
  .dw .score{padding:7px 10px 8px;} .dw .score .nm{font-size:.86rem;} .dw .score .pt{font-size:1.5rem;}
  .pq .nm{font-size:.9rem;} .pq .bk .dm{--tw:10px;} .plq{height:54px;} .layer{top:66px;}
  .msg{font-size:1.15rem;} .msg small{font-size:.9rem;}
}
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  .dw{max-width:1240px;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) auto;gap:12px 20px;}
  .pan{display:flex;flex-direction:column;gap:14px;grid-column:2;grid-row:1 / span 2;padding-top:4px;}
  .dw .tbl{grid-column:1;grid-row:1;}
  .dw .rack{grid-column:1;grid-row:2;}
  .dw .scores{flex-direction:column;overflow:visible;}
  .dw .score{flex:none;flex-direction:row;justify-content:space-between;padding:10px 14px;gap:10px;}
  .dw .score .nm{font-size:.95rem;flex:1;}
  .dw .score .pt{font-size:1.5rem;order:3;}
  .dw .score .sub{font-size:.75rem;}
  .dw .score.on{transform:translateX(-3px);}
  .dw .scores.many .score{padding:10px 14px;} .dw .scores.many .score .nm{font-size:.95rem;} .dw .scores.many .score:not(.tgt) .nm .ico{display:block;}
  .status{flex-direction:column;align-items:stretch;gap:12px;}
  .msg{font-size:1.15rem;} .msg small{font-size:.9rem;}
  .acts{flex-direction:column;} .acts .btn{min-height:50px;}
  .pq .nm{font-size:.88rem;} .pq .bk .dm{--tw:10px;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var KEY = 'dominoes', SAVE = 'dominoes_state';
  var VNAME = { draw: 'Draw', block: 'Block', fives: 'All Fives' };
  var TARGETS = { draw: { short: 100, long: 150 }, block: { short: 100, long: 150 }, fives: { short: 150, long: 250 } };
  var NUMW = ['zero', 'one', 'two', 'three', 'four', 'five', 'six'];
  var DNAME = ['blank', 'one', 'two', 'three', 'four', 'five', 'six'];

  // ── Small helpers ─────────────────────────────────────────────────────────
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function last(a) { return a[a.length - 1]; }
  function tid(t) { var a = Math.min(t[0], t[1]), b = Math.max(t[0], t[1]); return a * 7 + b; }
  function pips(t) { return t[0] + t[1]; }
  function isDbl(t) { return t[0] === t[1]; }
  function tname(t) { return isDbl(t) ? 'double ' + DNAME[t[0]] : t[0] + '-' + t[1]; }
  function handPips(h) { return h.reduce(function (s, t) { return s + pips(t); }, 0); }
  function round5(x) { return Math.round(x / 5) * 5; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function fullSet() { var s = []; for (var a = 0; a <= 6; a++) for (var b = a; b <= 6; b++) s.push([a, b]); return s; }

  // ── State ─────────────────────────────────────────────────────────────────
  // S = {mode, variant, target, teams, players:[{name,cpu,color,hand:[[a,b]..]}], score:[per side],
  //   hand, bone:[tiles], line:{root:{t:[w,e]}, arms:{E,W,N,S:[{t:[in,out]}]}, spin}|null,
  //   cur, viewer, passes, phase:'deal'|'play'|'handend'|'over', last:{p,id,pts}, lacks:[[values]..],
  //   handPts:[per side], rounds:[[per side]..], res:{..hand result}, undo, undoBy, hl:{..}, started}
  var S = null, SPD = 1, tok = 0, lock = false, sel = -1, done = false;   // done: this turn's move is made
  function save() {
    if (!S) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S.phase !== 'over') Kit.resume.set(VNAME[S.variant] + ' · hand ' + S.hand + ' · ' + S.score.join('–'), { keys: [SAVE] });
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function later(fn, ms) { var t = tok; setTimeout(function () { if (t === tok && S) fn(); }, Math.max(0, ms * SPD)); }
  function nSides() { return S.teams ? 2 : S.players.length; }
  function sideOf(i) { return S.teams ? i % 2 : i; }
  function sideName(s) {
    if (!S.teams) return S.players[s].name;
    return S.players.filter(function (p, i) { return i % 2 === s; }).map(function (p) { return p.name; }).join(' & ');
  }
  function humans() { return S.players.filter(function (p) { return !p.cpu; }).length; }
  function firstHuman() { for (var i = 0; i < S.players.length; i++) if (!S.players[i].cpu) return i; return 0; }
  function who(i) { return S.players[i].name; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ═════════════════════════════════════════════════════════════════════════
  // Rules engine
  // ═════════════════════════════════════════════════════════════════════════
  function ends(L) {
    if (!L) return [];
    var r = L.root, A = L.arms, out = [];
    out.push({ end: 'E', v: A.E.length ? last(A.E).t[1] : r.t[1] });
    out.push({ end: 'W', v: A.W.length ? last(A.W).t[1] : r.t[0] });
    if (L.spin && A.E.length && A.W.length) {
      out.push({ end: 'N', v: A.N.length ? last(A.N).t[1] : r.t[0] });
      out.push({ end: 'S', v: A.S.length ? last(A.S).t[1] : r.t[0] });
    }
    return out;
  }
  // All Fives: total of the open ends (a double at an end counts both halves;
  // the spinner counts both halves until both of its long sides are played)
  function endCount(L) {
    if (!L) return 0;
    var r = L.root, A = L.arms, s = 0;
    if (L.spin) { if (!A.E.length || !A.W.length) s += r.t[0] * 2; }
    else { if (!A.E.length) s += r.t[1]; if (!A.W.length) s += r.t[0]; }
    ['E', 'W', 'N', 'S'].forEach(function (k) {
      var a = A[k]; if (!a.length) return;
      var t = last(a).t; s += t[0] === t[1] ? t[0] * 2 : t[1];
    });
    return s;
  }
  function playScore(L) { if (S.variant !== 'fives') return 0; var c = endCount(L); return c > 0 && c % 5 === 0 ? c : 0; }
  function place(L, t, end) {
    if (!L) {
      return { root: { t: [t[0], t[1]] }, arms: { E: [], W: [], N: [], S: [] }, spin: S.variant === 'fives' && isDbl(t) };
    }
    L = clone(L);

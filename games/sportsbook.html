<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sportsbook</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../casino.js"></script>
<style>
body{overflow-x:hidden;}
.sb{max-width:760px;margin:0 auto;padding:4px 14px calc(var(--safe-b) + 96px);}
.sb-side{display:contents;}
.sb-main{min-width:0;}

/* ── Money strip (chrome): a caps label over each amount ── */
.sb-money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px;}
.sb-money div{background:var(--w06);border-radius:14px;padding:8px 10px 7px;min-width:0;}
.sb-money small{display:block;font-size:.66rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);}
.sb-money b{display:block;font-size:1.12rem;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;}
.sb-money .bank b{color:var(--green);}

/* Board / My bets switch, league chips */
.sb-view{margin:0 0 10px;}
.sb-view button{position:relative;}
.sb-view .n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--accent);color:#08210f;font-size:.74rem;font-weight:900;vertical-align:1px;}
.sb-view .n.pop{animation:sbpop .5s var(--spring);}
@keyframes sbpop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.sb-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 10px;padding:2px 14px 4px;}
.sb-tabs::-webkit-scrollbar{display:none;}
.sb-tabs .chip svg{width:16px;height:16px;}
.sb-tabs .chip.on svg{color:#c8901a;}

/* ── The board: lit sportsbook panels ── */
.sb-day{margin:16px 2px 8px;font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);display:flex;justify-content:space-between;gap:10px;}
.sb-day:first-child{margin-top:4px;}
.gm{position:relative;margin:0 0 10px;border-radius:16px;padding:8px 10px 10px;color:#f4f6fb;
  background:linear-gradient(180deg,#171c26 0%,#0c0f15 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.04),0 8px 20px rgba(0,0,0,.42);}
.gm::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(rgba(255,255,255,.045) .8px,transparent 1.1px) 0 0/3px 3px;}
.gm.fav{box-shadow:inset 3px 0 0 #f2b632,inset 0 1px 0 rgba(255,255,255,.07),0 8px 20px rgba(0,0,0,.42);}
.gm .gh{display:grid;grid-template-columns:minmax(0,1fr) var(--pw) var(--pw) var(--pw);gap:6px;align-items:end;margin:0 0 6px;}
.gm{--pw:clamp(58px,17vw,84px);}
.gm .when{font-size:.74rem;font-weight:800;color:#9aa6bd;white-space:nowrap;display:flex;align-items:center;gap:6px;min-width:0;}
.gm .when .live{display:inline-flex;align-items:center;gap:5px;color:#ff5a5f;font-weight:900;letter-spacing:.08em;}
.gm .when .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff3b44;box-shadow:0 0 8px #ff3b44;animation:sblive 1.4s infinite;}
@keyframes sblive{50%{opacity:.3}}
.gm .mk{font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#7d879b;text-align:center;white-space:nowrap;}
.tr{display:grid;grid-template-columns:minmax(0,1fr) var(--pw) var(--pw) var(--pw);gap:6px;align-items:stretch;}
.tr + .tr{margin-top:6px;}
.tr.live{grid-template-columns:minmax(0,1fr) auto;}
.tm{display:flex;align-items:center;gap:9px;min-width:0;}
.logo{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5);overflow:hidden;}
.logo img{width:24px;height:24px;object-fit:contain;display:block;}
.logo.disc{font-size:.6rem;font-weight:900;letter-spacing:-.02em;}
.nm{min-width:0;flex:1;display:flex;flex-direction:column;}
.nm b{font-size:1.02rem;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;}
.nm b .rk{font-size:.72em;color:#9aa6bd;margin-right:4px;font-weight:800;}
.nm b svg{width:13px;height:13px;color:#f2b632;fill:#f2b632;vertical-align:-1px;margin-left:5px;}
.nm small{font-size:.72rem;font-weight:700;color:#8590a6;white-space:nowrap;}
.sc{font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;color:#ffcf5a;text-shadow:0 0 10px rgba(255,190,60,.45);min-width:1.6em;text-align:right;}
.sc.lead{color:#fff3c4;}
.px{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;padding:4px 2px;border-radius:11px;
  border:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,#232b38,#1a202b);color:#fff;font:inherit;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 rgba(0,0,0,.5);transition:transform .12s,background .2s,box-shadow .2s;}
.px:active{transform:translateY(1px) scale(.97);}
.px i{font-style:normal;font-size:.95rem;font-weight:900;color:#ffc84a;text-shadow:0 0 8px rgba(255,190,60,.35);font-variant-numeric:tabular-nums;white-space:nowrap;}
.px span{font-size:.8rem;font-weight:800;color:#c9d1e0;font-variant-numeric:tabular-nums;white-space:nowrap;}
.px.solo span{font-size:.98rem;color:#fff;font-weight:900;}
.px.solo span.long{font-size:.84rem;letter-spacing:-.02em;}
.px.on{background:linear-gradient(180deg,#25a35b,#16703e);border-color:#53e892;box-shadow:0 0 0 1px #53e892,0 0 18px rgba(61,220,132,.5),inset 0 1px 0 rgba(255,255,255,.25);animation:sbpx .35s var(--spring);}
.px.on i,.px.on span{color:#fff;text-shadow:none;}
@keyframes sbpx{0%{transform:scale(.9)}100%{transform:scale(1)}}
.px.moved i,.px.moved span{animation:sbmove 1.6s;}
@keyframes sbmove{0%,40%{color:#fff;text-shadow:0 0 12px #fff}}
.px[disabled]{cursor:default;opacity:.5;background:#151a22;box-shadow:none;}
.px[disabled] svg{width:15px;height:15px;color:#6d778a;}
.px.none{background:transparent;border:1px dashed rgba(255,255,255,.08);box-shadow:none;}
.gm .gev{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;margin:0 0 6px;font-size:.74rem;font-weight:800;color:#9aa6bd;}
.gm .gev b{color:#dfe5f0;font-weight:900;}
.gm .note{grid-column:1/-1;font-size:.72rem;font-weight:700;color:#7d879b;margin-top:6px;}

.sb-empty{text-align:center;padding:34px 18px;color:var(--text-2);}
.sb-empty svg{width:42px;height:42px;color:var(--text-3);}
.sb-empty h3{margin:8px 0 4px;font:400 1.35rem var(--display);color:var(--text);}
.sb-empty p{margin:0 0 14px;font-size:.92rem;}
.sb-load{display:grid;gap:10px;}
.sb-load div{height:118px;border-radius:16px;background:linear-gradient(90deg,#121721 0%,#1a2130 50%,#121721 100%) 0 0/200% 100%;animation:sbshim 1.2s infinite linear;}
@keyframes sbshim{to{background-position:-200% 0}}

/* Golf: a leaderboard */
.gm.golf{--pw:clamp(60px,17vw,88px);}
.gm .gtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;margin:2px 0 8px;}
.gm .gtop b{font-size:1.08rem;font-weight:900;line-height:1.15;}
.lb{display:grid;grid-template-columns:34px minmax(0,1fr) 42px 30px var(--pw);gap:6px;align-items:center;padding:4px 0;border-top:1px solid rgba(255,255,255,.05);}
.lb.lbh{border-top:0;padding:0 0 2px;font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#7d879b;}
.lb.lbh .mk{text-align:center;}
.lb .pos{font-size:.82rem;font-weight:900;color:#c9d1e0;font-variant-numeric:tabular-nums;white-space:nowrap;}
.lb .tm{gap:8px;}
.lb .logo{width:24px;height:24px;}
.lb .logo img{width:100%;height:100%;object-fit:cover;}
.lb .nm b{font-size:.92rem;}
.lb .tp{font-size:1.02rem;font-weight:900;text-align:right;font-variant-numeric:tabular-nums;color:#f4f6fb;}
.lb .tp.under{color:#ff6b6b;text-shadow:0 0 8px rgba(255,90,90,.35);}
.lb .th{font-size:.78rem;font-weight:800;color:#8590a6;text-align:center;}
.lb .px{min-height:40px;}
.lb.out{opacity:.42;}
.lbmore{display:block;width:100%;margin:8px 0 0;padding:10px;border:0;border-radius:11px;background:rgba(255,255,255,.06);color:#c9d1e0;font:inherit;font-weight:800;font-size:.85rem;}

/* My teams strip */
.myt{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 6px;padding:2px 14px 6px;}
.myt::-webkit-scrollbar{display:none;}
.myt button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;padding:8px 4px 6px;border:0;border-radius:14px;background:var(--w06);color:var(--text-2);font:inherit;font-size:.7rem;font-weight:800;}
.myt button .logo{width:36px;height:36px;}
.myt button .logo img{width:28px;height:28px;}
.myt button span{max-width:100%;white-space:nowrap;}
.myt .add{color:var(--text-3);}
.myt .add i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2px dashed var(--line-2);}
.myt .add svg{width:18px;height:18px;}

/* ── Thermal paper: the bet slip and every ticket ── */
.tk{position:relative;--z:6px;background:#f6f4ee;color:#1d1d22;font-family:var(--mono);font-size:12.5px;line-height:1.35;padding:calc(var(--z) + 10px) 14px calc(var(--z) + 10px);
  -webkit-mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/calc(2*var(--z)) 51% repeat-x,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(2*var(--z)) 51% repeat-x;
          mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/calc(2*var(--z)) 51% repeat-x,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/calc(2*var(--z)) 51% repeat-x;
  background-image:linear-gradient(90deg,rgba(0,0,0,.035),transparent 8%,transparent 92%,rgba(0,0,0,.035));}
.tkw{filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));margin:0 0 14px;}
.tk .hd{display:flex;justify-content:space-between;gap:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#55555e;}
.tk .brand{font-family:var(--display);font-size:17px;letter-spacing:.04em;color:#1d1d22;text-transform:uppercase;}
.tk hr{border:0;border-top:1.5px dashed #b9b6ad;margin:8px 0;}
.tk .lg{position:relative;padding:2px 0 2px 10px;}
.tk .lg + .lg{margin-top:10px;}
.tk .lg::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;background:#cfccc2;}
.tk .lg.ahead::before,.tk .lg.win::before{background:#1f9d55;}
.tk .lg.behind::before,.tk .lg.loss::before{background:#d6363f;}
.tk .lg.push::before{background:#c79a1c;}
.tk .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.tk .row > :first-child{min-width:0;}
.tk .row > :last-child:not(:first-child){white-space:nowrap;}
.tk .cap{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6c6a72;}
.tk .pick{font-size:15px;font-weight:800;color:#111;}
.tk .odds{font-size:14px;font-weight:800;white-space:nowrap;}
.tk .says{font-size:12px;color:#3c3c44;}
.tk .says.nb{color:#6c6a72;}
.tk .mu{font-size:12px;color:#55555e;}
.tk .lv{font-weight:800;color:#111;white-space:nowrap;}
.tk .tot b{font-size:15px;}
.tk .bar{height:30px;margin:10px 0 0;opacity:.85;}
.tk .bar svg{display:block;}
.tk .lg .x{flex:none;width:28px;height:28px;margin:-4px -6px 0 0;border:0;border-radius:50%;background:transparent;color:#77757d;display:grid;place-items:center;}
.tk .lg .x svg{width:16px;height:16px;}
.tk .lg.gone{opacity:.45;}
.tk .lg.chg .odds,.tk .lg.chg .pick{animation:sbchg 1.8s;}
@keyframes sbchg{0%,50%{background:#ffe08a}}
.tk .rs{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;vertical-align:-3px;margin-right:4px;}
.tk .rs svg{width:11px;height:11px;stroke-width:3.4;}
.tk .rs.win{background:#1f9d55;}.tk .rs.loss{background:#d6363f;}.tk .rs.push{background:#c79a1c;}
.stamp{position:absolute;left:50%;bottom:calc(var(--z) + 6px);transform:translateX(-50%) rotate(-6deg);white-space:nowrap;border:3px solid currentColor;border-radius:8px;padding:2px 10px 0;font:400 25px/1.15 var(--display);letter-spacing:.07em;opacity:.82;pointer-events:none;mix-blend-mode:multiply;
  -webkit-mask:radial-gradient(rgba(0,0,0,.72) .9px,#000 1.4px) 0 0/5px 5px;mask:radial-gradient(rgba(0,0,0,.72) .9px,#000 1.4px) 0 0/5px 5px;}
.stamp.win{color:#16924a;}.stamp.loss{color:#cc2a35;}.stamp.push{color:#b5880f;}
.stamp.in{animation:sbstamp .42s cubic-bezier(.2,1.6,.4,1) both;}
@keyframes sbstamp{0%{transform:translateX(-50%) rotate(-6deg) scale(2.4);opacity:0}100%{transform:translateX(-50%) rotate(-6deg) scale(1);opacity:.82}}
.tk.paid .bar{opacity:.16;}

/* Bet slip */
.slip-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;display:flex;justify-content:center;}
.slip-wrap > *{pointer-events:auto;}
.slip-bar{display:flex;align-items:center;gap:12px;width:min(100% - 20px,620px);margin:0 10px calc(var(--safe-b) + 10px);padding:10px 14px;border:0;border-radius:18px;
  background:linear-gradient(180deg,#1e9b55,#137140);color:#fff;font:inherit;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);text-align:left;animation:sbup .3s var(--ease);}
@keyframes sbup{from{transform:translateY(120%)}}
.slip-bar .ct{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#137140;font-weight:900;flex:none;}
.slip-bar .t{flex:1;min-width:0;}
.slip-bar .t b{display:block;font-size:1.02rem;font-weight:900;}
.slip-bar .t small{display:block;font-size:.76rem;font-weight:700;opacity:.85;white-space:nowrap;}
.slip-bar .v{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;}
.slip-bar .v small{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;}
.slip-bar svg{width:20px;height:20px;flex:none;transform:rotate(180deg);}
.slip-shade{position:fixed;inset:0;z-index:39;background:rgba(5,3,14,.55);opacity:0;transition:opacity .25s;pointer-events:none;}
.slip-shade.on{opacity:1;pointer-events:auto;}
.slip{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;justify-content:center;transform:translateY(105%);visibility:hidden;transition:transform .32s var(--ease),visibility 0s .32s;pointer-events:none;}
.slip.on{transform:none;visibility:visible;transition:transform .32s var(--ease);pointer-events:auto;}
.slip-in{width:min(100%,560px);max-height:calc(100dvh - var(--bar) - 10px);overflow-y:auto;overscroll-behavior:contain;padding:10px 10px calc(var(--safe-b) + 12px);}
.slip-x{display:flex;justify-content:center;margin:0 0 6px;}
.slip-x button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:6px 16px;font:inherit;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:6px;}
.slip-x svg{width:16px;height:16px;}
.slipbody .mode{display:flex;gap:4px;padding:3px;border-radius:10px;background:#e4e1d8;margin:2px 0 10px;}
.slipbody .mode button{flex:1;border:0;border-radius:8px;background:transparent;padding:7px 4px;font:inherit;font-family:var(--font);font-weight:900;font-size:.85rem;color:#55555e;}
.slipbody .mode button.on{background:#1d1d22;color:#fff;}
.slipbody .mode button[disabled]{opacity:.4;}
.stake{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 8px;}
.stake .amt{font:400 28px/1 var(--display);color:#111;font-variant-numeric:tabular-nums;}
.stake .amt small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#6c6a72;text-transform:uppercase;margin-bottom:3px;}
.stake .clr{border:0;background:#e4e1d8;color:#3c3c44;border-radius:99px;padding:6px 12px;font:inherit;font-family:var(--font);font-weight:800;font-size:.8rem;}
.chips{display:flex;justify-content:space-between;gap:6px;margin:0 0 10px;}
.cchip{--c:#c62d36;flex:1;max-width:58px;aspect-ratio:1;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;font:900 .82rem var(--font);color:#fff;
  background:radial-gradient(circle,var(--c) 0 52%,#fff 53% 56%,var(--c) 57% 70%,transparent 71%),repeating-conic-gradient(var(--c) 0 22.5deg,#f4f1e8 22.5deg 45deg);
  box-shadow:0 3px 0 rgba(0,0,0,.35),0 5px 10px rgba(0,0,0,.25);text-shadow:0 1px 1px rgba(0,0,0,.4);transition:transform .1s;}
.cchip:active{transform:translateY(2px) scale(.95);}
.cchip[disabled]{opacity:.35;}
.cchip.c25{--c:#1d8f4c;}.cchip.c100{--c:#202027;}.cchip.c500{--c:#6b3fc4;}.cchip.c1000{--c:#c48a12;}
.place{width:100%;min-height:54px;border:0;border-radius:14px;background:linear-gradient(180deg,#25a35b,#16703e);color:#fff;font:inherit;font-family:var(--font);font-weight:900;font-size:1.05rem;box-shadow:0 4px 0 #0d4a28;margin-top:10px;}
.place:active{transform:translateY(2px);box-shadow:0 2px 0 #0d4a28;}
.place[disabled]{background:#b9b6ad;box-shadow:0 4px 0 #8f8c84;color:#f6f4ee;}
.place small{display:block;font-size:.75rem;font-weight:800;opacity:.9;}
.slip-hint{font-size:12px;color:#6c6a72;text-align:center;margin:8px 0 0;}

/* Printing a ticket */
.prn{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--safe-b) + 40px);}
.prn .mouth{position:absolute;left:50%;bottom:calc(var(--safe-b) + 28px);width:min(86vw,360px);height:16px;transform:translateX(-50%);border-radius:8px;background:#0b0d12;box-shadow:0 0 0 3px #2a303b,0 8px 20px rgba(0,0,0,.6);}
.prn .slotwin{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 36px);top:calc(var(--bar) + 8px);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;}
.prn .feed{position:relative;width:min(80vw,330px);max-height:100%;}
.prn .feed .tkw{margin:0;}
.prn .feed.out{animation:sbfeed 1.05s steps(16) both;}
@keyframes sbfeed{from{transform:translateY(100%)}to{transform:none}}

/* My bets */
.bt-seg{margin:0 0 12px;}
.tkl{display:grid;gap:0;}
.tkl{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));column-gap:14px;align-items:start;}
.tkl > *{min-width:0;}

/* Team picker */
.tp-lgs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 10px;padding:0 20px 2px;}
.tp-lgs::-webkit-scrollbar{display:none;}
.tp-q{width:100%;min-height:44px;border-radius:12px;border:0;background:var(--w07);color:var(--text);padding:0 14px;font:inherit;font-size:1rem;margin:0 0 8px;}
.tp-list{display:grid;gap:2px;}
.tp-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--text);padding:8px 4px;border-radius:12px;font:inherit;text-align:left;}
.tp-row:active{background:var(--w06);}
.tp-row .tx{flex:1;min-width:0;}
.tp-row .tx b{display:block;font-weight:800;}
.tp-row .tx small{display:block;font-size:.75rem;color:var(--text-3);font-weight:700;}
.tp-row .st{width:26px;height:26px;color:var(--text-3);flex:none;}
.tp-row.on .st{color:#f2b632;fill:#f2b632;}
.tp-row.on .st svg{fill:#f2b632;}
.tp-row .st svg{width:26px;height:26px;}
.tp-mine{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;}
.tp-mine span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--w07);font-size:.8rem;font-weight:800;}
.tp-mine .logo{width:22px;height:22px;}
.tp-mine .logo img{width:17px;height:17px;}

/* Results */
.res-sum{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;}
.res-sum > div{display:flex;flex-direction:column;}

}

  .gm{--pw:clamp(56px,10vw,80px);}
}

  // a ticket leg's bottom line: [left, right, bold]: the matchup and start, or the score live and final

  function paintBets() {

  // ── Favourite teams ──────────────────────────────────────────────────────

      var out = [];

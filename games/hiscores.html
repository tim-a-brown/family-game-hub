<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>High Scores</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>

<style>
@font-face{font-family:"Press Start 2P";src:url("../fonts/press-start-2p.woff2") format("woff2");font-display:block;}
@font-face{font-family:'Sofia Sans Condensed';src:url('../fonts/sofia-sans-condensed.woff2') format('woff2');font-weight:100 900;font-display:swap;}
@font-face{font-family:"Bungee";src:url("../fonts/bungee.woff2") format("woff2");font-display:swap;}
body.hs{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:#07060f;}
body.hs .gbar{background:rgba(7,6,15,.9);}
/* Light themes: the page and its bar follow the theme; the cabinet stays a dark cabinet */
html[data-theme="light"] body.hs,html[data-theme="parchment"] body.hs{background:var(--page-bg);}
html[data-theme="light"] body.hs .gbar,html[data-theme="parchment"] body.hs .gbar{background:transparent;}
.hs-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:0 12px calc(var(--safe-b) + 10px);}
/* Arcade / Puzzles switch above the cabinet (page chrome: theme colours) */
.hs-sec{flex:none;width:100%;max-width:520px;margin:0 0 10px;}
.hs-sec > button{flex:1;min-height:40px;font-weight:900;font-size:.95rem;}

/* ── The cabinet ── */
.cab{--w06:rgba(255,255,255,.06);--w08:rgba(255,255,255,.08);--w16:rgba(255,255,255,.16);--w18:rgba(255,255,255,.18);
  position:relative;flex:1;min-height:0;width:100%;max-width:520px;display:flex;flex-direction:column;
  padding:12px 14px 0;border-radius:22px 22px 6px 6px;
  background:linear-gradient(90deg,var(--sd) 0,var(--sd) 9px,var(--sm) 9px,var(--sm) 14px,var(--bd) 14px,var(--bd) calc(100% - 14px),var(--sm) calc(100% - 14px),var(--sm) calc(100% - 9px),var(--sd) calc(100% - 9px));
  box-shadow:inset 0 0 0 3px var(--trim),inset 0 0 0 5px rgba(0,0,0,.45),0 18px 40px -10px rgba(0,0,0,.8),0 0 60px -20px var(--glow);
  transition:background .5s, box-shadow .5s;}
.cab::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 30%),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px);}

/* marquee: the lit sign on top */
.mq{position:relative;flex:none;height:84px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:10px;overflow:hidden;
  background:var(--mq);box-shadow:inset 0 0 0 2px var(--w18),inset 0 -14px 30px rgba(0,0,0,.45),0 0 22px -2px var(--glow);}
/* The sign's power "hum": a black layer over the sign flickers in now and then
   (opacity only; black at 30% = brightness .7) */
.mq::before{content:"";position:absolute;inset:0;z-index:1;background:#000;opacity:0;pointer-events:none;animation:mqhum 7s infinite;}
.mq::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%);pointer-events:none;}
.mq canvas{flex:none;width:48px;height:36px;image-rendering:pixelated;}
/* puzzle boards: the game's own icon each side of the title instead of the pixel sprites */
.mq .pzi{display:none;flex:none;width:40px;height:40px;position:relative;z-index:0;filter:drop-shadow(0 0 8px var(--glow));}
.mq .pzi svg{width:100%;height:100%;display:block;}
.mq.pz canvas{display:none;}
.mq.pz .pzi{display:block;}
.mq .mt{min-width:0;text-align:center;}
.mq h1{margin:0;font-family:"Bungee",var(--display);font-weight:400;font-size:clamp(1.5rem,7.4vw,2.2rem);line-height:1;letter-spacing:.02em;white-space:nowrap;
  color:var(--tc);text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 14px var(--glow);}
.mq h1 i{font-style:normal;}
.mq h1.outline{color:transparent;-webkit-text-stroke:1.5px #fff;text-shadow:0 0 10px var(--glow),0 0 2px #fff;}
.mq small{display:block;margin-top:7px;font-family:"Press Start 2P",monospace;font-size:.56rem;letter-spacing:.14em;color:#fff;opacity:.85;}
@keyframes mqhum{0%,100%{opacity:0}91%{opacity:0}92%{opacity:.3}93%{opacity:0}95%{opacity:.15}96%{opacity:0}}

/* bezel + CRT */
.bez{position:relative;flex:1;min-height:0;display:flex;gap:9px;margin:10px 0 0;padding:10px;border-radius:14px;
  background:linear-gradient(180deg,#141414,#0b0b0b);box-shadow:inset 0 2px 0 var(--w08),inset 0 0 0 2px #000,0 2px 0 var(--w06);}
.bez::before{content:"";position:absolute;inset:4px;border-radius:11px;pointer-events:none;box-shadow:inset 0 0 0 1px var(--trim);opacity:.35;}
.crt{position:relative;flex:1;min-width:0;border-radius:22px/18px;overflow:hidden;background:var(--scr,#000);
  box-shadow:inset 0 0 0 2px #000,inset 0 0 38px rgba(0,0,0,.95);}
.crt canvas.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:var(--bgo,.5);transition:opacity .4s;}
.crt.dim canvas.bg{opacity:calc(var(--bgo,.5) * .5);}
.crt .shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,.35),rgba(0,0,0,.75));}
.crt .lines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1px,rgba(0,0,0,0) 1px 3px);z-index:3;}
.crt .glass{position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:inherit;
  background:radial-gradient(70% 40% at 22% 8%,rgba(255,255,255,.10),rgba(255,255,255,0) 60%);box-shadow:inset 0 0 60px rgba(0,0,0,.6);}
.crt .fx{position:absolute;inset:0;z-index:5;pointer-events:none;background:#fff;opacity:0;}
.crt.off .tube{transform:scale(1,.004);filter:brightness(4);transition:transform .16s ease-in,filter .16s;}
.tube{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .22s cubic-bezier(.2,1.4,.4,1),filter .3s;}

/* the scores on the screen */
.sb{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;container-type:inline-size;font-family:"Press Start 2P",monospace;color:#fff;
  -webkit-font-smoothing:none;text-shadow:0 0 6px currentColor;animation:flick 4s infinite steps(1);}
@keyframes flick{0%{opacity:1}50%{opacity:.965}52%{opacity:1}}
.sb .hd{flex:none;padding:16px 12px 8px;text-align:center;}
.sb .hd b{display:block;font-weight:400;font-size:clamp(11px,5.6cqi,16px);color:var(--hc);letter-spacing:.08em;}
/* headings share the rows' font size so the em-based columns line up exactly; the words are just drawn smaller */
.sb .hd .cols{display:grid;grid-template-columns:var(--gc);gap:0 6px;margin-top:14px;font-size:var(--fs,11px);color:var(--lc);text-shadow:none;opacity:.85;text-align:left;}
.sb .hd .cols span{font-size:.7em;}
.sb ol{flex:1;min-height:0;margin:0;padding:2px 12px 8px;list-style:none;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 8px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 8px,#000 calc(100% - 14px),transparent);}
.sb ol::-webkit-scrollbar{display:none;}
.sb li{display:grid;grid-template-columns:var(--gc);gap:0 6px;align-items:center;min-height:clamp(22px,9cqi,28px);font-size:var(--fs,11px);color:var(--rc);}
.sb li .sc{text-align:right;}
.sb .cols .sc{text-align:center;}
.sb li .nm{letter-spacing:.12em;white-space:nowrap;}
.sb li .nm,.sb .cols .nm{padding-left:.55em;}
.sb li .dt,.sb .cols .dt{font-size:.6em;text-align:right;white-space:nowrap;opacity:.7;}
.sb li .wh{display:flex;justify-content:flex-end;}
.sb li .wh canvas{width:20px;height:20px;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 0 3px var(--rc));}
.sb li.me{--rc:#ffe14d !important;}
.sb li.top .rk,.sb li.top .sc,.sb li.top .nm{animation:rainbow 2.4s steps(6) infinite;}
@keyframes rainbow{0%{color:#ff4040}17%{color:#ffb040}33%{color:#ffff40}50%{color:#40ff60}67%{color:#40d0ff}83%{color:#d070ff}}
.sb li.me .nm::after{content:"";}
.sb .em{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:0 16px 30px;}
.sb .em b{font-weight:400;font-size:clamp(10px,5cqi,14px);color:var(--hc);line-height:1.8;}
.sb .blink{animation:blink 1.1s steps(1) infinite;font-size:clamp(.6rem,2.8vw,.75rem);color:#fff;}
@keyframes blink{50%{opacity:0}}
.sb .ft{flex:none;padding:2px 0 10px;text-align:center;font-size:.46rem;color:var(--lc);opacity:.7;text-shadow:none;pointer-events:none;}

/* control bar: what you can do here, in plain words, in the cabinet's style */
.cp{position:relative;flex:none;display:flex;align-items:center;gap:10px;margin:12px -14px 0;padding:12px 14px calc(12px + 2px);
  background:linear-gradient(180deg,var(--pn2),var(--pn));border-top:3px solid var(--trim);border-radius:0 0 6px 6px;box-shadow:inset 0 8px 14px -8px var(--w16);}
.go{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 16px;border:0;border-radius:12px;cursor:pointer;
  font-family:"Press Start 2P",monospace;font-size:.62rem;letter-spacing:.04em;color:var(--bink);background:var(--bcol);
  box-shadow:0 4px 0 color-mix(in srgb,var(--bcol) 55%,#000),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .06s,box-shadow .06s,filter .15s;}
.go span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.go .ico{flex:none;width:14px;height:14px;fill:currentColor;stroke:none;}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--bcol) 55%,#000);}
.go:hover{filter:brightness(1.06);}
.modes{flex:none;display:none;padding:4px;gap:4px;border-radius:12px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px var(--w08);}
.modes.on{display:flex;}
.modes button{min-height:40px;padding:0 10px;border:0;border-radius:9px;background:none;cursor:pointer;font-family:"Press Start 2P",monospace;font-size:.5rem;color:rgba(255,255,255,.6);}
.modes button.on{background:var(--bcol);color:var(--bink);}
.modes.cyc{align-items:center;}
.modes.cyc button{padding:0;width:34px;}
.modes.cyc button .ico{width:16px;height:16px;stroke-width:3;}
.modes.cyc b{min-width:62px;text-align:center;font-family:"Press Start 2P",monospace;font-size:.5rem;font-weight:400;color:var(--bcol);}

/* game select: lit plastic buttons mounted down the left of the bezel, like a multi-game cabinet */
.sel{position:relative;z-index:1;flex:none;width:86px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;scrollbar-width:none;padding-bottom:4px;}
.sel::-webkit-scrollbar{display:none;}
.selw{position:relative;flex:none;display:flex;flex-direction:column;min-height:0;}
.selw > .sel{flex:1 1 auto;min-height:0;overscroll-behavior:contain;}
.sel.lock{overflow-y:hidden;touch-action:none;}
.selw.dn > .sel{-webkit-mask-image:linear-gradient(#000 calc(100% - 34px),transparent);mask-image:linear-gradient(#000 calc(100% - 34px),transparent);}
.selw.up > .sel{-webkit-mask-image:linear-gradient(transparent,#000 34px);mask-image:linear-gradient(transparent,#000 34px);}
.selw.up.dn > .sel{-webkit-mask-image:linear-gradient(transparent,#000 34px,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(transparent,#000 34px,#000 calc(100% - 34px),transparent);}
.sel-more{position:absolute;left:50%;z-index:2;width:30px;height:22px;margin-left:-15px;display:none;place-items:center;padding:0;border:0;border-radius:99px;
  background:rgba(10,8,20,.82);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.6);animation:selNudge 1.4s ease-in-out infinite;}
.sel-more svg{width:16px;height:16px;stroke-width:3;}
.sel-more.dn{bottom:2px;}
.sel-more.up{top:0;}
.sel-more.up svg{transform:rotate(180deg);}
.selw.dn > .sel-more.dn,.selw.up > .sel-more.up{display:grid;}
@keyframes selNudge{50%{transform:translateY(2px)}}
.sel-b.hide{display:none;}
.sel-b .pzb{flex:none;height:17px;width:17px;display:block;}
.sel-b .pzb svg{width:100%;height:100%;display:block;}
.sel-b{position:relative;flex:none;aspect-ratio:2.5/1;display:flex;align-items:center;justify-content:center;padding:2px 3px;border:0;border-radius:2px;cursor:pointer;
  background:var(--bc);color:var(--bk);filter:saturate(.75) brightness(.72);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25),0 3px 0 color-mix(in srgb,var(--bc) 40%,#000);transition:transform .06s,box-shadow .06s,filter .2s;}
.sel-b{gap:4px;}
.sel-b canvas{flex:none;height:17px;width:auto;image-rendering:pixelated;image-rendering:crisp-edges;}
.sel-b.on canvas{animation:hop .9s steps(2) infinite;}
@keyframes hop{50%{transform:translateY(-2px)}}
.sel-b span{font-family:'Sofia Sans Condensed',var(--font);font-weight:900;font-size:.7rem;line-height:1;letter-spacing:.03em;white-space:nowrap;min-width:0;overflow:hidden;}
.sel-b.on{filter:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.2),0 3px 0 color-mix(in srgb,var(--bc) 40%,#000),0 0 0 2px #fff,0 0 16px -2px var(--bc);}
.sel-b:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 1px 0 color-mix(in srgb,var(--bc) 40%,#000);}
@media (min-width:600px){.sel{width:116px;gap:9px;}.sel-b span{font-size:.86rem;}.sel-b canvas{height:22px;}.sel-b .pzb{height:22px;width:22px;}}
@media (prefers-reduced-motion:reduce){.sb,.mq,.mq::before,.sb li.top .rk,.sb li.top .sc,.sb li.top .nm{animation:none;}}
</style>
</head>

            live.forEach(function (v) { var p = pos(v); for (var k = 0; k < 6; k++) chew(p.x + irnd(-5, 5), p.y + k, 1); });
            var low = Math.max.apply(null, live.map(function (v) { return pos(v).y; }));
            if (low + 6 >= CY) { pp.add('INVADED', W / 2, H * 0.45, '#ff4a4a'); sp.burst(cannonX, CY, 24, ['#2fd35a', '#fff'], 50); landed = 2; return; }
          }
          // bombs from the bottom invader of a random column
          bombT -= dt;
          if (bombT <= 0 && bombs.length < 3) {
            bombT = rnd(0.5, 1.4);
            var cols = {}; live.forEach(function (v) { if (!cols[v.c] || v.r < cols[v.c].r) cols[v.c] = v; });
            var ks = Object.keys(cols), b = cols[ks[irnd(0, ks.length - 1)]], p = pos(b); bombs.push({ x: p.x, y: p.y + 6, k: irnd(0, 1) });
          }
          bombs.forEach(function (b) { b.y += 50 * dt; });
          bombs = bombs.filter(function (b) {
            if (chew(b.x, b.y + 3, 6)) return false;
            if (!dead && b.y + 3 >= CY && b.y < CY + 7 && Math.abs(b.x - cannonX) < 6) { dead = 1.2; sp.burst(cannonX, CY + 3, 22, ['#2fd35a', '#fff', '#a3ffbf'], 45); return false; }
            if (b.y >= GY - 2) { sp.burst(b.x, GY - 1, 3, ['#fff']); return false; }
            return true;
          });
          if (!ufo && (ufoT -= dt) <= 0) { var d = Math.random() < 0.5 ? 1 : -1; ufo = { x: d > 0 ? -10 : W + 10, v: 28 * d }; }
          if (ufo) { ufo.x += ufo.v * dt; if (ufo.x < -14 || ufo.x > W + 14) { ufo = null; ufoT = rnd(9, 14); } }
          // the cannon: lines up under the lowest invader it can reach, or the saucer, and fires
          if (dead > 0) { dead -= dt; if (dead <= 0) cannonX = W / 2; }
          else {
            var tx = cannonX;
            if (ufo && ufo.x > 10 && ufo.x < W - 10) tx = ufo.x + ufo.v * (CY - 12) / 220;
            else { var tgt = null; live.forEach(function (v) { var q = pos(v); if (!tgt || q.y > tgt.y + 1 || (Math.abs(q.y - tgt.y) <= 1 && Math.abs(q.x - cannonX) < Math.abs(tgt.x - cannonX))) tgt = q; }); if (tgt) tx = tgt.x + dir * (2 / (0.05 + 0.5 * live.length / 55)) * (CY - tgt.y) / 220; }   // aim ahead of the march
            if (bombs.some(function (b) { return b.y > CY - 30 && Math.abs(b.x - cannonX) < 6; })) tx = cannonX + (cannonX < W / 2 ? 14 : -14);   // dodge
            cannonX += Math.max(-60 * dt, Math.min(60 * dt, tx - cannonX)); cannonX = Math.max(8, Math.min(W - 8, cannonX));
            if (!shot && fireT <= 0 && Math.abs(tx - cannonX) < 4) { shot = { x: Math.round(cannonX), y: CY - 2 }; fireT = 0.15; }
          }

            // move in small steps so a fast shot can't skip past a shield or an invader

              else live.some(function (v) { var q = pos(v); if (Math.abs(q.x - shot.x) <= 5 && shot.y >= q.y && shot.y <= q.y + 6) { v.on = false; hit = true; var t2 = v.r < 2 ? 0 : v.r < 4 ? 1 : 2; score += [10, 20, 30][t2]; sp.burst(q.x, q.y + 3, 10, ['#fff', '#ddd'], 40); return true; } return false; });
            }
            if (!hit && ufo && Math.abs(ufo.x - shot.x) < 7 && shot.y < 16 && shot.y > 6) { var pts = [50, 100, 150, 300][irnd(0, 3)]; score += pts; pp.add(String(pts), ufo.x, 8, '#ff4040'); sp.burst(ufo.x, 12, 18, ['#ff4040', '#fff'], 50); ufo = null; ufoT = rnd(9, 14); hit = true; }
            if (hit || shot.y < 0) shot = null;
          }
        },
        draw: function (g) {
          txt(g, 'SCORE ' + score, 4, 2, '#fff', 'left'); txt(g, 'W' + wave, W - 4, 2, '#fff', 'right');
          if (ufo) saucer(g, ufo.x, 10, t);
          rack.forEach(function (v) { if (!v.on) return; var p = pos(v), ty = v.r < 2 ? 0 : v.r < 4 ? 1 : 2; alien(g, p.x, p.y, ty, fr, p.y > SHY - 8 ? '#2fd35a' : '#f2f2f2'); });
          shields.forEach(function (s) { g.fillStyle = '#2fd35a'; for (var i = 0; i < 128; i++) if (s.px[i]) g.fillRect(s.x + (i % 16), SHY + Math.floor(i / 16), 1, 1); });
          bombs.forEach(function (b) { var z = Math.floor(t * 12) % 2; R(g, b.x + (b.k ? (z ? 1 : -1) : 0), b.y, 1, 2, '#fff'); R(g, b.x + (b.k ? (z ? -1 : 1) : 0), b.y + 2, 1, 2, '#fff'); if (!b.k) R(g, b.x - 1, b.y + 1 + z * 2, 3, 1, '#fff'); });

          R(g, 0, GY, W, 1, '#2fd35a');
          sp.draw(g); pp.draw(g);
        }
      };
    },

    // Puzzle boards: a quiet grid of tiles, a few glowing up and fading in the game's colours
    puzzle: function (W, H, b) {
      var S = 10, C = Math.ceil(W / S), RW = Math.ceil(H / S), lit = [], cols = [b.c.glow, b.c.hc, b.c.trim];
      return {
        step: function (dt) {
          lit.forEach(function (l) { l.t += dt; });
          lit = lit.filter(function (l) { return l.t < l.life; });
          if (lit.length < C * RW / 10 && Math.random() < dt * 8) lit.push({ x: irnd(0, C - 1), y: irnd(0, RW - 1), t: 0, life: rnd(1.6, 3.6), c: cols[irnd(0, cols.length - 1)] });
        },
        draw: function (g) {

          g.globalAlpha = 1;
        }
      };
    }
  };

  // Marquee sprites, one each side of the title
  var MQ = {
    puzzle: function () {},   // puzzle boards show the game's icon instead (see theme)
    tetris: function (g, t, side) { var sh = side ? [[0, 0], [1, 0], [2, 0], [1, 1]] : [[1, 0], [2, 0], [0, 1], [1, 1]], c = side ? '#b14dff' : '#3dff6a', k = Math.floor(t / 1.2) % 4;
      sh.forEach(function (p) { var x = p[0], y = p[1]; for (var i = 0; i < k; i++) { var nx = 1 - y + 1; y = x; x = nx; } block(g, 4 + x * 5, 3 + y * 5, 5, c); }); },
    snake: function (g, t, side) { if (side) { R(g, 8, 6, 8, 8, '#ef4444'); R(g, 11, 3, 2, 3, '#22c55e'); R(g, 10, 7, 2, 2, '#fca5a5'); return; } for (var i = 0; i < 6; i++) R(g, 2 + i * 3, 8 + Math.round(Math.sin(t * 6 + i) * 2), 3, 3, i ? '#9bbc0f' : '#c5f07a'); },
    pacman: function (g, t, side) { if (side) ghost(g, 8, 5, '#ff3b3b', Math.floor(t * 5) % 2, Math.floor(t / 2) % 3 === 2, false); else pac(g, 12, 9, 6, 0, Math.abs(Math.sin(t * 8)) * 0.6); },
    breakout: function (g, t, side) { if (side) { ['#f43f5e', '#fb923c', '#facc15'].forEach(function (c, r) { R(g, 2, 3 + r * 4, 9, 3, c); R(g, 12, 3 + r * 4, 9, 3, c); }); return; } var y = 4 + Math.abs(Math.sin(t * 3)) * 8; R(g, 11, 14 - y + 2, 2, 2, '#fff'); R(g, 6, 15, 12, 2, '#e5e7eb'); },
    flappy: function (g, t, side, b) { if (side) { var c = b.wild ? '#f0abfc' : '#4ade80'; R(g, 8, 0, 8, 6, c); R(g, 6, 5, 12, 3, c); R(g, 6, 12, 12, 3, c); R(g, 8, 14, 8, 4, c); return; } bird(g, 8, 6 + Math.round(Math.sin(t * 5) * 2), Math.floor(t * 8) % 2, b.wild ? '#fb7185' : '#facc15'); },
    asteroids: function (g, t, side) { g.strokeStyle = '#fff'; g.lineWidth = 1; g.beginPath();
      if (side) { for (var i = 0; i < 9; i++) { var a = t * 0.8 + i / 9 * TAU, r = [7, 6, 8, 5, 7, 8, 6, 7, 5][i]; g[i ? 'lineTo' : 'moveTo'](12 + Math.cos(a) * r, 9 + Math.sin(a) * r); } g.closePath(); g.stroke(); return; }
      var a = -Math.PI / 2 + Math.sin(t) * 0.5; g.moveTo(12 + Math.cos(a) * 7, 9 + Math.sin(a) * 7); g.lineTo(12 + Math.cos(a + 2.5) * 6, 9 + Math.sin(a + 2.5) * 6); g.lineTo(12 + Math.cos(a - 2.5) * 6, 9 + Math.sin(a - 2.5) * 6); g.closePath(); g.stroke(); },
    peggle: function (g, t, side) { if (side) { var on = Math.floor(t * 2) % 2; R(g, 9, 5, 6, 8, on ? '#fdba74' : '#ea580c'); R(g, 8, 6, 8, 6, on ? '#fdba74' : '#ea580c'); return; } var y = (t * 14) % 22 - 3; R(g, 10, y, 4, 4, '#e5e7eb'); R(g, 4, 14, 4, 3, '#2563eb'); R(g, 16, 14, 4, 3, '#2563eb'); },
    qbert: function (g, t, side) { if (side) { cubeAt(g, 12, 2, Math.floor(t) % 2 ? '#facc15' : '#4f6bd8', 7); return; } hopper(g, 12, 15 - Math.round(Math.abs(Math.sin(t * 4)) * 4), 1); },
    pinball: function (g, t, side, b) {
      if (side) { var on = Math.floor(t * 3) % 2, c = b && b.c ? b.c.glow : '#f0f'; g.fillStyle = on ? c : '#333'; g.beginPath(); g.arc(12, 9, 7, 0, TAU); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(12, 9, 3, 0, TAU); g.fill(); return; }
      var a = Math.sin(t * 5) > 0.6 ? -0.5 : 0.35; g.save(); g.translate(5, 14); g.rotate(a); R(g, 0, -1, 13, 3, '#ff3b3b'); g.restore();
      var by = 3 + Math.abs(Math.sin(t * 2.5)) * 6; g.fillStyle = '#d7dde8'; g.beginPath(); g.arc(14, by, 3, 0, TAU); g.fill(); R(g, 13, by - 2, 1, 1, '#fff');
    },
    crossy: function (g, t, side) {

      }
      R(g, 0, 15, 24, 3, '#78c846'); chicken(g, 12, 5 - Math.round(Math.abs(Math.sin(t * 4)) * 4));
    },
    willy: function (g, t, side) {

        R(g, 12, 15, 12, 3, '#4a1f66'); R(g, 14, 14, 8, 1, '#e5263f'); R(g, 16, 14, 4, 1, '#ffd84a');
        if (ph < 0.6) { var p = ph / 0.6; daredevil(g, p * 18, 15 - Math.sin(p * Math.PI) * 9 + p * -1, Math.floor(t * 8) % 2); } else daredevil(g, 18, 14, 3);
        return;
      }

      if (ph < 0.15) { g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(19, 6, 3 + ph * 20, 0, TAU); g.fill(); R(g, 18, 5, 2, 2, '#ffd84a'); }
    },
    tower: function (g, t, side) {
      if (side) {   // a slice breaking off and falling

    },
    pong: function (g, t, side) { var y = 9 + Math.sin(t * 2.2) * 5; if (side) { R(g, 18, y - 4, 2, 8, '#fff'); R(g, 6 + Math.abs(Math.sin(t * 2.2)) * 8, 8, 2, 2, '#fff'); } else { var bx = 6 + Math.abs(((t * 9) % 22) - 11); R(g, 2, 9 - Math.sin(t * 2.2) * 3 - 4, 2, 8, '#fff'); R(g, 20, 9 + Math.sin(t * 2.2) * 3 - 4, 2, 8, '#fff'); R(g, bx, 8 + Math.round(Math.sin(t * 3) * 3), 2, 2, '#fff'); } }
  };

  // ── One loop for the screen and the marquee: 30 frames a second, paused when hidden ──
  var gB = bg.getContext('2d'), gL = mqL.getContext('2d'), gR = mqR.getContext('2d'), last = 0, acc = 0, tt = 0, idleT = 0, raf = 0;
  function drawFrame(dt, t) {
    if (!anim) return;
    if (dt) anim.step(Math.min(dt, 0.05));
    gB.setTransform(1, 0, 0, 1, 0, 0); gB.clearRect(0, 0, bg.width, bg.height); gB.imageSmoothingEnabled = false;
    anim.draw(gB);
    var b = BOARDS[cur];
    [gL, gR].forEach(function (g, side) { g.clearRect(0, 0, 24, 18); if (mqAnim) mqAnim(g, t, side, b); });
  }
  function loop(now) {
    raf = requestAnimationFrame(loop);
    if (!last) last = now;
    var dt = (now - last) / 1000; last = now; acc += dt;
    if (acc < 1 / 30) return;
    var step = acc; acc = 0; tt += step;
    drawFrame(step, tt);
    // attract mode: left alone for a while at the top of a board, the cabinet moves on to the next game
    idleT += step;

  }
  function run() { cancelAnimationFrame(raf); last = 0; if (!REDUCED && document.visibilityState === 'visible') raf = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', run);
  ['pointerdown', 'keydown', 'wheel'].forEach(function (ev) { document.addEventListener(ev, function () { idleT = 0; }, { passive: true }); });
  sb.addEventListener('scroll', function () { idleT = 0; }, true);

  function refresh() { var b = BOARDS[cur]; paintScores(b); }
  window.addEventListener('storage', function (e) { if (e.key && (e.key.indexOf('hi_') === 0 || e.key === 'fgh_link_hi')) refresh(); });
  window.addEventListener('fghlinks', refresh);
  if (window.FGHSync && FGHSync.onReady) FGHSync.onReady(refresh);
  var rzT = 0; window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(function () { startArt(BOARDS[cur]); paintScores(BOARDS[cur]); }, 200); });

  var go = function () { show(cur, 0); run(); };
  window.addEventListener('hashchange', function () { var w = location.hash.slice(1); BOARDS.forEach(function (b, i) { if (w && (b.key === w || b.game === w) && i !== cur) show(i, i > cur ? 1 : -1); }); });
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('8px "Press Start 2P"'), document.fonts.load('20px "Bungee"')]).then(go, go); else go();
})();

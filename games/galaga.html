<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaga</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<script src="galaga-data.js"></script>
<script src="galaga-core.js"></script>
<style>
/* ── Arcade page shell: fills the screen, never scrolls ─────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 45% at 50% 0%, rgba(80,120,255,.12) 0%, rgba(80,120,255,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;padding:0 8px calc(var(--safe-b) + 8px);display:flex;}
.gg-view{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:none;}
.gg-view[hidden]{display:none;}
/* the cabinet's own score line is on the screen, so only the pause button sits above it */
.hud{flex:none;display:flex;align-items:stretch;justify-content:flex-end;gap:6px;width:100%;}
.pbtn{flex:none;width:48px;height:40px;border:0;border-radius:14px;display:grid;place-items:center;color:#cfe0ff;
  background:linear-gradient(180deg,#161a36,#0b0d20);box-shadow:inset 0 0 0 1.5px rgba(120,160,255,.3),0 6px 14px rgba(0,0,0,.35);}
.pbtn:active{transform:scale(.94);}
.pbtn svg{width:22px;height:22px;}
/* Cabinet: a bezel round a dark glass screen */
.cab{flex:none;width:100%;display:flex;align-items:center;justify-content:center;}
.bezel{position:relative;padding:7px;border-radius:20px;}
.scr{position:relative;border-radius:13px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 2px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);}
.scr canvas{display:block;touch-action:none;image-rendering:pixelated;}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),
    radial-gradient(120% 100% at 50% 50%,transparent 62%,rgba(0,0,0,.45) 100%);}
/* Overlay cards inside the screen */
.ov{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(2,4,14,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
.ov[hidden]{display:none;}
.ov .card{width:100%;max-width:300px;text-align:center;animation:pop .35s var(--spring);}
.ov h2{font-family:var(--display);font-weight:400;font-size:2.3rem;line-height:1;color:#7fb0ff;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 22px rgba(80,140,255,.4);}
.ov .sub{color:var(--text-2);font-weight:700;font-size:.92rem;margin:6px 0 12px;line-height:1.35;}
.ov .btn-lg{width:100%;}
.ov .row2{display:flex;gap:8px;margin-top:10px;}
.ov .row2 .btn{flex:1;min-height:42px;padding:0 10px;font-size:.9rem;}
/* Controls: a 2-way stick on the left, the fire button on the right, as on the cabinet */
.ctrls{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 6px;}
.pad{position:relative;width:170px;height:170px;border-radius:50%;touch-action:none;-webkit-user-select:none;user-select:none;flex:none;
  background:radial-gradient(circle at 50% 40%,#262c55 0%,#161a36 60%,#0b0d20 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.1),inset 0 -6px 14px rgba(0,0,0,.45),0 0 0 6px rgba(0,0,0,.25),0 14px 28px rgba(0,0,0,.45);}
.pad i{position:absolute;width:52px;height:52px;display:grid;place-items:center;color:rgba(190,210,255,.5);transition:color .1s,transform .1s;}
.pad i svg{width:30px;height:30px;}
.pad i.l{left:6px;top:59px;} .pad i.r{right:6px;top:59px;}
.pad i.on{color:#9cc0ff;transform:scale(1.15);filter:drop-shadow(0 0 8px rgba(90,150,255,.8));}
.pad::before{content:"";position:absolute;left:24%;right:24%;top:50%;height:10px;margin-top:-5px;border-radius:5px;background:rgba(0,0,0,.35);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);}
.pad .nub{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#ff9a8a,#e0302a 55%,#8a1010);box-shadow:0 4px 0 #5a0808,0 8px 16px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.55);
  transition:transform .08s;}
.fbtn{flex:none;width:118px;height:118px;border-radius:50%;border:0;touch-action:none;-webkit-user-select:none;user-select:none;
  font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.06em;color:#eef4ff;text-shadow:0 2px 0 rgba(0,0,0,.4);
  background:radial-gradient(circle at 42% 34%,#8fb4ff,#2f62e8 55%,#16308a);box-shadow:0 7px 0 #0e1f5a,0 12px 22px rgba(0,0,0,.5),inset 0 3px 0 rgba(255,255,255,.5);
  transition:transform .06s,box-shadow .06s;}
.fbtn.start{background:radial-gradient(circle at 42% 34%,#ffd98a,#e8a12f 55%,#8a5a10);box-shadow:0 7px 0 #5a3a08,0 12px 22px rgba(0,0,0,.5),inset 0 3px 0 rgba(255,255,255,.5);animation:ggpulse 1.1s ease-in-out infinite;}
@keyframes ggpulse{50%{filter:brightness(1.25);}}
.fbtn.down{transform:translateY(5px);box-shadow:0 2px 0 #0e1f5a,0 6px 12px rgba(0,0,0,.5),inset 0 3px 0 rgba(255,255,255,.4);}
.hint{flex:none;font-size:.82rem;font-weight:700;color:var(--text-3);text-align:center;}
@media (hover:hover) and (pointer:fine){ .ctrls{display:none;} }
@media (hover:none),(pointer:coarse){ .hint{display:none;} }
@media (max-height:720px){ .pad{width:140px;height:140px;} .pad i{width:44px;height:44px;} .pad i.l{left:3px;top:48px;} .pad i.r{right:3px;top:48px;}
  .pad .nub{width:48px;height:48px;margin:-24px 0 0 -24px;} .fbtn{width:96px;height:96px;font-size:1.1rem;} }
/* Tablet landscape: the screen takes the full height, the stick bottom-left and the button bottom-right, under the thumbs */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px) and (pointer:coarse){
  html.ar-on #app{max-width:none;position:relative;}
  .ctrls{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 22px);padding:0 26px;pointer-events:none;}
  .ctrls > *{pointer-events:auto;}
  .pad{width:200px;height:200px;} .pad i{width:60px;height:60px;} .pad i.l{left:8px;top:70px;} .pad i.r{right:8px;top:70px;}
  .pad .nub{width:68px;height:68px;margin:-34px 0 0 -34px;} .fbtn{width:140px;height:140px;font-size:1.6rem;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<div class="gg-view" id="view" hidden>
  <div class="hud"><button class="pbtn" id="btn-pause" type="button" aria-label="Pause"></button></div>
  <div class="cab" id="cab">
    <div class="bezel wood" id="bezel">
      <div class="scr" id="scr">
        <canvas id="cv" aria-label="Galaga screen"></canvas>
        <div class="ov" id="ov" hidden><div class="card" id="ov-card"></div></div>
      </div>
    </div>
  </div>
  <div class="ctrls">
    <div class="pad" id="pad" aria-label="Joystick">
      <i class="l"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 12 16 4v16z"/></svg></i>
      <i class="r"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 12 8 4v16z"/></svg></i>
      <span class="nub" id="nub"></span>
    </div>
    <button class="fbtn" id="fbtn" type="button" aria-label="Fire">FIRE</button>
  </div>
  <div class="hint" id="hint">Arrow keys or A / D to move · Space to fire · P to pause</div>
</div>
<script>
(function () {
  'use strict';
  // The arcade game itself runs in galaga-core.js (Namco's program for its two game CPUs, ported to JavaScript) and
  // is drawn by its video hardware model from the ROM graphics in galaga-data.js. This page is the cabinet round it:
  // coin and start, the stick and button, pause and resume, and the family's high scores.
  var KEY = 'galaga', HI = 'galaga', SAVE = 'galaga_state', RAPIDK = 'galaga_rapid';
  var TOUCH = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var W = 224, H = 288;                     // the upright arcade screen, in its own pixels
  var C = window.GGCore, M = C.M, V = window.GGVideo.create(window.GG_DATA);
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ═══ Reading the arcade's RAM ═══════════════════════════════════════════
  // the score is kept as tiles on the screen, ones first
  function score() { var v = 0, m = 1; for (var a = 0x83F8; a <= 0x83FE; a++, m *= 10) { var t = M[a]; if (t < 10) v += t * m; } return v; }
  function setScore(v) { for (var a = 0x83F8, k = 0; a <= 0x83FE; a++, k++) { var d = Math.floor(v / Math.pow(10, k)) % 10; M[a] = (d || v >= Math.pow(10, k) || k < 2) ? d : 0x24; } }
  function rd16(a) { return M[a] | M[a + 1] << 8; }
  function stage() { return M[0x9821]; }
  function hits() { return rd16(0x9844); }
  function shots() { return rd16(0x9846); }
  function ratio() { var s = shots(); return s ? Math.round(hits() / s * 1000) / 10 : 0; }
  // 0 power on, 1 attract, 2 credit in, 3 a game
  function inGame() { return C.state() === 3; }

  // ═══ The cabinet ════════════════════════════════════════════════════════
  // mode: 'idle' (no cabinet), 'attract' (the arcade's own title and demo, waiting for START), 'play'
  var mode = 'idle', cfg0 = null, paused = false, welcome = false, resumeData = null, coinT = 0, lastStage = 0;
  var startedAt = 0, best0 = 0, overPending = false;
  function heroes() {
    var b = (ArcadeHi.board ? ArcadeHi.board(HI) : ArcadeHi.list(HI)) || [];
    C.setBest5(b.slice(0, 5).map(function (e) { return { score: e.score, ini: String(e.name || '').toUpperCase().slice(0, 3) }; }));
    best0 = b.length ? b[0].score : 0;
    C.setHighScore(Math.max(20000, best0));
  }
  C.hooks.newGame = function () {             // the arcade has just set up a new player: carry on a saved game instead
    var s = resumeData; resumeData = null;
    startedAt = Date.now();
    if (!s) return;
    M[0x9821] = s.stage - 1;                  // the stage counter (the next stage screen adds one)
    M[0x9820] = s.ships; M[0x983E] = s.bonus;
    setScore(s.score);
    M[0x9844] = s.hits & 0xFF; M[0x9845] = s.hits >> 8; M[0x9846] = s.shots & 0xFF; M[0x9847] = s.shots >> 8;
    startedAt = s.started || startedAt;
  };
  C.hooks.gameOver = function () { overPending = true; };
  C.hooks.extra = function () { Kit.haptic('success'); };

  function startCab(cfg, saved) {
    cfg0 = cfg; paused = false; welcome = false; overPending = false;
    C.reset({ lives: cfg.lives || 3 });
    heroes();
    buildView();
    Snd.unlock();
    Kit.gameStart && Kit.gameStart();
    if (saved) { resumeData = saved; insertCoin(true); welcome = true; paused = true; }
    else mode = 'attract';
    syncOverlay(); syncButton(); kick();
  }
  // a coin in the slot, and START pressed a moment later, as on the cabinet
  function insertCoin(now) {
    if (mode === 'play') return;
    mode = 'play'; lastStage = 0;
    C.coin(); coinT = now ? 3 : 40;
    syncButton(); syncOverlay();
  }
  function syncButton() {
    var b = $('fbtn'); if (!b) return;
    var start = mode === 'attract';
    b.classList.toggle('start', start); b.textContent = start ? 'START' : 'FIRE';
    var h = $('hint'); if (h) h.textContent = start ? 'Press Space to start' : 'Arrow keys or A / D to move · Space to fire · P to pause';
  }

  // one arcade frame (60.6 a second)
  var fireQ = 0, hold = false, RAPID = lsGet(RAPIDK, '0') === '1', rf = 0;
  function tick() {
    if (coinT && !--coinT) C.start();
    var fire = false;
    if (fireQ) { fire = true; fireQ = 0; }
    else if (RAPID && hold && inGame()) { rf = (rf + 1) & 7; fire = rf < 4; }
    C.setInput(ctl.l, ctl.r, fire);
    C.frame();
    V.draw(M, C.starCtrl(), C.starClr());
    Snd.frame(C);
    if (mode === 'play' && inGame()) {
      var st = stage();
      if (st !== lastStage && st > 0) { lastStage = st; if (lastStage > 0) save(); }
    }
    if (overPending) { overPending = false; finishGame(); }
  }

  // ═══ Game over: history, high scores ════════════════════════════════════
  function finishGame() {
    var sc = score(), st = stage(), who = (cfg0 && cfg0.who) || 'Player', lives = (cfg0 && cfg0.lives) || 3;
    clearSave();
    mode = 'attract'; syncButton(); syncOverlay();
    var newTop = sc > 0 && sc > best0;
    var hl = ['Reached stage ' + st];
    if (newTop) hl.push('New high score: ' + sc.toLocaleString() + (best0 ? ' (old best ' + best0.toLocaleString() + ')' : ''));
    hl.push('Hit-miss ratio ' + ratio() + '% (' + hits() + ' hits from ' + shots() + ' shots)');
    var hiL = ArcadeHi.list(HI);
    try {
      Kit.record(KEY, {
        detail: { st: st, sh: shots(), hi: hits(), rt: ratio(), lvs: lives, hb: best0 || 0,
          hr: sc > 0 && (hiL.length < ArcadeHi.max || sc > hiL[hiL.length - 1].score) ? hiL.filter(function (x) { return x.score >= sc; }).length + 1 : 0 },
        started: startedAt || Date.now(), mode: lives !== 3 ? lives + ' lives' : '',
        players: [{ name: who, score: sc }], winner: null,
        highlights: hl,
        summary: sc.toLocaleString() + ' points · stage ' + st, badge: 'Stage ' + st,
        meta: { score: sc, stage: st, ratio: ratio() }
      });
    } catch (e) {}
    ArcadeHi.check(HI, sc, function () {
      heroes();                               // the new name goes up on THE GALACTIC HEROES
      Kit.win({
        lose: !newTop, icon: newTop ? 'trophy' : 'meh',
        title: newTop ? 'New high score!' : 'Game over',
        sub: sc.toLocaleString() + ' points · reached stage ' + st,
        again: function () { insertCoin(); }, againLabel: 'Play again',
        extra: [{ label: 'High scores', onClick: function () { ArcadeHi.show(HI, 'Galaga'); } }, { label: 'Change settings', onClick: showSetup }]
      });
    }, { who: who });
  }

  // ═══ Save and resume: a checkpoint at the start of each stage ═══════════
  function save() {
    if (mode !== 'play' || !inGame() || stage() < 1) return;
    var s = { v: 2, who: cfg0.who, startLives: cfg0.lives, stage: stage(), ships: M[0x9820], bonus: M[0x983E], score: score(), hits: hits(), shots: shots(), started: startedAt };
    try { localStorage.setItem(SAVE, JSON.stringify(s)); } catch (e) {}
    Kit.resume.set('Stage ' + s.stage + ' · ' + s.score.toLocaleString() + ' pts');
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function loadSave() { try { var s = JSON.parse(localStorage.getItem(SAVE)); return s && s.v === 2 && s.stage >= 1 ? s : null; } catch (e) { return null; } }

  // ═══ Sound: the arcade's own, from its sound CPU (in the core) through the wave chip and the 54xx's bang ═══
  var Snd = GGSound.create({ on: function () { return lsGet('gn_sound', '1') !== '0'; } });

  // ═══ Pause, overlay, setup ══════════════════════════════════════════════
  var PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>';
  var PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  function syncOverlay() {
    $('btn-pause').innerHTML = paused ? PLAY_SVG : PAUSE_SVG;
    $('btn-pause').style.visibility = mode === 'play' ? 'visible' : 'hidden';
    var ov = $('ov'), card = $('ov-card'), h = '';
    if (paused && mode === 'play') {
      var sv = loadSave(), st = inGame() ? stage() : sv ? sv.stage : 1, sc = inGame() ? score() : sv ? sv.score : 0;
      h = '<h2>' + (welcome ? 'Welcome back' : 'Paused') + '</h2><div class="sub">Stage ' + st + ' · ' + sc.toLocaleString() + ' points</div>' +
        '<button class="btn btn-primary btn-lg" id="ov-resume" type="button">' + Kit.icon('play') + (welcome ? 'Continue' : 'Resume') + '</button>' +
        '<div class="row2"><button class="btn btn-soft" id="ov-quit" type="button">New game</button><button class="btn btn-soft" id="ov-rules" type="button">' + Kit.icon('book') + 'Rules</button></div>';
    }
    if (!h) { ov.hidden = true; return; }
    card.innerHTML = h; ov.hidden = false;
    bind('ov-resume', function () { setPaused(false); });
    bind('ov-quit', function () { Kit.confirm('Start a new game?', { ok: 'New game', body: 'This game will be lost.' }).then(function (ok) { if (ok) { clearSave(); showSetup(); } }); });
    bind('ov-rules', function () { Kit.rules(); });
  }
  function bind(id, fn) { var b = $(id); if (b) b.addEventListener('click', function (e) { e.stopPropagation(); Kit.sfx('tap'); fn(); }); }
  function showSetup() {
    leaveGame();
    Kit.setup($('app'), {
      intro: 'The 1981 arcade original: blast the swarm, dodge the tractor beam',
      options: [{ id: 'lives', label: 'Fighters', help: 'How many fighters you start with (the cabinet’s setting).',
        choices: [[3, '3 fighters', 'As the arcade is set from the factory.'], [5, '5 fighters', 'Two extra, good for learning the stages.']], value: 3 }],
      players: { min: 1, max: 1, count: 1, label: 'Player' },
      start: 'Play',
      onStart: function (cfg) { var o = cfg.options || {}; startCab({ who: (cfg.players[0] && cfg.players[0].name) || 'Player', lives: +o.lives || 3 }); }
    });
    window.scrollTo(0, 0);
  }
  function leaveGame() {
    Snd.stop(); paused = false; welcome = false; mode = 'idle'; coinT = 0;
    document.documentElement.classList.remove('ar-on');
    var v = $('view'); if (v.parentNode === $('app')) document.body.appendChild(v);
    v.hidden = true;
  }
  function buildView() {
    var app = $('app'), v = $('view');
    app.className = ''; app.innerHTML = '';
    document.documentElement.classList.add('ar-on');
    v.hidden = false; app.appendChild(v);
    fit();
  }
  function setPaused(v) {
    if (mode !== 'play' || paused === v) return;
    paused = v;
    if (v) { Snd.stop(); save(); ctl.l = ctl.r = false; hold = false; }
    else { welcome = false; Snd.unlock(); last = 0; acc = 0; kick(); }
    syncOverlay();
  }

  // ═══ Drawing and fitting the screen ═════════════════════════════════════
  var cv = $('cv'), ctx = cv.getContext('2d'), scr = document.createElement('canvas');
  scr.width = W; scr.height = H;
  var sx = scr.getContext('2d'), img = sx.createImageData(W, H), img32 = new Uint32Array(img.data.buffer);
  function render() {
    img32.set(V.px); sx.putImageData(img, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
    ctx.drawImage(scr, 0, 0, cv.width, cv.height);
  }
  function fit() {
    var v = $('view'); if (v.hidden) return;
    var hudH = v.querySelector('.hud').offsetHeight, ctr = v.querySelector('.ctrls'), hint = v.querySelector('.hint');
    var land = TOUCH && innerWidth > innerHeight && innerWidth >= 900;
    var ctrH = ctr && getComputedStyle(ctr).display !== 'none' && !land ? Math.max(150, ctr.querySelector('.pad').offsetHeight + 16) : 0;
    var hintH = hint && getComputedStyle(hint).display !== 'none' ? hint.offsetHeight + 8 : 0;
    var availH = v.clientHeight - hudH - ctrH - hintH - 30, availW = Math.min(v.clientWidth, 640) - 14;
    var sc = Math.max(1, Math.min(availW / W, availH / H));
    var cw = Math.floor(W * sc), ch = Math.floor(H * sc), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    render();
  }

  // ═══ Input ══════════════════════════════════════════════════════════════
  var ctl = { l: false, r: false };
  var keyDir = { l: false, r: false }, padDir = { l: false, r: false };
  function syncCtl() { ctl.l = keyDir.l || padDir.l; ctl.r = keyDir.r || padDir.r; }
  var KEYS = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
  function firePress() {
    Snd.unlock();
    if (paused) { setPaused(false); return; }
    if (mode === 'attract') { insertCoin(); Kit.haptic('light'); return; }
    fireQ = 1; hold = true;
  }
  function overlayUp() { return document.querySelector('.ahi-overlay, .k-scrim, .k-win'); }
  document.addEventListener('keydown', function (e) {
    if (mode === 'idle' || overlayUp()) return;
    if (KEYS[e.code]) { e.preventDefault(); keyDir[KEYS[e.code]] = true; syncCtl(); if (paused) setPaused(false); return; }
    if (e.code === 'KeyP' || e.code === 'Escape') { setPaused(!paused); return; }
    if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyX' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault(); if (e.repeat) return; firePress();
    }
  });
  document.addEventListener('keyup', function (e) {
    if (KEYS[e.code]) { keyDir[KEYS[e.code]] = false; syncCtl(); }
    if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyX' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'KeyW') hold = false;
  });
  var pad = $('pad'), nub = $('nub'), padId = null, padIs = pad.querySelectorAll('i');
  function padAt(e) {
    var r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), lim = r.width * .22;
    nub.style.transform = 'translateX(' + clamp(dx, -lim, lim) + 'px)';
    var was = padDir.l + ',' + padDir.r;
    padDir = { l: dx < -r.width * .08, r: dx > r.width * .08 };
    if (padDir.l + ',' + padDir.r !== was) Kit.haptic('tick');
    syncCtl(); padIs[0].classList.toggle('on', ctl.l); padIs[1].classList.toggle('on', ctl.r);
  }
  pad.addEventListener('pointerdown', function (e) { e.preventDefault(); Snd.unlock(); if (paused) setPaused(false); padId = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch (x) {} padAt(e); });
  pad.addEventListener('pointermove', function (e) { if (e.pointerId === padId) padAt(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { pad.addEventListener(t, function (e) { if (e.pointerId !== padId) return; padId = null; nub.style.transform = ''; padDir = { l: false, r: false }; syncCtl(); padIs[0].classList.remove('on'); padIs[1].classList.remove('on'); }); });
  var fb = $('fbtn');
  fb.addEventListener('pointerdown', function (e) { e.preventDefault(); fb.classList.add('down'); firePress(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { fb.addEventListener(t, function () { fb.classList.remove('down'); hold = false; }); });
  $('scr').addEventListener('pointerdown', function () { Snd.unlock(); if (mode === 'attract') insertCoin(); });
  $('view').addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  $('btn-pause').addEventListener('click', function () { Kit.sfx('tap'); setPaused(!paused); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { setPaused(true); save(); } else kick(); });
  document.addEventListener('kit:orient', function (e) { if (!e.detail.ok) { setPaused(true); save(); } });
  window.addEventListener('blur', function () { setPaused(true); });
  window.addEventListener('pagehide', save);

  // ═══ Main loop: the arcade's 60.6 frames a second ═══════════════════════
  var last = 0, acc = 0, DT = 1000 / 60.606, raf = 0;
  var frozen = false;
  function running() { return mode !== 'idle' && !paused && !frozen && !document.hidden; }
  function loop(t) {
    raf = 0;
    if (!last) last = t;
    acc += Math.min(100, t - last); last = t;
    var n = 0;
    while (acc >= DT) { acc -= DT; if (running()) { tick(); n++; } }
    if (n) render();
    if (running()) raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf && running()) { last = 0; acc = 0; raf = requestAnimationFrame(loop); } }

  // ═══ Kit shell ══════════════════════════════════════════════════════════
  Kit.init({ orient: 'portrait',
    id: 'galaga',
    theme: { wood: ['#1c2048', '#0a0c22'] },
    onNew: function () { clearSave(); showSetup(); },
    menu: [
      { icon: 'trophy', label: 'High scores', onClick: function () { setPaused(true); ArcadeHi.show(HI, 'Galaga'); } },
      { icon: 'history', label: 'Past games', onClick: function () { setPaused(true); Kit.history(KEY, { title: 'Galaga: past games' }); } },
      { icon: 'target', label: 'Rapid fire', sub: 'Hold FIRE to keep shooting', toggle: function () { return RAPID; }, onClick: function () { RAPID = !RAPID; lsSet(RAPIDK, RAPID ? '1' : '0'); } }
    ],
    rules:
      '<p class="goal">The 1981 arcade game, as it ran in the cabinet. The Galaga swarm flies in, settles into formation and dives at your fighter. Shoot them all down to clear the stage. How far can you get?</p>' +
      '<h3>Starting</h3><p>The cabinet shows its title and a demo game. Press <b>START</b> to drop in a coin and play.</p>' +
      '<h3>Flying and shooting</h3><ul><li>Move left and right with the <b>stick</b>; press <b>FIRE</b> to shoot. Only two shots can be in the air at once, so make them count.</li>' +
      '<li>On a computer: <b>arrow keys</b> or <b>A</b> / <b>D</b> to move, <b>Space</b> to fire, <b>P</b> to pause.</li>' +
      '<li><b>Rapid fire</b> in the menu lets you hold FIRE instead of tapping.</li></ul>' +
      '<h3>The swarm</h3><ul><li><b>Bees</b> (yellow and blue) and <b>butterflies</b> (red and white) fly in, take their places, then peel off to dive at you, shooting as they come.</li>' +
      '<li><b>Boss Galaga</b> (green) takes two hits: the first turns it blue. A boss often dives with two butterflies as escorts.</li>' +
      '<li>Touching anything that flies at you, or getting hit by a shot, costs a fighter.</li></ul>' +
      '<h3>The tractor beam</h3><ul><li>Sometimes a boss stops partway down and lowers a blue <b>tractor beam</b>. Get caught in it and your fighter is captured: it costs a fighter, and the boss carries it home.</li>' +
      '<li>To get it back, shoot that boss <b>while it is diving</b>. Your captured fighter comes down and joins yours as a <b>dual fighter</b>: two ships side by side, firing twice as many shots. Shoot the captured fighter itself and it’s gone for good.</li></ul>' +
      '<h3>Challenging stages</h3><p>Stage 3, then every fourth stage, is a <b>challenging stage</b>: 40 enemies fly past in five groups and never shoot. Each hit is worth 100 points at the end, and all 40 is a <b>Perfect</b> for 10,000.</p>' +
      '<h3>Points</h3><ul><li>Bee: <b>50</b> in formation, <b>100</b> diving. Butterfly: <b>80</b> / <b>160</b>.</li>' +
      '<li>Boss Galaga: <b>150</b> in formation, <b>400</b> diving, up to <b>1,600</b> with its escorts.</li>' +
      '<li>An extra fighter at <b>20,000</b> and <b>70,000</b> points, then every 70,000.</li></ul>' +
      '<h3>The end</h3><p>When your last fighter is gone, the results screen shows your shots fired, hits and hit-miss ratio. The best five scores are THE GALACTIC HEROES in the cabinet’s demo.</p>'
  });

  // Testing hooks
  window.__gg = {
    core: C, snd: function () { return Snd; }, mode: function () { return mode; }, score: score, stage: stage,
    step: function (n) { for (var i = 0; i < (n || 1); i++) tick(); render(); },
    start: function (cfg) { startCab(cfg || { who: 'Tim', lives: 3 }); },
    coin: function () { insertCoin(true); },
    fire: function () { fireQ = 1; }, move: function (l, r) { keyDir = { l: !!l, r: !!r }; syncCtl(); },
    freeze: function (v) { frozen = !!v; if (!v) kick(); },
    frameImg: function () { render(); return scr.toDataURL(); }, render: render
  };

  new ResizeObserver(function () { fit(); }).observe($('view'));
  var saved0 = loadSave();
  if (saved0) startCab({ who: saved0.who, lives: saved0.startLives || 3 }, saved0);
  else showSetup();
})();
</script>
</body>

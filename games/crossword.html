<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Crossword</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<style>
:root{--np:#f4efe2;--np-2:#e9e2cf;--np-ink:#16130f;--np-dim:#6b6455;--hl:#a9d1f7;--sel:#ffd84d;--cross:#e3edf7;--np-serif:Georgia,"Times New Roman",serif;--np-sans:"Helvetica Neue",Helvetica,Arial,sans-serif;}
html,body{height:100%;}
body{overflow:hidden;display:flex;flex-direction:column;}
.cw{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;padding:0 10px;}

/* Top line: puzzle chip, timer, help */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:0 0 8px;}
.puz{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 14px;border:0;border-radius:999px;background:var(--w08);color:var(--text);font-weight:900;font-size:.95rem;white-space:nowrap;}
.puz .ico{width:16px;height:16px;color:var(--text-3);}
.clock{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:0;border-radius:999px;background:rgba(0,0,0,.25);color:var(--text);font-weight:900;font-variant-numeric:tabular-nums;font-size:1rem;}
.clock .ico{width:16px;height:16px;color:var(--text-3);}
.top .sp{flex:1;}
.top .btn{min-height:40px;padding:0 12px;font-size:.88rem;}

/* The newspaper page */
.paper{flex:none;position:relative;border-radius:6px;padding:10px 10px 0;color:var(--np-ink);
  background:
    radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px) 0 0/3px 3px,
    linear-gradient(180deg,var(--np),var(--np-2));
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 14px 30px rgba(0,0,0,.45);}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:2px solid var(--np-ink);padding:0 2px 4px;margin-bottom:8px;font-family:var(--np-serif);}
.mast b{font-size:1.05rem;letter-spacing:.04em;font-weight:700;font-variant:small-caps;}
.mast span{font-size:.8rem;font-style:italic;color:var(--np-dim);white-space:nowrap;}
.gwrap{display:flex;justify-content:center;}
.grid{--n:5;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);width:min(100%,var(--gw,360px),calc(100dvh - var(--safe-t) - var(--safe-b) - var(--corner-y) - 540px));min-width:250px;aspect-ratio:1;border:2.5px solid var(--np-ink);background:var(--np-ink);gap:1px;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.sq{position:relative;background:#fffdf7;display:grid;place-items:center;cursor:pointer;}
.sq.blk{background:var(--np-ink);cursor:default;}
.sq .n{position:absolute;left:5%;top:3%;font-family:var(--np-serif);font-size:calc(var(--cell) * .24);line-height:1;color:var(--np-ink);}
.sq .l{font-family:var(--np-sans);font-weight:700;font-size:calc(var(--cell) * .56);line-height:1;padding-top:12%;text-transform:uppercase;color:var(--np-ink);}
.sq.word{background:var(--hl);}
.sq.sel{background:var(--sel);}
.sq.ok .l{color:#1f5fbf;}
.sq.bad::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#d01b2a;transform:rotate(-40deg);}
.sq.rev::before{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 calc(var(--cell) * .26) calc(var(--cell) * .26) 0;border-color:transparent #d01b2a transparent transparent;}
.sq.type .l{animation:ink .18s ease-out;}
@keyframes ink{from{transform:scale(1.35);opacity:.3;}to{transform:none;opacity:1;}}
.grid.done .sq:not(.blk){animation:wave .6s ease both;animation-delay:calc(var(--d) * 40ms);}
@keyframes wave{40%{background:#bfe7c9;transform:scale(1.08);}100%{background:#fffdf7;}}
.grid.paused .sq:not(.blk){background:#efe9da;}
.grid.paused .sq .l,.grid.paused .sq .n{visibility:hidden;}
.pausecover{position:absolute;inset:0;display:grid;place-items:center;z-index:2;}
.pausecover .btn{--b:var(--np-ink);--b-ink:#fff;--b-lip:#000;}

/* Clue bar on the paper */
.cbar{display:flex;align-items:stretch;min-height:54px;margin:10px -10px 0;border-top:1px solid rgba(0,0,0,.18);background:#d8e8f6;border-radius:0 0 6px 6px;}
.cbar button{flex:none;width:44px;border:0;background:none;color:var(--np-ink);display:grid;place-items:center;}
.cbar button .ico{width:20px;height:20px;}
.cbar .ct{flex:1;display:flex;align-items:center;gap:10px;padding:6px 2px;font-family:var(--np-serif);font-size:1.02rem;line-height:1.25;cursor:pointer;}
.cbar .ct b{flex:none;font-family:var(--np-sans);font-weight:800;font-size:.9rem;}

/* Clue lists */
.clues{flex:1;min-height:0;overflow:auto;margin:10px 0 0;padding:2px 2px 8px;scroll-behavior:smooth;}
.clues h3{font-family:var(--np-serif);font-variant:small-caps;font-size:1rem;letter-spacing:.06em;color:var(--text-2);margin:6px 4px 4px;border-bottom:1px solid var(--line-2);padding-bottom:3px;}
.clue{display:flex;gap:8px;padding:7px 8px;border-radius:10px;border-left:3px solid transparent;cursor:pointer;color:var(--text-2);font-size:.95rem;line-height:1.35;}
.clue b{flex:none;min-width:18px;color:var(--text);font-weight:900;}
.clue.on{background:rgba(169,209,247,.18);border-left-color:var(--hl);color:var(--text);}
.clue.x{background:var(--w04);}
.clue.full{color:var(--text-3);}
.clue.full b{color:var(--text-3);}

/* Keyboard */
.kb{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px calc(var(--corner-x) / 2) calc(var(--safe-b) + 8px + var(--corner-y));user-select:none;}
.kb .r{display:flex;justify-content:center;gap:5px;}
.key{flex:1;max-width:42px;height:48px;border:0;border-radius:8px;background:var(--w16);color:var(--text);font-weight:900;font-size:1.08rem;box-shadow:0 3px 0 rgba(0,0,0,.35);touch-action:manipulation;}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35);background:rgba(255,255,255,.26);}
.key.wide{max-width:64px;flex:1.5;}
.key .ico{width:22px;height:22px;margin:auto;}
.kb .half{flex:.5;max-width:20px;}

/* Picker */
.pk h3{font-size:.8rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:14px 0 8px;}
.pk .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;}
.pk button{position:relative;min-height:58px;border:0;border-radius:14px;background:var(--w07);color:var(--text);font-weight:900;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.pk button small{font-size:.68rem;font-weight:800;color:var(--text-3);}
.pk button.done{background:color-mix(in srgb,var(--green) 18%,transparent);}
.pk button.done small{color:var(--green);}
.pk button.cur{box-shadow:inset 0 0 0 2px var(--accent);}
.pk button.prog small{color:var(--yellow);}
.hs{display:flex;flex-direction:column;gap:8px;}
.hs .row2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.hs .row2 .btn{min-height:48px;padding:0 6px;font-size:.95rem;}

@media (max-height:740px){.key{height:42px;}.cbar{min-height:48px;}.kb{gap:5px;}}
@media (min-width:860px){
  .grid{width:min(100%,calc(var(--gw,360px) * 1.25),calc(100dvh - var(--safe-t) - 250px));}
  .cw{max-width:1040px;}
  .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:24px;align-items:start;}
  .paper{padding:16px 16px 0;}
  .cbar{margin:14px -16px 0;}
  .clues{margin:0;max-height:calc(100dvh - var(--safe-t) - 130px);display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-content:start;}
  .clues > div{min-width:0;}
}
@media (min-width:860px) and (pointer:fine){.kb{display:none;}}
.main{display:contents;}
@media (min-width:860px){.main{display:grid;}}
/* Tablet portrait: bigger paper and keys */
@media (min-width:700px) and (max-width:859px) and (min-height:900px){
  .cw{max-width:680px;}
  .paper{padding:14px 14px 0;}
  .cbar{margin:12px -14px 0;}
  .grid{width:min(100%,calc(var(--gw,360px) * 1.4),calc(100dvh - var(--safe-t) - var(--safe-b) - 620px));}
  .clue{font-size:1.02rem;}
  .kb{gap:8px;padding-bottom:calc(var(--safe-b) + 14px);}
  .kb .r{gap:7px;}
  .key{max-width:56px;height:58px;font-size:1.25rem;border-radius:10px;}
  .key.wide{max-width:84px;}
  .kb .half{max-width:28px;}
}
/* Touch landscape (iPad): keyboard sits under the clues, beside the puzzle */
@media (min-width:860px) and (pointer:coarse){
  .cw{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:24px;}
  .top{grid-column:1 / -1;}
  .main{display:contents;}
  .paper{grid-column:1;grid-row:2 / 4;align-self:start;}
  .grid{width:min(100%,calc(var(--gw,360px) * 1.25),calc(100dvh - var(--safe-t) - var(--safe-b) - 250px));}
  .clues{grid-column:2;grid-row:2;max-height:none;}
  .kb{grid-column:2;grid-row:3;}
}

/* QWERTY keyboard: every key is one tenth of the row, rows centered (like a phone keyboard) */
.kb .r,.kb .kr{--kg:5px;gap:var(--kg);justify-content:center;}
.kb .r .key,.kb .kr .key{flex:0 1 calc((100% - 9 * var(--kg)) / 10);min-width:0;}
.kb .r .key.wide,.kb .kr .key.bs,.kb .kspc{flex:0 1 calc((100% - 9 * var(--kg)) / 10 * 1.5);}
.kb .kspc{visibility:hidden;}
@media (min-width:700px){.kb .r,.kb .kr{--kg:7px;}}
</style>
</head>
<body>
<div class="cw" id="app">
  <div class="top">
    <button type="button" class="puz" id="puz"></button>
    <button type="button" class="clock" id="clock" aria-label="Pause"></button>
    <span class="sp"></span>
    <button type="button" class="btn btn-soft btn-sm" id="check">Check</button>
    <button type="button" class="btn btn-soft btn-sm" id="reveal">Reveal</button>
  </div>
  <div class="main">
    <section class="paper" id="paper">
      <div class="mast"><b id="mast">Crossword</b><span id="by"></span></div>
      <div class="gwrap"><div class="grid" id="grid"></div></div>
      <div class="cbar">
        <button type="button" id="prev" aria-label="Previous clue"></button>
        <div class="ct" id="ct" role="button" aria-label="Switch direction"></div>
        <button type="button" id="next" aria-label="Next clue"></button>
      </div>
    </section>
    <div class="clues" id="clues"></div>
  </div>
  <div class="kb" id="kb"></div>
</div>

  function cellsFor(scope) {
    if (scope === 'letter') return [[S.r, S.c]];
    if (scope === 'word') return Z.words[curWord()].cells;
    var out = []; for (var r = 0; r < Z.n; r++) for (var c = 0; c < Z.n; c++) if (Z.sol[r][c] !== '#') out.push([r, c]);
    return out;
  }
  function doCheck(scope) {
    snap(); S.checks++;
    var bad = 0, empty = 0;
    cellsFor(scope).forEach(function (q) {
      var r = q[0], c = q[1], k = r + '_' + c;
      if (!S.fill[r][c]) { empty++; return; }
      if (S.marks[k] === 'rev') return;
      if (S.fill[r][c] === Z.sol[r][c]) S.marks[k] = 'ok'; else { S.marks[k] = 'bad'; bad++; }
    });
    paint(); save();
    if (bad) { Kit.sfx('bad'); Kit.haptic('error'); Kit.toast(bad + (bad === 1 ? ' square is' : ' squares are') + ' wrong'); }
    else { Kit.sfx('good'); Kit.toast(empty ? 'All good so far' : 'All correct'); }
    checkDone();
  }
  function doReveal(scope) {
    snap(); S.reveals++;
    cellsFor(scope).forEach(function (q) {
      var r = q[0], c = q[1], k = r + '_' + c;
      if (S.fill[r][c] === Z.sol[r][c] && S.marks[k] === 'ok') return;
      if (S.fill[r][c] !== Z.sol[r][c]) { S.fill[r][c] = Z.sol[r][c]; S.marks[k] = 'rev'; }
    });
    Kit.sfx('flip'); if (scope !== 'puzzle') advance(); paint(); save(); checkDone(scope === 'puzzle');
  }
  function helpSheet(kind) {
    if (S.solved) return;
    Kit.sfx('pop');
    var s, box = el('div', { class: 'hs' }, [el('p', { class: 'muted', text: kind === 'check' ? 'Wrong letters get a red slash.' : 'Fill in the answer. Revealed squares get a red corner.' })]);
    var row = el('div', { class: 'row2' });
    [['letter', 'Letter'], ['word', 'Word'], ['puzzle', 'Puzzle']].forEach(function (x) {
      row.appendChild(el('button', { type: 'button', class: 'btn ' + (x[0] === 'puzzle' ? 'btn-soft' : 'btn-primary'), text: x[1], onclick: function () {
        s.close();
        if (kind === 'reveal' && x[0] === 'puzzle') Kit.confirm('Reveal the whole puzzle?', { ok: 'Reveal it', danger: true, body: 'This ends the puzzle.' }).then(function (ok) { if (ok) doReveal('puzzle'); });
        else (kind === 'check' ? doCheck : doReveal)(x[0]);
      } }));
    });
    box.appendChild(row);
    s = Kit.sheet({ title: kind === 'check' ? 'Check' : 'Reveal', node: box, actions: [{ label: 'Cancel', cls: 'btn-ghost' }] });
  }
  $('check').addEventListener('click', function () { helpSheet('check'); });
  $('reveal').addEventListener('click', function () { helpSheet('reveal'); });
  function clearAsk() {
    Kit.confirm('Clear this puzzle?', { ok: 'Clear', danger: true, body: 'All your letters will be erased and the timer reset.' }).then(function (ok) {
      if (!ok) return;
      var a = all(); if (a.prog) delete a.prog[S.id]; try { localStorage.setItem(SAVE, JSON.stringify(a)); } catch (e) {}
      S.solved = false; open(S.id);
    });
  }

  // ── Finishing ─────────────────────────────────────────────────────────────
  var warned = '';
  function filledCount() { var n = 0; for (var r = 0; r < Z.n; r++) for (var c = 0; c < Z.n; c++) if (S.fill[r][c] && S.fill[r][c] !== '#') n++; return n; }
  function checkDone(gaveUp) {
    if (S.solved) return;
    var full = true, right = true;
    for (var r = 0; r < Z.n; r++) for (var c = 0; c < Z.n; c++) {
      if (Z.sol[r][c] === '#') continue;
      if (!S.fill[r][c]) full = false; else if (S.fill[r][c] !== Z.sol[r][c]) right = false;
    }
    if (!full) { warned = ''; return; }
    if (!right) {
      var sig = JSON.stringify(S.fill);
      if (warned !== sig) { warned = sig; Kit.sfx('bad'); Kit.toast("The grid is full, but something's not right"); }
      return;
    }
    solved(gaveUp);
  }
  function solved(gaveUp) {
    S.solved = true; S.r = -1; S.c = -1;
    var best = solvedMap()[S.id], revealedCells = Object.keys(S.marks).filter(function (k) { return S.marks[k] === 'rev'; }).length;
    var clean = !S.checks && !S.reveals;
    var hl = [];
    if (gaveUp) hl.push('Revealed the rest of ' + Z.p.title);
    else hl.push('Solved ' + Z.p.title + ' in ' + fmt(S.secs) + (clean ? ' with no help' : ''));
    if (!gaveUp && best && S.secs < best) hl.push('New best time (old best ' + fmt(best) + ')');
    if (revealedCells && !gaveUp) hl.push('Revealed ' + revealedCells + (revealedCells === 1 ? ' square' : ' squares'));
    if (S.checks && !gaveUp) hl.push('Used check ' + S.checks + (S.checks === 1 ? ' time' : ' times'));
    var longest = Z.words.slice().sort(function (a, b) { return b.ans.length - a.ans.length; })[0];
    if (longest.ans.length >= 6) hl.push('Longest answer: ' + longest.ans);
    Kit.record(KEY, {
      started: S.started, mode: Z.p.title, summary: (gaveUp ? 'Revealed' : 'Solved in ' + fmt(S.secs)) + ' · ' + Z.p.title, badge: gaveUp ? '' : fmt(S.secs),
      highlights: hl, meta: { pid: S.id, secs: gaveUp ? null : S.secs, checks: S.checks, reveals: S.reveals, clean: clean },
      // History picture: the filled grid ('#' = black), marks per square ('r' revealed, 'k' checked right), and the clues
      detail: { t: Z.p.title, sz: Z.p.size, no: PUZZLES.indexOf(Z.p) + 1, g: Z.p.grid.map(function (r) { return r.toUpperCase(); }),
        m: Z.sol.map(function (row, r) { return row.map(function (ch, c) { var m = S.marks[r + '_' + c]; return ch === '#' ? '#' : m === 'rev' ? 'r' : m === 'ok' ? 'k' : '.'; }).join(''); }),
        a: Z.words.filter(function (w) { return w.dir === 'a'; }).map(function (w) { return w.clue; }),
        d: Z.words.filter(function (w) { return w.dir === 'd'; }).map(function (w) { return w.clue; }),
        s: S.secs, ch: S.checks, rv: S.reveals, gu: gaveUp ? 1 : 0 }
    });
    save(); Kit.resume.clear();
    var g = $('grid'); g.classList.add('done'); paint();
    if (gaveUp) { Kit.toast('Puzzle revealed'); return; }
    Kit.sfx('good');
    setTimeout(function () {
      var nx = nextUnsolved();
      Kit.win({
        title: clean ? 'Clean solve!' : 'Solved!', sub: Z.p.title + ' in ' + fmt(S.secs) + (best && S.secs < best ? ' · new best' : ''),
        againLabel: nx ? 'Next: ' + nx.title : 'Choose a puzzle', again: function () { if (nx) open(nx.id); else openPicker(); },
        extra: [{ label: 'Choose a puzzle', onClick: openPicker }], closeLabel: 'Admire the grid', onClose: function () {}
      });
    }, 900);
  }
  function nextUnsolved() {
    var done = solvedMap(), i = PUZZLES.indexOf(Z.p);
    for (var k = 1; k <= PUZZLES.length; k++) { var p = PUZZLES[(i + k) % PUZZLES.length]; if (!done[p.id] && p.id !== Z.p.id) return p; }
    return null;
  }

  // ── Puzzle picker ─────────────────────────────────────────────────────────
  function openPicker() {
    Kit.sfx('pop');
    var done = solvedMap(), prog = all().prog || {}, s, box = el('div', { class: 'pk' });
    [['mini', 'Minis · 5×5'], ['big', 'Bigger · 7×7']].forEach(function (sec) {
      var list = PUZZLES.filter(function (p) { return p.size === sec[0]; }); if (!list.length) return;
      box.appendChild(el('h3', { text: sec[1] }));
      var g = el('div', { class: 'g' });
      list.forEach(function (p) {
        var pr = prog[p.id], inProg = pr && !pr.solved && pr.fill && pr.fill.some(function (r) { return r.some(function (x) { return x && x !== '#'; }); });
        var t = done[p.id];
        g.appendChild(el('button', { type: 'button', class: (done[p.id] !== undefined ? 'done' : inProg ? 'prog' : '') + (Z && Z.p.id === p.id ? ' cur' : ''), 'aria-label': p.title,
          onclick: function () { s.close(); if (!Z || Z.p.id !== p.id) open(p.id); } },
          [el('span', { text: p.title.replace(/^\D+/, '') }), el('small', { text: done[p.id] !== undefined ? (t ? fmt(t) : 'done') : inProg ? 'started' : ' ' })]));
      });
      box.appendChild(g);
    });
    s = Kit.sheet({ title: 'Choose a puzzle', node: box, actions: [{ label: 'Close', cls: 'btn-soft' }] });
  }
  $('puz').addEventListener('click', openPicker);

  // ── Boot ──────────────────────────────────────────────────────────────────
  var a0 = all();
  var first = a0.cur && byId(a0.cur) && !(a0.prog && a0.prog[a0.cur] && a0.prog[a0.cur].solved) ? a0.cur : null;
  if (!first) { var dm = solvedMap(); first = (PUZZLES.filter(function (p) { return dm[p.id] === undefined; })[0] || PUZZLES[0]).id; }
  open(first);
  window.__cw = { get S() { return S; }, get Z() { return Z; }, open: open };
})();
</script>
</body>
</html>

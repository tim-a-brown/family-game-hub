<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Market</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../casino.js"></script>
<style>
body{overflow-x:hidden;}
.mk{max-width:760px;margin:0 auto;padding:0 14px calc(var(--safe-b) + 28px);}
.mk-side{display:contents;}
.mk-main{min-width:0;}

/* ── The ticker: an LED strip running across the top ── */
.tape{position:relative;margin:2px -14px 12px;height:34px;overflow:hidden;background:#07090c;border-block:1px solid #1d232c;box-shadow:inset 0 0 14px rgba(0,0,0,.9);}
.tape::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(0,0,0,.55) .6px,transparent 1px) 0 0/3px 3px;}
.tape .it{display:inline-flex;align-items:baseline;gap:7px;padding:0 18px;font:800 .9rem/1 var(--mono);letter-spacing:.04em;color:#ffcc4d;text-shadow:0 0 6px rgba(255,190,60,.6);}
.tape .it b{color:#fff3c4;font-weight:900;}
.tape .it .up{color:#4dff94;text-shadow:0 0 6px rgba(60,255,140,.55);}
.tape .it .dn{color:#ff5a5f;text-shadow:0 0 6px rgba(255,80,90,.55);}
/* the second strip runs the other way (what it shows: the key at its right end, Kit.marquee) */
.tapes{margin:2px 0 12px;}
.tapes .tape{margin:0 -14px;}
.tape.mine{border-top-color:#2a3240;}
.tape.mine .it b{color:#bfe9ff;}

/* ── Panels: the dark trading-terminal glass ── */
.pnl{position:relative;border-radius:18px;padding:14px;margin:0 0 12px;color:#eef2f8;background:linear-gradient(180deg,#151b24,#0b0f15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.04),0 8px 22px rgba(0,0,0,.42);}
.pnl h3{margin:0 0 8px;font-size:.68rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#7f8aa0;display:flex;justify-content:space-between;gap:10px;}
.pnl h3 button{border:0;background:none;color:#9fb0cc;font:inherit;letter-spacing:.08em;padding:0;}
.cap{font-size:.66rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#7f8aa0;}
.up{color:#3ddc84;}.dn{color:#ff6470;}
.num{font-variant-numeric:tabular-nums;}

.val{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.val .big{font:400 clamp(2rem,9vw,2.6rem)/1 var(--display);letter-spacing:.01em;font-variant-numeric:tabular-nums;}
.val .chg{font-weight:900;font-size:.95rem;text-align:right;}
.val .chg small{display:block;font-size:.7rem;font-weight:800;color:#7f8aa0;letter-spacing:.06em;text-transform:uppercase;}
.asof{font-size:.74rem;font-weight:700;color:#7f8aa0;margin-top:6px;}

/* charts */
.chart{position:relative;margin:10px -4px 0;touch-action:pan-y;}
.chart svg{display:block;width:100%;height:auto;overflow:visible;}
.chart .tip{position:absolute;top:0;transform:translateX(-50%);pointer-events:none;background:#eef2f8;color:#0b0f15;border-radius:8px;padding:3px 8px;font-size:.75rem;font-weight:900;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4);}
.chart .tip small{display:block;font-size:.66rem;font-weight:700;color:#4a5468;}
.rng{display:flex;gap:4px;margin-top:8px;}
.span{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px;font-size:.8rem;font-weight:800;color:#9fb0cc;min-height:1.2em;}
.span b{font-weight:900;}
.chart .empty.loading{animation:mkpulse 1.2s ease-in-out infinite;}
@keyframes mkpulse{50%{opacity:.45;}}
.rng button{flex:1;border:0;border-radius:9px;background:rgba(255,255,255,.05);color:#9fb0cc;font:inherit;font-weight:900;font-size:.78rem;padding:7px 0;}
.rng button.on{background:#eef2f8;color:#0b0f15;}

/* allocation */
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0 8px;}
.alloc i{display:block;height:100%;min-width:3px;}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 10px;}
.legend div{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.78rem;font-weight:800;color:#c9d2e3;}
.legend div span{display:flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

.cashrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cashrow .amt{font:400 1.5rem/1 var(--display);font-variant-numeric:tabular-nums;}
.cashrow .btns{display:flex;gap:8px;}
.btn-g{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:900;font-size:.9rem;color:#fff;background:linear-gradient(180deg,#25a35b,#16703e);box-shadow:0 3px 0 #0d4a28;}
.btn-g:active{transform:translateY(2px);box-shadow:0 1px 0 #0d4a28;}
.btn-d{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:900;font-size:.9rem;color:#eef2f8;background:#263041;box-shadow:0 3px 0 #141a24;}
.btn-d:active{transform:translateY(2px);box-shadow:0 1px 0 #141a24;}
.btn-g[disabled],.btn-d[disabled]{opacity:.45;}

/* rows: holdings and market */
.rows{display:grid;gap:0;}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid rgba(255,255,255,.06);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left;width:100%;}
.row:first-child{border-top:0;}
.row:active{background:rgba(255,255,255,.04);}
.tk{display:grid;place-items:center;min-width:52px;height:30px;padding:0 6px;border-radius:8px;font:900 .72rem/1 var(--mono);letter-spacing:.02em;color:#fff;background:#2b3648;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);white-space:nowrap;}
.row .nm{min-width:0;}
.row .nm b{display:block;font-size:.95rem;font-weight:900;line-height:1.2;}
.row .nm small{display:block;font-size:.74rem;font-weight:700;color:#8590a6;}
.row .px{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;}
.row .px small{display:block;font-size:.74rem;font-weight:800;}
.row svg.spark{width:56px;height:24px;display:block;}
.pill{display:inline-block;min-width:62px;text-align:center;border-radius:8px;padding:5px 6px;font-weight:900;font-size:.8rem;font-variant-numeric:tabular-nums;}
.pill.up{background:rgba(61,220,132,.14);}.pill.dn{background:rgba(255,100,112,.14);}
.empty{padding:16px 4px;color:#8590a6;font-size:.9rem;text-align:center;}

/* market */
.idx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px;}
.idx div{background:linear-gradient(180deg,#151b24,#0b0f15);border-radius:14px;padding:9px 10px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);}
.idx b{display:block;font-size:.98rem;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;color:#eef2f8;}
.idx small{display:block;font-size:.76rem;font-weight:900;}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 10px;padding:2px 14px 4px;}
.chips::-webkit-scrollbar{display:none;}
.q{width:100%;min-height:44px;border-radius:12px;border:0;background:var(--w07);color:var(--text);padding:0 14px;font:inherit;font-size:1rem;margin:0 0 10px;}

/* the "since your last visit" report */
.rep{border-left:3px solid #f2b632;}
.rep ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;}
.rep li{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:700;color:#dfe5f0;}
.rep li b{white-space:nowrap;}

/* detail pane */
.pane{position:fixed;left:0;right:0;bottom:0;top:var(--bar);z-index:30;overflow-y:auto;overscroll-behavior:contain;background:var(--page-bg);background-attachment:fixed;transform:translateX(100%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s;padding:6px 0 calc(var(--safe-b) + 24px);}
.pane.on{visibility:visible;transition:transform .3s var(--ease);}
.pane.on{transform:none;}
.pane .in{max-width:760px;margin:0 auto;padding:0 14px;min-height:calc(100% + 1px);}   /* (always a hair taller than the pane, so the pane itself takes every swipe) */
.pane .top{display:flex;align-items:center;gap:10px;margin:0 0 10px;}
.pane .top .back{width:44px;height:44px;border-radius:50%;border:0;background:var(--w07);color:var(--text);display:grid;place-items:center;flex:none;}
.pane .top .back svg{width:22px;height:22px;}
.pane .top .t{min-width:0;}
.pane .top .t b{display:block;font:400 1.35rem/1.1 var(--display);}
.pane .top .t small{display:block;font-size:.8rem;font-weight:700;color:var(--text-3);}
.pane .top .t{flex:1;}
.pane .top .star{width:44px;height:44px;border-radius:50%;border:0;background:var(--w07);color:var(--text-3);display:grid;place-items:center;flex:none;transition:transform .2s var(--ease),color .2s,background .2s;}
.pane .top .star svg{width:22px;height:22px;}
.pane .top .star.on{color:#ffc93c;background:rgba(255,201,60,.16);}
.pane .top .star.on svg{fill:currentColor;}
.pane .top .star.pop{animation:mkstar .45s var(--ease);}
@keyframes mkstar{40%{transform:scale(1.25) rotate(-12deg);}100%{transform:none;}}
.chip svg{width:14px;height:14px;margin:-2px 5px 0 -2px;vertical-align:middle;fill:#ffc93c;color:#ffc93c;}
.mk-blurb{margin:0 0 8px;font-size:.84rem;color:#9fb0cc;}
.mk-sub{margin:0 -14px 6px;padding:2px 14px 6px;}
.mk-sub .chip{min-height:34px;font-size:.82rem;}
.mk-h2{margin-top:18px;}
.mk-more{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;padding:12px;border-radius:12px;background:var(--w07);font-size:.86rem;font-weight:700;color:#9fb0cc;}
.mk-more span{flex:1 1 180px;}
.lite-card{width:100%;text-align:left;color:inherit;font:inherit;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin:12px 0 2px;padding:14px;border-radius:14px;background:rgba(255,201,60,.08);border:1px solid rgba(255,201,60,.22);}
.lite-card .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,201,60,.16);color:#ffc93c;}
.lite-card .ic svg{width:22px;height:22px;}
.lite-card b{display:block;font-size:.95rem;font-weight:900;}
.lite-card small{display:block;font-size:.82rem;font-weight:700;color:#9fb0cc;margin-top:2px;}
.daybar{position:relative;height:10px;border-radius:5px;background:var(--w07);margin:14px 0 6px;}
.daybar i{position:absolute;top:0;bottom:0;border-radius:5px;}
.daybar + .ends{display:flex;justify-content:space-between;font-size:.76rem;font-weight:800;color:#8590a6;font-variant-numeric:tabular-nums;}
.about{font-size:.9rem;line-height:1.45;color:#c9d2e3;margin:0;}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;}
.kv div{min-width:0;}
.kv b{display:block;font-size:1.05rem;font-weight:900;font-variant-numeric:tabular-nums;}
.tradebar{position:sticky;bottom:calc(var(--safe-b) + 8px);display:flex;gap:10px;margin-top:12px;z-index:2;}
.tradebar button{flex:1;min-height:52px;font-size:1rem;}

/* trade ticket (sheet) */
.tt .seg{margin:0 0 12px;}
.amtbox{display:flex;align-items:center;gap:10px;background:var(--w07);border-radius:14px;padding:6px 12px;margin:0 0 10px;}
.amtbox span{font:400 1.6rem var(--display);color:var(--text-3);}
.amtbox input::-webkit-inner-spin-button,.amtbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.amtbox input{-moz-appearance:textfield;appearance:textfield;flex:1;min-width:0;border:0;background:none;color:var(--text);font:400 1.9rem var(--display);padding:6px 0;outline:none;font-variant-numeric:tabular-nums;}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;}
.qchips button{border:0;border-radius:99px;background:var(--w07);color:var(--text-2);padding:7px 12px;font:inherit;font-weight:800;font-size:.85rem;}
.sum{display:grid;gap:6px;margin:6px 0 4px;}
.sum div{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;font-weight:700;color:var(--text-2);}
.sum div b{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;}
.sum .tot{border-top:1px solid var(--line);padding-top:8px;font-size:1rem;}
.why{font-size:.84rem;line-height:1.4;color:var(--text-3);margin:8px 0 0;}
.warn{border-radius:12px;padding:10px 12px;background:rgba(255,200,61,.12);color:#ffd970;font-size:.86rem;font-weight:700;line-height:1.4;margin:10px 0 0;}

/* trade confirmation */
.conf{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;background:rgba(5,3,14,.0);animation:confbg 1.6s ease both;}
@keyframes confbg{0%{background:rgba(5,3,14,0)}15%,80%{background:rgba(5,3,14,.55)}100%{background:rgba(5,3,14,0)}}
.conf .card{position:relative;width:min(84vw,330px);background:#f4f2ec;color:#1d1d22;border-radius:6px;padding:16px 16px 18px;font-family:var(--mono);box-shadow:0 20px 50px rgba(0,0,0,.6);animation:confin 1.6s cubic-bezier(.2,1.3,.4,1) both;}
@keyframes confin{0%{transform:translateY(60px) scale(.9);opacity:0}15%{transform:none;opacity:1}80%{transform:none;opacity:1}100%{transform:translateY(-40px) scale(.95);opacity:0}}
.conf .card .h{font:400 1.1rem var(--display);letter-spacing:.04em;text-transform:uppercase;}
.conf .card .l{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:6px;}
.conf .card .st{position:absolute;right:12px;top:12px;transform:rotate(-10deg);border:3px solid #16924a;color:#16924a;border-radius:7px;padding:1px 8px;font:400 1.3rem var(--display);letter-spacing:.06em;animation:stampin .4s .35s cubic-bezier(.2,1.6,.4,1) both;mix-blend-mode:multiply;}
.conf .card .st.sell{border-color:#c0392b;color:#c0392b;}
@keyframes stampin{0%{transform:rotate(-10deg) scale(2.2);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}

/* options chain */
.chain{display:grid;gap:0;}
.chain .crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid rgba(255,255,255,.06);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left;width:100%;}
.chain .crow.itm{background:linear-gradient(90deg,rgba(61,220,132,.08),transparent 70%);}
.chain .crow .k{font-weight:900;font-size:1rem;font-variant-numeric:tabular-nums;}
.chain .crow .k small{display:block;font-size:.72rem;font-weight:700;color:#8590a6;}
.chain .crow .pr{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;}
.chain .crow .pr small{display:block;font-size:.72rem;font-weight:700;color:#8590a6;}
.chain .spot{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.74rem;font-weight:900;color:#f2b632;letter-spacing:.08em;text-transform:uppercase;}
.chain .spot::before,.chain .spot::after{content:"";flex:1;height:1px;background:#f2b632;opacity:.6;}
.payoff{display:block;width:100%;height:auto;margin:8px 0 4px;}

/* bonds */
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.bcard{border:0;text-align:left;color:#eef2f8;font:inherit;border-radius:16px;padding:12px;background:linear-gradient(160deg,#1b2b22,#0e1612);box-shadow:inset 0 0 0 1px rgba(160,200,170,.12),0 6px 16px rgba(0,0,0,.35);}
.bcard .y{font:400 1.7rem/1 var(--display);color:#9ff0bf;margin:6px 0 4px;font-variant-numeric:tabular-nums;}
.bcard b{display:block;font-size:.95rem;font-weight:900;}
.bcard small{display:block;font-size:.74rem;font-weight:700;color:#a9bcb0;line-height:1.3;}

/* lessons */
.lessons{display:grid;gap:10px;}
.lesson{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:0;text-align:left;width:100%;color:var(--text);font:inherit;padding:12px;border-radius:16px;background:var(--w06);}
.lesson .n{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#263041;color:#ffcc4d;font:400 1.1rem var(--display);}
.lesson.done .n{background:#1d6b41;color:#fff;}
.lesson .n svg{width:20px;height:20px;}
.lesson b{display:block;font-weight:900;}
.lesson small{display:block;font-size:.8rem;color:var(--text-3);font-weight:700;}
.lesson .go svg{width:20px;height:20px;color:var(--text-3);}
.lsn{font-size:.98rem;line-height:1.55;color:var(--text-2);}
.lsn h4{margin:18px 0 6px;font:400 1.15rem var(--display);color:var(--text);}
.lsn p{margin:0 0 10px;}
.lsn b{color:var(--text);}
.lsn .ex b{color:#fff3c4;}   /* (the example card is dark in every theme) */
.lsn .ex{background:linear-gradient(180deg,#151b24,#0b0f15);border-radius:14px;padding:12px 14px;margin:10px 0 12px;color:#dfe5f0;font-size:.92rem;}
.lsn .ex .cap{display:block;margin-bottom:4px;}
.lsn svg.fig{display:block;width:100%;height:auto;margin:6px 0;}
.lsn ul{margin:0 0 10px;padding-left:20px;}
.lsn li{margin:0 0 5px;}

/* tax center */
.taxt{width:100%;border-collapse:collapse;font-size:.92rem;}
.taxt td{padding:7px 2px;border-top:1px solid var(--line);color:var(--text-2);font-weight:700;}
.taxt td:last-child{text-align:right;color:var(--text);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;}
.taxt tr.tot td{font-size:1rem;}

@media (min-width:900px),(orientation:landscape) and (min-width:640px){
  .mk{max-width:1200px;display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:18px;}
  .mk-side{display:block;position:sticky;top:calc(var(--bar) + 4px);align-self:start;max-height:calc(100dvh - var(--bar) - 10px);overflow-y:auto;scrollbar-width:none;}
  .mk-side::-webkit-scrollbar{display:none;}
  .tapes{grid-column:1/-1;margin:2px 0 4px;}
  .chips{margin:0 0 10px;padding:2px 0 4px;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var el = Kit.el, esc = Kit.esc, app = document.getElementById('app');
  var STO = 'https://firebasestorage.googleapis.com/v0/b/familygames-da3e5.firebasestorage.app/o/market%2F';
  var QURL = STO + 'q2.json?alt=media', QURL_OLD = STO + 'quotes.json?alt=media';
  var DAY = 864e5, YEAR = 365 * DAY;

  // ── Storage: the account and lessons follow the PIN; the price cache stays on this device ──
  function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} if (window.FGHSync && FGHSync.noteWrite) FGHSync.noteWrite(k); }
  var AK = 'mk_acct', LK = 'mk_learn', SK = 'mk_set', WK = 'mk_watch';
  function fresh() { return { v: 1, cash: 0, lots: [], opts: [], bonds: [], orders: [], tx: [], paid: {}, vals: [], dvSeen: {}, mmAt: Date.now(), dep: 0, wd: 0, last: 0, lastVal: 0, lastPx: {} }; }
  var A = lsGet(AK, null) || fresh();
  ['lots', 'opts', 'bonds', 'orders', 'tx', 'vals'].forEach(function (k) { if (!Array.isArray(A[k])) A[k] = []; });
  A.paid = A.paid || {}; A.dvSeen = A.dvSeen || {}; A.lastPx = A.lastPx || {};
  var LEARN = lsGet(LK, {}) || {};
  var SET = lsGet(SK, null) || { br: 22 };
  var WATCH = lsGet(WK, []); if (!Array.isArray(WATCH)) WATCH = [];
  function watched(sym) { return WATCH.indexOf(sym) >= 0; }
  function setWatch(sym, on) { WATCH = WATCH.filter(function (x) { return x !== sym; }); if (on) WATCH.unshift(sym); lsSet(WK, WATCH); }
  // How deep to go (chosen on first load, changed from the menu; it follows the PIN):
  // basic = well-known stocks and index funds; all = every US stock and fund, bonds, crypto, limit orders, taxes;
  // pro = options and your own tax bracket too
  var DEPTHS = [
    { id: 'basic', title: 'Stocks and index funds', desc: 'Buy and sell well-known companies, and funds that hold the whole market.', feats: ['Famous companies', 'Index funds', 'Dividends', 'Lessons'] },
    { id: 'all', title: 'The whole market', desc: 'Every US stock and fund, bonds and crypto. Taxes come out when you cash out.', feats: ['Every US stock', 'Bonds', 'Treasuries', 'Crypto', 'Limit orders', 'Taxes'] },
    { id: 'pro', title: 'Everything', desc: 'Options on any stock or fund, and the tax bracket you pick.', feats: ['Calls and puts', 'Your tax bracket'] }
  ];
  var DEPTH = Kit.depth.get('mk_depth', null);

        ex('Right now', 'One Apple share costs <b>' + px(aapl) + '</b>. Buy $100 worth and you own ' + shares(100 / aapl) + ' of a share.') +
        '<h4>Why prices move</h4><p>A share is worth what someone will pay for it. When people expect a company to earn more in the future, they pay more and the price rises. Bad news, or a gloomy economy, and it falls. Day to day it can look random; over many years, prices tend to follow how much the company actually earns.</p>' +
        '<h4>How you make or lose money</h4><ul><li><b>The price rises</b> and you sell for more than you paid. That profit is a <b>capital gain</b>.</li><li>Some companies share profits as <b>dividends</b>, paid in cash to everyone who owns shares.</li><li><b>The price falls</b> and you sell for less: a loss. A company can even go out of business, and its shares go to zero.</li></ul>',
      orders: '<p>Every stock has a <b>ticker symbol</b>: AAPL is Apple, NTDOY is Nintendo, UAL is United Airlines.</p>' +

        '<p>Crypto trades every day, all day, even on holidays. Gains are taxed like stocks. Many investors who own it keep it to a small slice of their money.</p>',
      taxes: '<p>When you sell something for more than you paid, the profit is a <b>capital gain</b>, and it’s taxed. Gains only count once you sell; a stock that’s up but unsold isn’t taxed yet.</p>' +
        '<h4>Short-term and long-term</h4><ul><li>Held <b>a year or less</b>: a <b>short-term</b> gain, taxed like your paycheck (your bracket: 10% to 37%).</li><li>Held <b>over a year</b>: <b>long-term</b>, taxed at 0%, 15% or 20%. Most people pay 15%.</li></ul>' +
        ex('Same gain, different tax', 'A $1,000 gain in the 22% bracket: <b>$220</b> tax if held 11 months, <b>$150</b> if held 13 months.') +
        '<h4>Losses help</h4><p>Losses cancel out gains. If losses are bigger, up to $3,000 a year can come off other income, and the rest carries to next year. (The <b>wash sale</b> rule: buy the same stock back within 30 days of selling at a loss and you can’t count the loss yet.)</p>' +
        '<h4>Other income</h4><p><b>Interest</b> is taxed like income. Treasury interest skips state tax; most <b>municipal bond</b> interest skips federal tax. <b>Dividends</b> from most US companies get the lower long-term rate.</p>' +
        '<h4>Accounts that skip tax</h4><p>A <b>401(k)</b> or <b>traditional IRA</b> lets money grow untaxed until you take it out in retirement. A <b>Roth IRA</b> is taxed going in but never again. Most long-term investing happens in these.</p>' +
        ex('In this app', 'Gains, interest and dividends add up through the year. When you cash out to your bankroll, the tax you owe comes out first. Set your bracket in Taxes.'),
      plan: '<p>Nobody can predict next month’s market. Here’s what most experts suggest instead:</p>' +
        '<ul><li><b>Emergency money first.</b> Keep a few months of expenses in savings before investing.</li><li><b>Use the accounts that skip tax</b>: a 401(k), especially when an employer matches, and an IRA.</li><li><b>Mostly index funds.</b> Cheap, diversified, and hard to beat.</li><li><b>Add a little every month</b> no matter what prices do. That’s <b>dollar-cost averaging</b>: you automatically buy more shares when prices are low.</li><li><b>More bonds as you get closer</b> to needing the money.</li><li><b>Don’t panic.</b> Selling in a crash locks in the loss. Time in the market beats timing the market.</li></ul>' +
        ex('A classic mix', 'A total US stock fund (VTI), an international fund (VXUS) and a bond fund (BND). Three funds, thousands of companies and bonds, tiny fees.')
    };
    return L[id] || '';
  }

  // ── Shell ──
  var report = null;
  function depthTitle() { var d = DEPTHS.filter(function (x) { return x.id === DEPTH; })[0]; return d ? d.title : ''; }
  var depthItem = { icon: 'sliders', label: 'How deep to go', sub: depthTitle(), onClick: depthSheet };
  function depthSheet() { Kit.depth({ key: 'mk_depth', levels: DEPTHS, value: DEPTH || 'pro', onPick: setDepth }); }
  function setDepth(d) {
    DEPTH = d; depthItem.sub = depthTitle();
    if (!dom.main) { layout(); return; }
    if (tab === 'learn' || tab === 'mkt') window.scrollTo(0, 0);
    if (dom.pane.classList.contains('on')) closePane(); else paint();
  }
  Kit.init({
    id: 'stocks',
    sync: function () { return refreshAll(); },
    menu: [
      depthItem,
      { icon: 'chart', label: 'Taxes', when: taxesOn, onClick: taxSheet },
      { icon: 'book', label: 'Lessons', onClick: function () { closePane(); tab = 'learn'; paint(); } },
      { icon: 'history', label: 'Bankroll history', onClick: function () { Casino.showHistory(); } },
      { icon: 'undo', label: 'Reset bankroll', onClick: function () { Kit.confirm('Reset your casino bankroll to $1,000? Your investing account stays as it is.', { ok: 'Reset', danger: true }).then(function (y) { if (y) { Casino.reset(); Kit.toast('Bankroll reset to $1,000'); } }); } }
    ],
    rules:
      '<p class="goal">Invest your casino bankroll in the real stock market. Prices are real and update every hour while the market is open.</p>' +
      '<h3>How deep to go</h3><p>Pick how much of the market you want (menu, How deep to go): well-known stocks and index funds; the whole market with bonds, Treasuries, crypto, limit orders and taxes; or everything, with options and your own tax bracket.</p>' +
      '<h3>Getting started</h3><ul><li><b>Add money</b> from your bankroll. It waits as cash, earning the T-bill rate.</li><li>Open <b>Market</b>, pick something and tap <b>Buy</b>. Buy by dollars or shares.</li><li><b>Buy now</b> fills at the latest price. A <b>limit order</b> waits for a later price update.</li></ul>' +
      '<h3>What you can own</h3><ul><li>Every stock and fund listed in the US, and fifteen coins. Search by name or symbol; star one to keep it on your watchlist. Real dividends are paid to your cash.</li><li><b>Treasuries</b> (Market, Treasuries): bills, notes and bonds at today’s rates, with interest every six months.</li><li><b>Options</b> (on any stock or fund): buy calls and puts, sell them back any time, settled in cash at the end date.</li></ul>' +
      '<h3>Cashing out and taxes</h3><p>Gains count for tax when you sell. Short-term gains (held a year or less) and interest are taxed at your bracket; long-term gains and dividends at the lower rate. Losses offset gains. When you cash out to your bankroll, the tax you owe comes out first; the app shows you before you confirm.</p>' +
      '<p>The <b>Learn</b> tab explains everything, with today’s real numbers.</p>'
  });

  function start() {
    var ev = catchUp();
    // how holdings moved since the last visit
    if (A.last && Q) {
      var v = totals().all, d = v - (A.lastVal || v);
      if (Math.abs(d) >= .01 && (A.lots.length || A.opts.length)) ev.unshift(['Your account since ' + dateTxt(A.last), signed(d, 1)]);
      holdings().forEach(function (h) { var was = A.lastPx[h.sym]; if (was) { var c = (price(h.sym) - was) / was; if (Math.abs(c) >= .03) ev.push([h.sym + (c > 0 ? ' up ' : ' down ') + Math.abs(c * 100).toFixed(1) + '%', signed((price(h.sym) - was) * h.q, 1)]); } });
      if (d > Math.max(250, (A.lastVal || 0) * .05)) setTimeout(function () { Kit.confetti(); Kit.sfx('win'); }, 500);
    }
    if (ev.length) report = ev;
    if (Q) { A.last = Date.now(); A.lastVal = totals().all; A.lastPx = {}; holdings().forEach(function (h) { A.lastPx[h.sym] = price(h.sym); }); recordValue(); }
    save(); if (dom.main) paint();
    Kit.resume.clear();   // (an investing account isn't a game in progress: it isn't in Keep playing, and doesn't start over)
  }
  // First load: how deep to go (an account already in use starts with everything, so nothing it holds goes missing)
  if (!DEPTH) Kit.depth({ host: app, key: 'mk_depth', levels: DEPTHS, value: A.dep || A.lots.length || A.tx.length ? 'pro' : 'basic', start: 'Open the market', onPick: setDepth });
  else layout();
  loadQuotes().then(ensureAll).then(start);
  // the latest prices, and anything they settle (orders filled, options expired, dividends): on coming back, or Sync now
  function refreshAll() { return loadQuotes().then(ensureAll).then(function () { var ev = catchUp(); if (ev.length) report = (report || []).concat(ev); save(); if (dom.main && !dom.pane.classList.contains('on')) paint(); }); }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshAll(); });
  window.__mk = { loadAll: loadAll, depth: function () { return DEPTH; }, setDepth: setDepth, ALL: function () { return ALL; }, open: function (s) { openSym(s); }, A: function () { return A; }, Q: function () { return Q; }, catchUp: catchUp, taxYears: taxYears, withdrawPlan: withdrawPlan, buy: buy, sell: sell, paint: paint, setQ: function (q) { Q = q; }, totals: totals };
})();
</script>
</body>
</html>

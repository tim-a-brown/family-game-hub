<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Market</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../casino.js"></script>
<style>
body{overflow-x:hidden;}
.mk{max-width:760px;margin:0 auto;padding:0 14px calc(var(--safe-b) + 28px);}
.mk-side{display:contents;}
.mk-main{min-width:0;}

/* ── The tickers: two glass strips running across the top ── */
.tape{position:relative;margin:2px -14px 12px;height:36px;overflow:hidden;background:var(--sheet-solid);box-shadow:inset 0 1px 0 var(--gl-line),inset 0 -1px 0 var(--gl-line);}
.tape .it{display:inline-flex;align-items:center;gap:7px;padding:0 18px;font:650 .86rem/1 var(--font);color:var(--text-2);font-variant-numeric:tabular-nums;}
.tape .it b{color:var(--text);font-weight:800;}
/* every piece centered on the ribbon by its capitals (not the font's line box, which leaves room below for descenders) */
.tape .it > *{line-height:1;text-box:trim-both cap alphabetic;}
.tape .it .up{color:var(--green);}
.tape .it .dn{color:var(--red);}
/* the second strip runs the other way (what it shows: the key at its right end, Kit.marquee) */
.tapes{margin:2px 0 12px;}
.tapes .tape{margin:0 -14px;}
.tapes .tape + .tape{box-shadow:inset 0 -1px 0 var(--gl-line);}
.tape.mine .it b{color:var(--lit-ink);}
.tape .k-mq-tab{background:linear-gradient(90deg,transparent,var(--sheet-solid) 14px);color:var(--text-2);font:700 .78rem/1 var(--font);letter-spacing:0;text-transform:none;text-shadow:none;}
.tape .k-mq-tab::before{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:11px;z-index:-1;}
.tape .k-mq-tab:active{color:var(--text);}

/* ── Panels: Night glass ── */
.pnl{position:relative;border-radius:var(--r-lg);padding:14px;margin:0 0 12px;color:var(--text);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line),var(--shadow-sm);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
.pnl h3{margin:0 0 8px;font-size:.84rem;font-weight:600;color:var(--text-2);display:flex;justify-content:space-between;gap:10px;}
.pnl h3 button{border:0;background:none;color:var(--lit-ink);font:inherit;padding:0;}
.cap{font-size:.78rem;font-weight:600;color:var(--text-2);}
.up{color:var(--green);}.dn{color:var(--red);}
.num{font-variant-numeric:tabular-nums;}

.val{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.val .big{font:800 clamp(2rem,9vw,2.6rem)/1 var(--display);letter-spacing:-.025em;font-variant-numeric:tabular-nums;}
.val .chg{font-weight:900;font-size:.95rem;text-align:right;}
.val .chg small{display:block;font-size:.78rem;font-weight:600;color:var(--text-2);}
.asof{font-size:.74rem;font-weight:700;color:var(--text-3);margin-top:6px;}

/* charts */
.chart{position:relative;margin:10px -4px 0;touch-action:pan-y;}
.chart svg{display:block;width:100%;height:auto;overflow:visible;}
.chart .tip{position:absolute;top:0;transform:translateX(-50%);pointer-events:none;background:var(--toast-bg);color:var(--text);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:10px;padding:3px 8px;font-size:.75rem;font-weight:900;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4);}
.chart .tip small{display:block;font-size:.66rem;font-weight:700;color:var(--text-3);}
.rng{display:flex;gap:4px;margin-top:8px;}
.span{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px;font-size:.8rem;font-weight:800;color:var(--text-2);min-height:1.2em;}
.span b{font-weight:900;}
.chart .empty.loading{animation:mkpulse 1.2s ease-in-out infinite;}
@keyframes mkpulse{50%{opacity:.45;}}
.rng button{flex:1;border:0;border-radius:12px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text-2);font:inherit;font-weight:700;font-size:.78rem;padding:7px 0;}
.rng button.on{background:rgba(255,211,77,.14);color:var(--lit-ink);box-shadow:inset 0 0 0 1px rgba(255,211,77,.6),0 0 16px rgba(255,190,60,.18);}

/* allocation */
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0 8px;}
.alloc i{display:block;height:100%;min-width:3px;}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 10px;}
.legend div{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.78rem;font-weight:800;color:var(--text-2);}
.legend div span{display:flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

.cashrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cashrow .amt{font:800 1.5rem/1 var(--display);font-variant-numeric:tabular-nums;}
.cashrow .btns{display:flex;gap:8px;}
/* the money buttons: buying is the gold one; the rest are glass. No lip: a press sinks a touch */
.btn-g,.btn-d{border:0;border-radius:14px;padding:10px 14px;font:inherit;font-weight:750;font-size:.9rem;transition:transform .12s var(--ease),filter .15s;}
.btn-g{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 18px -10px rgba(255,190,60,.6);}
.btn-d{color:var(--text);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.btn-g:active:not([disabled]),.btn-d:active:not([disabled]){transform:translateY(1px) scale(.975);filter:brightness(.94);}
.btn-g[disabled],.btn-d[disabled]{opacity:.4;}

/* rows: holdings and market */
.rows{display:grid;gap:0;}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--gl-line);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left;width:100%;}
.row:first-child{border-top:0;}
.row:active{background:var(--gl);}
.tk{display:grid;place-items:center;min-width:52px;height:30px;padding:0 6px;border-radius:10px;font:800 .74rem/1 var(--font);color:var(--text);background:var(--gl-3);box-shadow:inset 0 0 0 1px var(--gl-line);white-space:nowrap;}
.row .nm{min-width:0;}
.row .nm b{display:block;font-size:.95rem;font-weight:900;line-height:1.2;}
.row .nm small{display:block;font-size:.74rem;font-weight:700;color:var(--text-3);}
.row .px{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;}
.row .px small{display:block;font-size:.74rem;font-weight:800;}
.row svg.spark{width:56px;height:24px;display:block;}
.pill{display:inline-block;min-width:62px;text-align:center;border-radius:8px;padding:5px 6px;font-weight:900;font-size:.8rem;font-variant-numeric:tabular-nums;}
.pill.up{background:rgba(61,220,132,.14);}.pill.dn{background:rgba(255,100,112,.14);}
.empty{padding:16px 4px;color:var(--text-3);font-size:.9rem;text-align:center;}

/* market */
.idx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px;}
.idx div{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:var(--r);padding:9px 10px;min-width:0;}
.idx b{display:block;font-size:.98rem;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text);}
.idx small{display:block;font-size:.76rem;font-weight:900;}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 10px;padding:2px 14px 4px;}
.chips::-webkit-scrollbar{display:none;}
.q{width:100%;min-height:44px;border-radius:var(--r);border:0;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text);padding:0 14px;font:inherit;font-size:1rem;margin:0 0 10px;}

/* the "since your last visit" report */
.rep{box-shadow:inset 3px 0 0 var(--lit),inset 0 0 0 1px var(--gl-line),var(--shadow-sm);}
.rep ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;}
.rep li{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:700;color:var(--text-2);}
.rep li b{white-space:nowrap;}

/* detail pane */
.pane{position:fixed;left:0;right:0;bottom:0;top:var(--bar);z-index:30;overflow-y:auto;overscroll-behavior:contain;background:var(--page-bg);background-attachment:fixed;transform:translateX(100%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s;padding:6px 0 calc(var(--safe-b) + 24px);}
.pane.on{visibility:visible;transition:transform .3s var(--ease);}
.pane.on{transform:none;}
.pane .in{max-width:760px;margin:0 auto;padding:0 14px;min-height:calc(100% + 1px);}   /* (always a hair taller than the pane, so the pane itself takes every swipe) */
.pane .top{display:flex;align-items:center;gap:10px;margin:0 0 10px;}
.pane .top .back{width:44px;height:44px;border-radius:15px;border:0;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text);display:grid;place-items:center;flex:none;}
.pane .top .back svg{width:22px;height:22px;}
.pane .top .t{min-width:0;}
.pane .top .t b{display:block;font:800 1.35rem/1.1 var(--display);letter-spacing:-.02em;}
.pane .top .t small{display:block;font-size:.8rem;font-weight:700;color:var(--text-3);}
.pane .top .t{flex:1;}
.pane .top .star{width:44px;height:44px;border-radius:15px;border:0;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text-3);display:grid;place-items:center;flex:none;transition:transform .2s var(--ease),color .2s,background .2s;}
.pane .top .star svg{width:22px;height:22px;}
.pane .top .star.on{color:var(--lit);background:rgba(255,211,77,.14);box-shadow:inset 0 0 0 1px rgba(255,211,77,.6);}
.pane .top .star.on svg{fill:currentColor;}
.pane .top .star.pop{animation:mkstar .45s var(--ease);}
@keyframes mkstar{40%{transform:scale(1.25) rotate(-12deg);}100%{transform:none;}}
.chip svg{width:14px;height:14px;margin:-2px 5px 0 -2px;vertical-align:middle;fill:var(--lit);color:var(--lit);}
.mk-blurb{margin:0 0 8px;font-size:.84rem;color:var(--text-2);}
.mk-sub{margin:0 -14px 6px;padding:2px 14px 6px;}
.mk-sub .chip{min-height:34px;font-size:.82rem;}
.mk-h2{margin-top:18px;}
.mk-more{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;padding:12px;border-radius:var(--r);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);font-size:.86rem;font-weight:700;color:var(--text-2);}
.mk-more span{flex:1 1 180px;}
.lite-card{width:100%;text-align:left;color:inherit;font:inherit;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin:12px 0 2px;padding:14px;border:0;border-radius:var(--r);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);}
.lite-card .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gl-3);color:var(--lit-ink);}
.lite-card .ic svg{width:22px;height:22px;}
.lite-card b{display:block;font-size:.95rem;font-weight:900;}
.lite-card small{display:block;font-size:.82rem;font-weight:700;color:var(--text-2);margin-top:2px;}
.daybar{position:relative;height:10px;border-radius:5px;background:var(--well);margin:14px 0 6px;}
.daybar i{position:absolute;top:0;bottom:0;border-radius:5px;}
.daybar + .ends{display:flex;justify-content:space-between;font-size:.76rem;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;}
.about{font-size:.9rem;line-height:1.45;color:var(--text-2);margin:0;}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;}
.kv div{min-width:0;}
.kv b{display:block;font-size:1.05rem;font-weight:900;font-variant-numeric:tabular-nums;}
.tradebar{position:sticky;bottom:calc(var(--safe-b) + 8px);display:flex;gap:10px;margin-top:12px;z-index:2;}
.tradebar button{flex:1;min-height:52px;font-size:1rem;}

/* trade ticket (sheet) */
.tt .seg{margin:0 0 12px;}
.amtbox{display:flex;align-items:center;gap:10px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:var(--r);padding:6px 12px;margin:0 0 10px;}
.amtbox span{font:800 1.6rem var(--display);color:var(--text-3);}
.amtbox input::-webkit-inner-spin-button,.amtbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.amtbox input{-moz-appearance:textfield;appearance:textfield;flex:1;min-width:0;border:0;background:none;color:var(--text);font:800 1.9rem var(--display);padding:6px 0;outline:none;font-variant-numeric:tabular-nums;}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;}
.qchips button{border:0;border-radius:13px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text-2);padding:7px 12px;font:inherit;font-weight:650;font-size:.85rem;}
.sum{display:grid;gap:6px;margin:6px 0 4px;}
.sum div{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;font-weight:700;color:var(--text-2);}
.sum div b{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;}
.sum .tot{border-top:1px solid var(--gl-line);padding-top:8px;font-size:1rem;}
.why{font-size:.84rem;line-height:1.4;color:var(--text-3);margin:8px 0 0;}
.warn{border-radius:12px;padding:10px 12px;background:rgba(255,200,61,.12);color:#ffd970;font-size:.86rem;font-weight:700;line-height:1.4;margin:10px 0 0;}

/* trade confirmation */
.conf{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;background:rgba(5,3,14,.0);animation:confbg 1.6s ease both;}
@keyframes confbg{0%{background:rgba(5,3,14,0)}15%,80%{background:rgba(5,3,14,.55)}100%{background:rgba(5,3,14,0)}}
.conf .card{position:relative;width:min(84vw,330px);background:#f4f2ec;color:#1d1d22;border-radius:6px;padding:16px 16px 18px;font-family:var(--mono);box-shadow:0 20px 50px rgba(0,0,0,.6);animation:confin 1.6s cubic-bezier(.2,1.3,.4,1) both;}
@keyframes confin{0%{transform:translateY(60px) scale(.9);opacity:0}15%{transform:none;opacity:1}80%{transform:none;opacity:1}100%{transform:translateY(-40px) scale(.95);opacity:0}}
.conf .card .h{font:400 1.1rem var(--display);letter-spacing:.04em;text-transform:uppercase;}
.conf .card .l{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:6px;}
.conf .card .st{position:absolute;right:12px;top:12px;transform:rotate(-10deg);border:3px solid #16924a;color:#16924a;border-radius:7px;padding:1px 8px;font:400 1.3rem var(--display);letter-spacing:.06em;animation:stampin .4s .35s cubic-bezier(.2,1.6,.4,1) both;mix-blend-mode:multiply;}
.conf .card .st.sell{border-color:#c0392b;color:#c0392b;}
@keyframes stampin{0%{transform:rotate(-10deg) scale(2.2);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}

/* options chain */
.chain{display:grid;gap:0;}
.chain .crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid var(--gl-line);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left;width:100%;}
.chain .crow.itm{background:linear-gradient(90deg,rgba(61,220,132,.08),transparent 70%);}
.chain .crow .k{font-weight:900;font-size:1rem;font-variant-numeric:tabular-nums;}
.chain .crow .k small{display:block;font-size:.72rem;font-weight:700;color:var(--text-3);}
.chain .crow .pr{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;}
.chain .crow .pr small{display:block;font-size:.72rem;font-weight:700;color:var(--text-3);}
.chain .spot{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.8rem;font-weight:700;color:var(--lit-ink);}
.chain .spot::before,.chain .spot::after{content:"";flex:1;height:1px;background:var(--lit);opacity:.6;}
.payoff{display:block;width:100%;height:auto;margin:8px 0 4px;}

/* bonds */
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.bcard{border:0;text-align:left;color:var(--text);font:inherit;border-radius:var(--r);padding:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--green) 14%,transparent),var(--gl) 60%);box-shadow:inset 0 0 0 1px var(--gl-line),var(--shadow-sm);}
.bcard .y{font:800 1.7rem/1 var(--display);color:var(--green);margin:6px 0 4px;font-variant-numeric:tabular-nums;}
.bcard b{display:block;font-size:.95rem;font-weight:900;}
.bcard small{display:block;font-size:.74rem;font-weight:600;color:var(--text-2);line-height:1.3;}

/* lessons */
.lessons{display:grid;gap:10px;}
.lesson{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:0;text-align:left;width:100%;color:var(--text);font:inherit;padding:12px;border-radius:var(--r);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);}
.lesson .n{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--gl-3);color:var(--lit-ink);font:800 1.1rem var(--display);}
.lesson.done .n{background:#1d6b41;color:#fff;}
.lesson .n svg{width:20px;height:20px;}
.lesson b{display:block;font-weight:900;}
.lesson small{display:block;font-size:.8rem;color:var(--text-3);font-weight:700;}
.lesson .go svg{width:20px;height:20px;color:var(--text-3);}
.lsn{font-size:.98rem;line-height:1.55;color:var(--text-2);}
.lsn h4{margin:18px 0 6px;font:800 1.15rem var(--display);letter-spacing:-.015em;color:var(--text);}
.lsn p{margin:0 0 10px;}
.lsn b{color:var(--text);}
.lsn .ex b{color:var(--text);}
.lsn .ex{background:var(--well);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:var(--r);padding:12px 14px;margin:10px 0 12px;color:var(--text-2);font-size:.92rem;}
.lsn .ex .cap{display:block;margin-bottom:4px;}
.lsn svg.fig{display:block;width:100%;height:auto;margin:6px 0;}
.lsn ul{margin:0 0 10px;padding-left:20px;}
.lsn li{margin:0 0 5px;}

/* tax center */
.taxt{width:100%;border-collapse:collapse;font-size:.92rem;}
.taxt td{padding:7px 2px;border-top:1px solid var(--gl-line);color:var(--text-2);font-weight:700;}
.taxt td:last-child{text-align:right;color:var(--text);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;}
.taxt tr.tot td{font-size:1rem;}

@media (min-width:900px),(orientation:landscape) and (min-width:640px){
  .mk{max-width:1200px;display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:18px;}
  .mk-side{display:block;position:sticky;top:calc(var(--bar) + 4px);align-self:start;max-height:calc(100dvh - var(--bar) - 10px);overflow-y:auto;scrollbar-width:none;}
  .mk-side::-webkit-scrollbar{display:none;}
  .tapes{grid-column:1/-1;margin:2px 0 4px;}
  .chips{margin:0 0 10px;padding:2px 0 4px;}
}

/* ════════════════════════════════════════════════════════════════════════════════════════════════════════════
   THE DESK (html.mk-desk, set by the script's arrange()): a laptop or desktop window of any shape. A trading desk:
   what a phone shows a tab or a sheet at a time stands open side by side. The account at the left (its value
   through time, what it is in, what you own), the market in the middle (the chosen stock large with its chart, the
   board of the group it is in as tiles with a chart each), and at the right, where you act, the ticket to buy and
   sell it, your cash, and your orders and trades. Nothing is scaled: every panel is sized from the window by
   deskPlan(), charts are drawn at their own pixels, and the bar, sheets and buttons keep their size. A phone and a
   tablet never get the class (deskPlan says null), so nothing below reaches them.
   ════════════════════════════════════════════════════════════════════════════════════════════════════════════ */
html.mk-desk,html.mk-desk body{overflow:hidden;overscroll-behavior:none;}
html.mk-desk .mk{max-width:none;margin:0;display:flex;flex-direction:column;gap:12px;height:var(--mkh,100vh);box-sizing:border-box;padding:0 16px 16px;}
html.mk-desk .mk > .mk-side{display:none;}
html.mk-desk .tapes{flex:none;margin:2px -16px 0;}
html.mk-desk .dk{flex:1 1 0;min-height:0;display:flex;gap:14px;}
html.mk-desk .dk-col{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;flex:1 1 0;}
html.mk-desk .dk-col.fx{flex:none;}
html.mk-desk .dk-col > *{min-width:0;}
html.mk-desk .dk.tall{flex-direction:column;gap:12px;}
html.mk-desk .dk.tall > *{min-width:0;}

      [['Short-term gains', signed(o.st, 1)], ['Long-term gains', signed(o.lt, 1)], ['Interest', money(o.int, 1)], ['Dividends', money(o.div, 1)], o.carryIn ? ['Losses from last year', '−' + money(o.carryIn, 1)] : null, o.carryOut ? ['Losses carried to next year', money(o.carryOut, 1)] : null,

  }

  // ── Learn ──
  var LESSONS = [
    { id: 'stocks', t: 'What a stock is', s: 'Owning a tiny piece of a company', try: ['sym', 'AAPL'] },
    { id: 'orders', t: 'Buying and selling', s: 'Market orders, limit orders, fractional shares', try: ['sym', 'NTDOY'] },
    { id: 'index', t: 'Index funds', s: 'Owning the whole market in one share', try: ['sym', 'VOO'] },
    { id: 'risk', t: 'Risk and diversification', s: 'Why one basket is a bad idea', try: ['grp', 'index'] },
    { id: 'divs', t: 'Dividends and compounding', s: 'Getting paid to own, and growth on growth', try: ['sym', 'SCHD'] },
    { id: 'bonds', t: 'Bonds and Treasuries', s: 'Lending money, and why bond prices move', try: ['grp', 'tbond'] },
    { id: 'options', t: 'Options: calls and puts', s: 'Betting on where a price goes, with a deadline', try: ['opt', 'AAPL'] },
    { id: 'crypto', t: 'Crypto', s: 'Coins with no company behind them', try: ['sym', 'BTC-USD'] },
    { id: 'taxes', t: 'Taxes on investing', s: 'Short-term, long-term, losses and accounts that skip tax', try: ['tax'] },
    { id: 'plan', t: 'A simple plan', s: 'What most experts say to do', try: ['grp', 'index'] }
  ];
  var LESSON_LV = { bonds: 1, crypto: 1, taxes: 1, options: 2 };
  function lessons() { return LESSONS.filter(function (l) { return (LESSON_LV[l.id] || 0) <= lvl(); }); }
  function paintLearn() {
    var LESSONS = lessons(), b = dom.body, done = LESSONS.filter(function (l) { return LEARN[l.id]; }).length;
    var p = el('div', { class: 'pnl' + (DK.on ? ' lhead' : '') });
    p.appendChild(el('h3', null, [el('span', { text: 'How investing works' }), el('span', { text: done + ' of ' + LESSONS.length + ' read' })]));
    p.appendChild(el('p', { class: 'about', text: 'Short lessons with real numbers from today’s market. Each ends with something to try.' }));
    b.appendChild(p);
    var list = el('div', { class: 'lessons' });

      list.appendChild(el('button', { type: 'button', class: 'lesson' + (LEARN[l.id] ? ' done' : ''), onclick: function () { openLesson(l); } }, [

  function openLesson(l) {

    if (l.id === 'index' && DET.VOO === undefined) loadDetail('VOO').then(function () { if (body.isConnected) body.innerHTML = lessonHtml(l.id); });
    var tryBtn = el('button', { type: 'button', class: 'btn btn-primary', style: { width: '100%', 'min-height': '54px', margin: '16px 0 8px' }, text: tryLabel(l), onclick: function () {
      LEARN[l.id] = Date.now(); lsSet(LK, LEARN); Kit.sfx('good');
      var t = l.try;
      if (t[0] === 'sym') openSym(t[1]);

    } });
    w.appendChild(tryBtn);
    w.appendChild(el('button', { type: 'button', class: 'btn btn-soft', style: { width: '100%', 'min-height': '48px' }, text: 'Got it', onclick: function () { LEARN[l.id] = Date.now(); lsSet(LK, LEARN); Kit.sfx('good'); closePane(); } }));
    openPane('lesson');
  }
  function tryLabel(l) { var t = l.try; return t[0] === 'sym' ? 'Look at ' + (S(t[1]) ? S(t[1]).n : t[1]) : t[0] === 'opt' ? 'See Apple’s options' : t[0] === 'tax' ? 'See your taxes' : t[1] === 'tbond' ? 'See Treasuries' : 'See index funds'; }
  function ex(cap, html) { return '<div class="ex"><span class="cap">' + cap + '</span>' + html + '</div>'; }
  function lessonHtml(id) {
    var aapl = price('AAPL') || 230, voo = price('VOO') || 550, tsla = S('TSLA'), spy = S('SPY'), t10 = (rate('tnx') * 100).toFixed(2), bill = (rate('irx') * 100).toFixed(2);
    var oneYr = function (sym) { var se = series(sym); return se.length > 200 ? (price(sym) - se[0][1]) / se[0][1] : null; };
    var L = {
      stocks: '<p>A company is owned by its <b>shareholders</b>. Apple, for example, is split into about 15 billion pieces called <b>shares</b>. Buy one and you own a tiny slice of Apple: its stores, its profits, all of it.</p>' +
        ex('Right now', 'One Apple share costs <b>' + px(aapl) + '</b>. Buy $100 worth and you own ' + shares(100 / aapl) + ' of a share.') +
        '<h4>Why prices move</h4><p>A share is worth what someone will pay for it. When people expect a company to earn more in the future, they pay more and the price rises. Bad news, or a gloomy economy, and it falls. Day to day it can look random; over many years, prices tend to follow how much the company actually earns.</p>' +
        '<h4>How you make or lose money</h4><ul><li><b>The price rises</b> and you sell for more than you paid. That profit is a <b>capital gain</b>.</li><li>Some companies share profits as <b>dividends</b>, paid in cash to everyone who owns shares.</li><li><b>The price falls</b> and you sell for less: a loss. A company can even go out of business, and its shares go to zero.</li></ul>',
      orders: '<p>Every stock has a <b>ticker symbol</b>: AAPL is Apple, NTDOY is Nintendo, UAL is United Airlines.</p>' +
        '<h4>Two kinds of order</h4><ul><li>A <b>market order</b> (Buy now) buys at the current price.</li><li>A <b>limit order</b> sets your price: “buy Nintendo, but only at $15 or less.” If the price never gets there, nothing happens. Limit orders keep you from paying more than you meant to.</li></ul>' +
        '<h4>Pieces of a share</h4><p>Most brokers now sell <b>fractional shares</b>: you can buy $50 of a $500 stock. This app does too. Type a dollar amount, or a number of shares.</p>' +
        ex('How this app works', 'Real markets trade every second, 9:30 AM to 4 PM New York time on weekdays. Here, prices update every hour while the market is open, and once more after the close, so check in whenever you like. Buy now fills at the latest price; a limit order waits for a later update.') +
        '<p><b>The bid and the ask.</b> Real stocks have two prices: the highest anyone will pay (bid) and the lowest anyone will sell for (ask). For big stocks they’re a penny apart; for options the gap is bigger, which you’ll see in Options.</p>',
      index: '<p>An <b>index</b> is a list of companies that stands for a market. The <b>S&P 500</b> is the 500 biggest US companies; the <b>Dow</b> is 30 famous ones; the <b>Nasdaq-100</b> is the 100 biggest on the Nasdaq.</p>' +
        '<p>An <b>index fund</b> buys every company on the list, so one share of the fund owns a sliver of all of them. Most are <b>ETFs</b> (exchange-traded funds) that trade just like a stock.</p>' +
        ex('In one share', 'One share of VOO (' + px(voo) + ') owns pieces of all 500: Apple, Microsoft, Nvidia, Amazon, Coca-Cola, Delta, and 494 more.' + (oneYr('VOO') != null ? ' Over the past year it’s ' + (oneYr('VOO') >= 0 ? 'up ' : 'down ') + Math.abs(oneYr('VOO') * 100).toFixed(1) + '%.' : '')) +
        '<h4>Why so many people use them</h4><ul><li><b>Instant variety.</b> One company can have a disaster; 500 rarely do at once.</li><li><b>Low fees.</b> VOO charges 0.03% a year: $3 on $10,000. Actively managed funds often charge 0.5% to 1%.</li><li><b>Hard to beat.</b> Year after year, most professional stock pickers do worse than the plain S&P 500 after fees.</li></ul>' +
        '<p><b>Mutual funds</b> are the older cousin: similar idea, but you buy at the end-of-day price directly from the fund company. Many 401(k) plans use them.</p>',
      risk: '<p><b>Risk</b> is how much an investment can swing, and how much you could lose. Higher risk usually comes with a chance of higher reward, but no promise of it.</p>' +
        (tsla && spy ? ex('Past year', 'Tesla moved about <b>' + Math.round(vol('TSLA') * 100) + '%</b> a year in swings; the S&P 500 about <b>' + Math.round(vol('SPY') * 100) + '%</b>. Same market, very different rides.') : '') +
        '<h4>Don’t put all your eggs in one basket</h4><p><b>Diversification</b> means owning many different things, so one bad one can’t sink you. Mix big and small companies, US and international, stocks and bonds.</p>' +
        '<ul><li><b>Stocks</b> grow the most over time but can drop 30% or more in a bad year.</li><li><b>Bonds</b> grow slower and swing less.</li><li><b>Cash</b> barely moves, and inflation slowly eats it.</li></ul>' +
        '<p>Time helps: over any single year the S&P 500 might be down, but over 20-year stretches it has always ended up higher in its history. That’s why money you need soon belongs in safer places.</p>',
      divs: '<p>A <b>dividend</b> is cash a company pays its shareholders out of profits, usually every three months. Coca-Cola has raised its dividend every year for more than 60 years.</p>' +
        ex('Dividend yield', 'The <b>yield</b> is a year of dividends divided by the share price. A $100 stock paying $3 a year yields 3%. This app pays real dividends: own a stock before its dividend date and the cash lands in your account.') +
        '<h4>Compounding</h4><p>Reinvest dividends and gains, and next year you earn on a bigger pile. That’s <b>compounding</b>: growth on growth.</p>' +
        ex('The rule of 72', 'Divide 72 by a yearly return to see how long money takes to double. At 7% a year: about 10 years. At 10%: about 7. $1,000 at 7% becomes about $7,600 in 30 years without adding a dollar.'),
      bonds: '<p>A <b>bond</b> is a loan you make. You lend money to a government or company; it pays you <b>interest</b> along the way and your money back at the end (the <b>maturity</b> date).</p>' +
        '<h4>US Treasuries</h4><p>Loans to the US government, considered the safest investment in the world. </p>' +
        ex('Today’s rates', '13-week T-bill: <b>' + bill + '%</b> a year. 10-year Treasury note: <b>' + t10 + '%</b> a year.') +
        '<h4>The seesaw: rates up, bond prices down</h4><p>Say you own a bond paying 4%, and new bonds start paying 5%. Nobody will pay full price for your 4% bond anymore, so its price drops. When rates fall, your bond is worth more. Longer bonds swing more, because the difference lasts longer.</p>' +
        '<svg class="fig" viewBox="0 0 320 90"><line x1="40" y1="45" x2="280" y2="45" stroke="#7f8aa0" stroke-width="3"/><polygon points="160,45 150,70 170,70" fill="#7f8aa0"/><line x1="60" y1="25" x2="260" y2="65" stroke="#eef2f8" stroke-width="5" stroke-linecap="round"/><text x="60" y="16" fill="#ff6470" font-size="13" font-weight="800">Rates up</text><text x="190" y="86" fill="#ff6470" font-size="13" font-weight="800">Bond prices down</text></svg>' +
        '<p>Hold a Treasury to maturity and none of that matters: you get exactly what was promised. <b>Bond funds</b> like BND hold thousands of bonds and pay their interest as monthly dividends. <b>Corporate bonds</b> pay more than Treasuries because companies are riskier; <b>junk bonds</b> pay more still.</p>',
      options: '<p>An <b>option</b> is a contract that gives you the right to buy or sell 100 shares at a set price (the <b>strike</b>) until a set date (the <b>expiration</b>). You pay a price for it, the <b>premium</b>.</p>' +
        '<ul><li>A <b>call</b> is a bet the stock goes <b>up</b>. If it ends above the strike, the call is worth the difference.</li><li>A <b>put</b> is a bet it goes <b>down</b>, or insurance on shares you own.</li></ul>' +
        ex('Example', 'Apple is at ' + px(aapl) + '. A call with a ' + px(Math.round(aapl / 5) * 5 + 10) + ' strike ending next month might cost about ' + money(optQuote('AAPL', Math.round(aapl / 5) * 5 + 10, fridays()[1], true).ask * 100, 1) + '. If Apple ends at ' + px(Math.round(aapl / 5) * 5 + 30) + ', it’s worth $2,000. If Apple ends below the strike, it’s worth nothing.') +
        '<h4>Why they’re risky</h4><p>Options move much faster than the stock: small stock moves become big percentage gains or losses. And they have a deadline. Most options bought by regular investors expire worthless. The most you can lose buying one is what you paid.</p>' +
        '<p>This app shows each option’s <b>breakeven</b> price, its <b>chance</b> of ending in the money, and a chart of what you’d make or lose at every stock price. Selling options to other people (writing them) is riskier still, and isn’t offered here.</p>',
      crypto: '<p><b>Cryptocurrencies</b> like Bitcoin are digital money kept on a shared public record (a blockchain) instead of by a bank. There’s no company, no profits and no dividends behind them; a coin is worth whatever people will pay.</p>' +
        ex('Swings', 'Bitcoin has swung about <b>' + Math.round(vol('BTC-USD') * 100) + '%</b> a year recently, against about ' + Math.round(vol('SPY') * 100) + '% for the S&P 500. It has dropped more than 70% several times, and climbed back.') +
        '<p>Crypto trades every day, all day, even on holidays. Gains are taxed like stocks. Many investors who own it keep it to a small slice of their money.</p>',
      taxes: '<p>When you sell something for more than you paid, the profit is a <b>capital gain</b>, and it’s taxed. Gains only count once you sell; a stock that’s up but unsold isn’t taxed yet.</p>' +
        '<h4>Short-term and long-term</h4><ul><li>Held <b>a year or less</b>: a <b>short-term</b> gain, taxed like your paycheck (your bracket: 10% to 37%).</li><li>Held <b>over a year</b>: <b>long-term</b>, taxed at 0%, 15% or 20%. Most people pay 15%.</li></ul>' +
        ex('Same gain, different tax', 'A $1,000 gain in the 22% bracket: <b>$220</b> tax if held 11 months, <b>$150</b> if held 13 months.') +
        '<h4>Losses help</h4><p>Losses cancel out gains. If losses are bigger, up to $3,000 a year can come off other income, and the rest carries to next year. (The <b>wash sale</b> rule: buy the same stock back within 30 days of selling at a loss and you can’t count the loss yet.)</p>' +
        '<h4>Other income</h4><p><b>Interest</b> is taxed like income. Treasury interest skips state tax; most <b>municipal bond</b> interest skips federal tax. <b>Dividends</b> from most US companies get the lower long-term rate.</p>' +
        '<h4>Accounts that skip tax</h4><p>A <b>401(k)</b> or <b>traditional IRA</b> lets money grow untaxed until you take it out in retirement. A <b>Roth IRA</b> is taxed going in but never again. Most long-term investing happens in these.</p>' +
        ex('In this app', 'Gains, interest and dividends add up through the year. When you cash out to your bankroll, the tax you owe comes out first. Set your bracket in Taxes.'),
      plan: '<p>Nobody can predict next month’s market. Here’s what most experts suggest instead:</p>' +
        '<ul><li><b>Emergency money first.</b> Keep a few months of expenses in savings before investing.</li><li><b>Use the accounts that skip tax</b>: a 401(k), especially when an employer matches, and an IRA.</li><li><b>Mostly index funds.</b> Cheap, diversified, and hard to beat.</li><li><b>Add a little every month</b> no matter what prices do. That’s <b>dollar-cost averaging</b>: you automatically buy more shares when prices are low.</li><li><b>More bonds as you get closer</b> to needing the money.</li><li><b>Don’t panic.</b> Selling in a crash locks in the loss. Time in the market beats timing the market.</li></ul>' +
        ex('A classic mix', 'A total US stock fund (VTI), an international fund (VXUS) and a bond fund (BND). Three funds, thousands of companies and bonds, tiny fees.')
    };
    return L[id] || '';
  }

  // ── Shell ──
  var report = null;
  function depthTitle() { var d = DEPTHS.filter(function (x) { return x.id === DEPTH; })[0]; return d ? d.title : ''; }
  var depthItem = { icon: 'sliders', label: 'How deep to go', sub: depthTitle(), onClick: depthSheet };
  function depthSheet() { Kit.depth({ key: 'mk_depth', levels: DEPTHS, value: DEPTH || 'pro', onPick: setDepth }); }
  function setDepth(d) {
    DEPTH = d; depthItem.sub = depthTitle();
    if (!dom.main) { layout(); return; }
    if (tab === 'learn' || tab === 'mkt') window.scrollTo(0, 0);
    if (DK.on || deskPlan()) { DK.mode = 'sym'; dom.paneIn.innerHTML = ''; arrange(); return; }   // (the desk: the ticket's height goes with the depth)
    if (dom.pane.classList.contains('on')) closePane(); else paint();
  }
  Kit.init({
    id: 'stocks',
    sync: function () { return refreshAll(); },
    menu: [
      depthItem,
      { icon: 'chart', label: 'Taxes', when: taxesOn, onClick: taxSheet },
      { icon: 'book', label: 'Lessons', onClick: function () { closePane(); tab = 'learn'; paint(); } },
      { icon: 'history', label: 'Bankroll history', onClick: function () { Casino.showHistory(); } },
      { icon: 'undo', label: 'Reset bankroll', onClick: function () { Kit.confirm('Reset your casino bankroll to $1,000? Your investing account stays as it is.', { ok: 'Reset', danger: true }).then(function (y) { if (y) { Casino.reset(); Kit.toast('Bankroll reset to $1,000'); } }); } }
    ],
    rules:
      '<p class="goal">Invest your casino bankroll in the real stock market. Prices are real and update every hour while the market is open.</p>' +
      '<h3>How deep to go</h3><p>Pick how much of the market you want (menu, How deep to go): well-known stocks and index funds; the whole market with bonds, Treasuries, crypto, limit orders and taxes; or everything, with options and your own tax bracket.</p>' +
      '<h3>Getting started</h3><ul><li><b>Add money</b> from your bankroll. It waits as cash, earning the T-bill rate.</li><li>Open <b>Market</b>, pick something and tap <b>Buy</b>. Buy by dollars or shares.</li><li><b>Buy now</b> fills at the latest price. A <b>limit order</b> waits for a later price update.</li></ul>' +
      '<h3>What you can own</h3><ul><li>Every stock and fund listed in the US, and fifteen coins. Search by name or symbol; star one to keep it on your watchlist. Real dividends are paid to your cash.</li><li><b>Treasuries</b> (Market, Treasuries): bills, notes and bonds at today’s rates, with interest every six months.</li><li><b>Options</b> (on any stock or fund): buy calls and puts, sell them back any time, settled in cash at the end date.</li></ul>' +
      '<h3>Cashing out and taxes</h3><p>Gains count for tax when you sell. Short-term gains (held a year or less) and interest are taxed at your bracket; long-term gains and dividends at the lower rate. Losses offset gains. When you cash out to your bankroll, the tax you owe comes out first; the app shows you before you confirm.</p>' +
      '<p>The <b>Learn</b> tab explains everything, with today’s real numbers.</p>'
  });

  // The uncommon days get a moment, worked out against the last visit before it is overwritten: a holding that has doubled
  // since it was bought (crossed since the last visit), or the account reaching a new step of 10% up all-time, at a new high
  function rareMoment() {
    var mo = null, base = A.dep - A.wd;
    holdings().forEach(function (h) {
      var was = A.lastPx[h.sym]; if (mo || !was || !h.cost) return;
      if (h.val >= 2 * h.cost && was * h.q < 2 * h.cost) mo = { chip: h.sym, title: h.sym + ' has doubled', line: 'What you hold of ' + h.sym + ' is worth ' + money(h.val, 1) + ', twice the ' + money(h.cost, 1) + ' it cost.', pts: '+' + money(h.val - h.cost) };
    });
    if (!mo && base > 0 && A.vals.length) {
      var v = totals().all, hi = Math.max.apply(null, A.vals.map(function (x) { return x[1]; }));
      var g = (v - base) / base, gh = (hi - base) / base, step = Math.floor(g * 10);
      if (v > hi && step >= 1 && step > Math.floor(gh * 10)) mo = { chip: '+' + step * 10 + '%', title: 'Up ' + step * 10 + '% all-time', line: 'Your account is worth ' + money(v, 1) + ', a new high, ' + money(v - base, 1) + ' more than you put in.', pts: '+' + money(v - base), big: step >= 5 };
    }
    if (mo) setTimeout(function () { mo.at = null; mo.color = '#1f9d55'; Kit.moment(mo); Kit.sfx('win'); Kit.haptic('success'); if (mo.big) Kit.confetti({ count: 150 }); }, 900);
  }
  function start() {
    var ev = catchUp();
    // how holdings moved since the last visit
    if (A.last && Q) {
      var v = totals().all, d = v - (A.lastVal || v);
      if (Math.abs(d) >= .01 && (A.lots.length || A.opts.length)) ev.unshift(['Your account since ' + dateTxt(A.last), signed(d, 1)]);
      holdings().forEach(function (h) { var was = A.lastPx[h.sym]; if (was) { var c = (price(h.sym) - was) / was; if (Math.abs(c) >= .03) ev.push([h.sym + (c > 0 ? ' up ' : ' down ') + Math.abs(c * 100).toFixed(1) + '%', signed((price(h.sym) - was) * h.q, 1)]); } });
      if (d > Math.max(250, (A.lastVal || 0) * .05)) setTimeout(function () { Kit.confetti(); Kit.sfx('win'); }, 500);
    }
    if (ev.length) report = ev;
    if (Q) rareMoment();
    if (Q) { A.last = Date.now(); A.lastVal = totals().all; A.lastPx = {}; holdings().forEach(function (h) { A.lastPx[h.sym] = price(h.sym); }); recordValue(); }
    save(); if (dom.main) paint();
    Kit.resume.clear();   // (an investing account isn't a game in progress: it isn't in Keep playing, and doesn't start over)
  }
  // First load: how deep to go (an account already in use starts with everything, so nothing it holds goes missing)
  if (!DEPTH) Kit.depth({ host: app, key: 'mk_depth', levels: DEPTHS, value: A.dep || A.lots.length || A.tx.length ? 'pro' : 'basic', start: 'Open the market', onPick: setDepth });
  else layout();
  if (!DEMO) loadQuotes().then(ensureAll).then(start);
  // the latest prices, and anything they settle (orders filled, options expired, dividends): on coming back, or Sync now
  function refreshAll() { return loadQuotes().then(ensureAll).then(function () { var ev = catchUp(); if (ev.length) report = (report || []).concat(ev); save(); if (dom.main && (DK.on || !dom.pane.classList.contains('on'))) paint(); }); }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshAll(); });
  window.__mk = { sym: function () { return dom.paneSym; }, desk: function () { return DK.on ? DK.P : null; }, demoMarket: function (q, depth) { Q = q; setDepth(depth || 'basic'); start(); }, tab: function (t) { closePane(); tab = t; paint(); }, loadAll: loadAll, depth: function () { return DEPTH; }, setDepth: setDepth, ALL: function () { return ALL; }, open: function (s) { openSym(s); }, A: function () { return A; }, Q: function () { return Q; }, catchUp: catchUp, taxYears: taxYears, withdrawPlan: withdrawPlan, buy: buy, sell: sell, paint: paint, setQ: function (q) { Q = q; }, totals: totals };
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Invaders</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>

<style>
/* ── Play view: the LED game screen on top, a plain control strip under it (beside it when turned) ── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:2px 10px calc(var(--safe-b) + 8px);
  display:grid;gap:10px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#app.lay-port{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--deck-h,168px);grid-template-areas:"scr" "deck";}
#app.lay-land{grid-template-columns:var(--side-w,170px) minmax(0,1fr) var(--side-w,170px);grid-template-rows:minmax(0,1fr);grid-template-areas:"l scr r";
  padding-left:calc(env(safe-area-inset-left,0px) + 8px);padding-right:calc(env(safe-area-inset-right,0px) + 8px);}
#app.lay-desk{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"scr" "hint";}
#app.lay-port .inv-side,#app.lay-land .inv-deck,#app.lay-desk .inv-deck,#app.lay-desk .inv-side,#app:not(.lay-desk) .ar-hint{display:none;}
.inv-scr{grid-area:scr;position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;}
.inv-box{position:relative;}
.inv-box canvas{display:block;border-radius:14px;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.inv-box.mouse canvas{cursor:none;}
.ar-ov{position:absolute;inset:0;border-radius:14px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(270px,84%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
.ar-hint{grid-area:hint;font-size:.8rem;color:var(--text-3);text-align:center;font-weight:700;}
/* ── Controls: clean and plain ── */
.inv-deck{grid-area:deck;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:6px;min-height:0;}
.inv-side{display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:8px;min-height:0;padding:4px 0 2px;}
.inv-side.l{grid-area:l;} .inv-side.r{grid-area:r;}
.inv-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.inv-cell{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;}
.inv-sz,.inv-fz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none;width:100%;height:100%;min-height:0;}
.inv-side .inv-sz,.inv-side .inv-fz{height:auto;flex:1;justify-content:flex-end;}
.inv-lab{font-size:.68rem;font-weight:800;letter-spacing:.06em;color:var(--text-3);white-space:nowrap;}
.inv-stick{position:relative;flex:none;width:var(--stick,140px);height:var(--stick,140px);border-radius:50%;
  background:var(--surface);box-shadow:inset 0 0 0 2px var(--line-2),inset 0 6px 14px var(--inset);transition:box-shadow .12s;}
.inv-stick::before{content:"";position:absolute;inset:30%;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);}
.inv-stick.on{box-shadow:inset 0 0 0 2px var(--accent),inset 0 6px 14px var(--inset);}
.inv-stick .ar{position:absolute;width:0;height:0;border:5px solid transparent;opacity:.5;}
.inv-stick .ar.n{left:50%;top:8%;margin-left:-5px;border-bottom-color:var(--text-2);border-top:0;}
.inv-stick .ar.s{left:50%;bottom:8%;margin-left:-5px;border-top-color:var(--text-2);border-bottom:0;}
.inv-stick .ar.w{top:50%;left:8%;margin-top:-5px;border-right-color:var(--text-2);border-left:0;}
.inv-stick .ar.e{top:50%;right:8%;margin-top:-5px;border-left-color:var(--text-2);border-right:0;}
.inv-knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;will-change:transform;
  background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--line-2),0 6px 12px var(--shade);}
.inv-knob::after{content:"";position:absolute;inset:26%;border-radius:50%;background:var(--accent);opacity:.9;}
.inv-sz.c1 .inv-knob::after{background:#ff8a3d;} .inv-sz.c2 .inv-knob::after{background:#4aa8ff;}
.inv-knob.spring{transition:transform .22s var(--spring);}
.inv-fire{flex:none;width:var(--fire,104px);height:var(--fire,104px);border-radius:50%;border:0;
  font-family:var(--display);font-size:calc(var(--fire,104px) * .2);letter-spacing:.06em;
  background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 6px 14px var(--shade);transition:transform .05s;}
.inv-fire.on{transform:scale(.94);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 2px 8px var(--shade);}
.inv-pbtn{flex:none;width:46px;height:38px;border:0;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text);
  background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line);}
.inv-pbtn:active{transform:scale(.94);}
.inv-pbtn svg{width:18px;height:18px;}
.inv-auto{flex:none;height:38px;padding:0 13px;border:0;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;gap:7px;
  font-weight:900;font-size:.85rem;letter-spacing:.06em;color:var(--text-2);background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line);}
.inv-auto i{width:9px;height:9px;border-radius:50%;background:var(--surface-3);}
.inv-auto.on{color:var(--text);box-shadow:inset 0 0 0 1.5px var(--accent);}
.inv-auto.on i{background:var(--accent);box-shadow:0 0 6px var(--accent);}
.inv-side .inv-top{display:flex;gap:8px;align-items:center;}
</style>
</head>

  // ═══ Power-ups ═══════════════════════════════════════════════════════════
  function dropPup(x, y, k) {

  // ═══ BOMBs (as on the Frenzy cabinet): orange B-balls bounce around the field until you shoot one.

  function stepBombs(dt) {

      var b = bombs[i]; if (b.dead) continue;

      if (b.y > bx.y1) { b.y = bx.y1; b.vy = -Math.abs(b.vy); b.bf = 1; } else if (b.y < bx.y0 && b.vy < 0) { b.vy = Math.abs(b.vy); b.bf = 1; }

    lasers.forEach(function (m) { if (!m.dead && Math.hypot(m.x - x, m.y - y) < BOMB_R + 10) popLaser(m, true); });
    saucers.forEach(function (u) { if (!u.dead && Math.hypot(u.x - x, u.y - y) < BOMB_R + u.w / 2) hurtSaucer(u, 3); });
    if (ufo && !ufo.dead && Math.hypot(ufo.x - x, ufo.y - y) < BOMB_R + 30) hurtUfo(3);

  // ═══ UFO bonus round: saucers zip across in groups; hit them in a row for a bigger streak bonus

        if (B.left <= 0 || (B.ships > 0 && B.left < 10 && Math.random() < 0.35)) {   // a gold bonus ship
          B.ships--; B.total++;
          saucers.push({ x: dir > 0 ? -70 : WW + 70, y0: y0, y: y0, vx: dir * sp * 0.7, amp: 30, f: 1.6, ph: 0, t: 0, hp: 3, ship: true, w: 88, h: 38, fl: 0, dead: false });
        } else {

  // ═══ The formation, divers, lasers ═══════════════════════════════════════
  function members() { var n = 0; for (var i = 0; i < invs.length; i++) if (!invs[i].dead && (invs[i].st === 'form' || invs[i].st === 'enter')) n++; return n; }
  // The fewer are left, the faster and pushier the swarm gets
  function stepFormation(dt) {
    if (!F) return;
    F.t += dt;
    var mn = 1e9, mx = -1e9, n = 0;
    for (var i = 0; i < invs.length; i++) { var v = invs[i]; if (v.dead || (v.st !== 'form' && v.st !== 'enter')) continue; n++; mn = Math.min(mn, v.hx - v.w / 2); mx = Math.max(mx, v.hx + v.w / 2); }
    if (!n) return;
    var w = G.wave, thin = 1 - n / F.total;
    if (F.mode === 'march') {
      F.stepT -= dt;
      if (F.stepT <= 0) {
        var base = Math.max(0.12, 0.55 - w * 0.012);
        F.stepT = Math.max(0.045, base * Math.pow(n / F.total, 0.65));
        var step = 8 + 5 * thin;
        if ((F.dir > 0 && F.x + mx + step > WW - 8) || (F.dir < 0 && F.x + mn - step < 8)) { F.dir = -F.dir; F.y += (11 + Math.min(w, 20) * 0.55) * (1 + 0.6 * thin); }
        else F.x += F.dir * step;
        F.anim ^= 1;
      }
    } else {
      F.sw = (F.sw || 0) + dt * (0.55 + w * 0.01) * (1 + 1.3 * thin);
      var amp = Math.max(0, (WW - (mx - mn)) / 2 - 10), c0 = (mn + mx) / 2;
      var tx = WW / 2 - c0 + amp * Math.sin(F.sw + F.ph);
      F.x += (tx - F.x) * Math.min(1, dt * 4);
      F.y += (2.5 + w * 0.35) * (1 + 1.8 * thin) * dt;
      F.animT += dt; if (F.animT > 0.42) { F.animT = 0; F.anim ^= 1; }
    }
  }
  function startDive(v, child, side) {
    var w = G.wave;
    v.st = 'dive';
    v.dv = { x0: v.x, t: 0, amp: child ? rnd(18, 40) : rnd(26, 70), f: rnd(1.6, 2.8), ph: child ? (side > 0 ? 0 : 3.14) : rnd(0, 6.28),
      vy: child ? -150 : 10, vmax: Math.min(200, (60 + w * 4) * (child ? 1.3 : 1)) };
    if (!child) G.stats.dives++;
  }
  function stepInvaders(dt) {

        v.u += dt / 1.35;
        var u = Math.min(1, v.u), e = 1 - Math.pow(1 - u, 2.2);
        var hx = F.x + v.hx, hy = F.y + v.hy;
        v.x = (1 - e) * (1 - e) * v.sx + 2 * (1 - e) * e * v.cx + e * e * hx;
        v.y = (1 - e) * (1 - e) * v.sy + 2 * (1 - e) * e * v.cy + e * e * hy;

      } else if (v.st === 'dive') {

        if (v.y + v.h / 2 > BUNK_Y) bkClearBox(v.x - v.w / 2, v.y - v.h / 2, v.x + v.w / 2, v.y + v.h / 2);   // divers smash through bunkers
        if (v.y + v.h / 2 >= BOTTOM) { v.dead = true; explode(v.x, BOTTOM - 6, v.col, v.big); hitBase(v.x, v.big ? 20 : 12); }
      }

      if (G.diveT <= 0) {

  }
  // the swarm reached the bunkers: game over

        G.lasT = rnd(0.6, 1.4) * Math.max(0.6, 3.1 - w * 0.11);
        var cand = invs.filter(function (v) { return !v.dead && v.st !== 'enter' && v.y > 30 && v.y < BUNK_Y - 60; });
        if (cand.length) { var v = pick(cand); lasers.push({ x: v.x, y: v.y + v.h / 2, vx: 0, vy: Math.min(230, 100 + w * 5), t: 0, orb: false, dead: false }); }

      var b = lasers[i]; if (b.dead) continue;

  // ═══ Mystery UFO and bosses ════════════════════════════════════════════════
  function stepUfo(dt) {
    if (G.type === 'normal' && G.phase === 'play' && !ufo) {
      G.ufoT -= dt;
      if (G.ufoT <= 0 && members() > 3) {
        var dir = Math.random() < 0.5 ? 1 : -1;
        ufo = { x: dir > 0 ? -50 : WW + 50, y: 98, vx: dir * (120 + G.wave * 3), hp: 2, dead: false, t: 0 };
        G.ufoT = rnd(16, 24); G.stats.ufoSeen++;

    }

    ufo.t += dt; ufo.x += ufo.vx * dt;
    if (ufo.fl > 0) ufo.fl -= dt;

  function stepBoss(dt) {
    var b = boss; if (!b) return;
    b.t += dt; if (b.fl > 0) b.fl -= dt;

      b.dieT += dt;
      if (Math.random() < dt * 14) { explode(b.x + rnd(-b.aw / 2, b.aw / 2), b.y + rnd(-b.ah / 2, b.ah / 2), b.d.col, Math.random() < 0.4); sHit(); }

    }

    if (b.spawnT <= 0) {

      if (invs.filter(function (v) { return !v.dead; }).length < 6) for (var j = -1; j <= 1; j += 2) {

  function hurtBoss(dmg, x, y) {

  // ═══ Ending a stage, losing ═══════════════════════════════════════════════
  function clearWave() {

    if (B) banner('UFOS HIT ' + B.hit + '/' + B.total, (perfect ? 'PERFECT  ' : '') + '+' + fmt(bonus), '#ffd23e', 2.6);

  // ═══ Update (60 steps a second) ════════════════════════════════════════════
  function stickVec(i) {
    var s = sticks[i], x = s.x, y = s.y, m = Math.hypot(x, y);
    if (!s.on || m < DZ) {
      // keys: arrows / WASD steer the one joystick; with two, WASD is the left one and the arrows the right
      var l, r, u, d, h;
      if (!SET.two) { if (i) return null; l = keys.l || keys.l2; r = keys.r || keys.r2; u = keys.u || keys.u2; d = keys.d || keys.d2; h = Math.max(keys.hold, keys.hold2); }
      else if (i === 0) { l = keys.l; r = keys.r; u = keys.u; d = keys.d; h = keys.hold; }
      else { l = keys.l2; r = keys.r2; u = keys.u2; d = keys.d2; h = keys.hold2; }
      var kx = (r ? 1 : 0) - (l ? 1 : 0), ky = (d ? 1 : 0) - (u ? 1 : 0);
      if (!kx && !ky) return null;
      var km = Math.min(1, 0.35 + h * 1.6), kl = Math.hypot(kx, ky);
      return { x: kx / kl * km, y: ky / kl * km };
    }
    var n = Math.min(1, (m - DZ) / (1 - DZ)), sp = 0.2 * n + 0.8 * n * n;   // fine near the middle, fast at the edge
    return { x: x / m * sp, y: y / m * sp };
  }
  function aimSpeed() { return 520 + WW * 0.3; }
  function update() {
    var dt = TICK, i;
    G.t += dt; G.waveT += dt;
    keys.hold = keys.l || keys.r || keys.u || keys.d ? keys.hold + dt : 0;
    keys.hold2 = keys.l2 || keys.r2 || keys.u2 || keys.d2 ? keys.hold2 + dt : 0;
    fx.shake = Math.max(0, fx.shake - dt * 1.6); fx.flash = Math.max(0, fx.flash - dt * 2.5); fx.glitch = Math.max(0, fx.glitch - dt);
    if (G.ban) { G.ban.t += dt; if (G.ban.t > G.ban.dur) G.ban = null; }
    if (G.frameMsg) { G.frameMsg.t += dt; if (G.frameMsg.t > 2.4) G.frameMsg = null; }
    var live = G.phase === 'play' || G.phase === 'clear';
    // aim: each stick (or keys) pushes its target; reversed axes flip the push
    for (i = 0; i < 2; i++) {
      var v = stickVec(i), a = aims[i];
      if (v && live) {
        var V = aimSpeed();

    if (G.baseHit > 0) G.baseHit -= dt;
    if (G.type === 'normal' && G.phase === 'play' && G.waveT > 2) G.ib = Math.max(100, G.ib - dt * 20);
    // timers
    ['R', 'S', 'M', 'O'].forEach(function (k) { if (G.pw[k] > 0) G.pw[k] = Math.max(0, G.pw[k] - dt); });
    if (G.bubble > 0) G.bubble = Math.max(0, G.bubble - dt);
    if (G.frenzyT > 0) { G.frenzyT -= dt; G.fz = FZ_MAX * Math.max(0, G.frenzyT) / FRENZY_DUR; if (G.frenzyT <= 0) { G.frenzyT = 0; G.fz = 0; } }

    if (G.t - G.lastKill > 1.1 && G.combo) G.combo = 0;
    // firing: with one joystick both cannons take turns; with two, each fires while its stick is held
    if (G.phase === 'play') {

      if (p.home) { p.x += (WW / 2 - p.x) * Math.min(1, dt * 5); p.y += (BOTTOM - p.y) * Math.min(1, dt * 5); if (Math.abs(p.y - BOTTOM) < 12) collect(p); continue; }

      if (live && [0, 1].some(function (k) { var a = aimOf(k); return Math.hypot(a.x - p.x, a.y - p.y) < 26; })) { collect(p); continue; }

    for (i = parts.length - 1; i >= 0; i--) {

    for (i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t >= rings[i].dur) rings.splice(i, 1); }
    for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; pops[i].y -= 34 * dt; if (pops[i].t > 0.95) pops.splice(i, 1); }
    // flow
    if (G.phase === 'play') {
      var B = G.sauc;
      if (!invs.length && !boss && G.waveT > 1 && !(B && (B.left > 0 || B.ships > 0 || saucers.length))) clearWave();
    } else if (G.phase === 'clear') {
      G.clearT += dt;
      if (G.clearT > 2.6) {
        if (G.wave >= LAST_WAVE) { G.phase = 'won'; endGame(true); }
        else startWave(G.wave + 1);
      }
    } else if (G.phase === 'dying') {
      G.dieT += dt;
      if (G.dieT > 2.6) { G.phase = 'over'; endGame(false); }
    }
  }

})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Invaders</title>

<style>
/* ── Play view: fills the screen, no page scroll ────────────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 50% at 50% 0%, rgba(60,255,110,.11) 0%, rgba(60,255,110,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 8px calc(var(--safe-b) + 10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.ar-wrap{flex:none;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;}
.ar-cab{position:relative;padding:7px;border-radius:20px;}
.ar-cab canvas{display:block;border-radius:12px;background:#020306;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
/* glass: soft vignette and a faint reflection, like looking into the cabinet */
.ar-cab::after{content:"";position:absolute;inset:7px;border-radius:12px;pointer-events:none;
  background:radial-gradient(130% 95% at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%),
    linear-gradient(160deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 28%);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.65),inset 0 0 18px rgba(0,0,0,.6);}
.ar-ov{position:absolute;inset:7px;border-radius:12px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(2,8,4,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(260px,84%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
.ar-hint{flex:none;font-size:.8rem;color:var(--text-3);text-align:center;font-weight:700;}
/* ── Touch deck: slide pad (or left/right buttons) under the left thumb, fire under the right ── */
.inv-deck{flex:1 1 auto;min-height:128px;max-height:236px;width:100%;max-width:540px;display:grid;
  grid-template-columns:1fr 116px;grid-template-rows:34px minmax(0,1fr);gap:8px 12px;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.inv-deck *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.inv-top{display:flex;align-items:center;gap:8px;min-width:0;}
.inv-top .lab{font-size:.7rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(170,255,190,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inv-pbtn{flex:none;width:44px;height:34px;border:0;border-radius:12px;display:grid;place-items:center;color:#d3ffdc;
  background:linear-gradient(180deg,#1b2a20,#0d1610);box-shadow:inset 0 0 0 1.5px rgba(120,255,160,.28),0 4px 10px rgba(0,0,0,.35);}
.inv-pbtn:active{transform:scale(.94);}
.inv-pbtn svg{width:18px;height:18px;}
.inv-auto{justify-self:stretch;border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--display);font-size:1rem;letter-spacing:.1em;color:rgba(220,255,228,.7);
  background:linear-gradient(180deg,#1b2a20,#0d1610);box-shadow:inset 0 0 0 1.5px rgba(120,255,160,.28),0 4px 10px rgba(0,0,0,.35);}
.inv-auto i{width:10px;height:10px;border-radius:50%;background:#26402e;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.inv-auto.on{color:#eaffef;box-shadow:inset 0 0 0 1.5px rgba(120,255,160,.7),0 0 16px rgba(60,255,110,.25);}
.inv-auto.on i{background:#4dff7c;box-shadow:0 0 8px #4dff7c,0 0 2px #fff inset;}
.inv-slide{position:relative;border-radius:22px;min-height:0;overflow:hidden;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px),linear-gradient(180deg,#18241c 0%,#0c140f 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.08),inset 0 0 0 1.5px rgba(120,255,160,.22),inset 0 -8px 18px rgba(0,0,0,.45),0 8px 18px rgba(0,0,0,.4);
  transition:box-shadow .12s;}
.inv-slide.on{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.1),inset 0 0 0 1.5px rgba(120,255,160,.6),inset 0 -8px 18px rgba(0,0,0,.45),0 0 22px rgba(60,255,110,.18);}
.inv-slide small{position:absolute;left:0;right:0;top:9px;text-align:center;font-size:.6rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:rgba(170,255,190,.45);}
.inv-slide .rail{position:absolute;left:22px;right:22px;top:50%;height:4px;margin-top:2px;border-radius:2px;background:rgba(0,0,0,.55);box-shadow:0 1px 0 rgba(255,255,255,.07);}
.inv-slide .rail i{position:absolute;top:50%;width:30px;height:16px;margin:-8px 0 0 -15px;border-radius:5px 5px 3px 3px;
  background:linear-gradient(180deg,#9dffb5,#2fd35a);box-shadow:0 0 12px rgba(60,255,110,.55),0 2px 0 #11612a;}
.inv-slide .arr{position:absolute;bottom:10px;font-size:.62rem;font-weight:900;color:rgba(170,255,190,.32);letter-spacing:.1em;}
.inv-lr{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0;}
.inv-key{border:0;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#e3ffe9;min-height:0;
  background:linear-gradient(180deg,#22382a 0%,#132017 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14),inset 0 0 0 1.5px rgba(120,255,160,.25),0 4px 0 #07100a,0 8px 14px rgba(0,0,0,.4);transition:transform .06s,box-shadow .06s;}
.inv-key svg{width:30px;height:30px;stroke-width:3;}
.inv-key.on{transform:translateY(3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14),inset 0 0 0 1.5px rgba(120,255,160,.55),0 1px 0 #07100a;}
.inv-fire{align-self:center;justify-self:center;width:112px;height:112px;max-height:100%;aspect-ratio:1;border-radius:50%;border:0;color:#fff;
  font-family:var(--display);font-size:1.3rem;letter-spacing:.08em;text-shadow:0 2px 0 rgba(0,0,0,.35);
  background:radial-gradient(circle at 40% 30%,#ff9aa8 0%,#f0435d 45%,#a3152c 100%);
  box-shadow:0 6px 0 #5e0a19,0 12px 22px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 5px rgba(0,0,0,.28);transition:transform .05s,box-shadow .05s;}
.inv-fire.on{transform:translateY(4px);box-shadow:0 2px 0 #5e0a19,0 0 26px rgba(255,80,100,.55),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 5px rgba(0,0,0,.28);}
@media (hover:hover) and (pointer:fine){ .ar-touch{display:none!important;} }
@media (hover:none),(pointer:coarse){ .ar-desk{display:none!important;} }
@media (max-height:720px){ .inv-deck{grid-template-columns:1fr 96px;grid-template-rows:30px minmax(0,1fr);} .inv-fire{width:94px;height:94px;font-size:1.1rem;} .inv-pbtn,.inv-auto{height:30px;} }
</style>
</head>

  var ufoSnd = null;

    bx.globalCompositeOperation = 'source-atop';
    bx.fillStyle = WHITE; bx.fillRect(0, 0, W, H);
    bx.fillStyle = RED; bx.fillRect(0, 32, W, 16);
    bx.fillStyle = GREEN; bx.fillRect(0, 184, W, 56); bx.fillRect(0, 240, 136, 16);
    bx.globalCompositeOperation = 'source-over';
    // ── onto the tube
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    g.drawImage(bgCv, 0, 0);
    var ox = 0, oy = 0;
    if (fx.shake > 0) { var m = fx.shake * fx.shake * 6 * K; ox = Math.round((Math.random() - 0.5) * m); oy = Math.round((Math.random() - 0.5) * m); }
    g.imageSmoothingEnabled = false;
    g.drawImage(buf, ox, oy, bw, bh);
    // phosphor glow
    gx1.clearRect(0, 0, W / 2, H / 2); gx1.imageSmoothingEnabled = true; gx1.drawImage(buf, 0, 0, W / 2, H / 2);
    gx2.clearRect(0, 0, W / 4, H / 4); gx2.imageSmoothingEnabled = true; gx2.drawImage(glow1, 0, 0, W / 4, H / 4);
    g.imageSmoothingEnabled = true; g.globalCompositeOperation = 'lighter';
    g.globalAlpha = 0.42; g.drawImage(glow1, ox, oy, bw, bh);
    g.globalAlpha = 0.3; g.drawImage(glow2, ox, oy, bw, bh);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    g.drawImage(scanCv, 0, 0);
    if (fx.flash > 0) { g.fillStyle = 'rgba(255,255,255,' + (fx.flash * 0.07).toFixed(3) + ')'; g.fillRect(0, 0, bw, bh); }
    // slide pad marker follows the cannon
    if (knobEl) { var pct = (G.px - PX_MIN) / (PX_MAX - PX_MIN) * 100; if (Math.abs(pct - (knobEl._p || -1)) > 0.2) { knobEl._p = pct; knobEl.style.left = pct.toFixed(1) + '%'; } }
  }

  // ═══ Test hooks ══════════════════════════════════════════════════════════
  window.__inv = {
    get: function () {
      if (!G) return null;
      var alive = invs.filter(function (v) { return v.alive; });
      var shield = 0; for (var i = (SHIELD_Y) * W; i < (SHIELD_Y + 16) * W; i++) shield += SH[i];
      var ground = 0; for (var x = 0; x < W; x++) ground += SH[GROUND_Y * W + x];
      return { phase: G.phase, wave: G.wave, score: G.score, lives: G.lives, alive: G.alive, px: G.px, shots: G.shots, shot: G.shot && { x: G.shot.x, y: G.shot.y },
        bombs: bombs.map(function (b) { return { type: b.type, x: b.x, y: b.y }; }), ufo: G.ufo && { x: G.ufo.x, dead: G.ufo.dead, pts: G.ufo.pts },
        dir: G.dir, dx: G.dx, dy: G.dy, cursor: G.cursor, boomT: G.boomT, marchT: G.marchT, marchDelay: marchDelay(G.alive), bonus: G.bonus, auto: G.auto,
        minY: alive.length ? Math.min.apply(null, alive.map(function (v) { return v.y; })) : 0, maxY: alive.length ? Math.max.apply(null, alive.map(function (v) { return v.y; })) : 0,
        minX: alive.length ? Math.min.apply(null, alive.map(function (v) { return v.x; })) : 0, maxX: alive.length ? Math.max.apply(null, alive.map(function (v) { return v.x; })) : 0,
        shieldPx: shield, groundPx: ground, paused: paused, ended: !!G.ended, stats: G.stats, frame: G.frame, why: G.why || '', reload: reloadRate() };
    },
    step: function (n) { for (var i = 0; i < (n || 1); i++) { if (G.ended) break; update(); } draw(); return this.get(); },
    setX: function (x) { G.px = clamp(x, PX_MIN, PX_MAX); input.target = null; },
    fire: function () { return tryFire(); },
    kill: function (i) { var v = invs[i]; if (v && v.alive) killInvader(v); },
    killAllBut: function (n) { var keep = 0; invs.forEach(function (v) { if (!v.alive) return; if (keep < n) keep++; else { v.alive = false; G.alive--; } }); },
    noBombs: function (on) { G.noBombs = !!on; if (on) bombs = []; },
    bomb: function (x, type, y) { bombs.push({ type: type || 0, x: x, y: y == null ? 150 : y, f: 0 }); },
    ufo: function () { spawnUfo(); },
    setShots: function (n) { G.shots = n; },
    setScore: function (n) { G.score = n; },
    addScore: function (n) { addScore(n); },
    lowerRack: function (dy) { invs.forEach(function (v) { v.y += dy; }); },
    auto: function (on) { setAuto(on); },
    phase: function (p) { G.phase = p; if (p === 'play') { G.shown = invs.length; G.readyT = 0; } },
    stop: function () { if (raf) { cancelAnimationFrame(raf); raf = 0; } paused = true; },
    go: function () { paused = false; wake(); },
    save: save, pause: pauseGame, resume: resumeGame
  };

  // ═══ Boot ════════════════════════════════════════════════════════════════
  var saved = loadSave();
  if (saved) startGame({ who: saved.who, move: saved.move }, saved);
  else showSetup();
})();
</script>

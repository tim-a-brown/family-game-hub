<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Invaders</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>

<style>
/* ── Play view: a big LED screen with a gun control panel; fills the screen, no page scroll ── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 0%,#1d0c45 0%,#0a0520 55%,#05030f 100%);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:2px 8px calc(var(--safe-b) + 8px);
  display:grid;gap:8px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#app.lay-port{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--deck-h,168px);grid-template-areas:"scr" "deck";}
#app.lay-land{grid-template-columns:var(--side-w,170px) minmax(0,1fr) var(--side-w,170px);grid-template-rows:minmax(0,1fr);grid-template-areas:"l scr r";
  padding-left:calc(env(safe-area-inset-left,0px) + 6px);padding-right:calc(env(safe-area-inset-right,0px) + 6px);}
#app.lay-desk{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"scr" "hint";}
#app.lay-port .inv-side,#app.lay-land .inv-deck,#app.lay-desk .inv-deck,#app.lay-desk .inv-side,#app:not(.lay-desk) .ar-hint{display:none;}
.inv-scr{grid-area:scr;position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;}
.inv-bez{position:relative;padding:5px;border-radius:18px;background:linear-gradient(180deg,#2a2346,#100c22);
  box-shadow:0 0 0 1.5px rgba(150,120,255,.38),0 0 34px rgba(110,70,255,.24),0 14px 30px rgba(0,0,0,.5);}
.inv-bez canvas{display:block;border-radius:13px;background:#05030f;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.inv-bez.mouse canvas{cursor:none;}
.ar-ov{position:absolute;inset:5px;border-radius:13px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(8,3,24,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(270px,84%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
.ar-hint{grid-area:hint;font-size:.8rem;color:rgba(210,200,255,.55);text-align:center;font-weight:700;}
/* ── Control panel: joystick under one thumb, FIRE under the other ── */
.inv-deck{grid-area:deck;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:6px;min-height:0;}
.inv-side{display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:8px;min-height:0;padding:4px 0 2px;}
.inv-side.l{grid-area:l;} .inv-side.r{grid-area:r;}
.inv-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.inv-cell{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;}
.inv-sz,.inv-fz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:none;width:100%;height:100%;min-height:0;}
.inv-side .inv-sz,.inv-side .inv-fz{height:auto;flex:1;justify-content:flex-end;}
.inv-lab{font-size:.62rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:rgba(200,185,255,.5);white-space:nowrap;}
.inv-stick{position:relative;flex:none;width:var(--stick,140px);height:var(--stick,140px);border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#07060e 0 30%,#1b1730 31% 60%,#100d1e 61% 100%);
  box-shadow:inset 0 0 0 2px rgba(170,150,255,.28),inset 0 8px 16px rgba(0,0,0,.7),0 7px 18px rgba(0,0,0,.55),0 0 0 6px rgba(0,0,0,.28);}
.inv-stick.on{box-shadow:inset 0 0 0 2px rgba(170,150,255,.6),inset 0 8px 16px rgba(0,0,0,.7),0 0 22px rgba(130,90,255,.35),0 0 0 6px rgba(0,0,0,.28);}
.inv-stick .ar{position:absolute;width:0;height:0;border:6px solid transparent;opacity:.55;}
.inv-stick .ar.n{left:50%;top:7%;margin-left:-6px;border-bottom-color:#b9a8ff;border-top:0;}
.inv-stick .ar.s{left:50%;bottom:7%;margin-left:-6px;border-top-color:#b9a8ff;border-bottom:0;}
.inv-stick .ar.w{top:50%;left:7%;margin-top:-6px;border-right-color:#b9a8ff;border-left:0;}
.inv-stick .ar.e{top:50%;right:7%;margin-top:-6px;border-left-color:#b9a8ff;border-right:0;}
.inv-stick .boot{position:absolute;left:50%;top:50%;width:34%;height:34%;margin:-17% 0 0 -17%;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#2c2840,#09080f);box-shadow:inset 0 2px 4px rgba(0,0,0,.8);}
.inv-knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;will-change:transform;
  background:radial-gradient(circle at 36% 30%,#ffd0d8 0%,#ff4d6d 34%,#c0123a 70%,#6d0620 100%);
  box-shadow:0 8px 12px rgba(0,0,0,.55),inset 0 -4px 8px rgba(0,0,0,.35),0 0 18px rgba(255,60,110,.35);}
.inv-knob.spring{transition:transform .22s cubic-bezier(.34,1.56,.64,1);}
.inv-fire{flex:none;width:var(--fire,112px);height:var(--fire,112px);border-radius:50%;border:0;color:#fff;
  font-family:var(--display);font-size:calc(var(--fire,112px) * .19);letter-spacing:.08em;text-shadow:0 2px 0 rgba(0,0,0,.35);
  background:radial-gradient(circle at 40% 30%,#ffb4c2 0%,#ff3d63 45%,#a3102e 100%);
  box-shadow:0 6px 0 #5e0a19,0 12px 22px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 6px rgba(0,0,0,.3);transition:transform .05s,box-shadow .05s;}
.inv-fire.on{transform:translateY(4px);box-shadow:0 2px 0 #5e0a19,0 0 28px rgba(255,70,110,.6),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 6px rgba(0,0,0,.3);}
.inv-pbtn{flex:none;width:46px;height:36px;border:0;border-radius:12px;display:grid;place-items:center;color:#e3dcff;
  background:linear-gradient(180deg,#2a2346,#161227);box-shadow:inset 0 0 0 1.5px rgba(160,140,255,.3),0 4px 10px rgba(0,0,0,.35);}
.inv-pbtn:active{transform:scale(.94);}
.inv-pbtn svg{width:18px;height:18px;}
.inv-auto{flex:none;height:36px;padding:0 12px;border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--display);font-size:1rem;letter-spacing:.1em;color:rgba(230,222,255,.7);
  background:linear-gradient(180deg,#2a2346,#161227);box-shadow:inset 0 0 0 1.5px rgba(160,140,255,.3),0 4px 10px rgba(0,0,0,.35);}
.inv-auto i{width:10px;height:10px;border-radius:50%;background:#3a3150;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.inv-auto.on{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,120,220,.75),0 0 16px rgba(255,80,210,.3);}
.inv-auto.on i{background:#ff6ad5;box-shadow:0 0 8px #ff6ad5,0 0 2px #fff inset;}
.inv-side .inv-top{display:flex;gap:8px;align-items:center;}
</style>
</head>

  function stepInvaders(dt) {

  // ═══ Mystery UFO and bosses ════════════════════════════════════════════════
  function stepUfo(dt) {
    if (!G.isBoss && G.phase === 'play' && !ufo) {
      G.ufoT -= dt;

        var dir = Math.random() < 0.5 ? 1 : -1;

        G.ufoT = rnd(16, 24); G.stats.ufoSeen++;

    }

    ufo.t += dt; ufo.x += ufo.vx * dt;

  }
  function hurtUfo(dmg) {

  function stepBoss(dt) {
    var b = boss; if (!b) return;

        explode(b.x, b.y, b.d.col, true); burst(b.x, b.y, '#ffffff', 40, 2, 1.6); ring(b.x, b.y, b.d.col, 260, 0.8, 200);
        fx.flash = 1; fx.flashCol = '255,240,220'; fx.shake = 0.8; sBlast();

      }

    }
    b.spawnT -= dt;
    if (b.spawnT <= 0) {

        var k = pick(['squid', 'crab', 'oct']), v = makeInv(k, false, PALS[(G.wave / 5) % PALS.length][k], b.x + j * b.aw * 0.25, b.y + b.ah * 0.3);

  }
  function hurtBoss(dmg, x, y) {

  // ═══ Ending a wave, losing ════════════════════════════════════════════════

    G.shield = Math.min(SHIELD_MAX, G.shield + 15);

    pups.forEach(function (p) { p.home = true; });

  // ═══ Update (60 steps a second) ════════════════════════════════════════════
  function stickVec() {
    var x = stick.x, y = stick.y, m = Math.hypot(x, y);
    if (!stick.on || m < DZ) {
      var kx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), ky = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
      if (!kx && !ky) return null;
      var km = Math.min(1, 0.35 + keys.hold * 1.6), kl = Math.hypot(kx, ky);
      return { x: kx / kl * km, y: ky / kl * km };
    }
    var n = Math.min(1, (m - DZ) / (1 - DZ)), sp = 0.2 * n + 0.8 * n * n;   // fine near the middle, fast at the edge
    return { x: x / m * sp, y: y / m * sp };
  }
  function aimSpeed() { return 560 + WW * 0.25; }
  function update() {
    var dt = TICK;
    G.t += dt; G.waveT += dt;
    if (keys.l || keys.r || keys.u || keys.d) keys.hold += dt; else keys.hold = 0;
    fx.shake = Math.max(0, fx.shake - dt * 1.6); fx.flash = Math.max(0, fx.flash - dt * 2.5);
    if (G.ban) { G.ban.t += dt; if (G.ban.t > G.ban.dur) G.ban = null; }
    // aim: the stick (or keys) push the crosshair; reversed axes flip the push
    var v = stickVec(), live = G.phase === 'play' || G.phase === 'clear';
    if (v && live) {
      var V = aimSpeed();
      aim.x += (SET.invX ? -1 : 1) * v.x * V * dt;
      aim.y += (SET.invY ? -1 : 1) * v.y * V * dt;
    }
    aim.x = clamp(aim.x, 12, WW - 12); aim.y = clamp(aim.y, AIM_TOP, AIM_BOT);
    var px = pivotX();
    G.ang = Math.atan2(aim.y - PIVOT_Y, aim.x - px);
    G.recoil = Math.max(0, G.recoil - dt * 9); G.muzzle = Math.max(0, G.muzzle - dt * 12);
    if (G.barHit > 0) G.barHit -= dt;
    // timers
    ['R', 'S', 'M'].forEach(function (k) { if (G.pw[k] > 0) G.pw[k] = Math.max(0, G.pw[k] - dt); });
    if (G.bubble > 0) G.bubble = Math.max(0, G.bubble - dt);
    if (G.frenzyT > 0) { G.frenzyT -= dt; G.fz = FZ_MAX * Math.max(0, G.frenzyT) / FRENZY_DUR; if (G.frenzyT <= 0) { G.frenzyT = 0; G.fz = 0; } }
    else if (G.t - G.lastKill > 2.5) G.fz = Math.max(0, G.fz - dt * 1.5);
    if (G.t - G.lastKill > 1.1 && G.combo) G.combo = 0;
    // firing
    G.cool -= dt;
    if (live && G.phase === 'play' && (input.fire || input.mouse || keys.f || SET.auto) && G.cool <= 0) { fire(); G.cool = fireRate(); }

    if (G.phase !== 'dying') {

    }
    // power-up capsules drift down; the crosshair grabs them too

      var p = pups[i]; if (p.dead) continue;
      p.t += dt;

  // ═══ Persistence: a checkpoint at the start of each wave ═══════════════════

    var s = { v: 2, who: G.who, wave: cp.wave, score: cp.score, shield: cp.shield, stats: cp.stats, started: G.started, best0: G.best0 };

    setAim: function (x, y) { aim.x = x; aim.y = y; },
    wave: function (n) { startWave(n); },
    boss: function () { startWave(Math.ceil((G.wave + 1) / 5) * 5); },
    power: function (k, x, y) { if (k && !PU[k]) return; dropPup(x == null ? aim.x : x, y == null ? aim.y - 60 : y, k); },
    give: function (k) { collect({ k: k, x: aim.x, y: aim.y, dead: false }); },
    shield: function (n) { G.shield = n; },
    score: function (n) { G.score = n; },
    killAll: function () { invs.forEach(function (v) { if (!v.dead) killInv(v, true); v.dead = true; }); invs = []; },
    hurtBoss: function (n) { if (boss) hurtBoss(n, boss.x, boss.y); },
    missile: function (x, y) { missiles.push({ x: x, y: y, vx: 0, vy: 120, t: 0, orb: false, dead: false }); },
    bomb: function () { G.bombT = 0; bomb = null; stepBomb(0); return bomb && { x: bomb.x, y: bomb.y }; },
    shootBomb: function () { if (bomb) detonate(bomb.x, bomb.y); },
    frenzy: function () { G.fz = FZ_MAX; startFrenzy(); },
    ufo: function () { G.ufoT = 0; },
    die: function () { G.bubble = 0; G.phase = 'play'; G.shield = 1; hitBarrier(WW / 2, 99); },
    auto: function (on) { setAuto(on); },
    save: save, pause: pauseGame, resume: resumeGame, fit: function () { fit(true); }
  };

  // ═══ Boot ════════════════════════════════════════════════════════════════
  var saved = loadSave();
  if (saved) startGame({ who: saved.who }, saved);
  else showSetup();
})();
</script>

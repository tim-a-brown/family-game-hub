<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jungle Hunt</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<script src="junglehunt-data.js"></script>
<script src="junglehunt-core.js"></script>
<style>
/* ── Page shell: fills the screen, never scrolls ─────────────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 45% at 50% 0%, rgba(90,170,90,.12) 0%, rgba(90,170,90,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:720px;margin:0 auto;padding:0 8px calc(var(--safe-b) + 8px);display:flex;}
.jh-view{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:none;}
.jh-view[hidden]{display:none;}
.hud{flex:none;display:flex;align-items:stretch;justify-content:flex-end;gap:6px;width:100%;}
.pbtn{flex:none;width:48px;height:40px;border:0;border-radius:14px;display:grid;place-items:center;color:#e6f2d8;
  background:linear-gradient(180deg,#22301c,#121a0e);box-shadow:inset 0 0 0 1.5px rgba(170,220,140,.28),0 6px 14px rgba(0,0,0,.35);}
.pbtn:active{transform:scale(.94);}
.pbtn svg{width:22px;height:22px;}
/* The TV: a walnut cabinet round a curved dark glass screen */
.tv{flex:none;width:100%;display:flex;align-items:center;justify-content:center;}
.bezel{position:relative;padding:9px;border-radius:22px;}
.scr{position:relative;border-radius:18px / 22px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 2px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);}
.scr canvas{display:block;touch-action:none;image-rendering:pixelated;}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
    radial-gradient(120% 110% at 50% 45%,transparent 60%,rgba(0,0,0,.5) 100%),
    linear-gradient(160deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 32%);}
/* The console's front panel under the TV: its two switches, as on the woodgrain VCS */
.vcs{flex:none;display:flex;align-items:center;justify-content:center;gap:22px;padding:8px 22px 7px;border-radius:12px;
  background:linear-gradient(180deg,#1b1b1b 0 22%,transparent 22%),linear-gradient(90deg,#4a2c17,#6b4123 18%,#5a361c 42%,#734626 63%,#4e2f18 85%,#62391e);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.4);}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;color:#f3e6d0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
.sw .slot{position:relative;width:20px;height:30px;border-radius:5px;background:linear-gradient(180deg,#0c0c0c,#262626);box-shadow:inset 0 2px 3px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.15);}
.sw .lever{position:absolute;left:3px;right:3px;top:3px;height:13px;border-radius:4px;transition:transform .09s;
  background:linear-gradient(180deg,#f2f2f2,#9a9a9a 60%,#6c6c6c);box-shadow:0 2px 2px rgba(0,0,0,.6),inset 0 1px 0 #fff;}
.sw.down .lever{transform:translateY(11px);}
.sw b{font-family:var(--display);font-weight:400;font-size:.64rem;letter-spacing:.08em;line-height:1;text-align:center;color:#f6ead8;text-shadow:0 1px 0 rgba(0,0,0,.6);}
.sw[disabled]{opacity:.45;cursor:default;}
.vcs .gno{min-width:58px;text-align:center;font-family:var(--display);font-size:.78rem;letter-spacing:.06em;color:#f6ead8;line-height:1.15;}
.vcs .gno span{display:block;font-size:1.25rem;color:#ffd27a;}
/* Overlay cards inside the screen */
.ov{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(4,10,4,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
.ov[hidden]{display:none;}
.ov .card{width:100%;max-width:300px;text-align:center;animation:pop .35s var(--spring);}
.ov h2{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1;color:#9be07a;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 22px rgba(120,220,90,.35);}
.ov .sub{color:var(--text-2);font-weight:700;font-size:.92rem;margin:6px 0 12px;line-height:1.35;}
.ov .btn-lg{width:100%;}
.ov .row2{display:flex;gap:8px;margin-top:10px;}
.ov .row2 .btn{flex:1;min-height:42px;padding:0 10px;font-size:.9rem;}
/* Controls: the joystick on the left, the red button on the right */
.ctrls{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 6px;}
.pad{position:relative;width:170px;height:170px;border-radius:50%;touch-action:none;-webkit-user-select:none;user-select:none;flex:none;
  background:radial-gradient(circle at 50% 40%,#2a2a2a 0%,#151515 60%,#080808 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -6px 14px rgba(0,0,0,.5),0 0 0 6px rgba(0,0,0,.25),0 14px 28px rgba(0,0,0,.45);}
.pad i{position:absolute;width:44px;height:44px;display:grid;place-items:center;color:rgba(230,230,230,.35);transition:color .1s,transform .1s;}
.pad i svg{width:26px;height:26px;}
.pad i.u{left:50%;top:4px;margin-left:-22px;} .pad i.d{left:50%;bottom:4px;margin-left:-22px;}
.pad i.l{left:4px;top:50%;margin-top:-22px;} .pad i.r{right:4px;top:50%;margin-top:-22px;}
.pad i.on{color:#ffd27a;transform:scale(1.15);filter:drop-shadow(0 0 8px rgba(255,200,90,.7));}
.pad .nub{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#6a6a6a,#2a2a2a 55%,#0a0a0a);box-shadow:0 5px 0 #000,0 9px 16px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.3);
  transition:transform .08s;}
.fbtn{flex:none;width:118px;height:118px;border-radius:50%;border:0;touch-action:none;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle at 42% 34%,#ff8a7a,#e01f1a 55%,#8a0a08);box-shadow:0 0 0 9px #141414,0 0 0 10px rgba(255,255,255,.08),0 7px 0 9px #000,0 16px 26px rgba(0,0,0,.55),inset 0 3px 0 rgba(255,255,255,.45);
  transition:transform .06s,box-shadow .06s;}
.fbtn.start{animation:jhpulse 1.1s ease-in-out infinite;}
@keyframes jhpulse{50%{filter:brightness(1.3);}}
.fbtn.down{transform:translateY(4px);box-shadow:0 0 0 9px #141414,0 0 0 10px rgba(255,255,255,.08),0 3px 0 9px #000,0 8px 14px rgba(0,0,0,.55),inset 0 3px 0 rgba(255,255,255,.35);}
.hint{flex:none;font-size:.82rem;font-weight:700;color:var(--text-3);text-align:center;}
@media (hover:hover) and (pointer:fine){ .ctrls{display:none;} }
@media (hover:none),(pointer:coarse){ .hint{display:none;} }
@media (max-height:740px){ .pad{width:140px;height:140px;} .pad i{width:38px;height:38px;margin:0;} .pad i.u,.pad i.d{margin-left:-19px;} .pad i.l,.pad i.r{margin-top:-19px;}
  .pad .nub{width:50px;height:50px;margin:-25px 0 0 -25px;} .fbtn{width:96px;height:96px;} }
/* Sideways (phones and tablets): the TV in the middle, the stick under the left thumb, the button under the right */
@media (orientation:landscape) and (pointer:coarse){
  html.ar-on #app{max-width:none;position:relative;}
  .jh-view{gap:4px;}
  .hud{position:absolute;top:6px;right:calc(var(--safe-r, 0px) + 10px);width:auto;z-index:4;}
  .ctrls{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 14px);padding:0 calc(var(--safe-r, 0px) + 18px) 0 calc(var(--safe-l, 0px) + 18px);pointer-events:none;}
  .ctrls > *{pointer-events:auto;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<div class="jh-view" id="view" hidden>
  <div class="hud"><button class="pbtn" id="btn-pause" type="button" aria-label="Pause"></button></div>
  <div class="tv">
    <div class="bezel wood" id="bezel">
      <div class="scr" id="scr">
        <canvas id="cv" aria-label="Jungle Hunt screen"></canvas>
        <div class="ov" id="ov" hidden><div class="card" id="ov-card"></div></div>
      </div>
    </div>
  </div>
  <div class="vcs" id="vcs">
    <button class="sw" id="sw-select" type="button" aria-label="Game select"><span class="slot"><span class="lever"></span></span><b>GAME<br>SELECT</b></button>
    <div class="gno">GAME<span id="gno">1</span></div>
    <button class="sw" id="sw-reset" type="button" aria-label="Game reset"><span class="slot"><span class="lever"></span></span><b>GAME<br>RESET</b></button>
  </div>
  <div class="ctrls">
    <div class="pad" id="pad" aria-label="Joystick">
      <i class="u"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5 20 16H4z"/></svg></i>
      <i class="d"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 19 4 8h16z"/></svg></i>
      <i class="l"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 12 16 4v16z"/></svg></i>
      <i class="r"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 12 8 4v16z"/></svg></i>
      <span class="nub" id="nub"></span>
    </div>
    <button class="fbtn" id="fbtn" type="button" aria-label="Button"></button>
  </div>
  <div class="hint" id="hint">Arrow keys or WASD to move · Space to jump or stab · P to pause</div>
</div>
<script>
(function () {
  'use strict';
  // The game runs in junglehunt-core.js: the cartridge's own program (both 4K banks) translated to JavaScript, with
  // the console's RAM, timer and TIA picture/sound chip modelled round it, checked frame by frame against MAME.
  // This page is the console and TV: the joystick and button, GAME SELECT and GAME RESET, pause and resume, and
  // the family's high scores.
  var KEY = 'junglehunt', HI = 'junglehunt', SAVE = 'junglehunt_state';
  var TOUCH = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var C = window.JHCore, R = C.R;
  var W = 160, TOPR = 16, H = 207, PAR = 1.7;     // the part of the picture a TV shows; Atari pixels are wide
  var SCENES = ['the vines', 'Reptile River', 'the boulders', 'the cannibal camp'];
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }

  // ═══ Reading the console's RAM ══════════════════════════════════════════
  function bcd(v) { return (v >> 4) * 10 + (v & 15); }
  function score() { return bcd(R[3]) * 10000 + bcd(R[4]) * 100 + bcd(R[5]); }
  function attract() { return (R[0x18] & 0x80) !== 0; }   // the title/demo (and between games)
  function gameNo() { return (R[0x18] & 1) + 1; }           // GAME SELECT: skill level 1 or 2
  function scene() { return R[9] & 3; }
  function round() { return R[0x0B] - (gameNo() - 1) + 1; }  // the level rises each time Lady Penelope is rescued
  function lives() { return R[8]; }

  // ═══ The console ════════════════════════════════════════════════════════
  // mode: 'idle' (not on the TV), 'attract' (the cartridge's demo, waiting for the button), 'play'
  var mode = 'idle', cfg0 = null, paused = false, welcome = false, startedAt = 0, best0 = 0;
  var wantGame = 1, resetT = 0, selectT = 0, fireT = 0, fireHeld = false, wasAttract = true, maxScene = 0, rounds = 1;
  function startTV(cfg, saved) {
    cfg0 = cfg; paused = false; welcome = false;
    wantGame = cfg.game || 1;
    var b = ArcadeHi.board ? ArcadeHi.board(HI) : ArcadeHi.list(HI); best0 = b && b.length ? b[0].score : 0;
    buildView();
    Snd.unlock();
    Kit.gameStart && Kit.gameStart();
    if (saved) {
      C.load(saved.st); mode = 'play'; wasAttract = false; startedAt = saved.started || Date.now();
      maxScene = saved.maxScene || 0; rounds = saved.rounds || 1; welcome = true; paused = true;
    } else {
      C.reset(); mode = 'attract'; wasAttract = true;
      for (var i = 0; i < 4; i++) C.frame();                // let the cartridge set itself up
    }
    syncOverlay(); syncSwitches(); render(); kick();
  }
  function syncSwitches() {
    var fb = $('fbtn'); if (fb) fb.classList.toggle('start', mode === 'attract');
    $('gno').textContent = mode === 'play' ? gameNo() : wantGame;
    $('sw-select').disabled = mode !== 'attract';
    var h = $('hint'); if (h) h.textContent = mode === 'attract' ? 'Press Space to start · S for GAME SELECT' : 'Arrow keys or WASD to move · Space to jump or stab · P to pause';
  }
  // a flick of the switch: the lever goes down while the console sees it pressed
  function flick(id, frames) { var b = $(id); b.classList.add('down'); setTimeout(function () { b.classList.remove('down'); }, Math.max(140, frames * 17)); Kit.haptic('light'); Kit.sfx('tap'); }
  function pressReset() {
    if (mode === 'idle') return;
    if (mode === 'play') {
      setPaused(true);
      Kit.confirm('Start over?', { ok: 'Start over', body: 'GAME RESET ends this game and starts a new one.' }).then(function (ok) { if (ok) { clearSave(); doReset(); } });
      return;
    }
    doReset();
  }
  function doReset() { flick('sw-reset', 6); resetT = 6; if (paused) setPaused(false); }
  function pressSelect() {
    if (mode !== 'attract') return;
    wantGame = wantGame === 1 ? 2 : 1; flick('sw-select', 8); syncSwitches();
  }

  // one console frame (59.92 a second)
  function tick() {
    var sa = 0xFF;
    if (ctl.r) sa &= ~0x80; if (ctl.l) sa &= ~0x40; if (ctl.d) sa &= ~0x20; if (ctl.u) sa &= ~0x10;
    C.IN.swcha = sa;
    C.IN.fire = fireHeld || fireT > 0; if (fireT > 0) fireT--;
    var sb = 0x3F;
    if (resetT > 0) { sb &= ~1; resetT--; }
    // GAME SELECT is held until the cartridge shows the wanted game (it steps every half second while held)
    if (mode === 'attract' && attract() && gameNo() !== wantGame) sb &= ~2;
    C.IN.swchb = sb;
    C.frame();
    Snd.frame(C.sound(), C.frameCycles());
    var att = attract();
    if (wasAttract && !att) gameBegins();
    else if (!wasAttract && att && mode === 'play') finishGame();
    wasAttract = att;
    if (mode === 'play') {
      if (scene() > maxScene) maxScene = scene();
      if (R[0x0B] - (gameNo() - 1) + 1 > rounds) rounds = R[0x0B] - (gameNo() - 1) + 1;
      if (++saveT >= 600) { saveT = 0; save(); }
    }
  }
  var saveT = 0;
  function gameBegins() {
    mode = 'play'; startedAt = Date.now(); maxScene = 0; rounds = 1; saveT = 0;
    syncSwitches(); syncOverlay();
  }

  // ═══ Game over: history, high scores ════════════════════════════════════
  function finishGame() {
    var sc = score(), who = (cfg0 && cfg0.who) || 'Player', g = gameNo(), far = SCENES[maxScene];
    clearSave();
    mode = 'attract'; syncSwitches(); syncOverlay();
    var newTop = sc > 0 && sc > best0;
    var hl = [rounds > 1 ? 'Rescued Lady Penelope ' + (rounds - 1) + (rounds === 2 ? ' time' : ' times') : 'Reached ' + far];
    if (newTop) hl.push('New high score: ' + sc.toLocaleString() + (best0 ? ' (old best ' + best0.toLocaleString() + ')' : ''));
    var hiL = ArcadeHi.list(HI);
    try {
      Kit.record(KEY, {
        detail: { gm: g, rd: rounds, sc: maxScene, hb: best0 || 0,
          hr: sc > 0 && (hiL.length < ArcadeHi.max || sc > hiL[hiL.length - 1].score) ? hiL.filter(function (x) { return x.score >= sc; }).length + 1 : 0 },
        started: startedAt || Date.now(), mode: 'Game ' + g,
        players: [{ name: who, score: sc }], winner: null,
        highlights: hl,
        summary: sc.toLocaleString() + ' points · ' + (rounds > 1 ? 'round ' + rounds : 'reached ' + far), badge: rounds > 1 ? 'Round ' + rounds : far,
        meta: { score: sc, game: g, rounds: rounds }
      });
    } catch (e) {}
    ArcadeHi.check(HI, sc, function () {
      var b = ArcadeHi.board ? ArcadeHi.board(HI) : ArcadeHi.list(HI); best0 = b && b.length ? b[0].score : best0;
      Kit.win({
        lose: !newTop, icon: newTop ? 'trophy' : 'meh',
        title: newTop ? 'New high score!' : 'Game over',
        sub: sc.toLocaleString() + ' points · ' + (rounds > 1 ? 'round ' + rounds : 'reached ' + far),
        again: function () { doReset(); }, againLabel: 'Play again',
        extra: [{ label: 'High scores', onClick: function () { ArcadeHi.show(HI, 'Jungle Hunt'); } }, { label: 'Change settings', onClick: showSetup }]
      });
    }, { who: who });
  }

  // ═══ Save and resume: the whole console, exactly where it was ══════════
  function save() {
    if (mode !== 'play' || attract()) return;
    var s = { v: 1, who: cfg0.who, game: gameNo(), started: startedAt, maxScene: maxScene, rounds: rounds, st: C.save() };
    try { localStorage.setItem(SAVE, JSON.stringify(s)); } catch (e) {}
    Kit.resume.set((rounds > 1 ? 'Round ' + rounds + ' · ' : '') + SCENES[scene()].replace(/^the /, '').replace(/^./, function (c) { return c.toUpperCase(); }) + ' · ' + score().toLocaleString() + ' pts');
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function loadSave() { try { var s = JSON.parse(localStorage.getItem(SAVE)); return s && s.v === 1 && s.st ? s : null; } catch (e) { return null; } }

  // ═══ Sound: the TIA's two channels, as the program sets them each frame ═══
  var Snd = JHSound.create({ on: function () { return lsGet('gn_sound', '1') !== '0'; } });

  // ═══ Pause, overlay, setup ══════════════════════════════════════════════
  var PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>';
  var PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  function syncOverlay() {
    $('btn-pause').innerHTML = paused ? PLAY_SVG : PAUSE_SVG;
    $('btn-pause').style.visibility = mode === 'play' ? 'visible' : 'hidden';
    var ov = $('ov'), card = $('ov-card'), h = '';
    if (paused && mode === 'play') {
      h = '<h2>' + (welcome ? 'Welcome back' : 'Paused') + '</h2><div class="sub">' + (rounds > 1 ? 'Round ' + rounds + ' · ' : '') + SCENES[scene()].replace(/^./, function (c) { return c.toUpperCase(); }) + ' · ' + score().toLocaleString() + ' points</div>' +
        '<button class="btn btn-primary btn-lg" id="ov-resume" type="button">' + Kit.icon('play') + (welcome ? 'Continue' : 'Resume') + '</button>' +
        '<div class="row2"><button class="btn btn-soft" id="ov-quit" type="button">New game</button><button class="btn btn-soft" id="ov-rules" type="button">' + Kit.icon('book') + 'Rules</button></div>';
    }
    if (!h) { ov.hidden = true; return; }
    card.innerHTML = h; ov.hidden = false;
    bind('ov-resume', function () { setPaused(false); });
    bind('ov-quit', function () { Kit.confirm('Start a new game?', { ok: 'New game', body: 'This game will be lost.' }).then(function (ok) { if (ok) { clearSave(); showSetup(); } }); });
    bind('ov-rules', function () { Kit.rules(); });
  }
  function bind(id, fn) { var b = $(id); if (b) b.addEventListener('click', function (e) { e.stopPropagation(); Kit.sfx('tap'); fn(); }); }
  function showSetup() {
    leaveGame();
    Kit.setup($('app'), {
      intro: 'The 1983 Atari cartridge: swing, swim and leap through the jungle to rescue Lady Penelope',
      options: [{ id: 'game', label: 'Game', help: 'GAME SELECT on the console: the skill level the jungle starts at.',
        choices: [[1, 'Game 1', 'Skill level 1, the easier start.'], [2, 'Game 2', 'Skill level 2, the harder start.']], value: 1 }],
      players: { min: 1, max: 1, count: 1, label: 'Player' },
      start: 'Play',
      onStart: function (cfg) { var o = cfg.options || {}; startTV({ who: (cfg.players[0] && cfg.players[0].name) || 'Player', game: +o.game || 1 }); }
    });
    window.scrollTo(0, 0);
  }
  function leaveGame() {
    Snd.stop(); paused = false; welcome = false; mode = 'idle';
    document.documentElement.classList.remove('ar-on');
    var v = $('view'); if (v.parentNode === $('app')) document.body.appendChild(v);
    v.hidden = true;
  }
  function buildView() {
    var app = $('app'), v = $('view');
    app.className = ''; app.innerHTML = '';
    document.documentElement.classList.add('ar-on');
    v.hidden = false; app.appendChild(v);
    fit();
  }
  function setPaused(v) {
    if (mode !== 'play' || paused === v) return;
    paused = v;
    if (v) { Snd.stop(); save(); ctl.u = ctl.d = ctl.l = ctl.r = false; fireHeld = false; }
    else { welcome = false; Snd.unlock(); last = 0; acc = 0; kick(); }
    syncOverlay();
  }

  // ═══ Drawing: the TV blends each frame with the last, as a picture tube's glow does (and as MAME shows it) ═══
  var cv = $('cv'), ctx = cv.getContext('2d'), scr = document.createElement('canvas');
  scr.width = W; scr.height = H;
  var sx = scr.getContext('2d'), img = sx.createImageData(W, H), img32 = new Uint32Array(img.data.buffer);
  var PAL = new Uint32Array(129), prev = new Uint32Array(W * H);
  JH_DATA.pal.forEach(function (c, i) { PAL[i] = 0xFF000000 | (c & 0xFF) << 16 | (c & 0xFF00) | (c >> 16 & 0xFF); });
  PAL[128] = 0xFF000000;
  function compose() {                   // after each frame
    var px = C.pixels(), o = TOPR * W;
    for (var i = 0; i < W * H; i++) {
      var a = PAL[px[o + i]], b = prev[i];
      prev[i] = a;
      img32[i] = 0xFF000000 | (((a & 0xFEFEFE) >>> 1) + ((b & 0xFEFEFE) >>> 1));
    }
  }
  function render() {
    sx.putImageData(img, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
    ctx.drawImage(scr, 0, 0, cv.width, cv.height);
  }
  function fit() {
    var v = $('view'); if (v.hidden) return;
    var hudH = v.querySelector('.hud').offsetHeight, ctr = v.querySelector('.ctrls'), hint = v.querySelector('.hint'), vcs = $('vcs').offsetHeight + 8;
    var land = TOUCH && innerWidth > innerHeight;
    var ctrH = ctr && getComputedStyle(ctr).display !== 'none' && !land ? Math.max(150, ctr.querySelector('.pad').offsetHeight + 16) : 0;
    var hintH = hint && getComputedStyle(hint).display !== 'none' ? hint.offsetHeight + 8 : 0;
    var availH = v.clientHeight - (land ? 0 : hudH) - ctrH - hintH - vcs - 36;
    var availW = (land ? v.clientWidth - 2 * (ctr.querySelector('.pad').offsetWidth + 40) : Math.min(v.clientWidth, 720)) - 22;
    var sc = Math.max(0.5, Math.min(availW / (W * PAR), availH / H));
    var cw = Math.floor(W * PAR * sc), ch = Math.floor(H * sc), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    render();
  }

  // ═══ Input ══════════════════════════════════════════════════════════════
  var ctl = { u: false, d: false, l: false, r: false };
  var keyDir = { u: false, d: false, l: false, r: false }, padDir = { u: false, d: false, l: false, r: false };
  function syncCtl() { ['u', 'd', 'l', 'r'].forEach(function (k) { ctl[k] = keyDir[k] || padDir[k]; }); }
  var KEYS = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r' };
  function buttonDown() {
    Snd.unlock();
    if (paused) { setPaused(false); return; }
    fireHeld = true; fireT = 2;            // a tap still reaches the console for a couple of frames
    if (mode === 'attract') Kit.haptic('light');
  }
  function overlayUp() { return document.querySelector('.ahi-overlay, .k-scrim, .k-win'); }
  document.addEventListener('keydown', function (e) {
    if (mode === 'idle' || overlayUp()) return;
    if (mode === 'attract' && e.code === 'KeyS') { e.preventDefault(); pressSelect(); return; }
    if (KEYS[e.code]) { e.preventDefault(); keyDir[KEYS[e.code]] = true; syncCtl(); if (paused) setPaused(false); return; }
    if (e.code === 'KeyP' || e.code === 'Escape') { setPaused(!paused); return; }
    if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyX' || e.code === 'Enter') { e.preventDefault(); if (e.repeat) return; buttonDown(); }
  });
  document.addEventListener('keyup', function (e) {
    if (KEYS[e.code]) { keyDir[KEYS[e.code]] = false; syncCtl(); }
    if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyX' || e.code === 'Enter') fireHeld = false;
  });
  // the joystick: eight ways, like the Atari stick
  var pad = $('pad'), nub = $('nub'), padId = null, padIs = { u: pad.querySelector('i.u'), d: pad.querySelector('i.d'), l: pad.querySelector('i.l'), r: pad.querySelector('i.r') };
  function padShow() { ['u', 'd', 'l', 'r'].forEach(function (k) { padIs[k].classList.toggle('on', ctl[k]); }); }
  function padAt(e) {
    var r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), lim = r.width * .2;
    var d = Math.hypot(dx, dy), k = d > lim ? lim / d : 1;
    nub.style.transform = 'translate(' + dx * k + 'px,' + dy * k + 'px)';
    var was = JSON.stringify(padDir), on = d > r.width * .1, a = Math.atan2(dy, dx) * 180 / Math.PI;   // 0 = right, 90 = down
    padDir = { r: on && a > -67.5 && a < 67.5, d: on && a > 22.5 && a < 157.5, l: on && (a > 112.5 || a < -112.5), u: on && a < -22.5 && a > -157.5 };
    if (JSON.stringify(padDir) !== was) Kit.haptic('tick');
    syncCtl(); padShow();
  }
  pad.addEventListener('pointerdown', function (e) { e.preventDefault(); Snd.unlock(); if (paused) setPaused(false); padId = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch (x) {} padAt(e); });
  pad.addEventListener('pointermove', function (e) { if (e.pointerId === padId) padAt(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { pad.addEventListener(t, function (e) { if (e.pointerId !== padId) return; padId = null; nub.style.transform = ''; padDir = { u: false, d: false, l: false, r: false }; syncCtl(); padShow(); }); });
  var fb = $('fbtn');
  fb.addEventListener('pointerdown', function (e) { e.preventDefault(); fb.classList.add('down'); buttonDown(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { fb.addEventListener(t, function () { fb.classList.remove('down'); fireHeld = false; }); });
  $('sw-reset').addEventListener('click', function (e) { e.preventDefault(); Snd.unlock(); pressReset(); });
  $('sw-select').addEventListener('click', function (e) { e.preventDefault(); pressSelect(); });
  $('scr').addEventListener('pointerdown', function () { Snd.unlock(); if (mode === 'attract') { fireT = 3; } });
  $('view').addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  $('btn-pause').addEventListener('click', function () { Kit.sfx('tap'); setPaused(!paused); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { setPaused(true); save(); } else kick(); });
  window.addEventListener('blur', function () { setPaused(true); });
  window.addEventListener('pagehide', save);

  // ═══ Main loop: the console's 59.92 frames a second ═════════════════════
  var last = 0, acc = 0, DT = 1000 / 59.923, raf = 0, frozen = false;
  function running() { return mode !== 'idle' && !paused && !frozen && !document.hidden; }
  function loop(t) {
    raf = 0;
    if (!last) last = t;
    acc += Math.min(100, t - last); last = t;
    var n = 0;
    while (acc >= DT) { acc -= DT; if (running()) { tick(); compose(); n++; } }
    if (n) render();
    if (running()) raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf && running()) { last = 0; acc = 0; raf = requestAnimationFrame(loop); } }

  // ═══ Kit shell ══════════════════════════════════════════════════════════
  Kit.init({
    id: 'junglehunt',
    theme: { wood: ['#6b4123', '#3a2312'] },
    onNew: function () { clearSave(); showSetup(); },
    menu: [
      { icon: 'trophy', label: 'High scores', onClick: function () { setPaused(true); ArcadeHi.show(HI, 'Jungle Hunt'); } },
      { icon: 'history', label: 'Past games', onClick: function () { setPaused(true); Kit.history(KEY, { title: 'Jungle Hunt: past games' }); } }
    ],
    rules:
      '<p class="goal">The 1983 Atari 2600 cartridge. Two cannibals have carried off Lady Penelope. As Sir Dudley Dashly, fight through four parts of the jungle to rescue her before the timer runs out. Then the jungle starts again, harder.</p>' +
      '<h3>Starting</h3><p>The cartridge plays a demo of each part of the jungle. Press the <b>red button</b> or <b>GAME RESET</b> to play. <b>GAME SELECT</b> picks Game 1 (skill level 1) or Game 2 (skill level 2) while the demo runs.</p>' +
      '<h3>The vines</h3><p>Swing from vine to vine. Press the <b>button</b> to let go and jump when the next vine swings close. Some vines swing faster than others; miss one and you fall.</p>' +
      '<h3>Reptile River</h3><ul><li>Swim with the <b>joystick</b> in any direction, and press the <b>button</b> to stab with your knife.</li>' +
      '<li>You can stab a crocodile only while its jaws are shut; an open mouth will get you. Its belly is the safe side, so come at it from below.</li>' +
      '<li>Crocodiles swim in threes. A <b>rogue crocodile</b> swims alone and erratically, and is worth more.</li>' +
      '<li>Watch the <b>DIVING</b> meter: come up for air before it runs out, or you drown. Steering clear of crocodiles is safer than fighting them.</li></ul>' +
      '<h3>The boulders</h3><p>Run up the hill with the <b>joystick</b>. Press the <b>button</b> to jump over the small rolling rocks. The big bouncing boulders you can jump, run under, or <b>pull back to duck</b>. Jumping them is worth the most, but they bounce high, so time it.</p>' +
      '<h3>The cannibal camp</h3><p>Run back and forth and <b>jump</b> over the cannibals and their poisoned spears to reach Lady Penelope.</p>' +
      '<h3>Points and lives</h3><ul><li>Points for each vine you reach, each crocodile you stab, each boulder you get past and each cannibal you jump.</li>' +
      '<li>The number at the top right is the <b>timer</b>. Reach Lady Penelope fast: the time left becomes your bonus. If it runs out, the game ends.</li>' +
      '<li>You start with five lives (the spare ones show at the top left), and earn one more at <b>10,000</b> points.</li></ul>' +
      '<h3>Controls</h3><p>The stick on the left and the red button on the right. On a computer: <b>arrow keys</b> or <b>WASD</b>, <b>Space</b> for the button, <b>P</b> to pause.</p>'
  });

  // opened from the Atari 2600's shelf: back goes to the shelf
  if (/[?&]from=atari2600/.test(location.search)) Kit.onBack = function () { location.href = 'atari2600.html'; return true; };

  // Testing hooks
  window.__jh = {
    core: C, mode: function () { return mode; }, score: score, scene: scene, lives: lives, round: round,
    step: function (n) { for (var i = 0; i < (n || 1); i++) { tick(); compose(); } render(); },
    start: function (cfg) { startTV(cfg || { who: 'Tim', game: 1 }); },
    press: function () { fireT = 3; }, move: function (d) { keyDir = { u: d === 'u', d: d === 'd', l: d === 'l', r: d === 'r' }; syncCtl(); },
    freeze: function (v) { frozen = !!v; if (!v) kick(); },
    frameImg: function () { render(); return scr.toDataURL(); }, render: render, pause: setPaused
  };

  new ResizeObserver(function () { fit(); }).observe($('view'));
  var saved0 = loadSave();
  if (saved0) startTV({ who: saved0.who, game: saved0.game || 1 }, saved0);
  else showSetup();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solitaire</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* ── Table ──────────────────────────────────────────────────────────────── */
.stage.play{max-width:780px;display:flex;flex-direction:column;padding:0 8px calc(var(--safe-b) + 4px);min-height:460px;}
.stable{flex:1;min-height:0;display:flex;border-radius:22px;padding:6px;}
.stable .felt-in{flex:1;position:relative;isolation:isolate;border-radius:16px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
/* Cards sit on the felt at absolute positions and glide between piles */
.scard{position:absolute;left:0;top:0;cursor:pointer;will-change:transform;
  transition:transform .27s cubic-bezier(.2,.8,.25,1), box-shadow .2s, filter .2s;}
.scard.nt{transition:none!important;}
.scard.flat{box-shadow:0 0 0 1px rgba(0,0,0,.08);}
.scard.lift{box-shadow:0 0 0 1px rgba(0,0,0,.1), 0 14px 26px rgba(0,0,0,.45);scale:1.05;}
.scard.flip{animation:flipin .3s ease-out;}
@keyframes flipin{0%{scale:0 1;}100%{scale:1 1;}}
.scard.nudge{animation:nudge .35s;}
@keyframes nudge{20%,60%{translate:-5px 0;}40%,80%{translate:5px 0;}}
.scard.hint,.slot.hint{box-shadow:0 0 0 3px var(--yellow), 0 0 18px rgba(255,200,61,.75);}
.scard.tgt{box-shadow:0 0 0 3px rgba(61,220,132,.9), 0 6px 14px rgba(0,0,0,.3);}
/* Readable at small sizes: big rank + suit in the corner, big suit below */
.felt-in .pcard .ix{flex-direction:row;align-items:baseline;left:6%;top:3%;font-size:calc(var(--cw) * .34);letter-spacing:-.06em;}
.felt-in .pcard .ix b{font-size:.84em;margin:0 0 0 1px;letter-spacing:0;}
.felt-in .pcard .ix.bot{display:none;}
.felt-in .pcard .pip{inset:30% 0 0 0;font-size:calc(var(--cw) * .58);}
.felt-in .pcard[data-r="A"] .pip{font-size:calc(var(--cw) * .7);}
.felt-in .pcard .face{inset:46% 12% 5% 12%;}
.felt-in .pcard .face span{font-size:calc(var(--cw) * .44);}
.felt-in .pcard .face i{display:none;}
/* Empty spaces */
.slot{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .1);
  border:2px solid rgba(255,255,255,.14);background:rgba(0,0,0,.13);display:grid;place-items:center;
  color:rgba(255,255,255,.22);font-family:var(--display);font-size:calc(var(--cw) * .5);}
.slot .ico{width:52%;height:52%;}
.slot.stock{cursor:pointer;color:rgba(255,255,255,.55);}
.slot.tgt{border-color:rgba(61,220,132,.9);background:rgba(61,220,132,.14);}
.badge{position:absolute;left:0;top:0;z-index:900;min-width:24px;padding:1px 7px;border-radius:999px;background:rgba(10,20,15,.78);
  color:#fff;font-size:.72rem;font-weight:900;text-align:center;pointer-events:none;font-variant-numeric:tabular-nums;}
/* Bottom bar: undo, clock, moves, score, hint */
.sbar{flex:none;display:flex;align-items:center;gap:8px;height:calc(56px + var(--corner-y));padding:6px calc(2px + var(--corner-x)) var(--corner-y);}
.sbar .icon-btn{width:46px;height:46px;}
.sbar .stats{flex:1;display:flex;justify-content:center;gap:clamp(14px,5vw,30px);}
.sbar .st{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:44px;}
.sbar .st b{font-size:1.08rem;font-weight:900;font-variant-numeric:tabular-nums;}
.sbar .st small{font-size:.64rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);}
.cascade{position:fixed;inset:0;z-index:440;transition:opacity .5s;}
/* Stats sheet */
.stt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:4px;}
.stt th,.stt td{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right;}
.stt th:first-child,.stt td:first-child{text-align:left;color:var(--text-2);font-weight:700;}
.stt thead th{color:var(--text-3);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;}
.stt td{font-weight:900;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'solitaire_state', STATS = 'solitaire_stats', HKEY = 'sol';
  var RANKS = 'A23456789TJQK', GL = { s: '♠', h: '♥', d: '♦', c: '♣' };
  function rv(c) { return RANKS.indexOf(c[0]) + 1; }
  function isRed(c) { return c[1] === 'h' || c[1] === 'd'; }
  function top(a) { return a[a.length - 1]; }
  function fmt(t) {
    t = t | 0; var h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = ('0' + t % 60).slice(-2);
    return h ? h + ':' + ('0' + m).slice(-2) + ':' + s : m + ':' + s;
  }
  function nth(n) { return ['', 'First', 'Second', 'Third', 'Fourth', 'Fifth', 'Sixth', 'Seventh', 'Eighth', 'Ninth', 'Tenth'][n] || n + 'th'; }

  Kit.init({
    id: 'solitaire',
    onNew: function () { showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'lightbulb', label: 'Hint', onClick: function () { hint(); } },
      { icon: 'sync', label: 'Restart this deal', onClick: function () { restart(); } },
      { icon: 'chart', label: 'Statistics', onClick: function () { showStats(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(HKEY, { title: 'Solitaire: past games' }); } }
    ],
    rules:
      '<p class="goal">Get all 52 cards onto the four <b>foundation</b> piles (top right), one suit per pile, from Ace up to King.</p>' +
      '<h3>The table</h3><ul>' +
      '<li><b>Seven columns</b> along the bottom. Only the last card in each column starts face up.</li>' +
      '<li><b>Stock</b> (top left): tap it to turn cards onto the <b>waste</b> pile beside it, 1 or 3 at a time. Only the top waste card can be played.</li>' +
      '<li>When the stock is empty, tap the empty spot to turn the waste pile over and go through it again. You can do this as often as you like.</li></ul>' +
      '<h3>Moving cards</h3><ul>' +
      '<li>In the columns, build <b>down</b> in <b>alternating colors</b>: a red 6 goes on a black 7.</li>' +
      '<li>You can move a whole run of face-up cards at once.</li>' +
      '<li>Only a <b>King</b> (or a run that starts with a King) can go in an empty column.</li>' +
      '<li>When you uncover a face-down card, it turns over.</li>' +
      '<li>Foundations build <b>up in one suit</b>: A, 2, 3 … K.</li></ul>' +
      '<h3>Controls</h3><ul>' +
      '<li><b>Tap</b> a card and it jumps to the best place it can go (a foundation first).</li>' +
      '<li>Or <b>drag</b> cards exactly where you want them.</li>' +
      '<li>Cards that are safe to put away go up by themselves. Once the stock is used up and every card is face up, the game finishes itself.</li>' +
      '<li><b>Undo</b> (bottom left) takes back as many moves as you like.</li></ul>' +
      '<h3>Standard scoring</h3><ul>' +
      '<li><b>+10</b> card to a foundation, <b>+5</b> waste card to a column, <b>+5</b> turning a card over.</li>' +
      '<li><b>−15</b> taking a card back off a foundation, <b>−100</b> each time you go back through the deck in Draw 1 (<b>−20</b> in Draw 3), <b>−2</b> every 10 seconds.</li>' +
      '<li>Win in under about 20 minutes for a big time bonus.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  // S.tab[i]   column i, bottom card first; S.down[i] = how many are face down
  // S.stock    top card last; S.waste top card last; S.found[f] Ace first
  var S = null, U = [], I = null, busy = false, token = 0, lastMove = { ids: [], t: 0 };

  function save() {
    if (!S || S.won) return;
    try { localStorage.setItem(SAVE, JSON.stringify({ S: S, U: U.slice(-150), I: I })); } catch (e) {}
    Kit.resume.set('Draw ' + S.draw + (S.moves ? ' · ' + S.moves + ' moves' : ''));
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function snapshot() { U.push(JSON.stringify(S)); }
  function std() { return S.scoring === 'std'; }
  function addScore(n) { if (std()) S.score = Math.max(0, S.score + n); }

  function showSetup() {
    token++; busy = false;
    app.className = 'stage';
    Kit.setup(app, {
      intro: 'Classic Klondike patience',
      options: [
        { id: 'draw', label: 'Turn over', value: 1, choices: [[1, 'Draw 1', 'Turn over one card at a time from the stock. Easier.'], [3, 'Draw 3', 'Turn over three at a time and play only the top one. Harder.']] },
        { id: 'scoring', label: 'Scoring', value: 'std', choices: [['std', 'Standard', 'Earn points for good moves and lose some for going through the deck and for time.'], ['none', 'No score', 'Just play, with no points to keep track of.']] }
      ],
      start: 'Deal',
      onStart: function (cfg) { newGame(+cfg.options.draw === 3 ? 3 : 1, cfg.options.scoring === 'none' ? 'none' : 'std'); }
    });
  }

  function newGame(draw, scoring) {
    abandon();
    var d = []; 'shdc'.split('').forEach(function (s) { RANKS.split('').forEach(function (r) { d.push(r + s); }); });
    Cards.shuffle(d);
    var tab = [], down = [];
    for (var i = 0; i < 7; i++) { tab.push([]); down.push(i); }
    for (var r = 0; r < 7; r++) for (var c = r; c < 7; c++) tab[c].push(d.pop());
    S = { draw: draw, scoring: scoring, stock: d, waste: [], fan: 0, found: [[], [], [], []], tab: tab, down: down,
      score: 0, moves: 0, time: 0, passes: 0, flips: 0, undos: 0, auto: 0, counted: false, won: false, started: Date.now() };
    U = []; I = JSON.stringify(S); token++; busy = false;
    Kit.gameStart();
    build(); dealAnim(); save();
    Kit.sfx('deal');
  }
  function restart() {
    if (!S || !I || S.won) return;
    token++; busy = false; snapshot();
    var t = S.time, cnt = S.counted, st = S.started;
    S = JSON.parse(I); S.time = t; S.counted = cnt; S.started = st;
    Kit.sfx('whoosh'); Kit.toast('Back to the start of this deal');
    place(); updBar(); save();
  }

  // ── Stats (this device) ───────────────────────────────────────────────────
  function loadStats() { try { return JSON.parse(localStorage.getItem(STATS)) || {}; } catch (e) { return {}; } }
  function saveStats(st) { try { localStorage.setItem(STATS, JSON.stringify(st)); } catch (e) {} }
  function bucket(st, k) { return st[k] || (st[k] = { played: 0, won: 0, streak: 0, bestStreak: 0, bestTime: 0, fewest: 0, bestScore: 0 }); }
  function begin() {
    if (S.counted) return;
    S.counted = true;
    var st = loadStats(); bucket(st, 'd' + S.draw).played++; saveStats(st);
  }
  function abandon() {
    if (!S || !S.counted || S.won) return;
    var st = loadStats(); bucket(st, 'd' + S.draw).streak = 0; saveStats(st);
  }
  function showStats() {
    var st = loadStats(), a = bucket(st, 'd1'), b = bucket(st, 'd3');
    function pct(m) { return m.played ? Math.round(100 * m.won / m.played) + '%' : '–'; }
    var rows = [
      ['Played', a.played, b.played], ['Won', a.won, b.won], ['Win rate', pct(a), pct(b)],
      ['Current streak', a.streak, b.streak], ['Best streak', a.bestStreak, b.bestStreak],
      ['Best time', a.bestTime ? fmt(a.bestTime) : '–', b.bestTime ? fmt(b.bestTime) : '–'],
      ['Fewest moves', a.fewest || '–', b.fewest || '–'],
      ['Best score', a.bestScore ? a.bestScore.toLocaleString() : '–', b.bestScore ? b.bestScore.toLocaleString() : '–']
    ];
    var t = el('table', { class: 'stt' }, [el('thead', null, [el('tr', null, [el('th', { text: '' }), el('th', { text: 'Draw 1' }), el('th', { text: 'Draw 3' })])])]);
    var tb = el('tbody'); rows.forEach(function (r) { tb.appendChild(el('tr', null, r.map(function (v, i) { return el('td', { text: String(v) }); }))); });
    t.appendChild(tb);
    Kit.sheet({ title: 'Statistics', node: el('div', null, [el('p', { class: 'muted', text: 'Games on this device. A game counts once you make a move.' }), t]),
      actions: [{ label: 'Close', cls: 'btn-soft' }, { label: 'Reset statistics', cls: 'btn-ghost', onClick: function () {
        Kit.confirm('Reset Solitaire statistics?', { ok: 'Reset', danger: true }).then(function (ok) { if (ok) { saveStats({}); Kit.toast('Statistics reset'); } });
      } }] });
  }

  // ── Rules ─────────────────────────────────────────────────────────────────
  function canFound(c, f) { return f.length ? top(f)[1] === c[1] && rv(top(f)) + 1 === rv(c) : rv(c) === 1; }
  function canTab(c, i) {
    var p = S.tab[i]; if (!p.length) return rv(c) === 13;
    var t = top(p); return isRed(t) !== isRed(c) && rv(t) === rv(c) + 1;
  }
  function locate(id) {
    var k;
    for (var i = 0; i < 7; i++) if ((k = S.tab[i].indexOf(id)) >= 0) return { t: 'tab', i: i, k: k };
    if ((k = S.waste.indexOf(id)) >= 0) return { t: 'waste', k: k };
    for (var f = 0; f < 4; f++) if ((k = S.found[f].indexOf(id)) >= 0) return { t: 'found', i: f, k: k };
    if ((k = S.stock.indexOf(id)) >= 0) return { t: 'stock', k: k };
    return null;
  }
  // Cards that would move if you pick up `src` (null if it can't be picked up)
  function grab(src) {
    if (!src) return null;
    if (src.t === 'tab') return src.k >= S.down[src.i] ? S.tab[src.i].slice(src.k) : null;
    if (src.t === 'waste') return S.waste.length ? [top(S.waste)] : null;
    if (src.t === 'found') return src.k === S.found[src.i].length - 1 ? [top(S.found[src.i])] : null;
    return null;
  }
  function legalDests(src) {
    var cards = grab(src); if (!cards) return [];
    var c = cards[0], out = [];
    if (cards.length === 1 && src.t !== 'found') for (var f = 0; f < 4; f++) if (canFound(c, S.found[f])) { out.push({ t: 'found', i: f }); break; }
    for (var i = 0; i < 7; i++) if (!(src.t === 'tab' && src.i === i) && canTab(c, i)) out.push({ t: 'tab', i: i });
    return out;
  }
  // Tap: foundation first, then a column with cards, then an empty column
  function bestDest(src) {
    var d = legalDests(src);
    if (src.t === 'found') return null;
    var f = d.filter(function (x) { return x.t === 'found'; })[0]; if (f) return f;
    var full = d.filter(function (x) { return x.t === 'tab' && S.tab[x.i].length; })[0]; if (full) return full;
    var empty = d.filter(function (x) { return x.t === 'tab'; })[0];
    if (empty && !(src.t === 'tab' && src.k === 0)) return empty;
    return null;
  }
  function take(src) {
    if (src.t === 'tab') { var out = S.tab[src.i].splice(src.k); flipTop(src.i); return out; }
    if (src.t === 'waste') { S.fan = Math.max(0, S.fan - 1); return [S.waste.pop()]; }
    if (src.t === 'found') return [S.found[src.i].pop()];
    return [];
  }
  var flipped = null;
  function flipTop(i) {
    S.down[i] = Math.min(S.down[i], S.tab[i].length);
    if (S.tab[i].length && S.down[i] >= S.tab[i].length) { S.down[i] = S.tab[i].length - 1; addScore(5); S.flips++; flipped = top(S.tab[i]); }
  }
  function apply(src, dst) {
    var cards = take(src);
    if (dst.t === 'found') S.found[dst.i].push(cards[0]); else S.tab[dst.i] = S.tab[dst.i].concat(cards);
    if (dst.t === 'found' && src.t !== 'found') addScore(10);
    if (src.t === 'waste' && dst.t === 'tab') addScore(5);
    if (src.t === 'found' && dst.t === 'tab') addScore(-15);
    lastMove = { ids: cards, t: Date.now() };
    return cards;
  }
  function doMove(src, dst) {
    snapshot(); begin();
    apply(src, dst); S.moves++;
    Kit.sfx(dst.t === 'found' ? 'pop' : 'flip'); Kit.haptic('light');
    after();
  }
  function tapStock() {
    if (S.stock.length) {
      snapshot(); begin();
      var n = Math.min(S.draw, S.stock.length);
      for (var i = 0; i < n; i++) S.waste.push(S.stock.pop());
      S.fan = n; S.moves++; Kit.sfx('flip'); Kit.haptic('light');
    } else if (S.waste.length) {
      snapshot(); begin();
      S.stock = S.waste.reverse(); S.waste = []; S.fan = 0; S.passes++; S.moves++;
      addScore(S.draw === 1 ? -100 : -20);
      Kit.sfx('whoosh'); Kit.haptic('medium');
    } else return;
    lastMove = { ids: [], t: Date.now() };
    after();
  }
  function isWon() { return S.found.every(function (f) { return f.length === 13; }); }
  function finishing() { return !S.stock.length && !S.waste.length && S.down.every(function (d) { return d === 0; }) && !isWon(); }
  function frank(s) { for (var f = 0; f < 4; f++) if (S.found[f].length && S.found[f][0][1] === s) return S.found[f].length; return 0; }
  // A card is safe to put away when nothing still in play could need to go on it
  function safe(c) {
    var r = rv(c); if (r <= 2) return true;
    var opp = isRed(c) ? ['s', 'c'] : ['h', 'd'];
    return frank(opp[0]) >= r - 1 && frank(opp[1]) >= r - 1;
  }
  function nextAuto() {
    var fin = finishing(), cands = [];
    if (S.waste.length) cands.push({ t: 'waste', k: S.waste.length - 1, c: top(S.waste) });
    for (var i = 0; i < 7; i++) if (S.tab[i].length) cands.push({ t: 'tab', i: i, k: S.tab[i].length - 1, c: top(S.tab[i]) });
    cands.sort(function (a, b) { return rv(a.c) - rv(b.c); });
    for (var j = 0; j < cands.length; j++) {
      if (!fin && !safe(cands[j].c)) continue;
      for (var f = 0; f < 4; f++) if (canFound(cands[j].c, S.found[f])) return { src: cands[j], dst: { t: 'found', i: f }, fin: fin };
    }
    return null;
  }
  function after() {
    place(); updBar(); save();
    if (isWon()) return win();
    busy = true; var tk = ++token;
    setTimeout(function () { if (tk === token) autoStep(tk); }, 260);
  }
  function autoStep(tk) {
    var mv = nextAuto();
    if (!mv) { busy = false; save(); return; }
    apply(mv.src, mv.dst); S.auto++;
    if (mv.fin) S.finished = (S.finished || 0) + 1;
    Kit.sfx('pop'); place(); updBar();
    if (isWon()) { busy = false; return win(); }
    setTimeout(function () { if (tk === token) autoStep(tk); }, mv.fin ? 110 : 190);
  }

  function undo() {
    if (!S || S.won) return;
    if (!U.length) { Kit.toast('Nothing to undo'); return; }
    token++; busy = false;
    var t = S.time, n = S.undos;
    S = JSON.parse(U.pop()); S.time = t; S.undos = n + 1;
    Kit.sfx('whoosh'); Kit.haptic('light');
    place(); updBar(); save();
  }

  // ── Hint ──────────────────────────────────────────────────────────────────
  function findHint() {
    var i, k, d;
    var srcs = [];
    if (S.waste.length) srcs.push({ t: 'waste', k: S.waste.length - 1 });
    for (i = 0; i < 7; i++) for (k = S.down[i]; k < S.tab[i].length; k++) srcs.push({ t: 'tab', i: i, k: k });
    // 1. anything to a foundation
    for (var a = 0; a < srcs.length; a++) {
      var s = srcs[a]; if (s.t === 'tab' && s.k !== S.tab[s.i].length - 1) continue;
      d = legalDests(s).filter(function (x) { return x.t === 'found'; })[0]; if (d) return { src: s, dst: d };
    }
    // 2. move a run that uncovers a face-down card, or 3. clears a column for a waiting King
    var kingWaiting = (S.waste.length && rv(top(S.waste)) === 13) || S.tab.some(function (p, j) { return S.down[j] > 0 && rv(p[S.down[j]]) === 13; });
    for (a = 0; a < srcs.length; a++) {
      s = srcs[a]; if (s.t !== 'tab' || s.k !== S.down[s.i]) continue;
      if (s.k === 0 && !(kingWaiting && rv(S.tab[s.i][0]) !== 13)) continue;
      d = legalDests(s).filter(function (x) { return x.t === 'tab' && (S.tab[x.i].length || s.k > 0); })[0]; if (d) return { src: s, dst: d };
    }
    // 4. waste card onto a column
    if (S.waste.length) { d = legalDests({ t: 'waste', k: 0 })[0]; if (d) return { src: { t: 'waste', k: S.waste.length - 1 }, dst: d }; }
    // 5. split a run so the card underneath can go up
    for (a = 0; a < srcs.length; a++) {
      s = srcs[a]; if (s.t !== 'tab' || s.k <= S.down[s.i]) continue;
      var under = S.tab[s.i][s.k - 1];
      if (!S.found.some(function (f) { return canFound(under, f); })) continue;
      d = legalDests(s).filter(function (x) { return x.t === 'tab'; })[0]; if (d) return { src: s, dst: d };
    }
    if (S.stock.length || S.waste.length) return { stock: true };
    return null;
  }
  function hint() {
    if (!S || S.won || busy) return;
    var h = findHint();
    if (!h) { Kit.toast('No moves left. Try Undo, or start a new deal.'); Kit.sfx('bad'); return; }
    var lit = [];
    if (h.stock) { lit.push(S.stock.length ? cardEls[top(S.stock)] : slots.stock); Kit.toast(S.stock.length ? 'Turn over a card from the stock' : 'Go back through the deck'); }
    else {
      grab(h.src).forEach(function (id) { lit.push(cardEls[id]); });

  // ── Table ─────────────────────────────────────────────────────────────────

  function place(instant) {
    if (!S || !felt) return;

    for (j = 0; j < 7; j++) setXY(slots.t[j], xs[j], G.tabY);
    S.stock.forEach(function (c, k) { put(c, xs[0], y0, 10 + k, false, 0, k < S.stock.length - 1); });
    badge.hidden = !S.stock.length; badge.textContent = S.stock.length;
    setXY(badge, xs[0] + cw / 2 - 14, y0 + ch - 22);
    var vf = S.draw === 3 ? Math.max(1, Math.min(3, S.fan, S.waste.length)) : 1, step = Math.round(cw * .46), wl = S.waste.length;

  }

    setXY(badge, xs[0] + G.cw / 2 - 14, G.topY + G.ch - 22);

  // ── Touch: tap to auto-move, or drag ──────────────────────────────────────

  }

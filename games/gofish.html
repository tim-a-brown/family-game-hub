<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go Fish</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="gofish/decks.js"></script>
<script src="gofish-core.js"></script>
<style>
/* ── The page is laid out to the screen: upright, the table over your hand; sideways, the table at the left and what
   you act with (what's happening, your hand) at the right. fit() sizes everything from the room there is. ── */
.gf{position:relative;display:grid;gap:8px;box-sizing:border-box;margin:0 auto;width:100%;
  height:var(--ph,calc(100dvh - var(--bar,64px)));padding:4px 10px max(calc(var(--safe-b) + 6px),18px);}
.gf.up{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"tbl" "say" "hand";}
.gf.side{grid-template-columns:minmax(0,1fr) var(--side,380px);grid-template-rows:minmax(0,1fr) auto auto minmax(0,1fr);grid-template-areas:"tbl ." "tbl say" "tbl hand" "tbl .";column-gap:12px;row-gap:4px;
  padding-left:max(var(--safe-l,0px),10px);padding-right:max(var(--safe-r,0px),17px);}
.gf.big.up{padding-left:16px;padding-right:16px;gap:10px;}
.gf > .tbl{grid-area:tbl;min-height:0;min-width:0;}
.gf > .say{grid-area:say;min-width:0;}
.gf > .hand{grid-area:hand;min-width:0;min-height:0;}
/* An iPad held sideways: the setup in two columns, the players beside the options */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  .stage:has(> .setup){max-width:min(1000px,94vw);display:flex;flex-direction:column;justify-content:center;min-height:calc(100dvh - var(--bar,64px) - 30px);}
  .stage > .setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;row-gap:22px;align-items:start;zoom:1.22;}
  .stage > .setup > .setup-hero,.stage > .setup > .k-joins,.stage > .setup > .k-startdock{grid-column:1 / -1;}
  .stage > .setup > .k-seats{grid-column:1;}
  .stage > .setup > .k-opts{grid-column:2;}
}

/* ── The table: wood and felt, and the play laid over it ── */
.tbl{position:relative;border-radius:26px;padding:8px;}
.tbl > .felt-in{position:absolute;inset:8px;border-radius:19px;overflow:hidden;}
.tbl > .felt-in::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 52%,rgba(255,255,255,.07),transparent 70%);pointer-events:none;}
.lay{position:absolute;inset:8px;--fz:1;}
/* seats round the top: a tag (who, and the books they have made), the cards they hold, their books face up */
.seat{position:absolute;z-index:4;display:flex;flex-direction:column;align-items:center;gap:calc(4px * var(--fz));padding:calc(5px * var(--fz)) calc(6px * var(--fz));min-width:44px;min-height:44px;border:0;border-radius:16px;background:none;color:#fff;font:inherit;cursor:default;-webkit-tap-highlight-color:transparent;transition:background .2s;}
.seat.can{cursor:pointer;}
.seat.can:active .tg{scale:.96;}
.seat .tg{position:relative;display:flex;align-items:center;gap:calc(6px * var(--fz));padding:calc(3px * var(--fz)) calc(5px * var(--fz)) calc(3px * var(--fz)) calc(3px * var(--fz));border-radius:999px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px) saturate(.7);backdrop-filter:blur(10px) saturate(.7);box-shadow:var(--plate-line),0 2px 8px rgba(0,0,0,.3);font-weight:700;font-size:calc(.8rem * var(--fz));white-space:nowrap;transition:box-shadow .25s,scale .3s var(--spring);}
.seat .tg .avatar{width:calc(26px * var(--fz));height:calc(26px * var(--fz));font-size:calc(.72rem * var(--fz));flex:none;}
.seat .tg .avatar .ico{width:60%;height:60%;}
.seat .tg .nm{padding-right:2px;}
.bkn{display:inline-grid;place-items:center;min-width:calc(22px * var(--fz));height:calc(22px * var(--fz));padding:0 calc(6px * var(--fz));border-radius:999px;background:rgba(255,255,255,.12);font-family:var(--display);font-size:calc(.86rem * var(--fz));font-variant-numeric:tabular-nums;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);}
.bkn.lead{background:color-mix(in srgb,var(--lit) 20%,transparent);color:var(--lit-ink);box-shadow:inset 0 0 0 1px rgba(255,211,77,.55);}
.bkn.bump{animation:gfbump .55s var(--spring);}
@keyframes gfbump{30%{scale:1.45;}}
.seat.turn .tg,.mine.turn .tg{box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.8),0 0 18px var(--litg),0 2px 8px rgba(0,0,0,.3);scale:1.05;}
.seat.turn .tg::before,.mine.turn .tg::before{content:"";position:absolute;left:12px;right:12px;top:-1px;height:2px;border-radius:2px;background:var(--lit);box-shadow:0 0 8px 1px var(--litg);}
.seat.can .tg{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45),0 2px 8px rgba(0,0,0,.3);animation:gfcan 1.8s ease-in-out infinite;}
@keyframes gfcan{50%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8),0 0 14px rgba(255,255,255,.25),0 2px 8px rgba(0,0,0,.3);}}
.seat.pick .tg{box-shadow:inset 0 0 0 2px var(--lit),0 0 22px var(--litg),0 2px 8px rgba(0,0,0,.3);scale:1.1;animation:none;}
.seat.asked .tg{animation:gfasked .5s ease-in-out 2;}
@keyframes gfasked{50%{scale:1.12;}}
.seat.out{opacity:.55;}
.fan{position:relative;display:flex;align-items:center;--cw:calc(20px * var(--fz));height:calc(var(--cw) * 1.4);}
.fan .pcard{box-shadow:0 1px 3px rgba(0,0,0,.45);}
.fan .pcard+.pcard{margin-left:calc(var(--cw) * -.7);}
.fan .cnt{margin-left:calc(5px * var(--fz));font-weight:800;font-size:calc(.72rem * var(--fz));color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5);}
.fan.none .cnt{margin:0;}
/* a book: four cards of a rank squared up, the rank on top (the same piece at every seat, and for you) */
.books{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(3px * var(--fz));max-width:100%;--bw:calc(17px * var(--fz));}
.bk{position:relative;flex:none;width:var(--bw);height:calc(var(--bw) * 1.38);}
.bk i{position:absolute;inset:0;border-radius:calc(var(--bw) * .14);background:linear-gradient(160deg,#fff,#efe7d4);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.35);}
.bk i:nth-child(1){translate:calc(var(--bw) * .12) calc(var(--bw) * -.08);rotate:6deg;}
.bk i:nth-child(2){translate:calc(var(--bw) * .06) calc(var(--bw) * -.04);rotate:3deg;}
.bk b{position:absolute;inset:0;display:grid;place-items:center;border-radius:calc(var(--bw) * .14);background:linear-gradient(160deg,#ffffff,#f7f1e3);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 2px 3px rgba(0,0,0,.35);font-family:var(--display);font-weight:400;font-size:calc(var(--bw) * .62);color:#1d1b2e;line-height:1;letter-spacing:-.04em;}
.bk.red b{color:#d81e3a;}
.bk.new{animation:gfbook .7s var(--spring);}
/* a pair: two cards of a rank laid overlapped, each in its own suit's ink (or, in a themed deck, its picture over its band) */
.bk.pr{width:calc(var(--bw) * 1.34);}
.bk.pr b{inset:0 auto 0 0;width:var(--bw);}
.bk.pr b.p1{rotate:-8deg;translate:0 calc(var(--bw) * .04);}
.bk.pr b.p2{left:calc(var(--bw) * .34);rotate:5deg;}
.bk.pr b.rd{color:#d81e3a;}
.bk.pr.th b{background:var(--pi) center/cover no-repeat;box-shadow:inset 0 calc(var(--bw) * -.13) 0 var(--band),0 0 0 .5px rgba(0,0,0,.2),0 2px 3px rgba(0,0,0,.35);}
/* (a seat's pairs wrap in rows of seven, so a seat doesn't run across the table) */
.gf.pairs .seat .books{max-width:calc((var(--bw) * 1.34 + 3px * var(--fz)) * 7);}
@keyframes gfbook{0%{scale:.2;opacity:0;}60%{scale:1.3;opacity:1;}100%{scale:1;}}
/* you, along the bottom of the felt: your tag and your books */
.mine{position:absolute;z-index:4;left:50%;bottom:calc(6px * var(--fz));translate:-50% 0;display:flex;align-items:center;gap:calc(10px * var(--fz));max-width:calc(100% - 12px);}
.mine .tg{position:relative;display:flex;align-items:center;gap:calc(6px * var(--fz));padding:calc(3px * var(--fz)) calc(5px * var(--fz)) calc(3px * var(--fz)) calc(3px * var(--fz));border-radius:999px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px) saturate(.7);backdrop-filter:blur(10px) saturate(.7);box-shadow:var(--plate-line),0 2px 8px rgba(0,0,0,.3);font-weight:700;font-size:calc(.8rem * var(--fz));white-space:nowrap;color:#fff;flex:none;transition:box-shadow .25s,scale .3s var(--spring);}
.mine .tg .avatar{width:calc(26px * var(--fz));height:calc(26px * var(--fz));font-size:calc(.72rem * var(--fz));flex:none;}
.mine .tg .avatar .ico{width:60%;height:60%;}
.mine .books{flex-wrap:nowrap;justify-content:flex-start;--bw:calc(22px * var(--fz));min-height:calc(var(--bw) * 1.38);}
/* the pond: the cards nobody holds, face down and scattered in the middle */
.pond{position:absolute;z-index:2;border-radius:50%;}
.pond .pd{position:absolute;left:0;top:0;--cw:var(--pcw,44px);box-shadow:0 2px 5px rgba(0,0,0,.45);transition:translate .35s ease,rotate .35s ease,box-shadow .2s;}
.pond.fish{cursor:pointer;}
.pond.fish .pd{box-shadow:0 0 0 1.5px rgba(255,211,77,.55),0 3px 8px rgba(0,0,0,.45);}
.pond.fish .pd:active{translate:0 -6px;}
.pond .ring{position:absolute;left:50%;top:50%;width:100%;height:100%;translate:-50% -50%;border-radius:50%;border:2px solid rgba(190,230,255,.5);pointer-events:none;opacity:0;}
.pond.fish .ring{animation:gfripple 2.4s ease-out infinite;}
.pond.fish .ring:nth-of-type(2){animation-delay:1.2s;}
.pond .ring.once{animation:gfripple 1.1s ease-out 1 !important;}
@keyframes gfripple{0%{scale:.35;opacity:.75;}100%{scale:1.25;opacity:0;}}
.pondlbl{position:absolute;z-index:3;translate:-50% 0;padding:4px 11px;border-radius:999px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--plate-line);color:rgba(255,255,255,.85);font-weight:700;font-size:calc(.74rem * var(--fz));white-space:nowrap;pointer-events:none;transition:color .2s,box-shadow .2s;}
.pondlbl.fish{color:var(--lit-ink);box-shadow:inset 0 0 0 1px rgba(255,211,77,.6),0 0 14px var(--litg);}
/* speech bubbles, over everything on the table */
.bub{position:absolute;z-index:8;max-width:min(260px,70%);padding:7px 13px;border-radius:16px;background:#fffdf6;color:#1d1b2e;font-weight:700;font-size:calc(.9rem * var(--fz));line-height:1.25;box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none;animation:gfpop .32s var(--spring);text-wrap:balance;text-align:center;}
.bub::after{content:"";position:absolute;left:var(--tx,50%);width:12px;height:12px;background:inherit;rotate:45deg;translate:-50% 0;border-radius:2px;}
.bub.dn::after{bottom:-5px;} .bub.upw::after{top:-5px;}
.bub.fish{background:#dff3ff;color:#0b3550;}
.bub.lucky{background:var(--lit);color:#2b1a00;}
.bub.out{animation:gfout .25s ease-in forwards;}
@keyframes gfpop{from{scale:.4;opacity:0;}to{scale:1;opacity:1;}}
@keyframes gfout{to{scale:.8;opacity:0;}}
.plus1{position:absolute;z-index:9;font-family:var(--display);font-size:calc(1.3rem * var(--fz));color:var(--lit);text-shadow:0 0 12px var(--litg),0 2px 4px rgba(0,0,0,.5);pointer-events:none;animation:gfplus 1.1s ease-out forwards;}
@keyframes gfplus{0%{translate:-50% 0;scale:.5;opacity:0;}20%{scale:1.2;opacity:1;}100%{translate:-50% -44px;scale:1;opacity:0;}}

/* ── What's happening (and what to do) ── */
.say{display:flex;align-items:center;justify-content:center;min-height:44px;padding:4px 8px;text-align:center;color:var(--text-2);font-weight:750;font-size:.98rem;line-height:1.25;text-wrap:balance;}
.say b{color:var(--lit-ink);font-weight:800;}
.say.go{color:#fff;}
.gf.big .say{font-size:1.12rem;min-height:52px;}
.say.nudge{animation:gfnudge .4s;}
@keyframes gfnudge{20%{translate:-6px 0;}40%{translate:6px 0;}60%{translate:-4px 0;}80%{translate:3px 0;}}

/* ── Your hand, in groups by rank: each group is what you can ask for ── */
.hand{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:var(--rg,8px);padding-top:calc(var(--cw) * .16);}
.gf.side > .hand{justify-content:center;}
.hrow{display:flex;justify-content:center;align-items:flex-end;gap:var(--gg,8px);}
.grp{position:relative;flex:none;display:flex;padding:0;margin:0;border:0;background:none;font:inherit;cursor:default;-webkit-tap-highlight-color:transparent;transition:translate .25s var(--spring),filter .2s;border-radius:calc(var(--cw) * .12);}
.grp .pcard+.pcard{margin-left:calc(var(--cw) * var(--ov,-.72));}
.grp.can{cursor:pointer;}
.grp.can:active{translate:0 -4px;}
.grp.sel{translate:0 calc(var(--cw) * -.14);}
.grp.sel .pcard{box-shadow:0 0 0 2px var(--lit),0 0 16px var(--litg),0 6px 14px rgba(0,0,0,.35);}
.grp.want .pcard{box-shadow:0 0 0 2px #fff,0 0 18px rgba(255,255,255,.6),0 6px 14px rgba(0,0,0,.35);}
.grp.want{translate:0 calc(var(--cw) * -.1);}
.grp.dim{filter:brightness(.82);}
.grp .gn{position:absolute;right:calc(var(--cw) * -.12);top:calc(var(--cw) * -.14);z-index:3;display:grid;place-items:center;min-width:calc(var(--cw) * .34);height:calc(var(--cw) * .34);padding:0 3px;border-radius:999px;background:#1d1b2e;color:#fff;font-weight:800;font-size:calc(var(--cw) * .2);font-variant-numeric:tabular-nums;box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 2px 4px rgba(0,0,0,.4);}
.grp.three .gn{background:var(--lit);color:#2b1a00;box-shadow:0 0 0 1.5px #fff,0 0 10px var(--litg);}
.hand.blind .pcard{pointer-events:none;}
.ghost{position:fixed;z-index:60;pointer-events:none;margin:0;left:0;top:0;transform-origin:50% 50%;}

/* ── Themed decks (gofish/decks.js): a card is its subject's picture on the deck's panel, over a band in its suit's
   color with the name, and the suit's mark in the top corner; the back is the deck's colors round its emblem ── */
.pcard.gft{background:linear-gradient(160deg,#fffdf8 0%,#f8f2e6 70%,#efe6d4 100%);}
.pcard.gft .art{position:absolute;left:5.5%;right:5.5%;top:4%;aspect-ratio:1;border-radius:calc(var(--cw) * .075) calc(var(--cw) * .075) calc(var(--cw) * .02) calc(var(--cw) * .02);
  background:var(--pa) center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);}
.pcard.gft .mk{position:absolute;z-index:2;left:2.5%;top:1.8%;display:grid;place-items:center;width:calc(var(--cw) * .22);height:calc(var(--cw) * .22);border-radius:50%;
  background:var(--band);color:#fff;font-size:calc(var(--cw) * .13);line-height:1;box-shadow:0 0 0 calc(var(--cw) * .018) #fffdf8,0 1px 2px rgba(0,0,0,.25);}
.pcard.gft .mk.lt,.pcard.gft .nm.lt{color:#3b2500;}
/* (Tim, 2026-11-15: "make the top left image on the go fish set just a tiny version of the large art"): the corner is the
   picture itself in a round frame ringed in the card's band color */
.pcard.gft .mk.pic{width:calc(var(--cw) * .27);height:calc(var(--cw) * .27);background-color:var(--pa,#fff);background-size:cover;background-position:center;
  box-shadow:inset 0 0 0 calc(var(--cw) * .022) var(--band),0 0 0 calc(var(--cw) * .016) #fffdf8,0 1px 2px rgba(0,0,0,.3);}
.pcard.gft .nm{position:absolute;left:5.5%;right:5.5%;top:calc(4% + var(--cw) * .89 * 1.0);bottom:3.6%;display:flex;align-items:center;justify-content:center;padding:0 calc(var(--cw) * .04);
  border-radius:calc(var(--cw) * .02) calc(var(--cw) * .02) calc(var(--cw) * .075) calc(var(--cw) * .075);background:var(--band);color:#fff;
  box-shadow:inset 0 calc(var(--cw) * .012) 0 rgba(255,255,255,.22);}
.grp .pcard.gft:not(:last-of-type) .nm span,.fan .pcard.gft .nm span{visibility:hidden;}   /* (a card covered by the next one in a group shows its band, not a clipped name) */
.pcard.gft .nm span{font-family:var(--font);font-weight:800;font-size:calc(var(--cw) * var(--nf,.13) * var(--nfx,1));line-height:1.04;text-align:center;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:normal;}
.pcard.gft.nfm .nm span{font-size:calc(var(--cw) * var(--nf,.13));}
/* each themed deck's names are lettered in a face that fits it (Tim, 2026-11-15: "make sure the Go Fish cards list the name of
   the item on the card in a creative but fitting font"); printed on the card, so the face is the deck's own, not the app's.
   --nfx evens out how wide each face runs. fonts/gofish-decks-LICENSE.txt */
@font-face{font-family:"GF Space";src:url("../fonts/gofish-space.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;}
@font-face{font-family:"GF Cats";src:url("../fonts/gofish-cats.woff2") format("woff2");font-weight:800;font-style:normal;font-display:block;}
@font-face{font-family:"GF Dogs";src:url("../fonts/gofish-dogs.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;}
@font-face{font-family:"GF Zoo";src:url("../fonts/lilita-one.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;}
@font-face{font-family:"GF Food";src:url("../fonts/gofish-food.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;}
@font-face{font-family:"GF Flowers";src:url("../fonts/gofish-flowers.woff2") format("woff2");font-weight:700;font-style:italic;font-display:block;}
@font-face{font-family:"GF Sports";src:url("../fonts/gofish-sports.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;}
@font-face{font-family:"GF Jobs";src:url("../fonts/fredoka-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:block;}
@font-face{font-family:"GF States";src:url("../fonts/alfa-slab-one.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;}
@font-face{font-family:"GF Countries";src:url("../fonts/gofish-countries.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;}
.pcard.gft.th-space .nm span{font-family:"GF Space",var(--font);font-weight:400;font-style:normal;--nfx:0.8;letter-spacing:0;}
.pcard.gft.th-cats .nm span{font-family:"GF Cats",var(--font);font-weight:800;font-style:normal;--nfx:0.92;letter-spacing:0;}
.pcard.gft.th-dogs .nm span{font-family:"GF Dogs",var(--font);font-weight:400;font-style:normal;--nfx:1.0;letter-spacing:0;}
.pcard.gft.th-zoo .nm span{font-family:"GF Zoo",var(--font);font-weight:400;font-style:normal;--nfx:0.95;letter-spacing:0;}
.pcard.gft.th-food .nm span{font-family:"GF Food",var(--font);font-weight:400;font-style:normal;--nfx:1.0;letter-spacing:0;}
.pcard.gft.th-flowers .nm span{font-family:"GF Flowers",var(--font);font-weight:700;font-style:italic;--nfx:0.95;letter-spacing:0;}
.pcard.gft.th-sports .nm span{font-family:"GF Sports",var(--font);font-weight:400;font-style:normal;--nfx:0.8;letter-spacing:0;}
.pcard.gft.th-jobs .nm span{font-family:"GF Jobs",var(--font);font-weight:600;font-style:normal;--nfx:0.95;letter-spacing:0;}
.pcard.gft.th-states .nm span{font-family:"GF States",var(--font);font-weight:400;font-style:normal;--nfx:0.86;letter-spacing:0;}
.pcard.gft.th-countries .nm span{font-family:"GF Countries",var(--font);font-weight:400;font-style:normal;--nfx:0.98;letter-spacing:0;}
.pcard.back.gfb{background:
    var(--em) center/46% no-repeat,
    radial-gradient(circle at 50% 50%,rgba(255,251,242,.96) 0 25%,rgba(255,251,242,.0) 25.6%),
    radial-gradient(circle at 50% 50%,transparent 0 28.5%,rgba(255,255,255,.4) 29% 30%,transparent 30.6%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.09) 0 2px,transparent 2px 7px),
    linear-gradient(140deg,var(--back-a),var(--back-b));
  box-shadow:inset 0 0 0 calc(var(--cw) * .05) rgba(255,251,242,.92),inset 0 0 0 calc(var(--cw) * .075) var(--back-a),0 0 0 1px rgba(0,0,0,.12),0 2px 0 rgba(0,0,0,.15),0 6px 14px rgba(0,0,0,.3);}
/* a themed book: the picture on top */

<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var Core = window.GoFishCore, el = Kit.el, app = document.getElementById('app');
  var SAVE = 'gofish_state', HKEY = 'gofish';
  var SUITG = { s: '♠', h: '♥', d: '♦', c: '♣' };
  // where the other players sit round the top of the table, from your left over the top to your right (fractions of
  // the felt); the seat to your left plays after you
  var SEATS = {
    1: [[0.5, 0.03]],
    2: [[0.24, 0.04], [0.76, 0.04]],
    3: [[0.13, 0.3], [0.5, 0.03], [0.87, 0.3]],
    4: [[0.13, 0.34], [0.32, 0.03], [0.68, 0.03], [0.87, 0.34]],
    5: [[0.12, 0.38], [0.2, 0.04], [0.5, 0.02], [0.8, 0.04], [0.88, 0.38]]
  };

  Kit.init({
    id: 'gofish',
    snapHide: function () { return S && !onePerson() ? '.hand' : null; },   // (Keep playing's picture: a person's hand never shows in pass and play)
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: function () { return PR() ? 'Pairs so far' : 'Books so far'; }, onClick: function () { if (S && S.players) showBooks(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(HKEY, { title: 'Go Fish: past games' }); } }
    ]),
    // (the words follow the deck: the one on the table, or the one chosen in the setup)
    rules: function () {
      var th = TH(), pr = PR(), so = {}; if (!S) { try { so = (JSON.parse(localStorage.getItem('gn_setup_gofish')) || {}).options || {}; } catch (e) {} th = th || Core.theme(so.deck); pr = so.col === 'pairs'; }
      var d = th && DK.get(th), w = function (r) { return Core.plural(r, th); };
      var kind = d ? 'picture' : 'rank', ex = d ? 'four ' + w('3') + ' or four ' + w('K') : 'four 7s or four Kings';
      if (pr) return pairRules(d, w, kind);
      return '<p class="goal">Collect <b>books</b>: all four cards of a ' + kind + ', like ' + ex + '. When all 13 books are down, whoever made the most wins.</p>' +
      (d ? '<h3>The ' + Kit.esc(d.name) + ' deck</h3><p>This deck has 13 pictures in place of the 13 ranks, and four cards of each. The four cards of a picture are told apart by the color of the band under it, the way suits tell the cards of a rank apart. The deck plays exactly like a standard one.</p>' : '') +
      '<h3>The deal</h3><p>With 2 or 3 players everyone gets 7 cards; with 4 to 6 everyone gets 5. The rest of the deck is spread face down in the middle of the table. That is the <b>pond</b>.</p>' +
      '<h3>Your turn</h3><ul><li>Ask one player for a ' + kind + ' you already hold. Tap the player, then a card from your hand, and you ask for more like that card: “Pete, do you have any ' + Kit.esc(d ? w('3') : '7s') + '?”</li>' +
      '<li>If they have any, they have to hand over every card of that ' + kind + ', and you ask again (anyone, for any ' + kind + ' you hold).</li>' +
      '<li>If they have none, they say “Go fish!” and you draw a card from the pond. If it is the ' + kind + ' you asked for, you show it and ask again. Otherwise the turn passes to the player on your left.</li>' +
      '<li>When you have all four cards of a ' + kind + ', the book goes down in front of you straight away.</li></ul>' +
      '<h3>Running out</h3><ul><li>If your hand is empty when your turn comes, you draw a card from the pond first and then ask.</li>' +
      '<li>If nobody else has any cards left to ask for, you draw a card from the pond and the turn passes.</li>' +
      '<li>With the pond empty, a “Go fish!” just passes the turn, and a player with no cards left is out.</li></ul>' +
      '<h3>Who goes next</h3><p>The standard rule passes the turn to your left after a Go fish. Some families play that the player who said “Go fish!” takes the next turn instead, which you can choose in the setup.</p>' +
      '<h3>Decks</h3><p>Besides the standard deck there are ten themed decks: Space, Cats, Dogs, Zoo Animals, Food, Flowers, Sports, Jobs, US States and Countries. Choose one under Deck in the setup.</p>' +
      '<h3>Online</h3><ul><li><b>Play online</b>, beside the start button, opens a table, and the others join on their own devices. The computer plays any empty seat. Everyone plays with the deck the host chose.</li>' +
      '<li>Take your turn whenever you like; the home screen shows when it’s your move.</li></ul>' +
      '<h3>Pairs</h3><p>Some families collect pairs instead of books. Choose Pairs under Collect in the setup to play that way.</p>';
    }
  });
  // How to play when the game is for pairs
  function pairRules(d, w, kind) {
    var ex = d ? 'two ' + w('3') : 'two 7s', any = d ? w('3') : '7s';
    return '<p class="goal">Collect <b>pairs</b>: two cards of a ' + kind + ', like ' + ex + '. Each ' + kind + ' makes two pairs, so there are 26 in all. When all 26 pairs are down, whoever laid down the most wins.</p>' +
      (d ? '<h3>The ' + Kit.esc(d.name) + ' deck</h3><p>This deck has 13 pictures in place of the 13 ranks, and four cards of each. The four cards of a picture are told apart by the color of the band under it, the way suits tell the cards of a rank apart. The deck plays exactly like a standard one.</p>' : '') +
      '<h3>The deal</h3><p>With 2 or 3 players everyone gets 7 cards; with 4 to 6 everyone gets 5. The rest of the deck is spread face down in the middle of the table. That is the <b>pond</b>. Before anyone asks, everyone lays down the pairs in the hand they were dealt.</p>' +
      '<h3>Your turn</h3><ul><li>A pair goes face up in front of you the moment you have it, so your hand never holds two of a ' + kind + ', and nobody can fish for a card you have paired.</li>' +

  }
  function plusOne(near) {

  // ── Moments ──

  function bigCatch(mv) {

  // ═══ The end of the game ═════════════════════════════════════════════════════════════════════════
  function standings(st) {

  function recordGame(st, mode, extra) {

  }
  function winTitle(st, me) {
    var w = st.winner;

  }
  function winSub(st) {

    }

  }
  function rankRows(st, me) {
    return standings(st).map(function (i) { return { name: st.players[i].name, score: st.books[i].length, color: Kit.color(i), cpu: isCpu(i), me: i === me && onePerson() && !watching() }; });
  }
  // A themed deck's results card shows the winner's books by their pictures, under the title
  function winPic(st) {
    var th = st.theme && DK.get(st.theme) ? st.theme : null; if (!th || st.winner.length !== 1) return null;   // (a tie: the sub line names them)
    var p = st.winner[0], d = deckOf(th), pr = Core.isPairs(st), row = el('div', { class: 'gfwp', role: 'list', 'aria-label': (you(p) ? 'Your' : fn(p) + '’s') + (pr ? ' pairs' : ' books') });
    st.books[p].forEach(function (r, i) {
      if (st.books[p].indexOf(r) < i) return;   // (pairs: both pairs of a picture are one tile, stacked deeper)
      var two = pr && st.books[p].lastIndexOf(r) > i;
      var t = el('div', { class: 'gfwp-t' + (two ? ' two' : ''), role: 'listitem', 'aria-label': two ? 'Both pairs of ' + Core.plural(r, th) : null }, [el('span', { class: 'gfwp-p', style: { 'background-image': 'url("' + DK.pic(th, r, true) + '")' } }), el('span', { class: 'gfwp-n', text: Core.plural(r, th) })]);
      setDeckVars(t, d); row.appendChild(t);
    });
    return row.children.length ? row : null;
  }
  function sweepMoment(st, then) {
    var w = st.winner;
    if (w.length !== 1 || st.books[w[0]].length !== Core.need(st)) { then(); return; }
    var mine = you(w[0]), pr = Core.isPairs(st);
    Kit.moment({ big: true, icon: 'fish', title: pr ? 'Every pair' : 'Every book', line: (mine ? 'You' : fn(w[0])) + (pr ? ' laid down all 26 pairs, and nobody else laid down a single one.' : ' made all 13 books, and nobody else made a single one.'), pts: String(Core.need(st)), tone: mine ? '' : 'bad', ms: 3200,
      cards: Core.RANKS.slice(-5).map(function (r, i) { return { r: r, s: Core.SUITS[i % 4] }; }) });
    var th = TH();
    if (th) [].forEach.call(document.querySelectorAll('.kmb-c'), function (c, i) { var r = Core.RANKS[8 + i], d = deckOf(th); c.innerHTML = ''; c.classList.add('gfmb'); c.style.setProperty('--pa', d.pan[0]); c.style.setProperty('--pb', d.pan[1]); c.style.backgroundImage = 'url("' + DK.pic(th, r, true) + '")'; });
    Kit.sfx(mine ? 'win' : 'bad'); if (mine) { Kit.confetti({ count: 120 }); Kit.haptic('success'); }

  }
  function finish() {

    clearSave();
    var cfg = { players: st.players, level: st.level, next: st.next, mode: st.mode, theme: st.theme, col: st.col, hints: hintsOn(st) };

  }
  // Every book on the table, by player, in the order made

  // ═══ Turning the device: everything glides from where it was to its new place ═══════════════════════

  // ═══ Online (turnnet.js) ═════════════════════════════════════════════════════════════════════════
  // The table holds the whole game. Each device draws it from its own seat, with only its own hand face up; a move is

  }
  function netBot(st, seat) { var a = Core.bot(st, seat); if (!a) return null; var mv = Core.apply(st, seat, a); return mv ? { state: st, mv: mv } : null; }

  function netShow(net, info) {

    NQ.push({ st: clone(net.state), prev: info.prev ? clone(info.prev) : null, mv: info.mv, info: info });
    if (net.state && net.state.phase === 'over') netRecord(clone(net.state));
    if (NQ.length > 6) NQ = NQ.slice(-1).map(function (x) { x.skip = true; return x; });   // (far behind: straight to now)

  function netPump() {

  function netStep(it, done) {

  }
  function netRecord(st) {
    if (!NET || !st || st.phase !== 'over' || NET.seat < 0) return;
    var key = NET.code + ':' + st.started, seen = [];
    try { seen = JSON.parse(localStorage.getItem('gofish_netrec')) || []; } catch (e) {}
    if (NETREC[key] || seen.indexOf(key) >= 0) return;
    NETREC[key] = 1;
    try { localStorage.setItem('gofish_netrec', JSON.stringify(seen.concat([key]).slice(-20))); } catch (e) {}
    recordGame(st, 'Online', ['Played online at table ' + NET.code]);
  }
  function netEnd() {
    if (!NET || !S || S.phase !== 'over') return;
    var st = S, res = NET.result, left = res && res.left != null, me = NET.seat, won = me >= 0 && st.winner.indexOf(me) >= 0;
    netRecord(st); netCloseOver();
    NOVER = Kit.win({
      title: left ? res.text : winTitle(st, me), sub: winSub(st), pic: left ? null : winPic(st), rank: rankRows(st, me), lose: !won && !left, icon: won ? 'trophy' : 'users',
      againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { if (left) { TurnNet.leave(); TurnNet.open(); } else NET.again(); },
      look: 'Look at the table',
      extra: [{ label: Core.isPairs(st) ? 'Every pair' : 'Every book', onClick: showBooks }],
      closeLabel: 'Back to games'
    });
  }
  function netLeave() {
    NET = null; NQ = []; NGEN++; NPUMP = false; busy = false; token++;
    netCloseOver(); resumeLocal();
  }

  // ── Boot ──
  function resumeLocal() {
    var sv = null; try { sv = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv && sv.v === 1 && sv.players && sv.hands && sv.phase !== 'over') {
      S = sv; ME = S.me || 0; BLIND = false; busy = false; Kit.gameStart();
      build(); render(); next();
    } else showSetup();
  }
  resumeLocal();
  TurnNet.setup({
    game: 'gofish', title: 'Go Fish', min: 2, max: 6, botMs: 900,
    seats: function (n, o) { return Math.max(n, Math.min(6, +(o && o.seats) || 3)); },
    opts: netOpts, start: netStart, turn: netTurn, over: netOver, bot: netBot,
    show: netShow, leave: netLeave
  });
  // (tests)
  window.__gf = { get S() { return S; }, get busy() { return busy; }, get me() { return ME; }, get net() { return !!NET; }, move: function (a) { move(ME, a); }, core: Core,
    redraw: function () { render(); },
    // (a demo: a new game, {players, level, next, theme, col}, then f(S) to set the hands before the deal is shown)
    start: function (o, f) {
      token++; BLIND = false; SEL = { to: -1, r: null }; busy = false; clearBubs();
      S = Core.newGame(o); S.mode = 'cpu'; S.me = 0; ME = 0;
      if (f) f(S);
      Kit.gameStart(); startGame();
    },
    face: function (th, r, s) { return themedFace(th, { r: r, s: s || 'h' }); },
    finishNow: function () { while (S && S.phase !== 'over') { var p = Core.turn(S); Core.apply(S, p, Core.bot(S, p)); } save(); render(); next(); } };
})();

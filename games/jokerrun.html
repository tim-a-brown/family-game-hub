<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balatro</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<style>
html,body{background:#0a0614;}
#swirl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
#swirl.static{background:radial-gradient(120% 80% at 30% 20%,#3a0f33 0%,transparent 60%),radial-gradient(100% 80% at 80% 90%,#0a3a38 0%,transparent 60%),#0a0614;}
.k-toast{pointer-events:none;}
.stage.jrs{position:relative;z-index:1;max-width:1060px;padding:0 8px calc(var(--safe-b) + 10px);}
.jr{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"jok" "hud" "tab" "hand" "act";gap:8px;
  --jw:min(66px,calc((100vw - 48px) / 5));--hcw:clamp(50px,16.4vw,84px);--pw:clamp(46px,14vw,74px);
  min-height:calc(100dvh - var(--safe-t) - 74px - var(--safe-b));grid-template-rows:auto auto minmax(0,1fr) auto auto;}
.jr .hud{grid-area:hud;}.jr .jokers{grid-area:jok;}.jr .tbl{grid-area:tab;}.jr .jhand{grid-area:hand;}.jr .acts{grid-area:act;}
.jr.nohand .jhand,.jr.nohand .acts{display:none;}

/* HUD */
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:8px 10px;border-radius:18px;
  background:rgba(12,6,28,.66);box-shadow:inset 0 0 0 1px var(--w08),0 8px 20px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.hb-blind{display:flex;gap:9px;align-items:center;min-width:0;}
.tok{--bc:#2f7de1;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.15rem;
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--bc) 55%,#fff) 0%,var(--bc) 55%,color-mix(in srgb,var(--bc) 70%,#000) 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.28),inset 0 -4px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(0,0,0,.35);}
.tok .ico{width:52%;height:52%;}
.hb-blind .tx{min-width:0;line-height:1.1;}
.hb-blind .nm{font-weight:900;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hb-blind .sm{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
.hb-blind .tg{font-family:var(--display);font-size:1.4rem;color:#ff6b7a;line-height:1;font-variant-numeric:tabular-nums;}
.hb-score{text-align:right;line-height:1.05;align-self:center;}
.hb-score small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
.hb-score b{font-family:var(--display);font-weight:400;font-size:1.7rem;font-variant-numeric:tabular-nums;color:#fff;}
.hb-score.bump b{animation:bump .25s var(--spring);}
@keyframes bump{50%{transform:scale(1.15);}}
.hb-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.st{border-radius:11px;padding:3px 4px 2px;text-align:center;background:var(--w06);line-height:1.05;border:0;color:inherit;font:inherit;}
.st b{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem;font-variant-numeric:tabular-nums;}
.st small{font-size:.58rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.st.h b{color:#5fb0ff;}.st.d b{color:#ff5c6c;}.st.m b{color:#ffc83d;}
.hud .side-btns{display:none;}

/* Jokers */
.jokers{display:flex;gap:6px;justify-content:center;align-items:flex-end;min-height:calc(var(--jw) * 1.4 + 2px);padding-top:2px;}
.jslot{width:var(--jw);height:calc(var(--jw) * 1.4);border-radius:calc(var(--jw) * .1);flex:none;border:2px dashed var(--w14);
  display:grid;place-items:center;color:var(--w2);font-size:.6rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;}
.jk{position:relative;flex:none;width:var(--jw);height:calc(var(--jw) * 1.4);border-radius:calc(var(--jw) * .1);overflow:hidden;color:#fff6df;
  --a:#5b2bb5;--b:#24104f;--k:#ffcf4a;--fr:#f4e6c4;
  background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.22),transparent 60%),
    repeating-linear-gradient(135deg,var(--w05) 0 3px,transparent 3px 8px),linear-gradient(165deg,var(--a),var(--b));
  box-shadow:inset 0 0 0 calc(var(--jw) * .045) var(--fr),inset 0 0 0 calc(var(--jw) * .07) rgba(0,0,0,.35),0 2px 0 rgba(0,0,0,.3),0 8px 16px rgba(0,0,0,.45);
  transition:transform .25s var(--spring),box-shadow .2s;cursor:pointer;-webkit-user-select:none;user-select:none;}
.jk.r3{--fr:#ffd56a;}
.jk .art{position:absolute;left:12%;right:12%;top:9%;height:56%;}
.jk .art svg{width:100%;height:100%;overflow:visible;}
.jk .nm{position:absolute;left:8%;right:8%;bottom:7%;height:27%;display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:900;font-size:calc(var(--jw) * .125);line-height:1.02;letter-spacing:.01em;text-transform:uppercase;
  background:rgba(0,0,0,.36);border-radius:calc(var(--jw) * .05);padding:0 2px;overflow:hidden;}
.jk .gem{position:absolute;top:7%;right:8%;width:calc(var(--jw) * .12);height:calc(var(--jw) * .12);border-radius:50%;background:#5fb0ff;box-shadow:0 0 0 1.5px rgba(0,0,0,.35),inset 0 -2px 0 rgba(0,0,0,.25);}
.jk.r2 .gem{background:#3ddc84;}.jk.r3 .gem{background:#ff4d6d;box-shadow:0 0 0 1.5px rgba(0,0,0,.35),0 0 8px #ff4d6d;}
.jk .val{position:absolute;top:6%;left:8%;padding:0 4px;border-radius:5px;background:rgba(0,0,0,.6);font-weight:900;font-size:calc(var(--jw) * .14);line-height:1.3;color:#fff;}
.jk svg .a{fill:#fff6df;}.jk svg .k{fill:var(--k);}.jk svg .d{fill:rgba(15,6,25,.6);}
.jk svg .l{fill:none;stroke:#fff6df;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.jk svg .kl{fill:none;stroke:var(--k);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.jk svg .dl{fill:none;stroke:rgba(15,6,25,.65);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.jk svg .kt{fill:var(--k);font:900 11px var(--font);}.jk svg .at{fill:#fff6df;font:900 12px var(--font);}
.jk.wig{animation:wig .42s var(--ease);}
@keyframes wig{0%,100%{transform:none;}25%{transform:rotate(-10deg) scale(1.14);}60%{transform:rotate(7deg) scale(1.1);}}
.jk.cst{--a:#1b2a6b;--b:#070b26;--k:#9ec5ff;}
.jk.chm{--a:#6b2b6b;--b:#2a0f2e;}
.jk.pk{--fr:#e8e8f0;border-radius:4px;clip-path:polygon(0 3%,8% 0,16% 3%,25% 0,33% 3%,41% 0,50% 3%,58% 0,66% 3%,75% 0,83% 3%,91% 0,100% 3%,100% 97%,91% 100%,83% 97%,75% 100%,66% 97%,58% 100%,50% 97%,41% 100%,33% 97%,25% 100%,16% 97%,8% 100%,0 97%);}
.jk.pk.mega{--fr:#ffd56a;}
.jk .lv{position:absolute;top:6%;left:8%;font-weight:900;font-size:calc(var(--jw) * .13);color:#cfe2ff;}

/* Table */
.tbl{border-radius:24px;padding:7px;display:flex;}
.tbl .felt-in{flex:1;}
.tbl .felt-in{position:relative;border-radius:18px;min-height:236px;padding:10px;overflow:hidden;
  background:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/4px 4px,
    radial-gradient(120% 90% at 50% 30%,rgba(22,118,98,.86) 0%,rgba(10,74,64,.9) 65%,rgba(6,48,44,.94) 100%);}
.tbl .felt-in::before{display:none;}
.tbl.shake{animation:tshake .38s;}
@keyframes tshake{0%,100%{transform:none;}20%{transform:translate(-6px,2px) rotate(-.6deg);}40%{transform:translate(6px,-2px) rotate(.5deg);}60%{transform:translate(-4px,1px);}80%{transform:translate(3px,-1px);}}
.ph-line{display:flex;align-items:center;gap:8px;min-height:36px;}
.ph-line .ttl{flex:1;min-width:0;text-align:center;font-weight:900;font-size:1rem;color:#fff;}
.ph-line .ttl small{display:block;font-size:.72rem;font-weight:800;color:rgba(255,255,255,.65);}
.ibtn{flex:none;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(0,0,0,.28);color:#fff;}
.ibtn .ico{width:20px;height:20px;}
.ibtn:active{transform:scale(.9);}
.bossbar{margin:2px auto 0;max-width:420px;padding:5px 10px;border-radius:12px;background:rgba(0,0,0,.32);color:#ffd1d6;font-weight:800;font-size:.8rem;text-align:center;}
.cm{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 4px;}
.cm .bx{min-width:88px;padding:4px 12px;border-radius:12px;text-align:center;font-family:var(--display);font-weight:400;font-size:1.65rem;line-height:1.15;color:#fff;
  font-variant-numeric:tabular-nums;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.25);}
.cm .c{background:linear-gradient(180deg,#3d95ff,#1f63d0);}
.cm .m{background:linear-gradient(180deg,#ff5468,#c81e36);}
.cm .x{font-family:var(--display);font-size:1.5rem;color:#fff;}
.cm .bx.bump{animation:bump .22s var(--spring);}
.cm.hot .bx{box-shadow:0 0 0 3px #ffb020,0 0 22px rgba(255,140,30,.8);}
.total{height:30px;text-align:center;font-family:var(--display);font-size:1.6rem;color:#ffd84a;line-height:30px;text-shadow:0 2px 0 rgba(0,0,0,.35);}
.total.pop{animation:pop .4s var(--spring);}
.played{display:flex;justify-content:center;align-items:center;gap:5px;min-height:calc(var(--pw) * 1.4 + 18px);--cw:var(--pw);padding-top:12px;}
.played .pcard{transition:transform .25s var(--spring),filter .2s;}
.played .pcard.up{transform:translateY(-10px);}
.played .pcard.off{filter:brightness(.55) saturate(.6);}
.pcard.hit{animation:hit .26s var(--spring);}
@keyframes hit{50%{scale:1.16;}}
.played .pcard.gone{transition:transform .35s ease-in,opacity .35s ease-in;transform:translate(60px,-80px) rotate(20deg);opacity:0;}
.pile{position:absolute;right:10px;bottom:10px;--cw:34px;width:44px;height:58px;border:0;background:none;padding:0;}
.pile .pcard{position:absolute;left:0;top:0;}
.pile .pcard:nth-child(2){left:3px;top:2px;}.pile .pcard:nth-child(3){left:6px;top:4px;}
.pile b{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:3;padding:0 7px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font-size:.7rem;font-weight:900;white-space:nowrap;}
.lvbtn{position:absolute;left:10px;bottom:10px;}

/* Hand */
.jhand.chand{--cw:var(--hcw);min-height:calc(var(--cw) * 1.4 + 24px);padding:22px 8px 2px;}
.jhand .pcard.dealin{animation:dealin .38s var(--ease) both;}
@keyframes dealin{from{transform:translate(40px,30px) rotate(8deg);opacity:0;}to{transform:none;opacity:1;}}
.jhand .pcard.toss{transition:transform .3s ease-in,opacity .3s ease-in!important;transform:translate(80px,-120px) rotate(25deg)!important;opacity:0;}
.jhand .pcard.flyaway{visibility:hidden;}
.pcard .enh{position:absolute;right:6%;top:5%;padding:0 3px;border-radius:4px;font-family:var(--font);font-weight:900;font-size:calc(var(--cw) * .15);line-height:1.25;color:#fff;background:#1f63d0;}
.pcard.e-bonus{background:linear-gradient(160deg,#f1f7ff,#d3e5ff 70%,#bcd6ff);}
.pcard.e-mult{background:linear-gradient(160deg,#fff4f4,#ffd9dc 70%,#ffc3c8);}
.pcard.e-mult .enh{background:#c81e36;}
.pcard.e-glass{background:linear-gradient(125deg,rgba(255,255,255,.95) 0%,rgba(205,232,255,.82) 30%,rgba(255,255,255,.72) 45%,rgba(190,225,255,.85) 70%,rgba(255,255,255,.95) 100%);}
.pcard.e-glass .enh{background:#ff8a1c;}
.pcard.e-steel{background:linear-gradient(160deg,#f2f5f8,#b9c3ce 55%,#e2e7ec 75%,#a9b4c0);}
.pcard.e-steel .enh{background:#56616e;}
.pcard.e-gold{background:linear-gradient(160deg,#fff7d6,#f3cc55 55%,#ffe68f 75%,#d9a62a);}
.pcard.e-gold .enh{background:#a87a00;}
.pcard.debuf{filter:grayscale(.75) brightness(.8);}
.pcard.debuf::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(200,20,40,.22) 6px 8px);}

/* Buttons */
.acts{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;}
.acts .btn{min-height:54px;padding:0 10px;font-size:1rem;}
.acts .btn small{font-weight:800;opacity:.8;font-size:.82rem;}
.sortb{display:flex;flex-direction:column;gap:3px;}
.sortb .lbl{font-size:.58rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);text-align:center;}
.sortb .seg{padding:3px;gap:3px;}
.sortb .seg>button{min-height:38px;padding:0 9px;font-size:.82rem;}
.btn-play{--b:#2f7de1;--b-ink:#fff;--b-lip:#174a94;}
.btn-disc{--b:#e0303f;--b-ink:#fff;--b-lip:#8e1622;}
.btn-gold{--b:#ffc83d;--b-ink:#2b1a00;--b-lip:#b8860b;}

/* Blind select */
.bl-head{text-align:center;color:#fff;font-weight:900;margin:2px 0 8px;}
.bl-head .display{font-size:1.5rem;display:block;line-height:1.1;}
.bl-head small{color:rgba(255,255,255,.65);font-weight:800;}
.bls{display:flex;flex-direction:column;gap:8px;}
.bl{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px var(--w07);}
.bl.cur{background:rgba(0,0,0,.42);box-shadow:inset 0 0 0 2px rgba(255,200,61,.65),0 6px 18px rgba(0,0,0,.3);}
.bl.fut{opacity:.6;}
.bl.done{opacity:.5;}
.bl .tok{width:48px;height:48px;}
.bl .info{flex:1;min-width:0;line-height:1.15;}
.bl .info b{display:block;font-size:1rem;}
.bl .info .bd{font-size:.76rem;color:#ffd1d6;font-weight:700;}
.bl .info .tg{font-family:var(--display);font-size:1.25rem;color:#ff6b7a;}
.bl .info .tg small{font-family:var(--font);font-size:.7rem;color:rgba(255,255,255,.6);font-weight:800;margin-right:4px;}
.bl .info .rw{color:#ffc83d;font-weight:900;font-size:.85rem;margin-left:6px;}
.bl .go{display:flex;flex-direction:column;gap:6px;flex:none;width:112px;}
.bl .go .btn{min-height:42px;padding:0 10px;font-size:.92rem;}
.bl .go .skip{min-height:38px;font-size:.74rem;line-height:1.1;padding:2px 8px;}
.bl .stamp{flex:none;padding:4px 10px;border-radius:8px;border:2px solid currentColor;font-weight:900;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-6deg);color:#9fe8b9;}
.bl .stamp.sk{color:#c9c3e6;}

/* Cash out receipt */
.rcpt{max-width:340px;margin:6px auto;padding:14px 16px 16px;border-radius:6px 6px 14px 14px;}
.rcpt h3{font-family:var(--display);font-weight:400;font-size:1.5rem;color:#c8102e;text-align:center;margin-bottom:6px;}
.rcpt .ln{display:flex;align-items:baseline;gap:6px;font-family:var(--hand);font-size:1.2rem;line-height:40px;height:40px;}
.rcpt .ln span:first-child{flex:none;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rcpt .ln i{flex:1;border-bottom:2px dotted rgba(60,60,90,.3);transform:translateY(-6px);}
.rcpt .ln b{color:#a87a00;font-family:var(--font);font-weight:900;}
.rcpt .ln.note{color:#7a7a90;font-size:1.05rem;}
.rcpt .ln.tot{border-top:2px solid #c8102e;font-size:1.35rem;}
.rcpt .btn{margin-top:10px;}

/* Shop */
.shop-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.sign{flex:1;font-family:var(--display);font-size:1.7rem;color:#ffd84a;letter-spacing:.04em;text-shadow:0 0 12px rgba(255,190,40,.55),0 2px 0 rgba(0,0,0,.4);}
.money-big{font-family:var(--display);font-size:1.5rem;color:#ffc83d;padding:2px 12px;border-radius:12px;background:rgba(0,0,0,.35);}
.shelf{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 4px 10px;border-radius:14px;background:rgba(0,0,0,.2);box-shadow:inset 0 2px 8px rgba(0,0,0,.3);}
.shelf .gap{width:6px;}
.shelf.five{gap:6px;--jw:min(58px,calc((100vw - 90px) / 5));}
.sit{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;}
.sit .price{padding:0 8px;border-radius:999px;background:#ffc83d;color:#2b1a00;font-weight:900;font-size:.78rem;line-height:1.5;}
.sit .price.no{background:var(--w18);color:rgba(255,255,255,.6);}
.sit.on .jk,.sit.on .pcard{box-shadow:0 0 0 3px #ffc83d,0 0 18px rgba(255,200,61,.6),0 8px 16px rgba(0,0,0,.45);transform:translateY(-4px);}
.sit .sold{width:var(--jw);height:calc(var(--jw) * 1.4);border-radius:calc(var(--jw) * .1);border:2px dashed var(--w15);display:grid;place-items:center;color:rgba(255,255,255,.3);font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;}
.sit .pcard{--cw:var(--jw);}
.desc{margin-top:8px;padding:10px 12px;border-radius:14px;background:rgba(10,6,24,.62);min-height:96px;}
.desc .dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.desc .dh b{font-size:1.05rem;}
.rtag{padding:1px 8px;border-radius:999px;font-size:.66rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:rgba(95,176,255,.22);color:#bfe0ff;}
.rtag.r2{background:rgba(61,220,132,.2);color:#b6f5d0;}.rtag.r3{background:rgba(255,77,109,.22);color:#ffc2cf;}
.rtag.t-const{background:rgba(120,140,255,.22);color:#d4dcff;}.rtag.t-charm{background:rgba(200,110,220,.22);color:#f2cff8;}.rtag.t-pack{background:rgba(255,200,61,.2);color:#ffe7a6;}
.desc p{margin-top:4px;color:var(--text-2);font-weight:700;font-size:.92rem;}
.desc .cur{color:#ffd84a;}
.desc .row{margin-top:8px;}
.desc .btn{min-height:46px;}
.shop-acts{display:flex;gap:8px;margin-top:10px;}
.shop-acts .btn{flex:1;min-height:52px;padding:0 10px;}
.pk-head{text-align:center;color:#fff;margin-bottom:6px;}
.pk-head b{font-family:var(--display);font-weight:400;font-size:1.5rem;display:block;}
.pk-head small{color:rgba(255,255,255,.7);font-weight:800;}
.over-box{text-align:center;color:#fff;padding:12px 6px;}
.over-box .display{font-size:2rem;}
.over-box p{color:rgba(255,255,255,.75);font-weight:700;margin:6px 0;}

/* Popups */
.fx{position:fixed;z-index:400;pointer-events:none;transform:translate(-50%,0);padding:2px 8px;border-radius:8px;font-family:var(--display);font-size:1.15rem;line-height:1.2;color:#fff;white-space:nowrap;
  animation:fxup .85s var(--ease) forwards;box-shadow:0 3px 8px rgba(0,0,0,.4);}
.fx.c{background:#2f7de1;}.fx.m{background:#e0303f;}.fx.x{background:#ff8a1c;font-size:1.35rem;}.fx.mo{background:#ffc83d;color:#2b1a00;}.fx.g{background:#555a6a;}.fx.a{background:#8a4fff;}
@keyframes fxup{0%{opacity:0;transform:translate(-50%,8px) scale(.6);}20%{opacity:1;transform:translate(-50%,-6px) scale(1.12);}70%{opacity:1;transform:translate(-50%,-16px) scale(1);}100%{opacity:0;transform:translate(-50%,-30px) scale(.95);}}

/* Sheets */
.hl-tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.hl-tbl th,.hl-tbl td{padding:7px 5px;border-bottom:1px solid var(--w08);text-align:center;}
.hl-tbl th:first-child,.hl-tbl td:first-child{text-align:left;}
.hl-tbl thead th{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.hl-tbl td small{display:block;color:var(--text-3);font-weight:700;font-size:.74rem;}
.hl-tbl .cv{color:#7ab8ff;font-weight:900;}.hl-tbl .mv{color:#ff6b7a;font-weight:900;}

        var txt = e.x ? 'x' + fmtX(e.x) + ' Mult' : (e.chips ? '+' + fmt(e.chips) + (e.mult ? '' : ' Chips') : '') + (e.chips && e.mult ? ' ' : '') + (e.mult ? '+' + fmt(e.mult) + ' Mult' : '') + (e.money ? '+$' + e.money : '');

    }
  };

  // ═══ Boot ═════════════════════════════════════════════════════════════════
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.v === 1 && saved.deck && saved.phase && saved.phase !== 'over') {
    S = saved; Kit.gameStart(); S.fresh = [];
    if (S.winPending) { render(); S.winPending = false; save(); endRun(true); }
    else render();
  } else showSetup();
})();
</script>

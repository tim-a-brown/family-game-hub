<script>
'use strict';
// 4-player Mahjong. Players: 0=East(You),1=South(AI),2=West(AI),3=North(AI)
// Rounds rotate wind. Game = 4 rounds (East→South→West→North).
// Win: 4 melds + 1 pair (or 7 pairs). Tsumo(self-draw) or Ron(discard).

const PNAMES=['You','South','West','North'];
const WINDS=['E','S','W','N'];
const WIND_FULL=['East','South','West','North'];
const SUITS=['m','p','s']; // characters, circles, bamboo
const SUIT_LABELS={m:'Man',p:'Pin',s:'Sou',w:'Wind',d:'Dragon'};
const DRAGON_LABELS={1:'中',2:'發',3:'白'}; // Chun, Hatsu, Haku
const WIND_LABELS={1:'東',2:'南',3:'西',4:'北'};

function makeDeck(){
  const d=[];
  let id=0;
  SUITS.forEach(s=>{for(let n=1;n<=9;n++) for(let c=0;c<4;c++) d.push({id:id++,suit:s,num:n});});
  for(let n=1;n<=4;n++) for(let c=0;c<4;c++) d.push({id:id++,suit:'w',num:n});
  for(let n=1;n<=3;n++) for(let c=0;c<4;c++) d.push({id:id++,suit:'d',num:n});
  for(let i=d.length-1;i>0;i--){const j=0|Math.random()*(i+1);[d[i],d[j]]=[d[j],d[i]];}
  return d;
}

function tKey(t){return t.suit+t.num;}
function sortTiles(a,b){
  const sOrder={m:0,p:1,s:2,w:3,d:4};
  if(sOrder[a.suit]!==sOrder[b.suit]) return sOrder[a.suit]-sOrder[b.suit];
  return a.num-b.num;
}

// ── Win detection ──────────────────────────────────────────────────────────
function isWin(hand14){
  if(hand14.length!==14) return false;
  const sorted=[...hand14].sort(sortTiles);
  // 7 pairs
  const counts={};
  sorted.forEach(t=>{counts[tKey(t)]=(counts[tKey(t)]||0)+1;});
  const vals=Object.values(counts);
  if(vals.length===7&&vals.every(v=>v===2)) return true;
  // Standard: 4 melds + 1 pair
  return checkStd(sorted);
}

function checkStd(sorted){
  // Try each possible pair
  const tried=new Set();
  for(let i=0;i<sorted.length-1;i++){
    const k=tKey(sorted[i]);
    if(tried.has(k)) continue;
    if(i+1<sorted.length&&tKey(sorted[i+1])===k){
      tried.add(k);
      const rest=sorted.filter((_,idx)=>idx!==i&&idx!==i+1);
      if(canMelds(rest)) return true;
    }
  }
  return false;
}

function canMelds(tiles){
  if(!tiles.length) return true;
  const first=tiles[0];
  // Try triplet
  const same=tiles.filter(t=>tKey(t)===tKey(first));
  if(same.length>=3){
    const used=same.slice(0,3);
    const rest=tiles.filter(t=>!used.includes(t));
    if(canMelds(rest)) return true;
  }
  // Try sequence (numbered suits only)
  if(SUITS.includes(first.suit)){
    const t2=tiles.find(t=>t!==first&&t.suit===first.suit&&t.num===first.num+1);
    if(t2){
      const t3=tiles.find(t=>t!==first&&t!==t2&&t.suit===first.suit&&t.num===first.num+2);
      if(t3){
        const rest=tiles.filter(t=>t!==first&&t!==t2&&t!==t3);
        if(canMelds(rest)) return true;
      }
    }
  }
  return false;
}

// ── Shanten number (simplified) ──────────────────────────────────────────────
function shanten(hand){
  const h=[...hand].sort(sortTiles);
  let best=8;
  const counts={};
  h.forEach(t=>{counts[tKey(t)]=(counts[tKey(t)]||0)+1;});

  function tryPair(pairKey,remaining){
    let melds=0,partial=0;
    const rem=[...remaining].sort(sortTiles);
    // Count triplets
    const remCounts={};
    rem.forEach(t=>{remCounts[tKey(t)]=(remCounts[tKey(t)]||0)+1;});
    const used=new Set();
    // Greedy: triplets first
    const temp=[...rem];
    for(let i=0;i<temp.length;){
      if(!used.has(temp[i].id)&&i+2<temp.length&&tKey(temp[i])===tKey(temp[i+1])&&tKey(temp[i])===tKey(temp[i+2])){
        used.add(temp[i].id);used.add(temp[i+1].id);used.add(temp[i+2].id);melds++;i+=3;
      } else i++;
    }
    // Sequences
    const leftover=temp.filter(t=>!used.has(t.id));
    for(let i=0;i<leftover.length;){
      if(!used.has(leftover[i].id)&&SUITS.includes(leftover[i].suit)){
        const t2=leftover.find(t=>!used.has(t.id)&&t!==leftover[i]&&t.suit===leftover[i].suit&&t.num===leftover[i].num+1);
        const t3=t2&&leftover.find(t=>!used.has(t.id)&&t!==leftover[i]&&t!==t2&&t.suit===leftover[i].suit&&t.num===leftover[i].num+2);
        if(t2&&t3){used.add(leftover[i].id);used.add(t2.id);used.add(t3.id);melds++;i++;}
        else i++;
      } else i++;
    }
    // Partial: pairs + consecutive pairs
    const remain2=temp.filter(t=>!used.has(t.id));
    const rc={};
    remain2.forEach(t=>{rc[tKey(t)]=(rc[tKey(t)]||0)+1;});
    Object.values(rc).forEach(c=>{if(c>=2)partial++;});
    const shn=8-2*melds-partial-(pairKey?1:0);
    best=Math.min(best,shn);
  }

  const tried=new Set();
  for(let i=0;i<h.length;i++){
    const k=tKey(h[i]);
    if(tried.has(k)) continue;
    tried.add(k);
    const j=h.findIndex((t,idx)=>idx>i&&tKey(t)===k);
    if(j>=0){
      const rest=h.filter((_,idx)=>idx!==i&&idx!==j);
      tryPair(k,rest);
    }
  }
  tryPair(null,h);
  return Math.max(-1,best);
}

// ── AI discard logic ─────────────────────────────────────────────────────────
function aiBestDiscard(hand){
  // Try removing each tile and compute shanten
  let bestShn=Infinity,bestTile=null;
  hand.forEach(t=>{
    const rest=hand.filter(h=>h!==t);
    const shn=shanten(rest);
    if(shn<bestShn||(shn===bestShn&&(!bestTile||isolatedValue(t)>isolatedValue(bestTile)))){
      bestShn=shn;bestTile=t;
    }
  });
  return bestTile||hand[hand.length-1];
}

function isolatedValue(t){
  if(t.suit==='d') return 30;
  if(t.suit==='w') return 25;
  return t.num>=9||t.num<=1?15:10; // terminals/honors worth more to discard
}

function shouldClaimPong(hand,tile){
  const withPong=[...hand,tile,tile,tile].slice(0,hand.length+2); // already have 2
  const has2=hand.filter(t=>tKey(t)===tKey(tile)).length>=2;
  if(!has2) return false;
  const handWith=hand.filter(t=>tKey(t)!==tKey(tile));
  const shnBefore=shanten(hand);
  // After pong: hand becomes 10 tiles
  const shnAfter=shanten(handWith)-1; // meld formed
  return shnAfter<=shnBefore-1;
}

// ── State ────────────────────────────────────────────────────────────────────
let deck,hands,melds,discards,scores,phase,current,lastDiscard,lastDiscarder,
    roundWind,seatWinds,roundNum,claimTimer,log,canClaim;
// phase: 'draw'|'discard'|'claim-window'|'round-end'|'game-over'
// melds[p]: [{type:'pong'|'chow', tiles:[]}]
// discards[p]: []
// seatWinds[p]: 'E'|'S'|'W'|'N'

function addLog(msg,cls=''){log.push({msg,cls});if(log.length>25)log.shift();}

const hap=k=>{try{window.GN&&GN.haptic(k);}catch(e){}};
function newGame(){clearState();lastWin=null;selTile=null;scores=[0,0,0,0];log=[];roundNum=0;roundWind='E';newRound();}

function newRound(){
  roundNum++;
  deck=makeDeck();
  hands=Array.from({length:4},()=>deck.splice(0,13));
  // Dealer gets extra tile
  hands[0].push(deck.pop());
  melds=[[],[],[],[]];
  discards=[[],[],[],[]];
  canClaim=null;
  seatWinds=[...WINDS]; // 0=East, 1=South, 2=West, 3=North
  current=0; phase='discard';
  addLog(`Round ${roundNum}. ${PNAMES[0]} is East (dealer). Draw and discard to form 4 melds + 1 pair.`);
  render();
}

// ── Player discard ───────────────────────────────────────────────────────────
let selTile=null;

function selectTile(t){
  if(phase!=='discard'||current!==0) return;
  if(selTile===t){discardTile(t);}
  else{selTile=t;hap('select');render();}
}

function discardTile(t){
  if(!t) return;
  hands[0]=hands[0].filter(x=>x!==t);
  discards[0].push(t);
  lastDiscard=t;lastDiscarder=0;
  selTile=null;canClaim=null;
  hap('light');
  // Check if anyone can claim
  openClaimWindow();
}

// ── Claim window ─────────────────────────────────────────────────────────────
function openClaimWindow(){
  phase='claim-window';
  // Check Ron first (any player can win with this tile)
  for(let p=1;p<4;p++){
    const testHand=[...hands[p],lastDiscard];
    if(isWin(testHand)){
      // AI always takes Ron
      setTimeout(()=>claimRon(p),600);
      return;
    }
  }
  // Check Pong (any player other than discarder)
  const pongPlayers=[1,2,3].filter(p=>hands[p].filter(t=>tKey(t)===tKey(lastDiscard)).length>=2);
  if(pongPlayers.length>0){
    // AI claims if beneficial
    const claimer=pongPlayers.find(p=>shouldClaimPong(hands[p],lastDiscard));
    if(claimer!==undefined){setTimeout(()=>claimPong(claimer),700);return;}
  }
  // Chow: only player to left of discarder (index 1 from discarder)
  const chowPlayer=(lastDiscarder+1)%4;
  if(chowPlayer!==0&&canChow(hands[chowPlayer],lastDiscard)){
    const doChow=shanten(hands[chowPlayer])>0;
    if(doChow){setTimeout(()=>claimChow(chowPlayer),700);return;}
  }
  // No AI claim: next player draws
  render();
  setTimeout(advanceAfterDiscard,500);
}

function advanceAfterDiscard(){
  if(phase!=='claim-window') return;
  const next=(lastDiscarder+1)%4;
  current=next; phase='draw';
  render();
  if(next!==0) setTimeout(aiTurn,600);
}

function canChow(hand,tile){
  if(!SUITS.includes(tile.suit)) return false;
  // Check if hand has two tiles to form a sequence with tile
  const n=tile.num,s=tile.suit;
  const hasTile=v=>hand.some(t=>t.suit===s&&t.num===v);
  return (hasTile(n-2)&&hasTile(n-1))||(hasTile(n-1)&&hasTile(n+1))||(hasTile(n+1)&&hasTile(n+2));
}

function claimRon(p){
  addLog(`${PNAMES[p]} wins with RON on ${tileLabel(lastDiscard)}! 🀄`,'win');
  const pts=calculateScore(p,false);
  scores[p]+=pts;scores[lastDiscarder]-=pts;
  addLog(`${PNAMES[p]} +${pts} pts · ${PNAMES[lastDiscarder]} -${pts} pts`,'win');
  finishRound(p,'ron');
}

function claimPong(p){
  const used=hands[p].filter(t=>tKey(t)===tKey(lastDiscard)).slice(0,2);
  hands[p]=hands[p].filter(t=>!used.includes(t));
  melds[p].push({type:'pong',tiles:[used[0],used[1],lastDiscard]});
  addLog(`${PNAMES[p]} Pong ${tileLabel(lastDiscard)}!`);
  current=p; phase='discard';
  discards[lastDiscarder].pop(); // tile was claimed
  render();
  if(p!==0) setTimeout(()=>{const d=aiBestDiscard(hands[p]);doAiDiscard(p,d);},700);
}

function claimChow(p){
  const n=lastDiscard.num,s=lastDiscard.suit;
  const hasTile=v=>hands[p].find(t=>t.suit===s&&t.num===v);
  let t1,t2;
  if(hasTile(n-2)&&hasTile(n-1)){t1=hasTile(n-2);t2=hasTile(n-1);}
  else if(hasTile(n-1)&&hasTile(n+1)){t1=hasTile(n-1);t2=hasTile(n+1);}
  else if(hasTile(n+1)&&hasTile(n+2)){t1=hasTile(n+1);t2=hasTile(n+2);}
  if(!t1||!t2) return advanceAfterDiscard();
  hands[p]=hands[p].filter(t=>t!==t1&&t!==t2);
  melds[p].push({type:'chow',tiles:[t1,t2,lastDiscard].sort(sortTiles)});
  addLog(`${PNAMES[p]} Chow ${tileLabel(lastDiscard)}!`);
  current=p; phase='discard';
  discards[lastDiscarder].pop();
  render();
  if(p!==0) setTimeout(()=>{const d=aiBestDiscard(hands[p]);doAiDiscard(p,d);},700);
}

// ── AI turn ──────────────────────────────────────────────────────────────────
function aiTurn(){
  const p=current;
  if(p===0||phase!=='draw') return;
  if(!deck.length){addLog('Wall exhausted — draw!');finishRound(-1,'draw');return;}
  const drawn=deck.pop();
  hands[p].push(drawn);
  // Check Tsumo
  if(isWin(hands[p])){
    addLog(`${PNAMES[p]} wins with TSUMO! 🀄`,'win');
    const pts=calculateScore(p,true);
    [0,1,2,3].filter(x=>x!==p).forEach(x=>scores[x]-=Math.ceil(pts/3));
    scores[p]+=pts;
    addLog(`${PNAMES[p]} +${pts} pts`,'win');
    finishRound(p,'tsumo');
    return;
  }
  phase='discard';
  const d=aiBestDiscard(hands[p]);
  setTimeout(()=>doAiDiscard(p,d),500);
}

function doAiDiscard(p,t){
  if(!t) return;
  hands[p]=hands[p].filter(x=>x!==t);
  discards[p].push(t);
  lastDiscard=t;lastDiscarder=p;
  addLog(`${PNAMES[p]} discards ${tileLabel(t)}.`);
  // Check if player 0 can Ron
  const testHand=[...hands[0],t];
  if(isWin(testHand)){
    canClaim={type:'ron',discarder:p,tile:t};
    phase='claim-window'; render(); return;
  }
  // Check if player 0 can Pong
  if(hands[0].filter(x=>tKey(x)===tKey(t)).length>=2){
    canClaim={type:'pong',discarder:p,tile:t};
    phase='claim-window'; render(); return;
  }
  // Chow: only if p is to player's right (p=3, chow player = 0)
  if((p+1)%4===0&&canChow(hands[0],t)){
    canClaim={type:'chow',discarder:p,tile:t};
    phase='claim-window'; render(); return;
  }
  canClaim=null;
  phase='claim-window';
  render();
  setTimeout(advanceAfterDiscard,400);
}

// ── Player draw & Tsumo ───────────────────────────────────────────────────────
function playerDraw(){
  if(phase!=='draw'||current!==0) return;
  if(!deck.length){addLog('Wall exhausted — draw!');finishRound(-1,'draw');return;}
  const drawn=deck.pop();
  hands[0].push(drawn);
  phase='discard';
  selTile=null;
  addLog(`You drew ${tileLabel(drawn)}.`);
  // Auto-check Tsumo
  if(isWin(hands[0])){
    canClaim={type:'tsumo',tile:drawn};
    render(); return;
  }
  render();
}

function playerTsumo(){
  if(!canClaim||canClaim.type!=='tsumo') return;
  addLog(`You win with TSUMO! 🀄`,'win');
  const pts=calculateScore(0,true);
  [1,2,3].forEach(x=>scores[x]-=Math.ceil(pts/3));
  scores[0]+=pts;
  finishRound(0,'tsumo');
}

function playerRon(){
  if(!canClaim||canClaim.type!=='ron') return;
  hands[0].push(canClaim.tile);
  discards[canClaim.discarder].pop();
  addLog(`You win with RON! 🀄`,'win');
  const pts=calculateScore(0,false);
  scores[0]+=pts;scores[canClaim.discarder]-=pts;
  finishRound(0,'ron');
}

function playerPong(){
  if(!canClaim||canClaim.type!=='pong') return;
  claimPong(0);canClaim=null;
}

function playerChow(){
  if(!canClaim||canClaim.type!=='chow') return;
  claimChow(0);canClaim=null;
}

function playerPass(){
  // Passing on a self-drawn win just means you keep playing and discard
  if(canClaim&&canClaim.type==='tsumo'){canClaim=null;render();return;}
  canClaim=null; phase='claim-window';
  render(); setTimeout(advanceAfterDiscard,300);
}

// ── Scoring (simplified) ──────────────────────────────────────────────────────
function calculateScore(winner,tsumo){
  let base=10;
  // All triplets bonus
  if(melds[winner].every(m=>m.type==='pong')) base+=10;
  // Tsumo bonus
  if(tsumo) base+=5;
  // Self-color hand
  const suit=new Set(hands[winner].map(t=>t.suit));
  if(suit.size===1) base+=20;
  return base;
}

let lastWin=null; // {winner, method} for the round-end screen
function finishRound(winner,method){
  phase='round-end';
  canClaim=null;selTile=null;
  lastWin={winner,method};
  hap(winner===0?'success':winner<0?'medium':'error');
  render();
}

function tileLabel(t){
  if(!t) return '?';
  if(t.suit==='d') return DRAGON_LABELS[t.num];
  if(t.suit==='w') return WIND_LABELS[t.num];
  return t.num+(t.suit==='m'?'m':t.suit==='p'?'p':'s');
}

// ── Render ─────────────────────────────────────────────────────────────────────
const DRAGON_NAMES={1:'Red',2:'Green',3:'White'};
const WIND_NAMES={1:'East',2:'South',3:'West',4:'North'};
function tileEl(t,cls='',small=false){
  if(!t) return `<div class="mjt ${small?'sm':''} face-down"></div>`;
  const suf=small?'sm':'';
  const suit=t.suit;
  let label='',sub='';
  if(suit==='d'){label=DRAGON_LABELS[t.num];sub=DRAGON_NAMES[t.num];}
  else if(suit==='w'){label=WIND_LABELS[t.num];sub=WIND_NAMES[t.num];}
  else{label=t.num;sub=suit==='m'?'Man':suit==='p'?'Pin':'Sou';}
  return`<div class="mjt ${suit} ${cls} ${suf}" aria-label="${sub} ${label}"><div class="mjt-n">${label}</div><div class="mjt-s">${sub}</div></div>`;
}

function faceDownRow(count,size='xs'){
  return Array(count).fill(0).map(()=>`<div class="mjt face-down ${size}"></div>`).join('');
}

function scoreStrip(){
  const maxScore=Math.max(...scores);
  return `<div class="mj-scores">${PNAMES.map((n,i)=>`
    <div class="mj-score-box ${i===0?'you':''} ${current===i&&(phase==='draw'||phase==='discard')?'turn':''} ${scores[i]===maxScore&&scores[i]>0?'leader':''}">
      <div class="mj-score-name">${n}<span>${seatWinds?.[i]||WINDS[i]}</span></div>
      <div class="mj-score-val">${scores[i]}</div>
    </div>`).join('')}</div>`;
}
function logHTML(n){
  return `<details class="mj-log"><summary>Game log</summary><div>${log.slice(-n).reverse().map(({msg,cls})=>`<div class="${cls||''}">${msg}</div>`).join('')}</div></details>`;
}
function meldsHTML(p){
  return melds[p].map(m=>`<div class="mj-meld">${m.tiles.map(t=>tileEl(t,'meld-t',true)).join('')}</div>`).join('');
}

function render(){
  const root=document.getElementById('mj-root');
  let html='';

  html+=scoreStrip();

  // Game over
  if(phase==='game-over'){
    const best=Math.max(...scores);
    const w=scores.indexOf(best);
    html+=`<div class="winner-banner">
      <div style="font-size:2.2rem">${w===0?'🏆':'🀄'}</div>
      <div class="winner-name">${w===0?'You win the game!':PNAMES[w]+' wins the game'}</div>
      <div class="winner-pts">${PNAMES.map((n,i)=>n+' '+scores[i]).join(' · ')}</div>
      <button class="btn btn-gold btn-block" id="ng-btn" style="margin-top:16px">New Game</button>
    </div>`;
    html+=logHTML(8);
    root.innerHTML=html;document.getElementById('ng-btn')?.addEventListener('click',newGame);
    saveState();return;
  }

  // Round end
  if(phase==='round-end'){
    const lw=lastWin;
    const title=!lw?`Round ${roundNum} complete`:lw.winner<0?'Wall exhausted — no winner':lw.winner===0?`You win round ${roundNum}!`:`${PNAMES[lw.winner]} wins round ${roundNum}`;
    const how=!lw||lw.winner<0?'':lw.method==='tsumo'?'Self-drawn win (Tsumo)':`Won on ${PNAMES[lastDiscarder]==='You'?'your':PNAMES[lastDiscarder]+"'s"} discard (Ron)`;
    html+=`<div class="card mj-round-end">
      <div class="card-title" style="margin-bottom:2px">${title}</div>
      ${how?`<div class="mj-sub">${how}</div>`:''}
      ${lw&&lw.winner>=0?`<div class="mj-win-hand">${meldsHTML(lw.winner)}<div class="mj-meld">${[...hands[lw.winner]].sort(sortTiles).map(t=>tileEl(t,'',true)).join('')}</div></div>`:''}
      <button class="btn btn-gold btn-block" id="nr-btn" style="margin-top:14px">${roundNum<4?`Start round ${roundNum+1}`:'See final results'}</button>
    </div>`;
    html+=logHTML(8);
    root.innerHTML=html;
    document.getElementById('nr-btn')?.addEventListener('click',()=>{
      if(roundNum>=4){phase='game-over';hap('success');render();}
      else{seatWinds=seatWinds.map((w,i)=>WINDS[(WINDS.indexOf(w)+1)%4]);newRound();}
    });
    saveState();return;
  }

  // Situational tip strip — adapts to game state
  const tip = getSituationalTipStable();
  html+=`<div class="mj-tip">
    <div class="mj-tip-icon">${tip.icon}</div>
    <div class="mj-tip-body">${tip.text}</div>
    <button class="mj-tip-cycle" id="mj-tip-next" aria-label="Next tip">🎲</button>
  </div>`;

  // Table: opposite (West) on top, South on the left, North on the right
  const opp=2;
  const sideHTML=p=>`<div class="mj-side">
      <div class="mj-pname ${current===p?'active':''}">${PNAMES[p]} <span>${seatWinds[p]}</span></div>
      <div class="mj-side-tiles">${faceDownRow(Math.min(hands[p].length,7),'side')}</div>
      <div class="mj-pinfo">${hands[p].length} tiles</div>
      ${melds[p].length?`<div class="mj-melds col">${meldsHTML(p)}</div>`:''}
    </div>`;
  html+=`<div class="felt mj-table">
    <div class="mj-north">
      <div class="mj-pname ${current===opp?'active':''}">${PNAMES[opp]} <span>${seatWinds[opp]}</span></div>
      <div class="mj-north-tiles">${faceDownRow(hands[opp].length,'xs')}</div>
      ${melds[opp].length?`<div class="mj-melds">${meldsHTML(opp)}</div>`:''}
    </div>
    <div class="mj-mid">
      ${sideHTML(1)}
      <div class="mj-center">
        <div class="mj-wall">🀫 ${deck.length} in wall</div>
        ${lastDiscard?`<div class="mj-last-discard">
          <div class="mj-ld-lbl">Last discard${lastDiscarder!=null?' · '+PNAMES[lastDiscarder]:''}</div>
          ${tileEl(lastDiscard,'last',false)}
        </div>`:''}
        <div class="mj-discards">${discards.flat().slice(-12).map(t=>tileEl(t,'',true)).join('')}</div>
      </div>
      ${sideHTML(3)}
    </div>
  </div>`;

  // Claim offer for the player
  const showClaim=canClaim&&(phase==='claim-window'||canClaim.type==='tsumo');
  if(showClaim){
    html+=`<div class="mj-claim-panel">
      <div class="mj-claim-title">${canClaim.type==='tsumo'?'🀄 Tsumo — you drew a winning hand!':canClaim.type==='ron'?`🀄 Ron! ${tileLabel(canClaim.tile)} completes your hand`:canClaim.type==='pong'?`Pong the ${tileLabel(canClaim.tile)}?`:`Chow the ${tileLabel(canClaim.tile)}?`}</div>
      <div class="mj-claim-btns">
        ${canClaim.type==='tsumo'?`<button class="btn btn-gold" id="cm-take">Declare Win</button>`:''}
        ${canClaim.type==='ron'?`<button class="btn btn-gold" id="cm-ron">Ron!</button>`:''}
        ${canClaim.type==='pong'?`<button class="btn btn-gold" id="cm-pong">Pong</button>`:''}
        ${canClaim.type==='chow'?`<button class="btn btn-gold" id="cm-chow">Chow</button>`:''}
        <button class="btn btn-outline" id="cm-pass">Pass</button>
      </div>
    </div>`;
  }

  // Status
  const isYourDraw=phase==='draw'&&current===0;
  const isYourDiscard=phase==='discard'&&current===0;
  const shn=shanten(hands[0]);
  const status=isYourDraw?`Your turn — draw a tile`:
    isYourDiscard?(selTile?`Tap ${tileLabel(selTile)} again to discard it`:'Tap a tile to discard'):
    phase==='claim-window'&&!showClaim?'':
    current!==0?`${PNAMES[current]} is thinking…`:'';
  html+=`<div class="mj-status ${current!==0?'muted':''}">${status}</div>`;

  // Player melds
  if(melds[0].length){
    html+=`<div class="mj-melds mine">${meldsHTML(0)}</div>`;
  }

  // Player hand
  const isPlayable=isYourDiscard||false;
  html+=`<div class="mj-hand-head"><span>Your hand · ${seatWinds[0]}</span><span>${hands[0].length} tiles · ${shn<=0?'<b>Ready!</b>':'Shanten '+shn}</span></div>
  <div class="mj-hand ${isPlayable?'playable-hand':''}" id="player-hand">
    ${[...hands[0]].sort(sortTiles).map(t=>{
      const isSel=selTile===t;
      return tileEl(t,(isPlayable?'playable':'')+(isSel?' selected':''));
    }).join('')}
  </div>`;

  // Actions
  html+=`<div class="mj-actions">`;
  if(isYourDraw){html+=`<button class="btn btn-gold btn-block" id="draw-btn">🀫 Draw Tile</button>`;}
  else if(isYourDiscard){
    html+=`<button class="btn btn-gold btn-block" id="discard-btn" ${selTile?'':'disabled'}>${selTile?`Discard ${tileLabel(selTile)}`:'Select a tile to discard'}</button>`;
  }
  html+=`</div>`;

  html+=logHTML(6);
  root.innerHTML=html;

  // Wire events
  document.getElementById('draw-btn')?.addEventListener('click',playerDraw);
  document.getElementById('discard-btn')?.addEventListener('click',()=>{if(selTile)discardTile(selTile);});
  document.getElementById('cm-take')?.addEventListener('click',playerTsumo);
  document.getElementById('cm-ron')?.addEventListener('click',playerRon);
  document.getElementById('cm-pong')?.addEventListener('click',playerPong);
  document.getElementById('cm-chow')?.addEventListener('click',playerChow);
  document.getElementById('cm-pass')?.addEventListener('click',playerPass);

  const sortedHand=[...hands[0]].sort(sortTiles);
  document.getElementById('player-hand')?.querySelectorAll('.mjt').forEach((el,idx)=>{
    if(isPlayable) el.addEventListener('click',()=>{
      const t=sortedHand[idx];
      if(t) selectTile(t);
    });
  });

  if(current!==0&&phase==='draw') setTimeout(aiTurn,700);

  // Tip cycle button — advances rotation and re-renders just the tip
  document.getElementById('mj-tip-next')?.addEventListener('click',function(e){
    e.stopPropagation();
    const t = getSituationalTip();
    const body = document.querySelector('.mj-tip .mj-tip-body');
    const icon = document.querySelector('.mj-tip .mj-tip-icon');
    if(body) body.innerHTML = t.text;
    if(icon) icon.textContent = t.icon;
  });

  // Persist state after every render
  saveState();
}

// ── State persistence ───────────────────────────────────────────────────────
// Mahjong state is a lot — hands, melds, discards, scores, round state —
// serialized to sessionStorage so that navigating home + back restores the
// in-progress game. Home page reads this key to show "in progress" tag.
const MJ4_STATE_KEY = 'mj4_state';

function saveState(){
  try{
    // Don't save after game is over — let New Game start fresh
    if(phase==='game-over'){ clearState(); return; }
    const s = {
      deck, hands, melds, discards, scores, phase, current,
      lastDiscard, lastDiscarder, roundWind, seatWinds, roundNum,
      log, canClaim, selTile,
      _ts: Date.now()
    };
    sessionStorage.setItem(MJ4_STATE_KEY, JSON.stringify(s));
  }catch(e){}
}

function loadState(){
  try{
    const raw = sessionStorage.getItem(MJ4_STATE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || !s.hands || !s.hands.length) return false;
    deck = s.deck;
    hands = s.hands;
    melds = s.melds;
    discards = s.discards;
    scores = s.scores;
    phase = s.phase;
    current = s.current;
    lastDiscard = s.lastDiscard;
    lastDiscarder = s.lastDiscarder;
    roundWind = s.roundWind;
    seatWinds = s.seatWinds;
    roundNum = s.roundNum;
    log = s.log || [];
    canClaim = s.canClaim;
    // Re-link the selected tile to the restored hand (JSON copies aren't the same objects)
    selTile = (s.selTile && hands[0].find(t=>t.id===s.selTile.id)) || null;
    return true;
  }catch(e){ return false; }
}

function clearState(){
  try{ sessionStorage.removeItem(MJ4_STATE_KEY); }catch(e){}
}

async function confirmNewGame(){
  const ok=await GN.confirm('The current game will be lost.',{title:'Start a new game?',ok:'New Game'});
  if(ok)newGame();
}

function getMahjongTip(){
  const tips=[
    '<b>Watch your Shanten number.</b> It shows how many tiles away you are from winning. 0 = one tile away (Tenpai). Aim to reduce it each turn.',
    '<b>Prioritise pairs that could become triplets.</b> A pair you already hold is halfway to a Pong claim — keep it unless it\'s blocking other melds.',
    '<b>Discard honour tiles (winds, dragons) early</b> unless you have a pair of them. They can\'t form sequences and are hard to meld.',
    '<b>Terminals (1s and 9s) are hard to meld</b> into sequences because they can only extend in one direction. Discard them early.',
    '<b>Claim Pong strategically.</b> Ponging takes you out of turn order, so only claim if it significantly helps your hand.',
    '<b>Watch the discard pile.</b> If you see a tile discarded 3 times already, the 4th copy is likely in someone\'s hand — don\'t wait for it.',
    '<b>Chase sequences in one suit</b> for a cleaner hand. Mixed-suit hands are harder to complete and score lower.',
    '<b>Tsumo (self-draw win) scores better</b> than Ron — all three opponents each pay you a share of the points.',
    '<b>Don\'t declare Ron on a risky discard</b> if the tile is clearly dangerous (many discards of adjacent numbers suggest someone is waiting for it).',
    '<b>Keep your options open early.</b> In the first few draws, discard isolated tiles and honour tiles. Start committing to a strategy around draw 5-7.',
    '<b>A winning hand with all triplets (no sequences)</b> scores a 10-point bonus — if you\'re getting Pong offers, consider going all-triplet.',
    '<b>7-pair hands</b> are a great backup if your hand isn\'t shaping into melds — they just need 7 different pairs.',
  ];
  return tips[Math.floor(Math.random()*tips.length)];

// ── Situational tips ─────────────────────────────────────────────────────────
// Inspects the current game state and returns a tip paragraph tailored to
// what the player is about to do. Also tracks a rotation index so "🎲" cycles
// through candidate tips without immediately re-showing the same one.
let _tipRotIdx = 0;
function getSituationalTip(){
  const pool = buildSituationalTipPool();
  if(!pool.length) return { icon:'💡', text:getMahjongTip() };
  _tipRotIdx = (_tipRotIdx + 1) % pool.length;
  return pool[_tipRotIdx];
}
function getSituationalTipStable(){
  // Same pool as above but without advancing the rotation — used by render()
  // so the tip persists across re-renders within the same game state.
  const pool = buildSituationalTipPool();
  if(!pool.length) return { icon:'💡', text:getMahjongTip() };
  return pool[_tipRotIdx % pool.length];
}

function buildSituationalTipPool(){
  const tips = [];
  const yourHand = hands[0] || [];
  const shn = yourHand.length ? shanten(yourHand) : 99;
  const isYourTurn = current===0 && (phase==='draw' || phase==='discard');
  const inClaim = phase==='claim-window';

  // Claim window — tailor to what's offered
  if(inClaim && canClaim){
    if(canClaim.type==='ron'){
      tips.push({icon:'🏆', text:`<b>Ron is offered!</b> You can win on ${tileLabel(canClaim.tile)}. Ron scores against the discarder only — accept if you think the hand is worth it.`});
    } else if(canClaim.type==='tsumo'){
      tips.push({icon:'🏆', text:'<b>Tsumo!</b> You drew the winning tile yourself. Self-draw wins score against all three opponents — take it!'});
    } else if(canClaim.type==='pong'){
      tips.push({icon:'🔔', text:`<b>Pong is offered for ${tileLabel(canClaim.tile)}.</b> Ponging skips turn order and locks you into a triplet — only claim if it moves you meaningfully closer to winning. Sequences are more flexible.`});
    } else if(canClaim.type==='chow'){
      tips.push({icon:'🔔', text:`<b>Chow is offered for ${tileLabel(canClaim.tile)}.</b> Chow is the cheapest meld to claim — only costs you two adjacent tiles. Take it if it clears deadwood.`});
    }
  }

  // Winning position
  if(!inClaim && shn===0 && isYourTurn){
    tips.push({icon:'🎯', text:'<b>Tenpai!</b> You\'re one tile away from winning. Play defensively — avoid discarding tiles adjacent to opponents\' recent discards.'});
  }
  if(shn===1 && isYourTurn){
    tips.push({icon:'🎯', text:'<b>Iishanten.</b> You\'re two tiles away from winning. Focus on keeping flexible shapes — pairs and partial sequences — rather than chasing a specific tile.'});
  }

  // Honor tiles in hand
  const honors = yourHand.filter(t => t.suit==='w' || t.suit==='d');
  const honorPairs = {};
  honors.forEach(t => { const k=tKey(t); honorPairs[k]=(honorPairs[k]||0)+1; });
  const isolatedHonors = honors.filter(t => honorPairs[tKey(t)]===1);
  if(isolatedHonors.length>=2 && isYourDiscardPhase() && shn>1){
    tips.push({icon:'🎐', text:`<b>You have isolated honour tiles.</b> Winds and dragons can\'t form sequences — if you hold a lone one, discard it early unless you already have a pair.`});
  }

  // Terminals
  const terminals = yourHand.filter(t => (t.suit==='m'||t.suit==='p'||t.suit==='s') && (t.num===1 || t.num===9));
  if(terminals.length>=3 && isYourDiscardPhase() && shn>1){
    tips.push({icon:'🎋', text:`<b>You hold multiple 1s/9s.</b> Terminals can only extend one direction (1-2-3 or 7-8-9), so they\'re less flexible. Prefer keeping middle tiles (3-7).`});
  }

  // Deep into the round
  if(deck && deck.length < 20 && isYourTurn){
    tips.push({icon:'⏳', text:`<b>Only ${deck.length} tiles left in the wall.</b> Play defensively — if you\'re not close to winning, focus on safe discards (tiles already seen in the pond).`});
  }

  // Current player is YOU and you must discard
  if(phase==='discard' && current===0){
    if(shn<=1){
      tips.push({icon:'🎯', text:'<b>You\'re close to winning.</b> Discard the tile that keeps the most potential melds intact — check which tile you hold that doesn\'t connect to anything else.'});
    } else {
      tips.push({icon:'🀀', text:'<b>Your turn to discard.</b> Look for the most isolated tile in your hand — one that can\'t form a sequence or pair. Tap a tile once to mark it, again to discard.'});
    }
  }

  // Draw phase
  if(phase==='draw' && current===0){
    tips.push({icon:'🀫', text:'<b>Draw a tile.</b> Tap the "Draw Tile" button to take the next tile from the wall. You\'ll then need to discard to maintain 14 tiles.'});
  }

  // Early game — explain structure if this is round 1 with few discards
  if(roundNum===1 && discards && discards.flat().length < 8 && isYourTurn){
    tips.push({icon:'📖', text:'<b>A winning hand is 4 melds + 1 pair.</b> A meld is either a triplet (3 of a kind) or a sequence (3 in a row, same suit). Build toward that shape.'});
  }

  // Opponents with many melds exposed
  const exposedCounts = melds.map((m,i) => i===0 ? 0 : m.length);
  const maxExposed = Math.max(...exposedCounts);
  if(maxExposed >= 2 && isYourTurn){
    const aiIdx = exposedCounts.indexOf(maxExposed);
    tips.push({icon:'⚠️', text:`<b>${PNAMES[aiIdx]} has ${maxExposed} exposed meld${maxExposed>1?'s':''}.</b> They\'re close to winning — be cautious about discarding anything that could complete a triplet or sequence.`});
  }

  return tips;
}

function isYourDiscardPhase(){ return phase==='discard' && current===0; }

// On load, try to restore in-progress game first
if(loadState()){
  render();
  // Resume whatever the table was waiting on when we left
  if(phase==='claim-window'&&!canClaim) setTimeout(advanceAfterDiscard,500);
  else if(phase==='discard'&&current!==0){ const p=current; setTimeout(()=>{ if(phase==='discard'&&current===p){ doAiDiscard(p,aiBestDiscard(hands[p])); } },600); }
} else { newGame(); }
document.getElementById('mj-help-btn').addEventListener('click',()=>showHelp('rules'));
document.getElementById('mj-new-btn').addEventListener('click',confirmNewGame);
</script>

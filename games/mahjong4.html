<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahjong</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
:root{--tback:#1f5ea8;--tback-2:#2d7bd0;}
.mj{display:flex;flex-direction:column;align-items:center;gap:8px;}
.mj .scores{width:100%;max-width:560px;margin:0;padding-top:2px;}
.mj .score{min-width:0;flex:1 1 0;padding:6px 6px 7px;}
.mj .score .nm{max-width:100%;font-size:.76rem;}
.mj .score .pt{font-size:1.2rem;}
.mj .score .sub{font-size:.68rem;white-space:nowrap;}
.mj .score .dlr{display:inline-block;width:7px;height:7px;margin-left:4px;border-radius:50%;background:#ff6b5e;box-shadow:0 0 0 2px rgba(255,107,94,.3);vertical-align:1px;}
.mj .score .wd{font-family:var(--cjk);font-weight:700;}
/* Tiles: ivory face on a coloured back */
.mt{--tw:40px;position:relative;flex:none;width:var(--tw);height:calc(var(--tw) * 1.34);border-radius:calc(var(--tw) * .13);
  background:linear-gradient(165deg,#fffef8 0%,#f7f0de 55%,#ebe1c6 100%);
  box-shadow:inset 0 0 0 1px rgba(120,95,50,.25), inset 0 -2px 0 rgba(0,0,0,.06), 0 calc(var(--tw) * .085) 0 var(--tback), 0 calc(var(--tw) * .085 + 1px) 0 rgba(0,0,0,.35), 0 calc(var(--tw) * .1 + 2px) 5px rgba(0,0,0,.35);
  margin-bottom:calc(var(--tw) * .085);transition:transform .2s var(--spring), box-shadow .2s;}
.mt svg{position:absolute;inset:5% 7%;width:86%;height:90%;overflow:visible;}
.mt.back{background:linear-gradient(160deg,var(--tback-2),var(--tback));box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3), 0 calc(var(--tw) * .085) 0 #e9dfc4, 0 calc(var(--tw) * .085 + 1px) 0 rgba(0,0,0,.35), 0 calc(var(--tw) * .1 + 2px) 4px rgba(0,0,0,.35);}
.mt.back svg{display:none;}
.mt.edge{border-radius:2px;margin:0;background:linear-gradient(90deg,#e9dfc4 0 30%,var(--tback-2) 30%,var(--tback));box-shadow:0 1px 0 rgba(0,0,0,.35);}
.mt.edge.r{background:linear-gradient(270deg,#e9dfc4 0 30%,var(--tback-2) 30%,var(--tback));}
.mt.hot{box-shadow:inset 0 0 0 1px rgba(120,95,50,.25), 0 0 0 2px #ffd84a, 0 0 10px rgba(255,216,74,.8), 0 calc(var(--tw) * .085) 0 var(--tback);}
.mt.dim{filter:brightness(.8) saturate(.7);}
.mt.side{margin:0;}
/* Table */
.mtable{position:relative;border-radius:26px;padding:9px;}
.mtable .felt-in{position:absolute;inset:9px;border-radius:19px;overflow:hidden;}
.lay{position:absolute;}
.backs{position:absolute;display:flex;gap:1px;}
.backs.col{flex-direction:column;}
.melds{position:absolute;display:flex;gap:5px;align-items:flex-end;}
.melds.col{flex-direction:column;align-items:center;}
.meld{display:flex;gap:1px;}
.melds.col .meld{flex-direction:column;}
.wall{position:absolute;}
.wall i{position:absolute;border-radius:2px;background:linear-gradient(160deg,var(--tback-2),var(--tback));box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), 0 1px 0 rgba(0,0,0,.4);}
.wall i.one{opacity:.6;}
.pond{position:absolute;display:flex;flex-wrap:wrap;gap:1px;align-content:flex-start;transform-origin:50% 0;}
.pond .mt{margin-bottom:2px;}
.center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);color:rgba(255,255,255,.8);text-align:center;}
.center .rw{font-family:var(--cjk);font-size:1.7rem;line-height:1;color:#ffe9b0;text-shadow:0 2px 0 rgba(0,0,0,.4);}
.center small{font-size:.66rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6);}
.center b{font-family:var(--display);font-weight:400;font-size:1.05rem;}
.lblT{position:absolute;font-size:.68rem;font-weight:900;color:rgba(255,255,255,.75);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5);}
.lblT.on{color:#ffd84a;}
.say{position:absolute;z-index:20;padding:5px 12px;border-radius:12px;background:#fff;color:#1d1b2e;font-weight:900;font-size:.9rem;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.35);animation:pop .35s var(--spring);pointer-events:none;transform:translate(-50%,-50%);}
/* Your rack */
.status{min-height:24px;text-align:center;font-weight:800;font-size:.95rem;color:var(--text-2);}
.status b{color:var(--yellow);}
.rack{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 3px;padding:10px 8px 14px;border-radius:14px;
  background:linear-gradient(180deg,rgba(0,0,0,.0),rgba(0,0,0,.0)), repeating-linear-gradient(92deg, rgba(255,255,255,.05) 0 2px, transparent 2px 9px), linear-gradient(180deg,#8a5428,#5e3517);
  box-shadow:inset 0 2px 0 rgba(255,220,180,.25), inset 0 -3px 0 rgba(0,0,0,.3), 0 10px 20px rgba(0,0,0,.4);}
.rack .mt{cursor:pointer;border:0;padding:0;}
.rack .mt.sel{transform:translateY(-12px);box-shadow:inset 0 0 0 1px rgba(120,95,50,.25), 0 0 0 3px #ffd84a, 0 calc(var(--tw) * .085) 0 var(--tback), 0 14px 16px rgba(0,0,0,.4);}
.rack .mt.new{margin-left:10px;}
.rack .mt.wait{box-shadow:inset 0 0 0 1px rgba(120,95,50,.25), 0 0 0 2px rgba(61,220,132,.9), 0 calc(var(--tw) * .085) 0 var(--tback);}
.rack .gap{width:100%;height:0;}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%;max-width:560px;min-height:52px;}
.acts .btn{flex:1 1 0;min-width:0;padding:0 12px;}
.acts .btn.hintb{flex:0 0 auto;min-width:56px;}
.acts .btn{font-size:1rem;gap:6px;}
.acts .btn .mt{--tw:16px;margin:0 1px 2px;}
.claim{position:absolute;left:18px;right:18px;bottom:18px;z-index:25;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(20,16,41,.9);border:2px solid rgba(255,200,61,.7);box-shadow:0 10px 24px rgba(0,0,0,.45);animation:pop .3s var(--spring);}
.claim .mt{margin-bottom:4px;}
.claim .tx{flex:1;min-width:0;font-weight:800;line-height:1.25;}
.claim .tx small{display:block;color:var(--text-2);font-weight:700;font-size:.82rem;}
.waits{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;color:var(--green);font-weight:900;font-size:.82rem;}
.waits .mt{--tw:16px;}
/* Hand-end sheet */
.res .hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 12px;padding:10px;border-radius:14px;background:radial-gradient(120% 90% at 50% 35%,#188a5c,#0d5c3c);}
.res .grp{display:flex;gap:1px;}
.res .mt{--tw:23px;}
.res table{width:100%;border-collapse:collapse;font-weight:700;}
.res td{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.07);}
.res td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:900;}
.res .pos{color:var(--green);} .res .neg{color:var(--red);}
.res h4{margin:12px 0 4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
:root{--cjk:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Serif CJK SC","Source Han Sans SC","WenQuanYi Zen Hei","Microsoft YaHei",serif;}

/* iPad: wider stage in portrait; landscape puts scores, status, rack and buttons beside the table */
@media (min-width:700px) and (orientation:portrait){ #app.stage{max-width:760px;} .mj .scores,.acts{max-width:700px;} }
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  #app.stage{max-width:none;padding-bottom:calc(var(--safe-b) + 12px);}
  .mj.side{display:grid;grid-template-columns:auto 360px;grid-template-rows:auto auto auto auto auto 1fr;column-gap:24px;row-gap:12px;justify-content:center;align-items:start;}
  .mj.side>*{grid-column:2;}
  .mj.side>.mtable{grid-column:1;grid-row:1 / span 6;}
  .mj.side>.rack{justify-self:center;}
  .mj.side .score .nm{font-size:.82rem;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var LAND_MQ = '(orientation:landscape) and (min-width:900px) and (min-height:600px)';
  function innerW() { var cs = getComputedStyle(app); return (app.clientWidth || 390) - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0); }
  var SAVE = 'mj4_state', KEY = 'mj4';
  var WIND_CH = ['東', '南', '西', '北'], WIND_EN = ['East', 'South', 'West', 'North'];
  var NUM_CH = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
  var PTS = [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128];

  Kit.init({
    id: 'mahjong4',
    onNew: function () { tok++; clearSave(); undoStack = []; showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'lightbulb', label: 'Hint: what to discard', onClick: function () { hint(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Mahjong: past games' }); } }
    ],
    rules:
      '<p class="goal">Be the first to make a <b>complete hand</b>: four sets plus one pair (14 tiles). You play against three computer players.</p>' +
      '<h3>The tiles</h3><ul><li><b>Dots</b>, <b>Bamboo</b> and <b>Characters</b> (萬), numbered 1 to 9. Characters show the Chinese number (一 1, 二 2, 三 3 … 九 9) with a small number in the corner.</li>' +
      '<li><b>Winds</b>: 東 East, 南 South, 西 West, 北 North. <b>Dragons</b>: 中 Red, 發 Green, and the blue-framed White.</li><li>There are four of every tile (136 in all, no flower tiles).</li></ul>' +
      '<h3>Sets</h3><ul><li><b>Chow</b>: three in a row in one suit (4-5-6 Dots).</li><li><b>Pung</b>: three of the same tile. <b>Kong</b>: all four of the same tile (draw an extra tile after).</li><li><b>Pair</b>: two of the same tile.</li></ul>' +
      '<h3>A turn</h3><ul><li>You draw a tile from the wall (automatically), then <b>discard</b> one: tap it, then tap it again.</li><li>Play goes counter-clockwise: you, then the player on your right, across, and on your left.</li></ul>' +
      '<h3>Claiming a discard</h3><ul><li><b>Pung</b> or <b>Kong</b>: anyone can take a discard to finish three or four of a kind.</li><li><b>Chow</b>: only the next player (the one after the discarder) can take it for a run.</li>' +
      '<li><b>Mahjong</b>: anyone can take a discard that finishes their hand. A win beats a pung or kong, which beats a chow. Claimed sets are laid face up.</li></ul>' +
      '<h3>Winning hands</h3><ul><li>Four sets and a pair, or <b>Seven Pairs</b> (seven different pairs), or <b>Thirteen Orphans</b> (one of each 1, 9, wind and dragon, plus one extra).</li><li>No minimum: any complete hand can win. If the wall runs out, the hand is a draw.</li></ul>' +
      '<h3>Scoring (Hong Kong style)</h3><ul><li>Hands earn <b>faan</b>: Self-drawn 1, Concealed hand 1, All Chows 1, each Dragon pung 1, your Seat wind or the Round wind pung 1, Last tile 1, Win after a kong 1, All Pungs 3, Mixed One Suit 3, Seven Pairs 4, Small Three Dragons 5, Small Four Winds 6, Pure One Suit 7, Big Three Dragons 8, All Honors / Big Four Winds / Thirteen Orphans 10 (the limit).</li>' +
      '<li>Points: 0 faan 1, 1 → 2, 2 → 4, 3 → 8, 4 → 16, 5 → 24, 6 → 32, 7 → 48, 8 → 64, 9 → 96, 10+ → 128.</li>' +
      '<li>Win on a discard: the discarder pays <b>double</b>. Self-drawn win: <b>each</b> other player pays.</li></ul>' +
      '<h3>Dealer and rounds</h3><p>East is the dealer and starts with 14 tiles. In a full game the dealer stays on after winning or a draw; otherwise the deal passes to the right. The game ends after the chosen number of rounds; highest score wins.</p>'
  });

  // ── Tiles ─────────────────────────────────────────────────────────────────
  // Tile id 0..135, kind = id >> 2. Kinds: 0-8 Characters, 9-17 Dots, 18-26 Bamboo, 27-30 Winds ESWN, 31-33 Dragons red/green/white.
  function kindOf(id) { return id >> 2; }
  function suit(k) { return k < 9 ? 0 : k < 18 ? 1 : k < 27 ? 2 : k < 31 ? 3 : 4; }
  function num(k) { return k % 9 + 1; }
  function kname(k) {
    var s = suit(k);
    if (s < 3) return num(k) + ' ' + ['Characters', 'Dots', 'Bamboo'][s];
    if (s === 3) return WIND_EN[k - 27] + ' Wind';
    return ['Red', 'Green', 'White'][k - 31] + ' Dragon';
  }
  var B = '#1d4fa5', G = '#12804a', R = '#c8282b', INK = '#1b2552';
  function dot(x, y, r, c) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + c + '"/><circle cx="' + x + '" cy="' + y + '" r="' + (r * .66) + '" fill="#fffdf4"/><circle cx="' + x + '" cy="' + y + '" r="' + (r * .46) + '" fill="' + c + '"/><circle cx="' + (x - r * .15) + '" cy="' + (y - r * .15) + '" r="' + (r * .14) + '" fill="#fffdf4"/>';
  }
  function stick(x, y, h, c, w) {
    w = w || 4;
    var s = '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="' + (w / 2) + '" fill="' + c + '"/>';
    s += '<rect x="' + (x - w / 2 - .4) + '" y="' + (y - .7) + '" width="' + (w + .8) + '" height="1.4" rx=".7" fill="' + c + '" stroke="#fffdf4" stroke-width=".5"/>';
    s += '<rect x="' + (x - .5) + '" y="' + (y - h / 2 + 1.5) + '" width="1" height="' + (h - 3) + '" fill="rgba(255,255,255,.45)"/>';
    return s;
  }
  var SVG = {};
  function faceSVG(k) {
    if (SVG[k]) return SVG[k];
    var s = suit(k), n = num(k), b = '';
    var font = 'font-family=\'PingFang SC,Hiragino Sans GB,Noto Sans CJK SC,Noto Serif CJK SC,WenQuanYi Zen Hei,Microsoft YaHei,serif\' font-weight=\'700\' text-anchor=\'middle\'';
    if (s === 0) {
      b += '<text x="15" y="17.5" font-size="15" fill="' + INK + '" ' + font + '>' + NUM_CH[n - 1] + '</text>';
      b += '<text x="15" y="36" font-size="15" fill="' + R + '" ' + font + '>萬</text>';
      b += '<text x="2.6" y="7" font-size="7" fill="' + INK + '" font-family="system-ui,sans-serif" font-weight="800">' + n + '</text>';
    } else if (s === 1) {
      var L = {
        1: [[15, 20, 11, 'x']],
        2: [[15, 10.5, 6, G], [15, 29.5, 6, B]],
        3: [[7.5, 8, 5.2, B], [15, 20, 5.2, R], [22.5, 32, 5.2, G]],
        4: [[8.5, 10.5, 5.6, B], [21.5, 10.5, 5.6, G], [8.5, 29.5, 5.6, G], [21.5, 29.5, 5.6, B]],
        5: [[8, 8.5, 5, B], [22, 8.5, 5, G], [15, 20, 5, R], [8, 31.5, 5, G], [22, 31.5, 5, B]],
        6: [[9, 7.5, 4.6, G], [21, 7.5, 4.6, G], [9, 20, 4.6, R], [21, 20, 4.6, R], [9, 32.5, 4.6, R], [21, 32.5, 4.6, R]],
        7: [[6.5, 6, 3.9, G], [15, 10, 3.9, G], [23.5, 14, 3.9, G], [9, 24, 4.1, R], [21, 24, 4.1, R], [9, 33.5, 4.1, R], [21, 33.5, 4.1, R]],
        8: [[9, 5.5, 3.9, B], [21, 5.5, 3.9, B], [9, 15.2, 3.9, B], [21, 15.2, 3.9, B], [9, 24.8, 3.9, B], [21, 24.8, 3.9, B], [9, 34.5, 3.9, B], [21, 34.5, 3.9, B]],
        9: [[7, 7, 4, B], [15, 7, 4, B], [23, 7, 4, B], [7, 20, 4, R], [15, 20, 4, R], [23, 20, 4, R], [7, 33, 4, G], [15, 33, 4, G], [23, 33, 4, G]]
      }[n];
      L.forEach(function (d) {
        if (d[3] === 'x') {
          b += '<circle cx="15" cy="20" r="12" fill="' + G + '"/><circle cx="15" cy="20" r="10" fill="#fffdf4"/><circle cx="15" cy="20" r="8.6" fill="' + B + '"/><circle cx="15" cy="20" r="6.2" fill="#fffdf4"/><circle cx="15" cy="20" r="4.6" fill="' + R + '"/><circle cx="15" cy="20" r="1.8" fill="#fffdf4"/>';
          for (var a = 0; a < 8; a++) { var t = a * Math.PI / 4; b += '<circle cx="' + (15 + Math.cos(t) * 7.4).toFixed(2) + '" cy="' + (20 + Math.sin(t) * 7.4).toFixed(2) + '" r=".9" fill="' + G + '"/>'; }
        } else b += dot(d[0], d[1], d[2], d[3]);
      });
    } else if (s === 2) {
      var P = {
        2: [[15, 11, 15, G], [15, 29, 15, B]],
        3: [[15, 11, 15, G], [9, 29, 15, B], [21, 29, 15, B]],
        4: [[9, 11, 15, G], [21, 11, 15, B], [9, 29, 15, B], [21, 29, 15, G]],
        5: [[7, 11, 15, G], [23, 11, 15, B], [15, 20, 15, R], [7, 29, 15, B], [23, 29, 15, G]],
        6: [[7, 11, 15, G], [15, 11, 15, G], [23, 11, 15, G], [7, 29, 15, B], [15, 29, 15, B], [23, 29, 15, B]],
        7: [[15, 7, 10, R], [7, 20, 10, G], [15, 20, 10, G], [23, 20, 10, G], [7, 33, 10, B], [15, 33, 10, B], [23, 33, 10, B]],
        8: [[5.5, 11, 15, G], [12, 11, 15, G], [18, 11, 15, G], [24.5, 11, 15, G], [5.5, 29, 15, B], [12, 29, 15, B], [18, 29, 15, B], [24.5, 29, 15, B]],
        9: [[7, 7, 10, G], [15, 7, 10, R], [23, 7, 10, B], [7, 20, 10, G], [15, 20, 10, R], [23, 20, 10, B], [7, 33, 10, G], [15, 33, 10, R], [23, 33, 10, B]]
      }[n];
      if (n === 1) {
        b += stick(15, 21, 28, G, 6) + '<path d="M15 9 C9 6 6 8 4 12 C9 12 12 11 15 9z" fill="' + G + '"/><path d="M15 9 C21 6 24 8 26 12 C21 12 18 11 15 9z" fill="' + G + '"/><circle cx="15" cy="7" r="2.6" fill="' + R + '"/>';
      } else P.forEach(function (p) { b += stick(p[0], p[1], p[2], p[3], n === 8 ? 3.4 : 4); });
    } else if (s === 3) {
      b += '<text x="15" y="29" font-size="22" fill="' + INK + '" ' + font + '>' + WIND_CH[k - 27] + '</text>';
      b += '<text x="2.6" y="7" font-size="7" fill="' + INK + '" font-family="system-ui,sans-serif" font-weight="800">' + 'ESWN'[k - 27] + '</text>';
    } else {
      if (k === 31) b += '<text x="15" y="29.5" font-size="24" fill="' + R + '" ' + font + '>中</text>';
      else if (k === 32) b += '<text x="15" y="29.5" font-size="23" fill="' + G + '" ' + font + '>發</text>';
      else b += '<rect x="6" y="6" width="18" height="28" rx="2" fill="none" stroke="' + B + '" stroke-width="2.2"/><rect x="9" y="9" width="12" height="22" rx="1" fill="none" stroke="' + B + '" stroke-width=".9"/>';
    }
    SVG[k] = '<svg viewBox="0 0 30 40" aria-hidden="true">' + b + '</svg>';
    return SVG[k];
  }
  function tile(id, tw, cls, tag) {
    var k = kindOf(id), t = el(tag || 'div', { class: 'mt' + (cls ? ' ' + cls : ''), html: faceSVG(k), 'aria-label': kname(k) });
    if (tw) t.style.setProperty('--tw', tw + 'px');
    if (tag === 'button') t.type = 'button';
    return t;
  }
  function backTile(tw, cls) { var t = el('div', { class: 'mt back' + (cls ? ' ' + cls : '') }); t.style.setProperty('--tw', tw + 'px'); return t; }

  // ── Hand analysis ─────────────────────────────────────────────────────────
  function counts(ids) { var c = []; for (var i = 0; i < 34; i++) c.push(0); ids.forEach(function (id) { c[kindOf(id)]++; }); return c; }
  var ORPH = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];
  function isOrphans(c) { var pair = false; for (var i = 0; i < 34; i++) { var o = ORPH.indexOf(i) >= 0; if (!o && c[i]) return false; if (o && !c[i]) return false; if (c[i] === 2) pair = true; } return pair; }
  function isSevenPairs(c) { var p = 0; for (var i = 0; i < 34; i++) { if (c[i] === 2) p++; else if (c[i]) return false; } return p === 7; }
  // All ways to split concealed counts into `need` sets + one pair
  function decompose(c, need) {
    var out = [];
    for (var pk = 0; pk < 34; pk++) {
      if (c[pk] < 2) continue;
      c[pk] -= 2;
      (function rec(sets) {
        var i = 0; while (i < 34 && !c[i]) i++;
        if (i === 34) { if (sets.length === need) out.push({ pair: pk, sets: sets.slice() }); return; }

  }

  function finish() {
    var P = S.players, rank = P.map(function (p, i) { return { name: p.name, score: S.scores[i], color: Kit.color(i), cpu: p.cpu, i: i }; }).sort(function (a, b) { return b.score - a.score; });

      if (h.list.indexOf('Pure One Suit') >= 0) hl.push(P[h.winner].name + ' made a Pure One Suit hand in ' + h.label);

  // ── Render ────────────────────────────────────────────────────────────────
  var bubbles = [];

        el('span', { class: 'pt', text: String(S.scores[q]) }),
        el('span', { class: 'sub', html: '<span class="wd">' + WIND_CH[sw] + '</span> ' + WIND_EN[sw] + (sw === 0 ? '<i class="dlr" title="Dealer"></i>' : '') })

    });
    wrap.appendChild(strip);

    // the table

    var L = Math.min(FW - 2 * SB - 6, Math.round(330 * KZ)), FH = TB + L + BB + 6, TH = FH + 2 * rim;

    var felt = el('div', { class: 'felt-in' });
    table.appendChild(felt);
    var ox = (FW - L) / 2, oy = TB + 3, cx = ox + L / 2, cy = oy + L / 2;

    // wall: 68 stacks of two around the square, drawn from the front, replacements from the back
    var ring = Math.max(8, Math.round(L * 0.036)), wall = el('div', { class: 'wall', style: { left: ox + 'px', top: oy + 'px', width: L + 'px', height: L + 'px' } });
    var seg = (L - ring) / 17, startStack = ((S.dealer * 17) + 7) % 68;
    for (var st = 0; st < 68; st++) {
      var j0 = st * 2, present = (j0 >= S.front && j0 < 136 - S.back ? 1 : 0) + (j0 + 1 >= S.front && j0 + 1 < 136 - S.back ? 1 : 0);
      if (!present) continue;
      var pos = (st + startStack) % 68, side = Math.floor(pos / 17), a = pos % 17, x, y, w, h;

      else if (side === 2) { x = ring + a * seg; y = 0; w = seg - 1; h = ring; }                      // top, left→right
      else { x = L - ring; y = ring + a * seg; w = ring; h = seg - 1; }                              // right, top→bottom

    }
    felt.appendChild(wall);

    // ponds
    var inner = L - 2 * ring - 6, ptw = Math.floor(Math.min(22 * KZ, (inner * 0.46) / 6.3)), pondW = ptw * 6 + 5, depth = Math.round(ptw * 1.42 * 3 + 8);

      el('span', { class: 'rw', text: WIND_CH[S.wind] }), el('small', { text: WIND_EN[S.wind] + ' round' }), el('b', { text: String(wallLeft()) }), el('small', { text: 'in the wall' })

  }

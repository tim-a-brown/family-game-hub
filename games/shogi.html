<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shogi</title>
<link rel="stylesheet" href="../kit.css">
<link rel="preload" href="../fonts/shogi-kanji.woff2" as="font" type="font/woff2" crossorigin>
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="shogi-core.js"></script>
<style>
@font-face{font-family:'Shogi Kanji';src:url('../fonts/shogi-kanji.woff2') format('woff2');font-weight:700;font-display:block;}
#app.stage.sg-on{max-width:none;box-sizing:border-box;padding:4px max(17px,var(--corner-x,0px)) max(calc(var(--safe-b) + 10px),18px);
  min-height:calc(var(--avh,100dvh) - var(--bar));display:flex;align-items:center;justify-content:center;}
.sg{--bsz:360px;--sq:36px;--hp:34px;display:grid;gap:8px;width:max-content;max-width:100%;}
/* Player bars */
.pbar{display:flex;align-items:center;gap:10px;min-height:44px;padding:5px 12px 5px 8px;border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s,background .2s;min-width:0;}
.pbar.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 18%,transparent);}
.pbar.chk{box-shadow:inset 0 0 0 1.5px rgba(255,80,80,.8),0 0 18px rgba(255,60,60,.25);}
.pbar .tok{width:30px;height:32px;flex:none;display:grid;place-items:center;}
.pbar .tok svg{width:30px;height:32px;}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;}
.pbar .nm{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:6px;min-width:0;}
.pbar .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pbar .nm .ico{width:15px;height:15px;color:var(--text-3);flex:none;}
.pbar .sub{font-size:.74rem;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pbar.on .sub{color:var(--lit-ink);}
.pbar.chk .sub{color:#ff8a80;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}
/* A seat: the bar, and the piece stand (komadai) beside it or under it */
.seat{display:grid;gap:6px;min-width:0;}
.sg.merged .seat{grid-template-columns:clamp(136px,36%,260px) minmax(0,1fr);align-items:stretch;}
/* The piece stand: a small table of the same wood as the board, with the pieces in hand on it */
.stand{position:relative;min-height:calc(var(--hp) + 10px + var(--sadd,0px));border-radius:10px;padding:4px 6px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:2px 4px;
  background:repeating-linear-gradient(91deg,rgba(120,70,20,.08) 0 2px,transparent 2px 9px),linear-gradient(180deg,#e7c27f,#cf9f57);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.35);}
.stand.top{flex-direction:row-reverse;}
.stand .none{font-size:.74rem;font-weight:700;color:rgba(70,40,10,.55);margin:auto;}
.hp{position:relative;width:var(--hp);height:var(--hp);border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center;border-radius:8px;transition:transform .15s var(--spring),filter .15s;touch-action:none;}
.hp svg{width:100%;height:100%;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.45));overflow:visible;}
.stand.top .hp svg{transform:rotate(180deg);}
.hp b{position:absolute;right:-7px;top:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#2a1a0c;color:#ffe9bd;font-size:11px;font-weight:900;line-height:17px;text-align:center;box-shadow:0 0 0 1.5px #f2d49a;font-variant-numeric:tabular-nums;}
.hp.sel{transform:translateY(-4px) scale(1.08);}
.hp.sel svg{filter:drop-shadow(0 0 5px rgba(255,214,90,.95)) drop-shadow(0 3px 2px rgba(0,0,0,.4));}
.hp.bump{animation:hpb .5s var(--spring);}
@keyframes hpb{40%{transform:scale(1.25);}}
.hp:disabled{cursor:default;}
/* The board: kaya wood in a darker rim, ruled in ink with four star points */
.frame{--rim:clamp(10px,3vw,20px);position:relative;padding:var(--rim);border-radius:10px;width:var(--bsz);height:var(--bsz);box-sizing:border-box;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 8px),linear-gradient(180deg,#8a5a2b,#5e3a19);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.35),0 16px 34px rgba(0,0,0,.5);view-transition-name:sg-board;}
.bd{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);touch-action:none;user-select:none;-webkit-user-select:none;
  background:
    repeating-linear-gradient(87deg,rgba(140,80,20,.07) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(93deg,rgba(255,255,255,.08) 0 2px,transparent 2px 13px),
    radial-gradient(140% 90% at 30% 20%,#f3cd86,#e2b066 55%,#d39f55);
  box-shadow:0 0 0 1.5px #3a230e,inset 0 0 18px rgba(80,40,0,.25);}
.sq{position:relative;box-shadow:inset 0 0 0 .6px rgba(40,22,6,.75);cursor:pointer;}
.sq::before{content:"";position:absolute;inset:0;pointer-events:none;}
.sq.lf::before{background:rgba(255,170,40,.18);}
.sq.lt::before{background:rgba(255,170,40,.38);}
.sq.sel::before{background:rgba(255,214,90,.55);}
.sq.chk::before{background:radial-gradient(circle,rgba(255,40,40,.9) 0%,rgba(230,30,30,.5) 45%,rgba(200,0,0,0) 74%);}
.sq.mv::after{content:"";position:absolute;left:37%;top:37%;width:26%;height:26%;border-radius:50%;background:rgba(60,30,5,.38);pointer-events:none;}
.sq.mv.cap::after{left:6%;top:6%;width:88%;height:88%;background:none;box-shadow:inset 0 0 0 3px rgba(60,30,5,.45);border-radius:22%;}
.sq.mv.pz::after{background:rgba(190,40,20,.5);}
.sq.mv.cap.pz::after{background:none;box-shadow:inset 0 0 0 3px rgba(190,40,20,.65);}
.star{position:absolute;width:7px;height:7px;border-radius:50%;background:#2c1a08;transform:translate(-50%,-50%);pointer-events:none;z-index:1;}
.coord{position:absolute;font-size:var(--cf,clamp(8px,1.4vmin,12px));font-weight:800;color:#f3dcb0;opacity:.85;pointer-events:none;display:grid;place-items:center;font-variant-numeric:tabular-nums;}
.coord.f{top:0;height:var(--rim);width:calc((100% - 2 * var(--rim)) / 9);}
.coord.r{right:0;width:var(--rim);height:calc((100% - 2 * var(--rim)) / 9);}
.layer{position:absolute;inset:0;pointer-events:none;z-index:2;}
.pc{position:absolute;width:11.111%;height:11.111%;display:grid;place-items:center;}
.pc svg{width:94%;height:94%;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.5));overflow:visible;}
.pc.w svg{transform:rotate(180deg);}
.pc.sel svg{filter:drop-shadow(0 0 5px rgba(255,214,90,.95)) drop-shadow(0 3px 2px rgba(0,0,0,.4));}
.pc.land svg{animation:land .26s cubic-bezier(.3,1.5,.5,1);}
.pc.w.land svg{animation-name:landw;}
@keyframes land{0%{transform:scale(1.18);}100%{transform:none;}}
@keyframes landw{0%{transform:rotate(180deg) scale(1.18);}100%{transform:rotate(180deg);}}
.pc.flipin svg{animation:flipin .5s ease-out;}
.pc.w.flipin svg{animation-name:flipinw;}
@keyframes flipin{0%{transform:rotateY(90deg) scale(1.1);filter:drop-shadow(0 0 10px rgba(255,90,60,.9));}100%{transform:none;}}
@keyframes flipinw{0%{transform:rotate(180deg) rotateY(90deg) scale(1.1);filter:drop-shadow(0 0 10px rgba(255,90,60,.9));}100%{transform:rotate(180deg);}}
.ring{position:absolute;width:11.111%;height:11.111%;pointer-events:none;border-radius:50%;box-shadow:0 0 0 3px rgba(255,214,90,.9);animation:ring .8s ease-out forwards;z-index:3;}
@keyframes ring{from{transform:scale(.6);opacity:1;}to{transform:scale(2.1);opacity:0;}}
.fly{position:fixed;z-index:400;pointer-events:none;}
.fly.drag{z-index:600;}
.pc.dragging,.hp.dragging{opacity:.25;}
.sq.hov::before{background:rgba(255,214,90,.45);box-shadow:inset 0 0 0 2px rgba(255,214,90,.95);}
.fly svg{width:100%;height:100%;filter:drop-shadow(0 6px 5px rgba(0,0,0,.45));overflow:visible;}
.bd.shake{animation:shake .4s;}
/* The promotion choice: the piece's two faces, over the board */
.promo{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,10,0,.45);border-radius:6px;animation:fade .18s ease-out;}
@keyframes fade{from{opacity:0;}}
.promo .pp{display:flex;gap:clamp(12px,4vw,28px);padding:16px 18px 14px;border-radius:22px;background:var(--sheet-bg,rgba(20,22,40,.92));box-shadow:inset 0 0 0 1px var(--gl-line),0 20px 40px rgba(0,0,0,.6);}
.promo button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--text);font:inherit;font-weight:800;font-size:.9rem;cursor:pointer;padding:6px;border-radius:16px;}
.promo button .face{width:calc(var(--sq) * 1.9);height:calc(var(--sq) * 1.9);min-width:64px;min-height:64px;display:grid;place-items:center;transition:transform .15s var(--spring);}
.promo button .face svg{width:100%;height:100%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));overflow:visible;}
.promo button:active .face{transform:scale(.94);}
.promo button.go{background:color-mix(in srgb,var(--lit) 14%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 55%,transparent);}
.promo button small{font-weight:700;color:var(--text-3);font-size:.74rem;}
.turn{min-height:32px;margin:0;}
.moves{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0;min-height:32px;align-items:center;}
.moves::-webkit-scrollbar{display:none;}
.moves .mp{flex:none;display:inline-flex;gap:5px;align-items:baseline;height:28px;padding:0 9px;border-radius:10px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);font-size:.82rem;font-weight:650;color:var(--text-2);line-height:28px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.moves .mp i{font-style:normal;color:var(--text-3);font-weight:800;}
.moves .mp.now{background:color-mix(in srgb,var(--lit) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--lit) 55%,transparent);color:var(--lit-ink);}
.moves .empty{color:var(--text-3);font-size:.82rem;font-weight:700;margin:0 auto;}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.acts .btn{flex:1;max-width:200px;white-space:nowrap;}
/* Upright: the other player and their stand over the board, you and yours under it */
.sg.port{grid-template-columns:var(--bsz);}
.sg.port .pbar{min-height:calc(44px + var(--padd,0px));}
.sg.port .moves{display:none;}
.sg.port.roomy .moves{display:flex;}
/* Sideways: what you look at in a column at the left, the board where the taps go at the right */
.sg.land{height:var(--bsz);grid-template-columns:var(--lw) var(--bsz);
  grid-template-rows:max-content max-content max-content minmax(0,max-content) max-content max-content max-content minmax(0,1fr) max-content max-content;
  grid-template-areas:"t b" "s b" "l b" "m b" "k b" "x b" "p b" ". b" "a b" "y b";column-gap:var(--cg,22px);row-gap:8px;}
.sg.land>.seat.top{grid-area:t;}
.sg.land>.seat.bot{grid-area:y;}
.sg.land>.frame{grid-area:b;}
.sg.land>.turn{grid-area:s;}
.sg.land>.lastmv{grid-area:l;}
.sg.land>.taken{grid-area:k;}
.sg.land>.stats{grid-area:x;}
.sg.land>.past{grid-area:p;}
.sg.land>.acts{grid-area:a;justify-content:flex-start;}
/* the move list sideways: a glass panel only as tall as its moves, scrolling inside itself once the column is full */
.sg.land>.moves{grid-area:m;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(112px * var(--dk,1)),1fr));gap:5px;align-content:start;overflow-y:auto;overflow-x:hidden;padding:8px;border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);min-height:0;}
.sg.land>.moves .empty{grid-column:1/-1;margin:2px auto;}
/* The room's glass panels, each as tall as what it holds */
.sg>.pn{display:none;}
.sg.land>.pn:not(.none):not(.off){display:block;padding:calc(10px * var(--dk,1)) calc(14px * var(--dk,1));border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);font-size:calc(.9rem * var(--dk,1));}
.pn h4{margin:0 0 6px;font-size:.84em;font-weight:700;color:var(--text-3);}
.lastmv p{margin:0;font-weight:650;line-height:1.35;color:var(--text);}
.tkrow{display:flex;align-items:center;gap:10px;min-height:calc(30px * var(--dk,1));}
.tkrow+.tkrow{border-top:1px solid var(--gl-line);}
.tkn{flex:none;width:30%;font-weight:700;color:var(--text-2);overflow-wrap:anywhere;}
.tkp{display:flex;flex-wrap:wrap;gap:2px;align-items:center;}
.tkp i{font-style:normal;color:var(--text-3);font-weight:600;}
.tkpc{width:calc(26px * var(--dk,1));height:calc(26px * var(--dk,1));display:grid;}
.tkpc svg{width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45));}
.stats table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.stats th{font-size:.84em;font-weight:700;color:var(--text-3);text-align:right;padding:2px 6px;}
.stats th:first-child{text-align:left;padding-left:0;}
.stats td{font-weight:800;text-align:right;padding:3px 6px;border-top:1px solid var(--gl-line);}
.stats td:first-child{text-align:left;font-weight:650;color:var(--text-2);padding-left:0;}
.wins{display:grid;gap:2px;margin-bottom:6px;}
.wrow{display:flex;justify-content:space-between;gap:10px;font-weight:650;}
.wrow b{font-variant-numeric:tabular-nums;}
.plist{margin:0;padding:0 0 0 1.1em;color:var(--text-2);display:grid;gap:3px;}
.plist li{line-height:1.3;}
.sg.land.desk .pbar{min-height:calc(44px * var(--dk,1));}
.sg.land.desk .pbar .nm{font-size:calc(.95rem * var(--dk,1));}
.sg.land.desk .pbar .sub{font-size:calc(.74rem * var(--dk,1));}
.sg.land.desk .turn{font-size:calc(1rem * var(--dk,1));}
.sg.land.desk .moves .mp{font-size:calc(.82rem * var(--dk,1));height:calc(28px * var(--dk,1));line-height:calc(28px * var(--dk,1));}
.sg.land.low{row-gap:5px;}
.sg.land.low .pbar{min-height:38px;padding:3px 10px 3px 6px;}
.sg.land.low .turn{min-height:26px;font-size:.92rem;}
.sg.land.low .acts .btn{min-height:38px;padding-top:6px;padding-bottom:6px;}
.sg.land.low>.moves{padding:5px;}
.sg.land.low>.moves .mp{height:24px;line-height:24px;}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.22,1,.36,1);}
.seat.top{view-transition-name:sg-top;}
.seat.bot{view-transition-name:sg-bot;}
.sg>.turn{view-transition-name:sg-turn;}
.sg>.acts{view-transition-name:sg-acts;}
/* The impasse sheet's count */
.imp{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin:4px 0 10px;font-weight:700;}
.imp .ok{color:#7be39b;}
.imp .no{color:#ff9b8f;}
.lbls{display:grid;gap:8px;}
.lbls button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:0;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text);font:inherit;text-align:left;cursor:pointer;}
.lbls button.on{background:color-mix(in srgb,var(--lit) 14%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 60%,transparent);}
.lbls .ex{display:flex;gap:4px;flex:none;}
.lbls .ex svg{width:40px;height:40px;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.45));}
.lbls b{display:block;}
.lbls small{display:block;color:var(--text-3);font-weight:600;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="sgw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe8bd"/><stop offset=".55" stop-color="#ecc985"/><stop offset="1" stop-color="#d6a659"/></linearGradient>
    <linearGradient id="sge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6dc" stop-opacity=".9"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></linearGradient>
  </defs>
</svg>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), C = window.ShogiCore, R = document.documentElement;
  var SAVE = 'shogi_state', KEY = 'shogi', LBL = 'shogi_labels';
  var BLACK = 1, WHITE = -1;
  var LEVELS = { easy: { depth: 1, time: 250, noise: 260 }, normal: { depth: 3, time: 1500, noise: 22 }, hard: { depth: 5, time: 2000, noise: 0 }, expert: { depth: 9, time: 3000, noise: 0 } };
  var LEVEL_NAME = { easy: 'Easy', normal: 'Normal', hard: 'Hard', expert: 'Expert' };
  // S = {mode, level, players: [{name, cpu, side}], g: the core's game, hist: [games before each move, for undo],
  //      cpuMv: [was the move at hist[i] the computer's], over, started, ev: {promos, caps, drops, checks, best: {...}}, offer}
  var S = null;
  var NET = null, LEFT = null, WINO = null, NETREC = {}, SHOWN = 0;
  var sel = null;   // {f: square} or {d: type}

  // ── Pieces: five-sided wedges of boxwood, the kanji in ink (promoted in red), a small Western letter under it ───
  var KANJI = ['', '歩', '香', '桂', '銀', '金', '角', '飛', '玉', 'と', '杏', '圭', '全', '', '馬', '龍'];
  var HINT = ['', 'P', 'L', 'N', 'S', 'G', 'B', 'R', 'K', '+P', '+L', '+N', '+S', '', '+B', '+R'];
  var BIG = ['', 'P', 'L', 'N', 'S', 'G', 'B', 'R', 'K', 'T', 'L', 'N', 'S', '', 'H', 'D'];
  var NAME = C.NAME;
  // a King's piece is a little larger than a Pawn's, as on a real set
  var SIZE = [0, .84, .87, .89, .92, .93, .96, .96, 1, .84, .87, .89, .92, 0, .96, .96];
  function labels() { var v = 'hint'; try { v = localStorage.getItem(LBL) || 'hint'; } catch (e) {} return /^(hint|kanji|letters)$/.test(v) ? v : 'hint'; }
  var PCACHE = {};
  function pieceSvg(t, side, mode) {
    mode = mode || labels();
    var key = t + ':' + side + ':' + mode;
    if (PCACHE[key]) return PCACHE[key];
    var k = SIZE[t] || 1, w = 82 * k, h = 94 * k, x0 = 50 - w / 2, y1 = 98, y0 = y1 - h;
    var sh = y0 + h * 0.17, top = 50, sx = w * 0.12;
    var d = 'M' + top + ' ' + y0.toFixed(1) + ' L' + (x0 + w - sx).toFixed(1) + ' ' + sh.toFixed(1) + ' L' + (x0 + w).toFixed(1) + ' ' + y1 + ' L' + x0.toFixed(1) + ' ' + y1 + ' L' + (x0 + sx).toFixed(1) + ' ' + sh.toFixed(1) + ' Z';
    var red = t > 8, ink = red ? '#b42318' : '#1d1208', cy = y0 + h * 0.56, fs = h * 0.52;
    var s = '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="' + d + '" fill="url(#sgw)" stroke="#8a5b24" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="' + d + '" fill="none" stroke="url(#sge)" stroke-width="2" transform="translate(0 1.5) scale(1 .985)" opacity=".7"/>';
    var kan = t === 8 && side < 0 ? '王' : KANJI[t];
    if (mode === 'letters') {
      s += moveMarks(t, cy, h, ink);
      s += '<text x="50" y="' + (cy + 1).toFixed(1) + '" text-anchor="middle" dominant-baseline="central" font-family="Schibsted Grotesk, system-ui, sans-serif" font-weight="800" font-size="' + (h * 0.4).toFixed(1) + '" fill="' + ink + '">' + BIG[t] + '</text>';
    } else {
      s += '<text x="50" y="' + (mode === 'hint' ? cy - h * 0.06 : cy).toFixed(1) + '" text-anchor="middle" dominant-baseline="central" font-family="Shogi Kanji, Hiragino Mincho ProN, Yu Mincho, serif" font-weight="700" font-size="' + (mode === 'hint' ? fs * 0.9 : fs).toFixed(1) + '" fill="' + ink + '">' + kan + '</text>';
      if (mode === 'hint') s += '<text x="50" y="' + (y1 - h * 0.12).toFixed(1) + '" text-anchor="middle" dominant-baseline="central" font-family="Schibsted Grotesk, system-ui, sans-serif" font-weight="800" font-size="' + (h * 0.17).toFixed(1) + '" fill="' + (red ? '#b42318' : '#6e4a1c') + '">' + HINT[t] + '</text>';
    }
    return (PCACHE[key] = s + '</svg>');
  }

      '<li>Black moves first. On each side, the back row is Lance, Knight, Silver, Gold, King, Gold, Silver, Knight, Lance. The Bishop stands in front of the left Knight and the Rook in front of the right Knight, and nine Pawns fill the third row.</li>' +

    turn: function (st) { if (st.g.over) return []; if (st.offer != null) return [1 - st.offer]; return [netSeatOf(st, st.g.pos.turn)]; },
    over: function (st) {
      var o = st.g.over; if (!o) return null;
      var w = o.w ? netSeatOf(st, o.w) : -1;
      return { win: w >= 0 ? [w] : [], text: w >= 0 ? st.players[w].name + ' wins' : 'A draw' };
    },
    show: netShow, leave: netLeave
  });
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euchre Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.callers{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.callers button{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border:2px solid transparent;border-radius:var(--r-sm,12px);background:rgba(255,255,255,.06);color:var(--text-2);font-weight:800;font-size:.95rem;text-align:left;overflow:hidden;}
.callers button .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c);}
.callers button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.callers button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--text);}
.callers .tm{grid-column:1/-1;font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:2px 0 -4px;}
.seg.suits > button{font-size:1.5rem;}
.seg.suits > button.r{color:#ff6b7f;}
.seg.tricks > button{font-size:1.15rem;}
.rform .label{margin:4px 0 0;}
.preview{padding:12px;border-radius:var(--r);background:rgba(255,255,255,.06);text-align:center;font-weight:800;}
.preview b{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--yellow);}
.preview.bad b{color:var(--red);}
/* Wide, short screens (iPad landscape): team label beside its two players so the form fits without scrolling */
@media (orientation:landscape) and (min-width:700px){
  .callers{grid-template-columns:minmax(110px,auto) 1fr 1fr;align-items:center;}
  .callers .tm{grid-column:auto;margin:0;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null;
  var SETUP = 'euchre_pad_setup';
  var GL = { s: '♠', h: '♥', d: '♦', c: '♣' };

  Kit.init({
    id: 'euchre', title: 'Euchre score',
    onNew: function () { if (pad) pad.clear(); localStorage.removeItem(SETUP); showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history('eu', { keys: ['euchre'], title: 'Euchre: past games' }); } }],
    rules:
      '<p class="goal">Play Euchre with real cards and keep score here. Partners sit across from each other. <b>First team to 10 points wins.</b></p>' +
      '<h3>The deck</h3><p>Use 24 cards: 9, 10, J, Q, K, A of each suit. Deal 5 cards each and turn the next card face up.</p>' +
      '<h3>Picking trump</h3><ul><li><b>Round 1:</b> starting left of the dealer, each player can <b>order up</b> the face-up card (its suit becomes trump, and the dealer picks it up and throws one card away) or pass.</li>' +
      '<li><b>Round 2:</b> if everyone passed, turn the card down. Each player can now name any other suit, or pass. If everyone passes again, throw the cards in and the next player deals. (House rule "stick the dealer": the dealer must pick a suit.)</li></ul>' +
      '<h3>Bowers</h3><p>The Jack of trump (<b>right bower</b>) is the highest card. The other Jack of the same color (<b>left bower</b>) is next, and it counts as a trump. Then A, K, Q, 10, 9.</p>' +
      '<h3>Playing</h3><p>Left of the dealer leads. Follow the suit led if you can (the left bower follows trump). Highest trump wins, otherwise the highest card of the suit led.</p>' +
      '<h3>Scoring a hand</h3><ul><li>Makers take 3 or 4 tricks: <b>1 point</b>.</li><li>Makers take all 5 (a <b>march</b>): <b>2 points</b>.</li>' +
      '<li>Caller <b>went alone</b> and took all 5: <b>4 points</b> (3 or 4 alone is still 1).</li><li>Makers take fewer than 3: <b>euchred</b>, the other team gets <b>2 points</b>.</li></ul>' +
      '<p>After each hand, tap <b>Add round</b>, pick who called trump, whether they went alone, and how many tricks the makers won. The points are worked out for you.</p>'
  });

  function showSetup() {
    var st = Kit.setup(app, {
      players: { min: 4, max: 4, count: 4, label: 'Players in seat order' },
      intro: 'Keep score for a game at the table',
      options: [{ id: 'target', label: 'Play to', help: 'The first team to reach this many points wins.', value: 10, choices: [[5, '5'], [7, '7'], [10, '10 · standard']] }],
      start: 'Start scoring',
      onStart: function (cfg) {
        var names = cfg.players.map(function (p) { return p.name; });
        localStorage.setItem(SETUP, JSON.stringify({ names: names, target: +cfg.options.target || 10 }));
        startPad();
      }
    });
    var start = st.el.querySelector('.btn-primary.btn-lg');
    if (start) st.el.insertBefore(el('p', { class: 'muted', style: { 'text-align': 'center', margin: '-4px 0 0' }, text: 'Players 1 & 3 are partners against players 2 & 4.' }), start);
  }

  // Points for one hand. side = team that called, tricks = makers' tricks
  function points(side, tricks, alone) {
    var s = [0, 0];
    if (tricks >= 3) s[side] = tricks === 5 ? (alone ? 4 : 2) : 1;
    else s[1 - side] = 2;
    return s;
  }
  // Each round's maker info lives in the small note under the score:
  // "Jamie ♥ alone · 5"
  var NOTE = /^(.*?)(?: ([♠♥♦♣]))?( alone)? · (\d)$/;
  function parse(round, names) {
    if (!round || !round.detail) return null;
    for (var side = 0; side < 2; side++) {
      var m = NOTE.exec(round.detail[side] || ''); if (!m) continue;
      var caller = names.indexOf(m[1]);
      if (caller < 0 || caller % 2 !== side) caller = side;
      var suit = null; for (var k in GL) if (GL[k] === m[2]) suit = k;
      return { side: side, caller: caller, suit: suit, alone: !!m[3], tricks: +m[4] };
    }
    return null;
  }
  function times(n) { return n === 1 ? 'once' : n === 2 ? 'twice' : n + ' times'; }
  function hideTeamNames(teams) {
    try {
      var h = JSON.parse(localStorage.getItem('gn_hidden_names') || '[]');
      teams.forEach(function (n) { if (h.indexOf(n) < 0) h.push(n); });
      localStorage.setItem('gn_hidden_names', JSON.stringify(h.slice(-200)));
    } catch (e) {}
  }

  function startPad() {
    var cfg = JSON.parse(localStorage.getItem(SETUP));
    var N = cfg.names, teams = [N[0] + ' & ' + N[2], N[1] + ' & ' + N[3]];
    hideTeamNames(teams);
    pad = Scorepad(app, {
      key: 'eu', title: 'Euchre', mode: 'Scorekeeper', target: cfg.target,
      sides: teams.map(function (n) { return { name: n }; }),
      goal: 'First team to ' + cfg.target + ' wins',
      form: function (ctx) {
        var prev = parse(ctx.prev, N);
        var caller = prev ? prev.caller : -1, suit = prev ? prev.suit : null, alone = prev ? prev.alone : false, tricks = prev ? prev.tricks : 3;

        // Who called trump: players grouped by team
        ctx.node.appendChild(el('div', { class: 'label', text: 'Who called trump?' }));
        var grid = el('div', { class: 'callers' }), callBtns = [];
        [0, 1].forEach(function (tm) {
          grid.appendChild(el('div', { class: 'tm', text: teams[tm] }));
          [tm, tm + 2].forEach(function (p) {
            var b = el('button', { type: 'button', style: { '--c': Kit.color(tm) }, onclick: function () { caller = p; Kit.sfx('tap'); paint(); } },
              [el('span', { class: 'dot' }), el('span', { text: N[p] })]);
            callBtns[p] = b; grid.appendChild(b);
          });
        });
        ctx.node.appendChild(grid);

        ctx.node.appendChild(el('div', { class: 'label', text: 'Trump suit (optional)' }));
        var suitSeg = el('div', { class: 'seg suits' });
        ['s', 'h', 'd', 'c'].forEach(function (s) {
          suitSeg.appendChild(el('button', { type: 'button', class: s === 'h' || s === 'd' ? 'r' : '', 'aria-label': { s: 'Spades', h: 'Hearts', d: 'Diamonds', c: 'Clubs' }[s], 'data-s': s, text: GL[s],
            onclick: function () { suit = suit === s ? null : s; Kit.sfx('tap'); paint(); } }));
        });
        ctx.node.appendChild(suitSeg);

        ctx.node.appendChild(el('div', { class: 'label', text: 'Did they go alone?' }));
        var aloneSeg = el('div', { class: 'seg' }, [
          el('button', { type: 'button', text: 'No, with partner', onclick: function () { alone = false; Kit.sfx('tap'); paint(); } }),
          el('button', { type: 'button', text: 'Went alone', onclick: function () { alone = true; Kit.sfx('tap'); paint(); } })
        ]);
        ctx.node.appendChild(aloneSeg);

        var trLabel = el('div', { class: 'label', text: 'Tricks the makers won' });
        ctx.node.appendChild(trLabel);
        var trSeg = el('div', { class: 'seg tricks' });
        for (var t = 0; t <= 5; t++) (function (t) {
          trSeg.appendChild(el('button', { type: 'button', text: String(t), onclick: function () { tricks = t; Kit.sfx('tap'); paint(); } }));
        })(t);
        ctx.node.appendChild(trSeg);

        var preview = el('div', { class: 'preview' });
        ctx.node.appendChild(preview);
        var btn = el('button', { type: 'button', class: 'btn btn-primary btn-block', text: ctx.prev ? 'Save changes' : 'Score this hand' });
        ctx.node.appendChild(btn);

        function paint() {
          callBtns.forEach(function (b, p) { b.classList.toggle('on', p === caller); });
          Array.prototype.forEach.call(suitSeg.children, function (b) { b.classList.toggle('on', b.getAttribute('data-s') === suit); });
          aloneSeg.children[0].classList.toggle('on', !alone); aloneSeg.children[1].classList.toggle('on', alone);
          Array.prototype.forEach.call(trSeg.children, function (b, i) { b.classList.toggle('on', i === tricks); });
          btn.disabled = caller < 0;
          if (caller < 0) { preview.className = 'preview'; preview.innerHTML = 'Pick who called trump'; return; }
          var side = caller % 2;
          trLabel.textContent = 'Tricks ' + (alone ? N[caller] : teams[side]) + ' won';
          var s = points(side, tricks, alone), html;
          if (tricks < 3) html = '<b>Euchred!</b>' + Kit.esc(teams[1 - side]) + ' get 2 points';
          else if (tricks === 5) html = '<b>' + (alone ? 'Alone march!' : 'March!') + '</b>' + Kit.esc(teams[side]) + ' get ' + s[side] + ' points';
          else html = '<b>Made it</b>' + Kit.esc(teams[side]) + ' get 1 point';
          preview.className = 'preview' + (tricks < 3 ? ' bad' : '');
          preview.innerHTML = html;
        }
        btn.addEventListener('click', function () {
          if (caller < 0) return;
          var side = caller % 2, scores = points(side, tricks, alone);
          var detail = ['', ''];
          detail[side] = N[caller] + (suit ? ' ' + GL[suit] : '') + (alone ? ' alone' : '') + ' · ' + tricks;
          if (tricks < 3) detail[1 - side] = 'euchre!';
          var extra = { detail: detail, highlights: [] };
          if (alone && tricks === 5) { extra.highlights.push(N[caller] + ' went alone and marched in hand ' + ctx.round); extra.callout = 'Alone march!'; Kit.confetti({ count: 90 }); }
          else if (alone && tricks < 3) { extra.highlights.push(N[caller] + ' went alone and got euchred in hand ' + ctx.round); extra.callout = 'Euchred!'; }
          else if (tricks < 3) extra.callout = 'Euchred!';
          else if (tricks === 5) extra.callout = 'March!';
          // Game over after this hand? Add the whole-game highlights now.
          var ends = !ctx.prev && (ctx.totals[0] + scores[0] >= cfg.target || ctx.totals[1] + scores[1] >= cfg.target);
          if (ends) {
            var all = pad.state().rounds.map(function (r) { return parse(r, N); }).filter(Boolean);
            all.push({ side: side, caller: caller, alone: alone, tricks: tricks });
            [0, 1].forEach(function (tm) {
              var eu = all.filter(function (x) { return x.side === tm && x.tricks < 3; }).length;
              if (eu) extra.highlights.push(teams[tm] + ' got euchred ' + times(eu));
              var mar = all.filter(function (x) { return x.side === tm && x.tricks === 5 && !x.alone; }).length;
              if (mar) extra.highlights.push(teams[tm] + ' marched ' + times(mar));
            });
            var calls = [0, 0, 0, 0]; all.forEach(function (x) { calls[x.caller]++; });
            var top = calls.indexOf(Math.max.apply(null, calls));
            if (calls[top] >= 3) extra.highlights.push(N[top] + ' called trump the most (' + calls[top] + ' times)');
          }
          ctx.done(scores, extra);
        });
        paint();
      }
    });
  }

  if (localStorage.getItem(SETUP)) startPad(); else showSetup();
})();
</script>
</body>
</html>

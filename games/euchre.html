<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euchre Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* The open hand: who called (per team), trump suit, then the makers' tricks */
.eu-col{display:flex;flex-direction:column;gap:3px;}
.eu-tr{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
.eu-tr .sp-tg{font-family:var(--hand);font-weight:400;font-size:1.15rem;min-height:34px;}
.eu-tr .sp-tg.lo{background:rgba(200,16,46,.07);}
.eu-tr .sp-tg.lo.on{background:#c8102e;border-color:#a50d26;color:#fff;}
.eu-tr .sp-tg.hi{background:rgba(255,196,46,.16);}
.eu-tr .sp-tg.hi.on{background:#ffc42e;border-color:#e0a800;color:#2b1a00;}
.eu-suits{display:flex;justify-content:center;gap:6px;}
.eu-suits .sp-tg{width:auto;flex:0 1 54px;font-size:1.25rem;min-height:34px;}
.eu-suits .sp-tg.r{color:#d81e3a;}
.eu-suits .sp-tg.r.on{color:#fff;background:#d81e3a;border-color:#b0162e;}
.spad td .wait{display:block;padding:8px 2px;font-family:var(--hand);font-size:.95rem;line-height:1.1;color:#8a8796;}
.spad td.eu-span{text-align:center;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null;
  var SETUP = 'euchre_pad_setup';
  var GL = { s: '♠', h: '♥', d: '♦', c: '♣' };

  Kit.init({
    id: 'euchre', title: 'Euchre score',
    onNew: function () { if (pad) pad.clear(); localStorage.removeItem(SETUP); showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history('eu', { keys: ['euchre'], title: 'Euchre: past games' }); } }],
    rules:
      '<p class="goal">Play Euchre with real cards and keep score here. Partners sit across from each other. <b>First team to 10 points wins.</b></p>' +
      '<h3>The deck</h3><p>Use 24 cards: 9, 10, J, Q, K, A of each suit. Deal 5 cards each and turn the next card face up.</p>' +
      '<h3>Picking trump</h3><ul><li><b>Round 1:</b> starting left of the dealer, each player can <b>order up</b> the face-up card (its suit becomes trump, and the dealer picks it up and throws one card away) or pass.</li>' +
      '<li><b>Round 2:</b> if everyone passed, turn the card down. Each player can now name any other suit, or pass. If everyone passes again, throw the cards in and the next player deals. (House rule "stick the dealer": the dealer must pick a suit.)</li></ul>' +
      '<h3>Bowers</h3><p>The Jack of trump (<b>right bower</b>) is the highest card. The other Jack of the same color (<b>left bower</b>) is next, and it counts as a trump. Then A, K, Q, 10, 9.</p>' +
      '<h3>Playing</h3><p>Left of the dealer leads. Follow the suit led if you can (the left bower follows trump). Highest trump wins, otherwise the highest card of the suit led.</p>' +
      '<h3>Scoring a hand</h3><ul><li>Makers take 3 or 4 tricks: <b>1 point</b>.</li><li>Makers take all 5 (a <b>march</b>): <b>2 points</b>.</li>' +
      '<li>Caller <b>went alone</b> and took all 5: <b>4 points</b> (3 or 4 alone is still 1).</li><li>Makers take fewer than 3: <b>euchred</b>, the other team gets <b>2 points</b>.</li></ul>' +
      '<h3>Keeping score</h3><p>The open rows on the sheet are this hand. Tap the player who <b>called trump</b> in their team\'s column (and <b>Alone</b> if they went alone), the trump suit if you like, then the <b>tricks the makers won</b>. The points are worked out for you; tap <b>Lock hand</b> to write it in. Tap a hand on the sheet to change or delete it right there.</p>'
  });

  function showSetup() {
    var st = Kit.setup(app, {
      players: { min: 4, max: 4, count: 4, label: 'Players in seat order' },
      intro: 'Keep score for a game at the table',
      options: [{ id: 'target', label: 'Play to', help: 'The first team to reach this many points wins.', value: 10, choices: [[5, '5'], [7, '7'], [10, '10 · standard']] }],
      start: 'Start scoring',
      onStart: function (cfg) {
        var names = cfg.players.map(function (p) { return p.name; });
        localStorage.setItem(SETUP, JSON.stringify({ names: names, target: +cfg.options.target || 10 }));
        startPad();
      }
    });
    var seats = st.el.querySelector('.k-seats'), start = seats && seats.nextSibling;
    if (start) st.el.insertBefore(el('p', { class: 'muted', style: { 'text-align': 'center', margin: '-4px 0 0' }, text: 'Players 1 & 3 are partners against players 2 & 4.' }), start);
  }

  // Points for one hand. side = team that called, tricks = makers' tricks
  function points(side, tricks, alone) {
    var s = [0, 0];
    if (tricks >= 3) s[side] = tricks === 5 ? (alone ? 4 : 2) : 1;
    else s[1 - side] = 2;
    return s;
  }
  // Each round's maker info lives in the small note under the score:
  // "Jamie ♥ alone · 5"
  var NOTE = /^(.*?)(?: ([♠♥♦♣]))?( alone)? · (\d)$/;
  function parse(round, names) {
    if (!round || !round.detail) return null;
    for (var side = 0; side < 2; side++) {
      var m = NOTE.exec(round.detail[side] || ''); if (!m) continue;
      var caller = names.indexOf(m[1]);
      if (caller < 0 || caller % 2 !== side) caller = side;
      var suit = null; for (var k in GL) if (GL[k] === m[2]) suit = k;
      return { side: side, caller: caller, suit: suit, alone: !!m[3], tricks: +m[4] };
    }
    return null;
  }
  function times(n) { return n === 1 ? 'once' : n === 2 ? 'twice' : n + ' times'; }
  function hideTeamNames(teams) {
    try {
      var h = JSON.parse(localStorage.getItem('gn_hidden_names') || '[]');
      teams.forEach(function (n) { if (h.indexOf(n) < 0) h.push(n); });
      localStorage.setItem('gn_hidden_names', JSON.stringify(h.slice(-200)));
    } catch (e) {}
  }

  function startPad() {
    var cfg = JSON.parse(localStorage.getItem(SETUP));
    var N = cfg.names, teams = [N[0] + ' & ' + N[2], N[1] + ' & ' + N[3]];
    hideTeamNames(teams);

    // ── The open hand on the sheet ──
    // st = {caller: seat or -1, suit, alone, tricks}
    function entryRows(ctx) {
      var p = ctx.editing ? parse(ctx.prev, N) : null;
      var st = p ? { caller: p.caller, suit: p.suit, alone: p.alone, tricks: p.tricks } : (ctx.draft() || { caller: -1, suit: null, alone: false, tricks: 3 });
      var rowCall = el('tr', { class: 'open' }, [el('th', { class: 'rn' }, [String(ctx.round), el('small', { text: 'CALLED' })])]);
      var rowSuit = el('tr', { class: 'sub' }, [el('th', { class: 'rn', text: 'TRUMP' })]);
      var rowTr = el('tr', { class: 'sub' }, [el('th', { class: 'rn', text: 'TRICKS' })]);
      var callB = [], aloneB = [], trCells = [], eqs = [];
      [0, 1].forEach(function (tm) {
        var col = el('div', { class: 'eu-col' });
        [tm, tm + 2].forEach(function (pl) {
          callB[pl] = Scorepad.tog(N[pl], { cls: 'gold', aria: N[pl] + ' called trump', onClick: function () { var was = st.caller >= 0 ? st.caller % 2 : -1; st.caller = st.caller === pl ? -1 : pl; if (st.caller < 0 || st.caller % 2 !== was) st.alone = false; refresh(); } });
          col.appendChild(callB[pl]);
        });
        aloneB[tm] = Scorepad.tog('Alone', { cls: 'blue', aria: teams[tm] + ': caller went alone', onClick: function () { if (st.caller >= 0 && st.caller % 2 === tm) { st.alone = !st.alone; refresh(); } } });
        col.appendChild(aloneB[tm]);
        var eq = el('small', { class: 'eq' }); eqs[tm] = eq;
        rowCall.appendChild(el('td', null, [col, eq]));
        trCells[tm] = el('td');
        rowTr.appendChild(trCells[tm]);
      });
      var suits = el('div', { class: 'eu-suits' }), suitB = {};
      ['s', 'h', 'd', 'c'].forEach(function (k) {
        suitB[k] = Scorepad.tog(GL[k] + '\uFE0E', { cls: k === 'h' || k === 'd' ? 'r' : '', aria: { s: 'Spades', h: 'Hearts', d: 'Diamonds', c: 'Clubs' }[k] + ' were trump', onClick: function () { st.suit = st.suit === k ? null : k; refresh(); } });
        suits.appendChild(suitB[k]);
      });
      rowSuit.appendChild(el('td', { class: 'eu-span', colspan: '2' }, [suits]));
      var trGrid = el('div', { class: 'eu-tr' }), trB = [];
      for (var t = 0; t <= 5; t++) (function (t) {
        trB[t] = Scorepad.tog(String(t), { cls: t < 3 ? 'lo' : t === 5 ? 'hi' : '', aria: 'Makers won ' + t + (t === 1 ? ' trick' : ' tricks'), onClick: function () { st.tricks = t; refresh(); } });
        trGrid.appendChild(trB[t]);
      })(t);
      var trWait = el('span', { class: 'wait', text: 'tap who called' });
      function refresh() {
        var side = st.caller >= 0 ? st.caller % 2 : -1;
        callB.forEach(function (b, pl) { b.set(pl === st.caller); });
        [0, 1].forEach(function (tm) { aloneB[tm].set(side === tm && st.alone); aloneB[tm].disabled = side !== tm; });
        Object.keys(suitB).forEach(function (k) { suitB[k].set(st.suit === k); });
        trB.forEach(function (b, t) { b.set(t === st.tricks); });
        [0, 1].forEach(function (tm) {
          var want = side < 0 ? (tm === 0 ? trWait : null) : side === tm ? trGrid : null;
          if (trCells[tm].firstChild !== want) { trCells[tm].innerHTML = ''; if (want) trCells[tm].appendChild(want); }
        });
        if (side < 0) {
          eqs.forEach(function (e) { e.textContent = ''; e.className = 'eq'; });
          ctx.pending(null);
          ctx.status('Tap who called trump.', 'wait');
        } else {
          var s = points(side, st.tricks, st.alone), tricks = st.tricks, msg;
          eqs.forEach(function (e, tm) {
            e.className = 'eq' + (s[tm] ? (tricks < 3 ? ' bad' : ' good') : '');
            e.textContent = s[tm] ? '+' + s[tm] + (tricks < 3 ? ' euchre!' : tricks === 5 ? (st.alone ? ' alone march' : ' march') : ' made it') : '';
          });
          if (tricks < 3) msg = 'Euchred! ' + teams[1 - side] + ' get 2 points.';
          else if (tricks === 5) msg = (st.alone ? 'Alone march! ' : 'March! ') + teams[side] + ' get ' + s[side] + ' points.';
          else msg = 'Made it. ' + teams[side] + ' get 1 point.';
          ctx.pending(s);
          ctx.status(msg, true);
        }
        if (!ctx.editing) ctx.draft(st);
      }
      refresh();
      ctx.entry = st;
      return [rowCall, rowSuit, rowTr];
    }
    function lockHand(ctx) {
      var st = ctx.entry, caller = st.caller, suit = st.suit, alone = st.alone, tricks = st.tricks;
      if (caller < 0) return;
      var side = caller % 2, scores = points(side, tricks, alone);
      var detail = ['', ''];
      detail[side] = N[caller] + (suit ? ' ' + GL[suit] : '') + (alone ? ' alone' : '') + ' · ' + tricks;
      if (tricks < 3) detail[1 - side] = 'euchre!';
      var extra = { detail: detail, highlights: [] };
      if (alone && tricks === 5) { extra.highlights.push(N[caller] + ' went alone and marched in hand ' + ctx.round); extra.callout = 'Alone march!'; if (!ctx.editing) Kit.confetti({ count: 90 }); }
      else if (alone && tricks < 3) { extra.highlights.push(N[caller] + ' went alone and got euchred in hand ' + ctx.round); extra.callout = 'Euchred!'; }
      else if (tricks < 3) extra.callout = 'Euchred!';
      else if (tricks === 5) extra.callout = 'March!';
      // Game over after this hand? Add the whole-game highlights now.
      var ends = !ctx.editing && (ctx.totals[0] + scores[0] >= cfg.target || ctx.totals[1] + scores[1] >= cfg.target);
      if (ends) {
        var all = pad.state().rounds.map(function (r) { return parse(r, N); }).filter(Boolean);
        all.push({ side: side, caller: caller, alone: alone, tricks: tricks });
        [0, 1].forEach(function (tm) {
          var eu = all.filter(function (x) { return x.side === tm && x.tricks < 3; }).length;
          if (eu) extra.highlights.push(teams[tm] + ' got euchred ' + times(eu));
          var mar = all.filter(function (x) { return x.side === tm && x.tricks === 5 && !x.alone; }).length;
          if (mar) extra.highlights.push(teams[tm] + ' marched ' + times(mar));
        });
        var calls = [0, 0, 0, 0]; all.forEach(function (x) { calls[x.caller]++; });
        var top = calls.indexOf(Math.max.apply(null, calls));
        if (calls[top] >= 3) extra.highlights.push(N[top] + ' called trump the most (' + calls[top] + ' times)');
      }
      ctx.done(scores, extra);
    }

    pad = Scorepad(app, {
      key: 'eu', title: 'Euchre', mode: 'Scorekeeper', target: cfg.target,
      sides: teams.map(function (n) { return { name: n }; }),
      goal: 'First team to ' + cfg.target + ' wins',
      entryRows: entryRows, onLock: lockHand, lockLabel: 'Lock hand'
    });
  }

  if (localStorage.getItem(SETUP)) startPad(); else showSetup();
})();
</script>
</body>
</html>

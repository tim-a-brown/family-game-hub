<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinball</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>

<style>
@font-face{font-family:"Bungee";src:url("../fonts/bungee.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Cinzel";src:url("../fonts/cinzel-700.woff2") format("woff2");font-weight:700;font-display:swap;}
/* ── Table select (inside the kit setup screen) ─────────────────────────── */
.pb-setup .setup-hero{padding-top:4px;}
.pb-setup .setup-hero .k-hero-ic .gicon{width:76px;height:76px;}
.pb-setup .setup > .btn-primary.btn-lg{position:sticky;bottom:calc(var(--safe-b) + 10px);z-index:5;box-shadow:0 6px 0 var(--b-lip),0 14px 30px rgba(0,0,0,.55);}
.pb-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.pb-head .label{margin:0;}
.pb-head small{font-weight:800;color:var(--text-3);font-size:.8rem;}
.pb-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
@media (min-width:600px){.pb-tables{grid-template-columns:repeat(3,minmax(0,1fr));}}
.pb-card{position:relative;display:flex;flex-direction:column;border:0;padding:0;border-radius:16px;overflow:hidden;background:#0b0a16;color:#fff;text-align:left;
  box-shadow:0 0 0 2px rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.38);transition:transform .15s var(--spring),box-shadow .15s;}
.pb-card:active{transform:scale(.97);}
.pb-card .th{display:block;width:100%;height:auto;aspect-ratio:280/300;background:radial-gradient(70% 60% at 50% 40%,var(--c,#333) 0%,#05040a 80%);object-fit:cover;}
.pb-card .inf{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1;}
.pb-card .nm{font-family:var(--display);font-weight:400;font-size:1.18rem;line-height:1.05;}
.pb-card .ds{font-size:.74rem;line-height:1.25;color:rgba(255,255,255,.72);font-weight:700;flex:1;}
.pb-card .mt{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;font-size:.7rem;font-weight:900;letter-spacing:.04em;}
.pb-card .df{display:inline-flex;gap:3px;align-items:center;color:rgba(255,255,255,.6);}
.pb-card .df i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);}
.pb-card .df i.on{background:var(--c,#ffc83d);}
.pb-card .bs{color:#ffd27a;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pb-card .bs.none{color:rgba(255,255,255,.45);}
.pb-card.on{box-shadow:0 0 0 3px var(--c,var(--accent)),0 10px 22px rgba(0,0,0,.45);}
.pb-card .ck{position:absolute;right:7px;top:7px;width:24px;height:24px;border-radius:50%;display:none;place-items:center;background:var(--c,var(--accent));color:#08060f;}
.pb-card.on .ck{display:grid;}
.pb-card .ck .ico{width:15px;height:15px;stroke-width:3.2;}

/* ── Play view: display band on top, the 3D machine fills the rest ──────── */
html.pb-on,html.pb-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.pb-on body{display:flex;flex-direction:column;background:#05040a;}
/* The cabinet page is dark in every theme, so the bar and controls over it keep the Night colours */
html.pb-on{--text:#fbf8ff;--text-2:#c9c1e6;--text-3:#8f86b3;--yellow:#ffc83d;--surface:#231c45;--surface-2:#2d2556;--surface-3:#3a3169;--bg:#141029;--bg-2:#1c1638;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);--seg:rgba(0,0,0,.25);--inset:rgba(0,0,0,.28);--inset-2:rgba(0,0,0,.38);--glass:rgba(20,16,41,.82);--shade:rgba(8,5,22,.55);--w03:rgba(255,255,255,.03);--w09:rgba(255,255,255,.09);--w15:rgba(255,255,255,.15);--w16:rgba(255,255,255,.16);--w04:rgba(255,255,255,.04);--w05:rgba(255,255,255,.05);--w06:rgba(255,255,255,.06);--w07:rgba(255,255,255,.07);--w08:rgba(255,255,255,.08);--w1:rgba(255,255,255,.1);--w12:rgba(255,255,255,.12);--w14:rgba(255,255,255,.14);--w18:rgba(255,255,255,.18);--w2:rgba(255,255,255,.2);--gold:#ffc83d;--text-dim:#c9c1e6;--shadow:0 10px 30px rgba(5,2,20,.45);--shadow-sm:0 4px 12px rgba(5,2,20,.35);}
html.pb-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0;display:flex;flex-direction:column;
  position:relative;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
/* the table's best score, lit in dots on the scoreboard's top bezel, centred over the display */
.pb-best{display:block;height:12px;margin:0 auto 4px;image-rendering:auto;}
.pb-band{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;padding:4px 8px 6px;background:linear-gradient(#17141d,#0a090d);box-shadow:0 2px 0 rgba(255,255,255,.04),0 6px 16px rgba(0,0,0,.6);z-index:2;}
.pb-dmd{display:block;width:min(100%,560px);aspect-ratio:5/1;border-radius:6px;background:#050302;box-shadow:inset 0 0 0 2px #2a2630,0 0 0 3px #0b0a0e;}
.pb-dmd.lcd{aspect-ratio:4/1;}
.pb-view{flex:1;min-height:0;position:relative;}
.pb-gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
/* Arcade pushbuttons: a glossy convex cap (highlight upper-left, darker to the rim) seated in a slightly darker
   bezel ring with a seam shadow and a lip highlight. Opaque plastic, no glyphs. --cap sets the colour family. */
.pb-arc{position:relative;border:0;padding:0;border-radius:50%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  --cap:#d93a2b;--cap-hi:#ff8d7c;--cap-lo:#8e1d14;--bez:#a8291d;--bez-lo:#6e170f;
  background:radial-gradient(circle at 50% 50%,var(--bez) 0 70%,var(--bez-lo) 71% 100%);
  border:2px solid color-mix(in srgb,var(--c,#d93a2b) 28%,var(--bez-lo));
  box-shadow:0 3px 0 rgba(0,0,0,.55),0 8px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 3px rgba(0,0,0,.35);}
.pb-arc::before{content:"";position:absolute;inset:11%;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,var(--cap-hi) 0,var(--cap) 38%,var(--cap) 62%,var(--cap-lo) 100%);
  box-shadow:0 0 0 2px rgba(0,0,0,.42),0 2px 3px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.45),inset 0 -4px 7px rgba(0,0,0,.3);
  transition:transform .06s,filter .06s,box-shadow .06s;}
.pb-arc::after{content:"";position:absolute;left:26%;top:17%;width:34%;height:20%;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(3px);transition:opacity .06s,transform .06s;}
.pb-arc.on::before{transform:translateY(3.5px);filter:brightness(.82) saturate(1.1);box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 0 rgba(0,0,0,0),inset 0 1px 2px rgba(255,255,255,.25),inset 0 5px 8px rgba(0,0,0,.45);}
.pb-arc.on::after{opacity:.3;transform:translateY(3.5px);}
.pb-flip{position:absolute;z-index:3;bottom:calc(var(--safe-b) + 14px);width:72px;height:72px;}
.pb-flipL{left:10px;}.pb-flipR{right:10px;}
.pb-view.no-flipbtns .pb-flip{display:none;}
/* smaller buttons with an engraved legend plate under them, like the printed labels on a lockdown bar */
/* the small buttons sit in the same apron row as the flippers: L · MAGNET · NUDGE · FIRE · R, legends aligned */
.pb-ctl{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;bottom:calc(var(--safe-b) + 6px);}
.pb-ctl .pb-arc{width:50px;height:50px;}
.pb-leg{display:block;padding:2px 6px 1px;border-radius:3px;background:#15131a;border:1px solid #3d3946;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.6);
  font:800 9.5px/1.3 var(--font,system-ui);letter-spacing:.14em;color:#d8cfbb;text-shadow:0 1px 0 #000;white-space:nowrap;}
.pb-nudge{left:50%;transform:translateX(-50%);}
.pb-nudge .pb-arc{--cap:#efe6d4;--cap-hi:#fffdf6;--cap-lo:#a89b84;--bez:#b9ad98;--bez-lo:#7a7062;}
.pb-magna{left:88px;}
.pb-magna .pb-arc{--cap:#2f6fdb;--cap-hi:#8fb8ff;--cap-lo:#163a86;--bez:#245bb5;--bez-lo:#12306a;}
.pb-fire{right:88px;display:none;}
.pb-fire .pb-arc{--cap:#f1c531;--cap-hi:#fff2a8;--cap-lo:#a07c0c;--bez:#c9a324;--bez-lo:#7c6208;}
.pb-fire.show{display:flex;}
.pb-view.no-flipbtns .pb-magna{left:14px;}.pb-view.no-flipbtns .pb-fire{right:14px;}
/* The plunger: the part of the shooter outside the cabinet (chrome housing on the cabinet front, rod, knob),
   drawn on a canvas lined up under the 3D shooter lane. The canvas reaches down over the button row so the
   knob can travel when pulled, but only the grab handle (housing, rod and knob at rest) takes touches. */
.pb-plunger{position:absolute;left:0;top:0;z-index:4;pointer-events:none;display:none;will-change:transform;}
.pb-plunger.show{display:block;}
.pb-plunger.glide{transition:transform .6s cubic-bezier(.45,0,.25,1);}
.pb-plunger canvas{position:absolute;left:0;top:0;display:block;}
.pb-plunger .grab{position:absolute;pointer-events:auto;touch-action:none;border:0;padding:0;margin:0;background:transparent;border-radius:22px;-webkit-tap-highlight-color:transparent;cursor:grab;}
.pb-plunger.held .grab{cursor:grabbing;}
/* a ball waits: a slow warm breath of light round the knob (no label) */
.pb-plunger .cue{position:absolute;pointer-events:none;border-radius:50%;opacity:0;background:radial-gradient(closest-side,rgba(255,214,140,.38),rgba(255,190,90,.12) 60%,rgba(255,190,90,0));transition:opacity .3s;}
.pb-plunger.wait .cue{animation:pbCue 2.2s ease-in-out infinite;}
.pb-plunger.held .cue{animation:none;opacity:0;}
@keyframes pbCue{0%,100%{opacity:.15;}50%{opacity:.85;}}
.pb-flip.under{opacity:.35;transition:opacity .12s;}
.pb-pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:6;background:rgba(6,4,14,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
.pb-pause.show{display:flex;}
.pb-pause .card{width:min(270px,82%);text-align:center;padding:22px 18px 16px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.pb-pause h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 4px;}
.pb-pause p{color:var(--text-2);margin:0 0 14px;font-weight:700;}
.pb-pause .btn{margin-top:8px;}
.pb-load{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:rgba(255,255,255,.75);font-weight:800;z-index:4;pointer-events:none;text-align:center;}
.pb-load i{display:block;width:min(60%,240px);height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;}
.pb-load i b{display:block;height:100%;width:0;background:var(--accent,#7fd4a4);transition:width .25s;}
.pb-nogl{padding:40px 20px;text-align:center;color:var(--text-2);font-weight:700;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script type="module">
import * as THREE from 'three';
import { createGame, renderThumb, fmt, audio } from './pinball/engine.js';
import { smallText, smallW } from './pinball/display.js';
import { stubTable } from './pinball/tables/stub.js';

const el = Kit.el, app = document.getElementById('app'), root = document.documentElement;
const KEY = 'pinball', SELK = 'pinball_sel';
const IDS = ['haunted', 'neon', 'pirate', 'jungle', 'nebula', 'midway'];   // picker order
// Each table is its own module; one table failing to load must not take the page down with it.
const NAMES = { haunted: ['Haunted Manor', 'HAUNTED', '#7dd3a8'], nebula: ['Nebula Run', 'NEBULA', '#22d3ee'], pirate: ["Pirate's Cove", 'PIRATE', '#fbbf24'], jungle: ['Jungle Temple', 'JUNGLE', '#84cc16'], neon: ['Neon Nights', 'NEON', '#f472b6'], midway: ['Midway Mayhem', 'MIDWAY', '#f87171'] };
const TABLES = {};
await Promise.all(IDS.map(async id => {
  try { TABLES[id] = (await import('./pinball/tables/' + id + '.js')).default; }
  catch (e) {
    console.error('Pinball: table "' + id + '" failed to load', e);
    const n = NAMES[id];
    TABLES[id] = stubTable({ id, name: n[0], short: n[1], color: n[2], desc: 'This table is being rebuilt.', diff: 2, music: { url: '../sounds/pinball/' + id + '.mp3', samples: 0, rate: 32000 }, theme: { accent: n[2], pop: n[2] } });
  }
}));
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function selTable() { const h = (location.hash || '').slice(1); if (TABLES[h]) return h; const s = lsGet(SELK, 'haunted'); return TABLES[s] ? s : 'haunted'; }

// ═══ Renderer (one WebGL context for thumbnails and play) ═══════════════════
let renderer = null, glCanvas = null;
const NOTHUMBS = /[?&]nothumbs=1/.test(location.search);
function getRenderer() {
  if (renderer) return renderer;
  glCanvas = document.createElement('canvas'); glCanvas.className = 'pb-gl';
  try { renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, powerPreference: 'high-performance', alpha: false, stencil: false }); }
  catch (e) { renderer = null; }
  return renderer;
}

// ═══ Kit shell ══════════════════════════════════════════════════════════════
let G = null, view = 'none', ambPref = true, ballsPref = 3;
let bestEl = null, bestBase = 0, shownBest = -1;
function showHigh() { const id = G ? G.id : selTable(); ArcadeHi.show('pinball_' + id, 'Pinball: ' + TABLES[id].name); }
Kit.init({ orient: 'portrait', orientTablets: true,
  id: 'pinball',
  onNew: () => showSetup(),
  menu: [
    { icon: 'board', label: 'Choose table', onClick: () => showSetup() },
    { icon: 'trophy', label: 'High scores', onClick: showHigh },
    { icon: 'history', label: 'Past games', onClick: () => Kit.history(KEY, { title: 'Pinball: past games' }) },
    { icon: 'eye', label: 'Top-down view', sub: 'Straight down on the playfield. Off: first person, angled like standing at the machine.', toggle: () => viewMode() === 'top', onClick: () => setViewMode(viewMode() === 'top' ? 'first' : 'top') },
    { icon: 'gamepad', label: 'On-screen buttons', sub: 'Big flipper buttons in the corners. Off: tap the left or right half of the table instead.', toggle: () => btnsOn(), onClick: () => { lsSet('pinball_btns', btnsOn() ? '0' : '1'); if (viewEl) viewEl.classList.toggle('no-flipbtns', !btnsOn()); if (G) { G.resize(); layoutPlunger(false); } } }
  ],
  rules:
    '<p class="goal">Keep the ball in play as long as you can and score as many points as you can. A game is 3 or 5 balls.</p>' +
    '<h3>Controls</h3><ul>' +
    '<li><b>Flippers:</b> hold the big buttons in the bottom corners (left and right), or touch the left or right half of the table. Use both thumbs. Hold a flipper up to catch the ball and aim. The game menu can hide the buttons.</li>' +
    '<li><b>Launch:</b> the plunger knob sits at the bottom right of the cabinet, under the shooter lane. Grab it and pull it down; let go and it snaps forward. The further you pull, the harder the shot (pull a little for a soft skill shot, all the way for a full one). A quick tap on the knob is a medium launch; easing it all the way back up before you let go cancels.</li>' +
    '<li><b>Nudge:</b> tap NUDGE at the bottom to bump the table. Bump too often and you get a warning, then TILT: the flippers go dead and you lose that ball and its bonus.</li>' +
    '<li><b>Magnet:</b> tables with a Magna-Save have a MAGNET button. Hold it as the ball heads for that outlane: the magnet catches it, and letting go throws it back.</li>' +
    '<li><b>Keyboard:</b> Left/Right arrows or Z and / for the flippers, Space or Down to pull and launch (and to fire a cannon), Up or N to nudge, A for the magnet, P to pause.</li></ul>' +
    '<h3>On every table</h3><ul>' +
    '<li><b>Ball save:</b> for a few seconds after you launch, a ball that drains comes right back (SHOOT AGAIN flashes).</li>' +
    '<li><b>Bonus:</b> when a ball ends, the display counts up a bonus for what you hit, times the <b>bonus multiplier</b> (2X to 5X).</li>' +
    '<li><b>Extra ball:</b> each table lights it somewhere. Collect it to play the same ball again.</li>' +
    '<li><b>Combos:</b> make big shots (ramps, orbits) one after another, quickly, for combo points.</li>' +
    '<li><b>Skill shot:</b> a soft, well-judged launch scores a skill shot on most tables.</li></ul>' +
    IDS.map(id => TABLES[id].rulesHtml ? '<h3>' + TABLES[id].name + '</h3>' + TABLES[id].rulesHtml : '').join('')
});

// ═══ Setup: table select ═══════════════════════════════════════════════════════
const thumbs = {};
let thumbQ = [], thumbBusy = false;
function queueThumbs(list) {
  thumbQ = list; if (thumbBusy) return; thumbBusy = true;
  const next = () => {
    const job = thumbQ.shift();
    if (!job) { thumbBusy = false; return; }
    const [id, cv] = job;
    if (!cv.isConnected) { next(); return; }
    if (!thumbs[id]) {
      const r = getRenderer(); if (!r) { thumbBusy = false; return; }
      const c = document.createElement('canvas'); c.width = 280; c.height = 300;
      try { renderThumb(TABLES[id], r, c); thumbs[id] = c; } catch (e) { console.error(e); thumbs[id] = null; }
    }
    if (thumbs[id]) cv.getContext('2d').drawImage(thumbs[id], 0, 0);
    setTimeout(next, 30);
  };
  setTimeout(next, 120);
}
function showSetup() {
  leaveGame();
  let sel = selTable();
  app.className = 'stage pb-setup';
  try { const k = 'gn_setup_pinball', sv = JSON.parse(lsGet(k, '{}')) || {}; sv.options = Object.assign({}, sv.options, { view: viewMode() }); lsSet(k, JSON.stringify(sv)); } catch (e) {}
  const s = Kit.setup(app, {
    intro: 'Six real 3D tables, each with its own toys and tricks.',
    options: [{ id: 'balls', label: 'Balls per game', choices: [['3', '3 balls', 'A standard game.'], ['5', '5 balls', 'A longer game.']], value: '3' },
      { id: 'amb', label: 'Music & ambience', choices: [['on', 'On', 'A quiet music bed for each table and its voice. Kept well under the game sounds.'], ['off', 'Off', 'Just the ball, the flippers and the machine.']], value: 'on' },
      { id: 'view', label: 'View', choices: [['first', 'First person', 'Angled, like standing at the machine.'], ['top', 'Top-down', 'Straight down on the whole playfield.']], value: 'first' }],
    players: { min: 1, max: 1, count: 1, label: 'Player' },
    start: 'Play',
    onStart(cfg) {
      lsSet(SELK, sel);
      if (location.hash) try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      ambPref = cfg.options.amb !== 'off'; ballsPref = +(cfg.options.balls || 3);
      lsSet('pinball_view', cfg.options.view === 'top' ? 'top' : 'first');
      startGame(sel, ballsPref, cfg.players[0] ? cfg.players[0].name : 'Player');
    }
  });
  const startBtn = s.el.querySelector('.btn-primary.btn-lg');
  const grid = el('div', { class: 'pb-tables' }), cards = [], jobs = [];
  const label = () => { if (startBtn) startBtn.textContent = 'Play ' + TABLES[sel].name; };
  IDS.forEach(id => {
    const bd = TABLES[id], best = ArcadeHi.best('pinball_' + id);
    // a pre-rendered picture of the table (games/pinball/tools/thumbs.js makes them); the live offscreen render
    // is only the fallback when the image is missing
    const cv = el('img', { class: 'th', width: 280, height: 300, alt: '', decoding: 'async', src: 'pinball/thumbs/' + id + '.webp' });
    cv.addEventListener('error', () => { const c = el('canvas', { class: 'th', width: 280, height: 300 }); cv.replaceWith(c); if (thumbs[id]) c.getContext('2d').drawImage(thumbs[id], 0, 0); else if (!NOTHUMBS) queueThumbs(thumbQ.concat([[id, c]])); }, { once: true });
    const dots = el('span', { class: 'df', 'aria-label': 'Difficulty ' + (bd.diff || 2) + ' of 4' }, [el('span', { text: 'Level' })]);
    for (let i = 1; i <= 4; i++) dots.appendChild(el('i', { class: i <= (bd.diff || 2) ? 'on' : '' }));
    const card = el('button', { type: 'button', class: 'pb-card' + (id === sel ? ' on' : ''), style: { '--c': bd.color || '#ffc83d' }, 'aria-label': bd.name + '. ' + (bd.desc || '') }, [
      cv, el('span', { class: 'ck', html: Kit.icon('check') }),
      el('span', { class: 'inf' }, [el('span', { class: 'nm', text: bd.name }), el('span', { class: 'ds', text: bd.desc || '' }),
        el('span', { class: 'mt' }, [dots, el('span', { class: 'bs' + (best ? '' : ' none'), text: best ? 'Best ' + fmt(best) : 'Not played' })])])
    ]);
    card.addEventListener('click', () => { sel = id; cards.forEach((c, j) => c.classList.toggle('on', IDS[j] === id)); Kit.sfx('tap'); Kit.haptic('light'); label(); });
    cards.push(card); grid.appendChild(card);
  });
  const hero = s.el.querySelector('.setup-hero');
  const box = el('div', null, [el('div', { class: 'pb-head' }, [el('div', { class: 'label', text: 'Choose a table' }), el('small', { text: IDS.length + ' tables' })]), grid]);
  hero.parentNode.insertBefore(box, hero.nextSibling);
  label();
  window.scrollTo(0, 0);
}

// ═══ Play view ═══════════════════════════════════════════════════════════════

function releasePull(o) {
  const P = plunger; if (!G) return;
  const from = P.d > 0 ? P.d : 0;
  G.pullEnd(o);
  if (o.tap) P.snap = { t0: performance.now(), from: P.travel * 0.3, dip: true };
  else if (from > 0.5) P.snap = { t0: performance.now(), from };
  if (P.snap && !o.cancel) G.haptic(o.tap ? 'light' : from / P.travel > 0.6 ? 'heavy' : 'medium');
  plungerAnim();
}
function bindPlunger() {
  const P = plunger, b = P.grab;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    if (!G || G.paused || P.drag || view !== 'game') return;
    audio().ctx(); try { b.setPointerCapture(e.pointerId); } catch (er) {}
    const live = G.pullStart('drag');
    P.drag = { id: e.pointerId, y0: e.clientY - Math.max(0, P.d), t0: performance.now(), max: 0, live, full: false };
    P.snap = null; P.el.classList.add('held'); G.haptic('light');
    plungerAnim();
  });
  b.addEventListener('pointermove', e => {
    const dr = P.drag; if (!dr || e.pointerId !== dr.id) return;
    const dy = e.clientY - dr.y0; dr.max = Math.max(dr.max, Math.abs(dy));
    P.d = Math.max(0, Math.min(P.travel, dy));
    const pull = P.d / P.travel; if (G && dr.live) G.pullDrag = pull;
    if (pull > 0.995 && !dr.full) { dr.full = true; if (G) G.haptic('medium'); } else if (pull < 0.9) dr.full = false;
  });
  const end = e => {
    const dr = P.drag; if (!dr || e.pointerId !== dr.id) return;
    P.drag = null; P.el.classList.remove('held');
    const tap = performance.now() - dr.t0 < 260 && dr.max < 7;
    if (G && dr.live && G.pulling) releasePull(tap ? { tap: true } : {});
    else { if (P.d > 0.5) P.snap = { t0: performance.now(), from: P.d }; plungerAnim(); }   // not live (bonus count, tilt): just springs back
  };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, end));
}
function leaveGame() {
  view = 'none';
  if (uiRaf) { clearTimeout(uiRaf); uiRaf = 0; }
  if (plunger.raf) { cancelAnimationFrame(plunger.raf); plunger.raf = 0; }
  plunger.el = null; plunger.drag = null; plunger.snap = null; plunger.d = 0;
  btnHeld.L = btnHeld.R = false;
  if (G) { G.destroy(); G = null; }
  if (viewEl) viewEl.querySelectorAll('.pb-load').forEach(e => e.remove());
  root.classList.remove('pb-on');
  if (ro) { ro.disconnect(); ro = null; }
  resetInput();
}

// ═══ Input ═══════════════════════════════════════════════════════════════════
const ptr = {};
const keys = { L: false, R: false };
function resetInput() {
  for (const k in ptr) delete ptr[k]; keys.L = keys.R = false; btnHeld.L = btnHeld.R = false;
  if (viewEl) viewEl.querySelectorAll('.pb-arc.on, .pb-flip.under').forEach(b => b.classList.remove('on', 'under'));
  const P = plunger; if (P.drag || P.d) { P.drag = null; P.snap = null; P.d = 0; if (P.el) { P.el.classList.remove('held'); drawPlunger(); } }
}
function syncFlips() {
  if (!G) return;
  let L = keys.L || btnHeld.L, R = keys.R || btnHeld.R;
  for (const id in ptr) { if (ptr[id].role === 'L') L = true; if (ptr[id].role === 'R') R = true; }
  G.setFlip('L', L); G.setFlip('R', R);
}
// Touching the table: the left/right halves are the flippers. The buttons and the plunger knob handle their own
// pointers and never reach here.
app.addEventListener('pointerdown', e => {
  if (view !== 'game' || !G || G.paused) return;
  if (e.target.closest && e.target.closest('.pb-pause, .pb-ctl, .pb-arc, .pb-plunger')) return;
  e.preventDefault();
  audio().ctx();
  ptr[e.pointerId] = { role: e.clientX < window.innerWidth / 2 ? 'L' : 'R' };
  try { app.setPointerCapture(e.pointerId); } catch (er) {}
  syncFlips();
});
function up(e) {
  const p = ptr[e.pointerId]; if (!p) return;
  delete ptr[e.pointerId];
  syncFlips();
}
app.addEventListener('pointerup', up);
app.addEventListener('pointercancel', up);
app.addEventListener('touchstart', e => { if (view === 'game' && !(e.target.closest && e.target.closest('.pb-pause'))) e.preventDefault(); }, { passive: false });
app.addEventListener('contextmenu', e => { if (view === 'game') e.preventDefault(); });
function overlayOpen() { return !!document.querySelector('.k-scrim, .k-win, .ahi-overlay'); }
document.addEventListener('keydown', e => {
  if (view !== 'game' || !G || overlayOpen()) return;
  const k = e.key;
  if (k === 'p' || k === 'P' || k === 'Escape') { e.preventDefault(); if (G.paused) resumeGame(); else pauseGame(); return; }
  if (G.paused) return;
  audio().ctx();
  if (k === 'ArrowLeft' || k === 'z' || k === 'Z' || e.code === 'ShiftLeft') { e.preventDefault(); keys.L = true; }
  else if (k === 'ArrowRight' || k === '/' || e.code === 'ShiftRight') { e.preventDefault(); keys.R = true; }
  else if (k === ' ' || k === 'ArrowDown' || k === 'Enter') { e.preventDefault(); if (!e.repeat) { if (G.pullStart('time')) plungerAnim(); else G.fire(); } }
  else if (k === 'ArrowUp' || k === 'n' || k === 'N') { e.preventDefault(); if (!e.repeat) G.nudge(); }
  else if (k === 'a' || k === 'A' || e.code === 'ControlLeft') { e.preventDefault(); if (!e.repeat) G.setMagna(true); }
  else return;
  syncFlips();
});
document.addEventListener('keyup', e => {
  if (view !== 'game' || !G) return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'z' || k === 'Z' || e.code === 'ShiftLeft') keys.L = false;
  else if (k === 'ArrowRight' || k === '/' || e.code === 'ShiftRight') keys.R = false;
  else if (k === ' ' || k === 'ArrowDown' || k === 'Enter') releasePull({});
  else if (k === 'a' || k === 'A' || e.code === 'ControlLeft') G.setMagna(false);
  syncFlips();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); else tickUI(); });
document.addEventListener('kit:orient', function (e) { if (!e.detail.ok) pauseGame(); });   // phone turned the wrong way: pause behind the cover
window.addEventListener('blur', () => pauseGame());

function pauseGame() {
  if (view !== 'game' || !G || G.paused || G.state === 'over') return;
  resetInput(); syncFlips();
  G.pause();
  pauseEl.innerHTML = '';
  pauseEl.appendChild(el('div', { class: 'card' }, [
    el('h2', { text: 'Paused' }), el('p', { text: G.def.name + ' · ball ' + Math.min(G.ballNo, G.balls0) + ' · ' + fmt(G.score) }),
    el('button', { type: 'button', class: 'btn btn-primary btn-block', text: 'Resume', onclick: resumeGame }),
    el('button', { type: 'button', class: 'btn btn-ghost btn-block', text: 'Choose table', onclick: () => showSetup() })
  ]));
  pauseEl.classList.add('show');
}
function resumeGame() {
  if (!G || !G.paused) return;
  pauseEl.classList.remove('show');
  Kit.sfx('tap'); G.resume(); tickUI();
}

// ═══ Game over: history record, high scores, results ═══════════════════════════
function finish(g0) {
  const bd = g0.def, key = 'pinball_' + bd.id, sc = g0.score, st = g0.st;
  const hiL = ArcadeHi.list(key);
  const bb = g0.ballScores.length ? Math.max.apply(null, g0.ballScores) : sc;
  const f = {};
  // every table counts its own toys (G.cnt); keep them all, apart from the ones recorded above as their own fields
  const own = { jp: 1, mb: 1, eb: 1, rp: 1, cb: 1, sk: 1 };
  Object.keys(st).forEach(k => { if (!own[k] && typeof st[k] === 'number' && st[k] > 0 && /^[a-z_]{1,12}$/.test(k)) f[k] = Math.round(st[k]); });
  const detail = {
    b: bd.id, bl: g0.balls0, bs: g0.ballScores.join(','), dr: g0.drains.join(''), bb,
    jp: st.jp || 0, mb: st.mb || 0, eb: st.eb || 0, bx: g0.bxMax, rp: st.rp || 0, cb: st.cb || 0, sk: st.sk || 0, f,
    hr: sc > 0 && (hiL.length < ArcadeHi.max || sc > hiL[hiL.length - 1].score) ? hiL.filter(x => x.score >= sc).length + 1 : 0,
    hb: hiL.length ? hiL[0].score : 0
  };
  const hl = [];
  hl.push(bd.name + ': ' + fmt(sc) + ' over ' + g0.balls0 + ' balls' + (st.eb ? ' plus ' + st.eb + (st.eb === 1 ? ' extra ball' : ' extra balls') : ''));
  if (bb) hl.push('Best ball: ' + fmt(bb));
  if (st.mb) hl.push(st.mb === 1 ? 'Started multiball' : 'Started multiball ' + st.mb + ' times');
  if (st.jp) hl.push(st.jp + (st.jp === 1 ? ' jackpot' : ' jackpots'));
  if (g0.bxMax > 1) hl.push('Bonus multiplier up to ' + g0.bxMax + 'X');
  if (st.cb) hl.push(st.cb + (st.cb === 1 ? ' combo' : ' combos'));
  if (st.sk) hl.push(st.sk === 1 ? 'Made the skill shot' : st.sk + ' skill shots');
  if (st.wiz) hl.push('Reached ' + (bd.wizard || 'the wizard mode'));
  if (st.tilt) hl.push('Tilted ' + (st.tilt === 1 ? 'once' : st.tilt + ' times'));
  Kit.record(KEY, {
    detail, started: g0.started, mode: bd.name,
    players: [{ name: g0.who, score: sc }], winner: null,
    rounds: g0.ballScores.length > 1 ? { labels: g0.ballScores.map((s, i) => 'Ball ' + (i + 1)), scores: g0.ballScores.map(s => [s]) } : null,
    highlights: hl.slice(0, 7), summary: bd.name + ' · ' + fmt(sc), badge: bd.short,
    meta: { board: bd.id, boardName: bd.name, score: sc, balls: g0.balls0 }
  });
  const wasBest = sc > 0 && (!hiL.length || sc > hiL[0].score);
  const who = g0.who, balls = g0.balls0, id = bd.id;
  ArcadeHi.check(key, sc, () => {
    Kit.win({
      icon: wasBest ? 'trophy' : 'flag', quiet: !wasBest,
      title: wasBest ? 'New best!' : 'Game over',
      sub: fmt(sc) + ' points on ' + bd.name,
      notes: [g0.ballScores.length ? 'Balls: ' + g0.ballScores.map(fmt).join(' · ') : null, st.jp ? st.jp + (st.jp === 1 ? ' jackpot' : ' jackpots') : null].filter(Boolean), notesTitle: 'Your game',
      again: () => startGame(id, balls, who), againLabel: 'Play again',
      extra: [{ label: 'Choose table', onClick: showSetup }, { label: 'High scores', onClick: () => ArcadeHi.show(key, 'Pinball: ' + bd.name) }]
    });
  });
}

// ═══ Test hooks (used by automated checks) ═══════════════════════════════════
window.__pin = {
  tables: TABLES, ids: IDS,
  start(id, balls) { ambPref = false; startGame(id || 'haunted', balls || 3, 'Tester'); },
  ready() { return !!G && view === 'game'; },
  get() { return G ? G.snapshot() : null; },
  game() { return G; },
  flip(side, on) { keys[side] = !!on; syncFlips(); },
  launch(p) { if (G) G.launch(p == null ? 0.8 : p); },
  nudge() { if (G) G.nudge(); },
  speed(k) { if (G) G.speed(k); },
  auto(on, skill) { if (G) G.autopilot(on, skill); },
  pause() { pauseGame(); }, resume() { resumeGame(); },
  sim(sec, skill) { return G ? G.sim(sec, skill) : null; },
  run(sec) { return G ? G.run(sec) : null; },
  place(x, y, vx, vy, lvl) { if (G) G.place(x, y, vx, vy, lvl); },
  set(k, v) { if (G) G.b[k] = v; },
  comp(id) { return G && G.comps[id]; },
  trigger(id, ...a) { const c = G && G.comps[id]; if (c && c.trigger) { c.trigger(...a); return true; } return false; },
  mode(name) { const m = G && G.def.rules && G.def.rules.modes && G.def.rules.modes[name]; if (m) { m(G); return true; } return false; },
  render() { if (G) G.renderOnce(); },
  renderer() { return getRenderer(); },
  ui(ms) { const P = plunger; plungerStep(ms != null && P.snap ? P.snap.t0 + ms : performance.now()); },   // draw the plunger now (ms: that far into a snap)
  plunger() { const P = plunger; return P.el ? { x: P.x, hTop: P.hTop, rod0: P.rod0, travel: P.travel, limit: P.limit, d: P.d, W: P.W, H: P.H, s: P.s, grab: P.grab.getBoundingClientRect().toJSON(), show: P.el.classList.contains('show') } : null; },
  view(m, animate) { if (m) setViewMode(m); return G ? G.view() : viewMode(); },
  // deterministic frames for screenshots: stop the live loop, step the game, draw once
  freeze() { if (G) G.pause(); },
  step(sec) { if (!G) return null; G.run(sec); G.renderOnce(); return G.snapshot(); },
  headless(id, balls) { const g = createGame(TABLES[id || 'haunted'], { headless: true, balls: balls || 3 }); g.start(); return g; },
  audio() { const a = audio(); return { ac: a.ac && a.ac.state, ready: a.ready, bufs: Object.keys(a.bufs).length, music: a.music.src ? { id: a.music.id, gain: +a.music.g.gain.value.toFixed(4) } : null, roll: !!a.roll }; }
};

showSetup();
</script>

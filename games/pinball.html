<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinball</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<style>
@font-face{font-family:"Bungee";src:url("../fonts/bungee.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Cinzel";src:url("../fonts/cinzel-700.woff2") format("woff2");font-weight:700;font-display:swap;}
/* ── Table select (inside the kit setup screen) ─────────────────────────── */
.pb-setup .setup-hero{padding-top:4px;}
.pb-setup .setup-hero .k-hero-ic .gicon{width:76px;height:76px;}
.pb-setup .setup > .btn-primary.btn-lg{position:sticky;bottom:calc(var(--safe-b) + 10px);z-index:5;box-shadow:0 6px 0 var(--b-lip),0 14px 30px rgba(0,0,0,.55);}
.pb-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.pb-head .label{margin:0;}
.pb-head small{font-weight:800;color:var(--text-3);font-size:.8rem;}
.pb-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
@media (min-width:600px){.pb-tables{grid-template-columns:repeat(3,minmax(0,1fr));}}
.pb-card{position:relative;display:flex;flex-direction:column;border:0;padding:0;border-radius:16px;overflow:hidden;background:#0b0a16;color:#fff;text-align:left;
  box-shadow:0 0 0 2px rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.38);transition:transform .15s var(--spring),box-shadow .15s;}
.pb-card:active{transform:scale(.97);}
.pb-card canvas{display:block;width:100%;height:auto;aspect-ratio:400/430;background:#000;}
.pb-card .inf{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1;}
.pb-card .nm{font-family:var(--display);font-weight:400;font-size:1.18rem;line-height:1.05;}
.pb-card .ds{font-size:.74rem;line-height:1.25;color:rgba(255,255,255,.72);font-weight:700;flex:1;}
.pb-card .mt{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;font-size:.7rem;font-weight:900;letter-spacing:.04em;}
.pb-card .df{display:inline-flex;gap:3px;align-items:center;color:rgba(255,255,255,.6);}
.pb-card .df i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);}
.pb-card .df i.on{background:var(--c,#ffc83d);}
.pb-card .bs{color:#ffd27a;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pb-card .bs.none{color:rgba(255,255,255,.45);}
.pb-card.on{box-shadow:0 0 0 3px var(--c,var(--accent)),0 10px 22px rgba(0,0,0,.45);}
.pb-card .ck{position:absolute;right:7px;top:7px;width:24px;height:24px;border-radius:50%;display:none;place-items:center;background:var(--c,var(--accent));color:#08060f;}
.pb-card.on .ck{display:grid;}
.pb-card .ck .ico{width:15px;height:15px;stroke-width:3.2;}

/* ── Play view: the cabinet fills the screen, no page scroll ─────────────── */
html.pb-on,html.pb-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.pb-on body{display:flex;flex-direction:column;background:radial-gradient(80% 60% at 50% 10%,#1d1838 0%,#07060d 70%);}
html.pb-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 0 calc(var(--safe-b) + 4px);display:flex;align-items:center;justify-content:center;
  position:relative;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.pb-cab{position:relative;flex:none;}
.pb-cab canvas{display:block;touch-action:none;}
.pb-pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4;background:rgba(6,4,14,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
.pb-pause.show{display:flex;}
.pb-pause .card{width:min(270px,82%);text-align:center;padding:22px 18px 16px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.pb-pause h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 4px;}
.pb-pause p{color:var(--text-2);margin:0 0 14px;font-weight:700;}
.pb-pause .btn{margin-top:8px;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), root = document.documentElement;
  var KEY = 'pinball', PI = Math.PI, TAU = PI * 2;

  // ═══ Geometry (logical units) ═════════════════════════════════════════════
  // The table is 400×800. Above it sits the dot-matrix display band (DH tall).
  var TW = 400, TH = 800, DH = 92, CW = TW, CH = TH + DH;
  var BR = 10;                          // ball radius
  var DT = 1 / 480;                     // fixed physics step
  var GRAV = 1300;                      // gravity down the slope
  var VMAX = 2500;                      // speed cap: at 1/480 s a ball moves at most ~5 units, half its radius
  var FLIP_UP = 27, FLIP_DN = 15;       // flipper angular speeds (rad/s)
  var DOTW = 160, DOTH = 32;            // DMD resolution

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

    return function () {

      var comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);

    flipUp: function () { if (!rl('fu', 0.03)) return; noise(0, 0.05, 0.2, 'bandpass', 1400, 1.1); osc('sine', 130, 0, 0.08, 0.26, { to: 55 }); osc('square', 320, 0, 0.025, 0.035, { lp: 1400 }); },
    flipDn: function () { if (!rl('fd', 0.03)) return; noise(0, 0.03, 0.07, 'bandpass', 700, 1); osc('sine', 90, 0, 0.05, 0.09, { to: 55 }); },
    pop: function () { if (!rl('pop', 0.035)) return; osc('sine', 200, 0, 0.15, 0.34, { to: 70 }); noise(0, 0.045, 0.22, 'highpass', 2600, 0.7); osc('triangle', 900, 0, 0.05, 0.05, { to: 450 }); },
    sling: function () { if (!rl('sl', 0.05)) return; noise(0, 0.05, 0.26, 'bandpass', 1700, 1.4); osc('sine', 150, 0, 0.09, 0.22, { to: 80 }); },
    rubber: function (v) { if (!rl('rb', 0.06)) return; osc('sine', 250 + Math.random() * 90, 0, 0.05, clamp(v / 3200, 0.02, 0.09)); },
    wall: function (v) { if (!rl('wl', 0.05)) return; noise(0, 0.035, clamp(v / 6000, 0.02, 0.11), 'bandpass', 2400, 2); },
    target: function () { if (!rl('tg', 0.04)) return; osc('square', 1250, 0, 0.05, 0.05, { lp: 3000 }); osc('triangle', 620, 0, 0.09, 0.08); noise(0, 0.03, 0.12, 'bandpass', 3000, 2); },
    drop: function () { if (!rl('dr', 0.04)) return; noise(0, 0.09, 0.26, 'lowpass', 520, 0.8); osc('sine', 130, 0, 0.13, 0.22, { to: 60 }); },
    lane: function () { if (!rl('ln', 0.05)) return; osc('triangle', mtof(84), 0, 0.12, 0.08); osc('triangle', mtof(88), 0.06, 0.16, 0.07); },
    spin: function () { if (!rl('sp', 0.03)) return; osc('square', 2300, 0, 0.015, 0.03, { lp: 5000 }); },
    ramp: function () { osc('sawtooth', 150, 0, 0.55, 0.05, { to: 620, lp: 1300 }); noise(0, 0.5, 0.05, 'bandpass', 900, 0.8); },
    rampDone: function () { [72, 76, 79, 84].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.06, 0.18, 0.08); }); },
    saucer: function () { osc('sine', 95, 0, 0.2, 0.3, { to: 45 }); noise(0, 0.06, 0.2, 'lowpass', 600, 0.7); },
    eject: function () { noise(0, 0.07, 0.3, 'bandpass', 1200, 1); osc('sine', 120, 0, 0.12, 0.26, { to: 70 }); },
    pull: function () { osc('sawtooth', 75, 0, 0.3, 0.025, { to: 48, lp: 600 }); },
    launch: function (p) { noise(0, 0.12, 0.12 + 0.2 * p, 'bandpass', 900, 0.9); osc('sine', 170, 0, 0.16, 0.25, { to: 60 }); },
    jackpot: function () { [60, 64, 67, 72, 76, 79, 84].forEach(function (m, i) { osc('square', mtof(m), i * 0.07, 0.2, 0.04, { lp: 3000 }); osc('triangle', mtof(m), i * 0.07, 0.26, 0.06); }); osc('triangle', mtof(84), 0.5, 0.9, 0.1); noise(0.5, 0.9, 0.1, 'highpass', 5000, 0.5); },
    multi: function () { for (var i = 0; i < 4; i++) { osc('sawtooth', 440, i * 0.32, 0.16, 0.045, { to: 880, lp: 2400 }); osc('sawtooth', 880, i * 0.32 + 0.16, 0.16, 0.045, { to: 440, lp: 2400 }); } },
    extra: function () { [67, 72, 76, 79, 84, 88].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.09, 0.3, 0.09); }); },
    drain: function () { [55, 52, 48, 43].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.14, 0.26, 0.08); }); osc('sine', 80, 0, 0.6, 0.14, { to: 40 }); },
    tilt: function () { osc('sawtooth', 110, 0, 0.6, 0.1, { lp: 900 }); osc('sawtooth', 117, 0, 0.6, 0.1, { lp: 900 }); },
    warn: function () { osc('square', 660, 0, 0.1, 0.05, { lp: 2000 }); osc('square', 660, 0.16, 0.1, 0.05, { lp: 2000 }); },
    bonus: function (i) { osc('square', mtof(60 + (i % 13)), 0, 0.07, 0.04, { lp: 2500 }); },
    magnet: function () { osc('sine', 55, 0, 1.2, 0.18); osc('sawtooth', 110, 0, 1.2, 0.025, { lp: 420 }); },
    ghost: function () { osc('sine', 380, 0, 0.6, 0.08, { to: 900 }); osc('sine', 620, 0.05, 0.6, 0.05, { to: 300 }); },
    wheel: function () { if (!rl('wh', 0.05)) return; osc('square', 1800, 0, 0.02, 0.03, { lp: 4000 }); },
    skill: function () { [79, 83, 86, 91].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.05, 0.26, 0.09); }); },
    combo: function (n) { osc('triangle', mtof(72 + n * 2), 0, 0.15, 0.1); osc('triangle', mtof(79 + n * 2), 0.08, 0.22, 0.1); },
    save: function () { osc('triangle', mtof(76), 0, 0.15, 0.08); osc('triangle', mtof(81), 0.1, 0.26, 0.08); },
    lock: function () { osc('sine', 220, 0, 0.3, 0.2, { to: 110 }); [64, 67, 71].forEach(function (m, i) { osc('triangle', mtof(m), 0.1 + i * 0.08, 0.2, 0.07); }); },
    award: function () { [72, 79, 84].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.07, 0.22, 0.08); }); },
    start: function () { [60, 67, 72, 76, 79].forEach(function (m, i) { osc('square', mtof(m), i * 0.08, 0.14, 0.035, { lp: 2600 }); }); }
  };
  function snd(name, a) { try { if (ac()) SND[name](a); } catch (e) {} }

  // ═══ Dot-matrix display ═══════════════════════════════════════════════════
  // A 160×32 display. Content is drawn in white on a little canvas, read back
  // and quantised to four orange brightness levels, then blown up under a mask
  // of round dots. Small text uses a hand-made 5×7 font; big text uses canvas
  // text, whose soft edges become the dimmer shades a real DMD has.

    '0': [14, 17, 19, 21, 25, 17, 14], '1': [4, 12, 4, 4, 4, 4, 14], '2': [14, 17, 1, 2, 4, 8, 31], '3': [31, 2, 4, 2, 1, 17, 14],
    '4': [2, 6, 10, 18, 31, 2, 2], '5': [31, 16, 30, 1, 1, 17, 14], '6': [6, 8, 16, 30, 17, 17, 14], '7': [31, 1, 2, 4, 8, 8, 8],
    '8': [14, 17, 17, 14, 17, 17, 14], '9': [14, 17, 17, 15, 1, 2, 12],
    A: [14, 17, 17, 31, 17, 17, 17], B: [30, 17, 17, 30, 17, 17, 30], C: [14, 17, 16, 16, 16, 17, 14], D: [28, 18, 17, 17, 17, 18, 28],
    E: [31, 16, 16, 30, 16, 16, 31], F: [31, 16, 16, 30, 16, 16, 16], G: [14, 17, 16, 23, 17, 17, 15], H: [17, 17, 17, 31, 17, 17, 17],
    I: [14, 4, 4, 4, 4, 4, 14], J: [7, 2, 2, 2, 2, 18, 12], K: [17, 18, 20, 24, 20, 18, 17], L: [16, 16, 16, 16, 16, 16, 31],
    M: [17, 27, 21, 21, 17, 17, 17], N: [17, 17, 25, 21, 19, 17, 17], O: [14, 17, 17, 17, 17, 17, 14], P: [30, 17, 17, 30, 16, 16, 16],
    Q: [14, 17, 17, 17, 21, 18, 13], R: [30, 17, 17, 30, 20, 18, 17], S: [15, 16, 16, 14, 1, 1, 30], T: [31, 4, 4, 4, 4, 4, 4],
    U: [17, 17, 17, 17, 17, 17, 14], V: [17, 17, 17, 17, 17, 10, 4], W: [17, 17, 17, 21, 21, 21, 10], X: [17, 17, 10, 4, 10, 17, 17],
    Y: [17, 17, 17, 10, 4, 4, 4], Z: [31, 1, 2, 4, 8, 16, 31],
    '.': [0, 0, 0, 0, 0, 0, 4], ',': [0, 0, 0, 0, 0, 4, 8], '!': [4, 4, 4, 4, 4, 0, 4], '?': [14, 17, 1, 2, 4, 0, 4],
    '-': [0, 0, 0, 31, 0, 0, 0], ':': [0, 0, 4, 0, 0, 4, 0], "'": [4, 4, 8, 0, 0, 0, 0], '+': [0, 4, 4, 31, 4, 4, 0], '/': [1, 1, 2, 4, 8, 16, 16],
    x: [0, 0, 17, 10, 4, 10, 17], '<': [2, 4, 8, 16, 8, 4, 2], '>': [8, 4, 2, 1, 2, 4, 8], '=': [0, 0, 31, 0, 31, 0, 0], '%': [24, 25, 2, 4, 8, 19, 3]

  var F5W = {};   // [offset, width] per glyph: letters and digits are 5 wide, punctuation is trimmed

  }
  var DMDFONT = '"Arial Narrow","Helvetica Neue",Arial,sans-serif';

  // ═══ Table builder ════════════════════════════════════════════════════════
  // A table is made of segments (walls, targets), circles (posts, bumpers),
  // flippers, sensors (rollovers, gates), saucers/scoops, ramps (the ball
  // leaves the playfield and follows a path), spinners, a captive ball, a
  // magnet, moving toys and lamps (inserts).
  function ellPts(cx, cy, rx, ry, a0, a1, n) {

  function bezPts(p0, p1, p2, p3, n) {
    var p = [];
    for (var i = 0; i <= n; i++) {
      var t = i / n, u = 1 - t;
      p.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);

  function smooth(pts, n) {

    var bb = G.ballScores.length ? Math.max.apply(null, G.ballScores) : sc;
    var f = {}; ['pop', 'sl', 'su', 'dt', 'bank', 'orb', 'spin', 'lanes', 'in', 'out', 'lock', 'wheel', 'ghost', 'crypt', 'mag', 'boo', 'star', 'neon', 'mode', 'save', 'warn', 'tilt', 'award'].forEach(function (k) { if (st[k]) f[k] = st[k]; });
    var detail = {
      b: bd.id, bl: G.balls0, bs: G.ballScores.join(','), dr: G.drains.join(''), bb: bb,
      jp: st.jp || 0, mb: st.mb || 0, eb: st.eb || 0, bx: G.bxMax, rp: st.rp || 0, cb: st.cb || 0, sk: st.sk || 0, f: f,
      hr: sc > 0 && (hiL.length < ArcadeHi.max || sc > hiL[hiL.length - 1].score) ? hiL.filter(function (x) { return x.score >= sc; }).length + 1 : 0,
      hb: hiL.length ? hiL[0].score : 0
    };
    var hl = [];
    hl.push(bd.name + ': ' + fmt(sc) + ' over ' + G.balls0 + ' balls' + (st.eb ? ' plus ' + st.eb + (st.eb === 1 ? ' extra ball' : ' extra balls') : ''));
    if (bb) hl.push('Best ball: ' + fmt(bb));
    if (st.mb) hl.push(st.mb === 1 ? 'Started multiball' : 'Started multiball ' + st.mb + ' times');
    if (st.jp) hl.push(st.jp + (st.jp === 1 ? ' jackpot' : ' jackpots'));
    if (G.bxMax > 1) hl.push('Bonus multiplier up to ' + G.bxMax + 'X');
    if (st.cb) hl.push(st.cb + (st.cb === 1 ? ' combo' : ' combos'));
    if (st.sk) hl.push(st.sk === 1 ? 'Made the skill shot' : st.sk + ' skill shots');
    if (st.tilt) hl.push('Tilted ' + (st.tilt === 1 ? 'once' : st.tilt + ' times'));
    Kit.record(KEY, {
      detail: detail, started: G.started, mode: bd.name,
      players: [{ name: G.who, score: sc }], winner: null,
      rounds: G.ballScores.length > 1 ? { labels: G.ballScores.map(function (s, i) { return 'Ball ' + (i + 1); }), scores: G.ballScores.map(function (s) { return [s]; }) } : null,
      highlights: hl.slice(0, 7),
      summary: bd.name + ' · ' + fmt(sc),
      badge: bd.short,
      meta: { board: bd.id, boardName: bd.name, score: sc, balls: G.balls0 }
    });
    var wasBest = sc > 0 && (!hiL.length || sc > hiL[0].score);
    var who = G.who, balls = G.balls0, id = bd.id;
    ArcadeHi.check(key, sc, function () {
      Kit.win({
        icon: wasBest ? 'trophy' : 'flag', quiet: !wasBest,
        title: wasBest ? 'New best!' : 'Game over',
        sub: fmt(sc) + ' points on ' + bd.name,
        notes: [G && G.ballScores.length ? 'Balls: ' + g0.ballScores.map(fmt).join(' · ') : null, st.jp ? st.jp + (st.jp === 1 ? ' jackpot' : ' jackpots') : null].filter(Boolean), notesTitle: 'Your game',
        again: function () { newGame(id, balls, who); }, againLabel: 'Play again',
        extra: [{ label: 'Choose table', onClick: showSetup }, { label: 'High scores', onClick: function () { ArcadeHi.show(key, 'Pinball: ' + bd.name); } }]
      });
    });
  }
  function gameOver() {
    G.state = 'over'; G.overT = 0; G.balls = [];
    msg('GAME OVER', '', { now: true, dur: 9 });
    snd('drain');
  }

  // ═══ Test hooks (used by automated checks) ═══════════════════════════════
  window.__pin = {
    start: function (id, balls) { newGame(id || 'nebula', balls || 3, 'Tester'); },
    get: function () {
      if (!G) return null;
      var fm = frameMs.slice().sort(function (a, b) { return a - b; });
      return { board: G.id, state: G.state, score: G.score, ballNo: G.ballNo, balls0: G.balls0, waitPlunge: G.waitPlunge, time: G.time, mb: G.mb, bx: G.bx, extra: G.extra, tilted: G.tilted,
        balls: G.balls.map(function (b) { return { x: b.x, y: b.y, vx: b.vx, vy: b.vy, ramp: !!b.ramp, held: !!b.held, plunger: b.plunger, still: b.stillT }; }),
        st: G.st, stats: G.stats, b: JSON.parse(JSON.stringify(G.b)), ballScores: G.ballScores.slice(), drains: G.drains.slice(), finished: !!G.finished, paused: paused,
        frame: fm.length ? { avg: fm.reduce(function (a, b) { return a + b; }, 0) / fm.length, p95: fm[Math.floor(fm.length * 0.95)], max: fm[fm.length - 1], n: fm.length } : null, S: S };
    },
    flip: function (side, on) { if (side === 'L') input.kL = !!on; else input.kR = !!on; syncFlips(); },
    launch: function (p) { launch(p == null ? 0.8 : p); },
    nudge: function () { nudge(); },
    speed: function (k) { speedMul = k; },
    auto: function (on, skill) { auto = !!on; autoSkill = skill == null ? 1 : skill; },
    debug: function (on) { dbg = !!on; layers = layers; },
    pause: function () { pauseGame(); }, resume: function () { resumeGame(); },
    // run game time without drawing (autopilot on); stops early at game over
    sim: function (sec, skill) {
      var was = auto; auto = true; if (skill != null) autoSkill = skill; var n = Math.round(sec / DT), fr = 0;
      for (var i = 0; i < n && G && G.state !== 'over'; i++) {
        autopilot(DT); syncFlips(); step(DT);
        if (++fr >= 8) { update(DT * 8); updateFx(DT * 8); fr = 0; }
      }
      auto = was; return this.get();
    },
    run: function (sec) { var n = Math.round(sec / DT), fr = 0; for (var i = 0; i < n && G && G.state !== 'over'; i++) { syncFlips(); step(DT); if (++fr >= 8) { update(DT * 8); fr = 0; } } return this.get(); },
    finishNow: function () { if (G && G.state === 'over') { G.overT = 9; update(0.01); } },
    place: function (x, y, vx, vy) { var b = G.balls[0]; if (!b) b = addBall(x, y, 0, 0); b.plunger = false; b.held = null; b.ramp = null; b.x = x; b.y = y; b.vx = vx || 0; b.vy = vy || 0; G.waitPlunge = false; if (G.state === 'serve') G.state = 'play'; },
    set: function (k, v) { G.b[k] = v; },
    game: function () { return G; }, table: function () { return T; }
  };

  // ═══ Boot ════════════════════════════════════════════════════════════════
  showSetup();
})();
</script>

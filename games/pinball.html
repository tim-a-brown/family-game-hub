<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinball</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>

<style>
@font-face{font-family:"Bungee";src:url("../fonts/bungee.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Cinzel";src:url("../fonts/cinzel-700.woff2") format("woff2");font-weight:700;font-display:swap;}
/* ── Table select (inside the kit setup screen) ─────────────────────────── */
.pb-setup .setup-hero{padding-top:4px;}
.pb-setup .setup-hero .k-hero-ic .gicon{width:76px;height:76px;}
.pb-setup .setup > .btn-primary.btn-lg{position:sticky;bottom:calc(var(--safe-b) + 10px);z-index:5;box-shadow:0 6px 0 var(--b-lip),0 14px 30px rgba(0,0,0,.55);}
.pb-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.pb-head .label{margin:0;}
.pb-head small{font-weight:800;color:var(--text-3);font-size:.8rem;}
.pb-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
@media (min-width:600px){.pb-tables{grid-template-columns:repeat(3,minmax(0,1fr));}}
.pb-card{position:relative;display:flex;flex-direction:column;border:0;padding:0;border-radius:16px;overflow:hidden;background:#0b0a16;color:#fff;text-align:left;
  box-shadow:0 0 0 2px rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.38);transition:transform .15s var(--spring),box-shadow .15s;}
.pb-card:active{transform:scale(.97);}
.pb-card canvas{display:block;width:100%;height:auto;aspect-ratio:400/430;background:#000;}
.pb-card .inf{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1;}
.pb-card .nm{font-family:var(--display);font-weight:400;font-size:1.18rem;line-height:1.05;}
.pb-card .ds{font-size:.74rem;line-height:1.25;color:rgba(255,255,255,.72);font-weight:700;flex:1;}
.pb-card .mt{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;font-size:.7rem;font-weight:900;letter-spacing:.04em;}
.pb-card .df{display:inline-flex;gap:3px;align-items:center;color:rgba(255,255,255,.6);}
.pb-card .df i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);}
.pb-card .df i.on{background:var(--c,#ffc83d);}
.pb-card .bs{color:#ffd27a;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pb-card .bs.none{color:rgba(255,255,255,.45);}
.pb-card.on{box-shadow:0 0 0 3px var(--c,var(--accent)),0 10px 22px rgba(0,0,0,.45);}
.pb-card .ck{position:absolute;right:7px;top:7px;width:24px;height:24px;border-radius:50%;display:none;place-items:center;background:var(--c,var(--accent));color:#08060f;}
.pb-card.on .ck{display:grid;}
.pb-card .ck .ico{width:15px;height:15px;stroke-width:3.2;}

/* ── Play view: the cabinet fills the screen, no page scroll ─────────────── */
html.pb-on,html.pb-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.pb-on body{display:flex;flex-direction:column;background:radial-gradient(80% 60% at 50% 10%,#1d1838 0%,#07060d 70%);}
html.pb-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 0 calc(var(--safe-b) + 4px);display:flex;align-items:center;justify-content:center;
  position:relative;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.pb-cab{position:relative;flex:none;}
.pb-cab canvas{display:block;touch-action:none;}
.pb-pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4;background:rgba(6,4,14,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
.pb-pause.show{display:flex;}
.pb-pause .card{width:min(270px,82%);text-align:center;padding:22px 18px 16px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.pb-pause h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 4px;}
.pb-pause p{color:var(--text-2);margin:0 0 14px;font-weight:700;}
.pb-pause .btn{margin-top:8px;}
</style>
</head>
<body>
<main class="stage" id="app"></main>

  function updFlip(f, dt) {

  // one physics step
  function step(dt) {

      for (i = 0; i < T.circs.length; i++) collideCirc(b, T.circs[i]);

          else if (L.spinner) { var s2 = L.spinner; s2.spin = clamp(Math.max(s2.spin, Math.hypot(b.vx, b.vy) / 55), 0, 32); event('spinstart', s2.id, b, s2); }

        if (inside && !b.sIn[ln.id]) { b.sIn[ln.id] = 1; event('lane', ln.id, b, ln); }
        else if (!inside && b.sIn[ln.id] && lx * lx + ly * ly > (ln.r + 6) * (ln.r + 6)) b.sIn[ln.id] = 0;

  function stepHeld(b, dt) {
    var h = b.held;

  function release(b) {

  function capture(b, sc) {

  function grab(b, mg) {

  function enterRamp(b, r) {

  // ═══ Game rules shared by every table ═════════════════════════════════════
  var fx = { parts: [], pops: [], rings: [] };
  function R(name) { var f = G && G.board[name]; if (!f) return undefined; return f.apply(null, [G].concat([].slice.call(arguments, 1))); }
  function cnt(k, n) { G.st[k] = (G.st[k] || 0) + (n || 1); G.pb[k] = (G.pb[k] || 0) + (n || 1); }
  function add(pts, x, y, col) {
    if (!G || G.tilted || G.state === 'over') return 0;
    pts = Math.round(pts * G.mult / 10) * 10;
    G.score += pts;
    if (x != null && pts >= 500) pop(x, y, fmt(pts), col);
    return pts;
  }
  function pop(x, y, text, col) { fx.pops.push({ x: x, y: y, text: text, c: col || '#fff', life: 0.9, max: 0.9 }); if (fx.pops.length > 24) fx.pops.shift(); }
  function part(x, y, vx, vy, col, life, size) { if (fx.parts.length < 300) fx.parts.push({ x: x, y: y, vx: vx, vy: vy, c: col, life: life, max: life, s: size || 2 }); }
  function burst(x, y, col, n, sp) { for (var i = 0; i < n; i++) { var a = Math.random() * TAU, v = (sp || 160) * (0.4 + Math.random() * 0.8); part(x, y, Math.cos(a) * v, Math.sin(a) * v, col, 0.3 + Math.random() * 0.35, 1.5 + Math.random() * 1.6); } }
  // DMD messages. o: {dur, style:'flash'|'zoom'|'slide'|'jackpot', now:true replaces what is showing}
  function msg(text, sub, o) {
    o = o || {};
    var m = { text: text, sub: sub || '', t: 0, dur: o.dur || 1.6, style: o.style || 'zoom' };
    if (G.board.creep && (m.style === 'slide' || m.style === 'zoom')) m.style = 'creep';
    if (o.now) { G.dq = [m]; G.dm = null; }
    else { G.dq.push(m); if (G.dq.length > 4) G.dq.splice(0, G.dq.length - 4); }
  }
  function show(kind, dur) { G.show = { kind: kind, t: 0, dur: dur || 1.5 }; }
  function flash(col, a) { G.flashC = col || '#fff'; G.flash = Math.max(G.flash, a || 0.5); }
  function big(text, sub, col) {
    msg(text, sub, { style: 'jackpot', dur: 2.2, now: true }); show('flash', 1.6); flash(col || '#fff', 0.55); G.shake = Math.max(G.shake, 1);
    G.wash = { c: col || '#ffffff', a: 0.75 };
    Kit.haptic('success');
  }
  function bxUp() {
    if (G.bx < 5) { G.bx++; G.bxMax = Math.max(G.bxMax, G.bx); msg('BONUS ' + G.bx + 'X', 'MULTIPLIER', { style: 'slide' }); snd('award'); }
    else { add(50000); msg('BONUS MAX', '50,000', { style: 'slide' }); }
  }
  function lightExtra() {
    if (G.ebLit || G.ebGot >= 2) return;
    G.ebLit = true; msg('EXTRA BALL', 'IS LIT', { style: 'slide' }); snd('award');
  }
  function collectExtra() {
    if (!G.ebLit) return false;
    G.ebLit = false; G.ebGot++; G.extra++; cnt('eb');
    big('EXTRA BALL', 'SHOOT AGAIN', '#ff4058'); snd('extra'); Kit.callout('EXTRA BALL', '#ff6b7a');
    return true;
  }
  function jackpot(val, label) {
    var p = add(val); cnt('jp');
    big(label || 'JACKPOT', fmt(p)); snd('jackpot');
    if (/SUPER/.test(label || '')) { Kit.confetti({ count: 120 }); }
    return p;
  }
  function combo(id) {
    var n = (G.time - G.lastShotT < 4.5 && G.lastShot !== id) ? G.combo + 1 : 1;
    G.combo = n; G.lastShot = id; G.lastShotT = G.time;
    if (n >= 2) { cnt('cb'); var p = add(20000 * (n - 1)); msg(n + '-WAY COMBO', fmt(p), { style: 'slide', now: true }); snd('combo', n); show('chase', 0.8); }
    return n;
  }
  function ballSave(sec) { if (!G.tilted) G.saveT = Math.max(G.saveT, sec); }
  function activeBalls() { return G.balls.length + G.pending; }
  function addBall(x, y, vx, vy) { var b = newBall(x, y, vx, vy); G.balls.push(b); return b; }
  function serve(auto) {
    var b = addBall(376, 773, 0, 0); b.plunger = true;
    if (auto) G.autoT = Math.max(G.autoT, 0.7);
    else { G.waitPlunge = true; G.pull = 0; R('serve'); }
    return b;
  }
  // more balls into play: from = function (i) -> [x, y, vx, vy] or null (plunger)
  function multiball(n, from, label) {
    G.mb = true; cnt('mb');
    big(label || 'MULTIBALL', n + ' BALLS', '#8fe8ff'); snd('multi'); Kit.callout(label || 'MULTIBALL', '#8fe8ff');
    ballSave(12);
    var need = n - activeBalls();
    for (var i = 0; i < need; i++) (function (i) {
      G.pending++;
      later(0.6 + i * 0.7, function () {

        var p = from ? from(i) : null;

      });
    })(i);
  }
  function lockBall(b) {

  function later(t, fn) { G.later.push({ t: t, fn: fn }); }

  function event(type, id, b, o) {

  // ── Ball flow ──

      '<h3>Controls</h3><ul>' +

      '<li><b>Launch:</b> while the ball waits in the lane on the right, touch the right half and pull down. The further (or longer) you pull, the harder it goes. Let go to launch.</li>' +

      '<h3>On every table</h3><ul>' +
      '<li><b>Ball save:</b> for a few seconds after you launch, a ball that drains comes right back (SHOOT AGAIN flashes).</li>' +
      '<li><b>Bonus:</b> when a ball ends, the display counts up a bonus for what you hit with that ball, times the <b>bonus multiplier</b> (2X to 5X lights above the flippers).</li>' +
      '<li><b>Extra ball:</b> each table lights it somewhere. Collect it to play the same ball again.</li>' +
      '<li><b>Combos:</b> make big shots (ramps, orbits) one after another, quickly, for combo points.</li>' +
      '<li>Pop bumpers, slingshots, inlanes and outlanes all score. The display at the top shows your score, the ball, and what to shoot next.</li></ul>' +
      '<h3>Nebula Run</h3><p>The first lock starts lit; after that, hit all four <b>S-T-A-R</b> targets to light it again. Shoot the <b>wormhole</b> to lock a ball. The third lock starts <b>3-ball multiball</b> (watch for warp speed): the wormhole is the jackpot, and after two jackpots an orbit scores the <b>super jackpot</b>. The clear <b>hyper tube</b> ramp climbs over the planets and drops you at the right flipper; every second tube lights the lock, every third starts <b>Black Hole</b>: a moving singularity bends the ball toward it, and falling in scores an <b>event horizon</b> jackpot. The spinning <b>turntable</b> in the middle flings the ball sideways.</p>' +
      '<h3>Pirate&rsquo;s Cove</h3><p>Knock down the <b>G-O-L-D</b> drop targets to light the ship lock, then make the raised <b>ship ramp</b> to lock a ball on the ship. Lock again for <b>Broadside</b> 2-ball multiball with jackpots on the ramp. Ramps light the <b>treasure chest</b>: shoot it to spin the <b>treasure wheel</b>. Two sea-lane orbits load the <b>cannon</b>: shoot the ball into it, watch the barrel swing, and flip to fire. Hit something straight away for a <b>direct hit</b>. Every third G-O-L-D (or the wheel) brings a <b>Storm</b>: rain, lightning, a swell that sways the ball, and double scores.</p>' +
      '<h3>Haunted Manor</h3><p>The <b>ghost</b> drifts across the middle: hit it three times to capture it. Capture three ghosts for <b>Midnight</b>, when every ghost hit is a jackpot. The twisted iron <b>spirit walk</b> ramp climbs over the graveyard to your left flipper and weakens the ghost. Knock the captive ball in the <b>crypt</b> to raise your bonus and light the extra ball. Spell <b>B-O-O</b> to light the <b>magnet</b>, which grabs the ball and throws it back with a surprise. <b>Knock</b> on the bookcase three times and it swings open: shoot the <b>secret passage</b> behind it for <b>Lights Out</b>. The table goes dark except a glow round your ball and the flippers, lightning shows the way, and everything scores 2X. Each time, the bookcase takes a few more knocks.</p>' +
      '<h3>Jungle Temple</h3><p>Two raised ramps: the wire <b>vine ramp</b> (left) feeds the <b>upper flipper</b>, the <b>temple ramp</b> (right) feeds your right flipper. Shoot them back to back for combos. A <b>stone gate</b> blocks the <b>idol</b>: clear <b>J-A-D-E</b> and the gate sinks. Shoot the idol to start <b>Temple Run</b>: 30 seconds where every ramp is a jackpot, a golden idol rises in the middle for <b>idol strikes</b>, and the vines creep in as time runs out.</p>' +
      '<h3>Neon Nights</h3><p>Roll through the four lanes at the top to spell <b>N-E-O-N</b>. The flippers move the lit lanes (<b>lane change</b>). The glowing <b>neon loop</b> ramp arcs over the bumpers to your left flipper and lights the next letter. Each N-E-O-N raises the bonus multiplier; three of them light <b>Overdrive</b> 2-ball multiball at the centre scoop. Every second loop lights <b>Synthwave</b> at the centre: the table pulses to the beat and anything you hit on the beat scores extra. The <b>kickback</b> in the left outlane saves one drain per ball (loops relight it). Drop all three targets to light the <b>spinner</b>. <b>Skill shot:</b> when you launch, one lane flashes. Land in it for 50,000.</p>'

    g.fillStyle = bz; g.beginPath(); g.roundRect ? g.roundRect(14, 5, CW - 28, 80, 7) : g.rect(14, 5, CW - 28, 80); g.fill();
    g.fillStyle = '#050302'; g.fillRect(19, 9, CW - 38, 72);
  }
  function render(t) {
    if (!ctx || !G) return;
    if (!layers) buildLayers();
    var g = ctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(layers.band, 0, 0);
    // DMD
    dmdInit(); dmdScene(t); dmdQuantise();
    g.setTransform(S, 0, 0, S, 0, 0);
    g.imageSmoothingEnabled = false; g.drawImage(dmd.o, 20, 10, 360, 72); g.imageSmoothingEnabled = true;
    g.setTransform(1, 0, 0, 1, 0, 0);
    var mx = Math.round(20 * S), my = Math.round(10 * S), mw = Math.round(380 * S) - mx, mh = Math.round(82 * S) - my;
    g.drawImage(dmdMask(mw, mh), mx, my);
    // table
    g.setTransform(S, 0, 0, S, 0, DH * S);
    g.save(); g.beginPath(); g.rect(0, 0, TW, TH); g.clip();
    if (G.shake > 0.01) g.translate((Math.random() - 0.5) * G.shake * 5, (Math.random() - 0.5) * G.shake * 5);
    g.drawImage(layers.bg, 0, 0, TW, TH);
    drawDynamic(g, t);
    drawBalls(g, false);
    if (T.ramps.length) g.drawImage(layers.shade, 0, 0, TW, TH);
    g.drawImage(layers.top, 0, 0, TW, TH);
    if (G.board.drawTop) G.board.drawTop(g, G, t);
    drawRampLights(g, t);
    drawBalls(g, true);
    drawFx(g);
    if (G.board.drawOver) G.board.drawOver(g, G, t);
    if (G.waitPlunge) drawLaunchHint(g, t);
    if (dbg) drawDebug(g);
    if (G.flash > 0) { g.globalAlpha = G.flash * 0.3; g.fillStyle = G.flashC; g.fillRect(0, 0, TW, TH); g.globalAlpha = 1; }
    if (G.tilted) { g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, TW, TH); }
    g.restore();
  }
  function drawLaunchHint(g, t) {
    var a = 0.45 + 0.35 * Math.sin(t * 5), y = 690 + (t * 30 % 30);
    g.save(); g.globalAlpha = a; g.strokeStyle = '#fff'; g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(366, y - 8); g.lineTo(376, y); g.lineTo(386, y - 8); g.moveTo(366, y - 20); g.lineTo(376, y - 12); g.lineTo(386, y - 20); g.stroke();
    g.restore();
    if (G.pull > 0) { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(364, 640, 24, 40); g.fillStyle = G.pull > 0.85 ? '#ff4058' : '#ffd45a'; g.fillRect(366, 678 - G.pull * 36, 20, G.pull * 36); }
  }
  var dbg = false;
  function drawDebug(g) {
    g.strokeStyle = 'rgba(255,0,0,.8)'; g.lineWidth = 1;
    T.segs.forEach(function (s) { if (!s.on) return; g.lineWidth = s.t * 2; g.globalAlpha = 0.4; g.beginPath(); g.moveTo(s.x1, s.y1); g.lineTo(s.x2, s.y2); g.stroke(); });
    g.globalAlpha = 0.5; T.circs.forEach(function (c) { if (!c.on) return; g.beginPath(); g.arc(c.x, c.y, c.r, 0, TAU); g.stroke(); });
    g.strokeStyle = 'rgba(0,255,0,.8)'; g.lineWidth = 1; T.lines.forEach(function (l) { g.beginPath(); g.moveTo(l.x1, l.y1); g.lineTo(l.x2, l.y2); g.stroke(); });
    g.strokeStyle = 'rgba(0,200,255,.8)'; T.lanes.concat(T.saucers).forEach(function (l) { g.beginPath(); g.arc(l.x, l.y, l.r || l.cr, 0, TAU); g.stroke(); });
    g.globalAlpha = 1;
  }

  // ═══ Input ════════════════════════════════════════════════════════════════
  var input = { L: false, R: false, kL: false, kR: false, ptr: {}, aL: 0, aR: 0 };
  function resetInput() { input.kL = input.kR = false; input.ptr = {}; input.aL = input.aR = 0; input.L = input.R = false; if (G) { G.pulling = false; } }
  function syncFlips() {
    if (!G) return;
    var pl = input.kL || input.aL > 0, pr = input.kR || input.aR > 0;
    for (var id in input.ptr) { if (input.ptr[id].role === 'L') pl = true; if (input.ptr[id].role === 'R') pr = true; }
    var live = (G.state === 'play' || G.state === 'serve') && !G.tilted;
    ['L', 'R'].forEach(function (side) {
      var want = side === 'L' ? pl : pr, was = input[side];
      input[side] = want;
      if (want !== was) {
        if (live) {
          if (want) { snd('flipUp'); Kit.haptic('light'); R('flip', side); } else snd('flipDn');
        }
      }
    });
    T.flips.forEach(function (f) { f.pressed = live && input[f.key]; });
  }
  function onDown(e) {
    if (view !== 'game' || !G) return;
    if (e.target.closest && e.target.closest('.pb-pause')) return;
    e.preventDefault();
    if (paused) return;
    ac();
    var r = canvas.getBoundingClientRect(), tx = (e.clientX - r.left) / r.width * CW, ty = (e.clientY - r.top) / r.height * CH - DH;
    var role;
    if (Math.hypot(tx - 184, ty - 781) < 27) { role = 'N'; nudge(); }
    else {
      role = e.clientX < window.innerWidth / 2 ? 'L' : 'R';
      if (role === 'R' && G.waitPlunge) { role = 'P'; G.pulling = true; G.pullT0 = G.time; G.pullDrag = 0; G.pull = 0; snd('pull'); }
    }
    input.ptr[e.pointerId] = { role: role, y0: e.clientY, h: r.height };
    try { app.setPointerCapture(e.pointerId); } catch (er) {}
    syncFlips();
  }
  function onMove(e) {
    var p = input.ptr[e.pointerId]; if (!p || p.role !== 'P' || !G) return;
    G.pullDrag = clamp((e.clientY - p.y0) / (p.h * 0.16), 0, 1);
  }
  function onUp(e) {
    var p = input.ptr[e.pointerId]; if (!p) return;
    delete input.ptr[e.pointerId];
    if (p.role === 'P' && G && G.pulling) { G.pulling = false; launch(G.pull); }
    syncFlips();
  }
  app.addEventListener('pointerdown', onDown);
  app.addEventListener('pointermove', onMove);
  app.addEventListener('pointerup', onUp);
  app.addEventListener('pointercancel', onUp);
  app.addEventListener('touchstart', function (e) { if (view === 'game' && !(e.target.closest && e.target.closest('.pb-pause'))) e.preventDefault(); }, { passive: false });
  app.addEventListener('contextmenu', function (e) { if (view === 'game') e.preventDefault(); });
  function overlayOpen() { return !!document.querySelector('.k-scrim, .k-win, .ahi-overlay'); }
  document.addEventListener('keydown', function (e) {
    if (view !== 'game' || !G || overlayOpen()) return;
    var k = e.key;
    if (k === 'p' || k === 'P' || k === 'Escape') { e.preventDefault(); if (paused) resumeGame(); else pauseGame(); return; }
    if (paused) return;
    if (k === 'ArrowLeft' || k === 'z' || k === 'Z' || e.code === 'ShiftLeft') { e.preventDefault(); input.kL = true; }
    else if (k === 'ArrowRight' || k === '/' || e.code === 'ShiftRight') { e.preventDefault(); input.kR = true; }
    else if (k === ' ' || k === 'ArrowDown' || k === 'Enter') { e.preventDefault(); if (!e.repeat && G.waitPlunge && !G.pulling) { ac(); G.pulling = true; G.pullT0 = G.time; G.pullDrag = 0; G.pull = 0; snd('pull'); } }
    else if (k === 'ArrowUp' || k === 'n' || k === 'N') { e.preventDefault(); if (!e.repeat) nudge(); }
    else return;
    ac(); syncFlips();
  });
  document.addEventListener('keyup', function (e) {
    if (view !== 'game' || !G) return;
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'z' || k === 'Z' || e.code === 'ShiftLeft') input.kL = false;
    else if (k === 'ArrowRight' || k === '/' || e.code === 'ShiftRight') input.kR = false;
    else if (k === ' ' || k === 'ArrowDown' || k === 'Enter') { if (G.pulling) { G.pulling = false; launch(G.pull); } }
    syncFlips();
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });
  window.addEventListener('blur', function () { pauseGame(); });

  function pauseGame() {
    if (view !== 'game' || paused || !G || G.state === 'over') return;
    rollStop();
    paused = true; resetInput(); syncFlips();
    if (AC && AC.state === 'running') try { AC.suspend(); } catch (e) {}
    pauseEl.innerHTML = '';
    pauseEl.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: 'Paused' }), el('p', { text: G.board.name + ' · ball ' + Math.min(G.ballNo, G.balls0) + ' · ' + fmt(G.score) }),
      el('button', { type: 'button', class: 'btn btn-primary btn-block', text: 'Resume', onclick: resumeGame }),
      el('button', { type: 'button', class: 'btn btn-ghost btn-block', text: 'Choose table', onclick: function () { showSetup(); } })
    ]));
    pauseEl.classList.add('show');
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    render(G.time);
  }
  function resumeGame() {
    if (!paused) return;
    paused = false; pauseEl.classList.remove('show');
    if (AC && AC.state === 'suspended') try { AC.resume(); } catch (e) {}
    Kit.sfx('tap'); kick();
  }

  // ═══ Rolling sound ═══════════════════════════════════════════════════════
  // A steel ball rolling on wood: a low filtered rumble whose level and pitch
  // follow its speed. On a wire ramp it rattles and rings; on a plastic ramp
  // it sounds hollow.
  var roll = null;
  function rollStop() { if (!roll) return; try { roll.g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.05); roll.g2.gain.setTargetAtTime(0.0001, AC.currentTime, 0.05); roll.s.stop(AC.currentTime + 0.3); roll.s2.stop(AC.currentTime + 0.3); } catch (e) {} roll = null; }
  function rollTick() {
    if (!AC || !soundOn() || paused || !G || AC.state !== 'running') return;
    if (!roll) {
      if (!noiseBuf) noise(0, 0.01, 0.0001);
      if (!noiseBuf) return;
      var mk = function (type, f, q) { var s = AC.createBufferSource(), bf = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; s.loop = true; bf.type = type; bf.frequency.value = f; bf.Q.value = q; g.gain.value = 0.0001; s.connect(bf); bf.connect(g); g.connect(master); s.start(0, Math.random()); return [s, bf, g]; };
      var a = mk('bandpass', 150, 1.4), b = mk('bandpass', 2600, 10);
      roll = { s: a[0], f: a[1], g: a[2], s2: b[0], f2: b[1], g2: b[2] };
    }
    var v = 0, rv = 0, rs = '';
    G.balls.forEach(function (b) {
      if (b.plunger || b.held) return;
      var sp = Math.hypot(b.vx, b.vy);
      if (b.ramp) { if (sp > rv) { rv = sp; rs = b.ramp.r.style; } } else if (sp > v) v = sp;
    });
    var now = AC.currentTime, k = Math.min(1, v / 1400);
    roll.g.gain.setTargetAtTime(0.0002 + 0.05 * k * k, now, 0.04); roll.f.frequency.setTargetAtTime(90 + v * 0.16, now, 0.05);
    var wire = rs === 'wire' || rs === 'iron', rk = Math.min(1, rv / 900);
    roll.f2.frequency.setTargetAtTime(wire ? 2500 + rv * 0.6 : 620 + rv * 0.25, now, 0.05); roll.f2.Q.setTargetAtTime(wire ? 14 : 3, now, 0.05);
    roll.g2.gain.setTargetAtTime(rv ? 0.0002 + (wire ? 0.035 : 0.045) * rk * (wire ? 0.7 + 0.3 * Math.random() : 1) : 0.0001, now, 0.03);
  }

  // ═══ Main loop ════════════════════════════════════════════════════════════
  var raf = 0, last = 0, acc = 0, speedMul = 1, frameMs = [], auto = false, autoT = 0, autoSkill = 1;
  function kick() { if (!raf && view === 'game' && !paused && G) { last = 0; raf = requestAnimationFrame(frame); } }
  function autopilot(dt) {
    if (!auto || !G) return;
    input.aL -= dt; input.aR -= dt;
    if (G.waitPlunge) { autoT += dt; if (autoT > 0.4) { autoT = 0; launch(0.35 + Math.random() * 0.65); } return; }
    T.flips.forEach(function (f) {
      var side = f.key, k = side === 'L' ? 'aL' : 'aR';
      if (input[k] > -0.22) return;   // still up, or just let go
      G.balls.forEach(function (b) {
        if (b.held || b.ramp || b.plunger) return;
        var c = Math.cos(f.aRest), s = Math.sin(f.aRest), dx = b.x - f.x, dy = b.y - f.y, t = clamp(dx * c + dy * s, 0, f.len);
        var d = Math.hypot(dx - c * t, dy - s * t);
        if (d < 30 && b.vy > -150 && dy < 40 && t > f.len * 0.15) {
          if ((b.autoSkip || 0) > G.time) return;
          if (Math.random() > autoSkill) { b.autoSkip = G.time + 0.7; return; }
          input[k] = 0.12 + Math.random() * 0.06;
        }
      });
    });
  }
  function frame(now) {
    raf = 0;
    if (view !== 'game' || !G || paused) return;
    if (document.querySelector('.k-scrim')) { pauseGame(); return; }
    var t0 = performance.now();
    var rdt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60; last = now;
    var dt = rdt * speedMul;
    if (G.state !== 'over') {
      acc += dt;
      var n = 0, maxN = Math.ceil(0.05 * speedMul / DT) + 2;
      while (acc >= DT && n < maxN) { if (auto) { autopilot(DT); } syncFlips(); step(DT); acc -= DT; n++; }
      if (n >= maxN) acc = 0;
    }
    update(dt); updateFx(dt);
    if (!G) return;
    rollTick();
    render(G.time);
    var ms = performance.now() - t0; frameMs.push(ms); if (frameMs.length > 240) frameMs.shift();
    if (G.finished) return;
    raf = requestAnimationFrame(frame);
  }

  // ═══ Game over: history record, high scores, results ══════════════════════
  function finish() {
    if (G.finished) return;
    G.finished = true;
    var g0 = G, bd = G.board, key = 'pinball_' + bd.id, sc = G.score, st = G.st;
    var hiL = ArcadeHi.list(key);
    var bb = G.ballScores.length ? Math.max.apply(null, G.ballScores) : sc;
    var f = {}; ['pop', 'sl', 'su', 'dt', 'bank', 'orb', 'spin', 'lanes', 'in', 'out', 'lock', 'wheel', 'ghost', 'crypt', 'mag', 'boo', 'star', 'neon', 'mode', 'save', 'warn', 'tilt', 'award', 'dark', 'bh', 'storm', 'cannon', 'direct', 'idol', 'beat', 'kick', 'loop'].forEach(function (k) { if (st[k]) f[k] = st[k]; });
    var detail = {
      b: bd.id, bl: G.balls0, bs: G.ballScores.join(','), dr: G.drains.join(''), bb: bb,
      jp: st.jp || 0, mb: st.mb || 0, eb: st.eb || 0, bx: G.bxMax, rp: st.rp || 0, cb: st.cb || 0, sk: st.sk || 0, f: f,
      hr: sc > 0 && (hiL.length < ArcadeHi.max || sc > hiL[hiL.length - 1].score) ? hiL.filter(function (x) { return x.score >= sc; }).length + 1 : 0,
      hb: hiL.length ? hiL[0].score : 0
    };
    var hl = [];
    hl.push(bd.name + ': ' + fmt(sc) + ' over ' + G.balls0 + ' balls' + (st.eb ? ' plus ' + st.eb + (st.eb === 1 ? ' extra ball' : ' extra balls') : ''));
    if (bb) hl.push('Best ball: ' + fmt(bb));
    if (st.mb) hl.push(st.mb === 1 ? 'Started multiball' : 'Started multiball ' + st.mb + ' times');
    if (st.jp) hl.push(st.jp + (st.jp === 1 ? ' jackpot' : ' jackpots'));
    if (G.bxMax > 1) hl.push('Bonus multiplier up to ' + G.bxMax + 'X');
    if (st.cb) hl.push(st.cb + (st.cb === 1 ? ' combo' : ' combos'));
    if (st.sk) hl.push(st.sk === 1 ? 'Made the skill shot' : st.sk + ' skill shots');
    if (st.tilt) hl.push('Tilted ' + (st.tilt === 1 ? 'once' : st.tilt + ' times'));
    Kit.record(KEY, {
      detail: detail, started: G.started, mode: bd.name,
      players: [{ name: G.who, score: sc }], winner: null,
      rounds: G.ballScores.length > 1 ? { labels: G.ballScores.map(function (s, i) { return 'Ball ' + (i + 1); }), scores: G.ballScores.map(function (s) { return [s]; }) } : null,
      highlights: hl.slice(0, 7),
      summary: bd.name + ' · ' + fmt(sc),
      badge: bd.short,
      meta: { board: bd.id, boardName: bd.name, score: sc, balls: G.balls0 }
    });
    var wasBest = sc > 0 && (!hiL.length || sc > hiL[0].score);
    var who = G.who, balls = G.balls0, id = bd.id;
    ArcadeHi.check(key, sc, function () {
      Kit.win({
        icon: wasBest ? 'trophy' : 'flag', quiet: !wasBest,
        title: wasBest ? 'New best!' : 'Game over',
        sub: fmt(sc) + ' points on ' + bd.name,
        notes: [G && G.ballScores.length ? 'Balls: ' + g0.ballScores.map(fmt).join(' · ') : null, st.jp ? st.jp + (st.jp === 1 ? ' jackpot' : ' jackpots') : null].filter(Boolean), notesTitle: 'Your game',
        again: function () { newGame(id, balls, who); }, againLabel: 'Play again',
        extra: [{ label: 'Choose table', onClick: showSetup }, { label: 'High scores', onClick: function () { ArcadeHi.show(key, 'Pinball: ' + bd.name); } }]
      });
    });
  }
  function gameOver() {
    ambStop(); rollStop();
    G.state = 'over'; G.overT = 0; G.balls = [];
    msg('GAME OVER', '', { now: true, dur: 9 });
    snd('drain');
  }

  // ═══ Test hooks (used by automated checks) ═══════════════════════════════
  window.__pin = {
    start: function (id, balls) { newGame(id || 'nebula', balls || 3, 'Tester'); },
    get: function () {
      if (!G) return null;
      var fm = frameMs.slice().sort(function (a, b) { return a - b; });
      return { board: G.id, state: G.state, score: G.score, ballNo: G.ballNo, balls0: G.balls0, waitPlunge: G.waitPlunge, time: G.time, mb: G.mb, bx: G.bx, extra: G.extra, tilted: G.tilted,
        balls: G.balls.map(function (b) { return { x: b.x, y: b.y, vx: b.vx, vy: b.vy, ramp: !!b.ramp, held: !!b.held, plunger: b.plunger, still: b.stillT }; }),
        st: G.st, stats: G.stats, b: JSON.parse(JSON.stringify(G.b)), ballScores: G.ballScores.slice(), drains: G.drains.slice(), finished: !!G.finished, paused: paused,
        frame: fm.length ? { avg: fm.reduce(function (a, b) { return a + b; }, 0) / fm.length, p95: fm[Math.floor(fm.length * 0.95)], max: fm[fm.length - 1], n: fm.length } : null, S: S };
    },
    flip: function (side, on) { if (side === 'L') input.kL = !!on; else input.kR = !!on; syncFlips(); },
    launch: function (p) { launch(p == null ? 0.8 : p); },
    nudge: function () { nudge(); },
    speed: function (k) { speedMul = k; },
    auto: function (on, skill) { auto = !!on; autoSkill = skill == null ? 1 : skill; },
    debug: function (on) { dbg = !!on; layers = layers; },
    pause: function () { pauseGame(); }, resume: function () { resumeGame(); },
    // run game time without drawing (autopilot on); stops early at game over
    sim: function (sec, skill) {
      var was = auto; auto = true; if (skill != null) autoSkill = skill; var n = Math.round(sec / DT), fr = 0;
      for (var i = 0; i < n && G && G.state !== 'over'; i++) {
        autopilot(DT); syncFlips(); step(DT);
        if (++fr >= 8) { update(DT * 8); updateFx(DT * 8); fr = 0; }
      }
      auto = was; return this.get();
    },
    run: function (sec) { var n = Math.round(sec / DT), fr = 0; for (var i = 0; i < n && G && G.state !== 'over'; i++) { syncFlips(); step(DT); if (++fr >= 8) { update(DT * 8); fr = 0; } } return this.get(); },
    finishNow: function () { if (G && G.state === 'over') { G.overT = 9; update(0.01); } },
    place: function (x, y, vx, vy) { var b = G.balls[0]; if (!b) b = addBall(x, y, 0, 0); b.plunger = false; b.held = null; b.ramp = null; b.tr = null; b.x = x; b.y = y; b.vx = vx || 0; b.vy = vy || 0; G.waitPlunge = false; if (G.state === 'serve') G.state = 'play'; },
    set: function (k, v) { G.b[k] = v; },
    mode: function (name) { var m = G.board.modes && G.board.modes[name]; if (m) { m(G); return true; } return false; },
    game: function () { return G; }, table: function () { return T; }
  };

  // ═══ Boot ════════════════════════════════════════════════════════════════
  showSetup();
})();
</script>

<style>
/* ── Play view: one screen, no page scroll ─────────────────────────────── */
:root{--ct-glow:#4fd2ff;--ct-rgb:79,210,255;--btn:#ff3d7f;--btn-d:#a3124a;--btn-rgb:255,61,127;}
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 46% at 50% 0%, rgba(var(--ct-rgb),.15) 0%, rgba(var(--ct-rgb),0) 70%),var(--bg);transition:background .8s;}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 8px calc(var(--safe-b) + 6px);display:flex;justify-content:center;}
.ct-view{flex:1;min-height:0;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:8px;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.ct-view[hidden]{display:none;}
/* HUD plates: dark LED readouts */
.ct-hud{flex:none;display:flex;align-items:stretch;gap:6px;width:100%;}
.ct-plate{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 8px;border-radius:14px;
  background:linear-gradient(180deg,#1d1633,#0d0a1c);box-shadow:inset 0 0 0 1.5px rgba(var(--ct-rgb),.32),inset 0 0 0 3.5px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.4);transition:box-shadow .6s;}
.ct-plate[hidden]{display:none;}
.ct-plate small{font-size:.6rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--ct-rgb),.75);white-space:nowrap;}
.ct-plate b{font-family:var(--display);font-weight:400;font-size:1.4rem;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.ct-plate b em{font-style:normal;font-size:.8rem;color:rgba(255,255,255,.45);margin-left:2px;}
.ct-plate.sc{flex:1.4;}
.ct-plate.sc b{color:#ffd84a;text-shadow:0 0 12px rgba(255,200,40,.45);}
.ct-plate.bump b{animation:bounce .45s var(--spring);}
.ct-plate.who b{color:var(--who,#fff);font-size:1.15rem;}
.ct-pbtn{flex:none;width:48px;border:0;border-radius:14px;display:grid;place-items:center;color:#d6f4ff;
  background:linear-gradient(180deg,#1d1633,#0d0a1c);box-shadow:inset 0 0 0 1.5px rgba(var(--ct-rgb),.32),0 6px 14px rgba(0,0,0,.4);}
.ct-pbtn:active{transform:scale(.94);}
.ct-pbtn svg{width:22px;height:22px;}
/* Cabinet + screen */
.ct-cab{position:relative;flex:1 1 0;min-height:0;width:100%;padding:7px;border-radius:22px;}
.ct-scr{position:relative;width:100%;height:100%;border-radius:15px;overflow:hidden;background:#07040f;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.6),0 0 0 2px rgba(var(--ct-rgb),.55),0 0 24px rgba(var(--ct-rgb),.35);transition:box-shadow .8s;}
.ct-scr canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.ct-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;}
.ct-pop{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;font-family:var(--display);font-weight:400;
  color:#fff;font-size:1.5rem;line-height:1;-webkit-text-stroke:1.5px rgba(10,4,24,.7);paint-order:stroke fill;
  text-shadow:0 0 10px var(--c,#4fd2ff),0 0 22px var(--c,#4fd2ff);animation:ct-pop 1.05s cubic-bezier(.2,.8,.3,1) forwards;}
.ct-pop.big{font-size:2.3rem;}
.ct-pop.small{font-size:1.1rem;}
.ct-pop.gold{color:#ffe27a;--c:#ffb21a;}
.ct-pop.jp{font-size:3rem;color:#ffe27a;--c:#ffb21a;animation:ct-jp 2.2s cubic-bezier(.2,.8,.3,1) forwards;}
@keyframes ct-pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}26%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%) scale(.96)}}
@keyframes ct-jp{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1.05)}}
/* Overlays inside the screen */
.ct-ov{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;pointer-events:none;}
.ct-ov[hidden]{display:none;}
.ct-ov button,.ct-ov .ct-card{pointer-events:auto;}
.ct-ov.ready{justify-content:flex-start;padding-top:9%;gap:10px;}
.ct-neon{font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,13vw,4rem);line-height:.92;text-align:center;letter-spacing:.03em;color:#fff;
  text-shadow:0 0 4px #fff,0 0 12px var(--ct-glow),0 0 26px var(--ct-glow),0 0 52px var(--ct-glow);animation:ct-flicker 5s infinite;}
.ct-neon span{display:block;color:#ffe9fb;text-shadow:0 0 4px #fff,0 0 12px #ff4fb4,0 0 26px #ff4fb4,0 0 52px #ff4fb4;}
@keyframes ct-flicker{0%,17%,19%,22%,100%{opacity:1}18%,21%{opacity:.55}}
.ct-chip{font-weight:900;font-size:.95rem;color:#fff;padding:6px 14px;border-radius:999px;background:rgba(10,6,24,.6);box-shadow:inset 0 0 0 1.5px rgba(var(--ct-rgb),.4);text-align:center;}
.ct-chip i{font-style:normal;color:var(--who,#ffd84a);}
.ct-tip{margin-top:auto;font-weight:900;color:#fff;font-size:1rem;padding:7px 16px;border-radius:999px;background:rgba(10,6,24,.6);text-align:center;}
.ct-ov.dim{background:rgba(6,3,16,.5);}
.ct-ov.pausecard{background:rgba(6,3,16,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.ct-ov h2{font-family:var(--display);font-weight:400;font-size:2.5rem;line-height:1;color:#fff;margin:0 0 12px;text-align:center;
  text-shadow:0 0 6px #fff,0 0 18px var(--ct-glow),0 0 36px var(--ct-glow);animation:ct-drop .45s var(--spring) both;}
.ct-ov h2.red{color:#ffd9e4;text-shadow:0 0 6px #fff,0 0 18px #ff3d7f,0 0 36px #ff3d7f;}
.ct-ov h2.gold{color:#fff3c4;text-shadow:0 0 6px #fff,0 0 18px #ffb21a,0 0 36px #ffb21a;}
@keyframes ct-drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.ct-card{width:100%;max-width:300px;border-radius:18px;padding:12px 16px;background:linear-gradient(180deg,rgba(26,18,52,.94),rgba(10,7,24,.96));
  box-shadow:inset 0 0 0 1.5px rgba(var(--ct-rgb),.55),0 0 24px rgba(var(--ct-rgb),.25),0 18px 34px rgba(0,0,0,.45);animation:ct-up .5s var(--spring) .08s both;}
@keyframes ct-up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.ct-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07);}
.ct-row:last-child{border-bottom:0;}
.ct-row span{font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--ct-rgb),.85);}
.ct-row b{font-family:var(--display);font-weight:400;font-size:1.35rem;color:#fff;font-variant-numeric:tabular-nums;}
.ct-row b small{font-family:var(--font, system-ui);font-size:.72rem;font-weight:800;color:rgba(255,255,255,.55);margin-left:4px;}
.ct-row.ct-score b{font-size:2.3rem;line-height:1;color:#ffd84a;text-shadow:0 0 14px rgba(255,190,40,.5);}
.ct-row.me span,.ct-row.me b{color:var(--who,#ffd84a);}
.ct-row .nm{display:flex;align-items:center;gap:8px;font-weight:900;color:#fff;font-size:.95rem;letter-spacing:0;text-transform:none;}
.ct-row .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);}
.ct-new{display:inline-block;margin-right:6px;padding:2px 7px;border-radius:6px;background:#ff3d7f;color:#fff;font-family:system-ui,sans-serif;font-size:.6rem;font-weight:900;letter-spacing:.08em;vertical-align:4px;}
.ct-note{margin-top:6px;font-size:.8rem;font-weight:800;color:rgba(255,255,255,.6);text-align:center;}
.ct-acts{width:100%;max-width:300px;margin-top:12px;display:flex;flex-direction:column;gap:8px;animation:ct-up .5s var(--spring) .2s both;}
.ct-acts .row2{display:flex;gap:8px;}
.ct-acts .row2 .btn{flex:1;min-height:42px;padding:0 10px;font-size:.9rem;}
.ct-acts .btn-soft{background:rgba(14,9,32,.9);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),0 4px 0 rgba(0,0,0,.35);}
.ct-acts .btn-ghost{align-self:center;min-height:40px;padding:0 16px;border-radius:999px;font-size:.88rem;background:rgba(14,9,32,.7);color:#fff;}
.ct-count{font-family:var(--display);font-size:5rem;color:#fff;text-shadow:0 0 8px #fff,0 0 24px var(--ct-glow),0 0 48px var(--ct-glow);animation:pop .45s var(--spring);}
.ct-pausebtn{min-width:200px;}
/* The big arcade button */
.ct-deck{flex:none;display:flex;align-items:center;justify-content:center;padding:2px 0 2px;}
.ct-btn{position:relative;width:96px;height:96px;border:0;padding:0;border-radius:50%;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 50% 42%,#3a3152 0 50%,#1a1428 66%,#0c0916 100%);
  box-shadow:0 0 0 2px #463c63,0 10px 20px rgba(0,0,0,.55),0 0 34px rgba(var(--btn-rgb),.45);transition:box-shadow .3s;}
.ct-btn i{position:absolute;inset:12px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:1.12rem;letter-spacing:.08em;
  color:rgba(255,255,255,.95);text-shadow:0 1px 0 rgba(0,0,0,.3),0 0 10px rgba(255,255,255,.6);
  background:radial-gradient(ellipse 55% 34% at 50% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 100%),radial-gradient(circle at 50% 58%,var(--btn) 0 52%,var(--btn-d) 100%);
  box-shadow:0 7px 0 var(--btn-d),0 9px 10px rgba(0,0,0,.5),inset 0 -5px 10px rgba(0,0,0,.25),0 0 26px rgba(var(--btn-rgb),.8);
  transform:translateY(-5px);transition:transform .05s,box-shadow .05s;}
.ct-btn.down i{transform:translateY(2px);box-shadow:0 0 0 var(--btn-d),0 2px 4px rgba(0,0,0,.4),inset 0 -2px 6px rgba(0,0,0,.25),0 0 46px rgba(var(--btn-rgb),1);}
.ct-btn::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid rgba(var(--btn-rgb),.9);opacity:0;pointer-events:none;}
.ct-btn.pulse::after{animation:ct-ring 1.5s ease-out infinite;}
@keyframes ct-ring{0%{transform:scale(.9);opacity:0}30%{opacity:.85}100%{transform:scale(1.35);opacity:0}}
.ct-hint{flex:none;font-size:.8rem;font-weight:800;color:var(--text-3);text-align:center;}
@media (hover:none),(pointer:coarse){ .ct-hint{display:none;} }
@media (max-height:700px){ .ct-btn{width:80px;height:80px;} .ct-btn i{inset:10px;font-size:.95rem;} .ct-plate b{font-size:1.2rem;} }
@media (min-height:1000px) and (min-width:700px){ .ct-btn{width:116px;height:116px;} .ct-btn i{inset:14px;font-size:1.3rem;} }
.ct-nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--text-2);font-weight:800;}
</style>

<body>
<main class="stage" id="app"></main>
<div class="ct-view" id="view" hidden>
  <div class="ct-hud" id="hud">
    <div class="ct-plate who" id="p-who" hidden><small>Player</small><b id="h-who">–</b></div>
    <div class="ct-plate"><small>Height</small><b id="h-ht">0</b></div>
    <div class="ct-plate sc" id="p-sc"><small>Score</small><b id="h-sc">0</b></div>
    <div class="ct-plate" id="p-best"><small>Best</small><b id="h-best">0</b></div>
    <button class="ct-pbtn" id="btn-pause" type="button" aria-label="Pause"></button>
  </div>
  <div class="ct-cab wood" id="cab">
    <div class="ct-scr" id="scr">
      <canvas id="cv" aria-label="Crazy Tower"></canvas>
      <div class="ct-fx" id="fx"></div>
      <div class="ct-ov" id="ov" hidden></div>
    </div>
  </div>
  <div class="ct-deck"><button class="ct-btn pulse" id="big" type="button" aria-label="Drop the block"><i>DROP</i></button></div>
  <div class="ct-hint">Space, click or the big button to drop · P to pause</div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const root = document.documentElement;
const KEY = 'crazytower', HI = 'crazytower';

// ═══ The tower's rules ══════════════════════════════════════════════════════
// World units: a full block is BASE × BASE across and BH tall. Block n (1, 2, 3...) sits on block n-1;
// the pedestal is block 0 and its top is y = 0.
const BASE = 3, BH = 0.82, HOVER = 1.15, RANGE = 4.3, FLOOR = -3.6, PLINTH = BASE + 1.6;
const JACKPOT = 40, MARKS = [10, 20, 30], JACKPOT_BONUS = 100;
const PERF = 0.14;                 // a drop this close to the block below counts as perfect (snaps on)
const GROW_AT = 3, GROW = 0.3;     // from the 3rd perfect in a row, each perfect widens the block a little
function speedAt(n) { return Math.min(5.4, 2.35 + (n - 1) * 0.078); }   // slide speed for block n (units/s)
function hueAt(n) { return (192 + n * 8.6) % 360; }                       // colour climbs the spectrum
function landY(n) { return (n - 1) * BH + BH / 2; }                         // centre of block n once placed
function hsl(h, s, l) { return 'hsl(' + Math.round(h) + ',' + s + '%,' + l + '%)'; }
function hslRgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  return [f(0), f(8), f(4)];
}
function colorAt(n) { return new THREE.Color().setHSL(hueAt(n) / 360, 0.95, 0.5); }

// ═══ Sound (synthesized) ════════════════════════════════════════════════════
const Snd = (() => {
  let ac = null, master = null, nbuf = null;
  const on = () => { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } };
  function ctx() {
    if (!on()) return null;
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ac = new C(); } catch (e) { return null; } master = ac.createGain(); master.gain.value = .6; master.connect(ac.destination); }
    if (ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  function tone(f, t0, dur, type, vol, f2) {
    const a = ctx(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (t0 || 0);
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .08, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .03);
  }
  function noise(t0, dur, vol, freq, type, q) {
    const a = ctx(); if (!a) return;
    if (!nbuf) { nbuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + (t0 || 0);
    s.buffer = nbuf; f.type = type || 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = q || .8;
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  }
  const PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  return {
    unlock: ctx, out: () => master,
    // a solid thunk that climbs in pitch with the tower
    thunk(n) { const k = Math.pow(2, Math.min(n, 48) / 30); tone(105 * k, 0, .18, 'sine', .34, 46 * k); noise(0, .08, .2, 700 * k, 'lowpass'); tone(260 * k, 0, .06, 'triangle', .05, 180 * k); },
    perfect(s) { const f = 784 * Math.pow(2, PENT[Math.min(s - 1, PENT.length - 1)] / 12); tone(f, 0, .45, 'sine', .13); tone(f * 2, 0, .3, 'triangle', .03); tone(f * 1.5, .07, .4, 'sine', .06); tone(f * 3, .12, .25, 'sine', .02); },
    crack(fr) { noise(0, .1 + fr * .14, .2 + fr * .3, 2400, 'bandpass', 1.4); noise(0, .05, .14, 6000, 'highpass'); tone(380, 0, .14, 'square', .025 + fr * .04, 120); },
    miss() { tone(560, 0, .75, 'triangle', .1, 70); noise(.05, .55, .07, 600, 'lowpass'); },
    crash() { tone(90, 0, .4, 'sine', .3, 38); noise(0, .35, .2, 400, 'lowpass'); },
    mark() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .075, .26, 'square', .042)); tone(2093, .3, .5, 'sine', .07); },
    jackpot() {
      [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * .09, .3, 'square', .05));
      [1047, 1319, 1568, 2093].forEach(f => tone(f, .6, 1.3, 'triangle', .06));
      for (let i = 0; i < 14; i++) tone(i % 2 ? 2637 : 3136, .7 + i * .07, .06, 'square', .02);
      tone(130, .6, .9, 'sawtooth', .05, 260);
    },
    tick() { tone(2300 + Math.random() * 300, 0, .025, 'square', .018); },
    start() { tone(260, 0, .3, 'triangle', .08, 880); tone(520, .1, .25, 'sine', .05, 1320); },
    spawn(n) { tone(1200 + Math.min(n, 40) * 20, 0, .05, 'sine', .015); },
    swoosh() { noise(0, .25, .07, 1800); }
  };
})();

// Original loop for the tower: A minor, a climbing hook over Am F C G
const SONG = {
  eighth: 0.18, leadVol: 0.034, leadLp: 2600, echo: 0.28, bassWave: 'sawtooth', bassLp: 650, bassVol: 0.055, drumVol: 0.8,
  lead: [69, 0, 72, 0, 76, 0, 72, 76,  77, 0, 76, 0, 72, 0, 69, 72,  76, 0, 79, 0, 84, 0, 79, 76,  74, 0, 71, 0, 67, 0, 71, 74,
         81, 0, 81, 79, 76, 0, 72, 0,  77, 0, 77, 76, 72, 0, 69, 0,  79, 0, 79, 81, 84, 0, 83, 0,  86, 0, 83, 0, 79, 0, 0, 0],
  bass: [45, 45, 57, 45, 45, 45, 57, 45,  41, 41, 53, 41, 41, 41, 53, 41,  48, 48, 60, 48, 48, 48, 60, 48,  43, 43, 55, 43, 43, 43, 55, 43],
  drums: 'khshkhsx'
};
const Mus = ArcadeMusic.create({ key: 'crazytower_music', song: SONG, ctx: Snd.unlock, out: Snd.out, tempo: () => 1 + Math.min(Math.max(0, stack.length - 1), JACKPOT) * 0.006 });

// ═══ 3D scene ═══════════════════════════════════════════════════════════════
let renderer = null, scene = null, camera = null, composer = null, bloom = null, glOk = false;
let bgCanvas = null, bgTex = null, bgHue = -1, bgHueT = 192;
let pedestal = null, guide = null, dust = null, sparks = null, rings = [], marks = [], leader = null;
let halfW = 6, halfH = 8, scrW = 1, scrH = 1, dprNow = 1;
const WHITE = new THREE.Color(1, 1, 1);

// Glossy block with glowing LED edges: a standard material plus a few lines of shader that light the
// edges of the box (from its own size) and darken the bottom of each side a touch.
function boxMat(color, edge, emis) {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: .28, metalness: .05, envMapIntensity: .3 });
  mat.emissive.copy(color).multiplyScalar(emis == null ? .22 : emis);
  const u = { uHalf: { value: new THREE.Vector3(1, 1, 1) }, uEdge: { value: edge.clone() }, uFlash: { value: 0 } };
  mat.userData.u = u;
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, mat.userData.u);

    const r = lastRun, left = JACKPOT - r.height;
    cls += ' dim';
    h = '<h2 class="' + (r.jackpot ? 'gold' : 'red') + '">' + (r.jackpot ? 'Jackpot!' : 'Tower down!') + '</h2>' +
      '<div class="ct-card">' +
      '<div class="ct-row"><span>Height</span><b>' + r.height + '<small>blocks</small></b></div>' +
      '<div class="ct-row"><span>Perfect drops</span><b>' + r.perfects + (r.bestStreak > 1 ? '<small>best ' + r.bestStreak + ' in a row</small>' : '') + '</b></div>' +
      '<div class="ct-row ct-score"><span>Score</span><b id="cnt">0</b></div>' +
      '<div class="ct-row"><span>Best</span><b>' + (r.isBest ? '<span class="ct-new">NEW</span>' : '') + Math.max(hiBest(), r.score) + '</b></div>' +
      '<div class="ct-note">' + (r.jackpot ? 'You topped the tower!' : left === 1 ? '1 more block to the jackpot' : left + ' more blocks to the jackpot') + '</div></div>' +
      '<div class="ct-acts"><button class="btn btn-primary btn-lg" type="button" id="ov-again">Build again</button>' +
      '<div class="row2"><button class="btn btn-soft" type="button" id="ov-hi">' + Kit.icon('trophy') + 'Scores</button><button class="btn btn-soft" type="button" id="ov-past">' + Kit.icon('history') + 'Past games</button></div>' +
      '<button class="btn btn-ghost" type="button" id="ov-who">' + Kit.icon('user') + 'Change player</button></div>';
  } else if ((state === 'turn' || state === 'over') && multi && lastRun) {
    const r = lastRun, nx = players[pi + 1];
    cls += ' dim';
    h = '<h2 class="' + (r.jackpot ? 'gold' : '') + '">' + (r.jackpot ? 'Jackpot!' : esc(r.name) + ': ' + r.score) + '</h2><div class="ct-card">';
    ranked().forEach(x => {
      if (x.p.score == null) return;
      h += '<div class="ct-row' + (x.i === pi ? ' me' : '') + '" style="--who:' + x.p.color + '"><span class="nm"><i class="dot" style="--c:' + x.p.color + '"></i>' + esc(x.p.name) + '</span><b>' + x.p.score + '<small>' + x.p.height + ' high</small></b></div>';
    });
    h += '</div>';
    if (state === 'turn' && nx) h += '<div class="ct-acts"><button class="btn btn-primary btn-lg" type="button" id="ov-next">Next: ' + esc(nx.name) + '</button><div class="ct-note">Pass the ' + (Math.min(screen.width, screen.height) >= 700 ? 'iPad' : 'phone') + ' to ' + esc(nx.name) + '</div></div>';
  }
  ov.className = cls;
  if (!h) { ov.hidden = true; ov.innerHTML = ''; return; }
  ov.innerHTML = h; ov.hidden = false;
  bind('ov-resume', resume);
  bind('ov-again', again);
  bind('ov-hi', showHigh);
  bind('ov-past', showPast);
  bind('ov-who', showSetup);
  bind('ov-next', () => { Snd.swoosh(); newRun(pi + 1); });
}
function bind(id, fn) { const b = $(id); if (b) b.addEventListener('click', e => { e.stopPropagation(); Kit.sfx('tap'); fn(); }); }
function countUp(n) {
  const el = $('cnt'); if (!el) return;
  if (!n) { el.textContent = '0'; return; }
  let i = 0; const step = Math.max(1, Math.ceil(n / 30));
  (function tick() { i = Math.min(n, i + step); el.textContent = i; Snd.tick(); if (i < n && el.isConnected) setTimeout(tick, 34); })();
}
function showHigh() { ArcadeHi.show(HI, 'Crazy Tower'); }
function showPast() { Kit.history(KEY, { title: 'Crazy Tower: past games' }); }
function pause() {
  if (state !== 'play' || paused) return;
  paused = true; countdown = 0; Mus.stop(true);
  const b = $('big'); b.classList.remove('down');
  overlay();
}
function resume() { if (!paused) return; paused = false; countdown = 1.8; shownCount = 3; overlay(); kick(); }

// ═══ Input: the big button, a tap anywhere, Space ═══════════════════════════
function press() {
  if (!live || document.querySelector('.ahi-overlay, .k-scrim, .k-win, .k-rotate')) return;
  Snd.unlock();
  if (paused) { resume(); return; }
  if (state === 'ready') { startRun(); return; }
  if (state === 'play' && !countdown && cur && cur.phase === 'slide') drop();
}
$('view').addEventListener('pointerdown', e => {
  if (e.target.closest('button, .ct-card, .ct-acts')) return;
  if (e.button && e.button !== 0) return;
  e.preventDefault(); press();
});
const big = $('big');
big.addEventListener('pointerdown', e => {
  if (e.button && e.button !== 0) return;
  e.preventDefault(); e.stopPropagation(); big.classList.add('down'); press();
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => big.addEventListener(t, () => big.classList.remove('down')));
big.addEventListener('click', e => e.preventDefault());
$('view').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('keydown', e => {
  if (!live || document.querySelector('.ahi-overlay, .k-scrim, .k-win')) return;
  if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'ArrowUp') {
    e.preventDefault(); if (e.repeat) return;
    big.classList.add('down'); setTimeout(() => big.classList.remove('down'), 110);
    press();
  } else if (e.code === 'Enter') {
    e.preventDefault();
    const b = $('ov-again') || $('ov-next'); if (b) { b.click(); return; }
    press();
  } else if (e.code === 'KeyP' || e.code === 'Escape') { if (paused) resume(); else pause(); }
});
$('btn-pause').addEventListener('click', e => { e.stopPropagation(); Kit.sfx('tap'); if (paused) resume(); else pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else kick(); });
document.addEventListener('kit:orient', e => { if (!e.detail.ok) pause(); });   // turned the wrong way: pause behind the cover
window.addEventListener('blur', pause);

// ═══ Loop (frames only while something moves) ════════════════════════════════
let raf = 0, last = 0;
const MOVING = { ready: 1, play: 1, fall: 1, jackpot: 1, review: 1 };
function wantFrames() { return live && glOk && !document.hidden && (!paused || countdown > 0) && !!MOVING[state]; }
function loop(ts) {
  raf = 0;
  const dt = last ? Math.min(.05, (ts - last) / 1000) : 0; last = ts;
  if (!live) { Mus.stop(true); return; }
  if (!paused) update(dt);
  if (state === 'play' || state === 'ready') watchFrame(dt);
  if (state === 'play' && !paused && !countdown && !document.hidden) Mus.tick(); else Mus.stop(state !== 'play');
  render();
  // Battery: no frames on the setup screen, while paused, on the results card or with the page hidden (kick() restarts)
  if (wantFrames()) raf = requestAnimationFrame(loop);
}
function kick() { if (!raf && wantFrames()) { last = 0; raf = requestAnimationFrame(loop); } }

// ═══ Kit shell ══════════════════════════════════════════════════════════════
Kit.init({ orient: 'portrait', orientTablets: true,
  id: 'crazytower',
  theme: { wood: ['#2e2349', '#110b22'] },
  onNew: showSetup, confirmNew: false,
  menu: [
    { icon: 'trophy', label: 'High scores', onClick: () => { pause(); showHigh(); } },
    { icon: 'history', label: 'Past games', onClick: () => { pause(); showPast(); } },
    Mus.menuItem
  ],
  rules:
    '<p class="goal">Stack glowing blocks into the tallest tower you can. Reach the <b>JACKPOT</b> line at ' + JACKPOT + ' blocks for a big bonus.</p>' +
    '<h3>Dropping blocks</h3><ul>' +
    '<li>A block slides back and forth above the tower. Press the <b>big button</b> (or tap anywhere, or press <b>Space</b>) to drop it.</li>' +
    '<li>Any part that hangs over the edge is sliced off and falls away, so the next block is smaller.</li>' +
    '<li>The lit patch on top of the tower shows the part that will stay.</li>' +
    '<li>Blocks slide faster as the tower grows, and they switch sides each time.</li>' +
    '<li>Miss the tower completely and the game is over.</li></ul>' +
    '<h3>Perfect drops</h3><ul>' +
    '<li>Land a block right on top of the one below for a <b>Perfect</b>: nothing is sliced off.</li>' +
    '<li>Perfects in a row score extra: +1 for the first, +2 for the next, up to +5.</li>' +
    '<li>From the 3rd perfect in a row, each perfect also makes the block a little wider again.</li></ul>' +
    '<h3>Scoring</h3><ul>' +
    '<li>Every block is 1 point.</li>' +
    '<li>The markers at 10, 20 and 30 blocks add a bonus of 10, 20 and 30.</li>' +
    '<li>The <b>JACKPOT</b> line at ' + JACKPOT + ' blocks adds ' + JACKPOT_BONUS + ' and tops out the tower.</li></ul>' +
    '<h3>Taking turns</h3><p>Up to 4 players each build their own tower, one after another. Highest score wins. A line on the tower shows the tallest tower so far.</p>' +
    '<p>If your score makes the high-score board, enter your initials.</p>'
});

// ═══ Setup ═══════════════════════════════════════════════════════════════════
const view = $('view');
function showSetup() {
  live = false; paused = false; state = 'idle'; countdown = 0; Mus.stop(true);
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  root.classList.remove('ar-on');
  if (view.parentNode === $('app')) document.body.appendChild(view);
  view.hidden = true;
  Kit.setup($('app'), {
    title: 'Crazy Tower',
    intro: 'Stack the glowing blocks. Hit the jackpot.',
    players: { min: 1, max: 4, count: 1, label: "Who's playing?" },
    start: 'Start building',
    onStart: cfg => {
      players = cfg.players.map((p, i) => ({ name: p.name || 'Player ' + (i + 1), color: p.color || Kit.color(i), score: null, height: null, perfects: 0, jackpot: false }));
      players.started = Date.now();
      multi = players.length > 1; session = { runs: 0, best: 0 }; lastRun = null;
      const app = $('app'); app.className = ''; app.innerHTML = '';
      root.classList.add('ar-on');
      view.hidden = false; app.appendChild(view); live = true;
      if (!glOk && !renderer) initGL();
      scrW = scrH = 0; fit();
      newRun(0); Snd.unlock();
    }
  });
  window.scrollTo(0, 0);
}
new ResizeObserver(() => { if (live) fit(); }).observe($('scr'));

// Test hooks (deterministic play for checks and screenshots)
window.__tower = {
  state: () => state, height, score: () => run ? run.score : 0, streak: () => run ? run.streak : 0, run: () => run, players: () => players, pi: () => pi,
  gl: () => glOk, bloom: () => !!composer, noBloom() { composer = null; }, quality: () => quality, three: () => ({ scene, renderer, camera }),
  samples(n) { if (composer) { composer.renderTarget1.samples = n; composer.renderTarget2.samples = n; } },
  cur: () => cur && { axis: cur.axis, x: cur.x, z: cur.z, w: cur.w, d: cur.d, phase: cur.phase, n: cur.n },
  top: () => { const t = topBlock(); return { x: t.x, z: t.z, w: t.w, d: t.d, n: t.n }; },
  press,
  // put the sliding block `off` from the block below (along its slide) and land it at once
  place(off) {
    if (state === 'ready') startRun();
    if (state !== 'play' || paused) return false;
    if (!cur) spawn();
    const top = topBlock(); cur[cur.axis] = top[cur.axis] + (off || 0);
    cur.phase = 'drop'; cur.y = landY(cur.n); land();
    if (state === 'play' && !cur) { spawnT = 0; spawn(); }
    return true;
  },
  build(n, off) { for (let i = 0; i < n; i++) if (!this.place(typeof off === 'function' ? off(i) : (off || 0))) break; return height(); },
  advance(sec) { const steps = Math.round(sec * 60); for (let i = 0; i < steps; i++) update(1 / 60); render(); }
};
// (the WebGL context waits until a game starts, so the setup screen costs nothing)
showSetup();
</script>

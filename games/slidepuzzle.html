<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slide Puzzle</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
@property --g{syntax:'<length>';inherits:true;initial-value:4px;}
body{overflow-x:hidden;}
.sp{max-width:500px;margin:0 auto;padding:2px 16px calc(var(--safe-b) + 18px);}
.sp .play{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100dvh - var(--safe-t) - var(--safe-b) - 74px);padding-bottom:3vh;}
.sp .play > *{width:min(100%, 460px, calc(100dvh - var(--safe-t) - var(--safe-b) - 300px));min-width:min(100%,300px);}

/* Brass plaques, like the 2048 tray */
.hud{display:flex;gap:8px;align-items:stretch;margin:2px 0 12px;}
.plaque{flex:1;min-width:0;position:relative;border-radius:12px;padding:6px 8px 7px;text-align:center;
  background:linear-gradient(180deg,#f6e7b8,#d9b968 55%,#c39a42);color:#4a3205;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(0,0,0,.18), 0 3px 0 #8a6420, 0 8px 16px rgba(0,0,0,.35);}
.plaque::before,.plaque::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d0,#8a6420);}
.plaque::before{left:6px;}.plaque::after{right:6px;}
.plaque small{display:block;font-size:.64rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.75;}
.plaque b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(255,255,255,.5);white-space:nowrap;}
.plaque b i{font-style:normal;font-size:.8rem;font-family:var(--font);font-weight:900;opacity:.7;margin-left:3px;}
.plaque.best b{font-size:1.2rem;padding-top:3px;}

/* The frame: a wooden box with a carved channel the tiles run in */
.frame{position:relative;border-radius:22px;padding:11px 11px 30px;touch-action:none;-webkit-user-select:none;user-select:none;}
.frame.bump{animation:fbump .16s ease-out;}
@keyframes fbump{50%{transform:translate(var(--bx,0),var(--by,0));}}
.well{position:relative;border-radius:12px;padding:var(--g);aspect-ratio:1;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 11px), linear-gradient(180deg,#24160b,#1a0f06);
  box-shadow:inset 0 6px 14px rgba(0,0,0,.7), inset 0 -1px 0 rgba(255,255,255,.08), 0 1px 0 rgba(255,255,255,.18);}
.board{position:absolute;inset:var(--g);}
.plate{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);padding:2px 14px;border-radius:4px;white-space:nowrap;
  background:linear-gradient(180deg,#f3e2ae,#cfa94e 60%,#b48a35);color:#4a3205;font-size:.62rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 0 rgba(0,0,0,.4);}

.tile{position:absolute;left:0;top:0;width:calc((100% - (var(--n) - 1) * var(--g)) / var(--n));height:calc((100% - (var(--n) - 1) * var(--g)) / var(--n));
  transform:translate(calc(var(--x) * (100% + var(--g))), calc(var(--y) * (100% + var(--g))));
  transition:transform .12s cubic-bezier(.25,.8,.3,1);will-change:transform;}
.tile.slow{transition-duration:.24s;}
/* Ivory plastic tile with a moulded bevel */
.face{position:absolute;inset:0;border-radius:11%;overflow:hidden;display:grid;place-items:center;container-type:size;
  background:radial-gradient(120% 80% at 28% 10%, rgba(255,255,255,.7), rgba(255,255,255,0) 55%), linear-gradient(165deg,#fffaf0,#f1e6cd 60%,#e4d4b0);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.85), inset 0 -3px 0 rgba(120,90,40,.22), inset 0 0 0 1px rgba(90,60,20,.12), 0 2px 0 #a8916a, 0 4px 6px rgba(0,0,0,.5);
  transition:border-radius .5s, box-shadow .5s;}
.face .num{position:relative;font-family:var(--display);font-weight:400;font-size:52cqw;line-height:1;color:#8e1b25;
  text-shadow:0 1px 0 rgba(255,255,255,.8), 0 -1px 0 rgba(80,0,0,.25);}
.face .num.d2{font-size:44cqw;}
.tile.alt .face .num{color:#1d3768;}
.tile.alt2 .face .num{color:#8e1b25;}
/* Picture tiles */
.face .pic{position:absolute;left:calc(var(--hc) * -1 * (100% + var(--g)));top:calc(var(--hr) * -1 * (100% + var(--g)));
  width:calc(var(--n) * 100% + (var(--n) - 1) * var(--g));height:calc(var(--n) * 100% + (var(--n) - 1) * var(--g));
  background:var(--img) 0 0/100% 100% no-repeat;}
.pics .face{background:#3a2a1a;box-shadow:0 2px 0 rgba(0,0,0,.55), 0 4px 6px rgba(0,0,0,.5);}
.pics .face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.18);
  background:linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,0) 40%);transition:opacity .5s;}
.pics .face .num{position:absolute;left:6%;top:6%;font-family:var(--font);font-weight:900;font-size:max(10px, 20cqw);color:#fff;text-shadow:none;
  background:rgba(20,14,8,.55);border-radius:99px;padding:.08em .4em;line-height:1.2;}
.pics.nonum .face .num{display:none;}
/* Blocked tile: a small jiggle */
.tile.no .face{animation:jig .22s ease-out;}
@keyframes jig{25%{transform:translate(calc(var(--jx,0) * 3px), calc(var(--jy,0) * 3px));}60%{transform:translate(calc(var(--jx,0) * -1.5px), calc(var(--jy,0) * -1.5px));}}
/* Hint: glow and an arrow toward the gap */
.tile.hint{z-index:3;}
.tile.hint .face{animation:hglow 1.1s ease-in-out infinite;}
@keyframes hglow{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.85), 0 0 0 3px #ffd34d, 0 0 18px 4px rgba(255,211,77,.8);}}
.harrow{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2;}
.harrow span{width:46%;height:46%;border-radius:50%;display:grid;place-items:center;background:rgba(255,211,77,.95);color:#4a3205;box-shadow:0 3px 8px rgba(0,0,0,.45);animation:hnudge .9s ease-in-out infinite;}
.harrow .ico{width:70%;height:70%;stroke-width:3;}
@keyframes hnudge{50%{transform:translate(calc(var(--ax) * 12%), calc(var(--ay) * 12%));}}
/* Finish: last tile drops in, gaps close, a shine runs across */
.tile.last .face{animation:slot .5s cubic-bezier(.3,1.4,.5,1) both;}
@keyframes slot{0%{transform:translateY(-40%) scale(1.15);opacity:0;}60%{opacity:1;}100%{transform:none;opacity:1;}}
.tile.last .face .mark{position:absolute;inset:0;display:grid;place-items:center;}
.tile.last .face .ico{width:52%;height:52%;color:#b8860b;stroke-width:2.4;}
.board.won.pics{--g:0px;transition:--g .7s ease .35s;}
.board.won.pics .face{border-radius:0;box-shadow:none;}
.board.won.pics .face::after{opacity:0;}
.board.won.pics .face .num{display:none;}
.well.won{transition:padding .7s ease .35s;}
.shine{position:absolute;inset:0;border-radius:8px;pointer-events:none;overflow:hidden;z-index:4;}
.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:45%;left:-60%;transform:skewX(-18deg);
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));animation:shine 1.1s ease-in-out .9s both;}
@keyframes shine{to{left:130%;}}
.peek{position:absolute;inset:var(--g);border-radius:6px;background:var(--img) 0 0/100% 100% no-repeat;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;box-shadow:0 0 0 2px rgba(0,0,0,.4);}
.peek.on{opacity:1;}
.peek.nums{background:none;display:grid;}

/* Tools: clean chrome under the frame */
.tools{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:14px;}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;border-radius:14px;background:rgba(255,255,255,.07);color:var(--text-2);font-weight:800;font-size:.72rem;white-space:nowrap;transition:transform .12s var(--spring), background .15s;}
.tool .ico{width:22px;height:22px;}
.tool:active{transform:scale(.93);background:rgba(255,255,255,.14);}
.tool:disabled{opacity:.35;}
.tool.on{background:var(--accent);color:var(--accent-ink);}
.tool.busy .ico{animation:think 1s ease-in-out infinite;}
@keyframes think{50%{opacity:.3;transform:scale(.85);}}
.tip{margin-top:10px;text-align:center;font-size:.85rem;font-weight:700;color:var(--text-3);display:flex;align-items:center;justify-content:center;gap:6px;min-height:20px;}
.tip .ico{width:16px;height:16px;}

/* Setup preview */
.pv{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:16px;background:rgba(0,0,0,.2);}
.pv .th{flex:none;width:84px;height:84px;border-radius:10px;padding:4px;background:linear-gradient(180deg,#9a5b2e,#6e3d1c);box-shadow:0 4px 10px rgba(0,0,0,.4);}
.pv .th img,.pv .th .ng{display:block;width:100%;height:100%;border-radius:6px;}
.pv .ng{display:grid;gap:2px;background:#1a0f06;padding:2px;}
.pv .ng span{background:linear-gradient(165deg,#fffaf0,#e9dbbb);border-radius:3px;display:grid;place-items:center;font-family:var(--display);font-size:.7rem;color:#8e1b25;}
.pv .tx b{display:block;font-size:1rem;}
.pv .tx small{color:var(--text-3);font-weight:700;font-size:.8rem;}
.setup .dimmed{opacity:.45;}
.mini{display:grid;gap:2px;padding:3px;border-radius:6px;background:#1a0f06;width:max-content;}
.mini span{width:22px;height:22px;border-radius:3px;display:grid;place-items:center;font-family:var(--display);font-size:.72rem;color:#8e1b25;background:linear-gradient(165deg,#fffaf0,#e9dbbb);}
.mini span.z{background:transparent;}
.hx{display:flex;gap:10px;align-items:center;margin-top:10px;}
.hx img{width:70px;height:70px;border-radius:6px;}
</style>
</head>
<body>
<main class="sp" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), $ = function (id) { return document.getElementById(id); };
  var SAVE = 'slidepuzzle_state', HKEY = 'slidepuzzle';
  var SIZES = { 3: 'Easy', 4: 'Classic', 5: 'Hard', 6: 'Expert' };
  var PIC_NAMES = { meadow: 'Meadow', night: 'Game night', space: 'Space', harbor: 'Harbor' };

  // ── Solver (also runs inside a worker) ────────────────────────────────────
  function SlideEngine() {
    // b: array of N*N; tiles 1..N*N-1, 0 = the gap. Solved: tile v sits in cell v-1, gap last.
    // A move is written as the cell the gap moves to (the tile there slides into the gap).
    function abs(x) { return x < 0 ? -x : x; }
    function solvable(b, N) {
      var inv = 0, a = [], gap = 0, i, j;
      for (i = 0; i < b.length; i++) { if (b[i]) a.push(b[i]); else gap = i; }
      for (i = 0; i < a.length; i++) for (j = i + 1; j < a.length; j++) if (a[i] > a[j]) inv++;
      if (N % 2) return inv % 2 === 0;
      return (inv + N - Math.floor(gap / N)) % 2 === 1;
    }
    function isSolved(b) { for (var i = 0; i < b.length - 1; i++) if (b[i] !== i + 1) return false; return true; }
    function manhattan(b, N) {
      var h = 0; for (var i = 0; i < b.length; i++) { var v = b[i]; if (v) h += abs(((i / N) | 0) - (((v - 1) / N) | 0)) + abs(i % N - (v - 1) % N); }
      return h;
    }

    // IDA* with Manhattan distance + linear conflicts (kept up to date line by line).
    // o.w > 1 weights the heuristic (faster, near-optimal). Returns the move list or null.
    var STOP = {};
    function ida(b0, N, o) {
      o = o || {};
      var S = N * N, b = new Int8Array(S), gr = new Int8Array(S), gc = new Int8Array(S), i, v;
      for (i = 0; i < S; i++) b[i] = b0[i];
      for (v = 1; v < S; v++) { gr[v] = ((v - 1) / N) | 0; gc[v] = (v - 1) % N; }
      var gap = 0; for (i = 0; i < S; i++) if (!b[i]) gap = i;
      var rowLC = new Int8Array(N), colLC = new Int8Array(N), tmp = new Int8Array(N), L = new Int8Array(N);
      function lc(isRow, k) {
        var n = 0, j, cell, t;
        for (j = 0; j < N; j++) {
          cell = isRow ? k * N + j : j * N + k; t = b[cell];
          if (t && (isRow ? gr[t] === k : gc[t] === k)) tmp[n++] = isRow ? gc[t] : gr[t];
        }
        if (n < 2) return 0;
        var best = 0;
        for (var x = 0; x < n; x++) { L[x] = 1; for (var y = 0; y < x; y++) if (tmp[y] < tmp[x] && L[y] + 1 > L[x]) L[x] = L[y] + 1; if (L[x] > best) best = L[x]; }
        return 2 * (n - best);
      }
      var h0 = 0;
      for (i = 0; i < S; i++) { v = b[i]; if (v) h0 += abs(((i / N) | 0) - gr[v]) + abs(i % N - gc[v]); }
      for (i = 0; i < N; i++) { rowLC[i] = lc(1, i); colLC[i] = lc(0, i); h0 += rowLC[i] + colLC[i]; }
      var w = o.w || 1, maxNodes = o.maxNodes || 1e12, nodes = 0, path = [];
      var DR = [-1, 1, 0, 0], DC = [0, 0, -1, 1];
      function dfs(g, h, bound, prev) {
        var f = g + w * h;
        if (f > bound) return f;
        if (h === 0) return -1;
        if (++nodes > maxNodes) throw STOP;
        var min = Infinity, r = (gap / N) | 0, c = gap % N;
        for (var d = 0; d < 4; d++) {
          var nr = r + DR[d], nc = c + DC[d];
          if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
          var to = nr * N + nc; if (to === prev) continue;
          var t = b[to], og = gap;
          var dh = abs(r - gr[t]) + abs(c - gc[t]) - abs(nr - gr[t]) - abs(nc - gc[t]);
          b[og] = t; b[to] = 0; gap = to;
          var o1, o2, vert = nc === c;
          if (vert) { o1 = rowLC[nr]; o2 = rowLC[r]; rowLC[nr] = lc(1, nr); rowLC[r] = lc(1, r); dh += rowLC[nr] + rowLC[r] - o1 - o2; }
          else { o1 = colLC[nc]; o2 = colLC[c]; colLC[nc] = lc(0, nc); colLC[c] = lc(0, c); dh += colLC[nc] + colLC[c] - o1 - o2; }
          path.push(to);
          var res = dfs(g + 1, h + dh, bound, og);
          if (res === -1) return -1;
          path.pop();
          b[to] = t; b[og] = 0; gap = og;
          if (vert) { rowLC[nr] = o1; rowLC[r] = o2; } else { colLC[nc] = o1; colLC[c] = o2; }
          if (res < min) min = res;
        }
        return min;
      }
      try {
        var bound = w * h0;
        for (;;) {
          var res = dfs(0, h0, bound, -1);
          if (res === -1) return { moves: path.slice(), nodes: nodes };
          if (res === Infinity) return null;
          bound = res;
        }
      } catch (e) { if (e === STOP) return null; throw e; }
    }

    // Row-by-row "human" solve for big boards: place the top row, then the
    // left column, and so on (the last two of each line go in together), then
    // finish the last 3x3 corner with IDA*. Not optimal, always works.
    function reduce(b0, N) {
      var S = N * N, b = b0.slice(), locked = new Uint8Array(S), out = [], top = 0, left = 0;
      function gapAt() { return b.indexOf(0); }
      function nb(i) { var r = (i / N) | 0, c = i % N, a = []; if (r > 0) a.push(i - N); if (r < N - 1) a.push(i + N); if (c > 0) a.push(i - 1); if (c < N - 1) a.push(i + 1); return a; }
      var NB = []; for (var i = 0; i < S; i++) NB.push(nb(i));
      function apply(seq) { for (var k = 0; k < seq.length; k++) { var g = gapAt(), to = seq[k]; b[g] = b[to]; b[to] = 0; out.push(to); } }
      function place(tiles, goals) {
        var k = tiles.length, pos = tiles.map(function (v) { return b.indexOf(v); });
        var size = Math.pow(S, k + 1), par = new Int32Array(size).fill(-2), via = new Int16Array(size);
        function enc(g, p) { var x = g; for (var j = 0; j < k; j++) x = x * S + p[j]; return x; }
        function dec(x) { var p = []; for (var j = k - 1; j >= 0; j--) { p[j] = x % S; x = (x / S) | 0; } return { g: x, p: p }; }
        function done(p) { for (var j = 0; j < k; j++) if (p[j] !== goals[j]) return false; return true; }
        if (done(pos)) return;
        var start = enc(gapAt(), pos), q = new Int32Array(size), qh = 0, qt = 0, end = -1;
        par[start] = -1; q[qt++] = start;
        while (qh < qt && end < 0) {
          var cur = q[qh++], st = dec(cur), ns = NB[st.g];
          for (var a = 0; a < ns.length; a++) {
            var to = ns[a]; if (locked[to]) continue;
            var p = st.p.slice();
            for (var j = 0; j < k; j++) if (p[j] === to) p[j] = st.g;
            var nx = enc(to, p); if (par[nx] !== -2) continue;
            par[nx] = cur; via[nx] = to; q[qt++] = nx;
            if (done(p)) { end = nx; break; }
          }
        }
        if (end < 0) throw new Error('place failed');
        var seq = []; for (var x = end; par[x] !== -1; x = par[x]) seq.push(via[x]);
        apply(seq.reverse());
      }
      // Finish a k x k corner (top,left) with IDA*: relabel it as its own small puzzle
      function corner(k, w, cap) {
        var cells = [], lb = [];
        for (var x = 0; x < k * k; x++) cells.push((top + ((x / k) | 0)) * N + left + x % k);
        cells.forEach(function (cell) {
          var v = b[cell]; if (!v) { lb.push(0); return; }
          var gi = v - 1; lb.push((((gi / N) | 0) - top) * k + (gi % N - left) + 1);
        });
        var res = ida(lb, k, { w: w, maxNodes: cap });
        if (!res) return false;
        apply(res.moves.map(function (m) { return cells[m]; }));
        return true;
      }
      while (N - top > 3 || N - left > 3) {
        if (N - top === 4 && N - left === 4 && corner(4, 1.5, 1.5e6)) return out;
        var c, r;
        if (N - top >= N - left) {
          for (c = left; c < N - 2; c++) { place([top * N + c + 1], [top * N + c]); locked[top * N + c] = 1; }
          place([top * N + N - 1, top * N + N], [top * N + N - 2, top * N + N - 1]);
          locked[top * N + N - 2] = locked[top * N + N - 1] = 1; top++;
        } else {
          for (r = top; r < N - 2; r++) { place([r * N + left + 1], [r * N + left]); locked[r * N + left] = 1; }
          place([(N - 2) * N + left + 1, (N - 1) * N + left + 1], [(N - 2) * N + left, (N - 1) * N + left]);
          locked[(N - 2) * N + left] = locked[(N - 1) * N + left] = 1; left++;
        }
      }
      if (!corner(3, 1, 1e12)) throw new Error('corner failed');
      return out;
    }

    // Best effort: exact for 3x3, exact-then-weighted for 4x4, row by row for bigger.
    function solve(b, N, o) {
      o = o || {};
      if (isSolved(b)) return { moves: [], optimal: true };
      if (N === 3) { var r3 = ida(b, 3); return { moves: r3.moves, optimal: true }; }
      if (N === 4) {
        var r = ida(b, 4, { maxNodes: o.cap || 1.5e6 });
        if (r) return { moves: r.moves, optimal: true };
        r = ida(b, 4, { w: 1.6, maxNodes: 3e6 });
        if (r) return { moves: r.moves, optimal: false };
      }
      return { moves: reduce(b, N), optimal: false };
    }
    return { solvable: solvable, isSolved: isSolved, manhattan: manhattan, ida: ida, reduce: reduce, solve: solve };
  }
  var E = SlideEngine();

  var worker = null, workerOk = true, reqId = 0, pending = null;
  function getWorker() {
    if (worker || !workerOk) return worker;
    try {
      var src = 'var E=(' + SlideEngine.toString() + ')();onmessage=function(e){var d=e.data,r=null;try{r=E.solve(d.b,d.n);}catch(x){}postMessage({id:d.id,res:r});};';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = function (e) { if (pending && e.data.id === pending.id) { var p = pending; pending = null; p.cb(e.data.res); } };
      worker.onerror = function () { workerOk = false; worker = null; if (pending) { var p = pending; pending = null; p.cb(E.solve(p.b, p.n)); } };
    } catch (e) { workerOk = false; worker = null; }
    return worker;
  }
  function think(b, n, cb) {
    var id = ++reqId, w = getWorker();
    pending = { id: id, cb: cb, b: b, n: n };
    if (w) w.postMessage({ id: id, b: b, n: n });
    else setTimeout(function () { if (pending && pending.id === id) { pending = null; cb(E.solve(b, n)); } }, 30);

    }
    frame.addEventListener('pointerdown', function (e) { ac(); sid = e.pointerId; sx = e.clientX; sy = e.clientY; fired = false; startCell = cellAt(e.clientX, e.clientY); });
    frame.addEventListener('pointermove', function (e) {
      if (sid !== e.pointerId || fired) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      fired = true;
      push(Math.abs(dx) > Math.abs(dy) ? [dx > 0 ? 1 : -1, 0] : [0, dy > 0 ? 1 : -1], startCell);
    });
    frame.addEventListener('pointerup', function (e) {
      if (sid !== e.pointerId) return;
      sid = null; if (fired) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) >= 16) { push(Math.abs(dx) > Math.abs(dy) ? [dx > 0 ? 1 : -1, 0] : [0, dy > 0 ? 1 : -1], startCell); return; }
      if (startCell != null) tapCell(startCell);
    });
    frame.addEventListener('pointercancel', function () { sid = null; });
    frame.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    if (bound) return; bound = true;
    document.addEventListener('keydown', function (e) {
      if (!S || document.querySelector('.k-scrim,.k-win')) return;
      if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); return; }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var map = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
      if (map[e.key]) { e.preventDefault(); push(map[e.key]); }
      else if (e.key === 'h' || e.key === 'H') hint();
      else if (e.key === 'u' || e.key === 'Backspace') undo();
    });
  }

  // ── Clock ─────────────────────────────────────────────────────────────────
  function startClock() {
    stopClock();
    tick = setInterval(function () {
      if (!S || S.done || document.hidden || !S.moves) return;
      S.time++; var t = $('tm'); if (t) t.textContent = fmt(S.time);
      if (S.time % 5 === 0) save();
    }, 1000);
  }
  function stopClock() { if (tick) clearInterval(tick); tick = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });

  // ── Hints and the robot ───────────────────────────────────────────────────
  function clearHint() {
    if (hintCell >= 0) { board.querySelectorAll('.tile.hint').forEach(function (t) { t.classList.remove('hint'); var a = t.querySelector('.harrow'); if (a) a.remove(); }); }
    hintCell = -1;
  }
  function showHint(cell) {
    clearHint();
    var v = S.b[cell], t = els[v]; if (!t) return;
    var g = gapOf(), n = S.n, dx = g % n - cell % n, dy = Math.floor(g / n) - Math.floor(cell / n);
    var rot = dx > 0 ? 0 : dx < 0 ? 180 : dy > 0 ? 90 : -90;
    t.classList.add('hint');
    var a = el('div', { class: 'harrow', style: { '--ax': dx, '--ay': dy } }, [el('span', { html: Kit.icon('right') })]);
    a.firstChild.firstChild.style.transform = 'rotate(' + rot + 'deg)';
    t.appendChild(a);
    hintCell = cell;
  }
  var thinking = false;
  function hint() {
    if (busy() || watching) return;
    if (hintCell >= 0 && S.b[hintCell]) { slide([hintCell]); return; } // second tap: make the move
    if (plan && plan.length) { S.hints++; showHint(plan[0]); Kit.sfx('pop'); save(); return; }
    if (thinking) return;
    thinking = true;
    var h = $('tHint'); if (h) h.classList.add('busy');
    var snapB = S.b.slice(), at = Date.now();
    think(snapB, S.n, function (res) {
      thinking = false;
      var h2 = $('tHint'); if (h2) h2.classList.remove('busy');
      if (!S || S.done || S.b.join() !== snapB.join()) return;
      if (!res || !res.moves.length) { Kit.toast('No hint right now'); return; }
      plan = res.moves.slice();
      S.hints++; showHint(plan[0]); Kit.sfx('pop'); Kit.haptic('light'); save();
      if (S.hints === 1) Kit.toast(res.optimal ? 'Solvable in ' + res.moves.length + ' more moves' : 'Tap Hint again to make the move');
    });
  }
  function watch() {
    if (busy() || S.n !== 3) return;
    var r = E.ida(S.b, 3); if (!r) return;
    plan = null; clearHint();
    S.watched = S.watched || Math.max(1, S.moves + 1);
    var seq = r.moves.slice(), btn = $('tWatch');
    if (btn) { btn.innerHTML = Kit.icon('close') + '<span>Stop</span>'; btn.classList.add('on'); }
    Kit.toast('Solving in ' + seq.length + ' moves');
    watching = { t: null };
    updHud();
    (function step() {
      if (!watching) return;
      if (!seq.length || S.done) { stopWatch(); return; }
      watching = null; slide([seq.shift()], { slow: true }); watching = { t: null };
      updHud();
      if (S.done) { watching = null; return; }
      watching.t = setTimeout(step, 360);
    })();
  }
  function stopWatch() {
    if (watching && watching.t) clearTimeout(watching.t);
    watching = null;
    var btn = $('tWatch'); if (btn) { btn.innerHTML = Kit.icon('play') + '<span>Watch</span>'; btn.classList.remove('on'); }
    if (S) updHud();
  }

  // ── Finish ────────────────────────────────────────────────────────────────
  function finish() {
    var n = S.n, pic = S.style === 'pic', name = sizeName(n);
    var prevM = bestMoves(n), prevT = bestTime(n), isClean = !S.hints && !S.watched;
    var newM = isClean && (!prevM || S.moves < prevM), newT = isClean && (!prevT || S.time < prevT);
    var hl = [];
    if (S.watched) hl.push('Watched the computer finish the ' + name + (S.watched > 1 ? ' from move ' + S.watched : '') + ', ' + S.moves + ' moves in all');
    else hl.push('Solved the ' + name + ' in ' + S.moves + ' moves, ' + fmt(S.time));
    if (newM && prevM) hl.push('New best on ' + name + ': ' + S.moves + ' moves (old best ' + prevM + ')');
    else if (newM) hl.push('First ' + name + ' solved without hints: ' + S.moves + ' moves');
    if (newT && prevT) hl.push('New best time on ' + name + ': ' + fmt(S.time) + ' (old best ' + fmt(prevT) + ')');
    if (S.opt && !S.watched) hl.push(S.moves <= S.opt ? 'Perfect solve: the fewest moves possible (' + S.opt + ')' : 'The shortest solution was ' + S.opt + ' moves');
    if (pic) hl.push('Picture tiles: ' + PIC_NAMES[S.pic] + (S.nums ? ' (with numbers)' : ''));
    if (S.hints) hl.push('Used ' + S.hints + (S.hints === 1 ? ' hint' : ' hints'));
    if (S.undos) hl.push('Took back moves ' + S.undos + (S.undos === 1 ? ' time' : ' times'));
    var mini = function (a) { return a.slice(); };
    Kit.record(HKEY, {
      started: S.started, mode: name + ' ' + SIZES[n] + (pic ? ' · ' + PIC_NAMES[S.pic] : ''),
      players: [{ name: 'You', score: S.moves }], winner: null, lowWins: true,
      summary: (S.watched ? 'Computer solved it' : 'Solved') + ' · ' + name + ' · ' + S.moves + ' moves · ' + fmt(S.time), badge: name,
      highlights: hl.slice(0, 6),
      meta: { size: n, moves: S.moves, seconds: S.time, hints: S.hints, undos: S.undos, watched: S.watched || 0, style: S.style, pic: pic ? S.pic : '', opt: S.opt || 0, start: mini(S.start) }
    });
    clearSave();
    // The missing tile slots in, the board shines
    var last = el('div', { class: 'tile last', style: { '--hr': n - 1, '--hc': n - 1, '--x': n - 1, '--y': n - 1 } },
      [el('div', { class: 'face' }, [pic ? el('div', { class: 'pic' }) : el('span', { class: 'mark', html: Kit.icon('star') })])]);
    board.appendChild(last);
    Kit.sfx('good'); Kit.haptic('success');
    setTimeout(function () { board.classList.add('won'); well.classList.add('won'); well.appendChild(el('div', { class: 'shine' })); }, 450);
    setTimeout(function () { Kit.callout(newM && prevM ? 'New best!' : S.watched ? 'Solved!' : 'Solved!'); }, 900);
    setTimeout(function () {
      var size = S.n, style = S.style, pid = S.pic;
      Kit.win({
        icon: S.watched ? 'bot' : 'trophy',
        title: S.watched ? 'Solved by the computer' : newM && prevM ? 'New best!' : 'Solved!',
        sub: name + ' in ' + S.moves + ' moves · ' + fmt(S.time) + (S.opt && !S.watched ? (S.moves <= S.opt ? ' · perfect!' : ' · shortest is ' + S.opt) : '') + (S.hints ? ' · ' + S.hints + (S.hints === 1 ? ' hint' : ' hints') : ''),
        againLabel: 'Another ' + name, again: function () { newGame(size, style, pid); },
        extra: [{ label: 'Choose a size', onClick: showSetup }]
      });
    }, 2300);
  }

  function histExtra(e) {
    if (!e || !Array.isArray(e.start) || !e.size) return null;
    var n = e.size, g = el('div', { class: 'mini', style: { 'grid-template-columns': 'repeat(' + n + ',22px)' } });
    e.start.forEach(function (v) { g.appendChild(el('span', { class: v ? '' : 'z', text: v ? String(v) : '' })); });
    var box = el('div', { class: 'hx' }, [el('div', null, [el('div', { class: 'label', text: 'The shuffle' }), g])]);
    if (e.pic && PICS[e.pic]) box.appendChild(el('img', { src: picSvg(e.pic), alt: PIC_NAMES[e.pic] }));
    return box;
  }
  function showBests() {
    var rows = [3, 4, 5, 6].map(function (n) {
      var all = hist().filter(function (e) { return e && e.size === n && !e.watched; });
      var m = bestMoves(n), t = bestTime(n);
      return '<tr><td>' + sizeName(n) + '</td><td>' + all.length + '</td><td>' + (m || '–') + '</td><td>' + (t ? fmt(t) : '–') + '</td></tr>';
    }).join('');
    Kit.sheet({ title: 'Best scores', html: '<p class="muted" style="margin-bottom:10px">Fewest moves and fastest times without hints, from your past games.</p><table style="width:100%;border-collapse:collapse;font-weight:800" class="k-hd-rounds"><tr><th>Size</th><th>Solved</th><th>Moves</th><th>Time</th></tr>' + rows + '</table>', actions: [{ label: 'Close', cls: 'btn-soft' }] });
  }

  // Test hook
  window.__slide = {
    get: function () { return S; }, E: E,
    set: function (b) { S.b = b.slice(); S.U = []; plan = null; clearHint(); placeAll(true); updHud(); save(); },
    solve: function () { return E.solve(S.b, S.n); }
  };

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && SIZES[saved.n] && Array.isArray(saved.b) && saved.b.length === saved.n * saved.n && !saved.done && E.solvable(saved.b, saved.n)) {
    S = saved; S.U = S.U || []; build(); save();
  } else showSetup();
})();
</script>

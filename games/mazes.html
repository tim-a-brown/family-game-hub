<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mazes</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<script src="mazes/maze-core.js"></script>
<style>
body{overflow-x:hidden;}
.mz{max-width:560px;margin:0 auto;padding:0 16px calc(var(--safe-b) + 16px);}
.mz.play{max-width:none;display:flex;flex-direction:column;align-items:center;padding:0 12px calc(var(--safe-b) + 8px);overflow:hidden;}

/* ── Counters ── */
.hud{display:flex;gap:8px;width:100%;max-width:520px;margin:2px auto 16px;flex:none;}
.cnt{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 8px;border-radius:14px;background:var(--w06);box-shadow:inset 0 0 0 1px var(--w06);}
.cnt .ico{width:20px;height:20px;flex:none;color:var(--text-3);}
.cnt .tx{display:flex;flex-direction:column;line-height:1.05;min-width:0;}
.cnt small{font-size:.6rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);}
.cnt b{font-family:var(--display);font-weight:400;font-size:1.3rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cnt.time b{color:color-mix(in srgb,var(--accent) 55%,var(--text));}
.cnt.time.penal b{animation:penflash .9s ease;}
@keyframes penflash{30%{color:#ff6b5a;transform:scale(1.12);}}

/* ── The clipboard and the puzzle page ── */
.stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
.clip{position:relative;border-radius:16px;padding:24px 11px 12px;flex:none;}
.clip::after{content:"";position:absolute;inset:6px;border-radius:12px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.clamp{position:absolute;z-index:3;top:-9px;left:50%;transform:translateX(-50%);width:min(44%,170px);height:34px;border-radius:9px 9px 14px 14px;
  background:linear-gradient(180deg,#f4f6f9 0%,#c8ced7 38%,#9aa3af 62%,#d9dee5 100%);
  box-shadow:inset 0 1px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.18), 0 4px 7px rgba(0,0,0,.4);}
.clamp::before{content:"";position:absolute;left:50%;top:7px;transform:translateX(-50%);width:26%;height:9px;border-radius:6px;background:linear-gradient(180deg,#4a5260,#7d8592);box-shadow:inset 0 2px 3px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.7);}
.clamp::after{content:"";position:absolute;left:8%;right:8%;bottom:4px;height:3px;border-radius:2px;background:rgba(0,0,0,.14);}
.sheet{position:relative;border-radius:3px;padding:9px 10px 8px;color:#23263a;}
.sheet.paper{background:
    radial-gradient(rgba(120,90,40,.055) 1px,transparent 1.3px) 0 0/5px 5px,
    radial-gradient(130% 90% at 50% 40%,#fffcf3 0%,#fbf4e3 70%,#f3e8cf 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 2px 0 #e2d5b8, 0 3px 0 #f2e8d0, 0 4px 0 #d8caa9, 0 10px 16px -6px rgba(0,0,0,.5);}
.sh-head{display:flex;align-items:flex-end;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding:0 3px 5px;margin-bottom:2px;border-bottom:1.5px solid rgba(35,38,58,.8);}
.sh-l{display:flex;align-items:baseline;gap:8px;min-width:0;}
.sh-no{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:.98rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;}
.sh-sub{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:.8rem;font-weight:400;letter-spacing:0;text-transform:none;color:#5c5848;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sh-time{display:flex;align-items:baseline;gap:5px;font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6a6c80;white-space:nowrap;}
.sh-time i{display:inline-block;min-width:58px;border-bottom:1.2px solid #9a9cae;font-style:normal;font-family:var(--hand);font-size:1.3rem;line-height:.9;letter-spacing:0;text-transform:none;color:#c63a2b;text-align:center;}
.sh-time i.write{animation:write .9s steps(9) both;}
@keyframes write{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}

svg.mzs{display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;cursor:crosshair;}
.walls{fill:none;stroke:#23263a;stroke-linecap:round;stroke-linejoin:round;}
.marks path{fill:none;stroke:#23263a;stroke-linecap:round;stroke-linejoin:round;}
.marks path.fill{fill:#23263a;stroke:none;}
.marks text{font-family:Georgia,"Times New Roman",serif;font-weight:700;fill:#23263a;letter-spacing:.1em;}
.pen,.pen-bleed,.sweep,.hintp,.solp{fill:none;stroke-linecap:round;stroke-linejoin:round;}
.pen{stroke:#d0392a;opacity:.93;mix-blend-mode:multiply;}
.pen-bleed{stroke:#d0392a;opacity:.16;}
.nib{fill:#a5261a;}
.nib-ring{fill:none;stroke:#d0392a;transform-box:fill-box;transform-origin:center;animation:nibp 1.8s ease-out infinite;}
@keyframes nibp{0%{transform:scale(.6);opacity:.7;}80%,100%{transform:scale(1.9);opacity:0;}}
.mzs.drawing .nib-ring,.mzs.done .nib-ring,.mzs.done .nib{display:none;}
.hintp{stroke:#2a74c9;opacity:0;}
.hintp.on{animation:hintp 3.6s ease forwards;}
@keyframes hintp{0%{opacity:0;}10%,70%{opacity:.95;}100%{opacity:0;}}
.hintdot{fill:none;stroke:#2a74c9;opacity:0;}
.hintdot.on{animation:hintp 3.6s ease forwards;}
.solp{stroke:#2a74c9;opacity:.85;}
.solp.draw{animation:solin 1.6s ease-out both;}
@keyframes solin{from{stroke-dashoffset:var(--len);}to{stroke-dashoffset:0;}}
.sweep{stroke:#fff6c8;opacity:0;}
.sweep.go{animation:sweep 1.25s ease-in-out forwards;}
@keyframes sweep{0%{opacity:.95;stroke-dashoffset:var(--len);}85%{opacity:.95;}100%{opacity:0;stroke-dashoffset:calc(var(--len) * -0.2);}}
.goal{transform-box:fill-box;transform-origin:center;}
.mzs.done .goal{animation:goalpop .7s var(--spring) .2s both;}
@keyframes goalpop{40%{transform:scale(1.45);}}

/* the magnifier on small mazes: parked in a corner away from your finger, so the way ahead stays in view */
.loupe{position:fixed;z-index:60;width:var(--ld,150px);height:var(--ld,150px);margin:calc(var(--ld,150px) / -2) 0 0 calc(var(--ld,150px) / -2);border-radius:50%;overflow:hidden;pointer-events:none;
  background:radial-gradient(130% 90% at 50% 40%,#fffcf3 0%,#fbf4e3 70%,#f3e8cf 100%);
  box-shadow:0 0 0 3px #d7dbe2, 0 0 0 5px #8a929e, 0 12px 26px rgba(0,0,0,.5), inset 0 0 18px rgba(0,0,0,.12);opacity:0;transform:scale(.6);transition:opacity .12s, transform .16s var(--spring), left .24s var(--ease), top .24s var(--ease);}
.loupe.on{opacity:1;transform:none;}
.loupe svg{width:100%;height:100%;display:block;}
.loupe::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(60% 40% at 32% 22%,rgba(255,255,255,.45),transparent 70%);}

/* ── Controls under the board ── */
.tools{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:520px;margin:10px auto 0;flex:none;}
.tools .btn{min-height:46px;gap:8px;}
.tools .btn .ico{width:20px;height:20px;}
.tools .grow{flex:1;max-width:220px;}
.tools .zm{display:flex;gap:6px;}
.tools .zm .icon-btn{width:44px;height:44px;}
.tools .zm .icon-btn .ico{width:20px;height:20px;}
.tools .pen-k{font-family:var(--display);font-weight:400;font-size:.8rem;opacity:.75;}
.tip{flex:none;text-align:center;font-size:.78rem;font-weight:700;color:var(--text-3);margin-top:6px;min-height:1.1em;}

/* ── Labyrinth: a wooden box with a steel ball ── */
.lab-wrap{position:relative;perspective:1100px;flex:none;}
.lab-box{position:relative;border-radius:18px;padding:12px;transform-style:preserve-3d;transition:transform .14s linear;}
.lab-box canvas{display:block;border-radius:6px;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4), 0 0 0 2px rgba(0,0,0,.25);}
.lab-ask{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:20px;}
.lab-ask .card{max-width:300px;text-align:center;padding:20px 18px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:center;}
.lab-ask .card .ico{width:40px;height:40px;color:var(--accent);}
.lab-ask .card b{font-size:1.1rem;}
.lab-ask .card p{color:var(--text-2);font-size:.9rem;}
.stick{position:fixed;z-index:30;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35), 0 0 0 1px rgba(0,0,0,.25);background:rgba(20,16,41,.22);}
.stick i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9ced6 45%,#5d6470);box-shadow:0 4px 8px rgba(0,0,0,.4);}

/* ── Setup: today's maze ── */
.daily{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-sm), inset 0 0 0 1px var(--w06);}
.dcal{flex:none;width:54px;border-radius:8px;overflow:hidden;text-align:center;background:linear-gradient(180deg,#fffcf3,#f3e8cf);color:#23263a;box-shadow:0 3px 0 #cbbd9c, 0 6px 12px rgba(0,0,0,.35);transform:rotate(-3deg);}
.dcal small{display:block;background:#d0392a;color:#fff;font-size:.62rem;font-weight:900;letter-spacing:.14em;padding:3px 0 2px;}
.dcal b{display:block;font-family:var(--display);font-weight:400;font-size:1.65rem;line-height:1.25;}
.daily .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.daily .tx b{font-size:1.05rem;font-weight:900;}
.daily .tx small{font-size:.84rem;color:var(--text-2);line-height:1.3;}
.daily .tx .st{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:800;}
.daily .tx .st .ico{width:15px;height:15px;}
.daily .btn{flex:none;}
.bt-table{width:100%;border-collapse:collapse;font-size:.92rem;}
.bt-table th{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:6px 6px;font-weight:900;}
.bt-table td{padding:9px 6px;border-top:1px solid var(--w08);}
.bt-table td b{font-family:var(--display);font-weight:400;font-size:1.05rem;}
</style>
</head>
<body>
<main class="mz" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), MC = MazeCore, U = MC.U;
  var SAVE = 'mazes_state', HKEY = 'mazes', TOUCH = matchMedia('(pointer:coarse)').matches;
  var SIZE_ORDER = ['easy', 'medium', 'hard', 'expert'];
  var PENALTY = { easy: 5, medium: 10, hard: 15, expert: 20 };   // seconds a hint costs
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ── High score boards: best times per size, lower is better (listed in HI_BOARDS in games.js) ──
  function hiKey(mode, size) { return 'mazes_' + (mode === 'tilt' ? 'tilt_' : '') + size; }
  SIZE_ORDER.forEach(function (z) {
    var nm = MC.SIZES[z].name;
    [['pencil', nm, nm], ['tilt', 'Labyrinth ' + nm, 'Tilt ' + nm]].forEach(function (b) {
      var k = hiKey(b[0], z);
      try { if (typeof hiBoard !== 'function' || !hiBoard(k)) ArcadeHi.config(k, { game: 'mazes', label: b[1], tab: b[2], low: 1, unit: 'time', dec: 1 }); } catch (e) {}
    });
  });

  // ── Sound: soft pen, eraser, wood and steel (respects the kit's sound switch) ──
  var AC = null;
  function ac() {
    if (lsGet('gn_sound', '1') === '0') return null;
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { AC = new C(); } catch (e) { return null; } }
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    return AC;
  }
  function tone(fr, t0, dur, type, vol, slide) {
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type || 'sine'; o.frequency.setValueAtTime(fr, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
  }
  var noiseBuf = null;
  function nbuf(a) { if (!noiseBuf) { var n = a.sampleRate * 2; noiseBuf = a.createBuffer(1, n, a.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; } return noiseBuf; }
  function noise(t0, dur, vol, type, fr, q, sweepTo) {
    var a = ac(); if (!a) return;
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;
    s.buffer = nbuf(a);
    f.type = type || 'bandpass'; f.frequency.setValueAtTime(fr, t); if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur); f.Q.value = q || 1;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.008, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t, Math.random()); s.stop(t + dur + 0.02);
  }
  var lastSnd = 0;
  var SND = {
    pen: function () { var n = performance.now(); if (n - lastSnd < 38) return; lastSnd = n; noise(0, 0.05, 0.035, 'bandpass', 3000 + Math.random() * 900, 1.1); },
    erase: function () { var n = performance.now(); if (n - lastSnd < 50) return; lastSnd = n; noise(0, 0.07, 0.05, 'bandpass', 700 + Math.random() * 250, 0.8); },
    bump: function () { tone(150, 0, 0.06, 'sine', 0.05, 110); },
    knock: function (v) { v = Math.min(1, v); tone(230 + Math.random() * 40, 0, 0.07, 'triangle', 0.03 + 0.12 * v, 150); noise(0, 0.03, 0.02 + 0.08 * v, 'bandpass', 1700, 2); },
    fall: function () { tone(620, 0, 0.32, 'sine', 0.09, 140); tone(110, 0.3, 0.16, 'sine', 0.16, 60); noise(0.3, 0.1, 0.06, 'lowpass', 500); },
    goal: function () { tone(260, 0, 0.12, 'sine', 0.14, 90); [880, 1175, 1568].forEach(function (f, i) { tone(f, 0.12 + i * 0.07, 0.3, 'triangle', 0.06); }); },
    hint: function () { [740, 988].forEach(function (f, i) { tone(f, i * 0.07, 0.18, 'sine', 0.05); }); }
  };
  // Rolling steel ball: looped noise through a low filter, louder and brighter the faster it rolls
  var roll = null;
  function rollSet(speed) {
    var a = AC; if (!a || lsGet('gn_sound', '1') === '0') { if (roll) rollStop(); return; }
    if (!roll) {
      try {
        var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
        s.buffer = nbuf(a); s.loop = true; f.type = 'lowpass'; f.Q.value = 2; g.gain.value = 0;
        s.connect(f); f.connect(g); g.connect(a.destination); s.start(); roll = { s: s, f: f, g: g };
      } catch (e) { return; }
    }
    var t = a.currentTime, v = Math.min(1, speed / 8);
    roll.g.gain.setTargetAtTime(speed < 0.15 ? 0 : 0.012 + 0.07 * v, t, 0.05);
    roll.f.frequency.setTargetAtTime(220 + 900 * v, t, 0.05);
  }
  function rollStop() { if (roll) { try { roll.s.stop(); } catch (e) {} roll = null; } }

  // ── Shell ──────────────────────────────────────────────────────────────────
  var inCatalog = typeof findGame === 'function' && !!findGame('mazes');
  Kit.init({
    id: 'mazes',
    title: inCatalog ? null : 'Mazes', color: inCatalog ? null : '#2b8fd9',
    theme: { wood: ['#a9784a', '#76502d'] },
    onNew: function () { leave(); showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'calendar', label: 'Daily maze', top: true, onClick: function () { askDaily(); } },
      { icon: 'chart', label: 'Best times', onClick: function () { showBests(); } },
      { icon: 'trophy', label: 'High scores', onClick: function () { ArcadeHi.show(hiKey(S ? S.mode : 'pencil', S ? S.size : 'easy')); } },
      { icon: 'history', label: 'Past games', onClick: function () { pastGames(); } },
      { icon: 'lightbulb', label: 'Hint', sub: 'Shows the next few steps (costs time)', when: function () { return live(); }, onClick: function () { hint(); } },
      { icon: 'search', label: 'Magnifier', sub: 'A close-up of the squares under your finger, parked in a corner', when: function () { return TOUCH; }, toggle: function () { return loupeOn(); }, onClick: function () { lsSet('mazes_loupe', loupeOn() ? '0' : '1'); if (!loupeOn()) hideLoupe(); Kit.toast(loupeOn() ? 'Magnifier on' : 'Magnifier off'); } },
      { icon: 'eye', label: 'Reveal the way out', sub: 'Gives up on this maze', when: function () { return live(); }, onClick: function () { askReveal(); } },
      { icon: 'compass', label: 'Level the board', sub: 'Make the way you are holding it flat', when: function () { return live() && S.mode === 'tilt'; }, onClick: function () { level(true); } }
    ],
    rules:
      '<p class="goal">Find the one way from <b>Start</b> to <b>Finish</b>. Every maze has exactly one route, and every square can be reached.</p>' +
      '<h3>Pencil</h3><ul>' +
      '<li>Put your finger on the red dot at <b>Start</b> and drag along the corridors. The line follows the squares and stops at walls.</li>' +
      '<li>Took a wrong turn? <b>Drag back</b> along your line and it rubs itself out. Or press anywhere on your line to carry on from there.</li>' +
      '<li>Big mazes: <b>pinch</b> to zoom and drag with two fingers to look around' + (TOUCH ? '; a magnifier in the corner shows what is under your finger (turn it off in the menu).' : '. On a computer, scroll to zoom and use the arrow keys to move one square.') + '</li>' +
      '<li>Round mazes start at the edge and finish in the middle.</li></ul>' +
      '<h3>Labyrinth</h3><ul>' +
      '<li>A wooden box with a steel ball. <b>Tilt</b> your phone or iPad to roll the ball to the gold-ringed hole at the finish.</li>' +
      '<li>No tilting (or on a computer)? <b>Drag</b> on the board to tip it that way, or use the arrow keys.</li>' +
      '<li>With <b>holes</b> on, drop into one and the ball goes back to the start. The holes are only on the wrong turns.</li>' +
      '<li>Hold the phone the way you like and use <b>Level the board</b> in the menu to make that flat.</li></ul>' +
      '<h3>Hints and times</h3><ul>' +
      '<li><b>Hint</b> shows the next few steps in blue (backing up first if you are off the route). Each hint adds 5 to 20 seconds, more on bigger mazes.</li>' +
      '<li><b>Reveal</b> shows the whole way out and ends the maze without a time.</li>' +
      '<li>Your time, with hint seconds added, goes on the best-times board for that size.</li></ul>' +
      '<h3>Daily maze</h3><p>One new maze every day, the same for everyone: small on Mondays, biggest on Saturdays. Solve it each day to build a streak.</p>'
  });

  // ── State ────────────────────────────────────────────────────────────────
  // S: {mode, size, shape, paths, holes, seed, daily, replay, name, head, ms, hints, pen, wrong, drawn, U:[heads],
  //     started (ts), going (clock running), done, solved, revealed, falls, ball:{x,y}}
  var S = null, M = null, onPath = null, pathList = [];
  function live() { return !!(S && !S.done); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dayLabel(day, long) { var d = new Date(day + 'T12:00:00'); return d.toLocaleDateString(undefined, long ? { weekday: 'long', month: 'short', day: 'numeric' } : { weekday: 'short', month: 'short', day: 'numeric' }); }
  function secsOf() { return Math.round((S.ms / 1000 + S.pen) * 10) / 10; }
  function clock(sec, tenths) {
    sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec - m * 60;
    return m + ':' + (s < 10 ? '0' : '') + (tenths ? s.toFixed(1) : String(Math.floor(s)));
  }
  function mazeName(o) { o = o || S; return o.mode === 'tilt' ? 'Labyrinth · ' + MC.SIZES[o.size].name : MC.SIZES[o.size].name + ' ' + (o.shape === 'round' ? 'round' : 'square'); }
  function myName() {
    var n = ''; try { var g = JSON.parse(lsGet('gn_setup_mazes', '{}')); n = g && g.names && g.names[0] || ''; } catch (e) {}
    return n || lsGet('my_name', '').trim() || 'You';
  }

  // ── History, best times, streak ──────────────────────────────────────────
  function hist() { try { return GameHistory.load(HKEY) || []; } catch (e) { return []; } }
  function cleanSolve(e) { return e && e.solved && !e.revealed && !e.replay && e.secs > 0; }
  function bestOf(mode, size) { var b = 0; hist().forEach(function (e) { if (cleanSolve(e) && (e.play || 'pencil') === mode && e.size === size && (!b || e.secs < b)) b = e.secs; }); return b; }
  var hiTop = {};
  function boardBest(mode, size) {

    cv.addEventListener('pointerdown', function (e) {
      if (!S || S.done || e.button > 0) return;
      ac(); try { cv.setPointerCapture(e.pointerId); } catch (x) {}
      origin = { x: e.clientX, y: e.clientY, id: e.pointerId }; dragTilt = { x: 0, y: 0 };
      if (!stickEl) { stickEl = el('div', { class: 'stick', 'aria-hidden': 'true' }, [el('i')]); document.body.appendChild(stickEl); }
      stickEl.style.display = ''; stickEl.style.left = e.clientX + 'px'; stickEl.style.top = e.clientY + 'px'; stickEl.firstChild.style.transform = '';
    });
    cv.addEventListener('pointermove', function (e) {
      if (!origin || e.pointerId !== origin.id) return;
      var dx = (e.clientX - origin.x) / 46, dy = (e.clientY - origin.y) / 46, l = Math.hypot(dx, dy);
      if (l > 1) { dx /= l; dy /= l; }
      dragTilt = { x: dx, y: dy };
      stickEl.firstChild.style.transform = 'translate(' + (dx * 28) + 'px,' + (dy * 28) + 'px)';
    });
    function up(e) { if (!origin || e.pointerId !== origin.id) return; origin = null; dragTilt = null; if (stickEl) stickEl.style.display = 'none'; }
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  }
  function keyTilt(key, dir, down) {
    if (down && dir) keysDown[key] = dir; else delete keysDown[key];
    var x = 0, y = 0; Object.keys(keysDown).forEach(function (k) { x += keysDown[k][0]; y += keysDown[k][1]; });
    keyT = { x: Math.max(-1, Math.min(1, x)) * 0.75, y: Math.max(-1, Math.min(1, y)) * 0.75 };
    if (down) ac();
  }

  var rz; window.addEventListener('resize', function () {
    clearTimeout(rz); rz = setTimeout(function () { if (!S || !stage || !stage.isConnected) return; if (S.mode === 'tilt') layoutTilt(); else layoutPencil(); }, 150);
  });

  // ── Test hooks ─────────────────────────────────────────────────────────
  window.__maze = {
    state: function () { return S && JSON.parse(JSON.stringify(S)); },
    maze: function () { return M; },
    seed: function () { return S && S.seed; },
    path: function () { return pathList.slice(); },
    solve: function () { if (!live()) return; if (S.mode === 'tilt') { ball.x = M.finish % M.cols + 0.5; ball.y = Math.floor(M.finish / M.cols) + 0.5; } else moveTo(M.finish, true); },
    move: function (c) { return moveTo(c); },
    cellXY: function (c) { var p = MC.center(M, c, tr), r = svg.getBoundingClientRect(); return [r.left + (p[0] - view.x) * pxu, r.top + (p[1] - view.y) * pxu]; },
    view: function () { return { view: view, pxu: pxu, fit: fitPxu, tr: tr }; },
    hint: hint, reveal: reveal, undo: undo,
    tilt: function (x, y) { tiltIn = { x: x, y: y }; },
    ball: function () { return ball && { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, state: ball.state, cell: ballCell() }; },
    place: function (x, y) { ball.x = x; ball.y = y; ball.vx = ball.vy = 0; ball.state = 'roll'; },
    holes: function () { return holes.slice(); },
    daily: function (d) { return MC.daily(d || today()); },
    newGame: function (o) { newGame(o); },
    setup: function () { leave(); showSetup(); },
    lab: function () { return { follow: follow, cellPx: cellPx, tr: tr }; },
    stepDir: function (a, b) { return stepDir(a, b); },
    centerHead: function () { centerOn(MC.center(M, S.head, tr)); }
  };

  // ── Boot ───────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  var going = saved && saved.v === 1 && MC.SIZES[saved.size] && !saved.done && typeof saved.head === 'number';
  function resumeSaved() {
    S = saved; M = MC.make(S);
    if (S.head < 0 || S.head >= M.n) S.head = M.start;
    S.U = Array.isArray(S.U) ? S.U.filter(function (x) { return x >= 0 && x < M.n; }) : [];
    if (S.ball && !(S.ball.x > 0 && S.ball.y > 0 && S.ball.x < M.cols && S.ball.y < M.rows)) S.ball = null;
    build();
  }
  // ?daily=1 (the Daily puzzles list on the home screen): straight into today's maze
  if (/[?&]daily=1/.test(location.search)) {
    try { history.replaceState(history.state, '', location.pathname + location.search.replace(/([?&])daily=1&?/, '$1').replace(/[?&]$/, '') + location.hash); } catch (e) {}
    if (going && saved.daily === today()) resumeSaved();
    else if (dailyDone(today())) showSetup();
    else if (going && saved.ms > 5000) Kit.confirm("Start today's maze?", { ok: 'Start daily', cancel: 'Keep going', body: 'The maze you have going will be dropped.' }).then(function (ok) { if (ok) startDaily(); else resumeSaved(); });
    else startDaily();
  } else if (going) resumeSaved();
  else showSetup();
})();
</script>

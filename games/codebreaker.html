<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mastermind</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.stage{padding-bottom:calc(var(--safe-b) + 10px);}
.cb{--pg:34px;--rh:43px;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px;-webkit-user-select:none;user-select:none;}
.cb.p5{--pg:30px;--rh:38px;}
.top{display:flex;align-items:center;gap:8px;min-height:38px;}
.top .turn{flex:1;margin:0;min-height:38px;font-size:1rem;line-height:1.15;text-align:center;}
.top .turn small{display:block;font-size:.74rem;font-weight:800;color:var(--text-3);}
.top .turn .dot{flex:none;}
.scores{padding:2px 2px 2px;}
.score{min-width:0;flex:1 1 0;flex-direction:row;justify-content:center;gap:8px;padding:6px 10px;}
.score .nm{max-width:none;}
.score .pt{font-size:1.2rem;}
.score .role{font-size:.64rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
.score .col{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.1;}
.score .col .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px;}

/* ── Board ─────────────────────────────────────────────────────────── */
.bd{position:relative;border-radius:20px;padding:8px 10px 10px;}
.bd::after{content:"";position:absolute;inset:4px;border-radius:16px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);}
.lane{display:grid;grid-template-columns:22px 1fr 38px;align-items:center;column-gap:8px;}
.holes{display:flex;justify-content:space-around;align-items:center;gap:4px;}
.num{font-family:var(--display);font-size:.8rem;color:rgba(255,236,210,.42);text-align:center;}
/* Code row + shield */
.coderow{position:relative;height:calc(var(--rh) + 14px);margin-bottom:6px;padding:0 0 4px;border-bottom:2px solid rgba(0,0,0,.35);box-shadow:0 1px 0 rgba(255,255,255,.08);}
.coderow .lane{height:100%;}
.coderow .tag{font-size:.56rem;font-weight:900;letter-spacing:.08em;color:rgba(255,236,210,.45);text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);justify-self:center;}
.coderow .lock{justify-self:center;color:rgba(255,236,210,.4);}
.coderow .lock .ico{width:18px;height:18px;}
.shield{position:absolute;left:28px;right:44px;top:2px;bottom:6px;border-radius:10px 10px 6px 6px;transform-origin:50% 0;z-index:3;
  background:linear-gradient(180deg,#3d4350 0%,#272b35 55%,#1b1e26 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.4),0 4px 8px rgba(0,0,0,.5);
  display:grid;place-items:center;transition:transform .75s cubic-bezier(.3,1.35,.5,1),opacity .4s;backface-visibility:visible;}
.shield span{font-family:var(--display);font-size:1rem;letter-spacing:.32em;color:rgba(255,255,255,.18);text-shadow:0 -1px 0 rgba(0,0,0,.6);padding-left:.32em;}
.shield::before{content:"";position:absolute;left:8%;right:8%;top:4px;height:6px;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);}
.shield.smoked{background:linear-gradient(180deg,rgba(60,68,84,.55),rgba(25,28,36,.6));}
.shield.smoked span{display:none;}
.shield.open{transform:perspective(420px) rotateX(-84deg) translateY(-6px);opacity:.92;}
.shield.flip{animation:flipup .9s cubic-bezier(.3,1.3,.5,1) both;}
@keyframes flipup{0%{transform:none;}35%{transform:perspective(420px) rotateX(12deg);}100%{transform:perspective(420px) rotateX(-84deg) translateY(-6px);}}
.shield.shut{animation:shut .55s cubic-bezier(.5,0,.6,1.4) both;}
@keyframes shut{from{transform:perspective(420px) rotateX(-84deg) translateY(-6px);}to{transform:none;}}

/* Guess rows */
.rows{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;border-radius:12px;scroll-behavior:smooth;}
.rows::-webkit-scrollbar{display:none;}
.grw{height:var(--rh);position:relative;border-radius:12px;transition:background .25s;}
.grw + .grw{margin-top:1px;}
.grw::after{content:"";position:absolute;left:30px;right:46px;bottom:-1px;height:1px;background:rgba(0,0,0,.22);box-shadow:0 1px 0 rgba(255,255,255,.05);}
.grw.cur{background:rgba(255,230,170,.13);box-shadow:inset 0 0 0 2px rgba(255,214,120,.45);}
.grw.cur .num{color:#ffd88a;}
.grw.fut .hole{opacity:.6;}
.hole{position:relative;width:var(--pg);height:var(--pg);flex:none;border-radius:50%;display:grid;place-items:center;border:0;padding:0;background:none;}
.hole::before{content:"";width:42%;height:42%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#0c0805,#1d130c);box-shadow:inset 0 2px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.14);}
button.hole{cursor:pointer;}
.hole.act::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #ffd88a;box-shadow:0 0 10px rgba(255,214,120,.7);animation:glow 1s ease-in-out infinite alternate;}
@keyframes glow{from{opacity:.5;transform:scale(.94);}to{opacity:1;transform:scale(1.04);}}
.hole .peg{position:absolute;inset:0;}

/* Pegs: glossy plastic heads, seen from above */
.peg{--c:#e8323c;--k:rgba(0,0,0,.5);width:var(--pg);height:var(--pg);border-radius:50%;display:grid;place-items:center;
  background:
    radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 24%),
    radial-gradient(circle at 66% 76%,rgba(255,255,255,.28) 0 6%,rgba(255,255,255,0) 20%),
    radial-gradient(circle at 44% 40%,color-mix(in srgb,var(--c) 62%,#fff) 0%,var(--c) 46%,color-mix(in srgb,var(--c) 55%,#000) 100%);
  box-shadow:0 3px 4px rgba(0,0,0,.55),inset 0 -2px 3px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.25);}
.peg svg{width:52%;height:52%;fill:none;stroke:var(--k);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;display:none;}
.sym .peg svg{display:block;}
.peg.blank{background:radial-gradient(circle at 40% 35%,#6b5a4b,#3d3128 70%,#2a211b);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 2px rgba(255,236,210,.25);}
.peg.blank::after{content:"";width:46%;height:3px;border-radius:2px;background:rgba(255,236,210,.45);}
.peg.pop{animation:pegpop .3s var(--spring);}
@keyframes pegpop{0%{transform:scale(.3) translateY(-8px);opacity:.3;}100%{transform:none;opacity:1;}}

/* Key pegs */
.keys{display:grid;grid-template-columns:repeat(2,12px);grid-auto-rows:12px;gap:3px;justify-content:center;align-content:center;}
.keys.k5{grid-template-columns:repeat(3,10px);grid-auto-rows:10px;gap:2px;}
.kh{position:relative;border-radius:50%;display:grid;place-items:center;}
.kh::before{content:"";width:46%;height:46%;border-radius:50%;background:#0c0805;box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.12);}
.kp{position:absolute;inset:0;border-radius:50%;}
.kp.b{background:radial-gradient(circle at 35% 30%,#ffb3b3 0 8%,#e0242f 40%,#7d0c14 100%);box-shadow:0 1px 2px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.22);}
.kp.w{background:radial-gradient(circle at 35% 30%,#fff 0 12%,#eeeae0 40%,#a9a294 100%);box-shadow:0 1px 2px rgba(0,0,0,.7);}
.kp.pop{animation:kpop .28s var(--spring);}
@keyframes kpop{0%{transform:scale(2.2);opacity:0;}100%{transform:none;opacity:1;}}
.grw.solved{background:rgba(120,255,170,.12);box-shadow:inset 0 0 0 2px rgba(120,255,170,.45);}

/* ── Tray ──────────────────────────────────────────────────────────── */
.tray{border-radius:20px;padding:7px;}
.tray-in{position:relative;border-radius:14px;padding:9px 8px 10px;display:flex;flex-direction:column;gap:9px;}
.pal{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap;}
.pal .tp{--pg:36px;flex:0 1 46px;height:46px;min-width:0;border:0;padding:0;background:none;display:grid;place-items:center;border-radius:50%;touch-action:none;position:relative;}
.pal .tp::before{content:"";position:absolute;width:40px;height:40px;max-width:100%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.28);box-shadow:inset 0 3px 6px rgba(0,0,0,.55);}
.cb.c9 .pal .tp{--pg:31px;}
.cb.c9 .pal .tp::before{width:35px;height:35px;}
.pal .tp .peg{position:relative;transition:transform .2s var(--spring),opacity .2s;}
.pal .tp:active .peg{transform:scale(.9);}
.pal .tp.used .peg{opacity:.28;filter:saturate(.4);}
.acts{display:flex;gap:8px;}
.acts .btn{min-height:46px;}
.acts .grow{flex:1;}
.acts .btn-soft .ico{width:18px;height:18px;}
.acts .sq{flex:none;width:52px;padding:0;}
.res{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;}
.res .msg{font-weight:900;font-size:1.02rem;color:#fff;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.4);}
.res .msg small{display:block;font-weight:700;font-size:.82rem;color:rgba(255,255,255,.75);margin-top:2px;}
.think{display:flex;align-items:center;justify-content:center;gap:10px;min-height:46px;font-weight:900;color:rgba(255,255,255,.9);}
.think .ico{width:22px;height:22px;}
.think i{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-3px);}}
.legend{display:flex;justify-content:center;gap:14px;font-size:.72rem;font-weight:800;color:var(--text-3);}
.legend span{display:flex;align-items:center;gap:5px;}
.legend i{position:relative;width:11px;height:11px;border-radius:50%;}

/* Drag ghost */
.dragpeg{position:fixed;z-index:300;pointer-events:none;--pg:40px;margin:-20px 0 0 -20px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5));}
.hole.over::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #fff;}

.rules .kx{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin:0 2px;}
.rules .kx.b{background:#e0242f;box-shadow:0 0 0 1px #888;}
.rules .kx.w{background:#f2eee4;box-shadow:0 0 0 1px #888;}

/* iPad: bigger pegs and board; landscape puts scores, status and the peg tray beside the board */
@media (min-width:700px) and (orientation:portrait){
  #app.stage.ipl{max-width:720px;}
  .cb{--pg:46px;--rh:56px;max-width:600px;gap:10px;}
  .cb.p5{--pg:42px;--rh:52px;}
  .lane{grid-template-columns:28px 1fr 46px;}
  .num{font-size:.95rem;}
  .keys{grid-template-columns:repeat(2,15px);grid-auto-rows:15px;gap:4px;}
  .keys.k5{grid-template-columns:repeat(3,13px);grid-auto-rows:13px;}
  .shield{left:34px;right:52px;}
  .pal{gap:8px;}
  .pal .tp{--pg:46px;flex:0 1 58px;height:58px;}
  .pal .tp::before{width:52px;height:52px;}
  .cb.c9 .pal .tp{--pg:40px;}
  .cb.c9 .pal .tp::before{width:46px;height:46px;}
  .acts .btn{min-height:52px;}
  .score .col .nm{max-width:220px;}
}
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  #app.stage.ipl{max-width:none;}
  .cb{--pg:42px;--rh:50px;max-width:none;display:grid;grid-template-columns:minmax(0,540px) minmax(300px,380px);
    grid-template-areas:"b s" "b t" "b y" "b .";grid-template-rows:auto auto auto 1fr;column-gap:28px;row-gap:12px;justify-content:center;align-items:start;}
  .cb.p5{--pg:38px;--rh:46px;}
  .cb>.scores{grid-area:s;flex-direction:column;}
  .cb>.top{grid-area:t;}
  .cb>.bd{grid-area:b;}
  .cb>.tray{grid-area:y;}
  .lane{grid-template-columns:26px 1fr 44px;}
  .num{font-size:.9rem;}
  .keys{grid-template-columns:repeat(2,14px);grid-auto-rows:14px;gap:4px;}
  .keys.k5{grid-template-columns:repeat(3,12px);grid-auto-rows:12px;}
  .shield{left:32px;right:50px;}
  .pal{flex-wrap:wrap;gap:6px;}
  .pal .tp{--pg:44px;flex:0 0 52px;height:52px;}
  .pal .tp::before{width:50px;height:50px;}
  .acts .btn{min-height:52px;}
  .score .col .nm{max-width:220px;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var KEY = 'codebreaker', SAVE = 'codebreaker_state', SYM = 'codebreaker_symbols';

  // Peg colors. Each also has a shape for color-blind play (menu toggle).
  var PEGS = [
    { n: 'Red', c: '#e8323c', k: 'rgba(0,0,0,.5)', s: '<path d="M12 4.5 20 18.5H4z"/>' },
    { n: 'Orange', c: '#ff8a1f', k: 'rgba(0,0,0,.5)', s: '<rect x="5.5" y="5.5" width="13" height="13" rx="1.5"/>' },
    { n: 'Yellow', c: '#ffd23a', k: 'rgba(0,0,0,.5)', s: '<circle cx="12" cy="12" r="6.5"/>' },
    { n: 'Green', c: '#27b856', k: 'rgba(0,0,0,.55)', s: '<path d="M12 4.5v15M4.5 12h15"/>' },
    { n: 'Blue', c: '#2f78ff', k: 'rgba(255,255,255,.85)', s: '<path d="M12 3.5 20.5 12 12 20.5 3.5 12z"/>' },
    { n: 'Purple', c: '#9a4dff', k: 'rgba(255,255,255,.85)', s: '<path d="M12 3.8l2.5 5.2 5.6.7-4.1 3.9 1.1 5.6L12 16.4l-5.1 2.8 1.1-5.6-4.1-3.9 5.6-.7z"/>' },
    { n: 'Pink', c: '#ff6fb5', k: 'rgba(0,0,0,.5)', s: '<path d="M12 19.5s-7.5-4.6-7.5-9.6A4 4 0 0 1 12 8a4 4 0 0 1 7.5 1.9c0 5-7.5 9.6-7.5 9.6z"/>' },
    { n: 'White', c: '#f2efe8', k: 'rgba(0,0,0,.5)', s: '<path d="M6 6l12 12M18 6 6 18"/>' }
  ];
  var DIFF = {
    easy: { label: 'Easy', pegs: 4, colors: 6, dup: false, rows: 10 },
    classic: { label: 'Classic', pegs: 4, colors: 6, dup: true, rows: 10 },
    hard: { label: 'Hard', pegs: 5, colors: 8, dup: true, rows: 12 }
  };
  var MODES = { solo: 'Solo', '2p': 'Two players', watch: 'Computer breaks' };

  Kit.init({
    id: KEY,
    mark: false,
    theme: { wood: ['#5a3b26', '#33200f'], felt: ['#5b2230', '#3d1420', '#2b0d16'] },
    onNew: function () { clearSave(); showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'eye', label: function () { return symOn() ? 'Color shapes: on' : 'Color shapes: off'; }, onClick: function () { setSym(!symOn()); Kit.toast(symOn() ? 'Shapes on every peg' : 'Shapes hidden'); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Mastermind: past games' }); } }
    ],
    rules:
      '<p class="goal">Crack the secret color code in as few guesses as you can.</p>' +
      '<h3>The secret code</h3><ul>' +
      '<li>The codemaker hides a row of colored pegs behind the shield.</li>' +
      '<li><b>Classic:</b> 4 pegs from 6 colors. Colors can repeat. You get 10 guesses.</li>' +
      '<li><b>Easy:</b> 4 pegs, 6 colors, no repeats. <b>Hard:</b> 5 pegs, 8 colors, 12 guesses.</li>' +
      '<li><b>Blanks</b> (optional): an empty spot counts as one more "color".</li></ul>' +
      '<h3>Making a guess</h3><ul>' +
      '<li>Tap a color in the tray: it goes into the glowing hole. Tap a hole to pick it, tap again to change its color. You can also drag pegs.</li>' +
      '<li>When the row is full, tap <b>Check</b>.</li></ul>' +
      '<h3>The little pegs</h3><ul>' +
      '<li><span class="kx b"></span> <b>Red</b>: one of your pegs is the right color in the right spot.</li>' +
      '<li><span class="kx w"></span> <b>White</b>: one of your pegs is the right color but in the wrong spot.</li>' +
      '<li>No little peg: that color is not needed there at all (or not that many of it).</li>' +
      '<li>The little pegs do not tell you <i>which</i> of your pegs they mean. That is the puzzle!</li>' +
      '<li>Repeats count fairly: guess two reds when the code has one red, and only one of them earns a little peg.</li></ul>' +
      '<p>Four red pegs (five on Hard) means you cracked it. The shield flips open either way at the end.</p>' +
      '<h3>Two players</h3><ul>' +
      '<li>One player sets the code in secret while the other looks away, then hands over the phone. Hold the button for 3 seconds to take your turn.</li>' +
      '<li>The codemaker scores <b>1 point for every guess</b> the breaker makes, plus <b>1 bonus point</b> if the code is never cracked.</li>' +
      '<li>Swap roles every round. Play 2, 4 or 6 rounds; most points wins.</li></ul>' +
      '<h3>Computer breaks</h3><p>You set a code and watch the computer crack it, one guess at a time. It plays a clever strategy: on Classic it never needs more than 5 guesses.</p>' +
      '<h3>Tips</h3><ul><li>Start with something like two of one color and two of another.</li><li>Every new guess should fit all the clues so far.</li><li>Color shapes in the menu add a symbol to every peg.</li></ul>'
  });

  // ── Preferences ──────────────────────────────────────────────────────────
  function symOn() { try { return localStorage.getItem(SYM) === '1'; } catch (e) { return false; } }
  function setSym(on) { try { localStorage.setItem(SYM, on ? '1' : '0'); } catch (e) {} document.body.classList.toggle('sym', on); }
  document.body.classList.toggle('sym', symOn());

  // ── State ────────────────────────────────────────────────────────────────
  // S = {mode, diff, blanks, P (pegs), C (colors), K (symbols incl. blank), dup, R (rows),
  //   players:[{name,cpu}], total (rounds), round, scores:[a,b], log:[{maker,breaker,n,cracked,code}],
  //   maker, breaker, code:[], guesses:[{g:[],b,w}], cur:[], act, stack:[{i,prev}],
  //   phase:'make'|'break'|'reveal'|'over', pass:null|'make'|'break', perm (solver), started}
  var S = null, tok = 0, busy = false, flash = -1, keyAnim = -1, shieldAnim = '';
  function later(fn, ms) { var t = tok; setTimeout(function () { if (t === tok && S) fn(); }, ms); }
  function save() {
    if (!S) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S.phase === 'over') return;
    var lbl = DIFF[S.diff].label;
    if (S.mode === '2p') lbl = 'Round ' + (S.round + 1) + ' of ' + S.total + ' · ' + lbl;
    else if (S.phase === 'break') lbl = 'Guess ' + (S.guesses.length + 1) + ' of ' + S.R + ' · ' + lbl;
    Kit.resume.set(lbl);
  }
  function clearSave() { tok++; busy = false; try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  function showSetup() {
    S = null; tok++; busy = false;
    app.classList.remove('ipl');
    Kit.setup(app, {
      modes: [
        { id: 'solo', icon: 'user', title: 'Crack the code', desc: 'The computer hides a code. Can you break it?' },
        { id: '2p', icon: 'users', title: 'Two players', desc: 'Take turns making and breaking codes' },
        { id: 'watch', icon: 'bot', title: 'Computer breaks', desc: 'You set a code, watch the computer crack it' }
      ],
      options: [
        { id: 'diff', label: 'Difficulty', value: 'classic', choices: [['easy', 'Easy', '4 pegs from 6 colors, no repeats, 10 guesses.'], ['classic', 'Classic', '4 pegs from 6 colors, colors can repeat, 10 guesses. Like the real Mastermind.'], ['hard', 'Hard', '5 pegs from 8 colors, colors can repeat, 12 guesses.']] },
        { id: 'blanks', label: 'Blanks allowed in the code', help: 'A blank is an empty hole that can be part of the secret code.', value: 'no', choices: [['no', 'No', 'Every hole in the code has a colored peg.'], ['yes', 'Yes', 'The code can have empty holes too, which makes it harder to crack.']] },
        { id: 'rounds', label: 'Rounds', value: 2, choices: [[2, '2'], [4, '4'], [6, '6']], when: function (m) { return m === '2p'; } }
      ],
      players: {
        min: 1, max: 2,
        range: function (m) { return m === 'solo' ? [1, 1] : [2, 2]; },
        cpu: function (m) { return m === 'watch' ? 'seats' : false; }
      },
      onStart: function (cfg) {
        var d = DIFF[cfg.options.diff] || DIFF.classic, blanks = cfg.options.blanks === 'yes';
        S = {
          mode: cfg.mode, diff: cfg.options.diff in DIFF ? cfg.options.diff : 'classic', blanks: blanks,
          P: d.pegs, C: d.colors, K: d.colors + (blanks ? 1 : 0), dup: d.dup, R: d.rows,
          players: cfg.players.map(function (p) { return { name: cfg.mode === 'solo' && p.name === 'Player 1' ? 'You' : p.name, cpu: p.cpu }; }),
          total: cfg.mode === '2p' ? (+cfg.options.rounds || 2) : 1,
          round: 0, scores: [0, 0], log: [], started: Date.now()
        };
        Kit.gameStart();
        startRound();
      }
    });
  }

  function emptyRow() { var a = []; for (var i = 0; i < S.P; i++) a.push(null); return a; }
  function randomCode() {
    var out = [], pool = [];
    for (var c = 0; c < S.K; c++) pool.push(c);
    for (var i = 0; i < S.P; i++) {
      if (S.dup) out.push(Math.floor(Math.random() * S.K));
      else out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }

  // ── Computer codebreaker ────────────────────────────────────────────────

      next: function (first) {

    for (var r = S.R - 1; r >= 0; r--) (function (r) {
      var gr = S.guesses[r], isCur = r === curRow;
      var row = el('div', { class: 'grw' + (isCur ? ' cur' : '') + (r > curRow && !gr && curRow >= 0 ? ' fut' : '') + (gr && gr.b === S.P ? ' solved' : ''), 'data-r': r });
      var ln = el('div', { class: 'lane' }), hs = el('div', { class: 'holes' });
      ln.style.height = '100%';
      ln.appendChild(el('span', { class: 'num', text: String(r + 1) }));
      for (var i = 0; i < S.P; i++) (function (i) {
        var mine = isCur && myTurn();
        var val = gr ? gr.g[i] : isCur ? S.cur[i] : null;
        var h = el(mine ? 'button' : 'span', { type: mine ? 'button' : null, class: 'hole' + (mine && S.act === i ? ' act' : ''), 'data-i': mine ? i : null, 'aria-label': mine ? 'Hole ' + (i + 1) : null });
        if (val != null) h.appendChild(peg(val, isCur && flash === i ? 'pop' : ''));
        if (mine) h.addEventListener('click', function () { tapHole(i); });
        hs.appendChild(h);
      })(i);
      ln.appendChild(hs);
      ln.appendChild(keyBox(gr, keyAnim === r));
      row.appendChild(ln);
      rows.appendChild(row);
    })(r);
    bd.appendChild(rows);
    cb.appendChild(bd);
    flash = -1;

    // Tray
    var tray = el('div', { class: 'tray wood' }), tin = el('div', { class: 'tray-in felt-in' });
    tray.appendChild(tin);
    cb.appendChild(tray);
    if (S.phase === 'reveal' || S.phase === 'over') tin.appendChild(resultPanel());
    else if (!myTurn() && S.phase === 'break' && S.players[S.breaker] && S.players[S.breaker].cpu) {
      tin.appendChild(el('div', { class: 'think', html: Kit.icon('bot') + '<span>' + Kit.esc(S.players[S.breaker].name) + ' is thinking</span><span><i></i><i></i><i></i></span>' }));
      tin.appendChild(legend());
    } else {
      var pal = el('div', { class: 'pal' });
      for (var c = 0; c < S.K; c++) (function (c) {
        var used = !S.dup && rowUses(c, -1);
        var b = el('button', { type: 'button', class: 'tp' + (used ? ' used' : ''), 'aria-label': c === S.C ? 'Blank' : PEGS[c].n }, [peg(c)]);
        dragify(b, c);
        pal.appendChild(b);
      })(c);
      tin.appendChild(pal);
      var full = S.cur.every(function (x) { return x != null; }), any = S.cur.some(function (x) { return x != null; });
      var acts = el('div', { class: 'acts' });
      acts.appendChild(el('button', { type: 'button', class: 'btn btn-soft sq', 'aria-label': 'Undo last peg', html: Kit.icon('undo'), disabled: !S.stack.length || busy, onclick: undo }));
      if (S.phase === 'make') {
        acts.appendChild(el('button', { type: 'button', class: 'btn btn-soft sq', 'aria-label': 'Random code', html: Kit.icon('shuffle'), disabled: busy, onclick: randomFill }));
        acts.appendChild(el('button', { type: 'button', class: 'btn btn-primary grow', html: Kit.icon('check') + '<span>Hide the code</span>', disabled: !full || busy, onclick: lockCode }));
      } else {
        acts.appendChild(el('button', { type: 'button', class: 'btn btn-soft sq', 'aria-label': 'Clear the row', html: Kit.icon('close'), disabled: !any || busy, onclick: clearRow }));
        acts.appendChild(el('button', { type: 'button', class: 'btn btn-primary grow', html: Kit.icon('check') + '<span>Check</span>', disabled: !full || busy, onclick: function () { submit(false); } }));
      }
      tin.appendChild(acts);
    }

    fit(rows, tray, st);
  }
  function legend() {
    return el('div', { class: 'legend' }, [
      el('span', null, [el('i', { class: 'kp b' }), document.createTextNode('right spot')]),
      el('span', null, [el('i', { class: 'kp w' }), document.createTextNode('wrong spot')])
    ]);
  }
  function paintTurn(t) {
    var ps = S.players, txt = '', sub = '', c = '#ffd88a';
    if (S.phase === 'make') {
      txt = (S.mode === 'watch' ? 'Set a secret code' : ps[S.maker].name + ', set the code');
      sub = S.mode === 'watch' ? 'The computer will try to crack it' : DIFF[S.diff].label + ': ' + S.P + ' pegs' + (S.dup ? ', repeats allowed' : ', no repeats');
      c = Kit.color(S.maker);
    } else if (S.phase === 'break') {
      var b = ps[S.breaker];
      txt = S.mode === 'solo' ? 'Guess ' + (S.guesses.length + 1) + ' of ' + S.R : b.cpu ? b.name + ': guess ' + (S.guesses.length + 1) : b.name + ': guess ' + (S.guesses.length + 1) + ' of ' + S.R;
      sub = S.mode === '2p' ? 'Round ' + (S.round + 1) + ' of ' + S.total + ' · breaking ' + ps[S.maker].name + "'s code" : DIFF[S.diff].label + (S.blanks ? ' with blanks' : '');
      c = S.mode === 'solo' ? '#ffd88a' : Kit.color(S.breaker);
    } else {
      var r = S.result || {};
      txt = r.cracked ? 'Cracked in ' + r.n + '!' : 'Code unbroken';
      sub = S.mode === '2p' ? 'Round ' + (S.round + 1) + ' of ' + S.total : DIFF[S.diff].label + (S.blanks ? ' with blanks' : '');
    }
    t.style.setProperty('--c', c);
    if (S.phase !== 'reveal' && S.phase !== 'over') t.appendChild(el('span', { class: 'dot' }));
    t.appendChild(el('span', null, [document.createTextNode(txt), el('small', { text: sub })]));
  }
  function resultPanel() {
    var r = S.result || { n: 0 }, ps = S.players, box = el('div', { class: 'res' }), msg, small;
    if (S.mode === '2p') {
      var mk = ps[S.maker].name, br = ps[S.breaker].name, pts = r.n + (r.cracked ? 0 : 1);
      msg = r.cracked ? br + ' cracked it in ' + r.n : br + ' could not crack it';
      small = mk + ' scores ' + pts + ' point' + (pts === 1 ? '' : 's') + (r.cracked ? '' : ' (with the bonus)');
      if (S.phase === 'reveal') small += '. Next, ' + br + ' makes the code.';
    } else if (S.mode === 'watch') {
      msg = r.cracked ? ps[1].name + ' cracked it in ' + r.n : 'Your code beat the computer!';
      small = 'Your code scored ' + S.scores[0] + ' points';
    } else {
      msg = r.cracked ? 'You cracked it in ' + r.n + '!' : 'Out of guesses';
      small = r.cracked ? 'Nice code breaking' : 'There is the secret code, up top';
    }
    box.appendChild(el('div', { class: 'msg' }, [document.createTextNode(msg), el('small', { text: small })]));
    if (S.phase === 'reveal' && S.mode === '2p') {
      box.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-block', html: Kit.icon('swap') + '<span>Next round</span>', onclick: function () { Kit.sfx('pop'); nextRound(); } }));
    } else if (S.phase === 'over') {
      box.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-block', html: Kit.icon('sparkle') + '<span>New game</span>', onclick: function () { clearSave(); showSetup(); } }));
    }
    return box;
  }
  // Two players: cover the screen until the next player holds to go on
  var hoOpen = false;
  function renderPrivacy() {
    if (hoOpen) return;
    hoOpen = true;
    var ps = S.players, making = S.pass === 'make', wi = making ? S.maker : S.breaker, who = ps[wi], other = making ? ps[S.breaker] : ps[S.maker];
    Kit.handoff({
      name: who.name, color: Kit.color(wi), what: making ? 'code' : 'board',
      msg: making ? who.name + ' makes the secret code for round ' + (S.round + 1) + '. ' + other.name + ', look away!' : other.name + "'s code is hidden. " + who.name + ', crack it in ' + S.R + ' guesses or fewer.'
    }).then(function () {
      hoOpen = false;
      if (!S || !S.pass) return;
      var mk = S.pass === 'make';
      S.pass = null; if (mk) shieldAnim = 'open'; save(); render();
    });
  }

  // Board height: keep the tray on screen; the rows scroll inside the board
  function fit(rows, tray, st) {
    requestAnimationFrame(function () {
      if (!rows.isConnected) return;
      var top = rows.getBoundingClientRect().top + window.scrollY;
      // Landscape iPad: the tray sits beside the board, not under it
      var beside = tray.getBoundingClientRect().left >= rows.getBoundingClientRect().right;
      var below = (beside ? 0 : tray.offsetHeight + 8 /* gap */) + 10 /* board padding */ + 12;
      var safe = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-b')) || 0;
      var avail = window.innerHeight - top - below - safe;
      rows.style.maxHeight = Math.max(4 * rows.firstChild.offsetHeight, avail) + 'px';
      rows.style.scrollBehavior = 'auto';
      if (st != null) rows.scrollTop = st;
      rows.style.scrollBehavior = '';
      var cur = rows.querySelector('.grw.cur') || rows.querySelector('.grw[data-r="' + Math.max(0, S.guesses.length - 1) + '"]');
      if (cur) {
        var rt = cur.offsetTop - rows.offsetTop, h = cur.offsetHeight;
        if (rt < rows.scrollTop + 4 || rt + h > rows.scrollTop + rows.clientHeight - 4) rows.scrollTop = Math.max(0, rt - rows.clientHeight + h * 2);
      }
    });
  }
  window.addEventListener('resize', function () { var r = document.querySelector('.rows'), t = document.querySelector('.tray'); if (r && t && S) fit(r, t, r.scrollTop); });

  // Drag a peg from the tray onto a hole (a plain tap drops it in the glowing hole)
  function dragify(btn, c) {
    btn.addEventListener('pointerdown', function (e) {
      if (!myTurn()) return;
      if (!S.dup && rowUses(c, -1)) { Kit.toast('No repeats on Easy'); return; }
      var x0 = e.clientX, y0 = e.clientY, ghost = null, over = null, id = e.pointerId;
      try { btn.setPointerCapture(id); } catch (err) {}
      function target(x, y) {
        var t = document.elementFromPoint(x, y);
        var h = t && t.closest ? t.closest('button.hole') : null;
        return h;
      }
      function move(ev) {
        if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 8) {
          ghost = el('div', { class: 'dragpeg' }, [peg(c)]); document.body.appendChild(ghost);
        }
        if (!ghost) return;
        ev.preventDefault();
        ghost.style.left = ev.clientX + 'px'; ghost.style.top = (ev.clientY - 22) + 'px';
        var h = target(ev.clientX, ev.clientY - 22);
        if (h !== over) { if (over) over.classList.remove('over'); over = h; if (over) over.classList.add('over'); }
      }
      function up(ev) {
        btn.removeEventListener('pointermove', move); btn.removeEventListener('pointerup', up); btn.removeEventListener('pointercancel', cancel);
        if (ghost) {
          ghost.remove();
          var h = target(ev.clientX, ev.clientY - 22);
          if (h) place(+h.getAttribute('data-i'), c);
        } else tapColour(c);
      }
      function cancel() { btn.removeEventListener('pointermove', move); btn.removeEventListener('pointerup', up); btn.removeEventListener('pointercancel', cancel); if (ghost) ghost.remove(); }
      btn.addEventListener('pointermove', move); btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', cancel);
    });
    btn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapColour(c); } });
  }

  // For tests: the scoring rule and the solver
  window.CodeBreaker = { feedback: feedback, Solver: Solver };

  // ── Boot ────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.players && saved.phase && saved.phase !== 'over') {
    S = saved; busy = false;
    var lg = S.guesses && S.guesses[S.guesses.length - 1];
    // Saved just after the final guess: settle the round now
    if (S.phase === 'break' && lg && (lg.b === S.P || S.guesses.length >= S.R)) { S.phase = 'reveal'; S.result = { cracked: lg.b === S.P, n: S.guesses.length }; }
    if (S.phase === 'reveal') {
      render();
      if (S.log.length < S.round + 1) endRound();
      else if (S.log.length >= S.total) finish();
    } else {
      // Two players: the half-set code stays hidden until the codemaker holds to see it
      if (S.mode === '2p' && S.phase === 'make') S.pass = 'make';
      if (S.phase === 'make' && !S.pass) shieldAnim = 'open';
      save(); render(); cpuTurn();
    }
  } else showSetup();
})();
</script>
</body>
</html>

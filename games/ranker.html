<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranker</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
:root{--gold-a:#ffe27a;--gold-b:#e0a91a;--silver-a:#f4f6fb;--silver-b:#a9b0c2;--bronze-a:#f3b98a;--bronze-b:#b06a35;}
.stage{padding-bottom:calc(var(--safe-b) + 110px);}

/* ── Title ───────────────────────────────────────────────────────────── */
.rk-head{padding:2px 0 12px;}
.rk-title{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,8vw,2.3rem);line-height:1.08;letter-spacing:.005em;
  margin:0 -6px;padding:2px 6px;border-radius:10px;outline:none;cursor:text;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;}
.rk-title:focus{background:var(--w06);box-shadow:0 0 0 2px var(--accent);}
.rk-status{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.88rem;font-weight:700;color:var(--text-2);}
.rk-dot{width:9px;height:9px;border-radius:50%;background:var(--text-3);flex:none;}
.rk-dot.unsaved{background:var(--yellow);box-shadow:0 0 8px rgba(255,200,61,.7);}
.rk-dot.saved{background:var(--green);box-shadow:0 0 8px rgba(61,220,132,.5);}

/* ── Podium ──────────────────────────────────────────────────────────── */
.podium{border-radius:24px;padding:8px;margin-bottom:16px;}
.podium .felt-in{position:relative;border-radius:18px;padding:16px 10px 0;overflow:hidden;}
.pod{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:6px;}
.step{display:flex;flex-direction:column;align-items:center;min-width:0;}
.step .who{font-weight:900;font-size:.95rem;line-height:1.15;text-align:center;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;hyphens:auto;min-height:2.3em;padding:0 2px;margin-bottom:6px;}
.step.p2 .who,.step.p3 .who{font-size:.86rem;}
.step.p1 .who{font-size:1.02rem;}
.step.empty .who{color:rgba(255,255,255,.35);text-shadow:none;font-weight:700;}
.medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.35rem;color:#3a2600;margin-bottom:-14px;z-index:1;position:relative;
  background:radial-gradient(circle at 35% 30%,var(--ma) 0,var(--mb) 85%);box-shadow:0 0 0 3px rgba(255,255,255,.35) inset, 0 4px 8px rgba(0,0,0,.45);}
.step.p1 .medal{width:54px;height:54px;font-size:1.7rem;margin-bottom:-16px;}
.step.p1{--ma:var(--gold-a);--mb:var(--gold-b);}
.step.p2{--ma:var(--silver-a);--mb:var(--silver-b);}
.step.p3{--ma:var(--bronze-a);--mb:var(--bronze-b);}
.step.p2 .medal{color:#2b3040;}
.step.p3 .medal{color:#3a1c06;}
.step.empty .medal{opacity:.35;}
.block{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;padding-top:10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--mb) 60%,#fff) 0,var(--mb) 18%,color-mix(in srgb,var(--mb) 70%,#000) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5), inset 0 -6px 10px rgba(0,0,0,.25);}
.block span{font-family:var(--display);font-size:1.8rem;color:rgba(0,0,0,.22);text-shadow:0 1px 0 rgba(255,255,255,.35);}
.step.p1 .block{height:96px;}
.step.p2 .block{height:70px;}
.step.p3 .block{height:52px;}
.step.p3 .block span{font-size:1.4rem;}
.step.empty .block{opacity:.35;}
.step.new .medal{animation:medal .7s var(--spring);}
.step.new .who{animation:rise .5s var(--ease) both;}
@keyframes medal{0%{transform:translateY(-40px) scale(.4) rotate(-90deg);opacity:0;}100%{transform:none;opacity:1;}}

/* ── Duplicate warnings ──────────────────────────────────────────────── */
.dupes{display:flex;align-items:flex-start;gap:10px;padding:12px 8px 12px 14px;margin-bottom:12px;border-radius:14px;
  background:rgba(255,200,61,.1);box-shadow:inset 0 0 0 1px rgba(255,200,61,.3);font-size:.9rem;line-height:1.45;}
.dupes .ico{width:20px;height:20px;color:var(--yellow);flex:none;margin-top:1px;}
.dupes b{color:var(--yellow);}
.dupes .x{flex:none;width:40px;height:40px;margin:-10px 0;border:0;border-radius:50%;background:none;color:var(--text-3);display:grid;place-items:center;}
.dupes .x .ico{color:inherit;}

/* ── The list: paper tiles ───────────────────────────────────────────── */
.rk-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.rrow{position:relative;display:flex;align-items:center;gap:4px;min-height:58px;padding:6px 8px 6px 0;border-radius:14px;
  background:linear-gradient(180deg,#fffaf0,#f3ead6);color:#23233a;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 3px 0 #cfc2a3, 0 6px 14px rgba(0,0,0,.25);
  touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;will-change:transform;}
.rrow.anim{transition:transform .2s var(--ease);}
.rrow.lift{z-index:20;transition:box-shadow .15s, transform 0s;box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 3px 0 #cfc2a3, 0 22px 40px rgba(0,0,0,.55), 0 0 0 3px var(--accent);}
.rrow.drop{transition:transform .2s var(--ease), box-shadow .2s;}
.rrow.dup{box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 3px 0 #cfc2a3, 0 6px 14px rgba(0,0,0,.25), inset 4px 0 0 #e0a91a;}
.rrow.pressing{transform:scale(.985);transition:transform .35s ease;}
.grip{flex:none;width:40px;height:46px;display:grid;place-items:center;color:#b3a68a;cursor:grab;touch-action:none;}
.grip:active{color:#8a7a58;cursor:grabbing;}
.rk{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;
  color:#4a4660;background:rgba(60,50,30,.08);box-shadow:inset 0 0 0 2px rgba(60,50,30,.14);font-variant-numeric:tabular-nums;}
.rk.m1,.rk.m2,.rk.m3{color:#3a2600;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5), 0 2px 3px rgba(0,0,0,.25);}
.rk.m1{background:radial-gradient(circle at 35% 30%,var(--gold-a),var(--gold-b));}
.rk.m2{background:radial-gradient(circle at 35% 30%,var(--silver-a),var(--silver-b));color:#2b3040;}
.rk.m3{background:radial-gradient(circle at 35% 30%,var(--bronze-a),var(--bronze-b));color:#3a1c06;}
.nm{flex:1;min-width:0;padding:8px 8px;font-weight:800;font-size:1.05rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:8px;outline:none;cursor:text;}
.nm[contenteditable="true"]{white-space:normal;overflow-wrap:anywhere;background:#fff;box-shadow:0 0 0 2px var(--accent);-webkit-user-select:text;user-select:text;}
.dupb{flex:none;font-size:.68rem;font-weight:900;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:#f7de9a;color:#7a5200;}
.ed{display:none;gap:4px;flex:none;}
.edit .ed{display:flex;}
.ed button{width:40px;height:40px;border:0;border-radius:10px;background:rgba(60,50,30,.08);color:#4a4660;display:grid;place-items:center;}
.ed button:active{transform:scale(.9);}
.ed button:disabled{opacity:.25;}
.ed button.del{color:#c8102e;background:rgba(200,16,46,.1);}
.ed .ico{width:18px;height:18px;}
.swipebg{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;
  background:linear-gradient(90deg,transparent,rgba(255,77,94,.35) 50%,rgba(255,77,94,.75));color:#fff;font-weight:900;font-size:.85rem;letter-spacing:.04em;opacity:0;pointer-events:none;z-index:-1;}
.swipewrap{position:relative;isolation:isolate;}
.swipewrap.sw .swipebg{opacity:1;}
.swipewrap.go .swipebg{background:var(--red);}
.rk-empty{text-align:center;padding:28px 18px;border-radius:16px;border:2px dashed var(--w12);color:var(--text-2);line-height:1.5;}
.rk-empty b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--text);margin-bottom:4px;}

/* ── Add ─────────────────────────────────────────────────────────────── */
.add{display:flex;gap:8px;}
.add .input{flex:1;min-width:0;}
.add .input.warn{border-color:var(--yellow);}
.add .btn{flex:none;padding:0 18px;}
.suggest{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,200,61,.1);box-shadow:inset 0 0 0 1px rgba(255,200,61,.3);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.9rem;}
.suggest b{color:var(--yellow);}
.suggest .acts{margin-left:auto;display:flex;gap:6px;}
.hint{margin:12px 2px 0;font-size:.82rem;color:var(--text-3);line-height:1.45;}

/* ── Footer ──────────────────────────────────────────────────────────── */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 16px calc(12px + var(--safe-b));
  background:linear-gradient(rgba(20,16,41,0),var(--bg) 30%);}
.foot-in{max-width:588px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:10px;}
.foot .btn{min-height:54px;}
.foot .share{padding:0 18px;}
.btn.flash{--b:var(--green);--b-ink:#03290f;--b-lip:#1d8a4f;}

/* ── Sheets ──────────────────────────────────────────────────────────── */
.ls{display:flex;flex-direction:column;gap:8px;}
.ls-row{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 14px;min-height:62px;border-radius:14px;background:var(--w05);}
.ls-row.cur{box-shadow:inset 0 0 0 2px var(--accent);}
.ls-row .info{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 0;}
.ls-row .info b{display:block;font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ls-row .info small{display:block;color:var(--text-3);font-weight:700;font-size:.8rem;margin-top:2px;}
.ls-row .icon-btn.del{color:var(--red);}
.preview{border-radius:12px;padding:12px 16px 14px;max-height:42vh;overflow:auto;white-space:pre-wrap;font-family:var(--hand);font-size:1.25rem;line-height:28px;color:#23233a;
  background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(60,80,160,.18) 27px 28px) 0 12px,linear-gradient(180deg,#fffaf0,#f6eedb);}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);}
.setrow:first-child{border-top:0;}
.setrow .t{font-weight:800;}
.setrow small{display:block;color:var(--text-3);font-weight:600;font-size:.84rem;margin-top:3px;line-height:1.4;}
.snack{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:8px 8px 8px 16px;border-radius:999px;background:#fbf8ff;color:#1a1033;font-weight:800;
  box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .25s var(--spring),opacity .2s;}
.snack.show{transform:translate(-50%,0);opacity:1;pointer-events:auto;}
.snack span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.snack button{flex:none;border:0;border-radius:999px;min-height:40px;padding:0 16px;background:#1a1033;color:#fff;font-weight:900;}
.gbar .icon-btn.lists .ico{width:22px;height:22px;}

.rcol{display:contents;}
/* ── Wide landscape (iPad, laptop): title and podium on the left, the list on the right ── */
@media (orientation:landscape) and (min-width:900px) and (min-height:560px){
  #app.stage{max-width:1120px;display:flex;align-items:flex-start;gap:28px;}
  .rcol{display:block;}
  .rcol.a{flex:1 1 0;min-width:0;position:sticky;top:64px;}
  .rcol.b{flex:1 1 0;min-width:0;padding-top:6px;}
  .foot-in{max-width:1120px;padding-left:calc(50% + 14px);}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el, icon = Kit.icon, esc = Kit.esc;
  var app = document.getElementById('app');
  var KEY_LISTS = 'rklists', KEY_CUR = 'ranker_current';
  var GRIP = '<svg viewBox="0 0 16 22" width="14" height="20" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="1.7"/><circle cx="12" cy="4" r="1.7"/><circle cx="4" cy="11" r="1.7"/><circle cx="12" cy="11" r="1.7"/><circle cx="4" cy="18" r="1.7"/><circle cx="12" cy="18" r="1.7"/></svg>';
  var LISTS_IC = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>';
  var UP = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>';
  var TRASH = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
  var WARN = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';
  var GEAR = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>';

  var bar = Kit.init({
    id: 'ranker',
    theme: { felt: ['#4a3a8f', '#2f2466', '#21184a'] },
    undo: function () { undo(); },
    menu: [
      { icon: 'plus', label: 'New list', onClick: function () { newListAsk(); } },
      { icon: 'share', label: 'Share or copy', onClick: function () { openShare(); } },
      { icon: 'shuffle', label: 'Shuffle', onClick: function () { shuffleItems(); } },
      { icon: 'pencil', label: 'Settings', onClick: function () { openSettings(); } },
      { icon: 'close', label: 'Clear all items', onClick: function () { clearAll(); } },
      { icon: 'close', label: 'Delete this list', onClick: function () { if (state.id) deleteList(state.id); else Kit.toast('This list is not saved yet'); } }
    ],
    rules:
      '<p class="goal">Make a list of anything, put it in order, and settle the debate. Best pizza toppings? Funniest movie? Rank it.</p>' +
      '<h3>Make a list</h3><ul><li>Tap the title to name your list.</li><li>Type things in the box at the bottom and tap <b>Add</b>.</li><li>If something looks like a repeat ("The Matrix" and "Matrix (1999)"), Ranker warns you.</li></ul>' +
      '<h3>Rank it</h3><ul><li>Drag the dots on the left to move an item. You can also press and hold anywhere on an item, then drag.</li><li>The top three stand on the <b>podium</b>.</li><li>Tap an item\'s name to change it. Swipe it left to delete it.</li><li>Turn on <b>Edit mode</b> in Settings for up/down arrows and delete buttons instead.</li></ul>' +
      '<h3>Save and share</h3><ul><li><b>Save list</b> keeps it in <b>My lists</b> (the list button at the top). Saved lists sync to your other devices when you are signed in.</li><li><b>Share</b> sends the ranked list as text, or copies it.</li><li>Made a mistake? <b>Undo</b> is in the menu.</li></ul>'
  });
  // "My lists" button in the game bar
  if (bar) {
    var helpBtn = bar.querySelector('[aria-label="How to play"]');
    var lb = el('button', { class: 'icon-btn lists', type: 'button', 'aria-label': 'My lists', html: LISTS_IC, onclick: function () { Kit.sfx('pop'); openLists(); } });
    bar.insertBefore(lb, helpBtn || bar.lastChild);
  }

  // ── State & storage (rklists shape is synced; never change it) ──────────
  var state = { id: null, name: 'Untitled', items: [], unsaved: false, dedupe: true, editMode: false, dismissedDupes: {} };
  var nextItemId = 1;
  function asItems(v) {
    if (Array.isArray(v)) return v;
    if (v && typeof v === 'object') {
      var keys = Object.keys(v);
      return keys.length && keys.every(function (k) { return /^\d+$/.test(k); }) ? keys.sort(function (a, b) { return +a - +b; }).map(function (k) { return v[k]; }) : Object.keys(v).map(function (k) { return v[k]; });
    }
    return [];
  }
  function loadLists() {
    try { var p = JSON.parse(localStorage.getItem(KEY_LISTS)); if (p && p.lists) return asItems(p.lists).filter(function (l) { return l && l.id; }); } catch (e) {}
    return [];
  }
  function saveLists(lists) {
    try { localStorage.setItem(KEY_LISTS, JSON.stringify({ lists: lists })); } catch (e) {}
    try { FGHSync.noteWrite(KEY_LISTS); } catch (e) {}
  }
  function saveCurrent() { try { localStorage.setItem(KEY_CUR, JSON.stringify(state)); } catch (e) {} }
  function loadCurrent() { try { return JSON.parse(localStorage.getItem(KEY_CUR)); } catch (e) { return null; } }
  function newId() { return 'rk_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }
  function resetNextId() { nextItemId = Math.max.apply(null, [0].concat(state.items.map(function (x) { return +x.id || 0; }))) + 1; }

  // ── Fuzzy duplicate detection ─────────────────────────────────────────
  function norm(s) {
    var o = String(s || '').toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/\[[^\]]*\]/g, ' ').replace(/[^a-z0-9\s]+/g, ' ').replace(/\s+/g, ' ').trim();
    return o.replace(/^(the|a|an)\s+/, '');
  }
  function editDistance(a, b) {
    if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
    var prev = [], cur = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur[0] = i;
      for (j = 1; j <= b.length; j++) cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      var t = prev; prev = cur; cur = t;
    }
    return prev[b.length];
  }
  function isDup(x, y) {
    var a = norm(x), b = norm(y);
    if (!a || !b) return false;
    if (a === b) return true;
    if (a.length >= 3 && b.length >= 3 && (b.indexOf(a) >= 0 || a.indexOf(b) >= 0)) return true;
    var sim = 1 - editDistance(a, b) / Math.max(a.length, b.length);
    return sim >= (Math.max(a.length, b.length) >= 8 ? 0.82 : 0.9);
  }
  function dupGroups(items) {
    var groups = [], used = [];
    for (var i = 0; i < items.length; i++) {
      if (used[i]) continue;
      var g = [i];
      for (var j = i + 1; j < items.length; j++) if (!used[j] && isDup(items[i].name, items[j].name)) { g.push(j); used[j] = true; }
      if (g.length > 1) { used[i] = true; groups.push(g); }
    }
    return groups;
  }
  function findMatch(name) { for (var i = 0; i < state.items.length; i++) if (isDup(name, state.items[i].name)) return state.items[i]; return null; }

  // ── Undo ──────────────────────────────────────────────────────────────
  var undoStack = [];
  function snap() {
    undoStack.push({ name: state.name, items: state.items.map(function (x) { return { id: x.id, name: x.name }; }) });
    if (undoStack.length > 40) undoStack.shift();
  }
  function undo() {
    var u = undoStack.pop();
    if (!u) { Kit.toast('Nothing to undo'); return; }
    state.name = u.name; state.items = u.items; state.unsaved = true;
    resetNextId(); saveCurrent(); render(); hideSnack();
    Kit.sfx('tap'); Kit.toast('Undone');
  }

  // ── Mutations ─────────────────────────────────────────────────────────
  function dirty() { state.unsaved = true; saveCurrent(); }
  function addItem(name) {
    var t = String(name || '').trim(); if (!t) return;
    snap();
    state.items.push({ id: nextItemId++, name: t });
    dirty(); render(); Kit.sfx('pop'); Kit.haptic('light');
    var rows = listEl.querySelectorAll('.rrow'); var last = rows[rows.length - 1];
    if (last) { last.classList.add('pop'); }
  }
  function deleteItem(id) {
    var i = state.items.findIndex(function (x) { return x.id === id; }); if (i < 0) return;
    snap();
    var it = state.items.splice(i, 1)[0];
    dirty(); render(); Kit.haptic('medium'); Kit.sfx('whoosh');
    showSnack('Removed "' + it.name + '"');
  }
  function renameItem(id, nn) {
    var t = String(nn || '').trim(), it = state.items.find(function (x) { return x.id === id; });
    if (!it || !t || it.name === t) { render(); return; }
    snap(); it.name = t; dirty(); render();
  }
  function moveItem(id, d) {
    var i = state.items.findIndex(function (x) { return x.id === id; }), j = i + d;
    if (i < 0 || j < 0 || j >= state.items.length) return;
    reorder(i, j);
  }
  function reorder(from, to) {
    if (from === to) return;
    snap();
    var m = state.items.splice(from, 1)[0]; state.items.splice(to, 0, m);
    dirty(); render(true);

        el('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Rename ' + l.name, html: icon('pencil'), onclick: function () { renameList(l.id); } }),
        el('button', { type: 'button', class: 'icon-btn del', 'aria-label': 'Delete ' + l.name, html: TRASH, onclick: function () { deleteList(l.id); } })
      ]));
    });
  }
  function openLists() {
    listsBox = el('div', { class: 'ls' });
    paintLists();
    listsSheet = Kit.sheet({ title: 'My lists', node: listsBox, onClose: function () { listsSheet = null; listsBox = null; },
      actions: [{ label: 'New list', primary: true, onClick: function () { newListAsk(); } }, { label: 'Close', cls: 'btn-ghost' }] });
  }
  function exportText() {
    return (state.name && state.name !== 'Untitled' ? state.name + '\n' : '') + state.items.map(function (it, i) { return (i + 1) + '. ' + it.name; }).join('\n');
  }
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(function () { return legacyCopy(t); });
    return Promise.resolve(legacyCopy(t));
  }
  function legacyCopy(t) {
    var ta = el('textarea', { style: { position: 'fixed', opacity: '0', top: '0' } }); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {} ta.remove();
  }
  function openShare() {
    if (!state.items.length) { Kit.toast('Add some items first'); return; }
    var t = exportText();
    var acts = [];
    if (navigator.share) acts.push({ label: 'Share', primary: true, onClick: function () { navigator.share({ title: state.name, text: t }).catch(function () {}); } });
    acts.push({ label: 'Copy text', cls: navigator.share ? 'btn-soft' : 'btn-primary', keep: true, onClick: function () {
      copyText(t).then(function () { Kit.toast('Copied'); Kit.sfx('good'); Kit.haptic('success'); s.close(); });
    } });
    acts.push({ label: 'Close', cls: 'btn-ghost' });
    var s = Kit.sheet({ title: 'Share your ranking', node: el('div', { class: 'preview', text: t }), actions: acts });
  }
  function openSettings() {
    function row(title, desc, on, fn) {
      var inp = el('input', { type: 'checkbox' }); inp.checked = on;
      inp.addEventListener('change', function () { fn(inp.checked); Kit.sfx('tap'); Kit.haptic('light'); });
      return el('label', { class: 'setrow' }, [el('div', { class: 'grow' }, [el('div', { class: 't', text: title }), el('small', { text: desc })]), el('span', { class: 'switch' }, [inp, el('i')])]);
    }
    var box = el('div', null, [
      row('Warn about duplicates', 'Spots items that look alike, like "The Matrix (1999)" and "Matrix".', state.dedupe, function (v) { state.dedupe = v; state.dismissedDupes = {}; saveCurrent(); updateInput(); render(); }),
      row('Edit mode', 'Shows up and down arrows and a delete button on every item.', state.editMode, function (v) { state.editMode = v; saveCurrent(); render(); })
    ]);
    Kit.sheet({ title: 'Settings', node: box, actions: [{ label: 'Done', cls: 'btn-soft' }] });
  }

  // ── Boot ──────────────────────────────────────────────────────────────
  var restored = loadCurrent();
  if (restored && typeof restored === 'object') {
    state = Object.assign(blankState(), restored);
    state.items = asItems(state.items).filter(function (x) { return x && x.name; });
    state.dismissedDupes = state.dismissedDupes || {};
    resetNextId();
  }
  render(); updateInput();

  if (window.FGHSync && typeof FGHSync.syncNow === 'function') {
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') FGHSync.syncNow(); });
  }
  function pullCurrent() {
    if (!state.id || state.unsaved) return;
    var cl = loadLists().find(function (l) { return l.id === state.id; });
    if (cl) { state.name = cl.name; state.items = asItems(cl.items).filter(function (x) { return x && x.name; }).map(function (x) { return { id: x.id, name: x.name }; }); resetNextId(); saveCurrent(); }
  }
  if (window.FGHSync && typeof FGHSync.onReady === 'function') FGHSync.onReady(function () { if (!D) { pullCurrent(); render(); } });
  document.addEventListener('fghsync:updated', function () { if (D) return; pullCurrent(); render(); if (listsSheet) paintLists(); });
})();
</script>
</body>
</html>

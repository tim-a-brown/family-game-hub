<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b10">
<title>Ranker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../sync.js"></script>
<style>
:root{
  --rk-bg:#0b0b10;
  --rk-card:#17161f;
  --rk-card-border:rgba(255,255,255,.06);
  --rk-muted:rgba(255,255,255,.45);
  --rk-fg:rgba(255,255,255,.92);
  --rk-gold:#f5c842;
  --rk-gold-deep:#d4a62e;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--rk-bg);color:var(--rk-fg);font-family:Inter,system-ui,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
body{padding:0 12px 80px;max-width:520px;margin:0 auto;}

/* ── Top bar ─────────────────────────────────────────────── */
.rk-topbar{
  display:flex;align-items:center;gap:8px;
  padding:12px 0 6px;
}
.rk-nav-pill{
  display:inline-flex;align-items:center;gap:4px;
  height:36px;padding:0 14px;border-radius:10px;
  background:#1a1a22;border:1px solid rgba(255,255,255,.08);
  color:var(--rk-fg);font-size:.85rem;font-weight:600;font-family:inherit;
  text-decoration:none;cursor:pointer;transition:all .12s;
}
.rk-nav-pill:hover{background:#22222c;border-color:rgba(255,255,255,.16);}
.rk-nav-pill:active{transform:scale(.97);}
.rk-nav-pill .chev{font-size:.75rem;opacity:.7;}
.rk-topbar-spacer{flex:1;}
.rk-icon-btn{
  all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:10px;
  background:#1a1a22;border:1px solid rgba(255,255,255,.08);
  color:var(--rk-fg);font-size:1.05rem;transition:all .12s;
}
.rk-icon-btn:hover{background:#22222c;border-color:rgba(255,255,255,.16);}
.rk-icon-btn:active{transform:scale(.93);}
.rk-icon-btn.has-badge::after{
  content:"";position:absolute;margin-top:-14px;margin-left:12px;
  width:7px;height:7px;border-radius:50%;background:var(--rk-gold);
  box-shadow:0 0 6px rgba(245,200,66,.6);
}

/* ── Title block ──────────────────────────────────────────── */
.rk-title-block{padding:18px 2px 14px;}
.rk-title{
  margin:0;
  font-family:'Playfair Display',serif;font-style:italic;font-weight:900;
  font-size:2.1rem;line-height:1.1;color:var(--rk-gold);
  letter-spacing:-.01em;
  cursor:text;padding:2px 4px;border-radius:6px;outline:none;
  transition:background .12s;
}
.rk-title:hover{background:rgba(245,200,66,.06);}
.rk-title:focus{background:rgba(245,200,66,.08);}
.rk-subtitle{
  display:flex;align-items:center;gap:8px;margin-top:8px;
  font-size:.78rem;color:var(--rk-muted);font-weight:500;letter-spacing:.01em;
}
.rk-status-dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.3);
  flex-shrink:0;transition:all .2s;
}
.rk-status-dot.unsaved{background:var(--rk-gold);box-shadow:0 0 6px rgba(245,200,66,.6);}
.rk-status-dot.saved{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.45);}

/* ── Duplicate banner ─────────────────────────────────────── */
.rk-dupe-banner{
  display:flex;align-items:flex-start;gap:9px;
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);
  border-radius:10px;padding:10px 12px;margin:0 0 12px;
  font-size:.8rem;line-height:1.45;color:rgba(255,255,255,.82);
}
.rk-dupe-icon{flex-shrink:0;font-size:.95rem;}
.rk-dupe-body{flex:1;min-width:0;}
.rk-dupe-body b{color:#fbbf24;font-weight:700;}
.rk-dupe-dismiss{
  all:unset;cursor:pointer;flex-shrink:0;
  color:rgba(255,255,255,.35);font-size:1rem;padding:0 2px;
}
.rk-dupe-dismiss:hover{color:#fff;}

/* ── List ─────────────────────────────────────────────────── */
.rk-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.rk-row{
  display:flex;align-items:center;gap:4px;
  background:var(--rk-card);border:1px solid var(--rk-card-border);
  border-radius:12px;padding:12px 12px 12px 8px;
  position:relative;overflow:hidden;
  transition:all .18s cubic-bezier(.22,1,.36,1);
  touch-action:manipulation;
}
.rk-row.dragging{
  background:#1f1e2a;border-color:rgba(245,200,66,.35);
  box-shadow:0 8px 24px rgba(0,0,0,.5);transform:scale(1.02);z-index:10;
}
.rk-row.drop-target-above{border-top:2px solid var(--rk-gold);}
.rk-row.drop-target-below{border-bottom:2px solid var(--rk-gold);}
.rk-row.is-duplicate{
  border-color:rgba(251,191,36,.35);
  background:rgba(251,191,36,.04);
}
.rk-row.swiping{transition:none;}
.rk-row-swipe-bg{
  position:absolute;top:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:18px;
  background:linear-gradient(90deg,transparent 0%,rgba(248,113,113,.15) 25%,rgba(248,113,113,.32) 100%);
  color:#f87171;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  pointer-events:none;opacity:0;transition:opacity .12s;
  z-index:0;
}
.rk-row.swipe-hint .rk-row-swipe-bg{opacity:1;}
.rk-row-swipe-bg::before{content:"← Swipe to delete";}
.rk-row.swipe-active .rk-row-swipe-bg{opacity:1;}
.rk-row.swipe-active .rk-row-swipe-bg::before{content:"🗑 Delete";color:#fca5a5;}
.rk-row > *:not(.rk-row-swipe-bg){position:relative;z-index:1;}

/* Drag handle — six-dot grip */
.rk-handle{
  flex-shrink:0;width:24px;height:38px;
  display:flex;align-items:center;justify-content:center;
  cursor:grab;color:rgba(255,255,255,.28);
  user-select:none;touch-action:none;
}
.rk-handle:active{cursor:grabbing;color:rgba(245,200,66,.7);}
.rk-handle svg{display:block;}

/* Rank number */
.rk-rank{
  flex-shrink:0;min-width:28px;text-align:center;
  font-family:'Playfair Display',serif;font-style:italic;font-weight:700;
  font-size:1.15rem;color:var(--rk-gold);letter-spacing:-.01em;
  animation:rankPop .32s cubic-bezier(.22,1,.36,1);
}
@keyframes rankPop{
  0%{transform:scale(.8);opacity:.3;}
  60%{transform:scale(1.1);opacity:1;}
  100%{transform:scale(1);opacity:1;}
}

.rk-name{
  flex:1;min-width:0;padding:0 8px;
  font-size:.95rem;font-weight:500;color:#f5f5f7;
  line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.rk-name[contenteditable]:focus{
  outline:none;background:rgba(245,200,66,.08);border-radius:6px;padding:2px 6px;
}
.rk-dupe-badge{
  flex-shrink:0;background:rgba(251,191,36,.18);color:#fbbf24;
  font-size:.58rem;font-weight:800;padding:2px 6px;border-radius:4px;
  letter-spacing:.06em;text-transform:uppercase;margin-right:4px;
}

/* Edit-mode affordances — appear only when editMode is on */
.rk-arrows{display:none;flex-direction:column;gap:2px;flex-shrink:0;margin-right:4px;}
.rk-row.edit-on .rk-arrows{display:flex;}
.rk-arrow{
  all:unset;cursor:pointer;width:24px;height:18px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:.68rem;color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.04);transition:all .12s;
}
.rk-arrow:hover{color:var(--rk-gold);background:rgba(245,200,66,.12);}
.rk-arrow:active{transform:scale(.88);}
.rk-arrow.disabled{opacity:.25;pointer-events:none;}
.rk-del{display:none;}
.rk-row.edit-on .rk-del{
  display:flex;all:unset;cursor:pointer;flex-shrink:0;
  width:28px;height:28px;border-radius:6px;
  align-items:center;justify-content:center;
  color:rgba(255,255,255,.35);font-size:.9rem;
  transition:all .12s;
}
.rk-row.edit-on .rk-del:hover{color:#f87171;background:rgba(248,113,113,.12);}

/* Empty state */
.rk-empty{
  text-align:center;padding:40px 20px;color:rgba(255,255,255,.35);font-size:.88rem;
  border:1px dashed rgba(255,255,255,.1);border-radius:12px;
}

/* ── Add row ─────────────────────────────────────────────── */
.rk-add{
  display:flex;gap:8px;margin-bottom:10px;
}
.rk-add input{
  flex:1;min-width:0;
  padding:12px 14px;border-radius:10px;
  background:#17161f;border:1px solid rgba(255,255,255,.08);
  color:var(--rk-fg);font-size:.92rem;font-family:inherit;outline:none;
  transition:all .12s;
}
.rk-add input::placeholder{color:rgba(255,255,255,.3);}
.rk-add input:focus{border-color:rgba(245,200,66,.35);background:#1c1b26;}
.rk-add input.warn-dupe{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.06);}
.rk-add button{
  all:unset;cursor:pointer;flex-shrink:0;
  padding:0 22px;height:auto;min-height:44px;border-radius:10px;
  background:#1a1a22;border:1px solid rgba(245,200,66,.4);
  color:var(--rk-gold);font-weight:700;font-size:.9rem;
  transition:all .12s;
}
.rk-add button:hover{background:rgba(245,200,66,.1);border-color:rgba(245,200,66,.65);}
.rk-add button:active{transform:scale(.96);}
.rk-add button:disabled{opacity:.35;cursor:default;border-color:rgba(255,255,255,.08);color:rgba(255,255,255,.3);}

/* Inline suggestion (dupe detected on input) */
.rk-input-suggest{
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);
  border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:.8rem;color:rgba(255,255,255,.85);
  display:flex;align-items:center;gap:8px;
}
.rk-input-suggest b{color:#fbbf24;}
.rk-input-suggest .actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0;}
.rk-input-suggest button{
  all:unset;cursor:pointer;padding:5px 10px;border-radius:6px;font-size:.72rem;font-weight:700;
  transition:all .12s;
}
.rk-input-suggest .skip-btn{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);}
.rk-input-suggest .skip-btn:hover{background:rgba(255,255,255,.12);}
.rk-input-suggest .add-btn{background:rgba(251,191,36,.2);color:#fbbf24;}
.rk-input-suggest .add-btn:hover{background:rgba(251,191,36,.32);}

/* ── Bottom action bar ───────────────────────────────────── */
.rk-footer{
  display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px;
}
.rk-save-btn{
  all:unset;cursor:pointer;text-align:center;
  padding:14px 0;border-radius:12px;
  background:linear-gradient(135deg,#f5c842,#d4a62e);color:#2a1a00;
  font-weight:800;font-size:1rem;letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .12s;
  box-shadow:0 3px 14px rgba(245,200,66,.22);
}
.rk-save-btn:hover{filter:brightness(1.06);}
.rk-save-btn:active{transform:scale(.98);}
.rk-save-btn.disabled{
  opacity:.45;pointer-events:none;filter:grayscale(.25);
}
.rk-save-btn.saved-flash{
  background:linear-gradient(135deg,#4ade80,#22c55e);color:#052e16;
}
.rk-save-btn svg{width:18px;height:18px;}
.rk-overflow-btn{
  all:unset;cursor:pointer;
  min-height:48px;padding:0 16px;border-radius:12px;
  background:#1a1a22;border:1px solid rgba(255,255,255,.1);
  color:var(--rk-fg);font-size:1.15rem;font-weight:700;letter-spacing:2px;
  display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.rk-overflow-btn:hover{background:#22222c;border-color:rgba(255,255,255,.2);}
.rk-overflow-btn:active{transform:scale(.94);}

/* ── Modal scaffolding ───────────────────────────────────── */
.rk-modal-overlay{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.rk-modal-overlay.show{display:flex;}
.rk-modal{
  width:100%;max-width:420px;max-height:86vh;overflow:hidden;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1a1a24,#111118);
  border:1px solid rgba(255,255,255,.08);border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  animation:popin .22s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popin{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
.rk-modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.06);
}
.rk-modal-title{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:1.2rem;color:var(--rk-gold);}
.rk-modal-x{
  all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.08);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1;
}
.rk-modal-x:hover{background:rgba(255,255,255,.16);}
.rk-modal-body{padding:14px 18px;overflow-y:auto;flex:1;}
.rk-modal-foot{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:8px;justify-content:flex-end;}
.rk-modal-foot button{
  all:unset;cursor:pointer;padding:9px 18px;border-radius:9px;font-size:.88rem;font-weight:700;transition:all .12s;
}
.rk-modal-foot .btn-primary{background:linear-gradient(135deg,#f5c842,#d4a62e);color:#2a1a00;}
.rk-modal-foot .btn-primary:hover{filter:brightness(1.08);}
.rk-modal-foot .btn-primary.copied{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;}
.rk-modal-foot .btn-secondary{background:rgba(255,255,255,.06);color:rgba(255,255,255,.82);}
.rk-modal-foot .btn-secondary:hover{background:rgba(255,255,255,.12);color:#fff;}

/* Settings toggle rows */
.rk-setting{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-top:1px solid rgba(255,255,255,.05);
}
.rk-setting:first-child{border-top:none;}
.rk-setting-body{flex:1;min-width:0;}
.rk-setting-title{font-size:.95rem;font-weight:600;color:var(--rk-fg);}
.rk-setting-desc{font-size:.72rem;color:var(--rk-muted);margin-top:2px;line-height:1.45;}
.rk-toggle{
  position:relative;width:40px;height:22px;border-radius:14px;
  background:rgba(255,255,255,.14);cursor:pointer;transition:background .18s;
  flex-shrink:0;
}
.rk-toggle.on{background:linear-gradient(135deg,#f5c842,#d4a62e);}
.rk-toggle::after{
  content:"";position:absolute;top:2px;left:2px;
  width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .18s;
}
.rk-toggle.on::after{transform:translateX(18px);}

/* Overflow menu popover */
.rk-popover-overlay{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.4);
  display:none;
}
.rk-popover-overlay.show{display:block;}
.rk-popover{
  position:fixed;bottom:84px;right:14px;z-index:95;
  background:#1a1a22;border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:6px;min-width:200px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  animation:popoverIn .18s cubic-bezier(.22,1,.36,1);
}
@keyframes popoverIn{from{transform:translateY(6px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.rk-popover button{
  all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;
  width:100%;padding:9px 12px;border-radius:8px;
  font-size:.86rem;color:var(--rk-fg);
  transition:background .12s;
}
.rk-popover button:hover{background:rgba(255,255,255,.06);}
.rk-popover button.danger{color:#fca5a5;}
.rk-popover button.danger:hover{background:rgba(248,113,113,.1);}
.rk-popover button .icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0;}
.rk-popover .sep{border-top:1px solid rgba(255,255,255,.06);margin:4px 0;}

/* Export textarea */
.rk-export-ta{
  width:100%;min-height:200px;max-height:40vh;
  padding:12px;border-radius:8px;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);color:#fff;
  font-family:'SF Mono',Monaco,monospace;font-size:.85rem;resize:vertical;line-height:1.5;
}

/* My Lists */
.rk-lists{display:flex;flex-direction:column;gap:6px;}
.rk-list-row{
  display:flex;align-items:center;gap:8px;padding:11px 12px;
  background:#17161f;border:1px solid rgba(255,255,255,.06);border-radius:10px;
  cursor:pointer;transition:all .12s;
}
.rk-list-row:hover{background:#1d1c28;border-color:rgba(245,200,66,.25);}
.rk-list-row.active{background:rgba(245,200,66,.07);border-color:rgba(245,200,66,.35);}
.rk-list-info{flex:1;min-width:0;}
.rk-list-name{font-weight:700;color:#fff;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Playfair Display',serif;font-style:italic;color:var(--rk-gold);}
.rk-list-meta{font-size:.68rem;color:var(--rk-muted);margin-top:2px;}
.rk-list-actions{display:flex;gap:4px;flex-shrink:0;}
.rk-list-actions button{
  all:unset;cursor:pointer;width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.4);font-size:.9rem;transition:all .12s;
}
.rk-list-actions button:hover{color:#fff;background:rgba(255,255,255,.08);}
.rk-list-actions .del:hover{color:#f87171;background:rgba(248,113,113,.12);}
.rk-lists-empty{
  text-align:center;padding:28px 12px;color:rgba(255,255,255,.4);font-size:.88rem;line-height:1.5;
}
.rk-lists-empty .hint{color:rgba(255,255,255,.3);font-size:.75rem;margin-top:8px;}
</style>
</head>
<body>

<!-- ── Top bar ─────────────────────────────────────── -->
<div class="rk-topbar">
  <a class="rk-nav-pill" href="../index.html"><span class="chev">‹</span> Home</a>
  <button class="rk-nav-pill" id="rk-mylists-btn" type="button">My lists</button>
  <div class="rk-topbar-spacer"></div>
  <button class="rk-icon-btn" id="rk-settings-btn" type="button" aria-label="Settings">⚙</button>
</div>

<!-- ── Title + status ──────────────────────────────── -->
<div class="rk-title-block">
  <h1 class="rk-title" id="rk-title" contenteditable="true" spellcheck="false">Untitled</h1>
  <div class="rk-subtitle">
    <span class="rk-status-dot" id="rk-status-dot"></span>
    <span id="rk-status-text">Draft</span>
  </div>
</div>

<!-- ── Dup banner / list / add / footer ──────────────── -->
<div id="rk-dupe-banner-host"></div>
<div class="rk-list" id="rk-list"></div>

<div class="rk-add">
  <input type="text" id="rk-new" placeholder="Add an item…" maxlength="120" autocomplete="off">
  <button type="button" id="rk-add-btn" disabled>Add</button>
</div>
<div id="rk-input-suggest-host"></div>

<div class="rk-footer">
  <button class="rk-save-btn" id="rk-save-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </svg>
    <span id="rk-save-btn-label">Save list</span>
  </button>
  <button class="rk-overflow-btn" id="rk-overflow-btn" type="button" aria-label="More actions">⋯</button>
</div>

<!-- ── Modal scaffolding ─────────────────────────────── -->
<div class="rk-modal-overlay" id="rk-modal-overlay">
  <div class="rk-modal" id="rk-modal"></div>
</div>

<!-- ── Overflow popover ──────────────────────────────── -->
<div class="rk-popover-overlay" id="rk-popover-overlay"></div>
<div class="rk-popover" id="rk-popover" style="display:none;"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// Ranker — drag/drop, saved lists (per PIN via rklists), fuzzy dedup,
// edit-mode toggle, swipe-to-delete.
// ═══════════════════════════════════════════════════════════════════════════

const STORAGE_KEY_LISTS   = 'rklists';
const STORAGE_KEY_CURRENT = 'ranker_current';

let state = {
  id: null,
  name: 'Untitled',
  items: [],
  unsaved: false,
  dedupe: true,
  editMode: false,
  dismissedDupes: {},
};
let nextItemId = 1;

// ─────────────────────────────────────────────────────────────────────────────
// Storage helpers
// ─────────────────────────────────────────────────────────────────────────────
function loadLists(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_LISTS);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    if(parsed && Array.isArray(parsed.lists)) return parsed.lists;
    return [];
  }catch(e){ return []; }
}
function saveLists(lists){
  try{ localStorage.setItem(STORAGE_KEY_LISTS, JSON.stringify({lists:lists})); }catch(e){}
  try{ FGHSync.noteWrite(STORAGE_KEY_LISTS); }catch(e){}
}
function saveCurrent(){
  try{ localStorage.setItem(STORAGE_KEY_CURRENT, JSON.stringify(state)); }catch(e){}
}
function loadCurrent(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_CURRENT);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function newId(){ return 'rk_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }

// ─────────────────────────────────────────────────────────────────────────────
// Fuzzy duplicate detection
// ─────────────────────────────────────────────────────────────────────────────
function normalizeForCompare(s){
  if(!s) return '';
  let out = String(s).toLowerCase();
  out = out.replace(/\([^)]*\)/g, ' ');
  out = out.replace(/\[[^\]]*\]/g, ' ');
  out = out.replace(/[^a-z0-9\s]+/g, ' ');
  out = out.replace(/\s+/g, ' ').trim();
  out = out.replace(/^(the|a|an)\s+/, '');
  return out;
}
function editDistance(a, b){
  if(a === b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  let prev = new Array(b.length + 1);
  let cur  = new Array(b.length + 1);
  for(let j = 0; j <= b.length; j++) prev[j] = j;
  for(let i = 1; i <= a.length; i++){
    cur[0] = i;
    for(let j = 1; j <= b.length; j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(cur[j-1]+1, prev[j]+1, prev[j-1]+cost);
    }
    [prev, cur] = [cur, prev];
  }
  return prev[b.length];
}
function similarity(a, b){
  if(!a.length || !b.length) return 0;
  return 1 - editDistance(a, b) / Math.max(a.length, b.length);
}
function isFuzzyDup(aRaw, bRaw){
  const a = normalizeForCompare(aRaw);
  const b = normalizeForCompare(bRaw);
  if(!a || !b) return false;
  if(a === b) return true;
  if(a.length >= 3 && b.length >= 3){
    if(b.indexOf(a) >= 0 || a.indexOf(b) >= 0) return true;
  }
  const sim = similarity(a, b);
  const threshold = Math.max(a.length, b.length) >= 8 ? 0.82 : 0.90;
  return sim >= threshold;
}
function findDuplicateGroups(items){
  const groups = [];
  const assigned = new Array(items.length).fill(-1);
  for(let i = 0; i < items.length; i++){
    if(assigned[i] >= 0) continue;
    const group = [{idx: i, item: items[i]}];
    assigned[i] = groups.length;
    for(let j = i + 1; j < items.length; j++){
      if(assigned[j] >= 0) continue;
      if(isFuzzyDup(items[i].name, items[j].name)){
        group.push({idx: j, item: items[j]});
        assigned[j] = groups.length;
      }
    }
    if(group.length >= 2) groups.push(group);
  }
  return groups;
}
function findMatchAgainstList(newName, items){
  for(let i = 0; i < items.length; i++){
    if(isFuzzyDup(newName, items[i].name)) return items[i];
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// State mutations
// ─────────────────────────────────────────────────────────────────────────────
function markDirty(){
  state.unsaved = !!state.id;
  saveCurrent();
}

function addItem(name){
  const trimmed = (name||'').trim();
  if(!trimmed) return;
  state.items.push({ id: nextItemId++, name: trimmed });
  if(!state.id) state.unsaved = true;  // mark draft as dirty too
  markDirty();
  render();
}

function deleteItem(id, opts){
  const it = state.items.find(x => x.id === id);
  if(!it) return;
  const skipConfirm = (opts && opts.skipConfirm) || state.editMode;
  if(!skipConfirm){
    if(!confirm(`Delete "${it.name}"?`)) return;
  }
  state.items = state.items.filter(x => x.id !== id);
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function renameItem(id, newName){
  const trimmed = (newName||'').trim();
  const it = state.items.find(x => x.id === id);
  if(!it || !trimmed || it.name === trimmed) return;
  it.name = trimmed;
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function moveItem(id, delta){
  const idx = state.items.findIndex(x => x.id === id);
  if(idx < 0) return;
  const target = idx + delta;
  if(target < 0 || target >= state.items.length) return;
  [state.items[idx], state.items[target]] = [state.items[target], state.items[idx]];
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function reorder(fromIdx, toIdx){
  if(fromIdx === toIdx) return;
  const [moved] = state.items.splice(fromIdx, 1);
  state.items.splice(toIdx, 0, moved);
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function shuffleItems(){
  for(let i = state.items.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [state.items[i], state.items[j]] = [state.items[j], state.items[i]];
  }
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function clearAll(){
  if(!state.items.length) return;
  if(!confirm('Clear all items from this list?')) return;
  state.items = [];
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function newList(){
  state = { id:null, name:'Untitled', items:[], unsaved:false, dedupe: state.dedupe, editMode: state.editMode, dismissedDupes:{} };
  nextItemId = 1;
  saveCurrent();
  render();
}

function setCurrentName(name){
  const trimmed = (name||'').trim() || 'Untitled';
  state.name = trimmed;
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function saveCurrentList(){
  const lists = loadLists();
  if(state.id){
    const existing = lists.find(l => l.id === state.id);
    if(existing){
      existing.name = state.name;
      existing.items = state.items.map(x => ({id:x.id, name:x.name}));
      existing._modifiedAt = Date.now();
      saveLists(lists);
      state.unsaved = false;
      saveCurrent();
      render();
      flashSaved();
      return;
    }
  }
  // New save — if still Untitled, prompt
  let name = state.name;
  if(!name || name === 'Untitled'){
    const chosen = prompt('Name this list:', state.items.length ? 'My List' : '');
    if(chosen == null) return;
    name = (chosen||'').trim() || 'Untitled';
  }
  const now = Date.now();
  const listObj = {
    id: newId(),
    name: name,
    items: state.items.map(x => ({id:x.id, name:x.name})),
    _createdAt: now,
    _modifiedAt: now
  };
  lists.push(listObj);
  saveLists(lists);
  state.id = listObj.id;
  state.name = name;
  state.unsaved = false;
  saveCurrent();
  render();
  flashSaved();
}

function loadList(id){
  const lists = loadLists();
  const list = lists.find(l => l.id === id);
  if(!list) return;
  let itemsArr = list.items;
  if(!Array.isArray(itemsArr) && itemsArr && typeof itemsArr === 'object'){
    const keys = Object.keys(itemsArr);
    if(keys.length && keys.every(k => /^\d+$/.test(k))){
      itemsArr = keys.sort((a,b)=>+a-+b).map(k => itemsArr[k]);
    } else {
      itemsArr = Object.values(itemsArr);
    }
  }
  if(!Array.isArray(itemsArr)) itemsArr = [];
  state = {
    id: list.id,
    name: list.name,
    items: itemsArr.filter(x => x && x.name).map(x => ({id:x.id, name:x.name})),
    unsaved: false,
    dedupe: state.dedupe,
    editMode: state.editMode,
    dismissedDupes: {}
  };
  nextItemId = Math.max(0, ...state.items.map(x=>x.id||0)) + 1;
  saveCurrent();
  render();
}

function deleteList(id){
  const lists = loadLists();
  const idx = lists.findIndex(l => l.id === id);
  if(idx < 0) return;
  const list = lists[idx];
  if(!confirm(`Delete "${list.name}"? This can't be undone.`)) return;
  lists.splice(idx, 1);
  saveLists(lists);
  if(state.id === id){
    newList();
  } else {
    renderListsModal();
  }
}

function renameList(id){
  const lists = loadLists();
  const list = lists.find(l => l.id === id);
  if(!list) return;
  const chosen = prompt('Rename list:', list.name);
  if(chosen == null) return;
  const trimmed = (chosen||'').trim() || list.name;
  list.name = trimmed;
  list._modifiedAt = Date.now();
  saveLists(lists);
  if(state.id === id){ state.name = trimmed; saveCurrent(); }
  renderListsModal();
  render();
}

function flashSaved(){
  const btn = document.getElementById('rk-save-btn');
  if(!btn) return;
  btn.classList.add('saved-flash');
  const label = document.getElementById('rk-save-btn-label');
  const prevLabel = label ? label.textContent : null;
  if(label) label.textContent = 'Saved ✓';
  setTimeout(() => {
    btn.classList.remove('saved-flash');
    render();  // restores correct button label based on state
  }, 1400);
}

// ─────────────────────────────────────────────────────────────────────────────
// Rendering
// ─────────────────────────────────────────────────────────────────────────────
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  // Title
  const titleEl = document.getElementById('rk-title');
  if(titleEl && document.activeElement !== titleEl){
    titleEl.textContent = state.name || 'Untitled';
  }

  // Status
  const dot = document.getElementById('rk-status-dot');
  const text = document.getElementById('rk-status-text');
  dot.className = 'rk-status-dot';
  const hasItems = state.items.length > 0;
  const baseHint = hasItems ? ' · drag to rank, tap to edit' : '';
  if(state.id){
    if(state.unsaved){
      dot.classList.add('unsaved');
      text.textContent = 'Unsaved' + baseHint;
    } else {
      dot.classList.add('saved');
      text.textContent = 'Saved' + baseHint;
    }
  } else {
    if(state.unsaved || state.items.length){
      dot.classList.add('unsaved');
      text.textContent = 'Draft' + baseHint;
    } else {
      text.textContent = 'Draft · start by adding items below';
    }
  }

  // Save button enabled only when there's something worth saving
  const saveBtn = document.getElementById('rk-save-btn');
  const saveLbl = document.getElementById('rk-save-btn-label');
  const hasChanges = state.unsaved || !state.id;
  const canSave = state.items.length > 0 || state.id;
  saveBtn.classList.toggle('disabled', !canSave || (!hasChanges && !!state.id));
  if(state.id){
    saveLbl.textContent = hasChanges ? 'Save changes' : 'Saved';
  } else {
    saveLbl.textContent = 'Save list';
  }

  // Settings gear — add subtle dot when non-default settings are on
  const gear = document.getElementById('rk-settings-btn');
  // Default is dedupe ON + editMode OFF. Anything else = "custom"
  const customSettings = !state.dedupe || state.editMode;
  gear.style.position = 'relative';
  gear.innerHTML = customSettings
    ? '⚙<span style="position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--rk-gold);box-shadow:0 0 4px rgba(245,200,66,.7);"></span>'
    : '⚙';

  // Duplicate groups
  const dupeGroups = state.dedupe ? findDuplicateGroups(state.items) : [];
  const dupeIdxSet = new Set();
  dupeGroups.forEach(g => g.forEach(m => dupeIdxSet.add(m.idx)));

  // Duplicate banner
  const bannerHost = document.getElementById('rk-dupe-banner-host');
  if(dupeGroups.length && !state.dismissedDupes['_global']){
    const pairs = dupeGroups.map(g =>
      '"' + escapeHtml(g.map(m => m.item.name).join('" ≈ "')) + '"'
    ).join(', ');
    bannerHost.innerHTML = `<div class="rk-dupe-banner">
      <div class="rk-dupe-icon">⚠️</div>
      <div class="rk-dupe-body">
        <b>${dupeGroups.length} possible duplicate${dupeGroups.length>1?'s':''}.</b>
        ${pairs.length > 160 ? pairs.slice(0,160)+'…' : pairs}
      </div>
      <button class="rk-dupe-dismiss" id="rk-dupe-dismiss" title="Dismiss">×</button>
    </div>`;
    document.getElementById('rk-dupe-dismiss').addEventListener('click', () => {
      state.dismissedDupes['_global'] = true;
      saveCurrent();
      render();
    });
  } else {
    bannerHost.innerHTML = '';
  }

  // List
  const list = document.getElementById('rk-list');
  if(!state.items.length){
    list.innerHTML = `<div class="rk-empty">No items yet.<br><br>Add your first item below to start ranking.</div>`;
  } else {
    list.innerHTML = state.items.map((item, i) => `
      <div class="rk-row ${dupeIdxSet.has(i)?'is-duplicate':''} ${state.editMode?'edit-on':''}" data-id="${item.id}" data-idx="${i}">
        <div class="rk-row-swipe-bg"></div>
        <div class="rk-handle" data-role="handle" aria-label="Drag to reorder">
          <svg viewBox="0 0 16 22" width="12" height="16" fill="currentColor">
            <circle cx="4" cy="4" r="1.5"/><circle cx="12" cy="4" r="1.5"/>
            <circle cx="4" cy="11" r="1.5"/><circle cx="12" cy="11" r="1.5"/>
            <circle cx="4" cy="18" r="1.5"/><circle cx="12" cy="18" r="1.5"/>
          </svg>
        </div>
        <div class="rk-rank">${i+1}</div>
        <div class="rk-name" data-role="name" contenteditable="true" spellcheck="false">${escapeHtml(item.name)}</div>
        ${dupeIdxSet.has(i) ? `<div class="rk-dupe-badge" title="Possible duplicate">DUP?</div>` : ''}
        <div class="rk-arrows">
          <button type="button" class="rk-arrow ${i===0?'disabled':''}" data-role="up" aria-label="Move up">▲</button>
          <button type="button" class="rk-arrow ${i===state.items.length-1?'disabled':''}" data-role="down" aria-label="Move down">▼</button>
        </div>
        <button type="button" class="rk-del" data-role="delete" aria-label="Delete">✕</button>
      </div>
    `).join('');
    wireRows();
  }
}

function wireRows(){
  document.querySelectorAll('.rk-row').forEach(row => {
    const id = +row.dataset.id;
    row.querySelector('[data-role="up"]')?.addEventListener('click', () => moveItem(id, -1));
    row.querySelector('[data-role="down"]')?.addEventListener('click', () => moveItem(id, +1));
    row.querySelector('[data-role="delete"]')?.addEventListener('click', () => deleteItem(id));
    const name = row.querySelector('[data-role="name"]');
    name.addEventListener('blur', () => renameItem(id, name.textContent.trim()));
    name.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); name.blur(); }
      else if(e.key === 'Escape'){
        const it = state.items.find(x => x.id === id);
        if(it) name.textContent = it.name;
        name.blur();
      }
    });
    const handle = row.querySelector('[data-role="handle"]');
    handle.addEventListener('pointerdown', e => startDrag(e, row, id));
    attachSwipe(row, id);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Drag & drop
// ─────────────────────────────────────────────────────────────────────────────
let dragState = null;
function startDrag(e, row, id){
  if(e.button != null && e.button !== 0) return;
  e.preventDefault();
  const list = document.getElementById('rk-list');
  const rows = Array.from(list.querySelectorAll('.rk-row'));
  const rect = row.getBoundingClientRect();
  dragState = { id, row, rows, list, startY: e.clientY, offsetY: e.clientY - rect.top, rowHeight: rect.height, currentIdx: rows.indexOf(row) };
  row.classList.add('dragging');
  row.setPointerCapture(e.pointerId);
  row.addEventListener('pointermove', onDragMove);
  row.addEventListener('pointerup', onDragEnd);
  row.addEventListener('pointercancel', onDragEnd);
}
function onDragMove(e){
  if(!dragState) return;
  const { row, rows } = dragState;
  const y = e.clientY;
  const delta = y - dragState.startY;
  row.style.transform = `translateY(${delta}px) scale(1.02)`;
  let targetIdx = dragState.currentIdx;
  rows.forEach((r, idx) => {
    if(r === row) return;
    const rRect = r.getBoundingClientRect();
    const rMid = rRect.top + rRect.height / 2;
    if(y > rRect.top && y < rRect.bottom){
      targetIdx = y < rMid ? idx : idx + 1;
    }
  });
  if(targetIdx < 0) targetIdx = 0;
  if(targetIdx > rows.length) targetIdx = rows.length;
  let effectiveTarget = targetIdx;
  if(targetIdx > dragState.currentIdx) effectiveTarget--;
  rows.forEach(r => r.classList.remove('drop-target-above','drop-target-below'));
  if(effectiveTarget !== dragState.currentIdx && rows[targetIdx]){
    rows[targetIdx].classList.add(targetIdx > dragState.currentIdx ? 'drop-target-below' : 'drop-target-above');
  } else if(effectiveTarget !== dragState.currentIdx && targetIdx === rows.length){
    rows[rows.length - 1].classList.add('drop-target-below');
  }
  dragState._pendingTarget = effectiveTarget;
}
function onDragEnd(e){
  if(!dragState) return;
  const { row, rows, currentIdx } = dragState;
  const target = dragState._pendingTarget;
  row.classList.remove('dragging');
  row.style.transform = '';
  rows.forEach(r => r.classList.remove('drop-target-above','drop-target-below'));
  try{ row.releasePointerCapture(e.pointerId); }catch(err){}
  row.removeEventListener('pointermove', onDragMove);
  row.removeEventListener('pointerup', onDragEnd);
  row.removeEventListener('pointercancel', onDragEnd);
  const fromIdx = currentIdx;
  const toIdx = target != null && target !== fromIdx ? target : fromIdx;
  dragState = null;
  if(toIdx !== fromIdx) reorder(fromIdx, toIdx);
}

// ─────────────────────────────────────────────────────────────────────────────
// Swipe-to-delete
// ─────────────────────────────────────────────────────────────────────────────
function attachSwipe(row, id){
  let startX = null, startY = null, currentDX = 0, tracking = false, horizontal = false;
  const THRESHOLD = 80;
  const HINT = 30;
  const nameEl = row.querySelector('[data-role="name"]');
  const handleEl = row.querySelector('[data-role="handle"]');

  function onStart(e){
    if(e.target === handleEl || handleEl.contains(e.target)) return;
    if(e.target === nameEl || nameEl.contains(e.target)) return;
    if(e.target.closest('.rk-arrow') || e.target.closest('.rk-del')) return;
    if(e.button != null && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY; currentDX = 0;
    tracking = true; horizontal = false;
    row.classList.add('swiping');
    row.addEventListener('pointermove', onMove);
    row.addEventListener('pointerup', onEnd);
    row.addEventListener('pointercancel', onEnd);
  }
  function onMove(e){
    if(!tracking || startX == null) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(!horizontal){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if(Math.abs(dy) > Math.abs(dx)){
        tracking = false;
        row.classList.remove('swiping');
        row.removeEventListener('pointermove', onMove);
        row.removeEventListener('pointerup', onEnd);
        row.removeEventListener('pointercancel', onEnd);
        return;
      }
      horizontal = true;
      try{ row.setPointerCapture(e.pointerId); }catch(err){}
    }
    currentDX = Math.min(0, dx);
    row.style.transform = `translateX(${currentDX}px)`;
    const absDx = Math.abs(currentDX);
    row.classList.toggle('swipe-hint', absDx >= HINT && absDx < THRESHOLD);
    row.classList.toggle('swipe-active', absDx >= THRESHOLD);
  }
  function onEnd(e){
    if(!tracking) return;
    tracking = false;
    row.classList.remove('swiping');
    row.removeEventListener('pointermove', onMove);
    row.removeEventListener('pointerup', onEnd);
    row.removeEventListener('pointercancel', onEnd);
    try{ row.releasePointerCapture(e.pointerId); }catch(err){}
    const triggered = Math.abs(currentDX) >= THRESHOLD;
    row.style.transform = '';
    row.classList.remove('swipe-hint','swipe-active');
    if(triggered) deleteItem(id);
  }
  row.addEventListener('pointerdown', onStart);
}

// ─────────────────────────────────────────────────────────────────────────────
// Input + add
// ─────────────────────────────────────────────────────────────────────────────
const addInput = document.getElementById('rk-new');
const addBtn   = document.getElementById('rk-add-btn');
const suggestHost = document.getElementById('rk-input-suggest-host');

function updateInputUi(){
  const val = addInput.value.trim();
  addBtn.disabled = !val;
  suggestHost.innerHTML = '';
  addInput.classList.remove('warn-dupe');
  if(!val || !state.dedupe) return;
  const match = findMatchAgainstList(val, state.items);
  if(match){
    addInput.classList.add('warn-dupe');
    suggestHost.innerHTML = `<div class="rk-input-suggest">
      <div>Similar to <b>${escapeHtml(match.name)}</b> already on your list.</div>
      <div class="actions">
        <button type="button" class="add-btn" id="rk-force-add">Add anyway</button>
        <button type="button" class="skip-btn" id="rk-skip-add">Skip</button>
      </div>
    </div>`;
    document.getElementById('rk-force-add').addEventListener('click', () => {
      addItem(addInput.value);
      addInput.value = '';
      updateInputUi();
      addInput.focus();
    });
    document.getElementById('rk-skip-add').addEventListener('click', () => {
      addInput.value = '';
      updateInputUi();
      addInput.focus();
    });
  }
}
addInput.addEventListener('input', updateInputUi);
addInput.addEventListener('keydown', e => {
  if(e.key === 'Enter' && addInput.value.trim()){
    const val = addInput.value.trim();
    if(state.dedupe){
      const match = findMatchAgainstList(val, state.items);
      if(match){
        if(!confirm(`"${val}" looks like "${match.name}". Add anyway?`)) return;
      }
    }
    addItem(addInput.value);
    addInput.value = '';
    updateInputUi();
    addInput.focus();
  }
});
addBtn.addEventListener('click', () => {
  if(!addInput.value.trim()) return;
  addItem(addInput.value);
  addInput.value = '';
  updateInputUi();
  addInput.focus();
});

// ─────────────────────────────────────────────────────────────────────────────
// Title editing
// ─────────────────────────────────────────────────────────────────────────────
const titleEl = document.getElementById('rk-title');
titleEl.addEventListener('focus', () => {
  // Select all
  const range = document.createRange();
  range.selectNodeContents(titleEl);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
});
titleEl.addEventListener('blur', () => setCurrentName(titleEl.textContent));
titleEl.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); titleEl.blur(); }
  else if(e.key === 'Escape'){ titleEl.textContent = state.name; titleEl.blur(); }
});

// ─────────────────────────────────────────────────────────────────────────────
// Modal / popover plumbing
// ─────────────────────────────────────────────────────────────────────────────
function openModal(){ document.getElementById('rk-modal-overlay').classList.add('show'); }
function closeModal(){
  document.getElementById('rk-modal-overlay').classList.remove('show');
  document.getElementById('rk-modal').innerHTML = '';
}
document.getElementById('rk-modal-overlay').addEventListener('click', e => {
  if(e.target.id === 'rk-modal-overlay') closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); closePopover(); }
});

// ── Settings modal ──
function openSettingsModal(){
  const modal = document.getElementById('rk-modal');
  modal.innerHTML = `
    <div class="rk-modal-head">
      <div class="rk-modal-title">Settings</div>
      <button type="button" class="rk-modal-x">×</button>
    </div>
    <div class="rk-modal-body">
      <div class="rk-setting">
        <div class="rk-setting-body">
          <div class="rk-setting-title">Fuzzy duplicate detection</div>
          <div class="rk-setting-desc">Warn when adding an item that looks similar to one already on the list (e.g. "The Matrix (1999)" vs "Matrix").</div>
        </div>
        <div class="rk-toggle ${state.dedupe?'on':''}" id="rk-set-dedupe" role="switch" tabindex="0"></div>
      </div>
      <div class="rk-setting">
        <div class="rk-setting-body">
          <div class="rk-setting-title">Edit mode</div>
          <div class="rk-setting-desc">Show up/down arrows and delete buttons on every row. When off, delete by swiping left (with confirm).</div>
        </div>
        <div class="rk-toggle ${state.editMode?'on':''}" id="rk-set-edit" role="switch" tabindex="0"></div>
      </div>
    </div>
    <div class="rk-modal-foot">
      <button type="button" class="btn-secondary" id="rk-close-btn">Done</button>
    </div>
  `;
  modal.querySelector('.rk-modal-x').addEventListener('click', closeModal);
  modal.querySelector('#rk-close-btn').addEventListener('click', closeModal);
  const dedupeT = modal.querySelector('#rk-set-dedupe');
  const editT = modal.querySelector('#rk-set-edit');
  dedupeT.addEventListener('click', () => {
    state.dedupe = !state.dedupe;
    dedupeT.classList.toggle('on', state.dedupe);
    saveCurrent(); updateInputUi(); render();
  });
  editT.addEventListener('click', () => {
    state.editMode = !state.editMode;
    editT.classList.toggle('on', state.editMode);
    saveCurrent(); render();
  });
  openModal();
}
document.getElementById('rk-settings-btn').addEventListener('click', openSettingsModal);

// ── My Lists modal ──
function renderListsModal(){
  const lists = loadLists();
  lists.sort((a,b) => (b._modifiedAt||0) - (a._modifiedAt||0));
  const modal = document.getElementById('rk-modal');
  let body;
  if(!lists.length){
    body = `<div class="rk-lists-empty">
      No saved lists yet.
      <div class="hint">Save your current list with the button below, and it'll show up here.</div>
    </div>`;
  } else {
    body = `<div class="rk-lists">
      ${lists.map(l => {
        const date = new Date(l._modifiedAt || l._createdAt || Date.now());
        const dateStr = date.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'2-digit' });
        const count = (l.items||[]).length;
        const isActive = l.id === state.id;
        return `<div class="rk-list-row ${isActive?'active':''}" data-id="${l.id}">
          <div class="rk-list-info" data-role="load">
            <div class="rk-list-name">${escapeHtml(l.name)}</div>
            <div class="rk-list-meta">${count} item${count!==1?'s':''} · ${dateStr}${isActive ? ' · current' : ''}</div>
          </div>
          <div class="rk-list-actions">
            <button type="button" data-role="rename" title="Rename">✏️</button>
            <button type="button" class="del" data-role="delete" title="Delete">🗑</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
  modal.innerHTML = `
    <div class="rk-modal-head">
      <div class="rk-modal-title">My lists</div>
      <button type="button" class="rk-modal-x">×</button>
    </div>
    <div class="rk-modal-body">${body}</div>
    <div class="rk-modal-foot">
      <button type="button" class="btn-secondary" id="rk-newlist-btn">+ New blank</button>
      <button type="button" class="btn-secondary" id="rk-close-btn">Close</button>
    </div>
  `;
  modal.querySelector('.rk-modal-x').addEventListener('click', closeModal);
  modal.querySelector('#rk-close-btn').addEventListener('click', closeModal);
  modal.querySelector('#rk-newlist-btn').addEventListener('click', () => {
    if(state.items.length && (state.unsaved || !state.id)){
      if(!confirm('Start a new blank list? Unsaved changes will be lost.')) return;
    }
    newList();
    closeModal();
  });
  modal.querySelectorAll('.rk-list-row').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('[data-role="load"]').addEventListener('click', () => {
      if(state.unsaved && state.id !== id){
        if(!confirm('Load this list? Unsaved changes to the current list will be lost.')) return;
      }
      loadList(id);
      closeModal();
    });
    row.querySelector('[data-role="rename"]').addEventListener('click', e => {
      e.stopPropagation();
      renameList(id);
    });
    row.querySelector('[data-role="delete"]').addEventListener('click', e => {
      e.stopPropagation();
      deleteList(id);
    });
  });
  openModal();
}
document.getElementById('rk-mylists-btn').addEventListener('click', renderListsModal);

// ── Export modal ──
function openExport(){
  const text = state.items.map((it, i) => `${i+1}. ${it.name}`).join('\n');
  const modal = document.getElementById('rk-modal');
  modal.innerHTML = `
    <div class="rk-modal-head">
      <div class="rk-modal-title">Export · ${escapeHtml(state.name)}</div>
      <button type="button" class="rk-modal-x">×</button>
    </div>
    <div class="rk-modal-body">
      <textarea class="rk-export-ta" id="rk-export-ta" readonly>${escapeHtml(text || '(empty list)')}</textarea>
    </div>
    <div class="rk-modal-foot">
      <button type="button" class="btn-secondary" id="rk-close-btn">Close</button>
      <button type="button" class="btn-primary" id="rk-copy-btn">Copy to clipboard</button>
    </div>
  `;
  modal.querySelector('.rk-modal-x').addEventListener('click', closeModal);
  modal.querySelector('#rk-close-btn').addEventListener('click', closeModal);
  modal.querySelector('#rk-copy-btn').addEventListener('click', async () => {
    const ta = document.getElementById('rk-export-ta');
    try{ await navigator.clipboard.writeText(ta.value); }
    catch(e){ ta.select(); try{ document.execCommand('copy'); }catch(e){} }
    const btn = document.getElementById('rk-copy-btn');
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy to clipboard';
      btn.classList.remove('copied');
    }, 1600);
  });
  openModal();
  setTimeout(() => document.getElementById('rk-export-ta')?.select(), 60);
}

// ── Overflow popover ──
function openPopover(){
  const pop = document.getElementById('rk-popover');
  const ov = document.getElementById('rk-popover-overlay');
  const hasSavedList = !!state.id;
  const items = [
    {icon:'📋', label:'Export as text', action:()=>{closePopover();openExport();}},
    {icon:'🔀', label:'Shuffle', action:()=>{closePopover();shuffleItems();}},
    {icon:'🧹', label:'Clear all items', action:()=>{closePopover();clearAll();}, danger:false},
  ];
  if(hasSavedList){
    items.push({sep:true});
    items.push({icon:'🗑', label:'Delete this list', action:()=>{closePopover();deleteList(state.id);}, danger:true});
  }
  pop.innerHTML = items.map(it => {
    if(it.sep) return '<div class="sep"></div>';
    return `<button type="button" class="${it.danger?'danger':''}" data-act="${it.label}"><span class="icon">${it.icon}</span>${it.label}</button>`;
  }).join('');
  pop.style.display = 'block';
  ov.classList.add('show');
  // Wire
  pop.querySelectorAll('button').forEach((btn, i) => {
    const realItem = items.filter(x => !x.sep)[i];
    btn.addEventListener('click', () => realItem.action());
  });
}
function closePopover(){
  document.getElementById('rk-popover').style.display = 'none';
  document.getElementById('rk-popover-overlay').classList.remove('show');
}
document.getElementById('rk-overflow-btn').addEventListener('click', openPopover);
document.getElementById('rk-popover-overlay').addEventListener('click', closePopover);

// ── Save button ──
document.getElementById('rk-save-btn').addEventListener('click', () => {
  const btn = document.getElementById('rk-save-btn');
  if(btn.classList.contains('disabled')) return;
  saveCurrentList();
});

// ─────────────────────────────────────────────────────────────────────────────
// Bootstrap
// ─────────────────────────────────────────────────────────────────────────────
const restored = loadCurrent();
if(restored && typeof restored === 'object'){
  state = Object.assign({ id:null, name:'Untitled', items:[], unsaved:false, dedupe:true, editMode:false, dismissedDupes:{} }, restored);
  nextItemId = Math.max(0, ...state.items.map(x=>x.id||0)) + 1;
}
render();
updateInputUi();

if(window.FGHSync && typeof FGHSync.onReady === 'function'){
  FGHSync.onReady(() => {
    if(state.id){
      const cloudList = loadLists().find(l => l.id === state.id);
      if(cloudList && !state.unsaved){
        state.name = cloudList.name;
        state.items = cloudList.items.map(x => ({id:x.id, name:x.name}));
        saveCurrent();
      }
    }
    render();
  });
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Ranker</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
:root{
  --rk-muted:var(--text-3);
  --rk-fg:var(--text);
  --rk-gold:var(--gold);
}
.page{max-width:560px;padding-bottom:calc(120px + var(--safe-b));}
.site-nav .icon-btn{width:38px;height:38px;min-height:38px;padding:0;border-radius:50%;position:relative;}
.site-nav .icon-btn svg{width:19px;height:19px;}
.rk-gear-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--surface),0 0 6px rgba(245,200,66,.7);}

/* ── Title block ──────────────────────────────────────────── */
.rk-title-block{padding:4px 0 16px;}
.rk-title{
  margin:0 -6px;
  font-family:var(--display);font-weight:800;
  font-size:clamp(1.9rem,8vw,2.4rem);line-height:1.08;color:var(--text);
  letter-spacing:-.025em;
  cursor:text;padding:2px 6px;border-radius:10px;outline:none;
  transition:background .12s;
  -webkit-user-select:text;user-select:text;
}
.rk-title:hover{background:rgba(255,255,255,.04);}
.rk-title:focus{background:rgba(245,200,66,.08);box-shadow:0 0 0 2px rgba(245,200,66,.35);}
.rk-subtitle{
  display:flex;align-items:center;gap:8px;margin-top:8px;
  font-size:.85rem;color:var(--text-2);font-weight:500;
}
.rk-status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex-shrink:0;transition:all .2s;}
.rk-status-dot.unsaved{background:var(--gold);box-shadow:0 0 6px rgba(245,200,66,.6);}
.rk-status-dot.saved{background:var(--green);box-shadow:0 0 6px rgba(74,222,128,.45);}

/* ── Duplicate banner ─────────────────────────────────────── */
.rk-dupe-banner{
  display:flex;align-items:flex-start;gap:10px;
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);
  border-radius:var(--r-sm);padding:12px 8px 12px 14px;margin:0 0 12px;
  font-size:.88rem;line-height:1.45;color:var(--text);
}
.rk-dupe-icon{flex-shrink:0;}
.rk-dupe-body{flex:1;min-width:0;}
.rk-dupe-body b{color:#fbbf24;font-weight:700;}
.rk-dupe-dismiss{
  all:unset;cursor:pointer;flex-shrink:0;width:32px;height:32px;margin:-6px 0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:1.2rem;
}
.rk-dupe-dismiss:active{background:rgba(255,255,255,.08);}

/* ── List ─────────────────────────────────────────────────── */
.rk-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.rk-row{
  display:flex;align-items:center;gap:2px;min-height:58px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:6px 8px 6px 2px;
  position:relative;overflow:hidden;
  transition:transform .18s var(--ease),box-shadow .18s,background .18s,border-color .18s;
  touch-action:pan-y; /* let horizontal swipes reach the row */
}
.rk-row.dragging{
  background:var(--surface-2);border-color:rgba(245,200,66,.4);
  box-shadow:0 14px 34px rgba(0,0,0,.55);z-index:10;transition:none;
}
.rk-row.drop-target-above{box-shadow:0 -3px 0 var(--gold);}
.rk-row.drop-target-below{box-shadow:0 3px 0 var(--gold);}
.rk-row.is-duplicate{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.05);}
.rk-row.swiping{transition:none;}
.rk-row-swipe-bg{
  position:absolute;top:0;right:0;bottom:0;left:0;
  display:flex;align-items:center;justify-content:flex-end;padding-right:18px;
  background:linear-gradient(90deg,transparent 0%,rgba(248,113,113,.15) 40%,rgba(248,113,113,.35) 100%);
  color:var(--red);font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  pointer-events:none;opacity:0;transition:opacity .12s;z-index:0;
}
.rk-row.swipe-hint .rk-row-swipe-bg{opacity:1;}
.rk-row-swipe-bg::before{content:"← Swipe to delete";}
.rk-row.swipe-active .rk-row-swipe-bg{opacity:1;background:linear-gradient(90deg,rgba(248,113,113,.25),rgba(239,68,68,.55));}
.rk-row.swipe-active .rk-row-swipe-bg::before{content:"Release to delete";color:#fff;}
.rk-row > *:not(.rk-row-swipe-bg){position:relative;z-index:1;}

/* Drag handle — six-dot grip with a generous hit area */
.rk-handle{
  flex-shrink:0;width:36px;height:44px;
  display:flex;align-items:center;justify-content:center;
  cursor:grab;color:var(--text-3);
  -webkit-user-select:none;user-select:none;touch-action:none;
}
.rk-handle:active{cursor:grabbing;color:var(--gold);}
.rk-handle svg{display:block;}

.rk-rank{
  flex-shrink:0;min-width:30px;text-align:center;
  font-family:var(--display);font-weight:800;
  font-size:1.2rem;color:var(--gold);font-variant-numeric:tabular-nums;
  animation:rankPop .32s var(--ease);
}
.rk-row:nth-child(1) .rk-rank{font-size:1.4rem;}
@keyframes rankPop{0%{transform:scale(.8);opacity:.3;}60%{transform:scale(1.1);opacity:1;}100%{transform:scale(1);opacity:1;}}

.rk-name{
  flex:1;min-width:0;padding:6px 8px;margin:0 2px;
  font-size:1rem;font-weight:500;color:var(--text);
  line-height:1.3;border-radius:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  -webkit-user-select:text;user-select:text;
}
.rk-name[contenteditable]:focus{outline:none;background:rgba(245,200,66,.08);box-shadow:0 0 0 2px rgba(245,200,66,.35);white-space:normal;}
.rk-dupe-badge{
  flex-shrink:0;background:rgba(251,191,36,.18);color:#fbbf24;
  font-size:.7rem;font-weight:800;padding:3px 7px;border-radius:6px;
  letter-spacing:.04em;text-transform:uppercase;margin-right:4px;
}

/* Edit-mode affordances */
.rk-arrows{display:none;gap:4px;flex-shrink:0;margin-right:2px;}
.rk-row.edit-on .rk-arrows{display:flex;}
.rk-arrow{
  all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;color:var(--text-2);background:var(--surface-2);transition:all .12s;
}
.rk-arrow:active{transform:scale(.9);background:rgba(245,200,66,.15);color:var(--gold);}
.rk-arrow.disabled{opacity:.25;pointer-events:none;}
.rk-del{display:none;}
.rk-row.edit-on .rk-del{
  all:unset;display:flex;cursor:pointer;flex-shrink:0;
  width:36px;height:36px;border-radius:10px;
  align-items:center;justify-content:center;
  color:var(--red);background:rgba(248,113,113,.1);font-size:.9rem;
}
.rk-row.edit-on .rk-del:active{background:rgba(248,113,113,.25);}

/* Empty state */
.rk-empty{
  text-align:center;padding:40px 20px;color:var(--text-3);font-size:.95rem;line-height:1.5;
  border:1.5px dashed var(--line-2);border-radius:var(--radius);
}
.rk-empty b{display:block;font-size:2.2rem;margin-bottom:8px;}

/* ── Add row ─────────────────────────────────────────────── */
.rk-add{display:flex;gap:8px;margin-bottom:10px;}
.rk-add input{flex:1;min-width:0;}
.rk-add input.warn-dupe{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.06);}
.rk-add button{flex-shrink:0;min-height:50px;padding:0 20px;}

/* Inline suggestion (dupe detected on input) */
.rk-input-suggest{
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);
  border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px;font-size:.88rem;color:var(--text);
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
}
.rk-input-suggest b{color:#fbbf24;}
.rk-input-suggest .actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0;}
.rk-input-suggest button{all:unset;cursor:pointer;min-height:36px;padding:0 12px;border-radius:10px;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;}
.rk-input-suggest .skip-btn{background:rgba(255,255,255,.08);color:var(--text-2);}
.rk-input-suggest .add-btn{background:rgba(251,191,36,.2);color:#fbbf24;}

/* ── Docked bottom action bar ────────────────────────────── */
.rk-footer{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;justify-content:center;
  padding:12px max(16px,var(--safe-r)) calc(12px + var(--safe-b)) max(16px,var(--safe-l));
  background:rgba(11,13,18,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
}
.rk-footer-in{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;max-width:528px;}
.rk-save-btn{min-height:52px;font-size:1rem;}
.rk-save-btn.disabled{opacity:.4;pointer-events:none;}
.rk-save-btn.saved-flash{background:linear-gradient(135deg,#4ade80,#22c55e);color:#052e16;box-shadow:0 8px 22px rgba(34,197,94,.25);}
.rk-save-btn svg{width:18px;height:18px;}
.rk-overflow-btn{width:52px;min-height:52px;padding:0;font-size:1.3rem;letter-spacing:1px;}

/* ── Modal scaffolding (bottom sheet on phones) ──────────── */
.rk-modal-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.rk-modal-overlay.show{display:flex;animation:gn-fade .2s ease both;}
.rk-modal{
  width:100%;max-width:440px;max-height:86vh;overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line-2);border-radius:24px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
  animation:gn-pop .28s var(--spring) both;
}
@media (max-width:599px){
  .rk-modal-overlay{align-items:flex-end;padding:0;}
  .rk-modal{max-width:none;max-height:88dvh;border-radius:26px 26px 0 0;border-bottom:0;animation:gn-sheet .32s var(--ease) both;}
  .rk-modal-foot{padding-bottom:calc(16px + var(--safe-b)) !important;}
}
.rk-modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;}
.rk-modal-title{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-modal-x{
  all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;flex:none;
  background:var(--surface-3);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;line-height:1;
}
.rk-modal-body{padding:4px 18px 14px;overflow-y:auto;flex:1;}
.rk-modal-foot{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:8px;}
.rk-modal-foot button{flex:1;}

/* Settings toggle rows (inset grouped list) */
.rk-settings{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.rk-setting{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;}
.rk-setting:first-child{border-top:none;}
.rk-setting-body{flex:1;min-width:0;}
.rk-setting-title{font-size:1rem;font-weight:600;color:var(--text);}
.rk-setting-desc{font-size:.82rem;color:var(--text-3);margin-top:3px;line-height:1.45;}
.rk-toggle{position:relative;width:51px;height:31px;border-radius:999px;background:var(--surface-3);cursor:pointer;transition:background .2s;flex-shrink:0;}
.rk-toggle.on{background:var(--green);}
.rk-toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .22s var(--spring);}
.rk-toggle.on::after{transform:translateX(20px);}

/* Overflow menu (iOS-style context menu above the bar) */
.rk-popover-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:none;}
.rk-popover-overlay.show{display:block;animation:gn-fade .15s ease both;}
.rk-popover{
  position:fixed;bottom:calc(84px + var(--safe-b));right:max(16px,calc(50vw - 264px));z-index:95;
  background:rgba(34,39,52,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--line-2);border-radius:16px;padding:6px;min-width:240px;
  box-shadow:0 18px 40px rgba(0,0,0,.55);
  animation:popoverIn .2s var(--ease);transform-origin:bottom right;
}
@keyframes popoverIn{from{transform:scale(.92) translateY(6px);opacity:0;}to{transform:none;opacity:1;}}
.rk-popover button{
  all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;
  width:100%;box-sizing:border-box;min-height:46px;padding:0 14px;border-radius:10px;
  font-size:1rem;color:var(--text);
}
.rk-popover button:active{background:rgba(255,255,255,.08);}
.rk-popover button.danger{color:var(--red);}
.rk-popover button .icon{font-size:1.05rem;width:22px;text-align:center;flex-shrink:0;}
.rk-popover .sep{border-top:1px solid var(--line-2);margin:4px 6px;}

/* Export textarea */
.rk-export-ta{
  width:100%;min-height:200px;max-height:40vh;padding:14px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);
  font-family:var(--mono);font-size:.9rem !important;resize:vertical;line-height:1.55;outline:none;
}
.btn.copied{background:linear-gradient(135deg,#4ade80,#22c55e);color:#052e16;}

/* My Lists */
.rk-lists{display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.rk-list-row{display:flex;align-items:center;gap:6px;min-height:62px;padding:6px 8px 6px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s;}
.rk-list-row:first-child{border-top:0;}
.rk-list-row:active{background:var(--surface-3);}
.rk-list-row.active{background:rgba(245,200,66,.07);}
.rk-list-info{flex:1;min-width:0;}
.rk-list-name{font-weight:700;font-size:1rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-list-row.active .rk-list-name{color:var(--gold);}
.rk-list-meta{font-size:.8rem;color:var(--text-3);margin-top:2px;}
.rk-list-actions{display:flex;gap:4px;flex-shrink:0;}
.rk-list-actions button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:.95rem;}
.rk-list-actions button:active{background:rgba(255,255,255,.08);}
.rk-lists-empty{text-align:center;padding:28px 12px;color:var(--text-2);font-size:.95rem;line-height:1.5;}
.rk-lists-empty .hint{color:var(--text-3);font-size:.85rem;margin-top:8px;}
/* Text-entry sheet */
.rk-ask-input{margin-top:4px;text-align:left;}
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Ranker</span>
  <button class="icon-btn" id="rk-mylists-btn" type="button" aria-label="My lists" title="My lists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg></button>
  <button class="icon-btn" id="rk-settings-btn" type="button" aria-label="Settings" title="Settings"></button>
</nav>

<div class="page">
<!-- ── Title + status ──────────────────────────────── -->
<div class="rk-title-block">
  <h1 class="rk-title" id="rk-title" contenteditable="true" spellcheck="false">Untitled</h1>
  <div class="rk-subtitle">
    <span class="rk-status-dot" id="rk-status-dot"></span>
    <span id="rk-status-text">Draft</span>
  </div>
</div>

<!-- ── Dup banner / list / add ──────────────── -->
<div id="rk-dupe-banner-host"></div>
<div class="rk-list" id="rk-list"></div>

<div class="rk-add">
  <input type="text" class="input" id="rk-new" placeholder="Add an item…" maxlength="120" autocomplete="off" enterkeyhint="done">
  <button type="button" class="btn btn-outline" id="rk-add-btn" disabled>Add</button>
</div>
<div id="rk-input-suggest-host"></div>
</div>

<div class="rk-footer"><div class="rk-footer-in">
  <button class="btn btn-gold rk-save-btn" id="rk-save-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </svg>
    <span id="rk-save-btn-label">Save list</span>
  </button>
  <button class="btn btn-outline rk-overflow-btn" id="rk-overflow-btn" type="button" aria-label="More actions">⋯</button>
</div></div>

<!-- ── Modal scaffolding ─────────────────────────────── -->
<div class="rk-modal-overlay" id="rk-modal-overlay">
  <div class="rk-modal" id="rk-modal"></div>
</div>

<!-- ── Overflow popover ──────────────────────────────── -->
<div class="rk-popover-overlay" id="rk-popover-overlay"></div>
<div class="rk-popover" id="rk-popover" style="display:none;"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// Ranker — drag/drop, saved lists (per PIN via rklists), fuzzy dedup,
// edit-mode toggle, swipe-to-delete.
// ═══════════════════════════════════════════════════════════════════════════

const STORAGE_KEY_LISTS   = 'rklists';
const STORAGE_KEY_CURRENT = 'ranker_current';

let state = {
  id: null,
  name: 'Untitled',
  items: [],
  unsaved: false,
  dedupe: true,
  editMode: false,
  dismissedDupes: {},
};
let nextItemId = 1;
const haptic = k => { try{ window.GN && GN.haptic(k); }catch(e){} };

// Native-style dialogs (fall back to window.confirm/prompt if app.js is missing)
function askConfirm(message, opts){
  if(window.GN && GN.confirm) return GN.confirm(message, opts||{});
  return Promise.resolve(window.confirm(message));
}
function askText(title, initial, okLabel){
  if(!(window.GN && GN.sheet)) return Promise.resolve(window.prompt(title, initial||''));
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'input rk-ask-input'; inp.value = initial || '';
    inp.maxLength = 120; inp.setAttribute('enterkeyhint','done');
    let done = false;
    const finish = v => { if(done) return; done = true; resolve(v); };
    const sh = GN.sheet({
      title: title, body: inp,
      actions: [
        {label: okLabel || 'Save', primary: true, onClick: () => finish(inp.value)},
        {label: 'Cancel', onClick: () => finish(null)}
      ],
      onCancel: () => finish(null)
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); const b = sh.el.querySelector('.btn-gold'); if(b) b.click(); }
    });
    setTimeout(() => { inp.focus(); inp.select(); }, 60);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Storage helpers
// ─────────────────────────────────────────────────────────────────────────────
function loadLists(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_LISTS);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    if(parsed && Array.isArray(parsed.lists)) return parsed.lists;
    return [];
  }catch(e){ return []; }
}
function saveLists(lists){
  try{ localStorage.setItem(STORAGE_KEY_LISTS, JSON.stringify({lists:lists})); }catch(e){}
  try{ FGHSync.noteWrite(STORAGE_KEY_LISTS); }catch(e){}
}
function saveCurrent(){
  try{ localStorage.setItem(STORAGE_KEY_CURRENT, JSON.stringify(state)); }catch(e){}
}
function loadCurrent(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_CURRENT);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function newId(){ return 'rk_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }

// ─────────────────────────────────────────────────────────────────────────────
// Fuzzy duplicate detection
// ─────────────────────────────────────────────────────────────────────────────
function normalizeForCompare(s){
  if(!s) return '';
  let out = String(s).toLowerCase();
  out = out.replace(/\([^)]*\)/g, ' ');
  out = out.replace(/\[[^\]]*\]/g, ' ');
  out = out.replace(/[^a-z0-9\s]+/g, ' ');
  out = out.replace(/\s+/g, ' ').trim();
  out = out.replace(/^(the|a|an)\s+/, '');
  return out;
}
function editDistance(a, b){
  if(a === b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  let prev = new Array(b.length + 1);
  let cur  = new Array(b.length + 1);
  for(let j = 0; j <= b.length; j++) prev[j] = j;
  for(let i = 1; i <= a.length; i++){
    cur[0] = i;
    for(let j = 1; j <= b.length; j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(cur[j-1]+1, prev[j]+1, prev[j-1]+cost);
    }
    [prev, cur] = [cur, prev];
  }
  return prev[b.length];
}
function similarity(a, b){
  if(!a.length || !b.length) return 0;
  return 1 - editDistance(a, b) / Math.max(a.length, b.length);
}
function isFuzzyDup(aRaw, bRaw){
  const a = normalizeForCompare(aRaw);
  const b = normalizeForCompare(bRaw);
  if(!a || !b) return false;
  if(a === b) return true;
  if(a.length >= 3 && b.length >= 3){
    if(b.indexOf(a) >= 0 || a.indexOf(b) >= 0) return true;
  }
  const sim = similarity(a, b);
  const threshold = Math.max(a.length, b.length) >= 8 ? 0.82 : 0.90;
  return sim >= threshold;
}
function findDuplicateGroups(items){
  const groups = [];
  const assigned = new Array(items.length).fill(-1);
  for(let i = 0; i < items.length; i++){
    if(assigned[i] >= 0) continue;
    const group = [{idx: i, item: items[i]}];
    assigned[i] = groups.length;
    for(let j = i + 1; j < items.length; j++){
      if(assigned[j] >= 0) continue;
      if(isFuzzyDup(items[i].name, items[j].name)){
        group.push({idx: j, item: items[j]});
        assigned[j] = groups.length;
      }
    }
    if(group.length >= 2) groups.push(group);
  }
  return groups;
}
function findMatchAgainstList(newName, items){
  for(let i = 0; i < items.length; i++){
    if(isFuzzyDup(newName, items[i].name)) return items[i];
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// State mutations
// ─────────────────────────────────────────────────────────────────────────────
function markDirty(){
  state.unsaved = !!state.id;
  saveCurrent();
}

function addItem(name){
  const trimmed = (name||'').trim();
  if(!trimmed) return;
  state.items.push({ id: nextItemId++, name: trimmed });
  if(!state.id) state.unsaved = true;  // mark draft as dirty too
  markDirty();
  render();
}

async function deleteItem(id, opts){
  const it = state.items.find(x => x.id === id);
  if(!it) return;
  const skipConfirm = (opts && opts.skipConfirm) || state.editMode;
  if(!skipConfirm){
    if(!(await askConfirm(`Delete "${it.name}"?`, {ok:'Delete', danger:true}))) return;
  }
  haptic('medium');
  state.items = state.items.filter(x => x.id !== id);
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function renameItem(id, newName){
  const trimmed = (newName||'').trim();
  const it = state.items.find(x => x.id === id);
  if(!it || !trimmed || it.name === trimmed) return;
  it.name = trimmed;
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function moveItem(id, delta){
  const idx = state.items.findIndex(x => x.id === id);
  if(idx < 0) return;
  const target = idx + delta;
  if(target < 0 || target >= state.items.length) return;
  [state.items[idx], state.items[target]] = [state.items[target], state.items[idx]];
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function reorder(fromIdx, toIdx){
  if(fromIdx === toIdx) return;
  const [moved] = state.items.splice(fromIdx, 1);
  state.items.splice(toIdx, 0, moved);
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function shuffleItems(){
  for(let i = state.items.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [state.items[i], state.items[j]] = [state.items[j], state.items[i]];
  }
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

async function clearAll(){
  if(!state.items.length) return;
  if(!(await askConfirm('Clear all items from this list?', {ok:'Clear all', danger:true}))) return;
  state.items = [];
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

function newList(){
  state = { id:null, name:'Untitled', items:[], unsaved:false, dedupe: state.dedupe, editMode: state.editMode, dismissedDupes:{} };
  nextItemId = 1;
  saveCurrent();
  render();
}

function setCurrentName(name){
  const trimmed = (name||'').trim() || 'Untitled';
  state.name = trimmed;
  if(!state.id) state.unsaved = true;
  markDirty();
  render();
}

async function saveCurrentList(){
  const lists = loadLists();
  if(state.id){
    const existing = lists.find(l => l.id === state.id);
    if(existing){
      existing.name = state.name;
      existing.items = state.items.map(x => ({id:x.id, name:x.name}));
      existing._modifiedAt = Date.now();
      saveLists(lists);
      state.unsaved = false;
      saveCurrent();
      render();
      flashSaved();
      return;
    }
  }
  // New save — if still Untitled, prompt
  let name = state.name;
  if(!name || name === 'Untitled'){
    const chosen = await askText('Name this list', state.items.length ? 'My List' : '', 'Save');
    if(chosen == null) return;
    name = (chosen||'').trim() || 'Untitled';
  }
  const now = Date.now();
  const listObj = {
    id: newId(),
    name: name,
    items: state.items.map(x => ({id:x.id, name:x.name})),
    _createdAt: now,
    _modifiedAt: now
  };
  lists.push(listObj);
  saveLists(lists);
  state.id = listObj.id;
  state.name = name;
  state.unsaved = false;
  saveCurrent();
  render();
  flashSaved();
}

function loadList(id){
  const lists = loadLists();
  const list = lists.find(l => l.id === id);
  if(!list) return;
  let itemsArr = list.items;
  if(!Array.isArray(itemsArr) && itemsArr && typeof itemsArr === 'object'){
    const keys = Object.keys(itemsArr);
    if(keys.length && keys.every(k => /^\d+$/.test(k))){
      itemsArr = keys.sort((a,b)=>+a-+b).map(k => itemsArr[k]);
    } else {
      itemsArr = Object.values(itemsArr);
    }
  }
  if(!Array.isArray(itemsArr)) itemsArr = [];
  state = {
    id: list.id,
    name: list.name,
    items: itemsArr.filter(x => x && x.name).map(x => ({id:x.id, name:x.name})),
    unsaved: false,
    dedupe: state.dedupe,
    editMode: state.editMode,
    dismissedDupes: {}
  };
  nextItemId = Math.max(0, ...state.items.map(x=>x.id||0)) + 1;
  saveCurrent();
  render();
}

async function deleteList(id){
  let lists = loadLists();
  let idx = lists.findIndex(l => l.id === id);
  if(idx < 0) return;
  const list = lists[idx];
  if(!(await askConfirm(`Delete "${list.name}"? This can't be undone.`, {ok:'Delete list', danger:true}))) return;
  lists = loadLists(); idx = lists.findIndex(l => l.id === id);
  if(idx < 0) return;
  lists.splice(idx, 1);
  saveLists(lists);
  if(state.id === id){
    newList();
  } else {
    renderListsModal();
  }
}

async function renameList(id){
  const chosen0 = loadLists().find(l => l.id === id);
  if(!chosen0) return;
  const chosen = await askText('Rename list', chosen0.name, 'Rename');
  if(chosen == null) return;
  const lists = loadLists();
  const list = lists.find(l => l.id === id);
  if(!list) return;
  const trimmed = (chosen||'').trim() || list.name;
  list.name = trimmed;
  list._modifiedAt = Date.now();
  saveLists(lists);
  if(state.id === id){ state.name = trimmed; saveCurrent(); }
  renderListsModal();
  render();
}

function flashSaved(){
  const btn = document.getElementById('rk-save-btn');
  if(!btn) return;
  btn.classList.add('saved-flash');
  const label = document.getElementById('rk-save-btn-label');
  const prevLabel = label ? label.textContent : null;
  if(label) label.textContent = 'Saved ✓';
  haptic('success');
  setTimeout(() => {
    btn.classList.remove('saved-flash');
    render();  // restores correct button label based on state
  }, 1400);
}

// ─────────────────────────────────────────────────────────────────────────────
// Rendering
// ─────────────────────────────────────────────────────────────────────────────
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  // Title
  const titleEl = document.getElementById('rk-title');
  if(titleEl && document.activeElement !== titleEl){
    titleEl.textContent = state.name || 'Untitled';
  }

  // Status
  const dot = document.getElementById('rk-status-dot');
  const text = document.getElementById('rk-status-text');
  dot.className = 'rk-status-dot';
  const hasItems = state.items.length > 0;
  const baseHint = hasItems ? ' · drag to rank, tap to edit' : '';
  if(state.id){
    if(state.unsaved){
      dot.classList.add('unsaved');
      text.textContent = 'Unsaved' + baseHint;
    } else {
      dot.classList.add('saved');
      text.textContent = 'Saved' + baseHint;
    }
  } else {
    if(state.unsaved || state.items.length){
      dot.classList.add('unsaved');
      text.textContent = 'Draft' + baseHint;
    } else {
      text.textContent = 'Draft · start by adding items below';
    }
  }

  // Save button enabled only when there's something worth saving
  const saveBtn = document.getElementById('rk-save-btn');
  const saveLbl = document.getElementById('rk-save-btn-label');
  const hasChanges = state.unsaved || !state.id;
  const canSave = state.items.length > 0 || state.id;
  saveBtn.classList.toggle('disabled', !canSave || (!hasChanges && !!state.id));
  if(state.id){
    saveLbl.textContent = hasChanges ? 'Save changes' : 'Saved';
  } else {
    saveLbl.textContent = 'Save list';
  }

  // Settings gear — add subtle dot when non-default settings are on
  const gear = document.getElementById('rk-settings-btn');
  // Default is dedupe ON + editMode OFF. Anything else = "custom"
  const customSettings = !state.dedupe || state.editMode;
  const GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
  gear.innerHTML = GEAR + (customSettings ? '<span class="rk-gear-dot"></span>' : '');

  // Duplicate groups
  const dupeGroups = state.dedupe ? findDuplicateGroups(state.items) : [];
  const dupeIdxSet = new Set();
  dupeGroups.forEach(g => g.forEach(m => dupeIdxSet.add(m.idx)));

  // Duplicate banner
  const bannerHost = document.getElementById('rk-dupe-banner-host');
  if(dupeGroups.length && !state.dismissedDupes['_global']){
    const pairs = dupeGroups.map(g =>
      '"' + escapeHtml(g.map(m => m.item.name).join('" ≈ "')) + '"'
    ).join(', ');
    bannerHost.innerHTML = `<div class="rk-dupe-banner">
      <div class="rk-dupe-icon">⚠️</div>
      <div class="rk-dupe-body">
        <b>${dupeGroups.length} possible duplicate${dupeGroups.length>1?'s':''}.</b>
        ${pairs.length > 160 ? pairs.slice(0,160)+'…' : pairs}
      </div>
      <button class="rk-dupe-dismiss" id="rk-dupe-dismiss" title="Dismiss">×</button>
    </div>`;
    document.getElementById('rk-dupe-dismiss').addEventListener('click', () => {
      state.dismissedDupes['_global'] = true;
      saveCurrent();
      render();
    });
  } else {
    bannerHost.innerHTML = '';
  }

  // List
  const list = document.getElementById('rk-list');
  if(!state.items.length){
    list.innerHTML = `<div class="rk-empty"><b>🏅</b>No items yet.<br>Add your first item below to start ranking.</div>`;
  } else {
    list.innerHTML = state.items.map((item, i) => `
      <div class="rk-row ${dupeIdxSet.has(i)?'is-duplicate':''} ${state.editMode?'edit-on':''}" data-id="${item.id}" data-idx="${i}">
        <div class="rk-row-swipe-bg"></div>
        <div class="rk-handle" data-role="handle" aria-label="Drag to reorder">
          <svg viewBox="0 0 16 22" width="13" height="18" fill="currentColor">
            <circle cx="4" cy="4" r="1.5"/><circle cx="12" cy="4" r="1.5"/>
            <circle cx="4" cy="11" r="1.5"/><circle cx="12" cy="11" r="1.5"/>
            <circle cx="4" cy="18" r="1.5"/><circle cx="12" cy="18" r="1.5"/>
          </svg>
        </div>
        <div class="rk-rank">${i+1}</div>
        <div class="rk-name" data-role="name" contenteditable="true" spellcheck="false">${escapeHtml(item.name)}</div>
        ${dupeIdxSet.has(i) ? `<div class="rk-dupe-badge" title="Possible duplicate">DUP?</div>` : ''}
        <div class="rk-arrows">
          <button type="button" class="rk-arrow ${i===0?'disabled':''}" data-role="up" aria-label="Move up">▲</button>
          <button type="button" class="rk-arrow ${i===state.items.length-1?'disabled':''}" data-role="down" aria-label="Move down">▼</button>
        </div>
        <button type="button" class="rk-del" data-role="delete" aria-label="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      </div>
    `).join('');
    wireRows();
  }
}

function wireRows(){
  document.querySelectorAll('.rk-row').forEach(row => {
    const id = +row.dataset.id;
    row.querySelector('[data-role="up"]')?.addEventListener('click', () => moveItem(id, -1));
    row.querySelector('[data-role="down"]')?.addEventListener('click', () => moveItem(id, +1));
    row.querySelector('[data-role="delete"]')?.addEventListener('click', () => deleteItem(id));
    const name = row.querySelector('[data-role="name"]');
    name.addEventListener('blur', () => renameItem(id, name.textContent.trim()));
    name.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); name.blur(); }
      else if(e.key === 'Escape'){
        const it = state.items.find(x => x.id === id);
        if(it) name.textContent = it.name;
        name.blur();
      }
    });
    const handle = row.querySelector('[data-role="handle"]');
    handle.addEventListener('pointerdown', e => startDrag(e, row, id));
    attachSwipe(row, id);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Drag & drop
// ─────────────────────────────────────────────────────────────────────────────
let dragState = null;
function startDrag(e, row, id){
  if(e.button != null && e.button !== 0) return;
  e.preventDefault();
  const list = document.getElementById('rk-list');
  const rows = Array.from(list.querySelectorAll('.rk-row'));
  const rect = row.getBoundingClientRect();
  dragState = { id, row, rows, list, startY: e.clientY, offsetY: e.clientY - rect.top, rowHeight: rect.height, currentIdx: rows.indexOf(row) };
  row.classList.add('dragging');
  haptic('light');
  row.setPointerCapture(e.pointerId);
  row.addEventListener('pointermove', onDragMove);
  row.addEventListener('pointerup', onDragEnd);
  row.addEventListener('pointercancel', onDragEnd);
}
function onDragMove(e){
  if(!dragState) return;
  const { row, rows } = dragState;
  const y = e.clientY;
  const delta = y - dragState.startY;
  row.style.transform = `translateY(${delta}px) scale(1.02)`;
  let targetIdx = dragState.currentIdx;
  rows.forEach((r, idx) => {
    if(r === row) return;
    const rRect = r.getBoundingClientRect();
    const rMid = rRect.top + rRect.height / 2;
    if(y > rRect.top && y < rRect.bottom){
      targetIdx = y < rMid ? idx : idx + 1;
    }
  });
  if(targetIdx < 0) targetIdx = 0;
  if(targetIdx > rows.length) targetIdx = rows.length;
  let effectiveTarget = targetIdx;
  if(targetIdx > dragState.currentIdx) effectiveTarget--;
  rows.forEach(r => r.classList.remove('drop-target-above','drop-target-below'));
  if(effectiveTarget !== dragState.currentIdx && rows[targetIdx]){
    rows[targetIdx].classList.add(targetIdx > dragState.currentIdx ? 'drop-target-below' : 'drop-target-above');
  } else if(effectiveTarget !== dragState.currentIdx && targetIdx === rows.length){
    rows[rows.length - 1].classList.add('drop-target-below');
  }
  dragState._pendingTarget = effectiveTarget;
}
function onDragEnd(e){
  if(!dragState) return;
  const { row, rows, currentIdx } = dragState;
  const target = dragState._pendingTarget;
  row.classList.remove('dragging');
  row.style.transform = '';
  rows.forEach(r => r.classList.remove('drop-target-above','drop-target-below'));
  try{ row.releasePointerCapture(e.pointerId); }catch(err){}
  row.removeEventListener('pointermove', onDragMove);
  row.removeEventListener('pointerup', onDragEnd);
  row.removeEventListener('pointercancel', onDragEnd);
  const fromIdx = currentIdx;
  const toIdx = target != null && target !== fromIdx ? target : fromIdx;
  dragState = null;
  if(toIdx !== fromIdx){ haptic('select'); reorder(fromIdx, toIdx); }
}

// ─────────────────────────────────────────────────────────────────────────────
// Swipe-to-delete
// ─────────────────────────────────────────────────────────────────────────────
function attachSwipe(row, id){
  let startX = null, startY = null, currentDX = 0, tracking = false, horizontal = false;
  const THRESHOLD = 80;
  const HINT = 30;
  const nameEl = row.querySelector('[data-role="name"]');
  const handleEl = row.querySelector('[data-role="handle"]');

  function onStart(e){
    if(e.target === handleEl || handleEl.contains(e.target)) return;
    // Swipes may start on the name (it fills most of the row) unless it's being edited
    if(document.activeElement === nameEl) return;
    if(e.target.closest('.rk-arrow') || e.target.closest('.rk-del')) return;
    if(e.button != null && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY; currentDX = 0;
    tracking = true; horizontal = false;
    row.classList.add('swiping');
    row.addEventListener('pointermove', onMove);
    row.addEventListener('pointerup', onEnd);
    row.addEventListener('pointercancel', onEnd);
  }
  function onMove(e){
    if(!tracking || startX == null) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(!horizontal){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if(Math.abs(dy) > Math.abs(dx)){
        tracking = false;
        row.classList.remove('swiping');
        row.removeEventListener('pointermove', onMove);
        row.removeEventListener('pointerup', onEnd);
        row.removeEventListener('pointercancel', onEnd);
        return;
      }
      horizontal = true;
      try{ row.setPointerCapture(e.pointerId); }catch(err){}
    }
    currentDX = Math.min(0, dx);
    row.style.transform = `translateX(${currentDX}px)`;
    const absDx = Math.abs(currentDX);
    row.classList.toggle('swipe-hint', absDx >= HINT && absDx < THRESHOLD);
    row.classList.toggle('swipe-active', absDx >= THRESHOLD);
  }
  function onEnd(e){
    if(!tracking) return;
    tracking = false;
    row.classList.remove('swiping');
    row.removeEventListener('pointermove', onMove);
    row.removeEventListener('pointerup', onEnd);
    row.removeEventListener('pointercancel', onEnd);
    try{ row.releasePointerCapture(e.pointerId); }catch(err){}
    const triggered = Math.abs(currentDX) >= THRESHOLD;
    row.style.transform = '';
    row.classList.remove('swipe-hint','swipe-active');
    if(triggered) deleteItem(id);
  }
  row.addEventListener('pointerdown', onStart);
}

// ─────────────────────────────────────────────────────────────────────────────
// Input + add
// ─────────────────────────────────────────────────────────────────────────────
const addInput = document.getElementById('rk-new');
const addBtn   = document.getElementById('rk-add-btn');
const suggestHost = document.getElementById('rk-input-suggest-host');

function updateInputUi(){
  const val = addInput.value.trim();
  addBtn.disabled = !val;
  suggestHost.innerHTML = '';
  addInput.classList.remove('warn-dupe');
  if(!val || !state.dedupe) return;
  const match = findMatchAgainstList(val, state.items);
  if(match){
    addInput.classList.add('warn-dupe');
    suggestHost.innerHTML = `<div class="rk-input-suggest">
      <div>Similar to <b>${escapeHtml(match.name)}</b> already on your list.</div>
      <div class="actions">
        <button type="button" class="add-btn" id="rk-force-add">Add anyway</button>
        <button type="button" class="skip-btn" id="rk-skip-add">Skip</button>
      </div>
    </div>`;
    document.getElementById('rk-force-add').addEventListener('click', () => {
      addItem(addInput.value);
      addInput.value = '';
      updateInputUi();
      addInput.focus();
    });
    document.getElementById('rk-skip-add').addEventListener('click', () => {
      addInput.value = '';
      updateInputUi();
      addInput.focus();
    });
  }
}
addInput.addEventListener('input', updateInputUi);
addInput.addEventListener('keydown', e => {
  if(e.key === 'Enter' && addInput.value.trim()){
    const val = addInput.value.trim();
    if(state.dedupe){
      const match = findMatchAgainstList(val, state.items);
      if(match){
        addInput.blur();
        askConfirm(`"${val}" looks like "${match.name}". Add anyway?`, {title:'Possible duplicate', ok:'Add anyway'}).then(ok => {
          if(!ok){ addInput.focus(); return; }
          addItem(val); addInput.value = ''; updateInputUi(); addInput.focus();
        });
        return;
      }
    }
    addItem(addInput.value);
    addInput.value = '';
    updateInputUi();
    addInput.focus();
  }
});
addBtn.addEventListener('click', () => {
  if(!addInput.value.trim()) return;
  addItem(addInput.value);
  addInput.value = '';
  updateInputUi();
  addInput.focus();
});

// ─────────────────────────────────────────────────────────────────────────────
// Title editing
// ─────────────────────────────────────────────────────────────────────────────
const titleEl = document.getElementById('rk-title');
titleEl.addEventListener('focus', () => {
  // Select all
  const range = document.createRange();
  range.selectNodeContents(titleEl);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
});
titleEl.addEventListener('blur', () => setCurrentName(titleEl.textContent));
titleEl.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); titleEl.blur(); }
  else if(e.key === 'Escape'){ titleEl.textContent = state.name; titleEl.blur(); }
});

// ─────────────────────────────────────────────────────────────────────────────
// Modal / popover plumbing
// ─────────────────────────────────────────────────────────────────────────────
function openModal(){ document.getElementById('rk-modal-overlay').classList.add('show'); }
function closeModal(){
  document.getElementById('rk-modal-overlay').classList.remove('show');
  document.getElementById('rk-modal').innerHTML = '';
}
document.getElementById('rk-modal-overlay').addEventListener('click', e => {
  if(e.target.id === 'rk-modal-overlay') closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); closePopover(); }
});

// ── Settings modal ──
function openSettingsModal(){
  const modal = document.getElementById('rk-modal');
  modal.innerHTML = `
    <div class="rk-modal-head">
      <div class="rk-modal-title">Settings</div>
      <button type="button" class="rk-modal-x">×</button>
    </div>
    <div class="rk-modal-body"><div class="rk-settings">
      <div class="rk-setting">
        <div class="rk-setting-body">
          <div class="rk-setting-title">Fuzzy duplicate detection</div>
          <div class="rk-setting-desc">Warn when adding an item that looks similar to one already on the list (e.g. "The Matrix (1999)" vs "Matrix").</div>
        </div>
        <div class="rk-toggle ${state.dedupe?'on':''}" id="rk-set-dedupe" role="switch" tabindex="0"></div>
      </div>
      <div class="rk-setting">
        <div class="rk-setting-body">
          <div class="rk-setting-title">Edit mode</div>
          <div class="rk-setting-desc">Show up/down arrows and delete buttons on every row. When off, delete by swiping left (with confirm).</div>
        </div>
        <div class="rk-toggle ${state.editMode?'on':''}" id="rk-set-edit" role="switch" tabindex="0"></div>
      </div>
    </div></div>
    <div class="rk-modal-foot">
      <button type="button" class="btn btn-gold" id="rk-close-btn">Done</button>
    </div>
  `;
  modal.querySelector('.rk-modal-x').addEventListener('click', closeModal);
  modal.querySelector('#rk-close-btn').addEventListener('click', closeModal);
  const dedupeT = modal.querySelector('#rk-set-dedupe');
  const editT = modal.querySelector('#rk-set-edit');
  dedupeT.closest('.rk-setting').addEventListener('click', () => {
    state.dedupe = !state.dedupe;haptic('select');
    dedupeT.classList.toggle('on', state.dedupe);
    saveCurrent(); updateInputUi(); render();
  });
  editT.closest('.rk-setting').addEventListener('click', () => {
    state.editMode = !state.editMode;haptic('select');
    editT.classList.toggle('on', state.editMode);
    saveCurrent(); render();
  });
  openModal();
}
document.getElementById('rk-settings-btn').addEventListener('click', openSettingsModal);

// ── My Lists modal ──
function renderListsModal(){
  const lists = loadLists();
  lists.sort((a,b) => (b._modifiedAt||0) - (a._modifiedAt||0));
  const modal = document.getElementById('rk-modal');
  let body;
  if(!lists.length){
    body = `<div class="rk-lists-empty">
      No saved lists yet.
      <div class="hint">Save your current list with the button below, and it'll show up here.</div>
    </div>`;
  } else {
    body = `<div class="rk-lists">
      ${lists.map(l => {
        const date = new Date(l._modifiedAt || l._createdAt || Date.now());
        const dateStr = date.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'2-digit' });
        const count = (l.items||[]).length;
        const isActive = l.id === state.id;
        return `<div class="rk-list-row ${isActive?'active':''}" data-id="${l.id}">
          <div class="rk-list-info" data-role="load">
            <div class="rk-list-name">${escapeHtml(l.name)}</div>
            <div class="rk-list-meta">${count} item${count!==1?'s':''} · ${dateStr}${isActive ? ' · current' : ''}</div>
          </div>
          <div class="rk-list-actions">
            <button type="button" data-role="rename" title="Rename" aria-label="Rename"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
            <button type="button" class="del" data-role="delete" title="Delete" aria-label="Delete" style="color:var(--red)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
  modal.innerHTML = `
    <div class="rk-modal-head">
      <div class="rk-modal-title">My lists</div>
      <button type="button" class="rk-modal-x">×</button>
    </div>
    <div class="rk-modal-body">${body}</div>
    <div class="rk-modal-foot">
      <button type="button" class="btn btn-outline" id="rk-close-btn">Close</button>
      <button type="button" class="btn btn-gold" id="rk-newlist-btn">+ New list</button>
    </div>
  `;
  modal.querySelector('.rk-modal-x').addEventListener('click', closeModal);
  modal.querySelector('#rk-close-btn').addEventListener('click', closeModal);
  modal.querySelector('#rk-newlist-btn').addEventListener('click', async () => {
    if(state.items.length && (state.unsaved || !state.id)){
      if(!(await askConfirm('Unsaved changes will be lost.', {title:'Start a new blank list?', ok:'New list', danger:true}))) return;
    }
    newList();
    closeModal();
  });
  modal.querySelectorAll('.rk-list-row').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('[data-role="load"]').addEventListener('click', async () => {
      if(state.unsaved && state.id !== id){
        if(!(await askConfirm('Unsaved changes to the current list will be lost.', {title:'Load this list?', ok:'Load'}))) return;
      }
      loadList(id);
      closeModal();
    });
    row.querySelector('[data-role="rename"]').addEventListener('click', e => {
      e.stopPropagation();
      renameList(id);
    });
    row.querySelector('[data-role="delete"]').addEventListener('click', e => {
      e.stopPropagation();
      deleteList(id);
    });
  });
  openModal();
}
document.getElementById('rk-mylists-btn').addEventListener('click', renderListsModal);

// ── Export modal ──
function openExport(){
  const text = state.items.map((it, i) => `${i+1}. ${it.name}`).join('\n');
  const modal = document.getElementById('rk-modal');
  modal.innerHTML = `
    <div class="rk-modal-head">
      <div class="rk-modal-title">Export · ${escapeHtml(state.name)}</div>
      <button type="button" class="rk-modal-x">×</button>
    </div>
    <div class="rk-modal-body">
      <textarea class="rk-export-ta" id="rk-export-ta" readonly>${escapeHtml(text || '(empty list)')}</textarea>
    </div>
    <div class="rk-modal-foot">
      <button type="button" class="btn btn-outline" id="rk-close-btn">Close</button>
      <button type="button" class="btn btn-gold" id="rk-copy-btn">Copy</button>
    </div>
  `;
  modal.querySelector('.rk-modal-x').addEventListener('click', closeModal);
  modal.querySelector('#rk-close-btn').addEventListener('click', closeModal);
  modal.querySelector('#rk-copy-btn').addEventListener('click', async () => {
    const ta = document.getElementById('rk-export-ta');
    try{ await navigator.clipboard.writeText(ta.value); }
    catch(e){ ta.select(); try{ document.execCommand('copy'); }catch(e){} }
    const btn = document.getElementById('rk-copy-btn');
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');haptic('success');
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 1600);
  });
  openModal();
  if(!matchMedia('(pointer:coarse)').matches) setTimeout(() => document.getElementById('rk-export-ta')?.select(), 60);
}

// ── Overflow popover ──
function openPopover(){
  const pop = document.getElementById('rk-popover');
  const ov = document.getElementById('rk-popover-overlay');
  const hasSavedList = !!state.id;
  const items = [
    {icon:'📋', label:'Export as text', action:()=>{closePopover();openExport();}},
    {icon:'🔀', label:'Shuffle', action:()=>{closePopover();shuffleItems();}},
    {icon:'🧹', label:'Clear all items', action:()=>{closePopover();clearAll();}, danger:false},
  ];
  if(hasSavedList){
    items.push({sep:true});
    items.push({icon:'🗑', label:'Delete this list', action:()=>{closePopover();deleteList(state.id);}, danger:true});
  }
  pop.innerHTML = items.map(it => {
    if(it.sep) return '<div class="sep"></div>';
    return `<button type="button" class="${it.danger?'danger':''}" data-act="${it.label}"><span class="icon">${it.icon}</span>${it.label}</button>`;
  }).join('');
  pop.style.display = 'block';
  ov.classList.add('show');
  // Wire
  pop.querySelectorAll('button').forEach((btn, i) => {
    const realItem = items.filter(x => !x.sep)[i];
    btn.addEventListener('click', () => realItem.action());
  });
}
function closePopover(){
  document.getElementById('rk-popover').style.display = 'none';
  document.getElementById('rk-popover-overlay').classList.remove('show');
}
document.getElementById('rk-overflow-btn').addEventListener('click', openPopover);
document.getElementById('rk-popover-overlay').addEventListener('click', closePopover);

// ── Save button ──
document.getElementById('rk-save-btn').addEventListener('click', () => {
  const btn = document.getElementById('rk-save-btn');
  if(btn.classList.contains('disabled')) return;
  saveCurrentList();
});

// ─────────────────────────────────────────────────────────────────────────────
// Bootstrap
// ─────────────────────────────────────────────────────────────────────────────
const restored = loadCurrent();
if(restored && typeof restored === 'object'){
  state = Object.assign({ id:null, name:'Untitled', items:[], unsaved:false, dedupe:true, editMode:false, dismissedDupes:{} }, restored);
  nextItemId = Math.max(0, ...state.items.map(x=>x.id||0)) + 1;
}
render();
updateInputUi();

// Force a cloud sync when the ranker opens so we see the latest lists from
// other devices. boot() runs automatically, but we also trigger syncNow() on
// visibility change in case the user backgrounded the tab and returned.
if(window.FGHSync && typeof FGHSync.syncNow === 'function'){
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') FGHSync.syncNow();
  });
}

if(window.FGHSync && typeof FGHSync.onReady === 'function'){
  FGHSync.onReady(() => {
    if(state.id){
      const cloudList = loadLists().find(l => l.id === state.id);
      if(cloudList && !state.unsaved){
        // Items may arrive as object-shaped array {0:...,1:...} — coerce
        let itemsArr = cloudList.items;
        if(!Array.isArray(itemsArr) && itemsArr && typeof itemsArr === 'object'){
          const keys = Object.keys(itemsArr);
          itemsArr = keys.every(k => /^\d+$/.test(k))
            ? keys.sort((a,b)=>+a-+b).map(k => itemsArr[k])
            : Object.values(itemsArr);
        }
        if(Array.isArray(itemsArr)){
          state.name = cloudList.name;
          state.items = itemsArr.filter(x => x && x.name).map(x => ({id:x.id, name:x.name}));
          saveCurrent();
        }
      }
    }
    render();
  });
}

// When any sync completes (pull updates localStorage), refresh what's on
// screen. Both the main UI and any open modal.
document.addEventListener('fghsync:updated', function(){
  render();
  // If the My Lists modal happens to be open right now, re-render it so
  // freshly-pulled lists appear without requiring the user to close/reopen.
  const modal = document.getElementById('rk-modal');
  if(document.getElementById('rk-modal-overlay').classList.contains('show')
     && modal && modal.querySelector('.rk-modal-title')
     && modal.querySelector('.rk-modal-title').textContent === 'My lists'){
    renderListsModal();
  }
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>Ranker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">

<style>
body{background:radial-gradient(ellipse at 50% 0%,#2a1520 0%,#0d0a12 60%);}
.rk-wrap{max-width:520px;margin:0 auto;padding:0 12px 60px;}

/* Header */
.rk-header{text-align:center;margin:4px 0 12px;}
.rk-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:900;color:#f5c842;letter-spacing:.02em;line-height:1.1;}
.rk-sub{font-size:.72rem;color:rgba(255,255,255,.5);margin-top:4px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;}

/* Current list banner */
.rk-current{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
  background:rgba(236,72,153,.08);border:1px solid rgba(236,72,153,.3);
  border-radius:10px;padding:8px 12px;
}
.rk-current-name{
  flex:1;min-width:0;font-weight:700;color:#fff;font-size:.95rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:pointer;padding:2px 4px;border-radius:4px;
  transition:background .12s;
}
.rk-current-name:hover{background:rgba(236,72,153,.15);}
.rk-current-name[contenteditable]:focus{outline:none;background:rgba(236,72,153,.2);}
.rk-current-status{
  font-size:.65rem;color:rgba(255,255,255,.45);flex-shrink:0;
}
.rk-current-status.unsaved{color:#fbbf24;}
.rk-current-status.saved{color:#86efac;}

/* Dedupe toggle */
.rk-dedupe-bar{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  border-radius:10px;padding:8px 12px;
  font-size:.78rem;color:rgba(255,255,255,.7);
}
.rk-dedupe-bar .lbl{flex:1;min-width:0;}
.rk-toggle{
  position:relative;width:36px;height:20px;border-radius:12px;
  background:rgba(255,255,255,.15);cursor:pointer;transition:background .18s;
  flex-shrink:0;
}
.rk-toggle.on{background:linear-gradient(135deg,#f5c842,#d4a62e);}
.rk-toggle::after{
  content:"";position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .18s;
}
.rk-toggle.on::after{transform:translateX(16px);}

/* Dedupe warning banner */
.rk-dupe-banner{
  background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(251,146,60,.1));
  border:1px solid rgba(251,191,36,.4);border-radius:10px;
  padding:10px 12px;margin-bottom:10px;font-size:.82rem;
  display:flex;align-items:flex-start;gap:8px;
}
.rk-dupe-icon{flex-shrink:0;font-size:1rem;line-height:1.2;}
.rk-dupe-body{flex:1;min-width:0;line-height:1.45;color:rgba(255,255,255,.85);}
.rk-dupe-body b{color:#fbbf24;}
.rk-dupe-dismiss{
  all:unset;cursor:pointer;flex-shrink:0;
  color:rgba(255,255,255,.35);font-size:1rem;padding:0 2px;
}
.rk-dupe-dismiss:hover{color:#fff;}

/* List */
.rk-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;position:relative;}
.rk-row{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:10px 10px 10px 6px;
  transition:all .18s cubic-bezier(.22,1,.36,1);touch-action:manipulation;
}
.rk-row.dragging{
  background:rgba(245,200,66,.1);border-color:rgba(245,200,66,.5);
  box-shadow:0 8px 24px rgba(0,0,0,.4);transform:scale(1.02);z-index:10;position:relative;
}
.rk-row.drop-target-above{border-top:2px solid #f5c842;}
.rk-row.drop-target-below{border-bottom:2px solid #f5c842;}
.rk-row.is-duplicate{
  border-color:rgba(251,191,36,.45);
  background:rgba(251,191,36,.06);
}
.rk-handle{
  flex-shrink:0;width:28px;height:36px;
  display:flex;align-items:center;justify-content:center;
  cursor:grab;color:rgba(255,255,255,.35);font-size:1.1rem;line-height:1;user-select:none;touch-action:none;
}
.rk-handle:active{cursor:grabbing;color:#f5c842;}
.rk-handle::before{content:"⋮⋮";letter-spacing:-2px;}
.rk-rank{
  flex-shrink:0;width:34px;text-align:right;
  font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;font-style:italic;
  color:#f5c842;letter-spacing:-.03em;line-height:1;
  animation:rankPop .36s cubic-bezier(.22,1,.36,1);
}
@keyframes rankPop{
  0%{transform:translateY(-4px) scale(.8);opacity:.4;}
  60%{transform:translateY(1px) scale(1.08);opacity:1;}
  100%{transform:translateY(0) scale(1);opacity:1;}
}
.rk-name{
  flex:1;min-width:0;font-size:.98rem;font-weight:500;color:#fff;line-height:1.3;padding:0 4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.rk-name[contenteditable]:focus{outline:none;background:rgba(245,200,66,.08);border-radius:6px;padding:2px 6px;}
.rk-dupe-badge{
  flex-shrink:0;background:rgba(251,191,36,.2);color:#fbbf24;
  font-size:.58rem;font-weight:800;padding:2px 6px;border-radius:4px;
  letter-spacing:.05em;text-transform:uppercase;
}
.rk-arrows{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.rk-arrow{
  all:unset;cursor:pointer;width:24px;height:18px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;color:rgba(255,255,255,.4);background:rgba(255,255,255,.04);transition:all .12s;
}
.rk-arrow:hover{color:#f5c842;background:rgba(245,200,66,.12);}
.rk-arrow:active{transform:scale(.88);}
.rk-arrow.disabled{opacity:.25;pointer-events:none;}
.rk-del{
  all:unset;cursor:pointer;flex-shrink:0;width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.3);font-size:.95rem;transition:all .12s;
}
.rk-del:hover{color:#f87171;background:rgba(248,113,113,.12);}

/* Sub-hint label in dedupe bar */
.rk-sub-hint{font-size:.65rem;color:rgba(255,255,255,.35);font-weight:400;letter-spacing:0;text-transform:none;margin-left:2px;}

/* Swipe-to-delete affordance */
.rk-row{position:relative;overflow:hidden;}
.rk-row.swiping{transition:none;}
.rk-row-content{
  display:contents;
}
.rk-row-swipe-bg{
  position:absolute;top:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:16px;gap:8px;
  background:linear-gradient(90deg,transparent 0%,rgba(248,113,113,.18) 25%,rgba(248,113,113,.35) 100%);
  color:#f87171;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  pointer-events:none;opacity:0;transition:opacity .12s;
  z-index:0;
}
.rk-row.swipe-hint .rk-row-swipe-bg{opacity:1;}
.rk-row-swipe-bg::before{
  content:"← Swipe to delete";
}
.rk-row.swipe-active .rk-row-swipe-bg{opacity:1;}
.rk-row.swipe-active .rk-row-swipe-bg::before{
  content:"🗑 Delete";color:#fca5a5;
}
.rk-row > *:not(.rk-row-swipe-bg){position:relative;z-index:1;}

.rk-empty{
  text-align:center;padding:30px 20px;color:rgba(255,255,255,.35);font-size:.88rem;
  border:1px dashed rgba(255,255,255,.12);border-radius:12px;
}

/* Add row */
.rk-add{display:flex;gap:8px;margin-bottom:12px;}
.rk-add input{
  flex:1;min-width:0;box-sizing:border-box;padding:11px 14px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  color:#fff;font-size:.95rem;font-family:Inter,sans-serif;outline:none;
}
.rk-add input:focus{border-color:rgba(245,200,66,.5);background:rgba(245,200,66,.05);}
.rk-add input.warn-dupe{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.08);}
.rk-add button{
  all:unset;cursor:pointer;flex-shrink:0;padding:11px 18px;border-radius:10px;
  background:linear-gradient(135deg,#f5c842,#d4a62e);color:#2a1a00;
  font-weight:800;font-size:.88rem;transition:filter .12s;
}
.rk-add button:hover{filter:brightness(1.08);}
.rk-add button:disabled{opacity:.35;cursor:default;filter:grayscale(.4);}

/* Input dupe suggestion */
.rk-input-suggest{
  background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);
  border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:.78rem;color:rgba(255,255,255,.85);
  display:flex;align-items:center;gap:8px;
}
.rk-input-suggest b{color:#fbbf24;}
.rk-input-suggest .actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0;}
.rk-input-suggest button{
  all:unset;cursor:pointer;padding:4px 10px;border-radius:6px;font-size:.72rem;font-weight:700;
  transition:all .12s;
}
.rk-input-suggest .skip-btn{background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);}
.rk-input-suggest .skip-btn:hover{background:rgba(255,255,255,.14);}
.rk-input-suggest .add-btn{background:rgba(251,191,36,.25);color:#fbbf24;}
.rk-input-suggest .add-btn:hover{background:rgba(251,191,36,.4);}

/* Footer actions */
.rk-footer{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.rk-footer button{
  all:unset;cursor:pointer;text-align:center;padding:10px 0;border-radius:10px;
  font-size:.78rem;font-weight:700;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.75);
  transition:all .12s;
}
.rk-footer button:hover{background:rgba(255,255,255,.12);color:#fff;}
.rk-footer .primary{
  background:linear-gradient(135deg,rgba(245,200,66,.2),rgba(245,200,66,.08));
  border-color:rgba(245,200,66,.4);color:#f5c842;
}
.rk-footer .primary:hover{background:linear-gradient(135deg,rgba(245,200,66,.3),rgba(245,200,66,.15));}

/* Modal */
.rk-modal-overlay{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.rk-modal-overlay.show{display:flex;}
.rk-modal{
  width:100%;max-width:440px;max-height:86vh;overflow:hidden;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1c1420,#100a14);
  border:1px solid rgba(245,200,66,.3);border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  animation:popin .22s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popin{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
.rk-modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);
}
.rk-modal-title{font-family:'Playfair Display',serif;font-weight:900;font-size:1.2rem;color:#f5c842;}
.rk-modal-x{
  all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.08);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1;
}
.rk-modal-x:hover{background:rgba(255,255,255,.16);}
.rk-modal-body{padding:14px 18px;overflow-y:auto;flex:1;}
.rk-modal-foot{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:8px;justify-content:flex-end;}
.rk-modal-foot button{
  all:unset;cursor:pointer;padding:9px 18px;border-radius:9px;font-size:.88rem;font-weight:700;transition:all .12s;
}
.rk-modal-foot .btn-primary{background:linear-gradient(135deg,#f5c842,#d4a62e);color:#2a1a00;}
.rk-modal-foot .btn-primary:hover{filter:brightness(1.08);}
.rk-modal-foot .btn-primary.copied{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;}
.rk-modal-foot .btn-secondary{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);}
.rk-modal-foot .btn-secondary:hover{background:rgba(255,255,255,.14);color:#fff;}

/* Export textarea */
.rk-export-ta{
  width:100%;box-sizing:border-box;min-height:200px;max-height:40vh;
  padding:12px;border-radius:8px;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);color:#fff;
  font-family:'SF Mono',Monaco,monospace;font-size:.85rem;resize:vertical;line-height:1.5;
}

/* Saved lists drawer */
.rk-lists{display:flex;flex-direction:column;gap:6px;}
.rk-list-row{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;
  cursor:pointer;transition:all .12s;
}
.rk-list-row:hover{background:rgba(245,200,66,.08);border-color:rgba(245,200,66,.3);}
.rk-list-row.active{background:rgba(236,72,153,.12);border-color:rgba(236,72,153,.4);}
.rk-list-info{flex:1;min-width:0;}
.rk-list-name{font-weight:700;color:#fff;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rk-list-meta{font-size:.68rem;color:rgba(255,255,255,.4);margin-top:2px;}
.rk-list-actions{display:flex;gap:4px;flex-shrink:0;}
.rk-list-actions button{
  all:unset;cursor:pointer;width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.4);font-size:.9rem;transition:all .12s;
}
.rk-list-actions button:hover{color:#fff;background:rgba(255,255,255,.1);}
.rk-list-actions .del:hover{color:#f87171;background:rgba(248,113,113,.12);}
.rk-lists-empty{
  text-align:center;padding:28px 12px;color:rgba(255,255,255,.4);font-size:.88rem;line-height:1.5;
}
.rk-lists-empty .hint{color:rgba(255,255,255,.3);font-size:.75rem;margin-top:8px;}
</style>
</head>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// Ranker — drag/drop, saved lists (per PIN via rklists), fuzzy dedup.
//
// Storage shape:
//   localStorage.rklists = { lists: [ {id, name, items, _modifiedAt, _createdAt} ] }
//   localStorage.ranker_current = { id, items, name, unsaved:bool, dedupe:bool }
// Sync: sync.js now handles `rklists` as a first-class top-level collection,
// so all saved lists cloud-sync under the active PIN automatically.
// ═══════════════════════════════════════════════════════════════════════════

const STORAGE_KEY_LISTS   = 'rklists';
const STORAGE_KEY_CURRENT = 'ranker_current';

let state = {
  id: null,           // null = unsaved draft; set when loaded or saved
  name: 'Untitled',
  items: [],
  unsaved: false,     // whether draft has unsaved changes vs saved version
  dedupe: true,       // fuzzy dedup enabled by default
  editMode: false,    // when on, deletes skip confirm (quick edit mode)
  dismissedDupes: {}, // { normKey: true } — user-dismissed duplicate warnings
};
let nextItemId = 1;

// ─────────────────────────────────────────────────────────────────────────────
// Storage helpers
// ─────────────────────────────────────────────────────────────────────────────
function loadLists(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_LISTS);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    if(parsed && Array.isArray(parsed.lists)) return parsed.lists;
    return [];
  }catch(e){ return []; }
}
function saveLists(lists){
  try{ localStorage.setItem(STORAGE_KEY_LISTS, JSON.stringify({lists:lists})); }catch(e){}
  try{ FGHSync.noteWrite(STORAGE_KEY_LISTS); }catch(e){}
}
function saveCurrent(){
  try{ localStorage.setItem(STORAGE_KEY_CURRENT, JSON.stringify(state)); }catch(e){}
}
function loadCurrent(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_CURRENT);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function newId(){ return 'rk_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }

// ─────────────────────────────────────────────────────────────────────────────
// Fuzzy duplicate detection
// ─────────────────────────────────────────────────────────────────────────────
// Normalize for comparison: lowercase, strip (year), (parenthetical),
// remove leading articles (the, a, an), collapse whitespace, remove punctuation.
function normalizeForCompare(s){
  if(!s) return '';
  let out = String(s).toLowerCase();
  out = out.replace(/\([^)]*\)/g, ' ');            // drop parenthetical
  out = out.replace(/\[[^\]]*\]/g, ' ');           // drop bracketed
  out = out.replace(/[^a-z0-9\s]+/g, ' ');         // strip punctuation
  out = out.replace(/\s+/g, ' ').trim();
  out = out.replace(/^(the|a|an)\s+/, '');         // drop leading article
  return out;
}

// Levenshtein distance (for near-miss matching)
function editDistance(a, b){
  if(a === b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  // Space-optimized DP
  let prev = new Array(b.length + 1);
  let cur  = new Array(b.length + 1);
  for(let j = 0; j <= b.length; j++) prev[j] = j;
  for(let i = 1; i <= a.length; i++){
    cur[0] = i;
    for(let j = 1; j <= b.length; j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(cur[j-1]+1, prev[j]+1, prev[j-1]+cost);
    }
    [prev, cur] = [cur, prev];
  }
  return prev[b.length];
}

// Return a similarity score 0..1 between two strings (higher = more similar).
function similarity(a, b){
  if(!a.length || !b.length) return 0;
  const maxLen = Math.max(a.length, b.length);
  const dist = editDistance(a, b);
  return 1 - dist / maxLen;
}

// Decide whether two normalized strings are "fuzzy duplicates".
// Strategy:
//   1. Exact match on normalized form → yes
//   2. One contains the other as a whole word → yes (e.g. "Matrix" vs "The Matrix (1999)")
//   3. Edit-distance similarity > 0.85 for longer strings → yes
function isFuzzyDup(aRaw, bRaw){
  const a = normalizeForCompare(aRaw);
  const b = normalizeForCompare(bRaw);
  if(!a || !b) return false;
  if(a === b) return true;
  // Substring containment (only accept if shorter is ≥3 chars to avoid false positives)
  if(a.length >= 3 && b.length >= 3){
    if(b.indexOf(a) >= 0 || a.indexOf(b) >= 0) return true;
  }
  // Edit distance similarity, with length-sensitive threshold
  // Short strings (<6 chars) need near-exact match; longer strings can tolerate more noise
  const sim = similarity(a, b);
  const threshold = Math.max(a.length, b.length) >= 8 ? 0.82 : 0.90;
  return sim >= threshold;
}

// Return array of duplicate-group arrays. Each group is [{idx, item}, ...]
// Only items in groups of 2+ appear.
function findDuplicateGroups(items){
  const groups = [];
  const assigned = new Array(items.length).fill(-1);
  for(let i = 0; i < items.length; i++){
    if(assigned[i] >= 0) continue;
    const group = [{idx: i, item: items[i]}];
    assigned[i] = groups.length;
    for(let j = i + 1; j < items.length; j++){
      if(assigned[j] >= 0) continue;
      if(isFuzzyDup(items[i].name, items[j].name)){
        group.push({idx: j, item: items[j]});
        assigned[j] = groups.length;
      }
    }
    if(group.length >= 2) groups.push(group);
  }
  return groups;
}

function findMatchAgainstList(newName, items){
  for(let i = 0; i < items.length; i++){
    if(isFuzzyDup(newName, items[i].name)) return items[i];
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// State mutations
// ─────────────────────────────────────────────────────────────────────────────
function markDirty(){
  state.unsaved = !!state.id;   // only mark dirty if tracking a saved list
  saveCurrent();
}

function setCurrentName(name){
  const trimmed = (name||'').trim() || 'Untitled';
  state.name = trimmed;
  markDirty();
  render();
}

function addItem(name){
  const trimmed = (name||'').trim();
  if(!trimmed) return;
  state.items.push({ id: nextItemId++, name: trimmed });
  markDirty();
  render();
}

function deleteItem(id, opts){
  const it = state.items.find(x => x.id === id);
  if(!it) return;
  const skipConfirm = (opts && opts.skipConfirm) || state.editMode;
  if(!skipConfirm){
    if(!confirm(`Delete "${it.name}"?`)) return;
  }
  state.items = state.items.filter(x => x.id !== id);
  markDirty();
  render();
}

function renameItem(id, newName){
  const trimmed = (newName||'').trim();
  const it = state.items.find(x => x.id === id);
  if(!it || !trimmed || it.name === trimmed) return;
  it.name = trimmed;
  markDirty();
  render();
}

function moveItem(id, delta){
  const idx = state.items.findIndex(x => x.id === id);
  if(idx < 0) return;
  const target = idx + delta;
  if(target < 0 || target >= state.items.length) return;
  [state.items[idx], state.items[target]] = [state.items[target], state.items[idx]];
  markDirty();
  render();
}

function reorder(fromIdx, toIdx){
  if(fromIdx === toIdx) return;
  const [moved] = state.items.splice(fromIdx, 1);
  state.items.splice(toIdx, 0, moved);
  markDirty();
  render();
}

function shuffleItems(){
  for(let i = state.items.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [state.items[i], state.items[j]] = [state.items[j], state.items[i]];
  }
  markDirty();
  render();
}

function newList(){
  state = { id:null, name:'Untitled', items:[], unsaved:false, dedupe: state.dedupe, dismissedDupes:{} };
  nextItemId = 1;
  saveCurrent();
  render();
}

function saveCurrentList(){
  // Either update existing (by id) or prompt for a name and create new
  const lists = loadLists();
  if(state.id){
    const existing = lists.find(l => l.id === state.id);
    if(existing){
      existing.name = state.name;
      existing.items = state.items.map(x => ({id:x.id, name:x.name}));
      existing._modifiedAt = Date.now();
      saveLists(lists);
      state.unsaved = false;
      saveCurrent();
      render();
      flashStatus('Saved ✓');
      return;
    }
  }
  // New save — prompt for name if still "Untitled"
  let name = state.name;
  if(!name || name === 'Untitled'){
    const chosen = prompt('Name this list:', state.items.length ? 'My List' : '');
    if(chosen == null) return;
    name = (chosen||'').trim() || 'Untitled';
  }
  const now = Date.now();
  const listObj = {
    id: newId(),
    name: name,
    items: state.items.map(x => ({id:x.id, name:x.name})),
    _createdAt: now,
    _modifiedAt: now
  };
  lists.push(listObj);
  saveLists(lists);
  state.id = listObj.id;
  state.name = name;
  state.unsaved = false;
  saveCurrent();
  render();
  flashStatus('Saved ✓');
}

function loadList(id){
  // Before switching, stash current as a draft if it's truly unsaved new work
  const lists = loadLists();
  const list = lists.find(l => l.id === id);
  if(!list) return;
  // Firestore may return `items` as an object-keyed map; coerce back to array
  let itemsArr = list.items;
  if(!Array.isArray(itemsArr) && itemsArr && typeof itemsArr === 'object'){
    const keys = Object.keys(itemsArr);
    if(keys.length && keys.every(k => /^\d+$/.test(k))){
      itemsArr = keys.sort((a,b)=>+a-+b).map(k => itemsArr[k]);
    } else {
      itemsArr = Object.values(itemsArr);
    }
  }
  if(!Array.isArray(itemsArr)) itemsArr = [];
  state = {
    id: list.id,
    name: list.name,
    items: itemsArr.filter(x => x && x.name).map(x => ({id:x.id, name:x.name})),
    unsaved: false,
    dedupe: state.dedupe,
    editMode: state.editMode,
    dismissedDupes: {}
  };
  nextItemId = Math.max(0, ...state.items.map(x=>x.id||0)) + 1;
  saveCurrent();
  render();
}

function deleteList(id){
  const lists = loadLists();
  const idx = lists.findIndex(l => l.id === id);
  if(idx < 0) return;
  const list = lists[idx];
  if(!confirm(`Delete "${list.name}"? This can't be undone.`)) return;
  lists.splice(idx, 1);
  saveLists(lists);
  if(state.id === id){
    newList();
  } else {
    renderListsModal();
  }
}

function renameList(id){
  const lists = loadLists();
  const list = lists.find(l => l.id === id);
  if(!list) return;
  const chosen = prompt('Rename list:', list.name);
  if(chosen == null) return;
  const trimmed = (chosen||'').trim() || list.name;
  list.name = trimmed;
  list._modifiedAt = Date.now();
  saveLists(lists);
  if(state.id === id){ state.name = trimmed; saveCurrent(); }
  renderListsModal();
  render();
}

// Brief transient status flash
let _flashTimer = null;
function flashStatus(msg){
  const el = document.getElementById('rk-current-status');
  if(!el) return;
  const prev = el.textContent;
  const prevCls = el.className;
  el.textContent = msg;
  el.className = 'rk-current-status saved';
  if(_flashTimer) clearTimeout(_flashTimer);
  _flashTimer = setTimeout(() => { render(); }, 1400);
}

// ─────────────────────────────────────────────────────────────────────────────
// Rendering
// ─────────────────────────────────────────────────────────────────────────────
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  // Current list name + status
  const nameEl = document.getElementById('rk-current-name');
  nameEl.textContent = state.name || 'Untitled';
  const statusEl = document.getElementById('rk-current-status');
  if(state.id){
    if(state.unsaved){
      statusEl.textContent = 'Unsaved changes';
      statusEl.className = 'rk-current-status unsaved';
    } else {
      statusEl.textContent = 'Saved';
      statusEl.className = 'rk-current-status saved';
    }
  } else {
    statusEl.textContent = 'Draft';
    statusEl.className = 'rk-current-status';
  }

  // Dedupe toggle state
  document.getElementById('rk-dedupe-toggle').classList.toggle('on', state.dedupe);
  // Edit-mode toggle state
  document.getElementById('rk-edit-toggle').classList.toggle('on', !!state.editMode);
  // Edit-mode hint text
  const hintEl = document.getElementById('rk-edit-hint');
  if(hintEl){
    hintEl.textContent = state.editMode
      ? '· quick delete without confirm'
      : '· swipe left or tap × to delete (with confirm)';
  }

  // Compute duplicate groups if dedupe enabled
  const dupeGroups = state.dedupe ? findDuplicateGroups(state.items) : [];
  const dupeIdxSet = new Set();
  dupeGroups.forEach(g => g.forEach(m => dupeIdxSet.add(m.idx)));

  // Duplicate banner
  const bannerHost = document.getElementById('rk-dupe-banner-host');
  if(dupeGroups.length && !state.dismissedDupes['_global']){
    const count = dupeGroups.reduce((s,g) => s + g.length, 0);
    const pairs = dupeGroups.map(g =>
      '"' + escapeHtml(g.map(m => m.item.name).join('" ≈ "')) + '"'
    ).join(', ');
    bannerHost.innerHTML = `<div class="rk-dupe-banner">
      <div class="rk-dupe-icon">⚠️</div>
      <div class="rk-dupe-body">
        <b>${dupeGroups.length} possible duplicate${dupeGroups.length>1?'s':''} in your list.</b>
        ${pairs.length > 160 ? pairs.slice(0,160)+'…' : pairs}
      </div>
      <button class="rk-dupe-dismiss" id="rk-dupe-dismiss" title="Dismiss">×</button>
    </div>`;
    document.getElementById('rk-dupe-dismiss').addEventListener('click', () => {
      state.dismissedDupes['_global'] = true;
      saveCurrent();
      render();
    });
  } else {
    bannerHost.innerHTML = '';
  }

  // The list
  const list = document.getElementById('rk-list');
  if(!state.items.length){
    list.innerHTML = `<div class="rk-empty">Add items above to start ranking.</div>`;
  } else {
    list.innerHTML = state.items.map((item, i) => `
      <div class="rk-row ${dupeIdxSet.has(i)?'is-duplicate':''}" data-id="${item.id}" data-idx="${i}">
        <div class="rk-row-swipe-bg"></div>
        <div class="rk-handle" data-role="handle" aria-label="Drag to reorder"></div>
        <div class="rk-rank">${i+1}</div>
        <div class="rk-name" data-role="name" contenteditable="true" spellcheck="false">${escapeHtml(item.name)}</div>
        ${dupeIdxSet.has(i) ? `<div class="rk-dupe-badge" title="Possible duplicate">DUP?</div>` : ''}
        <div class="rk-arrows">
          <button type="button" class="rk-arrow ${i===0?'disabled':''}" data-role="up" aria-label="Move up">▲</button>
          <button type="button" class="rk-arrow ${i===state.items.length-1?'disabled':''}" data-role="down" aria-label="Move down">▼</button>
        </div>
        <button type="button" class="rk-del" data-role="delete" aria-label="Delete">${state.editMode?'✕':'🗑'}</button>
      </div>
    `).join('');
    wireRows();
  }
}

function wireRows(){
  document.querySelectorAll('.rk-row').forEach(row => {
    const id = +row.dataset.id;
    row.querySelector('[data-role="up"]').addEventListener('click', () => moveItem(id, -1));
    row.querySelector('[data-role="down"]').addEventListener('click', () => moveItem(id, +1));
    row.querySelector('[data-role="delete"]').addEventListener('click', () => deleteItem(id));
    const name = row.querySelector('[data-role="name"]');
    name.addEventListener('blur', () => renameItem(id, name.textContent.trim()));
    name.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); name.blur(); }
      else if(e.key === 'Escape'){
        const it = state.items.find(x => x.id === id);
        if(it) name.textContent = it.name;
        name.blur();
      }
    });
    const handle = row.querySelector('[data-role="handle"]');
    handle.addEventListener('pointerdown', e => startDrag(e, row, id));
    // Swipe-to-delete — only when edit mode is OFF (the "gentle" mode).
    // Swipe threshold triggers the confirm-delete flow via deleteItem().
    attachSwipe(row, id);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Swipe-to-delete (touch + mouse)
// ─────────────────────────────────────────────────────────────────────────────
function attachSwipe(row, id){
  let startX = null, startY = null, currentDX = 0, tracking = false, horizontal = false;
  const THRESHOLD = 80;     // px — past this, snap open and trigger delete on release
  const HINT = 30;          // px — past this, show the swipe hint background
  const nameEl = row.querySelector('[data-role="name"]');
  const handleEl = row.querySelector('[data-role="handle"]');

  function onStart(e){
    // Ignore if swipe starts on the drag handle or on the editable name (user is
    // trying to drag or edit — not swipe). Only allow from rest of row.
    if(e.target === handleEl || handleEl.contains(e.target)) return;
    if(e.target === nameEl || nameEl.contains(e.target)) return;
    if(e.target.closest('.rk-arrow') || e.target.closest('.rk-del')) return;
    // Only primary pointer / left click
    if(e.button != null && e.button !== 0) return;
    startX = e.clientX;
    startY = e.clientY;
    currentDX = 0;
    tracking = true;
    horizontal = false;
    row.classList.add('swiping');
    row.addEventListener('pointermove', onMove);
    row.addEventListener('pointerup', onEnd);
    row.addEventListener('pointercancel', onEnd);
  }

  function onMove(e){
    if(!tracking || startX == null) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    // Determine axis on first meaningful movement
    if(!horizontal){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if(Math.abs(dy) > Math.abs(dx)){
        // Vertical intent — abandon swipe (let native scroll / drag take over)
        tracking = false;
        row.classList.remove('swiping');
        row.removeEventListener('pointermove', onMove);
        row.removeEventListener('pointerup', onEnd);
        row.removeEventListener('pointercancel', onEnd);
        return;
      }
      horizontal = true;
      try{ row.setPointerCapture(e.pointerId); }catch(err){}
    }
    // Only allow leftward swipes
    currentDX = Math.min(0, dx);
    row.style.transform = `translateX(${currentDX}px)`;
    const absDx = Math.abs(currentDX);
    row.classList.toggle('swipe-hint', absDx >= HINT && absDx < THRESHOLD);
    row.classList.toggle('swipe-active', absDx >= THRESHOLD);
  }

  function onEnd(e){
    if(!tracking) return;
    tracking = false;
    row.classList.remove('swiping');
    row.removeEventListener('pointermove', onMove);
    row.removeEventListener('pointerup', onEnd);
    row.removeEventListener('pointercancel', onEnd);
    try{ row.releasePointerCapture(e.pointerId); }catch(err){}
    const triggered = Math.abs(currentDX) >= THRESHOLD;
    // Reset visual state immediately — the confirm dialog can pop afterwards
    row.style.transform = '';
    row.classList.remove('swipe-hint','swipe-active');
    if(triggered) deleteItem(id);
  }

  row.addEventListener('pointerdown', onStart);
}

// ─────────────────────────────────────────────────────────────────────────────
// Drag & drop
// ─────────────────────────────────────────────────────────────────────────────
let dragState = null;

function startDrag(e, row, id){
  if(e.button != null && e.button !== 0) return;
  e.preventDefault();
  const list = document.getElementById('rk-list');
  const rows = Array.from(list.querySelectorAll('.rk-row'));
  const rect = row.getBoundingClientRect();
  dragState = { id, row, rows, list, startY: e.clientY, offsetY: e.clientY - rect.top, rowHeight: rect.height, currentIdx: rows.indexOf(row) };
  row.classList.add('dragging');
  row.setPointerCapture(e.pointerId);
  row.addEventListener('pointermove', onDragMove);
  row.addEventListener('pointerup', onDragEnd);
  row.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(e){
  if(!dragState) return;
  const { row, rows } = dragState;
  const y = e.clientY;
  const delta = y - dragState.startY;
  row.style.transform = `translateY(${delta}px) scale(1.02)`;
  let targetIdx = dragState.currentIdx;
  rows.forEach((r, idx) => {
    if(r === row) return;
    const rRect = r.getBoundingClientRect();
    const rMid = rRect.top + rRect.height / 2;
    if(y > rRect.top && y < rRect.bottom){
      targetIdx = y < rMid ? idx : idx + 1;
    }
  });
  if(targetIdx < 0) targetIdx = 0;
  if(targetIdx > rows.length) targetIdx = rows.length;
  let effectiveTarget = targetIdx;
  if(targetIdx > dragState.currentIdx) effectiveTarget--;
  rows.forEach(r => r.classList.remove('drop-target-above','drop-target-below'));
  if(effectiveTarget !== dragState.currentIdx && rows[targetIdx]){
    rows[targetIdx].classList.add(targetIdx > dragState.currentIdx ? 'drop-target-below' : 'drop-target-above');
  } else if(effectiveTarget !== dragState.currentIdx && targetIdx === rows.length){
    rows[rows.length - 1].classList.add('drop-target-below');
  }
  dragState._pendingTarget = effectiveTarget;
}

function onDragEnd(e){
  if(!dragState) return;
  const { row, rows, currentIdx } = dragState;
  const target = dragState._pendingTarget;
  row.classList.remove('dragging');
  row.style.transform = '';
  rows.forEach(r => r.classList.remove('drop-target-above','drop-target-below'));
  try{ row.releasePointerCapture(e.pointerId); }catch(err){}
  row.removeEventListener('pointermove', onDragMove);
  row.removeEventListener('pointerup', onDragEnd);
  row.removeEventListener('pointercancel', onDragEnd);
  const fromIdx = currentIdx;
  const toIdx = target != null && target !== fromIdx ? target : fromIdx;
  dragState = null;
  if(toIdx !== fromIdx) reorder(fromIdx, toIdx);
}

// ─────────────────────────────────────────────────────────────────────────────
// Input: add with dedup check
// ─────────────────────────────────────────────────────────────────────────────
const addInput = document.getElementById('rk-new');
const addBtn = document.getElementById('rk-add-btn');
const suggestHost = document.getElementById('rk-input-suggest-host');

function updateInputUi(){
  const val = addInput.value.trim();
  addBtn.disabled = !val;
  suggestHost.innerHTML = '';
  addInput.classList.remove('warn-dupe');
  if(!val || !state.dedupe) return;
  const match = findMatchAgainstList(val, state.items);
  if(match){
    addInput.classList.add('warn-dupe');
    suggestHost.innerHTML = `<div class="rk-input-suggest">
      <div>This looks similar to <b>${escapeHtml(match.name)}</b> already on your list.</div>
      <div class="actions">
        <button type="button" class="add-btn" id="rk-force-add">Add anyway</button>
        <button type="button" class="skip-btn" id="rk-skip-add">Skip</button>
      </div>
    </div>`;
    document.getElementById('rk-force-add').addEventListener('click', () => {
      addItem(addInput.value);
      addInput.value = '';
      updateInputUi();
      addInput.focus();
    });
    document.getElementById('rk-skip-add').addEventListener('click', () => {
      addInput.value = '';
      updateInputUi();
      addInput.focus();
    });
  }
}

addInput.addEventListener('input', updateInputUi);
addInput.addEventListener('keydown', e => {
  if(e.key === 'Enter' && addInput.value.trim()){
    // On Enter, respect dedupe warning: if match exists, add with confirm flow
    const val = addInput.value.trim();
    if(state.dedupe){
      const match = findMatchAgainstList(val, state.items);
      if(match){
        if(!confirm(`"${val}" looks like "${match.name}" which is already on your list. Add it anyway?`)){
          return;
        }
      }
    }
    addItem(addInput.value);
    addInput.value = '';
    updateInputUi();
    addInput.focus();
  }
});
addBtn.addEventListener('click', () => {
  if(!addInput.value.trim()) return;
  // When Add button clicked, honor the inline suggest UI (which offers its
  // own "Add anyway" button). If the user clicks Add directly and there's
  // a warning, still let it through but show the warning banner briefly.
  addItem(addInput.value);
  addInput.value = '';
  updateInputUi();
  addInput.focus();
});

curName.addEventListener('click', () => {
  curName.setAttribute('contenteditable', 'true');

// ─────────────────────────────────────────────────────────────────────────────
// Saved Lists modal
// ─────────────────────────────────────────────────────────────────────────────
function openModal(){
  document.getElementById('rk-modal-overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('rk-modal-overlay').classList.remove('show');
  document.getElementById('rk-modal').innerHTML = '';
}
document.getElementById('rk-modal-overlay').addEventListener('click', e => {
  if(e.target.id === 'rk-modal-overlay') closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

function renderListsModal(){
  const lists = loadLists();
  lists.sort((a,b) => (b._modifiedAt||0) - (a._modifiedAt||0));
  const modal = document.getElementById('rk-modal');
  let body = '';
  if(!lists.length){
    body = `<div class="rk-lists-empty">
      No saved lists yet.
      <div class="hint">Save your current draft with the 💾 button, and it'll show up here.</div>
    </div>`;
  } else {
    body = `<div class="rk-lists">
      ${lists.map(l => {
        const date = new Date(l._modifiedAt || l._createdAt || Date.now());
        const dateStr = date.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'2-digit' });
        const count = (l.items||[]).length;
        const isActive = l.id === state.id;
        return `<div class="rk-list-row ${isActive?'active':''}" data-id="${l.id}">
          <div class="rk-list-info" data-role="load">
            <div class="rk-list-name">${escapeHtml(l.name)}</div>
            <div class="rk-list-meta">${count} item${count!==1?'s':''} · ${dateStr}${isActive ? ' · <span style="color:#ec4899">current</span>' : ''}</div>
          </div>
          <div class="rk-list-actions">
            <button type="button" data-role="rename" title="Rename">✏️</button>
            <button type="button" class="del" data-role="delete" title="Delete">🗑</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
  modal.innerHTML = `
    <div class="rk-modal-head">
      <div class="rk-modal-title">📚 My Lists</div>
      <button type="button" class="rk-modal-x">×</button>
    </div>
    <div class="rk-modal-body">${body}</div>
    <div class="rk-modal-foot">
      <button type="button" class="btn-secondary" id="rk-newlist-btn">+ New Blank List</button>
      <button type="button" class="btn-secondary" id="rk-close-btn">Close</button>
    </div>
  `;
  modal.querySelector('.rk-modal-x').addEventListener('click', closeModal);
  modal.querySelector('#rk-close-btn').addEventListener('click', closeModal);
  modal.querySelector('#rk-newlist-btn').addEventListener('click', () => {
    if(state.items.length && state.unsaved){
      if(!confirm('Start a new blank list? Your current unsaved draft will be lost.')) return;
    } else if(state.items.length && !state.id){
      if(!confirm('Start a new blank list? Your current draft will be lost.')) return;
    }
    newList();
    closeModal();
  });
  modal.querySelectorAll('.rk-list-row').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('[data-role="load"]').addEventListener('click', () => {
      if(state.unsaved && state.id !== id){
        if(!confirm('Load another list? Unsaved changes to the current list will be lost.')) return;
      }
      loadList(id);
      closeModal();
    });
    row.querySelector('[data-role="rename"]').addEventListener('click', e => {
      e.stopPropagation();
      renameList(id);
    });
    row.querySelector('[data-role="delete"]').addEventListener('click', e => {
      e.stopPropagation();
      deleteList(id);
    });
  });
  openModal();
}

// ─────────────────────────────────────────────────────────────────────────────
// Export modal
// ─────────────────────────────────────────────────────────────────────────────
function openExport(){
  const text = state.items.map((it, i) => `${i+1}. ${it.name}`).join('\n');
  const modal = document.getElementById('rk-modal');
  modal.innerHTML = `
    <div class="rk-modal-head">
      <div class="rk-modal-title">📋 Export: ${escapeHtml(state.name)}</div>
      <button type="button" class="rk-modal-x">×</button>
    </div>
    <div class="rk-modal-body">
      <textarea class="rk-export-ta" id="rk-export-ta" readonly>${escapeHtml(text || '(empty list)')}</textarea>
    </div>
    <div class="rk-modal-foot">
      <button type="button" class="btn-secondary" id="rk-close-btn">Close</button>
      <button type="button" class="btn-primary" id="rk-copy-btn">Copy to Clipboard</button>
    </div>
  `;
  modal.querySelector('.rk-modal-x').addEventListener('click', closeModal);
  modal.querySelector('#rk-close-btn').addEventListener('click', closeModal);
  modal.querySelector('#rk-copy-btn').addEventListener('click', async () => {
    const ta = document.getElementById('rk-export-ta');
    try{ await navigator.clipboard.writeText(ta.value); }catch(e){
      ta.select(); try{ document.execCommand('copy'); }catch(e){}
    }
    const btn = document.getElementById('rk-copy-btn');
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy to Clipboard';
      btn.classList.remove('copied');
    }, 1600);
  });
  openModal();
  setTimeout(() => document.getElementById('rk-export-ta')?.select(), 60);
}

// ─────────────────────────────────────────────────────────────────────────────
// Footer wiring
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('rk-save-btn').addEventListener('click', saveCurrentList);
document.getElementById('rk-mylists-btn').addEventListener('click', renderListsModal);
document.getElementById('rk-shuffle-btn').addEventListener('click', shuffleItems);
document.getElementById('rk-export-btn').addEventListener('click', openExport);

// ─────────────────────────────────────────────────────────────────────────────
// Bootstrap
// ─────────────────────────────────────────────────────────────────────────────
// Restore current draft if present; otherwise start fresh.
const restored = loadCurrent();
if(restored && typeof restored === 'object'){
  state = Object.assign({ id:null, name:'Untitled', items:[], unsaved:false, dedupe:true, editMode:false, dismissedDupes:{} }, restored);
  nextItemId = Math.max(0, ...state.items.map(x=>x.id||0)) + 1;
}
render();
updateInputUi();

// If sync completes after load (cloud data arrives late), re-render once to
// reflect any lists pulled down from Firestore. Listen via onReady if available.
if(window.FGHSync && typeof FGHSync.onReady === 'function'){
  FGHSync.onReady(() => {
    // If our current list id got updated from cloud, reflect the new data
    if(state.id){
      const cloudList = loadLists().find(l => l.id === state.id);
      if(cloudList && cloudList._modifiedAt > 0){
        // Only reload if cloud has strictly newer version than our local draft
        // (to avoid clobbering in-flight edits)
        if(!state.unsaved){
          state.name = cloudList.name;
          state.items = cloudList.items.map(x => ({id:x.id, name:x.name}));
          saveCurrent();
        }
      }
    }
    render();
  });
}
</script>
</body>

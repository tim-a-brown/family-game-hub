<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>

<style>
/* ── The table fills the screen under the bar; every piece on it is placed by place() from the room there is ── */
.wr{position:relative;box-sizing:border-box;width:100%;height:calc(100dvh - var(--bar,64px));margin:0 auto;
  padding:2px max(var(--safe-r,0px),8px) max(calc(var(--safe-b) + 8px),12px) max(var(--safe-l,0px),8px);
  --back-a:#18275a;--back-b:#4560c0;}
.wr .box{position:relative;width:100%;height:100%;}
.wr .tblbg{position:absolute;inset:0;border-radius:26px;}
.wr .tblbg .felt-in{position:absolute;inset:8px;border-radius:19px;}
.wr .tbl{position:absolute;inset:8px;perspective:1600px;}
.wr .box.shake{animation:wshake .42s cubic-bezier(.36,.07,.19,.97);}
.wr .box.shake2{animation:wshake2 .6s cubic-bezier(.36,.07,.19,.97);}
@keyframes wshake{10%,90%{translate:-1px 0}20%,80%{translate:3px 1px}30%,50%,70%{translate:-5px -1px}40%,60%{translate:5px 1px}}
@keyframes wshake2{10%,90%{translate:-2px 1px}20%,80%{translate:6px -2px}30%,50%,70%{translate:-9px 2px}40%,60%{translate:9px -1px}}
/* pieces: placed at their middle; a turn of the device moves them with these transitions */
.wr .pile,.wr .tg,.wr .spd,.wr .mtr,.wr .cap,.wr .gh{position:absolute;transition:left .45s cubic-bezier(.22,1,.36,1),top .45s cubic-bezier(.22,1,.36,1),width .45s,opacity .3s;}

/* a card on the table: a scale layer (the lift in flight, the thud on landing) over a 3D turn (back to face) */
.wc{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw) * 1.4);translate:-50% -50%;rotate:var(--rot,0deg);
  transition:left var(--ft,.32s) cubic-bezier(.2,.75,.25,1),top var(--ft,.32s) cubic-bezier(.2,.75,.25,1),rotate var(--ft,.32s),width .45s,height .45s,opacity .25s;pointer-events:none;}
.wc .sc{position:absolute;inset:0;transition:scale .3s var(--spring),translate .3s var(--spring);}
.wc .in{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform var(--flt,.34s) cubic-bezier(.3,1.25,.5,1);}
.wc.up .in{transform:rotateY(0deg);}
.wc .fc,.wc .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.wc .bk{transform:rotateY(180deg);}
.wc .pcard{width:100%;height:100%;--cw:inherit;}
.wc.fly .sc{animation:wlift var(--ft,.32s) ease-out;}
.wc.thud .sc{animation:wthud .26s ease-out;}
@keyframes wlift{0%{scale:1}45%{scale:1.13;translate:0 -4%}100%{scale:1}}
@keyframes wthud{0%{scale:1.06}40%{scale:.95}100%{scale:1}}
.wc.win .sc{scale:1.07;translate:0 -3%;}
.wc.win .fc .pcard{box-shadow:0 0 0 3px var(--lit,#ffd34d),0 0 26px rgba(255,200,61,.75),0 10px 22px rgba(0,0,0,.45);}
.wc.lose .fc .pcard{filter:brightness(.72) saturate(.75);}
.wc.tie .fc .pcard{box-shadow:0 0 0 3px #ff4d5e,0 0 26px rgba(255,77,94,.7),0 8px 18px rgba(0,0,0,.4);}
.wc.tie .sc{animation:wtie .5s ease-in-out;}
@keyframes wtie{20%{rotate:-4deg}40%{rotate:4deg}60%{rotate:-3deg}80%{rotate:2deg}}
.wc.gone{opacity:0;}
.wc.ace2 .fc .pcard{box-shadow:0 0 0 3px #7ef0c0,0 0 30px rgba(126,240,192,.75);}
/* a ghost: where a war's cards will land */
.gh{width:var(--cw);height:calc(var(--cw) * 1.4);translate:-50% -50%;border-radius:calc(var(--cw) * .1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28);
  background:rgba(255,255,255,.05);pointer-events:none;animation:wgh 1.1s ease-in-out infinite alternate;}
.gh.u{box-shadow:inset 0 0 0 2px rgba(255,210,90,.7);background:rgba(255,210,90,.08);}
@keyframes wgh{from{opacity:.45}to{opacity:1}}

/* a pile: the top card's back over its own edge, the edge as thick as the pile, the count on a chip */
.pile{width:var(--pw);height:calc(var(--pw) * 1.4);translate:-50% -50%;--cw:var(--pw);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.pile .slot{position:absolute;inset:0;border-radius:calc(var(--pw) * .1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16);background:rgba(0,0,0,.14);}
.pile .stk{position:absolute;inset:0;transition:translate .3s var(--spring),scale .12s,opacity .3s;}
.pile .stk .pcard{width:100%;height:100%;transition:box-shadow .3s;}
.pile.empty .stk{opacity:0;}
.pile.me{cursor:pointer;}
.pile.me:active .stk{scale:.97;}
.pile.go .stk .pcard{animation:wgo 1.5s ease-in-out infinite;}
@keyframes wgo{0%,100%{filter:none}50%{filter:brightness(1.18)}}
.pile .ring{position:absolute;inset:-6px;border-radius:calc(var(--pw) * .14);box-shadow:0 0 0 3px var(--lit,#ffd34d),0 0 22px rgba(255,200,61,.55);opacity:0;transition:opacity .25s;pointer-events:none;}
.pile.go .ring{opacity:1;animation:wring 1.5s ease-in-out infinite;}
.pile.go.war .ring{box-shadow:0 0 0 3px #ff4d5e,0 0 26px rgba(255,77,94,.6);}
@keyframes wring{0%,100%{opacity:.55}50%{opacity:1}}
.pile .cnt{position:absolute;right:-9px;bottom:-9px;z-index:2;min-width:min(34px,calc(var(--pw) * .5));height:min(30px,calc(var(--pw) * .42));padding:0 min(9px,calc(var(--pw) * .1));box-sizing:border-box;border-radius:999px;display:grid;place-items:center;
  background:rgba(14,12,28,.82);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 3px 8px rgba(0,0,0,.35);color:#fff;font-family:var(--display);font-weight:800;font-size:min(1.02rem,calc(var(--pw) * .25));font-variant-numeric:tabular-nums;line-height:1;transition:background .3s;}
.pile .cnt.bump{animation:wbump .32s var(--spring);}
@keyframes wbump{0%{scale:1}40%{scale:1.28}100%{scale:1}}
.pile.low .cnt{background:#b3202e;}
.pile.lead .cnt{background:rgba(255,255,255,.92);color:#16142a;}
.pile.out .stk{opacity:0;}
.pile.out .slot{opacity:.5;}

/* a player's name plate */
.tg{display:flex;align-items:center;gap:7px;width:max-content;max-width:var(--tw,140px);color:#fff;pointer-events:none;}
.tg .avatar{width:30px;height:30px;font-size:.85rem;flex:none;transition:box-shadow .25s;}
.tg .avatar .ico{width:62%;height:62%;}
.tg .tx{display:flex;flex-direction:column;min-width:0;}
.tg .nm{font-weight:800;font-size:.92rem;line-height:1.12;overflow-wrap:anywhere;}
.tg .sb{font-size:.72rem;font-weight:700;white-space:nowrap;color:rgba(255,255,255,.66);line-height:1.15;}
.tg.go .avatar{box-shadow:0 0 0 2.5px var(--lit,#ffd34d),0 0 14px rgba(255,200,61,.6);}
.tg.go .sb{color:var(--lit-ink,#ffe28a);}
.tg.out{opacity:.45;}
.tg.al-l{translate:0 -50%;}
.tg.al-r{translate:-100% -50%;flex-direction:row-reverse;text-align:right;}
.tg.al-r .tx{align-items:flex-end;}
.tg.al-c{translate:-50% 0;flex-direction:column;gap:3px;text-align:center;}
.tg.al-c .tx{align-items:center;}
.tg.al-b{translate:-50% -100%;}
.tg.rot{rotate:180deg;}
.tg.sm .avatar{width:24px;height:24px;font-size:.7rem;}
.tg.sm .nm{font-size:.82rem;}
.tg.sm .sb{display:none;}
.tg.al-c.sm{flex-direction:row;gap:6px;}

/* the meter: who holds how much of the deck, and the round */
.mtr{display:flex;align-items:center;gap:10px;height:30px;color:#fff;}
.mtr .rd{flex:none;font-weight:800;font-size:.8rem;color:rgba(255,255,255,.82);white-space:nowrap;font-variant-numeric:tabular-nums;}
.mtr .bar{position:relative;flex:1;min-width:60px;height:12px;border-radius:999px;background:rgba(0,0,0,.32);display:flex;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.mtr .bar>.wseg{height:100%;background:var(--c);transition:flex-grow .55s cubic-bezier(.22,1,.36,1);flex-basis:0;min-width:0;}
.mtr .wseg+.wseg{box-shadow:inset 2px 0 0 rgba(0,0,0,.35);}
.mtr .mid{position:absolute;left:50%;top:-1px;bottom:-1px;width:2px;margin-left:-1px;background:rgba(255,255,255,.7);}

/* how the cards flip: by tap, by themselves, fast */
.spd{display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:17px;background:rgba(12,10,26,.42);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);translate:-100% -50%;}
.spd.row{flex-direction:row;translate:-50% 0;}
.spd.al-l{translate:0 -50%;}
.spd button{min-width:58px;min-height:44px;padding:0 10px;border:0;border-radius:14px;background:transparent;color:rgba(255,255,255,.8);font:inherit;font-weight:800;font-size:.84rem;cursor:pointer;transition:background .2s,color .2s;}
.spd button.on{background:linear-gradient(180deg,var(--gold-hi,#ffe17a),var(--gold-lo,#f2b632));color:#2b1a00;}
.spd button:active{translate:0 1px;}
.cap{width:max-content;max-width:var(--capw,160px);font-size:.8rem;font-weight:700;line-height:1.25;color:rgba(255,255,255,.82);pointer-events:none;}
.cap.al-r{translate:-100% -50%;text-align:right;}
.cap.al-l{translate:0 -50%;}
.cap.al-c{translate:-50% -50%;text-align:center;}
.cap.al-t{translate:0 0;}
.wr .moat{position:absolute;left:0;top:0;width:100%;visibility:hidden;pointer-events:none;}
.wr .skip{position:absolute;left:50%;translate:-50% 0;bottom:14px;z-index:900;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var Core = window.WarCore, el = Kit.el, app = document.getElementById('app');
  var SAVE = 'war_state', HKEY = 'war', SPEEDK = 'war_speed', SEENK = 'war_seen';
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} if (window.FGHSync && FGHSync.noteWrite) FGHSync.noteWrite(k); }

  var RULES =
    '<p class="goal">Win every card in the deck. There is nothing to choose in War: you flip, and the higher card wins.</p>' +
    '<h3>The deal</h3><ul><li>The whole deck is dealt out face down, so two players have 26 cards each and four players have 13. With three players, the two of clubs comes out and everyone has 17. Nobody looks at their cards.</li></ul>' +
    '<h3>A round</h3><ul><li>Everyone turns up the top card of their pile at the same time. Tap your pile to turn yours up, or hold it to keep turning cards round after round.</li>' +
    '<li>The highest card takes every card turned up, and they go face down under the bottom of the winner’s pile. Aces are high unless you choose otherwise in the setup.</li></ul>' +
    '<h3>War</h3><ul><li>When the highest cards are the same rank, it’s war. The players who tied each lay three cards face down (or one, if you choose that in the setup) and then one card face up. The highest of those cards takes everything on the table.</li>' +
    '<li>If those cards tie again, it’s a double war, and the same players go to war again. Then a triple war, and so on.</li>' +
    '<li>If you don’t have enough cards for a war, you lay all but your last card face down and turn your last card up. If you have no cards left at all when a war starts, you’re out, and your cards on the table go to the winner.</li>' +
    '<li>In the rare case that everyone in the war runs out of cards at once, everyone takes back the cards they laid and the round is played again.</li></ul>' +
    '<h3>Winning</h3><ul><li>A player with no cards left is out. The last player with cards wins.</li>' +
    '<li>In a short game, whoever holds the most cards when the rounds are up wins. No game goes on forever: after 3,000 rounds it ends the same way.</li></ul>' +
    '<h3>Ways to play</h3><ul><li><b>Aces low</b> makes the ace the lowest card. <b>A 2 takes an ace</b> keeps aces high, but a two beats an ace.</li>' +
    '<li><b>Won cards</b>: after a war, the cards you win are gathered up the way hands scoop them off a real table, each player’s cards in a clump and the clumps in no set order. <b>In order</b> puts them under exactly as they were laid, and <b>Shuffled</b> mixes them first.</li>' +
    '<li><b>Flipping</b>: by tap (tap your pile, or hold it to keep going), by themselves, or fast.</li></ul>' +
    '<h3>Online</h3><ul><li><b>Play online</b> opens a table, and the others join on their own devices. Each player turns up their own card, and the round is settled when everyone has. The computer plays any empty seat.</li></ul>';

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null, NET = null, MYSEAT = 0, busy = false, token = 0, queue = {}, holding = false, autoT = 0, WINO = null;
  var speed = /^(tap|auto|fast)$/.test(lsGet(SPEEDK, '')) ? lsGet(SPEEDK, '') : 'tap';
  var VT = [], VC = [], CEL = {}, GH = [], Z = 10, G = null, shown500 = 0;

  Kit.init({
    id: 'war',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    menu: TurnNet.menu().concat([{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(HKEY, { title: 'War: past games' }); } }]),
    rules: RULES
  });

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function me() { return NET ? MYSEAT : 0; }
  function first(n) { return String(n || '').split(' ')[0]; }
  function fn(p) { var pl = S.players[p]; return pl.cpu ? pl.name : first(pl.name); }
  function people() { return S.players.filter(function (x) { return !x.cpu; }).length; }
  function onePerson() { return !!NET || people() < 2; }
  function isYou(p) { return onePerson() && p === me() && (!NET || MYSEAT >= 0); }
  function who(p) { return isYou(p) ? 'You' : fn(p); }
  function whose(p) { return isYou(p) ? 'your' : fn(p) + '’s'; }
  function mine(p) { return NET ? p === MYSEAT : !S.players[p].cpu; }
  function color(p) { return Kit.color(p); }
  function fmt(n) { return Core.fmt(n); }
  function F() { return speed === 'fast' ? 0.42 : holding ? 0.72 : 1; }
  function T(ms) { return Math.round(ms * F()); }
  function later(f, ms) { var t = token; setTimeout(function () { if (t === token) f(); }, ms); }
  function save() {
    if (NET || !S) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S.phase !== 'over') Kit.resume.set('Round ' + S.round);
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); token++; busy = false; clearTimeout(autoT); }

  // ── Setup ─────────────────────────────────────────────────────────────────
  function showSetup() {
    S = null; token++; busy = false; clearTimeout(autoT); queue = {}; holding = false;
    if (WINO) { try { WINO.close(); } catch (e) {} WINO = null; }
    app.className = 'stage'; app.innerHTML = ''; tbl = null;
    Kit.setup(app, {
      modes: Kit.modes(['cpu', 'local']),
      players: { min: 2, max: 4, count: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : 'mix'; } },
      options: [
        { id: 'rounds', label: 'Game length', value: 0, choices: [
          [0, 'Every card\nStandard', 'Play until one player has won every card.'],
          [100, '100\nRounds', 'After 100 rounds, whoever holds the most cards wins.'],
          [250, '250\nRounds', 'After 250 rounds, whoever holds the most cards wins.']] },
        { id: 'aces', label: 'Aces', value: 'high', choices: [
          ['high', 'High\nStandard', 'The ace beats every other card.'],
          ['low', 'Low', 'The ace is the lowest card, below the two.'],
          ['two', 'High\nA 2 takes it', 'The ace beats everything except a two, which takes an ace.']] },
        { id: 'down', label: 'Cards face down in a war', value: 3, choices: [
          [3, '3', 'Each player in a war lays three cards face down, then one face up.'],
          [1, '1', 'Each player in a war lays one card face down, then one face up.']] },
        { id: 'shuffle', label: 'Won cards', value: 2, choices: [
          [2, 'Gathered\nStandard', 'After a war, the cards you win are scooped up off the table the way hands do it, in no set order.'],
          [0, 'In order', 'The cards you win go under your pile in the order they were laid.'],
          [1, 'Shuffled', 'The cards you win are shuffled before they go under your pile.']] },
        { id: 'speed', label: 'Flipping', value: speed, choices: [
          ['tap', 'By tap', 'Tap your pile to flip, or hold it to keep flipping.'],
          ['auto', 'Auto', 'The cards flip by themselves.'],
          ['fast', 'Fast', 'The cards flip by themselves, quickly.']] }
      ],
      onStart: function (cfg) {
        var o = cfg.options;
        setSpeed(o.speed || 'tap', true);
        S = Core.newGame(cfg.players.map(function (p) { return { name: p.name, cpu: !!p.cpu }; }), { rounds: +o.rounds || 0, aces: o.aces, down: +o.down, shuffle: +o.shuffle });
        S.mode = cfg.mode; shown500 = 0;
        Kit.gameStart(); save(); build(); render(); dealIn();
      }
    });
  }
  function setSpeed(s, quiet) {
    speed = s; lsSet(SPEEDK, s);
    if (spdEl) [].forEach.call(spdEl.children, function (b) { b.classList.toggle('on', b.dataset.s === s); b.setAttribute('aria-pressed', b.dataset.s === s ? 'true' : 'false'); });
    if (!quiet) { Kit.sfx('tick'); Kit.haptic('light'); }
    paintCap(); schedule();
  }

  // ═══ The table ═══════════════════════════════════════════════════════════════════════════════════
  var box, tbl, pileEls = [], tagEls = [], mtrEl, spdEl, capEl, skipEl, moAtEl;
  function build() {
    app.className = 'wr k-hold'; app.innerHTML = ''; CEL = {}; Z = 10;
    box = el('div', { class: 'box' });
    box.appendChild(el('div', { class: 'tblbg wood' }, [el('div', { class: 'felt-in' })]));
    tbl = el('div', { class: 'tbl' }); box.appendChild(tbl); app.appendChild(box);
    pileEls = []; tagEls = [];
    for (var p = 0; p < S.n; p++) (function (p) {
      var pe = el('div', { class: 'pile', role: 'button', 'aria-label': fn(p) + '’s pile' }, [el('div', { class: 'slot' }), el('div', { class: 'stk' }, [Kit.card('', '', { back: true })]), el('div', { class: 'ring' }), el('div', { class: 'cnt' })]);
      pe.addEventListener('pointerdown', function (e) { pileDown(p, e); });
      pe.addEventListener('pointerup', pileUp); pe.addEventListener('pointercancel', pileUp); pe.addEventListener('lostpointercapture', pileUp);
      pe.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      pe.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); tapPile(p); } });
      pe.tabIndex = 0;
      pileEls.push(pe); tbl.appendChild(pe);
      var tg = el('div', { class: 'tg' }, [avatar(p), el('div', { class: 'tx' }, [el('span', { class: 'nm', text: fn(p) }), el('span', { class: 'sb' })])]);
      tagEls.push(tg); tbl.appendChild(tg);
    })(p);
    mtrEl = el('div', { class: 'mtr' }, [el('span', { class: 'rd' }), el('div', { class: 'bar' })]);
    tbl.appendChild(mtrEl);
    spdEl = el('div', { class: 'spd', role: 'group', 'aria-label': 'How the cards flip' }, [['tap', 'Tap'], ['auto', 'Auto'], ['fast', 'Fast']].map(function (x) {
      return el('button', { type: 'button', 'data-s': x[0], class: speed === x[0] ? 'on' : '', 'aria-pressed': speed === x[0] ? 'true' : 'false', text: x[1], onclick: function () { if (speed !== x[0]) setSpeed(x[0]); } });
    }));
    tbl.appendChild(spdEl);
    capEl = el('div', { class: 'cap' }); tbl.appendChild(capEl);
    moAtEl = el('div', { class: 'moat', 'aria-hidden': 'true' }); tbl.appendChild(moAtEl);
    skipEl = null;
  }
  function avatar(p) {
    var pl = S.players[p];
    if (pl.cpu) return el('span', { class: 'avatar', style: { '--c': color(p) }, html: Kit.icon('bot') });
    return Kit.avatar && Kit.avatar.el ? Kit.avatar.el(pl.name, '', color(p)) : el('span', { class: 'avatar', style: { '--c': color(p) }, text: pl.name.charAt(0) });
  }
  // seats as this device sees them: its own first, then round the table to its left
  function view() { var a = [], m = Math.max(0, me()); for (var q = 0; q < S.n; q++) a.push((m + q) % S.n); return a; }

  // ── Where everything goes: one layout for each shape, measured from the room on the table ──
  function geo() {
    var W = tbl.clientWidth, H = tbl.clientHeight, n = S.n, land = W > H * 1.05, v = view(), m = 10, top = 42;
    var g = { W: W, H: H, land: land, seats: [], meter: { x: m + 4, y: 8, w: W - 2 * m - 8 } };
    var avail = H - top - m, two = n === 2, rot = !NET && two && people() === 2 && !land;
    function seat(p, o) { g.seats[p] = o; }
    if (two && !land && W > H * 0.66) {
      // an iPad upright: two rows, their pile and card across the top, your card and pile (at the right) below
      var tH = 46, spH5 = 60;
      var cw5 = Math.min((W - 2 * m - 24) / 2.75, (avail - 2 * tH - spH5 - 30) / 2.8, 300), pcw5 = cw5 * 0.8, ch5 = cw5 * 1.4, pch5 = pcw5 * 1.4;
      var gap5 = Math.max(8, (avail - 2 * tH - spH5 - 2 * ch5) / 4);
      var y1 = top + gap5 + tH + ch5 / 2, y2 = y1 + ch5 / 2 + gap5 * 1.5 + tH + ch5 / 2;

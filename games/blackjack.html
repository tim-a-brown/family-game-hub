<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackjack</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>

<style>
.stage{padding-bottom:calc(var(--safe-b) + 10px);}
/* ── Table: a half-moon blackjack table in a wooden rail ─────────────────── */
.bjwrap{width:100%;max-width:min(100%,calc((100dvh - 330px) * .7234 + 18px));min-width:280px;margin:0 auto;}
.bjt{padding:9px;border-radius:24px 24px 50% 50% / 24px 24px 23% 23%;}
.bjfelt{position:relative;aspect-ratio:340/470;border-radius:16px 16px 50% 50% / 16px 16px 22% 22%;overflow:hidden;--u:1px;}
.bjfelt .arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.arc text{font-family:var(--display);letter-spacing:.06em;}
.bjfelt .arc{transition:opacity .3s;}
.bjfelt.has-msg .arc{opacity:.12;}
/* dealer chip rack, shoe, discard tray */
.tray{position:absolute;top:0;left:50%;transform:translateX(-50%);width:calc(var(--u)*150);height:calc(var(--u)*30);display:flex;gap:calc(var(--u)*2);
  padding:calc(var(--u)*3) calc(var(--u)*6) calc(var(--u)*5);border-radius:0 0 calc(var(--u)*10) calc(var(--u)*10);
  background:linear-gradient(#2e1d12,#160d07);box-shadow:inset 0 -2px 0 rgba(255,255,255,.08),0 4px 10px rgba(0,0,0,.45);z-index:1;}
.tray i{flex:1;border-radius:calc(var(--u)*3);
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 35%,rgba(0,0,0,.35)),
    repeating-linear-gradient(180deg,var(--c) 0 calc(var(--u)*2.4),var(--e) calc(var(--u)*2.4) calc(var(--u)*2.9));}
.shoe{position:absolute;top:calc(var(--u)*8);right:calc(var(--u)*10);width:calc(var(--u)*50);height:calc(var(--u)*58);z-index:2;border:0;padding:0;
  border-radius:calc(var(--u)*6) calc(var(--u)*6) calc(var(--u)*12) calc(var(--u)*12);transform:rotate(-10deg);
  background:linear-gradient(160deg,#4a4a55,#1b1b22 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 6px 12px rgba(0,0,0,.5);}
.shoe .pcard{--cw:calc(var(--u)*36);position:absolute;left:50%;bottom:calc(var(--u)*7);transform:translateX(-50%) perspective(80px) rotateX(28deg);}
.shoe .lip{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*3);height:calc(var(--u)*13);border-radius:0 0 calc(var(--u)*9) calc(var(--u)*9);
  background:linear-gradient(#26262e,#0e0e12);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);}
.shoe .cut{position:absolute;left:calc(var(--u)*4);width:calc(var(--u)*6);height:calc(var(--u)*30);top:calc(var(--u)*8);border-radius:2px;background:#ffd23f;box-shadow:0 0 0 1px rgba(0,0,0,.3);transform:rotate(4deg);}
.disc{position:absolute;top:calc(var(--u)*12);left:calc(var(--u)*12);transform:rotate(8deg);z-index:1;}
.disc .pcard{--cw:calc(var(--u)*30);}
.disc .edge{position:absolute;left:0;right:0;top:100%;height:var(--h,0px);border-radius:0 0 3px 3px;
  background:repeating-linear-gradient(180deg,#f3eee2 0 1px,#bdb6a5 1px 2px);box-shadow:0 3px 6px rgba(0,0,0,.35);}
.count{position:absolute;top:calc(var(--u)*104);right:calc(var(--u)*6);z-index:3;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.4);color:#fff;
  font-size:calc(var(--u)*10.5);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;}
.count b{color:var(--yellow);}
/* dealer hand */
.dealer{position:absolute;top:calc(var(--u)*42);left:50%;transform:translateX(-50%);display:flex;align-items:center;z-index:3;--cw:var(--dcw);min-height:calc(var(--dcw) * 1.4);}
.dealer .cd{position:relative;}
.dealer .cd + .cd{margin-left:calc(var(--dcw) * -.5);}
.dealer .cd.slot + .cd.slot{margin-left:calc(var(--u)*8);}
.dealer .cd.slot .pcard{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);}
.dealer .cd.slot .pcard > *{display:none;}
.tot{display:inline-grid;place-items:center;min-width:calc(var(--u)*30);height:calc(var(--u)*24);padding:0 calc(var(--u)*7);border-radius:999px;
  background:rgba(0,0,0,.6);color:#fff;font-weight:900;font-size:calc(var(--u)*13.5);font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.tot.bust{background:#c8102e;}
.tot.bj{background:var(--yellow);color:#2b1a00;}
.tot.t21{background:#13853f;}
.dealer .tot{margin-left:calc(var(--u)*8);}
/* seats */
.seat{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*7);z-index:4;}
.hands{display:flex;align-items:flex-end;}
.hand{position:relative;display:flex;flex-direction:column;align-items:center;width:var(--hw);gap:calc(var(--u)*6);}
.cards{position:relative;width:var(--hw);}
.cards .cd{position:absolute;}
.hand .tot{position:absolute;z-index:6;top:calc(var(--u)*-12);}
.hand.cur .pcard{box-shadow:0 0 0 2px var(--yellow),0 6px 14px rgba(0,0,0,.35);}
.hand.over .pcard{filter:brightness(.62) saturate(.7);}
.res{position:absolute;left:50%;bottom:calc(var(--sp) + var(--u)*2);transform:translateX(-50%);z-index:7;padding:2px 8px;border-radius:999px;
  font-size:calc(var(--u)*10.5);font-weight:900;letter-spacing:.05em;white-space:nowrap;color:#fff;background:#c8102e;box-shadow:0 2px 8px rgba(0,0,0,.4);animation:pop .35s var(--spring);}
.res.win{background:#13853f;}
.res.bj,.res.even{background:var(--yellow);color:#2b1a00;}
.res.push{background:#5d6170;}
.res.surr{background:#6d5a3a;}
.spot{position:relative;width:var(--sp);height:var(--sp);border-radius:50%;display:grid;place-items:center;flex:none;border:0;padding:0;background:none;color:#fff;
  box-shadow:inset 0 0 0 calc(var(--u)*1.6) rgba(255,255,255,.55);transition:box-shadow .2s;}
.spot.extra{box-shadow:none;outline:calc(var(--u)*1.4) dashed rgba(255,255,255,.35);outline-offset:calc(var(--u)*-1.4);}
.spot.sel{box-shadow:inset 0 0 0 calc(var(--u)*2.2) var(--yellow),0 0 0 3px rgba(255,200,61,.25),0 0 18px rgba(255,200,61,.45);}
.spot.tap{cursor:pointer;}
.spot .amt{position:absolute;bottom:calc(var(--u)*-8);left:50%;transform:translateX(-50%);z-index:5;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.92);color:#1d1b2e;
  font-size:calc(var(--u)*10.5);font-weight:900;line-height:1.5;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.35);}
.spot .amt.up{background:#3ddc84;color:#03290f;}
.spot .amt.down{background:#ff8a8a;color:#3a0008;}
.spot .ins{position:absolute;top:calc(var(--u)*-16);left:calc(var(--u)*-14);font-size:calc(var(--u)*8);font-weight:900;color:var(--yellow);}
.spot .empty{font-size:calc(var(--u)*9);font-weight:800;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.1;}
.stk{position:relative;width:var(--ck);height:var(--ck);}
.stk .ck{position:absolute;left:0;top:0;transform:translateY(calc(var(--i) * var(--u) * -2.6));}
.stk.dbl{position:absolute;left:58%;top:22%;}
.stk.pay{position:absolute;left:-30%;top:-22%;}
.stk.insk{position:absolute;left:-66%;top:4%;--ck:calc(var(--sp) * .42);}
.tag{display:flex;align-items:center;gap:5px;max-width:var(--tw);padding:3px 9px 3px 3px;border-radius:999px;background:rgba(10,20,15,.6);color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.25);transition:box-shadow .2s, transform .3s var(--spring);}
.tag .avatar{width:calc(var(--u)*24);height:calc(var(--u)*24);font-size:calc(var(--u)*11);}
.tag .nm{display:flex;flex-direction:column;min-width:0;line-height:1.1;}
.tag .nm b{font-size:calc(var(--u)*11.5);font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tag .nm small{font-size:calc(var(--u)*10);font-weight:800;color:#bfe9cf;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tight .tag{gap:3px;padding:2px 7px 2px 2px;}
.tight .tag .avatar{width:calc(var(--u)*18);height:calc(var(--u)*18);font-size:calc(var(--u)*9);}
.tight .tag .nm b{font-size:calc(var(--u)*11);letter-spacing:-.01em;}
.seat.turn .tag{box-shadow:0 0 0 3px var(--yellow),0 0 18px rgba(255,200,61,.55);transform:scale(1.05);}
.seat .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;padding:4px 10px;border-radius:12px;background:#fff;color:#1d1b2e;
  font-weight:900;font-size:.8rem;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.3);animation:pop .35s var(--spring);z-index:9;}
.bjmsg{position:absolute;left:50%;top:calc(var(--u)*150);transform:translateX(-50%);z-index:8;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;
  font-weight:900;font-size:calc(var(--u)*13);white-space:nowrap;animation:pop .35s var(--spring);}
.cd.flip .pcard{animation:flipup .42s var(--ease);}
@keyframes flipup{0%{transform:rotateY(90deg);}100%{transform:none;}}
/* ── Chips (standard colours: 1 white, 5 red, 25 green, 100 black, 500 purple) ── */
.ck{--c:#c8102e;--e:#fff;--t:#fff;--ck:40px;position:relative;width:var(--ck);height:var(--ck);border-radius:50%;flex:none;border:0;padding:0;
  background:
    radial-gradient(circle,rgba(255,255,255,.18) 0 30%,transparent 31%),
    radial-gradient(circle,var(--c) 0 50%,rgba(255,255,255,.7) 50% 53%,var(--c) 53% 63%,transparent 64%),
    repeating-conic-gradient(var(--e) 0 13deg,var(--c) 13deg 45deg);
  box-shadow:inset 0 0 0 calc(var(--ck) * .03) rgba(0,0,0,.3),0 1px 0 rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.35);}
.ck[data-v="1"]{--c:#f1ede4;--e:#2f63c8;--t:#1d2a4a;}
.ck[data-v="5"]{--c:#c8102e;--e:#fff;}
.ck[data-v="25"]{--c:#13853f;--e:#fff;}
.ck[data-v="100"]{--c:#1b1b1f;--e:#f1ede4;}
.ck[data-v="500"]{--c:#6b2fa3;--e:#f4cf5d;}
.ck b{position:absolute;inset:0;display:grid;place-items:center;font:900 calc(var(--ck) * .32)/1 var(--font);color:var(--t);letter-spacing:-.03em;}
/* ── Controls under the table ─────────────────────────────────────────── */
.ctrl{display:flex;flex-direction:column;gap:10px;margin:12px auto 0;min-height:178px;max-width:480px;}
.st{display:flex;align-items:center;gap:10px;min-height:32px;font-weight:800;}
.st .grow{display:flex;align-items:center;gap:8px;min-width:0;}
.st .grow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.st .avatar{width:28px;height:28px;font-size:.8rem;}
.st .bank{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.st .bank b{color:var(--text);}
.st .big{font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--yellow);font-variant-numeric:tabular-nums;}
.rack{display:flex;justify-content:space-between;gap:6px;padding:10px 12px 12px;border-radius:18px;}
.rack .ck{--ck:min(54px,calc((100vw - 110px) / 5));cursor:pointer;transition:transform .15s var(--spring),opacity .15s;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.45),0 6px 10px rgba(0,0,0,.4);}
.rack .ck:active:not(:disabled){transform:translateY(2px) scale(.94);}
.rack .ck:disabled{opacity:.3;cursor:default;}
.acts{display:grid;gap:8px;grid-template-columns:repeat(var(--n,2),1fr);}
.acts .btn{min-height:54px;padding:0 8px;font-size:1.05rem;}
.acts .btn.sm{min-height:46px;font-size:.95rem;}
.acts .btn.wide{grid-column:span 2;}
.acts .btn.hinted{animation:hintp 1s ease-in-out 3;}
@keyframes hintp{50%{box-shadow:0 0 0 4px var(--yellow),0 0 22px rgba(255,200,61,.8);}}
.acts .hintb{--b:rgba(255,255,255,.08);--b-lip:rgba(0,0,0,.25);color:var(--yellow);}
.wait{display:flex;align-items:center;justify-content:center;min-height:110px;color:var(--text-2);font-weight:800;text-align:center;}
.linkb{background:none;border:0;color:var(--text-3);font-weight:800;font-size:.9rem;padding:8px;align-self:center;display:flex;align-items:center;gap:6px;}
.linkb .ico{width:16px;height:16px;}
.nets{display:flex;flex-wrap:wrap;gap:6px;}
.nets span{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:800;font-size:.88rem;white-space:nowrap;}
.nets .up{color:var(--green);} .nets .down{color:#ff8a8a;}
.sess{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.sess th,.sess td{padding:8px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.08);}
.sess th:first-child,.sess td:first-child{text-align:left;}
.sess td.up{color:var(--green);font-weight:900;} .sess td.down{color:#ff8a8a;font-weight:900;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var KEY = 'blackjack', SAVE = 'blackjack_state';
  var SEAT_STACK = 1000, TABLE_MAX = 1000, CHIPS = [1, 5, 25, 100, 500];
  var LIVE = ['deal', 'ins', 'peek', 'play', 'dealer'];
  var S = null, token = 0, undoStack = [], seen = {}, busyUntil = 0, lastTurnSeat = -1;
  var dom = {};

  Kit.init({
    id: 'blackjack', mark: false,
    theme: { back: ['#8f1d2c', '#c43a4c'] },
    onNew: function () { if (S && S.rounds.length && LIVE.indexOf(S.phase) < 0) recordSession(); clearSave(); showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'chart', label: 'This session', onClick: function () { if (S) showSession(); else Kit.toast('No session yet'); } },
      { icon: 'coins', label: 'Cash out and leave the table', onClick: function () { endSession(); } },
      { icon: 'history', label: 'Past sessions', onClick: function () { Kit.history(KEY, { title: 'Blackjack: past sessions', extra: oldEntry }); } }
    ],
    rules:
      '<p class="goal">Beat the dealer: finish closer to 21 than the dealer without going over.</p>' +
      '<h3>Card values</h3><ul><li>2 to 10 count their number. J, Q and K count 10.</li>' +
      '<li>An Ace counts 1 or 11, whichever helps you. A hand where the Ace counts 11 is called <b>soft</b> (shown like 7/17).</li></ul>' +
      '<h3>Playing a hand</h3><ol><li>Tap chips to build your bet, then <b>Deal</b>. You get two cards face up. The dealer gets one up and one face down.</li>' +
      '<li>On your turn choose: <b>Hit</b> (take a card), <b>Stand</b> (stop), <b>Double</b> (double your bet and take exactly one more card), ' +
      '<b>Split</b> (two cards of the same value become two hands, each with its own bet), or <b>Surrender</b> if it is turned on (give up and get half your bet back; first move only).</li>' +
      '<li>Go over 21 and you <b>bust</b>: you lose right away, even if the dealer busts later.</li>' +
      '<li>Then the dealer turns over the hidden card and must hit until reaching 17 or more. The table says whether the dealer stands or hits on a soft 17.</li></ol>' +
      '<h3>Payouts</h3><ul><li><b>Blackjack</b> (an Ace and a 10-value card as your first two cards) pays <b>3 to 2</b>: bet $10, win $15.</li>' +
      '<li>Beat the dealer: paid 1 to 1. Same total: <b>push</b>, you keep your bet.</li>' +
      '<li><b>Insurance</b>: when the dealer shows an Ace you may bet half your bet that the dealer has blackjack. It pays 2 to 1. ' +
      'If you have blackjack yourself you can take <b>even money</b> instead: a sure 1 to 1 win right now.</li></ul>' +
      '<h3>Table rules</h3><ul><li>Cards come from a shoe of 6 decks (you can pick 1, 2, 6 or 8). When the yellow cut card comes out, the shoe is shuffled after that hand.</li>' +
      '<li>With an Ace or 10 showing, the dealer peeks for blackjack. If the dealer has it, you only lose your first bet.</li>' +
      '<li>Double on any first two cards, also after a split.</li>' +
      '<li>Split up to 3 times (4 hands). Split Aces get one card each and can\'t be split again. 21 after a split counts as 21, not blackjack.</li>' +
      '<li>Bets from $1 to $1,000. Odd blackjack payouts are rounded down to the dollar.</li></ul>' +
      '<h3>Chips and bank</h3><p>Seat 1 plays from the casino bank shared by all the casino games. Other seats get $1,000 in chips for the session. ' +
      'Turn on the hint button in setup to see what basic strategy says, with an optional card-counting coach.</p>'
  });

  // ── Money ─────────────────────────────────────────────────────────────────
  // Seat 1's chips are the shared casino bank (casino_bank, synced). Read it
  // directly so a bank of exactly $0 isn't mistaken for "never set".
  function rawBank() {
    try { var v = localStorage.getItem('casino_bank'); if (v == null) return Casino.balance(); var n = parseInt(v, 10); return isNaN(n) ? Casino.balance() : n; } catch (e) { return 1000; }
  }
  function setRaw(n) {
    try { localStorage.setItem('casino_bank', String(Math.max(0, Math.round(n)))); if (typeof FGHSync !== 'undefined' && FGHSync.noteWrite) FGHSync.noteWrite('casino_bank'); } catch (e) {}
  }
  function bank(i) { return i === 0 ? rawBank() : S.seats[i].bank; }
  function adj(i, a) { if (!a) return; if (i === 0) setRaw(rawBank() + a); else S.seats[i].bank += a; }
  function money(n) { n = Math.round(n); return (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US'); }
  function signed(n) { n = Math.round(n); return (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US'); }
  function chipsFor(a) {
    var out = [], d = [500, 100, 25, 5, 1];
    for (var k = 0; k < d.length && out.length < 40; k++) while (a >= d[k] && out.length < 40) { out.push(d[k]); a -= d[k]; }
    return out;
  }

  // ── Cards ─────────────────────────────────────────────────────────────────
  function cv(c) { return c.r === 'A' ? 11 : (c.r === 'K' || c.r === 'Q' || c.r === 'J' || c.r === '10') ? 10 : +c.r; }
  function tot(cards) {
    var t = 0, a = 0;
    cards.forEach(function (c) { t += cv(c); if (c.r === 'A') a++; });
    while (t > 21 && a) { t -= 10; a--; }
    return { t: t, soft: a > 0 };
  }
  function totText(cards) { var x = tot(cards); return x.soft && x.t < 21 ? (x.t - 10) + '/' + x.t : String(x.t); }
  function totWords(cards) { var x = tot(cards); return (x.soft && x.t < 21 ? 'soft ' : '') + x.t; }
  function isBJ(h) { return h.cards.length === 2 && !h.split && tot(h.cards).t === 21; }
  function dealerBJ() { return S.dealer.length === 2 && tot(S.dealer).t === 21; }
  function hilo(c) { var v = cv(c); return v <= 6 ? 1 : v >= 10 ? -1 : 0; }
  function upName(c) { return c.r === 'A' ? 'an Ace' : cv(c) === 10 ? 'a 10' : 'a ' + c.r; }
  function rankName(c) { return { A: 'Aces', K: 'Kings', Q: 'Queens', J: 'Jacks' }[c.r] || c.r + 's'; }

  function newShoe() {
    var d = Cards.shuffle(Cards.deck({ decks: S.opt.decks }));
    var pen = S.opt.decks === 1 ? .62 : S.opt.decks === 2 ? .68 : .75;
    pen += (Math.random() - .5) * .06;
    S.shoe = d; S.cutLeft = Math.round(d.length * (1 - pen)); S.rc = 0; S.shuffles = (S.shuffles || 0) + 1;
    S.shoe.pop(); S.discards = 1;   // burn card
    S.cutSeen = false;
  }
  function draw(up) {
    if (!S.shoe.length) { newShoe(); Kit.toast('Out of cards: fresh shoe'); }
    var c = S.shoe.pop(); c.n = ++S.drawN;
    if (up !== false) S.rc += hilo(c);
    if (!S.cutSeen && S.shoe.length <= S.cutLeft) { S.cutSeen = true; S.cutNote = true; }
    return c;
  }
  function decksLeft() { return Math.max(.25, S.shoe.length / 52); }
  function trueCount() { return S.rc / decksLeft(); }

  // ── Save / undo ───────────────────────────────────────────────────────────
  function save() {
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S) Kit.resume.set('Hand ' + (S.round + (S.phase === 'bet' ? 1 : 0)) + ' · bank ' + money(bank(0)));
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function snapshot() { undoStack.push({ s: JSON.stringify(S), b: rawBank() }); if (undoStack.length > 30) undoStack.shift(); }
  function clearUndo() { undoStack = []; }
  function undo() {
    if (!S || !undoStack.length) return Kit.toast('Nothing to undo right now');
    var u = undoStack.pop(); token++;
    S = JSON.parse(u.s); setRaw(u.b);
    Cards.shuffle(S.shoe);   // no peeking at the card you just undid
    markSeen(); Kit.sfx('whoosh'); Kit.toast('Undone');
    save(); render(); resumeFlow();
  }
  function markSeen() {
    seen = {};
    function cards(list) { list.forEach(function (c) { seen['n' + c.n] = 1; }); }

      setTimeout(function () { n.style.visibility = ''; Kit.sfx('deal'); Cards.fly(n, shoe, { ms: 380, rot: -25 }); }, k * step);
    });
    Array.prototype.forEach.call(felt.querySelectorAll('.cd[data-up]'), function (n) {
      if (seen['u' + n.dataset.up]) return; seen['u' + n.dataset.up] = 1; n.classList.add('flip');
    });
    var delay = fresh.length * step;
    Array.prototype.forEach.call(felt.querySelectorAll('.stk[data-pay]'), function (n) {
      if (seen['pay' + n.dataset.pay]) return; seen['pay' + n.dataset.pay] = 1;
      n.style.visibility = 'hidden';
      setTimeout(function () { n.style.visibility = ''; Kit.sfx('chip'); Cards.fly(n, tray, { ms: 420 }); }, delay + 150);
    });
    Array.prototype.forEach.call(felt.querySelectorAll('.stk[data-take]'), function (n) {
      seen['take' + n.dataset.take] = 1;
      setTimeout(function () {
        var a = n.getBoundingClientRect(), b = tray.getBoundingClientRect();
        n.style.transition = 'transform .45s ease-in, opacity .45s ease-in';
        n.style.transform = 'translate(' + (b.left + b.width / 2 - a.left - a.width / 2) + 'px,' + (b.top + b.height / 2 - a.top - a.height / 2) + 'px) scale(.6)';
        n.style.opacity = '0';
      }, delay + 250);
    });
    return fresh.length ? delay + 380 : 0;
  }

  // ── Controls under the table ──────────────────────────────────────────────
  function controls() {
    var c = el('div', { class: 'ctrl' });
    var ph = S.phase, h = curHand();
    function status(left, right) { c.appendChild(el('div', { class: 'st' }, [el('div', { class: 'grow' }, left), right || null])); }
    function who(i) { var s = S.seats[i]; return el('span', { class: 'avatar', style: { '--c': Kit.color(i) }, html: s.cpu ? Kit.icon('bot') : Kit.esc(s.name.charAt(0).toUpperCase()) }); }
    function btn(label, cls, fn, attrs) { return el('button', Object.assign({ type: 'button', class: 'btn ' + cls, html: label, onclick: fn }, attrs || {})); }
    function acts(list, n) { var a = el('div', { class: 'acts' }); a.style.setProperty('--n', n || list.length); list.forEach(function (b) { if (b) a.appendChild(b); }); c.appendChild(a); return a; }
    var coach = S.opt.coach !== 'off';

    if (ph === 'bet') {
      var i = S.sel, s = S.seats[i], left = bank(i) - S.bets[i];
      status([who(i), el('span', { text: humans().length > 1 ? Kit.poss(s.name) + ' bet' : 'Your bet' })], el('span', { class: 'big', text: money(S.bets[i]) }));
      if (bank(i) < 1) {
        c.appendChild(el('p', { class: 'muted center', text: (i === 0 ? 'The casino bank is empty.' : s.name + ' is out of chips.') }));
        acts([btn(i === 0 ? 'Reset bank to $1,000' : 'Buy $1,000 in chips', 'btn-yellow', function () { rebuy(i); })], 1);
      } else {
        var rack = el('div', { class: 'rack wood' });
        CHIPS.forEach(function (v) {
          var b = el('button', { type: 'button', class: 'ck', 'data-v': v, 'aria-label': '$' + v + ' chip', onclick: function () { addChip(v, b); } }, [el('b', { text: String(v) })]);
          if (S.bets[i] + v > Math.min(TABLE_MAX, bank(i))) b.disabled = true;
          rack.appendChild(b);
        });
        c.appendChild(rack);
        var last = humans().some(function (j) { return S.seats[j].last > 0; }) && !humans().some(function (j) { return S.bets[j] > 0; });
        acts([
          last ? btn('Rebet', 'btn-soft', rebet) : btn('Clear', 'btn-soft', clearBet, { disabled: !S.bets[i] }),
          btn(Kit.icon('play') + '<span>Deal</span>', 'btn-primary wide', deal)
        ], 3);
      }
      c.appendChild(el('div', { class: 'st' }, [el('span', { class: 'bank grow', html: (humans().length > 1 ? 'Tap a circle to bet for someone else · ' : '') + 'Bank <b>' + money(left) + '</b>' }),
        el('button', { type: 'button', class: 'linkb', html: Kit.icon('coins') + '<span>Cash out</span>', onclick: endSession })]));
    } else if (ph === 'ins' && S.insQ >= 0) {
      var ih = S.hands[S.insQ], bj = isBJ(ih), cost = insCost(ih);
      status([who(ih.seat), el('span', { text: (humans().length > 1 ? S.seats[ih.seat].name + ': d' : 'D') + 'ealer shows an Ace' })]);
      c.appendChild(el('p', { class: 'muted', text: bj ? 'You have blackjack! Take even money (win ' + money(ih.bet) + ' now), or risk a push for the 3 to 2 payout.' : 'Insurance costs ' + money(cost) + ' and pays 2 to 1 if the dealer has blackjack.' }));
      acts([
        bj ? btn('Even money', 'btn-yellow', function () { insAnswer('even'); }, { 'data-a': 'even' }) : btn('Insure ' + money(cost), 'btn-yellow', function () { insAnswer('take'); }, { 'data-a': 'take' }),
        btn(bj ? 'No, play it' : 'No insurance', 'btn-soft', function () { insAnswer('no'); }, { 'data-a': 'no' }),
        coach ? btn(Kit.icon('lightbulb'), 'hintb', hint, { 'aria-label': 'Hint' }) : null
      ], coach ? 3 : 2);
    } else if (ph === 'play' && h && !h.done && !S.seats[h.seat].cpu) {
      var mine = seatHands(h.seat), hi = mine.indexOf(h);
      status([who(h.seat), el('span', { text: (humans().length > 1 ? S.seats[h.seat].name + ': ' : '') + cap((mine.length > 1 ? 'Hand ' + (hi + 1) + ' of ' + mine.length + ': ' : '') + totWords(h.cards) + ' against ' + upName(S.dealer[0])) })]);
      acts([btn('Hit', 'btn-green', function () { act('H'); }, { 'data-a': 'H' }), btn('Stand', 'btn-red', function () { act('S'); }, { 'data-a': 'S' })], 2);
      var row = [btn('Double', 'btn-yellow sm', function () { act('D'); }, { 'data-a': 'D', disabled: !canDouble(h) }),
        btn('Split', 'btn-blue sm', function () { act('P'); }, { 'data-a': 'P', disabled: !canSplit(h) })];
      if (S.opt.surr) row.push(btn('Surrender', 'btn-soft sm', function () { act('R'); }, { 'data-a': 'R', disabled: !canSurr(h) }));
      if (coach) row.push(btn(Kit.icon('lightbulb'), 'hintb sm', hint, { 'aria-label': 'Hint: what does basic strategy say?' }));
      var ra = acts(row, row.length);
      if (S.opt.surr && coach) ra.style.gridTemplateColumns = '1fr 1fr 1.3fr .7fr';
    } else if (ph === 'done') {
      var nets = S.rounds[S.rounds.length - 1];
      var hs = humans().filter(function (j) { return nets[j] != null; });
      if (S.seats.length === 1 || hs.length === 1 && S.mode !== 'pass') {
        var me = hs[0] != null ? hs[0] : 0, nv = nets[me];
        status([who(me), el('span', { text: nv == null ? 'You sat out' : nv > 0 ? 'You won ' + money(nv) : nv < 0 ? 'You lost ' + money(-nv) : 'Push: your bet comes back' })],
          el('span', { class: 'bank', html: 'Bank <b>' + money(bank(me)) + '</b>' }));
      } else {
        var nb = el('div', { class: 'nets' });
        S.seats.forEach(function (s, j) { if (nets[j] != null) nb.appendChild(el('span', { class: nets[j] > 0 ? 'up' : nets[j] < 0 ? 'down' : '', text: s.name + ' ' + (nets[j] ? signed(nets[j]) : 'push') })); });
        c.appendChild(nb);
      }
      var lastBets = humans().map(function (j) { return Math.min(S.seats[j].last, bank(j), TABLE_MAX); }).reduce(function (a, b) { return a + b; }, 0);
      acts([btn('New bet', 'btn-soft', function () { nextRound(false); }),
        lastBets > 0 ? btn('Rebet ' + money(lastBets) + ' & deal', 'btn-primary wide', function () { nextRound(true); }) : btn('Next hand', 'btn-primary wide', function () { nextRound(false); })], 3);
      c.appendChild(el('button', { type: 'button', class: 'linkb', html: Kit.icon('coins') + '<span>Cash out and end the session</span>', onclick: endSession }));
    } else {
      var txt = ph === 'dealer' ? 'Dealer plays…' : ph === 'peek' ? 'Dealer checks for blackjack…' : ph === 'deal' ? 'Dealing…' : h && S.seats[h.seat].cpu ? S.seats[h.seat].name + ' is thinking…' : '';
      c.appendChild(el('div', { class: 'wait', text: txt }));
    }
    return c;
  }
  function seatSay(i, t) {
    var s = dom.felt && dom.felt.querySelector('.seat[data-seat="' + i + '"]'); if (!s) return;
    var b = el('div', { class: 'say', text: t }); s.appendChild(b);
    setTimeout(function () { b.remove(); }, 1200);
    // Re-attach after the next render so the bubble survives it
    setTimeout(function () { var s2 = dom.felt && dom.felt.querySelector('.seat[data-seat="' + i + '"]'); if (s2 && s2 !== s && !s2.querySelector('.say')) { var b2 = el('div', { class: 'say', text: t }); s2.appendChild(b2); setTimeout(function () { b2.remove(); }, 1000); } }, 30);
  }

  // ── Keyboard (laptop) ─────────────────────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    if (!S || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.k-scrim, .k-win') || /input|textarea/i.test((e.target || {}).tagName || '')) return;
    var k = e.key.toLowerCase();
    if (S.phase === 'play') { var m = { h: 'H', s: 'S', d: 'D', p: 'P', r: 'R' }[k]; if (m) act(m); }
    else if (S.phase === 'bet' && k === 'enter') deal();
    else if (S.phase === 'done' && k === 'enter') nextRound(true);
  });
  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (S) { var b = busyUntil; render(); busyUntil = b; } }, 150); });

  // ── Resume ────────────────────────────────────────────────────────────────
  function resumeFlow() {
    if (!S) return;
    var h = curHand();
    if (S.phase === 'deal') after(afterDeal, 400);
    else if (S.phase === 'peek') peek();
    else if (S.phase === 'play' && h && h.done) after(advance, 300);
    else if (S.phase === 'play' && h) turnStart();
    else if (S.phase === 'play') advance();
    else if (S.phase === 'dealer') after(dealerStep, 500);
    else if (S.phase === 'ins' && S.insQ < 0) nextIns();
  }
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.v === 1 && saved.seats && saved.shoe) {
    S = saved; Kit.gameStart(); markSeen(); render(); resumeFlow();
  } else showSetup();
})();
</script>

<html lang="en">

<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../casino.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script>
// The screen's shape as a class on <html> (sh-tall upright; sh-wide an iPad or laptop on its side; sh-side a phone on its side),
// set before the first paint and changed inside a View Transition, so turning the device glides the table and controls to their new places
(function () {
  var R = document.documentElement, cur = '';
  function shape() { var w = innerWidth, h = innerHeight; return w <= h ? 'tall' : h < 560 ? 'side' : w >= 900 ? 'wide' : 'tall'; }
  function set() {
    var s = shape(); if (s === cur) return;
    var go = function () { if (cur) R.classList.remove('sh-' + cur); cur = s; R.classList.add('sh-' + s); window.dispatchEvent(new Event('shape')); };
    if (cur && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden) { try { document.startViewTransition(go); return; } catch (e) {} }
    go();
  }
  set(); addEventListener('resize', set);
})();
</script>
<style>
.stage{padding-bottom:calc(var(--safe-b) + 10px + var(--corner-y));}
/* ── Table: a half-moon blackjack table in a wooden rail ─────────────────── */
.bjwrap{width:100%;max-width:min(100%,calc((100dvh - 330px) * .7234 + 18px));min-width:280px;margin:0 auto;}
.bjt{padding:9px;border-radius:24px 24px 50% 50% / 24px 24px 23% 23%;}
.bjfelt{position:relative;aspect-ratio:340/470;border-radius:16px 16px 50% 50% / 16px 16px 22% 22%;overflow:hidden;--u:1px;}
.bjfelt .arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.arc text{font-family:var(--display);letter-spacing:.06em;}
.bjfelt .arc{transition:opacity .3s;}
.bjfelt.has-msg .arc{opacity:.12;}
/* dealer chip rack, shoe, discard tray */
.tray{position:absolute;top:0;left:50%;transform:translateX(-50%);width:calc(var(--u)*150);height:calc(var(--u)*30);display:flex;gap:calc(var(--u)*2);
  padding:calc(var(--u)*3) calc(var(--u)*6) calc(var(--u)*5);border-radius:0 0 calc(var(--u)*10) calc(var(--u)*10);
  background:linear-gradient(#2e1d12,#160d07);box-shadow:inset 0 -2px 0 rgba(255,255,255,.08),0 4px 10px rgba(0,0,0,.45);z-index:1;}
.tray i{flex:1;border-radius:calc(var(--u)*3);
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 35%,rgba(0,0,0,.35)),
    repeating-linear-gradient(180deg,var(--c) 0 calc(var(--u)*2.4),var(--e) calc(var(--u)*2.4) calc(var(--u)*2.9));}
.shoe{position:absolute;top:calc(var(--u)*8);right:calc(var(--u)*10);width:calc(var(--u)*50);height:calc(var(--u)*58);z-index:2;border:0;padding:0;
  border-radius:calc(var(--u)*6) calc(var(--u)*6) calc(var(--u)*12) calc(var(--u)*12);transform:rotate(-10deg);
  background:linear-gradient(160deg,#4a4a55,#1b1b22 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 6px 12px rgba(0,0,0,.5);}
.shoe .pcard{--cw:calc(var(--u)*36);position:absolute;left:50%;bottom:calc(var(--u)*7);transform:translateX(-50%) perspective(80px) rotateX(28deg);}
.shoe .lip{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*3);height:calc(var(--u)*13);border-radius:0 0 calc(var(--u)*9) calc(var(--u)*9);
  background:linear-gradient(#26262e,#0e0e12);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);}
.shoe .cut{position:absolute;left:calc(var(--u)*4);width:calc(var(--u)*6);height:calc(var(--u)*30);top:calc(var(--u)*8);border-radius:2px;background:#ffd23f;box-shadow:0 0 0 1px rgba(0,0,0,.3);transform:rotate(4deg);}
.disc{position:absolute;top:calc(var(--u)*12);left:calc(var(--u)*12);transform:rotate(8deg);z-index:1;}
.disc .pcard{--cw:calc(var(--u)*30);}
.disc .edge{position:absolute;left:0;right:0;top:100%;height:var(--h,0px);border-radius:0 0 3px 3px;
  background:repeating-linear-gradient(180deg,#f3eee2 0 1px,#bdb6a5 1px 2px);box-shadow:0 3px 6px rgba(0,0,0,.35);}
.cbox{position:absolute;top:calc(var(--u)*104);right:calc(var(--u)*6);z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*3);}
.count{display:inline-flex;align-items:center;gap:4px;border:0;cursor:pointer;padding:2px 6px 2px 8px;border-radius:999px;background:rgba(0,0,0,.4);color:#fff;font:inherit;
  font-size:calc(var(--u)*10.5);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;}
.count b{color:var(--yellow);}
.count .tc{margin-left:6px;padding-left:7px;border-left:1px solid rgba(255,255,255,.25);}   /* (the running and true counts, side by side, each in its own place) */
.st .bank .bk-drag{display:block;font-size:.72rem;color:var(--text-3);}
.count .ico{width:calc(var(--u)*9);height:calc(var(--u)*9);opacity:.7;}
.count:active{transform:scale(.96);}
.count:focus:not(:focus-visible),.cmove:focus:not(:focus-visible){outline:none;}
/* the best move for the hand in play, under the count (tap either for the full breakdown) */
.cmove{border:0;cursor:pointer;padding:2px 8px;border-radius:999px;background:rgba(255,216,74,.16);box-shadow:inset 0 0 0 1px rgba(255,216,74,.45);color:#fff;font:inherit;
  font-size:calc(var(--u)*9.5);font-weight:800;white-space:nowrap;-webkit-tap-highlight-color:transparent;animation:cmove-in .25s ease;}
.cmove b{color:var(--yellow);}
@keyframes cmove-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
/* the count coach sheet */
.bjc{display:flex;flex-direction:column;gap:14px;}
.bjc-best{border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--green) 16%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--green) 55%,transparent);}
.bjc-best small{display:block;font-size:.84rem;font-weight:600;color:var(--text-2);}
.bjc-best b{display:block;font-size:1.5rem;font-weight:900;margin:2px 0 4px;}
.bjc-best p{margin:0;font-size:.92rem;line-height:1.4;color:var(--text-2);}
.bjc h4{margin:4px 0 0;font-size:.84rem;font-weight:600;color:var(--text-2);}
.bjc-mv{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);}
.bjc-mv.top{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--green) 60%,transparent);}
.bjc-mv .r1{display:flex;align-items:baseline;gap:8px;}
.bjc-mv .r1 b{font-size:1.02rem;font-weight:900;}
.bjc-mv .r1 .tag{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--text);}
.bjc-mv .r1 .ev{margin-left:auto;font-weight:900;font-variant-numeric:tabular-nums;}
.bjc-mv .r1 .ev.up{color:var(--green);} .bjc-mv .r1 .ev.dn{color:var(--red);}
.bjc-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--w08);}
.bjc-bar i{display:block;height:100%;}
.bjc-bar .w{background:#3ddc84;} .bjc-bar .p{background:#a9b0c4;} .bjc-bar .l{background:#ff6b78;}
.bjc-mv .r3{display:flex;gap:12px;font-size:.78rem;font-weight:800;color:var(--text-2);font-variant-numeric:tabular-nums;}
.bjc-mv .r3 span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0;}
.bjc-mv .r3 .w::before{background:#3ddc84;} .bjc-mv .r3 .p::before{background:#a9b0c4;} .bjc-mv .r3 .l::before{background:#ff6b78;}
.bjc-mv .note{font-size:.8rem;color:var(--text-3);line-height:1.35;}
.bjc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem;line-height:1.45;color:var(--text-2);}
.bjc ul b{color:var(--text);}
.bjc-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.bjc-nums div{padding:8px 10px;border-radius:13px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);display:flex;flex-direction:column;gap:2px;}
.bjc-nums b{font-size:1.15rem;font-weight:900;font-variant-numeric:tabular-nums;}
.bjc-nums small{font-size:.78rem;font-weight:600;color:var(--text-2);}
.bjc-nums i{font-style:normal;font-size:.74rem;color:var(--text-3);}
.bjc-mix{display:flex;flex-direction:column;gap:6px;}
.bjc-mix .row{display:grid;grid-template-columns:96px 1fr 52px;gap:8px;align-items:center;font-size:.82rem;font-weight:800;}
.bjc-mix .trk{position:relative;height:10px;border-radius:999px;background:var(--w08);}
.bjc-mix .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;}
.bjc-mix .trk u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55;}
.bjc-mix .row span:last-child{text-align:right;font-variant-numeric:tabular-nums;}
.bjc-key{font-size:.74rem;color:var(--text-3);}
.bjc p.plain{margin:0;font-size:.92rem;line-height:1.45;color:var(--text-2);}
/* dealer hand */
.dealer{position:absolute;top:calc(var(--u)*42);left:50%;transform:translateX(-50%);display:flex;align-items:center;z-index:3;--cw:var(--dcw);min-height:calc(var(--dcw) * 1.4);}
.dealer .cd{position:relative;}
.dealer .cd + .cd{margin-left:calc(var(--dcw) * -.5);}
.dealer .cd.slot + .cd.slot{margin-left:calc(var(--u)*8);}
.dealer .cd.slot .pcard{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);}
.dealer .cd.slot .pcard > *{display:none;}
.tot{display:inline-grid;place-items:center;min-width:calc(var(--u)*30);height:calc(var(--u)*24);padding:0 calc(var(--u)*7);border-radius:999px;
  background:rgba(0,0,0,.6);color:#fff;font-weight:900;font-size:calc(var(--u)*13.5);font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.tot.bust{background:#c8102e;}
.tot.bj{background:var(--yellow);color:#2b1a00;}
.tot.t21{background:#13853f;}
.dealer .tot{margin-left:calc(var(--u)*8);}
/* seats */
.bjfelt .seat{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*7);z-index:4;}
.hands{display:flex;align-items:flex-end;}
.hand{position:relative;display:flex;flex-direction:column;align-items:center;width:var(--hw);gap:calc(var(--u)*6);}
.cards{position:relative;width:var(--hw);}
.cards .cd{position:absolute;}
.hand .tot{position:absolute;z-index:6;top:calc(var(--u)*-12);}
.hand.cur .pcard{box-shadow:0 0 0 2px var(--lit),0 6px 14px rgba(0,0,0,.35);}
.hand.over .pcard{filter:brightness(.62) saturate(.7);}
.res{position:absolute;left:50%;bottom:calc(var(--sp) + var(--u)*2);transform:translateX(-50%);z-index:7;padding:2px 8px;border-radius:999px;
  font-size:calc(var(--u)*10.5);font-weight:800;white-space:nowrap;color:#fff;background:#c8102e;box-shadow:0 2px 8px rgba(0,0,0,.4);animation:pop .35s var(--spring);}
.res.win{background:#13853f;}
.res.bj,.res.even{background:var(--yellow);color:#2b1a00;}
.res.push{background:#5d6170;}
.res.surr{background:#6d5a3a;}
.spot{position:relative;width:var(--sp);height:var(--sp);border-radius:50%;display:grid;place-items:center;flex:none;border:0;padding:0;background:none;color:#fff;
  box-shadow:inset 0 0 0 calc(var(--u)*1.6) rgba(255,255,255,.55);transition:box-shadow .2s;}
.spot.extra{box-shadow:none;outline:calc(var(--u)*1.4) dashed rgba(255,255,255,.35);outline-offset:calc(var(--u)*-1.4);}
.spot.sel{box-shadow:inset 0 0 0 calc(var(--u)*2.2) var(--yellow),0 0 0 3px rgba(255,200,61,.25),0 0 18px rgba(255,200,61,.45);}
.spot.tap{cursor:pointer;}
.spot .amt{position:absolute;bottom:calc(var(--u)*-8);left:50%;transform:translateX(-50%);z-index:5;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.92);color:#1d1b2e;
  font-size:calc(var(--u)*10.5);font-weight:900;line-height:1.5;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.35);}
.spot .amt.up{background:#3ddc84;color:#03290f;}
.spot .amt.down{background:#ff8a8a;color:#3a0008;}
.spot .ins{position:absolute;top:calc(var(--u)*-16);left:calc(var(--u)*-14);font-size:calc(var(--u)*8);font-weight:900;color:var(--yellow);}
.spot .empty{font-size:calc(var(--u)*9);font-weight:800;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.1;}
.stk{position:relative;width:var(--ck);height:var(--ck);}
.stk .ck{position:absolute;left:0;top:0;transform:translateY(calc(var(--i) * var(--u) * -2.6));}
.stk.dbl{position:absolute;left:58%;top:22%;}
.stk.pay{position:absolute;left:-30%;top:-22%;}
.stk.insk{position:absolute;left:-66%;top:4%;--ck:calc(var(--sp) * .42);}
.tag{display:flex;align-items:center;gap:5px;max-width:var(--tw);padding:3px 9px 3px 3px;border-radius:999px;background:var(--plate-bg);color:#fff;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--plate-line),0 2px 8px rgba(0,0,0,.25);transition:box-shadow .2s, transform .3s var(--spring);}
.tag .avatar{width:calc(var(--u)*24);height:calc(var(--u)*24);font-size:calc(var(--u)*11);}
.tag .nm{display:flex;flex-direction:column;min-width:0;line-height:1.1;}
.tag .nm b{font-size:calc(var(--u)*11.5);font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tag .nm small{font-size:calc(var(--u)*10);font-weight:800;color:#bfe9cf;font-variant-numeric:tabular-nums;white-space:nowrap;}
/* a seat playing from a linked player's own bankroll: a link badge on the avatar and a blue-tinted amount */
.tag .av{position:relative;display:inline-flex;flex:none;}
.tag .lk{position:absolute;right:calc(var(--u)*-4);bottom:calc(var(--u)*-3);display:grid;place-items:center;width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:50%;background:#5b8cff;color:#fff;box-shadow:0 0 0 1.5px rgba(10,20,15,.9);}
.tag .lk .ico{width:72%;height:72%;stroke-width:3;}
.tag.own .nm small{color:#b9cdff;}
/* a frequent player's own bankroll on this account: the same, with a person badge */
.tag .lk.pl,.st .lkb.pl{background:#8b6cf0;}
.tag.own.pl .nm small{color:#d6caff;}
.tag .nm small.in{animation:bjIn .9s ease-out;}
@keyframes bjIn{0%{transform:scale(1.35);color:#ffd54a;}100%{transform:none;}}
.tight .tag{gap:3px;padding:2px 7px 2px 2px;}
.tight .tag .avatar{width:calc(var(--u)*18);height:calc(var(--u)*18);font-size:calc(var(--u)*9);}
.tight .tag .nm b{font-size:calc(var(--u)*11);letter-spacing:-.01em;}
.bjfelt .seat.turn .tag{box-shadow:0 0 0 2px var(--lit),0 0 18px var(--litg);transform:scale(1.05);}
.bjfelt .seat .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;padding:4px 10px;border-radius:12px;background:#fff;color:#1d1b2e;
  font-weight:900;font-size:.8rem;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.3);animation:pop .35s var(--spring);z-index:9;}
.bjmsg{position:absolute;left:50%;top:calc(var(--u)*150);transform:translateX(-50%);z-index:8;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;
  font-weight:900;font-size:calc(var(--u)*13);white-space:nowrap;animation:pop .35s var(--spring);}
.cd.flip .pcard{animation:flipup .42s var(--ease);}
@keyframes flipup{0%{transform:rotateY(90deg);}100%{transform:none;}}
/* ── Chips (standard colours: 1 white, 5 red, 25 green, 100 black, 500 purple) ── */
.ck{--c:#c8102e;--e:#fff;--t:#fff;--ck:40px;position:relative;width:var(--ck);height:var(--ck);border-radius:50%;flex:none;border:0;padding:0;
  background:
    radial-gradient(circle,rgba(255,255,255,.18) 0 30%,transparent 31%),
    radial-gradient(circle,var(--c) 0 50%,rgba(255,255,255,.7) 50% 53%,var(--c) 53% 63%,transparent 64%),
    repeating-conic-gradient(var(--e) 0 13deg,var(--c) 13deg 45deg);
  box-shadow:inset 0 0 0 calc(var(--ck) * .03) rgba(0,0,0,.3),0 1px 0 rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.35);}
.ck[data-v="1"]{--c:#f1ede4;--e:#2f63c8;--t:#1d2a4a;}
.ck[data-v="5"]{--c:#c8102e;--e:#fff;}
.ck[data-v="25"]{--c:#13853f;--e:#fff;}
.ck[data-v="100"]{--c:#1b1b1f;--e:#f1ede4;}
.ck[data-v="500"]{--c:#6b2fa3;--e:#f4cf5d;}
.ck b{position:absolute;inset:0;display:grid;place-items:center;font:900 calc(var(--ck) * .32)/1 var(--font);color:var(--t);letter-spacing:-.03em;}
/* ── Controls under the table ─────────────────────────────────────────── */
.ctrl{display:flex;flex-direction:column;gap:10px;margin:12px auto 0;min-height:178px;max-width:480px;}
.st{display:flex;align-items:center;gap:10px;min-height:32px;font-weight:800;}
.st .grow{display:flex;align-items:center;gap:8px;min-width:0;}
.st .grow span{line-height:1.2;}   /* (wraps on a narrow phone rather than cut off with "…") */
.st .avatar{width:28px;height:28px;font-size:.8rem;}
.st .bank{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.st .bank.grow{min-width:0;overflow:hidden;}
.st .lkb{display:inline-grid;place-items:center;width:16px;height:16px;margin-right:4px;border-radius:50%;background:#5b8cff;color:#fff;vertical-align:-3px;}
.st .lkb .ico{width:11px;height:11px;stroke-width:3;}
.st .bank b{color:var(--text);}
.st .big{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--lit);font-variant-numeric:tabular-nums;}
.rack{padding:6px;border-radius:18px;}
.acts{display:grid;gap:8px;grid-template-columns:repeat(var(--n,2),1fr);}
.acts .btn{min-height:54px;padding:0 8px;font-size:1.05rem;}
.acts .btn.sm{min-height:46px;font-size:.95rem;}
.acts .btn.wide{grid-column:span 2;}
.acts .btn.hinted{animation:hintp 1s ease-in-out 3;}
@keyframes hintp{50%{box-shadow:0 0 0 4px var(--yellow),0 0 22px rgba(255,200,61,.8);}}
.acts .hintb{--b:var(--gl-2);color:var(--lit-ink);}
.wait{display:flex;align-items:center;justify-content:center;min-height:110px;color:var(--text-2);font-weight:800;text-align:center;}
.linkb{background:none;border:0;color:var(--text-3);font-weight:800;font-size:.9rem;padding:8px;align-self:center;display:flex;align-items:center;gap:6px;}
.linkb .ico{width:16px;height:16px;}
.nets{display:flex;flex-wrap:wrap;gap:6px;}
.nets span{padding:3px 10px;border-radius:999px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);font-weight:800;font-size:.88rem;white-space:nowrap;}
.nets .up{color:var(--green);} .nets .down{color:#ff8a8a;}
.sess{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.sess th,.sess td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--gl-line);}
.sess th:first-child,.sess td:first-child{text-align:left;}
.sess td.up{color:var(--green);font-weight:900;} .sess td.down{color:#ff8a8a;font-weight:900;}
/* ── iPad / tablet ── */
@media (min-width:700px) and (orientation:portrait){ .ctrl{max-width:560px;} }
/* iPad upright: the table as tall as the screen allows over bigger controls */
.sh-tall .stage > .bjwrap{max-width:min(100%,calc((100dvh - 300px) * .7234 + 18px));}
@media (min-width:700px){ .sh-tall .stage > .bjwrap{max-width:min(100%,calc((100dvh - 394px) * .7234 + 18px));} .sh-tall .stage > .ctrl{gap:12px;min-height:272px;justify-content:center;} .sh-tall .acts .btn{min-height:62px;font-size:1.15rem;} .sh-tall .acts .btn.sm{min-height:52px;} .sh-tall .st{font-size:1.08rem;} }
/* Sideways (an iPad, a laptop, a phone on its side): the table at the left, the chips and buttons beside it at the right */
.sh-wide .stage:has(> .bjwrap),.sh-side .stage:has(> .bjwrap){max-width:1180px;display:flex;align-items:center;justify-content:center;gap:clamp(20px,3vw,40px);min-height:calc(100dvh - 70px);padding-top:0;padding-bottom:8px;}

<script>
(function () {

  var dom = {};

  Kit.init({
    id: 'blackjack', mark: false,
    theme: { back: ['#8f1d2c', '#c43a4c'] },
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } if (S && S.rounds.length && LIVE.indexOf(S.phase) < 0) recordSession(); clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: 'This session', onClick: function () { if (S) showSession(); else Kit.toast('No session yet'); } },
      { icon: 'coins', label: 'Cash out and leave the table', onClick: function () { endSession(); } },
      { icon: 'history', label: 'Past sessions', onClick: function () { Kit.history(KEY, { title: 'Blackjack: past sessions', extra: oldEntry }); } }
    ]),
    rules:
      '<p class="goal">Beat the dealer: finish closer to 21 than the dealer without going over.</p>' +
      '<h3>Card values</h3><ul><li>2 to 10 count their number. J, Q and K count 10.</li>' +
      '<li>An Ace counts 1 or 11, whichever helps you. A hand where the Ace counts 11 is called <b>soft</b> (shown like 7/17).</li></ul>' +
      '<h3>Playing a hand</h3><ol><li>Drag chips from the rack into your betting circle to build your bet (or tap a chip to add it), then <b>Deal</b>. Let go anywhere else and the chip goes back to the rack. You get two cards face up. The dealer gets one up and one face down.</li>' +
      '<li>On your turn choose: <b>Hit</b> (take a card), <b>Stand</b> (stop), <b>Double</b> (double your bet and take exactly one more card), ' +
      '<b>Split</b> (two cards of the same value become two hands, each with its own bet), or <b>Surrender</b> if it is turned on (give up and get half your bet back; first move only).</li>' +
      '<li>Go over 21 and you <b>bust</b>: you lose right away, even if the dealer busts later.</li>' +
      '<li>Then the dealer turns over the hidden card and must hit until reaching 17 or more. The table says whether the dealer stands or hits on a soft 17.</li></ol>' +
      '<h3>Payouts</h3><ul><li><b>Blackjack</b> (an Ace and a 10-value card as your first two cards) pays <b>3 to 2</b>: bet $10, win $15.</li>' +
      '<li>Beat the dealer: paid 1 to 1. Same total: <b>push</b>, you keep your bet.</li>' +
      '<li><b>Insurance</b>: when the dealer shows an Ace you may bet half your bet that the dealer has blackjack. It pays 2 to 1. ' +
      'If you have blackjack yourself you can take <b>even money</b> instead: a sure 1 to 1 win right now.</li></ul>' +
      '<h3>Table rules</h3><ul><li>Cards come from a shoe of 6 decks (you can pick 1, 2, 6 or 8). When the yellow cut card comes out, the shoe is shuffled after that hand.</li>' +
      '<li>With an Ace or 10 showing, the dealer peeks for blackjack. If the dealer has it, you only lose your first bet.</li>' +
      '<li>Double on any first two cards, also after a split.</li>' +
      '<li>Split up to 3 times (4 hands). Split Aces get one card each and can\'t be split again. 21 after a split counts as 21, not blackjack.</li>' +
      '<li>Bets from $1 to $1,000. Odd blackjack payouts are rounded down to the dollar.</li></ul>' +
      '<h3>Whose money</h3><p>Pick <b>Money</b> in setup when several people play on this device.</p><ul>' +
      '<li><b>Bankrolls</b>: you play from the casino bank shared by all the casino games. A player linked to their own profile brings their own bankroll (the amount their app last shared), and what they win or lose goes back to it when the session is saved. If they tap <b>Not me</b>, it doesn\'t count. A frequent player has their own bankroll on this account (reset it from their seat when it runs out). Anyone else, a seat without a name, and the computer players get $1,000 in chips for the session.</li>' +
      '<li>Your bankroll is yours. Frequent players each have their own, and players linked to their own profile play from theirs. Anyone else, or a seat without a name, gets $1,000 in play money. Only the seat with your name plays from your bankroll.</li>' +
      '<li><b>Table money</b>: everyone, you too, starts with the same amount ($500 to $10,000). Nobody\'s bankroll changes. Run out and you can buy back in for the same amount.</li></ul>' +
      '<p>Turn on the hint button in setup to see what basic strategy says, with an optional card-counting coach.</p>' +
      '<h3>Online</h3><p><b>Play online</b> opens a table, and the others join from their own phones or tablets. Everyone plays their own hands against the same dealer. You all bet at the same time, then play your hands in turn, and the computer plays any seats you gave it. The host chooses the money. With <b>Bankrolls</b>, everyone buys in from their own casino bankroll, and what they win or lose at the table goes back to it when the table cashes out or they leave. With <b>Table money</b>, everyone starts with the same amount, and nobody’s bankroll changes. Anyone who runs out sits out until they buy back in for the same amount. With Bankrolls, someone whose bankroll can’t cover that can reset it to $1,000 first. <b>Cash out</b> between hands ends the session for the whole table.</p>'
  });

  // ── Money ─────────────────────────────────────────────────────────────────
  // Where each seat's money comes from (seat.src):
  //   'mine'  your casino bank (casino_bank, synced), read directly so a bank of exactly $0 isn't mistaken for "never set"
  //   'link'  a linked player's own bankroll, as they last published it (b0); what they win or lose (bk in the
  //           record) goes to their bankroll when their device files the game (sync.js)
  //   'player' a frequent player's own bankroll on this account (casino_pb_<name>, synced with the PIN; the same
  //           key casino.js uses), read and written directly like 'mine'
  //   'chips' $1,000 in session chips (computer seats, unnamed seats, and people whose bankroll isn't known)
  //   'table' Table money: everyone starts with the same amount and no bankroll changes
  // Sessions saved before seats had a src: seat 1 is 'mine', the rest 'chips'.
  var STAKES = [500, 1000, 5000, 10000];
  function rawBank() {
    try { var v = localStorage.getItem('casino_bank'); if (v == null) return Casino.balance(); var n = parseInt(v, 10); return isNaN(n) ? Casino.balance() : n; } catch (e) { return 1000; }

  // ── Dealer & settling up ──────────────────────────────────────────────────

  // The uncommon hands get a moment on the table, the rarest one when a round has several: a winning hand of five or

  function rareMoment(nets) {

      });

        S.notes.push({ w: 6, t: bx.name + ' bought back in' });
        if (S.phase === 'bet') { S.ready[seat] = false; S.bets[seat] = 0; }
        return { state: S, mv: { t: 'rebuy', s: seat } };
      } else if (m.t === 'end') {
        if (S.phase !== 'bet') return null;
        S.phase = 'over';
        return { state: S, mv: { t: 'end', s: seat } };
      } else return null;
      var mv = { t: m.t, s: seat, a: m.a || m.k || null };
      if (S.phase === 'done') { mv.settled = 1; roundOver(); }
      return { state: S, mv: mv };
    });
  }
  function netMove(m) {
    if (!NET.myTurn()) return;
    var me = NET.seat;
    NET.act(function (st) { return moveOn(st, me, m); });
  }
  function netBet() {
    var me = NET.seat; if (me < 0 || !S || S.phase !== 'bet') return;
    var a = S.bets[me] || 0;
    if (a < 1) { Kit.haptic('error'); Kit.toast('Tap a chip to place a bet'); return; }
    NET.act(function (st) { return moveOn(st, me, { t: 'bet', a: a }); });
  }
  // The table as this device shows it: your bet still being built stays as it was
  function viewOf(st) {
    var me = NET.seat, keepBet = S && S.online && S.started === st.started && S.phase === 'bet' && st.phase === 'bet' && me >= 0 && !st.ready[me] ? S.bets[me] : 0;
    var v = JSON.parse(JSON.stringify(st));
    if (v.phase === 'bet' && me >= 0) { v.sel = me; if (!v.ready[me]) v.bets[me] = Math.min(keepBet || 0, Math.min(TABLE_MAX, v.seats[me].bank)); }
    return v;
  }
  function netShow(net, info) {
    NET = net;
    var st = net.state, mv = info.mv, live = mv && !info.fresh && !info.again;
    if ((info.fresh || info.again) && winRef) { winRef.close(); winRef = null; }
    if (info.fresh || info.again) { holdDone = false; dealT.forEach(clearTimeout); dealT = []; }
    if (st.phase === 'over') { holdDone = false; S = JSON.parse(JSON.stringify(st)); markSeen(); render(); netEnd(); return; }
    if (live && mv.settled && st.prev) { holdDone = true; playDealer(st); return; }
    if (holdDone) return;   // (the last hand's results stay up until Next hand)
    var before = S;
    S = viewOf(st);
    if (info.fresh || info.again) markSeen();
    render();
    if (live && mv.t === 'act' && mv.s === net.seat && before && before.hands) {
      S.hands.forEach(function (h) { if (h.seat === net.seat && h.res === 'bust' && !before.hands.some(function (b) { return b.id === h.id && b.res === 'bust'; })) { Kit.callout('Bust!', '#ff8a8a'); Kit.sfx('bad'); Kit.haptic('error'); } });
    }
    if (live && !info.mine && net.myTurn()) Kit.haptic('light');
  }
  // The dealer's hand played out from the finished hand: the hole card turns, the dealer draws, then the payouts
  function playDealer(st) {
    dealT.forEach(clearTimeout); dealT = [];
    var p = st.prev, me = NET.seat, D = JSON.parse(JSON.stringify(st)), full = p.dealer.slice();
    D.phase = 'dealer'; D.hands = JSON.parse(JSON.stringify(p.hands)); D.cur = -1; D.round = p.round; D.msg = ''; D.insQ = -1;
    D.dealer = full.slice(0, 2); D.hole = true;
    var res = D.hands.map(function (h) { return { res: h.res, paid: h.paid }; });
    var owed = D.seats.map(function () { return 0; });   // (paid out at the end: the seats show their money as it was until then)
    D.hands.forEach(function (h) { owed[h.seat] += h.insPaid || 0; if (h.res !== 'bust' && h.res !== 'surr' && h.res !== 'bj' && h.res !== 'even') { owed[h.seat] += h.paid || 0; h.res = null; h.paid = 0; } });
    D.seats.forEach(function (x, i) { x.bank -= owed[i]; });
    S = D; render();
    var t = 700, k;
    dealT.push(setTimeout(function () { if (S !== D) return; D.hole = false; render(); }, t));
    for (k = 2; k < full.length; k++) (function (k) { t += 700; dealT.push(setTimeout(function () { if (S !== D) return; D.dealer = full.slice(0, k + 1); render(); }, t)); })(k);
    t += 800;
    dealT.push(setTimeout(function () {
      if (S !== D) return;
      D.phase = 'done'; D.msg = p.msg; D.hands.forEach(function (h, i) { h.res = res[i].res; h.paid = res[i].paid; });
      D.seats.forEach(function (x, i) { x.bank += owed[i]; });
      render();
      var nets = st.rounds[st.rounds.length - 1] || [], mine = me >= 0 ? nets[me] : null, d = tot(full).t, live = D.hands.some(function (h) { return h.res !== 'bust' && h.res !== 'surr'; });
      if (d > 21 && live) Kit.callout('Dealer busts!', '#3ddc84');
      else if (D.hands.some(function (h) { return h.seat === me && h.res === 'bj'; })) Kit.callout('Blackjack!');
      if (mine > 0) { Kit.sfx('good'); Kit.haptic('success'); } else if (mine < 0) Kit.sfx('lose');
    }, t));
  }
  function netNextHand(again) {
    if (!NET) return;
    holdDone = false; dealT.forEach(clearTimeout); dealT = [];
    var st = NET.state, me = NET.seat;
    if (st.phase === 'over') { S = JSON.parse(JSON.stringify(st)); render(); netEnd(); return; }
    var n = 0; if (S && S.hands) n = S.hands.reduce(function (a, h) { return a + h.cards.length; }, 0) + S.dealer.length;
    sweep(function () {
      S = viewOf(st); render();
      if (again && S.phase === 'bet' && me >= 0 && !S.ready[me]) {
        var b = Math.min(S.seats[me].last || 0, S.seats[me].bank, TABLE_MAX);
        if (b > 0) { S.bets[me] = b; render(); netBet(); }
      }
    });
    void n;
  }
  function netEndAsk() {
    if (!NET || NET.seat < 0) return;
    if (NET.state.phase !== 'bet') { Kit.toast('Finish this hand first'); return; }
    var me = NET.seat;
    Kit.confirm('Cash out the whole table?', { ok: 'Cash out', body: 'The session ends for everyone at the table, and it is saved to Past sessions on every device.' })
      .then(function (ok) { if (ok) NET.act(function (st) { return moveOn(st, me, { t: 'end' }); }); });
  }
  function netRecorded() {
    var key = NET.code + ':' + S.started, done = [];
    try { done = JSON.parse(localStorage.getItem(NETREC)) || []; } catch (e) {}
    if (done.indexOf(key) >= 0) return true;
    done.push(key); try { localStorage.setItem(NETREC, JSON.stringify(done.slice(-20))); } catch (e) {}
    return false;
  }
  function netEnd() {
    var res = NET.result, left = !!(res && res.left != null), me = NET.seat, nets = sessionNets();
    if (S.rounds.length && !netRecorded()) recordSession();
    var bk = me >= 0 && S.phase === 'over' && S.netMoney === 'bank' && (nets[me] - (S.seats[me].filed || 0) || S.seats[me].filed);
    if (bk) netBank(S, me);
    var rank = S.seats.map(function (x, i) { return { name: x.name, me: i === me, score: signed(nets[i]), n: nets[i], color: Kit.color(i), i: i }; }).sort(function (a, b) { return b.n - a.n; });
    var top = rank[0], tie = rank[1] && rank[1].n === top.n;
    if (winRef) winRef.close();
    winRef = Kit.win({
      title: left ? res.text : top.n > 0 && !tie ? (top.i === me ? 'You win the table!' : top.name + ' wins the table!') : 'Session over',
      sub: S.rounds.length + (S.rounds.length === 1 ? ' hand was played.' : ' hands were played.'), rank: rank,
      lose: me >= 0 && nets[me] < 0, icon: me >= 0 && nets[me] >= 0 ? 'trophy' : 'meh',
      notes: bk ? ['You have ' + money(+localStorage.getItem('casino_bank') || 0) + ' in your bankroll now.'] : undefined, notesTitle: bk ? 'Bankroll' : undefined,
      againLabel: left ? 'Back to the lobby' : 'New session',
      again: function () { winRef = null; if (left) { TurnNet.leave(); TurnNet.open(); } else NET.again(); },
      look: true
    });
  }
  // Bankrolls (the host's choice): this device's seat takes its result for the session to its own casino bankroll, once
  function netBank(st, me) { return st.netMoney === 'bank' && st.seats[me] && CasinoNet.settle({ money: 'bank', seats: st.seats, started: st.started }, me, NET.code, st.seats[me].st.net - (st.seats[me].filed || 0), 'blackjack'); }
  // out of chips: the offer to buy back in (or, with Bankrolls and an empty bankroll, to reset it first), once when it
  // happens and from the Buy back in button after
  var bjOffered = {};
  function netOffer() {
    if (!NET || NET.seat < 0) return; var st = NET.state, me = NET.seat, x = st.seats[me]; if (!x || !x.bust) return;
    CasinoNet.offerFor({ stake: st.stake, money: st.netMoney === 'bank' ? 'bank' : 'table', owed: x.st.net - (x.filed || 0), game: 'blackjack', name: 'Blackjack online', table: Kit.poss(st.seats[0].name) + ' table',
      gid: 'tbl:blackjack:' + NET.code + ':' + st.started + ':' + me + ':b' + (x.rebuys || 0), buy: function (filed) { NET.act(function (t) { return moveOn(t, me, { t: 'rebuy', filed: filed }); }); } });
  }
  function netLeave() {
    if (NET && NET.state && NET.seat >= 0) netBank(NET.state, NET.seat);   // (whoever leaves takes their result as it stands; the computer plays on in their seat)
    NET = null; holdDone = false; dealT.forEach(clearTimeout); dealT = []; token++;
    if (winRef) { winRef.close(); winRef = null; }
    var sv = null; try { sv = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv && sv.v === 1 && sv.seats && sv.shoe && !sv.online) { S = sv; markSeen(); render(); resumeFlow(); } else showSetup();
  }
  TurnNet.setup({
    game: 'blackjack', title: 'Blackjack', min: 2, max: 4,
    seats: function (n, o) { return Math.min(4, n + Math.max(0, +(o && o.bots) || 0)); },
    opts: netOpts, start: netStart,
    free: function (st, s) { return !!(st && st.phase !== 'over' && st.seats[s] && st.seats[s].bust); },
    turn: function (st) {
      if (st.phase === 'bet') { var out = []; st.ready.forEach(function (r, i) { if (!r) out.push(i); }); return out; }
      if (st.phase === 'ins' && st.insQ >= 0) return [st.hands[st.insQ].seat];
      if (st.phase === 'play' && st.cur >= 0) return [st.hands[st.cur].seat];
      return [];
    },
    over: function (st) {
      if (st.phase !== 'over') return null;
      var nets = st.seats.map(function (x) { return x.st.net; }), hi = Math.max.apply(null, nets), win = [];
      nets.forEach(function (n, i) { if (n === hi) win.push(i); });
      return { win: win, text: 'Cashed out after ' + st.rounds.length + (st.rounds.length === 1 ? ' hand' : ' hands') };
    },
    // someone who leaves: the computer takes their seat and plays on from where they were
    resign: function (st, seat) {
      return pure(st, function () {
        S.seats[seat].cpu = true;
        if (S.phase === 'bet' && !S.ready[seat]) { S.bets[seat] = cpuBet(seat); S.ready[seat] = true; if (S.ready.every(Boolean)) deal(); }
        else if (S.phase === 'ins' && S.insQ >= 0 && S.hands[S.insQ].seat === seat) insAnswer('no');
        else if (S.phase === 'play' && curHand() && curHand().seat === seat) cpuAct();
        if (S.phase === 'done') roundOver();
        return { state: S, bot: true };
      });
    },
    leaveNote: function (st) { return st && st.netMoney === 'bank' ? 'The computer takes your seat and the others play on. What you have won or lost so far goes to your bankroll.' : null; },
    show: netShow, leave: netLeave
  });

  // Test hook (the demo, games/demos/blackjack.js): start a session at once, and put cards on top of the shoe in the order
  // they will be drawn ('As', '10h'; the deal goes your card, the dealer's up card, your card, the hole card)
  var stackN = 0;
  window.__bj = {
    state: function () { return S; },
    start: function (players, o) { startSession(players, players.length > 1 ? 'cpu' : 'solo', o || {}); },
    stack: function (codes) {
      codes.slice().reverse().forEach(function (k) { S.shoe.push({ r: k.slice(0, -1), s: k.slice(-1), id: 'dm' + (stackN++) }); });
      if (S.shoe.length <= S.cutLeft) S.cutLeft = 0;
    }
  };

  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.v === 1 && saved.seats && saved.shoe) {
    S = saved; if (migrateSeats()) save(); Kit.gameStart(); markSeen(); render(); resumeFlow();
  } else showSetup();
})();
</script>

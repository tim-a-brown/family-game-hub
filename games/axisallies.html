<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Axis &amp; Allies</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
/* ── Power colors (board-game muted, readable with white or dark ink) ─────── */
:root{
  --su:#9c3b32; --de:#5a5f5c; --uk:#b98e52; --jp:#e0a43a; --us:#5d7a3a; --nt:#cdbb8f;
  --sea-a:#2b6189; --sea-b:#1d4a6c; --sea-line:rgba(170,215,245,.35);
  --aa-panel-h:clamp(200px,38dvh,340px);
}
/* While playing, the page itself never scrolls: the map pans inside its box */
html.aa-play,html.aa-play body{height:100%;overflow:hidden;}
html.aa-play body{display:flex;flex-direction:column;height:100vh;height:100dvh;}
html.aa-play #app{flex:1;min-height:0;max-width:none;width:100%;margin:0;padding:0 0 calc(var(--safe-b)) 0;display:flex;flex-direction:column;}
html.aa-play .gbar{padding-top:calc(var(--safe-t) + 4px);padding-bottom:4px;}

/* Phase bar: whose turn, which phase, how much money. Small banners laid over the top of the map, so the map
   and the panel both get the full height */
.aa-top{position:absolute;left:12px;top:12px;right:62px;z-index:3;display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;pointer-events:none;}
.aa-top > *{pointer-events:auto;}
.aa-ban,.aa-steps{background:rgba(12,16,28,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.08);color:#fff;}
.aa-ban{display:flex;align-items:center;gap:7px;padding:4px 5px 4px 4px;min-width:0;max-width:100%;}
.aa-ban .rnd{width:28px;height:28px;flex:none;}
.aa-ban .who{min-width:0;display:flex;flex-direction:column;line-height:1.1;}
.aa-ban .who b{font-family:var(--display);font-weight:400;font-size:1rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.aa-ban .who small{font-size:.66rem;font-weight:800;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.aa-ban .who small .ico{width:12px;height:12px;vertical-align:-2px;}
.aa-ban .who small{display:flex;gap:8px;}
.aa-ban .who small .rd{opacity:.8;}
.aa-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:900;font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none;}
.aa-pill.ipc{background:linear-gradient(180deg,#f3d27a,#d8a93e);color:#3a2a05;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);}
.aa-pill.ipc i{font-style:normal;font-size:.62rem;font-weight:900;opacity:.75;}
/* The six steps of a turn (standard rule names): the current one by name, the rest by number (all named when
   there's room). Tap one for "what do I do now" */
.aa-steps{display:flex;gap:2px;padding:3px;min-width:0;}
.aa-steps button{flex:none;min-width:24px;height:28px;border:0;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;font-family:inherit;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:rgba(255,255,255,.55);background:transparent;white-space:nowrap;}
.aa-steps button i{font-style:normal;font-size:.68rem;}
.aa-steps button:not(.on) span{display:none;}
.aa-steps button.on{background:var(--pc,var(--accent));color:var(--pci,#fff);box-shadow:0 0 0 1.5px rgba(255,255,255,.35);padding:0 9px;}
.aa-steps button.on i{opacity:.8;}
.aa-steps button.done{color:rgba(255,255,255,.8);}
.aa-steps button.done i{display:none;}
.aa-steps button.done::before{content:'';width:5px;height:9px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:.75;flex:none;}
@media (min-width:1300px){ .aa-steps button:not(.on) span{display:inline;} .aa-steps button:not(.on) i{opacity:.55;} }
@media (max-height:500px){
  .aa-ph{padding:6px 10px 2px;} .aa-ph .icon-btn{width:32px;height:32px;} .aa-body{padding:2px 10px 10px;} .shop-top{margin:0 -10px 4px;padding:0 10px 4px;}
  .tray{margin-top:4px;padding:4px;} .btile{padding:7px 2px 5px;} .btile .pic{width:57px;height:40px;} .btile .pic svg{width:50px;height:33px;}
  .btile .qty{top:26px;} .aa-foot{padding:4px 10px 8px;} .aa-foot .btn{min-height:44px;}
}
@media (max-height:500px){ .aa-top{left:8px;top:8px;right:54px;gap:4px;} .aa-ban .rnd{width:24px;height:24px;} .aa-ban .who b{font-size:.9rem;} .aa-steps button{height:24px;} }

.aa-main{flex:1;min-height:0;display:flex;flex-direction:column;}
/* The map sits in a wooden frame like a board on the table */
.aa-mapwrap{flex:1;min-height:0;position:relative;margin:0 calc(6px + var(--corner-x)) 6px;border-radius:14px;padding:5px;}
.aa-map{position:absolute;inset:5px;border-radius:9px;overflow:hidden;touch-action:none;cursor:grab;
  background:#1d4a6c;box-shadow:inset 0 2px 10px rgba(0,0,0,.55);}
.aa-map.drag{cursor:grabbing;}
.aa-map svg{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block;}
.aa-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3;}
.aa-zoom button{width:38px;height:38px;border-radius:11px;border:0;background:rgba(15,22,34,.72);color:#fff;display:grid;place-items:center;font-size:1.35rem;font-weight:900;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.aa-zoom button .ico{width:18px;height:18px;}
.aa-hint{position:absolute;left:10px;bottom:10px;right:56px;z-index:3;pointer-events:none;display:flex;}
.aa-hint span{background:rgba(12,18,30,.78);color:#fff;font-size:.8rem;font-weight:800;padding:6px 10px;border-radius:10px;max-width:100%;}
.aa-hint span:empty{display:none;}

/* Map drawing */
.t-sea{fill:#2d6790;stroke:var(--sea-line);stroke-width:1;vector-effect:non-scaling-stroke;}
.t-land{stroke:#1d1a14;stroke-width:1.1;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
.t-land.imp{fill:url(#neutralHatch);}
.t-hl{fill:none;stroke-width:3.2;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round;}
.t-hl.sel{stroke:#fff;filter:drop-shadow(0 0 3px rgba(0,0,0,.8));}
.t-hl.sel.from{stroke-width:4;fill:rgba(255,255,255,.22);animation:fromGlow 1.6s ease-in-out infinite;}
@keyframes fromGlow{50%{fill:rgba(255,255,255,.08);}}
.t-dim{fill:#08070a;fill-opacity:.62;fill-rule:evenodd;pointer-events:none;}
.t-hl.go{stroke:#ffe066;stroke-dasharray:6 4;animation:march 1s linear infinite;}
.t-hl.atk{stroke:#ff5a4a;stroke-dasharray:6 4;animation:march 1s linear infinite;}
.t-hl.take{stroke:#ffd34d;stroke-width:3.6;stroke-dasharray:2 5;stroke-linecap:round;fill:rgba(255,211,77,.16);animation:march 1s linear infinite,takeGlow 1.4s ease-in-out infinite;}
@keyframes takeGlow{50%{fill:rgba(255,211,77,.3);}}
.t-hl.bat{stroke:#ff5a4a;}
/* Places that can act in this step pulse before anything is tapped */
.t-hl.can{stroke:#fff;animation:canPulse 1.7s ease-in-out infinite;}
.t-hl.can.gold{stroke:#ffe066;}
@keyframes march{to{stroke-dashoffset:-20;}}
@keyframes canPulse{0%,100%{stroke-opacity:.3;stroke-width:2;}50%{stroke-opacity:1;stroke-width:4.2;}}
.lbl{pointer-events:none;}
.lbl text{font-family:var(--font);font-weight:800;paint-order:stroke;stroke-linejoin:round;}
.lbl .nm{font-size:8.5px;fill:#fff;stroke:rgba(0,0,0,.7);stroke-width:2.4px;letter-spacing:.02em;}
.lbl .sz{font-size:8px;fill:rgba(225,240,255,.8);stroke:rgba(10,30,50,.6);stroke-width:2px;}
.lbl .ipcb{fill:#f4dd96;stroke:#5a4210;stroke-width:.8;}
.lbl .ipct{font-size:7.5px;fill:#3a2a05;stroke:none;font-weight:900;}
.lbl .city{font-size:7px;fill:#ffe9a8;stroke:rgba(0,0,0,.75);stroke-width:2.2px;}
.map-lo .lbl .nm,.map-lo .lbl .city,.map-lo .lbl .sz{display:none;}
.stk{pointer-events:none;}
.stk .chip rect.bg{stroke:rgba(255,255,255,.75);stroke-width:.8;}
.stk .chip.spent{opacity:.5;}
.stk .chip .hold{fill:#f4ead2;stroke:rgba(0,0,0,.25);stroke-width:.5;}
.stk .chip.spent rect.bg{stroke-dasharray:1.5 1.5;}
.stk .chip text{font-family:var(--font);font-size:8px;font-weight:900;}
.stk .more{font-size:7px;font-weight:900;fill:#fff;font-family:var(--font);}
.fx-arrow{fill:none;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none;}
.fx-trail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 5;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.85;transition:opacity .6s;}
.fx-trail.gone{opacity:0;}
.fx-tok{pointer-events:none;}
.fx-tok .in{filter:drop-shadow(0 2px 2px rgba(0,0,0,.55));}
.fx-tok rect{stroke:rgba(255,255,255,.9);stroke-width:.9;}
.fx-tok text{font-family:var(--font);font-size:8px;font-weight:900;}
.fx-tok.land .in{animation:tokLand .26s ease-out forwards;}
@keyframes tokLand{to{opacity:0;transform:scale(.6);}}
.fx-stamp{pointer-events:none;}
.fx-stamp .in{animation:capStamp 1.4s cubic-bezier(.2,.9,.3,1.25) both;transform-box:fill-box;transform-origin:center;}
.fx-stamp .gain{font-family:var(--display);font-size:11px;fill:#ffe066;stroke:#3a2a05;stroke-width:2.5px;paint-order:stroke;animation:gainUp 1.4s ease-out .25s both;}
@keyframes gainUp{0%{transform:translateY(6px);opacity:0;}25%{opacity:1;}100%{transform:translateY(-10px);opacity:0;}}
.fx-stamp .ring{fill:rgba(255,255,255,.18);stroke-width:2.2;vector-effect:non-scaling-stroke;}
@keyframes capStamp{0%{transform:scale(2.6);opacity:0;}20%{transform:scale(1);opacity:1;}70%{opacity:1;}100%{transform:scale(1.15);opacity:0;}}
.t-land{transition:fill .55s ease;}
.t-land.flip{animation:landFlip .9s ease-out;}
@keyframes landFlip{0%{filter:brightness(1.9) saturate(1.3);}100%{filter:none;}}
.plan-case{fill:none;stroke:rgba(24,16,10,.72);stroke-width:7;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none;}
.plan-arrow{fill:none;stroke:#fff1d0;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:8 6;vector-effect:non-scaling-stroke;marker-end:url(#arrowHead);pointer-events:none;animation:planMarch .9s linear infinite;}
@keyframes planMarch{to{stroke-dashoffset:-14;}}
.fx-boom{pointer-events:none;}

/* Panel: what you can do right now */
.aa-side{flex:none;height:var(--aa-panel-h);display:flex;flex-direction:column;margin:0 calc(6px + var(--corner-x)) 4px;border-radius:16px;background:var(--bg-2);box-shadow:0 -2px 0 var(--w04),0 8px 24px rgba(0,0,0,.35);overflow:hidden;}
.aa-ph{display:flex;align-items:center;gap:8px;padding:9px 12px 4px;}
.aa-ph h2{flex:1;min-width:0;font-size:1.02rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.aa-ph .icon-btn,.aa-iconbtn{width:38px;height:38px;border-radius:11px;border:0;background:var(--w07);color:var(--text);display:grid;place-items:center;flex:none;}
.aa-ph .icon-btn .ico,.aa-iconbtn .ico{width:19px;height:19px;}
.aa-ph .icon-btn:disabled{opacity:.3;}
.aa-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px 12px 12px;}
.aa-foot{display:flex;gap:8px;padding:6px 12px 10px;position:relative;z-index:1;transition:box-shadow .2s;}
.aa-side.more .aa-foot{box-shadow:0 -16px 16px -12px rgba(0,0,0,.7);}
/* What to do now: one line that follows the player's progress through the step */
.aa-now{display:flex;align-items:center;gap:8px;margin:0 12px 6px;padding:7px 10px;border-radius:12px;background:color-mix(in srgb,var(--pc,#ffc83d) 20%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pc,#ffc83d) 60%,transparent);font-size:.84rem;font-weight:800;line-height:1.2;}
.aa-now .ico{width:18px;height:18px;flex:none;}
.aa-now.calm{background:var(--w05);box-shadow:none;color:var(--text-2);}
.aa-now.flash{animation:nowFlash .5s ease-out;}
@keyframes nowFlash{0%{transform:scale(.96);filter:brightness(1.6);}100%{transform:none;filter:none;}}
/* Guided first turn: one pointer per step */
.aa-tip{display:flex;align-items:flex-start;gap:8px;margin:2px 0 8px;padding:8px 6px 8px 10px;border-radius:12px;background:#fff7e0;color:#2a2a3a;font-size:.82rem;font-weight:700;line-height:1.3;}
.aa-tip .ico{width:20px;height:20px;flex:none;color:#b8860b;margin-top:1px;}
.aa-tip span{flex:1;}
.aa-tip button{width:32px;height:32px;border:0;border-radius:8px;background:rgba(0,0,0,.06);color:#2a2a3a;display:grid;place-items:center;flex:none;margin:-4px 0;}
.aa-tip button .ico{width:16px;height:16px;color:inherit;margin:0;}
/* Unit card (tap any unit) */
.ucard{display:flex;align-items:center;gap:12px;}
.ucard .big{width:86px;height:62px;border-radius:14px;background:var(--pc,#5a5f5c);color:var(--pci,#fff);display:grid;place-items:center;flex:none;}
.ucard .big svg{width:66px;height:44px;}
.ucard .cost{font-size:1rem;}
.ucard p{color:var(--text-2);font-weight:700;font-size:.9rem;margin:2px 0 0;}
.ustats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 8px;}
.ustats div{background:var(--w06);border-radius:12px;padding:8px 4px;text-align:center;}
.ustats b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.1;}
.ustats small{display:block;font-size:.66rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);}
.ustats em{display:block;font-style:normal;font-size:.7rem;color:var(--text-2);font-weight:700;margin-top:2px;}
.urow .uic{cursor:pointer;}
.aa-foot .btn{flex:1;min-height:50px;}
.aa-foot .btn.sm{flex:0 0 auto;}
.aa-p{font-size:.86rem;color:var(--text-2);font-weight:600;margin:2px 0 8px;}
.aa-note{display:flex;gap:8px;align-items:flex-start;margin:8px 0 4px;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);font-size:.84rem;font-weight:600;color:var(--text);line-height:1.35;}
.aa-note svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--accent);}
.urow.sback{cursor:default;}
.urow.sback .btn{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.urow.sback .btn svg{width:15px;height:15px;}
.urows:has(.sback){container-type:inline-size;}
@container (max-width:280px){.urow.sback .btn span{display:none;}.urow.sback .btn{padding-inline:10px;}}
.aa-p b{color:var(--text);}
.aa-sec{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin:10px 0 5px;}

/* Territory header in the panel */
.tinfo{display:flex;align-items:center;gap:9px;margin:2px 0 6px;}
.tinfo .rnd{width:30px;height:30px;flex:none;}
.tinfo .tx{flex:1;min-width:0;line-height:1.2;}
.tinfo .tx b{display:block;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tinfo .tx small{font-size:.76rem;color:var(--text-2);font-weight:700;}
.tinfo .ttags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.tinfo .ttag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 4px;border-radius:7px;background:var(--w08,rgba(255,255,255,.08));font-size:.72rem;font-weight:800;color:var(--text-2);}
.tinfo .ttag svg{width:18px;height:12px;flex:none;}
.tinfo .ttag.vc svg{width:13px;height:13px;}
.tinfo .ipcv{font-family:var(--display);font-size:1.25rem;color:var(--yellow);}

/* Unit rows (selection, info, purchase, casualties) */
.urows{display:flex;flex-direction:column;gap:5px;}
.urow{display:flex;align-items:center;gap:8px;min-height:42px;padding:3px 6px 3px 4px;border-radius:12px;background:var(--w05);}
.urow.on{background:color-mix(in srgb,var(--pc,#ffc83d) 22%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--pc,#ffc83d) 70%,transparent);}
.urow.dim{opacity:.5;}
.urow .uic{width:42px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;}
.urow .uic svg{width:36px;height:24px;}
.urow .un{flex:1;min-width:0;line-height:1.15;}
.urow .un b{display:block;font-size:.9rem;text-wrap:balance;}
.urow .un small{display:block;font-size:.7rem;color:var(--text-3);font-weight:700;text-wrap:balance;}
.urow > .stats{flex:none;gap:4px;font-size:.74rem;color:var(--text-2);}
.urow .cnt{font-weight:900;font-size:1rem;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;}
.step{display:flex;align-items:center;gap:4px;flex:none;}
.step button{width:38px;height:38px;border-radius:10px;border:0;background:var(--w1);color:var(--text);font-size:1.25rem;font-weight:900;line-height:1;}
.step button:disabled{opacity:.25;}
.step output{min-width:2.6ch;text-align:center;font-weight:900;font-size:1.02rem;font-variant-numeric:tabular-nums;}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px;}
.qbtns .btn{min-height:38px;}
.cost{font-weight:900;color:var(--yellow);font-variant-numeric:tabular-nums;font-size:.86rem;flex:none;}

/* Shop: unit tiles (tap to buy one), stats as icons, the order so far pinned at the top */
.shop-top{position:sticky;top:-2px;z-index:2;margin:0 -12px 6px;padding:2px 12px 6px;background:var(--bg-2);}
.money{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.78rem;font-weight:800;color:var(--text-2);}
.money .aa-pill.ipc{font-size:.9rem;padding:4px 10px;}
.money .room{display:inline-flex;align-items:center;gap:4px;margin-left:auto;}
.money .room svg{width:20px;height:13px;opacity:.8;}
.money .warn{color:var(--red);flex-basis:100%;}
.tray{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px;padding:5px;border-radius:12px;background:color-mix(in srgb,var(--pc,#ffc83d) 16%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pc,#ffc83d) 50%,transparent);}
.tray .tc{position:relative;display:flex;align-items:center;gap:3px;padding:2px 6px 2px 2px;border:0;border-radius:8px;background:rgba(0,0,0,.25);color:var(--text);font:inherit;font-weight:900;font-size:.8rem;font-variant-numeric:tabular-nums;cursor:pointer;}
.tray .tc .pic{width:28px;height:19px;border-radius:5px;display:grid;place-items:center;background:var(--pc);color:var(--pci,#fff);}
.tray .tc .pic svg{width:26px;height:17px;}
.tray .tc.bump{animation:tcBump .35s ease-out;}
.tray .clr{margin-left:auto;border:0;background:var(--w1);color:var(--text);border-radius:8px;height:26px;padding:0 8px;font:inherit;font-size:.72rem;font-weight:900;}
@keyframes tcBump{0%{transform:scale(1.25);}100%{transform:none;}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;}
.btile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 3px 6px;border-radius:14px;border:0;background:var(--w05);color:var(--text);font:inherit;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;transition:transform .1s;}
.btile:active{transform:scale(.95);}
.btile.on{background:color-mix(in srgb,var(--pc,#ffc83d) 22%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--pc,#ffc83d) 75%,transparent);}
.btile.off{opacity:.38;cursor:default;}
.btile.off:active{transform:none;}
.btile .pic{width:63px;height:45px;border-radius:10px;display:grid;place-items:center;background:var(--pc);color:var(--pci,#fff);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
.btile .pic svg{width:54px;height:36px;}
.btile .nm{max-width:100%;font-size:.74rem;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btile .nt{font-size:.6rem;font-weight:800;color:var(--text-3);line-height:1.1;}
.btile .cost{position:absolute;top:4px;right:5px;font-size:.74rem;padding:0 5px;border-radius:6px;background:rgba(0,0,0,.35);}

.odds{display:flex;flex-direction:column;align-items:flex-end;line-height:1;flex:none;font-variant-numeric:tabular-nums;}

.odds.m b{color:var(--yellow);}

.oddsbar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc84,#8ff0b9);border-radius:5px;}

/* Turn banner */
.aa-banner{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(8,6,20,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .25s;padding:20px;}

/* the round's turn order on the turn card: whose go it is now, which powers are the same player's */
.aa-order{display:flex;align-items:center;justify-content:center;gap:4px;margin:2px 0 10px;}
.aa-order .op{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:#5a5a6a;opacity:.45;}

.aa-order .op.now .rnd{width:36px;height:36px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));}
.aa-order .ar{color:#8a8a9a;font-weight:900;font-size:.8rem;margin-top:-12px;}
/* (plain paper: the kit's ruled lines are for score sheets, and here would run through the rows) */
.aa-banner .card.paper{background:radial-gradient(120% 90% at 30% 0%,#fffdf5 0%,#f8f0dc 60%,#efe4c8 100%);}
.aa-banner .card{width:min(360px,100%);border-radius:22px;padding:22px 20px 18px;text-align:center;color:#2a2a3a;}
.aa-banner .rnd{width:74px;height:74px;margin:0 auto 10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));}
.aa-banner h2{font-family:var(--display);font-weight:400;font-size:1.9rem;color:var(--pc);text-shadow:0 1px 0 rgba(255,255,255,.6);}
.aa-banner.show .card > .rnd{animation:bnStamp .7s cubic-bezier(.2,1.5,.4,1) .08s both;}
.aa-banner.show .card > h2{animation:rise .5s var(--ease) .2s both;}
.aa-banner.show .card > .aa-order .op{animation:rise .4s var(--ease) both;}
.aa-banner.show .card > .aa-order .op:nth-child(3){animation-delay:.05s;} .aa-banner.show .card > .aa-order .op:nth-child(5){animation-delay:.1s;} .aa-banner.show .card > .aa-order .op:nth-child(7){animation-delay:.15s;} .aa-banner.show .card > .aa-order .op:nth-child(9){animation-delay:.2s;}
@keyframes bnStamp{0%{transform:scale(2.4) rotate(-25deg);opacity:0;}100%{transform:none;opacity:1;}}
.aa-banner p{font-weight:800;margin:4px 0 2px;}
.aa-banner small{display:block;color:#6b604c;font-weight:700;font-size:.82rem;margin-bottom:14px;}
.aa-banner .bn-facts{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:.84rem;font-weight:800;color:#6b604c;}
.aa-banner .bn-facts b{color:#2a2a3a;font-weight:900;}

.aa-banner .step1{display:inline-flex;align-items:center;gap:6px;margin:0 auto 12px;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.07);color:#3a3326;font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em;}
/* Collect income: the last step of a turn, on its own card */

@media (max-height:520px){.aa-banner .card.wide{padding:10px 14px;} .aa-banner .card.wide > .rnd,.aa-banner .card.wide > .aa-order{display:none;} .aa-banner .card.wide h2{font-size:1.3rem;} .aa-banner .card.wide > p{margin:0 0 4px;} .aa-banner .card.wide .bn-facts{margin-bottom:6px;} .aa-banner .card.wide .step1{display:none;} .war{margin-bottom:8px;} .war-list{max-height:none;}}
.aa-banner .card.inc{max-height:calc(100dvh - 24px);display:flex;flex-direction:column;padding:14px 16px 14px;text-align:left;}

/* ── Research & development ── */
.lab{border-radius:16px;padding:12px 12px 10px;color:#fff;margin-bottom:6px;display:flex;flex-direction:column;gap:10px;}

.lab-none{font-size:.82rem;font-weight:800;color:rgba(255,255,255,.65);}
.lab-buy{display:flex;align-items:center;gap:8px;}
.lab-n{flex:1;min-width:0;line-height:1.15;}

.lab-n small{display:block;font-size:.7rem;font-weight:700;color:rgba(255,255,255,.7);}

.lab-odds{display:grid;grid-template-columns:1fr auto;align-items:end;row-gap:4px;}

.trow .tx{min-width:0;line-height:1.2;}

.btile .cost.cut{background:var(--green);color:#fff;}
.btile .cost s{opacity:.7;margin-right:3px;font-weight:700;}
.stats .up{color:var(--yellow);}

.lab-card .ih{display:flex;align-items:center;gap:10px;margin-bottom:10px;}

.rk-li .tx b{display:block;font-size:.88rem;}
.rk-li .tx small{display:block;font-size:.7rem;font-weight:700;color:var(--text-3);}
.rk-li .rk-res{font-weight:900;font-size:.82rem;color:var(--yellow);white-space:nowrap;}
.aa-inc div.nw{margin:0 -10px;padding:6px 10px;background:linear-gradient(90deg,rgba(214,160,40,.28),rgba(214,160,40,.1));border-bottom:1px solid rgba(150,105,10,.18);}
.aa-inc div.nw span{display:flex;align-items:center;gap:7px;}
.aa-inc div.nw i{flex:none;font-style:normal;font-size:.6rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--pc);border-radius:5px;padding:2px 5px 1px;}
.aa-inc div.nw b{color:#7a5200;}
.aa-inc div.nwl{border-bottom:2px solid rgba(150,105,10,.35);margin-bottom:2px;}
.aa-sum{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:10px 0 10px;font-weight:900;}
.aa-sum b{font-family:var(--display);font-weight:400;font-size:1.7rem;color:var(--pc);}
.aa-sum small{display:inline;margin:0;font-size:.8rem;}
.aa-sum .bank{text-align:right;line-height:1.15;}
.aa-sum .bank b{font-size:1.3rem;color:#2a2a3a;}

.trcs{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.trc{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 8px;padding:6px;border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,#2d6790 22%,var(--w06)),var(--w06));box-shadow:inset 0 0 0 1px color-mix(in srgb,#5aa0d0 25%,transparent);}
.trc .hull{display:flex;align-items:center;gap:8px;min-width:0;min-height:48px;padding:4px 8px 4px 4px;border:0;border-radius:10px;background:transparent;color:var(--text);font:inherit;text-align:left;}
.trc .hull:not(:disabled){cursor:pointer;}
.trc .hull.on{background:color-mix(in srgb,var(--pc) 24%,transparent);box-shadow:inset 0 0 0 2px #ffe066;}
.trc .hic{width:48px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--pc);color:var(--pci);box-shadow:0 2px 0 rgba(0,0,0,.25);}
.trc .hic svg{width:40px;height:26px;}
.trc .ht{min-width:0;line-height:1.2;}
.trc .ht b{display:block;font-size:.92rem;}
.trc .ht small{display:block;font-size:.72rem;font-weight:800;color:var(--text-2);}
.trc .tseats{display:flex;gap:5px;padding:4px;border-radius:11px;background:rgba(0,0,0,.18);}
.trc .tseat{width:44px;height:38px;border-radius:9px;display:grid;place-items:center;border:0;padding:0;font:inherit;}
.trc .tseat svg{width:32px;height:22px;}
.trc .tseat.full{background:var(--sc);color:var(--sci);box-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .15s var(--spring);}
.trc .tseat.full:not(:disabled){cursor:pointer;}
.trc .tseat.full.rides{box-shadow:0 0 0 2px #ffe066;}
.trc .tseat.full.on{box-shadow:0 0 0 3px #ffe066,0 0 14px rgba(255,224,102,.5);transform:translateY(-3px);}
.trc .tseat.empty{background:transparent;color:var(--text-3);box-shadow:inset 0 0 0 2px var(--w14);border:0;}
.trc .tseat.empty .ico{width:16px;height:16px;opacity:.7;}
.trc .tseat.empty.only svg{opacity:.45;}
.trc .trnote{grid-column:1 / 3;display:flex;align-items:flex-start;gap:6px;padding:6px 8px;border-radius:9px;background:color-mix(in srgb,var(--accent) 14%,transparent);font-size:.76rem;font-weight:700;color:var(--text-2);line-height:1.3;}
.trc .trnote.soft{background:transparent;padding:0 4px;}
.trc .trnote .ico{width:15px;height:15px;flex:none;margin-top:1px;}
.trc.board .hull{cursor:pointer;}
.trc.board.fit{box-shadow:inset 0 0 0 2px #ffe066,0 0 16px rgba(255,224,102,.25);animation:trFit 1.6s ease-in-out infinite;}
@keyframes trFit{50%{box-shadow:inset 0 0 0 2px #ffe066,0 0 22px rgba(255,224,102,.45);}}
.trc.board.fit .tseat.empty{box-shadow:inset 0 0 0 2px #ffe066;color:#ffe066;}
/* A step's slate sweeping across the map */
.aa-slate{position:absolute;left:0;right:0;top:42%;z-index:4;pointer-events:none;display:flex;justify-content:center;}
.aa-slate .band{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 60px 12px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--pc) 88%,#000) 18%,color-mix(in srgb,var(--pc) 88%,#000) 82%,transparent);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:slate 1.5s cubic-bezier(.2,.8,.2,1) both;}
.aa-slate.quick .band{animation-duration:.9s;}
.aa-slate i{font-style:normal;font-size:.72rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.85;}
.aa-slate b{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.05;letter-spacing:.01em;}
@keyframes slate{0%{transform:translateX(-60%) skewX(-12deg);opacity:0;}18%{transform:none;opacity:1;}78%{transform:none;opacity:1;}100%{transform:translateX(60%) skewX(12deg);opacity:0;}}
.fx-drop{pointer-events:none;}
.fx-drop .in{animation:dropIn .5s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:center;}
.fx-drop .ring{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;animation:dropRing .8s ease-out both;transform-box:fill-box;transform-origin:center;}
@keyframes dropIn{0%{transform:translateY(-26px) scale(2);opacity:0;}60%{opacity:1;}100%{transform:none;opacity:0;}}
@keyframes dropRing{0%{transform:scale(.4);opacity:0;}40%{opacity:1;}100%{transform:scale(2.4);opacity:0;}}
/* Panel header: the power's colour and roundel with the step's name */
.aa-ph{background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 26%,transparent),transparent 85%);border-radius:14px 14px 0 0;}
.aa-ph .rnd{width:26px;height:26px;flex:none;}
.aa-ph h2{font-family:var(--display);font-weight:400;font-size:1.22rem;letter-spacing:.01em;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.05;text-wrap:balance;}
@media (max-height:520px){.aa-ph h2{font-size:1.05rem;}}
.aa-ph h2.aa-wait{font-family:inherit;font-weight:900;font-size:1rem;}
/* Purchase: a unit flies from its tile into the order */
.buy-fly{position:fixed;z-index:400;pointer-events:none;display:grid;place-items:center;border-radius:8px;background:var(--pc);color:var(--pci);box-shadow:0 6px 16px rgba(0,0,0,.4);transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .45s;}
.buy-fly svg{width:80%;height:80%;}
/* Battle: the result stamped across the board */
.bresult{position:absolute;left:50%;top:50%;z-index:3;pointer-events:none;padding:4px 18px;border:4px solid currentColor;border-radius:10px;font-family:var(--display);font-size:2.4rem;letter-spacing:.04em;color:#ffc83d;background:rgba(0,0,0,.25);text-shadow:0 3px 0 rgba(0,0,0,.4);transform:translate(-50%,-50%) rotate(-7deg);animation:bres .55s cubic-bezier(.2,1.4,.4,1) both;white-space:nowrap;}
.bresult.bad{color:#ff7a6b;}
.bresult.even{color:#d6d9e0;}
@keyframes bres{0%{transform:translate(-50%,-50%) rotate(-7deg) scale(2.6);opacity:0;}100%{transform:translate(-50%,-50%) rotate(-7deg) scale(1);opacity:1;}}
.bds.struck .bpc:not(.gone){animation:pcHit .45s;}
@keyframes pcHit{30%{filter:brightness(2) saturate(.2);}}
/* Mobilize: factories and their room left */
.facs{display:flex;flex-wrap:wrap;gap:5px;}
.fac{display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 6px;border:0;border-radius:10px;background:var(--w06);color:var(--text);font:inherit;font-size:.8rem;font-weight:800;}
.fac svg{width:22px;height:15px;opacity:.8;}
.fac b{font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--yellow);margin-left:2px;}
.fac.full{opacity:.5;}
.fac.full b{color:var(--text-3);}
/* Bombing: two missions to choose between, the raid's steps, the factory's damage */
.missions{display:flex;flex-direction:column;gap:6px;margin:8px 0 6px;}
.mission{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:12px;background:var(--w06);color:var(--text);font:inherit;text-align:left;box-shadow:inset 0 0 0 1.5px var(--w12);}
.mission .mi{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--w1);}
.mission .mi .ico{width:19px;height:19px;}
.mission .mt{flex:1;min-width:0;line-height:1.2;}
.mission .mt b{display:block;font-size:.95rem;}
.mission .mt small{display:block;font-size:.74rem;font-weight:700;color:var(--text-2);}
.mission .mr{width:20px;height:20px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 2px var(--w2);}
.mission.on{background:color-mix(in srgb,#ff5a4a 14%,var(--w06));box-shadow:inset 0 0 0 2px #ff7a6b;}
.mission.on .mi{background:#ff5a4a;color:#fff;}
.mission.on .mr{box-shadow:inset 0 0 0 6px #ff7a6b;}
.pv-body{margin-top:4px;}
.pv-steps{list-style:none;counter-reset:st;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;}
.pv-steps li{counter-increment:st;display:grid;grid-template-columns:22px 1fr;column-gap:8px;font-size:.78rem;line-height:1.3;}
.pv-steps li::before{content:counter(st);grid-row:1 / 3;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--w1);font-weight:900;font-size:.74rem;}
.pv-steps li b{font-size:.84rem;}
.pv-steps li span{color:var(--text-2);font-weight:700;}
.fmeter{display:flex;flex-direction:column;gap:5px;margin:8px 0 2px;}
.fm-top{display:flex;align-items:center;gap:7px;}
.fm-top .fm-ic svg{width:26px;height:17px;}
.fm-top b{flex:1;min-width:0;font-size:.88rem;}
.fm-top .fm-n{flex:none;white-space:nowrap;}
.fm-top .fm-n b{font-family:var(--display);font-weight:400;font-size:1.3rem;flex:none;}
.fm-top .fm-n small{display:inline;font-size:.72rem;font-weight:800;opacity:.75;}
.fm-bar{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;}
.fm-bar i{height:10px;border-radius:2px;background:rgba(127,127,127,.28);}
.fm-bar i.old{background:#b85a3a;}
.fm-bar i.new{background:#ff7a3d;box-shadow:0 0 8px rgba(255,140,60,.8);animation:fmNew .6s var(--spring) both;}
@keyframes fmNew{0%{transform:scaleY(.2);filter:brightness(2);}100%{transform:none;}}
.fmeter > small{font-size:.74rem;font-weight:700;opacity:.8;}
.sbrb .bds{padding:6px 10px;}
.sbr-planes{display:flex;flex-wrap:wrap;gap:4px;padding:3px 0 2px;}
.sbr-step{display:grid;grid-template-columns:26px 1fr;align-items:center;column-gap:8px;row-gap:4px;padding:6px 10px;color:#fff;border-top:1px solid rgba(255,255,255,.1);opacity:.55;}
.sbr-step.live,.sbr-step.done{opacity:1;}
.sbr-step.live .sn{background:#ffc83d;color:#3a2a05;animation:pop .45s var(--spring);}
.sbr-step .sn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-family:var(--display);font-size:1rem;}
.sbr-step .st b{display:block;font-size:.88rem;}
.sbr-step .st small{display:block;font-size:.72rem;font-weight:700;opacity:.8;}
.sbr-dice{grid-column:2;display:flex;flex-wrap:wrap;gap:5px;}
.sbr-dice:empty{display:none;}
.sbr-dice .die{--ds:28px;padding:3px;pointer-events:none;}
.sbrb .bds.d{color:#fff;border-top:1px solid rgba(255,255,255,.1);}
/* The computer's turn */
.cpu-ord{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:2px 0 8px;}
.cpu-ord small{font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-right:4px;}
.cpu-ord .tc{display:flex;align-items:center;gap:3px;padding:2px 6px 2px 2px;border-radius:8px;background:rgba(0,0,0,.25);font-weight:900;font-size:.8rem;font-variant-numeric:tabular-nums;}
.cpu-ord .tc .pic{width:28px;height:19px;border-radius:5px;display:grid;place-items:center;background:var(--pc);color:var(--pci,#fff);}
.cpu-ord .tc .pic svg{width:26px;height:17px;}
.cpu-feed{display:flex;flex-direction:column;gap:4px;}
.cpu-feed .cf{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:10px;background:var(--w05);font-size:.84rem;font-weight:700;color:var(--text-2);line-height:1.3;}
.cpu-feed .cf .ico{width:18px;height:18px;flex:none;margin-top:1px;color:var(--text-3);}
.cpu-feed .cf.new{background:color-mix(in srgb,var(--pc) 22%,transparent);color:var(--text);animation:rise .4s var(--ease) both;}
.cpu-feed .cf.new .ico{color:var(--text);}

/* Battle board */
.bt{position:fixed;inset:0;z-index:320;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,6,20,.55);opacity:0;transition:opacity .2s;}
.bt.show{opacity:1;}
.bt .board{width:100%;max-width:640px;max-height:calc(100dvh - var(--safe-t) - 10px);display:flex;flex-direction:column;border-radius:22px 22px 0 0;padding:7px;padding-bottom:calc(7px + var(--safe-b));}
.bt .felt{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:16px 16px 10px 10px;overflow:hidden;}
.bt .bhead{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;color:#fff;}
.bt .bhead h2{flex:1;min-width:0;font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.3);}
.bt .bhead small{font-weight:900;font-size:.78rem;opacity:.8;white-space:nowrap;}
.bt .bscroll{flex:1;min-height:0;overflow:auto;padding:0 10px 6px;overscroll-behavior:contain;}
/* the battle strip: two rows of pieces in hit-number columns, the numbers between them */
.bdb{position:relative;margin-top:6px;border-radius:14px;background:rgba(0,0,0,.2);box-shadow:inset 0 1px 6px rgba(0,0,0,.35);overflow:hidden;}
.bds{position:relative;padding:5px 6px;}
.bds.a{background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 30%,transparent),transparent);}
.bds.d{background:linear-gradient(0deg,color-mix(in srgb,var(--pc) 30%,transparent),transparent);}
.bdh{display:flex;align-items:center;gap:6px;min-height:24px;color:#fff;font-weight:900;font-size:.86rem;}
.bdh .rnd{width:20px;height:20px;flex:none;}
.bdh .who{flex:none;}
.bdh .lost{display:flex;align-items:center;gap:3px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;}
.bdh .lost small{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-right:2px;}
.bdh .bl{display:inline-flex;align-items:center;gap:1px;padding:1px 4px 1px 2px;border-radius:6px;background:var(--pc);color:var(--pci);opacity:.45;filter:grayscale(.6);font-size:.7rem;}
.bdh .bl svg{width:18px;height:12px;}
.bdh .takes{margin-left:auto;min-width:0;padding:2px 9px;border-radius:999px;font-size:.78rem;white-space:nowrap;}
.bdh .lost + .takes{margin-left:6px;}
.bdh .takes:empty{display:none;}
.bdh .takes.on{background:#ffc83d;color:#3a2a05;animation:pop .45s var(--spring);}
.bdr{display:grid;grid-template-columns:repeat(var(--nc,4),1fr);gap:4px;}
.bdb.z .bdr{grid-template-columns:.8fr repeat(var(--nc,4),1fr);}
.bdr .cell{display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:4px;min-width:0;}
.bdr.pcs .cell{min-height:34px;padding:3px 0;}
.bdr.dice .cell{min-height:0;}
.bds.a .bdr.dice .cell{align-content:flex-end;}
.bdr.dice .die{--ds:26px;padding:3px;pointer-events:none;}
.bdr.wide{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:4px 0;}
.bdr.wide .die{--ds:30px;padding:4px;pointer-events:none;}
.bdb .die.hit{box-shadow:0 0 0 3px #ffc83d,0 0 12px rgba(255,200,61,.75),0 3px 4px rgba(0,0,0,.4);}
.bdb .die.miss{opacity:.5;filter:saturate(.3);}
.bdb .die.void{opacity:.35;filter:grayscale(1);box-shadow:none;}
.bdb.faded .bdr.dice .die{opacity:.28;box-shadow:none;}
.bdr.nums{padding:2px 6px;background:rgba(0,0,0,.28);border-block:1px solid rgba(255,255,255,.12);}
.bdr.nums .cell{justify-content:center;align-items:center;font-family:var(--display);font-size:1.35rem;line-height:1.1;color:rgba(255,255,255,.88);text-shadow:0 2px 0 rgba(0,0,0,.35);}
.bdr.nums .cell.z{opacity:.35;}
.bpc{position:relative;display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 6px 0 3px;border-radius:8px;background:var(--pc);color:var(--pci);font-weight:900;font-size:.8rem;box-shadow:0 2px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.18);transition:opacity .3s,transform .3s;}
.bpc svg{width:28px;height:19px;}
.bpc b{font-variant-numeric:tabular-nums;}
.bpc.pair{gap:0;padding-left:2px;}
.bpc.pair .pi{position:relative;display:grid;place-items:center;}
.bpc.pair .pi + .pi{margin-left:-2px;padding-left:3px;border-left:1.5px solid color-mix(in srgb,var(--pci) 35%,transparent);}
.bpc .pi.x{opacity:.45;}
.bpc .pi.x::after{content:'';position:absolute;inset:1px;background:linear-gradient(45deg,transparent 44%,#ff5a4a 44%,#ff5a4a 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#ff5a4a 44%,#ff5a4a 56%,transparent 56%);}
.bpc .lk{position:absolute;right:-5px;top:-7px;width:17px;height:17px;border-radius:50%;background:#fffaf0;color:#3a3020;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.bpc .lk svg{width:13px;height:9px;}
.bpc.hurt{box-shadow:inset 0 0 0 2px #ff6b5a,0 2px 0 rgba(0,0,0,.3);}
.bpc.gone{opacity:.5;transform:scale(.92);}
.bpc.gone::after{content:'';position:absolute;inset:3px;background:linear-gradient(45deg,transparent 45%,#ff5a4a 45%,#ff5a4a 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#ff5a4a 45%,#ff5a4a 55%,transparent 55%);border-radius:5px;}
.bstamp{position:absolute;left:50%;top:50%;z-index:2;pointer-events:none;font-family:var(--display);font-size:2rem;color:#ffc83d;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.5);animation:bstamp 1.3s cubic-bezier(.2,.9,.3,1.2) both;}
@keyframes bstamp{0%{transform:translate(-50%,-50%) scale(2.2) rotate(-8deg);opacity:0;}18%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1;}75%{opacity:1;}100%{transform:translate(-50%,-50%) scale(.96) rotate(-4deg);opacity:0;}}
.bds.struck .bdr.pcs{animation:bshake .4s;}
@keyframes bshake{0%,100%{transform:none;}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(2px);}}
.bmsg.end{font-size:1.05rem;padding-top:10px;}
@media (max-height:520px){
  .bt .bhead{padding:6px 12px 2px;}
  .bt .bhead h2{font-size:1.1rem;}
  .bodds{margin:2px 2px 0;font-size:.7rem;}
  .bodds .oddsbar{height:6px;margin-top:2px;}
  .bdb{margin-top:4px;}
  .bds{padding:3px 6px;}
  .bdh{min-height:20px;font-size:.78rem;}
  .bdh .rnd{width:17px;height:17px;}
  .bdr.pcs .cell{min-height:28px;padding:2px 0;}
  .bpc{height:24px;font-size:.74rem;}
  .bpc svg{width:24px;height:16px;}
  .bdr.dice .die{--ds:21px;padding:2px;}
  .bdr.nums .cell{font-size:1.05rem;}
  .bmsg{font-size:.8rem;padding:4px 4px 0;}
  .bacts{padding:5px 10px 7px;gap:6px;}
  .bacts .btn{min-height:42px;}
}
.bmsg{color:#fff;font-weight:800;font-size:.92rem;text-align:center;padding:8px 4px 2px;}
.bcas{margin-top:8px;border-radius:12px;background:#fffaf0;color:#2a2a3a;padding:8px 10px;box-shadow:0 0 0 3px #ffc83d,0 6px 18px rgba(0,0,0,.35);}
.bcas h4{margin:0 0 2px;font-size:1rem;font-weight:900;display:flex;align-items:center;gap:7px;}
.bcas h4 .ico{width:20px;height:20px;flex:none;color:#b8860b;}
.bcas .lead{font-size:.78rem;color:#6b604c;font-weight:700;margin:0 0 8px;line-height:1.3;}
.bcas .groups{display:flex;flex-wrap:wrap;gap:6px 18px;}
.bcas .pk{margin:0 0 4px;flex:0 1 auto;max-width:100%;}
.bcas .pk:has(.urow){flex:1 1 100%;}
.bcas .pk .pl{font-size:.74rem;font-weight:900;color:#6b604c;text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px;display:flex;justify-content:space-between;gap:12px;}
.bcas .pk .pl span + span{font-weight:800;opacity:.75;text-transform:none;letter-spacing:0;}
.bcas .pieces{display:flex;flex-wrap:wrap;gap:6px;}
.bcas .pc{position:relative;width:48px;height:42px;border:0;border-radius:10px;background:var(--pc);color:var(--pci);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .15s,opacity .15s;}
.bcas .pc svg{width:34px;height:24px;}
.bcas .pc:active{transform:scale(.92);}
.bcas .pc.x{opacity:.55;box-shadow:inset 0 0 0 3px #ff5a4a;transform:scale(.94);}
.bcas .pc.x::after{content:'';position:absolute;inset:4px;background:linear-gradient(45deg,transparent 44%,#ff5a4a 44%,#ff5a4a 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#ff5a4a 44%,#ff5a4a 56%,transparent 56%);border-radius:6px;}
.bcas .pc.hurt{box-shadow:inset 0 0 0 3px #ffb340;}
.bcas .urow{background:rgba(0,0,0,.05);}
.bcas .urow .un small{color:#6b604c;}
.bcas .step button{background:rgba(0,0,0,.08);color:#2a2a3a;}
.bcas .note{font-size:.76rem;color:#6b604c;font-weight:700;margin-top:6px;}
.bt.cas .bodds{display:none;}
.bacts .wait{flex:1;display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:.9rem;padding:6px 4px;}
.bacts .wait .rnd{width:22px;height:22px;flex:none;}
.bacts{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px 10px;}
.bacts .btn{flex:1 1 140px;min-height:50px;}
.subsw{display:flex;align-items:center;gap:8px;margin-top:8px;color:#fff;font-weight:800;font-size:.84rem;}
.subsw .seg{flex:1;}

/* Seat captions in setup */
.seat-pw{font-size:.74rem;font-weight:800;color:var(--text-3);margin:-4px 0 2px 52px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.seat-pw i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:3px;}
button.seat-pw{border:0;background:var(--w06);font:inherit;font-size:.74rem;font-weight:800;color:var(--text-2);padding:4px 10px;border-radius:999px;cursor:pointer;width:max-content;max-width:calc(100% - 52px);}
button.seat-pw .ico{width:13px;height:13px;color:var(--text-3);}
button.seat-pw:active{transform:scale(.96);}
.aa-pick button{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.aa-pick .pws{display:flex;flex-wrap:wrap;gap:4px 10px;font-weight:800;}
.aa-pick .pws i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;}
.aa-pick small{color:var(--text-3);font-weight:800;white-space:nowrap;}
.aa-pick button.on{box-shadow:inset 0 0 0 2px var(--accent);}

/* Rules */
.rules table.ut{width:100%;border-collapse:collapse;font-size:.82rem;margin:6px 0;}
.rules table.ut th,.rules table.ut td{padding:3px 4px;text-align:center;border-bottom:1px solid var(--w08);}
.rules table.ut th:first-child,.rules table.ut td:first-child{text-align:left;}
.rules .now{border-radius:14px;padding:10px 12px 4px;background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 50%,transparent);margin:0 0 14px;}
.rules .now h3{margin:0 0 4px;}
.rules .now .ph{font-size:.74rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:0 0 4px;display:flex;flex-wrap:wrap;gap:4px 14px;}
.rules .now ol{margin:4px 0 8px;}
.rules details{margin:6px 0;border-radius:12px;background:var(--w05);padding:0 12px;}
.rules details[open]{padding-bottom:8px;}
.rules summary{font-weight:900;padding:11px 0;cursor:pointer;color:var(--accent);list-style:none;display:flex;align-items:center;gap:8px;}
.rules summary::-webkit-details-marker{display:none;}
.rules summary::before{content:'';width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(-45deg);flex:none;margin-left:2px;transition:transform .15s;}
.rules details[open] summary::before{transform:rotate(45deg);}
.rules details h3{display:none;}
.rules details > ul,.rules details > ol,.rules details > p{margin-top:0;}

/* iPad portrait: roomier panel */
@media (min-width:700px) and (orientation:portrait){
  :root{--aa-panel-h:clamp(260px,33dvh,380px);}
}
/* Landscape with room: map left, panel right */
@media (orientation:landscape) and (min-width:820px){
  .aa-main{flex-direction:row-reverse;}
  .aa-mapwrap{margin:0 calc(8px + var(--corner-x)) 8px 6px;}
  .aa-side{height:auto;width:340px;margin:0 0 8px calc(8px + var(--corner-x));}
}
@media (orientation:landscape) and (max-height:500px){
  :root{--aa-panel-h:auto;}
  .aa-main{flex-direction:row-reverse;}
  .aa-side{height:auto;width:300px;margin:0 0 4px calc(6px + var(--corner-x));}
  .aa-mapwrap{margin:0 calc(6px + var(--corner-x)) 4px 6px;}
}
@media (min-width:700px){
  .bt{align-items:center;}
  .bt .board{border-radius:24px;max-height:calc(100dvh - 40px);padding-bottom:7px;}
  .bt .felt{border-radius:16px;}
  .drow .die{--ds:34px;}
}
/* Online: watching another general's turn */
.aa-wait.nudge{animation:aaNudge .4s;}
@keyframes aaNudge{20%,60%{transform:translateX(-5px);}40%,80%{transform:translateX(5px);}}
.aa-side .tn-chips{justify-content:flex-start;margin:2px 0 8px;}
.aa-mine{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 6px;font-size:.8rem;font-weight:800;color:var(--text-3);}
.aa-mine .pw{display:inline-flex;align-items:center;gap:5px;color:var(--text);}
.aa-mine .rnd{width:20px;height:20px;}
.bt .bdive{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;}
.bt .bdive p{flex-basis:100%;margin:0;text-align:center;color:#fff;font-weight:800;font-size:.86rem;}
/* a ring that spreads where something just changed hands or arrived (another general's move) */
.fx-ping{fill:none;stroke-width:3;animation:aaPing 1.1s ease-out forwards;transform-box:fill-box;transform-origin:center;}
@keyframes aaPing{from{opacity:1;transform:scale(.3);}to{opacity:0;transform:scale(1.6);}}
</style>

    if (S.phase === 'buy') { try { aiBuy(p); } catch (e) { console.warn(e); S.buy = {}; S.rep = {}; } buyLog(p); await wait(spd(500)); endBuy(); renderAll(); }
    if (S.phase === 'cm') { try { await aiCombat(p); } catch (e) { if (e === 'cancel') throw e; console.warn(e); } setPhase('bat'); renderAll(); }
    if (S.phase === 'bat') {

// Online (turnnet.js): each general on their own device, at their own pace.
// The table's state is S (compacted). Seats are people in the order they sat down, then computer generals; each
// seat commands one group of powers, shared out as on the setup screen (SPLITS). turn() is the seat that must act:
// the current power's general, or during a battle the general choosing losses ('cas') or whether defending
// submarines dive ('dive').
// A step (purchase, combat move, noncombat move, mobilize) is worked out on this device with undo (a draft,
// kept in localStorage in case the app closes) and sent as one move when it's done. Battles go step by step:
// every roll is its own move (the dice are rolled inside it), so every device watches the same dice.
// Computer generals play one step per move, worked out headless with the game's own AI.
// ═══════════════════════════════════════════════════════════════════════════

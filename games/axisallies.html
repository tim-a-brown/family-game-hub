<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axis &amp; Allies</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* ── Power colors (board-game muted, readable with white or dark ink) ─────── */
:root{
  --su:#9c3b32; --de:#5a5f5c; --uk:#b98e52; --jp:#e0a43a; --us:#5d7a3a; --nt:#cdbb8f;
  --sea-a:#2b6189; --sea-b:#1d4a6c; --sea-line:rgba(170,215,245,.35);
  --aa-panel-h:clamp(200px,38dvh,340px);
}
/* While playing, the page itself never scrolls: the map pans inside its box */
html.aa-play,html.aa-play body{height:100%;overflow:hidden;}
html.aa-play body{display:flex;flex-direction:column;height:100vh;height:100dvh;}
html.aa-play #app{flex:1;min-height:0;max-width:none;width:100%;margin:0;padding:0 0 calc(var(--safe-b)) 0;display:flex;flex-direction:column;}
html.aa-play .gbar{padding-top:calc(var(--safe-t) + 4px);padding-bottom:4px;}

/* Phase bar: whose turn, which phase, how much money */
.aa-top{display:flex;align-items:center;gap:8px;padding:4px calc(10px + var(--corner-x)) 6px;min-height:46px;}
.aa-top .rnd{width:30px;height:30px;flex:none;}
.aa-top .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;}
.aa-top .who b{font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.aa-top .who small{font-size:.74rem;font-weight:800;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.aa-top .who small .ico{width:13px;height:13px;vertical-align:-2px;}
.aa-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--w07);font-weight:900;font-size:.88rem;white-space:nowrap;font-variant-numeric:tabular-nums;}
.aa-pill.ipc{background:linear-gradient(180deg,#f3d27a,#d8a93e);color:#3a2a05;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);}
.aa-pill.ipc i{font-style:normal;font-size:.68rem;font-weight:900;opacity:.75;}
.aa-steps{display:flex;gap:3px;padding:0 calc(10px + var(--corner-x)) 6px;}
.aa-steps span{flex:1;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:var(--text-3);background:var(--w05);white-space:nowrap;overflow:hidden;}
.aa-steps span.on{background:var(--pc,var(--accent));color:var(--pci,#fff);}
.aa-steps span.done{color:var(--text-2);}

.aa-main{flex:1;min-height:0;display:flex;flex-direction:column;}
/* The map sits in a wooden frame like a board on the table */
.aa-mapwrap{flex:1;min-height:0;position:relative;margin:0 calc(6px + var(--corner-x)) 6px;border-radius:14px;padding:5px;}
.aa-map{position:absolute;inset:5px;border-radius:9px;overflow:hidden;touch-action:none;cursor:grab;
  background:#1d4a6c;box-shadow:inset 0 2px 10px rgba(0,0,0,.55);}
.aa-map.drag{cursor:grabbing;}
.aa-map svg{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block;}
.aa-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3;}
.aa-zoom button{width:38px;height:38px;border-radius:11px;border:0;background:rgba(15,22,34,.72);color:#fff;display:grid;place-items:center;font-size:1.35rem;font-weight:900;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.aa-zoom button .ico{width:18px;height:18px;}
.aa-hint{position:absolute;left:10px;bottom:10px;right:56px;z-index:3;pointer-events:none;display:flex;}
.aa-hint span{background:rgba(12,18,30,.78);color:#fff;font-size:.8rem;font-weight:800;padding:6px 10px;border-radius:10px;max-width:100%;}
.aa-hint span:empty{display:none;}

/* Map drawing */
.t-sea{fill:#2d6790;stroke:var(--sea-line);stroke-width:1;vector-effect:non-scaling-stroke;}
.t-land{stroke:#1d1a14;stroke-width:1.1;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
.t-land.imp{fill:url(#neutralHatch);}
.t-hl{fill:none;stroke-width:3.2;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round;}
.t-hl.sel{stroke:#fff;filter:drop-shadow(0 0 3px rgba(0,0,0,.8));}
.t-hl.go{stroke:#ffe066;stroke-dasharray:6 4;animation:march 1s linear infinite;}
.t-hl.atk{stroke:#ff5a4a;stroke-dasharray:6 4;animation:march 1s linear infinite;}
.t-hl.bat{stroke:#ff5a4a;}
@keyframes march{to{stroke-dashoffset:-20;}}
.lbl{pointer-events:none;}
.lbl text{font-family:var(--font);font-weight:800;paint-order:stroke;stroke-linejoin:round;}
.lbl .nm{font-size:8.5px;fill:#fff;stroke:rgba(0,0,0,.7);stroke-width:2.4px;letter-spacing:.02em;}
.lbl .sz{font-size:8px;fill:rgba(225,240,255,.8);stroke:rgba(10,30,50,.6);stroke-width:2px;}
.lbl .ipcb{fill:#f4dd96;stroke:#5a4210;stroke-width:.8;}
.lbl .ipct{font-size:7.5px;fill:#3a2a05;stroke:none;font-weight:900;}
.lbl .city{font-size:7px;fill:#ffe9a8;stroke:rgba(0,0,0,.75);stroke-width:2.2px;}
.map-lo .lbl .nm,.map-lo .lbl .city,.map-lo .lbl .sz{display:none;}
.stk{pointer-events:none;}
.stk .chip rect.bg{stroke:rgba(255,255,255,.75);stroke-width:.8;}
.stk .chip text{font-family:var(--font);font-size:8px;font-weight:900;}
.stk .more{font-size:7px;font-weight:900;fill:#fff;font-family:var(--font);}
.fx-arrow{fill:none;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none;}
.fx-boom{pointer-events:none;}

/* Panel: what you can do right now */
.aa-side{flex:none;height:var(--aa-panel-h);display:flex;flex-direction:column;margin:0 calc(6px + var(--corner-x)) 4px;border-radius:16px;background:var(--bg-2);box-shadow:0 -2px 0 var(--w04),0 8px 24px rgba(0,0,0,.35);overflow:hidden;}
.aa-ph{display:flex;align-items:center;gap:8px;padding:9px 12px 4px;}
.aa-ph h2{flex:1;min-width:0;font-size:1.02rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.aa-ph .icon-btn,.aa-iconbtn{width:38px;height:38px;border-radius:11px;border:0;background:var(--w07);color:var(--text);display:grid;place-items:center;flex:none;}
.aa-ph .icon-btn .ico,.aa-iconbtn .ico{width:19px;height:19px;}
.aa-ph .icon-btn:disabled{opacity:.3;}
.aa-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px 12px 8px;}
.aa-foot{display:flex;gap:8px;padding:6px 12px 10px;}
.aa-foot .btn{flex:1;min-height:50px;}
.aa-foot .btn.sm{flex:0 0 auto;}
.aa-p{font-size:.86rem;color:var(--text-2);font-weight:600;margin:2px 0 8px;}
.aa-p b{color:var(--text);}
.aa-sec{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin:10px 0 5px;}

/* Territory header in the panel */
.tinfo{display:flex;align-items:center;gap:9px;margin:2px 0 6px;}
.tinfo .rnd{width:30px;height:30px;flex:none;}
.tinfo .tx{flex:1;min-width:0;line-height:1.2;}
.tinfo .tx b{display:block;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tinfo .tx small{font-size:.76rem;color:var(--text-2);font-weight:700;}
.tinfo .ipcv{font-family:var(--display);font-size:1.25rem;color:#f4dd96;}

/* Unit rows (selection, info, purchase, casualties) */
.urows{display:flex;flex-direction:column;gap:5px;}
.urow{display:flex;align-items:center;gap:8px;min-height:42px;padding:3px 6px 3px 4px;border-radius:12px;background:var(--w05);}
.urow.on{background:color-mix(in srgb,var(--pc,#ffc83d) 22%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--pc,#ffc83d) 70%,transparent);}
.urow.dim{opacity:.5;}
.urow .uic{width:42px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;}
.urow .uic svg{width:36px;height:24px;}
.urow .un{flex:1;min-width:0;line-height:1.15;}
.urow .un b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.urow .un small{display:block;font-size:.7rem;color:var(--text-3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.urow .cnt{font-weight:900;font-size:1rem;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;}
.step{display:flex;align-items:center;gap:4px;flex:none;}
.step button{width:38px;height:38px;border-radius:10px;border:0;background:var(--w1);color:var(--text);font-size:1.25rem;font-weight:900;line-height:1;}
.step button:disabled{opacity:.25;}
.step output{min-width:2.6ch;text-align:center;font-weight:900;font-size:1.02rem;font-variant-numeric:tabular-nums;}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px;}
.qbtns .btn{min-height:38px;}
.cost{font-weight:900;color:#f4dd96;font-variant-numeric:tabular-nums;font-size:.86rem;flex:none;}

/* Battle list */
.blist{display:flex;flex-direction:column;gap:6px;}
.brow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--w06);border:0;color:var(--text);text-align:left;width:100%;min-height:52px;}
.brow .ico{width:22px;height:22px;flex:none;color:#ff8a7a;}
.brow .tx{flex:1;min-width:0;}
.brow .tx b{display:block;font-size:.95rem;}
.brow .tx small{font-size:.74rem;color:var(--text-2);font-weight:700;}
.brow.done{opacity:.55;}
.brow.lock{opacity:.6;}
.odds{font-weight:900;font-size:.95rem;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:8px;flex:none;}
.odds.g{background:rgba(61,220,132,.18);color:#7ff0b0;}
.odds.m{background:rgba(255,200,61,.18);color:#ffd970;}
.odds.b{background:rgba(255,77,94,.2);color:#ff9aa5;}

/* Attack preview card */
.preview{border-radius:14px;padding:10px 12px;background:rgba(255,90,74,.1);box-shadow:inset 0 0 0 2px rgba(255,90,74,.45);margin:4px 0 8px;}
.preview .row1{display:flex;align-items:center;gap:8px;}
.preview .row1 b{flex:1;font-size:1rem;}
.oddsbar{height:10px;border-radius:5px;background:rgba(255,77,94,.55);overflow:hidden;margin:8px 0 4px;}
.oddsbar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc84,#8ff0b9);border-radius:5px;}
.preview small{font-size:.76rem;color:var(--text-2);font-weight:700;}

/* Turn banner */
.aa-banner{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(8,6,20,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .25s;padding:20px;}
.aa-banner.show{opacity:1;}
.aa-banner .card{width:min(360px,100%);border-radius:22px;padding:22px 20px 18px;text-align:center;color:#2a2a3a;}
.aa-banner .rnd{width:74px;height:74px;margin:0 auto 10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));}
.aa-banner h2{font-family:var(--display);font-weight:400;font-size:1.9rem;color:var(--pc);text-shadow:0 1px 0 rgba(255,255,255,.6);}
.aa-banner p{font-weight:800;margin:4px 0 2px;}
.aa-banner small{display:block;color:#6b604c;font-weight:700;font-size:.82rem;margin-bottom:14px;}

/* Battle board */
.bt{position:fixed;inset:0;z-index:320;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,6,20,.55);opacity:0;transition:opacity .2s;}
.bt.show{opacity:1;}
.bt .board{width:100%;max-width:640px;max-height:calc(100dvh - var(--safe-t) - 10px);display:flex;flex-direction:column;border-radius:22px 22px 0 0;padding:7px;padding-bottom:calc(7px + var(--safe-b));}
.bt .felt{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:16px 16px 10px 10px;overflow:hidden;}
.bt .bhead{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;color:#fff;}
.bt .bhead h2{flex:1;min-width:0;font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.3);}
.bt .bhead small{font-weight:900;font-size:.78rem;opacity:.8;white-space:nowrap;}
.bt .bscroll{flex:1;min-height:0;overflow:auto;padding:0 10px 6px;overscroll-behavior:contain;}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.side{border-radius:12px;background:rgba(0,0,0,.2);padding:6px 6px 7px;min-width:0;}
.side h3{display:flex;align-items:center;gap:6px;font-size:.88rem;font-weight:900;color:#fff;margin:0 0 5px;}
.side h3 .rnd{width:20px;height:20px;flex:none;}
.side h3 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side .us{display:flex;flex-wrap:wrap;gap:4px;}
.bu{display:inline-flex;align-items:center;gap:3px;padding:2px 6px 2px 3px;border-radius:8px;background:var(--pc);color:var(--pci);font-weight:900;font-size:.82rem;}
.bu svg{width:26px;height:18px;}
.bu.gone{opacity:.35;text-decoration:line-through;}
.bu.hurt{box-shadow:inset 0 0 0 2px #ff6b5a;}
.bu .n{font-variant-numeric:tabular-nums;}
.bodds{margin:8px 2px 2px;color:#fff;font-size:.76rem;font-weight:800;}
.bodds .oddsbar{margin:4px 0 0;height:8px;}
.tray{margin-top:8px;border-radius:12px;background:rgba(0,0,0,.18);padding:6px 8px 8px;min-height:64px;}
.tray .vt{display:flex;align-items:center;gap:6px;color:#fff;font-weight:900;font-size:.86rem;margin:2px 0 4px;}
.tray .vt .rnd{width:18px;height:18px;}
.tray .vt em{font-style:normal;margin-left:auto;padding:2px 9px;border-radius:999px;background:var(--w14);font-size:.8rem;}
.tray .vt em.hit{background:#ffc83d;color:#3a2a05;}
.drow{display:flex;flex-direction:column;gap:3px;margin:5px 0 7px;}
.drow .dl{color:rgba(255,255,255,.85);font-size:.74rem;font-weight:800;line-height:1.15;}
.drow .dl b{font-size:.84rem;color:#fff;margin-right:5px;}
.drow .dd{flex:1;display:flex;flex-wrap:wrap;gap:5px;}
.drow .die{--ds:30px;padding:4px;pointer-events:none;}
.drow .die.hit{box-shadow:0 0 0 3px #ffc83d,0 0 12px rgba(255,200,61,.75),0 3px 4px rgba(0,0,0,.4);}
.drow .die.miss{opacity:.55;filter:saturate(.3);}
.bmsg{color:#fff;font-weight:800;font-size:.92rem;text-align:center;padding:8px 4px 2px;}
.bcas{margin-top:8px;border-radius:12px;background:#fffaf0;color:#2a2a3a;padding:8px 10px;}
.bcas h4{margin:0 0 6px;font-size:.92rem;font-weight:900;}
.bcas .urow{background:rgba(0,0,0,.05);}
.bcas .urow .un small{color:#6b604c;}
.bcas .step button{background:rgba(0,0,0,.08);color:#2a2a3a;}
.bcas .note{font-size:.76rem;color:#6b604c;font-weight:700;margin-top:6px;}
.bacts{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px 10px;}
.bacts .btn{flex:1 1 140px;min-height:50px;}
.subsw{display:flex;align-items:center;gap:8px;margin-top:8px;color:#fff;font-weight:800;font-size:.84rem;}
.subsw .seg{flex:1;}

/* Seat captions in setup */
.seat-pw{font-size:.74rem;font-weight:800;color:var(--text-3);margin:-4px 0 2px 52px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.seat-pw i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:3px;}

/* Rules */
.rules table.ut{width:100%;border-collapse:collapse;font-size:.82rem;margin:6px 0;}
.rules table.ut th,.rules table.ut td{padding:3px 4px;text-align:center;border-bottom:1px solid var(--w08);}
.rules table.ut th:first-child,.rules table.ut td:first-child{text-align:left;}

/* iPad portrait: roomier panel */
@media (min-width:700px) and (orientation:portrait){
  :root{--aa-panel-h:clamp(260px,33dvh,380px);}
  .aa-top .who b{font-size:1.3rem;}
  .aa-steps span{font-size:.7rem;height:24px;}
}
/* Landscape with room: map left, panel right */
@media (orientation:landscape) and (min-width:820px){
  .aa-main{flex-direction:row;}
  .aa-mapwrap{margin:0 6px 8px calc(8px + var(--corner-x));}
  .aa-side{height:auto;width:340px;margin:0 calc(8px + var(--corner-x)) 8px 0;}
}
@media (orientation:landscape) and (max-height:500px){
  .aa-steps{display:none;}
  .aa-top{min-height:38px;padding-bottom:2px;}
  :root{--aa-panel-h:auto;}
  .aa-main{flex-direction:row;}
  .aa-side{height:auto;width:300px;margin:0 calc(6px + var(--corner-x)) 4px 0;}
  .aa-mapwrap{margin:0 6px 4px calc(6px + var(--corner-x));}
}
@media (min-width:700px){
  .bt{align-items:center;}
  .bt .board{border-radius:24px;max-height:calc(100dvh - 40px);padding-bottom:7px;}
  .bt .felt{border-radius:16px;}
  .drow .die{--ds:34px;}
}
</style>
</head>

var cpuRunning = false;
async function runCpu() {

  cpuRunning = true;
  var p = cur(), myTok = tok;
  try {
    renderAll();
    if (S.B) await runBattle();
    if (S.phase === 'buy') { try { aiBuy(p); } catch (e) { console.warn(e); S.buy = {}; S.rep = {}; } await wait(spd(500)); endBuy(); renderAll(); }
    if (S.phase === 'cm') { try { await aiCombat(p); } catch (e) { if (e === 'cancel') throw e; console.warn(e); } setPhase('bat'); renderAll(); }
    if (S.phase === 'bat') {
      var guard = 0;

        var b = S.bl.filter(function (x) { return !x.done && !battleLocked(x); })[0];
        if (!b) break;
        var B = openBattle(b);
        if (B) await runBattle(); else { renderAll(); await wait(spd(250)); }
      }
      S.bl.forEach(function (x) { x.done = 1; });
      setPhase('ncm'); renderAll();
    }
    if (S.phase === 'ncm') { try { await aiNoncombat(p); } catch (e) { if (e === 'cancel') throw e; console.warn(e); } endNcm(); renderAll(); }
    if (S.phase === 'mob') { try { aiPlace(p); } catch (e) { console.warn(e); } renderAll(); await wait(spd(450)); cpuRunning = false; endMob(); }
  } catch (e) {

        try { cpuRunning = false; if (S.B) { S.B = null; hideBattle(); } S.bl = []; busy = 0; S.phase = 'mob'; endMob(); } catch (x) { console.warn(x); }

  '<li><b>Destroyers</b> cancel all those submarine tricks.</li>' +
  '<li><b>Industrial complex:</b> 15 IPCs; build one on any territory worth 1 or more that you held all turn.</li></ul>' +
  '<h3>Bombing raids</h3><p>Bombers sent at an enemy factory are each shot at by the factory’s own anti-aircraft fire (a 1 hits). Each surviving bomber rolls one die: that much damage, up to twice the territory’s value. Damage lowers how many units the factory can place until it’s repaired.</p>' +
  '<h3>Capitals and canals</h3><ul><li>Take an enemy capital and you seize all of its IPCs. Free a friend’s territory and it goes back to them (if their capital is free).</li><li>Ships can only use the Suez Canal if your side holds Egypt and Trans-Jordan, and the Panama Canal if your side holds Central America.</li><li>Gray striped places (Turkey, Sweden, Spain…) are neutral and can’t be entered or flown over.</li></ul>' +
  '<h3>Winning</h3><ul><li><b>Standard:</b> at the end of a round the Axis need <b>9</b> of the 13 victory cities, or the Allies need <b>10</b>.</li><li><b>Quick:</b> 8 for the Axis, 9 for the Allies. <b>Total:</b> all 13. <b>Capitals:</b> the Allies win by holding Berlin and Tokyo; the Axis win by holding two of London, Moscow and Washington.</li><li>With a round limit, the side with more victory cities when time runs out wins (ties go to the bigger total income).</li></ul>' +
  '<h3>Skirmish</h3><p>A quicker game in Europe: Germany against the Soviet Union and the United Kingdom on 20 territories and 10 sea zones, with smaller armies. Same units, buying, moves, dice and income. Britain also collects 10 IPCs a turn from its empire off the map. You win by holding an enemy capital at the end of a round (Allies: Berlin; Germany: Moscow or London) or 5 of the 6 victory cities. After round 10 the side with more victory cities wins.</p>' +
  '<h3>Left out</h3><p>Optional rules aren’t included: national objectives, research and technology, and the starting bid. Units can’t ride on an ally’s transport. Fighters fly on their own (they don’t ride a moving carrier). AA hits on planes are taken from the cheapest planes first.</p>' +
  '<h3>Who plays what</h3><p>2 players: Axis against Allies. 3: Germany + Japan; Soviet Union + United States; United Kingdom. 4: Germany; Soviet Union + United States; Japan; United Kingdom. 5: one power each. Any seat can be a computer general.</p>';

Kit.init({ orient: 'landscape', orientTablets: true,
  id: KEY,
  theme: { wood: ['#7a5a3a', '#4e3620'] },
  onNew: function () { clearSave(); showSetup(); },
  undo: function () { undo(); },
  rules: RULES,
  menu: [
    { icon: 'tiles', label: 'Show whole map', onClick: function () { if (S && R.map) fitView(true); } },
    { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Axis & Allies: past games', keys: ['axisallies-score'] }); } }
  ]
});

// ── Setup screen ───────────────────────────────────────────────────────────
var setupObs = null;
function showSetup() {
  tok++; S = null; busy = 0; cpuRunning = false; hideBattle(); closeBanner();
  document.documentElement.classList.remove('aa-play');
  app.className = 'stage'; app.innerHTML = ''; R = {};
  var st = Kit.setup(app, {
    intro: 'World War II strategy for 2 to 5 generals. Buy armies, move them across the world and roll for every battle.',
    modes: [
      { id: 'cpu', icon: 'bot', title: 'vs Computer', desc: 'You command one side; computer generals play the rest' },
      { id: 'mix', icon: 'users', title: 'Pass & play', desc: 'Share the phone. Leave a seat blank for a computer general' }
    ],
    options: [
      { id: 'map', label: 'Game', value: 'full', help: 'Which war to fight.', choices: [
        ['full', '1942 Second Edition', 'The whole world: 5 powers, the real starting armies. A long game (a few hours).'],
        ['skirm', 'Skirmish', 'Europe only: Germany against the Soviet Union and Britain with smaller armies. About an hour.']] },
      { id: 'side', label: 'You play', value: 'X', help: 'In a game against the computer, which side is yours.', choices: [['X', 'Axis', 'Germany (and Japan in the full game).'], ['A', 'Allies', 'The Soviet Union, Britain and the United States.']] },
      { id: 'vc', label: 'Victory', value: 'std', help: 'What a side needs at the end of a round to win the full game (Skirmish has its own goal).', choices: [
        ['std', 'Standard', 'Axis hold 9 of the 13 victory cities, or the Allies hold 10.'],
        ['quick', 'Quick', 'Axis need 8, Allies need 9. A shorter game.'],
        ['total', 'Total', 'Hold all 13 victory cities.'],
        ['caps', 'Capitals', 'Allies take Berlin and Tokyo; Axis take two of London, Moscow and Washington.']] },
      { id: 'limit', label: 'Round limit', value: '0', help: 'Stop after this many rounds. Whoever holds more victory cities then wins.', choices: [['0', 'None', 'Play until someone meets the victory goal (Skirmish stops after 10).'], ['6', '6 rounds', 'A game that fits an evening.'], ['10', '10 rounds', 'A longer game with a sure end.']] },
      { id: 'order', label: 'Turn order', value: 'su', help: 'Who moves first each round.', choices: [['su', 'Official', 'Soviet Union, Germany, United Kingdom, Japan, United States: the order printed in the 1942 Second Edition rules.'], ['de', 'Germany first', 'Germany, Soviet Union, Japan, United Kingdom, United States. Gives Germany a stronger opening.']] },
      { id: 'cas', label: 'Your losses', value: 'ask', help: 'Who picks which of your units are lost in battle.', choices: [['ask', 'I choose', 'The cheapest units are picked for you; you can change them before they go.'], ['auto', 'Automatic', 'Always lose the cheapest units first. Faster.']] },
      { id: 'speed', label: 'Computer speed', value: 'normal', help: 'How fast computer generals move and roll.', choices: [['normal', 'Normal', 'Easy to follow along.'], ['fast', 'Fast', 'Quick moves and dice.']] }
    ],
    players: { range: function () { return [2, 5]; }, count: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },
    start: 'Start the war',
    onStart: function (cfg) {
      if (setupObs) { setupObs.disconnect(); setupObs = null; }
      var o = cfg.options, map = o.map || 'full';
      var inputs = app.querySelectorAll('.seat input');
      var n = map === 'skirm' ? Math.min(3, cfg.players.length) : cfg.players.length;
      var groups = splitFor(map, n, cfg.mode, o.side);
      var blanks = 0;
      var names = cfg.players.slice(0, n).map(function (p) { return p.name; });
      var bots = Kit.cpuNames(n, names, 10);
      var seats = groups.map(function (g, i) {
        var p = cfg.players[i];
        var blank = cfg.mode === 'mix' && inputs[i] && !inputs[i].value.trim();
        if (blank) return { name: bots[blanks++] || 'Computer', cpu: true, powers: g };
        return { name: p.name, cpu: !!p.cpu, powers: g };
      });
      newGame({ map: map, vc: o.vc || 'std', cas: o.cas || 'ask', speed: o.speed || 'normal', limit: o.limit || '0', order: o.order || 'de', seats: seats });
    }
  });
  function captions() {
    if (!st) return;
    var s = st.state, map = s.options.map || 'full';
    var seatsEl = app.querySelectorAll('.seat');
    var n = seatsEl.length; if (!n) return;
    var groups = splitFor(map, Math.min(n, map === 'skirm' ? 3 : 5), s.mode, s.options.side);
    seatsEl.forEach(function (row, i) {
      var nx = row.nextSibling, want = groups[i] ? groups[i].map(function (p) { return '<span><i style="background:' + PW[p].col + '"></i>' + PW[p].name + '</span>'; }).join('') : '<span>Sits out in Skirmish (3 powers)</span>';
      if (nx && nx.classList && nx.classList.contains('seat-pw')) { if (nx.innerHTML !== want) nx.innerHTML = want; }
      else row.parentNode.insertBefore(el('div', { class: 'seat-pw', html: want }), row.nextSibling);
      var inp = row.querySelector('input');
      if (inp && !inp.readOnly && s.mode === 'mix' && inp.placeholder !== 'Name, or blank for computer') inp.placeholder = 'Name, or blank for computer';
    });
  }
  if (setupObs) setupObs.disconnect();
  setupObs = new MutationObserver(function () { setupObs.disconnect(); captions(); setupObs.observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] }); });
  setupObs.observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
  captions();
}

// ── Start ──────────────────────────────────────────────────────────────────
(function boot() {
  var saved = load();
  if (!saved) { showSetup(); return; }
  S = saved;
  buildMap(S.mode);
  buildBoard();
  requestAnimationFrame(function () {
    measure();
    if (!restoreView()) { fitView(); var c = capitalOf(cur()); if (c != null && S.mode !== 'skirm') focusOn(c, Math.max(fitScale() * 1.6, Math.min(1.1, V.W / 600))); }
    renderAll();
    if (isCpu(cur())) setTimeout(function () { runCpu(); }, 400);
    else if (S.B) runBattle().catch(function () {});
  });
})();
// test hook
window.__aa = { get S() { return S; }, set S(v) { S = v; }, U: U, TER: TER, NAME: NAME, M: M, income: income, cur: cur, renderAll: renderAll, save: save, vcCount: vcCount, doMove: doMove, groupTargets: groupTargets, onTap: onTap, simOdds: simOdds, focusOn: focusOn, fitView: fitView, runCpu: runCpu, newGame: newGame, stranded: strandedAir };
})();

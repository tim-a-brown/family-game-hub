<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mad Libs</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
body{overflow-x:hidden;}
.ml{max-width:620px;margin:0 auto;padding:4px 12px calc(var(--safe-b) + 20px);}

/* Legal pad */
.pad{position:relative;margin-top:16px;border-radius:6px 6px 10px 10px;padding:34px 18px 22px 46px;color:#2a2a3a;min-height:420px;
  background:
    linear-gradient(90deg,transparent 0 33px,rgba(220,60,70,.55) 33px 34px,transparent 34px 36px,rgba(220,60,70,.4) 36px 37px,transparent 37px),
    repeating-linear-gradient(180deg,transparent 0 31px,rgba(60,90,170,.28) 31px 32px),
    linear-gradient(180deg,#fff7c9,#fbefae);
  background-position:0 0,0 22px,0 0;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 0 0 1px rgba(0,0,0,.05),0 16px 34px rgba(0,0,0,.45);}
.pad::before{content:"";position:absolute;left:-2px;right:-2px;top:-14px;height:24px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,#c43b3b,#9c2424);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 6px rgba(0,0,0,.35);}
.pad::after{content:"";position:absolute;left:10px;right:10px;bottom:-6px;height:8px;border-radius:0 0 8px 8px;background:#ece0a0;z-index:-1;box-shadow:0 4px 8px rgba(0,0,0,.3);}
.pad .kick{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:#9a7b2c;margin-bottom:6px;}
.pad h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,7vw,2.1rem);line-height:1.05;color:#2a2a3a;margin-bottom:10px;}
.pad .ink{font-family:var(--hand);color:var(--ink);}
.pad p.note{font-family:var(--hand);font-size:1.25rem;line-height:32px;color:#5b5a6e;}

/* Story picker */
.pick{display:flex;flex-direction:column;gap:12px;}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.st{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:58px;padding:9px 10px 8px;border:0;border-radius:6px;text-align:left;color:#2a2a3a;
  background:linear-gradient(180deg,#fffdf4,#f4ecd2);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 2px 4px rgba(0,0,0,.18);transition:transform .12s;}
.st:nth-child(odd){transform:rotate(-.6deg);}
.st:nth-child(even){transform:rotate(.5deg);}
.st:active{transform:scale(.97);}
.st b{font-family:var(--display);font-weight:400;font-size:1.02rem;line-height:1.1;}
.st small{font-size:.72rem;font-weight:800;color:#8d846a;display:flex;align-items:center;gap:4px;}
.st small .ico{width:12px;height:12px;}
.st.done small{color:#3f8a52;}
.st .fav{position:absolute;right:6px;top:6px;width:14px;height:14px;color:#e0a21a;}
.st .fav .ico{width:14px;height:14px;fill:currentColor;}

/* Fill-in */
.fill{display:flex;flex-direction:column;gap:6px;}
.prog{display:flex;gap:4px;margin-bottom:6px;}
.prog i{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.1);}
.prog i.on{background:var(--c,#e2584a);}
.prog i.now{background:#2a2a3a;}
.who{display:flex;align-items:center;gap:8px;font-weight:900;color:#5b5a6e;font-size:.92rem;}
.who .avatar{width:26px;height:26px;font-size:.75rem;}
.wtype{font-family:var(--display);font-weight:400;font-size:clamp(2rem,9.5vw,2.7rem);line-height:1;color:#c43b3b;letter-spacing:.01em;margin-top:6px;}
.wtype.pop{animation:pop .45s var(--spring);}
@keyframes pop{from{transform:scale(.6);opacity:0;}}
.hintline{font-weight:800;color:#5b5a6e;font-size:.95rem;}
.explain{font-size:.98rem;line-height:1.35;color:#3b3a4e;background:rgba(255,255,255,.55);border-radius:10px;padding:8px 10px;margin-top:4px;}
.explain b{color:#2a2a3a;}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.ex button{min-height:36px;padding:0 12px;border:1px dashed rgba(42,42,58,.35);border-radius:999px;background:transparent;color:#3b3a4e;font-family:var(--hand);font-size:1.15rem;}
.ex button:active{background:rgba(0,0,0,.06);}
.ex .lbl{align-self:center;font-size:.75rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#9a7b2c;margin-right:2px;}
.wline{position:relative;margin-top:10px;}
.wline input{width:100%;height:56px;border:0;border-bottom:3px solid #2a2a3a;background:transparent;padding:0 4px;font-family:var(--hand);font-size:1.9rem;color:var(--ink);outline:none;border-radius:0;}
.wline input::placeholder{color:rgba(42,42,58,.3);}
.wline input:focus{border-bottom-color:#c43b3b;}
.wline.bad input{animation:shake .4s;border-bottom-color:#c43b3b;}
@keyframes shake{20%{transform:translateX(-6px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}}
.fillacts{display:flex;gap:10px;margin-top:16px;}
.fillacts .btn{flex:1;}
.fillacts .sq{flex:0 0 auto;padding:0 16px;background:rgba(42,42,58,.12);color:#2a2a3a;box-shadow:none;}

/* Pass cover */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0 4px;}
.cover .spot{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;color:#1a1033;
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 6px 16px rgba(0,0,0,.25);animation:pop .5s var(--spring) both;}
.cover h3{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.05;}
.cover p{font-family:var(--hand);font-size:1.3rem;color:#5b5a6e;line-height:1.3;max-width:300px;}
.cover .btn{min-width:230px;margin-top:4px;}
.folded{width:100%;height:58px;border-radius:6px;background:repeating-linear-gradient(180deg,#e9dc99 0 6px,#f3e7aa 6px 12px);box-shadow:inset 0 2px 6px rgba(0,0,0,.15);
  display:grid;place-items:center;font-weight:900;color:#9a7b2c;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;}

/* Reveal */
.story{font-family:var(--hand);font-size:1.38rem;line-height:32px;color:#2a2a3a;white-space:pre-wrap;min-height:200px;}
.story .w{font-weight:700;color:var(--ink);padding:0 3px;border-radius:3px;
  background:linear-gradient(180deg,transparent 0 30%,color-mix(in srgb,var(--c,#ffd447) 55%,#fff59a) 30% 92%,transparent 92%);
  box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.story .w.new{animation:mark .5s ease-out;}
@keyframes mark{from{background-size:0 100%;background-repeat:no-repeat;}to{background-size:100% 100%;}}
.story .caret{display:inline-block;width:2px;height:1.1em;background:#2a2a3a;vertical-align:-3px;animation:blink .8s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}
.story.speaking .w.say{outline:2px solid rgba(196,59,59,.6);}
.byline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-weight:800;font-size:.82rem;color:#7a7460;}
.byline span.p{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 3px;border-radius:999px;background:rgba(255,255,255,.6);color:#2a2a3a;}
.byline .avatar{width:20px;height:20px;font-size:.62rem;}
.revacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.revacts .wide{grid-column:1/-1;}
.revacts .btn .ico{width:18px;height:18px;}
.revacts .btn.on{background:#ffd447;color:#2b1a00;}
.revacts .btn.on .ico{fill:currentColor;}
.skipbtn{position:absolute;right:14px;bottom:10px;}

/* History extra */
.hxs{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff7c9;color:#2a2a3a;font-family:var(--hand);font-size:1.12rem;line-height:1.4;white-space:pre-wrap;}
.hxs b{color:var(--ink);background:rgba(255,212,71,.55);border-radius:3px;padding:0 2px;}
.hxs h4{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:0 0 4px;white-space:normal;}
.favlist{display:flex;flex-direction:column;gap:10px;}

@media (min-width:640px){
  .shelf{grid-template-columns:1fr 1fr 1fr;}
  .pad{padding:40px 30px 26px 60px;background-position:0 0,0 28px,0 0;
    background-image:linear-gradient(90deg,transparent 0 45px,rgba(220,60,70,.55) 45px 46px,transparent 46px 48px,rgba(220,60,70,.4) 48px 49px,transparent 49px),repeating-linear-gradient(180deg,transparent 0 31px,rgba(60,90,170,.28) 31px 32px),linear-gradient(180deg,#fff7c9,#fbefae);}
}
</style>
</head>

  // ── Fill text into the story ──────────────────────────────────────────────
  // Returns pieces: [{t:'text'} | {w:'word', p:playerIndex}]
  function pieces(st, words) {

    function finishType() {
      typing = null; skip.remove(); done();
      Kit.sfx('win'); Kit.confetti({ count: 70 });
      if (S.voice === 'auto' && speakBtn) setTimeout(function () { if (!speaking && app.contains(acts)) toggleSpeak(); }, 400);
    }
    typing = setTimeout(step, 500);
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = lsGet(SAVE, null);
  if (saved && saved.players && saved.phase && (saved.phase === 'pick' || BYID[saved.story])) {
    S = saved;
    if (S.phase === 'fill' && N() > 1) S.phase = 'cover';   // hand it back to the same player
    S.fresh = false;
    render();
  } else showSetup();
  window.__ml = { state: function () { return S; }, stories: STORIES, types: T };
})();
</script>

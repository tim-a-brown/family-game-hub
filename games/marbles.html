<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marbles</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.mcol{max-width:max(320px,min(520px,calc(100dvh - 250px)));margin:0 auto;display:flex;flex-direction:column;gap:10px;}
.mcol.cm{max-width:max(300px,min(520px,calc(100dvh - 392px)));gap:8px;}

/* Player chips */
.chips{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;}
.pc{--c:#fff;position:relative;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;min-height:46px;padding:5px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid transparent;transition:border-color .2s,background .2s;}
.pc.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);}
.pc .nm{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.86rem;line-height:1.1;min-width:0;}
.pc .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pc .nm .ico{width:13px;height:13px;color:var(--text-3);flex:none;}
.pc .gm{width:15px;height:15px;flex:none;border-radius:50%;}
.pc .pips{display:flex;gap:3px;align-items:center;font-size:.64rem;font-weight:800;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;}
.pc .pips i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.13);box-shadow:inset 0 1px 1px rgba(0,0,0,.5);flex:none;}
.pc .pips i.h{background:var(--c);box-shadow:inset 0 -1px 1px rgba(0,0,0,.3);}
.pc .pips em{font-style:normal;margin-left:4px;overflow:hidden;text-overflow:ellipsis;}
.pc.lcp{padding-right:38px;}
.pc .lc{position:absolute;right:6px;top:50%;transform:translateY(-50%) rotate(4deg);--cw:26px;}
.pc .lc .pcard{box-shadow:0 1px 3px rgba(0,0,0,.4);}

/* Wooden board */
.board{position:relative;width:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
.board svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));}
.board.shake{animation:shake .45s;}
.layer{position:absolute;inset:0;}

/* Glass marbles */
.mb{--c:#ffc83d;position:absolute;width:var(--ms);aspect-ratio:1;margin-left:calc(var(--ms) / -2);margin-top:calc(var(--ms) / -2);border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle at 33% 27%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,0) 21%),
    radial-gradient(circle at 68% 78%,rgba(255,255,255,.42) 0 7%,rgba(255,255,255,0) 22%),
    radial-gradient(circle at 42% 38%,color-mix(in srgb,var(--c) 55%,#fff) 0%,var(--c) 42%,color-mix(in srgb,var(--c) 52%,#000) 100%);
  box-shadow:0 .14em .2em rgba(0,0,0,.55),inset 0 -.12em .2em rgba(0,0,0,.3);font-size:calc(var(--ms) / 4);}
.mb::after{content:"";position:absolute;inset:14%;border-radius:50%;opacity:.35;mix-blend-mode:screen;
  background:conic-gradient(from 30deg,transparent 0 18%,rgba(255,255,255,.75) 22% 27%,transparent 31% 62%,rgba(255,255,255,.55) 66% 70%,transparent 74%);}
.mb.can{z-index:2;}
.mb.can::before{content:"";position:absolute;inset:-26%;border-radius:50%;border:2px solid #ffe58a;box-shadow:0 0 10px rgba(255,229,138,.85);animation:glow 1s ease-in-out infinite alternate;}
.mb.sel{z-index:3;transform:scale(1.18);}
.mb.sel::before{border-color:#fff;box-shadow:0 0 14px #fff;animation:none;}
.mb.dim{filter:saturate(.8) brightness(.92);}
.mb.fly{z-index:5;}
@keyframes glow{from{opacity:.45;transform:scale(.92);}to{opacity:1;transform:scale(1.04);}}
.tgt{position:absolute;width:calc(var(--ms) * 1.15);aspect-ratio:1;margin-left:calc(var(--ms) * -.575);margin-top:calc(var(--ms) * -.575);border-radius:50%;pointer-events:none;z-index:4;
  border:2px dashed #ffe58a;background:rgba(255,229,138,.18);animation:spin 3s linear infinite;}
.tgt.cap{border-color:#ff6b6b;background:rgba(255,80,80,.22);}
.tgt.swap{border-color:#8fd3ff;background:rgba(120,200,255,.22);}
.tgt b{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:calc(var(--mpx,20px) * .62);line-height:1;color:#fff;text-shadow:0 1px 2px #000;animation:spin 3s linear infinite reverse;}
.tgt b .ico{width:70%;height:70%;filter:drop-shadow(0 1px 1px #000);}
@keyframes spin{to{transform:rotate(360deg);}}

/* Dice tray / card tray */
.tray{border-radius:22px;padding:7px;}
.tray-in{position:relative;border-radius:16px;display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:88px;}
.cup{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;border:0;padding:0;
  background:radial-gradient(circle at 50% 38%,rgba(0,0,0,0) 40%,rgba(0,0,0,.35) 100%);
  box-shadow:inset 0 5px 12px rgba(0,0,0,.65),inset 0 -1px 0 rgba(255,255,255,.12),0 0 0 3px rgba(0,0,0,.18);}
.cup .die{--ds:48px;pointer-events:none;}
.cup.ready{cursor:pointer;animation:cupglow 1.2s ease-in-out infinite alternate;}
@keyframes cupglow{to{box-shadow:inset 0 5px 12px rgba(0,0,0,.65),0 0 0 3px rgba(255,229,138,.75),0 0 16px rgba(255,229,138,.5);}}
.cup .die.blank{opacity:.25;}
.tside{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.msg{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1rem;line-height:1.2;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);}
.msg .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent);}
.msg small{display:block;font-weight:700;font-size:.78rem;color:rgba(255,255,255,.72);text-shadow:none;}
.opts{display:flex;flex-wrap:wrap;gap:6px;}
.opts:empty{display:none;}
.opts .btn{flex:1 1 auto;min-height:42px;padding:0 12px;font-size:.88rem;}
.cm .opts .btn{min-height:40px;padding:4px 10px;font-size:.84rem;line-height:1.15;}
.opts .btn.cap{--b:#e5484d;--b-ink:#fff;--b-lip:#9c2227;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}
.rulechip{text-align:center;font-size:.76rem;font-weight:800;color:var(--text-3);}

/* Cards: deck + discard pile in the tray, your hand below */
.piles{position:relative;flex:none;display:flex;align-items:center;gap:8px;}
.deck{position:relative;--cw:38px;width:44px;height:58px;}
.deck .pcard{position:absolute;left:0;top:0;}
.deck .pcard:nth-child(2){left:2px;top:-2px;}
.deck .pcard:nth-child(3){left:4px;top:-4px;}
.deck .dn{position:absolute;right:-6px;bottom:-6px;z-index:3;min-width:22px;height:20px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;font-weight:900;display:grid;place-items:center;}
.pile{position:relative;--cw:50px;width:66px;height:76px;}
.pile .pcard{position:absolute;left:8px;top:3px;transition:none;}
.pile .pcard.top{box-shadow:0 0 0 2px var(--pc,#ffe58a),0 6px 14px rgba(0,0,0,.4);}
.pile .ph,.deck .ph{position:absolute;inset:3px 8px;border-radius:6px;border:2px dashed rgba(255,255,255,.22);}
.chand.mh{--cw:clamp(58px,16.4vw,76px);padding-top:18px;margin-top:-4px;}
.chand.mh .pcard{transition:transform .18s var(--ease),filter .2s;}
.chand.mh .pcard.sel{transform:translateY(-14px);}
.chand.mh.off .pcard{filter:brightness(.82);}
.chand .hidetag{position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);z-index:3;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:.8rem;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.chand .hidetag .ico{width:15px;height:15px;}
.pcard.jk{--ink:#6b2bd1;}
.pcard.jk.red{--ink:#d81e3a;}
.pcard.jk .big .ico{width:52%;height:auto;stroke-width:2.4;}
.pcard.jk .ix .ico{width:calc(var(--cw) * .2);height:calc(var(--cw) * .2);stroke-width:3;}
.pcard.jk .lbl{font-size:calc(var(--cw) * .13);}

/* iPad: bigger board in portrait; landscape puts the players, die tray and rules beside the board */
@media (min-width:700px) and (orientation:portrait){
  #app.stage.ipl{max-width:760px;}
  .mcol{max-width:min(712px,calc(100dvh - 340px));}
  .mcol.cm{max-width:min(712px,calc(100dvh - 500px));}
  .cup{width:88px;height:88px;}
  .cup .die{--ds:56px;}
  .chand.mh{--cw:86px;}
  .pile{--cw:58px;width:76px;height:86px;}
}
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  #app.stage.ipl{max-width:none;padding-bottom:calc(var(--safe-b) + 12px);}
  .mcol,.mcol.cm{max-width:none;display:grid;grid-template-columns:auto minmax(280px,360px);grid-template-rows:auto auto auto auto 1fr;
    grid-template-areas:"b c" "b t" "b h" "b r" "b .";column-gap:28px;row-gap:12px;justify-content:center;align-items:start;}
  .mcol>.chips{grid-area:c;grid-template-columns:1fr;}
  .mcol.cm>.chips{grid-template-columns:1fr 1fr;}
  .mcol>.board{grid-area:b;width:auto;height:min(calc(100dvh - 80px - var(--safe-t) - var(--safe-b)),calc((100vw - 440px) / var(--ar,1)));}
  .mcol>.tray{grid-area:t;}
  .mcol>.chand{grid-area:h;--cw:68px;}
  .mcol>.rulechip{grid-area:r;text-align:left;}
  .tray-in{flex-wrap:wrap;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var KEY = 'marbles', SAVE = 'marbles_state';
  var SEG = 14, CEN = 999;
  var RULES = { cards: 'Cards & Marbles', agg: 'Aggravation', wahoo: 'Wahoo', plain: 'Wahoo, no center' };
  var NEUTRAL = '#e8dcc2';

  // ═════════════════════════════════════════════════════════════════════════
  // Board geometry. B arms (4 = cross board, 6 = six-sided board). Each arm has
  // 14 track holes: 6 out along its right side, the tip (your home entrance),
  // 6 back along its left side, then the inside corner (a star). Units: 1 = one
  // hole spacing; (0,0) is the centre hole.
  // ═════════════════════════════════════════════════════════════════════════
  var GEO = {};
  function geo(B) {
    if (GEO[B]) return GEO[B];
    var half = Math.PI / B, tc = 1 / Math.tan(half), r0 = tc + 1, tip = r0 + 5;
    var track = [], home = [], base = [], baseC = [];
    function rot(x, y, a) { var c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }
    for (var k = 0; k < B; k++) {
      var a = k * 2 * Math.PI / B;
      var L = function (x, r) { return rot(x, r, a); };
      for (var r = 0; r < 6; r++) track.push(L(1, r0 + r));
      track.push(L(0, tip));
      for (r = 5; r >= 0; r--) track.push(L(-1, r0 + r));
      track.push(L(-1, tc));
      var h = []; for (var i = 1; i <= 4; i++) h.push(L(0, tip - i)); home.push(h);
      // Base: in the wedge between this arm and the next, near the start hole
      var ba = a + half, rb = B === 4 ? 6.35 : 6.55, cx = -Math.sin(ba) * rb, cy = Math.cos(ba) * rb;
      baseC.push([cx, cy]);
      var bs = [];
      [[-.56, -.56], [.56, -.56], [-.56, .56], [.56, .56]].forEach(function (o) { var p = rot(o[0], o[1], ba); bs.push([cx + p[0], cy + p[1]]); });
      base.push(bs);
    }
    var g = { B: B, N: SEG * B, track: track, home: home, base: base, baseC: baseC, tip: tip, r0: r0 };
    if (B === 4) { g.W = g.H = 2 * (tip + 0.95); }
    else { g.apo = tip + 0.62; g.rc = g.apo + 0.55; g.W = 2 * g.rc; g.H = 2 * g.apo; }
    g.ms = 0.8; // marble diameter in units
    GEO[B] = g;
    return g;
  }

  // ── State ────────────────────────────────────────────────────────────────
  // S = {mode, rules, teams, B, players:[{name,cpu,color,arm,m:[4 positions],st}], cur,
  //      phase:'roll'|'move'|'moved'|'play'|'over', die, sixRun, turns, started, hist:[snapshots], last}
  // Cards rules add: king ('13'|'out'), deck, hands:[[card]], pile:[{c,pi}], lastCard:[card],
  //      viewer (whose hand is showing, -1 = hidden), pend (second half of a split 7), deals, line.
  // Marble position: -1 base, 0..N-1 steps from your start hole, N..N+3 home, CEN centre.
  var S = null, SPD = 1, tok = 0, lock = false, sel = -1;
  function G() { return geo(S.B); }
  function N() { return SEG * S.B; }
  function isCards() { return S && S.rules === 'cards'; }
  function save() {
    if (!S) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S.phase !== 'over') Kit.resume.set(Kit.poss(S.players[S.cur].name) + ' turn · ' + RULES[S.rules]);
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function later(fn, ms) { laterRaw(fn, ms * SPD); }
  function laterRaw(fn, ms) { var t = tok; setTimeout(function () { if (t === tok && S) fn(); }, Math.max(0, ms)); }
  function partnerOf(i) { return S.teams ? (i + S.players.length / 2) % S.players.length : -1; }
  function friendly(a, b) { return a === b || (S.teams && partnerOf(a) === b); }
  function startAbs(arm) { return arm * SEG + 7; }
  function isStar(t) { return t % SEG === SEG - 1; }
  function absOf(pi, p) { return (startAbs(S.players[pi].arm) + p) % N(); }
  function relOf(pi, abs) { var n = N(); return ((abs - startAbs(S.players[pi].arm)) % n + n) % n; }
  function homeCount(pi, pl) { var n = N(); return (pl || S.players)[pi].m.filter(function (p) { return p >= n && p !== CEN; }).length; }
  function allHome(pi, pl) { return homeCount(pi, pl) === 4; }
  function progress(pi) { var n = N(); return S.players[pi].m.reduce(function (a, p) { return a + (p === -1 ? 0 : p === CEN ? n / 2 : p); }, 0); }
  function mover(pi, pl) { return S.teams && allHome(pi, pl) ? partnerOf(pi) : pi; }
  function humans() { return S.players.filter(function (p) { return !p.cpu; }).length; }
  function firstHuman() { for (var i = 0; i < S.players.length; i++) if (!S.players[i].cpu) return i; return -1; }
  function who(i) { return S.players[i].name; }

  // ── Rules text ───────────────────────────────────────────────────────────
  Kit.init({
    id: 'marbles', mark: false,
    theme: { wood: ['#8a5530', '#5a3318'], back: ['#22406e', '#c9963a'] },
    onNew: function () { tok++; Kit.handoff.close(); clearSave(); showSetup(); },
    undo: function () { undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Marbles: past games' }); } }],
    rules:
      '<p class="goal">Race all four of your marbles around the board and into your home row. You move by playing cards. First one (or first team) with every marble home wins.</p>' +
      '<p>This is the card game families call <b>Marbles</b>, <b>Cards &amp; Marbles</b>, <b>Tock</b> or <b>Pegs and Jokers</b>. Aggravation and Wahoo (with a die) are in setup under <b>Rules</b>.</p>' +
      '<h3>The cards</h3><p>A normal deck plus 2 Jokers. Everyone gets <b>5 cards</b>. On your turn, play <b>one card</b> and move <b>one marble</b>. When everyone is out of cards, deal 5 more.</p>' +
      '<ul><li><b>Ace:</b> move a marble out of base onto your start hole, or move 1.</li>' +
      '<li><b>King:</b> move out of base, or move 13.</li>' +
      '<li><b>Queen:</b> move 12.</li>' +
      '<li><b>Jack:</b> swap one of your marbles with another player\'s marble on the track, or move 11.</li>' +
      '<li><b>Joker:</b> move out of base, or jump one of your marbles onto any other player\'s marble on the track and send it back to its base.</li>' +
      '<li><b>4:</b> move <b>backward</b> 4.</li>' +
      '<li><b>7:</b> move 7, or <b>split</b> it between two marbles (like 3 and 4).</li>' +
      '<li><b>2, 3, 5, 6, 8, 9, 10:</b> move forward that many.</li></ul>' +
      '<h3>Moving</h3><ul><li>Marbles go <b>clockwise</b> around the track, then turn up your own home row.</li>' +
      '<li>You <b>can\'t jump your own marbles</b>. You can jump other players\' marbles.</li>' +
      '<li>Land <b>exactly</b> on another player\'s marble and it goes back to its base ("sent home").</li>' +
      '<li>A marble sitting on <b>its own start hole</b> is safe. Nobody can land on it or jump past it.</li>' +
      '<li>You need the <b>exact count</b> to move into your home row.</li>' +
      '<li><b>Backing up trick:</b> a 4 from just past your start hole puts your marble right by your home row.</li>' +
      '<li>If none of your cards can move anything, you throw away one card and your turn ends.</li></ul>' +
      '<h3>Partners</h3><ul><li>With 4 or 6 players you can play as partners with the player straight across.</li>' +
      '<li>You can jump your partner\'s marbles but not land on them, and you can use part of a 7 on your partner\'s marble.</li>' +
      '<li>Once all four of your marbles are home, you play your cards to move your <b>partner\'s</b> marbles.</li>' +
      '<li>The first team with every marble home wins.</li></ul>' +
      '<h3>Family rules (exactly what this game does)</h3><ul>' +
      '<li>Only the Ace, King and Joker get a marble out of base.</li>' +
      '<li>The Jack can swap with any marble not on a base, in a home row, or on its own start hole. Swapping never sends anyone home.</li>' +
      '<li>The Joker can only jump a marble that is already on the track.</li>' +
      '<li>A split 7 can\'t go backward and both halves must be used. You can\'t split onto one marble twice.</li>' +
      '<li>Backward moves never go into a home row.</li>' +
      '<li>Setup choice: a King can be <b>out or 13</b> (usual) or <b>out only</b>.</li>' +
      '<li>When the deck runs low it\'s shuffled with all the played cards.</li></ul>' +
      '<h3>Dice rules: Aggravation and Wahoo</h3><ul>' +
      '<li>Roll a <b>1 or a 6</b> to move a marble out. A 6 gives you another roll.</li>' +
      '<li>Move one marble the number you rolled. If you can move, you must.</li>' +
      '<li><b>Aggravation:</b> if a marble <b>starts its turn on a star</b> (inside corner) it may hop star to star; each hop counts as one. The <b>center hole</b> counts as one step past any star; leave it only with a 1, hopping out to any star.</li>' +
      '<li><b>Wahoo:</b> no star hops; the center hole still works. <b>Wahoo, no center:</b> no shortcuts.</li></ul>' +
      '<h3>Boards</h3><p>Two to four players use the cross board. Five or six players use the six-sided board.</p>'
  });

  // ── Setup ────────────────────────────────────────────────────────────────
  var setupObs = null;
  function savedRules() {
    try { var s = JSON.parse(localStorage.getItem('gn_setup_marbles') || '{}'); return (s.options && s.options.ruleset) || 'cards'; } catch (e) { return 'cards'; }
  }
  function showSetup() {
    tok++; S = null; sel = -1; lock = false; ui.card = null; ui.sel = null;
    Kit.handoff.close();
    app.classList.remove('ipl');
    var st = null;
    function rulesNow() { return st ? st.state.options.ruleset : savedRules(); }
    st = Kit.setup(app, {
      modes: [
        { id: 'cpu', icon: 'bot', title: 'vs Computer', desc: 'You against computer players' },
        { id: 'mix', icon: 'users', title: 'Family game', desc: 'Pass the phone. Leave a seat blank for a computer player' }
      ],
      options: [
        { id: 'ruleset', label: 'Rules', help: 'Which version of Marbles to play.', value: 'cards', choices: [
          ['cards', 'Cards', 'The usual family game: play cards to move. No center hole.'],
          ['agg', 'Aggravation', 'Roll a die. Star holes let you hop the corners, and the center hole is a shortcut.'],
          ['wahoo', 'Wahoo', 'Roll a die. No star hops, but the center hole shortcut still works.'],
          ['plain', 'Plain', 'Wahoo with no center hole. Roll a die. No shortcuts at all: just race around the track.']] },
        { id: 'king', label: 'King', help: 'What a King lets you do in the card game.', value: '13', when: function () { return rulesNow() === 'cards'; }, choices: [
          ['13', 'Out or 13', 'The usual rule: bring a marble out, or move 13.'],
          ['out', 'Out only', 'A King can only bring a marble out of base.']] },
        { id: 'partners', label: 'Partners (4 or 6 players)', help: 'With 4 or 6 players, you can team up with the player straight across from you.', value: 'on', choices: [['off', 'No partners', 'Everyone plays for themselves.'], ['on', 'Partners across', 'Once your marbles are home you move your partner’s. The first team with all marbles home wins.']] }
      ],
      players: { range: function () { return [2, 6]; }, count: 4, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },
      onStart: function (cfg) {
        if (setupObs) { setupObs.disconnect(); setupObs = null; }
        var mix = cfg.mode === 'mix', blanks = [];
        var inputs = app.querySelectorAll('.seat input');
        var names = cfg.players.map(function (p, i) {
          var blank = mix && inputs[i] && !inputs[i].value.trim();
          if (blank) blanks.push(i);
          return p.name;
        });
        var bots = Kit.cpuNames(blanks.length, names, cfg.players.length >= 4 ? 8 : 0);

      var dx = end[0] - from[0], dy = end[1] - from[1], L = Math.sqrt(dx * dx + dy * dy) || 1, bow = Math.min(2.2, L * .25) * a[4];
      mid = [mid[0] - dy / L * bow, mid[1] + dx / L * bow];
      function tf(p, sc) { return 'translate(' + ((p[0] - end[0]) / g.ms * 100).toFixed(2) + '%,' + ((p[1] - end[1]) / g.ms * 100).toFixed(2) + '%) scale(' + (sc || 1) + ')'; }
      node.classList.add('fly');
      node.animate([{ transform: tf(from) }, { transform: tf(mid, 1.3), offset: .5 }, { transform: tf(end) }], { duration: dur, delay: delay, easing: 'ease-in-out', fill: 'backwards' });
      setTimeout(function () { node.classList.remove('fly'); }, delay + dur + 20);
    });
    setTimeout(function () { Kit.sfx('whoosh'); }, delay);
    setTimeout(function () { Kit.sfx('chip'); Kit.haptic('medium'); }, delay + dur);
    return delay + dur;
  }
  function animStep(st, delay) { return st.kind === 'swap' ? animSwap(st, delay) : animate(st, delay); }
  // A woody "bonk" (local; the kit has no bonk sound)
  var actx = null;
  function bonk() {
    try { if (localStorage.getItem('gn_sound') === '0') return; } catch (e) {}
    try {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      actx = actx || new C(); if (actx.state === 'suspended') actx.resume();
      var t = actx.currentTime, o = actx.createOscillator(), gn = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(70, t + .22);
      gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(.35, t + .01); gn.gain.exponentialRampToValueAtTime(.0001, t + .3);
      o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t + .32);
      var o2 = actx.createOscillator(), g2 = actx.createGain();
      o2.type = 'triangle'; o2.frequency.setValueAtTime(520, t); o2.frequency.exponentialRampToValueAtTime(260, t + .08);
      g2.gain.setValueAtTime(.0001, t); g2.gain.exponentialRampToValueAtTime(.12, t + .005); g2.gain.exponentialRampToValueAtTime(.0001, t + .1);
      o2.connect(g2); g2.connect(actx.destination); o2.start(t); o2.stop(t + .12);
    } catch (e) {}
  }

  // ── Input ────────────────────────────────────────────────────────────────
  function canAct() { return S && !lock && S.phase === 'move' && !P().cpu; }
  function humanRoll() {
    if (!S || isCards() || lock || S.phase !== 'roll' || P().cpu) return;
    roll();
  }
  function onBoard(e) {
    if (e.button > 0) return;
    if (isCards()) return onBoardCards(e);
    if (!canAct()) return;
    var g = G(), rc = boardEl.getBoundingClientRect();
    var x = (e.clientX - rc.left) / rc.width * g.W - g.W / 2, y = (e.clientY - rc.top) / rc.height * g.H - g.H / 2;
    var ms = legal(); if (!ms.length) return;
    function d2(p) { return (p[0] - x) * (p[0] - x) + (p[1] - y) * (p[1] - y); }
    // A target of the selected marble?
    if (sel >= 0) {
      var tg = null, td = 0.85 * 0.85;
      ms.forEach(function (m) { if (m.mi !== sel) return; var dd = d2(tokXY(m.o, m.path[m.path.length - 1])); if (dd < td) { td = dd; tg = m; } });
      if (tg) { doMove(tg); return; }
    }
    // Nearest marble that can move
    var best = null, bd = 1.5 * 1.5;
    ms.forEach(function (m) { var dd = d2(posXY(m.o, m.mi)); if (dd < bd) { bd = dd; best = m; } });
    if (!best) {
      // Tapped a target hole directly (unique move to there)?
      var hits = ms.filter(function (m) { return d2(tokXY(m.o, m.path[m.path.length - 1])) < .7 * .7; });
      if (hits.length === 1) { doMove(hits[0]); return; }
      if (sel >= 0) { sel = -1; paint(); }
      return;
    }
    var mine = ms.filter(function (m) { return m.mi === best.mi; });
    if (mine.length === 1) { doMove(mine[0]); return; }
    sel = sel === best.mi ? -1 : best.mi;
    Kit.sfx('tick'); Kit.haptic('tick'); paint();
  }
  // Cards: tap a card, then a glowing marble, then (if needed) a glowing hole
  function canPlay() { return S && isCards() && !lock && S.phase === 'play' && myHandShown(); }
  function onCard(c, node) {
    if (!canPlay() || S.pend) return;
    Kit.sfx('tick'); Kit.haptic('tick');
    if (!allPlays(S.cur).length) { ui.discard = ui.discard === c.id ? null : c.id; paint(); return; }
    if (!cardMoves(c).length) { Kit.toast('The ' + cardName(c) + ' can\'t move anything right now', 1400); return; }
    if (ui.card === c.id) { ui.card = null; ui.sel = null; paint(); return; }
    ui.card = c.id; ui.sel = null;
    autoSelect();
    paint();
  }
  // Only one marble can use this card: pick it straight away
  function autoSelect() {
    var ch = cChoices(), keys = Object.keys(ch.glow);
    if (keys.length === 1) ui.sel = keys[0];
  }
  function handRect(id) {
    var n = handEl && handEl.querySelector('.pcard[data-id="' + id + '"]');
    return n ? n.getBoundingClientRect() : null;
  }
  function humanDiscard() {
    if (!canPlay() || !ui.discard) return;
    var c = cardById(ui.discard); if (!c) return;
    discard(c, { fromRect: handRect(c.id) });
  }
  function chooseGroup(g) {
    if (!canPlay()) return;
    var rect = ui.card ? handRect(ui.card) : null;
    var whole = g.moves.filter(function (m) { return m.steps.length === 1; })[0];
    if (whole) { playMove(whole, { fromRect: rect }); return; }
    // First half of a split 7
    playMove(g.moves[0], { half: true, fromRect: rect });
  }
  function onBoardCards(e) {
    if (!canPlay()) return;
    var g = G(), rc = boardEl.getBoundingClientRect();
    var x = (e.clientX - rc.left) / rc.width * g.W - g.W / 2, y = (e.clientY - rc.top) / rc.height * g.H - g.H / 2;
    function d2(p) { return (p[0] - x) * (p[0] - x) + (p[1] - y) * (p[1] - y); }
    // A target hole?
    if (ui.sel && ui.targets.length) {
      var hits = ui.targets.filter(function (t) { return d2(t.xy) < .75 * .75; });
      if (hits.length === 1) { chooseGroup(hits[0].g); return; }
      if (hits.length > 1) { Kit.toast('Pick from the list below', 1200); return; }
    }
    // A glowing marble?
    var best = null, bd = 1.3 * 1.3;
    ui.glow.forEach(function (gm) { var dd = d2(gm.xy); if (dd < bd) { bd = dd; best = gm; } });
    if (!best) {
      if (!ui.card && !S.pend) Kit.toast('Pick a card first', 1100);
      else if (ui.sel) { ui.sel = null; paint(); }
      return;
    }
    var key = best.o + ':' + best.mi;
    ui.sel = key;
    var ch = cChoices();
    if (ch.groups.length === 1 && ch.groups[0].step.kind === 'out') { chooseGroup(ch.groups[0]); return; }
    if (ch.groups.length === 1 && ch.groups[0].moves.length === 1 && !S.pend && (cardById(ui.card) || {}).r !== '7') { chooseGroup(ch.groups[0]); return; }
    Kit.sfx('tick'); Kit.haptic('tick'); paint();
  }
  document.addEventListener('keydown', function (e) {
    if (!S || document.querySelector('.k-scrim') || document.querySelector('.k-ho')) return;
    if (isCards()) {
      if (/^[1-9]$/.test(e.key) && canPlay() && ui.sel) {
        var ch = cChoices(), g = ch.groups[+e.key - 1];
        if (g) chooseGroup(g);
      }
      return;
    }
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'r') && S.phase === 'roll') { e.preventDefault(); humanRoll(); }
    else if (/^[1-9]$/.test(e.key) && canAct() && sel >= 0) {
      var opts = legal().filter(function (m) { return m.mi === sel; }), m = opts[+e.key - 1];
      if (m) doMove(m);
    }
  });
  window.addEventListener('resize', function () { if (handEl) Cards.fan(handEl, { gap: 8 }); });

  // ── Test hooks ───────────────────────────────────────────────────────────
  window.__marbles = {
    state: function () { return S; }, legal: legal, gen: function (o, d) { return gen(o, d); },
    speed: function (x) { SPD = x; }, lock: function () { return lock; },
    move: function (i) { var m = legal()[i]; if (m) doMove(m); return !!m; },
    roll: humanRoll,
    load: function (st) { tok++; lock = false; sel = -1; handing = false; ui.card = null; ui.sel = null; Kit.handoff.close(); S = st; S.hist = S.hist || []; render(); resumeFlow(); },
    allCpu: function () { S.players.forEach(function (p) { p.cpu = true; }); tok++; lock = false; handing = false; Kit.handoff.close(); if (isCards()) S.viewer = -1; render(); resumeFlow(); },
    // cards
    cardMoves: function (c) { return cardMoves(c); }, plays: function () { return allPlays(S.cur); },
    ui: function () { return ui; }, choices: function () { return cChoices(); },
    play: function (mv, half) { playMove(mv, { half: !!half }); }
  };

  function resumeFlow() {
    if (!S) return;
    handing = false;
    if (isCards()) {
      if (S.phase === 'over') { var wc = winner(); if (wc) finish(wc); return; }
      if (S.phase === 'moved') { S.phase = 'play'; cNext(); return; }
      if (!S.players[S.cur].cpu && humans() > 1) S.viewer = -1;
      if (S.pend) { save(); paint(); if (S.players[S.cur].cpu) { S.pend = null; cNext(); } else if (humans() > 1) handoff(); return; }
      cBegin();
      return;
    }
    if (S.phase === 'roll') beginTurn();
    else if (S.phase === 'move') { paint(); afterRoll(); }
    else if (S.phase === 'moved') nextTurn();
    else if (S.phase === 'over') { var w = winner(); if (w) finish(w); }
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.players && saved.players.length && saved.phase !== 'over') { S = saved; S.hist = S.hist || []; render(); resumeFlow(); }
  else showSetup();
})();
</script>

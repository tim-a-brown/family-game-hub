<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pac-Man</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<style>
/* ── Arcade page shell: fills the screen, never scrolls ─────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;padding:0 8px calc(var(--safe-b) + 10px);display:flex;}
.pm-view{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.pm-view[hidden]{display:none;}
.pm-view{touch-action:none;}
.pm-view.nopad{justify-content:flex-start;padding-top:4px;}
.pm-view.nopad .hint{display:block;margin-top:auto;padding-bottom:6px;}
.hud{flex:none;display:flex;align-items:stretch;gap:6px;width:100%;}
.plate{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 8px;border-radius:15px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line),var(--shadow-sm);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.plate small{font-size:.74rem;font-weight:600;color:var(--text-2);white-space:nowrap;}
.plate b{font-family:var(--display);font-weight:800;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:1.4rem;line-height:1.05;}
.plate.sc b{color:var(--lit);text-shadow:0 0 14px var(--litg);}
.plate.bump b{animation:bounce .4s var(--spring);}
.pbtn{flex:none;width:48px;border:0;border-radius:15px;display:grid;place-items:center;color:var(--text);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line),var(--shadow-sm);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .12s var(--ease),filter .15s;}
.pbtn:active{transform:translateY(1px) scale(.95);filter:brightness(.94);}
.pbtn svg{width:22px;height:22px;}
/* Cabinet: wooden bezel around a dark glass screen */
.cab{flex:none;width:100%;display:flex;align-items:center;justify-content:center;}
.bezel{position:relative;padding:7px;border-radius:20px;}
.scr{position:relative;border-radius:13px;overflow:hidden;background:#04030c;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);}
.scr canvas{display:block;touch-action:none;}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),
    radial-gradient(120% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.45) 100%);}
.strip{flex:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;height:24px;padding:0 6px;}
.strip canvas{display:block;height:20px;}
/* Overlay cards inside the screen */
.ov{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:14px;background:var(--win-shade);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.ov[hidden]{display:none;}
.ov .card{width:100%;max-width:300px;text-align:center;padding:20px 16px 16px;animation:pop .35s var(--spring);--text:#f3f1fb;--text-2:#c6c4da;--text-3:#8f8daa;--gl:rgba(255,255,255,.07);--gl-2:rgba(255,255,255,.1);--gl-3:rgba(255,255,255,.08);--gl-line:rgba(255,255,255,.12);--lit:#ffd34d;--lit-ink:#ffe28a;--litg:rgba(255,190,60,.55);color:var(--text);background:rgba(24,26,48,.94);border-radius:var(--r-xl);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px var(--gl-line),0 30px 60px -24px rgba(0,0,0,.9);}
.ov h2{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:2.3rem;line-height:1;color:var(--text);}
.ov h2.red{color:var(--bad-ink);}
.ov .sub{color:var(--text-2);font-weight:700;font-size:.92rem;margin:6px 0 12px;line-height:1.35;}
.ov .stats{display:flex;gap:8px;justify-content:center;margin:0 0 12px;}
.ov .stat{flex:1;max-width:120px;padding:6px 4px;border-radius:13px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);}
.ov .stat b{display:block;font-family:var(--display);font-weight:800;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:1.5rem;line-height:1.1;}
.ov .stat span{font-size:.74rem;font-weight:600;color:var(--text-2);}
.ov .badge{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:5px 12px;border-radius:999px;font-weight:750;font-size:.84rem;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 24px -10px rgba(255,190,60,.6);}
.ov .badge .ico{width:15px;height:15px;}
.ov .btn-lg{width:100%;}
.ov .row2{display:flex;gap:8px;margin-top:10px;}
.ov .row2 .btn{flex:1;min-height:42px;padding:0 10px;font-size:.9rem;}
/* Touch pad: drag or tap in a direction (also swipe on the maze) */
.padwrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;}
.pad{position:relative;width:184px;height:184px;border-radius:50%;touch-action:none;-webkit-user-select:none;user-select:none;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line),0 16px 30px -16px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
.pad i{position:absolute;width:56px;height:56px;display:grid;place-items:center;color:var(--text-3);transition:color .1s,transform .1s;}
.pad i svg{width:30px;height:30px;}
.pad i.u{left:64px;top:8px;} .pad i.d{left:64px;bottom:8px;} .pad i.l{left:8px;top:64px;} .pad i.r{right:8px;top:64px;}
.pad i.on{color:var(--lit);transform:scale(1.15);filter:drop-shadow(0 0 8px var(--litg));}
.pad i.want{color:var(--text);}
.pad .nub{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 42% 30%,rgba(255,255,255,.34),rgba(255,255,255,0) 62%),var(--gl-2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.3),0 10px 18px -8px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .08s;}
.hint{flex:none;font-size:.82rem;font-weight:700;color:var(--text-3);text-align:center;}
@media (hover:hover) and (pointer:fine){ .padwrap{display:none;} }
@media (hover:none),(pointer:coarse){ .hint{display:none;} }
@media (max-height:720px){ .pad{width:150px;height:150px;} .pad i{width:46px;height:46px;} .pad i.u{left:52px;top:4px;} .pad i.d{left:52px;bottom:4px;} .pad i.l{left:4px;top:52px;} .pad i.r{right:4px;top:52px;} .pad .nub{width:50px;height:50px;margin:-25px 0 0 -25px;} }
/* Sideways (phones too, iPads, wide windows; .pm-wide is set by layout()): the scores and lives in a column at the left,
   the maze in the middle at the full height, and the pad at the right, low, under the right thumb */
html.pm-wide.ar-on #app{max-width:none;}
html.pm-wide .pm-view{display:grid;grid-template-columns:var(--pm-col) auto var(--pm-col);grid-template-rows:minmax(0,1fr) auto;column-gap:clamp(12px,2.4vw,36px);row-gap:8px;justify-content:center;align-items:center;padding:4px 0 max(var(--corner-y),8px);--pm-col:clamp(140px,calc((100vw - 90vh) / 2),300px);}
html.pm-wide .hud{grid-column:1;grid-row:1;flex-direction:column;gap:clamp(6px,1.6vh,12px);max-width:none!important;align-self:center;}
html.pm-wide .plate{flex:none!important;padding:clamp(5px,1.4vh,12px) 14px;align-items:flex-start;}
html.pm-wide .plate small{font-size:.86rem;}
html.pm-wide .plate b{font-size:clamp(1.4rem,5vh,2.3rem);}
html.pm-wide .pbtn{width:100%;height:clamp(40px,8vh,52px);}
html.pm-wide .strip{grid-column:1;grid-row:2;max-width:none!important;}
html.pm-wide .cab{grid-column:2;grid-row:1 / span 2;width:auto;}
html.pm-wide .padwrap{grid-column:3;grid-row:1 / span 2;align-self:end;height:auto;}
html.pm-wide .hint{grid-column:3;grid-row:1 / span 2;}
html.pm-wide .pm-view.nopad{padding-top:4px;}
@media (min-height:600px) and (pointer:coarse){
  html.pm-wide .pad{width:200px;height:200px;} html.pm-wide .pad i{width:60px;height:60px;} html.pm-wide .pad i.u{left:70px;top:8px;} html.pm-wide .pad i.d{left:70px;bottom:8px;} html.pm-wide .pad i.l{left:8px;top:70px;} html.pm-wide .pad i.r{right:8px;top:70px;}
  html.pm-wide .pad .nub{width:68px;height:68px;margin:-34px 0 0 -34px;}
}
/* Upright on a tall phone the pad grows into the room under the maze */
@media (orientation:portrait) and (min-height:800px) and (max-width:600px) and (pointer:coarse){
  html:not(.pm-wide) .pad{width:212px;height:212px;} html:not(.pm-wide) .pad i{width:62px;height:62px;} html:not(.pm-wide) .pad i.u{left:75px;top:8px;} html:not(.pm-wide) .pad i.d{left:75px;bottom:8px;} html:not(.pm-wide) .pad i.l{left:8px;top:75px;} html:not(.pm-wide) .pad i.r{right:8px;top:75px;}
  html:not(.pm-wide) .pad .nub{width:72px;height:72px;margin:-36px 0 0 -36px;}
}
html.ar-on .bezel{view-transition-name:pm-maze;} html.ar-on .hud{view-transition-name:pm-hud;} html.ar-on .pad{view-transition-name:pm-pad;}
.plate.pb{animation:pm-pb 1.6s var(--ease);}
.plate.pb b{color:var(--lit);text-shadow:0 0 14px var(--litg);animation:bounce .5s var(--spring);}
@keyframes pm-pb{0%{box-shadow:inset 0 0 0 1px var(--gl-line)}18%{box-shadow:inset 0 0 0 2px var(--lit),0 0 26px 4px rgba(255,200,60,.55)}100%{box-shadow:inset 0 0 0 1px var(--gl-line)}}

/* ── Large windows (html.pm-big: a window larger than an iPad mini, set by layout()) ─────────────────────────────────
   The cabinet is laid out from the window by bigPlan() and bigFit(): the maze takes the height or the width, whichever
   runs out first, and the room that is left holds the cabinet's panels (the score, this level's fruit and dots, the
   ghosts and their blue time, the high scores with this game's place among them, past games, the keys). Every part
   is placed by its left, top and width; sizes inside are in em, and the view's font size (--u) follows the maze's
   tiles, so the panels read at the maze's scale and the bar and sheets keep their own. Phones and the iPad mini
   never get this class, so they are exactly as they were. */
.pn{display:none;}
html.pm-big.ar-on #app{max-width:none;padding:0 0 var(--safe-b);}
html.pm-big .pm-view{display:block;position:relative;padding:0;font-size:calc(16px * var(--u,1));}
html.pm-big .pm-view[hidden]{display:none;}
html.pm-big .pm-view > *{position:absolute;margin:0;}
html.pm-big .pm-view > .off,html.pm-big .hint{display:none!important;}
html.pm-big .pn{display:block;padding:.75em .85em .8em;border-radius:1.1em;color:var(--text);background:var(--gl);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px var(--gl-line),var(--shadow-sm);}   /* (no live blur: only the page's plain sky lies behind a panel) */
html.pm-big .pn small,html.pm-big .pn-hd{font-size:.8em;font-weight:600;color:var(--text-2);white-space:nowrap;}
html.pm-big .bezel{padding:var(--bz,7px);border-radius:calc(var(--bz,7px) * 2.7);}
html.pm-big .scr{border-radius:calc(var(--bz,7px) * 1.8);}
html.pm-big .cab{width:auto;}
/* the scores: a block of plates at the side of the maze, or a row over it */
html.pm-big .hud{display:grid;gap:.5em;max-width:none!important;}
html.pm-big .hud.c2{grid-template-columns:1fr 1fr;}
html.pm-big .hud.c2 #p-score{grid-column:1 / -1;}
html.pm-big .hud.row{display:flex;gap:.45em;}
html.pm-big .plate{flex:1 1 0!important;padding:.5em .85em .55em;border-radius:.95em;align-items:flex-start;}
html.pm-big .plate small{font-size:.8em;}
html.pm-big .plate b{font-size:1.55em;}
html.pm-big .plate.sc b{font-size:2.5em;}
html.pm-big .hud.c1 .plate.sc b{font-size:2.1em;}
html.pm-big .hud.row .plate{align-items:center;padding:.3em .6em .35em;}
html.pm-big .hud.row .plate b,html.pm-big .hud.row .plate.sc b{font-size:1.45em;}
html.pm-big .hud.row .plate:nth-child(3){flex:.6 1 0!important;}
html.pm-low .plate{padding:.3em .8em .35em;}
html.pm-low .plate.sc b,html.pm-low .hud.c1 .plate.sc b{font-size:1.9em;}
html.pm-big .pbtn{width:auto;height:2.7em;border-radius:.95em;cursor:pointer;}
html.pm-big .hud.c2 .pbtn{grid-column:1 / -1;}
html.pm-big .hud.row .pbtn{width:3em;height:auto;}
html.pm-big .pbtn svg{width:1.4em;height:1.4em;}
html.pm-big .pbtn:hover{filter:brightness(1.25);}
html.pm-keys .pbtn{display:none;}
/* lives and the fruit of the levels so far: a plate at the foot of the column, or bare under the maze */
html.pm-big .strip{height:auto;max-width:none!important;padding:0 .4em;}
html.pm-side .strip{padding:.5em .8em;border-radius:.95em;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line),var(--shadow-sm);}
html.pm-big .padwrap{align-items:center;justify-content:center;}
/* this level's fruit, and the dots eaten with a fruit standing where it comes out */
.fr-top{display:flex;align-items:center;gap:.7em;}
.fr-top canvas{flex:none;display:block;}
.fr-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;}
.fr-tx b{font-weight:750;font-size:1.06em;white-space:nowrap;}
.fr-pt{flex:none;font-family:"Doto",ui-monospace,monospace;font-weight:900;font-size:1.7em;line-height:1;color:var(--lit);text-shadow:0 0 .5em var(--litg);}
#pn-fruit.live .fr-top canvas{animation:pm-hop .7s var(--ease) infinite alternate;}
@keyframes pm-hop{to{transform:translateY(-.22em) scale(1.08)}}
.dt{position:relative;height:1.95em;margin-top:.5em;}
.dt-bar{position:absolute;left:0;right:0;bottom:0;height:.46em;border-radius:1em;overflow:hidden;background:var(--well,rgba(0,0,0,.35));box-shadow:inset 0 0 0 1px var(--gl-line);}
.dt-bar i{display:block;height:100%;border-radius:inherit;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#ffb98a,#ffe2c8);transition:transform .25s var(--ease);}
.dt-mk{position:absolute;bottom:.5em;transform:translateX(-50%);transition:opacity .3s,filter .3s;}
.dt-mk canvas{display:block;}
.dt-mk::after{content:"";position:absolute;left:50%;bottom:-.5em;width:2px;height:.46em;margin-left:-1px;background:var(--text-3);opacity:.7;}
.dt-mk.due{opacity:.55;filter:saturate(.5);}
.dt-mk.on canvas{animation:pm-hop .7s var(--ease) infinite alternate;filter:drop-shadow(0 0 .35em var(--litg));}
.dt-mk.gone{opacity:.16;filter:saturate(0);}
.dt-mk i{position:absolute;right:-.42em;top:-.3em;width:.95em;height:.95em;border-radius:50%;display:none;place-items:center;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);box-shadow:0 0 .5em var(--litg);}
.dt-mk i svg{width:.62em;height:.62em;}
.dt-mk.got i{display:grid;animation:pop .35s var(--spring);}
.dt-row,.bl-row{display:flex;align-items:baseline;justify-content:space-between;gap:.6em;margin-top:.4em;}
.dt-row b,.bl-row b{font-size:.86em;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
/* the four ghosts as they are in the maze, what each one eaten is worth, and how long they stay blue */
.gh-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.2em;text-align:center;}
.gh-c canvas{display:block;margin:0 auto;}
.gh-c small{display:block;margin-top:.1em;font-size:.72em!important;}
.gh-lad{display:flex;align-items:center;justify-content:space-between;gap:.2em;margin-top:.6em;padding-top:.6em;border-top:1px solid var(--gl-line);}
.gh-lad canvas{flex:none;display:block;}
.gh-lad b{font-family:"Doto",ui-monospace,monospace;font-weight:900;font-size:1.08em;line-height:1;padding:.22em .32em;border-radius:.5em;color:var(--text-3);transition:color .2s,box-shadow .2s;}
.gh-lad b.next{color:var(--text);box-shadow:inset 0 0 0 1px rgba(63,227,255,.55);}
.gh-lad b.hit{color:#3fe3ff;text-shadow:0 0 .5em rgba(63,227,255,.65);}
.bl-bar{position:relative;height:.46em;margin-top:.35em;border-radius:1em;overflow:hidden;background:var(--well,rgba(0,0,0,.35));box-shadow:inset 0 0 0 1px var(--gl-line);}
.bl-bar i{position:absolute;inset:0;border-radius:inherit;transform-origin:0 50%;}
.bl-bar i.len{background:rgba(84,112,255,.3);}
.bl-bar i.now{background:linear-gradient(90deg,#2a46ff,#6f8aff);transform:scaleX(0);}
.bl-bar.end i.now{background:#eef0ff;}
/* the high scores, with this game's score in its place among them, and the games before this one */
.pn-hd{display:flex;align-items:center;justify-content:space-between;width:100%;margin:0;padding:0;border:0;background:none;font-family:inherit;text-align:left;cursor:pointer;transition:color .15s;}
.pn-hd svg{width:1.15em;height:1.15em;opacity:.55;transition:transform .15s var(--ease),opacity .15s;}
.pn-hd:hover{color:var(--text)!important;}
.pn-hd:hover svg{opacity:1;transform:translateX(2px);}
.hi-l,.pa-l{list-style:none;margin:.45em 0 0;padding:0;display:grid;gap:.25em;}
.hi-l li{display:grid;grid-template-columns:1.5em minmax(0,1fr) auto;align-items:center;gap:.5em;height:1.95em;padding:0 .65em 0 .4em;border-radius:.62em;background:var(--gl-3);box-shadow:inset 0 0 0 1px var(--gl-line);transition:transform .35s var(--ease);}
.hi-l li.gap{margin-top:.45em;}
.hi-l li i{font-style:normal;font-size:.74em;font-weight:700;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums;}
.hi-l li i.md{justify-self:center;display:grid;place-items:center;width:1.75em;height:1.75em;border-radius:50%;font-weight:800;color:#2b1a00;}
.hi-l li b{font-family:var(--display);font-weight:800;font-size:.98em;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hi-l li span{font-family:var(--display);font-weight:800;font-size:.98em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.hi-l li.mine b{color:var(--lit-ink);}
.hi-l li.now{color:var(--lit-ink);background:rgba(255,211,77,.13);box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.6),0 0 1em -.2em var(--litg);}
.hi-l li.now b{letter-spacing:0;font-family:var(--font);font-weight:750;}
.hi-l li.now i{color:var(--lit-ink);}
.hi-l li.up{animation:pm-up .7s var(--ease);}
@keyframes pm-up{0%{filter:brightness(1.9)}100%{filter:none}}
.pa-l li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:baseline;gap:.7em;height:1.8em;line-height:1.8em;padding:0 .65em;border-radius:.62em;background:var(--gl-3);box-shadow:inset 0 0 0 1px var(--gl-line);}
.pa-l.who li{grid-template-columns:4.6em minmax(0,1fr) auto auto;}
.pa-l li small{overflow:hidden;text-overflow:ellipsis;}
.pa-l li span{font-size:.86em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pa-l li em{font-style:normal;font-size:.8em;font-weight:600;color:var(--text-3);white-space:nowrap;}
.pa-l li b{min-width:3.6em;font-family:var(--display);font-weight:800;font-size:.95em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
#pn-past.nar .pa-l li em,#pn-tab.nar .tb-l li em{display:none;}
.tb-l{list-style:none;margin:.45em 0 0;padding:0;display:grid;gap:.25em;}
.tb-l li{display:grid;grid-template-columns:1.5em minmax(0,1fr) auto 3.4em;align-items:center;gap:.6em;height:1.8em;padding:0 .65em 0 .45em;border-radius:.62em;background:var(--gl-3);box-shadow:inset 0 0 0 1px var(--gl-line);transition:opacity .3s;}
.tb-l li canvas{display:block;}
.tb-l li b{font-size:.9em;font-weight:700;white-space:nowrap;}
.tb-l li em{font-style:normal;font-size:.8em;font-weight:600;color:var(--text-3);white-space:nowrap;}
.tb-l li span{font-family:var(--display);font-weight:800;font-size:.95em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.tb-l li.done{opacity:.42;}
.tb-l li.now{color:var(--lit-ink);background:rgba(255,211,77,.13);box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.6),0 0 1em -.2em var(--litg);}
.tb-l li.now em{color:var(--lit-ink);opacity:.8;}

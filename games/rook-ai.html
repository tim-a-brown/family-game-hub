<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rook</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
.stage{padding-bottom:calc(var(--safe-b) + 8px);}
/* Scoreboard strip: two paper score cards and the trump/bid marker */
.rk-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch;margin:2px 0 8px;}
.rk-team{position:relative;border-radius:10px;padding:5px 10px 4px;min-width:0;background:linear-gradient(180deg,#fffaf0,#f1e8d2);color:#2a2a3a;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 14px rgba(0,0,0,.35);}
.rk-team .nm{display:block;font-size:.72rem;font-weight:900;letter-spacing:.02em;line-height:1.15;color:#6a6a80;}
.rk-team .tot{font-family:var(--hand);font-size:1.7rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
.rk-team .now{position:absolute;right:8px;bottom:6px;font-family:var(--hand);font-size:1.05rem;color:#3a7d4a;}
.rk-team.us{border-left:5px solid var(--p1);}
.rk-team.them{border-left:5px solid var(--p2);}
.rk-team.bidding .nm{padding-right:24px;}
.rk-team.bidding::after{content:'BID';position:absolute;top:5px;right:7px;font-size:.6rem;font-weight:900;letter-spacing:.08em;color:#c8102e;}
.rk-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:84px;padding:4px 8px;border-radius:10px;background:var(--inset-2);}
.rk-mid .k{font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.rk-mid .v{display:flex;align-items:center;gap:5px;font-weight:900;font-size:.9rem;white-space:nowrap;}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7);}
/* Rook cards */
.pcard.rk{background:linear-gradient(160deg,#ffffff 0%,#fbf8f0 55%,color-mix(in srgb,var(--ink) 14%,#f4eedf) 100%);}
.pcard.rk::before{content:'';position:absolute;inset:5%;border-radius:calc(var(--cw) * .07);border:calc(var(--cw) * .025) solid color-mix(in srgb,var(--ink) 45%,transparent);}
.pcard.rk .ix{color:var(--ink);font-family:var(--display);font-weight:400;font-size:calc(var(--cw) * .27);left:9%;top:6%;letter-spacing:0;}
.pcard.rk .ix .star{width:calc(var(--cw) * .17);height:calc(var(--cw) * .17);margin-top:2px;}
.pcard.rk .big{font-size:calc(var(--cw) * .5);padding-left:calc(var(--cw) * .12);}
.pcard.rk .lbl{bottom:7%;left:auto;right:9%;width:auto;font-size:calc(var(--cw) * .13);}
.chand{--cw:clamp(60px,17vw,80px);}
.trumps button.blk{box-shadow:0 0 0 2px rgba(255,255,255,.55),0 4px 0 rgba(0,0,0,.35);}
.pcard.rk.trump{box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 0 0 2px var(--yellow),0 6px 14px rgba(0,0,0,.3);}
.pcard.rook{background:linear-gradient(160deg,#fdfbf6,#e9e3d3);}
.pcard.rook::before{content:'';position:absolute;inset:8% 10%;border-radius:calc(var(--cw) * .07);background:radial-gradient(circle at 50% 45%,#ffb340 0,#f07c1c 70%,#c9560c 100%);box-shadow:inset 0 0 0 calc(var(--cw) * .025) #1d1b2e;}
.pcard.rook .big{inset:6% 8% 18%;}
.pcard.rook .big svg{width:78%;height:auto;}
.pcard.rook .lbl{color:#fff;bottom:11%;font-size:calc(var(--cw) * .15);letter-spacing:.12em;text-shadow:0 1px 0 rgba(0,0,0,.4);}
.pcard.rook.trump{box-shadow:0 0 0 2px var(--yellow),0 6px 14px rgba(0,0,0,.3);}
.chand .pcard.new{box-shadow:0 0 0 3px var(--green),0 8px 18px rgba(0,0,0,.35);}
/* Nest in the middle of the table */
.nest{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;}
.nest .stack{position:relative;--cw:44px;width:calc(var(--cw) + 16px);height:calc(var(--cw) * 1.4);}
.nest .stack .pcard{position:absolute;top:0;}
.nest .cap{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);}
.cseat .say.bid{animation:none;}
.cseat .say.pass{color:#8a8796;}
.cseat .chip-s.bidder{background:#c8102e;color:#fff;}
.cseat .chip-s.mate{background:rgba(255,255,255,.25);color:#fff;}
/* Bid bar */
.bidbar{display:flex;align-items:center;gap:8px;width:100%;max-width:420px;}
.bidbar .amt{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:var(--r);background:rgba(0,0,0,.25);}
.bidbar .amt output{min-width:52px;text-align:center;font-family:var(--display);font-size:1.6rem;}
.bidbar .amt button{width:42px;height:42px;border:0;border-radius:12px;background:var(--surface-3);color:var(--text);font-weight:900;font-size:1.3rem;}
.bidbar .amt button:disabled{opacity:.3;}
.trumps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:420px;}
.trumps button{min-height:52px;border:0;border-radius:var(--r);color:#fff;font-weight:900;font-size:.95rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:0 4px 0 rgba(0,0,0,.35);}
.trumps button small{font-size:.72rem;opacity:.85;font-weight:800;}
.trumps button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.sum{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums;}
.sum th,.sum td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--w08);}
.sum th:first-child,.sum td:first-child{text-align:left;}
.sum th{font-size:.75rem;color:var(--text-3);font-weight:800;}
.sum td.big{font-weight:900;font-size:1.15rem;}
.sum td.neg{color:var(--red);}
.sum td.pos{color:var(--green);}
.verdict{font-weight:800;font-size:1.02rem;margin:2px 0 4px;}
/* iPad portrait: a bigger table and bigger cards to fill the room */
@media (min-width:700px) and (min-height:900px){
  .stage{max-width:720px;}
  .ctable .felt-in{height:clamp(440px,48dvh,580px);}
  .chand{--cw:92px;}
  .ctrick .pcard{--cw:84px;}
  .cseat .backs{--cw:30px;}
  .cseat .backs .pcard+.pcard{margin-left:-21px;}
  .cseat .tag{font-size:.95rem;}
  .cseat .tag .avatar{width:30px;height:30px;}
  .cseat .chip-s{font-size:.8rem;padding:2px 9px;}
  .nest .stack{--cw:58px;}
  .rk-team .nm{font-size:.8rem;}
  .rk-team .tot{font-size:2rem;}
  .rk-mid .v{font-size:1rem;}
  .bidbar,.trumps{max-width:520px;}
}
/* Landscape tablets and desktops: wider table so the hand fits in one row, and the felt
   shrinks so the bid and trump controls stay on screen */
@media (min-width:1000px) and (orientation:landscape){
  .stage{max-width:940px;}
  .ctable .felt-in{height:clamp(260px,calc(100dvh - 404px),460px);}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'rook_state', KEY = 'rook', PAD_KEY = 'rk', SEATS = ['s', 'w', 'n', 'e'];
  var COLS = ['r', 'y', 'g', 'b'];
  var CNAME = { r: 'Red', y: 'Yellow', g: 'Green', b: 'Black' };
  var CHEX = { r: '#d42a3c', y: '#d99a00', g: '#1d9a52', b: '#22202f' };
  var RANKS = [1, 14, 13, 12, 11, 10, 9, 8, 7, 6, 5];       // 2s, 3s and 4s are out
  var MIN_BID = 100, MAX_BID = 180, TOTAL = 180;
  var BIRD = '<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="#1d1b2e">' +
    '<path d="M4 44 L20 36 L22 41 L8 50 Z"/>' +                                         // tail
    '<path d="M16 38 C18 28 28 23 38 24 C40 18 44 14 50 15 C54 16 56 19 56 21 L62 23 L56 25 C55 30 52 33 48 35 C46 42 38 47 28 47 C22 47 18 44 16 38 Z"/>' + // body + head
    '<path d="M27 47 L25 57 M25 57 L21 58 M25 57 L28 59 M35 46 L36 56 M36 56 L32 58 M36 56 L40 57" stroke="#1d1b2e" stroke-width="2.4" stroke-linecap="round" fill="none"/>' +
    '</g><path d="M22 36 C28 30 36 30 42 33 C36 34 30 37 26 41 Z" fill="#4a4660"/>' +    // wing
    '<circle cx="50" cy="20" r="2" fill="#fff"/><circle cx="50.4" cy="20" r="1" fill="#1d1b2e"/></svg>';

  var STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 5.9 6.6 1-4.8 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.5 9.4l6.6-1z"/></svg>';

  Kit.init({
    orient: 'portrait',   // phones: sideways leaves no room (the hand or board falls below the screen); tablets turn freely
    id: 'rook',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: 'Scores so far', onClick: function () { if (S && S.players) showScores(false); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { keys: [PAD_KEY], title: 'Rook: past games' }); } }
    ]),
    rules:
      '<p class="goal">You and your partner (sitting across from you) team up against the other two. Win the bid, pick trump, and capture the point cards. <b>First team to 500 wins.</b></p>' +
      '<h3>The cards</h3><p>Four colors (red, yellow, green, black) numbered 1 and 5 to 14 (the 2s, 3s and 4s are taken out), plus the <b>Rook</b> bird card. In each color the <b>1 is highest</b>, then 14, 13 and so on down to 5.</p>' +
      '<h3>Point cards</h3><ul><li><b>Rook:</b> 20</li><li><b>1s:</b> 15 each</li><li><b>14s and 10s:</b> 10 each</li><li><b>5s:</b> 5 each</li></ul><p>That is 180 points in every hand.</p>' +
      '<h3>Dealing and bidding</h3><ul><li>Everyone gets 10 cards. Five cards go face down in the middle: the <b>nest</b>.</li>' +
      '<li>Starting left of the dealer, each player bids how many points their team will capture, or passes. Bids start at <b>100</b> and go up by 5 (up to 180). Once you pass, you are out of the bidding.</li>' +
      '<li>If everyone passes, the cards are dealt again.</li></ul>' +
      '<h3>The nest and trump</h3><p>The high bidder picks up the nest, puts any 5 cards back face down, and then names the <b>trump color</b>. The <b>Rook is the highest trump</b>, even above the trump 1.</p>' +
      '<h3>Playing</h3><ul><li>The player left of the dealer leads the first trick. The winner of each trick leads the next.</li>' +
      '<li>You must <b>follow the color that was led</b> if you can. The Rook counts as a trump card, so you play it when trump is led or when you cannot follow.</li>' +
      '<li>If you cannot follow, play anything, including trump.</li>' +
      '<li>The highest trump wins the trick. If no trump was played, the highest card of the led color wins.</li>' +
      '<li>Whoever wins the <b>last trick</b> also gets the 5 cards in the nest, with any points in it.</li></ul>' +
      '<h3>Scoring</h3><ul><li>If the bidding team captures at least its bid, it scores every point it took.</li>' +
      '<li>If not, it is <b>set</b>: the bid is subtracted from its score.</li>' +
      '<li>The other team always scores the points it took.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b>, beside the start button, opens a table that the others join on their own devices. Partners sit the way you seated them in the setup, and anyone else who joins takes an open seat. The computer plays every seat that nobody takes.</li>' +
      '<li>Bid and play whenever it’s your turn. The home screen shows when it’s your move, and each new hand deals itself.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null, token = 0, undoStack = [];
  var NET = null;   // the online table while playing at one (see Online below)
  // Pass & play: ME is the seat drawn at the bottom with its hand face up (the person holding the device, S.me);
  // BLIND hides every hand while the device is handed over. One person among robots never sees the cover.
  var ME = 0, BLIND = false;
  function posOf(p) { return SEATS[(p - ME + 4) % 4]; }
  function MT() { return ME % 2; }
  function person(p) { return p >= 0 && !!S.players[p] && !S.players[p].cpu; }
  function onePerson() { return !!NET || !S || S.players.filter(function (q) { return !q.cpu; }).length < 2; }
  function showFor(p) { BLIND = false; ME = p; S.me = p; save(); render(); }
  function gate(p, then) {
    if (NET || !person(p) || p === ME) { then && then(); return; }
    BLIND = true; undoStack = []; render();
    var t = token;
    Kit.handoff({ name: S.players[p].name, color: Kit.color(p % 2), what: 'cards' }).then(function () {
      if (t !== token || !S) return;
      showFor(p); then && then();
    });
  }
  // whose move it is right now, if a person's
  function actor() {
    if (S.phase === 'bid' || S.phase === 'play') return S.turn;
    if (S.phase === 'nest' || S.phase === 'trump') return S.bidder;
    return -1;
  }
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'over') Kit.resume.set('Hand ' + S.round + ' · ' + S.scores[0] + ' to ' + S.scores[1]);
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  function showSetup() {
    S = null; token++; BLIND = false; ME = 0; Kit.handoff.close();
    Kit.setup(app, {
      modes: Kit.modes(['cpu', 'local']),
      players: { min: 4, max: 4, cpu: function (m) { return m === 'cpu' ? 'seats' : m === 'local' ? 'mix' : false; }, teams: [[0, 2], [1, 3]] },
      intro: 'You and a computer partner against two computers',
      options: [{ id: 'target', label: 'Play to', help: 'The first team to reach this many points wins.', value: 500, choices: [[300, '300 · quick'], [500, '500 · standard']] },
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: LEVELS }],
      onStart: function (cfg) {
        S = freshGame(+cfg.options.target || 500, cfg.players.map(function (p) { return { name: p.name, cpu: !!p.cpu, level: p.cpu && p.level ? lvName(p.level) : undefined }; }), cfg.mode, cfg.options.level);   // (each robot its own skill at a mixed table)
        ME = 0; undoStack = []; newHand();
      }
    });
  }
  // The computer's skill. Normal is how it has always played; a game saved before there were levels plays Normal.
  var LEVELS = [['easy', 'Easy', 'Bids by guesswork and often plays the wrong card.'],
    ['normal', 'Normal', 'Bids what its hand is worth and keeps track of the high cards.'],
    ['hard', 'Hard', 'Remembers every card played and thinks each play through.']];
  function lvName(v) { return v === 'easy' || v === 'hard' ? v : 'normal'; }
  function lvOf(p) { var pl = S.players && S.players[p]; return lvName((pl && pl.level) || S.level); }
  function freshGame(target, players, mode, level) {
    return {
      mode: mode || 'cpu', me: 0, level: lvName(level), target: target, players: players, scores: [0, 0], round: 0, rounds: [], dealer: 3, started: Date.now(),
      events: [], rookCaps: [0, 0, 0, 0], made: [0, 0], set: [0, 0], bestMade: null
    };
  }
  function teamName(t) { return S.players[t].name + ' & ' + S.players[t + 2].name; }
  function teamAnd(t) { return S.players[t].name + ' and ' + S.players[t + 2].name; }
  function shortName(p) { return p === ME && onePerson() ? 'You' : S.players[p].name; }

  // ── Cards ─────────────────────────────────────────────────────────────────
  function deck() {
    var d = [];
    COLS.forEach(function (c) { RANKS.forEach(function (r) { d.push({ id: c + r, c: c, r: r }); }); });
    d.push({ id: 'rook', c: 'x', r: 0, rook: true });
    return d;
  }
  var ALL = deck();
  function pts(c) { return c.rook ? 20 : c.r === 1 ? 15 : (c.r === 14 || c.r === 10) ? 10 : c.r === 5 ? 5 : 0; }
  function rv(c) { return c.rook ? 16 : c.r === 1 ? 15 : c.r; }
  function eff(c) { return c.rook ? S.trump : c.c; }               // the Rook belongs to trump
  function power(c, led) { return c.rook ? 200 : c.c === S.trump ? 100 + rv(c) : c.c === led ? rv(c) : 0; }
  function sumPts(a) { return a.reduce(function (s, c) { return s + pts(c); }, 0); }
  function find(h, id) { for (var i = 0; i < h.length; i++) if (h[i].id === id) return i; return -1; }
  function team(p) { return p % 2; }
  function sortHand(h) {
    var order = COLS.slice();
    if (S && S.trump) { order = order.filter(function (c) { return c !== S.trump; }); order.unshift(S.trump); }
    // alternate dark/light colours so neighbours never look alike
    return h.sort(function (a, b) {
      var ca = a.rook ? (S && S.trump ? S.trump : 'z') : a.c, cb = b.rook ? (S && S.trump ? S.trump : 'z') : b.c;
      var ia = ca === 'z' ? 9 : order.indexOf(ca), ib = cb === 'z' ? 9 : order.indexOf(cb);
      return ia - ib || rv(b) - rv(a);
    });
  }
  // Your hand on screen (display only). Color: trump first, the Rook with
  // trump, high to low. Number: high to low across colors, the Rook first.
  var sortT = Cards.sortToggle(null, {
    key: 'rook_sort', modes: ['color', { id: 'rank', label: 'Number' }], value: 'color',
    flip: function () { return handEl; }, onChange: function () { if (S && handEl) paintHand(); }
  });
  function view(h) {
    var a = h.slice();
    if (sortT.get() !== 'rank') return sortHand(a);
    var order = COLS.slice();
    if (S.trump) { order = order.filter(function (c) { return c !== S.trump; }); order.unshift(S.trump); }
    return Cards.sortBy(a, 'rank', { rank: function (x, y) { return rv(y) - rv(x) || order.indexOf(x.c) - order.indexOf(y.c); } });
  }
  function cardEl(c, o) {
    o = o || {};
    var n;
    if (c.rook) n = Kit.cardFace({ html: BIRD, label: 'Rook', cls: 'rook', aria: 'The Rook, 20 points' });
    else {
      n = Kit.cardFace({ rank: String(c.r), corner: false, color: CHEX[c.c], label: pts(c) ? pts(c) + ' pts' : '', cls: 'rk', aria: CNAME[c.c] + ' ' + c.r + (pts(c) ? ', ' + pts(c) + ' points' : '') });
      n.insertAdjacentHTML('afterbegin', '<span class="ix">' + c.r + (pts(c) ? STAR : '') + '</span>');
    }
    if (S && S.trump && (c.rook || c.c === S.trump) && o.trumpRing !== false) n.classList.add('trump');
    if (o.cls) o.cls.split(' ').forEach(function (k) { if (k) n.classList.add(k); });
    n.dataset.id = c.id;
    return n;
  }

  // ── Dealing ───────────────────────────────────────────────────────────────
  function newHand() {
    S.round++;
    S.dealer = (S.dealer + 1) % 4;
    var d = Cards.shuffle(deck());
    S.hands = [[], [], [], []];
    for (var i = 0; i < 40; i++) S.hands[i % 4].push(d[i]);
    S.nest = d.slice(40); S.dtNe = ids(S.nest);
    S.trump = null; S.bidder = -1; S.bid = 0; S.high = 0;
    S.bids = [null, null, null, null];              // null = not yet, 0 = passed, n = last bid
    S.taken = [[], []]; S.tricks = [0, 0, 0, 0]; S.trick = []; S.trickNo = 0; S.played = []; S.discards = []; S.vd = [{}, {}, {}, {}];
    S.sel = []; S.fromNest = [];
    S.turn = (S.dealer + 1) % 4; S.leader = S.turn;
    S.hands.forEach(sortHand);
    S.phase = 'bid';
    clearUndo(); save(); render(); Kit.sfx('deal');
    step();
  }

  // ── Main loop: schedule whatever the computer needs to do next ────────────
  function step() {
    if (!S) return;
    // a different person's move: hands down, pass the device, then carry on as them
    var a = actor();
    if (person(a) && a !== ME) { gate(a, step); return; }
    paintAll();
    var t = token;
    function later(fn, ms) { setTimeout(function () { if (t === token && S) fn(); }, ms); }
    if (S.phase === 'bid' && S.players[S.turn].cpu) later(function () { if (S.phase === 'bid' && S.players[S.turn].cpu) placeBid(S.turn, cpuBid(S.turn)); }, 750);
    else if (S.phase === 'nest' && S.players[S.bidder].cpu) later(cpuNest, 900);
    else if (S.phase === 'nest' && S.bidder === ME && !S.fromNest.length && S.nest.length) later(takeNest, 200);
    else if (S.phase === 'play' && S.turn >= 0 && S.players[S.turn].cpu) later(function () { if (S.phase === 'play' && S.turn >= 0 && S.players[S.turn].cpu) play(S.turn, cpuChoose(S.turn)); }, 700);
  }

  // ── Bidding ───────────────────────────────────────────────────────────────
  function nextBid() { return S.high ? S.high + 5 : MIN_BID; }
  function placeBid(p, amt) {
    if (NET) { if (p === ME) netAct(function (st, me) { return nBid(st, me, amt); }); return; }
    if (S.phase !== 'bid' || S.turn !== p) return;
    if (amt && (amt < nextBid() || amt > MAX_BID)) amt = 0;
    S.bids[p] = amt;
    if (amt) { S.high = amt; S.bidder = p; Kit.sfx('chip'); }
    else Kit.sfx('tap');
    seatSay(p, amt ? String(amt) : 'Pass', !amt);
    var active = [0, 1, 2, 3].filter(function (q) { return S.bids[q] !== 0; });
    if (!active.length) {                            // everyone passed

      st.events.push({ pr: 6 + st.bid / 100, t: who + ' went set on a bid of ' + st.bid + ' in hand ' + st.round + ' (took ' + cap[bt] + ')' });
    }
    st.last = { bt: bt, cap: cap, delta: delta, made: made, bid: st.bid, bidder: st.bidder, trump: st.trump, nest: sumPts(st.discards), round: st.round };
    var hl = { b: st.bidder, bid: st.bid, t: st.trump, c0: cap[0], c1: cap[1], m: made ? 1 : 0, n: sumPts(st.discards), rk: st.rkBy == null ? -1 : st.rkBy,
      w: st.tricks.join('.'), s: st.scores.join('.'), bs: st.bids.map(function (b) { return b || 0; }).join('.'), lt: st.leader, ya: st.dtA || null };
    if (st.dtA) { hl.bh = st.dtA[st.bidder]; hl.ne = st.dtNe || ''; hl.bu = ids(st.discards); }
    (st.hlog = st.hlog || []).push(hl);
    st.rkBy = null;
    if ((st.scores[0] >= st.target || st.scores[1] >= st.target) && st.scores[0] !== st.scores[1]) {
      st.phase = 'over'; st.turn = -1; st.winner = st.scores[0] > st.scores[1] ? 0 : 1; st.series[st.winner]++;
    } else nDeal(st);
  }
  function netTurn(st) {
    if (!st || !st.at || st.phase === 'over') return [];
    if (st.phase === 'nest' || st.phase === 'trump') return [st.at[st.bidder]];
    return st.turn >= 0 && (st.phase === 'bid' || st.phase === 'play') ? [st.at[st.turn]] : [];
  }
  function netOver(st) {
    if (!st || st.phase !== 'over') return null;
    var w = st.winner;
    return { win: [st.at[w], st.at[w + 2]], text: st.players[w].name + ' & ' + st.players[w + 2].name + ' win ' + st.scores[w] + ' to ' + st.scores[1 - w] };
  }
  // A computer seat (or a person who left): the computer player above. With the nest it buries and names trump at once.
  function netBot(st, seat) {
    var p = st.pos[seat];
    var mv = withS(st, function () {
      if (st.phase === 'bid' && st.turn === p) return nBid(st, p, cpuBid(p));
      if (st.phase === 'nest' && st.bidder === p) {
        var plan = nestPlan(p, st.hands[p]);
        if (!nBury(st, p, plan.bury.map(function (c) { return c.id; }))) return null;
        var m = nTrump(st, p, plan.col); if (m) m.nest = 1;
        return m;
      }
      if (st.phase === 'trump' && st.bidder === p) return nTrump(st, p, handValue(st.hands[p]).col);
      if (st.phase === 'play' && st.turn === p) return nPlay(st, p, cpuChoose(p).id);
      return null;
    });
    return mv ? { state: st, mv: mv } : null;
  }
  function netAct(f) {
    if (!NET || NBUSY) return;
    if (!NET.myTurn()) { Kit.haptic('error'); return; }
    var me = ME;
    NET.act(function (st) { var mv = withS(st, function () { return f(st, me); }); return mv ? { state: st, mv: mv } : null; });
  }
  function netFly(id) { var n = handEl && handEl.querySelector('[data-id="' + id + '"]'); NFLY = n ? { id: id, r: n.getBoundingClientRect() } : null; }
  // What this device draws: its own hand face up, the others as card backs, the nest and the buried cards face down
  function netView(st) {
    var mine = !!NET && NET.seat >= 0, V = JSON.parse(JSON.stringify(st)), seats = NET ? NET.seats : [];
    ME = mine ? st.pos[NET.seat] : 0;
    V.hands = V.hands.map(function (h, q) { return q === ME && mine ? h : h.map(function () { return {}; }); });
    V.nest = V.nest.map(function () { return {}; });
    if (!(mine && ME === st.bidder)) { V.discards = []; V.fromNest = []; }
    V.dtA = null; V.dtNe = '';
    var have = {}; (V.hands[ME] || []).forEach(function (c) { have[c.id] = 1; });
    NSEL = st.phase === 'nest' && mine && ME === st.bidder ? NSEL.filter(function (id) { return have[id]; }) : [];
    V.sel = NSEL;
    V.players = V.players.map(function (pl, q) { var s = seats[st.at[q]]; return { name: pl.name, cpu: s ? !!s.bot : pl.cpu }; });
    return V;
  }
  function netShow(net, info) {
    NET = net; NST = net.state;
    if (info.fresh || info.again) { NQ = []; NGEN++; NBUSY = false; netCloseOv(); }
    NQ.push({ st: JSON.parse(JSON.stringify(net.state)), prev: info.prev ? JSON.parse(JSON.stringify(info.prev)) : null, mv: info.mv, info: info });
    if (NQ.length > 6) NQ = NQ.slice(-1).map(function (x) { x.skip = true; return x; });   // far behind: jump to now
    if (!NBUSY) netPump();
  }
  function netPump() {
    var it = NQ.shift(); if (!it) return;
    var g = NGEN; NBUSY = true;
    netStep(it, function () {
      if (g !== NGEN) return;
      NBUSY = false;
      if (NQ.length) netPump();
      else if (NET && S) paintAll();
    });
  }
  function netStep(it, done) {
    var st = it.st, prev = it.prev, mv = it.mv, info = it.info, g = NGEN;
    function later(f, ms) { setTimeout(function () { if (g === NGEN && NET) f(); }, ms); }
    token++;
    if (!mv || !prev || info.fresh || info.again || it.skip || !prev.hands) {
      S = netView(st); render();
      if (info.again) { Kit.gameStart(); Kit.sfx('deal'); Kit.callout('New game'); }
      else if (info.fresh) { Kit.gameStart(); if (st.phase !== 'over') Kit.sfx('deal'); }
      if (st.phase === 'over') later(netEnd, info.fresh ? 300 : 900);
      done(); return;
    }
    if (mv.k === 'bid') {
      if (mv.won) {   // the bid is won: the nest goes to the bidder
        S = netView(prev); S.bids[mv.p] = mv.b; render();
        seatSay(mv.p, mv.b ? String(mv.b) : 'Pass', !mv.b);
        Kit.sfx(mv.b ? 'chip' : 'tap');
        var r = nestEl && !nestEl.hidden ? nestEl.getBoundingClientRect() : null;
        later(function () {
          S = netView(st); render();
          Kit.callout(shortName(st.bidder) + ' ' + (shortName(st.bidder) === 'You' ? 'win' : 'wins') + ' the bid: ' + st.bid);
          if (team(st.bidder) === MT()) Kit.haptic('success');
          Kit.sfx('deal');
          if (st.bidder === ME && r) S.fromNest.forEach(function (id, i) {
            var n = handEl.querySelector('[data-id="' + id + '"]');
            if (n) setTimeout(function () { Cards.fly(n, { getBoundingClientRect: function () { return r; } }, { ms: 450 }); }, i * 70);
          });
          else if (r) seatSay(st.bidder, 'Takes the nest');
          later(done, 900);
        }, 700);
        return;
      }
      S = netView(st); render();
      seatSay(mv.p, mv.b ? String(mv.b) : 'Pass', !mv.b);
      Kit.sfx(mv.b ? 'chip' : 'tap');
      if (mv.redeal) { Kit.toast('Everyone passed. New deal.'); Kit.sfx('deal'); }
      later(done, mv.redeal ? 900 : 450); return;
    }
    if (mv.k === 'bury') { S = netView(st); render(); Kit.sfx('whoosh'); later(done, 400); return; }
    if (mv.k === 'trump') {
      S = netView(st); render();
      if (mv.nest) seatSay(mv.p, 'Takes the nest');
      Kit.callout(CNAME[st.trump] + ' is trump', CHEX[st.trump] === '#22202f' ? '#fff' : CHEX[st.trump]);
      Kit.sfx('good');
      later(done, 900); return;
    }
    // a card: check it follows from what's on screen, otherwise just draw the table as it is now
    var ok = mv.k === 'play' && prev.phase === 'play' && prev.turn === mv.p && find(prev.hands[mv.p], mv.c.id) >= 0;
    if (!ok) { S = netView(st); render(); if (st.phase === 'over') later(netEnd, 600); done(); return; }
    var fromRect = NFLY && NFLY.id === mv.c.id ? NFLY.r : null; NFLY = null;
    function fly(node) {
      var from = fromRect && mv.p === ME ? { getBoundingClientRect: function () { return fromRect; } } : seatEls[mv.p] && seatEls[mv.p].querySelector('.tag');
      Cards.fly(node, from, { ms: 340 });
      if (mv.c.rook) { Kit.sfx('pop'); Kit.haptic('medium'); } else Kit.sfx('flip');
      if (mv.cut) flash(shortName(mv.p) + (shortName(mv.p) === 'You' ? ' trump it!' : ' trumps it!'));
    }
    if (mv.w == null) {
      S = netView(st); render();
      fly(trickEl.querySelector('[data-id="' + mv.c.id + '"]'));
      later(done, 380); return;
    }
    // the last card of a trick: show it land, light the winner, sweep the trick to them
    var V = netView(prev);
    V.hands[mv.p] = V.hands[mv.p].filter(function (c, i) { return mv.p === ME ? c.id !== mv.c.id : i > 0; });
    V.trick = mv.t; V.turn = -1;
    S = V; render();
    fly(trickEl.querySelector('[data-id="' + mv.c.id + '"]'));
    later(function () {
      var wc = mv.t.filter(function (x) { return x.p === mv.w; })[0], wn = wc && trickEl.querySelector('[data-id="' + wc.c.id + '"]');
      if (wn) wn.classList.add('win');
      if (mv.got) seatSay(mv.w, '+' + mv.got + (mv.nest > 0 ? ' with nest' : ''));
      if (mv.rook) Kit.callout(shortName(mv.w) + (shortName(mv.w) === 'You' ? ' catch' : ' catches') + ' the Rook!');
      if (team(mv.w) === MT() && mv.got) Kit.haptic('light');
      if (mv.nest) flash((shortName(mv.w) === 'You' ? 'You take' : st.players[mv.w].name + ' takes') + ' the nest');
      later(function () {
        var dest = seatEls[mv.w].querySelector('.tag').getBoundingClientRect(), box = trickEl.getBoundingClientRect();
        Array.prototype.forEach.call(trickEl.children, function (n) {
          n.style.transition = 'transform .35s ease-in, opacity .35s ease-in';
          n.style.transform = 'translate(' + (dest.left - box.left - 30) + 'px,' + (dest.top - box.top - 30) + 'px) scale(.4)';
          n.style.opacity = '0';
        });
        Kit.sfx('whoosh');
        later(function () {
          trickEl.innerHTML = '';
          if (!mv.end) { S = netView(st); render(); done(); return; }
          netHandEnd(st, done);
        }, 380);
      }, mv.nest ? 1100 : 750);
    }, 850);
  }
  // A hand just finished: its score, then the next deal (already dealt underneath) or the end
  function netHandEnd(st, done) {
    var L = st.last, g = NGEN;
    S = netView(st); render();
    var mine = L.bt === MT();
    if (L.made) Kit.sfx(mine ? 'good' : 'tick'); else Kit.sfx(mine ? 'bad' : 'good');
    if (st.phase === 'over') { setTimeout(function () { if (g === NGEN && NET) netEnd(); }, 600); done(); return; }
    Kit.sfx('deal');
    setTimeout(function () {
      if (g !== NGEN || !NET) return;
      netCloseOv();
      NOV = showScores(true, function () { NOV = null; });
    }, 500);
    done();
  }
  function netEnd() {
    if (!NET || !NST || NST.phase !== 'over') return;
    var st = NST, w = st.winner, key = NET.code + ':' + st.started;
    var V = netView(st); S = V;
    var done = []; try { done = JSON.parse(localStorage.getItem('rook_netrec')) || []; } catch (e) {}
    if (NET.seat >= 0 && !NREC[key] && done.indexOf(key) < 0) {
      NREC[key] = 1;
      try { localStorage.setItem('rook_netrec', JSON.stringify(done.concat([key]).slice(-20))); } catch (e) {}
      var me = ME, hl = st.events.slice().sort(function (a, b) { return b.pr - a.pr; }).map(function (e) { return e.t; });
      if (st.bestMade && hl.indexOf(st.bestMade.t) < 0) hl.unshift(st.bestMade.t);
      hl = hl.slice(0, 4);
      var rc = st.rookCaps.indexOf(Math.max.apply(null, st.rookCaps));
      if (st.rookCaps[rc] > 1) hl.push(st.players[rc].name + ' caught the Rook ' + st.rookCaps[rc] + ' times');
      hl.push(st.rounds.length + ' hands, played to ' + st.target);
      var teams = [0, 1].map(function (k) { return { name: teamName(k), score: st.scores[k], cpu: !!V.players[k].cpu && !!V.players[k + 2].cpu }; });
      Kit.record(KEY, {
        started: st.started, mode: 'Online',
        players: teams, winner: teams[w].name,
        rounds: { labels: st.rounds.map(function (r, i) { return 'H' + (i + 1); }), scores: st.rounds },
        highlights: hl,
        meta: { teams: [[st.players[0].name, st.players[2].name], [st.players[1].name, st.players[3].name]] },
        detail: { pl: st.players.map(function (p) { return p.name; }), target: st.target, made: st.made.slice(), set: st.set.slice(), rook: st.rookCaps.slice(),
          h: (st.hlog || []).map(function (x) { var o = {}; for (var k in x) if (k !== 'ya') o[k] = x[k]; if (x.ya && x.b !== me && x.ya[me]) o.yh = x.ya[me]; return o; }) }
      });
    }
    var watching = NET.seat < 0, res = NET.result, left = res && res.left != null, won = !watching && w === MT();
    netCloseOv();
    NOV = Kit.win({
      title: left ? res.text : won ? 'Your team wins!' : teamAnd(w) + ' win',
      sub: won ? 'You and ' + st.players[(ME + 2) % 4].name + ' won ' + st.scores[w] + ' to ' + st.scores[1 - w] : 'They won ' + st.scores[w] + ' to ' + st.scores[1 - w],
      rank: [w, 1 - w].map(function (k) { return { name: teamName(k), score: st.scores[k], color: Kit.color(k) }; }),
      lose: !won, icon: won ? 'trophy' : 'users',
      againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { if (left) { TurnNet.leave(); TurnNet.open(); } else NET.again(); },
      closeLabel: 'Back to games'
    });
  }
  function netLeave() {
    NET = null; NST = null; NQ = []; NGEN++; NBUSY = false; token++; NSEL = [];
    netCloseOv();
    boot();
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  function boot() {
    var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (saved && saved.players && saved.hands && saved.phase !== 'over') {
      S = saved; ME = S.me || 0; Kit.gameStart();
      render();
      if (S.phase === 'play' && S.trick.length === 4) setTimeout(resolveTrick, 600);
      else if (S.phase === 'nest' && S.players[S.bidder].cpu && S.nest.length === 0) { var t0 = token; setTimeout(function () { if (t0 === token && S.phase === 'nest') { S.trump = handValue(S.hands[S.bidder]).col; startPlay(); } }, 600); }
      else step();
    } else showSetup();
  }
  boot();
  TurnNet.setup({
    game: 'rook', title: 'Rook', min: 2, max: 4, botMs: 900,
    seats: function () { return 4; },
    opts: netOpts, start: netStart, turn: netTurn, over: netOver, bot: netBot,
    show: netShow, leave: netLeave
  });
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rook</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
.stage{padding-bottom:max(calc(var(--safe-b) + 8px),18px);}
/* Scoreboard strip: two paper score cards and the trump/bid marker */
.rk-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch;margin:2px 0 8px;}
.rk-team{position:relative;border-radius:15px;padding:6px 10px 5px 13px;min-width:0;background:var(--gl);color:var(--text);box-shadow:inset 0 0 0 1px var(--gl-line),0 10px 22px -16px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden;}
.rk-team .nm{display:block;font-size:.76rem;font-weight:650;line-height:1.15;color:var(--text-2);}
.rk-team .tot{font-family:var(--display);font-size:1.6rem;line-height:1.05;color:var(--text);font-variant-numeric:tabular-nums;}
.rk-team.us .tot{color:var(--lit-ink);}
.rk-team .now{position:absolute;right:9px;bottom:7px;font-size:.86rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;}
.rk-team::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--p2);}
.rk-team.us::before{background:var(--p1);}
.rk-team.bidding .nm{padding-right:26px;}
.rk-team.bidding::after{content:'Bid';position:absolute;top:6px;right:9px;font-size:.72rem;font-weight:750;color:var(--bad-ink);}
.rk-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:84px;padding:4px 8px;border-radius:15px;background:var(--well);box-shadow:inset 0 0 0 1px var(--gl-line);}
.rk-mid .k{font-size:.74rem;font-weight:650;color:var(--text-3);white-space:nowrap;}
.rk-mid .v{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.92rem;white-space:nowrap;}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7);}
/* Rook cards */
.pcard.rk{background:linear-gradient(160deg,#ffffff 0%,#fbf8f0 55%,color-mix(in srgb,var(--ink) 14%,#f4eedf) 100%);}
.pcard.rk::before{content:'';position:absolute;inset:5%;border-radius:calc(var(--cw) * .07);border:calc(var(--cw) * .025) solid color-mix(in srgb,var(--ink) 45%,transparent);}
.pcard.rk .ix{color:var(--ink);font-family:var(--display);font-weight:400;font-size:calc(var(--cw) * .27);left:9%;top:6%;letter-spacing:0;}
.pcard.rk .ix .star{width:calc(var(--cw) * .17);height:calc(var(--cw) * .17);margin-top:2px;}
.pcard.rk .big{font-size:calc(var(--cw) * .5);padding-left:calc(var(--cw) * .12);}
.pcard.rk .lbl{bottom:7%;left:auto;right:9%;width:auto;font-size:calc(var(--cw) * .13);}
.chand{--cw:clamp(60px,17vw,80px);}
.trumps button.blk{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5),0 10px 22px -12px rgba(0,0,0,.8);}
.pcard.rk.trump{box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 0 0 2px var(--yellow),0 6px 14px rgba(0,0,0,.3);}
.pcard.rook{background:linear-gradient(160deg,#fdfbf6,#e9e3d3);}
.pcard.rook::before{content:'';position:absolute;inset:8% 10%;border-radius:calc(var(--cw) * .07);background:radial-gradient(circle at 50% 45%,#ffb340 0,#f07c1c 70%,#c9560c 100%);box-shadow:inset 0 0 0 calc(var(--cw) * .025) #1d1b2e;}
.pcard.rook .big{inset:6% 8% 18%;}
.pcard.rook .big svg{width:78%;height:auto;}
.pcard.rook .lbl{color:#fff;bottom:11%;font-size:calc(var(--cw) * .15);letter-spacing:.12em;text-shadow:0 1px 0 rgba(0,0,0,.4);}
.pcard.rook.trump{box-shadow:0 0 0 2px var(--yellow),0 6px 14px rgba(0,0,0,.3);}
.chand .pcard.new{box-shadow:0 0 0 3px var(--green),0 8px 18px rgba(0,0,0,.35);}
/* Nest in the middle of the table */
.nest{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;}
.nest .stack{position:relative;--cw:44px;width:calc(var(--cw) + 16px);height:calc(var(--cw) * 1.4);}
.nest .stack .pcard{position:absolute;top:0;}
.nest .cap{font-size:.8rem;font-weight:650;color:rgba(255,255,255,.72);}
.cseat .say.bid{animation:none;}
.cseat .say.pass{color:#8a8796;}
.cseat .chip-s.bidder{background:#c8102e;color:#fff;}
.cseat .chip-s.mate{background:rgba(255,255,255,.25);color:#fff;}
/* Bid bar */
.bidbar{display:flex;align-items:center;gap:8px;width:100%;max-width:420px;}
.bidbar .amt{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:var(--r);background:var(--well);box-shadow:inset 0 0 0 1px var(--gl-line);}
.bidbar .amt output{min-width:52px;text-align:center;font-family:var(--display);font-size:1.6rem;}
.bidbar .amt button{width:42px;height:42px;border:0;border-radius:13px;background:var(--gl-2);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text);font-weight:800;font-size:1.3rem;transition:transform .12s;}
.bidbar .amt button:active:not(:disabled){transform:scale(.92);}
.bidbar .amt button:disabled{opacity:.3;}
@media (max-width:359px){ .bidbar{gap:6px;} .bidbar > .btn{padding:0 12px;min-width:0;} .bidbar .amt{gap:2px;} .bidbar .amt button{width:34px;} .bidbar .amt output{min-width:42px;font-size:1.35rem;} }   /* (a 320-wide phone: Pass, the amount and Bid all fit) */
.rk-mid .w{font-size:.74rem;font-weight:600;color:var(--text-2);white-space:nowrap;}
.trumps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:420px;}
.trumps button{min-height:52px;border:0;border-radius:var(--r);color:#fff;font-weight:800;font-size:.95rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 22px -12px rgba(0,0,0,.8);transition:transform .12s,filter .15s;}
.trumps button small{font-size:.74rem;opacity:.85;font-weight:650;}
.trumps button:active{transform:translateY(1px) scale(.975);filter:brightness(.94);}
.sum{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums;}
.sum th,.sum td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--w08);}
.sum th:first-child,.sum td:first-child{text-align:left;}
.sum th{font-size:.8rem;color:var(--text-3);font-weight:650;}
.sum td.big{font-weight:900;font-size:1.15rem;}
.sum td.neg{color:var(--red);}
.sum td.pos{color:var(--green);}
.verdict{font-weight:800;font-size:1.02rem;margin:2px 0 4px;}
/* iPad portrait: a bigger table and bigger cards to fill the room */
@media (min-width:700px) and (min-height:900px){
  html:not(.land) .stage{max-width:720px;}
  html:not(.land) .ctable .felt-in{height:clamp(440px,48dvh,580px);}
  html:not(.land) .chand{--cw:92px;}
  html:not(.land) .ctrick .pcard{--cw:84px;}
  html:not(.land) .cseat .backs{--cw:30px;}
  html:not(.land) .cseat .backs .pcard+.pcard{margin-left:-21px;}
  html:not(.land) .cseat .tag{font-size:.95rem;}
  html:not(.land) .cseat .tag .avatar{width:30px;height:30px;}
  html:not(.land) .cseat .chip-s{font-size:.8rem;padding:2px 9px;}
  html:not(.land) .nest .stack{--cw:58px;}
  html:not(.land) .rk-team .nm{font-size:.8rem;}
  html:not(.land) .rk-team .tot{font-size:2rem;}
  html:not(.land) .rk-mid .v{font-size:1rem;}
  html:not(.land) .bidbar,html:not(.land) .trumps{max-width:520px;}
}
/* Landscape tablets and desktops: wider table so the hand fits in one row, and the felt
   shrinks so the bid and trump controls stay on screen */
@media (min-width:1000px) and (orientation:landscape){
  html.land .stage{max-width:940px;}
  html.land .ctable .felt-in{height:clamp(260px,calc(100dvh - 404px),460px);}
}
/* A phone or iPad on its side (html.ls, set in the script): the table on the left as tall as the screen; the scores, your hand
   and the bid and trump buttons on the right, where you act */
html.ls .stage:not(:has(> .setup)){max-width:none;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);grid-template-rows:auto auto 1fr auto;column-gap:14px;align-items:start;
  height:calc(100dvh - var(--bar));padding:0 calc(var(--corner-x) + 6px) max(calc(var(--safe-b) + 10px),18px);}
html.ls .stage > .ctable{grid-column:1;grid-row:1 / -1;margin:0;padding:7px;align-self:stretch;}
html.ls .ctable .felt-in{height:100%;min-height:0;}
html.ls .stage > :not(.ctable){grid-column:2;}
html.ls .rk-top{grid-row:1;margin:0 0 4px;}
html.ls .rk-team{padding:4px 8px 4px 12px;}
html.ls .rk-team .tot{font-size:1.35rem;}
html.ls .rk-mid{min-width:72px;padding:2px 6px;}
html.ls .csort-row{grid-row:2;}
html.ls .chand{grid-row:3;align-self:center;--cw:clamp(52px,calc((100dvh - var(--bar)) * .23),96px);padding:14px 0 2px;}
html.ls .cbar{grid-row:4;margin:0;align-self:end;}
html.ls .bidbar,html.ls .trumps{max-width:none;}
html.ls .trumps button{min-height:46px;}
html.ls .ctrick .pcard{--cw:clamp(44px,calc((100dvh - var(--bar)) * .15),84px);}
html.ls .nest .stack{--cw:clamp(38px,calc((100dvh - var(--bar)) * .1),58px);}
html.ls .cseat .backs{--cw:18px;}
html.ls .cseat .backs .pcard+.pcard{margin-left:-13px;}
/* the same on an iPad: the table's seats at an iPad's size */
@media (min-height:600px){
  html.ls .cseat .tag{font-size:.95rem;}
  html.ls .cseat .tag .avatar{width:30px;height:30px;}
  html.ls .cseat .chip-s{font-size:.8rem;padding:2px 9px;}
  html.ls .cseat .backs{--cw:28px;}
  html.ls .cseat .backs .pcard+.pcard{margin-left:-20px;}
  html.ls .rk-team .nm{font-size:.82rem;}
  html.ls .rk-team .tot{font-size:2rem;}
  html.ls .rk-mid .v{font-size:1rem;}
}
/* Turning the device: the table, the hand and the buttons glide to their new places (a View Transition in the script) */
.ctable{view-transition-name:rk-table;} .chand{view-transition-name:rk-hand;} .cbar{view-transition-name:rk-bar;} .rk-top{view-transition-name:rk-top;}
/* A small window on a computer, upright and wider than a phone (no phone or tablet is this shape): the table takes the
   room the scores, the hand and the buttons leave, so nothing scrolls */
@media (orientation:portrait) and (min-width:480px) and (max-width:699.98px) and (max-height:759.98px){
  .stage:has(> .ctable){display:flex;flex-direction:column;height:calc(100dvh - var(--bar));min-height:0;}
  .rk-top{flex:none;margin:0 0 6px;}
  .rk-team{padding:4px 8px 4px 12px;}
  .rk-team .tot{font-size:1.35rem;}
  .rk-mid{padding:2px 8px;}
  .stage > .ctable{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-bottom:2px;}
  .stage > .ctable .felt-in{flex:1 1 0;height:auto;min-height:0;}
  .cseat .backs{display:none;}
  .ctrick{top:52%;}
  .ctrick .pcard{--cw:clamp(40px,7.2dvh,66px);}
  .nest .stack{--cw:clamp(34px,7dvh,44px);}
  .chand{--cw:clamp(52px,10.5dvh,80px);padding-top:14px;min-height:0;}
  .cbar{margin:2px 0;}
}
/* ── A large window (Cards.desk in cards.js lays the page out; html.cdesk-on while it does) ───────────────────────
   The felt takes the room and what lies on it grows with it. At the left stands the partnership score sheet, hand by
   hand: who won the bid and for how much, the trump color, what each side scored (a bid that went set is struck out
   and taken off), the totals and how near each side is to the score the game is played to, and under it the race.
   At the right is the hand in play: the bid and trump, the hand's 180 points as one bar with each side's share
   growing from its own end and the bid marked on it, the counters each side has captured as the cards themselves,
   the nest, the last trick and who took each trick. The score strip over the table says the same things in less
   room, so at a desk it is put away. Both panels are in the page at every size and drawn only at a desk. */
html.cdesk.cdesk-on #app.stage:has(> .ctable){align-items:stretch;--cdk-rw:clamp(300px,20vw,440px);}
html.cdesk-on #app.stage > .rk-top{display:none;}
html.cdesk.cdesk-on #app.stage > .chand{max-width:calc(var(--cw) * 10.7 + 16px);}
html.cdesk-on #app .nest{gap:.4em;font-size:clamp(.98rem,1.9cqmin,1.6rem);}
html.cdesk-on #app .nest .stack{--cw:clamp(44px,9.5cqmin,124px);}
html.cdesk-on #app .nest .cap{font-size:.84em;}
html.cdesk-on #app .bidbar,html.cdesk-on #app .trumps{max-width:460px;}
html.cdesk-on #app .trumps button{min-height:52px;}
html.cdesk-on #app .bidbar > .btn{width:auto;}
/* The score sheet (the pad of cards.js with a column for the bid) */
.rk-sheet{flex:1 1 0;min-height:0;display:flex;flex-direction:column;}
.rk-pad{--bc:5.7em;--lc:2.2em;flex:3 1 0;}
.rk-pad .pr{grid-template-columns:var(--lc) var(--bc) repeat(2,minmax(0,1fr));}
.rk-pad .meb{left:calc(var(--px) + var(--lc) + var(--bc) + (100% - var(--px) * 2 - var(--lc) - var(--bc)) * var(--mi) / 2);width:calc((100% - var(--px) * 2 - var(--lc) - var(--bc)) / 2);}
.rk-pad .ph .pc{flex-direction:column;}
.rk-pad .ph .pc .av2{display:flex;}
.rk-pad .ph .pc .av2 .avatar + .avatar{margin-left:-.45em;box-shadow:0 0 0 2px rgba(14,15,30,.55);}
.rk-pad .ph .bh{align-self:end;padding-bottom:.1em;font-size:.74em;font-weight:700;color:var(--text-3);text-align:center;}
.rk-bd{display:flex;align-items:center;justify-content:center;gap:.32em;min-width:0;font-size:.86em;font-weight:750;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
.rk-bd .avatar{flex:none;width:1.55em;height:1.55em;font-size:.82em;}
.rk-bd .dot{flex:none;width:.8em;height:.8em;box-shadow:0 0 0 1.5px rgba(255,255,255,.7);}
.rk-pad .cv s{margin-right:.3em;font-size:.72em;color:var(--text-3);text-decoration-thickness:1.5px;}
.rk-pad .cv.set{color:var(--bad-ink);}
/* The race: each side's total after every hand, up to the score the game is played to */
.rk-race{flex:2 1 0;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--gl-line);}
.rk-race .box{position:relative;flex:1 1 0;min-height:0;margin:0 1em .2em;}
.rk-race svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.rk-race .ax{stroke:var(--gl-line);stroke-width:1;}
.rk-race .ax.zero{stroke:color-mix(in srgb,var(--text) 34%,transparent);}
.rk-race .ax.goal{stroke:var(--lit);stroke-width:1.5;stroke-dasharray:5 5;opacity:.8;}
.rk-race text{fill:var(--text-3);font-size:.72em;font-weight:650;font-variant-numeric:tabular-nums;}
.rk-race text.goal{fill:var(--lit-ink);}
.rk-race path{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
.rk-race path.me{stroke-width:4;}
/* The hand in play (the right panel) */
.rk-ln{flex:none;display:flex;align-items:center;gap:.55em;padding:.12em 1.25em;font-size:.86em;font-weight:650;line-height:1.25;color:var(--text-2);}
.rk-ln .avatar{flex:none;width:1.7em;height:1.7em;font-size:.85em;}
.rk-ln .dot{flex:none;width:1em;height:1em;margin:0 .35em;}
.rk-ln b{color:var(--text);font-weight:750;}
/* the auction: a line a player, in the order they bid */
.rk-bl{flex:none;display:flex;flex-direction:column;padding:0 1.25em;}
.rk-b{display:flex;align-items:center;gap:.55em;min-height:2.2em;border-bottom:1px solid var(--gl-line);font-size:.9em;font-weight:650;color:var(--text-2);}
.rk-b .avatar{flex:none;width:1.7em;height:1.7em;font-size:.85em;}
.rk-b .nm{flex:1 1 auto;min-width:0;overflow-wrap:break-word;line-height:1.1;}
.rk-b.rk-me .nm{color:var(--lit-ink);}
.rk-b .st{flex:none;min-width:4.4em;padding:.12em .55em;border-radius:.6em;text-align:center;font-size:.86em;font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text);box-shadow:inset 0 0 0 1px var(--gl-line);}
.rk-b .st.out{color:var(--text-3);box-shadow:none;}
.rk-b .st.high{color:var(--lit-ink);box-shadow:inset 0 0 0 1px rgba(255,211,77,.7),0 0 10px var(--litg);}
.rk-b .st.wait{color:var(--text-3);}
/* the hand's 180 points as one bar: the bidding side's share grows from the left, the other side's from the right,
   and the mark is the bid */
.rk-tug{flex:none;padding:.75em 1.25em .15em;}
.rk-tug .tk{position:relative;display:flex;justify-content:space-between;height:.9em;border-radius:1em;background:var(--gl-2);box-shadow:inset 0 0 0 1px var(--gl-line);}
.rk-tug .tk b{height:100%;min-width:0;background:var(--c);transition:width .5s var(--ease,ease);}
.rk-tug .tk b:first-child{border-radius:1em 0 0 1em;}
.rk-tug .tk b:last-of-type{border-radius:0 1em 1em 0;}
.rk-tug .tk b.all{border-radius:1em;}
.rk-tug .tk u{position:absolute;top:-.32em;bottom:-.32em;width:2px;margin-left:-1px;border-radius:2px;background:var(--text);box-shadow:0 0 0 1.5px rgba(14,15,30,.7);}
.rk-tug .tk u.made{background:var(--lit);box-shadow:0 0 0 1.5px rgba(14,15,30,.7),0 0 8px var(--litg);}
.rk-tug .ends{display:flex;justify-content:space-between;gap:.8em;margin-top:.5em;font-size:.8em;font-weight:650;line-height:1.15;color:var(--text-2);}
.rk-tug .ends span{display:flex;flex-direction:column;min-width:0;}
.rk-tug .ends span + span{align-items:flex-end;text-align:right;}
.rk-tug .ends b{font-family:var(--display);font-size:1.7em;line-height:1.05;color:var(--text);font-variant-numeric:tabular-nums;}
.rk-tug .ends .rk-us b{color:var(--lit-ink);}
.rk-say{flex:none;margin:0;padding:.45em 1.25em .2em;font-size:.84em;font-weight:650;line-height:1.3;color:var(--text-2);text-wrap:balance;}
.rk-say.good{color:var(--lit-ink);}
.rk-say.bad{color:var(--bad-ink);}
/* the counters each side has captured, as the cards themselves */
.rk-cap{flex:none;display:flex;flex-direction:column;gap:.35em;padding:.2em 1.25em .3em;}
.rk-cr{display:flex;align-items:center;gap:.5em;min-height:2.9em;}
.rk-cr .avatar{flex:none;width:1.5em;height:1.5em;font-size:.8em;}
.rk-cr .avatar + .avatar{margin-left:-.95em;box-shadow:0 0 0 2px rgba(14,15,30,.55);}
.rk-cs{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:.16em;min-width:0;--cw:1.85em;}
.rk-cs .pcard,.rk-ns .pcard,.rk-ltc .pcard{box-shadow:0 1px 3px rgba(0,0,0,.4);}
.rk-cs .pcard .ix,.rk-cs .pcard .lbl,.rk-ns .pcard .ix,.rk-ns .pcard .lbl,.rk-ltc .pcard .ix,.rk-ltc .pcard .lbl{display:none;}
.rk-cs .pcard.rk .big,.rk-ns .pcard.rk .big,.rk-ltc .pcard.rk .big{padding-left:0;font-size:calc(var(--cw) * .56);}
.rk-cs .none{font-size:.8em;font-weight:600;color:var(--text-3);}
.rk-cap.tt .rk-cr{min-height:1.9em;} .rk-cap.tt .n{font-size:.85em;font-weight:700;}   /* (Hints off: each side's tricks, no counters) */
/* (before the play: what each counter is worth, as the cards themselves) */
.rk-val{display:flex;align-items:center;gap:.6em;min-height:2.75em;font-size:.94em;font-weight:650;color:var(--text-2);}
.rk-val .rk-cs{flex:none;}
.rk-val b{color:var(--text);font-weight:750;font-variant-numeric:tabular-nums;}
.rk-cg{flex:none;display:flex;flex-direction:column;}
/* the nest */
.rk-nest{flex:none;display:flex;align-items:center;gap:.7em;padding:.3em 1.25em .3em;font-size:.84em;font-weight:650;line-height:1.3;color:var(--text-2);}
.rk-ns{flex:none;display:flex;--cw:1.85em;}
.rk-ns .pcard + .pcard{margin-left:-.75em;}
.rk-ns.up .pcard + .pcard{margin-left:.16em;}
.rk-ns.up{--cw:1.7em;}
.rk-g1{flex:1 1 0;min-height:11.4em;display:flex;flex-direction:column;}
.rk-took{flex:none;display:flex;align-items:center;gap:.5em;min-height:2.3em;padding:.45em 1.25em .4em;font-size:.86em;font-weight:650;line-height:1.2;color:var(--text-2);}
.rk-took .avatar{width:1.8em;height:1.8em;font-size:.85em;}
.rk-took b,.rk-ltc b{margin-left:auto;padding:.1em .55em;border-radius:.6em;font-weight:750;color:var(--lit-ink);box-shadow:inset 0 0 0 1px rgba(255,211,77,.6);font-variant-numeric:tabular-nums;white-space:nowrap;}
/* (the last trick where there is no room for its felt: its cards small in the order played, the winner ringed) */
.rk-ltc{display:none;flex:none;align-items:center;gap:.3em;min-height:3em;padding:.3em 1.25em .2em;font-size:.86em;font-weight:650;line-height:1.2;color:var(--text-2);--cw:1.75em;}
.rk-ltc > span:first-child{margin-right:auto;}
.rk-ltc .pcard.win{box-shadow:0 0 0 2px var(--lit),0 0 10px var(--litg);}
.rk-ltc .avatar{flex:none;width:1.8em;height:1.8em;font-size:.85em;margin-left:.2em;}
.rk-ltc b{margin-left:.2em;}
/* who took each trick: a disc in the taker's side's color with the points under it; the tricks to come are rings */
.rk-g2{flex:none;display:flex;flex-direction:column;min-height:0;padding-bottom:.9em;}
.rk-tl{flex:none;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.4em 0;padding:0 .9em;}
.rk-tk{display:flex;flex-direction:column;align-items:center;gap:.1em;min-width:0;}
.rk-tk .avatar{width:2em;height:2em;font-size:.8em;}
.rk-tk .o{display:grid;place-items:center;width:2.35em;height:2.35em;border-radius:50%;font-size:.68em;font-weight:700;color:var(--text-3);box-shadow:inset 0 0 0 1.5px var(--gl-line);font-variant-numeric:tabular-nums;}
.rk-tk .n,.rk-tk .nm{display:none;}
.rk-tk .pt{min-height:1.15em;font-size:.7em;font-weight:750;line-height:1.15;color:var(--lit-ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
.rk-tk.done .o{background:var(--gl-2);}
.rk-tk.now .o{color:var(--lit-ink);box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.7),0 0 10px var(--litg);}
.rk-side.narrow .rk-tl{grid-template-columns:repeat(5,minmax(0,1fr));}
/* a panel too short for everything keeps what matters most (the script adds f1, then f2 and so on until it all fits) */
.rk-side.f1 .rk-g2{display:none;}
.rk-side.f2 .rk-g1{flex:none;min-height:0;}
.rk-side.f2 .rk-g1 > .cdk-lbl,.rk-side.f2 .rk-g1 > .cdk-lt,.rk-side.f2 .rk-took{display:none;}
.rk-side.f2 .rk-ltc{display:flex;}
.rk-side.f2.nolt .rk-g1{display:none;}
.rk-side.f3 .rk-nest{display:none;}
.rk-side.f4 .rk-say{display:none;}
.rk-side.f5 .rk-g1{display:none;}
.rk-side.f6 .rk-cg{display:none;}
.rk-side.f7 .rk-ln + .rk-ln{display:none;}
.rk-side.f7 .rk-b{min-height:1.8em;}
/* a tall panel: the tricks are a ruled list down the panel, a line a trick */
.rk-side.long .rk-g1{flex:1 1 min(100cqw,30cqh);max-height:min(110cqw,36cqh);}
.rk-side.long .rk-g2{flex:1 1 auto;}
.rk-side.long .rk-tl{flex:1 1 30em;min-height:17em;max-height:40em;grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(0,1fr);gap:0;}
.rk-side.long .rk-tk{flex-direction:row;gap:.6em;padding:0 .2em;border-bottom:1px solid var(--gl-line);}
.rk-side.long .rk-tk .n{display:block;width:1.6em;font-size:.74em;font-weight:700;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums;}
.rk-side.long .rk-tk .o{color:transparent;}
.rk-side.long .rk-tk .nm{display:block;flex:1;min-width:0;font-size:.86em;font-weight:650;color:var(--text-2);overflow-wrap:break-word;}
.rk-side.long .rk-tk .pt{min-height:0;font-size:.86em;}
/* a panel wider than tall (a strip of a window, or under the score sheet): the bid and the points at the left, the
   counters, the nest and the last trick's cards at the right */
.rk-ca,.rk-cb{display:contents;}
.rk-side.wide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);}
.rk-side.wide > .rk-ca,.rk-side.wide > .rk-cb{display:flex;flex-direction:column;min-width:0;min-height:0;}
.rk-side.wide > .rk-cb{padding-top:.7em;}
.rk-side.wide .rk-g2{display:none;}
.rk-side.wide .rk-ln,.rk-side.wide .rk-tug,.rk-side.wide .rk-say,.rk-side.wide .rk-bl{padding-right:.5em;}
.rk-side.wide .rk-cg > .cdk-lbl,.rk-side.wide .rk-cap,.rk-side.wide .rk-nest,.rk-side.wide .rk-ltc{padding-left:.6em;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  // Turning the device. A phone on its side or an iPad held sideways has its own layout (html.ls), and every turn (phone or iPad) changes the
  // layout inside a View Transition, so the table, the hand and the buttons glide to their new places instead of jumping.
  (function () {
    var R = document.documentElement, q = matchMedia('(orientation:landscape) and (max-height:820px)'), o = matchMedia('(orientation:landscape)');
    var wait = false, D = window.Cards && Cards.DESK, dq = D ? matchMedia([D.wide, D.strip, D.square, D.tall].join(', ')) : null;
    function set() { wait = false; R.classList.toggle('ls', q.matches); R.classList.toggle('land', o.matches); window.dispatchEvent(new Event('resize')); }
    R.classList.toggle('ls', q.matches); R.classList.toggle('land', o.matches);
    function turn() {
      if (wait || (R.classList.contains('ls') === q.matches && R.classList.contains('land') === o.matches)) return;
      // (a large window is laid out again as it is dragged and its pieces glide by themselves: the script at the foot of the page)
      if (dq && (dq.matches || R.classList.contains('cdesk-on'))) { set(); return; }
      if (document.startViewTransition && !document.hidden && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        try { wait = true; var t = document.startViewTransition(set); [t.ready, t.finished, t.updateCallbackDone].forEach(function (x) { if (x) x.catch(function () {}); }); return; } catch (e) { wait = false; }
      }
      set();
    }
    [q, o].forEach(function (m) { if (m.addEventListener) m.addEventListener('change', turn); else m.addListener(turn); });
  })();
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'rook_state', KEY = 'rook', PAD_KEY = 'rk', SEATS = ['s', 'w', 'n', 'e'];
  var COLS = ['r', 'y', 'g', 'b'];
  var CNAME = { r: 'Red', y: 'Yellow', g: 'Green', b: 'Black' };
  var CHEX = { r: '#d42a3c', y: '#d99a00', g: '#1d9a52', b: '#22202f' };
  var RANKS = [1, 14, 13, 12, 11, 10, 9, 8, 7, 6, 5];       // 2s, 3s and 4s are out
  var MIN_BID = 100, MAX_BID = 180, TOTAL = 180;
  var BIRD = '<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="#1d1b2e">' +
    '<path d="M4 44 L20 36 L22 41 L8 50 Z"/>' +                                         // tail
    '<path d="M16 38 C18 28 28 23 38 24 C40 18 44 14 50 15 C54 16 56 19 56 21 L62 23 L56 25 C55 30 52 33 48 35 C46 42 38 47 28 47 C22 47 18 44 16 38 Z"/>' + // body + head
    '<path d="M27 47 L25 57 M25 57 L21 58 M25 57 L28 59 M35 46 L36 56 M36 56 L32 58 M36 56 L40 57" stroke="#1d1b2e" stroke-width="2.4" stroke-linecap="round" fill="none"/>' +
    '</g><path d="M22 36 C28 30 36 30 42 33 C36 34 30 37 26 41 Z" fill="#4a4660"/>' +    // wing
    '<circle cx="50" cy="20" r="2" fill="#fff"/><circle cx="50.4" cy="20" r="1" fill="#1d1b2e"/></svg>';

  var STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 5.9 6.6 1-4.8 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.5 9.4l6.6-1z"/></svg>';

  Kit.init({
    id: 'rook',
    snapHide: function () { return !onePerson() ? '.chand' : null; },   // (Keep playing's picture: a person's hand never shows in pass and play)
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: 'Scores so far', onClick: function () { if (S && S.players) showScores(false); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { keys: [PAD_KEY], title: 'Rook: past games' }); } }
    ]),
    rules:
      '<p class="goal">You and your partner (sitting across from you) team up against the other two. Win the bid, pick trump, and capture the point cards. <b>First team to 500 wins.</b></p>' +
      '<h3>The cards</h3><p>Four colors (red, yellow, green, black) numbered 1 and 5 to 14 (the 2s, 3s and 4s are taken out), plus the <b>Rook</b> bird card. In each color the <b>1 is highest</b>, then 14, 13 and so on down to 5.</p>' +
      '<h3>Point cards</h3><ul><li><b>Rook:</b> 20</li><li><b>1s:</b> 15 each</li><li><b>14s and 10s:</b> 10 each</li><li><b>5s:</b> 5 each</li></ul><p>That is 180 points in every hand.</p>' +
      '<h3>Dealing and bidding</h3><ul><li>Everyone gets 10 cards. Five cards go face down in the middle: the <b>nest</b>.</li>' +
      '<li>Starting left of the dealer, each player bids how many points their team will capture, or passes. Bids start at <b>100</b> and go up by 5 (up to 180). Once you pass, you are out of the bidding.</li>' +
      '<li>If everyone passes, the cards are dealt again.</li></ul>' +
      '<h3>The nest and trump</h3><p>The high bidder picks up the nest, puts any 5 cards back face down, and then names the <b>trump color</b>. The <b>Rook is the highest trump</b>, even above the trump 1.</p>' +
      '<h3>Playing</h3><ul><li>The player left of the dealer leads the first trick. The winner of each trick leads the next.</li>' +
      '<li>You must <b>follow the color that was led</b> if you can. The Rook counts as a trump card, so you play it when trump is led or when you cannot follow.</li>' +
      '<li>If you cannot follow, play anything, including trump.</li>' +
      '<li>The highest trump wins the trick. If no trump was played, the highest card of the led color wins.</li>' +
      '<li>Whoever wins the <b>last trick</b> also gets the 5 cards in the nest, with any points in it.</li></ul>' +
      '<h3>Scoring</h3><ul><li>If the bidding team captures at least its bid, it scores every point it took.</li>' +
      '<li>If not, it is <b>set</b>: the bid is subtracted from its score.</li>' +
      '<li>The other team always scores the points it took.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b>, beside the start button, opens a table that the others join on their own devices. Partners sit the way you seated them in the setup, and anyone else who joins takes an open seat. The computer plays every seat that nobody takes.</li>' +
      '<li>Bid and play whenever it’s your turn. The home screen shows when it’s your move, and each new hand deals itself.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null, token = 0, undoStack = [];
  var NET = null;   // the online table while playing at one (see Online below)
  // Pass & play: ME is the seat drawn at the bottom with its hand face up (the person holding the device, S.me);
  // BLIND hides every hand while the device is handed over. One person among robots never sees the cover.
  var ME = 0, BLIND = false;
  function posOf(p) { return SEATS[(p - ME + 4) % 4]; }
  function MT() { return ME % 2; }
  function person(p) { return p >= 0 && !!S.players[p] && !S.players[p].cpu; }
  function onePerson() { return !!NET || !S || S.players.filter(function (q) { return !q.cpu; }).length < 2; }
  function showFor(p) { BLIND = false; ME = p; S.me = p; save(); render(); }
  function gate(p, then) {
    if (NET || !person(p) || p === ME) { then && then(); return; }
    BLIND = true; undoStack = []; render();
    var t = token;
    Kit.handoff({ name: S.players[p].name, color: Kit.color(p % 2), what: 'cards' }).then(function () {
      if (t !== token || !S) return;
      showFor(p); then && then();
    });
  }
  // whose move it is right now, if a person's
  function actor() {
    if (S.phase === 'bid' || S.phase === 'play') return S.turn;
    if (S.phase === 'nest' || S.phase === 'trump') return S.bidder;
    return -1;
  }
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'over') Kit.resume.set('Hand ' + S.round + ' · ' + S.scores[0] + ' to ' + S.scores[1]);
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  function showSetup() {
    S = null; token++; BLIND = false; ME = 0; Kit.handoff.close();
    Kit.setup(app, {
      modes: Kit.modes(['cpu', 'local']),
      players: { min: 4, max: 4, cpu: function (m) { return m === 'cpu' ? 'seats' : m === 'local' ? 'mix' : false; }, teams: [[0, 2], [1, 3]] },
      intro: 'You and a computer partner against two computers',
      options: [{ id: 'target', label: 'Play to', help: 'The first team to reach this many points wins.', value: 500, choices: [[300, '300\nQuick'], [500, '500\nStandard']] },
        { id: 'hints', label: 'Hints', value: 'on',
          choices: [['on', 'On', 'While a hand is played, the table counts the points each side has taken, shows the counters captured and the points still out, and says when a bid can no longer be made.'],
            ['off', 'Off', 'No points counted during a hand: the bid, the trump and the tricks taken are shown, and you keep count of the counters yourself, as at a real table.']] },
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: LEVELS }],
      onStart: function (cfg) {
        S = freshGame(+cfg.options.target || 500, cfg.players.map(function (p) { return { name: p.name, cpu: !!p.cpu, level: p.cpu && p.level ? lvName(p.level) : undefined }; }), cfg.mode, cfg.options.level, cfg.options.hints !== 'off');   // (each robot its own skill at a mixed table)
        ME = 0; undoStack = []; newHand();
      }
    });
  }
  // The computer's skill. Normal is how it has always played; a game saved before there were levels plays Normal.
  var LEVELS = [['easy', 'Easy', 'Bids by guesswork and plays the wrong card about half the time.'],
    ['normal', 'Normal', 'Bids what its hand is worth and keeps track of the high cards.'],
    ['hard', 'Hard', 'Remembers every card played and thinks each play through.'],
    ['expert', 'Expert', 'Remembers every card and who is out of which color, and thinks each play through four times as thoroughly as Hard.']];
  function lvName(v) { return v === 'easy' || v === 'hard' || v === 'expert' ? v : 'normal'; }
  function lvOf(p) { var pl = S.players && S.players[p]; return lvName((pl && pl.level) || S.level); }
  // Hints (the setup's choice): while a hand is played, the points each side has taken (the top bar, the score sheet's
  // live row, the desk's tug of war and counters), the points still out, and whether the bid can still be made. A game
  // saved before there was a choice has no hints field and plays with them on.
  function hintsOn() { return !S || S.hints !== false; }
  function freshGame(target, players, mode, level, hints) {
    return {
      mode: mode || 'cpu', me: 0, level: lvName(level), hints: hints !== false, target: target, players: players, scores: [0, 0], round: 0, rounds: [], dealer: 3, started: Date.now(),
      events: [], rookCaps: [0, 0, 0, 0], made: [0, 0], set: [0, 0], bestMade: null
    };
  }
  function teamName(t) { return S.players[t].name + ' & ' + S.players[t + 2].name; }
  function teamAnd(t) { return S.players[t].name + ' and ' + S.players[t + 2].name; }
  function shortName(p) { return p === ME && onePerson() ? 'You' : S.players[p].name; }

  // ── Cards ─────────────────────────────────────────────────────────────────
  function deck() {
    var d = [];
    COLS.forEach(function (c) { RANKS.forEach(function (r) { d.push({ id: c + r, c: c, r: r }); }); });
    d.push({ id: 'rook', c: 'x', r: 0, rook: true });
    return d;
  }
  var ALL = deck();
  function pts(c) { return c.rook ? 20 : c.r === 1 ? 15 : (c.r === 14 || c.r === 10) ? 10 : c.r === 5 ? 5 : 0; }
  function rv(c) { return c.rook ? 16 : c.r === 1 ? 15 : c.r; }
  function eff(c) { return c.rook ? S.trump : c.c; }               // the Rook belongs to trump
  function power(c, led) { return c.rook ? 200 : c.c === S.trump ? 100 + rv(c) : c.c === led ? rv(c) : 0; }
  function sumPts(a) { return a.reduce(function (s, c) { return s + pts(c); }, 0); }
  function find(h, id) { for (var i = 0; i < h.length; i++) if (h[i].id === id) return i; return -1; }
  function team(p) { return p % 2; }
  function sortHand(h) {
    var order = COLS.slice();
    if (S && S.trump) { order = order.filter(function (c) { return c !== S.trump; }); order.unshift(S.trump); }
    // alternate dark/light colours so neighbours never look alike
    return h.sort(function (a, b) {
      var ca = a.rook ? (S && S.trump ? S.trump : 'z') : a.c, cb = b.rook ? (S && S.trump ? S.trump : 'z') : b.c;
      var ia = ca === 'z' ? 9 : order.indexOf(ca), ib = cb === 'z' ? 9 : order.indexOf(cb);
      return ia - ib || rv(b) - rv(a);
    });
  }
  // Your hand on screen (display only). Color: trump first, the Rook with
  // trump, high to low. Number: high to low across colors, the Rook first.
  var sortT = Cards.sortToggle(null, {
    key: 'rook_sort', modes: ['color', { id: 'rank', label: 'Number' }], value: 'color',
    flip: function () { return handEl; }, onChange: function () { if (S && handEl) paintHand(); }
  });
  function view(h) {
    var a = h.slice();
    if (sortT.get() !== 'rank') return sortHand(a);
    var order = COLS.slice();
    if (S.trump) { order = order.filter(function (c) { return c !== S.trump; }); order.unshift(S.trump); }
    return Cards.sortBy(a, 'rank', { rank: function (x, y) { return rv(y) - rv(x) || order.indexOf(x.c) - order.indexOf(y.c); } });
  }
  function cardEl(c, o) {
    o = o || {};
    var n;
    if (c.rook) n = Kit.cardFace({ html: BIRD, label: 'Rook', cls: 'rook', aria: 'The Rook, 20 points' });
    else {
      n = Kit.cardFace({ rank: String(c.r), corner: false, color: CHEX[c.c], label: pts(c) ? pts(c) + ' pts' : '', cls: 'rk', aria: CNAME[c.c] + ' ' + c.r + (pts(c) ? ', ' + pts(c) + ' points' : '') });
      n.insertAdjacentHTML('afterbegin', '<span class="ix">' + c.r + (pts(c) ? STAR : '') + '</span>');
    }
    if (S && S.trump && (c.rook || c.c === S.trump) && o.trumpRing !== false) n.classList.add('trump');
    if (o.cls) o.cls.split(' ').forEach(function (k) { if (k) n.classList.add(k); });
    n.dataset.id = c.id;
    return n;
  }

  // ── Dealing ───────────────────────────────────────────────────────────────
  function newHand() {
    S.round++;
    S.dealer = (S.dealer + 1) % 4;
    var d = Cards.shuffle(deck());
    S.hands = [[], [], [], []];
    for (var i = 0; i < 40; i++) S.hands[i % 4].push(d[i]);
    S.nest = d.slice(40); S.dtNe = ids(S.nest);
    S.trump = null; S.bidder = -1; S.bid = 0; S.high = 0;
    S.bids = [null, null, null, null];              // null = not yet, 0 = passed, n = last bid
    S.taken = [[], []]; S.tricks = [0, 0, 0, 0]; S.trick = []; S.trickNo = 0; S.played = []; S.discards = []; S.vd = [{}, {}, {}, {}];
    S.sel = []; S.fromNest = []; S.lt = null; S.tl = []; handBar = false;
    S.turn = (S.dealer + 1) % 4; S.leader = S.turn;
    S.hands.forEach(sortHand);
    S.phase = 'bid';
    clearUndo(); save(); render(); Kit.sfx('deal');
    step();
  }

  // ── Main loop: schedule whatever the computer needs to do next ────────────
  function step() {
    if (!S) return;
    // a different person's move: hands down, pass the device, then carry on as them
    var a = actor();
    if (person(a) && a !== ME) { gate(a, step); return; }
    paintAll();
    var t = token;
    function later(fn, ms) { setTimeout(function () { if (t === token && S) fn(); }, ms); }
    if (S.phase === 'bid' && S.players[S.turn].cpu) later(function () { if (S.phase === 'bid' && S.players[S.turn].cpu) placeBid(S.turn, cpuBid(S.turn)); }, 750);
    else if (S.phase === 'nest' && S.players[S.bidder].cpu) later(cpuNest, 900);
    else if (S.phase === 'nest' && S.bidder === ME && !S.fromNest.length && S.nest.length) later(takeNest, 200);
    else if (S.phase === 'play' && S.turn >= 0 && S.players[S.turn].cpu) later(function () { if (S.phase === 'play' && S.turn >= 0 && S.players[S.turn].cpu) play(S.turn, cpuChoose(S.turn)); }, 700);
  }

  // ── Bidding ───────────────────────────────────────────────────────────────
  function nextBid() { return S.high ? S.high + 5 : MIN_BID; }
  function placeBid(p, amt) {
    if (NET) { if (p === ME) netAct(function (st, me) { return nBid(st, me, amt); }); return; }
    if (S.phase !== 'bid' || S.turn !== p) return;
    if (amt && (amt < nextBid() || amt > MAX_BID)) amt = 0;
    S.bids[p] = amt;
    if (amt) { S.high = amt; S.bidder = p; Kit.sfx('chip'); }
    else Kit.sfx('tap');
    seatSay(p, amt ? String(amt) : 'Pass', !amt);
    var active = [0, 1, 2, 3].filter(function (q) { return S.bids[q] !== 0; });
    if (!active.length) {                            // everyone passed
      Kit.toast('Everyone passed. New deal.');
      save(); var t = token;
      setTimeout(function () { if (t === token) { S.round--; newHand(); } }, 1300);
      return;
    }
    if (active.length === 1 && S.bids[active[0]] > 0 || S.high === MAX_BID) {

<script>
// A large window dragged to a new shape at any moment: the cards, the seats and the panels glide from where they
// showed in the last frame to their new places (where everything is, is noted every frame, since a resize has
// already moved things by the time it is heard). A card that was redrawn is found again by its id. Only where a
// window can be dragged (a mouse) and a desk layout shows before or after: a phone or tablet being turned keeps
// its own View Transition.
(function (SEL) {
  var root = document.getElementById('app') || document.body, R = document.documentElement, last = new Map(), lastId = {}, wh = innerWidth + 'x' + innerHeight;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, D = window.Cards && Cards.DESK;
  var dq = D && window.matchMedia ? matchMedia([D.wide, D.strip, D.square, D.tall].join(', ')) : null, mouse = window.matchMedia && matchMedia('(pointer:fine)').matches;
  if (!dq || reduce) return;
  function note() {
    var m = new Map(), ids = {};
    root.querySelectorAll(SEL).forEach(function (n) { var r = n.getBoundingClientRect(); if (!r.width) return; m.set(n, r); if (n.dataset && n.dataset.id && !n.closest('.cdk-panel')) ids[n.dataset.id] = r; });
    last = m; lastId = ids;
  }
  (function loop() { if (!document.hidden && (mouse || dq.matches)) note(); requestAnimationFrame(loop); })();
  window.addEventListener('resize', function () {
    var now = innerWidth + 'x' + innerHeight; if (now === wh) return; wh = now;
    if (!dq.matches && !R.classList.contains('cdesk-on')) return;
    var before = last, beforeId = lastId;
    requestAnimationFrame(function () {   // (after the game's own resize work has redrawn whatever it redraws)
      var nodes = [].slice.call(root.querySelectorAll(SEL)), set = new Set(nodes);
      nodes.forEach(function (n) {
        for (var p = n.parentElement; p && p !== root; p = p.parentElement) if (set.has(p)) return;   // (moves with its seat or its panel)
        var a = before.get(n) || (n.dataset && n.dataset.id && beforeId[n.dataset.id]), b = n.getBoundingClientRect();
        if (!b.width || !n.animate) return;
        // (a panel that wasn't showing, or that changes shape and so lays its contents out anew, comes up in its new
        // place; stretched from the old shape its words would be pulled out of true)
        var panel = n.classList.contains('cdk-panel');

          return;
        }
        if (!a) return;

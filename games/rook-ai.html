/* Table */

/* Bidding */

<script>
'use strict';
// Partners: 0(You)+2(North) vs 1(West)+3(East). First team to 300 wins.
// 57 cards: Red/Yellow/Green/Black 1-14 + Rook bird. 5-card nest.
// Counting cards: 5→5pts, 10→10pts, 14→10pts, Rook→20pts = 120 total.
// Bid to win nest and name trump. Must make your bid.
const PNAMES=[(typeof FrequentPlayers!=='undefined'&&FrequentPlayers.myName())||'You','West','North','East'];
const COLORS=['Red','Yellow','Green','Black'];
const COLOR_CSS={Red:'red',Yellow:'yellow',Green:'green',Black:'black'};
const POINT_CARDS={5:5,10:10,14:10};
const WIN_SCORE=300;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function haptic(k){try{window.GN&&GN.haptic(k);}catch(e){}}

function makeRookDeck(){
  const d=[];
  COLORS.forEach(c=>{for(let n=1;n<=14;n++) d.push({num:n,color:c,pts:POINT_CARDS[n]||0});});
  d.push({num:0,color:'Rook',pts:20,isRook:true});
  for(let i=d.length-1;i>0;i--){const j=0|Math.random()*(i+1);[d[i],d[j]]=[d[j],d[i]];}
  return d;
}
function cKey(c){return c.num+'_'+c.color;}
function sortHand(h){return h.sort((a,b)=>a.color.localeCompare(b.color)||a.num-b.num);}

function cardPower(c,trump,led){
  if(c.isRook) return 1000;
  if(trump&&c.color===trump) return 100+c.num;
  if(led&&c.color===led) return 50+c.num;
  return c.num;
}
function countPts(cards){return cards.reduce((s,c)=>s+(c.pts||0),0);}

let hands,nest,trump,bidWinner,bid,scores,trick,trickLead,taken,phase,bidHistory,currentBidder,log,minBid;
let nestTaken=false, nestPicks=[], trickWinner=-1, lastDelta=[0,0], lastPlayKey=null;

// A single AI timer: render() used to schedule a duplicate AI move on every redraw,
// which could make an AI bid twice or pick up the nest twice.
let aiTimer=null;
function later(fn,ms){clearTimeout(aiTimer);aiTimer=setTimeout(fn,ms);}

function addLog(msg,cls=''){log.push({msg,cls});if(log.length>30)log.shift();}
function newGame(){clearTimeout(aiTimer);scores=[0,0];log=[];newRound();}
function newRound(){
  const deck=makeRookDeck();
  hands=Array.from({length:4},(_,i)=>sortHand(deck.slice(i*13,(i+1)*13)));
  nest=deck.slice(52);
  trump=null;bidWinner=-1;bid=0;
  taken=[[],[]]; trick=[null,null,null,null];
  trickLead=0; bidHistory=[-1,-1,-1,-1]; currentBidder=0;
  nestTaken=false; nestPicks=[]; trickWinner=-1;
  minBid=70; phase='bid';
  addLog('New round. Bidding starts at 70.');
  render();
  try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}
  // Player bids first; if first bidder is not player 0, do AI bids
  if(currentBidder!==0) later(aiBid,500);
}

function estimateBid(player){
  const h=hands[player];
  let pts=0;
  h.forEach(c=>{
    if(c.isRook) pts+=25;
    else if(c.num===14) pts+=15;
    else if(c.num===13) pts+=10;
    else if(c.num===12) pts+=8;
    else if(c.num===11) pts+=6;
    else if(c.num===10||c.num===5) pts+=5;
    else pts+=2;
  });
  return Math.min(120,Math.round(pts/1.5/5)*5+5);
}

function aiBid(){
  if(phase!=='bid'||currentBidder===0) return;
  const p=currentBidder;
  const est=estimateBid(p);
  if(est>=minBid&&bidHistory[p]===-1){
    const myBid=Math.max(minBid,Math.round(est/5)*5);
    bidHistory[p]=myBid; minBid=myBid+5;
    addLog(`${PNAMES[p]} bids ${myBid}.`);
    advanceBid();
  } else {
    bidHistory[p]=-2;
    addLog(`${PNAMES[p]} passes.`);
    advanceBid();
  }
}

function playerBid(amount){
  if(phase!=='bid'||currentBidder!==0) return;
  haptic('select');
  if(amount==='pass'){bidHistory[0]=-2;addLog('You pass.');}
  else{bidHistory[0]=amount;minBid=amount+5;addLog(`You bid ${amount}.`);}
  advanceBid();
}

function advanceBid(){
  const activeBidders=bidHistory.filter(b=>b!==-2).length;
  const passCount=bidHistory.filter(b=>b===-2).length;
  // Find next non-passed bidder
  let next=(currentBidder+1)%4;
  while(bidHistory[next]===-2&&next!==currentBidder) next=(next+1)%4;
  if(passCount>=3||(activeBidders<=1&&passCount>=3)){
    // Bidding over — highest bid wins
    let winner=0,winBid=70;
    bidHistory.forEach((b,i)=>{if(b>winBid){winBid=b;winner=i;}});
    if(bidHistory.filter(b=>b>0).length===0){winner=0;winBid=70;}
    bidWinner=winner;bid=Math.max(70,winBid);
    addLog(`${PNAMES[bidWinner]} wins bid at ${bid}!`,'pts');
    phase='nest';
    if(bidWinner===0) haptic('success');
    render();
    if(bidWinner!==0) later(aiNest,700);
  } else {
    currentBidder=next;
    render();
    if(currentBidder!==0) later(aiBid,550);
  }
}

function aiNest(){
  if(phase!=='nest'||bidWinner===0||trump) return;
  // AI picks up nest and discards 5 weakest non-counting cards
  const h=[...hands[bidWinner],...nest];
  h.sort((a,b)=>{
    if(a.pts!==b.pts) return b.pts-a.pts; // keep point cards
    return b.num-a.num; // keep high cards
  });
  hands[bidWinner]=sortHand(h.slice(0,13));
  const discarded=h.slice(13);
  taken[bidWinner%2===0?0:1].push(...discarded);
  addLog(`${PNAMES[bidWinner]} picks up nest and discards 5.`);
  // Choose trump: color with most cards
  const counts={};
  hands[bidWinner].forEach(c=>{if(!c.isRook)counts[c.color]=(counts[c.color]||0)+1;});
  trump=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  addLog(`${PNAMES[bidWinner]} names ${trump} as trump.`);
  phase='play'; trickLead=(bidWinner+1)%4; trick=[null,null,null,null];
  render();
  if(trickLead!==0) later(aiPlay,700);
}

function playerTakeNest(){
  if(phase!=='nest'||bidWinner!==0||nestTaken) return;
  nestTaken=true; nestPicks=[];
  hands[0]=sortHand([...hands[0],...nest]);
  haptic('light');
  render();
}
function playerToggleNestPick(card){
  if(phase!=='nest'||bidWinner!==0||!nestTaken||hands[0].length<=13) return;
  const k=cKey(card), need=hands[0].length-13;
  const i=nestPicks.indexOf(k);
  if(i>=0) nestPicks.splice(i,1);
  else if(nestPicks.length<need) nestPicks.push(k);
  else { haptic('error'); if(window.GN) GN.toast(`Pick exactly ${need} cards`); return; }
  haptic('select');
  render();
}
function playerConfirmNestDiscard(){
  if(phase!=='nest'||bidWinner!==0||hands[0].length-13!==nestPicks.length) return;
  const out=hands[0].filter(c=>nestPicks.includes(cKey(c)));
  taken[0].push(...out);
  hands[0]=hands[0].filter(c=>!nestPicks.includes(cKey(c)));
  nestPicks=[];
  addLog(`You bury ${out.length} cards (${countPts(out)} pts kept for your team).`);
  haptic('light');
  render();
}

function playerChooseTrump(color){
  if(phase!=='nest'||bidWinner!==0||!nestTaken||hands[0].length!==13) return;
  trump=color;
  haptic('select');
  addLog(`You name ${trump} as trump!`);
  phase='play'; trickLead=1; trick=[null,null,null,null];
  render();
  later(aiPlay,700);
}

// ── Play ─────────────────────────────────────────────────────────────────────
function validPlays(p){
  const h=hands[p];
  const led=trick[trickLead];
  if(!led) return h;
  const ledColor=led.color;
  const follow=h.filter(c=>c.color===ledColor&&!c.isRook);
  return follow.length?follow:h;
}

function aiPlay(){
  if(phase!=='play') return;
  const p=getNext();
  if(p<0||p===0) return;
  const valid=[...validPlays(p)];
  const led=trick[trickLead];
  const ledColor=led?.color;
  const partnerIdx=(p+2)%4;
  const played=trick.map((c,i)=>c?{c,i}:null).filter(Boolean);
  const partnerWinning=played.length&&played.reduce((w,x)=>cardPower(x.c,trump,ledColor)>cardPower(w.c,trump,ledColor)?x:w,played[0]).i===partnerIdx;

  let card;
  if(!led){
    // Lead: highest trump if have rook/high trump, else highest point card
    const trumpCards=valid.filter(c=>c.color===trump||c.isRook);
    if(trumpCards.length>=3) card=trumpCards.sort((a,b)=>cardPower(b,trump,null)-cardPower(a,trump,null))[0];
    else card=valid.sort((a,b)=>b.pts-a.pts||b.num-a.num)[0];
  } else if(partnerWinning){
    card=valid.sort((a,b)=>a.pts-b.pts||a.num-b.num)[0]; // throw low
  } else {
    const winners=valid.filter(c=>!played.length||cardPower(c,trump,ledColor)>Math.max(...played.map(x=>cardPower(x.c,trump,ledColor))));
    card=winners.length?winners.sort((a,b)=>cardPower(a,trump,ledColor)-cardPower(b,trump,ledColor))[0]:valid.sort((a,b)=>a.pts-b.pts||a.num-b.num)[0];
  }
  playCard(p,card||valid[0]);
}

function getNext(){
  if(trick.filter(c=>c).length===4) return -1;
  for(let i=0;i<4;i++){const p=(trickLead+i)%4;if(!trick[p])return p;}
  return -1;
}

function playerPlay(card){
  if(phase!=='play'||getNext()!==0) return;
  if(!validPlays(0).some(c=>cKey(c)===cKey(card))){haptic('error');if(window.GN)GN.toast('Follow the led color if you can');return;}
  haptic('light');
  playCard(0,card);
}

function playCard(p,card){
  trick[p]=card;
  lastPlayKey=cKey(card);
  hands[p]=hands[p].filter(c=>cKey(c)!==cKey(card));
  render();
  if(trick.filter(c=>c).length===4){
    const led=trick[trickLead];
    const ledColor=led.color;
    const winner=trick.reduce((wi,c,i)=>{
      if(!c)return wi;
      return cardPower(c,trump,ledColor)>cardPower(trick[wi],trump,ledColor)?i:wi;
    },trickLead);
    const team=winner%2===0?0:1;
    taken[team].push(...trick.filter(c=>c));
    const trickPts=countPts(trick.filter(c=>c));
    addLog(`${PNAMES[winner]} wins trick${trickPts>0?' (+'+trickPts+' pts)':''}.`);
    trickWinner=winner;
    if(team===0) haptic('medium');
    render();
    setTimeout(()=>{
      trick=[null,null,null,null]; trickLead=winner; trickWinner=-1;
      if(hands[0].length===0) scoreRound();
      else{render();if(winner!==0)later(aiPlay,600);}
    },1100);
  } else {
    const n=getNext(); if(n>0)later(aiPlay,550);
  }
}

function scoreRound(){
  const pts=[countPts(taken[0]),countPts(taken[1])];
  const before=scores.slice();
  const bidTeam=bidWinner%2===0?0:1;
  const defTeam=1-bidTeam;
  let msgs=[];
  if(pts[bidTeam]>=bid){scores[bidTeam]+=pts[bidTeam];msgs.push(`${bidTeam===0?'You+North':'West+East'} made bid! +${pts[bidTeam]} pts`);}
  else{scores[bidTeam]-=bid;scores[defTeam]+=pts[defTeam];msgs.push(`${bidTeam===0?'You+North':'West+East'} set! -${bid}. Opponents get ${pts[defTeam]}.`);}
  // Even if set, defenders still score
  if(pts[bidTeam]>=bid) scores[defTeam]+=pts[defTeam];
  lastDelta=[scores[0]-before[0],scores[1]-before[1]];
  msgs.forEach(m=>addLog(m,'pts'));
  phase=scores[0]>=WIN_SCORE||scores[1]>=WIN_SCORE?'game-over':'round-end';
  if(phase==='game-over') endGame();
  else{haptic(lastDelta[0]>lastDelta[1]?'success':'light');render();}
}

function endGame(){
  const won=scores[0]>scores[1];
  addLog(`${won?'You & North win':'West & East win'}! ${scores[0]}–${scores[1]}.`,'pts');
  try{
    const players=[
      {name:PNAMES[0]+' & '+PNAMES[2],score:scores[0]},
      {name:PNAMES[1]+' & '+PNAMES[3],score:scores[1]}
    ];
    GameHistory.savePlayerGame('rook','Rook (AI)',players,won?0:1,0,{teamGame:true});
  }catch(e){}
  haptic(won?'success':'heavy');
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function cardEl(c,cls=''){
  if(!c)return`<div class="rk-empty"></div>`;
  const col=c.isRook?'rook-bird':COLOR_CSS[c.color];
  const tr=!c.isRook&&trump&&c.color===trump?'trump-c':'';
  return`<div class="rkc ${col} ${tr} ${cls}" data-key="${cKey(c)}">
    ${c.pts?`<span class="pts">${c.pts}</span>`:''}
    <div class="rk-r">${c.isRook?'🐦':c.num}</div>
    <div class="rk-s">${c.isRook?'ROOK':c.color.toUpperCase()}</div>
  </div>`;
}
let logOpen=false;
function renderLog(){
  const last=log.length?log[log.length-1].msg:'';
  return `<details class="g-log" id="g-log" ${logOpen?'open':''}><summary>Game log<span class="last">${esc(last)}</span></summary>
    <div class="g-log-body">${log.slice(-14).map(({msg,cls})=>`<div class="${cls||''}">${esc(msg)}</div>`).join('')}</div></details>`;
}
function wireLog(){
  const d=document.getElementById('g-log');
  if(!d) return;
  d.addEventListener('toggle',()=>{logOpen=d.open;});
  const b=d.querySelector('.g-log-body'); if(b) b.scrollTop=b.scrollHeight;
}
function setBar(html){document.getElementById('g-bar').innerHTML=html||'';}
const US=()=>esc(PNAMES[0])+' + North', THEM='West + East';

function render(){
  const root=document.getElementById('rk-root');
  let html='';
  const bidTeam=bidWinner<0?-1:bidWinner%2===0?0:1;

  // Meta
  html+=`<div class="g-meta"><span class="g-pill">First to ${WIN_SCORE}</span>${trump?`<span class="g-pill gold"><span class="dot ${trump}"></span>Trump: ${trump}</span>`:''}${bidWinner>=0?`<span class="g-pill">${bidWinner===0?'You':esc(PNAMES[bidWinner])} bid ${bid}</span>`:''}</div>`;

  if(phase==='game-over'||phase==='round-end'){
    const over=phase==='game-over';
    const won=scores[0]>scores[1];
    const made=countPts(taken[bidTeam])>=bid;
    html+=`<div class="g-result ${over&&won?'':'plain'}">
      <div class="g-result-icon">${over?(won?'🏆':'🐦'):(made?'✅':'💥')}</div>
      <div class="g-result-title">${over?(won?'You & North win!':'West & East win'):(bidTeam===0?(made?'You made your bid!':'Your team was set'):(made?'Opponents made it':'Opponents were set!'))}</div>
      <div class="g-result-sub">${over?`${scores[0]} – ${scores[1]} · first to ${WIN_SCORE}`:`${bidWinner===0?'You':esc(PNAMES[bidWinner])} bid ${bid} · trump ${trump}`}</div>
      <div class="g-rows">
        <div class="g-row you"><span>${US()}</span><span class="r">${countPts(taken[0])} pts <span class="${lastDelta[0]>=0?'pos':'neg'}">${lastDelta[0]>=0?'+':''}${lastDelta[0]}</span><b>${scores[0]}</b></span></div>
        <div class="g-row"><span>${THEM}</span><span class="r">${countPts(taken[1])} pts <span class="${lastDelta[1]>=0?'pos':'neg'}">${lastDelta[1]>=0?'+':''}${lastDelta[1]}</span><b>${scores[1]}</b></span></div>
      </div>
    </div>`;
    html+=renderLog();
    root.innerHTML=html;wireLog();
    setBar(over?`<button class="btn btn-gold" id="ng-btn">New Game</button>`:`<button class="btn btn-gold" id="nr-btn">Next Hand</button>`);
    document.getElementById('ng-btn')?.addEventListener('click',()=>{haptic('light');newGame();});
    document.getElementById('nr-btn')?.addEventListener('click',()=>{haptic('light');newRound();});
    return;
  }

  // Scores
  html+=`<div class="g-hud rk-hud">
    <div class="g-seat us ${scores[0]>scores[1]?'lead':''}">
      <div class="g-seat-name">${US()}</div>
      <div class="g-seat-score">${scores[0]}</div>
      <div class="g-seat-sub">${phase==='play'?`${countPts(taken[0])} pts this hand${bidTeam===0?' · need '+bid:''}`:bidTeam===0?'won the bid':' '}</div>
    </div>
    <div class="g-seat them ${scores[1]>scores[0]?'lead':''}">
      <div class="g-seat-name">${THEM}</div>
      <div class="g-seat-score">${scores[1]}</div>
      <div class="g-seat-sub">${phase==='play'?`${countPts(taken[1])} pts this hand${bidTeam===1?' · need '+bid:''}`:bidTeam===1?'won the bid':' '}</div>
    </div>
  </div>`;

  // Table — compass: 0 You (S), 1 West, 2 North (partner), 3 East
  const cur=phase==='play'?getNext():-1;
  const pos=['rk-s','rk-w','rk-n','rk-e'];
  const nm=['You','West','North','East'];
  const slot=p=>{
    const turnNow=(phase==='play'&&cur===p&&trickWinner<0)||(phase==='bid'&&currentBidder===p);
    let inner;
    if(phase==='bid'){
      const b=bidHistory[p];
      inner=`<div class="rk-empty" style="display:grid;place-items:center;font-family:var(--display);font-weight:800;color:${b===-2?'rgba(255,255,255,.45)':'#fff'};font-size:${b>0?'1rem':'.72rem'}">${b>0?b:b===-2?'PASS':''}</div>`;
    } else inner=trick[p]?cardEl(trick[p],'sm'+(trickWinner===p?' win':'')+(lastPlayKey===cKey(trick[p])?' drop':'')):'<div class="rk-empty"></div>';
    return `<div class="rk-slot ${pos[p]} ${turnNow?'turn':''}">${inner}<div class="rk-slot-name">${nm[p]}${p===2?' <small>partner</small>':''}${p!==0?` <small>· ${hands[p].length}</small>`:''}</div></div>`;
  };
  let center;
  if(phase==='bid') center=`<div class="rk-center-lbl">High bid</div><div class="rk-center-val">${minBid>70||bidHistory.some(b=>b>0)?minBid-5:'—'}</div><div class="rk-center-sub">min next ${minBid}</div>`;
  else if(phase==='nest') center=`<div class="rk-center-lbl">Nest</div><div class="rk-center-val">🪺</div><div class="rk-center-sub">${bidWinner===0?'yours':esc(PNAMES[bidWinner])}</div>`;
  else center=`<div class="rk-center-lbl">Trump</div><div class="rk-center-val C_${trump.slice(0,3)}">${trump}</div><div class="rk-center-sub">Trick ${Math.max(1,Math.min(13,14-Math.max(...hands.map(h=>h.length))-(trickWinner>=0?1:0)))}/13</div>`;
  html+=`<div class="felt g-table"><div class="rk-trick">${slot(2)}${slot(1)}<div class="rk-center">${center}</div>${slot(3)}${slot(0)}</div></div>`;
  lastPlayKey=null;

  // Status
  let status='',scls='';
  if(phase==='bid') {status=currentBidder===0?'Your bid — or pass':`${esc(PNAMES[currentBidder])} is bidding…`;scls=currentBidder===0?'yours':'';}
  else if(phase==='nest'){
    if(bidWinner!==0) status=`${esc(PNAMES[bidWinner])} is taking the nest…`;
    else if(!nestTaken){status='You won the bid! Take the nest';scls='yours';}
    else if(hands[0].length>13){status=`Choose ${hands[0].length-13} cards to bury · ${nestPicks.length} picked`;scls='yours';}
    else {status='Name your trump color';scls='yours';}
  } else if(phase==='play'){
    if(trickWinner>=0) status=`${trickWinner===0?'You win':esc(PNAMES[trickWinner])+' wins'} the trick`;
    else if(cur===0){status=trick.some(c=>c)?'Your turn — follow the led color':'Your lead';scls='yours';}
    else if(cur>0) status=`${esc(PNAMES[cur])} is playing…`;
  }
  if(status) html+=`<div class="g-status ${scls}">${status}</div>`;

  // Bidding panel
  if(phase==='bid'&&currentBidder===0){
    const bids=[];
    for(let b=minBid;b<=120;b+=5) bids.push(b);
    html+=`<div class="g-panel accent"><div class="g-panel-title">Your bid</div>
      <div class="g-panel-sub">Points your team will capture (of 120). Minimum ${minBid}.</div>
      <div class="rk-bid-grid">${bids.map(b=>`<button class="rk-bid-btn" data-bid="${b}">${b}</button>`).join('')}
        <button class="rk-bid-btn pass-btn" data-bid="pass">Pass</button></div></div>`;
  }

  // Nest phase: player picks up nest and chooses trump
  if(phase==='nest'&&bidWinner===0){
    if(!nestTaken){
      html+=`<div class="g-panel accent"><div class="g-panel-title">The nest</div>
        <div class="g-panel-sub">Add these 5 cards to your hand, then bury 5.</div>
        <div class="rk-nest">${nest.map(c=>cardEl(c,'sm')).join('')}</div></div>`;
    } else if(hands[0].length===13&&trump===null){
      html+=`<div class="g-panel accent"><div class="g-panel-title">Name trump</div>
        <div class="g-panel-sub">The Rook bird is always the highest trump.</div>
        <div class="rk-trumps">${COLORS.map(c=>`<button class="btn btn-outline rk-trump-btn" data-color="${c}"><span class="dot ${c}"></span>${c} · ${hands[0].filter(x=>x.color===c).length}</button>`).join('')}</div></div>`;
    }
  }

  // Player hand
  const isYourPlay=phase==='play'&&cur===0&&trickWinner<0;
  const isNestDiscard=phase==='nest'&&bidWinner===0&&nestTaken&&hands[0].length>13;
  const valid=isYourPlay?validPlays(0).map(cKey):[];
  html+=`<div class="g-label"><span>Your hand · ${hands[0].length}</span><span>${isYourPlay?'tap a card to play':isNestDiscard?'tap to bury':''}</span></div>
  <div class="rk-hand" id="player-hand">
    ${hands[0].map(c=>cardEl(c,isNestDiscard?('playable'+(nestPicks.includes(cKey(c))?' picked':'')):isYourPlay?(valid.includes(cKey(c))?'playable':'unplayable'):'')).join('')}
  </div>`;

  html+=renderLog();
  root.innerHTML=html;wireLog();

  // Action bar
  if(phase==='nest'&&bidWinner===0&&!nestTaken) setBar(`<button class="btn btn-gold" id="add-nest-btn">Take the Nest</button>`);
  else if(isNestDiscard){const need=hands[0].length-13;setBar(`<button class="btn btn-gold" id="bury-btn" ${nestPicks.length===need?'':'disabled'}>Bury ${nestPicks.length}/${need}</button>`);}
  else setBar('');

  document.querySelectorAll('.rk-bid-btn').forEach(b=>{
    b.addEventListener('click',()=>playerBid(b.dataset.bid==='pass'?'pass':+b.dataset.bid));
  });
  document.querySelectorAll('.rk-trump-btn').forEach(b=>b.addEventListener('click',()=>playerChooseTrump(b.dataset.color)));
  document.getElementById('add-nest-btn')?.addEventListener('click',playerTakeNest);
  document.getElementById('bury-btn')?.addEventListener('click',playerConfirmNestDiscard);
  document.getElementById('player-hand')?.querySelectorAll('.rkc').forEach(el=>{
    el.addEventListener('click',()=>{
      const c=hands[0].find(c=>cKey(c)===el.dataset.key);
      if(!c) return;
      if(isNestDiscard) playerToggleNestPick(c);
      else if(isYourPlay) playerPlay(c);
    });
  });
}

newGame();
</script>
<script>if(typeof FrequentPlayers!=="undefined") FrequentPlayers.installNameChip();</script>

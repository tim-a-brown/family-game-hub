movies:[
  {q:"What year was the first Star Wars film released?",c:"1977",w:["1980","1975","1983"],e:"Star Wars: A New Hope was released May 25, 1977. It revolutionized blockbuster filmmaking."},
  {q:"Who directed the Lord of the Rings trilogy?",c:"Peter Jackson",w:["Steven Spielberg","James Cameron","Ridley Scott"],e:"New Zealand director Peter Jackson made all three films simultaneously, filming in New Zealand from 1999–2001."},
  {q:"What does 'CGI' stand for?",c:"Computer-Generated Imagery",w:["Cinematic Graphic Interface","Creative Graphics and Imaging","Computer Grid Integration"],e:"CGI uses computer software to create visual effects, from backgrounds to entire creatures."},
  {q:"What film won the first Academy Award for Best Picture?",c:"Wings (1927)",w:["Sunrise (1927)","The Broadway Melody (1929)","Cimarron (1930)"],e:"Wings, a WWI aviation drama, won the first Best Picture Oscar at the 1st Academy Awards ceremony in 1929."},
  {q:"What is 'method acting'?",c:"A technique where actors deeply immerse themselves in a character's emotional reality",w:["A style of comedy that relies on physical humor","The practice of filming in chronological order","Using a teleprompter instead of memorizing lines"],e:"Associated with Lee Strasberg's Actors Studio, method actors like Dustin Hoffman and Daniel Day-Lewis fully inhabit their roles."},
  {q:"What is the highest-grossing film of all time (not adjusted for inflation)?",c:"Avatar (2009)",w:["Avengers: Endgame","Titanic","Star Wars: The Force Awakens"],e:"Avatar earned $2.92 billion worldwide; its 2022 re-release pushed it above Avengers: Endgame."},
  {q:"What film features the line 'Here's looking at you, kid'?",c:"Casablanca (1942)",w:["Gone With the Wind","Citizen Kane","The Maltese Falcon"],e:"The line, spoken by Humphrey Bogart to Ingrid Bergman, became one of cinema's most beloved quotes."},
  {q:"What is a 'MacGuffin' in filmmaking?",c:"An object or goal that motivates characters but whose specific nature is unimportant to the plot",w:["The climactic moment of a film","A flashback scene that explains a character's past","The final twist in a thriller"],e:"Alfred Hitchcock popularized the term. In Raiders of the Lost Ark, the Ark is a MacGuffin — what matters is the chase."},
  {q:"Who invented the movie camera (Kinetoscope)?",c:"Thomas Edison and William Dickson",w:["Louis and Auguste Lumière","Georges Méliès","Eadweard Muybridge"],e:"Edison and Dickson developed the Kinetoscope in 1891; the Lumières made the first projected film in 1895."},
  {q:"What is a 'crane shot' in filmmaking?",c:"A shot taken from a camera mounted on a crane, providing elevated views or sweeping movements",w:["A very close-up shot of an actor's face","A shot looking up at a standing subject","A quick cut between two scenes"],e:"Crane shots create dramatic sweeping perspectives — like the famous opening of Gone With the Wind."},
  {q:"What film series features a young wizard named Harry Potter?",c:"Harry Potter",w:["The Chronicles of Narnia","Percy Jackson","Eragon"],e:"The 8-film Harry Potter series (2001–2011) is based on J.K. Rowling's books and stars Daniel Radcliffe."},
  {q:"What is the Bechdel Test?",c:"A measure of whether a film has two named women who talk to each other about something other than men",w:["A rating system for film violence","A method of evaluating acting quality","A measure of a film's historical accuracy"],e:"Named after cartoonist Alison Bechdel (1985), the test highlights the underrepresentation of women in movies."},
  {q:"What does the term 'auteur' mean in film criticism?",c:"A director whose personal vision is the dominant creative force in their films",w:["A French film genre focused on romance","A type of documentary filmmaker","A film that was made without a script"],e:"Auteur theory holds that directors like Kubrick, Hitchcock, and Kurosawa express a unique artistic vision across their films."},
  {q:"What film was the first to use synchronized sound?",c:"The Jazz Singer (1927)",w:["Singin' in the Rain (1952)","The Broadway Melody (1929)","Don Juan (1926)"],e:"Though Don Juan had a synchronized score, The Jazz Singer had synchronized dialogue and is considered the first talkie."},
  {q:"What is a 'dolly shot' in filmmaking?",c:"A shot where the camera moves on a rolling platform toward or away from the subject",w:["A shot using a handheld camera for a shaky effect","A shot from above, looking straight down","A shot taken through a mirror"],e:"Dolly shots create a sense of movement; the famous 'dolly zoom' effect (from Hitchcock's Vertigo) changes perspective dramatically."},
  {q:"Who voices Woody in the Toy Story films?",c:"Tom Hanks",w:["Tim Allen","Jim Parsons","Billy Crystal"],e:"Tom Hanks has voiced Woody since 1995. Tim Allen voices Buzz Lightyear."},
  {q:"What is the difference between a wide-angle and a telephoto lens?",c:"Wide-angle captures broad scenes with depth; telephoto compresses distance and magnifies distant subjects",w:["They are identical but held at different angles","Telephoto requires more light; wide-angle does not","Wide-angle is used indoors; telephoto outdoors only"],e:"Portrait photographers use telephoto (85–135mm); landscape photographers use wide-angle (24mm or less)."},
  {q:"What Marvel film was the first to win an Oscar for Best Picture?",c:"None — no Marvel film has won Best Picture",w:["Black Panther (2018)","Avengers: Endgame (2019)","Spider-Man: Into the Spider-Verse (2018)"],e:"Black Panther was nominated for Best Picture (the first superhero film to be), and Spider-Man: Into the Spider-Verse won Best Animated Feature."},
  {q:"What film features a shark terrorizing a beach town?",c:"Jaws (1975)",w:["The Deep (1977)","Blue Water, White Death (1971)","The Abyss (1989)"],e:"Spielberg's Jaws is often credited with creating the modern summer blockbuster."},
  {q:"What does the 'R' rating in a film mean?",c:"Restricted — viewers under 17 require an accompanying parent or guardian",w:["Recommended for all audiences","The film has been reviewed and approved","A film made for adult audiences only, no minors allowed"],e:"The MPAA rating system includes G, PG, PG-13, R, and NC-17, based on content."},
  {q:"What animated film features a robot named WALL-E who falls in love?",c:"WALL-E (2008)",w:["Robots (2005)","The Iron Giant (1999)","Big Hero 6 (2014)"],e:"Pixar's WALL-E (2008) directed by Andrew Stanton won the Academy Award for Best Animated Feature."},
  {q:"What is a 'montage' in filmmaking?",c:"A sequence of shots edited together to condense time or convey information quickly",w:["A slow, continuous shot with no cuts","A technique using mirrors to create special effects","A scene filmed from multiple camera angles simultaneously"],e:"Rocky's training montage and the classic Soviet montage theory of Eisenstein are famous examples."},
  {q:"Who played the role of Katniss Everdeen in The Hunger Games?",c:"Jennifer Lawrence",w:["Shailene Woodley","Emma Watson","Kristen Stewart"],e:"Jennifer Lawrence starred in all four Hunger Games films (2012–2015)."},
  {q:"What is the cinematographer's role in filmmaking?",c:"The Director of Photography who controls how the film looks through lighting and camera choices",w:["The person who directs actors on set","The editor who assembles the final film","The person who manages the film's budget"],e:"Cinematographers like Roger Deakins (Blade Runner 2049) shape the visual language of a film as much as the director."},
  {q:"What does 'non-linear storytelling' mean?",c:"A narrative that doesn't unfold in chronological order",w:["A story told from multiple characters' perspectives simultaneously","A film without a traditional plot structure","A documentary that interviews subjects without a script"],e:"Films like Pulp Fiction, Memento, and Arrival use non-linear structure to create mystery or reveal character."},
  {q:"What film features the song 'Somewhere Over the Rainbow'?",c:"The Wizard of Oz (1939)",w:["Singin' in the Rain (1952)","Snow White and the Seven Dwarfs (1937)","Gone With the Wind (1939)"],e:"Judy Garland sang 'Somewhere Over the Rainbow' as Dorothy Gale in the beloved 1939 classic."},
  {q:"What is a 'sequel' versus a 'prequel'?",c:"A sequel continues a story after the original; a prequel explores events that happened before",w:["They are the same thing","A sequel has the same characters; a prequel has new ones","A prequel improves on the original story"],e:"Star Wars Episodes IV–VI came first; Episodes I–III are prequels showing events that happened before."},
  {q:"What studio is responsible for producing the Avengers films?",c:"Marvel Studios",w:["Warner Bros.","Universal","Paramount"],e:"Marvel Studios, now owned by Disney, produced the MCU films including all Avengers films."},
  {q:"Who wrote and directed most of the Pixar film Inside Out?",c:"Pete Docter",w:["Andrew Stanton","Brad Bird","Lee Unkrich"],e:"Pete Docter directed Up, Monsters Inc., Inside Out, and Soul — all focused on emotional themes."},
  {q:"What is a 'shot reverse shot' in filmmaking?",c:"Alternating between two characters during a conversation",w:["A technique where the camera spins 180°","A flashback immediately followed by the present","A scene filmed from opposing angles simultaneously"],e:"Used in virtually every dialogue scene, this technique shows reaction shots and maintains screen direction."},
  {q:"What film won the first Academy Award for Best Animated Feature?",c:"Shrek (2001)",w:["Monsters, Inc. (2001)","Ice Age (2002)","Spirited Away (2002)"],e:"Shrek beat Monsters, Inc. to win the inaugural Best Animated Feature Oscar. Spirited Away won the following year."},
  {q:"What is the significance of Citizen Kane (1941)?",c:"It introduced innovative techniques in cinematography and storytelling that influenced all filmmaking",w:["It was the first film with color photography","It was the highest-grossing film of the 1940s","It established the studio system in Hollywood"],e:"Orson Welles' Citizen Kane pioneered deep focus photography, non-linear narrative, and expressive lighting."},
  {q:"What does 'POV shot' mean in filmmaking?",c:"A point-of-view shot showing what a character sees from their perspective",w:["A shot from directly above a character","An extreme close-up of a character's eyes","A wide shot showing the full scene"],e:"POV shots put the audience in a character's position; Halloween's opening is a famous subjective POV shot."},
  {q:"What is foley in film production?",c:"The art of creating sound effects in a studio to sync with film action",w:["The coloring and grading of film footage","The process of mixing music into films","The digitally correcting facial expressions of actors"],e:"Foley artists recreate sounds like footsteps, door slams, and cloth rustling because on-set recording is rarely clean."},
  {q:"What does 'the fourth wall' mean in performance?",c:"The imaginary wall between performers and the audience that they 'break' by addressing the audience directly",w:["The final act of a film or play","The backstory of a character that is never revealed","The physical screen between the audience and the film"],e:"Deadpool and Ferris Bueller frequently break the fourth wall by speaking directly to the audience."},
  {q:"What is a 'mise-en-scène' in filmmaking?",c:"Everything visible within the frame: set, costumes, lighting, and actor positioning",w:["The music score composed for a film","The dialogue written for the screenplay","The editing rhythm of a scene"],e:"'Mise-en-scène' is a French theater term meaning 'placing on stage' — it's about what the director places in the frame."},
  {q:"Who starred in the first Iron Man film (2008)?",c:"Robert Downey Jr.",w:["Chris Evans","Chris Hemsworth","Jeremy Renner"],e:"Robert Downey Jr.'s charismatic performance as Tony Stark launched the Marvel Cinematic Universe."},
  {q:"What is a 'plot twist'?",c:"An unexpected revelation that changes the audience's understanding of the story",w:["A climactic action scene","When the villain reveals their plan","When the protagonist changes their goal mid-film"],e:"Famous plot twists include The Sixth Sense, The Usual Suspects, and Psycho — each fundamentally changes the story's meaning."},
  {q:"What film does the quote 'To infinity and beyond!' come from?",c:"Toy Story (1995)",w:["Interstellar (2014)","Lost in Space (1998)","Space Jam (1996)"],e:"Buzz Lightyear's catchphrase from Pixar's Toy Story became one of the most recognizable movie quotes of the 1990s."},
  {q:"What does a film's 'aspect ratio' mean?",c:"The proportional relationship between the film's width and height",w:["The number of frames per second in a film","The size of the film stock used to shoot","The budget-to-revenue ratio of a film"],e:"Standard TV is 4:3; widescreen cinema is 2.39:1. Aspect ratios affect the visual storytelling of a film."},
  {q:"Which 2019 film became the first non-English-language film to win Best Picture?",c:"Parasite (South Korea)",w:["Roma (Mexico)","The Artist (France)","Pan's Labyrinth (Spain)"],e:"Bong Joon-ho's Parasite won Best Picture, Best Director, Best Original Screenplay, and Best International Film at the 2020 Oscars."},
  {q:"What is the 'hero's journey'?",c:"A narrative template in which a hero ventures into an unknown world, faces challenges, and returns transformed",w:["A method for writing screenplay action sequences","A Hollywood formula for blockbuster endings","A genre of film focused on historical battles"],e:"Described by Joseph Campbell in 1949, the hero's journey appears in Star Wars, The Lion King, and countless other stories."},
  {q:"Who composed the score for Star Wars?",c:"John Williams",w:["Hans Zimmer","Ennio Morricone","Danny Elfman"],e:"John Williams is among the most celebrated film composers in history, also scoring Jaws, Indiana Jones, and Schindler's List."},
  {q:"What is 'blocking' in film direction?",c:"Planning where actors move and where cameras are placed during a scene",w:["Preventing a film from receiving distribution","The use of CGI to remove unwanted elements","Writing dialogue that creates conflict between characters"],e:"Directors like Kubrick and Hitchcock are known for precise, mathematically choreographed blocking."},
  {q:"What does 'cinematography' mean?",c:"The art and technique of filming motion pictures",w:["The study of film history","The marketing of films to audiences","The process of editing footage into a final cut"],e:"Cinematographers control lighting, camera movement, composition, and film stock to create the visual mood of a film."},
  {q:"What is the significance of the golden ratio in filmmaking?",c:"It guides composition to create visually balanced and pleasing frames",w:["It determines the proper frame rate for smooth motion","It is used to calculate screen brightness","It sets the standard length of feature films"],e:"The golden ratio (approximately 1.618) appears in famous paintings and is used by cinematographers for rule-of-thirds composition."},
  {q:"What makes a film 'noir'?",c:"Dark visual style, cynical characters, and morally ambiguous stories, often about crime",w:["Colorless black-and-white photography","A French New Wave style of filmmaking","Films made during the 1930s Depression era"],e:"Film noir (French for 'dark film') features shadowy lighting, femmes fatales, and pessimistic themes. Examples: Double Indemnity, Chinatown."},
  {q:"What is the 'uncanny valley'?",c:"The discomfort people feel when a humanoid figure looks almost, but not exactly, human",w:["A genre of horror film set in isolated locations","The eerie silence in a film before a jump scare","A technique for aging actors digitally"],e:"CGI characters in films like Polar Express or early Beowulf fell into the uncanny valley — too human to be stylized, not human enough to be real."},
  {q:"Who plays Hermione Granger in the Harry Potter films?",c:"Emma Watson",w:["Bonnie Wright","Evanna Lynch","Jessie Cave"],e:"Emma Watson played Hermione across all eight Harry Potter films (2001–2011)."},
  {q:"What is the difference between a 'hard cut' and a 'dissolve' in editing?",c:"A hard cut immediately switches between shots; a dissolve gradually transitions between them",w:["A hard cut removes audio; a dissolve keeps it","Dissolves are used only for flashbacks","They are used for different camera angles in the same scene"],e:"Hard cuts are used for action and tension; dissolves suggest passage of time or a dreamy quality."},
  {q:"What was the first fully computer-animated feature film?",c:"Toy Story (1995)",w:["A Bug's Life (1998)","Antz (1998)","The Lion King (1994)"],e:"Pixar's Toy Story was the world's first fully computer-animated feature-length film, released by Disney in 1995."},
  {q:"What is a 'storyboard'?",c:"A sequence of drawings showing the planned shots and composition of a film",w:["A list of scenes in a screenplay","A map of film locations","A budget breakdown for the production"],e:"Directors use storyboards (like Hitchcock's and Kubrick's incredibly detailed ones) to pre-visualize every shot."},
  {q:"What does 'diegetic sound' mean in film?",c:"Sound that exists within the world of the film — characters can hear it",w:["Sound that is added in post-production","Background music that sets the mood","Sound effects only (no music)"],e:"A character turning on a radio creates diegetic music. A film score that the characters can't hear is non-diegetic."},
  {q:"What makes Hayao Miyazaki's films distinctive?",c:"Hand-drawn animation, themes of environmentalism, complex female protagonists, and Japanese folklore",w:["CGI animation combined with live action","Stories adapted directly from Western fairy tales","His use of 3D technology in animated films"],e:"Studio Ghibli films like Spirited Away, My Neighbor Totoro, and Princess Mononoke are beloved worldwide for their artistry and depth."},
  {q:"What is a 'Steadicam'?",c:"A camera stabilizing mount that allows smooth tracking shots while the operator walks",w:["A stationary camera locked to a tripod","A drone camera used for aerial shots","A remote-controlled camera on a rail"],e:"The Steadicam (invented 1975) enabled iconic shots in The Shining, Rocky, and countless other films."},
  {q:"Who directed Jurassic Park?",c:"Steven Spielberg",w:["George Lucas","James Cameron","Ron Howard"],e:"Steven Spielberg directed Jurassic Park (1993), which pioneered the use of CGI for photo-realistic creatures."},
  {q:"What does 'ADR' stand for in film production?",c:"Automated Dialogue Replacement — re-recording dialogue in a studio after filming",w:["Advanced Digital Rendering","Aerial Drone Recording","Automatic Dialogue Reconstruction"],e:"ADR is used when on-set audio is poor due to background noise. The actor watches the scene and re-records their lines in sync."},
  {q:"What is a 'climax' in film structure?",c:"The point of highest tension in the narrative where the main conflict reaches its peak",w:["The final scene of a film","The opening action sequence","The moment when the protagonist gives up"],e:"In a three-act structure, the climax comes near the end of Act 3, resolving the central conflict."},
  {q:"What film features the line 'Why so serious?'",c:"The Dark Knight (2008)",w:["Batman Returns (1992)","Batman Begins (2005)","Joker (2019)"],e:"Heath Ledger's iconic portrayal of the Joker in Christopher Nolan's The Dark Knight (2008)."},
  {q:"What is the difference between 'deep focus' and 'shallow focus' photography?",c:"Deep focus keeps both foreground and background in focus; shallow focus blurs the background",w:["Deep focus requires more light","Shallow focus is used outdoors; deep focus indoors","They refer to the distance between camera and subject"],e:"Orson Welles used deep focus in Citizen Kane; portrait photographers use shallow focus (bokeh) to isolate subjects."},
  {q:"What animated Disney film features a young girl named Mirabel?",c:"Encanto (2021)",w:["Moana (2016)","Brave (2012)","Coco (2017)"],e:"Encanto follows the magical Madrigal family; it won the Academy Award for Best Animated Feature in 2022."},
  {q:"Who played the Joker in the 2019 film Joker?",c:"Joaquin Phoenix",w:["Heath Ledger","Jared Leto","Mark Hamill"],e:"Joaquin Phoenix won the Academy Award for Best Actor for his portrayal of Arthur Fleck/Joker."},
  {q:"What is 'color grading' in film?",c:"The post-production process of adjusting colors to achieve a specific visual style or mood",w:["Choosing colors for costumes and sets","Adding animated color to black-and-white films","The process of digitally removing green screens"],e:"Mad Max: Fury Road's orange-and-teal palette and The Grand Budapest Hotel's pastel palette are products of distinctive color grading."},
  {q:"What does it mean when a film 'passes the Bechdel Test'?",c:"It has at least two named women who have a conversation about something other than men",w:["The film has a majority female cast","The film was directed by a woman","The film has no romantic plot"],e:"Surprisingly, many celebrated films fail this simple test, highlighting gender representation issues in cinema."},
  {q:"What is the significance of Stanley Kubrick as a filmmaker?",c:"He is considered one of cinema's greatest artists for his precision, visual style, and thematic depth",w:["He invented the first color photography technique","He was the fastest director in Hollywood history","He directed the most commercially successful films ever"],e:"Kubrick directed 2001: A Space Odyssey, The Shining, A Clockwork Orange, and Full Metal Jacket — each in a completely different style."},
  {q:"What was the first James Bond film?",c:"Dr. No (1962)",w:["Goldfinger (1964)","Thunderball (1965)","From Russia With Love (1963)"],e:"Dr. No, starring Sean Connery as James Bond, launched the longest-running film franchise in cinema history."},
  {q:"What is a 'beat' in screenwriting?",c:"A unit of dramatic action or the smallest meaningful unit of a scene",w:["A line of dialogue between two characters","The musical rhythm of a film's score","An action sequence"],e:"A beat changes the dynamics of a scene — something new is said, decided, or felt. Scenes are made up of beats."},
  {q:"What is 'sound design'?",c:"The creation and arrangement of all audio elements in a film, including effects, music, and dialogue",w:["Only the music soundtrack of a film","The recording of actors' dialogue on set","The mixing of the film into surround sound formats"],e:"Ben Burtt's creation of lightsaber sounds, R2-D2's bleeps, and Chewbacca's voice for Star Wars is legendary sound design."},
  {q:"What film features the character Atticus Finch?",c:"To Kill a Mockingbird (1962)",w:["12 Angry Men (1957)","Inherit the Wind (1960)","The Verdict (1982)"],e:"Gregory Peck played Atticus Finch in the film adaptation of Harper Lee's novel. The character represents moral courage and justice."},
  {q:"What does 'negative space' mean in film composition?",c:"The empty space around a subject that defines and gives visual weight to the subject",w:["Dark or underexposed areas in a frame","A scene filmed without artificial lighting","The blank portions of a black-and-white film"],e:"Negative space in composition can convey isolation, smallness, or tension — as seen throughout Kubrick's The Shining."},
  {q:"What is a 'sleeper hit'?",c:"A film that was not expected to be popular but became a major commercial or cultural success",w:["A film made on an extremely low budget","A film that was released without any marketing","A film whose title contains a hidden meaning"],e:"Paranormal Activity cost $15,000 to make and earned $193 million. My Big Fat Greek Wedding is another famous sleeper hit."},
],
math:[
  {q:"What is 15% of 200?",c:"30",w:["25","35","20"],e:"15% of 200 = 0.15 × 200 = 30. Or find 10% (20) and add half of that (10)."},
  {q:"What is the prime factorization of 60?",c:"2² × 3 × 5",w:["2 × 3 × 10","4 × 15","2 × 30"],e:"60 = 2 × 30 = 2 × 2 × 15 = 2 × 2 × 3 × 5 = 2² × 3 × 5."},
  {q:"Solve: 3x + 7 = 22. What is x?",c:"5",w:["6","4","7"],e:"Subtract 7: 3x = 15. Divide by 3: x = 5."},
  {q:"What is the area of a triangle with base 10 and height 6?",c:"30",w:["60","15","36"],e:"Area = ½ × base × height = ½ × 10 × 6 = 30."},
  {q:"What is the value of 2⁸?",c:"256",w:["128","512","64"],e:"2⁸ = 2×2×2×2×2×2×2×2 = 256."},
  {q:"What is the median of: 3, 7, 5, 9, 1?",c:"5",w:["5","3","6"],e:"Arrange in order: 1, 3, 5, 7, 9. The middle value is 5."},
  {q:"What is the sum of the interior angles of a triangle?",c:"180°",w:["90°","360°","270°"],e:"All triangles have interior angles that sum to exactly 180°."},
  {q:"If a rectangle has a perimeter of 30 and a width of 7, what is its length?",c:"8",w:["9","6","10"],e:"Perimeter = 2l + 2w → 30 = 2l + 14 → 2l = 16 → l = 8."},
  {q:"What is the least common multiple of 4 and 6?",c:"12",w:["8","24","18"],e:"Multiples of 4: 4, 8, 12... Multiples of 6: 6, 12... First common multiple is 12."},
  {q:"What is 25% of 160?",c:"40",w:["32","48","20"],e:"25% = 1/4. 160 ÷ 4 = 40."},
  {q:"What is the value of √(144)?",c:"12",w:["11","13","14"],e:"12 × 12 = 144, so √144 = 12."},
  {q:"Simplify: 3/4 + 1/6",c:"11/12",w:["4/10","1/2","5/6"],e:"LCD is 12. 3/4 = 9/12; 1/6 = 2/12. Sum = 11/12."},
  {q:"What is the area of a circle with radius 5? (Use π ≈ 3.14)",c:"78.5",w:["31.4","157","15.7"],e:"Area = π × r² = 3.14 × 25 = 78.5."},
  {q:"What is the mean of: 8, 12, 6, 10, 14?",c:"10",w:["11","9","12"],e:"Sum = 8+12+6+10+14 = 50. Mean = 50 ÷ 5 = 10."},
  {q:"In the order of operations, what does PEMDAS stand for?",c:"Parentheses, Exponents, Multiplication/Division, Addition/Subtraction",w:["Points, Equations, Multiples, Decimals, Addition, Subtraction","Powers, Expressions, Multiples, Division, Addition, Subtraction","Parentheses, Equations, Multiplication, Decimals, Averages, Subtraction"],e:"PEMDAS tells you the order to evaluate expressions; multiplication and division are done left to right, same with addition and subtraction."},
  {q:"What is the mode of: 4, 7, 2, 7, 9, 4, 7, 3?",c:"7",w:["4","5","2"],e:"Mode is the value that appears most often. 7 appears 3 times — more than any other number."},
  {q:"Solve: 5(x - 3) = 20",c:"7",w:["5","4","8"],e:"Distribute: 5x - 15 = 20. Add 15: 5x = 35. Divide by 5: x = 7."},
  {q:"What is a rational number?",c:"Any number that can be expressed as a fraction p/q where q ≠ 0",w:["Any number with a decimal point","Any number greater than zero","Any number that is not a whole number"],e:"Rational numbers include integers, fractions, and terminating or repeating decimals. Irrational numbers like π cannot be expressed as fractions."},
  {q:"What is the GCF of 24 and 36?",c:"12",w:["6","4","18"],e:"Factors of 24: 1,2,3,4,6,8,12,24. Factors of 36: 1,2,3,4,6,9,12,18,36. Greatest common factor = 12."},
  {q:"What is the volume of a rectangular prism with l=5, w=4, h=3?",c:"60",w:["47","48","56"],e:"Volume = length × width × height = 5 × 4 × 3 = 60 cubic units."},
  {q:"What type of angle is 135°?",c:"Obtuse",w:["Acute","Right","Reflex"],e:"Acute: less than 90°. Right: exactly 90°. Obtuse: between 90° and 180°. Reflex: between 180° and 360°."},
  {q:"If a car travels at 60 mph for 2.5 hours, how far does it go?",c:"150 miles",w:["120 miles","180 miles","125 miles"],e:"Distance = rate × time = 60 × 2.5 = 150 miles."},
  {q:"What is the slope-intercept form of a linear equation?",c:"y = mx + b",w:["y = bx + m","ax + by = c","y² = mx + b"],e:"m is the slope (rise/run) and b is the y-intercept (where the line crosses the y-axis)."},
  {q:"What is the sum of the exterior angles of any polygon?",c:"360°",w:["180°","540°","720°"],e:"No matter how many sides a polygon has, its exterior angles always add up to exactly 360°."},
  {q:"What is the value of (-3)²?",c:"9",w:["-9","6","-6"],e:"(-3)² = (-3) × (-3) = 9. Negative times negative is positive."},
  {q:"Simplify: 2/3 × 9/4",c:"3/2",w:["6/7","18/12","2/4"],e:"Multiply numerators: 18. Multiply denominators: 12. Simplify 18/12 = 3/2."},
  {q:"What is the formula for the circumference of a circle?",c:"C = 2πr (or C = πd)",w:["C = πr²","C = 4r","C = 2r²π"],e:"Circumference is the distance around a circle. Diameter = 2r, so C = 2πr = πd."},
  {q:"What is a right triangle with legs of 3 and 4? What is the hypotenuse?",c:"5",w:["7","6","4.5"],e:"The Pythagorean theorem: a² + b² = c². 9 + 16 = 25. √25 = 5. This is the classic 3-4-5 right triangle."},
  {q:"What is the probability of rolling a number less than 4 on a fair die?",c:"1/2",w:["1/3","2/3","1/6"],e:"Numbers less than 4 on a die: 1, 2, 3 (three outcomes). Total outcomes: 6. Probability = 3/6 = 1/2."},
  {q:"What is a coordinate plane?",c:"A grid formed by two number lines (x-axis and y-axis) that intersect at the origin",w:["A chart used for plotting statistical data","A grid used to draw 3D shapes","A number line extended to include negative numbers"],e:"Points are plotted as (x, y); the origin is (0, 0). Quadrants are numbered I (both positive) through IV."},
  {q:"Solve: 2(3x - 1) = 4x + 6",c:"4",w:["2","3","5"],e:"6x - 2 = 4x + 6. Subtract 4x: 2x - 2 = 6. Add 2: 2x = 8. x = 4."},
  {q:"What is an 'integer'?",c:"Any whole number, including negative numbers and zero",w:["Any number with a decimal point","Any positive whole number","Any number that is not a fraction"],e:"Integers: ...-3, -2, -1, 0, 1, 2, 3... They include negative whole numbers but not fractions or decimals."},
  {q:"What is the Pythagorean theorem?",c:"a² + b² = c², where c is the hypotenuse of a right triangle",w:["a + b = c","a × b = c²","(a + b)² = c"],e:"The theorem relates the three sides of a right triangle. Only works when there's a 90° angle."},
  {q:"What is the difference between perimeter and area?",c:"Perimeter is the distance around a shape; area is the space inside it",w:["Perimeter is measured in square units; area is measured in regular units","They measure the same thing in different units","Perimeter applies to circles; area to polygons"],e:"Perimeter (units): add all sides. Area (units²): length × width for rectangles; ½bh for triangles."},
  {q:"What is an 'expression' vs an 'equation' in math?",c:"An expression has no equals sign; an equation has one",w:["An expression has variables; an equation does not","An expression is solved; an equation is simplified","They are the same thing"],e:"2x + 3 is an expression; 2x + 3 = 9 is an equation that can be solved for x."},
  {q:"What is the volume of a cylinder with radius 3 and height 5? (Use π ≈ 3.14)",c:"≈ 141.3",w:["≈ 94.2","≈ 47.1","≈ 188.4"],e:"V = π × r² × h = 3.14 × 9 × 5 = 3.14 × 45 ≈ 141.3 cubic units."},
  {q:"What is the formula for interest? (Simple interest)",c:"I = P × r × t (principal × rate × time)",w:["I = P + r + t","I = P/r × t","I = r/P × t"],e:"Example: $500 at 4% for 3 years: I = 500 × 0.04 × 3 = $60 in interest."},
  {q:"What is a 'proportion'?",c:"An equation stating that two ratios are equal",w:["A fraction greater than 1","The relationship between the parts and the whole","A comparison of two quantities by subtraction"],e:"If 3/4 = 6/8, these are proportional. Cross-multiplication verifies: 3×8 = 4×6 = 24."},
  {q:"What is the range of a data set?",c:"The difference between the largest and smallest values",w:["The average of all values","The middle value when sorted","The most frequent value"],e:"Range = maximum - minimum. For {2, 5, 8, 12, 15}, range = 15 - 2 = 13."},
  {q:"What is scientific notation?",c:"A way of writing very large or very small numbers using powers of 10",w:["The notation used in chemistry labs","A system for measuring in metric units","A way of writing fractions as decimals"],e:"3,500,000 = 3.5 × 10⁶. 0.00042 = 4.2 × 10⁻⁴. Used extensively in science."},
  {q:"If y = 2x + 3, what is y when x = -2?",c:"-1",w:["7","-7","1"],e:"y = 2(-2) + 3 = -4 + 3 = -1."},
  {q:"What is an exponent?",c:"A number that tells how many times the base is multiplied by itself",w:["The number being multiplied by a coefficient","A number greater than its base","The square root of a number"],e:"In 5³, the exponent is 3 — meaning 5 × 5 × 5 = 125."},
  {q:"What is the interior angle sum of a quadrilateral?",c:"360°",w:["180°","270°","540°"],e:"Every quadrilateral can be split into two triangles (each with 180°), giving 2 × 180° = 360°."},
  {q:"What does it mean for a function to be 'linear'?",c:"The graph is a straight line; the rate of change is constant",w:["The equation uses only addition and subtraction","The output is always positive","The equation has only one variable"],e:"Linear functions have the form y = mx + b. They have a constant slope (rate of change)."},
  {q:"What is a 'net' of a 3D shape?",c:"A 2D pattern that can be folded to form the 3D shape",w:["A graph showing the dimensions of a solid","A table listing the properties of geometric solids","A formula for finding volume"],e:"A cube's net consists of six squares arranged so they fold into a cube. Used in manufacturing and packaging design."},
  {q:"If an item costs $45 and is marked up 20%, what is the new price?",c:"$54",w:["$54","$47","$49"],e:"20% of $45 = $9. $45 + $9 = $54."},
  {q:"What is the difference between a prime number and a composite number?",c:"Prime has exactly 2 factors (1 and itself); composite has more",w:["Prime is always odd; composite is always even","Prime is greater than 10; composite is less","Composite numbers are negative; prime numbers are positive"],e:"2, 3, 5, 7, 11 are prime. 4, 6, 9, 12 are composite. 1 is neither."},
  {q:"What does it mean to find the 'absolute value' of a number?",c:"The distance from zero on a number line — always non-negative",w:["Multiplying a number by -1 if it is negative","Finding the square root of a number","The opposite of a number's sign"],e:"|−8| = 8, |8| = 8. Absolute value ignores the sign."},
  {q:"What is the formula for slope (m) between two points?",c:"m = (y₂ - y₁) / (x₂ - x₁)",w:["m = (x₂ - x₁) / (y₂ - y₁)","m = y₂ × x₂","m = (y₂ + y₁) / (x₂ + x₁)"],e:"Slope = rise/run = change in y / change in x. A slope of 2 means for every 1 unit right, the line goes 2 units up."},
  {q:"What is the sum of the interior angles of a hexagon?",c:"720°",w:["540°","1080°","900°"],e:"Formula: (n-2) × 180°. For a hexagon: (6-2) × 180° = 4 × 180° = 720°."},
  {q:"What is a 'histogram'?",c:"A bar graph that shows the frequency distribution of a data set",w:["A chart that shows how parts relate to a whole","A graph that shows two variables plotted against each other","A table of values for a function"],e:"Unlike a regular bar graph, histogram bars touch each other because the data is continuous (like age ranges)."},
  {q:"Simplify: 4x + 3y - 2x + 5y",c:"2x + 8y",w:["6x + 2y","2x - 2y","6xy"],e:"Combine like terms: 4x - 2x = 2x; 3y + 5y = 8y. Result: 2x + 8y."},
  {q:"What is a 'unit rate'?",c:"A ratio with a denominator of 1, comparing a quantity to one unit",w:["A rate that never changes","The rate at which a unit converts to another","The speed at which one unit of something is produced"],e:"If you earn $90 in 6 hours, the unit rate is $15 per hour. Unit rates make comparison easy."},
  {q:"What is the formula for finding percent change?",c:"(New - Old) / Old × 100%",w:["(Old - New) / New × 100%","New / Old × 100%","(New + Old) / 2"],e:"If price goes from $80 to $100: (100-80)/80 × 100% = 25% increase."},
  {q:"What is the relationship between diameter and radius of a circle?",c:"Diameter = 2 × radius (the diameter passes through the center)",w:["Radius = 2 × diameter","They are the same measurement","Diameter = radius²"],e:"The radius goes from the center to the edge; the diameter goes all the way across, passing through the center."},
  {q:"What is the rule for multiplying negative numbers?",c:"Negative × negative = positive; negative × positive = negative",w:["The result is always negative if either number is negative","The sign of the larger number determines the result","Negative numbers cannot be multiplied"],e:"(-3) × (-4) = 12; (-3) × 4 = -12; (-3) × (-4) × (-2) = -24."},
  {q:"What is a scatter plot used for?",c:"Showing the relationship between two variables — whether they correlate",w:["Showing how data changes over time","Comparing the sizes of different categories","Showing the frequency of individual values"],e:"If dots slope upward, there's a positive correlation. Downward = negative correlation. Random = no correlation."},
  {q:"What does it mean when we say two triangles are 'congruent'?",c:"They have exactly the same shape and size",w:["They have the same angles but different sizes","They are mirror images of each other","They have the same area but different shapes"],e:"Congruent means identical — same sides and same angles. 'Similar' means same shape but possibly different size."},
  {q:"What is a 'variable' in algebra?",c:"A letter that represents an unknown or changing value",w:["A number that remains constant in an equation","A type of fraction","The answer to an equation"],e:"In 3x + 5 = 14, x is the variable representing the unknown value we solve for (x = 3)."},
  {q:"What does 'evaluate' mean in math?",c:"Find the numerical value of an expression by substituting known values",w:["Rearrange terms to simplify","Check whether an equation is balanced","Find the variable that makes an equation true"],e:"'Evaluate 4x² when x = 3': substitute 3 for x → 4(9) = 36."},
  {q:"What is the sum of interior angles of a pentagon?",c:"540°",w:["360°","720°","900°"],e:"Formula: (n-2) × 180°. Pentagon (5 sides): (5-2) × 180° = 3 × 180° = 540°."},
  {q:"What is a 'counterexample'?",c:"A specific example that disproves a general statement",w:["An example that proves a theorem","An operation that reverses another","The opposite of a variable"],e:"Claim: 'All prime numbers are odd.' Counterexample: 2 is prime and even. One counterexample disproves a claim."},
  {q:"If a store discounts an item by 30% and it now costs $49, what was the original price?",c:"$70",w:["$63","$79","$55"],e:"If $49 is 70% of the original (100% - 30% = 70%), then original = $49 / 0.70 = $70."},
  {q:"What is the formula for the area of a trapezoid?",c:"A = ½ × (b₁ + b₂) × h",w:["A = b × h","A = ½ × b × h","A = b₁ × b₂ × h"],e:"Average the two parallel bases, multiply by height. b₁ and b₂ are the two parallel sides."},
  {q:"What is the distributive property?",c:"a(b + c) = ab + ac — multiplying by a sum equals multiplying each term separately",w:["(a + b) + c = a + (b + c)","a × b = b × a","a + 0 = a"],e:"Example: 4(x + 3) = 4x + 12. It lets you 'distribute' the multiplication across addition."},
  {q:"What does the symbol π (pi) represent?",c:"The ratio of a circle's circumference to its diameter, approximately 3.14159",w:["The ratio of a circle's area to its radius","The square root of 9.87","The sum of the first 10 integers"],e:"π is irrational — it goes on forever without repeating. It appears in all circle and sphere calculations."},
  {q:"What is a 'multiple' of a number?",c:"The product of that number and any integer",w:["A number that divides evenly into another number","A number smaller than the original","The difference between two numbers"],e:"Multiples of 6: 6, 12, 18, 24, 30... (6 × 1, 6 × 2, etc.). The LCM uses multiples."},
  {q:"What is the 'associative property' of multiplication?",c:"(a × b) × c = a × (b × c) — the grouping of factors doesn't change the product",w:["a × b = b × a","a(b + c) = ab + ac","a × 1 = a"],e:"(2 × 3) × 4 = 6 × 4 = 24; 2 × (3 × 4) = 2 × 12 = 24. Same result regardless of grouping."},
  {q:"What is the difference between theoretical and experimental probability?",c:"Theoretical is calculated by logic; experimental is based on actual trial results",w:["Theoretical applies to card games; experimental to sports","They are always equal","Experimental probability is more accurate than theoretical"],e:"Theoretical: P(heads) = 1/2. Experimental: after 100 flips, 47 heads = 47/100 ≈ 0.47. More trials bring them closer."},
  {q:"What is a 'percent'?",c:"A ratio or fraction out of 100",w:["A decimal to the hundredths place","Any number that is not a whole number","A number greater than 1"],e:"Per-cent literally means 'per hundred.' 75% = 75/100 = 0.75. Percentages are widely used in taxes, tips, and statistics."},
  {q:"What is the difference between 'rotation', 'reflection', and 'translation' in geometry?",c:"Rotation: turn around a point; Reflection: flip over a line; Translation: slide without turning",w:["They are different names for the same transformation","Rotation changes size; the others don't","Translation requires a line of symmetry"],e:"These three transformations preserve shape and size (they are 'rigid motions' or 'isometries')."},
]
};

const TOPICS=Object.keys(QUESTIONS);
const TOPIC_COLORS={america:'#3b82f6',world:'#22c55e',science:'#8b5cf6',colorado:'#f59e0b',nature:'#10b981',history:'#ef4444',sports:'#f97316',movies:'#ec4899',math:'#6366f1'};

let curTopic='america', score=0, total=0, correct_count=0, streak=0, answered=false;
let usedIdx=new Map();TOPICS.forEach(t=>usedIdx.set(t,[]));

function buildTopics(){
  const el=document.getElementById('topic-row');el.innerHTML='';
  TOPICS.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='topic-btn'+(t===curTopic?' active':'');
    btn.textContent=t.charAt(0).toUpperCase()+t.slice(1);
    btn.style.borderColor=t===curTopic?TOPIC_COLORS[t]:'rgba(255,255,255,.14)';
    if(t===curTopic)btn.style.background=`rgba(${hexToRgb(TOPIC_COLORS[t])},.15)`;
    btn.addEventListener('click',()=>{curTopic=t;buildTopics();loadQ();});
    el.appendChild(btn);
  });
}

function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`${r},${g},${b}`;}

function loadQ(){
  answered=false;
  document.getElementById('tv-next').style.display='none';
  document.getElementById('tv-result').textContent='';
  document.getElementById('tv-explain').textContent='';
  const pool=QUESTIONS[curTopic];
  let used=usedIdx.get(curTopic);
  if(used.length>=pool.length){used=[];usedIdx.set(curTopic,[]);}
  let idx;
  do{idx=Math.floor(Math.random()*pool.length);}while(used.includes(idx));
  used.push(idx);usedIdx.set(curTopic,used);
  const q=pool[idx];
  document.getElementById('tv-topic').textContent=curTopic.charAt(0).toUpperCase()+curTopic.slice(1);
  document.getElementById('tv-q').textContent=q.q;
  // Shuffle choices
  const choices=[q.c,...q.w].sort(()=>Math.random()-.5);
  const el=document.getElementById('tv-choices');el.innerHTML='';
  choices.forEach(ch=>{
    const btn=document.createElement('button');
    btn.className='tv-choice';btn.textContent=ch;
    btn.addEventListener('click',()=>answer(btn,ch,q.c,q.e));
    el.appendChild(btn);
  });
}

function answer(btn,chosen,correct,explain){
  if(answered)return;answered=true;total++;
  const right=chosen===correct;
  if(right){score+=10+streak*2;streak++;correct_count++;document.getElementById('tv-result').innerHTML='<span style="color:#22c55e">✓ Correct! +'+(10+(streak-1)*2)+'pts</span>';}
  else{streak=0;document.getElementById('tv-result').innerHTML='<span style="color:#ef4444">✗ Incorrect</span>';}
  document.getElementById('tv-explain').textContent=explain;
  document.getElementById('tv-score').textContent=score;
  document.getElementById('tv-streak').textContent=streak;
  document.getElementById('tv-pct').textContent=total?Math.round(correct_count/total*100)+'%':'—';
  const sf=Math.min(100,streak*12);
  document.getElementById('streak-fill').style.width=sf+'%';
  // Color all choices
  document.querySelectorAll('.tv-choice').forEach(b=>{
    if(b.textContent===correct)b.classList.add(right&&b===btn?'correct':'reveal');
    else if(b===btn)b.classList.add('wrong');
  });
  document.getElementById('tv-next').style.display='';
}

document.getElementById('tv-next').addEventListener('click',loadQ);

function tvHistRender(e){
  return GameHistory.renderStatGrid([
    {val:e.score,lbl:'Score'},{val:e.correct_count+'/'+e.total,lbl:'Correct'},
    {val:Math.round(e.correct_count/e.total*100)+'%',lbl:'Accuracy'},
    {val:e.bestStreak,lbl:'Best Streak'},{val:e.topic,lbl:'Topic'},
  ]);
}

// Add persistent History button to the stats bar
(function(){
  const hb=GameHistory.btn('trivia','Trivia',tvHistRender,'📜');
  hb.title='Session History';hb.style.cssText='padding:3px 8px;font-size:.7rem;';
  document.querySelector('.tv-stats')?.appendChild(hb);
})();

let bestStreak=0;
// Track best streak per session
const _origAnswer=window._tvAnswer;
document.getElementById('tv-next').addEventListener('click',()=>{bestStreak=Math.max(bestStreak,streak);},true);

function saveTvState(){
  if(!total)return;
  try{sessionStorage.setItem('tv_state',JSON.stringify({curTopic,score,total,correct_count,streak,usedIdx:Object.fromEntries(usedIdx),_ts:Date.now()}));}catch(e){}
}
function saveTvHistory(){
  if(total<5)return; // only save meaningful sessions
  bestStreak=Math.max(bestStreak,streak);
  GameHistory.save('trivia',{_summary:`${correct_count}/${total} correct · ${score} pts`,_badge:Math.round(correct_count/total*100)+'%',score,total,correct_count,bestStreak,topic:curTopic});
}
function loadTvState(){
  try{
    const raw=sessionStorage.getItem('tv_state');if(!raw)return false;
    const s=JSON.parse(raw);if(!s.usedIdx)return false;
    curTopic=s.curTopic||'america';score=s.score||0;total=s.total||0;correct_count=s.correct_count||0;streak=s.streak||0;
    usedIdx=new Map(Object.entries(s.usedIdx));
    buildTopics();loadQ();return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',()=>{saveTvState();saveTvHistory();});
if(!loadTvState()){buildTopics();loadQ();}
</script>

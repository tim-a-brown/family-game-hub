["In what part of Colorado is the San Juan Mountains region located?","Southwestern Colorado",["Northwestern Colorado","North-central Colorado","Eastern Colorado"],"The San Juan Mountains include Telluride, Silverton, and Ouray — a rugged mining country.",3],
["Which Colorado city is home to the Broadmoor resort and has long been called a 'health resort city'?","Colorado Springs",["Manitou Springs","Pueblo","Salida"],"Colorado Springs' clean mountain air attracted health seekers in the 19th century; The Broadmoor has operated since 1918.",3],
["Which dinosaur was first discovered near Morrison, Colorado, in 1877?","Stegosaurus",["T-rex","Brachiosaurus","Triceratops"],"Stegosaurus is now Colorado's state fossil.",2],
["What is the Colorado State Capitol building known for?","Its gold-leafed dome, coated with Colorado gold",["Its historic murals by Diego Rivera","Being the oldest state capitol in the U.S.","Its location exactly on the Continental Divide"],"The dome is covered in real gold leaf, a tribute to Colorado's gold rush.",3],
["What is the meaning of the Ute Mountain Tribal Park?","It protects Ancestral Puebloan ruins on Ute tribal land",["It preserves the Ute language","It is a bison hunting preserve","It is a wildlife sanctuary for mountain lions"],"The park is adjacent to Mesa Verde and contains cliff dwellings accessible only through Ute guides.",3],
["Which Colorado city is nicknamed 'Choice City'?","Fort Collins",["Boulder","Greeley","Loveland"],"Fort Collins has called itself the 'Choice City' for over a century.",3],
["What is the significance of Bent's Fort in Colorado history?","It was a major trading post on the Santa Fe Trail in the 1830s–1840s",["It was the first military fort in Colorado","It was the site of Colorado's first gold discovery","It was the headquarters of the Pony Express"],"Bent's Old Fort near La Junta was reconstructed and is now a National Historic Site.",3],
["What annual event in Pueblo, Colorado celebrates the state's chili pepper heritage?","Chile and Frijoles Festival",["Colorado Green Chili Cook-off","Pueblo Pepper Days","Rocky Mountain Chili Challenge"],"Pueblo is famous for its own green chile, the Pueblo chile.",3],
["What Colorado city is home to the Celestial Seasonings tea company?","Boulder",["Fort Collins","Golden","Longmont"],"Celestial Seasonings was founded in Boulder in 1969 and its factory there offers free tours.",3],
["Which Colorado town is home to the Colorado School of Mines?","Golden",["Fort Collins","Denver","Loveland"],"Mines, founded in 1874, trains engineers and scientists.",2],
["What is the primary mineral mined in Colorado historically?","Gold and silver",["Coal","Uranium","Molybdenum"],"Gold and silver strikes in the 1800s drove Colorado's population boom, though coal and uranium were also important.",3],
["What is the name of the park/open space system that gives Denver residents access to mountain parks?","Denver Mountain Parks",["Jefferson County Open Space","Colorado Front Range Trail","Bear Creek Regional Park"],"Denver Mountain Parks, established in 1912, includes Red Rocks, Lookout Mountain, and Buffalo Bill's grave.",3],
["What is the Colorado River Compact?","A 1922 agreement dividing Colorado River water among seven western states",["A treaty with Mexico about water rights","A law protecting Colorado's rivers from pollution","A dam-building plan from the 1930s"],"The Compact allocated water to upper and lower basin states, but it overestimated available water — causing ongoing disputes.",3],
["Which Colorado team plays in the NFL?","The Denver Broncos",["The Colorado Rockies","The Denver Nuggets","The Colorado Avalanche"],"The Broncos have won the Super Bowl three times.",1],
["Which Colorado team plays in the NBA?","The Denver Nuggets",["The Denver Broncos","The Colorado Rapids","The Colorado Rockies"],"The Nuggets play in downtown Denver.",1]],
"sports": [
["How many players are on a soccer team on the field?","11",["9","10","12"],"Each team fields 11 players, including the goalkeeper.",1],
["What is the circumference of a standard basketball?","29.5 inches",["28 inches","30 inches","27 inches"],"The NBA uses a regulation ball with a circumference of 29.5 inches.",3],
["In baseball, how many strikes result in an out?","3",["2","4","5"],"Three strikes and you're out — one of baseball's most fundamental rules.",1],
["What is a 'grand slam' in tennis?","Winning all four major tournaments in the same calendar year",["Hitting an unreturnable serve","Winning a match without losing a game","Scoring four aces in a set"],"The four Grand Slam tournaments are the Australian Open, French Open, Wimbledon, and U.S. Open.",2],
["In American football, how many points is a field goal worth?","3",["2","4","6"],"A field goal (kicked through the uprights) scores 3 points; a touchdown scores 6.",1],
["What is the name of the trophy awarded to the NHL championship team?","Stanley Cup",["Hart Trophy","Conn Smythe Trophy","Vezina Trophy"],"The Stanley Cup is the oldest professional sports trophy in North America, first awarded in 1893.",2],
["What does 'ERA' stand for in baseball?","Earned Run Average",["Extra Runs Allowed","Expected Run Average","Error Run Allowance"],"ERA measures how many earned runs a pitcher allows per nine innings — a key measure of pitching effectiveness.",3],
["In volleyball, how many points are needed to win a set?","25 (with a 2-point lead)",["21","30","15"],"Sets are played to 25, but a team must win by 2; the final set is played to 15.",2],
["What is the distance of a marathon?","26.2 miles (42.195 km)",["25 miles","30 km","50 km"],"The marathon distance commemorates the legendary run of Pheidippides from Marathon to Athens in 490 BCE.",2],
["What does 'PER' measure in basketball?","Player Efficiency Rating — a single number summarizing a player's statistical performance",["Points per Effective Recovery","Points Earned per Round","Passing Efficiency Ratio"],"PER, developed by ESPN's John Hollinger, measures a player's per-minute production adjusted for pace.",3],
["What country invented the sport of baseball?","United States",["Canada","England","Cuba"],"Baseball evolved from English bat-and-ball games but developed into its current form in the U.S. in the mid-1800s.",2],
["What is an 'ace' in tennis?","A serve that the opponent cannot touch",["A set won to love (6-0)","Winning a match without dropping a game","Scoring the first point of a tiebreaker"],"An ace is a legal serve that the returner fails to touch; players like John Isner hold records for aces in a career.",2],
["What is the offside rule in soccer?","You can't be closer to the goal than the ball and the second-to-last defender when a teammate passes to you",["You can't step out of bounds before receiving a pass","The goalie can't leave the penalty box","A player can't touch the ball twice in a row"],"A player is offside if they're ahead of the second-to-last defender when the ball is played forward to them.",2],
["How many laps around a standard track is 1 mile?","4",["2","5","6"],"A standard outdoor running track is 400 meters per lap; 4 laps equals 1,600 meters (roughly 1 mile).",2],
["What is 'OPS' in baseball?","On-base Plus Slugging — a combined batting statistic",["Official Pitching Score","Outfield Potential Score","Overall Performance Score"],"OPS adds on-base percentage and slugging percentage, making it one of the most comprehensive batting stats.",3],
["What sport uses the term 'love' to mean zero?","Tennis",["Squash","Badminton","Ping pong"],"'Love' for zero in tennis may come from the French word 'l'oeuf' (egg) representing a zero shape, though the origin is debated.",1],
["What does it mean to be 'under contract' in sports?","An athlete is legally bound to play for a team for a specified time and salary",["An athlete has been drafted by a team","An athlete has been traded to a new team","An athlete has signed an endorsement deal"],"Sports contracts specify salary, years, and performance incentives. Violating a contract can result in fines or suspension.",3],
["How is a winner determined in Olympic boxing?","Judges score each round, unless someone wins by knockout",["By how many times a fighter falls","By the crowd's cheering","By who throws the most punches"],"Judges score every round; if there is no knockout, the fighter with the better scores wins.",2],
["What is the 'Moneyball' approach to baseball?","Using statistical analysis (sabermetrics) to evaluate players more objectively than traditional scouting",["Focusing only on high-salary players","Using computer simulations to set lineups","Analyzing the financial value of winning championships"],"The Oakland A's pioneered this approach under Billy Beane, finding undervalued players through statistics like OBP and OPS.",3],
["In football, what is the difference between a safety and a sack?","A safety scores 2 points; a sack is just a tackle of the QB behind the line of scrimmage",["They are the same thing","A safety results in a free kick; a sack does not","A sack ends the play; a safety does not"],"A safety occurs when the ball carrier is tackled in their own end zone; a sack just stops the play.",2],
["What is a 'hat trick' in soccer?","Scoring three goals in one game",["Three consecutive goals","Three successful penalty kicks","Scoring in three straight games"],"The term originated in cricket; in soccer a hat trick means one player scores three goals in a single match.",1],
["What does 'FG%' stand for in basketball?","Field Goal Percentage — the ratio of shots made to shots attempted",["Free Goal Percentage","Final Game Performance","First-Quarter Goals"],"A player who makes 50 of 100 shots has an FG% of 50%.",2],
["What is the difference between a sprint and a middle-distance race in track?","Sprints are 400m and under; middle-distance is 800m to 2000m",["Sprints use starting blocks; middle-distance does not","Middle-distance is run in lanes; sprints are not","Sprints are on a track; middle-distance is on roads"],"100m, 200m, and 400m are sprints. 800m, 1500m, and 1 mile are middle-distance events.",3],
["What is the hardest thing to do in sports (often cited)?","Hitting a baseball pitched at 90+ mph",["Returning a 140 mph tennis serve","Making a half-court basketball shot","Scoring in professional soccer"],"A 90 mph fastball reaches home plate in about 400 milliseconds — giving the batter roughly 150–175 ms to decide and swing.",2],
["What does it mean when a golfer is '2 under par'?","They have completed the course or hole in 2 strokes fewer than the expected number",["They have two penalties","They hit two balls out of bounds","Their score improved by 2 after 9 holes"],"Par is the expected number of strokes. Under par means you took fewer — the better the score.",2],
["What is the difference between a foul and a violation in basketball?","Fouls involve illegal physical contact; violations are rule infractions without contact",["Fouls result in free throws; violations do not","Violations are more serious","They are the same thing"],"Fouls include reaching in or blocking; violations include traveling, double-dribbling, and shot clock violations.",2],
["What is the Ryder Cup?","A biennial golf competition between teams from the U.S. and Europe",["An annual tournament to determine the world's best golfer","A major golf tournament open to all nationalities","A junior golf competition"],"The Ryder Cup has been held since 1927 and is known for its intense team competition and emotional atmosphere.",2],
["What does 'OBP' measure in baseball?","On-base Percentage — how often a batter reaches base",["Outfield Batting Percentage","Official Ball Power","Out-of-Base Plays"],"OBP counts hits, walks, and hit-by-pitch divided by plate appearances — it's considered more valuable than batting average.",3],
["In what sport is the 'Fosbury Flop' a technique?","High jump",["Pole vault","Long jump","Hurdles"],"Dick Fosbury revolutionized the high jump at the 1968 Olympics by going over the bar backward — a technique now universally used.",2],
["What is a 'perfect game' in bowling?","12 consecutive strikes for a score of 300",["Getting a spare on every frame","Scoring at least 200","Throwing a strike on the first ball of every frame"],"A perfect game requires 12 strikes in a row in a single game — the maximum possible score is 300.",1],
["What is the difference between an inning and an at-bat in baseball?","An inning is when both teams bat once; an at-bat is one player's turn at bat",["An inning is three outs; an at-bat is one pitch","An at-bat includes walks; an inning does not","They are the same thing"],"Each team gets three outs per half-inning. A full game has nine innings.",2],
["What does a libero do in volleyball?","Plays as a defensive specialist who cannot serve or attack above the net",["Sets the ball for the spikers","Plays at the net and blocks","Only serves during the game"],"The libero wears a different colored jersey and substitutes freely for back-row players to specialize in passing and defense.",3],
["What is a 'walk-off' in baseball?","When the home team scores the winning run in the bottom of the last inning",["When a batter is intentionally walked","When a pitcher leaves the game during an inning","When a batter strikes out on a called third strike"],"Called a 'walk-off' because the losing team walks off the field after the game-ending play.",2],
["What does WAR measure in baseball?","Wins Above Replacement — how many more wins a player adds compared to a replacement-level player",["Weighted Average Runs","Wins Against Records","Weighted At-bat Rating"],"A WAR of 2.0 means a player added 2 more wins than an average AAA call-up would. WAR above 5.0 is typically All-Star level.",3],
["What is the difference between man-to-man and zone defense in basketball?","Man-to-man assigns each defender to a specific opponent; zone defends areas of the court",["Zone defense is only used in high school; man-to-man in professional basketball","Man-to-man allows double-teaming; zone does not","They are the same strategy"],"Zone defense can confuse offenses but is vulnerable to good ball movement. Man-to-man is better for defending specific players.",2],
["What is a 'penalty kick' in soccer?","A direct kick from 12 yards out, taken after a foul in the penalty area",["A free kick taken from anywhere on the field","A kick taken by the goalkeeper to restart play","A kick taken after a player is shown a red card"],"Penalty kicks are 1-on-1 with the goalkeeper; about 75–80% are converted into goals.",2],
["What does 'WHIP' measure in baseball?","Walks and Hits per Inning Pitched",["Weighted Hitting Impact Per game","Win-Loss Historical Index for Pitchers","Walks, Hits, and Innings Pitched combined"],"A WHIP of 1.00 means a pitcher allows about one baserunner per inning, which is excellent.",3],
["What is a double-double in basketball?","Reaching double digits (10+) in two statistical categories in one game",["Scoring 20+ points in two consecutive games","Making two consecutive three-pointers","Getting two dunks in one quarter"],"Common double-doubles are points + rebounds or points + assists. A triple-double includes a third category.",2],
["What is the difference between a sprint relay and a distance relay?","Sprint relays (4×100, 4×400) run shorter distances; distance relays run longer legs",["Sprint relays use batons; distance relays do not","Distance relays run uphill; sprint relays are flat","They compete in different Olympics"],"In the 4×100 relay, teams run four 100m legs. The DMR (Distance Medley Relay) has legs of 1200m, 400m, 800m, and 1600m.",3],
["In ice hockey, what is icing?","Shooting the puck from your own half past the other team's goal line without anyone touching it",["When a goalie freezes the puck","When a player delays the game by not skating","When the ice is too rough to play on"],"Icing stops play, the faceoff moves back to the offending team's end, and that team can't change players.",2],
["What is the difference between a personal foul and a technical foul in basketball?","Personal fouls involve illegal contact; technical fouls involve unsportsmanlike conduct or rule violations",["Personal fouls involve the ball; technical fouls do not","Technical fouls result in free throws; personal fouls do not","They are the same type of foul"],"Technical fouls can be called for arguing with refs, excessive timeouts, or hanging on the rim.",2],
["What is the NHL draft and how does it work?","Teams take turns selecting amateur players, with the worst teams picking first",["Players auction themselves to teams","Teams submit bids for players in secret","The Commissioner assigns players to teams"],"The NHL draft follows a similar format to NFL and NBA drafts; the lottery determines the order for non-playoff teams.",3],
["What does 'shooting percentage' mean in hockey?","The percentage of a player's shots that result in goals",["How often a player shoots from outside the blue line","How accurately a player aims at the net","How many goals a player scores per game"],"A shooting percentage of 15% means 15 out of every 100 shots result in goals — above average for forwards.",3],
["What is the difference between a sprint and endurance training?","Sprint training builds speed and power through short, intense bursts; endurance training builds stamina over long durations",["They are both used to build muscle mass","Sprint training uses weights; endurance does not","Endurance training makes athletes slower"],"Elite distance runners and sprinters train very differently; the muscle fiber types used for each differ significantly.",3],
["What is a 'cornerback' in football?","A defensive back who covers wide receivers and defends against passing plays",["A player who runs around the end on offensive plays","A defensive lineman who lines up at the corner","The quarterback who throws corner routes"],"Cornerbacks are typically the fastest defensive players; they match up against the opposing team's wide receivers.",2],
["From 2003 to 2016, what did baseball's All-Star Game decide?","Which league got home-field advantage in the World Series",["The season MVP","Playoff seeding","Next year's schedule"],"The rule ended in 2017; now the team with the better record gets home field.",3],
["What are the four major golf majors?","Masters, U.S. Open, The Open Championship, PGA Championship",["Masters, U.S. Open, Ryder Cup, PGA Championship","Masters, U.S. Open, Players Championship, British Open","Masters, U.S. Open, PGA Championship, Tour Championship"],"The four majors are the most prestigious tournaments in professional golf.",2],
["What is the purpose of a salary cap in professional sports?","To limit team spending on player salaries, promoting competitive balance",["To ensure minimum player salaries","To prevent teams from signing international players","To set ticket price limits"],"Salary caps prevent rich-market teams from outspending small-market teams on payroll indefinitely.",3],
["What is the 'three-second rule' in basketball?","An offensive player cannot remain in the paint for more than three seconds",["A team must shoot within three seconds of receiving the ball","A player can hold the ball for only three seconds","Players must dribble every three steps"],"The three-second lane violation prevents an offensive player from camping under the basket for easy shots.",2],
["What does 'slugging percentage' measure in baseball?","The total number of bases a batter earns per at-bat",["How many home runs a batter hits per game","How hard a batter hits the ball on average","How often a batter gets extra-base hits"],"A single=1 base, double=2, triple=3, home run=4. A slugging percentage of .500 means 2 bases per 4 at-bats.",3],
["What is a hat trick in ice hockey?","When a player scores three goals in one game",["Scoring in three consecutive games","Scoring with three different shot types","Making three assists in one game"],"Fans traditionally throw hats onto the ice when a player scores three goals. A 'natural hat trick' means three consecutive goals.",1],
["What is the role of a tight end in football?","A hybrid player who blocks like a lineman and catches passes like a receiver",["A running back who protects the quarterback","A wide receiver who lines up in the backfield","A defensive player who covers the middle of the field"],"Tight ends like Travis Kelce and Rob Gronkowski have become some of the most valuable offensive weapons in the modern NFL.",2],
["What does the term 'cap space' mean in professional sports?","The amount of money a team has available to spend on player salaries within the salary cap",["The amount a team has already spent on players","The maximum contract a single player can receive","The difference between the cap floor and cap ceiling"],"Teams with lots of cap space can sign free agents; teams over the cap may face penalties or must release players.",3],
["In the Olympics, what determines if a gymnast wins a medal?","The sum of execution and difficulty scores from judges, minus deductions",["A single judge's evaluation","The number of routine elements completed","Public voting by spectators"],"Since 2006, gymnastics has used an open-ended difficulty score plus a 10.0 execution score, allowing for unbounded totals.",3],
["What is the 'luxury tax' in MLB?","A penalty paid by teams whose payroll exceeds a set threshold, shared among other teams",["A fine for using banned substances","A fee paid to use premium ballparks","A tax on player merchandise sales"],"Teams with huge payrolls, like the Dodgers and Yankees, have paid tens of millions of dollars in a single year.",3],
["What is an on-side kick in football?","A short kickoff intended to be recovered by the kicking team",["A kickoff that goes out of bounds","A punt kicked to the side instead of straight","A kickoff that is caught before it bounces"],"The ball must travel 10 yards before the kicking team can touch it.",2],
["What does 'defensive efficiency' measure in basketball?","Points allowed per 100 possessions, adjusted for pace",["The percentage of shots a team blocks","The number of steals per game","How quickly a team transitions from defense to offense"],"Defensive efficiency is considered more meaningful than raw points-per-game allowed because it accounts for pace of play.",3],
["What is the difference between a first serve and second serve in tennis?","Players get two chances to serve; if the first serve faults, they get a second (softer) chance",["The first serve must be faster than 100 mph; the second can be any speed","First serves go to the right side; second serves go to the left","They serve from different positions"],"Missing both serves is a double fault, awarding the point to the opponent. Second serves are typically safer.",2],
["What is a fastbreak in basketball?","When a team quickly pushes the ball up the court before the defense can set up",["A timeout called to stop the clock","An inbounds play near the basket","A pick-and-roll combination"],"Fastbreaks often result in layups or dunks because the offensive team outnumbers the retreating defense.",2],
["What is the 'Heisman Trophy'?","The annual award for the most outstanding player in college football",["The NCAA championship trophy","An award for the best defensive player in the NFL","The award for the college football team with the best record"],"Named after John W. Heisman, the trophy has been awarded since 1935. Winners often become top NFL draft picks.",2],
["In baseball, what does it mean when a Japanese team 'posts' a player?","It lets Major League teams try to sign that player",["The player is retiring","The player is injured","The player's stats are published"],"Stars like Shohei Ohtani came to MLB through the posting system.",3],
["What is a power play in hockey?","When one team has a numerical advantage because the other team has a player in the penalty box",["When the goalie is pulled for an extra skater","When a team scores two goals in under a minute","When all five skaters rush the offensive zone together"],"A power play gives one team a 5-on-4 (or 5-on-3) advantage; top teams score on 20–25% of their power plays.",2],
["What is the 'pitch clock' in MLB?","A timer requiring pitchers to deliver the ball within a set time to speed up the game",["A digital display showing pitch speed","A device that measures pitch accuracy","A timer used by batters to prepare for each pitch"],"Introduced in 2023, the pitch clock made games much faster.",2],
["What does it mean when a batter 'works a count' in baseball?","Taking pitches to reach a favorable or full count (3 balls and 2 strikes)",["Swinging at the first pitch for contact","Bunting to advance a runner","Taking a called third strike"],"Forcing a pitcher to throw many pitches tires them out and can lead to walks.",3],
["How many points is a touchdown worth in American football?","6",["3","7","2"],"Then a kick can add 1 more point, or a play can add 2.",1],
["In which sport do you hit a shuttlecock?","Badminton",["Tennis","Squash","Volleyball"],"A shuttlecock is also called a birdie.",1],
["How many holes are in a standard round of golf?","18",["9","12","20"],"Lots of courses also offer a quick 9.",1],
["How often are the Summer Olympics held?","Every 4 years",["Every year","Every 2 years","Every 5 years"],"The Winter Olympics are held two years after each Summer Games.",1],
["How many players does each basketball team have on the court?","5",["6","7","4"],"Usually two guards, two forwards and a center.",1],
["How many bases are there in baseball, counting home plate?","4",["3","5","6"],"First, second, third and home.",1],
["Which sport is played at Wimbledon?","Tennis",["Golf","Cricket","Soccer"],"Wimbledon, in London, is the oldest tennis tournament in the world.",1],
["What do the five Olympic rings stand for?","Five parts of the world joined together",["Five gold medals","Five founding countries","Five original sports"],"The rings link Africa, the Americas, Asia, Europe and Oceania.",2],
["In soccer, which player is allowed to use their hands?","The goalkeeper",["The captain","The striker","Any defender"],"Only inside their own penalty area.",1],
["What is the name of the NFL championship game?","The Super Bowl",["The World Series","The Stanley Cup Final","The Rose Bowl"],"It is one of the most watched TV events in America.",1],
["Which sport is played with a puck?","Ice hockey",["Lacrosse","Curling","Field hockey"],"A puck is a hard rubber disc.",1],
["What is Major League Baseball's championship called?","The World Series",["The Super Bowl","The Finals","The Grand Slam"],"The first World Series was played in 1903.",1]],
"movies": [
["What year was the first Star Wars film released?","1977",["1980","1975","1983"],"Star Wars: A New Hope was released May 25, 1977. It revolutionized blockbuster filmmaking.",2],
["Who directed the Lord of the Rings trilogy?","Peter Jackson",["Steven Spielberg","James Cameron","Ridley Scott"],"New Zealand director Peter Jackson filmed all three movies at once in New Zealand.",2],
["What does 'CGI' stand for?","Computer-Generated Imagery",["Cinematic Graphic Interface","Creative Graphics and Imaging","Computer Grid Integration"],"CGI uses computer software to create visual effects, from backgrounds to entire creatures.",2],
["What film won the first Academy Award for Best Picture?","Wings (1927)",["Sunrise (1927)","The Broadway Melody (1929)","Cimarron (1930)"],"Wings, a WWI aviation drama, won the first Best Picture Oscar at the 1st Academy Awards ceremony in 1929.",3],
["What is 'method acting'?","A technique where actors deeply immerse themselves in a character's emotional reality",["A style of comedy that relies on physical humor","The practice of filming in chronological order","Using a teleprompter instead of memorizing lines"],"Associated with Lee Strasberg's Actors Studio, method actors like Dustin Hoffman and Daniel Day-Lewis fully inhabit their roles.",3],
["Which movie features the blue Na'vi people on the moon Pandora?","Avatar",["Dune","Star Trek","Lightyear"],"James Cameron's Avatar (2009) was a huge 3D hit.",1],
["What film features the line 'Here's looking at you, kid'?","Casablanca (1942)",["Gone With the Wind","Citizen Kane","The Maltese Falcon"],"The line, spoken by Humphrey Bogart to Ingrid Bergman, became one of cinema's most beloved quotes.",3],
["What is a 'MacGuffin' in filmmaking?","An object or goal that motivates characters but whose specific nature is unimportant to the plot",["The climactic moment of a film","A flashback scene that explains a character's past","The final twist in a thriller"],"Alfred Hitchcock popularized the term. In Raiders of the Lost Ark, the Ark is a MacGuffin — what matters is the chase.",3],
["Who developed the Kinetoscope, an early machine for watching movies, in 1891?","Thomas Edison and William Dickson",["Louis and Auguste Lumière","Georges Méliès","Eadweard Muybridge"],"You watched a Kinetoscope film through a peephole. The Lumière brothers showed the first projected films to an audience in 1895.",3],
["What is a 'crane shot' in filmmaking?","A shot taken from a camera mounted on a crane, providing elevated views or sweeping movements",["A very close-up shot of an actor's face","A shot looking up at a standing subject","A quick cut between two scenes"],"Crane shots create dramatic sweeping perspectives — like the famous opening of Gone With the Wind.",3],
["What film series features a young wizard named Harry Potter?","Harry Potter",["The Chronicles of Narnia","Percy Jackson","Eragon"],"The 8-film Harry Potter series (2001–2011) is based on J.K. Rowling's books and stars Daniel Radcliffe.",1],
["What is the Bechdel Test?","A measure of whether a film has two named women who talk to each other about something other than men",["A rating system for film violence","A method of evaluating acting quality","A measure of a film's historical accuracy"],"Named after cartoonist Alison Bechdel (1985), the test highlights the underrepresentation of women in movies.",3],
["What does the term 'auteur' mean in film criticism?","A director whose personal vision is the dominant creative force in their films",["A French film genre focused on romance","A type of documentary filmmaker","A film that was made without a script"],"Auteur theory holds that directors like Kubrick, Hitchcock, and Kurosawa express a unique artistic vision across their films.",3],
["What film was the first to use synchronized sound?","The Jazz Singer (1927)",["Singin' in the Rain (1952)","The Broadway Melody (1929)","Don Juan (1926)"],"Though Don Juan had a synchronized score, The Jazz Singer had synchronized dialogue and is considered the first talkie.",3],
["What is a 'dolly shot' in filmmaking?","A shot where the camera moves on a rolling platform toward or away from the subject",["A shot using a handheld camera for a shaky effect","A shot from above, looking straight down","A shot taken through a mirror"],"Dolly shots create a sense of movement; the famous 'dolly zoom' effect (from Hitchcock's Vertigo) changes perspective dramatically.",3],
["Who voices Woody in the Toy Story films?","Tom Hanks",["Tim Allen","Jim Parsons","Billy Crystal"],"Tom Hanks has voiced Woody since 1995. Tim Allen voices Buzz Lightyear.",1],
["What is the difference between a wide-angle and a telephoto lens?","Wide-angle captures broad scenes with depth; telephoto compresses distance and magnifies distant subjects",["They are identical but held at different angles","Telephoto requires more light; wide-angle does not","Wide-angle is used indoors; telephoto outdoors only"],"Portrait photographers use telephoto (85–135mm); landscape photographers use wide-angle (24mm or less).",3],
["Which Marvel hero is the king of Wakanda?","Black Panther",["Iron Man","Thor","Doctor Strange"],"Black Panther (2018) was the first superhero film nominated for Best Picture.",1],
["What film features a shark terrorizing a beach town?","Jaws (1975)",["The Deep (1977)","Blue Water, White Death (1971)","The Abyss (1989)"],"Spielberg's Jaws is often credited with creating the modern summer blockbuster.",2],
["What does the 'R' rating in a film mean?","Restricted — viewers under 17 require an accompanying parent or guardian",["Recommended for all audiences","The film has been reviewed and approved","A film made for adult audiences only, no minors allowed"],"The MPA rating system includes G, PG, PG-13, R and NC-17.",2],
["What animated film features a robot named WALL-E who falls in love?","WALL-E (2008)",["Robots (2005)","The Iron Giant (1999)","Big Hero 6 (2014)"],"Pixar's WALL-E (2008) directed by Andrew Stanton won the Academy Award for Best Animated Feature.",1],

["What is the significance of Citizen Kane (1941)?","It introduced innovative techniques in cinematography and storytelling that influenced all filmmaking",["It was the first film with color photography","It was the highest-grossing film of the 1940s","It established the studio system in Hollywood"],"Orson Welles' Citizen Kane pioneered deep focus photography, non-linear narrative, and expressive lighting.",3],
["What does 'POV shot' mean in filmmaking?","A point-of-view shot showing what a character sees from their perspective",["A shot from directly above a character","An extreme close-up of a character's eyes","A wide shot showing the full scene"],"POV shots put the audience in a character's shoes, seeing exactly what they see.",3],
["What is foley in film production?","The art of creating sound effects in a studio to sync with film action",["The coloring and grading of film footage","The process of mixing music into films","The digitally correcting facial expressions of actors"],"Foley artists recreate sounds like footsteps, door slams, and cloth rustling because on-set recording is rarely clean.",3],
["What does 'the fourth wall' mean in performance?","The imaginary wall between performers and the audience that they 'break' by addressing the audience directly",["The final act of a film or play","The backstory of a character that is never revealed","The physical screen between the audience and the film"],"A character breaks the fourth wall when they turn and talk right to the audience, like Ferris Bueller does.",3],
["What is a 'mise-en-scène' in filmmaking?","Everything visible within the frame: set, costumes, lighting, and actor positioning",["The music score composed for a film","The dialogue written for the screenplay","The editing rhythm of a scene"],"'Mise-en-scène' is a French theater term meaning 'placing on stage' — it's about what the director places in the frame.",3],

["What does 'cinematography' mean?","The art and technique of filming motion pictures",["The study of film history","The marketing of films to audiences","The process of editing footage into a final cut"],"Cinematographers control lighting, camera movement, composition, and film stock to create the visual mood of a film.",3],

["What is the volume of a cylinder with radius 3 and height 5? (Use π ≈ 3.14)","≈ 141.3",["≈ 94.2","≈ 47.1","≈ 188.4"],"V = π × r² × h = 3.14 × 9 × 5 = 3.14 × 45 ≈ 141.3 cubic units.",3],

["What is scientific notation?","A way of writing very large or very small numbers using powers of 10",["The notation used in chemistry labs","A system for measuring in metric units","A way of writing fractions as decimals"],"3,500,000 = 3.5 × 10⁶. 0.00042 = 4.2 × 10⁻⁴. Used extensively in science.",3],

["What is a 'unit rate'?","A ratio with a denominator of 1, comparing a quantity to one unit",["A rate that never changes","The rate at which a unit converts to another","The speed at which one unit of something is produced"],"If you earn $90 in 6 hours, the unit rate is $15 per hour. Unit rates make comparison easy.",2],
["What is the formula for finding percent change?","(New - Old) / Old × 100%",["(Old - New) / New × 100%","New / Old × 100%","(New + Old) / 2"],"If price goes from $80 to $100: (100-80)/80 × 100% = 25% increase.",3],

["What does it mean when we say two triangles are 'congruent'?","They have exactly the same shape and size",["They have the same angles but different sizes","They are mirror images of each other","They have the same area but different shapes"],"Congruent means identical — same sides and same angles. 'Similar' means same shape but possibly different size.",2],

["What does 'evaluate' mean in math?","Find the numerical value of an expression by substituting known values",["Rearrange terms to simplify","Check whether an equation is balanced","Find the variable that makes an equation true"],"'Evaluate 4x² when x = 3': substitute 3 for x → 4(9) = 36.",3],
["What is the sum of interior angles of a pentagon?","540°",["360°","720°","900°"],"Formula: (n-2) × 180°. Pentagon (5 sides): (5-2) × 180° = 3 × 180° = 540°.",2],
["What is a 'counterexample'?","A specific example that disproves a general statement",["An example that proves a theorem","An operation that reverses another","The opposite of a variable"],"Claim: 'All prime numbers are odd.' Counterexample: 2 is prime and even. One counterexample disproves a claim.",3],
["If a store discounts an item by 30% and it now costs $49, what was the original price?","$70",["$63","$79","$55"],"If $49 is 70% of the original (100% - 30% = 70%), then original = $49 / 0.70 = $70.",3],

["What is the distributive property?","a(b + c) = ab + ac — multiplying by a sum equals multiplying each term separately",["(a + b) + c = a + (b + c)","a × b = b × a","a + 0 = a"],"Example: 4(x + 3) = 4x + 12. It lets you 'distribute' the multiplication across addition.",3],
["What does the symbol π (pi) represent?","The ratio of a circle's circumference to its diameter, approximately 3.14159",["The ratio of a circle's area to its radius","The square root of 9.87","The sum of the first 10 integers"],"π is irrational — it goes on forever without repeating. It appears in all circle and sphere calculations.",3],
["What is a 'multiple' of a number?","The product of that number and any integer",["A number that divides evenly into another number","A number smaller than the original","The difference between two numbers"],"Multiples of 6: 6, 12, 18, 24, 30... (6 × 1, 6 × 2, etc.). The LCM uses multiples.",3],

["What is a 'percent'?","A ratio or fraction out of 100",["A decimal to the hundredths place","Any number that is not a whole number","A number greater than 1"],"Per-cent literally means 'per hundred.' 75% = 75/100 = 0.75. Percentages are widely used in taxes, tips, and statistics.",1],

["What is 7 × 8?","56",["54","63","48"],"A trick: 5, 6, 7, 8, so 56 = 7 × 8.",1],

["How many inches are in a foot?","12",["10","3","36"],"There are 36 inches in a yard.",1],
["How many centimeters are in a meter?","100",["10","1,000","12"],"Centi means one hundredth.",1],
["What is the next prime number after 7?","11",["9","8","13"],"9 = 3 × 3, so it is not prime.",2],
["What is 1,000 − 1?","999",["990","9,999","900"],"One less than a thousand.",1],

["What is 9 squared?","81",["18","72","99"],"9 × 9 = 81.",1],
["If you have 3 quarters and 2 dimes, how much money do you have?","95 cents",["85 cents","1 dollar","75 cents"],"75 + 20 = 95.",1],
["What is the Roman numeral for 10?","X",["V","L","C"],"V is 5, L is 50 and C is 100.",1],
["What is the Roman numeral for 50?","L",["C","D","X"],"C is 100 and D is 500.",2],
["How many days are in a leap year?","366",["365","364","360"],"The extra day is February 29.",1],
["What is 25 + 37?","62",["52","61","72"],"25 + 35 = 60, plus 2 more.",1]]

<script>
(function () {
  'use strict';
  var el = Kit.el, esc = Kit.esc, app = document.getElementById('app');
  var KEY = 'trivia', SAVE = 'trivia_state', SEEN = 'trivia_seen', CATKEY = 'trivia_cats', LVLKEY = 'trivia_levels';
  var CAT_NAME = {}, CAT_COLOR = { animals: '#16a34a', space: '#6d28d9', science: '#7c3aed', nature: '#059669', world: '#0284c7', america: '#2563eb',
    history: '#dc2626', colorado: '#d97706', sports: '#ea580c', movies: '#db2777', food: '#c2410c', math: '#4f46e5' };
  CATS.forEach(function (c) { CAT_NAME[c[0]] = c[1]; });
  var LEVELS = { easy: 'Easy', medium: 'Medium', hard: 'Hard', mixed: 'Mixed' };
  var BASE = 100, SPEED = 50, BUZZ_ANSWER = 8;

  // Every question gets a stable id from its text, so "recently seen" survives edits elsewhere.
  function hid(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
  var BY_ID = {};
  CATS.forEach(function (c) { QB[c[0]].forEach(function (r) { var id = hid(r[0]); BY_ID[id] = { id: id, cat: c[0], q: r[0], c: r[1], w: r[2], e: r[3], d: r[4] }; }); });

  // ── Local sounds: a quiz-show ding and buzzer (Kit.sfx has no buzzer) ──────
  var actx = null;
  function soundOn() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }
  function ac() { if (!actx) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); } if (actx.state === 'suspended') actx.resume(); return actx; }
  function tone(f, t0, dur, type, vol) {
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function snd(k) {
    if (!soundOn()) return;
    try {
      if (k === 'ding') { tone(1046.5, 0, 0.9, 'sine', 0.16); tone(1568, 0, 0.7, 'sine', 0.08); tone(2093, 0.12, 0.8, 'sine', 0.07); tone(1318.5, 0.12, 0.9, 'triangle', 0.06); }
      else if (k === 'buzzer') { tone(98, 0, 0.55, 'square', 0.07); tone(104, 0, 0.55, 'sawtooth', 0.05); }
      else if (k === 'buzzin') { tone(880, 0, 0.09, 'square', 0.05); tone(1320, 0.07, 0.16, 'square', 0.05); }
      else if (k === 'reel') { tone(1400, 0, 0.025, 'square', 0.02); }
    } catch (e) {}
  }

  Kit.init({
    id: 'trivia',
    onNew: function () { showSetup(); },
    undo: function () { undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Trivia: past games' }); } }],
    rules:
      '<p class="goal">Answer more questions right than anyone else. Fast answers and hot streaks score extra.</p>' +
      '<h3>Pass and play</h3><ul><li>Everyone takes turns. When it says <b>Pass to Cam</b>, hand the phone to Cam, who taps <b>Show my question</b>.</li>' +
      '<li>Each player gets their own question at their own level, so a kid on Easy can play against grown-ups on Hard.</li>' +
      '<li>Tap one of the four answers before the clock runs out. In the last 5 seconds you will hear it ticking.</li></ul>' +
      '<h3>Buzz in</h3><ul><li>Everyone plays at once on one phone. Read the question, then slam your buzzer.</li>' +
      '<li>First to buzz gets ' + BUZZ_ANSWER + ' seconds to answer. Wrong? You are locked out and everyone else can buzz again.</li></ul>' +
      '<h3>Scoring</h3><ul><li>Right answer: <b>' + BASE + ' points</b>, plus up to <b>' + SPEED + '</b> for speed when the timer is on.</li>' +
      '<li>Streaks multiply your points: 3 in a row <b>×2</b>, 5 in a row <b>×3</b>, 7 in a row <b>×4</b>. A wrong answer resets your streak.</li>' +
      '<li>Wrong answers never cost points.</li></ul>' +
      '<h3>Categories and levels</h3><p>Pick any mix of categories. Levels: <b>Easy</b> (great for kids), <b>Medium</b>, <b>Hard</b>, or <b>Mixed</b>. Questions do not repeat in a game, and ones you have seen recently are saved for later.</p>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null, timer = null, snap = null, fresh = null, busy = false;
  function save() {
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'over') Kit.resume.set(S.mode === 'buzz' ? 'Buzz in · question ' + (S.qi + 1) + ' of ' + total() : (S.players.length > 1 ? 'Round ' + (round() + 1) + ' of ' + S.count : 'Question ' + (S.qi + 1) + ' of ' + S.count));
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function N() { return S.players.length; }
  function total() { return S.mode === 'buzz' ? S.count : S.count * N(); }
  function round() { return S.mode === 'buzz' ? S.qi : Math.floor(S.qi / N()); }
  function turn() { return S.mode === 'buzz' ? -1 : S.qi % N(); }
  function rnd(n) { return Math.floor(Math.random() * n); }
  function mult(streak) { return streak >= 7 ? 4 : streak >= 5 ? 3 : streak >= 3 ? 2 : 1; }

  function seenList() { try { var a = JSON.parse(localStorage.getItem(SEEN) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function markSeen(id) {
    var a = seenList().filter(function (x) { return x !== id; }); a.push(id);
    if (a.length > 700) a = a.slice(a.length - 700);
    try { localStorage.setItem(SEEN, JSON.stringify(a)); } catch (e) {}
  }
  // Pick a question: a random selected category first (so categories stay mixed), then a
  // question at the right level that hasn't come up this game, preferring ones not seen lately.
  function pickQ(level) {
    var seen = seenList(), seenAt = {}; seen.forEach(function (id, i) { seenAt[id] = i + 1; });
    var used = {}; S.used.forEach(function (id) { used[id] = 1; });
    var tiers = level === 'easy' ? [[1], [1, 2], [1, 2, 3]] : level === 'medium' ? [[2], [1, 2], [1, 2, 3]] : level === 'hard' ? [[3], [2, 3], [1, 2, 3]] : [[1, 2, 3]];
    for (var t = 0; t < tiers.length; t++) {
      var ds = tiers[t], byCat = {};
      S.cats.forEach(function (c) {
        var list = QB[c].map(function (r) { return BY_ID[hid(r[0])]; }).filter(function (q) { return !used[q.id] && ds.indexOf(q.d) >= 0; });
        if (list.length) byCat[c] = list;
      });
      var cs = Object.keys(byCat);
      if (!cs.length) continue;
      var list = byCat[cs[rnd(cs.length)]];
      var fresh2 = list.filter(function (q) { return !seenAt[q.id]; });
      if (fresh2.length) return fresh2[rnd(fresh2.length)];
      list.sort(function (a, b) { return seenAt[a.id] - seenAt[b.id]; });
      return list[rnd(Math.min(5, list.length))];
    }
    S.used = []; return pickQ(level);
  }

  // ── Setup ─────────────────────────────────────────────────────────────────
  function savedCats() {
    var c = null; try { c = JSON.parse(localStorage.getItem(CATKEY)); } catch (e) {}
    c = Array.isArray(c) ? c.filter(function (x) { return QB[x]; }) : [];
    return c.length ? c : CATS.map(function (x) { return x[0]; });
  }
  function showSetup() {
    stopTimer(); S = null; clearSave(); app.innerHTML = '';
    var chosen = savedCats();
    var st = Kit.setup(app, {
      modes: [
        { id: 'pass', icon: 'phone', title: 'Pass and play', desc: 'Take turns, each with your own question and level' },
        { id: 'buzz', icon: 'users', title: 'Buzz in', desc: 'Everyone at once on one phone. Fastest finger wins' }
      ],
      options: [
        { id: 'level', label: 'Level', value: 'mixed', choices: [['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard'], ['mixed', 'Mixed']] },
        { id: 'each', label: 'Levels', value: 'same', choices: [['same', 'Same for everyone'], ['each', 'Each picks their own']], when: function (m) { return m === 'pass'; } },
        { id: 'count', label: 'Length', value: 5, choices: [[5, '5 each'], [10, '10 each'], [15, '15 each']], when: function (m) { return m === 'pass'; } },
        { id: 'bcount', label: 'Questions', value: 15, choices: [[10, '10'], [15, '15'], [25, '25']], when: function (m) { return m === 'buzz'; } },
        { id: 'timer', label: 'Timer', value: 20, choices: [[15, '15 sec'], [20, '20 sec'], [30, '30 sec'], [0, 'No timer']] }
      ],
      players: { min: 1, max: 6, count: 2, range: function (m) { return m === 'buzz' ? [2, 6] : [1, 6]; } },
      onStart: function (cfg) {
        if (!chosen.length) { Kit.toast('Pick at least one category'); return; }
        start(cfg, chosen.slice());
      }
    });
    var box = el('div', { class: 'cats' });
    function paint() {
      box.innerHTML = '';
      var all = chosen.length === CATS.length;
      box.appendChild(el('button', { type: 'button', class: 'chip' + (all ? ' on' : ''), html: Kit.icon('shuffle') + '<span>Everything</span>', onclick: function () {
        chosen = all ? [] : CATS.map(function (x) { return x[0]; }); persist(); Kit.sfx('tap'); paint();
      } }));
      CATS.forEach(function (c) {
        var on = !all && chosen.indexOf(c[0]) >= 0;
        box.appendChild(el('button', { type: 'button', class: 'chip' + (on ? ' on' : ''), html: esc(c[1]) + ' <span class="n">' + QB[c[0]].length + '</span>', onclick: function () {
          if (all) chosen = [c[0]];
          else if (on) chosen = chosen.filter(function (x) { return x !== c[0]; });
          else chosen.push(c[0]);
          if (!chosen.length) chosen = CATS.map(function (x) { return x[0]; });
          persist(); Kit.sfx('tap'); paint();
        } }));
      });
    }
    function persist() { try { localStorage.setItem(CATKEY, JSON.stringify(chosen)); } catch (e) {} }
    paint();
    st.el.insertBefore(el('div', null, [el('div', { class: 'label', text: 'Categories' }), box]), st.el.querySelector('.btn-lg'));
  }
  function start(cfg, cats) {
    var opt = cfg.options || {};
    S = { mode: cfg.mode, cats: cats, timer: +opt.timer || 0, level: opt.level || 'mixed',
      count: cfg.mode === 'buzz' ? (+opt.bcount || 15) : (+opt.count || 5),
      players: cfg.players.map(function (p) { return { name: p.name, level: opt.level || 'mixed' }; }),
      scores: [], streak: [], best: [], right: [], asked: [], fastest: null, buzzFirst: [],
      qi: 0, used: [], log: [], cur: null, phase: 'cover', started: Date.now() };
    S.players.forEach(function () { S.scores.push(0); S.streak.push(0); S.best.push({ n: 0, cats: [] }); S.right.push(0); S.asked.push(0); S.buzzFirst.push(0); });
    Kit.gameStart();
    snap = null;
    if (cfg.mode === 'pass' && opt.each === 'each' && N() > 1) return pickLevels();
    beginQuestion();
  }

      if (stump) { var sq = BY_ID[stump.id].q; hl.push({ w: 2, t: 'Stumped everyone: ' + (sq.length > 70 ? sq.slice(0, 68) + '…' : sq) }); }
    }
    if (n > 1 && S.scores[ord[0]] > S.scores[ord[1]]) hl.push({ w: 6, t: P[ord[0]].name + ' won by ' + (S.scores[ord[0]] - S.scores[ord[1]]) + ' points' });
    if (n === 1) hl.push({ w: 10, t: P[0].name + ' got ' + S.right[0] + ' of ' + S.asked[0] + ' right' });
    hl.sort(function (a, b) { return b.w - a.w; });
    var levels = S.mode === 'pass' && P.some(function (p) { return p.level !== P[0].level; }) ? 'Own levels' : LEVELS[P[0].level || S.level];
    var catLabel = S.cats.length === CATS.length ? 'All categories' : S.cats.length <= 2 ? S.cats.map(function (c) { return CAT_NAME[c]; }).join(' + ') : S.cats.length + ' categories';
    var mode = (S.mode === 'buzz' ? 'Buzz in' : n > 1 ? 'Pass and play' : 'Solo') + ' · ' + levels + ' · ' + catLabel;
    var rounds;
    if (S.mode === 'buzz') {
      rounds = { labels: S.log.map(function (l, k) { return 'Q' + (k + 1); }), scores: S.log.map(function (l) { return P.map(function (p, i) { return l.p === i ? l.pts : 0; }); }) };
    } else {
      var R = []; for (var r = 0; r < S.count; r++) R.push(P.map(function () { return 0; }));
      S.log.forEach(function (l) { if (R[l.round]) R[l.round][l.p] += l.pts; });
      rounds = { labels: R.map(function (x, k) { return 'R' + (k + 1); }), scores: R };
    }
    var top = n > 1 && S.scores[ord[0]] === S.scores[ord[1]] ? null : P[ord[0]].name;
    Kit.record(KEY, {
      started: S.started, mode: mode,
      players: P.map(function (p, i) { return { name: p.name, score: S.scores[i] }; }),
      winner: n > 1 ? top : (S.right[0] ? P[0].name : null),
      summary: n === 1 ? P[0].name + ': ' + S.right[0] + '/' + S.asked[0] + ' right · ' + S.scores[0] + ' pts' : undefined,
      badge: n === 1 ? Math.round(S.right[0] / Math.max(1, S.asked[0]) * 100) + '%' : '',
      rounds: rounds,
      highlights: hl.slice(0, 6).map(function (h) { return h.t; }),
      meta: { right: S.right, asked: S.asked, cats: S.cats, levels: P.map(function (p) { return p.level; }) }
    });
    clearSave(); snap = null;
    render();
    Kit.sfx('roll');
    setTimeout(function () {
      if (!S || S.phase !== 'over') return;
      var lose = n === 1 && S.right[0] * 2 < S.asked[0];
      Kit.win({
        title: n === 1 ? (S.right[0] === S.asked[0] ? 'Perfect game!' : S.right[0] + ' of ' + S.asked[0] + ' right') : top ? top + ' wins!' : "It's a tie!",
        sub: n === 1 ? S.scores[0] + ' points' : S.scores[ord[0]] + ' points',
        lose: lose,
        rank: n > 1 ? ord.map(function (i) { return { name: P[i].name, score: S.scores[i], color: Kit.color(i) }; }) : null,
        againLabel: 'Play again', again: again,
        extra: [{ label: 'Change settings', onClick: showSetup }],
        closeLabel: 'See the podium', onClose: function () {}
      });
    }, n > 1 ? 2600 : 900);
  }
  function renderFinal(stage) {
    var P = S.players, ord = order();
    stage.appendChild(el('div', { class: 'marq' }, [el('div', { class: 'who', style: { '--c': '#ffd447' } }, [el('i'), el('span', { text: 'Final scores' })]), el('div', { class: 'qn', text: total() + ' questions' })]));
    if (N() === 1) {
      stage.appendChild(el('div', { class: 'solo-final' }, [el('div', { class: 'big', text: S.scores[0] }), el('p', { text: S.right[0] + ' of ' + S.asked[0] + ' right · best run ' + S.best[0].n + ' in a row' })]));
    } else {
      var pod = el('div', { class: 'podium' });
      var slots = [[1, 'p2', 120, 0.5], [0, 'p1', 160, 1.1], [2, 'p3', 86, 0]];
      slots.forEach(function (s) {
        var i = ord[s[0]]; if (i == null) return;
        pod.appendChild(el('div', { class: 'pod ' + s[1], style: { '--c': Kit.color(i), '--h': s[2] + 'px', '--d': s[3] + 's', '--d2': (s[3] + 0.6) + 's' } }, [
          el('div', { class: 'av', text: P[i].name.charAt(0).toUpperCase() }), el('div', { class: 'nm', text: P[i].name }), el('div', { class: 'sc', text: S.scores[i] }),
          el('div', { class: 'step', text: String(s[0] + 1) })
        ]));
      });
      stage.appendChild(pod);
      if (ord.length > 3) {
        var rest = el('div', { class: 'restlist' });
        ord.slice(3).forEach(function (i, k) { rest.appendChild(el('div', null, [el('span', { class: 'dim', text: String(k + 4) }), el('span', { class: 'avatar sm', style: { '--c': Kit.color(i) }, text: P[i].name.charAt(0).toUpperCase() }), el('span', { text: P[i].name }), el('b', { text: S.scores[i] })])); });
        stage.appendChild(rest);
      }
    }
    app.appendChild(el('div', { class: 'endacts' }, [
      el('button', { type: 'button', class: 'btn btn-primary btn-lg btn-block', text: 'Play again', onclick: again }),
      el('button', { type: 'button', class: 'btn btn-soft btn-block', text: 'Change settings', onclick: showSetup }),
      el('button', { type: 'button', class: 'btn btn-ghost btn-block', html: Kit.icon('history') + '<span>Past games</span>', onclick: function () { Kit.history(KEY, { title: 'Trivia: past games' }); } })
    ]));
  }
  function again() {
    var o = S;
    S = { mode: o.mode, cats: o.cats, timer: o.timer, level: o.level, count: o.count, players: o.players.map(function (p) { return { name: p.name, level: p.level }; }),
      scores: [], streak: [], best: [], right: [], asked: [], fastest: null, buzzFirst: [], qi: 0, used: [], log: [], cur: null, phase: 'cover', started: Date.now() };
    S.players.forEach(function () { S.scores.push(0); S.streak.push(0); S.best.push({ n: 0, cats: [] }); S.right.push(0); S.asked.push(0); S.buzzFirst.push(0); });
    Kit.gameStart(); snap = null;
    beginQuestion();
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.players && saved.phase && saved.phase !== 'over' && (saved.phase === 'levels' || (saved.cur && BY_ID[saved.cur.id]))) {
    S = saved;
    if (S.cur && S.phase === 'q' && S.cur.buzz >= 0) S.cur.buzz = -1;   // a half-finished buzz starts over
    if (S.phase === 'q' && S.mode === 'pass' && N() > 1) S.phase = 'cover';  // hand it back to the same player
    render();
  } else showSetup();
  window.__tv = { state: function () { return S; }, byId: BY_ID, qb: QB };
})();
</script>
</body>

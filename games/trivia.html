nature:[
  {q:"What is the difference between a deciduous and an evergreen tree?",c:"Deciduous trees lose their leaves seasonally; evergreens keep them year-round",w:["Deciduous trees are taller","Evergreen trees grow only in cold climates","Deciduous trees do not produce seeds"],e:"Deciduous trees (maple, oak) drop leaves in fall. Evergreens (pine, spruce) stay green year-round."},
  {q:"What is a keystone species?",c:"A species whose removal would significantly disrupt the entire ecosystem",w:["The largest animal in an ecosystem","The most common species","The first species to colonize new land"],e:"Sea otters are keystone species — without them, sea urchins overrun and destroy kelp forests."},
  {q:"How do sharks sense prey in the dark or murky water?",c:"Using electroreception organs called the ampullae of Lorenzini",w:["Through an acute sense of smell only","Through vibrations in their fins","Through thermal imaging like snakes"],e:"Sharks detect the tiny electrical signals produced by the muscles of prey — even buried in sand."},
  {q:"What is the difference between mimicry and camouflage?",c:"Camouflage blends into the background; mimicry copies another species' appearance",w:["They are the same adaptation","Mimicry involves color change; camouflage does not","Camouflage works only on predators; mimicry on prey"],e:"A stick insect uses camouflage; a harmless scarlet king snake mimics the pattern of a venomous coral snake."},
  {q:"What is the primary role of decomposers in an ecosystem?",c:"Break down dead matter and return nutrients to the soil",w:["Convert sunlight to energy","Control herbivore populations","Transport seeds to new locations"],e:"Without decomposers like fungi and bacteria, dead matter would pile up and nutrients would remain locked away."},
  {q:"How do trees communicate with each other?",c:"Through underground fungal networks and chemical signals",w:["Through root-to-root electrical signals","Through pheromones released into the air only","Through pollinator insects"],e:"Trees send chemical warnings through air and share nutrients via mycorrhizal fungal networks — the 'wood wide web.'"},
  {q:"What is a biome?",c:"A large geographic area defined by its climate, plants, and animals",w:["A small ecosystem in a pond or stream","A type of soil found in forests","The area a single animal uses for territory"],e:"Major biomes include tropical rainforest, savanna, desert, temperate forest, taiga, and tundra."},
  {q:"What is the difference between a herbivore, carnivore, and omnivore?",c:"Herbivores eat plants; carnivores eat animals; omnivores eat both",w:["Herbivores are prey; carnivores are predators; omnivores are both","They differ by size and habitat","Herbivores live on land; carnivores in water; omnivores anywhere"],e:"Bears and humans are omnivores; deer are herbivores; wolves are carnivores."},
  {q:"How do migratory birds navigate thousands of miles?",c:"Using magnetic fields, stars, the Sun, and landmarks",w:["Following other animals","Using GPS-like organs in their wings","Memorizing maps from birth"],e:"Birds use multiple cues including Earth's magnetic field, celestial navigation, and memory of landmarks."},
  {q:"What is the purpose of a coral reef?",c:"Support enormous biodiversity and protect coastlines from waves",w:["Produce oxygen for the ocean","Filter salt from seawater","Regulate ocean temperature"],e:"Coral reefs cover less than 1% of the ocean but support 25% of all marine species."},
  {q:"What is bioluminescence?",c:"The production of light by living organisms through chemical reactions",w:["Reflection of sunlight by animals","An adaptation to absorb UV light","The glow of radioactive minerals in deep sea"],e:"Fireflies, deep-sea fish, and certain jellyfish all produce light through chemical reactions involving luciferin."},
  {q:"What is a symbiotic relationship?",c:"A long-term interaction between two species",w:["Two animals competing for food","A plant that grows faster than normal","An animal that changes its habitat"],e:"Symbiosis includes mutualism (both benefit), commensalism (one benefits, other unaffected), and parasitism (one benefits, other harmed)."},
  {q:"Why do leaves change color in autumn?",c:"Chlorophyll breaks down, revealing yellow and orange pigments; red pigments are newly made",w:["Cold temperatures produce new pigments","Leaves absorb different wavelengths as they age","Trees inject colored chemicals into leaves"],e:"Shorter days trigger trees to stop producing chlorophyll, revealing hidden carotenoids and newly made anthocyanins."},
  {q:"What is the difference between complete and incomplete metamorphosis?",c:"Complete has 4 stages (egg, larva, pupa, adult); incomplete has 3 (egg, nymph, adult)",w:["Complete happens faster","Incomplete applies only to butterflies","Complete produces only flying insects"],e:"Butterflies and beetles undergo complete metamorphosis; grasshoppers and cockroaches undergo incomplete."},
  {q:"How do plants disperse their seeds?",c:"Wind, water, animals (eaten or attached), and mechanical ejection",w:["Roots extend outward and deposit seeds","Only through pollination","Seeds only fall directly under the parent plant"],e:"Maple seeds spin in the wind; berries are eaten by birds; burrs attach to fur; some pods explode."},
  {q:"What is the role of apex predators in an ecosystem?",c:"They regulate prey populations and maintain ecosystem balance",w:["They eat only the sick and elderly","They compete with humans for resources","They play no critical role — smaller predators do the same job"],e:"Removing wolves from Yellowstone caused deer to overgraze riverbanks, which destabilized rivers — until wolves were reintroduced."},
  {q:"What is nitrogen fixation?",c:"The conversion of atmospheric nitrogen gas into compounds plants can use",w:["The process by which plants absorb oxygen","The breaking down of proteins by decomposers","The storage of nitrogen in soil minerals"],e:"Certain bacteria (including those in legume roots) fix nitrogen, making soil more fertile."},
  {q:"What is the difference between a deciduous forest biome and a taiga?",c:"Deciduous forests have warm summers and cold winters; taiga has long cold winters and brief summers",w:["Deciduous forests are in the tropics; taiga is in the mountains","They are the same biome under different names","Taiga has more biodiversity"],e:"Taiga (boreal forest) dominates Canada, Russia, and Scandinavia; it's dominated by conifers, not deciduous trees."},
  {q:"How do bats navigate in the dark?",c:"Echolocation — they emit ultrasonic sounds and interpret the echoes",w:["Infrared vision","Magnetically sensing the ground below","Very large eyes that see in the dark"],e:"Bats emit high-frequency sound pulses and use the echoes to detect objects and prey with remarkable precision."},
  {q:"What is the significance of the Amazon River basin?",c:"It contains 10% of all species on Earth and produces 20% of the world's river discharge",w:["It is the longest river basin in the world","It is the primary source of the world's oxygen","It is the deepest river basin in the world"],e:"The Amazon basin is the world's largest tropical rainforest and is critical to global climate regulation."},
  {q:"What is the relationship between predator and prey populations?",c:"They cycle together — more prey leads to more predators, which reduces prey, which reduces predators",w:["Predator populations always stay stable","Prey populations always grow until space runs out","They are completely independent"],e:"This oscillating relationship is known as the predator-prey cycle, famously studied with lynx and snowshoe hares."},
  {q:"What is a wetland and why is it ecologically important?",c:"Land saturated with water that filters pollution and supports high biodiversity",w:["A type of desert that floods seasonally","An aquatic ecosystem with no plants","A low-lying forest prone to flooding"],e:"Wetlands filter water, store carbon, reduce flood damage, and support 40% of the world's species."},
  {q:"How do plants respond to gravity?",c:"Roots grow downward (gravitropism); stems grow upward (negative gravitropism)",w:["Plants grow only toward light, not in response to gravity","Gravity has no effect on plant growth","Roots and stems both grow away from gravity"],e:"Gravitropism allows plants to orient correctly even in the dark, using specialized statoliths (dense starch grains) in cells."},
  {q:"What is the difference between a food web and a food chain?",c:"A food web shows complex, interlinked feeding relationships; a food chain is a single linear sequence",w:["A food web is only for marine ecosystems","A food chain includes decomposers; a food web does not","They are the same thing"],e:"In nature, most organisms eat multiple things and are eaten by multiple organisms — making webs more accurate than chains."},
  {q:"What is the function of a wetland in a watershed?",c:"Absorb excess water, filter pollutants, and slowly release water into streams",w:["Speed the flow of water to the ocean","Prevent plant growth near rivers","Store carbon underground indefinitely"],e:"Wetlands act as natural sponges and filters, reducing flooding and improving water quality downstream."},
  {q:"What is the difference between a habitat generalist and a specialist?",c:"Generalists thrive in many environments; specialists need specific conditions",w:["Generalists are larger; specialists are smaller","Specialists are more likely to survive extinction events","They refer to different dietary habits only"],e:"Raccoons are generalists; giant pandas (only bamboo) are extreme specialists — making them vulnerable to habitat loss."},
  {q:"What is an invasive species?",c:"A non-native species that spreads rapidly and harms the native ecosystem",w:["A species that migrates seasonally","Any predator in a food chain","A species endemic to a small island"],e:"Examples: kudzu in the U.S. Southeast, Burmese pythons in Florida Everglades, zebra mussels in Great Lakes."},
  {q:"How do plants use water in photosynthesis?",c:"Water molecules are split, releasing oxygen and providing electrons for the light reactions",w:["Water carries glucose to the leaves","Water dissolves CO₂ so plants can absorb it","Water regulates the temperature of the leaf"],e:"The oxygen released during photosynthesis comes from water, not from carbon dioxide."},
  {q:"What is the difference between a parasite and a predator?",c:"A predator kills its prey; a parasite lives on/in a host without immediately killing it",w:["They are the same relationship","Parasites are smaller than predators","Predators live inside their prey; parasites attack from outside"],e:"Tapeworms and ticks are parasites; they weaken but don't immediately kill their hosts, unlike a lion killing a zebra."},
  {q:"What is the water table?",c:"The upper surface of the zone where groundwater saturates the rock and soil",w:["The temperature of groundwater","The speed of water flowing underground","The amount of rainfall an area receives"],e:"Drilling below the water table produces wells. The water table rises after rain and falls during drought."},
  {q:"What is bioaccumulation?",c:"The buildup of toxic substances in an organism's tissues over its lifetime",w:["The growth of plants after fertilization","The recycling of nutrients in an ecosystem","The process by which organisms gain immunity to pesticides"],e:"Mercury bioaccumulates in fish; larger fish that eat smaller fish have higher concentrations — which is why large fish are limited in diet recommendations for pregnant women."},
  {q:"What is the carbon cycle?",c:"The movement of carbon through the atmosphere, oceans, soil, and living organisms",w:["The process of burning fossil fuels","How plants convert sunlight to carbon","The formation of diamonds from carbon"],e:"Carbon is stored in plants, animals, soil, rock, and the ocean; it moves between them through respiration, photosynthesis, decomposition, and combustion."},
  {q:"What causes an algae bloom in a lake?",c:"Excess nutrients (nitrogen and phosphorus) from runoff cause explosive algae growth",w:["Too little sunlight reaches the water","An increase in predatory fish","Higher water temperatures alone"],e:"Algae blooms deplete oxygen, block sunlight, and can produce toxins — killing fish and other aquatic life."},
  {q:"How do mangroves benefit coastal ecosystems?",c:"Protect coastlines from erosion and storms, and serve as nurseries for fish",w:["Produce oxygen for the entire ocean","Act as primary food producers for coral reefs","Control ocean currents"],e:"Mangrove roots trap sediment, protect shorelines from waves, and provide habitat for juvenile fish, birds, and invertebrates."},
  {q:"What is the difference between evaporation and transpiration?",c:"Evaporation is water turning to vapor from surfaces; transpiration is water vapor released by plants",w:["Evaporation only happens in deserts; transpiration in forests","They are the same process","Transpiration produces rain; evaporation does not"],e:"Together they make up 'evapotranspiration' — a major part of the water cycle, especially in forested areas."},
  {q:"What is a carnivorous plant and how does it get nutrients?",c:"A plant that traps and digests insects or small animals to supplement nutrient-poor soil",w:["A plant that grows near meat-eating animals","A plant whose roots extract nutrients from animal bones","A toxic plant that kills nearby animals"],e:"Venus flytraps, pitcher plants, and sundews supplement nutrients unavailable in acidic, nitrogen-poor bogs."},
  {q:"Why do some animals hibernate?",c:"To survive winter when food is scarce by lowering body temperature and slowing metabolism",w:["To avoid predators in winter","Because cold air harms their lungs","To grow new fur or feathers"],e:"During hibernation, a bear's heart rate drops from 55 bpm to just 8 bpm, and its body temperature drops significantly."},
  {q:"What is the difference between a temperate and a tropical rainforest?",c:"Tropical rainforests are near the equator with year-round warmth; temperate rainforests are in cooler coastal areas",w:["Tropical rainforests have more rainfall","They grow in opposite hemispheres","Temperate rainforests have more species diversity"],e:"The Hoh Rainforest in Washington state is a temperate rainforest; the Amazon is tropical. Both have enormous biodiversity."},
  {q:"What is a trophic level?",c:"A position in a food chain representing a step in the flow of energy",w:["The number of species in an ecosystem","The depth at which ocean creatures live","The temperature needed for a species to survive"],e:"Producers are level 1, herbivores level 2, carnivores level 3, etc. Energy is lost at each level."},
  {q:"What is the difference between sexual and asexual reproduction?",c:"Sexual requires two parents and produces genetic variation; asexual uses one parent and produces identical offspring",w:["Sexual applies to animals; asexual to plants","Asexual reproduction is faster and always preferred","Sexual reproduction produces twice as many offspring"],e:"Bacteria reproduce asexually (fission); most animals reproduce sexually; some organisms (like aphids) can do both."},
  {q:"What is the significance of biodiversity hotspots?",c:"They contain exceptional concentrations of endemic species but are threatened by habitat loss",w:["They are the most ecologically stable areas on Earth","They are areas with the highest rainfall","They are places where new species are forming rapidly"],e:"The Amazon, Madagascar, and the California Floristic Province are examples of biodiversity hotspots."},
  {q:"How do fish maintain their position in the water without sinking or floating?",c:"Using a gas-filled swim bladder to adjust buoyancy",w:["By constant swimming","Through a dense layer of fat","By anchoring to rocks with their fins"],e:"By adjusting the amount of gas in their swim bladder, bony fish can hover at any depth with minimal effort."},
  {q:"What is the difference between K-strategists and r-strategists?",c:"K-strategists have few offspring and invest heavily in them; r-strategists have many offspring with little investment",w:["They are the same strategy","K-strategists are prey; r-strategists are predators","r-strategists are larger animals"],e:"Elephants are K-strategists (few offspring, long lived); mice and insects are r-strategists (many offspring, short lived)."},
  {q:"What is eutrophication?",c:"The process of excessive nutrient enrichment in a water body, causing algae growth and oxygen depletion",w:["The purification of water by wetlands","The cooling of deep ocean water","The evaporation of water from lakes"],e:"Agricultural runoff introduces excess nitrogen and phosphorus, triggering algae blooms that create 'dead zones.'"},
  {q:"How do trees help regulate local climate?",c:"They provide shade, release water vapor, absorb CO₂, and reduce wind",w:["They only absorb carbon dioxide","They prevent rain from reaching the ground","They make air cooler only by blocking sunlight"],e:"Urban forests can reduce city temperatures by 5–10°F and reduce air conditioning costs significantly."},
  {q:"What is the significance of soil microorganisms?",c:"They decompose organic matter, fix nitrogen, and support plant nutrient uptake",w:["They cause most plant diseases","They only appear in tropical soils","They play no significant role in nutrient cycles"],e:"A single teaspoon of healthy soil contains more microorganisms than there are people on Earth."},
  {q:"What causes ocean currents?",c:"Differences in water temperature and salinity, combined with wind and Earth's rotation",w:["Tidal forces from the Moon only","The gravitational pull of large landmasses","Ocean floor topography alone"],e:"Thermohaline circulation (the 'ocean conveyor belt') moves water around the globe based on temperature and salt content."},
  {q:"What is phenology?",c:"The study of cyclic and seasonal natural phenomena, such as migration and flowering",w:["The study of soil composition","The measurement of ocean salinity","The study of animal sounds"],e:"Phenology tracks when flowers bloom, when birds migrate, and when frogs begin calling — and how these change with climate."},
  {q:"What is the role of fire in some ecosystems?",c:"It clears dead matter, releases nutrients, and triggers seed germination for fire-adapted species",w:["It always destroys ecosystems permanently","It has no ecological benefit","It only affects plant communities, not animals"],e:"Many plant species, like lodgepole pine, require fire for their cones to open and release seeds."},
  {q:"What is an ecotone?",c:"A transition zone between two different ecosystems",w:["An area completely devoid of life","The boundary between land and ocean","An extremely dense forest"],e:"Ecotones, like forest edges, often have higher biodiversity than either adjacent ecosystem — called the 'edge effect.'"},
  {q:"What is the difference between weather and microclimate?",c:"Microclimate is the climate of a very small area that differs from the surrounding region",w:["They are the same thing at different scales","Microclimate is only measured underground","Weather is affected by microclimates but not vice versa"],e:"A south-facing rock can be 20°F warmer than a north-facing spot just feet away — that's a microclimate difference."},
  {q:"What is the 10% rule in energy transfer?",c:"Only about 10% of energy is transferred from one trophic level to the next",w:["Animals use 10% of their food for energy and waste 90%","10% of species in an ecosystem are apex predators","Each trophic level has 10 times more organisms than the one above it"],e:"This explains why food chains rarely exceed 4–5 levels; too little energy remains for higher predators."},
  {q:"What is a niche partitioning?",c:"When species divide resources to reduce competition",w:["The dividing of territory between predator and prey","The splitting of a species into two over time","When one species outcompetes another completely"],e:"Warblers in the same tree avoid competition by feeding at different heights — each occupies a different niche."},
  {q:"How does the Moon affect Earth's biodiversity?",c:"Tidal cycles created by the Moon support diverse coastal ecosystems",w:["The Moon reflects enough light to affect plant growth","The Moon's gravity affects animal migration patterns","The Moon's proximity alters ocean chemistry"],e:"The tidal zones created by the Moon are among the most biologically diverse habitats on Earth."},
  {q:"What is transpiration and why is it important?",c:"The evaporation of water from plant leaves, which drives water uptake from roots",w:["The way plants absorb sunlight","The process of carbon dioxide exchange in leaves","The way seeds absorb water to germinate"],e:"A large tree can transpire hundreds of gallons of water per day, cooling the air and cycling water."},
  {q:"What is the difference between extinction and extirpation?",c:"Extinction is global disappearance; extirpation is local disappearance of a species",w:["They are synonymous terms","Extinction is temporary; extirpation is permanent","Extirpation only refers to plants"],e:"Gray wolves became extirpated in Yellowstone by the 1930s but were reintroduced in 1995 — the species was never extinct."},
  {q:"What is pheromone communication?",c:"Chemical signals released by animals to convey information to others of the same species",w:["Sound signals used by whales","Visual patterns used by birds","Electrical signals used by sharks"],e:"Ants use pheromone trails to mark food sources; many insects use pheromones to attract mates."},
],
history:[
  {q:"What event triggered the start of World War I?",c:"The assassination of Archduke Franz Ferdinand of Austria",w:["The invasion of Belgium by Germany","The sinking of the Lusitania","The collapse of the Ottoman Empire"],e:"The assassination in Sarajevo on June 28, 1914 set off a chain of alliances that drew Europe into war."},
  {q:"What was the Renaissance?",c:"A period of renewed interest in art, science, and classical learning in Europe (14th–17th c.)",w:["The period following the Black Death when populations recovered","The era of European exploration of the Americas","The period of Roman Empire expansion"],e:"The Renaissance ('rebirth') began in Italy and spread through Europe, producing da Vinci, Michelangelo, and Galileo."},
  {q:"What was the Magna Carta?",c:"A 1215 document limiting the English king's power and establishing legal rights",w:["A treaty ending the Hundred Years' War","The founding charter of the Roman Republic","A peace agreement between England and France"],e:"The Magna Carta established that even kings are subject to the rule of law — a foundation of constitutional government."},
  {q:"What caused the fall of the Western Roman Empire?",c:"A combination of invasions, economic decline, military problems, and political instability",w:["A volcanic eruption that destroyed Rome","A plague that killed 90% of the population","A successful invasion by Egypt"],e:"The traditional date is 476 CE when the last Western emperor was deposed, though decline happened over centuries."},
  {q:"What was the Black Death?",c:"A bubonic plague pandemic that killed roughly 30–60% of Europe's population in the 14th century",w:["A famine caused by the Little Ice Age","A wave of volcanic eruptions in medieval Europe","A drought that lasted 100 years"],e:"The Black Death (1346–1353) was caused by the bacterium Yersinia pestis, spread by fleas on rats."},
  {q:"What was the significance of the printing press (c. 1440)?",c:"It made books affordable and spread literacy, knowledge, and new ideas rapidly",w:["It allowed newspapers to be printed for the first time","It enabled the creation of maps for navigation","It was mainly used to copy religious texts more accurately"],e:"Gutenberg's press helped spread the Protestant Reformation, Scientific Revolution, and eventually democratic ideas."},
  {q:"What was the significance of the Battle of Thermopylae?",c:"300 Spartans (and others) delayed the Persian army, buying time for Greece",w:["It ended the Persian Wars decisively","It established the Athenian democracy","It was the first major Greek naval battle"],e:"The 480 BCE battle at the narrow pass inspired the concept of sacrifice for freedom and Greek unity."},
  {q:"What was the Cuban Missile Crisis?",c:"A 1962 standoff between the U.S. and USSR over Soviet nuclear missiles in Cuba",w:["A 1959 revolution that brought Castro to power","A 1975 naval conflict in the Caribbean","A 1961 invasion attempt at the Bay of Pigs"],e:"The 13-day crisis in October 1962 brought the world the closest it has come to nuclear war."},
  {q:"What was the Columbian Exchange?",c:"The transfer of animals, plants, diseases, and people between the Americas and the Old World after 1492",w:["A treaty between Columbus and the Taino people","A trading route between Spain and Portugal","An agreement to divide the Americas between Spain and Portugal"],e:"The exchange brought potatoes, tomatoes, and corn to Europe while introducing smallpox, measles, and horses to the Americas."},
  {q:"What was the significance of the Battle of Hastings (1066)?",c:"William the Conqueror defeated King Harold and transformed England's language and culture",w:["It ended the Viking Age","It established the British Parliament","It led to the Magna Carta"],e:"The Norman conquest of England introduced French vocabulary into English and changed the country's ruling class."},
  {q:"What was the French Revolution?",c:"A 1789–1799 political upheaval that overthrew the monarchy and established republican ideals",w:["A war between France and Britain for North American colonies","Napoleon's military conquest of Europe","A peasant revolt against the Catholic Church"],e:"The Revolution produced the Declaration of the Rights of Man and the Citizen, influencing democratic movements worldwide."},
  {q:"What was the significance of the Silk Road?",c:"It connected Europe, the Middle East, and Asia, enabling trade and the spread of ideas and diseases",w:["It was the route used by Columbus to reach Asia","It was a road built by Chinese emperors for military use","It was a network of underground trade tunnels"],e:"The Silk Road facilitated the spread of paper-making, gunpowder, Buddhism, and Islam across continents."},
  {q:"What was the Holocaust?",c:"The systematic murder of six million Jews and millions of others by Nazi Germany",w:["A term for German bombing raids on England","The mass deportation of Jews from Western Europe","The internment of Japanese Americans during WWII"],e:"Between 1941–1945, Nazi Germany operated extermination camps as part of the 'Final Solution.'"},
  {q:"What empire was ruled by Genghis Khan?",c:"Mongol Empire",w:["Ottoman Empire","Persian Empire","Mughal Empire"],e:"Genghis Khan founded the Mongol Empire in 1206; at its peak it was the largest contiguous land empire in history."},
  {q:"What was the significance of the Wright Brothers' first flight (1903)?",c:"It proved powered, controlled flight was possible, launching the aviation age",w:["It was the first transatlantic flight","It led directly to the development of the jet engine","It was the first flight with a passenger"],e:"Orville Wright's 12-second, 120-foot flight at Kitty Hawk, NC on December 17, 1903 changed the world."},
  {q:"What was the Berlin Airlift?",c:"A 1948–1949 operation where Western nations airlifted supplies into Soviet-blockaded West Berlin",w:["The 1961 construction of the Berlin Wall","A WWII bombing campaign over Germany","The Allied invasion of Germany in 1945"],e:"For 11 months, Western planes delivered food and fuel, demonstrating resolve against Soviet pressure."},
  {q:"What was the significance of the Reformation?",c:"Martin Luther's challenge to Catholic authority split Christianity into Catholic and Protestant branches",w:["It restored Catholic power after the Crusades","It ended religious wars in Europe","It led to the Renaissance"],e:"Luther posted his 95 Theses in 1517, criticizing Church practices and launching the Protestant Reformation."},
  {q:"What was the Iron Curtain?",c:"The ideological and physical boundary dividing communist Eastern Europe from democratic Western Europe",w:["The defensive line France built against Germany before WWII","A series of forts protecting Western Europe from Viking raids","A trade barrier established after WWI"],e:"Winston Churchill popularized the term in a 1946 speech. It symbolized the Cold War division of Europe."},
  {q:"What was the significance of the Battle of Midway (1942)?",c:"It was a decisive U.S. naval victory that turned the tide against Japan in the Pacific",w:["It was the first major amphibious invasion of the Pacific War","It ended Japanese naval expansion in the Pacific completely","It led to the development of the atomic bomb"],e:"The U.S. sank four Japanese carriers in three days, ending Japan's offensive capability."},
  {q:"What was apartheid?",c:"A system of racial segregation in South Africa that lasted from 1948 to 1994",w:["A 1960s independence movement in Kenya","The policy of colonial rule in India","The forced migration of native Africans during European colonization"],e:"Nelson Mandela spent 27 years in prison fighting apartheid before becoming South Africa's first Black president."},
  {q:"What was the significance of the Treaty of Versailles (1919)?",c:"It officially ended WWI, imposed harsh penalties on Germany, and set conditions for WWII",w:["It ended the Napoleonic Wars","It established the League of Nations successfully","It settled colonial claims between Britain and France"],e:"Germany lost territory, paid reparations, and accepted sole blame for WWI — conditions that fed resentment and WWII."},
  {q:"What was the significance of Gutenberg's printing press for the Reformation?",c:"It allowed Luther's ideas to spread rapidly across Europe",w:["It enabled the Vatican to print more Bibles","It allowed France to spread Protestant ideas faster than Germany","It had no impact on the Reformation"],e:"Within weeks, Luther's 95 Theses were printed and distributed across Germany — unthinkable without the printing press."},
  {q:"What was the Space Race and when did the U.S. win?",c:"A Cold War competition with the USSR; the U.S. won when Apollo 11 landed on the Moon in 1969",w:["The U.S. won when it launched Sputnik","The race ended when the USSR collapsed in 1991","The U.S. won the Space Race by launching the first satellite"],e:"The Soviet Union launched Sputnik (1957) and put the first human in space (1961); the U.S. responded by reaching the Moon."},
  {q:"What was the significance of the invention of the stirrup?",c:"It gave mounted warriors much better stability, transforming medieval warfare",w:["It allowed ships to be more easily steered","It enabled the construction of windmills","It was primarily used in farming"],e:"The stirrup let cavalry charge with lances and swords without falling — transforming the role of knights in medieval Europe."},
  {q:"What was the Marshall Plan?",c:"A U.S. program that provided over $13 billion to rebuild Western Europe after WWII",w:["A Soviet plan to create buffer states in Eastern Europe","A NATO plan to rearm West Germany","A British plan for decolonization"],e:"Secretary of State George Marshall proposed the plan in 1947; it helped prevent the spread of communism in Europe."},
  {q:"What caused the Great Famine in Ireland (1845–1852)?",c:"A potato blight destroyed the main food source, and British policies worsened the crisis",w:["A severe drought affected all of Europe","A war between Ireland and Britain","Widespread flooding of Ireland's farmland"],e:"About 1 million Irish died and another million emigrated, reducing Ireland's population by 25%."},
  {q:"What was the significance of Copernicus' heliocentric theory?",c:"It placed the Sun, not Earth, at the center of the solar system, revolutionizing astronomy",w:["It proved that Earth is spherical","It discovered the planet Saturn","It explained how gravity works"],e:"Copernicus published his heliocentric model in 1543; Galileo later confirmed it with a telescope."},
  {q:"What was the Long March?",c:"A 1934–1935 retreat by Mao Zedong's communist forces across China",w:["The march of Mongol armies into China","A WWII military campaign in the Pacific","A peaceful protest march in China"],e:"The 6,000-mile retreat established Mao Zedong's leadership and became a defining moment of the Chinese Communist Party."},
  {q:"What was the significance of the Nuremberg Trials?",c:"They established that individuals can be held criminally responsible for war crimes and crimes against humanity",w:["They ended WWII officially","They set the boundaries of postwar Germany","They established the United Nations"],e:"The 1945–1946 trials created the precedent for international criminal law and led to the Genocide Convention."},
  {q:"What was the significance of the Neolithic Revolution?",c:"Humans shifted from hunter-gatherer lifestyles to farming, enabling permanent settlements",w:["The development of writing in Mesopotamia","The Bronze Age beginning of metal tools","The end of the last Ice Age"],e:"The transition to agriculture (c. 10,000 BCE) led to cities, specialization of labor, and civilization."},
  {q:"What was the significance of the Congress of Vienna (1815)?",c:"It redrew the map of Europe after Napoleon and established a balance of power",w:["It created the German Empire","It ended the American Revolution","It established the first democratic government in Europe"],e:"European powers met in Vienna to restore order after Napoleon's defeat, creating a conservative balance lasting 40 years."},
  {q:"What was the significance of the Meiji Restoration in Japan?",c:"Japan rapidly modernized and industrialized, transforming from feudal to industrial society",w:["It expelled foreign powers from Japan","It ended Japan's isolation and began European colonization","It unified Japan under the Buddhist religion"],e:"From 1868, Japan's Meiji emperor ended samurai rule and adopted Western technology, making Japan a world power by 1905."},
  {q:"What caused the Thirty Years' War (1618–1648)?",c:"Religious and political conflicts between Catholic and Protestant states in the Holy Roman Empire",w:["Disputes over trade routes between Spain and England","Competition between France and the Ottoman Empire","Succession disputes in the French royal family"],e:"The war devastated Central Europe, killing up to 8 million people, and ended with the Peace of Westphalia."},
  {q:"What was the Caste System in India?",c:"A hereditary social stratification system that divided people into rigid social classes",w:["A system of government used by the Mughal Empire","The Indian equivalent of Western feudalism","A classification of Hindu religious practices"],e:"The caste system originated in ancient India; it was outlawed by India's 1950 constitution but still influences society."},
  {q:"What was the significance of the Battle of Stalingrad?",c:"It was the turning point of WWII in Europe — Germany's first major defeat in the East",w:["It was the first major battle of WWII","It liberated France from German occupation","It ended the siege of Moscow"],e:"The 1942–1943 battle resulted in the surrender of 300,000 German troops and began the German retreat from the Soviet Union."},
  {q:"What was the significance of Samuel Morse's telegraph?",c:"It allowed near-instant long-distance communication, transforming business, journalism, and government",w:["It was the first form of electrical communication used by the military","It allowed voice communication for the first time","It was primarily used by ships at sea"],e:"The telegraph (1844) shrank communication time from days to minutes and preceded the telephone by 32 years."},
  {q:"What was the Scramble for Africa?",c:"The rapid colonization of most of Africa by European powers in the late 1800s",w:["A 1960s independence movement across Africa","A series of wars between African kingdoms","The migration of European settlers to South Africa"],e:"By 1914, Europeans controlled 90% of Africa. The Berlin Conference (1884–85) divided the continent among them."},
  {q:"What was the significance of the Industrial Revolution?",c:"It transformed economies from agricultural to manufacturing, reshaping society, urbanization, and working life",w:["It was primarily important for naval power","It only affected Western Europe and the U.S.","It had little effect on everyday life"],e:"Beginning in Britain around 1760, the Industrial Revolution introduced steam power, factories, and urbanization."},
  {q:"What was the Crusades?",c:"A series of religious wars in which European Christians tried to reclaim the Holy Land from Muslims",w:["A series of military campaigns by Rome against barbarian tribes","A Portuguese naval expedition to Africa","The Spanish conquest of the Americas"],e:"The Crusades (1095–1291) had lasting effects on Christian-Muslim relations and European culture."},
  {q:"What were the causes of the French Revolution?",c:"Economic hardship, social inequality, Enlightenment ideas, and a weak monarchy",w:["Military defeat by Britain","A famine caused by crop disease","Influence of the American Revolution alone"],e:"France's financial crisis, combined with Enlightenment ideals of liberty and equality, fueled the 1789 Revolution."},
  {q:"What was the significance of the Glorious Revolution (1688)?",c:"It established Parliamentary supremacy over the English monarchy",w:["It ended the English Civil War","It created the first English Parliament","It established the Church of England"],e:"When William III took the throne, he agreed to the Bill of Rights (1689), limiting royal power permanently."},
  {q:"What was the significance of Hammurabi's Code?",c:"One of the earliest written legal codes, establishing laws for an entire society",w:["The first democratic constitution","A trade agreement between Babylon and Egypt","The first recorded religious text"],e:"Hammurabi's Code (c. 1754 BCE) contained 282 laws governing commerce, property, and justice in ancient Babylon."},
  {q:"What was the significance of the Berlin Conference (1884–1885)?",c:"European powers divided Africa among themselves without African participation",w:["It ended German colonialism in Africa","It established the first border between Kenya and Tanzania","It created the African Union"],e:"The conference established the rules for European colonization of Africa, partitioning the continent among 14 nations."},
  {q:"What was the Great Wall of China originally built for?",c:"To protect Chinese states and empires from northern nomadic invasions",w:["To mark the boundary of the Chinese empire","To create a road for trade across northern China","To prevent flooding from northern rivers"],e:"The Great Wall was built, rebuilt, and extended over many centuries, with major construction during the Ming dynasty (1368–1644)."},
  {q:"What was the significance of the discovery of penicillin?",c:"It was the first effective antibiotic, saving millions of lives from bacterial infections",w:["It was the first vaccine against a viral disease","It led to the development of chemotherapy","It was the first drug produced synthetically"],e:"Alexander Fleming discovered penicillin in 1928; widespread use during WWII saved countless soldiers from infection."},
  {q:"What was the Korean War?",c:"A 1950–1953 war between North Korea (backed by China/USSR) and South Korea (backed by UN/USA)",w:["A WWII conflict between Japan and Korea","A 1970s war between North and South Korea","A conflict between China and Japan over Korea"],e:"The war ended with an armistice, not a peace treaty, leaving Korea divided along roughly the same boundary as before."},
  {q:"What was the significance of the Haitian Revolution?",c:"It was the only successful slave revolt in history, creating the first Black republic",w:["It was the first Latin American country to gain independence from Spain","It established democracy in the Caribbean for the first time","It ended French colonialism in the Americas"],e:"Haitian slaves overthrew French rule in 1804, establishing Haiti as the world's first Black republic."},
  {q:"What was the significance of the invention of the steam engine?",c:"It powered factories, trains, and ships, fueling the Industrial Revolution",w:["It was invented to pump water from coal mines only","It replaced wind power in sailing ships first","It was primarily used in agriculture"],e:"James Watt's improved steam engine (1769) became the driving force of industrialization, enabling railroads and factories."},
  {q:"What was the significance of the Gettysburg Address?",c:"Lincoln redefined the Civil War as a struggle for equality and democracy",w:["It announced the Emancipation Proclamation","It was Lincoln's farewell address","It proposed a peace treaty with the Confederacy"],e:"In 271 words, Lincoln invoked the Declaration of Independence and described the war as testing whether democratic government could survive."},
  {q:"What were the main causes of World War II?",c:"The rise of fascism, economic depression, unresolved WWI tensions, and appeasement of Hitler",w:["A naval conflict between Japan and the U.S.","The assassination of a European leader","A trade dispute between Britain and Germany"],e:"Hitler's expansion (annexing Austria, Czechoslovakia, then invading Poland in 1939) triggered the war."},
  {q:"What was the significance of the Rosetta Stone?",c:"It allowed scholars to decipher ancient Egyptian hieroglyphics",w:["It was the first written language discovered","It contained the first Egyptian laws","It was used to decode ancient Greek texts"],e:"Discovered in 1799, the Rosetta Stone had the same text in three scripts — hieroglyphics, Demotic, and Greek — enabling translation."},
  {q:"What was the significance of the invention of gunpowder?",c:"It transformed warfare, ending the dominance of armored knights and fortified castles",w:["It was invented by Europeans for mining","It allowed Chinese armies to defeat the Mongols","It had no military use until the 1400s"],e:"Invented in China, gunpowder spread to Europe via the Mongols and Islamic world, revolutionizing warfare by the 1300s."},
  {q:"What was the significance of the D-Day invasion (June 6, 1944)?",c:"Allied forces landed in Normandy, France, beginning the liberation of Western Europe",w:["It was the first Allied invasion of Europe in WWII","It was the final battle of WWII in Europe","It established the Eastern Front against Germany"],e:"The largest seaborne invasion in history involved 156,000 troops and began the end of the Nazi occupation of France."},
  {q:"What was the significance of the Emancipation Proclamation?",c:"It declared enslaved people in Confederate states free and redefined the Civil War",w:["It freed all enslaved people in the United States immediately","It was the amendment that abolished slavery","It allowed Black men to vote for the first time"],e:"The Proclamation (January 1, 1863) didn't apply to border states but transformed the war into a fight against slavery."},
  {q:"What was the significance of Galileo's trial by the Inquisition?",c:"It highlighted the conflict between scientific inquiry and religious authority",w:["It ended scientific research in Europe","It established the separation of church and state","It led to Galileo being burned at the stake"],e:"Galileo was forced to recant his heliocentric views in 1633. He was placed under house arrest but continued his work."},
  {q:"What was the impact of the telegraph on the American Civil War?",c:"It allowed commanders to coordinate troops and send orders across long distances in near real time",w:["It was not used in the Civil War","It only helped the Confederacy","It was mainly used for government communications, not military"],e:"Both sides used the telegraph extensively; Lincoln monitored the war from the War Department telegraph office."},
  {q:"What was the significance of the Battle of Tours (732 CE)?",c:"Frankish forces stopped the Muslim advance into Western Europe",w:["It ended the Roman Empire","It marked the start of the Crusades","It led to the unification of France"],e:"Charles Martel's victory near Tours, France, halted the Umayyad Caliphate's northward expansion into Christian Europe."},
  {q:"What was the significance of the Lewis and Clark Expedition?",c:"It mapped and explored the vast territory of the Louisiana Purchase to the Pacific Ocean",w:["It established the first trade route with China","It negotiated treaties with 50 Native American tribes","It was the first European expedition to reach the Rockies"],e:"Commissioned by President Jefferson in 1803, the expedition provided the first detailed knowledge of the American West."},
  {q:"What was the significance of the Emancipation of serfs in Russia (1861)?",c:"It freed about 23 million serfs, transforming Russian society and economy",w:["It ended the rule of the Russian Tsar","It triggered the Russian Revolution","It gave serfs full political rights"],e:"Tsar Alexander II emancipated serfs in 1861 — the same year as the U.S. Civil War — but land reform remained limited."},
  {q:"What were the main causes of the American Civil War?",c:"Slavery, sectionalism, states' rights, and the election of Lincoln",w:["Economic differences between North and South only","The assassination of a Southern leader","Disagreements over tariffs on trade with Britain"],e:"The immediate trigger was Lincoln's election in 1860; Southern states seceded fearing abolition of slavery."},
  {q:"What was the significance of the invention of the Internet?",c:"It revolutionized global communication, commerce, and access to information",w:["It was invented primarily for military use and stayed military","It was invented in Silicon Valley in the 1990s","It has had minimal effect on traditional media"],e:"The Internet evolved from ARPANET (1969) and became publicly accessible in the early 1990s, transforming civilization."},
  {q:"What was the significance of the Suez Crisis (1956)?",c:"It marked the decline of British and French power and the rise of U.S. and Soviet influence",w:["It ended British colonialism in Africa","It was the first use of nuclear weapons since WWII","It established the United Nations Emergency Force"],e:"Britain and France invaded Egypt to retake the Suez Canal but were forced to withdraw under U.S. and Soviet pressure."},
  {q:"What was the significance of the Storming of the Bastille (1789)?",c:"It symbolized the start of the French Revolution and the people's power against tyranny",w:["It freed hundreds of political prisoners","It was the final act of the Revolution","It ended the monarchy immediately"],e:"Only seven prisoners were found in the Bastille, but its fall became the defining symbol of the Revolution. July 14 is now Bastille Day."},
  {q:"What was the significance of the Treaty of Westphalia (1648)?",c:"It ended the Thirty Years' War and established the modern concept of national sovereignty",w:["It ended the Hundred Years' War","It created the Holy Roman Empire","It established the first democratic republic in Europe"],e:"The treaty established that each state has sovereignty over its own territory — a cornerstone of international relations."},
  {q:"What was the significance of Mao Zedong's Cultural Revolution?",c:"It caused widespread persecution, destroyed cultural institutions, and killed hundreds of thousands in China",w:["It modernized China's economy rapidly","It eliminated corruption in China's government","It established China as a democracy"],e:"The Cultural Revolution (1966–1976) targeted 'capitalist roaders,' destroyed temples and books, and sent intellectuals to labor camps."},

sports:[
  {q:"How many players are on a soccer team on the field?",c:"11",w:["9","10","12"],e:"Each team fields 11 players, including the goalkeeper."},
  {q:"What is the circumference of a standard basketball?",c:"29.5 inches",w:["28 inches","30 inches","27 inches"],e:"The NBA uses a regulation ball with a circumference of 29.5 inches."},
  {q:"In baseball, how many strikes result in an out?",c:"3",w:["2","4","5"],e:"Three strikes and you're out — one of baseball's most fundamental rules."},
  {q:"What is a 'grand slam' in tennis?",c:"Winning all four major tournaments in the same calendar year",w:["Hitting an unreturnable serve","Winning a match without losing a game","Scoring four aces in a set"],e:"The four Grand Slam tournaments are the Australian Open, French Open, Wimbledon, and U.S. Open."},
  {q:"In American football, how many points is a field goal worth?",c:"3",w:["2","4","6"],e:"A field goal (kicked through the uprights) scores 3 points; a touchdown scores 6."},
  {q:"What is the name of the trophy awarded to the NHL championship team?",c:"Stanley Cup",w:["Hart Trophy","Conn Smythe Trophy","Vezina Trophy"],e:"The Stanley Cup is the oldest professional sports trophy in North America, first awarded in 1893."},
  {q:"What does 'ERA' stand for in baseball?",c:"Earned Run Average",w:["Extra Runs Allowed","Expected Run Average","Error Run Allowance"],e:"ERA measures how many earned runs a pitcher allows per nine innings — a key measure of pitching effectiveness."},
  {q:"In volleyball, how many points are needed to win a set?",c:"25 (with a 2-point lead)",w:["21","30","15"],e:"Sets are played to 25, but a team must win by 2; the final set is played to 15."},
  {q:"What is the distance of a marathon?",c:"26.2 miles (42.195 km)",w:["25 miles","30 km","50 km"],e:"The marathon distance commemorates the legendary run of Pheidippides from Marathon to Athens in 490 BCE."},
  {q:"What does 'PER' measure in basketball?",c:"Player Efficiency Rating — a single number summarizing a player's statistical performance",w:["Points per Effective Recovery","Points Earned per Round","Passing Efficiency Ratio"],e:"PER, developed by ESPN's John Hollinger, measures a player's per-minute production adjusted for pace."},
  {q:"What country invented the sport of baseball?",c:"United States",w:["Canada","England","Cuba"],e:"Baseball evolved from English bat-and-ball games but developed into its current form in the U.S. in the mid-1800s."},
  {q:"What is an 'ace' in tennis?",c:"A serve that the opponent cannot touch",w:["A set won to love (6-0)","Winning a match without dropping a game","Scoring the first point of a tiebreaker"],e:"An ace is a legal serve that the returner fails to touch; players like John Isner hold records for aces in a career."},
  {q:"What is the offside rule in soccer?",c:"A player can't be in the opponent's half with fewer defenders between them and the goal when the ball is played",w:["A player can't step out of bounds before receiving a pass","A goalie can't leave the penalty box","A player can't touch the ball twice in a row"],e:"A player is offside if they're ahead of the second-to-last defender when the ball is played forward to them."},
  {q:"How many laps around a standard track is 1 mile?",c:"4",w:["2","5","6"],e:"A standard outdoor running track is 400 meters per lap; 4 laps equals 1,600 meters (roughly 1 mile)."},
  {q:"What is 'OPS' in baseball?",c:"On-base Plus Slugging — a combined batting statistic",w:["Official Pitching Score","Outfield Potential Score","Overall Performance Score"],e:"OPS adds on-base percentage and slugging percentage, making it one of the most comprehensive batting stats."},
  {q:"What sport uses the term 'love' to mean zero?",c:"Tennis",w:["Squash","Badminton","Ping pong"],e:"'Love' for zero in tennis may come from the French word 'l'oeuf' (egg) representing a zero shape, though the origin is debated."},
  {q:"What does it mean to be 'under contract' in sports?",c:"An athlete is legally bound to play for a team for a specified time and salary",w:["An athlete has been drafted by a team","An athlete has been traded to a new team","An athlete has signed an endorsement deal"],e:"Sports contracts specify salary, years, and performance incentives. Violating a contract can result in fines or suspension."},
  {q:"How is a winner determined in Olympic boxing?",c:"By points from three judges or by knockout/TKO/disqualification",w:["By how many times a fighter falls","By the referee's sole decision","By the fighter who has fewer points deducted"],e:"Three judges score each round; the fighter with more total points wins by decision if there's no knockout."},
  {q:"What is the 'Moneyball' approach to baseball?",c:"Using statistical analysis (sabermetrics) to evaluate players more objectively than traditional scouting",w:["Focusing only on high-salary players","Using computer simulations to set lineups","Analyzing the financial value of winning championships"],e:"The Oakland A's pioneered this approach under Billy Beane, finding undervalued players through statistics like OBP and OPS."},
  {q:"In football, what is the difference between a safety and a sack?",c:"A safety scores 2 points; a sack is just a tackle of the QB behind the line of scrimmage",w:["They are the same thing","A safety results in a free kick; a sack does not","A sack ends the play; a safety does not"],e:"A safety occurs when the ball carrier is tackled in their own end zone; a sack just stops the play."},
  {q:"What is a 'hat trick' in soccer?",c:"Scoring three goals in one game",w:["Three consecutive goals","Three successful penalty kicks","Scoring in three straight games"],e:"The term originated in cricket; in soccer a hat trick means one player scores three goals in a single match."},
  {q:"What does 'FG%' stand for in basketball?",c:"Field Goal Percentage — the ratio of shots made to shots attempted",w:["Free Goal Percentage","Final Game Performance","First-Quarter Goals"],e:"A player who makes 50 of 100 shots has an FG% of 50%. The NBA average is around 46%."},
  {q:"What is the difference between a sprint and a middle-distance race in track?",c:"Sprints are 400m and under; middle-distance is 800m to 2000m",w:["Sprints use starting blocks; middle-distance does not","Middle-distance is run in lanes; sprints are not","Sprints are on a track; middle-distance is on roads"],e:"100m, 200m, and 400m are sprints. 800m, 1500m, and 1 mile are middle-distance events."},
  {q:"What is the hardest thing to do in sports (often cited)?",c:"Hitting a baseball pitched at 90+ mph",w:["Returning a 140 mph tennis serve","Making a half-court basketball shot","Scoring in professional soccer"],e:"A 90 mph fastball reaches home plate in about 400 milliseconds — giving the batter roughly 150–175 ms to decide and swing."},
  {q:"What does it mean when a golfer is '2 under par'?",c:"They have completed the course or hole in 2 strokes fewer than the expected number",w:["They have two penalties","They hit two balls out of bounds","Their score improved by 2 after 9 holes"],e:"Par is the expected number of strokes. Under par means you took fewer — the better the score."},
  {q:"What is the difference between a foul and a violation in basketball?",c:"Fouls involve illegal physical contact; violations are rule infractions without contact",w:["Fouls result in free throws; violations do not","Violations are more serious","They are the same thing"],e:"Fouls include reaching in or blocking; violations include traveling, double-dribbling, and shot clock violations."},
  {q:"What is the Ryder Cup?",c:"A biennial golf competition between teams from the U.S. and Europe",w:["An annual tournament to determine the world's best golfer","A major golf tournament open to all nationalities","A junior golf competition"],e:"The Ryder Cup has been held since 1927 and is known for its intense team competition and emotional atmosphere."},
  {q:"What does 'OBP' measure in baseball?",c:"On-base Percentage — how often a batter reaches base",w:["Outfield Batting Percentage","Official Ball Power","Out-of-Base Plays"],e:"OBP counts hits, walks, and hit-by-pitch divided by plate appearances — it's considered more valuable than batting average."},
  {q:"In what sport is the 'Fosbury Flop' a technique?",c:"High jump",w:["Pole vault","Long jump","Hurdles"],e:"Dick Fosbury revolutionized the high jump at the 1968 Olympics by going over the bar backward — a technique now universally used."},
  {q:"What is a 'perfect game' in bowling?",c:"12 consecutive strikes for a score of 300",w:["Getting a spare on every frame","Scoring at least 200","Throwing a strike on the first ball of every frame"],e:"A perfect game requires 12 strikes in a row in a single game — the maximum possible score is 300."},
  {q:"What is the difference between an inning and an at-bat in baseball?",c:"An inning is when both teams bat once; an at-bat is one player's turn at bat",w:["An inning is three outs; an at-bat is one pitch","An at-bat includes walks; an inning does not","They are the same thing"],e:"Each team gets three outs per half-inning. A full game has nine innings."},
  {q:"What does a libero do in volleyball?",c:"Plays as a defensive specialist who cannot serve or attack above the net",w:["Sets the ball for the spikers","Plays at the net and blocks","Only serves during the game"],e:"The libero wears a different colored jersey and substitutes freely for back-row players to specialize in passing and defense."},
  {q:"What is a 'walk-off' in baseball?",c:"When the home team scores the winning run in the bottom of the last inning",w:["When a batter is intentionally walked","When a pitcher leaves the game during an inning","When a batter strikes out on a called third strike"],e:"Called a 'walk-off' because the losing team walks off the field after the game-ending play."},
  {q:"What does WAR measure in baseball?",c:"Wins Above Replacement — how many more wins a player adds compared to a replacement-level player",w:["Weighted Average Runs","Wins Against Records","Weighted At-bat Rating"],e:"A WAR of 2.0 means a player added 2 more wins than an average AAA call-up would. WAR above 5.0 is typically All-Star level."},
  {q:"What is the difference between man-to-man and zone defense in basketball?",c:"Man-to-man assigns each defender to a specific opponent; zone defends areas of the court",w:["Zone defense is only used in high school; man-to-man in professional basketball","Man-to-man allows double-teaming; zone does not","They are the same strategy"],e:"Zone defense can confuse offenses but is vulnerable to good ball movement. Man-to-man is better for defending specific players."},
  {q:"What is a 'penalty kick' in soccer?",c:"A direct kick from 12 yards out, taken after a foul in the penalty area",w:["A free kick taken from anywhere on the field","A kick taken by the goalkeeper to restart play","A kick taken after a player is shown a red card"],e:"Penalty kicks are 1-on-1 with the goalkeeper; about 75–80% are converted into goals."},
  {q:"What does 'WHIP' measure in baseball?",c:"Walks and Hits per Inning Pitched",w:["Weighted Hitting Impact Per game","Win-Loss Historical Index for Pitchers","Walks, Hits, and Innings Pitched combined"],e:"A WHIP of 1.00 means a pitcher allows exactly one baserunner per inning — excellent. League average is about 1.30."},
  {q:"What is a double-double in basketball?",c:"Reaching double digits (10+) in two statistical categories in one game",w:["Scoring 20+ points in two consecutive games","Making two consecutive three-pointers","Getting two dunks in one quarter"],e:"Common double-doubles are points + rebounds or points + assists. A triple-double includes a third category."},
  {q:"What is the difference between a sprint relay and a distance relay?",c:"Sprint relays (4×100, 4×400) run shorter distances; distance relays run longer legs",w:["Sprint relays use batons; distance relays do not","Distance relays run uphill; sprint relays are flat","They compete in different Olympics"],e:"In the 4×100 relay, teams run four 100m legs. The DMR (Distance Medley Relay) has legs of 1200m, 400m, 800m, and 1600m."},
  {q:"In ice hockey, what is icing?",c:"When a player shoots the puck from their own half past the opponent's goal line without it being touched",w:["When a goalie freezes the puck","When a player delays the game by not skating","When the ice is too rough to play on"],e:"Icing results in a faceoff in the offending team's zone; it's a strategy to relieve pressure but creates penalty."},
  {q:"What is the difference between a personal foul and a technical foul in basketball?",c:"Personal fouls involve illegal contact; technical fouls involve unsportsmanlike conduct or rule violations",w:["Personal fouls involve the ball; technical fouls do not","Technical fouls result in free throws; personal fouls do not","They are the same type of foul"],e:"Technical fouls can be called for arguing with refs, excessive timeouts, or hanging on the rim."},
  {q:"What is the NHL draft and how does it work?",c:"Teams take turns selecting amateur players, with the worst teams picking first",w:["Players auction themselves to teams","Teams submit bids for players in secret","The Commissioner assigns players to teams"],e:"The NHL draft follows a similar format to NFL and NBA drafts; the lottery determines the order for non-playoff teams."},
  {q:"What does 'shooting percentage' mean in hockey?",c:"The percentage of a player's shots that result in goals",w:["How often a player shoots from outside the blue line","How accurately a player aims at the net","How many goals a player scores per game"],e:"A shooting percentage of 15% means 15 out of every 100 shots result in goals — above average for forwards."},
  {q:"What is the difference between a sprint and endurance training?",c:"Sprint training builds speed and power through short, intense bursts; endurance training builds stamina over long durations",w:["They are both used to build muscle mass","Sprint training uses weights; endurance does not","Endurance training makes athletes slower"],e:"Elite distance runners and sprinters train very differently; the muscle fiber types used for each differ significantly."},
  {q:"What is a 'cornerback' in football?",c:"A defensive back who covers wide receivers and defends against passing plays",w:["A player who runs around the end on offensive plays","A defensive lineman who lines up at the corner","The quarterback who throws corner routes"],e:"Cornerbacks are typically the fastest defensive players; they match up against the opposing team's wide receivers."},
  {q:"What is the significance of the MLB All-Star Game?",c:"It has historically determined which league gets home-field advantage in the World Series",w:["It determines playoff seeding","It is an exhibition with no competitive significance","It selects the league's MVP for the season"],e:"From 2003 to 2016, the All-Star Game determined World Series home-field advantage; that rule was changed in 2017."},
  {q:"What are the four major golf majors?",c:"Masters, U.S. Open, The Open Championship, PGA Championship",w:["Masters, U.S. Open, Ryder Cup, PGA Championship","Masters, U.S. Open, Players Championship, British Open","Masters, U.S. Open, PGA Championship, Tour Championship"],e:"The four majors are the most prestigious tournaments in professional golf."},
  {q:"What is the purpose of a salary cap in professional sports?",c:"To limit team spending on player salaries, promoting competitive balance",w:["To ensure minimum player salaries","To prevent teams from signing international players","To set ticket price limits"],e:"Salary caps prevent rich-market teams from outspending small-market teams on payroll indefinitely."},
  {q:"What is the 'three-second rule' in basketball?",c:"An offensive player cannot remain in the paint for more than three seconds",w:["A team must shoot within three seconds of receiving the ball","A player can hold the ball for only three seconds","Players must dribble every three steps"],e:"The three-second lane violation prevents an offensive player from camping under the basket for easy shots."},
  {q:"What does 'slugging percentage' measure in baseball?",c:"The total number of bases a batter earns per at-bat",w:["How many home runs a batter hits per game","How hard a batter hits the ball on average","How often a batter gets extra-base hits"],e:"A single=1 base, double=2, triple=3, home run=4. A slugging percentage of .500 means 2 bases per 4 at-bats."},
  {q:"What is a hat trick in ice hockey?",c:"When a player scores three goals in one game",w:["Scoring in three consecutive games","Scoring with three different shot types","Making three assists in one game"],e:"Fans traditionally throw hats onto the ice when a player scores three goals. A 'natural hat trick' means three consecutive goals."},
  {q:"What is the role of a tight end in football?",c:"A hybrid player who blocks like a lineman and catches passes like a receiver",w:["A running back who protects the quarterback","A wide receiver who lines up in the backfield","A defensive player who covers the middle of the field"],e:"Tight ends like Travis Kelce and Rob Gronkowski have become some of the most valuable offensive weapons in the modern NFL."},
  {q:"What does the term 'cap space' mean in professional sports?",c:"The amount of money a team has available to spend on player salaries within the salary cap",w:["The amount a team has already spent on players","The maximum contract a single player can receive","The difference between the cap floor and cap ceiling"],e:"Teams with lots of cap space can sign free agents; teams over the cap may face penalties or must release players."},
  {q:"In the Olympics, what determines if a gymnast wins a medal?",c:"The sum of execution and difficulty scores from judges, minus deductions",w:["A single judge's evaluation","The number of routine elements completed","Public voting by spectators"],e:"Since 2006, gymnastics has used an open-ended difficulty score plus a 10.0 execution score, allowing for unbounded totals."},
  {q:"What is the 'luxury tax' in MLB?",c:"A penalty paid by teams whose payroll exceeds a set threshold, shared among other teams",w:["A fine for using banned substances","A fee paid to use premium ballparks","A tax on player merchandise sales"],e:"Teams like the Yankees or Dodgers regularly pay hundreds of millions in luxury taxes for exceeding the threshold."},
  {q:"What is an on-side kick in football?",c:"A short kickoff intended to be recovered by the kicking team",w:["A kickoff that goes out of bounds","A punt kicked to the side instead of straight","A kickoff that is caught before it bounces"],e:"The kicking team must allow the ball to travel 10 yards before touching it. On-side kicks succeed roughly 20% of the time."},
  {q:"What does 'defensive efficiency' measure in basketball?",c:"Points allowed per 100 possessions, adjusted for pace",w:["The percentage of shots a team blocks","The number of steals per game","How quickly a team transitions from defense to offense"],e:"Defensive efficiency is considered more meaningful than raw points-per-game allowed because it accounts for pace of play."},
  {q:"What is the difference between a first serve and second serve in tennis?",c:"Players get two chances to serve; if the first serve faults, they get a second (softer) chance",w:["The first serve must be faster than 100 mph; the second can be any speed","First serves go to the right side; second serves go to the left","They serve from different positions"],e:"Missing both serves is a double fault, awarding the point to the opponent. Second serves are typically safer."},
  {q:"What is a fastbreak in basketball?",c:"When a team quickly pushes the ball up the court before the defense can set up",w:["A timeout called to stop the clock","An inbounds play near the basket","A pick-and-roll combination"],e:"Fastbreaks often result in layups or dunks because the offensive team outnumbers the retreating defense."},
  {q:"What is the 'Heisman Trophy'?",c:"The annual award for the most outstanding player in college football",w:["The NCAA championship trophy","An award for the best defensive player in the NFL","The award for the college football team with the best record"],e:"Named after John W. Heisman, the trophy has been awarded since 1935. Winners often become top NFL draft picks."},
  {q:"What does it mean to be 'posted' in the NBA or NHL?",c:"When a team allows a player's rights to be negotiated with foreign leagues or other teams",w:["When a player's contract details are made public","When a player requests a trade","When a player is suspended by the league"],e:"The MLB posting system allows Japanese players to negotiate with American teams; the NBA has a similar process."},
  {q:"What is a power play in hockey?",c:"When one team has a numerical advantage because the other team has a player in the penalty box",w:["When the goalie is pulled for an extra skater","When a team scores two goals in under a minute","When all five skaters rush the offensive zone together"],e:"A power play gives one team a 5-on-4 (or 5-on-3) advantage; top teams score on 20–25% of their power plays."},
  {q:"What is the 'pitch clock' in MLB?",c:"A timer requiring pitchers to deliver the ball within a set time to speed up the game",w:["A digital display showing pitch speed","A device that measures pitch accuracy","A timer used by batters to prepare for each pitch"],e:"Introduced in 2023, the 15-second (with bases empty) and 20-second (with runners) pitch clock significantly sped up games."},
  {q:"What does it mean when a batter 'works a count' in baseball?",c:"Taking pitches to reach a favorable or full count (3 balls and 2 strikes)",w:["Swinging at the first pitch for contact","Bunting to advance a runner","Taking a called third strike"],e:"Forcing a pitcher to throw many pitches tires them out and may lead to walks. Batters like Paul Goldschmidt excel at this."},

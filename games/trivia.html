<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
body{overflow-x:hidden;}
.tv{max-width:620px;margin:0 auto;padding:0 10px calc(var(--safe-b) + 16px);}
.tv .scores{margin-bottom:2px;}
.score .mult{display:inline-flex;align-items:center;gap:2px;margin-left:4px;padding:0 5px;border-radius:999px;background:var(--orange);color:#2b1300;font-size:.7rem;font-weight:900;vertical-align:2px;}
.score .mult .ico{width:11px;height:11px;}
.hud{display:flex;justify-content:center;gap:8px;margin:0 0 8px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:800;font-size:.86rem;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.pill .ico{width:15px;height:15px;color:var(--text-3);}
.pill b{color:var(--text);font-weight:900;}
.pill.hot{background:color-mix(in srgb,var(--orange) 24%,transparent);color:var(--orange);}
.pill.hot .ico{color:var(--orange);}

/* ── TV studio stage ─────────────────────────────────────────────────── */
.stage{position:relative;border-radius:22px;padding:16px 12px 14px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(60% 35% at 15% 0%, rgba(255,170,60,.22), transparent 70%),
    radial-gradient(60% 35% at 85% 0%, rgba(90,150,255,.26), transparent 70%),
    radial-gradient(90% 50% at 50% 108%, rgba(120,80,255,.28), transparent 70%),
    linear-gradient(180deg,#141a3e 0%,#0a0d24 70%,#0e1230 100%);
  box-shadow:inset 0 0 0 2px rgba(255,196,80,.38), inset 0 0 40px rgba(0,0,0,.6), 0 16px 34px rgba(0,0,0,.5);
  transition:box-shadow .25s;}
.stage::before{content:"";position:absolute;left:14px;right:14px;top:5px;height:6px;z-index:-1;
  background:radial-gradient(circle,#ffe39a 0 1.6px,rgba(255,200,80,.35) 2.4px,transparent 3.2px) 0 50%/12px 6px repeat-x;
  animation:bulbs 1.2s steps(2) infinite;}
@keyframes bulbs{50%{background-position:6px 50%;}}
.stage::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:conic-gradient(from 168deg at 18% -8%, transparent 0deg, rgba(255,220,150,.06) 10deg, transparent 22deg),
    conic-gradient(from 172deg at 82% -8%, transparent 0deg, rgba(160,200,255,.07) 12deg, transparent 24deg);}
.stage.flash-ok{animation:flashok .9s ease-out;}
@keyframes flashok{0%,40%{box-shadow:inset 0 0 0 3px #3ddc84, inset 0 0 60px rgba(61,220,132,.45), 0 0 40px rgba(61,220,132,.5);}100%{}}
.stage.flash-bad{animation:flashbad .7s ease-out;}
@keyframes flashbad{0%,40%{box-shadow:inset 0 0 0 3px #ff4d5e, inset 0 0 60px rgba(255,77,94,.4);}100%{}}

.marq{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;margin-bottom:8px;}
.marq .who{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--display);font-size:1.15rem;color:#fff;letter-spacing:.01em;}
.marq .who i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent);flex:none;}
.marq .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.marq .qn{font-family:var(--display);font-size:.95rem;letter-spacing:.06em;color:#ffdf8a;text-transform:uppercase;text-shadow:0 0 12px rgba(255,200,80,.45);white-space:nowrap;}

/* Countdown ring */
.ring{position:relative;width:46px;height:46px;flex:none;}
.ring svg{width:46px;height:46px;transform:rotate(-90deg);}
.ring .bg{fill:rgba(0,0,0,.35);stroke:rgba(255,255,255,.12);stroke-width:4;}
.ring .fg{fill:none;stroke:#ffd447;stroke-width:4;stroke-linecap:round;transition:stroke .3s;}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:1.25rem;color:#fff;font-variant-numeric:tabular-nums;}
.ring.low .fg{stroke:#ff4d5e;}
.ring.low{animation:throb 1s ease-in-out infinite;}
@keyframes throb{50%{transform:scale(1.12);}}
.ring.off{opacity:.0;}

/* Question card */
.qwrap{perspective:900px;}
.qcard{position:relative;border-radius:16px;padding:12px 16px 16px;color:#1d1b2e;min-height:128px;
  background:linear-gradient(180deg,#fffdf6,#f1ead6);box-shadow:0 2px 0 rgba(255,255,255,.7) inset,0 10px 24px rgba(0,0,0,.45);
  transform-origin:50% 0;}
.qcard.in{animation:cardin .6s var(--spring) both;}
@keyframes cardin{0%{transform:rotateX(-95deg);opacity:0;}40%{opacity:1;}100%{transform:none;}}
.qcard .cat{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.qcard .cat span{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--cc,#f59e0b);color:#fff;
  font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;}
.qcard .lv{display:flex;gap:3px;}
.qcard .lv i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.14);}
.qcard .lv i.on{background:var(--cc,#f59e0b);}
.qcard .q{font-family:var(--display);font-weight:400;font-size:clamp(1.25rem,5.4vw,1.6rem);line-height:1.18;letter-spacing:.005em;}
.qcard .q.long{font-size:clamp(1.1rem,4.6vw,1.38rem);}
/* Category reel before the card flips in */
.reel{height:128px;border-radius:16px;display:grid;place-items:center;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 2px rgba(255,214,110,.25);overflow:hidden;}
.reel span{font-family:var(--display);font-size:2rem;color:#ffd76a;text-shadow:0 0 18px rgba(255,200,80,.6);}
.reel span.land{animation:land .5s var(--spring);}
@keyframes land{0%{transform:scale(1.5);}100%{transform:none;}}

/* Answer plates */
.answers{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.ans{--edge:linear-gradient(180deg,#ffe6a0,#c99018);--face:linear-gradient(180deg,#26306b 0%,#151b47 55%,#0f1438 100%);
  position:relative;display:flex;align-items:center;gap:10px;min-height:52px;width:100%;padding:8px 22px 8px 14px;border:0;background:var(--edge);color:#fff;text-align:left;
  font-weight:800;font-size:1rem;line-height:1.2;
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);
  transition:transform .12s, opacity .35s, max-height .45s var(--ease), min-height .45s var(--ease), padding .45s, margin .45s;max-height:160px;
  -webkit-tap-highlight-color:transparent;}
.ans::before{content:"";position:absolute;inset:2px;z-index:0;background:var(--face);
  clip-path:polygon(15px 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,15px 100%,0 50%);}
.ans > *{position:relative;z-index:1;}
.ans .k{flex:none;width:28px;height:28px;display:grid;place-items:center;margin-left:4px;font-family:var(--display);font-weight:400;font-size:1rem;color:#ffd76a;}
.ans .k::before{content:"";position:absolute;inset:3px;transform:rotate(45deg);border:2px solid #d9a63a;border-radius:3px;z-index:-1;}
.ans .t{flex:1;min-width:0;}
.ans.enter{animation:ansin .45s var(--spring) both;}
@keyframes ansin{from{transform:translateX(var(--fx,-40px));opacity:0;}to{transform:none;opacity:1;}}
.ans:active:not(:disabled){transform:scale(.98);}
@media (hover:hover){.ans:not(:disabled):hover::before{background:linear-gradient(180deg,#334093,#1c2460);}}
.ans:disabled{cursor:default;}
.ans.pick{--face:linear-gradient(180deg,#ffb53b,#e68a00);color:#2b1600;}
.ans.pick .k{color:#2b1600;}.ans.pick .k::before{border-color:#2b1600;}
.ans.pick{animation:lock .6s ease-in-out infinite alternate;}
@keyframes lock{to{filter:brightness(1.25);}}
.ans.right{--edge:linear-gradient(180deg,#d9ffe9,#1fae5e);--face:linear-gradient(180deg,#3ddc84,#16934d);color:#03290f;animation:blink .25s steps(2) 4;}
.ans.right .k{color:#03290f;}.ans.right .k::before{border-color:#03290f;}
@keyframes blink{50%{filter:brightness(1.5);}}
.ans.wrong{--edge:linear-gradient(180deg,#ffc2c8,#b0202e);--face:linear-gradient(180deg,#ff5a68,#b51f2d);color:#fff;animation:shake .4s;}
.ans.wrong .k{color:#fff;}.ans.wrong .k::before{border-color:#fff;}
@keyframes shake{20%{transform:translateX(-7px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
.ans.out{opacity:.28;}
.ans.gone{opacity:0;max-height:0;min-height:0;padding-top:0;padding-bottom:0;margin-top:-8px;pointer-events:none;}
.ans .who{flex:none;font-size:.72rem;font-weight:900;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.25);}

/* Result */
.res{margin-top:12px;text-align:center;animation:pop .45s var(--spring) both;}
@keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:none;opacity:1;}}
.res h2{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.4);}
.res h2.ok{color:#5df29a;}.res h2.no{color:#ff8f8f;}
.res .math{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:8px;}
.res .math span{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:.8rem;font-weight:800;color:var(--text-2);}
.res .math span.x{background:var(--orange);color:#2b1300;}
.res .math span.tot{background:#ffd447;color:#2b1a00;}
.res .math .ico{width:13px;height:13px;}
.res p{margin:10px 4px 0;color:#d8d2f0;font-size:.95rem;line-height:1.4;text-align:left;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;}
.next{margin-top:12px;}

/* Pass screen */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px 6px 8px;}
.spot{position:relative;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 35%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 55%, color-mix(in srgb,var(--c) 60%,#000));
  font-family:var(--display);font-size:3rem;color:#1a1033;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 60px color-mix(in srgb,var(--c) 55%,transparent);animation:pop .5s var(--spring) both;}
.cover h2{font-family:var(--display);font-weight:400;font-size:2.2rem;line-height:1.05;color:#fff;}
.cover p{color:var(--text-2);max-width:320px;}
.cover .btn{min-width:240px;margin-top:6px;}
.cover .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}

/* Buzzers */
.buzzers{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:10px;margin-top:12px;}
.buzz{position:relative;height:66px;border:0;border-radius:999px;color:#1a1033;font-family:var(--display);font-size:1.25rem;
  background:radial-gradient(120% 90% at 50% 20%, color-mix(in srgb,var(--c) 55%,#fff) 0%, var(--c) 45%, color-mix(in srgb,var(--c) 55%,#000) 100%);
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#000),0 10px 18px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.5);
  transition:transform .06s, box-shadow .06s, opacity .3s, filter .3s;-webkit-tap-highlight-color:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 14px;}
.buzz:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 45%,#000),0 4px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.5);}
.buzz:disabled{filter:grayscale(1) brightness(.55);}
.buzz.lit{animation:lit .5s ease-in-out infinite alternate;filter:none;}
@keyframes lit{to{box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 30px var(--c),inset 0 2px 0 rgba(255,255,255,.5);}}
.buzz .ico{position:absolute;right:16px;top:50%;width:20px;height:20px;margin-top:-10px;}
.buzzhint{text-align:center;color:var(--text-3);font-size:.85rem;margin-top:8px;}
.buzzbar{margin-top:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;}
.buzzbar i{display:block;height:100%;background:var(--c,#ffd447);transform-origin:left;}

/* Podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:250px;margin-top:6px;}
.pod{display:flex;flex-direction:column;align-items:center;width:31%;max-width:150px;}
.pod .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#1a1033;font-family:var(--display);font-size:1.6rem;
  box-shadow:0 0 0 4px rgba(255,255,255,.12);opacity:0;animation:pop .5s var(--spring) forwards;animation-delay:var(--d2);}
.pod .nm{margin-top:6px;font-weight:900;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0;animation:pop .4s forwards;animation-delay:var(--d2);}
.pod .sc{font-family:var(--display);color:#ffd76a;font-size:1.1rem;opacity:0;animation:pop .4s forwards;animation-delay:var(--d2);}
.pod .step{width:100%;margin-top:6px;border-radius:10px 10px 0 0;display:grid;place-items:start center;padding-top:8px;font-family:var(--display);font-size:2rem;color:rgba(255,255,255,.9);
  background:linear-gradient(180deg,#3a4597,#1d2458);box-shadow:inset 0 3px 0 rgba(255,255,255,.25);height:var(--h);transform-origin:bottom;animation:rise .8s var(--spring) both;animation-delay:var(--d);}
.pod.p1 .step{background:linear-gradient(180deg,#ffe27a,#d99a12);color:#5a3a00;}
.pod.p1 .av{width:66px;height:66px;font-size:2rem;box-shadow:0 0 0 4px #ffd447,0 0 30px rgba(255,212,71,.7);}
@keyframes rise{from{transform:scaleY(0);}}
.restlist{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.restlist div{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:800;}
.restlist b{margin-left:auto;color:#ffd76a;}
.solo-final{text-align:center;padding:16px 0 6px;}
.solo-final .big{font-family:var(--display);font-size:3.4rem;line-height:1;color:#ffd447;text-shadow:0 0 24px rgba(255,200,60,.5);}
.solo-final p{color:var(--text-2);margin-top:6px;}
.endacts{display:flex;flex-direction:column;gap:8px;margin-top:12px;}

/* Setup extras + level picker */
.cats{display:flex;flex-wrap:wrap;gap:6px;}
.cats .chip.on{background:var(--accent);color:var(--accent-ink);}
.lvl{display:flex;flex-direction:column;gap:10px;padding-top:4px;}
.lvl h2{font-family:var(--display);font-weight:400;font-size:1.8rem;}
.lvl .row{gap:10px;}
.lvl .seg{flex:1;}
.lvl .nm{width:92px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@media (min-width:560px){
  .answers{display:grid;grid-template-columns:1fr 1fr;}
  .ans.gone{display:none;}
  .buzzers{--cols:3 !important;}
}
</style>
</head>

<main class="tv" id="app"></main>

var CATS = [["animals","Animals"],["space","Space"],["science","Science"],["nature","Nature"],["world","World"],["america","America"],["history","History"],["colorado","Colorado"],["sports","Sports"],["movies","Movies"],["food","Food"],["math","Math"]];

["What do we call an animal that eats only plants?","A herbivore",["A carnivore","An omnivore","An insectivore"],"Cows, rabbits and deer are herbivores.",1],

["What color is a polar bear's skin?","Black",["White","Pink","Gray"],"Under the white-looking fur, polar bear skin is black to soak up heat.",2],
["Which mammal can truly fly?","The bat",["The flying squirrel","The sugar glider","The flying lemur"],"Flying squirrels only glide; bats flap their wings.",2],

["What is a group of wolves called?","A pack",["A pride","A flock","A pod"],"Wolf packs are usually a family.",1],
["What is a group of whales or dolphins called?","A pod",["A pack","A gaggle","A swarm"],"Some dolphin pods have hundreds of members.",2],

["Which lizard is famous for changing color?","The chameleon",["The iguana","The gecko","The Komodo dragon"],"Chameleons change color to show mood and to warm up or cool down.",1],
["Which of these mammals moves the slowest?","The sloth",["The koala","The panda","The hedgehog"],"Sloths move so slowly that algae grows on their fur.",1],
["Which big cat has a striped coat?","The tiger",["The leopard","The cheetah","The jaguar"],"Tigers are the biggest cats in the world.",1],

["What is a group of crows called?","A murder",["A gaggle","A pride","A parliament"],"A group of owls is called a parliament.",3],
["Which animal can regrow its legs and even parts of its heart?","The axolotl",["The hamster","The rabbit","The parrot"],"Axolotls are salamanders from Mexico.",2],

["What does a snake use its flicking tongue for?","Smelling",["Hearing","Seeing in the dark","Cooling down"],"The tongue picks up smells and passes them to a special organ in the mouth.",2],
["What is the national bird of the United States?","The bald eagle",["The wild turkey","The red-tailed hawk","The bluebird"],"Bald eagles are not really bald; their heads have white feathers.",1],
["About how long can a giant tortoise live?","Over 100 years",["About 10 years","About 25 years","About 50 years"],"Some giant tortoises have lived to around 190.",2],
["Which animal sleeps about 18 to 22 hours a day?","The koala",["The dog","The horse","The giraffe"],"Koalas eat eucalyptus leaves, which give them very little energy.",2],
["Which ocean animal uses clicks and whistles to talk to its friends?","The dolphin",["The shark","The sea turtle","The jellyfish"],"Dolphins even seem to have a whistle that works like a name.",1]],
"space": [
["Which planet is closest to the Sun?","Mercury",["Venus","Mars","Earth"],"Mercury is also the smallest planet.",1],
["Which planet is known as the Red Planet?","Mars",["Jupiter","Venus","Mercury"],"Rusty iron dust gives Mars its red color.",1],
["What is the largest planet in our solar system?","Jupiter",["Saturn","Neptune","Earth"],"More than 1,000 Earths could fit inside Jupiter.",1],
["How many planets are in our solar system?","8",["7","9","10"],"Pluto was reclassified as a dwarf planet in 2006.",1],
["Which planet is famous for its big, bright rings?","Saturn",["Mars","Mercury","Venus"],"Jupiter, Uranus and Neptune have faint rings too.",1],
["What is the Sun?","A star",["A planet","A comet","A moon"],"It is the closest star to Earth.",1],
["Who was the first person to walk on the Moon?","Neil Armstrong",["Buzz Aldrin","Yuri Gagarin","John Glenn"],"Armstrong stepped out on July 20, 1969, during Apollo 11. Buzz Aldrin followed him.",1],
["Who was the first person to travel into space?","Yuri Gagarin",["Neil Armstrong","Alan Shepard","John Glenn"],"Soviet cosmonaut Yuri Gagarin orbited Earth on April 12, 1961.",2],
["What is the name of our galaxy?","The Milky Way",["Andromeda","The Big Dipper","Orion"],"Our galaxy has hundreds of billions of stars.",1],
["What is the hottest planet in our solar system?","Venus",["Mercury","Mars","Jupiter"],"Venus's thick clouds trap heat, so it is even hotter than Mercury.",2],
["About how long does sunlight take to reach Earth?","About 8 minutes",["About 8 seconds","About 8 hours","About 8 days"],"Light crosses the 93 million miles in about 8 minutes and 20 seconds.",2],
["What do we call a space rock that lands on Earth?","A meteorite",["A meteor","An asteroid","A comet"],"While it streaks across the sky it's a meteor. If it reaches the ground, it's a meteorite.",2],
["Which planet spins on its side?","Uranus",["Neptune","Saturn","Mars"],"Scientists think something huge crashed into Uranus long ago and tipped it over.",2],
["About how long does it take Earth to go around the Sun once?","365 days",["24 hours","30 days","100 days"],"That trip is one year.",1],
["About how long does it take Earth to spin around once?","24 hours",["1 hour","7 days","365 days"],"One spin gives us one day and one night.",1],
["What force keeps the planets going around the Sun?","Gravity",["Magnetism","Friction","Wind"],"The Sun's gravity pulls on every planet.",1],
["Which mission first landed people on the Moon?","Apollo 11",["Gemini 4","Apollo 13","Mercury 7"],"Apollo 13 had to turn back after an explosion, but its crew got home safely.",2],
["What is a shooting star really?","A space rock burning up in the air",["A star falling to Earth","A comet's tail","A satellite"],"Most are no bigger than a grain of sand.",1],
["Which dwarf planet used to be called the ninth planet?","Pluto",["Ceres","Eris","Charon"],"Charon is actually Pluto's biggest moon.",1],
["What do we call the Moon when its whole face is lit up?","A full moon",["A new moon","A crescent moon","A half moon"],"A new moon is when we can hardly see it at all.",1],
["Why does the Moon seem to change shape during the month?","We see different amounts of its sunlit side",["Earth's shadow covers part of it","Clouds block part of it","The Moon really shrinks and grows"],"Earth's shadow only falls on the Moon during an eclipse.",2],
["What is Jupiter's Great Red Spot?","A giant storm",["A volcano","A crater","An ocean"],"The storm is bigger than Earth and has lasted for hundreds of years.",2],
["What is the International Space Station?","A science lab orbiting Earth where astronauts live",["A rocket launch pad in Florida","A telescope on the Moon","A base on Mars"],"It circles Earth about every 90 minutes.",1],
["Which space telescope, launched in 2021, sees in infrared from about a million miles away?","The James Webb Space Telescope",["The Hubble Space Telescope","Kepler","Spitzer"],"Webb can see some of the very first galaxies.",3],
["What is a light-year?","The distance light travels in a year",["The time it takes to reach the Sun","A year on another planet","A very bright star"],"It is about 6 trillion miles.",2],
["Which planet has the shortest year?","Mercury",["Venus","Earth","Mars"],"Mercury goes around the Sun in just 88 Earth days.",2],
["Which planet is farthest from the Sun?","Neptune",["Uranus","Saturn","Jupiter"],"Neptune takes about 165 Earth years to go around the Sun once.",2],
["What is the closest star to Earth?","The Sun",["Proxima Centauri","Polaris","Sirius"],"The next closest is Proxima Centauri, about 4.2 light-years away.",2],
["What do we call a group of stars that makes a picture in the sky?","A constellation",["A galaxy","A nebula","An orbit"],"There are 88 official constellations.",1],
["Which constellation has a 'belt' of three stars in a row?","Orion",["Ursa Major","Cassiopeia","Leo"],"Orion is a hunter in Greek myths.",2],
["The Big Dipper is part of which constellation?","Ursa Major, the Great Bear",["Orion, the Hunter","Leo, the Lion","Draco, the Dragon"],"The two stars at the end of the Dipper point to the North Star.",3],
["What is the name of the North Star?","Polaris",["Sirius","Vega","Betelgeuse"],"Polaris barely moves in the sky, so travelers used it to find north.",2],
["What is a black hole?","A place where gravity is so strong not even light can escape",["A hole in Earth's atmosphere","A dark planet","An empty patch of space"],"Black holes form when giant stars collapse.",2],
["Olympus Mons, the biggest volcano in the solar system, is on which planet?","Mars",["Venus","Earth","Jupiter"],"It is about two and a half times as tall as Mount Everest.",2],
["Which spacecraft is the farthest human-made object from Earth?","Voyager 1",["Hubble","Apollo 11","Curiosity"],"Launched in 1977, Voyager 1 is now in interstellar space.",2],
["Which NASA rover landed on Mars in 2021 with a little helicopter?","Perseverance",["Curiosity","Spirit","Sojourner"],"The helicopter, Ingenuity, made the first powered flight on another planet.",2],
["How many moons does Earth have?","1",["0","2","3"],"Our Moon is about a quarter as wide as Earth.",1],
["On which planet is a day longer than its year?","Venus",["Mercury","Mars","Jupiter"],"Venus spins so slowly that one spin takes longer than one trip around the Sun.",3],
["The main asteroid belt is between which two planets?","Mars and Jupiter",["Earth and Mars","Jupiter and Saturn","Venus and Earth"],"It holds millions of rocky asteroids.",2],
["What is the Sun mostly made of?","Hydrogen and helium",["Fire and lava","Iron and rock","Oxygen and water"],"The Sun turns hydrogen into helium, which makes light and heat.",2],
["Which planet is sometimes called Earth's twin because it is about the same size?","Venus",["Mars","Mercury","Neptune"],"It is the same size, but much, much hotter.",2],
["About how long does it take the Moon to go around Earth?","About a month",["About a day","About a week","About a year"],"About 27 days; a full cycle of Moon phases takes about 29.5 days.",2],
["Which way does a comet's tail point?","Away from the Sun",["Toward the Sun","Behind the comet, like a jet trail","Toward Earth"],"Sunlight and the solar wind push the gas and dust away from the Sun.",3],
["Who was the first American woman to go to space?","Sally Ride",["Amelia Earhart","Mae Jemison","Valentina Tereshkova"],"Sally Ride flew on the Space Shuttle in 1983. Valentina Tereshkova, from the Soviet Union, was the first woman in space in 1963.",2],
["Which planet is so light for its size that it would float in a giant bathtub?","Saturn",["Jupiter","Earth","Neptune"],"Saturn's average density is less than water's.",3],
["What are the names of Mars's two small moons?","Phobos and Deimos",["Io and Europa","Titan and Rhea","Luna and Sol"],"Their names mean fear and dread in Greek.",3],
["What is the largest moon in the solar system?","Ganymede",["Titan","Our Moon","Europa"],"Jupiter's moon Ganymede is even bigger than the planet Mercury.",3]],
"science": [
["What is the powerhouse of the cell?","Mitochondria",["Nucleus","Ribosome","Golgi apparatus"],"Mitochondria produce ATP (adenosine triphosphate), which powers cellular activities.",2],
["What force causes objects to fall to the ground?","Gravity",["Friction","Magnetism","Inertia"],"Gravity is the attractive force between masses — the more mass, the stronger the pull.",1],
["What is the chemical formula for carbon dioxide?","CO₂",["CO","H₂O","O₂"],"Carbon dioxide has one carbon atom bonded to two oxygen atoms.",2],
["What is the process by which a caterpillar becomes a butterfly?","Metamorphosis",["Mitosis","Evolution","Symbiosis"],"Complete metamorphosis has four stages: egg, larva, pupa (chrysalis), and adult.",1],
["What is the periodic table used for?","Organizing all known chemical elements",["Listing all known compounds","Organizing living organisms","Ranking elements by radioactivity"],"The periodic table organizes elements by atomic number and chemical properties.",2],
["What type of energy does the Sun produce through nuclear fusion?","Electromagnetic radiation (light and heat)",["Chemical energy","Kinetic energy","Electrical energy"],"The Sun fuses hydrogen atoms into helium, releasing massive amounts of energy.",3],
["What is the difference between a physical change and a chemical change?","A physical change alters form but not substance; a chemical change creates new substances",["Physical changes are permanent; chemical changes are temporary","Physical changes involve heat; chemical changes do not","There is no difference"],"Melting ice is physical; burning wood is chemical because new substances (ash, CO₂) form.",3],
["What does DNA stand for?","Deoxyribonucleic acid",["Dioxynuclear acid","Deoxyribose nuclei acid","Digital nuclear assembly"],"DNA is the molecule that carries genetic instructions in living organisms.",3],
["Which planet has the most moons?","Saturn",["Jupiter","Uranus","Neptune"],"Saturn has well over 100 known moons, more than any other planet, and astronomers keep finding more.",2],
["What is the difference between speed and velocity?","Velocity includes direction; speed does not",["Speed is faster than velocity","Velocity applies only to objects in orbit","Speed includes mass; velocity does not"],"Speed is how fast; velocity is how fast AND in what direction — velocity is a vector.",3],
["What type of rock is formed from layers of sediment that harden over time?","Sedimentary rock",["Igneous rock","Metamorphic rock","Crystalline rock"],"Examples include sandstone, limestone, and shale. Fossils are usually found in sedimentary rock.",2],
["What is the unit of measurement for electric current?","Ampere (amp)",["Volt","Ohm","Watt"],"Volts measure electrical pressure, ohms measure resistance, watts measure power.",3],
["What is a hypothesis?","A testable prediction about the outcome of an experiment",["A proven scientific fact","The conclusion of an experiment","A list of materials needed for an experiment"],"A hypothesis is an 'if-then' statement that can be tested through experimentation.",2],
["What layer of the atmosphere contains the ozone layer?","Stratosphere",["Troposphere","Mesosphere","Thermosphere"],"The ozone layer sits 15–35 km above Earth and absorbs harmful UV radiation from the Sun.",3],
["What is the difference between a solid, liquid, and gas?","Solids have fixed shape/volume; liquids have fixed volume but not shape; gases have neither",["Solids are heavy; liquids are medium weight; gases are light","Solids are dense; liquids flow; gases float","The difference is only temperature"],"These are the three main states of matter, determined by how closely packed and energetic the molecules are.",2],
["What is Newton's First Law of Motion?","An object at rest stays at rest unless acted upon by a force",["Force equals mass times acceleration","For every action there is an equal and opposite reaction","Gravity acts equally on all objects"],"This is also called the Law of Inertia. Objects resist changes to their motion.",2],
["What is the main function of the respiratory system?","Exchange oxygen and carbon dioxide between the body and the environment",["Pump blood throughout the body","Break down food into nutrients","Filter waste from the blood"],"The lungs absorb oxygen from air and release carbon dioxide, a waste product of metabolism.",2],
["What is the difference between photosynthesis and cellular respiration?","Photosynthesis stores energy; cellular respiration releases it",["They are the same process","Photosynthesis requires oxygen; respiration requires carbon dioxide","Photosynthesis happens in animals; respiration in plants"],"Plants use photosynthesis to make glucose; all living things use cellular respiration to break glucose down for energy.",3],
["What particle in an atom has no electrical charge?","Neutron",["Proton","Electron","Quark"],"Protons are positive, electrons are negative, and neutrons are neutral.",2],
["What is the electromagnetic spectrum?","The range of all types of electromagnetic radiation",["The colors visible to the human eye","The range of temperatures on Earth","The magnetic fields around Earth"],"It includes (from longest to shortest wavelength): radio waves, microwaves, infrared, visible light, UV, X-rays, and gamma rays.",3],
["What is the formula for calculating force?","F = ma (Force = mass × acceleration)",["F = mv","F = ma²","F = m/a"],"Newton's Second Law: a 10 kg object accelerating at 2 m/s² has a force of 20 Newtons.",3],
["What is the function of the digestive system?","Break down food into nutrients the body can absorb",["Fight infections","Produce hormones","Remove waste from the blood"],"The digestive system processes food from the mouth through the small intestine where nutrients are absorbed.",2],
["What is the difference between renewable and nonrenewable energy?","Renewable energy replenishes naturally; nonrenewable does not",["Renewable energy is cheaper","Nonrenewable energy causes no pollution","Renewable energy comes from the Sun only"],"Solar, wind, and water are renewable; coal, oil, and natural gas are nonrenewable fossil fuels.",1],
["What is the function of red blood cells?","Carry oxygen throughout the body",["Fight infection","Clot wounds","Produce antibodies"],"Red blood cells contain hemoglobin, which binds to oxygen in the lungs and delivers it to tissues.",2],
["What is the atomic number of an element?","The number of protons in the nucleus",["The number of neutrons","The total mass of the atom","The number of electrons in the outer shell"],"The atomic number uniquely identifies an element and determines where it falls on the periodic table.",3],
["What is the difference between kinetic and potential energy?","Kinetic energy is energy of motion; potential is stored energy",["They are the same thing in different units","Kinetic energy is measured in joules; potential in watts","Potential energy only applies to electricity"],"A ball rolling down a hill converts potential energy (height) to kinetic energy (movement).",2],
["What part of the brain controls balance and coordination?","Cerebellum",["Cerebrum","Brainstem","Hippocampus"],"The cerebellum ('little brain') coordinates voluntary movements and maintains posture.",3],
["What is the greenhouse effect?","Atmospheric gases trap heat from the Sun, warming the planet",["Green plants release gases that heat the atmosphere","Forests absorb too much sunlight","A layer of clouds reflects heat back to space"],"CO₂, methane, and water vapor act like a blanket around Earth — useful in moderation, harmful in excess.",2],
["What is natural selection?","The process by which organisms with favorable traits reproduce more successfully",["When animals choose their own mates","The way plants grow toward sunlight","How humans breed domestic animals"],"Charles Darwin's theory explains how species evolve over generations through survival advantages.",2],
["What causes seasons on Earth?","The tilt of Earth's axis as it orbits the Sun",["Earth's distance from the Sun","The rotation speed of the Earth","Magnetic pole shifts"],"Earth is tilted about 23.5°. When the Northern Hemisphere tilts toward the Sun, it's summer there.",2],
["What is the primary difference between mitosis and meiosis?","Mitosis produces identical cells; meiosis produces sex cells with half the chromosomes",["Mitosis happens in animals; meiosis in plants","Mitosis produces 4 cells; meiosis produces 2","They are the same process"],"Mitosis is for growth and repair. Meiosis creates sperm and eggs with 23 chromosomes each (in humans).",3],
["What is sublimation?","When a solid turns directly into a gas without passing through liquid",["When a gas turns into a liquid","When liquid turns into solid","When a solid dissolves in water"],"Dry ice (frozen CO₂) sublimates at room temperature. So does ice in very dry air.",2],
["What does the term 'biodiversity' mean?","The variety of life in an ecosystem",["The study of extinct species","The number of plants in a forest","The balance between predators and prey"],"High biodiversity means an ecosystem has many different species, making it more resilient.",2],
["What is the role of the nucleus in a cell?","It controls the cell's activities and contains DNA",["It produces energy","It transports proteins","It surrounds and protects the cell"],"The nucleus is the 'control center' of the cell, containing chromosomes and directing protein production.",2],
["What is the speed of sound in air (approximately)?","343 meters per second",["300,000 km/s","150 m/s","1,200 m/s"],"Sound travels at about 343 m/s (767 mph) in air at room temperature; it's much faster in solids.",3],
["What is the function of chlorophyll?","It absorbs sunlight for use in photosynthesis",["It transports water through plants","It stores glucose in leaves","It protects plants from insects"],"Chlorophyll absorbs mainly red and blue light, reflecting green — which is why plants look green.",2],
["What happens during a chemical reaction?","Atoms rearrange to form new substances with different properties",["Atoms are created or destroyed","Molecules change their state of matter","Elements change into different elements"],"The Law of Conservation of Mass states that matter is neither created nor destroyed in chemical reactions.",3],
["What is the difference between weather and climate?","Weather is short-term atmospheric conditions; climate is long-term patterns",["Weather occurs over seasons; climate over days","They are the same thing","Weather applies to land; climate to oceans"],"Weather is what you experience today; climate is the average weather pattern over 30+ years.",2],
["What is a food chain?","A sequence showing how energy flows from producers to consumers",["A list of all species in an ecosystem","The path water takes through an ecosystem","A diagram of plant photosynthesis"],"Example: grass → grasshopper → frog → hawk. Energy is lost at each step.",1],
["What is the difference between an acid and a base?","Acids have pH below 7; bases have pH above 7",["Acids are liquid; bases are solid","Acids are safe; bases are corrosive","Acids are man-made; bases are natural"],"Neutral is pH 7 (water). Lemon juice (~2) is acidic; baking soda (~9) is basic.",2],
["What is the relationship between wavelength and frequency of light?","Longer wavelength means lower frequency; shorter wavelength means higher frequency",["They are the same thing","Wavelength determines brightness; frequency determines color","Frequency measures speed; wavelength measures distance"],"All electromagnetic waves travel at the same speed (c). As wavelength increases, frequency decreases.",3],
["What is an ecosystem?","A community of organisms interacting with their physical environment",["A single species in its habitat","The study of endangered species","The food web in a forest"],"Ecosystems include living things (biotic) and nonliving factors (abiotic) like water, temperature, and sunlight.",2],
["How does electricity travel through a circuit?","From high potential to low potential, flowing through conductors",["In random paths through any material","Only downward, pulled by gravity","Only when the wires are warm"],"Current flows from positive to negative in conventional terms, but electrons move from negative to positive.",3],
["What is the function of white blood cells?","Fight infection and defend the body",["Carry oxygen","Produce hormones","Regulate body temperature"],"White blood cells (leukocytes) are part of the immune system and attack pathogens.",2],
["What is the Law of Conservation of Energy?","Energy cannot be created or destroyed, only transformed",["Energy decreases over time","Kinetic energy is always greater than potential energy","Energy is measured in watts"],"Energy changes forms — chemical to thermal, electrical to mechanical — but the total amount stays constant.",3],
["What are tectonic plates?","Large pieces of Earth's crust that move slowly over the mantle",["Layers of the atmosphere","Sections of the ocean floor","Rocky outcroppings on mountain tops"],"The movement of tectonic plates causes earthquakes, volcanoes, and mountain formation.",2],
["What is the function of the lymphatic system?","Remove waste and excess fluid, and fight infection",["Pump blood through the body","Break down food","Control body temperature"],"The lymphatic system is closely tied to the immune system, carrying lymph fluid and white blood cells.",3],
["What is density?","Mass per unit volume",["The weight of an object","The hardness of a material","The size of an atom"],"Density = mass ÷ volume. Objects denser than water sink; less dense objects float.",2],
["What is the difference between a comet and an asteroid?","Comets are made of ice and dust; asteroids are rocky or metallic",["Comets orbit Jupiter; asteroids orbit Earth","Comets are larger than asteroids","Asteroids glow; comets do not"],"Comets develop tails of gas and dust as they approach the Sun; asteroids are primarily rocky.",2],
["What is the function of the endocrine system?","Produce and release hormones that regulate body functions",["Filter blood","Carry nutrients","Support the skeleton"],"Hormones from glands like the thyroid, pituitary, and adrenal glands control growth, metabolism, and reproduction.",3],
["What type of wave is sound?","A mechanical longitudinal wave",["An electromagnetic wave","A transverse wave","A light wave"],"Sound requires a medium (like air or water) to travel; it cannot travel through a vacuum.",3],
["What is the water cycle?","The continuous movement of water through evaporation, condensation, and precipitation",["The way water is purified in lakes","The process by which plants absorb water","A method of measuring ocean temperature"],"The Sun drives evaporation; water vapor rises, cools, condenses into clouds, and falls as precipitation.",1],
["What is the difference between a virus and a bacterium?","Viruses are non-living and need host cells; bacteria are living organisms",["Viruses are larger than bacteria","Bacteria can only be killed by vaccines","They are the same type of organism"],"Antibiotics work on bacteria but not viruses; antiviral medications target viruses.",2],
["What is the formula for calculating power?","P = W/t (Power = Work ÷ Time)",["P = F × d","P = m × a","P = m × v"],"Power (in watts) measures how quickly work is done. A 100-watt bulb uses 100 joules per second.",3],
["What is adaptation in biology?","A trait that improves an organism's ability to survive in its environment",["A behavior learned from parents","A sudden change caused by pollution","The ability to change color"],"Adaptations evolve over generations through natural selection — like a polar bear's white fur.",2],
["What is the difference between a scalar and a vector quantity?","Scalars have magnitude only; vectors have magnitude and direction",["Scalars are larger than vectors","Vectors are used in chemistry; scalars in physics","They measure different units"],"Temperature and mass are scalars; velocity and force are vectors.",3],
["What is the role of decomposers in an ecosystem?","Break down dead organic matter and recycle nutrients",["Convert sunlight to energy","Eat insects and small animals","Control the population of herbivores"],"Fungi and bacteria decompose dead plants and animals, returning nutrients to the soil.",2],
["What is nuclear fission?","Splitting a heavy atomic nucleus into smaller nuclei, releasing energy",["Combining light nuclei into heavier ones","The decay of radioactive atoms","The chemical burning of nuclear fuel"],"Nuclear power plants use fission (splitting uranium atoms) to generate heat and electricity.",3],
["What is the function of valence electrons?","They determine how atoms bond with other atoms",["They provide the mass of the atom","They stabilize the nucleus","They determine the atom's temperature"],"Atoms with incomplete outer shells form bonds to become more stable, creating compounds.",3],
["What is the difference between physical and chemical properties of matter?","Physical properties can be observed without changing composition; chemical properties involve reactions",["Physical properties are visible; chemical properties are invisible","Physical means solid; chemical means liquid","Chemical properties are always dangerous"],"Color and density are physical; flammability and reactivity are chemical.",3],
["What causes the tides?","The gravitational pull of the Moon (and to a lesser extent, the Sun)",["The rotation of the Earth","Wind patterns over the ocean","Underwater earthquakes"],"The Moon's gravity pulls ocean water toward it, creating high tides on the side facing the Moon and the opposite side.",2],
["What is the Doppler effect?","A change in frequency of a wave as the source moves relative to the observer",["The bending of light around massive objects","The echo created by sound bouncing off walls","The slowing of sound in cold air"],"A fire truck siren sounds higher-pitched approaching and lower-pitched moving away — that's the Doppler effect.",3],
["What is the role of ATP in cells?","It is the primary energy currency used to power cellular activities",["It stores genetic information","It transports oxygen in the blood","It protects cells from UV damage"],"Mitochondria produce ATP during cellular respiration; cells use it to do virtually all their work.",3],
["What is the difference between a habitat and a niche?","A habitat is where an organism lives; a niche is its role in the ecosystem",["They are the same thing","A habitat is smaller than a niche","A niche describes only what an organism eats"],"A niche includes an organism's diet, behavior, timing of activity, and interactions — its 'job' in the ecosystem.",3],
["What gas do plants take in from the air?","Carbon dioxide",["Oxygen","Helium","Nitrogen"],"Plants take in carbon dioxide and give off oxygen.",1],
["What is H₂O better known as?","Water",["Salt","Air","Sugar"],"Two hydrogen atoms and one oxygen atom.",1],
["At what temperature does water freeze in Fahrenheit?","32°F",["0°F","100°F","212°F"],"That is 0° in Celsius.",1],
["At what temperature does water boil at sea level, in Celsius?","100°C",["50°C","212°C","0°C"],"100°C is the same as 212°F.",2],
["What is the hardest natural material?","Diamond",["Gold","Iron","Granite"],"Diamonds are made of carbon squeezed deep underground.",2],
["What is the largest organ of the human body?","Skin",["Liver","Brain","Lungs"],"Your skin covers about 20 square feet on an adult.",2],
["How many bones are in the adult human body?","206",["106","306","186"],"Babies are born with around 300, and some fuse together as they grow.",2],
["Which organ pumps blood around your body?","The heart",["The lungs","The liver","The stomach"],"Your heart beats about 100,000 times a day.",1],
["What do magnets pull on?","Iron and some other metals",["Wood","Plastic","Glass"],"Steel has iron in it, so magnets stick to the fridge.",1],
["What color do you get when you mix blue and yellow paint?","Green",["Purple","Orange","Brown"],"Blue and red make purple; red and yellow make orange.",1],
["What do we call a scientist who studies rocks?","A geologist",["A biologist","An astronomer","A chemist"],"Geo means Earth.",1],
["What does a thermometer measure?","Temperature",["Weight","Wind speed","Time"],"Thermo means heat.",1],
["What makes a rainbow?","Sunlight bent and split up by raindrops",["Colored clouds","Reflections from the ocean","Dust from space"],"Each drop splits white light into red, orange, yellow, green, blue, indigo and violet.",1],
["Which part of a plant takes in water from the soil?","The roots",["The leaves","The flowers","The petals"],"Water travels up the stem to the leaves.",1],
["What is the smallest bone in the human body?","The stirrup bone in your ear",["A toe bone","The kneecap","The funny bone"],"The stirrup (stapes) is about the size of a grain of rice.",2],
["Lightning is a giant spark of what?","Electricity",["Fire","Magnetism","Sunlight"],"Thunder is the sound of air heated by the lightning bolt.",1]],
"nature": [
["What is the difference between a deciduous and an evergreen tree?","Deciduous trees lose their leaves seasonally; evergreens keep them year-round",["Deciduous trees are taller","Evergreen trees grow only in cold climates","Deciduous trees do not produce seeds"],"Deciduous trees (maple, oak) drop leaves in fall. Evergreens (pine, spruce) stay green year-round.",1],
["What is a keystone species?","A species whose removal would significantly disrupt the entire ecosystem",["The largest animal in an ecosystem","The most common species","The first species to colonize new land"],"Sea otters are keystone species — without them, sea urchins overrun and destroy kelp forests.",3],
["How do sharks sense prey in the dark or murky water?","Using electroreception organs called the ampullae of Lorenzini",["Through an acute sense of smell only","Through vibrations in their fins","Through thermal imaging like snakes"],"Sharks detect the tiny electrical signals produced by the muscles of prey — even buried in sand.",3],
["What is the difference between mimicry and camouflage?","Camouflage blends into the background; mimicry copies another species' appearance",["They are the same adaptation","Mimicry involves color change; camouflage does not","Camouflage works only on predators; mimicry on prey"],"A stick insect uses camouflage; a harmless scarlet king snake mimics the pattern of a venomous coral snake.",2],
["How do trees communicate with each other?","Through underground fungal networks and chemical signals",["Through root-to-root electrical signals","Through pheromones released into the air only","Through pollinator insects"],"Trees send chemical warnings through air and share nutrients via mycorrhizal fungal networks — the 'wood wide web.'",3],
["What is a biome?","A large geographic area defined by its climate, plants, and animals",["A small ecosystem in a pond or stream","A type of soil found in forests","The area a single animal uses for territory"],"Major biomes include tropical rainforest, savanna, desert, temperate forest, taiga, and tundra.",2],
["What is the difference between a herbivore, carnivore, and omnivore?","Herbivores eat plants; carnivores eat animals; omnivores eat both",["Herbivores are prey; carnivores are predators; omnivores are both","They differ by size and habitat","Herbivores live on land; carnivores in water; omnivores anywhere"],"Bears and humans are omnivores; deer are herbivores; wolves are carnivores.",1],
["How do migratory birds navigate thousands of miles?","Using magnetic fields, stars, the Sun, and landmarks",["Following other animals","Using GPS-like organs in their wings","Memorizing maps from birth"],"Birds use multiple cues including Earth's magnetic field, celestial navigation, and memory of landmarks.",2],
["What is the purpose of a coral reef?","Support enormous biodiversity and protect coastlines from waves",["Produce oxygen for the ocean","Filter salt from seawater","Regulate ocean temperature"],"Coral reefs cover less than 1% of the ocean but support 25% of all marine species.",2],
["What is bioluminescence?","The production of light by living organisms through chemical reactions",["Reflection of sunlight by animals","An adaptation to absorb UV light","The glow of radioactive minerals in deep sea"],"Fireflies, deep-sea fish, and certain jellyfish all produce light through chemical reactions involving luciferin.",1],
["What is a symbiotic relationship?","A long-term interaction between two species",["Two animals competing for food","A plant that grows faster than normal","An animal that changes its habitat"],"Symbiosis includes mutualism (both benefit), commensalism (one benefits, other unaffected), and parasitism (one benefits, other harmed).",2],
["Why do leaves change color in autumn?","Chlorophyll breaks down, revealing yellow and orange pigments; red pigments are newly made",["Cold temperatures produce new pigments","Leaves absorb different wavelengths as they age","Trees inject colored chemicals into leaves"],"Shorter days trigger trees to stop producing chlorophyll, revealing hidden carotenoids and newly made anthocyanins.",1],
["What is the difference between complete and incomplete metamorphosis?","Complete has 4 stages (egg, larva, pupa, adult); incomplete has 3 (egg, nymph, adult)",["Complete happens faster","Incomplete applies only to butterflies","Complete produces only flying insects"],"Butterflies and beetles undergo complete metamorphosis; grasshoppers and cockroaches undergo incomplete.",2],
["How do plants disperse their seeds?","Wind, water, animals (eaten or attached), and mechanical ejection",["Roots extend outward and deposit seeds","Only through pollination","Seeds only fall directly under the parent plant"],"Maple seeds spin in the wind; berries are eaten by birds; burrs attach to fur; some pods explode.",1],
["What is the role of apex predators in an ecosystem?","They regulate prey populations and maintain ecosystem balance",["They eat only the sick and elderly","They compete with humans for resources","They play no critical role — smaller predators do the same job"],"Without wolves, elk overgrazed riverbanks in Yellowstone. Bringing wolves back in 1995 helped plants and rivers recover.",2],
["What is nitrogen fixation?","The conversion of atmospheric nitrogen gas into compounds plants can use",["The process by which plants absorb oxygen","The breaking down of proteins by decomposers","The storage of nitrogen in soil minerals"],"Certain bacteria (including those in legume roots) fix nitrogen, making soil more fertile.",3],
["What is the difference between a deciduous forest biome and a taiga?","Deciduous forests have warm summers and cold winters; taiga has long cold winters and brief summers",["Deciduous forests are in the tropics; taiga is in the mountains","They are the same biome under different names","Taiga has more biodiversity"],"Taiga (boreal forest) dominates Canada, Russia, and Scandinavia; it's dominated by conifers, not deciduous trees.",3],
["How do bats navigate in the dark?","Echolocation — they emit ultrasonic sounds and interpret the echoes",["Infrared vision","Magnetically sensing the ground below","Very large eyes that see in the dark"],"Bats emit high-frequency sound pulses and use the echoes to detect objects and prey with remarkable precision.",1],
["What is the significance of the Amazon River basin?","It contains 10% of all species on Earth and produces 20% of the world's river discharge",["It is the longest river basin in the world","It is the primary source of the world's oxygen","It is the deepest river basin in the world"],"The Amazon basin is the world's largest tropical rainforest and is critical to global climate regulation.",3],
["What is the relationship between predator and prey populations?","They cycle together — more prey leads to more predators, which reduces prey, which reduces predators",["Predator populations always stay stable","Prey populations always grow until space runs out","They are completely independent"],"This oscillating relationship is known as the predator-prey cycle, famously studied with lynx and snowshoe hares.",2],
["What is a wetland and why is it ecologically important?","Land saturated with water that filters pollution and supports high biodiversity",["A type of desert that floods seasonally","An aquatic ecosystem with no plants","A low-lying forest prone to flooding"],"Wetlands filter water, store carbon, reduce flood damage, and support 40% of the world's species.",2],
["How do plants respond to gravity?","Roots grow downward (gravitropism); stems grow upward (negative gravitropism)",["Plants grow only toward light, not in response to gravity","Gravity has no effect on plant growth","Roots and stems both grow away from gravity"],"Gravitropism allows plants to orient correctly even in the dark, using specialized statoliths (dense starch grains) in cells.",3],
["What is the difference between a food web and a food chain?","A food web shows complex, interlinked feeding relationships; a food chain is a single linear sequence",["A food web is only for marine ecosystems","A food chain includes decomposers; a food web does not","They are the same thing"],"In nature, most organisms eat multiple things and are eaten by multiple organisms — making webs more accurate than chains.",2],
["What is the function of a wetland in a watershed?","Absorb excess water, filter pollutants, and slowly release water into streams",["Speed the flow of water to the ocean","Prevent plant growth near rivers","Store carbon underground indefinitely"],"Wetlands act as natural sponges and filters, reducing flooding and improving water quality downstream.",2],
["What is the difference between a habitat generalist and a specialist?","Generalists thrive in many environments; specialists need specific conditions",["Generalists are larger; specialists are smaller","Specialists are more likely to survive extinction events","They refer to different dietary habits only"],"Raccoons are generalists; giant pandas (only bamboo) are extreme specialists — making them vulnerable to habitat loss.",3],
["What is an invasive species?","A non-native species that spreads rapidly and harms the native ecosystem",["A species that migrates seasonally","Any predator in a food chain","A species endemic to a small island"],"Examples: kudzu in the U.S. Southeast, Burmese pythons in Florida Everglades, zebra mussels in Great Lakes.",2],
["How do plants use water in photosynthesis?","Water molecules are split, releasing oxygen and providing electrons for the light reactions",["Water carries glucose to the leaves","Water dissolves CO₂ so plants can absorb it","Water regulates the temperature of the leaf"],"The oxygen released during photosynthesis comes from water, not from carbon dioxide.",3],
["What is the difference between a parasite and a predator?","A predator kills its prey; a parasite lives on/in a host without immediately killing it",["They are the same relationship","Parasites are smaller than predators","Predators live inside their prey; parasites attack from outside"],"Tapeworms and ticks are parasites; they weaken but don't immediately kill their hosts, unlike a lion killing a zebra.",2],
["What is the water table?","The upper surface of the zone where groundwater saturates the rock and soil",["The temperature of groundwater","The speed of water flowing underground","The amount of rainfall an area receives"],"Drilling below the water table produces wells. The water table rises after rain and falls during drought.",3],
["What is bioaccumulation?","The buildup of toxic substances in an organism's tissues over its lifetime",["The growth of plants after fertilization","The recycling of nutrients in an ecosystem","The process by which organisms gain immunity to pesticides"],"Mercury builds up in fish. Big fish that eat many smaller fish have the most, so people are told to limit big fish like swordfish.",3],
["What is the carbon cycle?","The movement of carbon through the atmosphere, oceans, soil, and living organisms",["The process of burning fossil fuels","How plants convert sunlight to carbon","The formation of diamonds from carbon"],"Carbon is stored in plants, animals, soil, rock, and the ocean; it moves between them through respiration, photosynthesis, decomposition, and combustion.",3],
["What causes an algae bloom in a lake?","Excess nutrients (nitrogen and phosphorus) from runoff cause explosive algae growth",["Too little sunlight reaches the water","An increase in predatory fish","Higher water temperatures alone"],"Algae blooms deplete oxygen, block sunlight, and can produce toxins — killing fish and other aquatic life.",2],
["How do mangroves benefit coastal ecosystems?","Protect coastlines from erosion and storms, and serve as nurseries for fish",["Produce oxygen for the entire ocean","Act as primary food producers for coral reefs","Control ocean currents"],"Mangrove roots trap sediment, protect shorelines from waves, and provide habitat for juvenile fish, birds, and invertebrates.",2],
["What is the difference between evaporation and transpiration?","Evaporation is water turning to vapor from surfaces; transpiration is water vapor released by plants",["Evaporation only happens in deserts; transpiration in forests","They are the same process","Transpiration produces rain; evaporation does not"],"Together they make up 'evapotranspiration' — a major part of the water cycle, especially in forested areas.",2],
["What is a carnivorous plant and how does it get nutrients?","A plant that traps and digests insects or small animals to supplement nutrient-poor soil",["A plant that grows near meat-eating animals","A plant whose roots extract nutrients from animal bones","A toxic plant that kills nearby animals"],"Venus flytraps, pitcher plants, and sundews supplement nutrients unavailable in acidic, nitrogen-poor bogs.",1],
["Why do some animals hibernate?","To survive winter when food is scarce by lowering body temperature and slowing metabolism",["To avoid predators in winter","Because cold air harms their lungs","To grow new fur or feathers"],"During hibernation, a bear's heart can slow to under 10 beats a minute.",1],
["What is the difference between a temperate and a tropical rainforest?","Tropical rainforests are near the equator with year-round warmth; temperate rainforests are in cooler coastal areas",["Tropical rainforests have more rainfall","They grow in opposite hemispheres","Temperate rainforests have more species diversity"],"The Hoh Rainforest in Washington state is a temperate rainforest; the Amazon is tropical. Both have enormous biodiversity.",2],
["What is a trophic level?","A position in a food chain representing a step in the flow of energy",["The number of species in an ecosystem","The depth at which ocean creatures live","The temperature needed for a species to survive"],"Producers are level 1, herbivores level 2, carnivores level 3, etc. Energy is lost at each level.",3],
["What do we call animals that are active at night?","Nocturnal",["Diurnal","Migratory","Dormant"],"Owls, bats and raccoons are nocturnal. Animals active in the daytime are diurnal.",1],
["What is the significance of biodiversity hotspots?","They contain exceptional concentrations of endemic species but are threatened by habitat loss",["They are the most ecologically stable areas on Earth","They are areas with the highest rainfall","They are places where new species are forming rapidly"],"The Amazon, Madagascar, and the California Floristic Province are examples of biodiversity hotspots.",3],
["How do fish maintain their position in the water without sinking or floating?","Using a gas-filled swim bladder to adjust buoyancy",["By constant swimming","Through a dense layer of fat","By anchoring to rocks with their fins"],"By adjusting the amount of gas in their swim bladder, bony fish can hover at any depth with minimal effort.",2],
["What is the difference between K-strategists and r-strategists?","K-strategists have few offspring and invest heavily in them; r-strategists have many offspring with little investment",["They are the same strategy","K-strategists are prey; r-strategists are predators","r-strategists are larger animals"],"Elephants are K-strategists (few offspring, long lived); mice and insects are r-strategists (many offspring, short lived).",3],
["What is eutrophication?","The process of excessive nutrient enrichment in a water body, causing algae growth and oxygen depletion",["The purification of water by wetlands","The cooling of deep ocean water","The evaporation of water from lakes"],"Agricultural runoff introduces excess nitrogen and phosphorus, triggering algae blooms that create 'dead zones.'",3],
["How do trees help regulate local climate?","They provide shade, release water vapor, absorb CO₂, and reduce wind",["They only absorb carbon dioxide","They prevent rain from reaching the ground","They make air cooler only by blocking sunlight"],"Urban forests can reduce city temperatures by 5–10°F and reduce air conditioning costs significantly.",2],
["What is the significance of soil microorganisms?","They decompose organic matter, fix nitrogen, and support plant nutrient uptake",["They cause most plant diseases","They only appear in tropical soils","They play no significant role in nutrient cycles"],"A single teaspoon of healthy soil contains more microorganisms than there are people on Earth.",3],
["What causes ocean currents?","Differences in water temperature and salinity, combined with wind and Earth's rotation",["Tidal forces from the Moon only","The gravitational pull of large landmasses","Ocean floor topography alone"],"Thermohaline circulation (the 'ocean conveyor belt') moves water around the globe based on temperature and salt content.",3],
["What is phenology?","The study of cyclic and seasonal natural phenomena, such as migration and flowering",["The study of soil composition","The measurement of ocean salinity","The study of animal sounds"],"Phenology tracks when flowers bloom, when birds migrate, and when frogs begin calling — and how these change with climate.",3],
["What is the role of fire in some ecosystems?","It clears dead matter, releases nutrients, and triggers seed germination for fire-adapted species",["It always destroys ecosystems permanently","It has no ecological benefit","It only affects plant communities, not animals"],"Many plant species, like lodgepole pine, require fire for their cones to open and release seeds.",2],
["What is an ecotone?","A transition zone between two different ecosystems",["An area completely devoid of life","The boundary between land and ocean","An extremely dense forest"],"Ecotones, like forest edges, often have higher biodiversity than either adjacent ecosystem — called the 'edge effect.'",3],
["What is the difference between weather and microclimate?","Microclimate is the climate of a very small area that differs from the surrounding region",["They are the same thing at different scales","Microclimate is only measured underground","Weather is affected by microclimates but not vice versa"],"A south-facing rock can be 20°F warmer than a north-facing spot just feet away — that's a microclimate difference.",3],
["What is the 10% rule in energy transfer?","Only about 10% of energy is transferred from one trophic level to the next",["Animals use 10% of their food for energy and waste 90%","10% of species in an ecosystem are apex predators","Each trophic level has 10 times more organisms than the one above it"],"This explains why food chains rarely exceed 4–5 levels; too little energy remains for higher predators.",3],
["What is niche partitioning?","When species divide resources to reduce competition",["The dividing of territory between predator and prey","The splitting of a species into two over time","When one species outcompetes another completely"],"Warblers in the same tree avoid competition by feeding at different heights — each occupies a different niche.",3],
["How does the Moon affect Earth's biodiversity?","Tidal cycles created by the Moon support diverse coastal ecosystems",["The Moon reflects enough light to affect plant growth","The Moon's gravity affects animal migration patterns","The Moon's proximity alters ocean chemistry"],"The tidal zones created by the Moon are among the most biologically diverse habitats on Earth.",3],
["What is transpiration and why is it important?","The evaporation of water from plant leaves, which drives water uptake from roots",["The way plants absorb sunlight","The process of carbon dioxide exchange in leaves","The way seeds absorb water to germinate"],"A large tree can transpire hundreds of gallons of water per day, cooling the air and cycling water.",2],
["What is the difference between extinction and extirpation?","Extinction is global disappearance; extirpation is local disappearance of a species",["They are synonymous terms","Extinction is temporary; extirpation is permanent","Extirpation only refers to plants"],"Gray wolves became extirpated in Yellowstone by the 1930s but were reintroduced in 1995 — the species was never extinct.",3],
["What is pheromone communication?","Chemical signals released by animals to convey information to others of the same species",["Sound signals used by whales","Visual patterns used by birds","Electrical signals used by sharks"],"Ants use pheromone trails to mark food sources; many insects use pheromones to attract mates.",3],
["What do we call water falling from clouds as rain, snow or hail?","Precipitation",["Evaporation","Condensation","Transpiration"],"It is one step in the water cycle.",1],

  {q:"Which country spans the most longitude degrees?",c:"Russia",w:["Canada","United States","China"],e:"Russia spans about 171 degrees of longitude, from eastern Europe to the western Pacific."},
  {q:"What language family does Finnish belong to?",c:"Finno-Ugric",w:["Indo-European","Slavic","Germanic"],e:"Finnish is closely related to Estonian and distantly to Hungarian — not to most European languages."},
  {q:"Which country has the highest GDP per capita?",c:"Luxembourg",w:["Switzerland","Norway","United States"],e:"Luxembourg consistently ranks #1 in GDP per capita due to its financial sector and small population."},
  {q:"What is the highest waterfall in the world?",c:"Angel Falls, Venezuela",w:["Niagara Falls, USA/Canada","Victoria Falls, Zimbabwe/Zambia","Yosemite Falls, USA"],e:"Angel Falls drops 3,212 feet (979 m) in the jungle of southeastern Venezuela."},
  {q:"Which country has the most land borders?",c:"China",w:["Russia","Brazil","Germany"],e:"China shares land borders with 14 countries; Russia also borders 14."},
  {q:"What is the main export of Saudi Arabia?",c:"Crude oil",w:["Natural gas","Gold","Agricultural products"],e:"Saudi Arabia is the world's largest oil exporter, with petroleum accounting for most of its revenue."},
  {q:"Which continent has no indigenous reptiles?",c:"Antarctica",w:["Arctic (not a continent)","Greenland","Iceland"],e:"Antarctica's extreme cold makes it impossible for reptiles to survive there."},
  {q:"What is the capital of South Africa?",c:"Pretoria (administrative), Cape Town (legislative), Bloemfontein (judicial)",w:["Johannesburg","Durban","Port Elizabeth"],e:"South Africa has three capitals: Pretoria for executive, Cape Town for legislative, Bloemfontein for judicial."},
  {q:"Which European country has the largest area?",c:"Russia",w:["Ukraine","France","Spain"],e:"If including only the European portion, Russia is still the largest; France is the largest solely European country."},
  {q:"What type of government does the United Kingdom have?",c:"Constitutional monarchy with parliamentary democracy",w:["Republic","Federal republic","Direct democracy"],e:"The UK has a monarch as head of state and a Parliament as the legislative branch."},
  {q:"What is the Silk Road?",c:"Ancient trade routes connecting Europe, the Middle East, and Asia",w:["A road built by Rome through North Africa","A sea route around Africa","A network of rivers in China"],e:"The Silk Road connected China to the Mediterranean, facilitating trade in silk, spices, and ideas."},
  {q:"Which city is built on over 100 small islands connected by bridges?",c:"Venice, Italy",w:["Stockholm, Sweden","Amsterdam, Netherlands","Copenhagen, Denmark"],e:"Venice was built on 118 small islands in a lagoon in northeastern Italy."},
  {q:"What is the most widely practiced religion in the world?",c:"Christianity",w:["Islam","Hinduism","Buddhism"],e:"Christianity has about 2.4 billion followers — roughly 31% of the world's population."},
  {q:"Which country has the largest number of pyramids?",c:"Sudan",w:["Egypt","Mexico","Peru"],e:"Sudan has over 200 ancient pyramids, more than Egypt, built by the Nubian kingdoms."},
  {q:"What is the longest river in Europe?",c:"Volga River",w:["Danube River","Rhine River","Seine River"],e:"The Volga flows 2,294 miles through Russia before emptying into the Caspian Sea."},
  {q:"Which Asian country has the most islands?",c:"Indonesia",w:["Philippines","Japan","Malaysia"],e:"Indonesia has over 17,000 islands, making it the world's largest archipelago nation."},
  {q:"What is the largest active volcano in the world?",c:"Mauna Loa, Hawaii",w:["Mount Etna, Italy","Mount Fuji, Japan","Kilauea, Hawaii"],e:"Mauna Loa has erupted 33 times since 1843 and covers half the Big Island of Hawaii."},
  {q:"Which country has the largest number of languages spoken?",c:"Papua New Guinea",w:["India","Cameroon","Nigeria"],e:"Papua New Guinea has over 800 distinct languages — more than any other nation."},
  {q:"What is the largest lake in Africa?",c:"Lake Victoria",w:["Lake Tanganyika","Lake Malawi","Lake Chad"],e:"Lake Victoria, bordering Tanzania, Uganda, and Kenya, is also the world's second-largest freshwater lake."},
  {q:"Which country is home to the world's largest rain forest?",c:"Brazil",w:["Democratic Republic of Congo","Indonesia","Colombia"],e:"The Amazon rain forest covers about 2.1 million square miles, mostly in Brazil."},
  {q:"What is the world's most visited country by tourists?",c:"France",w:["Spain","United States","Italy"],e:"France typically receives about 90 million international tourists per year."},
  {q:"What are the five permanent members of the UN Security Council?",c:"USA, UK, France, Russia, China",w:["USA, UK, Germany, Russia, Japan","USA, France, India, China, Brazil","USA, UK, France, Russia, India"],e:"These five nations have veto power over Security Council resolutions."},
  {q:"Which two countries share the world's longest land border?",c:"United States and Canada",w:["Russia and China","Russia and Kazakhstan","Argentina and Chile"],e:"The U.S.-Canada border stretches 5,525 miles, the longest in the world."},
  {q:"What is the capital of Australia?",c:"Canberra",w:["Sydney","Melbourne","Brisbane"],e:"Canberra became the capital in 1913 as a compromise between rivals Sydney and Melbourne."},
  {q:"Which country has the tallest average elevation above sea level?",c:"Bhutan",w:["Nepal","Tibet","Bolivia"],e:"Bhutan's average elevation is about 10,760 feet due to its position in the Himalayas."},
  {q:"Which continent is experiencing the fastest population growth?",c:"Africa",w:["Asia","South America","Oceania"],e:"Africa's population is projected to double by 2050, driven by high birth rates."},
  {q:"What percentage of the world's land surface is desert?",c:"About 33%",w:["About 15%","About 50%","About 20%"],e:"Deserts — both hot and cold — cover roughly one-third of Earth's land area."},
  {q:"Which country has the most active nuclear power plants?",c:"United States",w:["France","China","Russia"],e:"The U.S. has about 93 operating nuclear reactors, producing about 20% of its electricity."},
  {q:"What is the smallest ocean?",c:"Arctic Ocean",w:["Indian Ocean","Southern Ocean","Pacific Ocean"],e:"The Arctic Ocean covers about 5.4 million square miles."},
  {q:"Which country invented the printing press?",c:"Germany",w:["China","England","Italy"],e:"Johannes Gutenberg invented the movable-type printing press in Mainz, Germany around 1440."},
  {q:"What is the world's largest democracy?",c:"India",w:["United States","Indonesia","Brazil"],e:"India has over 900 million eligible voters, making it the largest democracy by population."},
  {q:"Which mountain range contains the most peaks above 8,000 meters?",c:"Himalayas and Karakoram combined",w:["Andes","Rocky Mountains","Alps"],e:"All 14 of the world's peaks above 8,000 meters are in the Himalayas or Karakoram range in South Asia."},
  {q:"What country is home to Angkor Wat?",c:"Cambodia",w:["Thailand","Vietnam","Indonesia"],e:"Angkor Wat is the world's largest religious monument, built in the 12th century by the Khmer Empire."},
  {q:"What country hosts the Amazon River's mouth?",c:"Brazil",w:["Peru","Colombia","Ecuador"],e:"The Amazon empties into the Atlantic Ocean near the city of Marajó in Brazil."},
  {q:"What is the Mekong River's significance?",c:"It supports the livelihoods of 70 million people in Southeast Asia",w:["It is the world's longest river","It separates India from Pakistan","It is the boundary between China and Russia"],e:"The Mekong flows through China, Myanmar, Laos, Thailand, Cambodia, and Vietnam."},
  {q:"Which country has the most pyramids by count?",c:"Sudan",w:["Egypt","Guatemala","Mexico"],e:"The ancient Nubian civilization built over 255 pyramids in what is now Sudan."},
  {q:"What body of water connects the Red Sea to the Mediterranean?",c:"Suez Canal",w:["Strait of Gibraltar","Bosphorus Strait","Panama Canal"],e:"The Suez Canal, opened in 1869, is a critical shipping route between Europe and Asia."},
  {q:"Which country has the highest number of billionaires?",c:"United States",w:["China","Russia","Germany"],e:"The U.S. has over 700 billionaires, more than any other nation."},
  {q:"What is the Great Barrier Reef?",c:"The world's largest coral reef system, off the coast of Australia",w:["A mountain range in New Zealand","A chain of islands in the Pacific","An underwater volcanic range"],e:"The Great Barrier Reef stretches 1,400 miles and is visible from space."},
  {q:"What is the poorest continent by average GDP per capita?",c:"Africa",w:["South America","Asia","Oceania"],e:"Many African nations have low GDPs, though the continent has significant economic variation."},
  {q:"Which country has the most UNESCO World Heritage Sites in Asia?",c:"China",w:["Japan","India","Cambodia"],e:"China has 57 UNESCO World Heritage Sites, the most in Asia."},
  {q:"What is Pangaea?",c:"A supercontinent that existed 300 million years ago before breaking apart",w:["A region of ancient ocean floor","The original name for Antarctica","An ancient sea between Europe and Asia"],e:"Pangaea broke apart due to plate tectonics, forming the continents we know today."},
  {q:"Which country has the world's largest merchant shipping fleet?",c:"Panama",w:["Greece","China","Liberia"],e:"Many ships register under Panama's flag of convenience, making it the largest by number."},
  {q:"What is the Sahel?",c:"A semi-arid transition zone between the Sahara and tropical Africa",w:["A mountain range in North Africa","A river delta in West Africa","A large plateau in East Africa"],e:"The Sahel stretches from Senegal to Ethiopia and is vulnerable to drought and desertification."},
  {q:"Which country was the first to give women the right to vote nationally?",c:"New Zealand",w:["Australia","Finland","Norway"],e:"New Zealand granted women full voting rights in 1893."},
  {q:"What is the world's busiest container port?",c:"Shanghai, China",w:["Singapore","Rotterdam","Los Angeles"],e:"Shanghai handles over 47 million TEUs (container units) per year."},
  {q:"Which country invented the World Wide Web?",c:"United Kingdom (CERN)",w:["United States","Japan","France"],e:"Tim Berners-Lee, a British scientist at CERN in Switzerland, invented the web in 1989."},
  {q:"What is the significance of the Greenwich Meridian?",c:"It is the 0° line of longitude that sets world time zones",w:["It marks the Earth's equator","It separates the Northern and Southern hemispheres","It is the boundary between Europe and Asia"],e:"Greenwich, England was established as 0° longitude in 1884, creating the basis for world time."},
  {q:"Which African country has the highest GDP?",c:"Nigeria",w:["South Africa","Egypt","Ethiopia"],e:"Nigeria's economy, driven largely by oil, has been Africa's largest or second-largest for years."},
  {q:"What language is most widely spoken in Latin America?",c:"Spanish",w:["Portuguese","French","English"],e:"Spanish is the official language of most Latin American countries; Portuguese is spoken in Brazil."},
  {q:"Which famous document declared Indian independence?",c:"Indian Independence Act 1947",w:["Treaty of Versailles","Partition of Bengal","Declaration of Delhi"],e:"The Indian Independence Act, passed by the British Parliament on July 18, 1947, partitioned India and Pakistan."},
],
science:[
  {q:"What is the powerhouse of the cell?",c:"Mitochondria",w:["Nucleus","Ribosome","Golgi apparatus"],e:"Mitochondria produce ATP (adenosine triphosphate), which powers cellular activities."},
  {q:"What force causes objects to fall to the ground?",c:"Gravity",w:["Friction","Magnetism","Inertia"],e:"Gravity is the attractive force between masses — the more mass, the stronger the pull."},
  {q:"What is the chemical formula for carbon dioxide?",c:"CO₂",w:["CO","H₂O","O₂"],e:"Carbon dioxide has one carbon atom bonded to two oxygen atoms."},
  {q:"What is the process by which a caterpillar becomes a butterfly?",c:"Metamorphosis",w:["Mitosis","Evolution","Symbiosis"],e:"Complete metamorphosis has four stages: egg, larva, pupa (chrysalis), and adult."},
  {q:"What is the periodic table used for?",c:"Organizing all known chemical elements",w:["Listing all known compounds","Organizing living organisms","Ranking elements by radioactivity"],e:"The periodic table organizes elements by atomic number and chemical properties."},
  {q:"What type of energy does the Sun produce through nuclear fusion?",c:"Electromagnetic radiation (light and heat)",w:["Chemical energy","Kinetic energy","Electrical energy"],e:"The Sun fuses hydrogen atoms into helium, releasing massive amounts of energy."},
  {q:"What is the difference between a physical change and a chemical change?",c:"A physical change alters form but not substance; a chemical change creates new substances",w:["Physical changes are permanent; chemical changes are temporary","Physical changes involve heat; chemical changes do not","There is no difference"],e:"Melting ice is physical; burning wood is chemical because new substances (ash, CO₂) form."},
  {q:"What does DNA stand for?",c:"Deoxyribonucleic acid",w:["Dioxynuclear acid","Deoxyribose nuclei acid","Digital nuclear assembly"],e:"DNA is the molecule that carries genetic instructions in living organisms."},
  {q:"Which planet has the most moons?",c:"Saturn",w:["Jupiter","Uranus","Neptune"],e:"Saturn has at least 146 confirmed moons, surpassing Jupiter's count."},
  {q:"What is the difference between speed and velocity?",c:"Velocity includes direction; speed does not",w:["Speed is faster than velocity","Velocity applies only to objects in orbit","Speed includes mass; velocity does not"],e:"Speed is how fast; velocity is how fast AND in what direction — velocity is a vector."},
  {q:"What type of rock is formed from layers of sediment that harden over time?",c:"Sedimentary rock",w:["Igneous rock","Metamorphic rock","Crystalline rock"],e:"Examples include sandstone, limestone, and shale. Fossils are usually found in sedimentary rock."},
  {q:"What is the unit of measurement for electric current?",c:"Ampere (amp)",w:["Volt","Ohm","Watt"],e:"Volts measure electrical pressure, ohms measure resistance, watts measure power."},
  {q:"What is a hypothesis?",c:"A testable prediction about the outcome of an experiment",w:["A proven scientific fact","The conclusion of an experiment","A list of materials needed for an experiment"],e:"A hypothesis is an 'if-then' statement that can be tested through experimentation."},
  {q:"What layer of the atmosphere contains the ozone layer?",c:"Stratosphere",w:["Troposphere","Mesosphere","Thermosphere"],e:"The ozone layer sits 15–35 km above Earth and absorbs harmful UV radiation from the Sun."},
  {q:"What is the difference between a solid, liquid, and gas?",c:"Solids have fixed shape/volume; liquids have fixed volume but not shape; gases have neither",w:["Solids are heavy; liquids are medium weight; gases are light","Solids are dense; liquids flow; gases float","The difference is only temperature"],e:"These are the three main states of matter, determined by how closely packed and energetic the molecules are."},
  {q:"What is Newton's First Law of Motion?",c:"An object at rest stays at rest unless acted upon by a force",w:["Force equals mass times acceleration","For every action there is an equal and opposite reaction","Gravity acts equally on all objects"],e:"This is also called the Law of Inertia. Objects resist changes to their motion."},
  {q:"What is the main function of the respiratory system?",c:"Exchange oxygen and carbon dioxide between the body and the environment",w:["Pump blood throughout the body","Break down food into nutrients","Filter waste from the blood"],e:"The lungs absorb oxygen from air and release carbon dioxide, a waste product of metabolism."},
  {q:"What is the difference between photosynthesis and cellular respiration?",c:"Photosynthesis stores energy; cellular respiration releases it",w:["They are the same process","Photosynthesis requires oxygen; respiration requires carbon dioxide","Photosynthesis happens in animals; respiration in plants"],e:"Plants use photosynthesis to make glucose; all living things use cellular respiration to break glucose down for energy."},
  {q:"What particle in an atom has no electrical charge?",c:"Neutron",w:["Proton","Electron","Quark"],e:"Protons are positive, electrons are negative, and neutrons are neutral."},
  {q:"What is the electromagnetic spectrum?",c:"The range of all types of electromagnetic radiation",w:["The colors visible to the human eye","The range of temperatures on Earth","The magnetic fields around Earth"],e:"It includes (from longest to shortest wavelength): radio waves, microwaves, infrared, visible light, UV, X-rays, and gamma rays."},
  {q:"What is the formula for calculating force?",c:"F = ma (Force = mass × acceleration)",w:["F = mv","F = ma²","F = m/a"],e:"Newton's Second Law: a 10 kg object accelerating at 2 m/s² has a force of 20 Newtons."},
  {q:"What is the function of the digestive system?",c:"Break down food into nutrients the body can absorb",w:["Fight infections","Produce hormones","Remove waste from the blood"],e:"The digestive system processes food from the mouth through the small intestine where nutrients are absorbed."},
  {q:"What is the difference between renewable and nonrenewable energy?",c:"Renewable energy replenishes naturally; nonrenewable does not",w:["Renewable energy is cheaper","Nonrenewable energy causes no pollution","Renewable energy comes from the Sun only"],e:"Solar, wind, and water are renewable; coal, oil, and natural gas are nonrenewable fossil fuels."},
  {q:"What is the function of red blood cells?",c:"Carry oxygen throughout the body",w:["Fight infection","Clot wounds","Produce antibodies"],e:"Red blood cells contain hemoglobin, which binds to oxygen in the lungs and delivers it to tissues."},
  {q:"What is the atomic number of an element?",c:"The number of protons in the nucleus",w:["The number of neutrons","The total mass of the atom","The number of electrons in the outer shell"],e:"The atomic number uniquely identifies an element and determines where it falls on the periodic table."},
  {q:"What is the difference between kinetic and potential energy?",c:"Kinetic energy is energy of motion; potential is stored energy",w:["They are the same thing in different units","Kinetic energy is measured in joules; potential in watts","Potential energy only applies to electricity"],e:"A ball rolling down a hill converts potential energy (height) to kinetic energy (movement)."},
  {q:"What part of the brain controls balance and coordination?",c:"Cerebellum",w:["Cerebrum","Brainstem","Hippocampus"],e:"The cerebellum ('little brain') coordinates voluntary movements and maintains posture."},
  {q:"What is the greenhouse effect?",c:"Atmospheric gases trap heat from the Sun, warming the planet",w:["Green plants release gases that heat the atmosphere","Forests absorb too much sunlight","A layer of clouds reflects heat back to space"],e:"CO₂, methane, and water vapor act like a blanket around Earth — useful in moderation, harmful in excess."},
  {q:"What is natural selection?",c:"The process by which organisms with favorable traits reproduce more successfully",w:["When animals choose their own mates","The way plants grow toward sunlight","How humans breed domestic animals"],e:"Charles Darwin's theory explains how species evolve over generations through survival advantages."},
  {q:"What causes seasons on Earth?",c:"The tilt of Earth's axis as it orbits the Sun",w:["Earth's distance from the Sun","The rotation speed of the Earth","Magnetic pole shifts"],e:"Earth is tilted about 23.5°. When the Northern Hemisphere tilts toward the Sun, it's summer there."},
  {q:"What is the primary difference between mitosis and meiosis?",c:"Mitosis produces identical cells; meiosis produces sex cells with half the chromosomes",w:["Mitosis happens in animals; meiosis in plants","Mitosis produces 4 cells; meiosis produces 2","They are the same process"],e:"Mitosis is for growth and repair. Meiosis creates sperm and eggs with 23 chromosomes each (in humans)."},
  {q:"What is sublimation?",c:"When a solid turns directly into a gas without passing through liquid",w:["When a gas turns into a liquid","When liquid turns into solid","When a solid dissolves in water"],e:"Dry ice (frozen CO₂) sublimates at room temperature. So does ice in very dry air."},
  {q:"What does the term 'biodiversity' mean?",c:"The variety of life in an ecosystem",w:["The study of extinct species","The number of plants in a forest","The balance between predators and prey"],e:"High biodiversity means an ecosystem has many different species, making it more resilient."},
  {q:"What is the role of the nucleus in a cell?",c:"It controls the cell's activities and contains DNA",w:["It produces energy","It transports proteins","It surrounds and protects the cell"],e:"The nucleus is the 'control center' of the cell, containing chromosomes and directing protein production."},
  {q:"What is the speed of sound in air (approximately)?",c:"343 meters per second",w:["300,000 km/s","150 m/s","1,200 m/s"],e:"Sound travels at about 343 m/s (767 mph) in air at room temperature; it's much faster in solids."},
  {q:"What is the function of chlorophyll?",c:"It absorbs sunlight for use in photosynthesis",w:["It transports water through plants","It stores glucose in leaves","It protects plants from insects"],e:"Chlorophyll absorbs mainly red and blue light, reflecting green — which is why plants look green."},
  {q:"What happens during a chemical reaction?",c:"Atoms rearrange to form new substances with different properties",w:["Atoms are created or destroyed","Molecules change their state of matter","Elements change into different elements"],e:"The Law of Conservation of Mass states that matter is neither created nor destroyed in chemical reactions."},
  {q:"What is the difference between weather and climate?",c:"Weather is short-term atmospheric conditions; climate is long-term patterns",w:["Weather occurs over seasons; climate over days","They are the same thing","Weather applies to land; climate to oceans"],e:"Weather is what you experience today; climate is the average weather pattern over 30+ years."},
  {q:"What is a food chain?",c:"A sequence showing how energy flows from producers to consumers",w:["A list of all species in an ecosystem","The path water takes through an ecosystem","A diagram of plant photosynthesis"],e:"Example: grass → grasshopper → frog → hawk. Energy is lost at each step."},
  {q:"What is the difference between an acid and a base?",c:"Acids have pH below 7; bases have pH above 7",w:["Acids are liquid; bases are solid","Acids are safe; bases are corrosive","Acids are man-made; bases are natural"],e:"Neutral is pH 7 (water). Lemon juice (~2) is acidic; baking soda (~9) is basic."},
  {q:"What is the relationship between wavelength and frequency of light?",c:"Longer wavelength means lower frequency; shorter wavelength means higher frequency",w:["They are the same thing","Wavelength determines brightness; frequency determines color","Frequency measures speed; wavelength measures distance"],e:"All electromagnetic waves travel at the same speed (c). As wavelength increases, frequency decreases."},
  {q:"What is an ecosystem?",c:"A community of organisms interacting with their physical environment",w:["A single species in its habitat","The study of endangered species","The food web in a forest"],e:"Ecosystems include living things (biotic) and nonliving factors (abiotic) like water, temperature, and sunlight."},
  {q:"How does electricity travel through a circuit?",c:"From high potential to low potential, flowing through conductors",w:["In random paths through any material","Only downward due to gravity","From negative to positive terminals in appliances"],e:"Current flows from positive to negative in conventional terms, but electrons move from negative to positive."},
  {q:"What is the function of white blood cells?",c:"Fight infection and defend the body",w:["Carry oxygen","Produce hormones","Regulate body temperature"],e:"White blood cells (leukocytes) are part of the immune system and attack pathogens."},
  {q:"What is the Law of Conservation of Energy?",c:"Energy cannot be created or destroyed, only transformed",w:["Energy decreases over time","Kinetic energy is always greater than potential energy","Energy is measured in watts"],e:"Energy changes forms — chemical to thermal, electrical to mechanical — but the total amount stays constant."},
  {q:"What are tectonic plates?",c:"Large pieces of Earth's crust that move slowly over the mantle",w:["Layers of the atmosphere","Sections of the ocean floor","Rocky outcroppings on mountain tops"],e:"The movement of tectonic plates causes earthquakes, volcanoes, and mountain formation."},
  {q:"What is the function of the lymphatic system?",c:"Remove waste and excess fluid, and fight infection",w:["Pump blood through the body","Break down food","Control body temperature"],e:"The lymphatic system is closely tied to the immune system, carrying lymph fluid and white blood cells."},
  {q:"What is density?",c:"Mass per unit volume",w:["The weight of an object","The hardness of a material","The size of an atom"],e:"Density = mass ÷ volume. Objects denser than water sink; less dense objects float."},
  {q:"What is the difference between a comet and an asteroid?",c:"Comets are made of ice and dust; asteroids are rocky or metallic",w:["Comets orbit Jupiter; asteroids orbit Earth","Comets are larger than asteroids","Asteroids glow; comets do not"],e:"Comets develop tails of gas and dust as they approach the Sun; asteroids are primarily rocky."},
  {q:"What is the function of the endocrine system?",c:"Produce and release hormones that regulate body functions",w:["Filter blood","Carry nutrients","Support the skeleton"],e:"Hormones from glands like the thyroid, pituitary, and adrenal glands control growth, metabolism, and reproduction."},
  {q:"What type of wave is sound?",c:"A mechanical longitudinal wave",w:["An electromagnetic wave","A transverse wave","A light wave"],e:"Sound requires a medium (like air or water) to travel; it cannot travel through a vacuum."},
  {q:"What is the water cycle?",c:"The continuous movement of water through evaporation, condensation, and precipitation",w:["The way water is purified in lakes","The process by which plants absorb water","A method of measuring ocean temperature"],e:"The Sun drives evaporation; water vapor rises, cools, condenses into clouds, and falls as precipitation."},
  {q:"What is the difference between a virus and a bacterium?",c:"Viruses are non-living and need host cells; bacteria are living organisms",w:["Viruses are larger than bacteria","Bacteria can only be killed by vaccines","They are the same type of organism"],e:"Antibiotics work on bacteria but not viruses; antiviral medications target viruses."},
  {q:"What is the formula for calculating power?",c:"P = W/t (Power = Work ÷ Time)",w:["P = F × d","P = m × a","P = V × I"],e:"Power (in watts) measures how quickly work is done. A 100-watt bulb uses 100 joules per second."},
  {q:"What is adaptation in biology?",c:"A trait that improves an organism's ability to survive in its environment",w:["A behavior learned from parents","A sudden change caused by pollution","The ability to change color"],e:"Adaptations evolve over generations through natural selection — like a polar bear's white fur."},
  {q:"What is the difference between a scalar and a vector quantity?",c:"Scalars have magnitude only; vectors have magnitude and direction",w:["Scalars are larger than vectors","Vectors are used in chemistry; scalars in physics","They measure different units"],e:"Temperature and mass are scalars; velocity and force are vectors."},
  {q:"What is the role of decomposers in an ecosystem?",c:"Break down dead organic matter and recycle nutrients",w:["Convert sunlight to energy","Eat insects and small animals","Control the population of herbivores"],e:"Fungi and bacteria decompose dead plants and animals, returning nutrients to the soil."},
  {q:"What is nuclear fission?",c:"Splitting a heavy atomic nucleus into smaller nuclei, releasing energy",w:["Combining light nuclei into heavier ones","The decay of radioactive atoms","The chemical burning of nuclear fuel"],e:"Nuclear power plants use fission (splitting uranium atoms) to generate heat and electricity."},
  {q:"What is the function of valence electrons?",c:"They determine how atoms bond with other atoms",w:["They provide the mass of the atom","They stabilize the nucleus","They determine the atom's temperature"],e:"Atoms with incomplete outer shells form bonds to become more stable, creating compounds."},
  {q:"What is the difference between physical and chemical properties of matter?",c:"Physical properties can be observed without changing composition; chemical properties involve reactions",w:["Physical properties are visible; chemical properties are invisible","Physical means solid; chemical means liquid","Chemical properties are always dangerous"],e:"Color and density are physical; flammability and reactivity are chemical."},
  {q:"What causes the tides?",c:"The gravitational pull of the Moon (and to a lesser extent, the Sun)",w:["The rotation of the Earth","Wind patterns over the ocean","Underwater earthquakes"],e:"The Moon's gravity pulls ocean water toward it, creating high tides on the side facing the Moon and the opposite side."},
  {q:"What is the Doppler effect?",c:"A change in frequency of a wave as the source moves relative to the observer",w:["The bending of light around massive objects","The echo created by sound bouncing off walls","The slowing of sound in cold air"],e:"A fire truck siren sounds higher-pitched approaching and lower-pitched moving away — that's the Doppler effect."},
  {q:"What is the role of ATP in cells?",c:"It is the primary energy currency used to power cellular activities",w:["It stores genetic information","It transports oxygen in the blood","It protects cells from UV damage"],e:"Mitochondria produce ATP during cellular respiration; cells use it to do virtually all their work."},
  {q:"What is the difference between a habitat and a niche?",c:"A habitat is where an organism lives; a niche is its role in the ecosystem",w:["They are the same thing","A habitat is smaller than a niche","A niche describes only what an organism eats"],e:"A niche includes an organism's diet, behavior, timing of activity, and interactions — its 'job' in the ecosystem."},
],
colorado:[
  {q:"What year did Colorado become a state?",c:"1876",w:["1864","1880","1870"],e:"Colorado became the 38th state on August 1, 1876 — the centennial year of the U.S."},
  {q:"What is the highest point in Colorado?",c:"Mount Elbert",w:["Pikes Peak","Longs Peak","Mount Evans"],e:"Mount Elbert reaches 14,440 feet — the highest in the Rockies."},
  {q:"How many 'fourteeners' (peaks above 14,000 ft) does Colorado have?",c:"58",w:["42","72","30"],e:"Colorado has 58 peaks over 14,000 feet — more than any other state."},
  {q:"What major river originates in Colorado and flows to the Gulf of California?",c:"Colorado River",w:["Rio Grande","Arkansas River","South Platte River"],e:"The Colorado River begins in Rocky Mountain National Park and flows 1,450 miles to Mexico."},
  {q:"What is Colorado's state animal?",c:"Rocky Mountain Bighorn Sheep",w:["Elk","Mule Deer","American Bison"],e:"The bighorn sheep was designated Colorado's state animal in 1961."},
  {q:"What is Colorado's state bird?",c:"Lark Bunting",w:["Mountain Bluebird","Broad-tailed Hummingbird","Western Meadowlark"],e:"The Lark Bunting, known for its striking black-and-white plumage, was chosen in 1931."},
  {q:"What city in Colorado is known as the 'Magic City of the Plains'?",c:"Pueblo",w:["Colorado Springs","Fort Collins","Greeley"],e:"Pueblo, on the Arkansas River, earned that nickname during its industrial boom in the late 1800s."},
  {q:"What national monument is known for its ancient cliff dwellings?",c:"Mesa Verde",w:["Black Canyon of the Gunnison","Great Sand Dunes","Dinosaur National Monument"],e:"Mesa Verde National Park contains over 4,000 archaeological sites, including 600 cliff dwellings."},
  {q:"What is the elevation of Denver, often called the 'Mile High City'?",c:"5,280 feet",w:["4,800 feet","6,000 feet","5,100 feet"],e:"Denver sits at exactly 5,280 feet above sea level — hence the 'Mile High' nickname."},
  {q:"Which mountain range runs directly through the center of Colorado?",c:"Rocky Mountains (Front Range and Sawatch Range)",w:["Sierra Nevada","Cascade Range","Uinta Mountains"],e:"The Rockies divide Colorado, with the Front Range near Denver and the Sawatch containing the highest peaks."},
  {q:"What is the name of the largest sand dunes in North America?",c:"Great Sand Dunes",w:["White Sands","Monument Valley","Coral Pink Sand Dunes"],e:"Great Sand Dunes National Park in southern Colorado has dunes reaching 750 feet tall."},
  {q:"What is Colorado's nickname?",c:"The Centennial State",w:["The Mountain State","The Rocky State","The Sunshine State"],e:"Colorado was admitted to the Union in 1876, the 100th anniversary of U.S. independence."},
  {q:"Which Colorado city hosts the United States Air Force Academy?",c:"Colorado Springs",w:["Denver","Aurora","Pueblo"],e:"The Air Force Academy is located just north of Colorado Springs, established there in 1954."},
  {q:"What is the name of Colorado's largest national forest?",c:"Arapaho and Roosevelt National Forest",w:["Pike National Forest","White River National Forest","San Juan National Forest"],e:"White River National Forest in the Rockies is the most-visited; the Arapaho/Roosevelt covers the most area."},
  {q:"What large animal was nearly hunted to extinction but has since been reintroduced to Colorado?",c:"American Bison (Buffalo)",w:["Gray Wolf","Grizzly Bear","California Condor"],e:"Wolves have been reintroduced too, but bison herds are now protected at several Colorado parks."},
  {q:"What is the Continental Divide?",c:"The mountain ridge that separates rivers flowing to the Pacific from those flowing to the Atlantic",w:["The border between Colorado and New Mexico","The highest elevation point in North America","The boundary between US time zones"],e:"The Continental Divide runs through the Rocky Mountains; water west of it flows to the Pacific, east to the Atlantic."},
  {q:"What Colorado ski resort is one of the largest in North America?",c:"Vail",w:["Breckenridge","Aspen","Keystone"],e:"Vail Mountain has over 5,000 acres of skiable terrain."},
  {q:"Which river valley in Colorado is famous for its fruit orchards?",c:"Grand Valley near Grand Junction",w:["San Luis Valley","Arkansas River Valley","Cache La Poudre Valley"],e:"Grand Valley's warm climate, fed by Colorado River irrigation, is ideal for peaches, pears, and wine grapes."},
  {q:"What is the San Luis Valley known for?",c:"Being one of the largest alpine valleys in the world",w:["The oldest Native American settlement in Colorado","Colorado's largest lake","Its rare predator animals"],e:"The San Luis Valley is a high desert plateau about 7,500 feet elevation, bordered by 14,000-foot peaks."},
  {q:"Which Colorado city is the home of the Denver Broncos' stadium?",c:"Denver",w:["Aurora","Commerce City","Englewood"],e:"Empower Field at Mile High in Denver is home to the Broncos."},
  {q:"What large carnivore was recently reintroduced to Colorado after being absent for 70 years?",c:"Gray Wolf",w:["Grizzly Bear","Mountain Lion","Black Bear"],e:"Gray wolves were reintroduced in December 2023 under Colorado's voter-approved Proposition 114."},
  {q:"What is the primary crop of Colorado's San Luis Valley?",c:"Potatoes",w:["Wheat","Corn","Sunflowers"],e:"The San Luis Valley is one of the nation's largest potato-producing regions due to its volcanic soil."},
  {q:"What famous trail ran through Colorado during westward expansion?",c:"Santa Fe Trail",w:["Oregon Trail","Pony Express Route","California Trail"],e:"The Santa Fe Trail was a commercial route from Missouri through Colorado to Santa Fe, New Mexico (1821–1880)."},
  {q:"Which Native American tribe is most historically associated with Colorado's San Juan Mountains?",c:"Ute",w:["Cheyenne","Arapaho","Navajo"],e:"The Ute people inhabited Colorado's mountains for centuries before European contact."},
  {q:"What is Colorado's state tree?",c:"Colorado Blue Spruce",w:["Ponderosa Pine","Quaking Aspen","Douglas Fir"],e:"The Colorado Blue Spruce was designated the state tree in 1939, known for its silvery-blue needles."},
  {q:"What year did Colorado legalize recreational marijuana?",c:"2012",w:["2010","2014","2016"],e:"Colorado voters passed Amendment 64 in November 2012, making it one of the first states to legalize recreational cannabis."},
  {q:"What is Pikes Peak known for?",c:"Being one of the most visited mountain summits in the world",w:["Being the tallest mountain in Colorado","Being where the National Anthem was written","Being the first mountain climbed in North America"],e:"Katharine Lee Bates' visit to Pikes Peak in 1893 inspired 'America the Beautiful.'"},
  {q:"What body of water is formed by the Hoover Dam on the Colorado border?",c:"Lake Mead",w:["Lake Powell","Lake Havasu","Blue Mesa Reservoir"],e:"Lake Mead, on the Nevada-Arizona border, is fed by the Colorado River."},
  {q:"What is the largest city in Colorado?",c:"Denver",w:["Colorado Springs","Aurora","Fort Collins"],e:"Denver has about 750,000 residents in the city proper; the metro area has over 3 million."},
  {q:"What kind of geology created Black Canyon of the Gunnison?",c:"The Gunnison River cutting through ancient Precambrian rock over 2 million years",w:["Volcanic eruptions","Glacial carving during the Ice Age","Earthquake faults collapsing"],e:"The canyon is one of the steepest and narrowest in North America, with walls of 1.7 billion-year-old metamorphic rock."},
  {q:"What is the Durango & Silverton Narrow Gauge Railroad?",c:"A historic steam train that runs through the San Juan Mountains",w:["A model railroad museum in Denver","A mountain road used for mining","Colorado's first commuter rail line"],e:"Built in 1882 for mining, it's now a National Historic Landmark carrying tourists through spectacular mountain scenery."},
  {q:"What major technology company has a large campus in Boulder, Colorado?",c:"Google",w:["Apple","Microsoft","Meta"],e:"Google opened its Boulder campus in 2018; Boulder also hosts many startups and the University of Colorado."},
  {q:"What does 'Colorado' mean in Spanish?",c:"Colored red (ruddy)",w:["High land","Rocky mountains","Clear water"],e:"Spanish explorers named the Colorado River for its reddish-brown color from dissolved minerals."},
  {q:"Which Colorado city is home to the U.S. Olympic and Paralympic Museum?",c:"Colorado Springs",w:["Denver","Colorado Springs","Pueblo"],e:"The museum opened in 2020 in Colorado Springs, which has been the hub of U.S. Olympic training since 1977."},
  {q:"What Colorado city is nicknamed 'The Noodle Capital of the World'?",c:"Greeley",w:["Pueblo","Trinidad","Alamosa"],e:"Greeley is actually known as a beef-processing center; the 'Noodle Capital' is a trick question."},
  {q:"What is the largest employer in Colorado?",c:"The U.S. federal government (military and civilian)",w:["Lockheed Martin","The University of Colorado","Walmart"],e:"Colorado hosts major military installations like Fort Carson, Buckley, and the Air Force Academy."},
  {q:"What is the primary source of water for the Colorado Front Range cities?",c:"Snowmelt from the Rocky Mountains",w:["The South Platte River aquifer","Underground springs","The Missouri River"],e:"Snowpack in the Rockies is the primary water source for Denver and other Front Range communities."},
  {q:"What Colorado town is at the highest elevation in the United States?",c:"Leadville",w:["Telluride","Creede","Silverton"],e:"Leadville sits at 10,152 feet, making it the highest incorporated city in the U.S."},
  {q:"Which professional sports teams are based in Denver?",c:"Broncos (NFL), Nuggets (NBA), Rockies (MLB), Avalanche (NHL)",w:["Broncos, Eagles, Buffs, Rockies","Broncos, Nuggets, Rams, Rapids","Broncos, Nuggets, Rockies, Avalanche, Rapids"],e:"The Rapids (MLS soccer) also call Colorado home."},
  {q:"What is the relationship between Highlands Ranch and Douglas County?",c:"Highlands Ranch is an unincorporated community in Douglas County",w:["Highlands Ranch is its own city","Highlands Ranch is in Arapahoe County","Highlands Ranch is a suburb of Colorado Springs"],e:"Though one of the most populous communities in Colorado, Highlands Ranch has no city government — it's governed by a metro district."},
  {q:"What is White River National Forest famous for?",c:"Containing the most ski resorts of any national forest in the U.S.",w:["Being the largest national forest in Colorado","Having the highest concentration of fourteeners","Containing the headwaters of the Colorado River"],e:"White River National Forest contains Aspen, Vail, Breckenridge, Keystone, and several other ski resorts."},
  {q:"What is the Front Range of Colorado?",c:"The easternmost part of the Rockies, where most of Colorado's population lives",w:["The western slope of the Rockies","Colorado's border with Kansas","The mountain peaks visible from Denver"],e:"Cities like Denver, Boulder, Fort Collins, and Colorado Springs are all on the Front Range."},
  {q:"What gold rush brought settlers to Colorado in 1859?",c:"Pike's Peak Gold Rush",w:["California Gold Rush","Klondike Gold Rush","Comstock Lode Rush"],e:"'Pike's Peak or Bust!' was the slogan. Gold was found near present-day Denver in 1858–1859."},
  {q:"What is the name of Colorado's largest lake?",c:"Blue Mesa Reservoir",w:["Grand Lake","Horsetooth Reservoir","Dillon Reservoir"],e:"Blue Mesa Reservoir on the Gunnison River is Colorado's largest body of water, created by a dam in 1966."},
  {q:"What Colorado university is known for its research and CU Buffaloes?",c:"University of Colorado Boulder",w:["Colorado State University","University of Denver","Colorado School of Mines"],e:"CU Boulder is the state's flagship research university; CSU Fort Collins is its top rival."},
  {q:"Where is the Denver Mint located and what does it produce?",c:"In downtown Denver; it produces coins for circulation",w:["In Colorado Springs; produces gold bars","In Aurora; produces currency for the West","In Englewood; produces military medals"],e:"The Denver Mint opened in 1863 and is one of the most productive mints in the world. Look for a 'D' on your coins!"},
  {q:"Which Colorado canyon is known as the 'Niagara of the West'?",c:"Royal Gorge",w:["Black Canyon of the Gunnison","Glenwood Canyon","Chasm Creek"],e:"Royal Gorge near Cañon City is 1,100 feet deep and features a famous suspension bridge."},
  {q:"What is Denver International Airport (DIA) known for architecturally?",c:"Its white tent-like peaked roof resembling the Rocky Mountains",w:["Its underground layout","Its circular terminal design","Its solar panel canopy"],e:"DIA's distinctive white tensile structure, made of fiberglass-coated fabric, is one of the most recognizable airports in the world."},
  {q:"What major pipeline or water project delivers water from the Colorado River's western slope to Denver?",c:"The Colorado-Big Thompson Project",w:["The Denver Aqueduct","The Rocky Mountain Water Tunnel","The Trans-Mountain Diversion"],e:"The C-BT project, completed in 1957, tunnels water through the Rockies to the Front Range."},
  {q:"What is the 16th Street Mall in Denver?",c:"A pedestrian and transit mall in downtown Denver lined with shops and restaurants",w:["A light rail line connecting Denver suburbs","A historic highway through Colorado","The main road through Red Rocks Amphitheatre"],e:"The 16th Street Mall stretches one mile through downtown Denver and has free shuttle buses."},
  {q:"Which Colorado resort town is famous for its Victorian architecture and silver mining history?",c:"Leadville",w:["Central City","Cripple Creek","Telluride"],e:"Leadville boomed during the 1880s silver rush; it's also where Horace Tabor made his fortune."},
  {q:"What river runs through the Glenwood Canyon in Colorado?",c:"Colorado River",w:["Roaring Fork River","Eagle River","Crystal River"],e:"Glenwood Canyon, carved by the Colorado River, is one of the most scenic stretches of I-70."},
  {q:"What is the name of the Colorado team in Major League Soccer?",c:"Colorado Rapids",w:["Colorado FC","Denver United","Mountain Lions SC"],e:"The Colorado Rapids play at Dick's Sporting Goods Park in Commerce City."},
  {q:"What mountain is visible from the Denver skyline and hosts a famous highway to its summit?",c:"Mount Evans (now known as Mount Blue Sky)",w:["Pikes Peak","Longs Peak","Mount Bierstadt"],e:"The Mount Evans Scenic Byway reaches 14,130 feet, making it the highest paved road in North America."},
  {q:"What is Colorado's state flower?",c:"Rocky Mountain Columbine",w:["Indian Paintbrush","Blue Iris","Pasque Flower"],e:"The blue-and-white columbine was designated Colorado's state flower in 1899."},
  {q:"In what part of Colorado is the San Juan Mountains region located?",c:"Southwestern Colorado",w:["Northwestern Colorado","North-central Colorado","Eastern Colorado"],e:"The San Juan Mountains include Telluride, Silverton, and Ouray — a rugged mining country."},
  {q:"Which Colorado city is home to the Broadmoor resort and has long been called a 'health resort city'?",c:"Colorado Springs",w:["Manitou Springs","Pueblo","Salida"],e:"Colorado Springs' clean mountain air attracted health seekers in the 19th century; The Broadmoor has operated since 1918."},
  {q:"What dinosaur species was first discovered and named after a Colorado location?",c:"Stegosaurus (discovered near Morrison, CO)",w:["T-rex","Brachiosaurus","Triceratops"],e:"Stegosaurus fossils were first found at Dinosaur Ridge near Morrison, Colorado in 1877."},
  {q:"What is the Colorado State Capitol building known for?",c:"Its gold-leafed dome, coated with Colorado gold",w:["Its historic murals by Diego Rivera","Being the oldest state capitol in the U.S.","Its location exactly on the Continental Divide"],e:"The dome is covered in 24-karat gold leaf — re-gilded in 1908 and again in 1980."},
  {q:"What is the meaning of the Ute Mountain Tribal Park?",c:"It protects Ancestral Puebloan ruins on Ute tribal land",w:["It preserves the Ute language","It is a bison hunting preserve","It is a wildlife sanctuary for mountain lions"],e:"The park is adjacent to Mesa Verde and contains cliff dwellings accessible only through Ute guides."},
  {q:"Which Colorado city is nicknamed 'Choice City'?",c:"Fort Collins",w:["Boulder","Greeley","Loveland"],e:"Fort Collins earned 'Choice City' from a 1996 publication ranking it as one of the best places to live."},
  {q:"What is the significance of Bent's Fort in Colorado history?",c:"It was a major trading post on the Santa Fe Trail in the 1830s–1840s",w:["It was the first military fort in Colorado","It was the site of Colorado's first gold discovery","It was the headquarters of the Pony Express"],e:"Bent's Old Fort near La Junta was reconstructed and is now a National Historic Site."},
  {q:"What annual event in Pueblo, Colorado celebrates the state's chili pepper heritage?",c:"Chile and Frijoles Festival",w:["Colorado Green Chili Cook-off","Pueblo Pepper Days","Rocky Mountain Chili Challenge"],e:"Pueblo is famous for its Pueblo chile peppers, a distinct variety milder than New Mexico chiles."},
  {q:"What Colorado city is home to the Celestial Seasonings tea company?",c:"Boulder",w:["Fort Collins","Golden","Longmont"],e:"Celestial Seasonings was founded in Boulder in 1969 and its factory there offers free tours."},
  {q:"Which mountain in Colorado was renamed from Mount Evans to Mount Blue Sky in 2023?",c:"Mount Blue Sky (formerly Mount Evans)",w:["Longs Peak","Pikes Peak","Mount Elbert"],e:"It was renamed following a review of the legacy of John Evans, Colorado's second territorial governor."},
  {q:"What Colorado city is home to the Coors Brewing Company?",c:"Golden",w:["Fort Collins","Denver","Loveland"],e:"Coors was founded in Golden in 1873 by Adolph Coors; the brewery is still there today."},
  {q:"What is the primary mineral mined in Colorado historically?",c:"Gold and silver",w:["Coal","Uranium","Molybdenum"],e:"Gold and silver strikes in the 1800s drove Colorado's population boom, though coal and uranium were also important."},
  {q:"What is the name of the park/open space system that gives Denver residents access to mountain parks?",c:"Denver Mountain Parks",w:["Jefferson County Open Space","Colorado Front Range Trail","Bear Creek Regional Park"],e:"Denver Mountain Parks, established in 1912, includes Red Rocks, Lookout Mountain, and Buffalo Bill's grave."},
  {q:"What is the Colorado River Compact?",c:"A 1922 agreement dividing Colorado River water among seven western states",w:["A treaty with Mexico about water rights","A law protecting Colorado's rivers from pollution","A dam-building plan from the 1930s"],e:"The Compact allocated water to upper and lower basin states, but it overestimated available water — causing ongoing disputes."},

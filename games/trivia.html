<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivia</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<script src="../online.js"></script>
<script src="../data/trivia-questions.js"></script>
<style>
/* Trivia's type: Baloo 2 Bold for questions and headings, Fredoka for the answers (both SIL OFL, in fonts/) */
@font-face{font-family:"Trivia Display";src:url("../fonts/baloo2-700.woff2") format("woff2");font-weight:100 900;font-display:swap;}
@font-face{font-family:"Fredoka";src:url("../fonts/fredoka-600.woff2") format("woff2");font-weight:100 900;font-display:swap;}
:root{--display:"Trivia Display","Lilita One",var(--font);}
.tile .t{font-family:"Fredoka",var(--font);font-weight:600;}

body{overflow-x:hidden;}
.tv{max-width:620px;margin:0 auto;padding:0 10px calc(var(--safe-b) + 16px);}
.tv .scores{margin-bottom:2px;}
.score .mult{display:inline-flex;align-items:center;gap:2px;padding:0 5px;border-radius:999px;background:var(--orange);color:#2b1300;font-size:.7rem;font-weight:900;vertical-align:2px;}
.score .mult .ico{width:11px;height:11px;}
.hud{display:flex;justify-content:center;gap:8px;margin:0 0 8px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;background:var(--w07);font-weight:800;font-size:.86rem;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.pill .ico{width:15px;height:15px;color:var(--text-3);}
.pill b{color:var(--text);font-weight:900;}
.pill.hot{background:color-mix(in srgb,var(--orange) 24%,transparent);color:var(--orange);}
.pill.hot .ico{color:var(--orange);}

/* ── TV studio stage ─────────────────────────────────────────────────── */
.stage{position:relative;border-radius:22px;padding:16px 12px 14px;overflow:hidden;isolation:isolate;--text:#fbf8ff;--text-2:#c9c1e6;--text-3:#8f86b3;--yellow:#ffc83d;--w04:rgba(255,255,255,.04);--w05:rgba(255,255,255,.05);--w06:rgba(255,255,255,.06);--w07:rgba(255,255,255,.07);--w08:rgba(255,255,255,.08);--w1:rgba(255,255,255,.1);--w12:rgba(255,255,255,.12);--w14:rgba(255,255,255,.14);--w18:rgba(255,255,255,.18);--w2:rgba(255,255,255,.2);color:#fbf8ff;
  background:
    radial-gradient(60% 35% at 15% 0%, rgba(255,170,60,.22), transparent 70%),
    radial-gradient(60% 35% at 85% 0%, rgba(90,150,255,.26), transparent 70%),
    radial-gradient(90% 50% at 50% 108%, rgba(120,80,255,.28), transparent 70%),
    linear-gradient(180deg,#141a3e 0%,#0a0d24 70%,#0e1230 100%);
  box-shadow:inset 0 0 0 2px rgba(255,196,80,.38), inset 0 0 40px rgba(0,0,0,.6), 0 16px 34px rgba(0,0,0,.5);
  transition:box-shadow .25s;}
/* Marquee bulbs: a clipped strip whose bulb row slides sideways (transform only,
   so no repaint every frame) */
.stage>.bulbs{position:absolute;left:14px;right:14px;top:5px;height:6px;z-index:-1;overflow:hidden;pointer-events:none;}
.stage>.bulbs::before{content:"";position:absolute;top:0;bottom:0;left:-12px;right:-12px;
  background:radial-gradient(circle,#ffe39a 0 1.6px,rgba(255,200,80,.35) 2.4px,transparent 3.2px) 0 50%/12px 6px repeat-x;
  animation:bulbs 1.2s steps(2) infinite;}
@keyframes bulbs{50%{transform:translateX(6px);}}
.stage::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:conic-gradient(from 168deg at 18% -8%, transparent 0deg, rgba(255,220,150,.06) 10deg, transparent 22deg),
    conic-gradient(from 172deg at 82% -8%, transparent 0deg, rgba(160,200,255,.07) 12deg, transparent 24deg);}
.stage.flash-ok{animation:flashok .9s ease-out;}
@keyframes flashok{0%,40%{box-shadow:inset 0 0 0 3px #3ddc84, inset 0 0 60px rgba(61,220,132,.45), 0 0 40px rgba(61,220,132,.5);}100%{}}
.stage.flash-bad{animation:flashbad .7s ease-out;}
@keyframes flashbad{0%,40%{box-shadow:inset 0 0 0 3px #ff4d5e, inset 0 0 60px rgba(255,77,94,.4);}100%{}}

.marq{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;margin-bottom:8px;}
.marq .who{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--display);font-size:1.15rem;color:#fff;letter-spacing:.01em;}
.marq .who i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent);flex:none;}
.marq .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.marq .qn{font-family:var(--display);font-size:.95rem;letter-spacing:.06em;color:#ffdf8a;text-transform:uppercase;text-shadow:0 0 12px rgba(255,200,80,.45);white-space:nowrap;}

/* Countdown ring */
.ring{position:relative;width:46px;height:46px;flex:none;}
.ring svg{width:46px;height:46px;transform:rotate(-90deg);}
.ring .bg{fill:rgba(0,0,0,.35);stroke:rgba(255,255,255,.12);stroke-width:4;}
.ring .fg{fill:none;stroke:#ffd447;stroke-width:4;stroke-linecap:round;transition:stroke .3s;}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:1.25rem;color:#fff;font-variant-numeric:tabular-nums;}
.ring.low .fg{stroke:#ff4d5e;}
.ring.low{animation:throb 1s ease-in-out infinite;}
@keyframes throb{50%{transform:scale(1.12);}}
.ring.off{opacity:.0;}

/* Question card */
.qwrap{perspective:900px;}
.qcard{position:relative;border-radius:16px;padding:12px 16px 16px;color:#1d1b2e;min-height:100px;
  background:linear-gradient(180deg,#fffdf6,#f1ead6);box-shadow:0 2px 0 rgba(255,255,255,.7) inset,0 10px 24px rgba(0,0,0,.45);
  transform-origin:50% 0;}
.qcard.in{animation:cardin .6s var(--spring) both;}
@keyframes cardin{0%{transform:rotateX(-95deg);opacity:0;}40%{opacity:1;}100%{transform:none;}}
.qcard .cat{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.qcard .cat span{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--cc,#f59e0b);color:#fff;
  font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;}
.qcard .lv{display:flex;gap:3px;}
.qcard .lv i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.14);}
.qcard .lv i.on{background:var(--cc,#f59e0b);}
.qcard .q{font-family:var(--display);font-weight:400;font-size:clamp(1.25rem,5.4vw,1.6rem);line-height:1.18;letter-spacing:.005em;}
.qcard .q.long{font-size:clamp(1.1rem,4.6vw,1.38rem);}
/* Category card: spins through the categories, lands on this question's (its icon and colour), then the question */
.reel{position:relative;height:100px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:14px;overflow:hidden;--cc:#f59e0b;
  background:radial-gradient(120% 150% at 50% -10%, color-mix(in srgb,var(--cc) 75%,#fff 10%), color-mix(in srgb,var(--cc) 45%,#0a0d24) 70%);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--cc) 60%,#fff), inset 0 -10px 24px rgba(0,0,0,.25), 0 0 28px color-mix(in srgb,var(--cc) 40%,transparent);}
.reel .rk{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:.62rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.78);}
.reel .ri{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--cc);box-shadow:0 4px 0 rgba(0,0,0,.22),0 0 0 4px rgba(255,255,255,.22);}
.reel .ri .ico{width:30px;height:30px;stroke-width:2.4;}
.reel .rn{font-family:var(--display);font-size:2rem;line-height:1;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.28);white-space:nowrap;}
.reel.spin .ri,.reel.spin .rn{animation:rslot .09s linear infinite;}
@keyframes rslot{0%{transform:translateY(-5px);filter:blur(.6px);}100%{transform:translateY(5px);filter:blur(.6px);}}
.reel.land{animation:land .55s var(--spring);}
.reel.land .ri{animation:ripop .6s var(--spring);}
.reel.land::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine .7s .1s ease-out forwards;}
@keyframes land{0%{transform:scale(1.12);}100%{transform:none;}}
@keyframes ripop{0%{transform:scale(.5) rotate(-30deg);}100%{transform:none;}}
@keyframes shine{to{left:120%;}}

/* Answer plates */
.answers{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.ans{--edge:linear-gradient(180deg,#ffe6a0,#c99018);--face:linear-gradient(180deg,#26306b 0%,#151b47 55%,#0f1438 100%);
  position:relative;display:flex;align-items:center;gap:10px;min-height:52px;width:100%;padding:8px 22px 8px 14px;border:0;background:var(--edge);color:#fff;text-align:left;
  font-weight:800;font-size:1rem;line-height:1.2;
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);
  transition:transform .12s, opacity .35s, max-height .45s var(--ease), min-height .45s var(--ease), padding .45s, margin .45s;max-height:160px;
  -webkit-tap-highlight-color:transparent;}
.ans::before{content:"";position:absolute;inset:2px;z-index:0;background:var(--face);
  clip-path:polygon(15px 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,15px 100%,0 50%);}
.ans > *{position:relative;z-index:1;}
.ans .k{flex:none;width:28px;height:28px;display:grid;place-items:center;margin-left:4px;font-family:var(--display);font-weight:400;font-size:1rem;color:#ffd76a;}
.ans .k::before{content:"";position:absolute;inset:3px;transform:rotate(45deg);border:2px solid #d9a63a;border-radius:3px;z-index:-1;}
.ans .t{flex:1;min-width:0;}
.ans.enter{animation:ansin .45s var(--spring) both;}
@keyframes ansin{from{transform:translateX(var(--fx,-40px));opacity:0;}to{transform:none;opacity:1;}}
.ans:active:not(:disabled){transform:scale(.98);}
@media (hover:hover){.ans:not(:disabled):hover::before{background:linear-gradient(180deg,#334093,#1c2460);}}
.ans:disabled{cursor:default;}
.ans.pick{--face:linear-gradient(180deg,#ffb53b,#e68a00);color:#2b1600;}
.ans.pick .k{color:#2b1600;}.ans.pick .k::before{border-color:#2b1600;}
.ans.pick{animation:lock .6s ease-in-out infinite alternate;}
@keyframes lock{to{filter:brightness(1.25);}}
.ans.right{--edge:linear-gradient(180deg,#d9ffe9,#1fae5e);--face:linear-gradient(180deg,#3ddc84,#16934d);color:#03290f;animation:blink .25s steps(2) 4;}
.ans.right .k{color:#03290f;}.ans.right .k::before{border-color:#03290f;}
@keyframes blink{50%{filter:brightness(1.5);}}
.ans.wrong{--edge:linear-gradient(180deg,#ffc2c8,#b0202e);--face:linear-gradient(180deg,#ff5a68,#b51f2d);color:#fff;animation:shake .4s;}
.ans.wrong .k{color:#fff;}.ans.wrong .k::before{border-color:#fff;}
@keyframes shake{20%{transform:translateX(-7px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
.ans.out{opacity:.28;}
.ans.gone{opacity:0;max-height:0;min-height:0;padding-top:0;padding-bottom:0;margin-top:-8px;pointer-events:none;}
.ans .who{flex:none;font-size:.72rem;font-weight:900;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.25);}

/* Result */
.res{margin-top:12px;text-align:center;animation:pop .45s var(--spring) both;}
@keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:none;opacity:1;}}
.res h2{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.4);}
.res h2.ok{color:#5df29a;}.res h2.no{color:#ff8f8f;}
.res .math{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:8px;}
.res .math span{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:.8rem;font-weight:800;color:var(--text-2);}
.res .math span.x{background:var(--orange);color:#2b1300;}
.res .math span.tot{background:#ffd447;color:#2b1a00;}
.res .math .ico{width:13px;height:13px;}
.res p{margin:10px 4px 0;color:#d8d2f0;font-size:.95rem;line-height:1.4;text-align:left;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;}
.next{margin-top:12px;}

/* Pass screen */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px 6px 8px;}
.spot{position:relative;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 35%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 55%, color-mix(in srgb,var(--c) 60%,#000));
  font-family:var(--display);font-size:3rem;color:#1a1033;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 60px color-mix(in srgb,var(--c) 55%,transparent);animation:pop .5s var(--spring) both;}
.cover h2{font-family:var(--display);font-weight:400;font-size:2.2rem;line-height:1.05;color:#fff;}
.cover p{color:var(--text-2);max-width:320px;}
.cover .btn{min-width:240px;margin-top:6px;}
.cover .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}

/* Buzzers */
.buzzers{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:10px;margin-top:12px;}
.buzz{position:relative;height:58px;border:0;border-radius:999px;color:#1a1033;font-family:var(--display);font-size:1.15rem;
  background:radial-gradient(120% 90% at 50% 20%, color-mix(in srgb,var(--c) 55%,#fff) 0%, var(--c) 45%, color-mix(in srgb,var(--c) 55%,#000) 100%);
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#000),0 10px 18px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.5);
  transition:transform .06s, box-shadow .06s, opacity .3s, filter .3s;-webkit-tap-highlight-color:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 14px;}
.buzz:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 45%,#000),0 4px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.5);}
.buzz:disabled{filter:grayscale(1) brightness(.55);}
.buzz.lit{animation:lit .5s ease-in-out infinite alternate;filter:none;}
@keyframes lit{to{box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 30px var(--c),inset 0 2px 0 rgba(255,255,255,.5);}}
.buzz .ico{position:absolute;right:12px;top:50%;width:20px;height:20px;margin-top:-10px;}
.buzzhint{text-align:center;color:var(--text-3);font-size:.85rem;margin-top:8px;}
.buzzbar{margin-top:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;}
.buzzbar i{display:block;height:100%;background:var(--c,#ffd447);transform-origin:left;}

/* Podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-top:14px;}
.pod{display:flex;flex-direction:column;align-items:center;width:31%;max-width:150px;}
.pod .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#1a1033;font-family:var(--display);font-size:1.6rem;
  box-shadow:0 0 0 4px rgba(255,255,255,.12);opacity:0;animation:pop .5s var(--spring) forwards;animation-delay:var(--d2);}
.pod .nm{margin-top:6px;font-weight:900;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0;animation:pop .4s forwards;animation-delay:var(--d2);}
.pod .sc{font-family:var(--display);color:#ffd76a;font-size:1.1rem;opacity:0;animation:pop .4s forwards;animation-delay:var(--d2);}
.pod .step{width:100%;margin-top:6px;border-radius:10px 10px 0 0;display:grid;place-items:start center;padding-top:8px;font-family:var(--display);font-size:2rem;color:rgba(255,255,255,.9);
  background:linear-gradient(180deg,#3a4597,#1d2458);box-shadow:inset 0 3px 0 rgba(255,255,255,.25);height:var(--h);transform-origin:bottom;animation:rise .8s var(--spring) both;animation-delay:var(--d);}
.pod.p1 .step{background:linear-gradient(180deg,#ffe27a,#d99a12);color:#5a3a00;}
.pod.p1 .av{width:66px;height:66px;font-size:2rem;box-shadow:0 0 0 4px #ffd447,0 0 30px rgba(255,212,71,.7);}
@keyframes rise{from{transform:scaleY(0);}}
.restlist{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.restlist div{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:800;}
.restlist b{margin-left:auto;color:#ffd76a;}
.solo-final{text-align:center;padding:16px 0 6px;}
.solo-final .big{font-family:var(--display);font-size:3.4rem;line-height:1;color:#ffd447;text-shadow:0 0 24px rgba(255,200,60,.5);}
.solo-final p{color:var(--text-2);margin-top:6px;}
.endacts{display:flex;flex-direction:column;gap:8px;margin-top:12px;}

/* Setup extras + level picker */
.cats{display:flex;flex-wrap:wrap;gap:6px;}
.cats .chip.on{background:var(--accent);color:var(--accent-ink);}
.lvl{display:flex;flex-direction:column;gap:10px;padding-top:4px;}
.lvl h2{font-family:var(--display);font-weight:400;font-size:1.8rem;}
.lvl .row{gap:10px;}
.lvl .seg{flex:1;}
.lvl .nm{width:92px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@media (min-width:560px){
  .answers{display:grid;grid-template-columns:1fr 1fr;}
  .ans.gone{display:none;}
}
/* Tablet portrait: a bigger stage, question and answer plates */
@media (min-width:700px) and (min-height:900px){
  .tv{max-width:700px;}
  .tv .stage{max-width:none;margin:0;padding:22px 18px 20px;}
  .marq{min-height:56px;margin-bottom:12px;}
  .qcard{min-height:170px;padding:16px 22px 22px;}
  .qcard .q{font-size:2.15rem;}
  .qcard .q.long{font-size:1.8rem;}
  .reel{height:170px;}
  .answers{gap:12px;margin-top:18px;}
  .ans{min-height:84px;max-height:240px;font-size:1.15rem;padding:10px 26px 10px 18px;}
  .ans .k{width:34px;height:34px;font-size:1.2rem;}
  .res h2{font-size:2.7rem;}
  .res p{font-size:1.08rem;padding:14px 16px;}
  .spot{width:140px;height:140px;}
  .buzz{height:72px;font-size:1.35rem;}
}

/* Setup: category chips carry their icon and colour */
.cats .chip .ci{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:-3px;color:var(--cc);}
.cats .chip .ci .ico{width:16px;height:16px;}
.cats .chip.on .ci{color:inherit;}
.qcard .cat span .ico{width:13px;height:13px;margin-right:5px;}

/* ── Countdown (solo and online) ─────────────────────────────────────── */
.tv.cdm{max-width:680px;}
.cdm .stage{max-width:none;}
.cdm .hud{flex-wrap:nowrap;gap:6px;}
.cdm .hud .pill{flex:none;padding:0 10px;gap:4px;font-size:.82rem;}
@media (max-width:440px){.cdm .hud .pill{padding:0 8px;font-size:.78rem;}.cdm .hud .pill .ico{width:13px;height:13px;}.cdm .hud .pill.q .ico,.cdm .hud .pill.rk .ico{display:none;}}
.cdm .hud .pill.sc b{min-width:3ch;text-align:right;}
.cdm .hud .pill.sc.bump{animation:bump .45s var(--spring);}
@keyframes bump{40%{transform:scale(1.18);}}
.cchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 6px;border-radius:999px;background:var(--cc);color:#fff;font-weight:900;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 0 18px color-mix(in srgb,var(--cc) 45%,transparent);max-width:100%;overflow:hidden;white-space:nowrap;}
.cchip i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--cc);flex:none;}
.cchip i .ico{width:14px;height:14px;stroke-width:2.6;}
.cchip.hide{visibility:hidden;}
.lvd{display:flex;gap:4px;}.lvd i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16);}.lvd i.on{background:#ffd76a;box-shadow:0 0 6px rgba(255,215,106,.6);}
.cdm .marq{min-height:38px;}
.cdm .qcard{min-height:96px;padding-bottom:20px;}
.cdm .qcard.in{animation:cardin .55s var(--spring) both;}
.rbar{position:absolute;left:16px;right:16px;bottom:8px;height:4px;border-radius:2px;background:rgba(40,30,10,.1);overflow:hidden;}
.rbar i{position:absolute;inset:0;background:color-mix(in srgb,var(--cc,#f59e0b) 70%,#fff);transform-origin:left;transform:scaleX(0);border-radius:2px;}
.rbar.done{opacity:0;transition:opacity .4s;}

    hl.sort(function (a, b) { return b.w - a.w; });

    var mode = (solo ? 'Countdown' : 'Online countdown') + ' · ' + (LEVELS[VW.cfg.lv] || '') + ' · ' + catLabel(okCats(cats)).replace('Random categories', 'All categories') + ' · ' + m.of + ' questions';
    var room = log.length > 15 ? 90 : 140, cn = {}, cc = {};
    var qs = log.map(function (l) {
      cn[l.cat] = CAT_NAME[l.cat] || l.cn || l.cat; cc[l.cat] = CAT_COLOR[l.cat] || l.cc || '';
      var o = { q: cut(l.q, room), a: cut(l.a, room > 90 ? 80 : 40), k: l.cat, pp: P.map(function (p) { var r = l.r[p.pid]; return !r ? '-' : r[0] < 0 ? 'x' : String(r[2] + r[3]); }).join(',') };
      var r = meP && l.r[meP.pid];
      if (r && r[0] >= 0) { o.t = Math.round(r[1] / 100) / 10; if (r[0] !== l.k && l.o) o.w = cut(l.o[r[0]], 40); }
      return o;
    });
    while (qs.length > 1 && JSON.stringify(qs).length > 5000) qs.pop();
    var top = n > 1 && P[0].score === P[1].score ? null : P[0].name;
    return Kit.record(KEY, {
      started: E && E.started || VW.started, mode: mode,
      players: P.map(function (p) { return { name: p.name, score: p.score }; }),
      winner: n > 1 ? top : (meP && meP.right ? meP.name : null),
      summary: solo && meP ? meP.name + ': ' + meP.right + '/' + m.of + ' right · ' + fmtN(meP.score) + ' pts' : undefined,
      badge: solo && meP ? fmtN(meP.score) : '',
      rounds: { labels: log.map(function (l, k) { return 'Q' + (k + 1); }), scores: log.map(function (l) { return P.map(function (p) { var r = l.r[p.pid]; return r ? r[2] + r[3] : 0; }); }) },
      highlights: hl.slice(0, 6).map(function (h) { return h.t; }),
      meta: { right: P.map(function (p) { return p.right; }), asked: P.map(function () { return m.of; }), cats: cats, levels: [VW.cfg.lv], cd: 1 },
      detail: { cd: 1, qs: qs, n: log.length, cn: cn, cc: cc, me: meP ? P.indexOf(meP) : -1, an: CD.ans / 1000 }
    });
  }

  // ── Little motion helpers ──
  function fly(text, from, to, cls, dur, done) {
    if (!from || !to || !from.isConnected || !to.isConnected) { if (done) done(); return; }
    var a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    var f = el('div', { class: 'fly' + (cls ? ' ' + cls : ''), text: text }); document.body.appendChild(f);
    var w = f.offsetWidth, h = f.offsetHeight;
    var x0 = a.left + a.width / 2 - w / 2, y0 = a.top + a.height / 2 - h / 2, x1 = b.left + b.width / 2 - w / 2, y1 = b.top + b.height / 2 - h / 2;
    if (!f.animate) { f.remove(); if (done) done(); return; }
    var an = f.animate([
      { transform: 'translate(' + x0 + 'px,' + y0 + 'px) scale(1)', opacity: 1 },
      { transform: 'translate(' + ((x0 + x1) / 2) + 'px,' + (Math.min(y0, y1) - 30) + 'px) scale(1.15)', opacity: 1, offset: 0.45 },
      { transform: 'translate(' + x1 + 'px,' + y1 + 'px) scale(.7)', opacity: 0.35 }
    ], { duration: dur || 600, easing: 'cubic-bezier(.3,.7,.3,1)' });
    an.onfinish = function () { f.remove(); if (done) done(); };
  }
  function countUp(node, from, to, ms, fmt) {
    var t0 = performance.now();
    (function f() {
      if (!node.isConnected) return;
      var p = Math.min(1, (performance.now() - t0) / ms), v = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
      node.textContent = fmt ? fmt(v) : fmtN(v);
      if (p < 1) requestAnimationFrame(f);
    })();
  }
  document.addEventListener('keydown', function (e) {
    if (!VW || !VW.q || VW.ended || e.metaKey || e.ctrlKey || document.querySelector('.k-scrim,.k-win,.ahi-overlay')) return;
    var k = 'abcd'.indexOf(e.key.toLowerCase()); if (k < 0) k = '1234'.indexOf(e.key);
    if (k >= 0) { vPick(k); return; }
    if (e.key === 'Enter' || e.key === ' ') { if (VW.rv && VW.nextBtn && VW.nextBtn.isConnected) VW.nextBtn.click(); else vLock(); e.preventDefault(); }
  });

  // ═════════════════════════════════════════════════════════════════════════
  // Online: the host's device runs the engine; every device answers on its own screen
  // ═════════════════════════════════════════════════════════════════════════
  var net = { mode: null, table: null, peer: null, roster: [], pidN: 1, myPid: 1, lobby: null, wait: null, hostName: '', me: '' };
  function netCfg() {
    var s = lsGetJ(NETKEY) || {};
    var nm = s.name || (function () { try { return (localStorage.getItem('my_name') || '').trim(); } catch (e) { return ''; } })();
    return { name: nm, level: LEVELS[s.level] && s.level !== 'mixed' ? s.level : 'medium', count: [10, 15, 20].indexOf(+s.count) >= 0 ? +s.count : 10, cats: savedCats() };
  }
  function tableInfo() { var c = netCfg(); return 'Countdown · ' + LV_SHORT[c.level] + ' · ' + c.count + ' questions'; }
  function goLobby() {
    leaveOnline(false); cdStop(true); stopTimer(); S = null; VW = null; E = null;
    app.innerHTML = ''; app.className = 'tv';
    if (!window.Online) { Kit.toast('Online play isn’t available'); showSetup(); return; }
    var cf = netCfg();
    net.lobby = Online.lobby(app, {
      game: 'trivia', title: 'Trivia Online', max: 24,
      intro: 'Countdown trivia for 2 to 24 players, each on their own phone or tablet. Same question, same clock.',
      me: { name: cf.name },
      onName: function (n) { var m = lsGetJ(NETKEY) || {}; m.name = n; lsSetJ(NETKEY, m); },
      onHost: function (me) { return hostTable(me.name); },
      onJoin: function (code, room, me) { return joinTable(code, me.name); },
      onSolo: function () { closeLobby(); showSetup(); }, solo: 'Play on this device instead',
      sub: function (r) { return [r.status === 'playing' ? 'Playing now, join in' : r.info, (r.n || 1) + ((r.n || 1) === 1 ? ' player' : ' players')].filter(Boolean).join(' · '); },
      note: 'Your table plays the level, length and categories picked on your setup screen. Each device connects straight to the host’s; if one can’t connect, try them on the same Wi-Fi.'
    });
    window.scrollTo(0, 0);
  }
  function closeLobby() { if (net.lobby) { net.lobby.close(); net.lobby = null; } }
  function busyScreen(text) { app.innerHTML = ''; app.className = 'tv'; app.appendChild(el('div', { class: 'ol' }, [el('div', { class: 'ol-row' }, [el('i', { class: 'ol-spin' }), el('div', { class: 'grow' }, [el('b', { text: text })])])])); }
  function uniqueName(n, dev) { var base = n || 'Player', k = 2, out = base; while (net.roster.some(function (r) { return r.dev !== dev && r.name.toLowerCase() === out.toLowerCase(); })) out = base + ' ' + k++; return out; }
  function sendRoster() {
    var ro = roList();
    if (net.table) net.table.broadcast({ t: 'ro', ro: ro }, true);
    if (net.wait) net.wait.update(waitPlayers(ro, net.myPid));
    if (VW && !VW.solo) vMsg({ t: 'ro', ro: ro }, 0);
  }
  function waitPlayers(ro, me) { return ro.filter(function (r) { return !r.gone; }).map(function (r) { return { name: r.name, host: !!r.host, me: r.pid === me, color: pcol(r.pid) }; }); }
  function hostTable(name) {
    closeLobby(); busyScreen('Opening your table…');
    return Online.host({ game: 'trivia', name: name, max: 24, info: tableInfo() }).then(function (table) {
      table.on('fail', function (e) { Kit.toast('Couldn’t open a table. ' + Online.errText(e)); leaveOnline(false); goLobby(); });
      net.mode = 'host'; net.table = table; net.me = name; net.pidN = 1; net.myPid = 1; net.hostName = name;
      net.roster = [{ pid: 1, name: name, dev: Online.dev(), host: true }];
      table.on('peer', function (peer) {
        var r = net.roster.filter(function (x) { return x.dev === peer.id; })[0];
        if (r) { r.peer = peer; r.gone = false; }
        else { r = { pid: ++net.pidN, name: uniqueName(peer.name, peer.id), dev: peer.id, peer: peer }; net.roster.push(r); }
        peer.send({ t: 'hi', you: r.pid }, true);
        var live = E && !E.solo && E.phase !== 'over';
        if (live) { var ep = E.players.filter(function (p) { return p.pid === r.pid; })[0]; if (ep) ep.gone = false; else { E.players.push({ pid: r.pid, name: r.name, gone: false }); eInit(r.pid); } }
        sendRoster();
        if (live) peer.send(stMsg(), true);
        Kit.toast(r.name + ' joined'); snd('join');
      });
      table.on('leave', function (peer) {
        var r = net.roster.filter(function (x) { return x.peer === peer; })[0]; if (!r) return;
        r.peer = null;
        if (E && !E.solo && E.phase !== 'over') { r.gone = true; E.players.forEach(function (p) { if (p.pid === r.pid) p.gone = true; }); }
        else net.roster = net.roster.filter(function (x) { return x !== r; });
        sendRoster(); Kit.toast(r.name + ' left');
        eTick();
      });
      table.on('msg', function (peer, m) {
        var r = net.roster.filter(function (x) { return x.peer === peer; })[0];
        if (!r || !E || E.solo || E.phase !== 'q' || m.n !== E.n) return;
        if (m.t === 'pk') ePick(r.pid, m.k | 0, +m.e, peer.rtt || 0);
        else if (m.t === 'lk') eLock(r.pid);
      });
      showWait();
    }).catch(function (e) { Kit.toast('Couldn’t open a table. ' + Online.errText(e)); goLobby(); });
  }
  function showWait() {
    cdStop(); closeLobby(); app.className = 'tv';
    var cf = netCfg();
    if (net.mode === 'host') {
      net.table.setStatus('open', tableInfo());
      net.wait = Online.waitRoom(app, { code: net.table.code, host: true, max: 24, players: waitPlayers(roList(), net.myPid), onStart: hostStart, onLeave: function () { leaveOnline(false); goLobby(); },
        note: 'Countdown · ' + LEVELS[cf.level] + ' · ' + cf.count + ' questions · ' + catLabel(cf.cats) + '. Everyone answers on their own screen: the faster you pick the right answer, the more points you get. Others can join while you play.' });
    } else {
      net.wait = Online.waitRoom(app, { code: null, host: false, hostName: net.hostName, max: 24, players: waitPlayers(net.roster, net.myPid), onLeave: function () { leaveOnline(false); goLobby(); },
        note: 'Everyone answers on their own screen. The faster you pick the right answer, the more points you get.' });
    }
    window.scrollTo(0, 0);
  }
  function hostStart() {
    var act = net.roster.filter(function (r) { return !r.gone; });
    if (act.length < 2) { Kit.toast('Wait for at least one more player'); return Promise.resolve(); }
    net.wait = null;
    var cf = netCfg();
    startCdGame({ level: cf.level, count: cf.count, cats: cf.cats }, act.map(function (r) { return { pid: r.pid, name: r.name }; }), false);
    return Promise.resolve();
  }
  function joinTable(code, name) {
    closeLobby(); busyScreen('Connecting to the table…');
    return Online.join(code, { game: 'trivia', name: name }).then(function (peer) {
      net.mode = 'guest'; net.peer = peer; net.hostName = peer.name; net.me = name; net.roster = []; net.myPid = null;
      peer.on('msg', guestMsg);
      peer.on('close', function (why) {
        if (net.peer !== peer) return;
        var playing = VW && !VW.solo && !VW.ended;
        net.peer = null; net.mode = null; net.wait = null;
        if (VW && !VW.solo && !VW.ended) { cdStop(); VW = null; }
        var msg = (net.hostName || 'The host') + (why === 'host' || why === 'left' ? ' closed the table.' : '’s connection was lost.');
        if (playing) Kit.sheet({ title: 'The game ended', html: '<p class="muted">' + esc(msg) + '</p>', actions: [{ label: 'OK', primary: true, onClick: goLobby }], onCancel: goLobby });
        else if (VW && VW.ended) Kit.toast(msg);
        else { Kit.toast(msg); goLobby(); }
      });
      showWait();
    }).catch(function (e) {
      var msg = e && e.nat ? e.message : Online.errText(e);
      if (e && e.nat) Kit.sheet({ title: 'Couldn’t connect', html: '<p>' + esc(msg) + '</p>' }); else Kit.toast(msg);
      goLobby();
    });
  }
  function guestMsg(m) {
    var lag = net.peer ? (net.peer.rtt || 0) / 2 : 0;
    if (m.t === 'hi') { net.myPid = m.you; if (VW && !VW.solo) VW.me = m.you; return; }
    if (m.t === 'ro') { net.roster = m.ro; if (net.wait) net.wait.update(waitPlayers(m.ro, net.myPid)); vMsg(m, lag); return; }
    if (m.t === 'go' || m.t === 'st' || (m.t === 'q' && (!VW || VW.ended))) {
      if (m.t !== 'q' || !VW || VW.ended) {
        net.wait = null;
        Array.prototype.forEach.call(document.querySelectorAll('.k-win'), function (n) { n.remove(); });
        vNew(net.myPid, false); VW.ro = net.roster; VW.cfg = { lv: m.lv, cats: m.pl, of: m.of };
      }
      if (m.t === 'go') return;
    }
    vMsg(m, lag);
  }
  function backToTable() {
    Array.prototype.forEach.call(document.querySelectorAll('.k-win'), function (n) { n.remove(); });
    if (net.mode === 'host' && net.table && !net.table.closed) {
      E = null; VW = null; clearInterval(eTimer); clearTimeout(eNextT);
      net.roster = net.roster.filter(function (r) { return !r.gone; });
      showWait(); sendRoster(); return;
    }
    if (net.mode === 'guest' && net.peer && !net.peer.closed) { VW = null; showWait(); return; }
    leaveOnline(false); goLobby();
  }
  function leaveOnline(ask) {
    if (!net.mode) { closeLobby(); return; }
    if (ask) {
      Kit.confirm('Leave the online game?', { ok: 'Leave', body: net.mode === 'host' ? 'The game ends for everyone at your table.' : 'You can join again from the list.' }).then(function (ok) { if (ok) { leaveOnline(false); goLobby(); } });
      return;
    }
    if (net.table) net.table.close();
    if (net.peer) { var p = net.peer; net.peer = null; p.close('left'); }
    net.mode = null; net.table = null; net.wait = null; net.roster = []; net.myPid = 1;
    if (E && !E.solo) { E = null; clearInterval(eTimer); clearTimeout(eNextT); }
    if (VW && !VW.solo) { cdStop(); VW = null; }
    closeLobby();
  }
  window.addEventListener('pagehide', function () { if (net.mode) leaveOnline(false); });

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = lsGetJ(SAVE), cdSaved = lsGetJ(CDSAVE);
  if (/[?&]online=1/.test(location.search)) goLobby();
  else if (cdSaved && cdSaved.E && cdSaved.E.phase !== 'over' && cdSaved.E.cfg && cdSaved.E.players) cdResume(cdSaved);
  else if (saved && saved.players && saved.phase && saved.phase !== 'over' && (saved.phase === 'levels' || (saved.cur && BY_ID[saved.cur.id]))) {
    S = saved;
    S.cats = okCats(S.cats);
    if (S.cur && S.phase === 'q' && S.cur.buzz >= 0) S.cur.buzz = -1;   // a half-finished buzz starts over
    if (S.phase === 'q' && S.mode === 'pass' && N() > 1) S.phase = 'cover';  // hand it back to the same player
    render();
  } else showSetup();
  // test hooks (automated checks)
  window.__tv = { state: function () { return S; }, byId: BY_ID, bank: BANK, cats: CATS, cd: CD, ptsAt: ptsAt, eng: function () { return E; }, view: function () { return VW; }, net: net,
    lobby: function () { goLobby(); }, host: function (n) { return hostTable(n || 'Tim'); }, join: function (c, n) { return joinTable(c, n || 'Sam'); }, start: function () { return hostStart(); },
    pick: function (k) { vPick(k); }, lock: function () { vLock(); }, next: function () { eNext(); } };
})();
// Answers never break mid-word: a long word ("Massachusetts") shrinks its tile's text to fit instead
(function () {
  function fit(t) {
    t.style.fontSize = ''; var fs = parseFloat(getComputedStyle(t).fontSize) || 16, n = 0;
    function over() { var lh = parseFloat(getComputedStyle(t).lineHeight) || fs * 1.2; return t.scrollWidth > t.clientWidth + 1 || t.scrollHeight > lh * 2.2; }
    while (over() && fs > 12 && n++ < 16) { fs -= 1; t.style.fontSize = fs + 'px'; }
    if (t.scrollWidth > t.clientWidth + 1) t.style.overflowWrap = 'anywhere';
  }
  // all four answers end up the same size (a lone smaller tile would point at the long answer)
  function all() {
    document.querySelectorAll('.tiles').forEach(function (g) {
      var ts = [].slice.call(g.querySelectorAll('.tile .t')); if (!ts.length) return;
      ts.forEach(fit);
      var min = Math.min.apply(null, ts.map(function (t) { return parseFloat(getComputedStyle(t).fontSize) || 16; }));
      ts.forEach(function (t) { if ((parseFloat(t.style.fontSize) || 99) > min || !t.style.fontSize) t.style.fontSize = min + 'px'; });
    });
  }
  var q = 0; function soon() { if (q) return; q = requestAnimationFrame(function () { q = 0; all(); }); }
  new MutationObserver(function (ms) { for (var i = 0; i < ms.length; i++) if (ms[i].addedNodes.length) { soon(); return; } }).observe(document.body, { childList: true, subtree: true });
  window.addEventListener('resize', soon);
})();
</script>

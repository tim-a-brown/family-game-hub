<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cipher Cases</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../data/ciphers-cases.js"></script>
<style>
:root{--tw:"American Typewriter","Courier New",Courier,monospace;--manila:#ecd9a8;--manila-2:#dcc28a;--manila-ink:#3a2c14;--stamp:#c22a2a;--brass-a:#f6d98a;--brass-b:#c8962f;--brass-c:#8a5e14;}
body{overflow-x:hidden;}
/* clip, where it's supported: hidden can make the body its own scroller on iPhone, and then the win screen scrolls away with the page */
@supports (overflow:clip){body{overflow-x:clip;}}
.cc{max-width:560px;margin:0 auto;padding:0 12px calc(var(--safe-b) + 18px);}

/* ── Case board (on the setup screen) ───────────────────────────────── */
.cb{display:flex;flex-direction:column;gap:12px;}
.cb-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border-radius:16px;background:var(--w06);}
.cb-tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;border:0;border-radius:12px;background:transparent;color:var(--text-2);font-weight:900;font-size:.98rem;transition:background .15s,color .15s,transform .12s var(--spring);}
.cb-tabs button small{font-size:.74rem;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;}
.cb-tabs button.on{background:var(--accent);color:var(--accent-ink);}
.cb-tabs button.on small{color:color-mix(in srgb,var(--accent-ink) 70%,transparent);}
.cb-tabs button:active{transform:scale(.96);}
.cb-grid{display:flex;flex-direction:column;gap:10px;padding:2px 2px 6px;}
.cb-grps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.cb-grp{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:8px 10px 7px;border:2px solid transparent;border-radius:12px;background:var(--w06);color:var(--text-2);font-size:.82rem;font-weight:900;text-align:left;transition:transform .12s var(--spring),border-color .15s;}
.cb-grp.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--text);}
.cb-grp:active{transform:scale(.96);}
.cb-grp .bar{height:6px;border-radius:3px;background:var(--w1);overflow:hidden;}
.cb-grp .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#c22a2a,#e8743a);}
.cb-grp small{font-size:.7rem;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;}
.cb-sub{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 10px;padding-top:12px;}
@media (min-width:640px){.cb-sub{grid-template-columns:repeat(5,1fr);gap:18px 10px;}}
@media (min-width:400px) and (max-width:639px){.cb-sub{grid-template-columns:repeat(2,1fr);}}
.fold{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:88px;padding:11px 10px 8px;border:0;border-radius:3px 10px 10px 10px;text-align:left;color:var(--manila-ink);
  background:radial-gradient(rgba(120,90,30,.07) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(170deg,var(--manila),var(--manila-2));
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 0 #b99c5e,0 8px 16px rgba(0,0,0,.35);transition:transform .18s var(--spring),box-shadow .18s;}
.fold::before{content:"";position:absolute;left:0;top:-8px;width:46%;height:10px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,#f1e0b4,var(--manila));box-shadow:0 -1px 0 rgba(255,255,255,.4) inset;}
.fold .no{font-family:var(--tw);font-size:.64rem;font-weight:700;letter-spacing:.14em;color:#7a6234;}
.fold b{font-family:var(--tw);font-size:.88rem;padding-right:16px;line-height:1.12;font-weight:700;overflow-wrap:anywhere;}
.fold .dv{position:absolute;right:6px;top:7px;width:18px;height:18px;color:#7a6234;opacity:.8;}
.fold .dv svg{width:100%;height:100%;}
.fold .st{margin-top:auto;font-size:.62rem;line-height:1.15;font-weight:800;color:#7a6234;font-variant-numeric:tabular-nums;}
.fold.on{transform:translateY(-6px) rotate(-1deg);box-shadow:0 0 0 3px var(--accent),0 3px 0 #b99c5e,0 14px 24px rgba(0,0,0,.45);}
.fold:active{transform:translateY(-2px) scale(.98);}
.stamp{position:absolute;right:8px;bottom:12px;padding:2px 8px;border:2.5px solid var(--stamp);border-radius:5px;color:var(--stamp);font-family:var(--tw);font-weight:700;font-size:.8rem;letter-spacing:.14em;transform:rotate(-12deg);opacity:.85;
  mask-image:radial-gradient(rgba(0,0,0,.9) 55%,rgba(0,0,0,.55));-webkit-mask-image:radial-gradient(rgba(0,0,0,.9) 55%,rgba(0,0,0,.55));}
.stamp.grey{border-color:#6e6250;color:#6e6250;}
.fold .stamp{right:4px;bottom:22px;padding:1px 5px;font-size:.6rem;border-width:2px;letter-spacing:.1em;}
.fold.done{background:radial-gradient(rgba(120,90,30,.07) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(170deg,#e4cf98,#d2b679);}
.cb-sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px;}
.cb-sum small{color:var(--text-3);font-weight:800;font-size:.82rem;}

/* ── The case file (play screen) ────────────────────────────────────── */
.play{display:flex;flex-direction:column;gap:14px;padding-top:4px;}
.file{position:relative;border-radius:4px 12px 12px 12px;padding:14px 14px 14px;color:var(--manila-ink);
  background:radial-gradient(rgba(120,90,30,.06) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(175deg,var(--manila),var(--manila-2));
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 3px 0 #b99c5e,0 5px 0 #a3864c,0 16px 30px rgba(0,0,0,.45);margin-top:10px;}
.file::before{content:"";position:absolute;left:0;top:-12px;width:42%;height:14px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#f1e0b4,var(--manila));}
.fh{display:flex;align-items:center;gap:10px;font-family:var(--tw);}
.fh .no{font-size:.78rem;letter-spacing:.16em;font-weight:700;color:#7a6234;white-space:nowrap;}
.fh .sp{flex:1;}
.fh .tm{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--manila-ink);min-width:3.4em;text-align:right;}
.tally{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 2px;color:var(--stamp);}
.tally i{display:block;width:2.5px;height:17px;border-radius:2px;background:currentColor;transform:rotate(6deg);}
.tally i.x{position:relative;width:24px;height:2.5px;margin-left:-26px;transform:rotate(-24deg);}
.tally i.new{animation:tal .4s var(--spring);}
@keyframes tal{from{transform:scaleY(0) rotate(6deg);}}
.ft{margin:6px 0 4px;font-family:var(--display);font-weight:400;font-size:1.65rem;line-height:1.05;color:#2a1f0c;letter-spacing:.01em;}
.fs{font-family:var(--tw);font-size:.9rem;line-height:1.38;color:#3d3018;}
.hints{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.hint{position:relative;display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:2px;background:linear-gradient(180deg,#fff3a6,#ffe678);color:#3a3000;font-family:var(--hand);font-size:1.1rem;line-height:1.22;box-shadow:0 6px 12px rgba(0,0,0,.22);transform:rotate(-.6deg);}
.hint:nth-child(2){transform:rotate(.5deg);}
.hint b{flex:none;font-family:var(--tw);font-size:.7rem;letter-spacing:.12em;color:#7a6200;padding-top:4px;}
.hint.new{animation:stick .45s var(--spring) backwards;}
@keyframes stick{from{opacity:0;transform:translateY(-14px) rotate(-6deg) scale(1.08);}}

/* Scene photo, clipped to the file */
.photo{position:relative;margin:12px 2px 2px;padding:8px 8px 8px;background:#fbf8f0;border-radius:3px;box-shadow:0 2px 0 #ddd3bd,0 10px 18px rgba(0,0,0,.3);transform:rotate(.5deg);cursor:zoom-in;}
.photo svg{display:block;width:100%;height:auto;border-radius:1px;}
.photo .clip{position:absolute;top:-14px;left:22px;width:20px;height:44px;border:3px solid #9aa3ad;border-radius:10px;border-bottom-color:transparent;box-shadow:0 1px 1px rgba(0,0,0,.3);}
.photo .zoom{position:absolute;right:12px;bottom:12px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(20,16,10,.55);color:#fff;pointer-events:none;}
.photo .zoom .ico{width:18px;height:18px;}
.photo.in{animation:drop .5s var(--ease) backwards;}
@keyframes drop{from{opacity:0;transform:translateY(-16px) rotate(-3deg);}}
.zoomsvg svg{display:block;width:100%;height:auto;border-radius:6px;}

/* ── Desk with the device ───────────────────────────────────────────── */
.desk{position:relative;border-radius:22px;padding:18px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;overflow:hidden;}
.desk::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(90% 70% at 50% 30%,rgba(255,220,160,.14),transparent 70%);}
.desk > *{position:relative;z-index:1;}
.dev-acts{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;}
.dev-acts .btn{min-height:50px;}
.dev-acts .btn .ico{width:20px;height:20px;}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-8px);}40%,60%{transform:translateX(8px);}}

/* Tools row */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border:0;border-radius:14px;background:var(--w07);color:var(--text-2);font-weight:800;font-size:.78rem;transition:transform .12s var(--spring),background .15s;}
.tool .ico{width:22px;height:22px;}
.tool:active{transform:scale(.94);background:var(--w14);}
.tool:disabled{opacity:.35;}
.tool.on{background:color-mix(in srgb,var(--accent) 70%,#fff 0%);color:#fff;}
.tool .pips{position:absolute;top:8px;right:10px;display:flex;gap:3px;}
.tool .pips i{width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:0 0 6px var(--yellow);}
.tool .pips i.used{background:var(--w14);box-shadow:none;}

/* ── Wheels (padlock, briefcase, cryptex) ───────────────────────────── */
.wheels{display:flex;gap:6px;justify-content:center;}
.wh{--fh:42px;position:relative;width:48px;height:122px;perspective:420px;overflow:hidden;border-radius:6px;cursor:grab;touch-action:none;
  background:linear-gradient(90deg,#1c1d22,#3c3f47 30%,#50535c 50%,#3c3f47 70%,#1c1d22);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.25);}
.wh:active{cursor:grabbing;}
.wh:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}
.drum{position:absolute;left:0;right:0;top:50%;height:0;transform-style:preserve-3d;}
.face{position:absolute;left:0;right:0;top:calc(var(--fh) / -2);height:var(--fh);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  font-family:var(--tw);font-weight:700;font-size:1.65rem;color:#f4f1e8;
  background:linear-gradient(90deg,#26282e,#5b5f69 40%,#6c707a 50%,#5b5f69 60%,#26282e);border-top:1px solid rgba(0,0,0,.45);}
.wh::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.05) 32%,rgba(255,255,255,.08) 50%,rgba(0,0,0,.05) 68%,rgba(0,0,0,.85));}
.wh .mark{position:absolute;left:-2px;right:-2px;top:50%;height:44px;margin-top:-22px;border-top:2px solid rgba(255,214,120,.0);border-bottom:2px solid rgba(255,214,120,.0);pointer-events:none;}

/* padlock */
.padlock{position:relative;width:min(290px,84vw);padding-top:80px;}
.shackle{position:absolute;left:50%;top:0;width:62%;height:130px;margin-left:-31%;border:20px solid transparent;border-bottom:0;border-radius:110px 110px 0 0;
  background:linear-gradient(90deg,#9aa1aa,#eef1f5 30%,#b5bcc5 55%,#7d848d) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0) border-box;-webkit-mask-composite:xor;mask-composite:exclude;
  transform-origin:12% 100%;transition:transform .5s var(--spring);cursor:pointer;z-index:0;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4));}
.padlock.rattle .shackle{animation:rattle .45s ease;}
@keyframes rattle{25%{transform:translateY(-8px);}50%{transform:translateY(0);}70%{transform:translateY(-4px);}}
.padlock.open .shackle{transform:translateY(-34px);}
.padlock.open.swing .shackle{transform:translateY(-34px) perspective(400px) rotateY(150deg);}
.lockbody{position:relative;z-index:1;border-radius:26px 26px 34px 34px;padding:22px 16px 26px;
  background:radial-gradient(120% 80% at 30% 15%,rgba(255,255,255,.45),transparent 45%),linear-gradient(160deg,var(--brass-a),var(--brass-b) 55%,var(--brass-c));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -6px 0 rgba(0,0,0,.25),inset 0 0 0 2px rgba(120,80,10,.4),0 18px 30px rgba(0,0,0,.5);}
.lockbody .well{padding:10px 12px;border-radius:12px;background:linear-gradient(180deg,#5a3d0a,#7a5514);box-shadow:inset 0 4px 10px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.45);}
.lockbody .eng{margin-top:12px;text-align:center;font-family:var(--tw);font-weight:700;font-size:.72rem;letter-spacing:.3em;color:rgba(90,60,10,.65);text-shadow:0 1px 0 rgba(255,255,255,.4);}
.lockbody .ptr{position:absolute;left:6px;right:6px;top:50%;height:0;}
.padlock .wh{width:54px;}

/* briefcase */
.brief{position:relative;width:min(340px,90vw);}
.brief .lid{position:relative;height:56px;border-radius:18px 18px 4px 4px;background:linear-gradient(180deg,#7a3b1d,#5a2a12);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 0 0 3px rgba(0,0,0,.15);transform-origin:50% 100%;transition:transform .7s var(--ease);}
.brief .lid::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(255,220,180,.35);border-radius:13px 13px 2px 2px;}
.brief .handle{position:absolute;left:50%;top:-30px;width:110px;height:38px;margin-left:-55px;border:10px solid #4a220e;border-bottom:0;border-radius:22px 22px 0 0;}
.brief .base{position:relative;padding:20px 14px 22px;border-radius:4px 4px 18px 18px;background:linear-gradient(180deg,#6d3317,#4f230d);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 18px 30px rgba(0,0,0,.5);}
.brief .base::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(255,220,180,.3);border-radius:2px 2px 13px 13px;pointer-events:none;}
.brief .plate{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;}
.brief .latch{width:46px;height:64px;border-radius:8px;background:linear-gradient(160deg,var(--brass-a),var(--brass-b) 60%,var(--brass-c));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 6px rgba(0,0,0,.5);transform-origin:50% 0;transition:transform .35s var(--spring);}
.brief .latch::after{content:"";display:block;margin:12px auto 0;width:20px;height:8px;border-radius:4px;background:rgba(90,60,10,.55);}
.brief .well{padding:8px 10px;border-radius:10px;background:linear-gradient(160deg,var(--brass-a),var(--brass-b) 60%,var(--brass-c));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 6px rgba(0,0,0,.5);}
.brief .wh{width:44px;height:104px;--fh:36px;}
.brief .wh .face{font-size:1.4rem;}
.brief.open .latch{transform:rotateX(70deg) translateY(-6px);}
.brief.open.swing .lid{transform:perspective(500px) rotateX(64deg) translateY(-6px);}

/* cryptex */
.cryptex{position:relative;display:flex;align-items:center;width:min(360px,92vw);justify-content:center;}
.cryptex .cap{position:relative;width:34px;height:132px;border-radius:12px;background:linear-gradient(180deg,#4b3110,var(--brass-a) 22%,var(--brass-b) 55%,#5a3b08);box-shadow:inset 0 0 0 2px rgba(80,50,5,.5),0 10px 18px rgba(0,0,0,.5);transition:transform .8s var(--ease);z-index:2;}
.cryptex .cap::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#b88a2a 60%,#6b4808);}
.cryptex .rings{position:relative;display:flex;gap:3px;padding:6px 4px;background:linear-gradient(180deg,#2a1b06,#6b4a10 20%,#3a2706 80%,#1e1404);border-radius:4px;z-index:1;}
.cryptex .wh{width:46px;height:120px;--fh:40px;background:linear-gradient(90deg,#5a3b08,#c8962f 30%,#f6d98a 50%,#c8962f 70%,#5a3b08);}
.cryptex.n6 .wh{width:37px;}
.cryptex.n6 .wh .face{font-size:1.35rem;}
.cryptex .wh .face{color:#3a2604;background:linear-gradient(90deg,#8a5e14,#dcb35a 35%,#f6dc95 50%,#dcb35a 65%,#8a5e14);border-top:1px solid rgba(80,50,5,.5);font-size:1.6rem;}
.cryptex .scroll{position:absolute;left:50%;top:50%;width:0;height:96px;margin-top:-48px;border-radius:6px;background:linear-gradient(180deg,#f8efd8,#e6d6ae);box-shadow:inset 0 0 0 1px rgba(120,90,30,.4);transition:width .8s var(--ease),margin-left .8s var(--ease);z-index:0;overflow:hidden;
  display:grid;place-items:center;font-family:var(--hand);color:var(--ink);font-size:1.3rem;white-space:nowrap;}
.cryptex.open .cap.l{transform:translateX(-46px);}
.cryptex.open .cap.r{transform:translateX(46px);}
.cryptex.open.swing .rings{transform:translateY(64px);opacity:0;transition:transform .7s var(--ease),opacity .5s;}
.cryptex.open.swing .scroll{width:250px;margin-left:-125px;}

/* ── Safe dial ──────────────────────────────────────────────────────── */
.safe{position:relative;width:min(330px,90vw);perspective:900px;}
.safe .inside{position:absolute;inset:0;border-radius:18px;background:radial-gradient(70% 60% at 50% 55%,#fff2b8,#d9a83a 30%,#3a2a10 75%,#140d04);box-shadow:inset 0 0 30px rgba(0,0,0,.9);display:grid;place-items:center;}
.safe .door{position:relative;border-radius:18px;padding:16px 14px 18px;transform-origin:0 50%;transition:transform 1.1s var(--ease);
  background:radial-gradient(120% 70% at 30% 10%,rgba(255,255,255,.18),transparent 50%),linear-gradient(160deg,#4f5866,#2d333c 60%,#1d2128);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 0 0 3px rgba(0,0,0,.35),0 18px 30px rgba(0,0,0,.55);}
.safe .door::before{content:"";position:absolute;inset:8px;border-radius:12px;border:2px solid rgba(255,255,255,.08);pointer-events:none;}
.safe.open .door{transform:rotateY(-104deg);}
.safe .door,.kp .door{backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.prize{max-width:80%;padding:10px 14px;border-radius:3px;background:#fbf3d9;color:#1f2a6b;font-family:var(--hand);font-size:1.3rem;line-height:1.2;text-align:center;box-shadow:0 8px 18px rgba(0,0,0,.5);transform:rotate(-3deg) scale(.6);opacity:0;transition:transform .6s var(--spring) .6s,opacity .4s .6s;}
.open .prize{transform:rotate(-3deg) scale(1);opacity:1;}
.slots{display:flex;justify-content:center;gap:10px;margin-bottom:12px;}
.slot{display:grid;place-items:center;width:58px;height:42px;border-radius:8px;font-family:var(--tw);font-weight:700;font-size:1.45rem;color:#2b1d03;
  background:linear-gradient(160deg,var(--brass-a),var(--brass-b) 60%,var(--brass-c));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.5);}
.slot.empty{color:rgba(60,40,5,.35);}
.slot.cur{box-shadow:0 0 0 3px #ffe08a,inset 0 1px 0 rgba(255,255,255,.6),0 3px 6px rgba(0,0,0,.5);}
.slot.new{animation:slotin .35s var(--spring);}
@keyframes slotin{from{transform:scale(1.35);}}
.dialwrap{position:relative;width:min(250px,68vw);aspect-ratio:1;margin:0 auto;touch-action:none;cursor:grab;}
.dialwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.dialwrap .rot{transform-origin:0 0;will-change:transform;}
.dialwrap:focus-visible{outline:3px solid var(--yellow);outline-offset:6px;border-radius:50%;}
.dialrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;}
.nudge{display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#e9edf3;}
.nudge .ico{width:22px;height:22px;}
.nudge:active{transform:scale(.92);}
.setbtn{min-width:120px;}
.handle{position:absolute;right:14px;top:50%;width:18px;height:90px;margin-top:-45px;border-radius:9px;background:linear-gradient(90deg,#8d96a3,#e8ecf1 45%,#8d96a3);box-shadow:0 3px 6px rgba(0,0,0,.5);transform-origin:50% 50%;transition:transform .45s var(--spring);}
.safe.turn .handle{transform:rotate(80deg);}
.safe.jam .handle{animation:jam .5s ease;}
@keyframes jam{30%{transform:rotate(26deg);}60%{transform:rotate(-6deg);}}

/* ── Keypad ─────────────────────────────────────────────────────────── */
.kp{position:relative;width:min(290px,84vw);perspective:900px;}
.kp .inside{position:absolute;inset:0;border-radius:16px;background:radial-gradient(70% 60% at 50% 50%,#fffbe8,#ffd36b 35%,#5a4214 80%,#1a1205);display:grid;place-items:center;}
.kp .door{position:relative;padding:16px 16px 18px;border-radius:16px;transform-origin:0 50%;transition:transform 1.1s var(--ease);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(160deg,#b9c0c9,#878f9a 55%,#5d646e);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 0 0 2px rgba(0,0,0,.25),0 18px 30px rgba(0,0,0,.55);}
.kp.open .door{transform:rotateY(-104deg);}
.lcd{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-radius:10px;margin-bottom:14px;
  background:linear-gradient(180deg,#9fb48a,#b8cc9f);box-shadow:inset 0 3px 8px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.5);}
.lcd .dg{flex:1;font-family:var(--tw);font-weight:700;font-size:1.9rem;letter-spacing:.35em;color:#1f2a14;text-shadow:1px 1px 0 rgba(0,0,0,.12);white-space:nowrap;overflow:hidden;}
.lcd .dg .ph{opacity:.18;}
.led{flex:none;width:14px;height:14px;border-radius:50%;background:#5a1010;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.led.r{background:#ff3a3a;box-shadow:0 0 10px #ff3a3a,0 0 2px #fff inset;}
.led.g{background:#3dff7a;box-shadow:0 0 12px #3dff7a,0 0 2px #fff inset;}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.key{display:flex;flex-direction:column;align-items:center;justify-content:center;height:58px;border:0;border-radius:12px;color:#1b1f24;
  background:linear-gradient(180deg,#f3f5f8,#c9ced6);box-shadow:0 4px 0 #6b727c,0 6px 8px rgba(0,0,0,.35),inset 0 1px 0 #fff;transition:transform .06s,box-shadow .06s;font-family:var(--tw);font-weight:700;font-size:1.5rem;line-height:1;}
.key small{font-family:var(--font);font-size:.6rem;font-weight:900;letter-spacing:.14em;color:#5b636e;margin-top:3px;min-height:.6rem;}
.key.fn{font-size:.82rem;letter-spacing:.1em;color:#3b434d;}
.key.ent{background:linear-gradient(180deg,#9fe0b0,#5fb67a);color:#0d3a1b;}
.key:active,.key.down{transform:translateY(3px);box-shadow:0 1px 0 #6b727c,0 2px 4px rgba(0,0,0,.35),inset 0 1px 0 #fff;}

/* ── Message: typewriter paper and keys ─────────────────────────────── */
.paperstrip{position:relative;width:100%;padding:14px 10px 16px;border-radius:3px;color:#1d1a14;
  background:radial-gradient(rgba(0,0,0,.03) 1px,transparent 1px) 0 0/3px 3px,linear-gradient(180deg,#fffdf6,#f3ecd9);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 22px rgba(0,0,0,.45);}
.intercept{margin:0 2px 12px;padding:6px 8px;border:1.5px dashed rgba(60,40,10,.35);border-radius:4px;font-family:var(--tw);font-weight:700;font-size:1.06rem;letter-spacing:.18em;line-height:1.5;word-break:break-word;color:#2a2214;text-align:center;}
.intercept small{display:block;font-size:.66rem;letter-spacing:.2em;color:#8a7a5a;font-weight:700;}
.words{display:flex;flex-wrap:wrap;gap:12px 14px;justify-content:center;}
.word{display:flex;gap:3px;}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:var(--cw2,24px);cursor:pointer;-webkit-user-select:none;user-select:none;}
.cell .g{display:grid;place-items:center;height:22px;min-width:100%;font-family:var(--tw);font-weight:700;font-size:1rem;color:#5b4a2a;line-height:1;white-space:nowrap;}
.cell .g svg{width:20px;height:20px;}
.cell .g.big{height:32px;}
.cell .g.big svg{width:30px;height:30px;}
.cell .g.mo{font-size:.95rem;letter-spacing:.04em;font-family:var(--mono);font-weight:900;}
.cell .g.sm{font-size:.82rem;}
.cell .s{position:relative;display:grid;place-items:center;width:100%;height:30px;border-bottom:2px solid #2d2618;font-family:var(--tw);font-weight:700;font-size:1.32rem;color:var(--ink);line-height:1;}
.cell .s::before{content:"";position:absolute;inset:0 -1px -2px;border-radius:4px 4px 0 0;background:transparent;transition:background .12s;z-index:-1;}
.cell.link .s::before{background:rgba(110,160,240,.22);}
.cell.sel .s::before{background:rgba(255,206,60,.65);}
.cell.giv .s{color:#1f6a3a;}
.cell.hnt .s{color:#1f6a3a;}
.cell.pu{min-width:10px;cursor:default;}
.cell.pu .s{border-bottom-color:transparent;color:#2d2618;}
.cell .s.ty{animation:strike .16s ease-out;}
@keyframes strike{from{transform:translateY(-5px) scale(1.25);opacity:.4;}}
.paperstrip.won .cell .s{animation:wave .7s ease both;animation-delay:calc(var(--d) * 35ms);}
@keyframes wave{40%{transform:translateY(-8px);color:#1f6a3a;}}
.paperstrip .pstamp{position:absolute;right:14px;top:8px;padding:3px 10px;border:3px solid var(--stamp);border-radius:6px;color:var(--stamp);font-family:var(--tw);font-weight:700;letter-spacing:.2em;font-size:1rem;transform:rotate(-10deg) scale(2.2);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none;}
.paperstrip.won .pstamp,.paperstrip.shown .pstamp{opacity:.9;transform:rotate(-10deg) scale(1);}
.paperstrip.shown .pstamp{border-color:#6e6250;color:#6e6250;}
.tw{width:100%;display:flex;flex-direction:column;gap:7px;padding:4px 0 2px;}
.tw .row{display:flex;justify-content:center;gap:5px;}
.tk{flex:0 1 34px;aspect-ratio:1;max-width:44px;display:grid;place-items:center;border:0;border-radius:50%;padding:0;color:#f4efe2;font-family:var(--tw);font-weight:700;font-size:1.05rem;
  background:radial-gradient(circle at 50% 35%,#3a3a3e,#151517 70%);box-shadow:0 0 0 2.5px #c9ccd2,0 0 0 4px #6f737b,0 4px 0 4px #2a2a2e,0 6px 8px 4px rgba(0,0,0,.35);transition:transform .05s,box-shadow .05s;margin:4px 0 6px;}
.tk:active,.tk.down{transform:translateY(3px);box-shadow:0 0 0 2.5px #c9ccd2,0 0 0 4px #6f737b,0 1px 0 4px #2a2a2e,0 2px 4px 4px rgba(0,0,0,.35);}
.tk.wide{flex:0 1 64px;aspect-ratio:auto;height:34px;border-radius:17px;font-size:.72rem;letter-spacing:.12em;}
.tk.wide .ico{width:18px;height:18px;}
.tk.go{background:radial-gradient(circle at 50% 35%,#a8322a,#6a120d 70%);}
.tk.used{color:#8d887c;}

/* Decoder pad */
.pad{position:relative;border-radius:16px;padding:12px;background:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/4px 4px,linear-gradient(180deg,#24314f,#18213a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 10px 20px rgba(0,0,0,.35);color:#e8edf8;}
.pad h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#a9b6d6;font-weight:900;}
.pad h4 .ico{width:16px;height:16px;}
.pad h4 .sp{flex:1;}
.pad h4 button{border:0;background:rgba(255,255,255,.1);color:#e8edf8;border-radius:999px;padding:4px 10px;font-weight:800;font-size:.72rem;letter-spacing:.06em;}
.pad.in{animation:padin .35s var(--ease);}
@keyframes padin{from{opacity:0;transform:translateY(-8px);}}
.wheelpad{display:flex;flex-direction:column;align-items:center;gap:8px;}
.cwheel{position:relative;width:min(260px,72vw);aspect-ratio:1;touch-action:none;cursor:grab;}
.cwheel svg{position:absolute;inset:0;width:100%;height:100%;}
.cwheel .w-in{transform-origin:50% 50%;will-change:transform;}
.wheelrow{display:flex;align-items:center;gap:12px;font-weight:900;}
.wheelrow .k{min-width:110px;text-align:center;font-size:1rem;}
.wheelrow .k small{display:block;font-size:.7rem;color:#a9b6d6;font-weight:800;letter-spacing:.06em;}
.ruler{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;border-radius:6px;overflow:hidden;background:#d9c58f;padding:3px;}
.ruler span{display:flex;flex-direction:column;align-items:center;padding:3px 0;background:linear-gradient(180deg,#fbf3d9,#efe0b4);color:#2a2214;font-family:var(--tw);font-weight:700;font-size:.95rem;line-height:1.1;}
.ruler span i{font-style:normal;font-size:.72rem;color:#8a5a14;}
.morse{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px;}
.morse span{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;background:rgba(255,255,255,.06);font-family:var(--tw);font-weight:700;font-size:.92rem;}
.morse span svg{height:10px;width:auto;}
.phonepad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;margin:0 auto;}
.phonepad span{display:flex;flex-direction:column;align-items:center;padding:5px 2px 6px;border-radius:10px;background:rgba(255,255,255,.08);}
.phonepad b{font-family:var(--tw);font-size:1.15rem;}
.phonepad small{display:flex;gap:4px;font-size:.78rem;font-weight:900;letter-spacing:.02em;color:#cfd8ee;}
.phonepad small sup{font-size:.58rem;color:#ffd36b;margin-left:1px;}
.kwrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.kwrow input{flex:1;min-width:0;height:42px;border:0;border-radius:10px;padding:0 12px;background:#fbf3d9;color:#2a2214;font-family:var(--tw);font-weight:700;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;}
.alpha{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;font-family:var(--tw);font-weight:700;text-align:center;font-size:.92rem;}
.alpha .p{color:#a9b6d6;}
.alpha .c{color:#ffd36b;}
.alpha .c.kw{color:#7fe3a2;}
.alpha .gap{grid-column:1 / -1;height:6px;}
.freq{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;}
.fq{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:26px;border:0;background:none;color:inherit;padding:0;}
.fq .bar{width:14px;height:44px;display:flex;align-items:flex-end;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
.fq .bar i{display:block;width:100%;background:linear-gradient(180deg,#ffd36b,#e09a2b);border-radius:3px 3px 0 0;}
.fq b{font-family:var(--tw);font-size:.9rem;color:#ffd36b;}
.fq em{font-style:normal;width:22px;height:24px;display:grid;place-items:center;border-radius:5px;background:#fbf3d9;color:var(--ink);font-family:var(--tw);font-weight:700;}
.fq small{font-size:.62rem;color:#a9b6d6;font-weight:800;}
.fq.on em{background:#ffd36b;}
.common{margin-top:8px;font-size:.78rem;color:#a9b6d6;font-weight:700;}
.common b{color:#e8edf8;letter-spacing:.18em;font-family:var(--tw);}
.pigkey{display:flex;justify-content:center;}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;max-width:300px;margin:0 auto;font-family:var(--tw);font-weight:700;text-align:center;}
.pgrid b{color:#ffd36b;font-size:.85rem;padding:4px 0;}
.pgrid span{padding:6px 0;border-radius:6px;background:rgba(255,255,255,.08);font-size:1rem;}
.pgrid span.on{background:#ffd36b;color:#1d2433;}
.semgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;}
.semgrid span{display:flex;flex-direction:column;align-items:center;padding:4px 0 3px;border-radius:8px;background:rgba(255,255,255,.06);}
.semgrid svg{width:32px;height:32px;}
.semgrid b{font-family:var(--tw);font-size:.85rem;}
.viginfo{margin:0 0 8px;font-size:.84rem;color:#cfd8ee;font-weight:700;}
.viginfo b{color:#ffd36b;font-family:var(--tw);}
.alpha .hit{background:rgba(255,211,107,.25);border-radius:4px;}
.pigkey svg{width:min(330px,100%);height:auto;}

/* Solved explanation card */
.solved{position:relative;padding:14px 16px 16px;border-radius:4px;background:linear-gradient(180deg,#fffdf6,#f3ecd9);color:#2a2214;box-shadow:0 10px 22px rgba(0,0,0,.4);animation:drop .5s var(--ease) both;}
.solved h3{font-family:var(--tw);font-size:.82rem;letter-spacing:.2em;color:#7a6234;margin-bottom:6px;}
.solved p{font-family:var(--tw);font-size:.92rem;line-height:1.4;}
.solved .ans{margin:8px 0;font-family:var(--hand);font-size:1.5rem;color:var(--ink);line-height:1.2;}
.solved .by{font-family:var(--tw);font-style:italic;font-size:.82rem;color:#6b5a3a;}
.solved .acts{display:flex;gap:8px;margin-top:12px;}
.solved .acts .btn{flex:1;min-height:46px;font-size:.95rem;}
.solved .acts .btn-soft{--b:#e4d9bd;--b-ink:#3a2c14;--b-lip:#b9a77c;}
.loading{min-height:50vh;display:grid;place-items:center;font-family:var(--tw);color:var(--text-2);}

/* ── The picture drawer (under the case note) and the decoder board ───
   The drawer is the file's lower flap: the picture drops down inside it, and its tab hangs below. On a phone,
   fitPlay sets --picH (the picture's height) and --clueH (the decoder's), so everything stays on one screen. */
.drawer{position:relative;margin-top:-26px;z-index:0;}
.picbox{display:none;padding:22px 12px 10px;border-radius:0 0 12px 12px;
  background:radial-gradient(rgba(120,90,30,.06) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(180deg,var(--manila-2),var(--manila));box-shadow:0 3px 0 #b99c5e,0 12px 22px rgba(0,0,0,.35);}
.drawer.open .picbox{display:block;}
.picbox .photo{margin:0 auto;width:min(100%,calc(var(--picH,9999px) * 1.6667 + 16px));}
.picbox .photo svg{width:100%;height:auto;}
.picbox .photo .clip{display:none;}
.picbox.in{animation:drawer .32s var(--ease);}
@keyframes drawer{from{opacity:0;transform:translateY(-12px);}}
.pictab{display:flex;align-items:center;gap:8px;margin:0 0 0 14px;padding:22px 12px 6px;min-height:30px;border:0;border-radius:0 0 12px 12px;
  background:linear-gradient(180deg,var(--manila-2),#d9c189);color:#5a4520;font-family:var(--tw);font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;
  box-shadow:0 3px 0 #b99c5e,0 8px 14px rgba(0,0,0,.3);}
.drawer.open .pictab{padding-top:6px;margin-top:-2px;}
.pictab .ico{width:15px;height:15px;}
.pictab .thumb{display:block;width:40px;height:24px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 2px #fbf8f0,0 2px 4px rgba(0,0,0,.3);}
.pictab .thumb svg{display:block;width:100%;height:100%;}
.pictab:active{transform:translateY(1px);}
.clue[hidden]{display:none;}
.cpad:empty{display:none;}
.keysdesk{padding:10px 8px 12px;}
.keysdesk[hidden]{display:none;}
@media (max-width:699px){
  .play{gap:12px;}
  .file{padding:10px 12px 11px;margin-top:8px;}
  .ft{font-size:1.38rem;margin:4px 0 2px;}
  .fs{font-size:.84rem;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;}
  .fs.open{display:block;-webkit-line-clamp:unset;}
  .hints{margin-top:8px;gap:6px;}
  .hint{font-size:1rem;padding:7px 10px;}
  .desk{padding:12px 10px 12px;gap:10px;}
  .tools .tool{min-height:46px;flex-direction:row;gap:7px;font-size:.84rem;white-space:nowrap;}
  .tools .tool .ico{width:19px;height:19px;}
  .tools .tool .pips{position:static;}
  .paperstrip{padding:10px 8px 12px;}
  .intercept{margin-bottom:8px;font-size:.98rem;}
  .clue .cpad{max-height:var(--clueH,none);display:flex;}
  .clue .cpad:has(.wheelpad){height:var(--clueH,auto);}
  .clue .cpad .pad{flex:1;min-height:0;overflow:auto;padding:10px;}
  .clue .cpad .pad > h4{display:none;}
  .play.picopen.haspad .fs{display:none;}
  .play.haspad .tools .tool{min-height:42px;}
  .picbox{padding:20px 10px 8px;}
  .clue .wheelpad{flex-direction:row;justify-content:center;gap:10px;height:100%;}
  .clue .cwheel{width:min(calc(var(--clueH,280px) - 20px),62vw);flex:none;align-self:center;}
  .clue .wheelrow{flex-direction:column;gap:8px;}
  .clue .wheelrow .k{min-width:78px;font-size:.95rem;}
  .clue .nudge{width:40px;height:40px;}
  .tw{gap:4px;padding:0;}
  .clue .phonepad{gap:4px;}
  .clue .phonepad span{padding:3px 2px 4px;}
  .dialwrap{width:min(230px,60vw);}
  .dialrow{margin-top:10px;}
  .slots{margin-bottom:8px;}
  .tk{margin:3px 0 4px;}
}
/* short phones (iPhone SE): the story folds to one line and the keys get a little smaller, to keep it all in view */
@media (max-width:699px) and (max-height:720px){
  .fs{-webkit-line-clamp:1;}
  .ft{font-size:1.2rem;}
  .tk{margin:2px 0 3px;}
  .cell .s{height:26px;font-size:1.15rem;}
  .words{gap:8px 12px;}
}
/* Landscape tablets and computers: what you look at (the case, the picture, the decoder) on the left, where you
   answer (the lock, the paper and keys) on the right */
@media (orientation:landscape) and (min-width:900px) and (min-height:560px){
  .play .clue,.play .drawer{grid-column:1;}
  .play .file{grid-row:auto;}
  .play .keysdesk{grid-column:2;}
}

/* Tablet portrait */
@media (min-width:700px){
  .cc{max-width:680px;}
  .ft{font-size:2rem;}
  .fs{font-size:1rem;}
  .tk{flex-basis:46px;max-width:52px;font-size:1.2rem;}
  .tk.wide{flex-basis:80px;height:44px;}
  .cell .s{height:36px;font-size:1.55rem;}
  .cell .g{font-size:1.12rem;}
  .desk > .padlock,.desk > .brief,.desk > .cryptex,.desk > .kp{zoom:1.22;}
  .desk > .safe{zoom:1.12;}
}
/* Landscape tablets and computers: the file on the left, the desk on the right */
@media (orientation:landscape) and (min-width:900px) and (min-height:560px){
  .cc{max-width:1180px;}
  .play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 26px;align-items:start;}
  .play .file{grid-column:1;}
  .play .desk,.play .tools,.play .solved{grid-column:2;}
}

    var board = el('div', { class: 'cb' }), tabs = el('div', { class: 'cb-tabs', role: 'tablist' }), grid = el('div', { class: 'cb-grid' });
    board.appendChild(el('div', { class: 'cb-sum' }, [el('div', { class: 'label', style: { margin: 0 }, text: 'Choose a case' }), el('small', { text: done + ' of ' + total + ' closed' })]));
    board.appendChild(tabs); board.appendChild(grid);
    function paintBoard() {
      tabs.innerHTML = '';
      LVS.forEach(function (l) {
        var cs = casesOf(l), n = cs.filter(function (c) { return sm[c.id]; }).length;
        tabs.appendChild(el('button', { type: 'button', role: 'tab', class: l === lvSel ? 'on' : '', 'aria-selected': String(l === lvSel), html: LV[l] + '<small>' + n + ' / ' + cs.length + '</small>', onclick: function () {
          if (lvSel === l) return; lvSel = l; var fo = casesOf(l).filter(function (c) { return !sm[c.id]; })[0]; sel = (fo || casesOf(l)[0]).id; ui({ lv: l, sel: sel }); Kit.sfx('flip'); Kit.haptic('light'); paintBoard(); upd();
        } }));
      });
      grid.innerHTML = '';
      var list = casesOf(lvSel), gi = Math.max(0, Math.floor(list.indexOf(BYID[sel]) / 10)), chips = el('div', { class: 'cb-grps' }), sub = el('div', { class: 'cb-sub' });
      for (var g = 0; g * 10 < list.length; g++) (function (g) {
        var part = list.slice(g * 10, g * 10 + 10), got = part.filter(function (x) { return sm[x.id]; }).length;
        chips.appendChild(el('button', { type: 'button', class: 'cb-grp' + (g === gi ? ' on' : ''), 'aria-pressed': String(g === gi), onclick: function () {
          if (g === gi) return; var fo = part.filter(function (x) { return !sm[x.id]; })[0]; sel = (fo || part[0]).id; ui({ sel: sel }); Kit.sfx('flip'); Kit.haptic('light'); paintBoard(); upd();
        } }, [el('b', { text: (g * 10 + 1) + '–' + (g * 10 + part.length) }), el('span', { class: 'bar', html: '<i style="width:' + Math.round(100 * got / part.length) + '%"></i>' }), el('small', { text: got + ' / ' + part.length })]));
      })(g);
      grid.appendChild(chips); grid.appendChild(sub);
      list.slice(gi * 10, gi * 10 + 10).forEach(function (c, i) {
        var best = sm[c.id], op = om[c.id];
        var f = el('button', { type: 'button', class: 'fold' + (c.id === sel ? ' on' : '') + (best ? ' done' : ''), style: { animation: 'drop .4s var(--ease) backwards', 'animation-delay': (i * 25) + 'ms' }, 'aria-label': 'Case ' + caseNo(c) + ': ' + c.title + (best ? ', solved' : '') }, [
          el('span', { class: 'no', text: 'CASE ' + caseNo(c) }), el('b', { text: c.title }), el('span', { class: 'dv', html: DEVICON[c.dev.t] || DEVICON.lock }),
          el('span', { class: 'st', text: best ? 'Best ' + fmt(best.secs) : op ? 'Answer shown' : kindOf(c) }),
          best ? el('span', { class: 'stamp', text: 'SOLVED' }) : op ? el('span', { class: 'stamp grey', text: 'OPENED' }) : null
        ]);
        f.addEventListener('click', function () {
          if (sel === c.id) { Kit.sfx('pop'); startBtn.click(); return; }
          sel = c.id; ui({ sel: sel }); Kit.sfx('deal'); Kit.haptic('light');
          Array.prototype.forEach.call(grid.children, function (x) { x.classList.remove('on'); }); f.classList.add('on'); upd();
        });
        sub.appendChild(f);
      });
    }
    if (modesBox) modesBox.parentNode.insertBefore(board, modesBox.nextSibling);
    function upd() {
      var m = s.state.mode;
      board.hidden = m !== 'cases';
      if (startBtn) startBtn.textContent = m === 'cont' ? 'Continue' : m === 'cases' ? 'Open case ' + caseNo(BYID[sel]) : m === 'daily' ? "Crack today's code" : 'New code';
    }
    if (modesBox) modesBox.addEventListener('click', function () { setTimeout(upd, 0); });
    paintBoard(); upd();
  }

  // ── Records and past games ────────────────────────────────────────────────
  function showRecord() {
    var sm = solvedMap(), h = hist(), rows = LVS.map(function (l) {
      var cs = casesOf(l), n = cs.filter(function (c) { return sm[c.id]; }).length, t = 0;
      cs.forEach(function (c) { if (sm[c.id]) t += sm[c.id].secs; });
      return '<tr><td>' + LV[l] + '</td><td>' + n + ' / ' + cs.length + '</td><td>' + (n ? fmt(Math.round(t / n)) : '–') + '</td></tr>';
    }).join('');
    var gens = {}; h.forEach(function (e) { if (e && e.gen && !e.revealed) gens[e.gen] = (gens[e.gen] || 0) + 1; });
    var gl = Object.keys(GTYPES).map(function (k) { return GTYPES[k] + ': <b>' + (gens[k] || 0) + '</b>'; }).join(' · ');
    Kit.sheet({ title: 'Case record', html: '<table class="k-hd-rounds" style="width:100%;border-collapse:collapse;font-weight:800"><tr><th>Level</th><th>Closed</th><th>Avg time</th></tr>' + rows + '</table><p class="muted" style="margin-top:12px">Endless codes cracked. ' + gl + '</p>', actions: [{ label: 'Close', cls: 'btn-soft' }] });
  }
  function histExtra(e) {
    var d = e && e.dt; if (!d) return null;
    var box = el('div', { style: { padding: '10px 12px', 'border-radius': '6px', background: 'linear-gradient(180deg,#fffdf6,#f3ecd9)', color: '#2a2214', 'font-family': 'var(--tw)', 'font-size': '.85rem', 'line-height': '1.35' } });
    if (d.c) box.appendChild(el('div', { style: { 'font-weight': '700', 'letter-spacing': '.08em', color: '#6b5a3a', 'word-break': 'break-word' }, text: d.c }));
    box.appendChild(el('div', { style: { 'font-family': 'var(--hand)', 'font-size': '1.2rem', color: 'var(--ink)', 'margin-top': '4px' }, text: d.a }));
    return box;
  }

  // ── Shell ─────────────────────────────────────────────────────────────────
  Kit.init({
    id: 'ciphers',
    onNew: function () { if (S && !S.done) save(); showSetup(); },
    confirmNew: false,
    undo: function () { undo(); },
    theme: { wood: ['#5b3a22', '#33200f'] },
    menu: [
      { icon: 'board', label: 'Case files', onClick: function () { if (S && !S.done) save(); showSetup(); } },
      { icon: 'lightbulb', label: 'Hint', when: function () { return view === 'play' && S && !S.done; }, onClick: function () { hint(); } },
      { icon: 'sync', label: 'Start this case over', when: function () { return view === 'play' && S && !S.done; }, onClick: function () { restart(); } },
      { icon: 'chart', label: 'Case record', onClick: function () { showRecord(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(HKEY, { title: 'Cipher Cases: past cases', extra: function (e) { return window.HistView && HistView.has && HistView.has('ciphers') ? null : histExtra(e); } }); } }
    ],
    rules:
      '<p class="goal">Every case is a short mystery with something locked: a padlock, a safe, a door keypad, a word lock or a coded note. Find the code and open it.</p>' +
      '<h3>Cracking a case</h3><ul>' +
      '<li>Read the case file and look closely at the picture. Tap the picture to see it bigger.</li>' +
      '<li>Clues can be things to count, numbers written on objects, notes about earlier guesses, or a message in code.</li>' +
      '<li><b>Padlocks, briefcases and word locks:</b> drag a wheel up or down, or tap above or below its middle. Then pull to open.</li>' +
      '<li><b>Safes:</b> turn the dial and tap <b>Set</b> for each number. The handle turns after the last one.</li>' +
      '<li><b>Keypads:</b> type the code. It tries as soon as all the numbers are in.</li>' +
      '<li><b>Coded notes:</b> type the real letter under each code. In codes where the same symbol always means the same letter, one letter fills in everywhere at once.</li></ul>' +
      '<h3>The decoder</h3><p>Many cases come with a decoder: a cipher wheel, a number ruler, a Morse chart, phone keys, a keyword alphabet or a letter counter. Show or hide it with <b>Decoder</b>.</p>' +
      '<h3>Hints and tries</h3><ul><li>Every case has two hints, each a step further. After both you can ask for the answer, but the case then counts as opened, not solved.</li>' +
      '<li>Wrong tries are tallied on the case file. There is no limit.</li></ul>' +
      '<h3>The codes</h3><ul><li><b>Caesar shift:</b> every letter moved the same number of places along the alphabet.</li>' +
      '<li><b>Letter numbers:</b> A = 1, B = 2 and so on to Z = 26.</li><li><b>Morse:</b> dots and dashes for each letter or number.</li>' +
      '<li><b>Pigpen:</b> each letter is drawn as the bit of grid around it.</li><li><b>Phone keys:</b> the letters printed on a phone\'s number keys.</li>' +
      '<li><b>Backwards, rail fence and columns:</b> the right letters, moved around.</li><li><b>Keyword:</b> a key word starts the code alphabet.</li>' +
      '<li><b>Cryptogram:</b> every letter swapped for another one.</li>' +
      '<li><b>Number grid (Polybius):</b> each letter is its row and column in a 5 × 5 alphabet grid. Knocks on a wall work the same way.</li>' +
      '<li><b>Flag semaphore:</b> each letter is a pair of flag positions.</li><li><b>Book code:</b> numbers point to a line, a word and sometimes a letter on a page.</li>' +
      '<li><b>Vigenère:</b> a key word sets a different Caesar shift for each letter in turn. The key word is always hidden somewhere in the picture.</li></ul>' +
      '<h3>Endless codes and today\'s code</h3><p><b>Endless codes</b> makes new Caesar, letter-number and cryptogram puzzles from sayings, famous lines and true facts. <b>Today\'s code</b> is the same for everyone and changes each day.</p>'
  });

  // Test hook
  window.__cc = { get: function () { return S; }, C: function () { return C; }, D: function () { return D; }, start: startCase, gen: startGen, setup: showSetup, solve: function () { if (D && C) { D.show(); window.__ccTry(); } }, hint: hint, data: DATA };

  // ── Boot ──────────────────────────────────────────────────────────────────
  var sv0 = loadSave();
  if (/[?&]daily=1/.test(location.search)) {
    try { history.replaceState(history.state, '', location.pathname + location.search.replace(/([?&])daily=1&?/, '$1').replace(/[?&]$/, '') + location.hash); } catch (e) {}
    var dd0 = DAILY[new Date().getDay()];
    if (sv0 && sv0.S.g && sv0.S.g.daily === today()) resume(sv0);
    else if (dailyDone()) showSetup();
    else startGen(dd0[0], dd0[1], lsGet('my_name', '') || 'You', today());
  } else if (sv0) resume(sv0);
  else showSetup();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boku</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="boku-core.js"></script>
<style>
.bk-col{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.bk-credit{margin:-6px 0 2px;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-3);}

/* A player's plate: their marble, their name and whose turn, and the tray of the other color's marbles they have taken */
.pbar{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px 6px 10px;border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s,background .2s;}
.pbar.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 18%,transparent);}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;}
.pbar .nm{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.pbar .nm .ico{width:15px;height:15px;color:var(--text-3);flex:none;}
.pbar .sub{font-size:.72rem;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pbar.on .sub{color:var(--lit-ink);}
.tok{--d:28px;width:var(--d);height:var(--d);border-radius:50%;flex:none;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}
/* the tray: a maple channel holding the marbles this player has taken, the count beside them */
.tray{--s:17px;display:flex;align-items:center;gap:3px;padding:4px 7px;border-radius:999px;flex:none;min-width:calc(var(--s) * 2 + 14px);min-height:calc(var(--s) + 8px);
  background:linear-gradient(180deg,#5b3a1c,#8a5c30);box-shadow:inset 0 2px 4px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.14),0 1px 0 rgba(255,255,255,.06);}
.tray .tok{--d:var(--s);}
.tray .tok.new{animation:slotpop .5s var(--spring);}
.tray .tn{font-weight:800;font-size:calc(var(--s) * .72);color:#ffe9c4;font-variant-numeric:tabular-nums;margin-left:2px;min-width:1ch;}
.tray .tn.z{opacity:.55;}
@keyframes slotpop{0%{transform:scale(.3);}60%{transform:scale(1.25);}100%{transform:scale(1);}}

/* Marbles: white milk glass and black smoked glass */
.mwh,.tok.w{background:radial-gradient(circle at 34% 28%,#fff 0,#fbf8f2 20%,#e4ddd0 58%,#a89f8f 100%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.18),0 2px 3px rgba(0,0,0,.55);}
.mbl,.tok.b{background:radial-gradient(circle at 34% 28%,#a7b0bf 0,#4a5160 15%,#1b1e25 46%,#050608 100%);box-shadow:inset 0 -2px 3px rgba(255,255,255,.1),0 2px 3px rgba(0,0,0,.55);}

/* The board: a hexagon of honey maple round an indigo lacquer field of 80 holes, each with a brass lip */
.frame{position:relative;aspect-ratio:1080/1010;width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none;view-transition-name:bk-board;}
.frame>svg.bsv{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));}
.frame .lay{position:absolute;inset:0;}
.frame svg.fx{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:4;}
.mb{position:absolute;width:8.1%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);z-index:2;}
.mb::after{content:"";position:absolute;left:20%;top:13%;width:30%;height:22%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);transform:rotate(-28deg);pointer-events:none;}
.mb.mbl::after{opacity:.5;}
.mb.lastm::before{content:"";position:absolute;left:40%;top:40%;width:20%;height:20%;border-radius:50%;background:var(--lit);box-shadow:0 0 0 1.5px rgba(0,0,0,.3);}
.mb.drop{animation:drop .42s cubic-bezier(.3,.7,.35,1.2) both;}
@keyframes drop{0%{transform:translate(-50%,-90%) scale(1.45);opacity:0;}55%{transform:translate(-50%,-50%) scale(.92,1.06);opacity:1;}80%{transform:translate(-50%,-50%) scale(1.04,.96);}100%{transform:translate(-50%,-50%) scale(1);}}
.mb.ghost{opacity:.5;z-index:3;pointer-events:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--lit) 80%,transparent),0 0 18px var(--litg);}
.mb.ghost.touch{animation:gpulse 1.2s ease-in-out infinite;}
@keyframes gpulse{50%{opacity:.72;}}
.mb.pend{z-index:3;box-shadow:0 0 0 3px var(--lit),0 0 18px var(--litg),0 3px 4px rgba(0,0,0,.5);}
/* the marbles a placement would trap: ringed red; while you choose, they pulse and take a tap */
.mb.trap{box-shadow:0 0 0 3px #ff6a4a,0 0 14px rgba(255,100,70,.6),0 3px 4px rgba(0,0,0,.5);z-index:3;}
.mb.pick{animation:pick 1s ease-in-out infinite;cursor:pointer;}
@keyframes pick{50%{box-shadow:0 0 0 5px #ff5232,0 0 26px 5px rgba(255,80,50,.75),0 3px 4px rgba(0,0,0,.5);}}
.mb.win{z-index:3;animation:winl 1.4s ease-in-out infinite;}
@keyframes winl{0%,100%{box-shadow:0 0 0 3px var(--lit),0 0 20px 4px var(--litg);}50%{box-shadow:0 0 0 5px #fff3c4,0 0 34px 10px var(--litg);}}
.mb.taken{z-index:6;}
.dh{position:absolute;width:8.1%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;}
.fly{position:fixed;border-radius:50%;z-index:60;pointer-events:none;}
/* a hole the side to move may not use (a marble was just taken from it): a red ring crossed through */
.blk{position:absolute;width:8.2%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:1;pointer-events:none;
  box-shadow:inset 0 0 0 3px rgba(255,95,70,.9),0 0 12px rgba(255,80,50,.45);background:rgba(120,20,10,.35);animation:blkin .5s var(--spring) both;}
.blk::before,.blk::after{content:"";position:absolute;left:18%;right:18%;top:calc(50% - 1.5px);height:3px;border-radius:2px;background:rgba(255,110,90,.95);transform:rotate(45deg);}
.blk::after{transform:rotate(-45deg);}
@keyframes blkin{from{transform:translate(-50%,-50%) scale(.3);opacity:0;}}
/* where a player would make five next: a dashed ring in that player's color */
.thr{position:absolute;width:7.2%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:1;pointer-events:none;border:2.5px dashed;animation:thr 1.6s ease-in-out infinite;}
.thr.w{border-color:rgba(255,250,236,.9);}
.thr.b{border-color:#0b0d12;box-shadow:0 0 0 1.5px rgba(255,255,255,.35);}
@keyframes thr{50%{transform:translate(-50%,-50%) scale(.86);}}

.turn{margin:2px 0 0;min-height:34px;}
.acts{display:flex;gap:10px;justify-content:center;margin-top:2px;}
.acts .btn{flex:1;max-width:180px;}

/* A layout for each shape (<html data-o>, set by the script, so a turn of the device glides inside Kit.glide) */
::view-transition-group(*){animation-duration:.45s;animation-timing-function:cubic-bezier(.22,1,.36,1);}
.bk-col>.turn{view-transition-name:bk-turn;}
.bk-col>.acts{view-transition-name:bk-acts;}
.bk-col>.pbar.top{view-transition-name:bk-top;}
.bk-col>.pbar.bot{view-transition-name:bk-bot;}
/* Phone upright: the board as wide as the screen, the parts spread evenly down the height */
html[data-o=port] #app.stage.ipl{min-height:calc(100dvh - var(--bar));display:flex;flex-direction:column;justify-content:stretch;
  padding-left:8px;padding-right:8px;padding-bottom:calc(var(--safe-b) + 18px);}
html[data-o=port] .bk-col{width:100%;gap:10px;flex:1 1 auto;justify-content:space-evenly;}
html[data-o=port] .bk-col>.frame{width:min(100%,calc((100dvh - var(--bar) - 250px) * 1.069));align-self:center;}
/* a tall phone: the board is held by the width, so the plates take the height left over */
@media (max-width:699px) and (min-height:740px){
  html[data-o=port] .pbar{padding:12px 16px;min-height:72px;gap:14px;}
  html[data-o=port] .pbar>.tok{--d:46px;}
  html[data-o=port] .pbar .nm{font-size:1.12rem;}
  html[data-o=port] .pbar .sub{font-size:.8rem;}
  html[data-o=port] .tray{--s:26px;gap:4px;padding:5px 9px;}
  html[data-o=port] .turn{font-size:1.05rem;}
}
@media (max-height:600px){ html[data-o=port] .bk-col{gap:6px;} html[data-o=port] .pbar{min-height:46px;} html[data-o=port] .bk-col>.frame{width:min(100%,calc((100dvh - var(--bar) - 214px) * 1.069));} html[data-o=port] .turn{min-height:24px;font-size:.92rem;} html[data-o=port] .acts .btn{min-height:40px;} }
@media (min-width:700px){
  html[data-o=port] #app.stage.ipl{max-width:none;padding-left:16px;padding-right:16px;}
  html[data-o=port] .bk-col{max-width:760px;gap:12px;}
  html[data-o=port] .bk-col>.frame{width:min(100%,calc((100dvh - var(--bar) - 290px) * 1.069));}
  html[data-o=port] .pbar{min-height:64px;padding:8px 16px 8px 12px;}
  html[data-o=port] .pbar .nm{font-size:1.1rem;}
  html[data-o=port] .pbar .sub{font-size:.85rem;}
  html[data-o=port] .pbar>.tok{--d:36px;}
  html[data-o=port] .tray{--s:26px;gap:5px;padding:5px 9px;}
}
/* Sideways: the players, whose turn and the buttons at the left to look at; the board, where the taps go, at the right */
html[data-o=land] #app.stage.ipl{max-width:none;padding:2px max(18px,env(safe-area-inset-right)) calc(var(--safe-b) + 8px) max(18px,env(safe-area-inset-left));}
html[data-o=land] .bk-col{--lc:250px;--cg:clamp(16px,3vw,40px);--bh:calc(100dvh - var(--bar) - 12px - var(--safe-b));--bw:min(calc(var(--bh) * 1.069),calc(100vw - 40px - var(--lc) - var(--cg)));
  max-width:none;height:calc(var(--bw) * .935);display:grid;grid-template-columns:minmax(var(--lc),340px) var(--bw);
  grid-template-rows:max-content max-content minmax(0,1fr) max-content max-content max-content;
  grid-template-areas:"t b" "s b" ". b" "a b" "r b" "p b";column-gap:var(--cg);row-gap:10px;justify-content:center;align-content:center;}
html[data-o=land] .bk-col>.frame{grid-area:b;width:var(--bw);}
html[data-o=land] .bk-col>.pbar.top{grid-area:t;}
html[data-o=land] .bk-col>.pbar.bot{grid-area:p;}
html[data-o=land] .bk-col>.turn{grid-area:s;justify-self:start;}
html[data-o=land] .bk-col>.acts{grid-area:a;justify-content:flex-start;}
html[data-o=land] .bk-col>.bk-room{display:none;}
@media (min-height:600px){
  html[data-o=land] .bk-col{--lc:300px;}
  html[data-o=land] .pbar{min-height:62px;}
  html[data-o=land] .pbar>.tok{--d:34px;}
  html[data-o=land] .tray{--s:24px;gap:4px;}
}
@media (max-height:420px){ html[data-o=land] .bk-col{row-gap:6px;--lc:230px;} html[data-o=land] .turn{min-height:26px;} html[data-o=land] .pbar{min-height:46px;} }
.bk-room{display:none;}

/* ── The desk: a window larger than a phone's or a tablet's (html.bk-dk, set by deskPlan) ── */
html.bk-dk #app.stage.ipl{max-width:none;padding:0;min-height:0;}
html.bk-dk .bk-col{justify-content:normal;position:fixed;left:var(--x0);top:var(--y0);width:var(--aw);height:var(--ah);max-width:none;margin:0;display:grid;gap:var(--g);
  grid-template-columns:var(--cols);grid-template-rows:max-content max-content max-content max-content minmax(0,1fr);grid-template-areas:var(--areas);}
html.bk-dk .bk-col>.frame{grid-area:b;width:var(--bw);align-self:center;justify-self:center;}
html.bk-dk .bk-col>.pbar.top{grid-area:t;}
html.bk-dk .bk-col>.pbar.bot{grid-area:p;}
html.bk-dk .bk-col>.turn{grid-area:s;justify-self:start;font-size:calc(1rem * var(--dk));}
html.bk-dk .bk-col>.acts{grid-area:a;justify-content:flex-start;}
html.bk-dk .bk-col>.bk-room{grid-area:r;display:flex;flex-direction:column;gap:var(--g);min-height:0;overflow:hidden;view-transition-name:bk-room;}
html.bk-dk .bk-room.row{flex-direction:row;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;}
html.bk-dk .bk-room.row>.pn{flex:1 1 calc(250px * var(--dk));min-width:0;}
html.bk-dk .pbar{min-height:calc(60px * var(--dk));padding:calc(8px * var(--dk)) calc(14px * var(--dk));flex-wrap:wrap;row-gap:6px;}
html.bk-dk .pbar .nm{font-size:calc(1.05rem * var(--dk));}
html.bk-dk .pbar .who{min-width:7.5em;}
html.bk-dk .pbar .sub{font-size:calc(.82rem * var(--dk));}
html.bk-dk .pbar>.tok{--d:calc(34px * var(--dk));}
html.bk-dk .tray{--s:calc(24px * var(--dk));gap:calc(4px * var(--dk));}
.pn{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:18px;padding:calc(12px * var(--dk,1)) calc(14px * var(--dk,1));min-height:0;display:flex;flex-direction:column;font-size:calc(.9rem * var(--dk,1));flex:none;}
.pn h3{margin:0 0 8px;font-size:calc(.82rem * var(--dk,1));font-weight:800;color:var(--text-3);}
.pn .rows{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;}
.pn .ln{font-weight:700;line-height:1.35;}
.pn .ln+.ln{margin-top:6px;}
.pn .none{color:var(--text-3);font-weight:600;}
.mvr{display:grid;grid-template-columns:2.4em 1.1em 1fr auto;align-items:center;gap:8px;padding:3px 4px;border-radius:8px;font-variant-numeric:tabular-nums;}
.mvr .tok{--d:1.1em;}
.mvr .no{color:var(--text-3);font-weight:700;text-align:right;}
.mvr .tok{--d:1em;}
.mvr .nt{font-weight:700;white-space:nowrap;}
.mvr .tg{font-size:.8em;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap;}
.mvr .tg.x{background:rgba(255,122,89,.18);color:#ffb39f;}
.mvr .tg.f{background:color-mix(in srgb,var(--lit) 22%,transparent);color:var(--lit-ink);}
.mvr .tg.t{background:rgba(255,255,255,.1);color:var(--text-2);}
.mvr.now{background:color-mix(in srgb,var(--lit) 10%,transparent);}
.tkr{display:flex;align-items:center;gap:10px;padding:4px 0;}
.tkr+.tkr{border-top:1px solid var(--gl-line);}
.tkr .nmx{flex:1;min-width:0;font-weight:700;}
.tkr .mbs{display:flex;flex-wrap:wrap;gap:calc(4px * var(--dk,1));}
.tkr .mbs .tok{--d:calc(22px * var(--dk,1));}
.tkr .ct{font-weight:800;font-variant-numeric:tabular-nums;}
.thl{display:flex;align-items:center;gap:10px;}
.thl+.thl{margin-top:6px;}
.thl .tok{--d:calc(18px * var(--dk,1));}
.thl .hs{display:flex;flex-wrap:wrap;gap:4px;}
.thl .h{font-weight:800;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--lit) 18%,transparent);color:var(--lit-ink);}
.pgr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:4px 2px;border-top:1px solid var(--gl-line);}
.pgr:first-child{border-top:0;}
.pgr .w{font-weight:800;}
.pgr .sc{font-weight:700;color:var(--text-3);}
.pgr .dt{grid-column:1/-1;font-size:.82em;color:var(--text-3);font-weight:600;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), Core = window.BokuCore;
  var SAVE = 'boku_state', KEY = 'boku', WHITE = 1, BLACK = 2;
  var SKILL = { easy: 'Easy', normal: 'Normal', hard: 'Hard' };
  var DEMO = Kit.inDemo && Kit.inDemo();
  var CREDIT = 'Boku was designed by Rob Nelson.';

  var R = document.documentElement;
  function shape() { return window.innerWidth > window.innerHeight ? 'land' : 'port'; }
  R.setAttribute('data-o', shape());

  // ── State ────────────────────────────────────────────────────────────────
  // S = the core's state and {mode, level, cover, players: [{name, cpu, side}], hist: [undo snapshots], started, busy}
  var S = null, NET = null, LEFT = null, WINO = null, NETREC = {}, SHOWN = 0;
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && !S.over) Kit.resume.set(S.n ? 'Move ' + (S.n + 1) : 'Ready');
  }
  function clearSave() { if (NET) return; try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function pl(side) { return S.players[0].side === side ? S.players[0] : S.players[1]; }
  function vsCpu() { return S.players.some(function (p) { return p.cpu; }); }
  function colorName(side) { return side === WHITE ? 'White' : 'Black'; }
  function isMe(p) { return NET ? NET.seat >= 0 && S.players[NET.seat] === p : !p.cpu; }
  function nameOf(p) { return NET && isMe(p) ? 'You' : p.name; }
  function humanTurn() { return S && !S.over && !S.busy && !HOLD && (NET ? !LEFT && NET.myTurn() : !pl(S.turn).cpu); }
  function poss(n) { return n === 'You' ? 'your' : Kit.poss(n); }
  function tc(side) { return side === WHITE ? 'w' : 'b'; }

  Kit.init({
    id: 'boku', mark: false, snap: '.frame', snapY: 0.5,
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } cancelThink(); clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Boku: past games' }); } }]),
    rules:
      '<p class="goal">Be the first to get <b>five of your marbles in a straight line</b>.</p>' +
      '<h3>Your turn</h3><ul><li><b>White goes first.</b> On your turn you put one marble into any empty hole on the board of 80 holes.</li>' +
      '<li>Five or more of your marbles in a row, along any of the board’s three directions, win the game at once.</li>' +
      '<li>Tap a hole and your marble shows there faintly, with the lines it would make; tap it again to put it down. With a mouse, a click puts it down.</li>' +
      '<li>A dashed ring marks a hole where a player would make five next turn. Block it, or take one of the marbles in that line.</li></ul>' +
      '<h3>Taking a marble</h3><ul><li>When your new marble traps <b>exactly two</b> of the other player’s marbles in a straight line between itself and another of yours, you may take one of the two away. Tap the one you want; it goes into your tray.</li>' +
      '<li>You take one marble a turn at most, even when your marble traps pairs in two lines at once, and you don’t have to take one.</li>' +
      '<li>One marble or three in a row can’t be taken. Putting your marble between two of the other player’s is safe: only the player who puts a marble down takes.</li>' +
      '<li>On their very next turn, the other player can’t put a marble back into the hole you just emptied. It is marked with a red cross until then.</li>' +
      '<li>A marble that makes five wins at once, and takes nothing.</li></ul>' +
      '<h3>The end</h3><ul><li>If the board fills with no five in a row, the game is a draw.</li><li>If the only empty hole is the one a player can’t use, that player passes.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b> opens a table, and the other player joins on their own device. Each new game at the table swaps colors.</li></ul>' +
      '<h3>Tips</h3><ul><li>Two marbles side by side with an empty hole at one end and the other player’s marble at the other can be taken. Keep threes, or cover the open end.</li>' +
      '<li>Four in a line with both ends open can’t be stopped by a block alone, so stop a three before it gets there.</li></ul>' +
      '<p class="credit">' + CREDIT + '</p>'
  });

  function showSetup() {
    S = null; deskOff();
    app.classList.remove('ipl');
    Kit.setup(app, {
      modes: Kit.modes([{ id: 'cpu', desc: 'Easy, Normal or Hard' }, { id: '2p', kind: 'local' }]),
      options: [
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: [['easy', 'Easy', 'Blocks a line of four, but otherwise often plays a weaker hole than it could.'], ['normal', 'Normal', 'Looks a few moves ahead for lines and for marbles to take.'], ['hard', 'Hard', 'Looks six to eight moves ahead and sets up two ways to win at once.']], when: function (m) { return m === 'cpu'; } },
        { id: 'side', label: 'You play', value: 'w', choices: [['w', 'White\nGoes first', 'White always goes first, so you start.'], ['b', 'Black', 'The computer plays White and goes first.']], when: function (m) { return m === 'cpu'; } },
        { id: 'cover', label: 'Hand over between turns', value: 'off', choices: [['off', 'Off', 'Nothing in Boku is hidden, so the device just goes across the table.'], ['on', 'On', 'A cover names whose turn it is before each move.']], when: function (m) { return m === '2p'; } }
      ],
      players: { min: 2, max: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },

      WINO = Kit.win({
        icon: w && wi === me ? 'trophy' : 'users',
        title: left ? left.text : !w ? 'A draw' : wi === me ? 'You win!' : w.name + ' wins',
        sub: left ? '' : (!w ? 'The board filled with no five in a row' : 'Five in a row') + ' · ' + S.n + (S.n === 1 ? ' move' : ' moves'),
        rank: left ? null : S.players.map(function (p) { return { name: p.name, score: S.caps[p.side] + ' taken', color: p.side === BLACK ? '#2a2a30' : '#f1efe9' }; }),
        notes: left ? null : [S.players[0].name + ' has won ' + S.wins[0] + ' and ' + S.players[1].name + ' has won ' + S.wins[1] + '.'], notesTitle: 'Games at this table',
        lose: !!w && wi !== me, againLabel: left ? 'Back to the lobby' : 'Play again',
        again: function () { WINO = null; netAgain(); },
        look: { label: 'Look at the board', onClick: function () { WINO = null; } }
      });
    }, left ? 100 : 2400);
  }
  function netLeave() {
    NET = null; LEFT = null; SHOWN++; if (WINO) { WINO.close(); WINO = null; }
    var sv = null; try { sv = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv && sv.b && sv.players && !sv.over) { S = sv; S.busy = false; build(); afterTurn(); }
    else showSetup();
  }

  // ── Test and demo hooks ──────────────────────────────────────────────────
  window.__boku = {
    core: Core, state: function () { return S; }, get ghost() { return GH; }, get pend() { return PEND; },
    // a fresh game for these players: {mode: '2p' | 'cpu', level, players: [{name, cpu, side}]}
    start: function (cfg) { cancelThink(); S = { mode: cfg.mode || '2p', level: cfg.level || 'normal', cover: false, players: cfg.players }; newGame(); },
    // set a position: rows like Core.grid's (11 strings, top row first), whose turn, marbles taken [white, black], blocked hole
    set: function (rows, turn, caps, blk) {
      cancelThink(); S.busy = false; S.b = Core.fromGrid(rows); S.turn = turn || 1; S.caps = [0, caps ? caps[0] : 0, caps ? caps[1] : 0]; S.blk = blk ? Core.idx(blk) : -1;
      S.hist = []; S.ml = []; S.cx = []; S.dbl = [0, 0, 0]; S.pass = [0, 0, 0]; S.line = []; S.n = 0; S.over = false; S.draw = false; S.winner = 0; GH = -1; PEND = null; save(); build(); afterTurn();
    },
    // play moves in order ('F5', 'F5 xG6') as whoever's turn it is
    play: function (str) { return playMove(str); },
    ghostAt: function (name) { GH = Core.idx(name); TOUCH = true; paintMarks(); paintStatus(); },
    marble: function (name) { return MB[Core.idx(name)] || null; },
    // a hole as an element (for the demo's finger and ring): a box the size of a marble over it, taking no taps
    hole: function (name) { return function () { if (!layEl) return null; var h = Core.idx(name), d = layEl.querySelector('.dh[data-c="' + h + '"]'); if (!d) { d = el('span', { class: 'dh', 'data-c': h }); var q = px(h); pos(d, q.x, q.y); layEl.appendChild(d); } return d; }; },
    at: function (name) { var r = frameEl.getBoundingClientRect(), q = px(Core.idx(name)); return { x: r.left + q.x / VW * r.width, y: r.top + q.y / VH * r.height }; },
    desk: function () { return DK; }
  };
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.b && saved.players && !saved.over) { S = saved; S.busy = false; build(); afterTurn(); }
  else showSetup();

  TurnNet.setup({
    game: 'boku', title: 'Boku', min: 2, max: 2,
    opts: netOpts, start: netStart,
    turn: function (st) { return st.over ? [] : [netSeatOf(st, st.turn)]; },
    over: function (st) { if (!st.over) return null; if (!st.winner) return { win: [], text: 'A draw' }; var w = netSeatOf(st, st.winner); return { win: [w], text: st.players[w].name + ' wins with five in a row' }; },
    show: netShow, leave: netLeave
  });
})();
</script>

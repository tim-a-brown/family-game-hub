<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Grids</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
:root{--pp:#fbf6e9;--pp-2:#f1e8d2;--pp-ink:#1d1b22;--pp-dim:#6b6455;--rule:rgba(29,27,34,.28);--graphite:#3a3a44;--lead:#8b8778;--ink-blue:#1f3a8a;--hint-ink:#1d7a46;--hl:#ffe36b;
  --np-serif:Georgia,"Times New Roman",serif;--np-sans:"Helvetica Neue",Helvetica,Arial,sans-serif;}
body.playing{height:100dvh;overflow:hidden;display:flex;flex-direction:column;}
.lg{max-width:560px;margin:0 auto;padding:0 10px calc(var(--safe-b) + 10px);width:100%;}
body.playing .lg{flex:1;min-height:0;display:flex;flex-direction:column;}
.play{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center;font-family:var(--hand);font-size:1.5rem;color:var(--text-2);}
.loading .pc{display:block;width:64px;height:64px;margin:0 auto 10px;color:var(--text-2);animation:scrib 1s ease-in-out infinite;}
@keyframes scrib{0%,100%{transform:translate(-8px,0) rotate(-8deg);}50%{transform:translate(8px,-4px) rotate(4deg);}}

/* ── The puzzle-book page ─────────────────────────────────────────────── */
.page{position:relative;flex:none;align-self:center;max-width:100%;border-radius:4px 4px 8px 8px;padding:8px 8px 6px;color:var(--pp-ink);
  background:radial-gradient(rgba(120,90,40,.05) 1px, transparent 1.2px) 0 0/5px 5px,radial-gradient(140% 90% at 50% 0%,#fffdf6 0%,var(--pp) 65%,var(--pp-2) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 0 #e2d6b8,0 4px 0 #d8caa6,0 16px 34px rgba(0,0,0,.5);animation:pageIn .5s var(--ease) both;}
@keyframes pageIn{from{transform:translateY(18px) rotate(-1deg);opacity:0;}to{transform:none;opacity:1;}}
.ph{display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:8px;padding:0 2px 5px;border-bottom:1.5px solid var(--pp-ink);margin-bottom:6px;font-family:var(--np-serif);min-width:0;}
.ph .t{font-weight:700;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.2;}
.ph .no{grid-column:1;grid-row:2;font-style:italic;font-size:.78rem;color:var(--pp-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ph .tm{grid-column:2;grid-row:1/3;align-self:center;font-family:var(--hand);font-size:1.35rem;color:var(--ink);font-variant-numeric:tabular-nums;min-width:3em;text-align:right;}
.page.roomy .ph{grid-template-columns:auto 1fr auto;align-items:baseline;}
.page.roomy .ph .no{grid-column:2;grid-row:1;}
.page.roomy .ph .tm{grid-column:3;grid-row:1;}
.story.short{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;}
.story.short::first-letter{font-size:1em;float:none;margin:0;font-weight:700;}
.gwrap{position:relative;}
.gview{position:relative;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;max-width:100%;scrollbar-width:thin;}
.gview::-webkit-scrollbar{width:4px;height:4px;}.gview::-webkit-scrollbar-thumb{background:rgba(0,0,0,.25);border-radius:2px;}
.grid{--lg-cs:28px;display:grid;width:max-content;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--np-sans);}
.corner{grid-row:1/3;grid-column:1/3;position:sticky;top:0;left:0;z-index:6;background:var(--pp);display:flex;align-items:flex-end;justify-content:flex-end;padding:0 6px 6px 0;}
.corner .zoom{display:none;align-items:center;gap:4px;border:0;border-radius:999px;padding:5px 9px 5px 7px;background:var(--pp-ink);color:var(--pp);font:800 .7rem var(--np-sans);letter-spacing:.04em;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25);}
.corner .zoom:active{transform:scale(.94);}
.corner .zoom .ico{width:15px;height:15px;}
.grid.zoomed .corner .zoom,.grid.canzoom .corner .zoom{display:inline-flex;}
.tc,.lc{display:flex;align-items:center;justify-content:center;background:var(--pp-ink);color:var(--pp);font:800 calc(var(--lg-lf) - 2px)/1 var(--np-sans);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;z-index:4;}
.tc{position:sticky;top:0;grid-row:1;border-right:2px solid var(--pp);}
.lc{position:sticky;left:0;grid-column:1;writing-mode:vertical-rl;transform:rotate(180deg);border-top:2px solid var(--pp);}
.tl,.ll{background:var(--pp);color:var(--pp-ink);font:600 var(--lg-lf2,var(--lg-lf))/1.05 var(--np-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;transition:background .15s,color .15s;}
.tl{position:sticky;top:var(--lg-ch);grid-row:2;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:flex-start;padding:5px 0;border-left:1px solid var(--rule);}
.ll{position:sticky;left:var(--lg-cw);grid-column:2;display:flex;align-items:center;justify-content:flex-end;padding:0 6px 0 4px;border-top:1px solid var(--rule);}
.tl.e0{border-left:0;}.ll.e0{border-top:0;}
.tl.hl,.ll.hl{background:var(--hl);color:#000;}
.c{position:relative;background:#fffdf7;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);cursor:pointer;touch-action:manipulation;}
.c.bl{border-left:2px solid var(--pp-ink);}.c.bt{border-top:2px solid var(--pp-ink);}
.c.br{border-right:2px solid var(--pp-ink);}.c.bb{border-bottom:2px solid var(--pp-ink);}
.c::before{content:"";position:absolute;inset:0;pointer-events:none;transition:background .15s;}
.c.xr::before{background:rgba(255,214,60,.16);}
.c.f::before{background:rgba(255,200,40,.42);}
.c svg{position:absolute;inset:14%;width:72%;height:72%;overflow:visible;pointer-events:none;}
.c svg path{fill:none;stroke-linecap:round;stroke-linejoin:round;}
.c .x path{stroke:var(--graphite);stroke-width:2.1;opacity:.88;}
.c .x path.g{stroke-width:.9;opacity:.35;}
.c.auto .x path{stroke:var(--lead);stroke-width:1.5;opacity:.65;}
.c.auto .x path.g{display:none;}
.c .ck path{stroke:var(--ink-blue);stroke-width:2.8;}
.c .ck path.g{stroke-width:1.1;opacity:.4;}
.c.hint .x path,.c.hint .ck path{stroke:var(--hint-ink);}
.c.new path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .16s ease-out forwards;}
.c.new path:nth-child(3),.c.new path:nth-child(4){animation-delay:.09s;}
.c.auto.new path{animation-duration:.12s;animation-delay:var(--dl,0s);}
@keyframes draw{to{stroke-dashoffset:0;}}
.c.erase::after{content:"";position:absolute;inset:18%;border-radius:40%;background:rgba(255,190,190,.0);animation:rub .3s ease-out;pointer-events:none;}
@keyframes rub{0%{background:rgba(214,170,170,.55);transform:scale(.6);}100%{background:rgba(214,170,170,0);transform:scale(1.1);}}
.c.bad::after{content:"";position:absolute;inset:6%;border:2px solid #d01b2a;border-radius:50%;animation:badpop .4s var(--spring) both;pointer-events:none;}
@keyframes badpop{from{transform:scale(1.8);opacity:0;}to{transform:none;opacity:1;}}
.c.ht::after{content:"";position:absolute;inset:-2px;border:3px solid var(--hint-ink);border-radius:5px;animation:ping 1.2s ease-out 2;pointer-events:none;z-index:2;}
.c.src::after{content:"";position:absolute;inset:1px;border:2px dashed var(--hint-ink);border-radius:4px;pointer-events:none;}
@keyframes ping{0%{transform:scale(1.5);opacity:0;}30%{transform:none;opacity:1;}100%{opacity:.85;}}
.grid.won .c.solve svg{animation:pop .5s var(--spring) both;animation-delay:var(--wd,0s);}
@keyframes pop{0%{transform:scale(.2);opacity:0;}100%{transform:none;opacity:1;}}
.grid.won .c.mck svg{animation:hop .6s ease both;animation-delay:var(--wd,0s);}
@keyframes hop{40%{transform:translateY(-22%) scale(1.25);}}

/* Hint note: a sticky note on the page */
.note{position:absolute;left:4px;right:4px;bottom:6px;z-index:8;display:none;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:3px;background:linear-gradient(180deg,#fff3a6,#ffe678);color:#3a3000;font-family:var(--hand);font-size:1.08rem;line-height:1.22;box-shadow:0 8px 16px rgba(0,0,0,.35);transform:rotate(-.5deg);cursor:pointer;}
.note.show{display:flex;animation:noteIn .35s var(--spring) both;}
@keyframes noteIn{from{transform:translateY(14px) rotate(2deg);opacity:0;}to{transform:rotate(-.5deg);opacity:1;}}
.note .ico{flex:none;width:21px;height:21px;color:#7a6200;margin-top:1px;}
.note.bad{background:linear-gradient(180deg,#ffd9d2,#ffc2b6);color:#5a0e0e;}.note.bad .ico{color:#a8202e;}

/* Tools: clean chrome */
.tools{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;border-radius:14px;background:var(--w07);color:var(--text-2);font-weight:800;font-size:.72rem;white-space:nowrap;transition:transform .12s var(--spring),background .15s;}
.tool .ico{width:22px;height:22px;}
.tool:active{transform:scale(.93);background:var(--w14);}
.tool:disabled{opacity:.35;}
.tool.redo .ico{transform:scaleX(-1);}
.tool.mode .mk{display:flex;align-items:center;gap:3px;height:22px;}
.tool.mode .mk svg{width:18px;height:18px;transition:opacity .2s,transform .2s var(--spring);}
.tool.mode .mk svg path{fill:none;stroke-linecap:round;stroke-linejoin:round;}
.tool.mode .mk .a{width:9px;height:9px;opacity:.6;}
.tool.mode .mk .off{opacity:.22;transform:scale(.8);}
.tool.mode.m1,.tool.mode.m2{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text);}

/* Clues and answers: a second sheet */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:6px;color:var(--pp-ink);
  background:linear-gradient(180deg,#fffdf6,var(--pp));box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 26px rgba(0,0,0,.42);overflow:hidden;}
.tabs{flex:none;display:flex;border-bottom:1.5px solid var(--pp-ink);margin:0 10px;}
.tabs button{flex:1;border:0;background:none;padding:9px 4px 7px;font:700 .82rem var(--np-serif);letter-spacing:.12em;text-transform:uppercase;color:var(--pp-dim);position:relative;}
.tabs button.on{color:var(--pp-ink);}
.tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1.5px;height:4px;background:var(--pp-ink);}
.tabs b{display:inline-block;min-width:1.6em;margin-left:4px;padding:1px 5px;border-radius:999px;background:rgba(0,0,0,.08);font:700 .72rem var(--np-sans);letter-spacing:0;}
.tabs b.bump{animation:bump .4s var(--spring);}
@keyframes bump{40%{transform:scale(1.4);background:var(--hl);}}
.pbody::-webkit-scrollbar{width:4px;}.pbody::-webkit-scrollbar-track{background:transparent;}.pbody::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:2px;}
.pbody{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.18) transparent;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 14px 14px;}
.sec[hidden]{display:none;}
.story{font-family:var(--np-serif);font-style:italic;font-size:.95rem;line-height:1.4;color:#3b372e;margin:0 0 10px;}
.story::first-letter{float:left;font-style:normal;font-weight:700;font-size:2.6em;line-height:.85;margin:3px 6px 0 0;color:var(--pp-ink);}
.sh{font:700 .74rem var(--np-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--pp-dim);margin:4px 0 6px;display:flex;align-items:center;gap:8px;}
.sh::after{content:"";flex:1;height:1px;background:var(--rule);}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
.cl{display:flex;gap:8px;padding:6px 6px;border-radius:6px;font-family:var(--np-serif);font-size:.98rem;line-height:1.36;cursor:pointer;-webkit-user-select:none;user-select:none;transition:background .15s;}
.cl:active{background:rgba(0,0,0,.05);}
.cl b{flex:none;min-width:1.4em;text-align:right;font-weight:700;}
.cl .tx{background:linear-gradient(var(--graphite),var(--graphite)) no-repeat 0 55%/0% 1.6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .35s ease-out,color .3s;}
.cl.done .tx{background-size:100% 1.6px;color:#8d877a;}
.cl.done b{color:#a39d90;}
.cl.hl .tx{background:linear-gradient(transparent 12%,rgba(255,226,80,.9) 12%,rgba(255,226,80,.9) 88%,transparent 88%) no-repeat 0 0/100% 100%;animation:marker .5s ease-out;}
@keyframes marker{from{background-size:0% 100%;}}
.ans{width:100%;border-collapse:collapse;font-family:var(--np-sans);font-size:.86rem;margin-top:2px;}
.ans th{font:800 .66rem var(--np-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--pp-dim);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--pp-ink);}
.ans td,.ans tbody th{padding:6px 6px;border-bottom:1px solid var(--rule);text-align:left;}
.ans tbody th{font:700 .9rem var(--np-serif);color:var(--pp-ink);letter-spacing:0;text-transform:none;white-space:nowrap;}
.ans td span{font-family:var(--hand);font-size:1.12rem;color:var(--ink-blue);display:inline-block;line-height:1;}
.ans td span.inf{color:var(--lead);}
.ans td span.wr{animation:writeIn .35s ease-out;}
@keyframes writeIn{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}
.ans tr.row-on td,.ans tr.row-on th{background:rgba(61,180,110,.16);transition:background .3s;}
.ansbox{position:relative;}
.stamp{position:absolute;right:4px;top:50%;z-index:2;padding:4px 12px;border:3px solid #c3182b;border-radius:6px;color:#c3182b;font:900 1.35rem var(--np-sans);letter-spacing:.14em;text-transform:uppercase;transform:translateY(-50%) rotate(-12deg);opacity:0;pointer-events:none;mix-blend-mode:multiply;}
.stamp small{display:block;font:800 .62rem var(--np-sans);letter-spacing:.1em;text-align:center;}
.stamp.on{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards;}
@keyframes stamp{0%{opacity:0;transform:translateY(-50%) rotate(-12deg) scale(2.4);}60%{opacity:.95;transform:translateY(-50%) rotate(-12deg) scale(.94);}100%{opacity:.9;transform:translateY(-50%) rotate(-12deg) scale(1);}}

/* Wide screens: page on the left, clues beside it */
.lg.wide{max-width:1320px;}
.lg.wide .play{display:grid;grid-template-columns:minmax(0,max-content) minmax(300px,400px);justify-content:center;grid-template-rows:auto auto 1fr;column-gap:22px;row-gap:12px;align-items:start;}
.lg.wide .page{grid-column:1;grid-row:1;justify-self:center;}
.lg.wide .tools{grid-column:1;grid-row:2;width:100%;max-width:460px;justify-self:center;}
.lg.wide .panel{grid-column:2;grid-row:1/4;align-self:stretch;}
.lg.wide .tabs{display:none;}
.lg.wide .sec[hidden]{display:block;}
.lg.wide #secA{margin-top:14px;}
@media (min-width:700px){ .tool{min-height:58px;font-size:.78rem;} .cl{font-size:1.04rem;} .story{font-size:1rem;} }
.mini-best td,.mini-best th{padding:6px 8px;}
.numin{width:100%;min-height:52px;border-radius:14px;border:0;background:var(--w08);color:var(--text);font:800 1.4rem var(--font);text-align:center;}
</style>
</head>
<body>
<main class="lg" id="app"></main>
<script>
// ==ENGINE==
// Logic grid engine: themes, a generator that only prints puzzles with one answer, a solver that
// works the way people do (and grades by the hardest step it needed), clue wording and hints.
var LG = (function () {
  'use strict';
  // ── Seeded random ──────────────────────────────────────────────────────
  function rng(seed) {
    var a = seed >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function hash(s) { s = String(s); var h = 2166136261 >>> 0; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
  function ri(R, n) { return Math.floor(R() * n); }
  function pick(a, R) { return a[ri(R, a.length)]; }
  function shuffle(a, R) { for (var i = a.length - 1; i > 0; i--) { var j = ri(R, i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  var NUMW = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
  function words(d, one, many) { return (d <= 10 ? NUMW[d] : String(d)) + ' ' + (d === 1 ? one : many); }

  // ── Formatters for ordered categories ──────────────────────────────────
  function clock(m) { var h = Math.floor(m / 60) % 12 || 12, mm = m % 60; return h + ':' + (mm < 10 ? '0' : '') + mm; }
  function mins(d) { return d === 60 ? 'an hour' : d === 120 ? 'two hours' : d === 90 ? 'an hour and a half' : d === 30 ? 'half an hour' : d === 180 ? 'three hours' : d + ' minutes'; }
  function money(c) { return '$' + (c % 100 ? (c / 100).toFixed(2) : String(c / 100)); }
  function moneyD(c) { return c < 100 ? c + ' cents' : money(c); }
  function nth(n) { var s = n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th'; return n + s; }
  var DAYS = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  var MONTHS = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  // ── Category builders ──────────────────────────────────────────────────
  // A category: n (grid heading), s/sp (noun, plural), items (pool), and phrase templates where
  // {x} is the item and {ax} is the item with "a"/"an":
  //   np: the person described by it ("the dog owner"), is / no: said of someone ("owns the dog")
  //   st: the story line ("adopted a different pet")
  // Ordered categories add o: {vals, steps, exact, fmt, g (grid label), df (difference words),
  //   gt, lt, gtd, ltd (comparisons, {d} = difference), nx (next to), noD (no exact differences)}
  function C(id, n, s, items, np, is, no, st, x) {
    var c = { id: id, n: n, s: s, sp: s + 's', items: items, np: np, is: is, no: no, st: st };
    if (x) for (var k in x) c[k] = x[k];
    return c;
  }
  function O(id, n, s, o, np, is, no, st, x) { var c = C(id, n, s, null, np, is, no, st, x); c.o = o; return c; }
  function AGE(lo, hi, x) {
    return O('age', 'Age', 'age', { vals: range(hi - lo + 1).map(function (i) { return lo + i; }), steps: [1, 2], fmt: String, df: function (d) { return words(d, 'year', 'years'); },
      gt: 'is older than', lt: 'is younger than', gtd: 'is {d} older than', ltd: 'is {d} younger than' },
      'the {x}-year-old', 'is {x}', "isn't {x}", 'is a different age', x);
  }
  function TIME(id, n, lo, hi, steps, verb, o) {
    // verb: {is:'arrived at', no:"didn't arrive at", np:'the {x} arrival', gt:'arrived later than', lt:'arrived earlier than', gtd:'arrived {d} after', ltd:'arrived {d} before', st}
    var v = []; for (var m = lo; m <= hi; m += 15) v.push(m);
    return O(id, n, 'time', { vals: v, steps: steps, fmt: clock, df: mins, gt: verb.gt, lt: verb.lt, gtd: verb.gtd, ltd: verb.ltd, base: 15 }, verb.np, verb.is, verb.no, verb.st, o);
  }
  function PLACE(np, is, no, st, gt, lt, gtd, ltd, x) {
    return O('place', 'Place', 'place', { vals: [1, 2, 3, 4, 5], exact: true, steps: [1], fmt: nth, df: function (d) { return words(d, 'place', 'places'); }, gt: gt, lt: lt, gtd: gtd, ltd: ltd },
      np, is, no, st, x);
  }
  function WEEKDAY(id, n, verb) {
    return O(id, n, 'day', { vals: [1, 2, 3, 4, 5, 6, 7], steps: [1], fmt: function (v) { return DAYS[v]; }, g: function (v) { return DAYS[v].slice(0, 3); }, df: function (d) { return words(d, 'day', 'days'); },
      gt: verb.gt, lt: verb.lt, gtd: verb.gtd, ltd: verb.ltd, nx: verb.nx }, verb.np, verb.is, verb.no, verb.st);
  }
  function MONTH(verb) {
    return O('month', 'Month', 'month', { vals: range(12).map(function (i) { return i + 1; }), steps: [1, 2], fmt: function (v) { return MONTHS[v]; }, g: function (v) { return MONTHS[v].slice(0, 3); }, df: function (d) { return words(d, 'month', 'months'); },
      gt: verb.gt, lt: verb.lt, gtd: verb.gtd, ltd: verb.ltd }, verb.np, verb.is, verb.no, verb.st);
  }

      longT = setTimeout(function () {
        if (!press) return;
        if (curCs < minTap && !zoomCs) return;
        longFired = true; Kit.haptic('heavy'); mark(press.ref, 'check'); press = null;
      }, 430);
    });
    gridEl.addEventListener('pointermove', function (e) { if (press && Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) > 10) { press = null; clearTimeout(longT); } });
    gridEl.addEventListener('pointerup', function () { clearTimeout(longT); });
    gridEl.addEventListener('pointercancel', function () { press = null; clearTimeout(longT); });
    gview.addEventListener('scroll', function () { press = null; clearTimeout(longT); }, { passive: true });
    gridEl.addEventListener('contextmenu', function (e) {
      var c = e.target.closest && e.target.closest('.c'); e.preventDefault();
      if (c && !longFired && S && !S.done && e.pointerType !== 'touch' && !('ontouchstart' in window)) mark(c._ref, 'check');
    });
    gridEl.addEventListener('click', function (e) {
      var c = e.target.closest && e.target.closest('.c'); if (!c) return;
      if (longFired) { longFired = false; return; }
      press = null;
      // too small to aim at: the first tap zooms in on that spot
      if (curCs < minTap && !zoomCs) { focus = c._ref; Kit.sfx('whoosh', 0.6); zoomToCell(c._ref, Math.max(34, minTap + 10)); render(); return; }
      mark(c._ref, ['cycle', 'x', 'check'][opts.mode]);
    });
    // pinch to zoom
    var pinch = null;
    gview.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 2) return;
      var a = e.touches[0], b = e.touches[1], r = gview.getBoundingClientRect();
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), cs: curCs, cx: (a.clientX + b.clientX) / 2 - r.left, cy: (a.clientY + b.clientY) / 2 - r.top };
      press = null; clearTimeout(longT);
    }, { passive: true });
    gview.addEventListener('touchmove', function (e) {
      if (!pinch || e.touches.length !== 2) return;
      e.preventDefault();
      var a = e.touches[0], b = e.touches[1], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      var cs = Math.max(fitCs, Math.min(52, Math.round(pinch.cs * d / pinch.d)));
      if (cs !== curCs) setZoom(cs, pinch.cx, pinch.cy);
    }, { passive: false });
    gview.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinch = null; });
    // ctrl/cmd + wheel zooms on a computer
    gview.addEventListener('wheel', function (e) {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      var r = gview.getBoundingClientRect();
      setZoom(Math.max(fitCs, Math.min(52, Math.round(curCs * (e.deltaY < 0 ? 1.12 : 0.89)))), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    paintMode();
  }
  var resizeT = 0;
  window.addEventListener('resize', function () { clearTimeout(resizeT); resizeT = setTimeout(function () { if (gridEl && S && document.body.contains(gridEl)) layout(); }, 80); });

  // ── Drawing ───────────────────────────────────────────────────────────────
  // pencil strokes: a few hand-drawn variants, picked per square so the page doesn't look stamped
  function jit(seed, s) { var x = Math.sin(seed * 12.9898 + s * 78.233) * 43758.5453; return (x - Math.floor(x)) - 0.5; }
  function xSvg(seed) {
    var j = function (s, amt) { return (jit(seed, s) * amt).toFixed(2); };
    var p1 = 'M' + (4 + +j(1, 1.6)) + ' ' + (4.5 + +j(2, 1.6)) + 'Q10 ' + (10 + +j(3, 1.8)) + ' ' + (15.5 + +j(4, 1.4)) + ' ' + (15.2 + +j(5, 1.4));
    var p2 = 'M' + (15.6 + +j(6, 1.4)) + ' ' + (4.4 + +j(7, 1.6)) + 'Q' + (10 + +j(8, 1.8)) + ' 10 ' + (4.4 + +j(9, 1.4)) + ' ' + (15.6 + +j(10, 1.4));
    return '<svg class="x" viewBox="0 0 20 20"><path pathLength="1" d="' + p1 + '"/><path pathLength="1" class="g" d="' + p1 + '" transform="translate(.5 .3)"/><path pathLength="1" d="' + p2 + '"/><path pathLength="1" class="g" d="' + p2 + '" transform="translate(-.4 .4)"/></svg>';
  }
  function cSvg(seed) {
    var j = function (s, amt) { return (jit(seed, s) * amt).toFixed(2); };
    var p = 'M' + (3.4 + +j(1, 1)) + ' ' + (10.6 + +j(2, 1.2)) + 'Q6 ' + (12.6 + +j(3, .8)) + ' 8 ' + (15.4 + +j(4, .8)) + 'Q11.5 ' + (8 + +j(5, 1.4)) + ' ' + (16.8 + +j(6, 1)) + ' ' + (3.6 + +j(7, 1.2));
    return '<svg class="ck" viewBox="0 0 20 20"><path pathLength="1" d="' + p + '"/><path pathLength="1" class="g" d="' + p + '" transform="translate(.5 .4)"/></svg>';
  }
  function render(all) {
    if (!S || !cells.length) return;
    var fr = focus;
    cells.forEach(function (ref) {
      var v = mk(ref.a, ref.i, ref.b, ref.j), auto = !v && autoBy(ref.a, ref.i, ref.b, ref.j);
      var show = v === 2 ? 'c' : v === 1 ? (solveX[ref.k] ? 'a' : 'x') : auto ? 'a' : '';
      var cls = 'c' + (ref.j === 0 ? ' bl' : '') + (ref.i === 0 ? ' bt' : '') + (ref.j === P.n - 1 ? ' br' : '') + (ref.i === P.n - 1 ? ' bb' : '');
      if (show === 'a') cls += ' auto';
      if (S.hd[ref.k] && v) cls += ' hint';
      if (fr && !S.done) {
        if (ref === fr) cls += ' f';
        else if ((ref.a === fr.a && ref.i === fr.i && ref.rb === fr.rb) || (ref.b === fr.b && ref.j === fr.j && ref.cb === fr.cb)) cls += ' xr';
      }
      if (badSet[ref.k]) cls += ' bad';
      if (hintAt === ref.k) cls += ' ht';
      if (srcAt.indexOf(ref.k) >= 0) cls += ' src';
      var isNew = fresh[ref.k] || (show === 'a' && ref.el._k !== 'a' && !all);
      if (isNew && show) cls += ' new';
      if (show === 'a' && isNew && fr) { var dist = Math.abs(ref.i - fr.i) + Math.abs(ref.j - fr.j); ref.el.style.setProperty('--dl', (dist * 0.045).toFixed(3) + 's'); }
      ref.el.className = cls;
      if (ref.el._k !== show || fresh[ref.k]) {
        ref.el._k = show;
        if (show === 'c') ref.el.innerHTML = cSvg(ref.k);
        else if (show) ref.el.innerHTML = xSvg(ref.k);
        else { if (ref.el.innerHTML && !all) { ref.el.classList.add('erase'); } ref.el.innerHTML = ''; }
      }
      ref.el.setAttribute('aria-label', LG.word(P, ref.a, ref.i) + ' and ' + LG.word(P, ref.b, ref.j) + (show === 'c' ? ': check' : show ? ': X' : ''));
    });
    fresh = {};
    // labels for the square in focus
    tlEls.forEach(function (t) { t.el.classList.toggle('hl', !!fr && !S.done && t.c === fr.b && t.j === fr.j); });
    llEls.forEach(function (t) { t.el.classList.toggle('hl', !!fr && !S.done && t.c === fr.a && t.i === fr.i); });
    renderAnswers(all);
    if (toolEls.undo) { toolEls.undo.disabled = !U.length || S.done; toolEls.redo.disabled = !R.length || S.done; toolEls.hint.disabled = toolEls.check.disabled = S.done; }
  }
  // the answer table: your checks against the first group, and what they give through other boxes (lighter)
  function answerOf(p, c) {
    var n = P.n, x;
    for (x = 0; x < n; x++) if (mk(0, p, c, x) === 2) return { x: x, d: true };
    for (var b = 1; b < P.k; b++) {
      if (b === c) continue;
      for (var j = 0; j < n; j++) if (mk(0, p, b, j) === 2) for (x = 0; x < n; x++) if (mk(b, j, c, x) === 2) return { x: x, d: false };
    }
    return null;
  }
  var ansPrev = {};
  function renderAnswers(all) {
    var cnt = 0, tot = 0;
    ansCells.forEach(function (row, p) {
      row.td.forEach(function (td, ci) {
        var c = ci + 1, a = S.done ? { x: P.itemOf[c][p], d: true } : answerOf(p, c), kk = p + ':' + c, sig = a ? a.x + (a.d ? 'd' : 'i') : '';
        tot++; if (a && a.d) cnt++;
        if (ansPrev[kk] === sig && !all) return;
        var was = ansPrev[kk]; ansPrev[kk] = sig;
        td.innerHTML = a ? '<span class="' + (a.d ? '' : 'inf') + (all || was === sig ? '' : ' wr') + '">' + Kit.esc(LG.label(P, c, a.x)) + '</span>' : '';
      });
    });
    var nEl = document.getElementById('ansN'); if (nEl) nEl.textContent = cnt + '/' + tot;
  }

  // ── Finishing ─────────────────────────────────────────────────────────────
  function answerFull() {
    var k = P.k, n = P.n, G = effective(), ok = true, full = true;
    for (var c = 1; c < k; c++) for (var p = 0; p < n; p++) {
      var yes = -1, open = 0;
      for (var x = 0; x < n; x++) { var g = LG.get(P, G, 0, p, c, x); if (g === 1) yes = x; if (g === 0) { open++; if (yes < 0) yes = yes; } }
      var pickX = yes;
      if (pickX < 0 && open === 1) for (x = 0; x < n; x++) if (LG.get(P, G, 0, p, c, x) === 0) pickX = x;
      if (pickX < 0) { full = false; continue; }
      if (P.itemOf[c][p] !== pickX) ok = false;
    }
    return { full: full, ok: ok };
  }
  var warned = false;
  function checkSolved() {
    if (!S || S.done) return;
    var r = answerFull();
    if (r.full && r.ok) solved();
    else if (r.full && !warned) { warned = true; Kit.sfx('bad'); note('The answer table is full, but something in it is wrong. Tap Check to see which marks.', true); }
    else if (!r.full) warned = false;
  }
  function solved() {
    S.done = true; stopClock(); hideNote();
    var prev = bestTime(S.lv), clean = !S.hints, best = clean && (!prev || S.time < prev);
    // fill every square with the answer, in a wave from the top left
    var k = P.k, n = P.n;
    var newM = S.m.split('');
    cells.forEach(function (ref) {
      var t = LG.truth(P, ref.a, ref.i, ref.b, ref.j), x = key(ref.a, ref.i, ref.b, ref.j);
      var cur = +S.m.charAt(x);
      ref.el.style.setProperty('--wd', ((ref.r + ref.col) * 0.022).toFixed(3) + 's');
      if (t === 1 && cur !== 2) { newM[x] = '2'; ref.solve = true; }
      else if (t === -1 && cur !== 1 && !autoBy(ref.a, ref.i, ref.b, ref.j)) { newM[x] = '1'; ref.solve = true; solveX[x] = 1; }
    });
    S.m = newM.join('');
    focus = null; clearFlags();
    render(true);
    cells.forEach(function (ref) { if (ref.solve) ref.el.classList.add('solve'); if (mk(ref.a, ref.i, ref.b, ref.j) === 2) ref.el.classList.add('mck'); });
    gridEl.classList.add('won');
    Kit.sfx('sparkle'); Kit.haptic('success');
    var lvn = lvName(S.lv), hl = [];
    hl.push('Solved ' + (S.daily ? 'the daily ' : 'a ') + lvn + ' logic grid in ' + fmt(S.time) + (S.hints ? ' with ' + S.hints + (S.hints === 1 ? ' hint' : ' hints') : ' with no hints'));
    hl.push(LG.theme(P).title + ', puzzle No. ' + S.no);
    if (best && prev) hl.push('New best ' + lvn + ' time (old best ' + fmt(prev) + ')');
    else if (best) hl.push('First ' + lvn + ' puzzle solved without hints');
    if (S.checks) hl.push('Checked for mistakes ' + (S.checks === 1 ? 'once' : S.checks + ' times'));
    Kit.record(HKEY, {
      started: S.started, mode: label(), players: [{ name: 'You' }], winner: 'You',
      summary: lvn + ' · solved in ' + fmt(S.time), badge: fmt(S.time), highlights: hl.slice(0, 6),
      meta: { lv: S.lv, seconds: S.time, hints: S.hints, checks: S.checks, wrong: S.wrong, daily: S.daily, no: S.no, th: P.th },
      detail: histDetail()
    });
    clearSave(); save();
    // the answers fill in row by row, then the stamp
    setTimeout(function () {
      if (!isWide()) setTab('a');
      ansPrev = {}; renderAnswers(false);
      ansCells.forEach(function (row, p) { setTimeout(function () { row.tr.classList.add('row-on'); pencil('soft'); Kit.sfx('tick', 0.6); }, 160 * p); });
      setTimeout(function () {
        var st = document.getElementById('stamp'), stT = document.getElementById('stampT');
        if (stT) stT.textContent = fmt(S.time);
        if (st) st.classList.add('on');
        Kit.sfx('boom', 0.5); Kit.haptic('heavy');
        Kit.callout(best ? 'New best!' : 'Solved!');
      }, 160 * n + 250);
      setTimeout(function () {
        var lv = S.lv;
        Kit.win({
          title: 'Solved!', sub: lvn + (S.daily ? ' daily' : '') + ' in ' + fmt(S.time) + (best && prev ? ' · new best time' : '') + (S.hints ? ' · ' + S.hints + (S.hints === 1 ? ' hint' : ' hints') : ''),
          againLabel: 'Another ' + LV[lv] + ' puzzle', again: function () { newPuzzle(lv, 0, false); },
          extra: [{ label: 'Look at the grid', onClick: function () {} }, { label: 'Choose a level', onClick: showSetup }]
        });
      }, 160 * n + 1700);
    }, 700);
  }
  function histDetail() {
    var rows = [];
    for (var p = 0; p < P.n; p++) { var r = [LG.label(P, 0, p)]; for (var c = 1; c < P.k; c++) r.push(LG.label(P, c, P.itemOf[c][p])); rows.push(r.join('|')); }
    var cats = []; for (var c2 = 0; c2 < P.k; c2++) cats.push(LG.catDef(P, c2).n);
    return { t: LG.theme(P).title, lv: S.lv, no: S.no, d: S.daily || 0, h: cats.join('|'), a: rows, cl: P.clues.length, hi: S.hints, ck: S.checks, w: S.wrong };
  }
  function showBests() {
    var rows = ['easy', 'medium', 'hard', 'hard5'].map(function (l) {
      var all = hist().filter(function (e) { return e && e.lv === l; }), b = bestTime(l);
      return '<tr><td>' + lvName(l) + '</td><td>' + all.length + '</td><td>' + (b ? fmt(b) : '–') + '</td></tr>';
    }).join('');
    Kit.sheet({ title: 'Best times', html: '<p class="muted" style="margin-bottom:10px">Fastest solves without hints, from your past games.</p><table style="width:100%;border-collapse:collapse;font-weight:800" class="k-hd-rounds mini-best"><tr><th>Level</th><th>Solved</th><th>Best</th></tr>' + rows + '</table>', actions: [{ label: 'Close', cls: 'btn-soft' }] });
  }

  // ── Keyboard ──────────────────────────────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    if (!S || S.done || document.querySelector('.k-scrim,.k-win') || !cells.length) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var kk = e.key.toLowerCase();
    if (kk === 'h') { hint(); return; }
    if (!focus) { if (/^arrow/.test(kk)) { focus = cells[0]; render(); e.preventDefault(); } return; }
    if (kk === 'x' || kk === ' ') { e.preventDefault(); mark(focus, 'x'); return; }
    if (kk === 'c' || kk === 'enter' || kk === 'v') { e.preventDefault(); mark(focus, 'check'); return; }
    if (kk === 'backspace' || kk === 'delete') { var v = mk(focus.a, focus.i, focus.b, focus.j); if (v) mark(focus, v === 2 ? 'check' : 'x'); return; }
    var d = { arrowup: [-1, 0], arrowdown: [1, 0], arrowleft: [0, -1], arrowright: [0, 1] }[kk];
    if (d) {
      e.preventDefault();
      var r = focus.r + d[0], c = focus.col + d[1];
      var nx = cells.filter(function (x) { return x.r === r && x.col === c; })[0];
      if (nx) { focus = nx; render(); showCell(nx); }
    }
  });

  // Test hook
  window.__lg = { get: function () { return S; }, P: function () { return P; }, LG: LG,
    solveTo: function (leave) { // fill the answer, leaving `leave` anchor checks off
      var n = 0;
      for (var c = 1; c < P.k; c++) for (var p = 0; p < P.n; p++) { if (n++ < (leave || 0)) continue; setMk(0, p, c, P.itemOf[c][p], 2); }
      render(true); save();
    },
    finish: function () { for (var c = 1; c < P.k; c++) for (var p = 0; p < P.n; p++) if (mk(0, p, c, P.itemOf[c][p]) !== 2) { mark(cellRef(0, p, c, P.itemOf[c][p]), 'check'); return true; } return false; },
    mark: function (a, i, b, j, how) { mark(cellRef(a, i, b, j), how || 'cycle'); }, layout: layout, zoom: function (cs) { setZoom(cs); } };

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  var going = saved && saved.S && saved.S.P && typeof saved.S.m === 'string' && !saved.S.done && LG.theme(saved.S.P);
  function resumeSaved() { S = saved.S; U = saved.U || []; R = saved.R || []; document.body.classList.add('playing'); build(); }
  if (/[?&]daily=1/.test(location.search)) {
    try { history.replaceState(history.state, '', location.pathname + location.search.replace(/([?&])daily=1&?/, '$1').replace(/[?&]$/, '') + location.hash); } catch (e) {}
    if (going && saved.S.daily === today()) resumeSaved();
    else if (dailyDone()) showSetup();
    else if (going && saved.S.time > 5) Kit.confirm("Start today's daily?", { ok: 'Start daily', cancel: 'Keep playing', body: 'The ' + lvName(saved.S.lv) + ' puzzle you have going will be dropped.' }).then(function (ok) { if (ok) newPuzzle(DAILY_LV[new Date().getDay()], today(), true); else resumeSaved(); });
    else newPuzzle(DAILY_LV[new Date().getDay()], today(), true);
  } else if (going) resumeSaved();
  else showSetup();
})();
</script>

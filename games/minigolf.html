<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Golf</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* Course picker on the setup screen */
.course{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:var(--r);background:var(--w06);color:var(--text);text-align:left;}
.course:active{transform:scale(.98);}
.course .pin{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);flex:none;}
.course .pin .ico{width:22px;height:22px;}
.course b{display:block;font-weight:900;}
.course small{display:block;color:var(--text-3);font-weight:700;font-size:.82rem;}
.csearch{display:flex;gap:8px;}
.csearch .input{flex:1;}
.cres{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:46vh;overflow:auto;}
.cres button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:var(--r);background:var(--w06);color:var(--text);text-align:left;}
.cres button:active{background:var(--w12);}
.cres b{display:block;font-weight:800;}
.cres small{display:block;color:var(--text-3);font-weight:600;font-size:.8rem;}
.cres .d{margin-left:auto;font-weight:800;color:var(--text-3);font-size:.8rem;white-space:nowrap;}
.cres .ico{width:20px;height:20px;}
.cnote{color:var(--text-3);font-weight:700;font-size:.85rem;text-align:center;padding:10px;}
.csec{font-size:.75rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:12px 0 2px;}

/* The green: current hole */
.green{position:relative;border-radius:26px;padding:8px;margin-bottom:14px;}
.green .turf{position:relative;border-radius:19px;padding:16px 14px 14px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 22px, rgba(0,0,0,.04) 22px 44px),
    radial-gradient(120% 90% at 50% 20%, #34c46a 0%, #1f9a4f 60%, #167a3d 100%);
  box-shadow:inset 0 6px 18px rgba(0,0,0,.35);}
.hole-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#fff;}
.hole-h .num{font-family:var(--display);font-size:2.2rem;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25);}
.hole-h .num small{font-family:var(--font);font-size:.8rem;font-weight:900;letter-spacing:.1em;opacity:.8;display:block;}
.hole-l{display:flex;align-items:flex-end;gap:8px;}
.flag{display:block;width:30px;height:44px;flex:none;}
.flag svg{width:100%;height:100%;}
.parbtn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:0;border-radius:999px;background:rgba(0,0,0,.25);color:#fff;font-weight:900;}
.parbtn .ico{width:14px;height:14px;opacity:.8;}
.prow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:16px;background:rgba(255,255,255,.92);color:#1d1b2e;margin-top:8px;box-shadow:0 3px 0 rgba(0,0,0,.15);}
.prow .nm{flex:1;min-width:0;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prow .nm small{display:block;font-weight:700;font-size:.75rem;color:#6a6a80;}
.prow .stk{display:flex;align-items:center;gap:6px;}
.prow .stk button{width:44px;height:44px;border:0;border-radius:14px;background:#ece7f8;color:#2a2050;font-size:1.4rem;font-weight:900;}
.prow .stk button:active{transform:scale(.9);}
.prow .stk output{width:46px;text-align:center;font-family:var(--hand);font-size:2rem;color:var(--ink);line-height:1;}
.prow .stk output.empty{color:#b9b4cc;}
.prow.ace{box-shadow:0 0 0 3px var(--yellow),0 3px 0 rgba(0,0,0,.15);}
.holenav{display:flex;gap:10px;margin-top:12px;}
.holenav .btn:last-child{flex:1;}

/* Paper scorecard */
.card{border-radius:8px 8px 14px 14px;overflow:hidden;background:linear-gradient(180deg,#fffaf0,#f6eedb);color:#2a2a3a;box-shadow:0 16px 34px rgba(0,0,0,.45);}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px 8px;border-bottom:3px double #1f9a4f;}
.card-h h2{font-family:var(--display);font-weight:400;font-size:1.35rem;color:#1f7a3f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-h small{font-family:var(--hand);font-size:1rem;color:#6a6a80;white-space:nowrap;}
.scroll{overflow-x:auto;}
table.sc{border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums;}
.sc th,.sc td{height:38px;min-width:34px;text-align:center;border-bottom:1px solid rgba(60,80,160,.15);border-left:1px solid rgba(31,122,63,.15);padding:0 4px;}
.sc th:first-child{position:sticky;left:0;background:#fbf5e8;text-align:left;padding-left:10px;min-width:84px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900;z-index:1;}
.sc thead th{font-size:.72rem;font-weight:900;color:#1f7a3f;}
.sc thead th.cur{background:rgba(255,220,60,.4);}
.sc tr.par td{font-size:.8rem;font-weight:800;color:#8a8796;}
.sc td.v{font-family:var(--hand);font-size:1.3rem;color:var(--ink);cursor:pointer;}
.sc td.v.cur{background:rgba(255,220,60,.25);}
.sc td.v.ace{color:#c8102e;font-weight:700;}
.sc td.tot{font-family:var(--hand);font-size:1.4rem;font-weight:700;background:rgba(31,122,63,.07);}
.sc td.tot small{display:block;font-family:var(--font);font-size:.7rem;font-weight:800;line-height:1;}
.under{color:#15803d;} .over{color:#c8102e;} .even{color:#8a8796;}
.recs{display:flex;flex-direction:column;gap:8px;}
.rec{padding:12px 14px;border-radius:var(--r);background:var(--w05);}
.rec b{display:block;font-weight:900;}
.rec small{display:block;color:var(--text-3);font-weight:700;}
.rec .best{margin-top:6px;font-weight:800;color:var(--text-2);font-size:.9rem;}
/* Tablets: bigger rows and steppers on the green */
@media (min-width:700px) and (min-height:700px){
  .hole-h .num{font-size:2.8rem;}
  .prow{padding:12px 12px 12px 14px;margin-top:10px;}
  .prow .nm{font-size:1.2rem;}
  .prow .nm small{font-size:.85rem;}
  .prow .stk{gap:10px;}
  .prow .stk button{width:56px;height:56px;font-size:1.7rem;}
  .prow .stk output{width:56px;font-size:2.5rem;}
  .holenav .btn{min-height:60px;font-size:1.15rem;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'mg_state', KEY = 'mg';
  var PIN = '<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  var LOC = '<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 22 2l-9 19-2-8z"/></svg>';

  Kit.init({
    id: 'minigolf',
    onNew: function () { clearSave(); showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'trophy', label: 'Courses & records', onClick: function () { showCourses(); } },
      { icon: 'history', label: 'Past rounds', onClick: function () { Kit.history(KEY, { title: 'Mini Golf: past rounds' }); } }
    ],
    rules:
      '<p class="goal">Keep score for a real round of mini golf. <b>Fewest strokes wins.</b></p>' +
      '<h3>How it works</h3><ul><li>Pick where you\'re playing: type the name, search the map, or find courses near you. If the place has several courses (Pirate, Jungle and so on), pick which one. Records are kept for each course.</li>' +
      '<li>On each hole, tap + for every stroke a player takes. Tap Next hole when everyone is in.</li>' +
      '<li>Tap the par to change it. Pars are remembered for that course next time.</li></ul>' +
      '<h3>Common house rules</h3><ul><li><b>Stroke limit:</b> most courses cap a hole at 6 strokes. You can turn the cap off in setup.</li>' +
      '<li>A ball that leaves the course goes back where it left, with a 1-stroke penalty.</li><li>A <b>hole in one</b> gets a celebration.</li></ul>'
  });

  // ── Courses ───────────────────────────────────────────────────────────────
  // A course is {key, name, place, lat, lon}. key is 'osm:node/123' for real
  // OpenStreetMap places or 'custom:<name>' for typed-in names. Courses you've
  // played come from history (which syncs), plus a local recent list.
  function localCourses() { try { return JSON.parse(localStorage.getItem('mg_courses') || '[]'); } catch (e) { return []; } }
  function rememberCourse(c) {
    var list = localCourses().filter(function (x) { return x.key !== c.key; });
    list.unshift(c); localStorage.setItem('mg_courses', JSON.stringify(list.slice(0, 20)));
  }
  function playedCourses() {
    var seen = {}, out = [];
    function add(c) { if (c && c.key && !seen[c.key]) { seen[c.key] = 1; out.push(c); } }
    localCourses().forEach(add);
    try { GameHistory.load(KEY).forEach(function (e) { add(e.course); }); } catch (e) {}
    return out;
  }
  function parsFor(c, holes) {
    var p = null; try { p = JSON.parse(localStorage.getItem('mg_par_' + (c ? c.key : 'none'))); } catch (e) {}
    if (!p && c) try { var h = GameHistory.load(KEY).filter(function (e) { return e.course && e.course.key === c.key && e.par; })[0]; if (h) p = h.par; } catch (e) {}
    var out = []; for (var i = 0; i < holes; i++) out.push((p && p[i]) || 2);
    return out;
  }
  function savePars() { if (S.course) localStorage.setItem('mg_par_' + S.course.key, JSON.stringify(S.par)); }
  function km(a, b) {
    if (!a || !b || a.lat == null || b.lat == null) return null;
    var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLon = (b.lon - a.lon) * Math.PI / 180;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function dist(d) { if (d == null) return ''; var mi = d * 0.621371; return mi < 10 ? mi.toFixed(1) + ' mi' : Math.round(mi) + ' mi'; }
  var here = null;

  // OpenStreetMap: courses tagged leisure=miniature_golf near a point.
  function searchNear(lat, lon) {
    var q = '[out:json][timeout:20];(node["leisure"="miniature_golf"](around:40000,' + lat + ',' + lon + ');way["leisure"="miniature_golf"](around:40000,' + lat + ',' + lon + ');relation["leisure"="miniature_golf"](around:40000,' + lat + ',' + lon + '););out center tags 60;';
    return fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        return (j.elements || []).map(function (e) {
          var t = e.tags || {}, c = e.center || e;
          return { key: 'osm:' + e.type + '/' + e.id, name: t.name || 'Mini golf (no name)', place: [t['addr:street'] && ((t['addr:housenumber'] ? t['addr:housenumber'] + ' ' : '') + t['addr:street']), t['addr:city']].filter(Boolean).join(', '), lat: c.lat, lon: c.lon };
        }).filter(function (c) { return c.name; });
      });
  }
  // Nominatim name search (mini golf places first).
  function searchName(text) {
    var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=15&q=' + encodeURIComponent(text);
    if (here) url += '&viewbox=' + (here.lon - 1) + ',' + (here.lat + 1) + ',' + (here.lon + 1) + ',' + (here.lat - 1);
    return fetch(url, { headers: { 'Accept-Language': navigator.language || 'en' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (list) {
        return list.map(function (x) {
          var a = x.address || {};
          return { key: 'osm:' + x.osm_type + '/' + x.osm_id, name: x.name || (x.display_name || '').split(',')[0], place: [a.road, a.city || a.town || a.village || a.suburb, a.state].filter(Boolean).join(', '),
            lat: +x.lat, lon: +x.lon, mini: x.type === 'miniature_golf' || /mini|putt|golf/i.test(x.name || '') };
        }).sort(function (a, b) { return (b.mini ? 1 : 0) - (a.mini ? 1 : 0); });
      });
  }

  // "Mulligan's Island · Pirate" for a venue with several courses
  function label(c) { return c ? c.name + (c.sub ? ' · ' + c.sub : '') : ''; }

  // Step 1: which place? (played before, search, near me, or just type a name)
  function pickCourse(onPick) {
    var node = el('div'), res = el('div', { class: 'cres' }), s;
    var inp = el('input', { class: 'input', type: 'search', placeholder: 'Course name or town', autocomplete: 'off', enterkeyhint: 'search' });
    var go = el('button', { type: 'button', class: 'btn btn-primary btn-sm', 'aria-label': 'Search the map', html: Kit.icon('search') });
    var use = el('div', { class: 'cres', style: { 'margin-top': '10px' } });
    var near = el('button', { type: 'button', class: 'btn btn-soft btn-block', style: { 'margin-top': '10px' }, html: LOC + '<span>Find courses near me</span>' });
    node.appendChild(el('div', { class: 'csearch' }, [inp, go]));
    node.appendChild(use);
    node.appendChild(near);
    node.appendChild(res);
    function venue(v) { s.close(); Kit.sfx('pop'); pickSub(v, onPick); }
    // Typing a name is enough: no search, GPS or signal needed
    function paintUse() {
      use.innerHTML = '';
      var t = inp.value.trim(); if (!t) return;
      use.appendChild(el('button', { type: 'button', onclick: function () { venue({ key: 'custom:' + t.toLowerCase(), name: t, place: '' }); } }, [
        el('span', { html: Kit.icon('pencil'), style: { color: 'var(--accent)', display: 'flex' } }),
        el('span', null, [el('b', { text: 'Use "' + t + '"' }), el('small', { text: 'Name the course yourself, no map needed' })])
      ]));
    }
    inp.addEventListener('input', paintUse);
    function row(c, onTap, sub) {
      return el('button', { type: 'button', onclick: onTap }, [
        el('span', { html: PIN, style: { color: 'var(--accent)', display: 'flex' } }),
        el('span', { style: { 'min-width': 0 } }, [el('b', { text: sub ? label(c) : c.name }), c.place ? el('small', { text: c.place }) : null]),
        el('span', { class: 'd', text: dist(km(here, c)) })
      ]);
    }
    function list(title, items, emptyMsg) {
      res.innerHTML = '';
      if (title) res.appendChild(el('div', { class: 'csec', text: title }));
      if (!items.length) res.appendChild(el('div', { class: 'cnote', text: emptyMsg || 'Nothing found.' }));
      items.forEach(function (c) { res.appendChild(row(c, function () { venue(c); })); });
    }
    function loading(t) { res.innerHTML = ''; res.appendChild(el('div', { class: 'cnote', text: t })); }
    function doSearch() {
      var q = inp.value.trim(); if (!q) return;
      loading('Searching…');
      searchName(q).then(function (r) { list('Search results', r, 'No places matched. Tap "Use" above to name it yourself.'); })
        .catch(function () { list('', [], "Couldn't reach the map service. Tap \"Use\" above to name it yourself."); });
    }
    go.addEventListener('click', doSearch);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
    near.addEventListener('click', function () {
      if (!navigator.geolocation) return loading('Location is not available on this device. Type the course name instead.');
      loading('Finding where you are…');
      navigator.geolocation.getCurrentPosition(function (pos) {
        here = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        loading('Looking for mini golf nearby…');
        searchNear(here.lat, here.lon).then(function (r) {
          r.sort(function (a, b) { return km(here, a) - km(here, b); });
          list('Within 25 miles', r, 'No mini golf courses found nearby. Type the name instead.');
        }).catch(function () { list('', [], "Couldn't reach the map service. Type the course name instead."); });
      }, function () { loading("Couldn't get your location. Type the course name instead."); }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
    });
    var played = playedCourses();
    if (played.length) {
      res.appendChild(el('div', { class: 'csec', text: 'Courses you have played' }));
      played.forEach(function (c) { res.appendChild(row(c, function () { s.close(); Kit.sfx('pop'); onPick(c); }, true)); });
    } else res.appendChild(el('div', { class: 'cnote', text: 'Type the course name, search the map, or find courses near you.' }));
    s = Kit.sheet({ title: 'Where are you playing?', node: node });
  }

  // Step 2: many places have more than one course (Pirate, Jungle, Front 18…)
  function pickSub(v, onPick) {
    var vkey = v.venue || v.key, nm = String(v.name || '').trim().toLowerCase();
    // A typed name that matches a place you've played joins that place's records
    var same = playedCourses().filter(function (c) { return (c.venue || c.key) === vkey || String(c.name || '').trim().toLowerCase() === nm; });
    if (same.length && vkey.indexOf('custom:') === 0) { var real = same[0]; vkey = real.venue || real.key; v = { name: real.name, place: real.place, lat: real.lat, lon: real.lon }; }
    var seenSub = {}, subs = same.filter(function (c) { var k = (c.sub || '').toLowerCase(); if (!c.sub || seenSub[k]) return false; seenSub[k] = 1; return true; });
    var box = el('div', { class: 'cres' }), s;
    function choose(sub) {
      s.close(); Kit.sfx('pop');
      var c = { key: sub ? vkey + '#' + sub.toLowerCase() : vkey, venue: vkey, name: v.name, sub: sub || '', place: v.place || '', lat: v.lat, lon: v.lon };
      onPick(c);
    }
    subs.forEach(function (c) {
      box.appendChild(el('button', { type: 'button', onclick: function () { choose(c.sub); } }, [
        el('span', { html: Kit.icon('trophy'), style: { color: 'var(--accent)', display: 'flex' } }),
        el('span', null, [el('b', { text: c.sub }), el('small', { text: 'Played before' })])
      ]));
    });
    box.appendChild(el('button', { type: 'button', onclick: function () { choose(''); } }, [
      el('span', { html: Kit.icon('check'), style: { color: 'var(--text-3)', display: 'flex' } }),
      el('span', null, [el('b', { text: 'Only one course here' }), el('small', { text: 'Skip naming the course' })])
    ]));
    var inp = el('input', { class: 'input', maxlength: 24, placeholder: 'Course name, e.g. Pirate or Back 18', autocomplete: 'off' });
    function add() { var t = inp.value.trim(); if (t) choose(t); }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
    var node = el('div', null, [
      el('p', { class: 'muted', style: { 'margin-bottom': '10px' }, text: 'If this place has more than one course, pick or name the one you are playing. Records are kept for each course.' }),
      box,
      el('div', { class: 'csec', text: 'Add a course' }),
      el('div', { class: 'csearch', style: { 'margin-top': '6px' } }, [inp, el('button', { type: 'button', class: 'btn btn-primary btn-sm', text: 'Add', onclick: add })])
    ]);
    s = Kit.sheet({ title: v.name, node: node });
  }

  // ── Setup ─────────────────────────────────────────────────────────────────
  var S = null, undoStack = [], chosen = null;
  try { chosen = JSON.parse(localStorage.getItem('mg_last_course')); } catch (e) {}
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} if (S && !S.over) Kit.resume.set('Hole ' + (S.hole + 1) + ' of ' + S.holes + (S.course ? ' · ' + label(S.course) : '')); }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  function showSetup() {
    S = null;
    var setup = Kit.setup(app, {
      players: { min: 1, max: 6, count: 2 },
      options: [
        { id: 'holes', label: 'Holes', value: 18, choices: [[9, '9'], [18, '18']] },
        { id: 'cap', label: 'Stroke limit per hole', help: 'Most mini golf courses stop counting at 6 on a hole.', value: 6, choices: [[6, '6 strokes', 'No one scores more than 6 on a hole, even if it took more tries.'], [0, 'No limit', 'Every stroke counts, however many it takes.']] }
      ],
      start: 'Tee off!',
      onStart: function (cfg) { start(cfg); }
    });
    var block = el('div');
    function paint() {
      block.innerHTML = '';
      block.appendChild(el('div', { class: 'label', text: 'Course' }));
      var b = el('button', { type: 'button', class: 'course' }, [
        el('span', { class: 'pin', html: PIN }),
        el('span', { class: 'grow', style: { 'min-width': 0 } }, [el('b', { text: chosen ? label(chosen) : 'Pick a course' }), el('small', { text: chosen ? (chosen.place || 'Tap to change') : 'Search nearby or by name (optional)' })]),
        chosen ? el('span', { html: Kit.icon('close'), style: { display: 'flex', color: 'var(--text-3)' }, onclick: function (e) { e.stopPropagation(); chosen = null; localStorage.removeItem('mg_last_course'); paint(); } }) : el('span', { html: Kit.icon('right'), style: { display: 'flex', color: 'var(--text-3)' } })
      ]);
      b.addEventListener('click', function () { pickCourse(function (c) { chosen = c; localStorage.setItem('mg_last_course', JSON.stringify(c)); paint(); }); });
      block.appendChild(b);
    }
    paint();
    var startBtn = setup.el.querySelector('.btn-primary.btn-lg');
    setup.el.insertBefore(block, startBtn);
  }

  function start(cfg) {
    var holes = +cfg.options.holes || 18;
    S = {
      players: cfg.players.map(function (p) { return { name: p.name }; }),
      holes: holes, cap: +cfg.options.cap || 0, hole: 0, course: chosen || null,
      par: parsFor(chosen, holes), strokes: cfg.players.map(function () { var a = []; for (var i = 0; i < holes; i++) a.push(null); return a; }),
      over: false, started: Date.now()
    };
    if (chosen) rememberCourse(chosen);
    undoStack = []; save(); render(); Kit.sfx('pop');
  }

  // ── Scoring ───────────────────────────────────────────────────────────────
  function total(i, upto) { return S.strokes[i].reduce(function (a, v, h) { return a + (v != null && (upto == null || h <= upto) ? v : 0); }, 0); }
  function parThrough(i) { var t = 0; S.strokes[i].forEach(function (v, h) { if (v != null) t += S.par[h]; }); return t; }
  function vsPar(i) { var d = total(i) - parThrough(i); return d === 0 ? 'E' : d > 0 ? '+' + d : String(d); }
  function vsCls(i) { var d = total(i) - parThrough(i); return d < 0 ? 'under' : d > 0 ? 'over' : 'even'; }

  function setStroke(i, v) {
    snapshot();
    if (v != null) { v = Math.max(1, v); if (S.cap) v = Math.min(S.cap, v); }
    S.strokes[i][S.hole] = v;
    Kit.sfx('tick'); Kit.haptic('light');
    save(); render();
  }
  function nextHole() {
    var missing = S.players.filter(function (p, i) { return S.strokes[i][S.hole] == null; });
    if (missing.length) {
      Kit.confirm(missing.map(function (p) { return p.name; }).join(', ') + (missing.length === 1 ? " hasn't" : " haven't") + ' got a score here', { ok: 'Give them par', body: 'Or go back and enter their strokes.' }).then(function (ok) {
        if (!ok) return;
        snapshot(); S.players.forEach(function (p, i) { if (S.strokes[i][S.hole] == null) S.strokes[i][S.hole] = S.par[S.hole]; }); advance();
      });
      return;
    }
    snapshot(); advance();
  }
  function advance() {
    var aces = S.players.filter(function (p, i) { return S.strokes[i][S.hole] === 1; });
    if (aces.length) { Kit.callout('Hole in one!'); Kit.confetti({ count: 110 }); Kit.sfx('win'); }
    if (S.hole >= S.holes - 1) { save(); finish(); return; }
    S.hole++; Kit.sfx(aces.length ? 'win' : 'pop'); save(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function finish() {
    S.over = true;
    var tot = S.players.map(function (p, i) { return total(i); });
    var rank = S.players.map(function (p, i) { return { name: p.name, score: tot[i], color: Kit.color(i) }; }).sort(function (a, b) { return a.score - b.score; });
    var tie = rank.length > 1 && rank[1].score === rank[0].score;
    var hl = [];
    S.players.forEach(function (p, i) {
      S.strokes[i].forEach(function (v, h) { if (v === 1) hl.push(p.name + ' got a hole in one on hole ' + (h + 1) + '!'); });
    });
    // Course record check (best total over the same number of holes)
    var prevBest = null;
    if (S.course) try {
      GameHistory.load(KEY).forEach(function (e) {
        if (e.course && e.course.key === S.course.key && e.holes === S.holes) (e.players || []).forEach(function (p) { if (prevBest == null || p.score < prevBest) prevBest = p.score; });
      });
    } catch (e) {}
    if (S.course && prevBest != null && rank[0].score < prevBest) hl.push('New course record: ' + rank[0].name + ' with ' + rank[0].score + ' (old best ' + prevBest + ')');
    S.players.forEach(function (p, i) { var d = total(i) - S.par.reduce(function (a, b) { return a + b; }, 0); if (d <= 0) hl.push(p.name + ' finished ' + (d === 0 ? 'at even par' : Math.abs(d) + ' under par')); });
    var worst = { v: 0 };
    S.players.forEach(function (p, i) { S.strokes[i].forEach(function (v, h) { if (v > worst.v) worst = { v: v, who: p.name, h: h }; }); });
    if (worst.v >= 6) hl.push('Toughest hole: ' + worst.who + ' needed ' + worst.v + ' on hole ' + (worst.h + 1));
    if (S.course) hl.unshift('Played at ' + label(S.course) + (S.course.place ? ', ' + S.course.place : ''));
    var byHole = []; for (var h = 0; h < S.holes; h++) byHole.push(S.strokes.map(function (row) { return row[h] == null ? 0 : row[h]; }));
    Kit.record(KEY, {
      started: S.started, mode: S.holes + ' holes' + (S.course ? ' · ' + label(S.course) : ''), lowWins: true,
      players: S.players.map(function (p, i) { return { name: p.name, score: tot[i] }; }),
      winner: tie ? null : rank[0].name,
      rounds: { labels: byHole.map(function (x, i) { return 'H' + (i + 1); }), scores: byHole },
      highlights: hl,
      meta: { course: S.course, holes: S.holes, par: S.par },
      // the scorecard for history: each player's strokes as one string ('2,3,1,…'), and the stroke cap
      detail: { s: S.strokes.map(function (row) { return row.map(function (v) { return v == null ? '' : v; }).join(','); }), cap: S.cap }
    });
    savePars(); clearSave(); render();
    Kit.win({
      title: rank.length === 1 ? rank[0].score + ' strokes' : tie ? "It's a tie!" : rank[0].name + ' wins!',
      sub: (S.course ? label(S.course) + ' · ' : '') + 'Fewest strokes wins', rank: rank.length > 1 ? rank : null,
      againLabel: 'Play again', again: function () { start({ players: S.players, options: { holes: S.holes, cap: S.cap } }); },
      extra: [{ label: 'See the scorecard', onClick: function () {} }]
    });
  }

  function snapshot() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 60) undoStack.shift(); }
  function undo() { if (!undoStack.length) return Kit.toast('Nothing to undo'); S = JSON.parse(undoStack.pop()); Kit.sfx('whoosh'); save(); render(); }

  // ── Render ────────────────────────────────────────────────────────────────
  function render() {
    app.innerHTML = '';
    if (!S.over) {
      var green = el('div', { class: 'green wood' }), turf = el('div', { class: 'turf' });
      var parBtn = el('button', { type: 'button', class: 'parbtn', html: '<span>Par ' + S.par[S.hole] + '</span>' + Kit.icon('pencil') });
      parBtn.addEventListener('click', editPar);
      turf.appendChild(el('div', { class: 'hole-h' }, [el('div', { class: 'hole-l' }, [el('span', { class: 'flag', html: '<svg viewBox="0 0 40 56"><ellipse cx="12" cy="52" rx="10" ry="3" fill="rgba(0,0,0,.3)"/><rect x="11" y="4" width="2.5" height="48" rx="1" fill="#fff"/><path d="M13.5 4 34 11 13.5 18z" fill="#ff4d5e"/></svg>' }), el('div', { class: 'num', html: '<small>HOLE</small>' + (S.hole + 1) + '<span style="font-size:1rem;opacity:.7"> / ' + S.holes + '</span>' })]), parBtn]));
      S.players.forEach(function (p, i) {
        var v = S.strokes[i][S.hole];
        var out = el('output', { class: v == null ? 'empty' : '', text: v == null ? '–' : String(v) });
        var row = el('div', { class: 'prow' + (v === 1 ? ' ace' : '') }, [
          el('span', { class: 'avatar sm', style: { '--c': Kit.color(i) }, text: p.name.charAt(0).toUpperCase() }),
          el('span', { class: 'nm', html: Kit.esc(p.name) + '<small>' + total(i) + ' total · ' + vsPar(i) + '</small>' }),
          el('span', { class: 'stk' }, [
            el('button', { type: 'button', 'aria-label': 'One less stroke for ' + p.name, text: '−', onclick: function () { if (v == null) return; setStroke(i, v <= 1 ? null : v - 1); } }),
            out,
            el('button', { type: 'button', 'aria-label': 'One more stroke for ' + p.name, text: '+', onclick: function () { setStroke(i, v == null ? 1 : v + 1); } })
          ])
        ]);
        turf.appendChild(row);
      });
      var nav = el('div', { class: 'holenav' });
      if (S.hole > 0) nav.appendChild(el('button', { type: 'button', class: 'btn btn-soft', html: Kit.icon('back'), 'aria-label': 'Previous hole', onclick: function () { S.hole--; save(); render(); } }));
      nav.appendChild(el('button', { type: 'button', class: 'btn btn-yellow', text: S.hole === S.holes - 1 ? 'Finish round' : 'Next hole', onclick: nextHole }));
      turf.appendChild(nav);
      green.appendChild(turf);
      app.appendChild(green);
    }
    // Paper scorecard
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'card-h' }, [el('h2', { text: S.course ? label(S.course) : 'Mini Golf' }), el('small', { text: S.over ? 'final' : 'tap a box to jump there' })]));
    var tbl = el('table', { class: 'sc' }), hr = el('tr', null, [el('th', { text: 'HOLE' })]);
    for (var h = 0; h < S.holes; h++) hr.appendChild(el('th', { class: h === S.hole && !S.over ? 'cur' : '', text: String(h + 1) }));
    hr.appendChild(el('th', { text: 'TOT' }));
    tbl.appendChild(el('thead', null, [hr]));
    var pr = el('tr', { class: 'par' }, [el('th', { text: 'Par' })]);
    S.par.forEach(function (v) { pr.appendChild(el('td', { text: String(v) })); });
    pr.appendChild(el('td', { text: String(S.par.reduce(function (a, b) { return a + b; }, 0)) }));
    tbl.appendChild(pr);
    S.players.forEach(function (p, i) {
      var tr = el('tr', null, [el('th', { text: p.name, style: { color: Kit.color(i) } })]);
      S.strokes[i].forEach(function (v, h) {
        var td = el('td', { class: 'v' + (h === S.hole && !S.over ? ' cur' : '') + (v === 1 ? ' ace' : ''), text: v == null ? '' : String(v) });
        td.addEventListener('click', function () { if (S.over) return; S.hole = h; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        tr.appendChild(td);
      });
      tr.appendChild(el('td', { class: 'tot', html: total(i) + '<small class="' + vsCls(i) + '">' + vsPar(i) + '</small>' }));
      tbl.appendChild(tr);
    });
    card.appendChild(el('div', { class: 'scroll' }, [tbl]));
    app.appendChild(card);
    if (S.over) app.appendChild(el('div', { class: 'holenav' }, [el('button', { type: 'button', class: 'btn btn-primary btn-block', text: 'New round', onclick: function () { showSetup(); } })]));
    var curCol = card.querySelector('thead th.cur'); if (curCol) { var sc = card.querySelector('.scroll'); sc.scrollLeft = Math.max(0, curCol.offsetLeft - 120); }
  }
  function editPar() {
    var grid = el('div', { class: 'seg' }), s;
    [1, 2, 3, 4, 5, 6].forEach(function (v) {
      grid.appendChild(el('button', { type: 'button', class: S.par[S.hole] === v ? 'on' : '', text: String(v), onclick: function () {
        snapshot(); S.par[S.hole] = v; savePars(); save(); s.close(); render();
      } }));
    });
    s = Kit.sheet({ title: 'Par for hole ' + (S.hole + 1), node: el('div', null, [grid, el('p', { class: 'muted', style: { 'margin-top': '10px' }, text: S.course ? 'Saved for ' + label(S.course) + ' next time.' : 'Pick a course in setup to remember pars.' })]) });
  }

  // ── Courses & records ─────────────────────────────────────────────────────
  function showCourses() {
    var list = []; try { list = GameHistory.load(KEY); } catch (e) {}
    var venues = {};
    list.forEach(function (e) {
      var c = e.course, vk = c ? (c.venue || c.key) : 'none', ck = c ? c.key : 'none';
      var v = venues[vk] = venues[vk] || { course: c, courses: {}, last: 0 };
      v.last = Math.max(v.last, e._date || 0);
      var g = v.courses[ck] = v.courses[ck] || { sub: c ? c.sub : '', rounds: 0, best: {} };
      g.rounds++;
      (e.players || []).forEach(function (p) {
        var key = p.name + '|' + (e.holes || '');
        if (!g.best[key] || p.score < g.best[key].score) g.best[key] = { name: p.name, score: p.score, holes: e.holes };
      });
    });
    var box = el('div', { class: 'recs' });
    var keys = Object.keys(venues).sort(function (a, b) { return venues[b].last - venues[a].last; });
    if (!keys.length) box.appendChild(el('p', { class: 'muted', text: 'Finish a round to start your course records.' }));
    keys.forEach(function (k) {
      var v = venues[k], c = v.course;
      var r = el('div', { class: 'rec' }, [
        el('b', { text: c ? c.name : 'No course picked' }),
        el('small', { text: (c && c.place ? c.place + ' · ' : '') + 'last played ' + new Date(v.last).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) })
      ]);
      Object.keys(v.courses).forEach(function (ck) {
        var g = v.courses[ck], bests = Object.keys(g.best).map(function (x) { return g.best[x]; }).sort(function (a, b) { return a.score - b.score; });
        r.appendChild(el('div', { class: 'best', html: '<b style="display:inline">' + Kit.esc(g.sub || (Object.keys(v.courses).length > 1 ? 'Main course' : 'Course')) + '</b> · ' + g.rounds + (g.rounds === 1 ? ' round' : ' rounds') +
          '<br>Best: ' + Kit.esc(bests.slice(0, 4).map(function (b) { return b.name + ' ' + b.score + (b.holes ? ' (' + b.holes + ' holes)' : ''); }).join(' · ')) }));
      });
      if (c && c.lat != null) r.appendChild(el('a', { href: 'https://maps.apple.com/?ll=' + c.lat + ',' + c.lon + '&q=' + encodeURIComponent(c.name), target: '_blank', rel: 'noopener', class: 'btn btn-soft btn-sm', style: { 'margin-top': '8px' }, html: PIN + '<span>Open in Maps</span>' }));
      box.appendChild(r);
    });
    Kit.sheet({ title: 'Courses & records', node: box, actions: [{ label: 'Close', cls: 'btn-soft' }] });
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.players && !saved.over) { S = saved; render(); } else showSetup();
})();
</script>
</body>
</html>

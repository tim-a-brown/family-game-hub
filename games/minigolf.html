<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Golf</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* Course picker on the setup screen */
.course{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:var(--r);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text);text-align:left;}
.course:active{transform:scale(.98);}
.course .pin{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);flex:none;}
.course .pin .ico{width:22px;height:22px;}
.course b{display:block;font-weight:750;}
.course small{display:block;color:var(--text-3);font-weight:550;font-size:.82rem;}
.csearch{display:flex;gap:8px;}
.csearch .input{flex:1;}
.cres{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:46vh;overflow:auto;}
.cres button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:var(--r);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text);text-align:left;}
.cres button:active{background:var(--gl-2);}
.cres b{display:block;font-weight:700;}
.cres small{display:block;color:var(--text-3);font-weight:600;font-size:.8rem;}
.cres .d{margin-left:auto;font-weight:650;color:var(--text-3);font-size:.8rem;white-space:nowrap;}
.cres .ico{width:20px;height:20px;}
.cnote{color:var(--text-3);font-weight:600;font-size:.85rem;text-align:center;padding:10px;}
.csec{font-size:.84rem;font-weight:600;color:var(--text-2);margin:12px 0 2px;}

/* The green: current hole */
.green{position:relative;border-radius:26px;padding:8px;margin-bottom:14px;}
.green .turf{position:relative;border-radius:19px;padding:16px 14px 14px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 22px, rgba(0,0,0,.04) 22px 44px),
    radial-gradient(120% 90% at 50% 20%, #34c46a 0%, #1f9a4f 60%, #167a3d 100%);
  box-shadow:inset 0 6px 18px rgba(0,0,0,.35);}
.hole-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#fff;}
.hole-h .num{font-family:var(--display);font-size:2.2rem;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25);}
.hole-h .num small{font-family:var(--font);font-size:.9rem;font-weight:700;opacity:.85;display:block;margin-bottom:2px;}
.hole-l{display:flex;align-items:flex-end;gap:8px;}
.flag{display:block;width:30px;height:44px;flex:none;}
.flag svg{width:100%;height:100%;}
.parbtn{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border:0;border-radius:14px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-weight:750;}
.parbtn .ico{width:14px;height:14px;opacity:.8;}
.prow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:16px;background:rgba(255,255,255,.92);color:#1d1b2e;margin-top:8px;box-shadow:0 8px 18px -10px rgba(0,0,0,.5);}
.prow .nm{flex:1;min-width:0;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prow .nm small{display:block;font-weight:600;font-size:.75rem;color:#6a6a80;}
.prow .stk{display:flex;align-items:center;gap:6px;}
.prow .stk button{width:44px;height:44px;border:0;border-radius:14px;background:#ece7f8;color:#2a2050;font-size:1.4rem;font-weight:800;transition:transform .12s var(--ease);}
.prow .stk button:active{transform:scale(.9);}
.prow .stk output{width:46px;text-align:center;font-family:var(--hand);font-size:2rem;color:var(--ink);line-height:1;}
.prow .stk output.empty{color:#b9b4cc;}
.prow.ace{box-shadow:0 0 0 3px var(--lit),0 0 20px var(--litg),0 8px 18px -10px rgba(0,0,0,.5);}
.holenav{display:flex;gap:10px;margin-top:12px;}
.holenav .btn:last-child{flex:1;}

/* Paper scorecard */
.stage .card{border-radius:8px 8px 14px 14px;overflow:hidden;background:linear-gradient(180deg,#fffaf0,#f6eedb);color:#2a2a3a;box-shadow:0 16px 34px rgba(0,0,0,.45);}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px 8px;border-bottom:3px double #1f9a4f;}
.card-h h2{font-family:var(--display);font-weight:400;font-size:1.35rem;color:#1f7a3f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-h small{font-family:var(--hand);font-size:1rem;color:#6a6a80;white-space:nowrap;}
.scroll{overflow-x:auto;}
table.sc{border-collapse:collapse;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums;}
table.sc.more{border-top:3px double #1f9a4f;}
.sc thead th.sum{font-size:.66rem;width:46px;padding:0 2px;}
.sc th,.sc td{padding:0 2px;}
.sc td.tot.sub{font-size:1.2rem;font-weight:400;}
.sc th,.sc td{height:38px;text-align:center;border-bottom:1px solid rgba(60,80,160,.15);border-left:1px solid rgba(31,122,63,.15);padding:0 4px;}
.sc th:first-child{position:sticky;left:0;background:#fbf5e8;text-align:left;padding-left:10px;width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900;z-index:1;}
.sc thead th{font-size:.72rem;font-weight:900;color:#1f7a3f;}
.sc thead th.cur{background:rgba(255,220,60,.4);}
.sc tr.par td{font-size:.8rem;font-weight:800;color:#8a8796;}
.sc td.v{font-family:var(--hand);font-size:1.3rem;color:var(--ink);cursor:pointer;}
.sc td.v.cur{background:rgba(255,220,60,.25);}
.sc td.v.ace{color:#c8102e;font-weight:700;}
.sc td.tot{font-family:var(--hand);font-size:1.4rem;font-weight:700;background:rgba(31,122,63,.07);}
.sc td.tot small{display:block;font-family:var(--font);font-size:.7rem;font-weight:800;line-height:1;}
.under{color:#15803d;} .over{color:#c8102e;} .even{color:#8a8796;}
.recs{display:flex;flex-direction:column;gap:8px;}
.rec{padding:12px 14px;border-radius:var(--r);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);}
.rec b{display:block;font-weight:750;}
.rec small{display:block;color:var(--text-3);font-weight:550;}
.rec .best{margin-top:6px;font-weight:650;color:var(--text-2);font-size:.9rem;}
/* Playing: the green and the scorecard fill the screen. The rows on the green grow into the room there is (taller
   rows, bigger steppers and numbers), the Next hole button sits at the green's foot. */
.stage.mg-play{max-width:760px;display:flex;flex-direction:column;min-height:calc(var(--vvh,100dvh) - var(--bar));padding-bottom:calc(var(--safe-b) + 14px);}
.mg-play .green{flex:1 0 auto;display:flex;margin-bottom:12px;view-transition-name:mg-green;}
.mg-play .green .turf{flex:1;display:flex;flex-direction:column;}
.mg-play .prow{flex:1 1 0;min-height:64px;max-height:128px;container-type:size;}
.mg-play .prow .stk button{width:clamp(44px,62cqh,72px);height:clamp(44px,62cqh,72px);font-size:clamp(1.4rem,32cqh,2.2rem);}
.mg-play .prow .stk output{width:clamp(46px,56cqh,72px);font-size:clamp(2rem,50cqh,3.4rem);}
.mg-play .prow .nm b{display:block;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mg-play .prow .nm small{white-space:normal;}
.mg-play .holenav{margin-top:auto;padding-top:12px;}
.mg-play .card{view-transition-name:mg-card;flex:none;}
.prow .stk output.bump{animation:mgBump .45s var(--spring);}
@keyframes mgBump{40%{transform:scale(1.35);}}
.prow.ace output{color:#c8102e;}
/* Sideways (an iPad or a phone on its side): the scorecard on the left to read, the green on the right to tap */
.stage.mg-play.mg-side{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,44%);column-gap:14px;align-items:start;padding-left:calc(16px + var(--corner-x));padding-right:calc(16px + var(--corner-x));}
.mg-side .green{grid-column:2;grid-row:1;margin-bottom:0;min-height:calc(var(--vvh,100dvh) - var(--bar) - var(--safe-b) - 22px);}
.mg-side .card{grid-column:1;grid-row:1;}
.mg-side .holenav.done{grid-column:1;}
/* sideways with height to spare (an iPad): the scorecard stands as tall as the green, its rows taller */
@media (min-height:600px){
  .mg-side .card{align-self:stretch;display:flex;flex-direction:column;}
  .mg-side .card table.sc{flex:1;}
  .mg-side .sc td.v{font-size:1.75rem;}
  .mg-side .sc td.tot{font-size:1.8rem;}
  .mg-side .sc tr.par td{font-size:.95rem;}
  .mg-side .prow{max-height:150px;}
}
@media (max-height:520px){
  .mg-side .green{padding:6px;border-radius:22px;}
  .mg-side .green .turf{padding:10px 12px 10px;}
  .mg-side .hole-h{margin-bottom:4px;}
  .mg-side .hole-h .num{font-size:1.7rem;}
  .mg-side .flag{width:24px;height:34px;}
  .mg-side .prow{min-height:52px;margin-top:6px;padding-top:4px;padding-bottom:4px;}
  .mg-side .holenav{padding-top:8px;margin-top:auto;}
  .mg-side .holenav .btn{min-height:46px;}
  .mg-side .sc th,.mg-side .sc td{height:29px;}
  .mg-side .card-h{padding:7px 14px 5px;}
  .mg-side .card-h h2{font-size:1.15rem;}
  .stage.mg-play.mg-side{padding-bottom:calc(var(--safe-b) + 8px);}
}
/* ══ The desk: a large window (dkShape in the script; every rule hangs off html.mg-dk, set only there) ══════════ */
html.mg-dk body{overflow:hidden;}
html.mg-dk .stage.mg-dkp{position:fixed;left:0;right:0;top:var(--dkt);bottom:0;max-width:none;margin:0;min-height:0;padding:8px 26px 20px;display:grid;column-gap:26px;row-gap:16px;}
html.mg-dk.mg-wide .stage.mg-dkp{grid-template-columns:minmax(0,1fr) var(--dgw);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"card green" "room green";}
html.mg-dk.mg-tall .stage.mg-dkp{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"card" "room" "green";}
html.mg-dk .mg-dkp .card{grid-area:card;align-self:start;display:block;}
html.mg-dk .mg-dkp .green{grid-area:green;margin:0;min-height:0;display:flex;}
html.mg-dk.mg-wide .mg-dkp .green{align-self:stretch;}
html.mg-dk .mg-dkp .prow{min-height:46px;}
html.mg-dk.mg-wide .mg-dkp .prow{max-height:180px;}
html.mg-dk .mg-dkp .holenav.done{grid-area:green;align-self:start;}
html.mg-dk .mg-dkp .mg-room{grid-area:room;align-self:stretch;height:100%;max-height:100%;}
html.mg-dk .mg-dkp .sc th,html.mg-dk .mg-dkp .sc td{height:var(--dh);}
html.mg-dk .mg-dkp .sc thead th{height:40px;font-size:.95rem;}
html.mg-dk .mg-dkp .sc th:first-child{width:var(--dnw,104px);font-size:clamp(.9rem,calc(var(--dh) * .3),1.25rem);}
html.mg-dk .mg-dkp .sc thead th.sum{width:clamp(62px,7%,90px);font-size:.8rem;}
html.mg-dk .mg-dkp .sc td.v{font-size:var(--dfv);}
html.mg-dk .mg-dkp .sc td.tot{font-size:var(--dft);}
html.mg-dk .mg-dkp .sc td.tot small{font-size:clamp(.7rem,calc(var(--dh) * .17),.95rem);}
html.mg-dk .mg-dkp .sc tr.par td{font-size:clamp(.8rem,calc(var(--dh) * .26),1.15rem);}
html.mg-dk .mg-dkp .card-h{padding:14px 18px 10px;}
html.mg-dk .mg-dkp .card-h h2{font-size:1.6rem;}
html.mg-dk .mg-dkp .card-h small{font-size:1.15rem;}
html.mg-dk.mg-tall .mg-dkp .prow{max-height:110px;flex:none;height:var(--dph,64px);min-height:0;}
html.mg-dk .mg-dkp .sc td.v:hover{background:rgba(255,220,60,.18);}
.mg-room{display:none;}
html.mg-dk .mg-room{display:flex;gap:16px;min-height:0;overflow:hidden;align-items:stretch;}
html.mg-dk .mg-room .pn{align-self:start;max-height:100%;flex:1 1 0;min-width:0;min-height:0;overflow:hidden;border-radius:20px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
html.mg-dk .mg-room h4{margin:0 0 2px;font-size:.95rem;font-weight:750;color:var(--text-2);}
html.mg-dk .mg-room .srow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.04);}
html.mg-dk .mg-room .pl{flex:none;width:22px;text-align:center;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;}
html.mg-dk .mg-room .srow .nm{flex:1;min-width:0;}
html.mg-dk .mg-room .srow .nm b{display:block;font-weight:750;font-size:1.05rem;overflow-wrap:anywhere;}
html.mg-dk .mg-room .srow .nm small{display:block;font-size:.84rem;color:var(--text-2);font-weight:600;}
html.mg-dk .mg-room .tt{flex:none;text-align:right;}
html.mg-dk .mg-room .tt b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1;font-weight:400;}
html.mg-dk .mg-room .tt small{display:block;font-weight:800;font-size:.85rem;}
html.mg-dk .mg-room .tt .under{color:#5ee08d;} html.mg-dk .mg-room .tt .over{color:#ff8f8f;} html.mg-dk .mg-room .tt .even{color:var(--text-3);}
html.mg-dk .mg-room .brow{display:flex;align-items:baseline;gap:10px;padding:5px 4px;border-bottom:1px solid var(--gl-line);}
html.mg-dk .mg-room .brow .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere;}
html.mg-dk .mg-room .brow .dt{flex:none;font-size:.82rem;color:var(--text-3);font-weight:600;}
html.mg-dk .mg-room .brow b{flex:none;font-family:var(--display);font-size:1.25rem;font-weight:400;}
/* A narrow phone: smaller steppers, so the name and the total keep their room */
@media (max-width:360px){
  .stage.mg-play{padding-left:10px;padding-right:10px;}
  .mg-play .green{padding:6px;}
  .mg-play .green .turf{padding:12px 10px 10px;}
  .prow{gap:7px;padding-left:8px;padding-right:6px;}
  .prow .stk{gap:3px;}
  .mg-play .prow .stk button{width:38px;height:clamp(38px,62cqh,56px);}
  .mg-play .prow .stk output{width:34px;}
}
/* Tablets: bigger rows and steppers on the green */
@media (min-width:700px) and (min-height:700px){
  .hole-h .num{font-size:2.8rem;}
  .prow{padding:12px 12px 12px 14px;margin-top:10px;}
  .prow .nm{font-size:1.2rem;}
  .prow .nm small{font-size:.85rem;}
  .prow .stk{gap:10px;}
  .prow .stk button{width:56px;height:56px;font-size:1.7rem;}
  .prow .stk output{width:56px;font-size:2.5rem;}
  .holenav .btn{min-height:60px;font-size:1.15rem;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'mg_state', KEY = 'mg';
  var PIN = '<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  var LOC = '<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 22 2l-9 19-2-8z"/></svg>';

  Kit.init({
    id: 'minigolf',
    onNew: function () { clearSave(); showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'trophy', label: 'Courses & records', onClick: function () { showCourses(); } },
      { icon: 'history', label: 'Past rounds', onClick: function () { Kit.history(KEY, { title: 'Mini Golf: past rounds' }); } }
    ],
    rules:
      '<p class="goal">Keep score for a real round of mini golf. <b>Fewest strokes wins.</b></p>' +
      '<h3>How it works</h3><ul><li>Pick where you\'re playing: type the name, search the map, or find courses near you. If the place has several courses (Pirate, Jungle and so on), pick which one. Records are kept for each course.</li>' +
      '<li>On each hole, tap + for every stroke a player takes. Tap Next hole when everyone is in.</li>' +
      '<li>Tap the par to change it. Pars are remembered for that course next time.</li></ul>' +
      '<h3>Common house rules</h3><ul><li><b>Stroke limit:</b> most courses cap a hole at 6 strokes. You can turn the cap off in setup.</li>' +
      '<li>A ball that leaves the course goes back where it left, with a 1-stroke penalty.</li><li>A <b>hole in one</b> gets a celebration.</li></ul>'
  });

  // ── Courses ───────────────────────────────────────────────────────────────
  // A course is {key, name, place, lat, lon}. key is 'osm:node/123' for real
  // OpenStreetMap places or 'custom:<name>' for typed-in names. Courses you've
  // played come from history (which syncs), plus a local recent list.
  function localCourses() { try { return JSON.parse(localStorage.getItem('mg_courses') || '[]'); } catch (e) { return []; } }
  function rememberCourse(c) {
    var list = localCourses().filter(function (x) { return x.key !== c.key; });
    list.unshift(c); localStorage.setItem('mg_courses', JSON.stringify(list.slice(0, 20)));
  }
  function playedCourses() {
    var seen = {}, out = [];
    function add(c) { if (c && c.key && !seen[c.key]) { seen[c.key] = 1; out.push(c); } }
    localCourses().forEach(add);
    try { GameHistory.load(KEY).forEach(function (e) { add(e.course); }); } catch (e) {}
    return out;
  }
  function parsFor(c, holes) {
    var p = null; try { p = JSON.parse(localStorage.getItem('mg_par_' + (c ? c.key : 'none'))); } catch (e) {}
    if (!p && c) try { var h = GameHistory.load(KEY).filter(function (e) { return e.course && e.course.key === c.key && e.par; })[0]; if (h) p = h.par; } catch (e) {}
    var out = []; for (var i = 0; i < holes; i++) out.push((p && p[i]) || 2);
    return out;
  }
  function savePars() { if (S.course) localStorage.setItem('mg_par_' + S.course.key, JSON.stringify(S.par)); }
  function km(a, b) {
    if (!a || !b || a.lat == null || b.lat == null) return null;
    var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLon = (b.lon - a.lon) * Math.PI / 180;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function dist(d) { if (d == null) return ''; var mi = d * 0.621371; return mi < 10 ? mi.toFixed(1) + ' mi' : Math.round(mi) + ' mi'; }
  var here = null;

  // OpenStreetMap: courses tagged leisure=miniature_golf near a point.
  function searchNear(lat, lon) {
    var q = '[out:json][timeout:20];(node["leisure"="miniature_golf"](around:40000,' + lat + ',' + lon + ');way["leisure"="miniature_golf"](around:40000,' + lat + ',' + lon + ');relation["leisure"="miniature_golf"](around:40000,' + lat + ',' + lon + '););out center tags 60;';
    return fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        return (j.elements || []).map(function (e) {
          var t = e.tags || {}, c = e.center || e;
          return { key: 'osm:' + e.type + '/' + e.id, name: t.name || 'Mini golf (no name)', place: [t['addr:street'] && ((t['addr:housenumber'] ? t['addr:housenumber'] + ' ' : '') + t['addr:street']), t['addr:city']].filter(Boolean).join(', '), lat: c.lat, lon: c.lon };
        }).filter(function (c) { return c.name; });
      });
  }
  // Nominatim name search (mini golf places first).
  function searchName(text) {
    var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=15&q=' + encodeURIComponent(text);
    if (here) url += '&viewbox=' + (here.lon - 1) + ',' + (here.lat + 1) + ',' + (here.lon + 1) + ',' + (here.lat - 1);
    return fetch(url, { headers: { 'Accept-Language': navigator.language || 'en' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (list) {
        return list.map(function (x) {
          var a = x.address || {};
          return { key: 'osm:' + x.osm_type + '/' + x.osm_id, name: x.name || (x.display_name || '').split(',')[0], place: [a.road, a.city || a.town || a.village || a.suburb, a.state].filter(Boolean).join(', '),
            lat: +x.lat, lon: +x.lon, mini: x.type === 'miniature_golf' || /mini|putt|golf/i.test(x.name || '') };
        }).sort(function (a, b) { return (b.mini ? 1 : 0) - (a.mini ? 1 : 0); });
      });
  }

  // "Mulligan's Island · Pirate" for a venue with several courses
  function label(c) { return c ? c.name + (c.sub ? ': ' + c.sub : '') : ''; }

  // Step 1: which place? (played before, search, near me, or just type a name)
  function pickCourse(onPick) {
    var node = el('div'), res = el('div', { class: 'cres' }), s;
    var inp = el('input', { class: 'input', type: 'search', placeholder: 'Course name or town', autocomplete: 'off', autocapitalize: 'words', enterkeyhint: 'search' });
    var go = el('button', { type: 'button', class: 'btn btn-primary btn-sm', 'aria-label': 'Search the map', html: Kit.icon('search') });
    var use = el('div', { class: 'cres', style: { 'margin-top': '10px' } });
    var near = el('button', { type: 'button', class: 'btn btn-soft btn-block', style: { 'margin-top': '10px' }, html: LOC + '<span>Find courses near me</span>' });
    node.appendChild(el('div', { class: 'csearch' }, [inp, go]));
    node.appendChild(use);
    node.appendChild(near);
    node.appendChild(res);
    function venue(v) { s.close(); Kit.sfx('pop'); pickSub(v, onPick); }
    // Typing a name is enough: no search, GPS or signal needed
    function paintUse() {
      use.innerHTML = '';
      var t = inp.value.trim(); if (!t) return;
      use.appendChild(el('button', { type: 'button', onclick: function () { venue({ key: 'custom:' + t.toLowerCase(), name: t, place: '' }); } }, [
        el('span', { html: Kit.icon('pencil'), style: { color: 'var(--accent)', display: 'flex' } }),
        el('span', null, [el('b', { text: 'Use "' + t + '"' }), el('small', { text: 'Name the course yourself, no map needed' })])
      ]));
    }
    inp.addEventListener('input', paintUse);
    function row(c, onTap, sub) {
      return el('button', { type: 'button', onclick: onTap }, [
        el('span', { html: PIN, style: { color: 'var(--accent)', display: 'flex' } }),
        el('span', { style: { 'min-width': 0 } }, [el('b', { text: sub ? label(c) : c.name }), c.place ? el('small', { text: c.place }) : null]),
        el('span', { class: 'd', text: dist(km(here, c)) })
      ]);
    }
    function list(title, items, emptyMsg) {
      res.innerHTML = '';
      if (title) res.appendChild(el('div', { class: 'csec', text: title }));
      if (!items.length) res.appendChild(el('div', { class: 'cnote', text: emptyMsg || 'Nothing found.' }));
      items.forEach(function (c) { res.appendChild(row(c, function () { venue(c); })); });
    }
    function loading(t) { res.innerHTML = ''; res.appendChild(el('div', { class: 'cnote', text: t })); }
    function doSearch() {
      var q = inp.value.trim(); if (!q) return;
      loading('Searching…');
      searchName(q).then(function (r) { list('Search results', r, 'No places matched. Tap "Use" above to name it yourself.'); })
        .catch(function () { list('', [], "Couldn't reach the map service. Tap \"Use\" above to name it yourself."); });
    }
    go.addEventListener('click', doSearch);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
    near.addEventListener('click', function () {
      if (!navigator.geolocation) return loading('Location is not available on this device. Type the course name instead.');
      loading('Finding where you are…');
      navigator.geolocation.getCurrentPosition(function (pos) {
        here = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        loading('Looking for mini golf nearby…');
        searchNear(here.lat, here.lon).then(function (r) {
          r.sort(function (a, b) { return km(here, a) - km(here, b); });
          list('Within 25 miles', r, 'No mini golf courses found nearby. Type the name instead.');
        }).catch(function () { list('', [], "Couldn't reach the map service. Type the course name instead."); });
      }, function () { loading("Couldn't get your location. Type the course name instead."); }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
    });
    var played = playedCourses();
    if (played.length) {
      res.appendChild(el('div', { class: 'csec', text: 'Courses you have played' }));
      played.forEach(function (c) { res.appendChild(row(c, function () { s.close(); Kit.sfx('pop'); onPick(c); }, true)); });
    } else res.appendChild(el('div', { class: 'cnote', text: 'Type the course name, search the map, or find courses near you.' }));
    s = Kit.sheet({ title: 'Where are you playing?', node: node });
  }

  // Step 2: many places have more than one course (Pirate, Jungle, Front 18…)
  function pickSub(v, onPick) {
    var vkey = v.venue || v.key, nm = String(v.name || '').trim().toLowerCase();
    // A typed name that matches a place you've played joins that place's records
    var same = playedCourses().filter(function (c) { return (c.venue || c.key) === vkey || String(c.name || '').trim().toLowerCase() === nm; });
    if (same.length && vkey.indexOf('custom:') === 0) { var real = same[0]; vkey = real.venue || real.key; v = { name: real.name, place: real.place, lat: real.lat, lon: real.lon }; }
    var seenSub = {}, subs = same.filter(function (c) { var k = (c.sub || '').toLowerCase(); if (!c.sub || seenSub[k]) return false; seenSub[k] = 1; return true; });
    var box = el('div', { class: 'cres' }), s;
    function choose(sub) {
      s.close(); Kit.sfx('pop');
      var c = { key: sub ? vkey + '#' + sub.toLowerCase() : vkey, venue: vkey, name: v.name, sub: sub || '', place: v.place || '', lat: v.lat, lon: v.lon };
      onPick(c);
    }
    subs.forEach(function (c) {
      box.appendChild(el('button', { type: 'button', onclick: function () { choose(c.sub); } }, [
        el('span', { html: Kit.icon('trophy'), style: { color: 'var(--accent)', display: 'flex' } }),
        el('span', null, [el('b', { text: c.sub }), el('small', { text: 'Played before' })])
      ]));
    });
    box.appendChild(el('button', { type: 'button', onclick: function () { choose(''); } }, [
      el('span', { html: Kit.icon('check'), style: { color: 'var(--text-3)', display: 'flex' } }),
      el('span', null, [el('b', { text: 'Only one course here' }), el('small', { text: 'Skip naming the course' })])
    ]));
    var inp = el('input', { class: 'input', maxlength: 24, placeholder: 'Course name, e.g. Pirate or Back 18', autocomplete: 'off', autocapitalize: 'words', enterkeyhint: 'done' });
    function add() { var t = inp.value.trim(); if (t) choose(t); }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
    var node = el('div', null, [
      el('p', { class: 'muted', style: { 'margin-bottom': '10px' }, text: 'If this place has more than one course, pick or name the one you are playing. Records are kept for each course.' }),
      box,
      el('div', { class: 'csec', text: 'Add a course' }),
      el('div', { class: 'csearch', style: { 'margin-top': '6px' } }, [inp, el('button', { type: 'button', class: 'btn btn-primary btn-sm', text: 'Add', onclick: add })])
    ]);
    s = Kit.sheet({ title: v.name, node: node });
  }

  // ── Setup ─────────────────────────────────────────────────────────────────
  var S = null, undoStack = [], chosen = null;
  try { chosen = JSON.parse(localStorage.getItem('mg_last_course')); } catch (e) {}
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} if (S && !S.over) Kit.resume.set('Hole ' + (S.hole + 1) + ' of ' + S.holes + (S.course ? ' · ' + label(S.course) : '')); }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  function showSetup() {
    S = null; app.className = 'stage'; dkSet(null);
    var setup = Kit.setup(app, {
      players: { min: 1, max: 6, count: 2 },
      options: [
        { id: 'holes', label: 'Holes', value: 18, choices: [[9, '9'], [18, '18']] },
        { id: 'cap', label: 'Stroke limit per hole', help: 'Most mini golf courses stop counting at 6 on a hole.', value: 6, choices: [[6, '6 strokes', 'No one scores more than 6 on a hole, even if it took more tries.'], [0, 'No limit', 'Every stroke counts, however many it takes.']] }
      ],
      start: 'Start scoring',
      onStart: function (cfg) { start(cfg); }
    });
    var block = el('div');
    function paint() {
      block.innerHTML = '';
      block.appendChild(el('div', { class: 'label', text: 'Course' }));
      var b = el('button', { type: 'button', class: 'course' }, [
        el('span', { class: 'pin', html: PIN }),
        el('span', { class: 'grow', style: { 'min-width': 0 } }, [el('b', { text: chosen ? label(chosen) : 'Pick a course' }), el('small', { text: chosen ? (chosen.place || 'Tap to change') : 'Search nearby or by name (optional)' })]),
        chosen ? el('span', { html: Kit.icon('close'), style: { display: 'flex', color: 'var(--text-3)' }, onclick: function (e) { e.stopPropagation(); chosen = null; localStorage.removeItem('mg_last_course'); paint(); } }) : el('span', { html: Kit.icon('right'), style: { display: 'flex', color: 'var(--text-3)' } })
      ]);
      b.addEventListener('click', function () { pickCourse(function (c) { chosen = c; localStorage.setItem('mg_last_course', JSON.stringify(c)); paint(); }); });
      block.appendChild(b);
    }
    paint();
    setup.el.insertBefore(block, setup.el.querySelector('.k-startdock'));
  }

  function start(cfg) {
    var holes = +cfg.options.holes || 18;
    S = {
      players: cfg.players.map(function (p) { return { name: p.name }; }),
      holes: holes, cap: +cfg.options.cap || 0, hole: 0, course: chosen || null,
      par: parsFor(chosen, holes), strokes: cfg.players.map(function () { var a = []; for (var i = 0; i < holes; i++) a.push(null); return a; }),
      over: false, started: Date.now()
    };
    if (chosen) rememberCourse(chosen);
    undoStack = []; save(); render(); Kit.sfx('pop');
  }

  // ── Scoring ───────────────────────────────────────────────────────────────
  function total(i, upto) { return S.strokes[i].reduce(function (a, v, h) { return a + (v != null && (upto == null || h <= upto) ? v : 0); }, 0); }
  function parThrough(i) { var t = 0; S.strokes[i].forEach(function (v, h) { if (v != null) t += S.par[h]; }); return t; }
  function vsPar(i) { var d = total(i) - parThrough(i); return d === 0 ? 'E' : d > 0 ? '+' + d : String(d); }
  function vsCls(i) { var d = total(i) - parThrough(i); return d < 0 ? 'under' : d > 0 ? 'over' : 'even'; }

  function setStroke(i, v) {
    snapshot();
    if (v != null) { v = Math.max(1, v); if (S.cap) v = Math.min(S.cap, v); }
    S.strokes[i][S.hole] = v; bumped = i;
    Kit.sfx(v === 1 ? 'sparkle' : 'tick'); Kit.haptic('light');
    save(); render();
  }
  function nextHole() {
    var missing = S.players.filter(function (p, i) { return S.strokes[i][S.hole] == null; });
    if (missing.length) {
      Kit.confirm(missing.map(function (p) { return p.name; }).join(', ') + (missing.length === 1 ? " hasn't" : " haven't") + ' got a score here', { ok: 'Give them par', body: 'Or go back and enter their strokes.' }).then(function (ok) {
        if (!ok) return;
        snapshot(); S.players.forEach(function (p, i) { if (S.strokes[i][S.hole] == null) S.strokes[i][S.hole] = S.par[S.hole]; }); advance();
      });
      return;
    }
    snapshot(); advance();
  }
  function advance() {
    var aces = S.players.filter(function (p, i) { return S.strokes[i][S.hole] === 1; });
    if (aces.length) { Kit.callout('Hole in one!'); Kit.confetti({ count: 110 }); Kit.sfx('win'); }
    if (S.hole >= S.holes - 1) { save(); finish(); return; }
    S.hole++; Kit.sfx(aces.length ? 'win' : 'pop'); save(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function finish() {
    S.over = true;
    var tot = S.players.map(function (p, i) { return total(i); });
    var rank = S.players.map(function (p, i) { return { name: p.name, score: tot[i], color: Kit.color(i) }; }).sort(function (a, b) { return a.score - b.score; });
    var tie = rank.length > 1 && rank[1].score === rank[0].score;
    var hl = [];
    S.players.forEach(function (p, i) {
      S.strokes[i].forEach(function (v, h) { if (v === 1) hl.push(p.name + ' got a hole in one on hole ' + (h + 1) + '!'); });
    });
    // Course record check (best total over the same number of holes)
    var prevBest = null;
    if (S.course) try {
      GameHistory.load(KEY).forEach(function (e) {
        if (e.course && e.course.key === S.course.key && e.holes === S.holes) (e.players || []).forEach(function (p) { if (prevBest == null || p.score < prevBest) prevBest = p.score; });
      });
    } catch (e) {}
    if (S.course && prevBest != null && rank[0].score < prevBest) hl.push('New course record: ' + rank[0].name + ' with ' + rank[0].score + ' (old best ' + prevBest + ')');
    S.players.forEach(function (p, i) { var d = total(i) - S.par.reduce(function (a, b) { return a + b; }, 0); if (d <= 0) hl.push(p.name + ' finished ' + (d === 0 ? 'at even par' : Math.abs(d) + ' under par')); });
    var worst = { v: 0 };
    S.players.forEach(function (p, i) { S.strokes[i].forEach(function (v, h) { if (v > worst.v) worst = { v: v, who: p.name, h: h }; }); });
    if (worst.v >= 6) hl.push('Toughest hole: ' + worst.who + ' needed ' + worst.v + ' on hole ' + (worst.h + 1));
    if (S.course) hl.unshift('Played at ' + label(S.course) + (S.course.place ? ', ' + S.course.place : ''));
    var byHole = []; for (var h = 0; h < S.holes; h++) byHole.push(S.strokes.map(function (row) { return row[h] == null ? 0 : row[h]; }));
    Kit.record(KEY, {
      started: S.started, mode: S.holes + ' holes' + (S.course ? ' · ' + label(S.course) : ''), lowWins: true,
      players: S.players.map(function (p, i) { return { name: p.name, score: tot[i] }; }),
      winner: tie ? null : rank[0].name,
      rounds: { labels: byHole.map(function (x, i) { return 'H' + (i + 1); }), scores: byHole },
      highlights: hl,
      meta: { course: S.course, holes: S.holes, par: S.par },
      // the scorecard for history: each player's strokes as one string ('2,3,1,…'), and the stroke cap
      detail: { s: S.strokes.map(function (row) { return row.map(function (v) { return v == null ? '' : v; }).join(','); }), cap: S.cap }
    });
    savePars(); clearSave(); render();
    Kit.win({
      title: rank.length === 1 ? rank[0].score + ' strokes' : tie ? "It's a tie!" : rank[0].name + ' wins!',
      sub: (S.course ? label(S.course) + ' · ' : '') + 'Fewest strokes wins', rank: rank.length > 1 ? rank : null,
      again: function () { start({ players: S.players, options: { holes: S.holes, cap: S.cap } }); },
      look: 'See the scorecard',
      setup: function () { clearSave(); showSetup(); }
    });
  }

  function snapshot() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 60) undoStack.shift(); }
  function undo() { if (!undoStack.length) return Kit.toast('Nothing to undo'); S = JSON.parse(undoStack.pop()); Kit.sfx('whoosh'); save(); render(); }

  // ── Render ────────────────────────────────────────────────────────────────
  // The screen's shape: sideways (wider than tall, 640 wide at least), the scorecard and the green stand side by side
  function sideways() { return innerWidth > innerHeight && innerWidth >= 640; }
  var bumped = -1;
  function render() {
    app.innerHTML = '';
    lastShape = sideways(); lastW = innerWidth;
    app.className = 'stage mg-play' + (lastShape ? ' mg-side' : '');
    var dk = dkShape(); dkSet(dk);
    if (!S.over) {
      var green = el('div', { class: 'green wood' }), turf = el('div', { class: 'turf' });
      var parBtn = el('button', { type: 'button', class: 'parbtn', html: '<span>Par ' + S.par[S.hole] + '</span>' + Kit.icon('pencil') });
      parBtn.addEventListener('click', editPar);
      turf.appendChild(el('div', { class: 'hole-h' }, [el('div', { class: 'hole-l' }, [el('span', { class: 'flag', html: '<svg viewBox="0 0 40 56"><ellipse cx="12" cy="52" rx="10" ry="3" fill="rgba(0,0,0,.3)"/><rect x="11" y="4" width="2.5" height="48" rx="1" fill="#fff"/><path d="M13.5 4 34 11 13.5 18z" fill="#ff4d5e"/></svg>' }), el('div', { class: 'num', html: '<small>Hole</small>' + (S.hole + 1) + '<span style="font-size:1rem;opacity:.7"> / ' + S.holes + '</span>' })]), parBtn]));
      S.players.forEach(function (p, i) {
        var v = S.strokes[i][S.hole];
        var out = el('output', { class: (v == null ? 'empty' : '') + (bumped === i ? ' bump' : ''), text: v == null ? '–' : String(v) });
        var row = el('div', { class: 'prow' + (v === 1 ? ' ace' : '') }, [
          el('span', { class: 'avatar sm', style: { '--c': Kit.color(i) }, text: p.name.charAt(0).toUpperCase() }),
          el('span', { class: 'nm' }, [el('b', { text: p.name }), el('small', { text: total(i) + ' total, ' + vsPar(i) })]),
          el('span', { class: 'stk' }, [
            el('button', { type: 'button', 'aria-label': 'One less stroke for ' + p.name, text: '−', onclick: function () { if (v == null) return; setStroke(i, v <= 1 ? null : v - 1); } }),
            out,
            el('button', { type: 'button', 'aria-label': 'One more stroke for ' + p.name, text: '+', onclick: function () { setStroke(i, v == null ? 1 : v + 1); } })
          ])
        ]);
        turf.appendChild(row);
      });
      var nav = el('div', { class: 'holenav' });
      if (S.hole > 0) nav.appendChild(el('button', { type: 'button', class: 'btn btn-soft', html: Kit.icon('back'), 'aria-label': 'Previous hole', onclick: function () { S.hole--; save(); render(); } }));
      nav.appendChild(el('button', { type: 'button', class: 'btn btn-yellow', text: S.hole === S.holes - 1 ? 'Finish round' : 'Next hole', onclick: nextHole }));
      turf.appendChild(nav);
      green.appendChild(turf);
      app.appendChild(green);
    }
    // Paper scorecard
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'card-h' }, [el('h2', { text: S.course ? label(S.course) : 'Mini Golf' }), el('small', { text: S.over ? 'final' : 'tap a box to jump there' })]));
    app.appendChild(card);
    // Like a real scorecard, the holes come in blocks that fit the card's width (all at once, nine and nine, or sixes):
    // each block has its holes, the par and everyone's strokes, and its last column the block's own sum, the last
    // block's the round's total. Nothing scrolls sideways.
    var W = card.clientWidth || (innerWidth - 32), NAME = 78, SUM = 46, MIN = 25;
    var per = S.holes;
    [S.holes, 9, 6, 3].some(function (n) { if (n > S.holes) return false; per = n; return (W - NAME - SUM) / n >= MIN; });
    // (at a desk, the front nine over the back nine where that makes every box larger than one long row would)
    if (dk && S.holes === 18 && per === 18) {
      var dtop = parseFloat(document.documentElement.style.getPropertyValue('--dkt')) || 58, nwd = Math.max(104, Math.min(200, W * .13)), swd = Math.max(62, Math.min(90, W * .07));
      var colD = innerHeight - dtop - 28 - (dk === 'tall' ? 420 : 0) - 200, hOf = function (pp) { var nb = 18 / pp; return Math.min((W - nwd - swd) / pp * 1.5, (colD - 64 - nb * 40) / (nb * (1 + S.players.length)), 130); };
      if (hOf(9) > hOf(18) * 1.12) per = 9;
    }
    var blocks = []; for (var b0 = 0; b0 < S.holes; b0 += per) blocks.push([b0, Math.min(S.holes, b0 + per)]);
    var sumOf = function (arr, a, z) { var t = 0, any = false; for (var k = a; k < z; k++) if (arr[k] != null) { t += arr[k]; any = true; } return any ? t : null; };
    blocks.forEach(function (bk, bi) {
      var last = bi === blocks.length - 1, two = blocks.length === 2;
      var sumName = last ? 'Total' : two ? 'Out' : 'Sum';
      var tbl = el('table', { class: 'sc' + (bi ? ' more' : '') }), hr = el('tr', null, [el('th', { text: 'Hole' })]);
      for (var h = bk[0]; h < bk[1]; h++) hr.appendChild(el('th', { class: h === S.hole && !S.over ? 'cur' : '', text: String(h + 1) }));
      hr.appendChild(el('th', { class: 'sum', text: sumName }));
      tbl.appendChild(el('thead', null, [hr]));
      var pr = el('tr', { class: 'par' }, [el('th', { text: 'Par' })]);
      for (var h2 = bk[0]; h2 < bk[1]; h2++) pr.appendChild(el('td', { text: String(S.par[h2]) }));
      pr.appendChild(el('td', { text: String(last ? S.par.reduce(function (a, c) { return a + c; }, 0) : sumOf(S.par, bk[0], bk[1])) }));
      tbl.appendChild(pr);
      S.players.forEach(function (p, i) {
        var tr = el('tr', null, [el('th', { text: p.name, style: { color: 'color-mix(in srgb,' + Kit.color(i) + ' 55%,#2a2a3a)' } })]);
        for (var h3 = bk[0]; h3 < bk[1]; h3++) (function (h) {
          var v = S.strokes[i][h];
          var td = el('td', { class: 'v' + (h === S.hole && !S.over ? ' cur' : '') + (v === 1 ? ' ace' : ''), text: v == null ? '' : String(v) });
          td.addEventListener('click', function () { if (S.over) return; S.hole = h; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
          tr.appendChild(td);
        })(h3);
        if (last) tr.appendChild(el('td', { class: 'tot', html: total(i) + '<small class="' + vsCls(i) + '">' + vsPar(i) + '</small>' }));
        else { var st = sumOf(S.strokes[i], bk[0], bk[1]); tr.appendChild(el('td', { class: 'tot sub', text: st == null ? '' : String(st) })); }
        tbl.appendChild(tr);
      });
      card.appendChild(tbl);
    });
    // (a long name eases its size down to fit the column, rather than being cut off)
    card.querySelectorAll('.sc tbody th, .sc tr:not(.par) > th:first-child').forEach(function (th) { Kit.fitText(th, 0.55); });
    if (S.over) app.appendChild(el('div', { class: 'holenav done' }, [el('button', { type: 'button', class: 'btn btn-primary btn-block', text: 'New round', onclick: function () { showSetup(); } })]));
    // (each name eases its size down before it would be cut off)
    app.querySelectorAll('.prow .nm b').forEach(function (b) { Kit.fitText(b, 0.7); });
    bumped = -1;
    if (dk) dkFill(card);
  }

  // ── The desk: a large window (a computer) ─────────────────────────────────
  // The scorecard is the hero, as large as the window gives it, the green with its steppers at the right where the
  // taps go (under the card in a tall window). Room the card can't use holds the round's standings and this course's
  // records from past rounds. A phone's or a tablet's window never gets here (dkShape), and nothing is left behind.
  function dkShape() {
    var w = innerWidth, h = innerHeight, lo = Math.min(w, h), hi = Math.max(w, h);
    if (!S || lo <= 480 && hi <= 1000) return null;                               // phones
    if (lo >= 620 && lo <= 790 && hi <= 1060) return null;                        // the iPad mini, either way up
    if (lo >= 620 && lo <= 840 && hi >= 900 && hi <= 1200 && !(window.matchMedia && matchMedia('(pointer: fine)').matches)) return null;   // other iPads by touch
    if (w < 700 || h < 560) return null;
    if (w < 1000 && w > h) return null;                                           // (a small wide window keeps the sideways layout)
    return w >= 1000 && w >= 1.05 * h ? 'wide' : 'tall';
  }
  function dkSet(dk) {
    var de = document.documentElement, bar = document.querySelector('.gbar');
    de.classList.toggle('mg-dk', !!dk); de.classList.toggle('mg-wide', dk === 'wide'); de.classList.toggle('mg-tall', dk === 'tall');
    if (dk) {
      de.style.setProperty('--dkt', (bar ? Math.max(0, Math.round(bar.getBoundingClientRect().bottom)) : 58) + 'px');
      de.style.setProperty('--dgw', Math.round(Math.max(440, Math.min(600, innerWidth * .3))) + 'px');
    } else ['--dkt', '--dgw', '--dh', '--dph', '--dnw', '--dfv', '--dft'].forEach(function (v) { de.style.removeProperty(v); });
    app.classList.toggle('mg-dkp', !!dk);
  }
  // The card's rows as tall as the room allows (to a comfortable most), and under it the standings and the records
  function dkFill(card) {
    var de = document.documentElement, tall = de.classList.contains('mg-tall'), top = parseFloat(de.style.getPropertyValue('--dkt')) || 58;
    // (a tall window: the green's rows as tall as the room under a card of the smallest rows allows)
    if (tall) de.style.setProperty('--dph', Math.round(Math.max(50, Math.min(96, (innerHeight - top - 28 - 16 - (64 + card.querySelectorAll('table.sc').length * 40 + card.querySelectorAll('table.sc').length * (1 + S.players.length) * 40) - 250) / S.players.length - 10))) + 'px');
    var gr = app.querySelector(':scope > .green, :scope > .holenav.done');
    var col = innerHeight - top - 28 - (tall && gr ? gr.offsetHeight + 16 : 0);
    var nb = card.querySelectorAll('table.sc').length, rows = nb * (1 + S.players.length), head = 64 + nb * 40;
    // (the room under the card needs 170 at least for its standings; without it the card has the column)
    var roomOn = col - head - 40 * rows - 16 >= 170;
    var h = Math.floor(Math.max(36, Math.min(130, (col - head - (roomOn ? 16 + Math.max(170, Math.min(420, 60 + S.players.length * 66)) : 0)) / rows)));
    // (a hole's box no taller than half again its width, and the figures in it sized to both)
    var nw = Math.round(Math.max(104, Math.min(200, card.clientWidth * .13))), sw = Math.max(62, Math.min(90, card.clientWidth * .07));
    var per = Math.max(1, card.querySelector('table.sc thead tr').children.length - 2), cw = (card.clientWidth - nw - sw) / per;
    h = Math.floor(Math.max(36, Math.min(h, cw * 1.5)));
    de.style.setProperty('--dh', h + 'px');
    de.style.setProperty('--dnw', nw + 'px');
    de.style.setProperty('--dfv', Math.round(Math.max(18, Math.min(h * .5, cw * .62))) + 'px');
    de.style.setProperty('--dft', Math.round(Math.max(18, Math.min(h * .5, sw * .42))) + 'px');
    if (!roomOn) return;
    var room = el('div', { class: 'mg-room' });
    // the standings: fewest strokes first, with where each stands against par and how far behind the leader
    var ord = S.players.map(function (p, i) { return i; }).sort(function (a, b) { return total(a) - total(b); });
    var played = S.strokes[0].filter(function (v) { return v != null; }).length;
    var st = el('section', { class: 'pn' }, [el('h4', { text: S.over ? 'How the round ended' : played ? 'Standings after ' + played + (played === 1 ? ' hole' : ' holes') : 'Standings' })]);
    var lead = total(ord[0]);
    ord.forEach(function (i, k) {
      var aces = S.strokes[i].filter(function (v) { return v === 1; }).length, d = total(i) - lead, place = 1;
      ord.forEach(function (j) { if (total(j) < total(i)) place++; });
      var note = (aces ? (aces === 1 ? 'A hole in one. ' : aces + ' holes in one. ') : '') + (!played ? '' : d ? d + (d === 1 ? ' stroke' : ' strokes') + ' behind.' : ord.length > 1 && total(ord[1]) === lead ? 'Tied for the lead.' : ord.length > 1 ? 'In the lead.' : '');
      st.appendChild(el('div', { class: 'srow' }, [
        el('span', { class: 'pl', text: String(place) }),
        el('span', { class: 'avatar sm', style: { '--c': Kit.color(i) }, text: S.players[i].name.charAt(0).toUpperCase() }),
        el('span', { class: 'nm' }, [el('b', { text: S.players[i].name }), note ? el('small', { text: note }) : null]),
        el('span', { class: 'tt' }, [el('b', { text: String(total(i)) }), el('small', { class: vsCls(i), text: vsPar(i) })])
      ]));
    });
    room.appendChild(st);
    // this course's records, from the rounds played here before over the same number of holes
    var best = [], list = []; try { list = GameHistory.load(KEY) || []; } catch (e) {}
    var ck = S.course ? S.course.key : null;
    list.forEach(function (e) {
      if ((e.course ? e.course.key : null) !== ck || e.holes !== S.holes) return;
      (e.players || []).forEach(function (p) { best.push({ name: p.name, score: p.score, at: e._date || e.started || 0 }); });
    });
    best.sort(function (a, b) { return a.score - b.score || a.at - b.at; });
    if (best.length) {
      var rc = el('section', { class: 'pn rec2' }, [el('h4', { text: (S.course ? 'Best rounds at ' + label(S.course) : 'Best rounds with no course picked') + ', over ' + S.holes + ' holes' })]);
      best.slice(0, 8).forEach(function (b, k) {
        rc.appendChild(el('div', { class: 'brow' }, [el('span', { class: 'pl', text: String(k + 1) }), el('span', { class: 'nm', text: b.name }),
          el('span', { class: 'dt', text: b.at ? new Date(b.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '' }), el('b', { text: String(b.score) })]));
      });
      room.appendChild(rc);
    }
    app.appendChild(room);
    // (a list gives up its last rows whole, never a row cut through)
    requestAnimationFrame(function () {
      room.querySelectorAll('.pn').forEach(function (pn) {
        var bt = pn.getBoundingClientRect().bottom, rs = pn.querySelectorAll('.srow, .brow');
        for (var q = rs.length - 1; q >= 0; q--) { if (rs[q].getBoundingClientRect().bottom <= bt - 8) break; rs[q].style.display = 'none'; }
      });
    });
  }
  // Turning the device: the green and the scorecard glide to the new shape (a View Transition); a new width also
  // re-blocks the scorecard's holes, so the page is drawn again for it
  var lastShape = null, lastW = innerWidth, rT = null;
  window.addEventListener('resize', function () {
    clearTimeout(rT);
    rT = setTimeout(function () {
      if (!S || !app.classList.contains('mg-play')) return;
      var sh = sideways(); if (sh === lastShape && innerWidth === lastW && !dkShape() && !document.documentElement.classList.contains('mg-dk')) return;
      if (sh !== lastShape && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden) { try { document.startViewTransition(render); return; } catch (e) {} }
      render();
    }, 60);
  });
  function editPar() {
    var grid = el('div', { class: 'seg' }), s;
    [1, 2, 3, 4, 5, 6].forEach(function (v) {
      grid.appendChild(el('button', { type: 'button', class: S.par[S.hole] === v ? 'on' : '', text: String(v), onclick: function () {
        snapshot(); S.par[S.hole] = v; savePars(); save(); s.close(); render();
      } }));
    });
    s = Kit.sheet({ title: 'Par for hole ' + (S.hole + 1), node: el('div', null, [grid, el('p', { class: 'muted', style: { 'margin-top': '10px' }, text: S.course ? 'Saved for ' + label(S.course) + ' next time.' : 'Pick a course in setup to remember pars.' })]) });
  }

  // ── Courses & records ─────────────────────────────────────────────────────
  function showCourses() {
    var list = []; try { list = GameHistory.load(KEY); } catch (e) {}
    var venues = {};
    list.forEach(function (e) {
      var c = e.course, vk = c ? (c.venue || c.key) : 'none', ck = c ? c.key : 'none';
      var v = venues[vk] = venues[vk] || { course: c, courses: {}, last: 0 };
      v.last = Math.max(v.last, e._date || 0);
      var g = v.courses[ck] = v.courses[ck] || { sub: c ? c.sub : '', rounds: 0, best: {} };
      g.rounds++;
      (e.players || []).forEach(function (p) {
        var key = p.name + '|' + (e.holes || '');
        if (!g.best[key] || p.score < g.best[key].score) g.best[key] = { name: p.name, score: p.score, holes: e.holes };
      });
    });
    var box = el('div', { class: 'recs' });
    var keys = Object.keys(venues).sort(function (a, b) { return venues[b].last - venues[a].last; });
    if (!keys.length) box.appendChild(el('p', { class: 'muted', text: 'Finish a round to start your course records.' }));
    keys.forEach(function (k) {
      var v = venues[k], c = v.course;
      var r = el('div', { class: 'rec' }, [
        el('b', { text: c ? c.name : 'No course picked' }),
        el('small', { text: (c && c.place ? c.place + ', ' : '') + 'last played ' + new Date(v.last).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) })
      ]);
      Object.keys(v.courses).forEach(function (ck) {
        var g = v.courses[ck], bests = Object.keys(g.best).map(function (x) { return g.best[x]; }).sort(function (a, b) { return a.score - b.score; });
        r.appendChild(el('div', { class: 'best', html: '<b style="display:inline">' + Kit.esc(g.sub || (Object.keys(v.courses).length > 1 ? 'Main course' : 'Course')) + '</b>, ' + g.rounds + (g.rounds === 1 ? ' round' : ' rounds') +
          '<br>Best: ' + Kit.esc(bests.slice(0, 4).map(function (b) { return b.name + ' ' + b.score + (b.holes ? ' over ' + b.holes + ' holes' : ''); }).join(', ')) }));
      });
      if (c && c.lat != null) r.appendChild(el('a', { href: 'https://maps.apple.com/?ll=' + c.lat + ',' + c.lon + '&q=' + encodeURIComponent(c.name), target: '_blank', rel: 'noopener', class: 'btn btn-soft btn-sm', style: { 'margin-top': '8px' }, html: PIN + '<span>Open in Maps</span>' }));
      box.appendChild(r);
    });
    Kit.sheet({ title: 'Courses & records', node: box, actions: [{ label: 'Close', cls: 'btn-soft' }] });
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.players && !saved.over) { S = saved; render(); } else showSetup();
  // (demos and tests: a round with these players and no course picked, and the round changed and drawn again)
  window.__mg = { state: function () { return S; }, start: function (cfg) { chosen = null; start(cfg); }, set: function (fn) { fn(S); save(); render(); } };
})();
</script>

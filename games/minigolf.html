<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mini Golf</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
body{background:radial-gradient(900px 520px at 60% -10%,rgba(34,197,94,.14),transparent 65%),var(--bg);}
.page{max-width:620px;padding-top:14px;}
.field{margin-bottom:14px;}
.field label{margin-bottom:6px;}
.seg{display:flex;gap:8px;align-items:center;}
.seg .tabs{margin:0;flex:1;}
.seg .tab{flex:1 1 0;min-height:40px;}
#mg-holes-custom{width:84px;text-align:center;}
.stepper{display:inline-flex;align-items:center;gap:0;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;}
.stepper button{width:48px;height:48px;border:0;background:transparent;color:var(--text);font-size:1.4rem;font-weight:600;cursor:pointer;}
.stepper button:active{background:var(--surface-3);}
.stepper .val{min-width:44px;text-align:center;font-family:var(--display);font-size:1.3rem;font-weight:800;}
.player-setup-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.player-setup-row > .player-dot{margin-top:18px;}
.player-setup-row .player-dot{width:14px;height:14px;box-shadow:0 0 0 3px rgba(255,255,255,.06);}
.pl-actions{display:flex;gap:8px;margin-top:4px;}
/* In-game */
.mg-venue-display{text-align:center;margin-bottom:12px;}
.mg-venue-name{font-family:var(--display);font-size:1.25rem;font-weight:800;color:var(--text);letter-spacing:-.01em;}
.mg-course-name{font-size:.85rem;color:var(--text-2);margin-top:1px;}
.hole-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:14px;}
.hole-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.hole-nav .icon-btn{width:44px;height:44px;font-size:1.3rem;}
.hole-nav .icon-btn:disabled{opacity:.3;}
.hole-title{text-align:center;}
.hole-num{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1;}
.hole-par{font-size:.8rem;font-weight:600;color:var(--text-2);}
.hole-dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:-2px 0 12px;}
.hole-dots button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);background:transparent;color:var(--text-3);font-size:.7rem;font-weight:700;cursor:pointer;padding:0;}
.hole-dots button.done{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.4);color:var(--green);}
.hole-dots button.cur{background:var(--text);color:var(--bg);border-color:var(--text);}
.stroke-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);}
.stroke-row:first-of-type{border-top:0;}
.stroke-name{flex:1;min-width:0;font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;}
.stroke-name small{display:block;font-size:.75rem;font-weight:600;color:var(--text-3);}
.stroke-row .stepper .val{min-width:52px;font-size:1.5rem;}
.stroke-row .stepper .val.empty{color:var(--text-3);}
.stroke-row .stepper button{width:52px;height:52px;}
.next-row{display:flex;gap:8px;margin-top:12px;}
.next-row .btn{flex:1;}
/* Scorecard */
.sc-title{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:0 0 8px 2px;}
.sc-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
.sc-table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums;}
.sc-table th{padding:9px 8px;text-align:center;font-weight:700;color:var(--text-3);font-size:.75rem;white-space:nowrap;border-bottom:1px solid var(--line-2);}
.sc-table td{padding:0;text-align:center;border-bottom:1px solid var(--line);}
.sc-table tr:last-child td{border-bottom:none;}
.sc-table tr.cur-row{background:rgba(245,200,66,.07);}
.sc-table tr.totals-row td{background:var(--surface-2);font-weight:800;padding:10px 6px;}
.sc-table .row-label{text-align:left;color:var(--text-2);font-size:.82rem;white-space:nowrap;padding:0 10px;}
.sc-table .par-cell{color:var(--text-3);font-size:.8rem;}
.sc-table button.sc-cell{width:100%;min-height:40px;border:0;background:transparent;color:var(--text);font-size:.95rem;font-weight:700;cursor:pointer;}
.sc-table button.sc-cell.empty{color:var(--text-3);}
.sc-table button.sc-cell.under{color:var(--green);}
.sc-table button.sc-cell.over{color:#fca5a5;}
.vs-par{font-size:.75rem;}
.vs-par.under{color:var(--green);}.vs-par.over{color:var(--red);}.vs-par.even{color:var(--text-3);}
.low-wins-note{font-size:.8rem;color:var(--text-3);text-align:center;margin-bottom:10px;}
#mg-winner{margin-bottom:14px;}
#mg-winner .gh-hist-btn{margin-top:12px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a>
  <span class="nav-title">Mini Golf</span>
  <button class="btn btn-outline btn-sm hidden" id="mg-new-setup">New</button>
</nav>
<div class="page">
<div id="mg-setup" class="setup-screen">
    <div class="card">
      <div class="field">
        <label for="mg-venue">Venue / Place</label>
        <input class="input" id="mg-venue" placeholder="e.g. Adventure Golf at Lakeside" maxlength="40">
      </div>
      <div class="field">
        <label for="mg-course">Course name (optional)</label>
        <input class="input" id="mg-course" placeholder="e.g. Jungle Course" maxlength="32">
      </div>
      <div class="field">
        <label>Holes</label>
        <div class="seg">
          <div class="tabs">
            <button class="tab mg-holes-btn active active-dir" data-h="9">9</button>
            <button class="tab mg-holes-btn" data-h="18">18</button>
            <button class="tab mg-holes-btn" data-h="custom">Custom</button>
          </div>
          <input class="input" type="number" inputmode="numeric" id="mg-holes-custom" min="1" max="99" value="12" style="display:none;">
        </div>
      </div>
      <div class="field" style="margin-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div><label style="margin:0;">Par per hole</label><div style="font-size:.8rem;color:var(--text-3);">Default for all holes</div></div>
        <input type="hidden" id="mg-par" value="3">
        <div class="stepper"><button type="button" id="par-dn" aria-label="Lower par">−</button><span class="val" id="par-val">3</span><button type="button" id="par-up" aria-label="Raise par">+</button></div>
      </div>
    </div>
    <div class="card">
      <label>Players (1–6)</label>
      <div id="mg-names"></div>
      <div class="pl-actions">
        <button class="btn btn-outline btn-sm" id="mg-add-player">+ Add player</button>
        <button class="btn btn-ghost btn-sm" id="mg-rem-player">Remove</button>
      </div>
    </div>
    <button class="btn btn-gold btn-block" id="mg-start">Start Round</button>
  </div>
  <div id="mg-game" class="hidden">
    <div class="mg-venue-display">
      <div class="mg-venue-name" id="mg-venue-display"></div>
      <div class="mg-course-name" id="mg-course-display"></div>
    </div>
    <div id="mg-winner" class="winner-banner hidden">
      <div class="winner-name" id="mg-wname"></div>
      <div class="winner-pts" id="mg-wpts"></div>
    </div>
    <div class="hole-card" id="hole-card"></div>
    <div class="sc-title">Scorecard · lowest wins</div>
    <div class="sc-table-wrap">
      <table class="sc-table" id="mg-table"></table>
    </div>
  </div>
</div>
<script>
'use strict';
const COLORS=['#f5c842','#ff7a5a','#5ac8fa','#7ed47e','#c084fc','#fb923c'];
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// ── MINI GOLF ───────────────────────────────────────────────────────────────
{
  let mgVenue='',mgCourse='',mgHoles=9,mgPar=3;
  let mgNames=['Player 1','Player 2'],mgN=2;
  let mgScores=[];
  let curHole=0, savedSig=null;

  function mgBuildNames(){
    const c=document.getElementById('mg-names');
    const prev=[...c.querySelectorAll('input')].map(i=>i.value);
    c.innerHTML='';
    for(let i=0;i<mgN;i++){
      const row=document.createElement('div');row.className='player-setup-row';
      row.innerHTML=`<div class="player-dot" style="background:${COLORS[i]}"></div>
        <div style="flex:1;min-width:0"><input class="input" id="mgn${i}" placeholder="Player ${i+1}" maxlength="16" autocomplete="off"></div>`;
      const v=prev[i]!=null?prev[i]:(mgNames[i]&&!/^Player \d+$/.test(mgNames[i])?mgNames[i]:'');
      row.querySelector('input').value=v;
      c.appendChild(row);
    }
    if(typeof FrequentPlayers!=="undefined") FrequentPlayers.attachPickersByPrefix("mgn");
    document.getElementById('mg-rem-player').disabled=mgN<=1;
    document.getElementById('mg-add-player').disabled=mgN>=6;
  }
  document.getElementById('mg-add-player').addEventListener('click',()=>{if(mgN<6){mgN++;mgBuildNames();GN.haptic('light');document.getElementById('mgn'+(mgN-1)).focus();}});
  document.getElementById('mg-rem-player').addEventListener('click',()=>{if(mgN>1){mgN--;mgBuildNames();GN.haptic('light');}});
  function setPar(v){mgPar=Math.max(2,Math.min(6,v));document.getElementById('mg-par').value=mgPar;document.getElementById('par-val').textContent=mgPar;}
  document.getElementById('par-dn').addEventListener('click',()=>{setPar(mgPar-1);GN.haptic('select');});
  document.getElementById('par-up').addEventListener('click',()=>{setPar(mgPar+1);GN.haptic('select');});
  document.querySelectorAll('.mg-holes-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.mg-holes-btn').forEach(x=>x.classList.remove('active-dir','active'));
      b.classList.add('active-dir','active');
      GN.haptic('select');
      const customInput=document.getElementById('mg-holes-custom');
      if(b.dataset.h==='custom'){
        customInput.style.display='block';
        mgHoles=Math.max(1,Math.min(99,parseInt(customInput.value)||9));
        customInput.oninput=()=>{mgHoles=Math.max(1,Math.min(99,parseInt(customInput.value)||9));};
        customInput.focus();customInput.select();
      } else {
        customInput.style.display='none';
        mgHoles=+b.dataset.h;
      }
    });
  });
  mgBuildNames();

  function showGame(){
    document.getElementById('mg-setup').classList.add('hidden');
    document.getElementById('mg-game').classList.remove('hidden');
    document.getElementById('mg-new-setup').classList.remove('hidden');
    document.getElementById('mg-venue-display').textContent=mgVenue;
    document.getElementById('mg-course-display').textContent=mgCourse;
  }
  function mgStart(){
    mgVenue=document.getElementById('mg-venue').value.trim()||'Mini Golf';
    mgCourse=document.getElementById('mg-course').value.trim();
    const activeHoleBtn=document.querySelector('.mg-holes-btn.active-dir');
    if(activeHoleBtn?.dataset.h==='custom'){
      mgHoles=Math.max(1,Math.min(99,parseInt(document.getElementById('mg-holes-custom').value)||9));
    } else {
      mgHoles=+activeHoleBtn?.dataset.h||9;
    }
    mgPar=Math.max(2,Math.min(6,parseInt(document.getElementById('mg-par').value)||3));
    mgNames=Array.from({length:mgN},(_,i)=>document.getElementById('mgn'+i).value.trim()||`Player ${i+1}`);
    mgScores=Array.from({length:mgHoles},()=>Array(mgN).fill(null));
    curHole=0;savedSig=null;
    document.getElementById('mg-winner').classList.add('hidden');
    showGame();
    mgRender();
    GN.haptic('medium');
    window.scrollTo(0,0);
  }

  function mgTotals(){return mgNames.map((_,p)=>mgScores.reduce((s,r)=>s+(r[p]!=null?r[p]:0),0));}
  function holeDone(h){return mgScores[h].every(v=>v!=null);}
  function firstOpenHole(){const i=mgScores.findIndex(r=>r.some(v=>v==null));return i<0?mgHoles-1:i;}

  function setStroke(p,delta){
    const cur=mgScores[curHole][p];
    // First tap: + enters par, − enters par−1 (a birdie); then step by one
    let v=cur==null?(delta>0?mgPar:mgPar-1):cur+delta;
    v=Math.max(1,Math.min(20,v));
    mgScores[curHole][p]=v;
    GN.haptic('select');
    mgSave();mgRender();
  }
  function clearStroke(p){mgScores[curHole][p]=null;mgSave();mgRender();}
  function goHole(h){curHole=Math.max(0,Math.min(mgHoles-1,h));GN.haptic('light');mgRender();}

  function renderHoleCard(){
    const hc=document.getElementById('hole-card');
    const done=holeDone(curHole);
    const dots=mgHoles<=18?`<div class="hole-dots">${mgScores.map((r,h)=>`<button data-go="${h}" class="${h===curHole?'cur':holeDone(h)?'done':''}" aria-label="Hole ${h+1}">${h+1}</button>`).join('')}</div>`:'';
    const allFilled=mgScores.every(r=>r.every(v=>v!=null));
    hc.innerHTML=`<div class="hole-nav">
        <button class="icon-btn" data-go="${curHole-1}" ${curHole===0?'disabled':''} aria-label="Previous hole">‹</button>
        <div class="hole-title"><div class="hole-num">Hole ${curHole+1}<span style="color:var(--text-3);font-size:1rem;font-weight:700"> / ${mgHoles}</span></div><div class="hole-par">Par ${mgPar}</div></div>
        <button class="icon-btn" data-go="${curHole+1}" ${curHole===mgHoles-1?'disabled':''} aria-label="Next hole">›</button>
      </div>${dots}
      ${mgNames.map((n,p)=>{const v=mgScores[curHole][p];return `<div class="stroke-row">
        <div class="stroke-name"><span class="player-dot" style="background:${COLORS[p]}"></span><div style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(n)}<small>${mgTotals()[p]} total</small></div></div>
        <div class="stepper"><button data-dn="${p}" aria-label="Fewer strokes for ${esc(n)}">−</button><span class="val${v==null?' empty':''}" data-clear="${p}">${v==null?'—':v}</span><button data-up="${p}" aria-label="More strokes for ${esc(n)}">+</button></div>
      </div>`;}).join('')}
      <div class="next-row">${curHole<mgHoles-1
        ?`<button class="btn ${done?'btn-gold':'btn-outline'}" data-go="${curHole+1}">Next hole ›</button>`
        :allFilled?'':`<button class="btn btn-outline" data-go="${firstOpenHole()}">Go to first unfinished hole</button>`}</div>`;
    hc.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>goHole(+b.dataset.go)));
    hc.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>setStroke(+b.dataset.up,1)));
    hc.querySelectorAll('[data-dn]').forEach(b=>b.addEventListener('click',()=>setStroke(+b.dataset.dn,-1)));
    hc.querySelectorAll('[data-clear]').forEach(b=>b.addEventListener('dblclick',()=>clearStroke(+b.dataset.clear)));
    const nr=hc.querySelector('.next-row');if(!nr.innerHTML.trim())nr.remove();
  }

  function mgRender(){ renderHoleCard(); mgRenderTable(); }

  function mgRenderTable(){
    const tbl=document.getElementById('mg-table');
    const totals=mgTotals();
    const totalPar=mgPar*mgHoles;
    const allFilled=mgScores.every(r=>r.every(v=>v!=null));
    const best=Math.min(...totals);

    let html=`<thead><tr><th class="row-label">Hole</th><th class="par-cell">Par</th>${mgNames.map((n,i)=>`<th class="player-th" style="color:${COLORS[i]}">${esc(n)}</th>`).join('')}</tr></thead><tbody>`;
    for(let h=0;h<mgHoles;h++){
      html+=`<tr class="${h===curHole?'cur-row':''}"><td class="row-label">${h+1}</td><td class="par-cell">${mgPar}</td>${mgNames.map((_,p)=>{const v=mgScores[h][p];const c=v==null?'empty':v<mgPar?'under':v>mgPar?'over':'';return `<td><button class="sc-cell ${c}" data-h="${h}" data-p="${p}">${v!=null?v:'—'}</button></td>`;}).join('')}</tr>`;
    }
    html+=`<tr class="totals-row"><td class="row-label">Total</td><td class="par-cell">${totalPar}</td>${totals.map((t,i)=>{
      const played=mgScores.filter(r=>r[i]!=null).length;
      const diff=t-(mgPar*played);
      const cls=diff<0?'under':diff>0?'over':'even';
      const diffStr=diff===0?'E':diff>0?'+'+diff:String(diff);
      return `<td style="color:${COLORS[i]}">${t} <span class="vs-par ${cls}">(${diffStr})</span>${allFilled&&t===best?' 🏆':''}</td>`;
    }).join('')}</tr>`;
    html+='</tbody>';
    tbl.innerHTML=html;

    // Tap any scorecard cell to jump to that hole
    tbl.querySelectorAll('button.sc-cell').forEach(el=>{
      el.addEventListener('click',()=>{goHole(+el.dataset.h);document.getElementById('hole-card').scrollIntoView({behavior:'smooth',block:'start'});});
    });

    const wb=document.getElementById('mg-winner');
    if(!allFilled){wb.classList.add('hidden');return;}
    const wi=totals.indexOf(best);
    const diff=best-(mgPar*mgHoles);
    const diffStr=diff===0?'Even par':diff>0?`+${diff} over par`:`${Math.abs(diff)} under par`;
    const wasHidden=wb.classList.contains('hidden');
    wb.classList.remove('hidden');
    document.getElementById('mg-wname').textContent=mgNames[wi]+' Wins! ⛳';
    document.getElementById('mg-wpts').textContent=`${best} strokes · ${diffStr}`;
    // Save once per finished card (not on every edit / re-render)
    const sig=JSON.stringify(mgScores);
    if(savedSig===null){
      savedSig=sig;
      GameHistory.save('mg',{_summary:`${mgVenue}${mgCourse?' · '+mgCourse:''} · ${mgNames[wi]} wins`,_badge:best+' strokes',winner:mgNames[wi],venue:mgVenue,course:mgCourse,holes:mgHoles,par:mgPar,names:mgNames,totals,scores:mgScores});
      GN.haptic('success');
      if(wasHidden)setTimeout(()=>wb.scrollIntoView({behavior:'smooth',block:'center'}),150);
    }
    if(!wb.querySelector('.gh-hist-btn')){
      const b=GameHistory.btn('mg','Mini Golf',e=>{
        const div=document.createElement('div');
        const vDiv=document.createElement('div');vDiv.style.cssText='text-align:center;margin-bottom:8px;';
        vDiv.innerHTML=`<div style="font-weight:700;color:var(--gold)">${esc(e.venue)}</div>${e.course?`<div style="font-size:.75rem;color:rgba(255,255,255,.4)">${esc(e.course)}</div>`:''}`;
        div.appendChild(vDiv);
        div.appendChild(GameHistory.renderStatGrid([{val:e.winner,lbl:'Winner'},{val:e.totals[e.names.indexOf(e.winner)]+' strokes',lbl:'Score'},{val:e.holes+'H / par '+e.par,lbl:'Course'}]));
        // Hole-by-hole table
        const tbl=document.createElement('table');tbl.className='gh-ro-table';
        let th=`<thead><tr><th class="gh-rl">Hole</th><th style="color:rgba(255,255,255,.3)">Par</th>${e.names.map((n,i)=>`<th style="color:${COLORS[i]}">${esc(n)}</th>`).join('')}</tr></thead>`;
        let tb='<tbody>';
        for(let h=0;h<e.holes;h++){tb+=`<tr><td class="gh-rl">${h+1}</td><td style="color:rgba(255,255,255,.3)">${e.par}</td>${e.scores[h].map(v=>`<td>${v!=null?v:'—'}</td>`).join('')}</tr>`;}
        const played=e.scores.filter(r=>r.some(v=>v!=null)).length;
        tb+=`<tr class="gh-totals"><td class="gh-rl">Total</td><td style="color:rgba(255,255,255,.3)">${e.par*e.holes}</td>${e.totals.map((t,i)=>{const d=t-e.par*played;const ds=d===0?'E':d>0?'+'+d:String(d);return`<td style="color:${COLORS[i]}">${t} (${ds})</td>`;}).join('')}</tr>`;
        tb+='</tbody>';tbl.innerHTML=th+tb;div.appendChild(tbl);
        return div;
      });
      b.classList.add('gh-hist-btn');b.classList.remove('btn-sm');wb.appendChild(b);
    }
  }

  function mgSave(){try{sessionStorage.setItem('cs_mg',JSON.stringify({mgVenue,mgCourse,mgHoles,mgPar,mgNames,mgN,mgScores,_ts:Date.now()}));}catch(e){}}
  function mgLoad(){
    try{
      const raw=sessionStorage.getItem('cs_mg');if(!raw)return false;
      const s=JSON.parse(raw);if(!s.mgNames)return false;
      mgVenue=s.mgVenue;mgCourse=s.mgCourse;mgHoles=s.mgHoles;mgPar=s.mgPar;
      mgNames=s.mgNames;mgN=s.mgN||s.mgNames.length;mgScores=s.mgScores;
      curHole=firstOpenHole();
      // A finished card restored from this session was already saved to history
      if(mgScores.every(r=>r.every(v=>v!=null)))savedSig=JSON.stringify(mgScores);
      showGame();
      mgRender();return true;
    }catch(e){return false;}
  }
  document.getElementById('mg-start').addEventListener('click',()=>{mgStart();mgSave();});
  document.getElementById('mg-new-setup').addEventListener('click',async()=>{
    const any=mgScores.some(r=>r.some(v=>v!=null));
    const finished=mgScores.length&&mgScores.every(r=>r.every(v=>v!=null));
    if(any&&!finished&&!(await GN.confirm('This scorecard will be cleared.',{title:'Start a new round?',ok:'New round',danger:true})))return;
    document.getElementById('mg-game').classList.add('hidden');
    document.getElementById('mg-setup').classList.remove('hidden');
    document.getElementById('mg-new-setup').classList.add('hidden');
    mgN=mgNames.length;mgBuildNames();
    try{sessionStorage.removeItem('cs_mg');}catch(e){}
    window.scrollTo(0,0);
  });
  mgLoad();
}
</script>
</body>
</html>

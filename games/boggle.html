<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boggle</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../data/words-en.js"></script>
<style>
body{overflow-x:hidden;}
.bg{max-width:520px;margin:0 auto;padding:0 12px calc(var(--safe-b) + 14px);}
.bg.play{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - var(--safe-t) - 58px);}

/* Status row: player, score, sand timer */
.st{display:flex;align-items:center;gap:10px;min-height:56px;}
.st .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;}
.st .who .avatar{width:36px;height:36px;}
.st .who b{display:block;font-family:var(--display);font-weight:400;font-size:1.25rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st .who small{display:block;font-size:.78rem;font-weight:800;color:var(--text-3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st .who > div{min-width:0;}
.glass{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:999px;background:rgba(0,0,0,.25);}
.glass svg{width:30px;height:44px;transition:transform .7s var(--spring);}
.glass.flip svg{animation:flip .7s var(--ease);}
@keyframes flip{from{transform:rotate(-180deg);}to{transform:none;}}
.glass .t{font-family:var(--display);font-size:1.45rem;min-width:52px;text-align:right;font-variant-numeric:tabular-nums;}
.glass.low .t{color:var(--red);animation:lowp 1s ease infinite;}
@keyframes lowp{50%{opacity:.5;}}
.glass.off{opacity:.55;}
.done-btn{min-height:40px;padding:0 14px;}

/* Table and plastic tray */
.tbl{border-radius:26px;padding:8px;}
.tbl .felt-in{position:relative;border-radius:20px;padding:14px;}
.tray{--n:4;position:relative;margin:0 auto;width:min(100%,440px);aspect-ratio:1;border-radius:22px;padding:5%;
  background:
    radial-gradient(120% 70% at 30% 10%, rgba(255,255,255,.35), rgba(255,255,255,0) 45%),
    linear-gradient(160deg,#ff9a3d 0%,#f06a12 55%,#c94f05 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45), inset 0 -6px 0 rgba(0,0,0,.25), 0 10px 0 #8f3a04, 0 18px 30px rgba(0,0,0,.5);
  touch-action:none;user-select:none;-webkit-user-select:none;}
.grid{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:4%;width:100%;height:100%;}
.well{position:relative;border-radius:16%;background:rgba(110,40,0,.45);box-shadow:inset 0 4px 8px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.3);}
.cube{position:absolute;inset:3%;border-radius:16%;display:grid;place-items:center;
  background:radial-gradient(110% 110% at 30% 22%, #ffffff 0%, #f7f2e6 45%, #ddd3bc 100%);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), inset 0 2px 1px rgba(255,255,255,.95), 0 4px 0 #b8ab8e, 0 7px 10px rgba(0,0,0,.4);
  transition:transform .12s var(--spring), background .15s;}
.cube b{font-family:"Arial Black","Helvetica Neue",var(--display);font-weight:900;font-size:calc(min(100vw - 72px, 440px) / var(--n) * .46);color:#1b1a24;line-height:1;transform:rotate(var(--rot,0deg));letter-spacing:-.02em;}
.cube b.qu{font-size:calc(min(100vw - 72px, 440px) / var(--n) * .36);}
.cube.path{background:radial-gradient(110% 110% at 30% 22%, #fff8d6 0%, #ffe07a 50%, #f5bf2a 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), 0 4px 0 #b88a12, 0 7px 10px rgba(0,0,0,.4);transform:translateY(2px);}
.cube.last{background:radial-gradient(110% 110% at 30% 22%, #fff3c0 0%, #ffc93d 50%, #ef9d00 100%);transform:translateY(3px) scale(.97);}
.cube.good{background:radial-gradient(110% 110% at 30% 22%, #eafff0 0%, #7ee2a2 55%, #2fbf6a 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), 0 4px 0 #1d8a4f, 0 7px 10px rgba(0,0,0,.4);}
.cube.bad{background:radial-gradient(110% 110% at 30% 22%, #fff0f0 0%, #ff9aa3 55%, #e5485a 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), 0 4px 0 #a8202e, 0 7px 10px rgba(0,0,0,.4);animation:shake .35s;}
.cube.dup{background:radial-gradient(110% 110% at 30% 22%, #f2f6ff 0%, #a9c6ff 55%, #5d8ee8 100%);}
.cube.tumble{animation:tumble .16s linear infinite alternate;}
@keyframes tumble{from{transform:translate(var(--tx,-6px),var(--ty,4px)) rotate(var(--tr,-12deg));}to{transform:translate(calc(var(--tx,-6px) * -1),calc(var(--ty,4px) * -1)) rotate(calc(var(--tr,-12deg) * -1));}}
.cube.settle{animation:settle .45s var(--spring);}
@keyframes settle{0%{transform:translateY(-10px) scale(1.06);}60%{transform:translateY(2px) scale(.98);}100%{transform:none;}}
svg.trace{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible;}
svg.trace polyline{fill:none;stroke:rgba(255,150,0,.38);stroke-linecap:round;stroke-linejoin:round;}
.pop{position:absolute;left:50%;top:40%;z-index:6;pointer-events:none;font-family:var(--display);font-size:2.2rem;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4);animation:popup .9s var(--ease) forwards;}
@keyframes popup{0%{opacity:0;transform:translate(-50%,10px) scale(.6);}25%{opacity:1;transform:translate(-50%,0) scale(1.1);}100%{opacity:0;transform:translate(-50%,-50px) scale(1);}}

/* Lid: covers the board between players */
.lid{position:absolute;inset:-2px;z-index:8;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;
  background:
    radial-gradient(120% 70% at 30% 10%, rgba(255,255,255,.28), rgba(255,255,255,0) 45%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px),
    linear-gradient(160deg,#2a5bd7,#173a99);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35), inset 0 -6px 0 rgba(0,0,0,.3);transition:transform .5s var(--ease), opacity .4s;}
.lid.up{transform:translateY(-110%) rotate(-6deg);opacity:0;pointer-events:none;}
.lid h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,7vw,2.2rem);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);}
.lid p{color:rgba(255,255,255,.85);font-weight:700;max-width:280px;}
.lid .logo{font-family:var(--display);font-size:clamp(2rem,10vw,3rem);letter-spacing:.06em;color:#ffd23d;text-shadow:0 4px 0 #9a3c00;}
.lid .btn{min-width:220px;}

/* Word line and found words */
.wordrow{display:flex;align-items:center;gap:8px;}
.cur{flex:1;min-width:0;height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:rgba(0,0,0,.25);
  font-family:var(--display);font-size:1.6rem;letter-spacing:.1em;color:var(--yellow);white-space:nowrap;overflow:hidden;}
.cur.empty{font-family:var(--font);font-size:.92rem;font-weight:700;letter-spacing:0;color:var(--text-3);}
.cur.no{color:var(--text-3);}
.wordrow .btn{min-height:52px;}
.wordrow .icon-btn{width:52px;height:52px;border-radius:14px;}
.found{flex:1;min-height:90px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:10px;border-radius:16px;background:rgba(255,255,255,.04);overflow:auto;}
.found .none{color:var(--text-3);font-size:.9rem;font-weight:700;}
.fw{display:inline-flex;align-items:baseline;gap:4px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:800;font-size:.9rem;text-transform:uppercase;letter-spacing:.03em;}
.fw small{font-size:.72rem;color:var(--text-3);}
.fw.l5{background:rgba(77,163,255,.18);}
.fw.l6{background:rgba(61,220,132,.18);}
.fw.l7{background:rgba(255,200,61,.22);}
.fw.l8{background:rgba(255,92,154,.24);}
.fw.new{animation:pop .4s var(--spring);}
.fw.x{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55;}
.fw.x small{display:none;}

/* Results sheet */
.res{display:flex;flex-direction:column;gap:10px;}
.rp{border-radius:16px;background:rgba(255,255,255,.05);padding:10px 12px;}
.rp .h{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.rp .h b{flex:1;font-weight:900;}
.rp .h .sc{font-family:var(--display);font-size:1.4rem;}
.rp .ws{display:flex;flex-wrap:wrap;gap:5px;}
.rp .ws .fw{font-size:.82rem;padding:4px 8px;}
.allw{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.allw .fw{font-size:.8rem;padding:4px 8px;background:rgba(255,255,255,.05);color:var(--text-3);}
.allw .fw.got{background:rgba(61,220,132,.16);color:var(--text);}
.sumrow{display:flex;gap:8px;margin:4px 0 6px;}
.sumrow div{flex:1;text-align:center;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.05);}
.sumrow b{display:block;font-size:1.35rem;font-weight:900;}
.sumrow span{font-size:.7rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;}
.between{display:flex;flex-direction:column;gap:10px;}
.tot{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tot .score{min-width:70px;flex:0 1 auto;}
@media (min-width:900px){
  .bg.play{max-width:980px;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto 1fr;column-gap:20px;align-content:start;}
  .bg.play .st{grid-column:1/-1;}
  .bg.play .tbl{grid-column:1;grid-row:2/4;}
  .bg.play .side{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .found{max-height:none;}
}
.side{display:contents;}
@media (min-width:900px){.side{display:flex;}}
</style>
</head>
<body>
<main class="bg" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'boggle_state', KEY = 'boggle';

  // ── Real Boggle cubes ─────────────────────────────────────────────────────
  // 16 cubes of the current Boggle; 25 cubes of Big Boggle. Q reads "Qu".
  var CUBES4 = ['AAEEGN', 'ABBJOO', 'ACHOPS', 'AFFKPS', 'AOOTTW', 'CIMOTU', 'DEILRX', 'DELRVY',
    'DISTTY', 'EEGHNW', 'EEINSU', 'EHRTVW', 'EIOSST', 'ELRTTY', 'HIMNQU', 'HLNNRZ'];
  var CUBES5 = ['AAAFRS', 'AAEEEE', 'AAFIRS', 'ADENNN', 'AEEEEM', 'AEEGMU', 'AEGMNN', 'AFIRSY', 'BJKQXZ',
    'CCNSTW', 'CEIILT', 'CEILPT', 'CEIPST', 'DDLNOR', 'DHHLOR', 'DHHNOT', 'DHLNOR', 'EIIITT', 'EMOTTT',
    'ENSSSU', 'FIPRSY', 'GORRVW', 'HIPRRY', 'NOOTUW', 'OOOTTU'];
  var PTS = [0, 0, 0, 1, 1, 2, 3, 5, 11];
  function pts(w) { return PTS[Math.min(w.length, 8)]; }

  // ── Dictionary (sorted array, binary search for prefixes) ─────────────────
  var COMMON = Words.common(), DICT = COMMON.concat(Words.extra()).sort();
  var COMMON_SET = new Set(COMMON), DICT_SET = new Set(DICT);
  function hasPrefix(p) {
    var lo = 0, hi = DICT.length;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (DICT[mid] < p) lo = mid + 1; else hi = mid; }
    return lo < DICT.length && DICT[lo].lastIndexOf(p, 0) === 0;
  }

  Kit.init({
    id: 'boggle',
    theme: { felt: ['#2a4f8a', '#1a3566', '#11244a'] },
    onNew: function () { clearSave(); showSetup(); },
    menu: [
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Boggle: past games' }); } }
    ],
    rules:
      '<p class="goal">Find as many words as you can in the letter grid before the sand runs out.</p>' +
      '<h3>Making words</h3><ul><li><b>Swipe</b> across touching letters to spell a word, then let go. Letters can touch sideways, up and down, or <b>diagonally</b>.</li>' +
      '<li>You can\'t use the same cube twice in one word.</li><li>Words must be at least <b>3 letters</b> (4 letters on the 5×5 Big Boggle board).</li>' +
      '<li>No names, no abbreviations. Plurals and other forms (like JUMPS, JUMPED) count as different words.</li>' +
      '<li><b>Qu</b> is one cube and counts as two letters.</li><li>You can also tap letters one at a time and press Enter, or type on a keyboard.</li></ul>' +
      '<h3>Scoring</h3><ul><li>3 or 4 letters: <b>1 point</b></li><li>5 letters: <b>2 points</b></li><li>6 letters: <b>3 points</b></li><li>7 letters: <b>5 points</b></li><li>8 or more: <b>11 points</b></li></ul>' +
      '<h3>Playing together</h3><p>Each player gets the <b>same board</b> in turn, with their own timer, and passes the phone on. When everyone has played, lists are compared. In the standard rules, a word found by <b>two or more players is crossed out</b> and nobody scores it, so hunt for the words nobody else will spot.</p>' +
      '<p>At the end of each round you can see every word that was hiding in the grid.</p>'
  });

  var S = null, cells = [], selected = [], typedStr = '', timerT = null, lastTick = 0;
  function save() {
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'over') Kit.resume.set((S.players.length > 1 ? 'Round ' + S.round + ' of ' + S.rounds + ' · ' : '') + (S.size === 5 ? 'Big Boggle' : 'Boggle'));
  }
  function clearSave() { stopTimer(); try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function load() { try { return JSON.parse(localStorage.getItem(SAVE)); } catch (e) { return null; } }

  // ── Setup ─────────────────────────────────────────────────────────────────
  function showSetup() {
    stopTimer(); S = null; app.className = 'bg';
    Kit.setup(app, {
      intro: 'Find hidden words before the sand runs out.',
      modes: [
        { id: 'solo', icon: 'user', title: 'Solo', desc: 'One player, beat your best score' },
        { id: 'party', icon: 'users', title: 'Pass and play', desc: '2 to 4 players take turns on the same board' }
      ],
      players: { range: function (m) { return m === 'party' ? [2, 4] : [1, 1]; }, count: 2, names: true },
      options: [
        { id: 'size', label: 'Board', choices: [['4', '4×4 Classic'], ['5', '5×5 Big Boggle']], value: '4' },
        { id: 'time', label: 'Sand timer', choices: [['180', '3 min'], ['120', '2 min'], ['0', 'No timer']], value: '180' },
        { id: 'rounds', label: 'Rounds', choices: [['1', '1'], ['3', '3'], ['5', '5']], value: '3', when: function (m) { return m === 'party'; } },
        { id: 'rule', label: 'Words more than one player found', choices: [['cross', 'Cross out (standard)'], ['keep', 'Everyone scores']], value: 'cross', when: function (m) { return m === 'party'; } }
      ],
      start: 'Shake the cubes',
      onStart: function (cfg) {
        var party = cfg.mode === 'party';
        S = {
          size: +cfg.options.size, time: +cfg.options.time, rounds: party ? +cfg.options.rounds : 1, rule: party ? cfg.options.rule : 'keep',
          players: cfg.players.map(function (p) { return { name: p.name, color: p.color }; }),
          round: 0, turn: 0, phase: 'ready', board: null, words: [], left: 0, log: [], started: Date.now(), shook: false
        };
        Kit.gameStart();
        newRound();
      }
    });
  }

  // ── Rounds and turns ──────────────────────────────────────────────────────
  function roll() {
    var set = (S.size === 5 ? CUBES5 : CUBES4).slice();
    for (var i = set.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = set[i]; set[i] = set[j]; set[j] = t; }
    return set.map(function (c) { var f = c[Math.floor(Math.random() * 6)]; return f === 'Q' ? 'QU' : f; });
  }
  function newRound() {
    S.round++; S.turn = 0; S.board = roll(); S.words = S.players.map(function () { return []; });
    S.left = S.time; S.phase = 'ready'; S.shook = false; S.all = null;
    save(); render();
  }
  function minLen() { return S.size === 5 ? 4 : 3; }
  function startTurn() {
    S.phase = 'play'; if (!S.left && S.time) S.left = S.time;
    save(); render();
    var lid = app.querySelector('.lid');
    if (!S.shook) { S.shook = true; shake(function () { if (lid) lid.classList.add('up'); beginClock(); }); if (lid) lid.classList.add('up'); }
    else { if (lid) lid.classList.add('up'); Kit.sfx('whoosh'); beginClock(); }
  }
  function beginClock() {
    var g = app.querySelector('.glass'); if (g) { g.classList.remove('flip'); void g.offsetWidth; g.classList.add('flip'); }
    startTimer();
  }
  function endTurn(reason) {
    stopTimer(); clearSel();
    if (reason === 'time') { Kit.callout("Time's up!"); Kit.sfx('bad'); Kit.haptic('heavy'); }
    if (S.turn < S.players.length - 1) {
      S.turn++; S.left = S.time; S.phase = 'ready'; save();
      setTimeout(render, reason === 'time' ? 1100 : 200);
    } else {
      S.phase = 'roundEnd'; scoreRound(); save();
      setTimeout(function () { render(); showRoundResults(); }, reason === 'time' ? 1200 : 250);
    }
  }

  // ── Timer ─────────────────────────────────────────────────────────────────
  function startTimer() {
    stopTimer(); if (!S.time) { paintClock(); return; }
    lastTick = performance.now();
    timerT = setInterval(function () {
      if (document.hidden || S.phase !== 'play') { lastTick = performance.now(); return; }
      var now = performance.now(), before = Math.ceil(S.left);
      S.left = Math.max(0, S.left - (now - lastTick) / 1000); lastTick = now;
      var after = Math.ceil(S.left);
      if (after !== before) { if (after <= 10 && after > 0) Kit.sfx('tick'); if (after % 5 === 0) save(); }
      paintClock();
      if (S.left <= 0) endTurn('time');
    }, 200);
  }
  function stopTimer() { clearInterval(timerT); timerT = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden && S) save(); });
  window.addEventListener('pagehide', function () { if (S) save(); });
  function fmt(t) { t = Math.ceil(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
  function glassSvg(f) {
    // f = share of sand still in the top bulb (0..1)
    var top = 4 + 16 * (1 - f), bot = 40 - 16 * (1 - f);
    return '<svg viewBox="0 0 30 44" aria-hidden="true">' +
      '<defs><clipPath id="gt"><path d="M6 4h18c0 9-7 12-8 18 1 6 8 9 8 18H6c0-9 7-12 8-18-1-6-8-9-8-18z"/></clipPath></defs>' +
      '<rect x="3" y="1" width="24" height="3" rx="1.5" fill="#b07a42"/><rect x="3" y="40" width="24" height="3" rx="1.5" fill="#b07a42"/>' +
      '<g clip-path="url(#gt)"><rect x="0" y="' + top.toFixed(1) + '" width="30" height="' + (22 - top).toFixed(1) + '" fill="#f2c66d"/>' +
      '<rect x="0" y="' + bot.toFixed(1) + '" width="30" height="' + (44 - bot).toFixed(1) + '" fill="#f2c66d"/>' +
      (f > 0 && f < 1 ? '<rect x="14.4" y="21" width="1.2" height="' + (bot - 21).toFixed(1) + '" fill="#f2c66d"/>' : '') + '</g>' +
      '<path d="M6 4h18c0 9-7 12-8 18 1 6 8 9 8 18H6c0-9 7-12 8-18-1-6-8-9-8-18z" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.7)" stroke-width="1.3"/></svg>';
  }
  function paintClock() {
    var g = app.querySelector('.glass'); if (!g) return;
    if (!S.time) { g.classList.add('off'); g.querySelector('.t').textContent = '--:--'; return; }
    var f = Math.max(0, Math.min(1, S.left / S.time));
    g.querySelector('.sv').innerHTML = glassSvg(f);
    g.querySelector('.t').textContent = fmt(S.left);
    g.classList.toggle('low', S.phase === 'play' && S.left <= 15);
  }

  // ── Shake: cubes tumble, then settle one by one ───────────────────────────
  function shake(done) {
    var cs = app.querySelectorAll('.cube'), letters = 'ABCDEFGHIJKLMNOPRSTUVWY';
    Kit.sfx('roll'); Kit.haptic('heavy');
    var spin = setInterval(function () {
      cs.forEach(function (c) { if (c.classList.contains('tumble')) c.querySelector('b').textContent = letters[Math.floor(Math.random() * letters.length)]; });
    }, 70);
    cs.forEach(function (c) {
      c.style.setProperty('--tx', (Math.random() * 12 - 6).toFixed(1) + 'px');
      c.style.setProperty('--ty', (Math.random() * 10 - 5).toFixed(1) + 'px');
      c.style.setProperty('--tr', (Math.random() * 30 - 15).toFixed(0) + 'deg');
      c.classList.add('tumble');
    });
    setTimeout(function () { Kit.sfx('roll'); }, 350);
    var order = Array.from(cs.keys()).sort(function () { return Math.random() - .5; });
    order.forEach(function (i, k) {
      setTimeout(function () {
        var c = cs[i]; c.classList.remove('tumble'); paintCube(c, i); c.classList.add('settle');
        if (k % 4 === 0) Kit.sfx('tap');
        setTimeout(function () { c.classList.remove('settle'); }, 500);
        if (k === order.length - 1) { clearInterval(spin); Kit.haptic('medium'); setTimeout(done, 250); }
      }, 700 + k * 45);
    });
  }
  function paintCube(c, i) {
    var f = S.board[i], b = c.querySelector('b');
    b.textContent = f === 'QU' ? 'Qu' : f;
    b.className = (f === 'QU' ? 'qu' : '');
  }

  // ── Render ────────────────────────────────────────────────────────────────
  var curEl, foundEl, gridEl, trayEl;
  function me() { return S.players[S.turn]; }
  function render() {
    if (!S) return showSetup();
    app.innerHTML = ''; app.className = 'bg play';
    var multi = S.players.length > 1, p = me();
    var showP = S.phase === 'roundEnd' || S.phase === 'over' ? null : p;
    // Status row
    var st = el('div', { class: 'st' });
    var who = el('div', { class: 'who' });
    if (showP) {
      who.appendChild(el('span', { class: 'avatar', style: { '--c': p.color }, text: p.name.charAt(0).toUpperCase() }));
      who.appendChild(el('div', null, [el('b', { text: p.name }), el('small', { text: (multi ? 'Round ' + S.round + ' of ' + S.rounds + ' · ' : '') + S.words[S.turn].length + ' words · ' + S.words[S.turn].reduce(function (s, w) { return s + pts(w); }, 0) + ' pts' })]));
    } else who.appendChild(el('div', null, [el('b', { text: multi ? 'Round ' + S.round + ' of ' + S.rounds : 'Round over' }), el('small', { text: S.size === 5 ? 'Big Boggle' : 'Boggle' })]));
    st.appendChild(who);
    if (S.phase === 'play') st.appendChild(el('button', { type: 'button', class: 'btn btn-soft btn-sm done-btn', text: 'Done', onclick: function () {
      Kit.confirm('Stop now?', { ok: "I'm done", body: S.time ? 'The rest of your time will be skipped.' : 'Your word list will be locked in.' }).then(function (ok) { if (ok && S.phase === 'play') endTurn('done'); });
    } }));
    st.appendChild(el('div', { class: 'glass' }, [el('span', { class: 'sv' }), el('span', { class: 't' })]));
    app.appendChild(st);

    // Table, tray, cubes
    var tbl = el('section', { class: 'tbl wood' }), felt = el('div', { class: 'felt-in' });
    trayEl = el('div', { class: 'tray', style: { '--n': S.size } });
    gridEl = el('div', { class: 'grid' }); cells = [];
    for (var i = 0; i < S.size * S.size; i++) {
      var w = el('div', { class: 'well' }), c = el('div', { class: 'cube', 'data-i': i }, [el('b')]);
      paintCube(c, i); w.appendChild(c); gridEl.appendChild(w); cells.push(c);
    }
    gridEl.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'svg')).setAttribute('class', 'trace');
    trayEl.appendChild(gridEl);
    if (S.phase !== 'play') trayEl.appendChild(lid());
    felt.appendChild(trayEl); tbl.appendChild(felt); app.appendChild(tbl);

    var side = el('div', { class: 'side' });
    // Word line
    curEl = el('div', { class: 'cur empty' });
    side.appendChild(el('div', { class: 'wordrow' }, [
      el('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Clear', html: Kit.icon('close'), onclick: function () { clearSel(); Kit.sfx('tap'); } }),
      curEl,
      el('button', { type: 'button', class: 'btn btn-primary', text: 'Enter', onclick: function () { submit(); } })
    ]));
    foundEl = el('div', { class: 'found' });
    side.appendChild(foundEl);
    app.appendChild(side);
    paintFound(); paintCur(); paintClock(); bindTray();
  }
  function lid() {
    var L = el('div', { class: 'lid' }), p = me(), multi = S.players.length > 1;
    if (S.phase === 'ready') {
      if (!S.shook) L.appendChild(el('div', { class: 'logo', text: 'BOGGLE' }));
      if (multi) {
        L.appendChild(el('h2', { text: S.turn === 0 && !S.shook ? p.name + ' goes first' : 'Pass to ' + p.name }));
        L.appendChild(el('p', { text: S.shook ? 'Same board as the others. No peeking until it\'s your turn!' : 'Round ' + S.round + ' of ' + S.rounds + '. Everyone gets this same board in turn.' }));
      } else if (S.shook && S.left < S.time) {
        L.appendChild(el('h2', { text: 'Paused' }));
        L.appendChild(el('p', { text: fmt(S.left) + ' left on the timer.' }));
      } else L.appendChild(el('p', { text: S.time ? 'You have ' + fmt(S.time) + ' to find as many words as you can.' : 'No timer. Press Done when you run out of words.' }));
      var resumed = S.shook && S.left < S.time && S.words[S.turn].length;
      L.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-lg', text: !S.shook ? 'Shake and start' : resumed ? 'Keep going' : 'Start my turn', onclick: function () { Kit.sfx('pop'); startTurn(); } }));
    } else if (S.phase === 'roundEnd') {
      L.appendChild(el('h2', { text: S.players.length > 1 ? 'Round ' + S.round + ' done' : "Time's up" }));
      L.appendChild(el('button', { type: 'button', class: 'btn btn-soft', text: 'See results', onclick: function () { showRoundResults(); } }));
      L.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-lg', text: S.round < S.rounds ? 'Next round' : 'Final scores', onclick: function () { nextFromResults(); } }));
    } else if (S.phase === 'over') {
      L.appendChild(el('h2', { text: 'Game over' }));
      L.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-lg', text: 'New game', onclick: function () { clearSave(); showSetup(); } }));
      L.appendChild(el('button', { type: 'button', class: 'btn btn-soft', text: 'Last round results', onclick: function () { showRoundResults(); } }));
    }
    return L;
  }
  function paintFound(fresh) {
    if (!foundEl) return;
    foundEl.innerHTML = '';
    var list = S.phase === 'play' || (S.phase === 'ready' && S.players.length === 1) ? S.words[S.turn] : [];
    if (!list.length) {
      foundEl.appendChild(el('span', { class: 'none', text: S.phase === 'play' ? 'Swipe across touching letters to make words of ' + minLen() + '+ letters.' : S.phase === 'ready' && S.players.length > 1 ? 'Your words stay hidden from the other players.' : '' }));
      return;
    }
    list.slice().reverse().forEach(function (w) { foundEl.appendChild(chip(w, w === fresh)); });
  }
  function chip(w, fresh, x) {
    var n = w.length;
    return el('span', { class: 'fw' + (n >= 8 ? ' l8' : n === 7 ? ' l7' : n === 6 ? ' l6' : n === 5 ? ' l5' : '') + (fresh ? ' new' : '') + (x ? ' x' : '') }, [document.createTextNode(w), el('small', { text: '+' + pts(w) })]);
  }

  // ── Selection: swipe, tap or type ─────────────────────────────────────────
  function adj(a, b) { var n = S.size, r1 = Math.floor(a / n), c1 = a % n, r2 = Math.floor(b / n), c2 = b % n; return a !== b && Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1; }
  function word() { return selected.map(function (i) { return S.board[i]; }).join('').toLowerCase(); }
  function paintSel() {
    cells.forEach(function (c, i) { var k = selected.indexOf(i); c.classList.toggle('path', k >= 0 && k < selected.length - 1); c.classList.toggle('last', k >= 0 && k === selected.length - 1); });
    var svg = gridEl && gridEl.querySelector('svg.trace'); if (!svg) return;
    svg.innerHTML = '';
    if (selected.length > 1) {
      var g = gridEl.getBoundingClientRect();
      var ptsStr = selected.map(function (i) { var b = cells[i].getBoundingClientRect(); return (b.left - g.left + b.width / 2).toFixed(1) + ',' + (b.top - g.top + b.height / 2).toFixed(1); }).join(' ');
      svg.setAttribute('viewBox', '0 0 ' + g.width + ' ' + g.height);
      var pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      pl.setAttribute('points', ptsStr); pl.setAttribute('stroke-width', Math.max(8, g.width / (S.size * 7)));
      svg.appendChild(pl);
    }
    paintCur();
  }
  function paintCur() {
    if (!curEl) return;
    var w = selected.length ? word() : typedStr;
    curEl.className = 'cur' + (w ? '' : ' empty') + (typedStr && !selected.length ? ' no' : '');
    curEl.textContent = w ? w.toUpperCase() : S.phase === 'play' ? 'Swipe or tap letters' : '';
  }
  function clearSel() { selected = []; typedStr = ''; paintSel(); }
  function tapCell(i) {
    if (S.phase !== 'play') return;
    typedStr = '';
    var k = selected.indexOf(i);
    if (k >= 0) { selected = selected.slice(0, k + (k === selected.length - 1 ? 0 : 1)); }
    else if (selected.length && !adj(selected[selected.length - 1], i)) selected = [i];
    else selected.push(i);
    Kit.sfx('tap'); Kit.haptic('tick'); paintSel();
  }
  var drag = null;
  function cellAt(x, y, inner) {
    for (var i = 0; i < cells.length; i++) {
      var b = cells[i].getBoundingClientRect(), pad = inner ? b.width * .2 : 0;
      if (x >= b.left + pad && x <= b.right - pad && y >= b.top + pad && y <= b.bottom - pad) return i;
    }
    return -1;
  }
  function bindTray() {
    trayEl.addEventListener('pointerdown', function (e) {
      if (S.phase !== 'play' || e.button > 0) return;
      var i = cellAt(e.clientX, e.clientY, false); if (i < 0) return;
      e.preventDefault();
      try { trayEl.setPointerCapture(e.pointerId); } catch (_) {}
      drag = { moved: false, start: i, had: selected.slice() };
      if (selected.length && selected[selected.length - 1] !== i && selected.indexOf(i) < 0 && adj(selected[selected.length - 1], i)) { selected.push(i); }
      else if (selected.indexOf(i) < 0) selected = [i];
      else drag.tapOn = i;
      typedStr = ''; Kit.sfx('tap'); Kit.haptic('tick'); paintSel();
    });
    trayEl.addEventListener('pointermove', function (e) {
      if (!drag || S.phase !== 'play') return;
      var i = cellAt(e.clientX, e.clientY, true); if (i < 0) return;
      var last = selected[selected.length - 1];
      if (i === last) return;
      if (selected.length > 1 && selected[selected.length - 2] === i) { selected.pop(); drag.moved = true; paintSel(); Kit.haptic('tick'); return; }
      if (selected.indexOf(i) < 0 && adj(last, i)) {
        if (drag.tapOn != null) { selected = selected.slice(0, selected.indexOf(drag.tapOn) + 1); drag.tapOn = null; }
        selected.push(i); drag.moved = true; Kit.sfx('tap'); Kit.haptic('tick'); paintSel();
      }
    });
    function up() {
      if (!drag) return;
      var d = drag; drag = null;
      if (d.moved && selected.length >= 2) { submit(); return; }
      // a plain tap on a selected cube trims back to it (tap the last one again to drop it)
      if (d.tapOn != null) {
        var k = selected.indexOf(d.tapOn);
        selected = k === selected.length - 1 ? selected.slice(0, k) : selected.slice(0, k + 1);
        paintSel();
      }
    }
    trayEl.addEventListener('pointerup', up);
    trayEl.addEventListener('pointercancel', function () { drag = null; });
  }
  window.addEventListener('resize', function () { if (S && S.phase === 'play') paintSel(); });

  // Typing: find any path on the board that spells what was typed
  function findPath(str) {
    var n = S.board.length, s = str.toUpperCase();
    function go(i, pos, used) {
      var f = S.board[i];
      if (s.substr(pos, f.length) !== f) return null;
      var np = pos + f.length; used.push(i);
      if (np === s.length) return used.slice();
      for (var j = 0; j < n; j++) if (used.indexOf(j) < 0 && adj(i, j)) { var r = go(j, np, used); if (r) return r; }
      used.pop(); return null;
    }
    for (var i = 0; i < n; i++) { var r = go(i, 0, []); if (r) return r; }
    return null;
  }
  document.addEventListener('keydown', function (e) {
    if (!S || S.phase !== 'play' || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.k-scrim,.k-win')) return;
    if (e.key === 'Enter') { e.preventDefault(); submit(); return; }
    if (e.key === 'Escape') { clearSel(); return; }
    if (e.key === 'Backspace') { e.preventDefault(); typedStr = (selected.length ? word() : typedStr).slice(0, -1); }
    else if (/^[a-z]$/i.test(e.key)) typedStr = (selected.length && !typedStr ? word() : typedStr) + e.key.toLowerCase();
    else return;
    var p = typedStr ? findPath(typedStr) : null;
    selected = p || []; paintSel();
    if (!p && typedStr) { curEl.textContent = typedStr.toUpperCase(); curEl.className = 'cur no'; }
  });

  // ── Submitting words ──────────────────────────────────────────────────────
  function flash(cls) {
    var s = selected.slice();
    s.forEach(function (i) { cells[i].classList.remove('good', 'bad', 'dup'); void cells[i].offsetWidth; cells[i].classList.add(cls); });
    setTimeout(function () { s.forEach(function (i) { cells[i].classList.remove(cls); }); }, 450);
  }
  function popText(t) { var p = el('div', { class: 'pop', text: t }); trayEl.appendChild(p); setTimeout(function () { p.remove(); }, 900); }
  function submit() {
    if (S.phase !== 'play') return;
    if (!selected.length) { if (typedStr) { reject('Not on the board'); typedStr = ''; paintCur(); } return; }
    var w = word(), mine = S.words[S.turn];
    if (w.length < minLen()) return reject('Too short: ' + minLen() + '+ letters');
    if (mine.indexOf(w) >= 0) { flash('dup'); Kit.toast('Already found'); Kit.sfx('bad'); return after(); }
    if (!DICT_SET.has(w)) return reject('Not in the word list');
    mine.push(w);
    flash('good'); popText('+' + pts(w));
    if (w.length >= 7) { Kit.callout(w.toUpperCase()); Kit.sfx('win'); Kit.haptic('success'); }
    else { Kit.sfx('good'); Kit.haptic('light'); }
    save(); paintFound(w);
    var sm = app.querySelector('.st .who small');
    if (sm) sm.textContent = (S.players.length > 1 ? 'Round ' + S.round + ' of ' + S.rounds + ' · ' : '') + mine.length + ' words · ' + mine.reduce(function (s, x) { return s + pts(x); }, 0) + ' pts';
    after();
  }
  function after() { setTimeout(function () { selected = []; typedStr = ''; paintSel(); }, 200); }
  function reject(msg) { flash('bad'); Kit.toast(msg); Kit.sfx('bad'); Kit.haptic('error'); after(); }

  // ── Solver: every word hiding in the grid ─────────────────────────────────
  function solve() {
    var n = S.board.length, out = new Set(), ml = minLen();
    function go(i, pre, used) {
      var s = pre + S.board[i].toLowerCase();
      if (!hasPrefix(s)) return;
      used[i] = 1;
      if (s.length >= ml && DICT_SET.has(s)) out.add(s);
      for (var j = 0; j < n; j++) if (!used[j] && adj(i, j)) go(j, s, used);
      used[i] = 0;
    }
    for (var i = 0; i < n; i++) go(i, '', []);
    return Array.from(out).sort(function (a, b) { return b.length - a.length || (a < b ? -1 : 1); });
  }

  // ── Scoring a round (standard: shared words are crossed out) ──────────────
  function scoreRound() {
    var count = {};
    S.words.forEach(function (ws) { ws.forEach(function (w) { count[w] = (count[w] || 0) + 1; }); });
    var cross = S.rule === 'cross' && S.players.length > 1;
    var scores = S.words.map(function (ws) { return ws.reduce(function (s, w) { return s + (cross && count[w] > 1 ? 0 : pts(w)); }, 0); });
    S.all = solve();
    S.log.push({ board: S.board.slice(), words: S.words.map(function (w) { return w.slice(); }), scores: scores, crossed: cross ? Object.keys(count).filter(function (w) { return count[w] > 1; }) : [], possible: S.all.length });
  }
  function totals() { return S.players.map(function (p, i) { return S.log.reduce(function (s, r) { return s + r.scores[i]; }, 0); }); }
  function showRoundResults() {
    var r = S.log[S.log.length - 1]; if (!r) return;
    var box = el('div', { class: 'res' }), multi = S.players.length > 1;
    var order = S.players.map(function (p, i) { return i; }).sort(function (a, b) { return r.scores[b] - r.scores[a]; });
    order.forEach(function (i) {
      var p = S.players[i], ws = r.words[i].slice().sort(function (a, b) { return b.length - a.length || (a < b ? -1 : 1); });
      var card = el('div', { class: 'rp' }, [el('div', { class: 'h' }, [
        el('span', { class: 'avatar sm', style: { '--c': p.color }, text: p.name.charAt(0).toUpperCase() }),
        el('b', { text: p.name + ' · ' + ws.length + (ws.length === 1 ? ' word' : ' words') }),
        el('span', { class: 'sc', text: String(r.scores[i]) })
      ])]);
      var wl = el('div', { class: 'ws' });
      if (!ws.length) wl.appendChild(el('span', { class: 'dim', text: 'No words this time.' }));
      ws.forEach(function (w) { wl.appendChild(chip(w, false, r.crossed.indexOf(w) >= 0)); });
      card.appendChild(wl);
      box.appendChild(card);
    });
    if (multi && S.rule === 'cross') box.appendChild(el('p', { class: 'dim', text: r.crossed.length ? r.crossed.length + ' word' + (r.crossed.length === 1 ? ' was' : 's were') + ' found by more than one player and crossed out.' : 'Nobody found the same word, so every word counts.' }));
    // Every word in the grid
    var all = S.all || solve(), got = {};
    r.words.forEach(function (ws) { ws.forEach(function (w) { got[w] = 1; }); });
    var common = all.filter(function (w) { return COMMON_SET.has(w) || got[w]; }), rare = all.length - common.length;
    var maxPts = all.reduce(function (s, w) { return s + pts(w); }, 0);
    box.appendChild(el('div', { class: 'label', style: { margin: '10px 0 0' }, text: 'Every word in this grid' }));
    box.appendChild(el('div', { class: 'sumrow', html: '<div><b>' + all.length + '</b><span>Words</span></div><div><b>' + maxPts + '</b><span>Points</span></div><div><b>' + Object.keys(got).length + '</b><span>Found</span></div>' }));
    var aw = el('div', { class: 'allw' });
    common.forEach(function (w) { var c = el('span', { class: 'fw' + (got[w] ? ' got' : ''), text: w }); aw.appendChild(c); });
    box.appendChild(aw);
    if (rare) box.appendChild(el('p', { class: 'dim', style: { 'margin-top': '6px', 'font-size': '.85rem' }, text: 'Plus ' + rare + ' rarer dictionary word' + (rare === 1 ? '' : 's') + ' not shown.' }));
    var last = S.round >= S.rounds;
    Kit.sheet({ title: multi ? 'Round ' + S.round + ' results' : 'Your words', node: box, actions: S.phase === 'over' ? [{ label: 'Close', cls: 'btn-soft' }] : [
      { label: last ? (multi ? 'Final scores' : 'Finish') : 'Next round', primary: true, onClick: nextFromResults },
      { label: 'Look at the board', cls: 'btn-ghost' }
    ] });
  }
  function nextFromResults() {
    if (S.phase !== 'roundEnd') return;
    if (S.round < S.rounds) { newRound(); return; }
    finishGame();
  }

  // ── Game end ──────────────────────────────────────────────────────────────
  function finishGame() {
    S.phase = 'over';
    var tot = totals(), multi = S.players.length > 1;
    var best = null, mostWords = null, missed = null;
    S.log.forEach(function (r, ri) {
      r.words.forEach(function (ws, pi) {
        ws.forEach(function (w) {
          if (r.crossed.indexOf(w) >= 0) return;
          if (!best || w.length > best.w.length || (w.length === best.w.length && w < best.w)) best = { w: w, p: pi };
        });
        if (!mostWords || ws.length > mostWords.n) mostWords = { n: ws.length, p: pi, r: ri };
      });
    });
    var hl = [];
    if (best) hl.push((multi ? S.players[best.p].name + "'s longest" : 'Longest') + ' Boggle word: ' + best.w.toUpperCase() + ' (' + pts(best.w) + (pts(best.w) === 1 ? ' pt)' : ' pts)'));
    if (multi && mostWords && mostWords.n) hl.push('Most words in a round: ' + S.players[mostWords.p].name + ', ' + mostWords.n + (S.rounds > 1 ? ' in round ' + (mostWords.r + 1) : ''));
    var crossed = S.log.reduce(function (s, r) { return s + r.crossed.length; }, 0);
    if (multi && S.rule === 'cross' && crossed) hl.push(crossed + ' shared word' + (crossed === 1 ? ' was' : 's were') + ' crossed out');
    var lastAll = S.all || [], gotAll = {};
    S.log[S.log.length - 1].words.forEach(function (ws) { ws.forEach(function (w) { gotAll[w] = 1; }); });
    var bigMiss = lastAll.filter(function (w) { return !gotAll[w] && COMMON_SET.has(w); })[0];
    if (bigMiss && bigMiss.length >= 6) hl.push('Nobody spotted ' + bigMiss.toUpperCase() + (S.rounds > 1 ? ' in the last round' : ''));
    if (!multi) {
      var prev = 0; try { GameHistory.load(KEY).forEach(function (e) { if (e.players && e.players.length === 1 && e.size === S.size && e.players[0].score > prev) prev = e.players[0].score; }); } catch (e) {}
      if (tot[0] > prev && prev > 0) hl.push('New personal best (old best ' + prev + ')');
      hl.push('Found ' + S.log[0].words[0].length + ' of ' + S.log[0].possible + ' words in the grid');
    }
    Kit.record(KEY, {
      started: S.started, mode: (S.size === 5 ? 'Big Boggle 5×5' : 'Boggle 4×4') + (multi ? ' · ' + S.rounds + (S.rounds === 1 ? ' round' : ' rounds') : ''),
      players: S.players.map(function (p, i) { return { name: p.name, score: tot[i] }; }),
      rounds: multi && S.rounds > 1 ? { labels: S.log.map(function (r, i) { return 'R' + (i + 1); }), scores: S.log.map(function (r) { return r.scores; }) } : null,
      highlights: hl, summary: multi ? null : tot[0] + ' pts · ' + S.log[0].words[0].length + ' words',
      meta: { size: S.size, rule: S.rule, boards: S.log.map(function (r) { return r.board.join(','); }) }
    });
    Kit.resume.clear();
    save(); render();
    var rank = S.players.map(function (p, i) { return { name: p.name, score: tot[i], color: p.color }; }).sort(function (a, b) { return b.score - a.score; });
    var tie = multi && rank[0].score === rank[1].score;
    Kit.win({
      title: multi ? (tie ? "It's a tie!" : rank[0].name + ' wins!') : tot[0] + ' points',
      sub: multi ? (best ? 'Longest word: ' + best.w.toUpperCase() : '') : (best ? 'Longest word: ' + best.w.toUpperCase() + ' · ' : '') + S.log[0].words[0].length + ' words',
      rank: multi ? rank : null,
      again: function () { var cfg = { size: S.size, time: S.time, rounds: S.rounds, rule: S.rule, players: S.players }; S = { size: cfg.size, time: cfg.time, rounds: cfg.rounds, rule: cfg.rule, players: cfg.players, round: 0, turn: 0, phase: 'ready', board: null, words: [], left: 0, log: [], started: Date.now(), shook: false }; Kit.gameStart(); newRound(); },
      againLabel: 'Play again', extra: [{ label: 'See every word', onClick: function () { showRoundResults(); } }],
      closeLabel: 'Close', onClose: function () {}
    });
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved && saved.players && saved.board && saved.phase !== 'over') {
    S = saved;
    if (S.phase === 'play') S.phase = 'ready';   // pause on reload; the lid shows time left
    render();
  } else showSetup();
  window.__bg = { get S() { return S; }, solve: function () { return solve(); }, findPath: function (s) { return findPath(s); } };
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Boggle</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<style>
body{background:radial-gradient(ellipse at 50% 0%,#0a0a1a 0%,#0d1117 70%);}
.wrap{max-width:440px;margin:0 auto;padding:0 8px 60px;}
.bg-stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.bg-stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 14px;text-align:center;}
.bg-stat-val{font-family:var(--serif);font-size:1.2rem;font-weight:900;color:var(--gold);}
.bg-stat-lbl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
/* Timer */
.timer-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-bottom:10px;overflow:hidden;}
.timer-fill{height:100%;background:linear-gradient(90deg,#22c55e,#f59e0b);border-radius:3px;transition:width .9s linear;}
/* Grid */
.bl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 auto 10px;width:min(300px,80vw);}
.bl-cell{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:clamp(1.3rem,7vw,1.8rem);font-weight:900;color:#fff;cursor:pointer;transition:all .1s;user-select:none;touch-action:none;}
.bl-cell:active{transform:scale(.93);}
.bl-cell.selected{background:rgba(245,200,66,.3);border-color:var(--gold);color:var(--gold);}
.bl-cell.path{background:rgba(90,200,250,.2);border-color:#5ac8fa;}
.bl-cell.wrong{background:rgba(239,68,68,.25);border-color:#ef4444;}
/* Word input */
.bl-word{font-family:var(--serif);font-size:1.4rem;font-weight:900;text-align:center;min-height:40px;letter-spacing:.1em;color:var(--gold);margin-bottom:8px;}
/* Found words */
.found-words{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;min-height:60px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:5px;align-items:flex-start;}
.fw{padding:3px 8px;border-radius:5px;font-size:.75rem;font-weight:700;border:1px solid;}
.fw.len3{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.6);}
.fw.len4{background:rgba(90,200,250,.1);border-color:rgba(90,200,250,.3);color:#5ac8fa;}
.fw.len5{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#22c55e;}
.fw.len6{background:rgba(245,200,66,.12);border-color:rgba(245,200,66,.3);color:var(--gold);}
.fw.len7{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.3);color:#a855f7;}
.fw.len8p{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#ef4444;}
/* Score popup */
@keyframes bl-pop{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-40px) scale(1.3);}}
.bl-popup{position:fixed;pointer-events:none;font-family:var(--serif);font-size:1.5rem;font-weight:900;color:var(--gold);animation:bl-pop .8s ease forwards;}
</style>
</head>

// Build Trie for fast prefix lookup
class Trie{
  constructor(){this.root={};}
  add(word){let n=this.root;for(const c of word){if(!n[c])n[c]={};n=n[c];}n['$']=1;}
  hasPrefix(p){let n=this.root;for(const c of p){if(!n[c])return false;n=n[c];}return true;}
  has(w){let n=this.root;for(const c of w){if(!n[c])return false;n=n[c];}return!!n['$'];}
}
const DICT=new Trie();
WORD_LIST.forEach(w=>DICT.add(w));

// ── Boggle letter distribution ────────────────────────────────────────────
const FREQ='AAAAAAAAABBCCDDDDEEEEEEEEEEEEFFGGGHHIIIIIIIIJKLLLLMMNNNNNNOOOOOOOOPPQRRRRRRSSSSTTTTTTTUUUUVVWWXYYZ'.split('');

let grid=[], selected=[], path=[], foundWords=new Set(), score=0, timerSecs=180, timerInt=null, gameOver=false;

function newGame(){
  clearInterval(timerInt);
  // Generate 4x4 grid
  grid=Array.from({length:4},()=>Array.from({length:4},()=>{
    // Pick random letter with distribution bias
    return FREQ[Math.floor(Math.random()*FREQ.length)];
  }));
  selected=[];path=[];foundWords=new Set();score=0;timerSecs=180;gameOver=false;
  document.getElementById('bl-score').textContent='0';
  document.getElementById('bl-words').textContent='0';
  document.getElementById('bl-word').textContent='';
  document.getElementById('found-words').innerHTML='';
  renderGrid();
  startTimer();
}

function startTimer(){
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    timerSecs--;
    const m=Math.floor(timerSecs/60), s=timerSecs%60;
    document.getElementById('bl-timer').textContent=`${m}:${String(s).padStart(2,'0')}`;
    document.getElementById('timer-fill').style.width=(timerSecs/180*100)+'%';
    if(timerSecs<=0){clearInterval(timerInt);gameOver=true;document.getElementById('bl-word').textContent='Time\'s up!';renderGrid();}
  },1000);
}

function cellIdx(r,c){return r*4+c;}
function cellRC(i){return[Math.floor(i/4),i%4];}
function adjacent(i1,i2){
  const[r1,c1]=cellRC(i1),[r2,c2]=cellRC(i2);
  return Math.abs(r1-r2)<=1&&Math.abs(c1-c2)<=1&&i1!==i2;
}

function clickCell(i){
  if(gameOver)return;
  if(selected.includes(i)){
    // If clicking last selected, remove it
    if(selected[selected.length-1]===i){selected.pop();renderGrid();updateWordDisplay();return;}
    return;
  }
  if(selected.length>0&&!adjacent(selected[selected.length-1],i))return;
  selected.push(i);
  renderGrid();
  updateWordDisplay();
}

function updateWordDisplay(){
  const word=selected.map(i=>grid[cellRC(i)[0]][cellRC(i)[1]]).join('');
  document.getElementById('bl-word').textContent=word;
}

function submitWord(){
  if(gameOver)return;
  const word=selected.map(i=>grid[cellRC(i)[0]][cellRC(i)[1]]).join('').toLowerCase();
  if(word.length<3){flashCells('wrong');clearSel();return;}
  if(foundWords.has(word)){flashMsg('Already found!');clearSel();return;}
  if(!DICT.has(word)){flashCells('wrong');clearSel();return;}
  // Valid!
  foundWords.add(word);
  const pts=[0,0,0,1,1,2,3,5,11][Math.min(word.length,8)];// scoring: 3=1,4=1,5=2,6=3,7=5,8+=11
  score+=pts;
  document.getElementById('bl-score').textContent=score;
  document.getElementById('bl-words').textContent=foundWords.size;
  addFoundWord(word,pts);
  showPopup(`+${pts}`);
  clearSel();
}

function addFoundWord(word,pts){
  const el=document.getElementById('found-words');
  const span=document.createElement('span');
  const lenClass=word.length<=3?'len3':word.length===4?'len4':word.length===5?'len5':word.length===6?'len6':word.length===7?'len7':'len8p';
  span.className='fw '+lenClass;
  span.textContent=word+(pts>1?` (+${pts})`:'');
  el.prepend(span);
}

function showPopup(txt){
  const pop=document.createElement('div');
  pop.className='bl-popup';pop.textContent=txt;
  pop.style.cssText=`left:${40+Math.random()*20}%;top:${200+Math.random()*30}px;`;
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),800);
}

function flashCells(cls){
  selected.forEach(i=>{
    const el=document.getElementById('bl-cell-'+i);
    if(el){el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),500);}
  });
}

function flashMsg(msg){
  const el=document.getElementById('bl-word');
  const prev=el.textContent;
  el.textContent=msg;el.style.color='#ef4444';
  setTimeout(()=>{el.textContent=prev;el.style.color='';},700);
}

function clearSel(){selected=[];renderGrid();updateWordDisplay();}

function renderGrid(){
  const el=document.getElementById('bl-grid');el.innerHTML='';
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const i=cellIdx(r,c);
      const cell=document.createElement('div');
      cell.className='bl-cell';
      cell.id='bl-cell-'+i;
      cell.textContent=grid[r][c]==='Q'?'Qu':grid[r][c];
      if(selected.includes(i)){
        if(selected[selected.length-1]===i)cell.classList.add('selected');
        else cell.classList.add('path');
      }
      cell.addEventListener('click',()=>clickCell(i));
      // Touch events for drag selection
      cell.addEventListener('touchstart',e=>{e.preventDefault();clickCell(i);},{passive:false});
      cell.addEventListener('touchmove',e=>{
        e.preventDefault();
        const t=e.touches[0];
        const el2=document.elementFromPoint(t.clientX,t.clientY);
        if(el2&&el2.id&&el2.id.startsWith('bl-cell-')){
          const ti=parseInt(el2.id.replace('bl-cell-',''));
          if(!selected.includes(ti)&&selected.length>0&&adjacent(selected[selected.length-1],ti)){
            selected.push(ti);renderGrid();updateWordDisplay();
          }
        }
      },{passive:false});
      el.appendChild(cell);
    }
  }
}

document.getElementById('bl-submit').addEventListener('click',submitWord);
document.getElementById('bl-clear').addEventListener('click',clearSel);
document.getElementById('bl-new').addEventListener('click',newGame);
document.addEventListener('keydown',e=>{if(e.key==='Enter')submitWord();if(e.key==='Escape')clearSel();});

newGame();

// ── Session persistence ────────────────────────────────────────────────────
function _save_boggle(){if(gameOver)return;
  try{sessionStorage.setItem('boggle',JSON.stringify({grid,foundWords:[...foundWords],score,timerSecs,gameOver,_ts:Date.now()}));}catch(e){}
}
function _load_boggle(){
  try{
    const raw=sessionStorage.getItem('boggle');if(!raw)return false;
    const s=JSON.parse(raw);if(!s)return false;
    grid=s.grid;foundWords=new Set(s.foundWords||[]);score=s.score||0;timerSecs=s.timerSecs||180;gameOver=s.gameOver||false;selected=[];path=[];
    renderGrid();renderFound();document.getElementById('bl-score').textContent=score;if(!gameOver&&timerSecs>0)startTimer();
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_boggle);
document.getElementById('bl-new')?.addEventListener('click',()=>{try{sessionStorage.removeItem('boggle');}catch(e){}},true);
_load_boggle();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hot Dog Stand</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<style>
body{overflow-x:hidden;}
.hd{max-width:1180px;margin:0 auto;padding:0 10px calc(var(--safe-b) + 10px);display:flex;flex-direction:column;gap:8px;}
.hd-main{display:flex;flex-direction:column;gap:10px;}
.hd-panel{display:flex;flex-direction:column;gap:10px;min-width:0;}

/* ── The secret: tap the hot dog on the setup screen (see showSetup) ─────── */
.k-hero-ic{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.k-hero-ic.wob .gicon{animation:wob .45s var(--spring);}
@keyframes wob{25%{transform:rotate(calc(var(--wob,8deg) * -1)) scale(var(--wsc,1.04));}60%{transform:rotate(var(--wob,8deg));}100%{transform:none;}}
.k-hero-ic.spin .gicon{animation:spinIt 1.1s cubic-bezier(.3,1.3,.5,1);}
@keyframes spinIt{0%{transform:none;}40%{transform:rotateY(540deg) scale(1.35);filter:grayscale(1) contrast(1.4);}100%{transform:rotateY(720deg);}}
/* unlocked: a switch dressed as a TI-82, its little LCD reading DRUGWAR */
.dw-sec{display:flex;flex-direction:column;gap:6px;}
.dw-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 10px;border:0;border-radius:14px 14px 20px 20px;cursor:pointer;text-align:left;font:inherit;color:#eef0f3;
  background:linear-gradient(180deg,#45484f,#2a2c31);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 14px rgba(0,0,0,.35);}
.dw-row .lcd{flex:none;width:92px;height:40px;border-radius:5px;padding:5px;background:#17181c;box-shadow:inset 0 2px 4px rgba(0,0,0,.7);}
.dw-row canvas{display:block;width:100%;height:100%;border-radius:2px;image-rendering:pixelated;background:#b0bd9e;transition:filter .3s;}
.dw-row[aria-checked="false"] canvas{filter:brightness(.55) saturate(.4);}
.dw-row .grow{flex:1;min-width:0;}
.dw-row .grow b{display:block;font:900 1.02rem/1.15 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.02em;}
.dw-row .grow small{display:block;color:rgba(255,255,255,.66);font-size:.8rem;font-weight:700;margin-top:2px;}
.dw-row .sw{flex:none;position:relative;width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.2);transition:background .2s;}
.dw-row .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s var(--spring);}
.dw-row[aria-checked="true"] .sw{background:#8fc597;}
.dw-row[aria-checked="true"] .sw::after{transform:translateX(20px);}
.dw-row.arrive{animation:dwArrive .7s var(--spring) both;}
.dw-row.leave,.dw-row.leave ~ .dw-hide{transition:opacity .4s, transform .4s;opacity:0;transform:scale(.9);}
@keyframes dwArrive{0%{transform:translateY(16px) scale(.92);opacity:0;}60%{box-shadow:0 0 0 6px rgba(143,197,151,.4);}100%{transform:none;opacity:1;}}
.dw-hide{align-self:flex-start;border:0;background:none;color:var(--text-3);font-weight:800;font-size:.8rem;padding:4px 2px;cursor:pointer;text-decoration:underline;}
.setup.dw-on .modes{opacity:.35;pointer-events:none;filter:grayscale(1);transition:opacity .3s,filter .3s;}

/* ── Season strip: game n of N, cash toward the goal ─────────────────────── */
.hd-strip{display:flex;align-items:center;gap:10px;padding:2px 2px 0;}
.hd-strip .gn{font:400 1rem/1 var(--display);color:var(--text-2);white-space:nowrap;}
.hd-strip .gn b{color:var(--text);font-weight:400;}
.hd-goal{flex:1;min-width:0;position:relative;height:12px;border-radius:99px;background:var(--inset);box-shadow:inset 0 1px 3px rgba(0,0,0,.4);}
.hd-goal i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(180deg,#5fe39a,#23a35f);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transition:width .9s cubic-bezier(.2,.8,.2,1);}
.hd-goal.met i{background:linear-gradient(180deg,#ffe07a,#e3a51c);}
.hd-goal .dots{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 4px;pointer-events:none;}
.hd-strip .cash{font:400 1.15rem/1 var(--display);color:#7ef0b0;white-space:nowrap;font-variant-numeric:tabular-nums;}
.hd-strip .cash small{font:800 .7rem/1 var(--font);color:var(--text-3);letter-spacing:.04em;margin-left:3px;}

/* ── The scene: a stadium plaza and your stand (one SVG, 400 × 250) ─────── */
.hd-scene{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:400/290;flex:none;background:#2a3346;
  box-shadow:0 14px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
  --sky1:#4fa6f5;--sky2:#cfe8ff;--wall:#6f7891;--wall2:#59627a;--rim:#3c4357;--win:#2d3446;--floor1:#c9c1b3;--floor2:#9d9586;--glow:0;}
.hd-scene > svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.hd-scene[data-wx="cloudy"]{--sky1:#8ea2b8;--sky2:#d9e1ea;}
.hd-scene[data-wx="rain"]{--sky1:#5b6878;--sky2:#97a3b0;--floor1:#9f9a90;--floor2:#7a756c;}
.hd-scene[data-wx="snow"]{--sky1:#9aa8b8;--sky2:#e3e9ef;--floor1:#e9edf1;--floor2:#c9d0d8;}
.hd-scene[data-night]{--sky1:#060d22;--sky2:#20365f;--wall:#2f3550;--wall2:#262b42;--rim:#1a1e2e;--win:#ffd98a;--floor1:#6f6a62;--floor2:#4a463f;--glow:1;}
.hd-scene[data-night][data-wx="rain"]{--sky1:#0b1018;--sky2:#253040;}
.hd-scene[data-night][data-wx="snow"]{--sky1:#141c2c;--sky2:#3b4a62;--floor1:#b9c0c8;--floor2:#8d949c;}
.sky1{stop-color:var(--sky1);} .sky2{stop-color:var(--sky2);}
.fl1{stop-color:var(--floor1);} .fl2{stop-color:var(--floor2);}
.st-wall{fill:var(--wall);} .st-wall2{fill:var(--wall2);} .st-rim{fill:var(--rim);} .st-win{fill:var(--win);}
.night-only{opacity:var(--glow);transition:opacity .6s;}
.day-only{opacity:calc(1 - var(--glow));}
.hd-scene:not([data-wx="sunny"]) .sun{display:none;}
.hd-scene:not([data-wx="cloudy"]):not([data-wx="rain"]):not([data-wx="snow"]) .clouds .heavy{display:none;}
.clouds g{animation:drift 60s linear infinite;}
.clouds g:nth-child(2){animation-duration:85s;animation-delay:-30s;}
.clouds g:nth-child(3){animation-duration:70s;animation-delay:-50s;}
@keyframes drift{from{transform:translate(-60px,-26px);}to{transform:translate(460px,-26px);}}
.hd-scene[data-wx="rain"] .clouds ellipse,.hd-scene[data-wx="snow"] .clouds ellipse{fill:#c3cad3;}
.hd-scene[data-night] .clouds ellipse{fill:#3a4660;}
/* weather over the whole scene */
.wx{position:absolute;inset:0;pointer-events:none;display:none;}
.hd-scene[data-wx="rain"] .wx.rain{display:block;background:repeating-linear-gradient(104deg,transparent 0 13px,rgba(220,235,255,.32) 13px 14px,transparent 14px 31px) 0 0/62px 120px;animation:rain .35s linear infinite;}
.hd-scene[data-wx="rain"] .wx.rain2{display:block;background:repeating-linear-gradient(100deg,transparent 0 21px,rgba(220,235,255,.2) 21px 22px,transparent 22px 47px) 0 0/94px 160px;animation:rain2 .5s linear infinite;}
@keyframes rain{to{background-position:-26px 120px;}}
@keyframes rain2{to{background-position:-28px 160px;}}
.hd-scene[data-wx="snow"] .wx.rain{display:block;background-image:radial-gradient(circle,#fff 0 1.6px,transparent 2.2px),radial-gradient(circle,rgba(255,255,255,.8) 0 1.1px,transparent 1.6px);
  background-size:46px 46px,29px 29px;background-position:0 0,13px 7px;animation:snow 5s linear infinite;}
.hd-scene[data-wx="snow"] .wx.rain2{display:block;background-image:radial-gradient(circle,rgba(255,255,255,.9) 0 2px,transparent 2.6px);background-size:71px 71px;animation:snow2 7s linear infinite;}
@keyframes snow{to{background-position:30px 46px,-10px 36px;}}
@keyframes snow2{to{background-position:-24px 71px;}}

/* stand pieces */
.bulb{fill:#fff3c4;}
.hd-scene .sign-on .bulb{animation:bulb 1.2s steps(1) infinite;filter:drop-shadow(0 0 2px #ffd36b);}
.hd-scene .sign-on .bulb:nth-child(odd){animation-delay:.6s;}
@keyframes bulb{0%{fill:#fff6cf;}50%{fill:#9a7a3a;}}
.sign-glow{opacity:0;transition:opacity .6s;}
.sign-on .sign-glow{opacity:1;}
.roller{animation:roll .5s linear infinite;}
@keyframes roll{to{transform:translateX(-4px);}}
.steam path{animation:steam 2.4s ease-in-out infinite;opacity:0;}
.steam path:nth-child(2){animation-delay:.8s;} .steam path:nth-child(3){animation-delay:1.6s;}
@keyframes steam{0%{opacity:0;transform:translateY(3px);}40%{opacity:.7;}100%{opacity:0;transform:translateY(-9px);}}
.shutter{transition:transform 1.1s cubic-bezier(.6,0,.3,1);}
.open .shutter{transform:translateY(-50px);}
.closed-tag{transition:opacity .4s;transform-box:fill-box;transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite;}
.open .closed-tag{opacity:0;}
@keyframes swing{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
.soldout{opacity:0;transition:opacity .25s;}
.soldout.on{opacity:1;}
.mp text{transition:opacity .2s;}
.mp.wipe text{opacity:0;}
.crate{animation:crateIn .45s cubic-bezier(.3,1.4,.5,1) both;}
@keyframes crateIn{from{transform:translateY(-40px);opacity:0;}}
.till-pop{animation:tillpop .25s ease-out;}
@keyframes tillpop{50%{transform:translateY(-1.5px);}}
.bubble{animation:bub .2s ease-out both;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes bub{from{transform:scale(.2);opacity:0;}}

/* HTML pieces over the scene */
.tkt{position:absolute;left:3%;top:5%;width:min(56%,300px);transform:rotate(-2deg);transform-origin:0 0;
  display:flex;color:#2a2418;border-radius:7px;overflow:hidden;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));
  animation:tktIn .6s cubic-bezier(.2,1.2,.4,1) both;cursor:pointer;}
@keyframes tktIn{from{transform:translate(-30px,-60px) rotate(-14deg);opacity:0;}}
.tkt .stub{flex:none;width:clamp(26px,8cqw,40px);background:var(--tk,#c8322f);color:#fff;display:grid;place-items:center;position:relative;
  border-right:2px dashed rgba(255,255,255,.65);}
.tkt .stub span{writing-mode:vertical-rl;transform:rotate(180deg);font:400 clamp(.7rem,2.6cqw,.95rem)/1 var(--display);letter-spacing:.08em;}
.tkt .bd{flex:1;min-width:0;padding:clamp(5px,1.6cqw,9px) clamp(7px,2cqw,11px);background:linear-gradient(180deg,#fffaf0,#f1e6cc);
  background-image:radial-gradient(rgba(120,90,40,.08) 1px,transparent 1px),linear-gradient(180deg,#fffaf0,#f1e6cc);background-size:5px 5px,auto;}
.tkt h3{margin:0;font:400 clamp(.9rem,3.6cqw,1.3rem)/1.05 var(--display);color:#1f1a10;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}   /* a long name takes two lines */
.tkt .when{font:800 clamp(.62rem,2.3cqw,.82rem)/1.2 var(--font);color:#6b5d40;letter-spacing:.02em;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tkt .fc{display:flex;align-items:center;gap:5px;font:800 clamp(.68rem,2.5cqw,.9rem)/1.25 var(--font);white-space:nowrap;}
.tkt .fc svg{width:1.25em;height:1.25em;flex:none;}
.tkt .fc + .fc{margin-top:1px;}
.tkt .news{margin-top:4px;padding-top:4px;border-top:1px dashed rgba(60,40,10,.3);font:700 clamp(.6rem,2.2cqw,.78rem)/1.2 var(--font);color:#9a3412;display:flex;gap:4px;align-items:flex-start;}
.tkt .news svg{width:1.2em;height:1.2em;flex:none;}
.hd-scene{container-type:inline-size;}
.jumbo{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);min-width:min(64%,420px);
  background:linear-gradient(180deg,#14161d,#07080b);border-radius:6px;padding:4px 10px 5px;
  box-shadow:0 0 0 2px #2a2e38, 0 6px 14px rgba(0,0,0,.5);color:#ffcf5a;text-align:center;
  font:400 clamp(.72rem,2.9cqw,1.1rem)/1.1 var(--display);letter-spacing:.06em;text-shadow:0 0 6px rgba(255,190,60,.55);}
.jumbo .row{display:flex;justify-content:center;align-items:center;gap:.7em;white-space:nowrap;}
.jumbo .row b{font-weight:400;color:#fff6d8;font-variant-numeric:tabular-nums;min-width:1.3em;display:inline-block;}
.jumbo .ph{color:#7fd8ff;text-shadow:0 0 6px rgba(80,180,255,.6);font-size:.82em;letter-spacing:.1em;}
.jumbo.flash{animation:jflash .25s steps(2) 6;}
@keyframes jflash{50%{background:#5a3b06;}}
.wxchip{position:absolute;right:2.5%;top:4%;display:flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;border-radius:99px;
  background:rgba(10,14,24,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;font:800 clamp(.66rem,2.4cqw,.85rem)/1 var(--font);}
.wxchip svg{width:1.3em;height:1.3em;}
.banner{position:absolute;left:0;right:0;top:34%;display:flex;justify-content:center;pointer-events:none;}
.banner span{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;background:#0d1220e6;color:#fff;
  font:400 clamp(.85rem,3.4cqw,1.2rem)/1 var(--display);letter-spacing:.03em;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:banner 2.6s ease both;}
.banner span svg{width:1.2em;height:1.2em;}
.banner span.bad{background:#7f1d1de6;}
.banner span.good{background:#14532de6;}
@keyframes banner{0%{transform:translateY(10px) scale(.9);opacity:0;}10%,82%{transform:none;opacity:1;}100%{transform:translateY(-8px);opacity:0;}}

/* ── Panels (chrome: clean) ──────────────────────────────────────────────── */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-sm, 0 2px 8px rgba(0,0,0,.25));}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--seg);}
.tabs button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--text-2);font-weight:800;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px;}
.tabs button.on{background:var(--surface-3);color:var(--text);box-shadow:var(--shadow-sm);}
.tabs button .ico{width:18px;height:18px;}
.tabs button .warn{width:7px;height:7px;border-radius:50%;background:#ff9a3d;box-shadow:0 0 0 2px var(--seg);}

/* Order rows */
.rows{display:flex;flex-direction:column;gap:6px;}
.ord{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--surface);}
.ord .art{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.14),rgba(255,255,255,.03));}
.ord .art svg{width:40px;height:40px;}
.ord .nm{font-weight:900;font-size:1rem;line-height:1.1;}
.ord .sub{font-size:.8rem;font-weight:700;color:var(--text-3);line-height:1.25;margin-top:2px;}
.ord .have{font-size:.86rem;font-weight:800;color:var(--text-2);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.ord .have b{color:var(--text);font-variant-numeric:tabular-nums;}
.ord .have .arrow{opacity:.5;}
.ord .have .tot{color:#7ef0b0;}
.ord .warn{color:#ffad5c;font-weight:800;}
.step{display:flex;align-items:center;gap:6px;}
.step button{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-3);color:var(--text);display:grid;place-items:center;
  box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 1px 0 var(--w18);transition:transform .08s;}
.step button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.step button:disabled{opacity:.35;}
.step button .ico{width:20px;height:20px;}
.step .n{min-width:44px;text-align:center;font:400 1.25rem/1 var(--display);font-variant-numeric:tabular-nums;}
.step .n small{display:block;font:800 .62rem/1.2 var(--font);color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;}
.bump{animation:bump .25s ease;}
@keyframes bump{40%{transform:scale(1.22);}}

/* Prices: a chalkboard */
.chalk{position:relative;border-radius:14px;padding:12px 12px 10px;color:#f4f1e8;
  background:radial-gradient(120% 90% at 30% 20%,#3b4d43 0%,#24332b 60%,#1b2721 100%);
  box-shadow:inset 0 0 0 6px #8a5a32, inset 0 0 0 8px #5f3c1e, inset 0 0 28px rgba(0,0,0,.55), 0 10px 22px rgba(0,0,0,.4);
  padding:16px 16px 12px;}
.chalk::after{content:"";position:absolute;inset:8px;border-radius:8px;pointer-events:none;
  background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px) 0 0/3px 3px, linear-gradient(115deg,transparent 30%,rgba(255,255,255,.05) 45%,transparent 60%);}
.chalk h4{margin:0 0 6px;text-align:center;font:400 1.5rem/1 var(--hand);letter-spacing:.04em;color:#fff;opacity:.92;}
.prow{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:6px 2px;border-top:1px dashed rgba(255,255,255,.14);}
.prow:first-of-type{border-top:0;}
.prow .art svg{width:38px;height:38px;}
.prow .nm{font:400 1.35rem/1 var(--hand);}
.prow .cost{font:400 .95rem/1.1 var(--hand);color:#c9d6cc;opacity:.85;}
.prow .cost b{font-weight:400;color:#9ff0c0;}
.prow .cost b.thin{color:#ffb38a;}
.prow.off{opacity:.45;}
.prow .step button{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);}
.prow .step .n{font:400 1.75rem/1 var(--hand);min-width:66px;color:#fff;}

/* Crew and gear */
.sect{background:var(--surface);border-radius:14px;padding:10px 12px;}
.sect h4{margin:0 0 2px;font-size:1rem;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.sect h4 small{font-size:.8rem;font-weight:800;color:var(--text-3);}
.sect p{margin:0 0 8px;font-size:.82rem;font-weight:700;color:var(--text-3);}
.crew{display:flex;gap:8px;}
.crew button{flex:1;border:0;border-radius:12px;background:var(--inset);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-3);font-weight:800;font-size:.75rem;transition:transform .1s,background .2s;}
.crew button svg{width:38px;height:44px;}
.crew button.on{background:color-mix(in srgb,#3ddc84 22%,var(--surface-2));color:var(--text);box-shadow:inset 0 0 0 2px #3ddc84;}
.crew button:active{transform:scale(.95);}
.crew button.you{background:var(--surface-2);color:var(--text-2);}
.ads{display:flex;gap:6px;}
.ads button{flex:1;border:0;border-radius:12px;background:var(--inset);padding:8px 4px;color:var(--text-2);font-weight:800;font-size:.85rem;line-height:1.15;}
.ads button small{display:block;font-size:.72rem;color:var(--text-3);font-weight:800;}
.ads button.on{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 2px var(--accent);}
.gear{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.gear button{border:0;border-radius:12px;background:var(--inset);padding:9px 10px;text-align:left;color:var(--text);display:grid;grid-template-columns:28px 1fr;gap:2px 8px;align-items:center;transition:transform .1s;}
.gear button:active:not(:disabled){transform:scale(.97);}
.gear button .ico{width:26px;height:26px;grid-row:span 2;color:var(--accent);}
.gear button b{font-size:.9rem;font-weight:900;line-height:1.1;}
.gear button span{font-size:.72rem;font-weight:700;color:var(--text-3);line-height:1.2;}
.gear button em{grid-column:2;font-style:normal;font-size:.8rem;font-weight:900;color:#ffd166;}
.gear button.own{background:color-mix(in srgb,#3ddc84 14%,var(--surface-2));}
.gear button.own em{color:#7ef0b0;}
.gear button:disabled{opacity:.45;}

/* Footer: money out, money left, open */
.foot{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--surface-2);position:sticky;bottom:calc(var(--safe-b) + 8px);z-index:5;box-shadow:0 -8px 22px rgba(0,0,0,.35);}
.foot .sum{flex:1;min-width:0;font-size:.8rem;font-weight:800;color:var(--text-3);line-height:1.3;}
.foot .sum b{display:block;font:400 1.2rem/1.1 var(--display);color:var(--text);font-variant-numeric:tabular-nums;}
.foot .sum b.neg{color:#ff8a8a;}
.foot .btn{flex:none;}

/* Game day */
.live{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.till{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;
  background:linear-gradient(180deg,#121a14,#0a0f0b);box-shadow:inset 0 2px 8px rgba(0,0,0,.6), 0 1px 0 var(--w08);}
.till small{display:block;font:800 .66rem/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:#6c8a74;}
.till b{font:400 2rem/1 var(--display);color:#6dff9e;text-shadow:0 0 12px rgba(80,255,140,.35);font-variant-numeric:tabular-nums;}
.till .cl{text-align:right;}
.till .cl b{font-size:1.25rem;color:#ffcf5a;text-shadow:0 0 10px rgba(255,200,80,.3);}
.meter{display:grid;grid-template-columns:34px 1fr;gap:2px 8px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--surface);position:relative;overflow:hidden;}
.meter svg.it{width:34px;height:34px;grid-row:span 2;}
.meter .t{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:.85rem;}
.meter .t b{font:400 1.1rem/1 var(--display);font-variant-numeric:tabular-nums;}
.meter .bar{height:7px;border-radius:99px;background:var(--inset);overflow:hidden;}
.meter .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3ddc84,#9ef0c0);transition:width .3s;}
.meter.low .bar i{background:linear-gradient(90deg,#ff9a3d,#ffd166);}
.meter.out .bar i{width:0!important;}
.meter.out::after{content:"SOLD OUT";position:absolute;right:6px;top:50%;transform:translateY(-50%) rotate(-8deg);padding:2px 6px;border:2.5px solid #ff4d5e;border-radius:6px;color:#ff4d5e;
  font:400 .9rem/1 var(--display);letter-spacing:.06em;background:color-mix(in srgb,var(--surface) 85%,transparent);animation:stamp .3s cubic-bezier(.3,1.6,.5,1) both;}
@keyframes stamp{from{transform:translateY(-50%) rotate(-8deg) scale(2.2);opacity:0;}}
.meter.none{opacity:.4;}
.lost{grid-column:1 / -1;display:flex;gap:6px;}
.lost div{flex:1;display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:12px;background:var(--surface);font-size:.74rem;font-weight:800;color:var(--text-3);line-height:1.1;}
.lost div svg{width:22px;height:22px;flex:none;}
.lost div b{display:block;font:400 1.1rem/1 var(--display);color:var(--text);font-variant-numeric:tabular-nums;}
.lost div.hit b{color:#ffad5c;}
.ctl{display:flex;gap:8px;}
.ctl .seg{flex:1;}

/* the line at your window, drawn as the day goes */
.lchart{grid-column:1 / -1;padding:8px 10px 6px;border-radius:14px;background:var(--surface);}
.lchart .hd2{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:.85rem;margin-bottom:2px;}
.lchart .hd2 b{font:400 1.05rem/1 var(--display);color:#ffd166;font-variant-numeric:tabular-nums;}
.lchart svg{display:block;width:100%;height:auto;overflow:visible;}

/* Report: the ledger */
.ledger{position:relative;border-radius:6px 6px 14px 14px;padding:18px 16px 14px 46px;color:#2a2a3a;
  background:repeating-linear-gradient(180deg,transparent 0 25px,rgba(60,90,170,.18) 25px 26px),linear-gradient(180deg,#fffcf3,#f5edd8);
  background-position:0 10px;box-shadow:0 16px 34px rgba(0,0,0,.45);font-family:var(--hand);}
.ledger::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1.5px;background:rgba(220,60,60,.45);}
.ledger::after{content:"";position:absolute;left:10px;top:14px;bottom:14px;width:12px;background:radial-gradient(circle,#2a2236 0 4px,transparent 4.5px) 0 0/12px 34px repeat-y;opacity:.85;}
.ledger h3{margin:0 0 2px;font:400 1.6rem/1 var(--hand);color:#1d2b5c;}
.ledger .ev{font:700 .78rem/1.3 var(--font);color:#7a6f5a;margin-bottom:6px;}
.lrow{display:grid;grid-template-columns:24px 1fr auto auto;gap:4px 8px;align-items:center;font-size:1.15rem;line-height:26px;opacity:0;transform:translateX(-6px);transition:opacity .25s,transform .25s;}
.lrow.in{opacity:1;transform:none;}
.lrow svg{width:22px;height:22px;}
.lrow .q{color:#5b5b6e;font-size:1rem;}
.lrow .v{text-align:right;min-width:4.4em;font-variant-numeric:tabular-nums;color:#1d2b5c;}
.lrow.cost .v{color:#a32626;}
.lrow.tot{border-top:2px solid #1d2b5c;margin-top:4px;font-size:1.35rem;}
.lrow.tot .v{font-size:1.55rem;}
.lrow.tot.up .v{color:#167a3c;}
.lrow.tot.down .v{color:#b42318;}
.lrow.sp{grid-template-columns:24px 1fr auto;}
.stampx{position:absolute;right:14px;top:12px;padding:4px 10px;border:3px solid currentColor;border-radius:8px;font:400 1.15rem/1 var(--display);letter-spacing:.06em;
  transform:rotate(9deg);opacity:0;}
.stampx.on{animation:stampin .35s cubic-bezier(.3,1.6,.5,1) both;}
@keyframes stampin{from{transform:rotate(9deg) scale(2.4);opacity:0;}to{transform:rotate(9deg);opacity:.85;}}
.notes{display:flex;flex-direction:column;gap:6px;}
.note{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:var(--surface);font-size:.88rem;font-weight:700;line-height:1.3;color:var(--text-2);
  opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;}
.note.in{opacity:1;transform:none;}
.note svg{width:26px;height:26px;flex:none;}
.note b{color:var(--text);}
.note.warn{box-shadow:inset 3px 0 0 #ffad5c;}
.note.good{box-shadow:inset 3px 0 0 #3ddc84;}
.note.bad{box-shadow:inset 3px 0 0 #ff6b6b;}

/* Season sheet */
.sea{width:100%;border-collapse:collapse;font-size:.9rem;}
.sea td{padding:7px 4px;border-bottom:1px solid var(--line);}
.sea td:last-child{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;}
.sea .up{color:#3ddc84;} .sea .down{color:#ff6b6b;}

/* Landscape and big screens: look on the left, act on the right */
@media (orientation:landscape) and (min-width:640px){
  .hd{height:calc(100dvh - var(--bar));padding-bottom:calc(var(--safe-b) + 8px);}
  .hd-main{flex-direction:row;flex:1;min-height:0;}
  .hd-scene{flex:1 1 auto;aspect-ratio:auto;height:100%;}
  .hd-panel{flex:0 0 clamp(330px,40%,440px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:4px;}
  .hd-panel::-webkit-scrollbar{display:none;}
}
@media (orientation:landscape) and (max-height:500px){
  .lchart{display:none;}
  .till{padding:6px 12px;} .meter{padding:5px 8px;} .meter svg.it{width:28px;height:28px;} .lost div{padding:5px 8px;}
  .ord{padding:6px 8px;} .ord .art{width:40px;height:40px;} .ord .art svg{width:34px;height:34px;}
  .step button{width:36px;height:36px;}
  .till b{font-size:1.6rem;}
}
@media (orientation:portrait) and (min-width:700px){
  .hd{max-width:860px;}
}
</style>

  function onEvent(x) {
    var r = D.res;
    if (x.k === 'serve') {
      x.items.forEach(function (k) { D.sold[k]++; if (k === 'dog') { D.have.dog--; D.have.bun--; } else D.have[k]--; });
      D.till += x.paid; D.served = (D.served || 0) + 1;
      updLive();
      var sp = D.spots[x.s], now = performance.now();
      if (!sp.p && now >= sp.until) {
        // the next fan steps up from the line (or straight in) and gets the order
        var p = D.qShown.length ? D.qShown.shift() : spawn(VB.x - 20, 242);
        sp.p = p; sp.until = now + 380 / D.speed;
        walkTo(p, sp.x + (D.R() - .5) * 4, 236, function () {
          x.items.forEach(function (k, i) { later(function () { fly(k, sp.x, 150, p.x, p.y - 52, .32, 10); }, i * 70); });
          later(function () {
            fly('coin', p.x, p.y - 40, 369, 150, .35, 14, function () { var tl = scene.querySelector('#h-till'); tl.classList.remove('till-pop'); void tl.getBBox; tl.classList.add('till-pop'); });
            if (D.R() < .45 || x.paid >= 1000) SND.ching(); else SND.coin();
          }, 200);
          later(function () { sp.p = null; walkTo(p, VB.x + VB.w + 30 + D.R() * 20, 246 + D.R() * 4, function () { p.gone = true; }); }, 330 / D.speed);
        });
      } else {
        // too busy to show every hand-off: a coin pops into the till
        if (D.R() < .5) { fly('coin', sp.x, 150, 369, 150, .3, 8); if (D.R() < .3) SND.coin(); }
      }
      stockArt(D.have);
    } else if (x.k === 'walk') {
      D.walks[x.r]++; updLive();
      var now2 = performance.now();
      if (now2 - D.walkVis > 520 / D.speed) {
        D.walkVis = now2;
        var w = spawn(VB.x - 20, 216 + D.R() * 8), sx = 70 + D.R() * 110;
        walkTo(w, sx, w.y, function () {
          bubble(w, x.r); if (x.r === 'price' || D.R() < .5) SND.hmm();
          later(function () { if (w.bubble) w.bubble.remove(); walkTo(w, VB.x - 40, w.y + 4, function () { w.gone = true; }); }, 700 / Math.max(1, D.speed * .7));
        });
      }
    } else if (x.k === 'out') {
      D.outs[x.it] = 1;
      scene.querySelector('#so-' + x.it).classList.add('on');
      var m = document.getElementById('m-' + x.it); if (m) m.classList.add('out');
      chartOut(x.t); SND.out(); Kit.haptic('heavy');
      banner(x.why === 'bun' ? 'Out of buns!' : 'Out of ' + (x.it === 'dog' ? 'hot dogs' : ITEMS[x.it].name.toLowerCase()) + '!', 'bad', 'close');
    } else if (x.k === 'phase') {
      if (x.w >= 1.5) { SND.horn(); banner(x.label + ' rush!', '', 'users'); Kit.haptic('medium'); }
      else if (/Final|Full time|Encore|Last laps|Awards/.test(x.label)) { banner(x.label, '', 'flag'); }
    } else if (x.k === 'score') {
      D.sc = x.sc.slice();
      D.jumbo.classList.remove('flash'); void D.jumbo.offsetWidth; D.jumbo.classList.add('flash');
      if (x.side === 0) { SND.roar(); banner((D.e.type === 'soccer' ? 'GOAL! ' : x.pts === 7 ? 'Touchdown, ' : 'Field goal, ') + HOME + '!', 'good', 'star'); }
      else SND.groan();
    } else if (x.k === 'news') {
      banner(x.text, x.tone, x.icon); Kit.sfx('whoosh', .4);
    }
  }
  function updLive() {
    var t = document.getElementById('d-till'); if (t) t.textContent = money(D.till);
    var sv = document.getElementById('d-served'); if (sv) sv.textContent = String(D.served || 0);
    var st = D.res.start;
    SELL.forEach(function (k) {
      var m = document.getElementById('m-' + k); if (!m) return;
      var s0 = k === 'dog' ? Math.min(st.dog, st.bun) : st[k], now = k === 'dog' ? Math.min(D.have.dog, D.have.bun) : D.have[k];
      m.querySelector('.t b').textContent = String(Math.max(0, now));
      m.querySelector('.bar i').style.width = (s0 ? Math.max(0, now) / s0 * 100 : 0).toFixed(1) + '%';
      m.classList.toggle('low', s0 > 0 && now > 0 && now / s0 < .2);
    });
    ['price', 'line', 'out'].forEach(function (r) {
      var w = document.getElementById('w-' + r); if (!w) return;
      w.querySelector('b').textContent = String(D.walks[r]); w.classList.toggle('hit', D.walks[r] > 0);
    });
  }
  D = null;
  function finishDay(skip) {
    if (!D || D.done) return;
    D.done = true;
    if (skip) {
      // run the rest at once
      var r = D.res;
      while (D.ei < r.events.length) { var x = r.events[D.ei++]; if (x.k === 'serve') { x.items.forEach(function (k) { D.sold[k]++; if (k === 'dog') { D.have.dog--; D.have.bun--; } else D.have[k]--; }); D.till += x.paid; D.served = (D.served || 0) + 1; } else if (x.k === 'walk') D.walks[x.r]++; else if (x.k === 'out') { scene.querySelector('#so-' + x.it).classList.add('on'); var m = document.getElementById('m-' + x.it); if (m) m.classList.add('out'); chartOut(x.t); } else if (x.k === 'score') D.sc = x.sc.slice(); }
      D.t = r.TEND; updLive(); if (D.jumbo) D.jumbo.innerHTML = jumboHTML(); stockArt(D.have); drawChart();
    }
    cancelAnimationFrame(D.raf);
    var d = D;
    d.qShown.forEach(function (p) { walkTo(p, VB.x - 40, 246, function () { p.gone = true; }); }); d.qShown = [];
    // let the last fans leave, then close up
    function drain() { if (d.dead) return; var now = performance.now(), dt = .016; d.people.forEach(function (p) { var dx = p.tx - p.x, dy = p.ty - p.y, dd = Math.hypot(dx, dy), st = 160 * dt; if (dd > st) { p.x += dx / dd * st; p.y += dy / dd * st; place(p); } else if (p.then) { var f = p.then; p.then = null; f(); } else if (dd <= st) { p.x = p.tx; p.y = p.ty; place(p); } }); d.people = d.people.filter(function (p) { if (p.gone) { p.g.remove(); return false; } return true; }); d.raf = requestAnimationFrame(drain); }
    d.raf = requestAnimationFrame(drain);
    loopStop();
    var rep = d.rep;
    later(function () { SND.horn(); banner(rep.sport ? 'Final: ' + HOME + ' ' + rep.score[0] + ', ' + rep.foe + ' ' + rep.score[1] : 'That’s a wrap!', rep.sport && rep.score[0] > rep.score[1] ? 'good' : '', 'flag'); }, 200);
    later(function () { scene.querySelector('svg').classList.remove('open'); SND.shutter(false); }, 1500);
    later(function () { cancelAnimationFrame(d.raf); d.dead = true; D = null; showReport(true); }, 2900);
  }

  // ── The ledger ────────────────────────────────────────────────────────────
  function showReport(anim) {
    var r = S.last, e = S.sched[r.i];
    if (!anim) { setScene(e, false); stockArt(null); }
    drawStrip();
    scene.querySelectorAll('.jumbo,.wxchip,.banner,.tkt').forEach(function (n) { n.remove(); });
    scene.querySelector('#h-people').innerHTML = ''; scene.querySelector('#h-fx').innerHTML = ''; scene.querySelector('#h-amb').innerHTML = '';
    panel.innerHTML = ''; panel.scrollTop = 0;
    var L = el('div', { class: 'ledger' });
    L.appendChild(el('h3', { text: e.title }));
    L.appendChild(el('div', { class: 'ev', text: TYPES[e.type].name + ' · ' + dateText(e) + ' · ' + WX_NAME[e.cond] + ' ' + e.temp + '°F · ' + e.crowd.toLocaleString() + ' fans' }));
    var rows = [];
    SELL.forEach(function (k) {
      if (!r.sold[k] && !(r.miss[k] + r.pass[k])) return;
      rows.push(lrow(art(k), (k === 'dog' ? 'Hot dogs' : ITEMS[k].name), r.sold[k] + ' × ' + money(r.prices[k]), money(r.take[k])));
    });
    rows.push(lrow(ICO('inbox'), 'Supplies', '', '−' + money(r.spend.sup), 'cost'));
    if (r.spend.crew) rows.push(lrow(ICO('users'), 'Helpers', r.helpers + ' × ' + money(WAGE, true), '−' + money(r.spend.crew), 'cost'));
    if (r.spend.ads) rows.push(lrow(ICO('sparkle'), ADS[r.ad].name, '', '−' + money(r.spend.ads), 'cost'));
    var tot = lrow('', 'Today', '', (r.net >= 0 ? '+' : '−') + money(Math.abs(r.net)), 'tot ' + (r.net >= 0 ? 'up' : 'down'));
    rows.push(tot);
    rows.forEach(function (x) { L.appendChild(x); });
    var best = S.best && S.best.i === r.i && S.log.length > 1;
    var stamp = el('div', { class: 'stampx', style: { color: r.net >= 0 ? '#167a3c' : '#b42318' }, text: best ? 'BEST DAY' : r.net >= 0 ? 'PROFIT' : 'LOSS' });
    L.appendChild(stamp);
    panel.appendChild(L);
    var notes = el('div', { class: 'notes' });
    insights(r).forEach(function (n) { notes.appendChild(el('div', { class: 'note ' + (n.tone || ''), html: n.icon + '<span>' + n.text + '</span>' })); });
    panel.appendChild(notes);
    var lastOne = S.i >= S.sched.length - 1;
    var btn = el('button', { class: 'btn btn-primary btn-lg btn-block', html: lastOne ? ICO('trophy') + 'Finish the season' : ICO('right') + 'Next event', onclick: next });
    panel.appendChild(btn);
    var all = [].slice.call(L.querySelectorAll('.lrow')), ns = [].slice.call(notes.children);
    if (!anim) { all.forEach(function (x) { x.classList.add('in'); }); stamp.classList.add('on'); ns.forEach(function (x) { x.classList.add('in'); }); return; }
    btn.style.visibility = 'hidden';
    all.forEach(function (x, i) { setTimeout(function () { x.classList.add('in'); SND.pencil(); }, 250 + i * 190); });
    var tEnd = 250 + all.length * 190 + 150;
    setTimeout(function () {
      stamp.classList.add('on'); SND.stamp(); Kit.haptic('medium');
      if (best) { Kit.callout('Best day yet!'); Kit.sfx('win', .6); }
      else if (r.net > 0 && r.revenue >= 150000) { Kit.callout(money(r.net, true) + '!'); Kit.sfx('good', .7); }
      else if (r.net < 0) Kit.sfx('bad', .5);
      var M = MODES[S.mode];
      if (S.cash >= M.goal && r.cashBefore < M.goal) setTimeout(function () { Kit.confetti(); Kit.callout('Season goal reached!'); Kit.sfx('win'); Kit.haptic('success'); }, 900);
    }, tEnd);
    ns.forEach(function (x, i) { setTimeout(function () { x.classList.add('in'); }, tEnd + 350 + i * 160); });
    setTimeout(function () { btn.style.visibility = ''; }, tEnd + 350 + ns.length * 160);
  }
  function lrow(icon, name, q, v, cls) {
    return el('div', { class: 'lrow ' + (cls || ''), html: '<span>' + icon + '</span><span>' + name + '</span><span class="q">' + q + '</span><span class="v">' + v + '</span>' });
  }
  // What the day says about your choices, in plain words
  function insights(r) {
    var out = [], nm = function (k) { return k === 'dog' ? 'hot dogs' : ITEMS[k].name.toLowerCase(); };
    SELL.forEach(function (k) {
      if (r.outs[k]) {
        var at = r.outAt[k], seg = phaseName(r, at);
        if (r.miss[k] <= 4 && lateInDay(r, at)) { out.push({ tone: 'good', icon: ICO('check'), text: 'Sold the last of the ' + (r.outWhy[k] === 'bun' ? 'buns' : nm(k)) + ' in ' + seg + '. <b>Spot-on order.</b>' }); return; }
        out.push({ tone: 'warn', icon: walkIcon('out'), text: '<b>Sold out of ' + (r.outWhy[k] === 'bun' ? 'buns' : nm(k)) + '</b>' + (seg ? ' during ' + seg : '') + '. About <b>' + r.miss[k] + '</b> more ' + (r.miss[k] === 1 ? 'sale' : 'sales') + ' were there to be had.' });
      }
    });
    var worst = null; SELL.forEach(function (k) { if (r.pass[k] > (worst ? r.pass[worst] : 0)) worst = k; });
    if (worst && r.pass[worst] >= Math.max(8, r.sold[worst] * .25)) out.push({ tone: 'warn', icon: walkIcon('price'), text: '<b>' + r.pass[worst] + ' fans passed on ' + nm(worst) + '</b> at ' + money(r.prices[worst]) + '.' });
    else if (worst === null || r.pass[worst] < r.sold[worst] * .06) {
      var cheap = SELL.filter(function (k) { return r.sold[k] > 30 && r.pass[k] < r.sold[k] * .04; })[0];
      if (cheap) out.push({ tone: '', icon: walkIcon('price'), text: 'Hardly anyone blinked at ' + money(r.prices[cheap]) + ' for ' + (cheap === 'dog' ? 'a hot dog' : nm(cheap)) + '. Fans might pay more.' });
    }
    if (r.walks.line >= 6) out.push({ tone: 'warn', icon: walkIcon('line'), text: '<b>' + r.walks.line + ' fans gave up on the line</b>' + (r.peakQ >= 8 ? ', which hit ' + r.peakQ + ' deep' + (phaseName(r, r.peakAt) ? ' at ' + phaseName(r, r.peakAt) : '') : '') + '. ' + (r.helpers < 3 ? 'Another helper would move it faster.' : 'Gear can speed up the window.') });
    if (r.spoiled.dog || r.spoiled.bun) out.push({ tone: 'bad', icon: ICO('trash'), text: 'Threw out ' + [r.spoiled.dog ? r.spoiled.dog + ' hot dogs' : '', r.spoiled.bun ? r.spoiled.bun + ' stale buns' : ''].filter(Boolean).join(' and ') + '.' });
    var leftDog = r.left.dog, leftBun = r.left.bun;
    if (leftDog > leftBun + 20 && !r.outs.dog) out.push({ tone: '', icon: art('bun'), text: leftDog - leftBun + ' hot dogs have no bun to go with them.' });
    if (r.sport) out.push({ tone: r.score[0] > r.score[1] ? 'good' : '', icon: ICO('flag'), text: r.score[0] > r.score[1] ? 'The ' + HOME + ' won ' + r.score[0] + '–' + r.score[1] + ' and the fans hung around.' : r.score[0] < r.score[1] ? 'The ' + HOME + ' lost ' + r.score[1] + '–' + r.score[0] + '.' : 'A ' + r.score[0] + '–' + r.score[1] + ' tie.' });

  }
  var PHRASE = { 'Gates open': 'the pregame', 'Halftime': 'halftime', 'Final': 'the last minutes', 'Full time': 'the last minutes', 'Overtime': 'overtime', 'Weather delay': 'the weather delay',
    'Doors open': 'the doors opening', 'Opening act': 'the opening act', 'Set change': 'the set change', 'Headliner': 'the headliner', 'Encore': 'the encore', 'Pit party': 'the pit party',
    'Racing': 'the racing', 'Intermission': 'intermission', 'Freestyle': 'freestyle', 'Last laps': 'the last laps', 'Warm-ups': 'warm-ups', 'Bands on the field': 'the band show', 'Awards': 'the awards' };
  function phaseName(r, t) {
    if (t == null) return '';
    var segs = TYPES[r.type].segs;
    for (var i = 0; i < segs.length; i++) if (t < segs[i][2] * 60) return PHRASE[segs[i][0]] || 'the ' + segs[i][0].toLowerCase();
    return 'the very end';
  }
  function lateInDay(r, t) { var segs = TYPES[r.type].segs, last = segs[segs.length - 1]; return t >= (last[1] - 8) * 60; }
  function next() {
    if (S.i >= S.sched.length - 1) { endSeason(); return; }
    S.i++; S.phase = 'prep'; S.tab = 'order'; S.ad = 0; save();
    Kit.sfx('flip', .6); render(true);
  }

  // ── End of the season ─────────────────────────────────────────────────────
  function endSeason() {
    S.phase = 'over'; save();
    var M = MODES[S.mode], won = S.cash >= M.goal, score = Math.round(S.cash / 100);
    recordSeason(true);
    clearSave();
    var finalS = S;
    render(false);
    ArcadeHi.check('hotdogstand_' + finalS.mode, score, function () {
      Kit.win({
        lose: !won, icon: won ? null : 'meh',
        title: won ? 'Season goal reached!' : 'Season over',
        sub: M.name + ' season · finished with ' + money(finalS.cash, true) + (won ? '' : ' · goal ' + money(M.goal, true)),
        againLabel: 'New season', again: function () { newSeason(finalS.mode); },
        extra: [{ label: 'High scores', onClick: function () { ArcadeHi.show('hotdogstand_' + finalS.mode); } }, { label: 'Change level', onClick: function () { S = null; showSetup(); } }],
        onClose: function () { S = null; Kit.home(); }
      });
    });
  }
  function recordSeason(done) {
    if (!S || S.recorded) return;
    S.recorded = true;
    var M = MODES[S.mode], won = done && S.cash >= M.goal, t = S.tot;
    var hl = [];
    hl.push((done ? 'Finished the ' : 'Stopped the ') + M.name + ' season with ' + money(S.cash, true) + (done ? '' : ' after ' + S.log.length + ' of ' + S.sched.length + ' events'));
    if (S.best) hl.push('Best day: ' + money(S.best.net, true) + ' at ' + S.best.title);
    hl.push('Sold ' + t.sold.dog.toLocaleString() + ' hot dogs, ' + t.sold.soda.toLocaleString() + ' sodas, ' + t.sold.chips.toLocaleString() + ' chips' + (t.sold.cocoa ? ' and ' + t.sold.cocoa.toLocaleString() + ' cocoas' : ''));
    if (t.outs) hl.push('Sold out ' + t.outs + (t.outs === 1 ? ' time' : ' times'));
    var g = Object.keys(S.owned); if (g.length) hl.push('Gear: ' + g.map(function (k) { return gear(k).name.toLowerCase(); }).join(', '));
    Kit.record(HKEY, {
      started: S.started, mode: M.name, players: [{ name: Kit.player() || 'You', score: Math.round(S.cash / 100) }], winner: won ? (Kit.player() || 'You') : null,
      summary: (won ? 'Reached the goal · ' : done ? 'Season over · ' : 'Stopped · ') + money(S.cash, true), badge: money(S.cash, true), highlights: hl,
      meta: { mode: S.mode, cash: S.cash, goal: M.goal, won: won, events: S.log.length },
      detail: seasonFile(done)

  }
  // The season for the history: start, goal and gear, then each event's ledger as one line
  // 'title|type|weather|temp|crowd|fans|served|net|revenue|cash after|spent|dogs.sodas.chips.cocoa sold|their prices|walked: price.line.out|sold out (d s c k)|peak line|helpers|ad|spoiled|score|news|date'
  function seasonFile(done) {
    var keys = { dog: 'd', soda: 's', chips: 'c', cocoa: 'k' };
    return {
      v: 2, m: S.mode, g: MODES[S.mode].goal, c0: START_CASH, c: S.cash, n: S.sched.length, done: done ? 1 : 0, gear: Object.keys(S.owned).join(','),
      ev: S.log.map(function (l) {
        var w = l.walks || {}, p = l.prices || {};
        return [l.title, l.type || '', l.cond || '', l.temp != null ? l.temp : '', l.crowd || '', l.fans || '', l.served || '', l.net, l.revenue, l.cash != null ? l.cash : '', l.spend || '',
          SELL.map(function (k) { return (l.sold && l.sold[k]) || 0; }).join('.'), SELL.map(function (k) { return p[k] || 0; }).join('.'),
          [w.price || 0, w.line || 0, w.out || 0].join('.'), Object.keys(l.outs || {}).map(function (k) { return keys[k] || ''; }).join(''),
          l.peakQ || 0, l.helpers || 0, l.ad || 0, l.spoiled || 0, l.score || '', l.news || '', l.date ? Math.round(l.date / 864e5) : ''].join('|');
      })
    };
  }
  function showOver() {
    setScene(S.sched[S.sched.length - 1], false); drawStrip();
    panel.innerHTML = '';
    panel.appendChild(seasonTable());
    panel.appendChild(el('button', { class: 'btn btn-primary btn-lg btn-block', text: 'New season', onclick: function () { newSeason(S.mode); } }));
  }
  function seasonTable() {
    var t = '<table class="sea"><tbody>';
    S.log.forEach(function (l, i) { t += '<tr><td>' + (i + 1) + '</td><td>' + esc(l.title) + '</td><td class="' + (l.net >= 0 ? 'up' : 'down') + '">' + (l.net >= 0 ? '+' : '−') + money(Math.abs(l.net), true) + '</td></tr>'; });
    if (!S.log.length) t += '<tr><td colspan="3">No events yet.</td></tr>';
    return el('div', { class: 'sect', html: '<h4>Season so far <small>' + MODES[S.mode].name + ' · goal ' + money(MODES[S.mode].goal, true) + '</small></h4>' + t + '</tbody></table>' });
  }
  function seasonSheet() {
    if (!S) { Kit.toast('No season running'); return; }
    var n = seasonTable(), up = S.sched.slice(S.i + (S.phase === 'prep' ? 0 : 1)).map(function (e) { return '<tr><td></td><td>' + esc(e.title) + '</td><td style="font-weight:700;color:var(--text-3)">' + MON[new Date(e.date).getMonth()] + ' ' + new Date(e.date).getDate() + '</td></tr>'; }).join('');
    if (up) n.innerHTML += '<h4 style="margin-top:12px">Still to come</h4><table class="sea"><tbody>' + up + '</tbody></table>';
    Kit.sheet({ title: 'Season so far', node: n });
  }

  document.addEventListener('visibilitychange', function () { if (document.hidden && D) { D.speed = D.speed; loopStop(); } else if (!document.hidden && D && !D.done) { loopStart(); D.last = performance.now(); } });

  // test hooks
  window.__hd = { simulate: simulate, makeSeason: makeSeason, MODES: MODES, TYPES: TYPES, ITEMS: ITEMS, state: function () { return S; }, render: render, endSeason: function () { endSeason(); }, setState: function (s) { S = s; save(); render(false); }, money: money };

  // ── Boot ──────────────────────────────────────────────────────────────────
  S = load();
  if (S && S.phase !== 'over') { render(false); }
  else { S = null; showSetup(); }
})();

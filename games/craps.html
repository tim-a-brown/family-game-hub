<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Craps</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../casino.js"></script>
<script src="../coach.js"></script>
<style>
/* ── Casino chips (local; candidates for the kit) ─────────────────────────
   Standard colours: 1 white, 5 red, 25 green, 100 black, 500 purple. */
.c3{--cs:28px;--c:#c8202f;--s:#fff;--k:#fff;
  position:relative;width:var(--cs);height:var(--cs);border-radius:50%;flex:none;
  display:grid;place-items:center;color:var(--k);font:900 calc(var(--cs) * .36)/1 var(--font);letter-spacing:-.03em;
  background:
    radial-gradient(circle, var(--c) 0 46%, var(--s) 47% 50%, var(--c) 51% 63%, transparent 64%),
    repeating-conic-gradient(from 8deg, var(--s) 0 16deg, var(--c) 16deg 45deg);
  box-shadow:0 calc(var(--cs) * .06) 0 color-mix(in srgb,var(--c) 55%,#000), 0 calc(var(--cs) * .1) calc(var(--cs) * .14) rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.18);}
.c3.d1{--c:#f1ece0;--s:#2f6bd8;--k:#1d2440;}
.c3.d5{--c:#c8202f;--s:#fff;}
.c3.d25{--c:#1d8a4b;--s:#fff;}
.c3.d100{--c:#1b1b22;--s:#e8e2d0;}
.c3.d500{--c:#6a3aa2;--s:#f3d34a;}
.stk{position:absolute;width:var(--cs);height:var(--cs);transform:translate(-50%,-50%);pointer-events:none;z-index:5;transition:opacity .5s, transform .5s var(--ease);}
.stk .c3{position:absolute;left:0;}
.stk .c3:not(:last-child){font-size:0;}
.stk.drop{animation:chipdrop .28s var(--spring);}
@keyframes chipdrop{from{transform:translate(-50%,-90%) scale(1.25);opacity:.4;}to{transform:translate(-50%,-50%);}}
.stk.off .c3{filter:saturate(.35) brightness(.8);}
.stk .tag{position:absolute;left:50%;top:calc(100% + 1px);transform:translateX(-50%);font:900 .52rem/1 var(--font);letter-spacing:.06em;color:#fff;background:rgba(0,0,0,.65);padding:2px 4px;border-radius:4px;white-space:nowrap;}
.stk.won .c3:last-child{box-shadow:0 0 0 3px #ffd54a, 0 0 14px rgba(255,213,74,.9);}
.stk.lost{opacity:0;transform:translate(-50%,-220%) scale(.7);}
.paybub{position:absolute;z-index:9;transform:translate(-50%,-50%);white-space:nowrap;padding:2px 7px;border-radius:999px;pointer-events:none;
  background:#ffd54a;color:#3a2600;font:900 .74rem/1.25 var(--font);box-shadow:0 2px 6px rgba(0,0,0,.4);animation:paybub 1.8s var(--ease) forwards;}
@keyframes paybub{0%{opacity:0;margin-top:6px;}15%{opacity:1;margin-top:0;}80%{opacity:1;}100%{opacity:0;margin-top:-14px;}}

.stage.cr{max-width:560px;padding-bottom:calc(var(--rail,150px) + var(--safe-b) + 12px);}
.bank{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.bank div{background:var(--w06);border-radius:12px;padding:5px 8px;text-align:center;min-width:0;}
.bank small{display:block;font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.bank b{display:block;font-size:1.08rem;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bank .gold{color:var(--yellow);} .pos{color:var(--green)!important;} .neg{color:var(--red)!important;}
.msg{min-height:24px;text-align:center;font-weight:800;color:var(--text-2);margin:0 0 8px;font-size:.92rem;line-height:1.3;}
.msg b{color:var(--text);}
/* Bet guide: tag under the message line, and the dice chart in its sheet */
.bg-row{display:flex;justify-content:center;min-height:25px;margin:-2px 0 8px;}
.bg-row.hide{visibility:hidden;}
.bg-dice{display:grid;grid-template-columns:auto auto minmax(40px,1fr) auto;gap:5px 10px;align-items:center;font-size:.86rem;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums;}
.bg-dice b{color:var(--text);font-weight:900;text-align:right;}
.bg-dice .bar{height:9px;border-radius:999px;background:var(--w08);overflow:hidden;}
.bg-dice .bar i{display:block;height:100%;border-radius:999px;background:#3ddc84;}
.bg-dice .bar i.s{background:#ff6b78;}
.bg-dice .hd{font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.bg-dice .hd:first-child{text-align:right;}
.cch-best .bg-note{display:block;margin-top:8px;font-size:.82rem;line-height:1.35;color:var(--text-3);}

/* ── Table ───────────────────────────────────────────────────────────── */
.ctab{border-radius:22px;padding:8px;}
.ctab .felt-in{position:relative;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.zone{position:relative;border:2px solid rgba(255,255,255,.78);border-radius:10px;cursor:pointer;-webkit-user-select:none;user-select:none;
  display:flex;align-items:center;justify-content:center;transition:background .15s, box-shadow .15s;}
.zone:active{background:rgba(255,255,255,.08);}
.zone.lit{box-shadow:0 0 0 3px #ffd54a, inset 0 0 20px rgba(255,213,74,.35);}
.zone.closed{cursor:default;}
.zone.closed > .ztxt{opacity:.4;}
.ztxt{font-family:var(--display);letter-spacing:.06em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);text-transform:uppercase;line-height:1;text-align:center;pointer-events:none;}
.ztxt small{display:block;font-family:var(--font);font-weight:900;font-size:.6rem;letter-spacing:.1em;color:rgba(255,255,255,.75);margin-top:3px;text-shadow:none;}
.a{position:absolute;width:0;height:0;pointer-events:none;}

/* Dice landing area with the rubber back wall */
.dz{position:relative;height:132px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);}
.wall{position:absolute;left:0;right:0;top:0;height:16px;background:
  conic-gradient(from 45deg at 50% 50%, #3b3b42 0 25%, #1f1f25 0 50%, #2c2c33 0 75%, #18181d 0) 0 0/12px 12px;box-shadow:0 2px 6px rgba(0,0,0,.5);}
.dz .state{position:absolute;right:12px;top:24px;text-align:right;font-family:var(--display);font-size:1.15rem;color:rgba(255,255,255,.5);letter-spacing:.06em;pointer-events:none;}
.dz .state.on{color:rgba(255,236,170,.75);}
.dz .hist{position:absolute;left:52px;right:8px;bottom:6px;display:flex;flex-direction:row-reverse;gap:4px;justify-content:flex-start;pointer-events:none;overflow:hidden;}
.dz .hist span{min-width:22px;height:22px;padding:0 4px;border-radius:6px;display:grid;place-items:center;font:900 .74rem/1 var(--font);color:#fff;background:rgba(0,0,0,.35);}
.dz .hist span.s{background:#a8161f;} .dz .hist span.p{background:#c99a1a;color:#2a1a00;}
.dz .hist span:first-child{box-shadow:0 0 0 2px rgba(255,255,255,.7);}
.dz .die{--ds:44px;position:absolute;left:0;top:0;pointer-events:none;will-change:transform;}

/* Point boxes */
.pts{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.pb{flex-direction:column;justify-content:flex-start;height:108px;border-radius:8px;}
.pb .dcs{align-self:stretch;height:24px;border-bottom:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.18);border-radius:6px 6px 0 0;}
.pb .ztxt{margin-top:6px;font-size:1.45rem;color:#ffe9a6;}
.pb .ztxt.w{font-size:1.02rem;margin-top:10px;margin-bottom:4px;}
.pb .pl{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:900 .5rem/1 var(--font);letter-spacing:.1em;color:rgba(255,255,255,.55);pointer-events:none;}
.pb.pt{background:rgba(255,255,255,.1);}
.puck{position:absolute;z-index:12;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);
  font:900 .66rem/1 var(--font);letter-spacing:.04em;transition:left .55s var(--spring), top .55s var(--spring), background .3s, color .3s;pointer-events:none;
  box-shadow:0 4px 8px rgba(0,0,0,.55), inset 0 -3px 0 rgba(0,0,0,.25), inset 0 0 0 3px rgba(255,255,255,.25);}
.puck.off{background:#16161a;color:#fff;}
.puck.on{background:#f6f2e8;color:#16161a;box-shadow:0 4px 8px rgba(0,0,0,.55), inset 0 -3px 0 rgba(0,0,0,.18), inset 0 0 0 3px rgba(0,0,0,.12);}

.zcome{height:54px;}
.zcome .ztxt{font-size:1.9rem;color:#ff5a5f;}
.row2{display:grid;grid-template-columns:36% 1fr;gap:6px;}
.zdc{height:62px;}
.zdc .ztxt{font-size:.82rem;}
.zfield{height:62px;}
.zfield .ztxt{font-size:1.25rem;color:#ffe9a6;}
.zfield .nums{display:flex;gap:6px;justify-content:center;margin-top:3px;font:400 .95rem/1 var(--display);color:#fff;letter-spacing:0;}
.zfield .nums i{font-style:normal;width:22px;height:22px;border-radius:50%;border:2px solid #ffe9a6;display:inline-grid;place-items:center;margin-top:-3px;}
.zdp{height:44px;}
.zdp .ztxt{font-size:1rem;}
.zpass{height:58px;}
.zpass .ztxt{font-size:1.65rem;}
.oddslbl{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:900 .58rem/1 var(--font);letter-spacing:.12em;color:rgba(255,255,255,.55);pointer-events:none;
  border:1.5px dashed rgba(255,255,255,.45);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;}
.die.md{--ds:17px;padding:2px;border-radius:4px;display:inline-grid;vertical-align:middle;}
.die.md i{width:80%;height:80%;}

/* Proposition bets */
.props{border-radius:12px;padding:8px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px rgba(255,90,95,.55);display:flex;flex-direction:column;gap:5px;}
.props .lbl{font:900 .62rem/1 var(--font);letter-spacing:.14em;color:rgba(255,255,255,.6);text-transform:uppercase;text-align:center;margin:2px 0;}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.pz{height:58px;border-radius:8px;flex-direction:column;gap:4px;border-color:rgba(255,255,255,.6);}
.pz .dd{display:flex;gap:3px;pointer-events:none;}
.pz .ztxt{font-size:.78rem;letter-spacing:.04em;color:#ffe9a6;}
.pz.wide{grid-column:span 4;height:44px;flex-direction:row;gap:10px;}
.pz.wide .ztxt{font-size:1.05rem;}
.pz.wide .ztxt.r{color:#ff6b6f;}

/* Rail */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px calc(12px + var(--corner-x)) calc(var(--safe-b) + 10px + var(--corner-y));border-radius:22px 22px 0 0;}
.rail-in{max-width:560px;margin:0 auto;}
.rail .cz-rack{margin-top:2px;margin-bottom:8px;}
@media (max-height:760px){ .rail .cz-rack{--cs:40px;margin-top:0;margin-bottom:6px;padding:5px 8px 6px;} }
.acts{display:flex;gap:8px;align-items:center;}
.acts .icon-btn{width:52px;height:52px;background:rgba(0,0,0,.28);}
.acts .btn{min-height:52px;}
.acts .roll{flex:1;}
.acts .down{min-width:104px;padding:0 12px;white-space:nowrap;}
.opts{display:flex;flex-direction:column;gap:10px;}

/* ── Wide landscape (iPad, laptop): the table spans the top, dice and proposition bets beside the main layout;
   the rail below holds bankroll and messages on the left, chips and buttons on the right ── */
@media (orientation:landscape) and (min-width:900px) and (min-height:560px){
  /* --avh: the height the layout's rows share once the bar, the rail and the wood are taken off */
  .stage.cr{max-width:1180px;padding-top:26px;padding-bottom:calc(var(--rail,150px) + 8px);
    --avh:calc(100dvh - var(--rail,150px) - var(--safe-t) - 58px - 96px);}
  .ctab .felt-in{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);column-gap:10px;row-gap:6px;align-items:start;}
  .ctab .felt-in > *{grid-column:1;}
  .ctab .felt-in > .dz{grid-column:2;grid-row:1;height:100%;min-height:100px;}
  .ctab .felt-in > .props{grid-column:2;grid-row:2 / span 4;align-self:stretch;justify-content:space-between;}
  .pb{height:clamp(116px,calc(var(--avh) * .34),240px);}
  .zcome{height:clamp(58px,calc(var(--avh) * .17),120px);}
  .zdc,.zfield{height:clamp(62px,calc(var(--avh) * .18),126px);}
  .zdp{height:clamp(44px,calc(var(--avh) * .13),90px);}
  .zpass{height:clamp(62px,calc(var(--avh) * .18),126px);}
  .pz{height:clamp(48px,calc(var(--avh) * .13),92px);gap:3px;}
  .pz.wide{height:clamp(38px,calc(var(--avh) * .1),70px);}
  .props .lbl{margin:0;}
  .rail-in{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);grid-template-areas:"info rack" "info acts";column-gap:28px;align-items:center;}
  .rail-in > .cinfo{grid-area:info;min-width:0;}
  .rail-in > .cz-rack{grid-area:rack;}
  .rail-in > .acts{grid-area:acts;}
  .cinfo .bank{max-width:460px;margin-bottom:6px;}
  .cinfo .bank div{background:rgba(0,0,0,.26);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);}
  .cinfo .msg{text-align:left;margin:0;min-height:0;color:rgba(255,255,255,.88);}
  .cinfo .bg-row{justify-content:flex-start;margin:6px 0 0;}
}
.czlk{display:inline-grid;place-items:center;width:1.3em;height:1.3em;margin-right:4px;border-radius:50%;background:#5b8cff;color:#fff;vertical-align:-.3em;}
.czlk.pl{background:#8b6cf0;}
.czlk .ico{width:.85em!important;height:.85em!important;color:#fff!important;stroke-width:3;}
</style>
</head>
<body>
<main class="stage cr" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'cr_state', HKEY = 'craps';
  try { sessionStorage.removeItem('cr_state'); } catch (e) {}   // old versions kept the table here

  var BOX = [4, 5, 6, 8, 9, 10];
  var WORD = { 4: '4', 5: '5', 6: 'SIX', 8: '8', 9: 'NINE', 10: '10' };
  var PLACE = { 4: [9, 5], 10: [9, 5], 5: [7, 5], 9: [7, 5], 6: [7, 6], 8: [7, 6] };
  var TAKE = { 4: [2, 1], 10: [2, 1], 5: [3, 2], 9: [3, 2], 6: [6, 5], 8: [6, 5] };
  var LAY = { 4: [1, 2], 10: [1, 2], 5: [2, 3], 9: [2, 3], 6: [5, 6], 8: [5, 6] };
  var HARD = { 4: 7, 10: 7, 6: 9, 8: 9 };
  var PROPS = { any7: ['Any 7', 4], anyCraps: ['Any craps', 7], two: ['Aces (2)', 30], three: ['Ace-deuce (3)', 15], yo: ['Yo (11)', 15], twelve: ['Boxcars (12)', 30] };
  var DENOMS = [500, 100, 25, 5, 1];
  function money(n) { n = Math.round(n); return (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString(); }
  function signed(n) { n = Math.round(n); return (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString(); }
  function short(a) { return a >= 10000 ? Math.round(a / 1000) + 'k' : a >= 1000 ? (Math.round(a / 100) / 10) + 'k' : String(a); }
  function total(b) { var t = 0; for (var k in b) t += b[k]; return t; }
  function rnd(n) { return Math.floor(Math.random() * n); }

  function nameOf(id) {
    var m;
    if (id === 'pass') return 'Pass line'; if (id === 'dp') return "Don't pass";
    if (id === 'passOdds') return 'Pass odds'; if (id === 'dpOdds') return "Don't pass odds";
    if (id === 'come') return 'Come'; if (id === 'dc') return "Don't come"; if (id === 'field') return 'Field';
    if (PROPS[id]) return PROPS[id][0];
    if ((m = /^place(\d+)$/.exec(id))) return 'Place ' + m[1];
    if ((m = /^hard(\d+)$/.exec(id))) return 'Hard ' + m[1];
    if ((m = /^comeOdds(\d+)$/.exec(id))) return 'Come ' + m[1] + ' odds';
    if ((m = /^dcOdds(\d+)$/.exec(id))) return "Don't come " + m[1] + ' odds';
    if ((m = /^come(\d+)$/.exec(id))) return 'Come ' + m[1];
    if ((m = /^dc(\d+)$/.exec(id))) return "Don't come " + m[1];
    return id;
  }

  // ── Menu & rules ─────────────────────────────────────────────────────────
  Kit.init({ orient: 'portrait',   // phones: the table and chip rack only fit upright
    id: 'craps', confirmNew: false,
    onNew: function () { endSession(true); },
    undo: function () { undoChip(); },
    menu: [
      { icon: 'coins', label: 'Cash out (end session)', onClick: function () { endSession(false); } },
      { icon: 'history', label: 'Past sessions', onClick: function () { Kit.history(HKEY, { title: 'Craps: past sessions' }); } },
      { icon: 'sync', label: function () { return topUp(S ? S.player : 'You').menu; }, onClick: resetBank }
    ],
    rules:
      '<p class="goal">You are the shooter. Bet on what the two dice will do, then roll. The big one is the <b>Pass line</b>.</p>' +
      '<h3>Putting chips down</h3><ul><li>Drag a chip from the rack at the bottom onto a bet. The bet lights up under the chip; let go to put it down. Drag more chips to bet more.</li>' +
      '<li>Let go anywhere off the bets and the chip goes back to the rack. A bet that is closed right now shows red.</li>' +
      '<li>Shortcut: tap a chip in the rack to pick it, then tap bets to add that chip.</li></ul>' +
      '<h3>Come-out roll (puck says OFF)</h3><ul>' +
      '<li><b>7 or 11</b>: Pass line wins. <b>2, 3 or 12</b> ("craps"): Pass line loses.</li>' +
      '<li>Any other number (4, 5, 6, 8, 9, 10) becomes <b>the point</b>. The puck flips to ON and sits on that number.</li></ul>' +
      '<h3>After the point is set</h3><ul>' +
      '<li>Keep rolling. Roll the point again before a 7 and the Pass line wins.</li>' +
      '<li>Roll a 7 first and it is a <b>seven-out</b>: Pass loses and the next roll is a new come-out.</li></ul>' +
      '<h3>Line bets (pay 1 to 1)</h3><ul>' +
      '<li><b>Don\'t pass</b> is the opposite: wins on 2 or 3, ties on 12, loses on 7 or 11. Then it wins if 7 comes before the point.</li>' +
      '<li><b>Come</b> and <b>Don\'t come</b> work like Pass and Don\'t pass, but you make them after the point is set. Your chips move to the number that rolls next.</li></ul>' +
      '<h3>Odds (the best bet in the casino)</h3><p>Once your line bet has a number, add <b>odds</b> behind it. Odds pay true odds with no house edge: <b>2 to 1</b> on 4 and 10, <b>3 to 2</b> on 5 and 9, <b>6 to 5</b> on 6 and 8. Most tables allow <b>3-4-5x</b>: three times your bet on 4/10, four on 5/9, five on 6/8. Drag chips onto the ODDS circle behind the Pass line, or onto a point box where your Come chips sit. Don\'t bettors <b>lay</b> odds (up to 6 times their bet on any number).</p>' +
      '<h3>Place bets</h3><p>Drop chips on a number box to bet that number rolls before a 7. Pays <b>9 to 5</b> on 4 and 10, <b>7 to 5</b> on 5 and 9, <b>7 to 6</b> on 6 and 8. Place bets stay up after they win (you collect the winnings), and are <b>off</b> on the come-out roll.</p>' +
      '<h3>Field (one roll)</h3><p>Wins on 2, 3, 4, 9, 10, 11 or 12, loses on 5, 6, 7, 8. Pays 1 to 1, <b>double on 2</b> and double or triple on 12 (your choice at setup).</p>' +
      '<h3>Proposition bets</h3><ul>' +
      '<li><b>Hardways</b>: a number rolled as a pair (hard 8 is 4+4) before a 7 or the easy way. Hard 6 or 8 pays <b>9 to 1</b>, hard 4 or 10 pays <b>7 to 1</b>. Off on the come-out.</li>' +
      '<li>One roll: <b>Any 7</b> 4 to 1, <b>Any craps</b> (2, 3 or 12) 7 to 1, <b>2</b> or <b>12</b> 30 to 1, <b>3</b> or <b>11</b> 15 to 1.</li></ul>' +
      '<h3>Buttons</h3><p><b>Undo</b> takes back your last chip before you roll. <b>Take down</b> picks up every bet you are allowed to remove (a Pass or Come bet that has a point must stay). Winning Pass, Don\'t pass, place and hardway bets stay on the table for the next roll, just like at a casino; one-roll bets come back to you with their winnings. Your bankroll is shared with the other casino games; <b>Cash out</b> in the menu saves your session.</p>' +
      '<p>Your bankroll is yours. Frequent players each have their own, and players linked to their own profile play from theirs. Anyone else, or a seat without a name, gets $1,000 in play money.</p>'
  });

  // ── State ────────────────────────────────────────────────────────────────
  var S = null, chipV = 5, busy = false, R = {};
  function save() {
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && (S.sess.rolls || total(S.bets))) Kit.resume.set(S.sess.rolls ? signed(S.sess.net) + ' · ' + S.sess.rolls + ' roll' + (S.sess.rolls === 1 ? '' : 's') : 'Bets on the table');
  }
  function load() { try { var s = JSON.parse(localStorage.getItem(SAVE)); return s && s.v === 2 ? s : null; } catch (e) { return null; } }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  // ── Whose money (casino.js): your bankroll; a player linked to their own profile plays from theirs; a frequent
  // player from their own bankroll on this account; anyone else, or a seat without a name, from $1,000 in play
  // money for this game (your bankroll isn't touched). Called when a session starts and when one resumes.
  function noName(name) { return /^(|you|me|player\s*\d*|p\d)$/i.test(String(name || '').trim()); }
  function moneyFor(name, fresh) {

  // Bets the player may pick up: everything except contract bets

  // ── Rolling ──────────────────────────────────────────────────────────────

    var d = [1 + rnd(6), 1 + rnd(6)];

  // Settle every bet for a roll of d1 + d2. Returns what happened.
  function resolve(d1, d2) {
    var t = d1 + d2, hard = d1 === d2 && t > 2 && t < 12, P = S.point, on = P > 0, B = S.bets;
    var out = { d: [d1, d2], t: t, hard: hard, net: 0, won: [], lost: [], notes: [], head: '', kind: '', top: null, pointBefore: P };
    function W(id, num, den, keep) {
      var a = B[id]; if (!a) return;
      var pr = Math.floor(a * num / den);
      if (keep) Casino.win(pr); else { Casino.win(a + pr); delete B[id]; }
      out.net += pr; out.won.push({ id: id, pr: pr, keep: keep }); out.notes.push(nameOf(id) + ' ' + signed(pr));
      if (!out.top || pr > out.top.pr) out.top = { id: id, pr: pr };
    }
    function L(id) { var a = B[id]; if (!a) return; delete B[id]; out.net -= a; out.lost.push(id); out.notes.push(nameOf(id) + ' ' + signed(-a)); }
    function back(id) { var a = B[id]; if (!a) return; delete B[id]; Casino.win(a); out.notes.push(nameOf(id) + ' returned'); }
    // One-roll bets
    if (B.field) { if ([2, 3, 4, 9, 10, 11, 12].indexOf(t) >= 0) W('field', t === 2 ? 2 : t === 12 ? S.opts.f12 : 1, 1, false); else L('field'); }
    if (B.any7) { if (t === 7) W('any7', 4, 1, false); else L('any7'); }
    if (B.anyCraps) { if (t === 2 || t === 3 || t === 12) W('anyCraps', 7, 1, false); else L('anyCraps'); }
    [['two', 2], ['three', 3], ['yo', 11], ['twelve', 12]].forEach(function (p) { if (B[p[0]]) { if (t === p[1]) W(p[0], PROPS[p[0]][1], 1, false); else L(p[0]); } });
    // Hardways and place bets work only while the point is on
    if (on) {
      [4, 6, 8, 10].forEach(function (n) {
        if (!B['hard' + n]) return;
        if (t === n && hard) { W('hard' + n, HARD[n], 1, true); S.sess.hardHits.push(n); }
        else if (t === 7 || t === n) L('hard' + n);
      });
      BOX.forEach(function (n) { if (B['place' + n]) { if (t === n) W('place' + n, PLACE[n][0], PLACE[n][1], true); else if (t === 7) L('place' + n); } });

      if (B['come' + n]) {
        if (t === n) { W('come' + n, 1, 1, false); if (on) W('comeOdds' + n, TAKE[n][0], TAKE[n][1], false); else back('comeOdds' + n); }
        else if (t === 7) { L('come' + n); if (on) L('comeOdds' + n); else back('comeOdds' + n); }
      }
      if (B['dc' + n]) {
        if (t === 7) { W('dc' + n, 1, 1, false); W('dcOdds' + n, LAY[n][0], LAY[n][1], false); }
        else if (t === n) { L('dc' + n); L('dcOdds' + n); }
      }
    });
    // New come / don't come bets
    if (B.come) {
      if (t === 7 || t === 11) W('come', 1, 1, false);
      else if (t === 2 || t === 3 || t === 12) L('come');
      else { B['come' + t] = (B['come' + t] || 0) + B.come; delete B.come; out.notes.push('Come moves to ' + t); out.moved = true; }
    }
    if (B.dc) {
      if (t === 2 || t === 3) W('dc', 1, 1, false);
      else if (t === 12) out.notes.push("Don't come pushes on 12");
      else if (t === 7 || t === 11) L('dc');
      else { B['dc' + t] = (B['dc' + t] || 0) + B.dc; delete B.dc; out.notes.push("Don't come moves to " + t); out.moved = true; }
    }
    // Line bets and the puck
    var ss = S.sess;
    if (!on) {
      if (t === 7 || t === 11) { W('pass', 1, 1, true); L('dp'); out.head = t === 7 ? 'Seven, winner!' : 'Yo-leven, winner!'; out.kind = 'natural'; ss.naturals++; }
      else if (t === 2 || t === 3 || t === 12) {
        L('pass'); if (t === 12) { if (B.dp) out.notes.push("Don't pass pushes on 12"); } else W('dp', 1, 1, true);
        out.head = t === 2 ? 'Aces. Craps!' : t === 3 ? 'Ace-deuce. Craps!' : 'Boxcars. Craps!'; out.kind = 'craps';
      } else { S.point = t; out.head = 'The point is ' + t; out.kind = 'point'; }
    } else if (t === P) {
      W('pass', 1, 1, true); W('passOdds', TAKE[P][0], TAKE[P][1], false); L('dp'); L('dpOdds');
      S.point = 0; out.head = 'Winner! ' + (hard ? 'Hard ' : '') + t + ', point made'; out.kind = 'made';
      ss.pointsMade++; ss.cur.points++;
    } else if (t === 7) {
      L('pass'); L('passOdds'); W('dp', 1, 1, true); W('dpOdds', LAY[P][0], LAY[P][1], false);

    if (out.net > 0 && (!ss.best || out.net > ss.best.amt)) ss.best = { amt: out.net, t: t, hard: hard, bet: out.top ? nameOf(out.top.id) : '' };
    if (out.kind === 'sevenout') { ss.hands.push(ss.cur); ss.cur = { rolls: 0, points: 0, net: 0 }; }
    S.recent.unshift({ t: t, s: out.kind === 'sevenout' ? 1 : 0, p: out.kind === 'made' ? 1 : 0 });
    // every roll for the history view: two dice and what it did (last 150)
    ss.rl = (ss.rl || '') + d1 + d2 + ({ natural: 'N', craps: 'C', point: 'P', made: 'M', sevenout: 'S' }[out.kind] || '.');
    (ss.rn = ss.rn || []).push(out.net);
    if (ss.rn.length > 150) { ss.rl = ss.rl.slice(-450); ss.rn = ss.rn.slice(-150); }
    if (S.recent.length > 30) S.recent.length = 30;
    S.dice = [d1, d2];
    return out;
  }

  // Dice fly in from the shooter's side, hit the back wall and settle.

  function finishRoll(res, instant) {

  function zoneFor(id) {

  // ── Bet guide (setup option): the smartest bet right now, and the odds behind every bet ──
  // Two dice make 36 combinations; everything below comes from these counts and this table's payouts.
  var WAYS = { 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 8: 5, 9: 4, 10: 3, 11: 2, 12: 1 };
  var PASS_W = 244 / 495, PASS_EDGE = 7 / 495;                          // Pass / Come: 49.29% to win, 1.41%
  var DP_W = 949 / 1980, DP_PUSH = 1 / 36, DP_EDGE = 27 / 1980;         // Don't pass / Don't come (12 pushes): 1.36%
  function before7(n) { return WAYS[n] / (WAYS[n] + 6); }
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function unitOf(r) { return r[1] / gcd(r[0], r[1]); }   // smallest bet that gets paid the full price
  function pc(x, d) { var v = x * 100; return (d == null ? (Math.abs(v - Math.round(v)) < 0.05 ? v.toFixed(0) : v.toFixed(1)) : v.toFixed(d)) + '%'; }
  function dollars(x) { return '$' + Math.abs(x).toFixed(2); }
  function oddsMult() { var o = S.opts.odds; return o === '345' ? { 4: 3, 10: 3, 5: 4, 9: 4, 6: 5, 8: 5 } : { 4: +o, 10: +o, 5: +o, 9: +o, 6: +o, 8: +o }; }
  function oddsLabel() { return S.opts.odds === '345' ? '3-4-5x' : S.opts.odds + 'x'; }
  // One bet on the table: q = chance it wins from here, ev = average result each time it is settled
  // (the house edge times the bet, with this table's rounding of wins down to the dollar)
  function betInfo(id, a) {
    var m, n, q, r, win, full;
    if (id === 'pass' || id === 'come' || (m = /^come(\d+)$/.exec(id))) {
      n = m ? +m[1] : id === 'pass' ? S.point : 0;
      return { q: n ? before7(n) : PASS_W, ev: -PASS_EDGE * a, n: n, line: true };
    }
    if (id === 'dp' || id === 'dc' || (m = /^dc(\d+)$/.exec(id))) {
      n = m ? +m[1] : id === 'dp' ? S.point : 0;
      return { q: n ? 1 - before7(n) : DP_W, push: n ? 0 : DP_PUSH, ev: -DP_EDGE * a, n: n, line: true };
    }
    if ((m = /^(passOdds|comeOdds|dpOdds|dcOdds|place)(\d*)$/.exec(id))) {

    }
    if (id === 'field') return { q: 16 / 36, ev: a * (2 + S.opts.f12 + 14 - 20) / 36, one: true };
    if ((m = /^hard(\d+)$/.exec(id))) { n = +m[1]; q = 1 / (WAYS[n] + 6); return { q: q, ev: q * HARD[n] * a - (1 - q) * a, n: n }; }
    if (PROPS[id]) { q = { any7: 6, anyCraps: 4, two: 1, three: 2, yo: 2, twelve: 1 }[id] / 36; return { q: q, ev: q * PROPS[id][1] * a - (1 - q) * a, one: true }; }

  function tipText() {

    if (P && B.dp && !B.dpOdds) return 'Point ' + P + ': <b>lay odds</b>';

    for (i = 0; i < ids.length; i++) { var inf = betInfo(ids[i], B[ids[i]]); if (shortPaid(inf)) return 'Tip: <b>' + nameOf(ids[i]) + ' in $' + inf.unit + 's</b>'; }
    if (ids.length) { var ev = 0; ids.forEach(function (id) { ev += betInfo(id, B[id]).ev; }); return 'Your bets: avg loss <b>' + dollars(ev) + '</b>'; }

  }
  function paintGuide() {

  function diceChart() {

  }
  function showGuide() {
    var P = S.point, B = S.bets, ids = Object.keys(B), t = total(B), f12 = S.opts.f12, best;
    var mult = oddsMult(), oddsE = 0;
    BOX.forEach(function (n) { oddsE += WAYS[n] / 36 * mult[n]; });   // average odds money per $1 on the line
    var combo = PASS_EDGE / (1 + oddsE);

      var ev = 0, lines = [];

    }
    var fieldEdge = (20 - 16 - 1 - (f12 - 1)) / 36;   // 2 pays double, 12 pays f12
    var moves = [
      { name: 'Odds (take or lay)', value: 0, valueText: '$0.00', bar: !!P, w: P ? before7(P) : null, l: P ? 1 - before7(P) : null, wLabel: 'Take wins', lLabel: 'Lay wins',
        note: 'Behind a Pass, Come, Don’t pass or Don’t come bet that has a number. Pays the true odds: 2 to 1 on 4 and 10, 3 to 2 on 5 and 9, 6 to 5 on 6 and 8 (laying pays the reverse). House edge <b>0%</b>.' + (P ? ' Bar shows the ' + P + '.' : '') },
      { name: 'Pass line + full odds', best: true, value: -10 * combo, bar: false,
        note: 'Your line bet still costs 1.41% of itself; the odds money costs nothing. Spread over all the money at ' + oddsLabel() + ' odds, the house edge is <b>' + pc(combo, 2) + '</b>.' },
      { name: 'Don’t pass · Don’t come', w: DP_W, p: DP_PUSH, l: 1 - DP_W - DP_PUSH, pLabel: 'Push (12)', value: -10 * DP_EDGE,
        note: 'Pays 1 to 1 · wins on 2 or 3, then if a 7 comes before the point · house edge <b>' + pc(DP_EDGE, 2) + '</b>' },
      { name: 'Pass line · Come', w: PASS_W, l: 1 - PASS_W, value: -10 * PASS_EDGE,
        note: 'Pays 1 to 1 · wins on 7 or 11, then if the point comes before a 7 · house edge <b>' + pc(PASS_EDGE, 2) + '</b>' },
      { name: 'Place 6 or 8', w: 5 / 11, l: 6 / 11, value: -10 / 66,
        note: 'Pays 7 to 6 (fair would be 6 to 5) · bet in $6s · house edge <b>1.52%</b>' },
      { name: 'Field', w: 16 / 36, l: 20 / 36, value: -10 * fieldEdge,
        note: 'One roll · pays 1 to 1, double on 2, ' + (f12 === 3 ? 'triple' : 'double') + ' on 12 · misses 5, 6, 7 and 8, which come up 20 times in 36 · house edge <b>' + pc(fieldEdge, 2) + '</b>' },
      { name: 'Place 5 or 9', w: 0.4, l: 0.6, value: -0.4,
        note: 'Pays 7 to 5 (fair would be 3 to 2) · bet in $5s · house edge <b>4.00%</b>' },
      { name: 'Place 4 or 10', w: 1 / 3, l: 2 / 3, value: -10 / 15,
        note: 'Pays 9 to 5 (fair would be 2 to 1) · bet in $5s · house edge <b>6.67%</b>' },
      { name: 'Hard 6 or 8', w: 1 / 11, l: 10 / 11, value: -10 / 11,
        note: 'Pays 9 to 1 (fair would be 10 to 1) · 1 hard way against 5 easy ways and 6 sevens · house edge <b>9.09%</b>' },
      { name: 'Hard 4 or 10', w: 1 / 9, l: 8 / 9, value: -10 / 9,
        note: 'Pays 7 to 1 (fair would be 8 to 1) · house edge <b>11.11%</b>' },
      { name: 'Any craps (2, 3, 12)', w: 4 / 36, l: 32 / 36, value: -10 / 9,
        note: 'One roll · pays 7 to 1 (fair would be 8 to 1) · house edge <b>11.11%</b>' },
      { name: '3 or 11', w: 2 / 36, l: 34 / 36, value: -10 / 9,
        note: 'One roll · pays 15 to 1 (fair would be 17 to 1) · house edge <b>11.11%</b>' },
      { name: '2 or 12', w: 1 / 36, l: 35 / 36, value: -10 * 5 / 36,
        note: 'One roll · pays 30 to 1 (fair would be 35 to 1) · house edge <b>13.89%</b>' },
      { name: 'Any 7', w: 6 / 36, l: 30 / 36, value: -10 / 6,
        note: 'One roll · pays 4 to 1 (fair would be 5 to 1) · house edge <b>16.67%</b>, the worst bet on the table' }
    ];
    moves.sort(function (a, b) { return b.value - a.value; });
    var secs = [];
    if (P) secs.push({ title: 'The point is ' + P, items: [
      'A ' + P + ' comes before a 7 <b>' + pc(before7(P), 1) + '</b> of the time: there ' + (WAYS[P] === 1 ? 'is 1 way' : 'are ' + WAYS[P] + ' ways') + ' to roll a ' + P + ' and 6 ways to roll a 7.',
      'From here, Pass bets win ' + pc(before7(P), 1) + ' and Don’t pass bets win ' + pc(1 - before7(P), 1) + '. Odds on the ' + P + ' pay ' + oddsName(P) + ', exactly what that risk is worth.',
      'Every point: <b>4 or 10</b> 33.3% (odds pay 2 to 1) · <b>5 or 9</b> 40% (3 to 2) · <b>6 or 8</b> 45.5% (6 to 5).'
    ] });
    secs.push({ title: 'The odds bet: no house edge', text: 'It’s the only bet in the casino with no house edge: it pays exactly what the risk is worth. You need a Pass or Come bet first (that part costs 1.41%), but every dollar you add as odds costs nothing on average. So the smart way to bet more is a small line bet with big odds behind it. Just know it makes the swings bigger: more money rides on whether the point comes before a 7.' });
    secs.push({ title: 'How the dice work', text: 'Two dice make <b>36</b> combinations. <b>7</b> is the most common total (6 ways, 1 roll in 6); 2 and 12 are the rarest (1 way each, 1 in 36). Every payout above is set against these counts.', node: diceChart() });
    secs.push({ title: 'Bet sizes that get paid in full', items: [
      'The table rounds wins down to the dollar. A $5 Place 6 pays $5 instead of $5.83, and its house edge jumps from 1.52% to 9.09%.',
      '<b>Place 6 or 8</b>: multiples of $6. <b>Place 4, 5, 9, 10</b>: multiples of $5.',
      '<b>Odds</b>: any amount on 4 and 10, even amounts on 5 and 9, multiples of $5 on 6 and 8.',
      '<b>Laying odds</b>: even amounts on 4 and 10, multiples of $3 on 5 and 9, multiples of $6 on 6 and 8.'
    ] });
    secs.push({ title: 'Good to know', items: [
      '<b>Dice have no memory.</b> A hot or cold table is luck you can only see afterwards. The next roll is always 1 in 6 to be a 7.',
      '<b>Don’t pass</b> costs a hair less than Pass (1.36% vs 1.41%), but you are betting against the shooter. Both are good bets.',
      '<b>The middle of the table</b> (hardways and one-roll bets) pays the most and costs the most: 9% to 17% of every bet.',
      '<b>House edge</b> is the share of a bet the casino keeps on average each time it is settled. The amounts in the list are that, for every $10.'
    ] });
    Coach.sheet({
      title: 'Bet guide',
      best: best,
      movesTitle: 'Every bet, compared',
      intro: 'Best to worst. Bars show the chance each bet wins or loses once it is settled; the amount on the right is the average result for every <b>$10</b> bet.',
      moves: moves,
      sections: secs
    });
  }

  // ── Bankroll & sessions ──────────────────────────────────────────────────
  function brokeSheet() {
    var w = topUp(S ? S.player : 'You');
    Kit.sheet({ title: w.title, html: '<p class="muted">' + Kit.esc(w.body) + '</p>',
      actions: [{ label: w.btn, primary: true, onClick: function () { Casino.reset(); if (S) { if (Casino.mode() === 'link') S.lr = 1; paintBank(); save(); } Kit.toast(w.done); } }, { label: 'Not now', cls: 'btn-ghost' }] });
  }
  function resetBank() {
    if (busy) return;
    var w = topUp(S ? S.player : 'You');
    Kit.confirm(w.ask, { ok: 'Reset', danger: true, body: w.why + ' Your chips on this table are cleared too.' }).then(function (ok) {
      if (!ok) return;
      if (S) { S.bets = {}; S.undo = []; if (Casino.mode() === 'link') S.lr = 1; }
      Casino.reset(); if (S) { save(); paintAll(); hintMsg(); }
      Kit.toast(w.done); Kit.sfx('good');
    });
  }
  function hands(ss) { var h = ss.hands.slice(); if (ss.cur.rolls) h.push(ss.cur); return h; }
  function highlights(ss) {
    var h = [], hs = hands(ss);
    if (ss.best) h.push('Biggest win: ' + signed(ss.best.amt) + ' on a ' + (ss.best.hard ? 'hard ' : '') + ss.best.t + (ss.best.bet && !/^Hard/.test(ss.best.bet) ? ' (' + ss.best.bet + ')' : ''));
    var hot = hs.slice().sort(function (a, b) { return b.rolls - a.rolls; })[0];
    if (hot && hot.rolls >= 6) h.push('Hot roll: ' + hot.rolls + ' rolls' + (hot.points ? ' and ' + hot.points + ' point' + (hot.points === 1 ? '' : 's') + ' made' : '') + ' before the seven-out');
    if (ss.pointsMade) h.push('Made ' + ss.pointsMade + ' point' + (ss.pointsMade === 1 ? '' : 's') + ' in ' + hs.length + ' hand' + (hs.length === 1 ? '' : 's'));
    if (ss.hardHits.length) {
      var c = {}; ss.hardHits.forEach(function (n) { c[n] = (c[n] || 0) + 1; });
      h.push('Hit the ' + Object.keys(c).map(function (n) { return 'hard ' + n + (c[n] > 1 ? ' (' + c[n] + 'x)' : ''); }).join(', '));
    }
    if (ss.hi > ss.startBank) h.push('Bankroll peaked at ' + money(ss.hi));
    h.push(money(ss.wagered) + ' bet over ' + ss.rolls + ' roll' + (ss.rolls === 1 ? '' : 's'));
    return h.slice(0, 6);
  }
  function recordSession(st) {
    var ss = st.sess; if (!ss.rolls && !st.lr) return null;   // (a linked player's bankroll reset is always filed)
    var hs = hands(ss), labels = [], scores = [], step = Math.ceil(hs.length / 30);
    for (var i = 0; i < hs.length; i += step) {
      var sum = 0, rolls = 0; for (var j = i; j < Math.min(hs.length, i + step); j++) { sum += hs[j].net; rolls += hs[j].rolls; }
      labels.push(step === 1 ? 'Hand ' + (i + 1) + ' (' + rolls + ' roll' + (rolls === 1 ? '' : 's') + ')' : 'Hands ' + (i + 1) + '-' + Math.min(hs.length, i + step));
      scores.push([sum]);
    }
    var longest = hs.reduce(function (m, x) { return Math.max(m, x.rolls); }, 0);
    return Kit.record(HKEY, {
      started: ss.started, mode: (st.opts.odds === '345' ? '3-4-5x' : st.opts.odds + 'x') + ' odds',
      players: [{ name: st.player, score: ss.net }], winner: null,
      summary: st.player + ' ' + (ss.net > 0 ? 'up ' + money(ss.net) : ss.net < 0 ? 'down ' + money(-ss.net) : 'broke even') + ' · ' + ss.rolls + ' rolls',
      rounds: { labels: labels, scores: scores }, highlights: highlights(ss),
      meta: casinoMeta({ net: ss.net, rolls: ss.rolls, wagered: ss.wagered, biggest: ss.best ? ss.best.amt : 0, longestHand: longest, pointsMade: ss.pointsMade }),
      detail: playTag({ bank: { s: ss.startBank, e: Casino.balance(), hi: ss.hi }, rolls: ss.rolls, bet: ss.wagered, made: ss.pointsMade, sevens: ss.sevenOuts, nat: ss.naturals,
        r: ss.rl || '', n: ss.rn || [], best: ss.best ? { a: ss.best.amt, t: ss.best.t, h: ss.best.hard ? 1 : 0, b: ss.best.bet } : null })
    });
  }
  function endSession(toSetup) {
    if (busy || !S) { if (!S) showSetup(); return; }
    var ss = S.sess;
    var go = function () {
      var t = total(S.bets); if (t) Casino.win(t);
      var st = S; recordSession(st); clearSave();
      if (toSetup || !ss.rolls) { showSetup(); return; }
      var net = ss.net, hs = hands(ss), longest = hs.reduce(function (m, x) { return Math.max(m, x.rolls); }, 0);
      Kit.win({
        icon: net >= 0 ? 'coins' : 'meh', lose: net < 0,
        title: net > 0 ? 'Up ' + money(net) + '!' : net < 0 ? 'Down ' + money(-net) : 'Broke even',
        sub: ss.rolls + ' rolls · ' + ss.pointsMade + ' point' + (ss.pointsMade === 1 ? '' : 's') + ' made · longest hand ' + longest + ' rolls · ' + bankWords(st.player).replace(/^your /, '') + ' ' + money(Casino.balance()),
        againLabel: 'New session', again: function () { start(st.player, st.opts); },
        extra: [{ label: 'Past sessions', onClick: function () { showSetup(); Kit.history(HKEY, { title: 'Craps: past sessions' }); } }]
      });
      app.innerHTML = ''; rail(false);
    };
    if (!ss.rolls) { go(); return; }
    var held = total(S.bets);
    Kit.confirm(toSetup ? 'End this session?' : 'Cash out?', { ok: toSetup ? 'End session' : 'Cash out', body: 'Your session (' + signed(ss.net) + ' over ' + ss.rolls + ' rolls) is saved to Past sessions.' + (held ? ' The ' + money(held) + ' on the table goes back to ' + bankWords(S.player) + '.' : '') }).then(function (ok) { if (ok) go(); });
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved) {
    S = saved; moneyFor(S.player || 'You');
    if (S.sess.rolls && Date.now() - S.sess.last > 8 * 3600 * 1000 && !S.anim) {
      recordSession(S); S.sess = newSess(); S.recent = []; save();
    }
    render();
  } else showSetup();
  var turned = false;
  window.addEventListener('resize', function () { if (S && R.puck) { if (busy) turned = true; else { paintPuck(); placeDice(false); } } });
  window.addEventListener('pageshow', function () { if (S && R.bal && !busy) paintBank(); });
})();
</script>

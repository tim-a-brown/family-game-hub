<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Craps</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../casino.js"></script>
<script src="../coach.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script>
// The screen's shape as a class on <html> (sh-tall upright; sh-wide an iPad or laptop on its side; sh-side a phone on its side),
// set before the first paint and changed inside a View Transition, so turning the device glides the table and controls to their new places
(function () {
  var R = document.documentElement, cur = '';
  function shape() { var w = innerWidth, h = innerHeight; return w <= h ? 'tall' : h < 560 ? 'side' : w >= 900 ? 'wide' : 'tall'; }
  function set() {
    var s = shape(); if (s === cur) return;
    var go = function () { if (cur) R.classList.remove('sh-' + cur); cur = s; R.classList.add('sh-' + s); window.dispatchEvent(new Event('shape')); };
    if (cur && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden) { try { document.startViewTransition(go); return; } catch (e) {} }
    go();
  }
  set(); addEventListener('resize', set);
})();
</script>
<style>
/* ── Casino chips (local; candidates for the kit) ─────────────────────────
   Standard colours: 1 white, 5 red, 25 green, 100 black, 500 purple. */
.c3{--cs:28px;--c:#c8202f;--s:#fff;--k:#fff;
  position:relative;width:var(--cs);height:var(--cs);border-radius:50%;flex:none;
  display:grid;place-items:center;color:var(--k);font:900 calc(var(--cs) * .36)/1 var(--font);letter-spacing:-.03em;
  background:
    radial-gradient(circle, var(--c) 0 46%, var(--s) 47% 50%, var(--c) 51% 63%, transparent 64%),
    repeating-conic-gradient(from 8deg, var(--s) 0 16deg, var(--c) 16deg 45deg);
  box-shadow:0 calc(var(--cs) * .06) 0 color-mix(in srgb,var(--c) 55%,#000), 0 calc(var(--cs) * .1) calc(var(--cs) * .14) rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.18);}
.c3.d1{--c:#f1ece0;--s:#2f6bd8;--k:#1d2440;}
.c3.d5{--c:#c8202f;--s:#fff;}
.c3.d25{--c:#1d8a4b;--s:#fff;}
.c3.d100{--c:#1b1b22;--s:#e8e2d0;}
.c3.d500{--c:#6a3aa2;--s:#f3d34a;}
.stk{position:absolute;width:var(--cs);height:var(--cs);transform:translate(-50%,-50%);pointer-events:none;z-index:5;transition:opacity .5s, transform .5s var(--ease);}
.stk .c3{position:absolute;left:0;}
.stk .c3:not(:last-child){font-size:0;}
.stk.drop{animation:chipdrop .28s var(--spring);}
@keyframes chipdrop{from{transform:translate(-50%,-90%) scale(1.25);opacity:.4;}to{transform:translate(-50%,-50%);}}
.stk.off .c3{filter:saturate(.35) brightness(.8);}
.stk .tag{position:absolute;left:50%;top:calc(100% + 1px);transform:translateX(-50%);font:800 .56rem/1 var(--font);color:#fff;background:var(--plate-bg);box-shadow:var(--plate-line);padding:2px 5px;border-radius:6px;white-space:nowrap;}
.stk.won .c3:last-child{box-shadow:0 0 0 3px #ffd54a, 0 0 14px rgba(255,213,74,.9);}
.stk.lost{opacity:0;transform:translate(-50%,-220%) scale(.7);}
.paybub{position:absolute;z-index:9;transform:translate(-50%,-50%);white-space:nowrap;padding:2px 7px;border-radius:999px;pointer-events:none;
  background:#ffd54a;color:#3a2600;font:900 .74rem/1.25 var(--font);box-shadow:0 2px 6px rgba(0,0,0,.4);animation:paybub 1.8s var(--ease) forwards;}
@keyframes paybub{0%{opacity:0;margin-top:6px;}15%{opacity:1;margin-top:0;}80%{opacity:1;}100%{opacity:0;margin-top:-14px;}}

.stage.cr{max-width:560px;padding-bottom:calc(var(--rail,150px) + var(--safe-b) + 12px);}
.bank{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;margin-bottom:8px;}
.bank div{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:14px;padding:5px 8px;text-align:center;min-width:0;}
.bank small{display:block;font-size:.74rem;font-weight:600;color:var(--text-2);}
.bank b{display:block;font-size:1.08rem;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;}
.bank .gold{color:var(--lit);} .pos{color:var(--green)!important;} .neg{color:var(--red)!important;}
.msg{min-height:24px;text-align:center;font-weight:800;color:var(--text-2);margin:0 0 8px;font-size:.92rem;line-height:1.3;}
/* a small phone: the money boxes and Cash out give up a little padding and letter spacing so every amount shows whole */
@media (max-width:389px){.bank div{padding:5px 4px;} .bank b{font-size:1rem;} .bank .k-cash.tile{padding:4px 6px;letter-spacing:.04em;}}
.msg b{color:var(--text);}
/* Bet guide: tag under the message line, and the dice chart in its sheet */
.bg-row{display:flex;justify-content:center;min-height:25px;margin:-2px 0 8px;}
.bg-row.hide{visibility:hidden;}
.bg-dice{display:grid;grid-template-columns:auto auto minmax(40px,1fr) auto;gap:5px 10px;align-items:center;font-size:.86rem;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums;}
.bg-dice b{color:var(--text);font-weight:900;text-align:right;}
.bg-dice .bar{height:9px;border-radius:999px;background:var(--w08);overflow:hidden;}
.bg-dice .bar i{display:block;height:100%;border-radius:999px;background:#3ddc84;}
.bg-dice .bar i.s{background:#ff6b78;}
.bg-dice .hd{font-size:.78rem;font-weight:600;color:var(--text-2);}
.bg-dice .hd:first-child{text-align:right;}
.cch-best .bg-note{display:block;margin-top:8px;font-size:.82rem;line-height:1.35;color:var(--text-3);}

/* ── Table ───────────────────────────────────────────────────────────── */
.ctab{border-radius:22px;padding:8px;}
.ctab .felt-in{position:relative;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.zone{position:relative;border:2px solid rgba(255,255,255,.78);border-radius:10px;cursor:pointer;-webkit-user-select:none;user-select:none;
  display:flex;align-items:center;justify-content:center;transition:background .15s, box-shadow .15s;}
.zone:active{background:rgba(255,255,255,.08);}
.zone.lit{box-shadow:0 0 0 3px #ffd54a, inset 0 0 20px rgba(255,213,74,.35);}
.zone.closed{cursor:default;}
.zone.closed > .ztxt{opacity:.4;}
.ztxt{font-family:var(--display);letter-spacing:.06em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);text-transform:uppercase;line-height:1;text-align:center;pointer-events:none;}
.ztxt small{display:block;font-family:var(--font);font-weight:900;font-size:.6rem;letter-spacing:.1em;color:rgba(255,255,255,.75);margin-top:3px;text-shadow:none;}
.a{position:absolute;width:0;height:0;pointer-events:none;}

/* Dice landing area with the rubber back wall */
.dz{position:relative;height:132px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);}
.wall{position:absolute;left:0;right:0;top:0;height:16px;background:
  conic-gradient(from 45deg at 50% 50%, #3b3b42 0 25%, #1f1f25 0 50%, #2c2c33 0 75%, #18181d 0) 0 0/12px 12px;box-shadow:0 2px 6px rgba(0,0,0,.5);}
.dz .state{position:absolute;left:12px;top:22px;max-width:36%;text-align:left;font-family:var(--font);font-weight:750;font-size:1.05rem;line-height:1.15;color:rgba(255,255,255,.5);pointer-events:none;}   /* (top left, clear of where the dice come to rest at the right) */
.dz .state.on{color:rgba(255,236,170,.75);}
.dz .hist{position:absolute;left:52px;right:8px;bottom:6px;display:flex;flex-direction:row-reverse;gap:4px;justify-content:flex-start;pointer-events:none;overflow:hidden;}
.dz .hist span{min-width:22px;height:22px;padding:0 4px;border-radius:6px;display:grid;place-items:center;font:900 .74rem/1 var(--font);color:#fff;background:rgba(0,0,0,.35);}
.dz .hist span.s{background:#a8161f;} .dz .hist span.p{background:#c99a1a;color:#2a1a00;}
.dz .hist span:first-child{box-shadow:0 0 0 2px rgba(255,255,255,.7);}
.dz .die{--ds:44px;position:absolute;left:0;top:0;pointer-events:none;will-change:transform;}

/* Point boxes */
.pts{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.pb{flex-direction:column;justify-content:flex-start;height:108px;border-radius:8px;}
.pb .dcs{align-self:stretch;height:24px;border-bottom:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.18);border-radius:6px 6px 0 0;}
.pb .ztxt{margin-top:6px;font-size:1.45rem;color:#ffe9a6;}
.pb .ztxt.w{font-size:1.02rem;margin-top:10px;margin-bottom:4px;}
.pb .pl{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:900 .5rem/1 var(--font);letter-spacing:.1em;color:rgba(255,255,255,.55);pointer-events:none;}
.pb.pt{background:rgba(255,255,255,.1);}
.puck{position:absolute;z-index:12;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);
  font:900 .66rem/1 var(--font);letter-spacing:.04em;transition:left .55s var(--spring), top .55s var(--spring), background .3s, color .3s;pointer-events:none;
  box-shadow:0 4px 8px rgba(0,0,0,.55), inset 0 -3px 0 rgba(0,0,0,.25), inset 0 0 0 3px rgba(255,255,255,.25);}
.puck.off{background:#16161a;color:#fff;}
.puck.on{background:#f6f2e8;color:#16161a;box-shadow:0 4px 8px rgba(0,0,0,.55), inset 0 -3px 0 rgba(0,0,0,.18), inset 0 0 0 3px rgba(0,0,0,.12);}

.zcome{height:54px;}
.zcome .ztxt{font-size:1.9rem;color:#ff5a5f;}
.row2{display:grid;grid-template-columns:36% 1fr;gap:6px;}
.zdc{height:62px;}
.zdc .ztxt{font-size:.82rem;}
.zfield{height:62px;}
.zfield .ztxt{font-size:1.25rem;color:#ffe9a6;}
.zfield .nums{display:flex;gap:6px;justify-content:center;margin-top:3px;font:400 .95rem/1 var(--display);color:#fff;letter-spacing:0;}
.zfield .nums i{font-style:normal;width:22px;height:22px;border-radius:50%;border:2px solid #ffe9a6;display:inline-grid;place-items:center;margin-top:-3px;}
.zdp{height:44px;}
.zdp .ztxt{font-size:1rem;}
.zpass{height:58px;}
.zpass .ztxt{font-size:1.65rem;}
.oddslbl{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:900 .58rem/1 var(--font);letter-spacing:.12em;color:rgba(255,255,255,.55);pointer-events:none;
  border:1.5px dashed rgba(255,255,255,.45);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;}
.die.md{--ds:17px;padding:2px;border-radius:4px;display:inline-grid;vertical-align:middle;}
.die.md i{width:80%;height:80%;}

/* Proposition bets */
.props{border-radius:12px;padding:8px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px rgba(255,90,95,.55);display:flex;flex-direction:column;gap:5px;}
.props .lbl{font:900 .62rem/1 var(--font);letter-spacing:.14em;color:rgba(255,255,255,.6);text-transform:uppercase;text-align:center;margin:2px 0;}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.pz{height:58px;border-radius:8px;flex-direction:column;gap:4px;border-color:rgba(255,255,255,.6);}
.pz .dd{display:flex;gap:3px;pointer-events:none;}
.pz .ztxt{font-size:.78rem;letter-spacing:.04em;color:#ffe9a6;}
.pz.wide{grid-column:span 4;height:44px;flex-direction:row;gap:10px;}
.pz.wide .ztxt{font-size:1.05rem;}
.pz.wide .ztxt.r{color:#ff6b6f;}

/* Rail */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px calc(12px + var(--corner-x)) calc(var(--safe-b) + 10px + var(--corner-y));border-radius:22px 22px 0 0;}
.rail-in{max-width:560px;margin:0 auto;}
.rail .cz-rack{margin-top:2px;margin-bottom:8px;}
@media (max-height:760px){ .rail .cz-rack{--cs:40px;margin-top:0;margin-bottom:6px;padding:5px 8px 6px;} }
.acts{display:flex;gap:8px;align-items:center;}
.acts .icon-btn{width:52px;height:52px;background:rgba(0,0,0,.28);}
.acts .btn{min-height:52px;}
.acts .roll{flex:1;}
.acts .down{min-width:104px;padding:0 12px;white-space:nowrap;}
.opts{display:flex;flex-direction:column;gap:10px;}

/* ── Wide landscape (iPad, laptop): the table spans the top, dice and proposition bets beside the main layout;
   the rail below holds bankroll and messages on the left, chips and buttons on the right ── */
/* --avh: the height the layout's rows share once the bar, the rail and the wood are taken off */
:is(.sh-wide,.sh-side) .stage.cr{max-width:1180px;padding-top:26px;padding-bottom:calc(var(--rail,150px) + 8px); --avh:calc(100dvh - var(--rail,150px) - var(--bar) - 96px);}
:is(.sh-wide,.sh-side) .ctab .felt-in{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);column-gap:10px;row-gap:6px;align-items:start;}
:is(.sh-wide,.sh-side) .ctab .felt-in > *{grid-column:1;}
:is(.sh-wide,.sh-side) .ctab .felt-in > .dz{grid-column:2;grid-row:1;height:100%;min-height:100px;}
:is(.sh-wide,.sh-side) .ctab .felt-in > .props{grid-column:2;grid-row:2 / span 4;align-self:stretch;justify-content:space-between;}
:is(.sh-wide,.sh-side) .pb{height:clamp(116px,calc(var(--avh) * .34),240px);}
:is(.sh-wide,.sh-side) .zcome{height:clamp(58px,calc(var(--avh) * .17),120px);}
:is(.sh-wide,.sh-side) .zdc,:is(.sh-wide,.sh-side) .zfield{height:clamp(62px,calc(var(--avh) * .18),126px);}
:is(.sh-wide,.sh-side) .zdp{height:clamp(44px,calc(var(--avh) * .13),90px);}
:is(.sh-wide,.sh-side) .zpass{height:clamp(62px,calc(var(--avh) * .18),126px);}
:is(.sh-wide,.sh-side) .pz{height:clamp(48px,calc(var(--avh) * .13),92px);gap:3px;}
:is(.sh-wide,.sh-side) .pz.wide{height:clamp(38px,calc(var(--avh) * .1),70px);}
:is(.sh-wide,.sh-side) .props .lbl{margin:0;}
:is(.sh-wide,.sh-side) .rail-in{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);grid-template-areas:"info rack" "info acts";column-gap:28px;align-items:center;}
:is(.sh-wide,.sh-side) .rail-in > .cinfo{grid-area:info;min-width:0;}
:is(.sh-wide,.sh-side) .rail-in > .cz-rack{grid-area:rack;}
:is(.sh-wide,.sh-side) .rail-in > .acts{grid-area:acts;}
:is(.sh-wide,.sh-side) .cinfo .bank{max-width:460px;margin-bottom:6px;}
:is(.sh-wide,.sh-side) .cinfo .bank div{background:rgba(0,0,0,.26);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);}
:is(.sh-wide,.sh-side) .cinfo .msg{text-align:left;margin:0;min-height:0;color:rgba(255,255,255,.88);}
:is(.sh-wide,.sh-side) .cinfo .bg-row{justify-content:flex-start;margin:6px 0 0;}
/* iPad upright: the proposition bets beside the main layout, as on its side, so the whole table shows over the rail */
@media (min-width:700px){
.sh-tall .stage.cr{max-width:760px;--avh:calc(100dvh - var(--rail,150px) - var(--bar) - 196px);}
.sh-tall .ctab .felt-in{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);column-gap:10px;row-gap:6px;align-items:start;}
.sh-tall .ctab .felt-in > *{grid-column:1;}
.sh-tall .ctab .felt-in > .dz{grid-column:2;grid-row:1;height:100%;min-height:100px;}
.sh-tall .ctab .felt-in > .props{grid-column:2;grid-row:2 / span 4;align-self:stretch;justify-content:space-between;}
.sh-tall .pb{height:clamp(116px,calc(var(--avh) * .34),240px);}
.sh-tall .zcome{height:clamp(58px,calc(var(--avh) * .17),120px);}
.sh-tall .zdc,.sh-tall .zfield{height:clamp(62px,calc(var(--avh) * .18),126px);}
.sh-tall .zdp{height:clamp(44px,calc(var(--avh) * .13),90px);}
.sh-tall .zpass{height:clamp(62px,calc(var(--avh) * .18),126px);}
.sh-tall .pz{height:clamp(48px,calc(var(--avh) * .13),92px);gap:3px;}
.sh-tall .pz.wide{height:clamp(38px,calc(var(--avh) * .1),70px);}
.sh-tall .props .lbl{margin:0;}
}
/* a phone on its side: the table the screen's height at the left; the rail stands at the right, the money and what
   happened over the chips and buttons (where you act on the right) */
.sh-side{--railw:280px;}
.sh-side .stage.cr{max-width:none;padding:2px calc(var(--railw) + 14px) 10px max(env(safe-area-inset-left),16px);--avh:calc(100dvh - var(--bar) - 66px);}
.sh-side .ctab .felt-in{padding:6px;column-gap:8px;row-gap:4px;}
.sh-side .pb{height:clamp(56px,calc(var(--avh) * .3),120px);}
.sh-side .zcome{height:clamp(30px,calc(var(--avh) * .14),70px);}
.sh-side .zdc,.sh-side .zfield{height:clamp(34px,calc(var(--avh) * .16),72px);}
.sh-side .zdp{height:clamp(24px,calc(var(--avh) * .1),50px);}
.sh-side .zpass{height:clamp(34px,calc(var(--avh) * .16),72px);}
.sh-side .pz{height:clamp(30px,calc(var(--avh) * .14),60px);}
.sh-side .pz.wide{height:clamp(24px,calc(var(--avh) * .1),44px);}
.sh-side .rail{left:auto;top:var(--bar);width:var(--railw);box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;border-radius:22px 0 0 22px;
  padding:10px max(env(safe-area-inset-right),16px) max(calc(var(--safe-b) + 10px),18px) 12px;}
.sh-side .rail-in{display:flex;flex-direction:column;gap:8px;max-width:none;width:100%;}
.sh-side .rail .cz-rack{--cs:36px;margin:0;gap:4px;padding:5px 6px 6px;min-width:0;}
.sh-side .cinfo .bank{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:4px;}
.sh-side .cinfo .bank .k-cash{grid-column:1 / -1;}
.sh-side .cinfo .bank div{padding:4px 5px;} .sh-side .cinfo .bank b{font-size:.92rem;} .sh-side .cinfo .bank small{font-size:.68rem;}
.sh-side .cinfo .msg{font-size:.82rem;line-height:1.25;}
.sh-side .acts .icon-btn{width:46px;height:46px;} .sh-side .acts .btn{min-height:46px;} .sh-side .acts{display:grid;grid-template-columns:46px minmax(0,1fr) minmax(0,1fr);} .sh-side .acts .down{min-width:0;padding:0 8px;font-size:.92rem;} .sh-side .acts .down .ico{display:none;} .sh-side .acts .roll{min-width:0;}
/* the pieces that glide to their new places when the device turns */
.stage.cr > .ctab{view-transition-name:cr-table;} .rail{view-transition-name:cr-rail;}
.czlk{display:inline-grid;place-items:center;width:1.3em;height:1.3em;margin-right:4px;border-radius:50%;background:#5b8cff;color:#fff;vertical-align:-.3em;}
.czlk.pl{background:#8b6cf0;}
.czlk .ico{width:.85em!important;height:.85em!important;color:#fff!important;stroke-width:3;}

/* ══════════════════════════════════════════════════════════════════════════════════════════════════════════════════
   LARGE WINDOWS (html.cr-big, set by the script's bigLay): a laptop or desktop window of any shape. The page never
   scrolls: bigPlan gives the table, the room and the betting station each a box worked out from the window.
   The table is the hero, laid across the window; what is printed on the felt, the chips and the dice take their size
   from it (--u). The room holds the rolls as dice, the session and, online, everyone at the table; the station (money,
   what happened, your bets with what each pays, chips, the buttons) stands at the right, or is a dock under a narrow
   window. Phones and the iPad keep the layouts above exactly as they were (deviceShape in the script).
   ══════════════════════════════════════════════════════════════════════════════════════════════════════════════════ */
.rm,.myb{display:none;}
html.cr-big,html.cr-big body{overflow:hidden;overscroll-behavior:none;}
html.cr-big .stage.cr.cr{position:fixed;left:0;right:0;bottom:0;top:var(--cbt,58px);max-width:none;margin:0;padding:0;}
html.cr-big .stage.cr > .ctab{position:absolute;box-sizing:border-box;margin:0;padding:var(--wd,8px);border-radius:calc(var(--wd,8px) * 2.7);}
html.cr-big .ctab .felt-in.felt-in{height:100%;box-sizing:border-box;padding:var(--fp,8px);border-radius:calc(var(--wd,8px) * 2);display:grid;gap:var(--fg,6px);align-items:stretch;align-content:stretch;}
html.cr-big .ctab .felt-in > *{grid-column:auto;grid-row:auto;}

  // ── Betting ──────────────────────────────────────────────────────────────
  function flash(bet) { var z = R.zones[bet]; if (!z) return; z.classList.add('lit'); setTimeout(function () { z.classList.remove('lit'); }, 380); }
  function tapZone(bet) {
    if (busy) return false;

    if (m) return tapBox(+m[1]);
    if (bet === 'pass') {
      if (S.point) { if (S.bets.pass) return addBet('passOdds', 'pass'); return deny('Pass line bets go down on the come-out roll. Try a Come bet now.'); }
      return addBet('pass');
    }
    if (bet === 'dp') {

    }
    if (bet === 'come' || bet === 'dc') { if (!S.point) return deny((bet === 'come' ? 'Come' : "Don't come") + ' bets open once a point is set. On the come-out, use the ' + (bet === 'come' ? 'Pass line' : "Don't pass") + '.'); return addBet(bet); }
    return addBet(bet);
  }
  function tapBox(n) {
    var opts = [];
    if (S.bets['come' + n]) opts.push({ id: 'comeOdds' + n, zone: 'box' + n, label: 'Odds on your Come ' + n + ' (pays ' + oddsName(n) + ')' });
    if (S.bets['dc' + n]) opts.push({ id: 'dcOdds' + n, zone: 'box' + n, label: "Lay odds on your Don't come " + n });
    if (!opts.length) return addBet('place' + n, 'box' + n);
    opts.push({ id: 'place' + n, zone: 'box' + n, label: 'Place the ' + n + ' (pays ' + PLACE[n][0] + ' to ' + PLACE[n][1] + ')' });
    var s = Kit.sheet({ title: money(chipV) + ' on the ' + n, actions: opts.map(function (o, i) { return { label: o.label, primary: i === 0, onClick: function () { addBet(o.id, o.zone); } }; }).concat([{ label: 'Cancel', cls: 'btn-ghost' }]) });
    return s;
  }
  function deny(msg) { Kit.sfx('bad'); Kit.haptic('error'); Kit.toast(msg, 2600); return false; }
  function addBet(id, zoneId) {
    var v = chipV, m;
    // Odds limits
    if ((m = /^(passOdds|dpOdds|comeOdds|dcOdds)(\d*)$/.exec(id))) {
      var n = m[2] ? +m[2] : S.point, flatId = { passOdds: 'pass', dpOdds: 'dp', comeOdds: 'come' + n, dcOdds: 'dc' + n }[m[1]];
      var lay = m[1] === 'dpOdds' || m[1] === 'dcOdds';
      var max = lay ? layMax(n, S.bets[flatId]) : oddsMax(n, S.bets[flatId]);
      var room = max - (S.bets[id] || 0);
      if (room <= 0) return deny('That is the most odds allowed (' + money(max) + ')');
      if (v > room) { v = room; Kit.toast('Odds topped up to the ' + money(max) + ' limit'); }
    }
    if (Casino.balance() < v) {
      if (Casino.balance() < 1 && !total(S.bets)) { brokeSheet(); return false; }
      return deny('Not enough money for that chip');
    }
    Casino.bet(v);
    S.bets[id] = (S.bets[id] || 0) + v; S.undo.push({ id: id, v: v });
    S.sess.wagered += v;
    Kit.sfx('chip'); Kit.haptic('light');
    flash(zoneId || id);
    paintAll(id); save();
    var t = S.bets[id];
    R.msg.innerHTML = money(t) + ' on <b>' + nameOf(id) + '</b>' + (working(id) ? '' : ', off until the point is set');
    return true;
  }
  function undoChip() {
    if (busy || !S) return;

    S.bets[u.id] -= u.v; if (S.bets[u.id] <= 0) delete S.bets[u.id];
    Casino.win(u.v); S.sess.wagered -= u.v;

  }
  // Bets the player may pick up: everything except contract bets
  // (a Pass line bet once the point is on, and Come bets that moved to a number).
  function removable() {
    return Object.keys(S.bets).filter(function (id) {
      if (id === 'pass' && S.point) return false;

    });
  }
  function takeDown() {
    if (busy) return;

    var t = 0; ids.forEach(function (id) { t += S.bets[id]; delete S.bets[id]; });
    Casino.win(t); S.undo = [];
    Kit.sfx('whoosh'); Kit.haptic('light'); paintAll(); save();

  }

  // ── Rolling ──────────────────────────────────────────────────────────────
  function roll() {
    if (busy) return;
    if (NET) { netBet(); return; }
    if (!total(S.bets)) { Kit.toast('Put a chip on the Pass line first'); Kit.sfx('bad'); flash('pass'); return; }
    var d = DEMO_DICE.length ? DEMO_DICE.shift() : [1 + rnd(6), 1 + rnd(6)];   // (a demo's rolls, __cr.dice)
    var res = resolve(d[0], d[1]);   // money moves now; the dice reveal it
    S.anim = res; S.undo = []; save();
    busy = true; paintBank();
    Kit.sfx('roll'); Kit.haptic('medium');
    var top = R.dz.getBoundingClientRect().top;
    if (!BIG && (top < 60 || top > window.innerHeight * 0.5)) window.scrollTo({ top: Math.max(0, window.scrollY + top - 70), behavior: 'smooth' });
    tumble(d, function () { finishRoll(res, false); });

  // Settle every bet for a roll of d1 + d2. Returns what happened.
  function resolve(d1, d2) {
    var t = d1 + d2, hard = d1 === d2 && t > 2 && t < 12, P = S.point, on = P > 0, B = S.bets;
    var out = { d: [d1, d2], t: t, hard: hard, net: 0, won: [], lost: [], notes: [], head: '', kind: '', top: null, pointBefore: P };
    function W(id, num, den, keep) {
      var a = B[id]; if (!a) return;
      var pr = Math.floor(a * num / den);
      if (keep) Casino.win(pr); else { Casino.win(a + pr); delete B[id]; }
      out.net += pr; out.won.push({ id: id, pr: pr, keep: keep }); out.notes.push(nameOf(id) + ' ' + signed(pr));
      if (!out.top || pr > out.top.pr) out.top = { id: id, pr: pr };
    }
    function L(id) { var a = B[id]; if (!a) return; delete B[id]; out.net -= a; out.lost.push(id); out.notes.push(nameOf(id) + ' ' + signed(-a)); }
    function back(id) { var a = B[id]; if (!a) return; delete B[id]; Casino.win(a); out.notes.push(nameOf(id) + ' returned'); }
    // One-roll bets
    if (B.field) { if ([2, 3, 4, 9, 10, 11, 12].indexOf(t) >= 0) W('field', t === 2 ? 2 : t === 12 ? S.opts.f12 : 1, 1, false); else L('field'); }
    if (B.any7) { if (t === 7) W('any7', 4, 1, false); else L('any7'); }
    if (B.anyCraps) { if (t === 2 || t === 3 || t === 12) W('anyCraps', 7, 1, false); else L('anyCraps'); }
    [['two', 2], ['three', 3], ['yo', 11], ['twelve', 12]].forEach(function (p) { if (B[p[0]]) { if (t === p[1]) W(p[0], PROPS[p[0]][1], 1, false); else L(p[0]); } });
    // Hardways and place bets work only while the point is on
    if (on) {
      [4, 6, 8, 10].forEach(function (n) {
        if (!B['hard' + n]) return;
        if (t === n && hard) { W('hard' + n, HARD[n], 1, true); S.sess.hardHits.push(n); }
        else if (t === 7 || t === n) L('hard' + n);
      });
      BOX.forEach(function (n) { if (B['place' + n]) { if (t === n) W('place' + n, PLACE[n][0], PLACE[n][1], true); else if (t === 7) L('place' + n); } });
    }
    // Come / don't come bets already on numbers
    BOX.forEach(function (n) {
      if (B['come' + n]) {
        if (t === n) { W('come' + n, 1, 1, false); if (on) W('comeOdds' + n, TAKE[n][0], TAKE[n][1], false); else back('comeOdds' + n); }
        else if (t === 7) { L('come' + n); if (on) L('comeOdds' + n); else back('comeOdds' + n); }
      }
      if (B['dc' + n]) {
        if (t === 7) { W('dc' + n, 1, 1, false); W('dcOdds' + n, LAY[n][0], LAY[n][1], false); }
        else if (t === n) { L('dc' + n); L('dcOdds' + n); }
      }
    });
    // New come / don't come bets
    if (B.come) {
      if (t === 7 || t === 11) W('come', 1, 1, false);
      else if (t === 2 || t === 3 || t === 12) L('come');
      else { B['come' + t] = (B['come' + t] || 0) + B.come; delete B.come; out.notes.push('Come moves to ' + t); out.moved = true; }
    }
    if (B.dc) {
      if (t === 2 || t === 3) W('dc', 1, 1, false);
      else if (t === 12) out.notes.push("Don't come pushes on 12");
      else if (t === 7 || t === 11) L('dc');
      else { B['dc' + t] = (B['dc' + t] || 0) + B.dc; delete B.dc; out.notes.push("Don't come moves to " + t); out.moved = true; }
    }
    // Line bets and the puck
    var ss = S.sess;
    if (!on) {
      if (t === 7 || t === 11) { W('pass', 1, 1, true); L('dp'); out.head = t === 7 ? 'Seven, winner!' : 'Yo-leven, winner!'; out.kind = 'natural'; ss.naturals++; }
      else if (t === 2 || t === 3 || t === 12) {
        L('pass'); if (t === 12) { if (B.dp) out.notes.push("Don't pass pushes on 12"); } else W('dp', 1, 1, true);
        out.head = t === 2 ? 'Aces. Craps!' : t === 3 ? 'Ace-deuce. Craps!' : 'Boxcars. Craps!'; out.kind = 'craps';
      } else { S.point = t; out.head = 'The point is ' + t; out.kind = 'point'; }
    } else if (t === P) {

      S.point = 0; out.head = 'Winner! ' + (hard ? 'Hard ' : '') + t + ', point made'; out.kind = 'made';
      ss.pointsMade++; ss.cur.points++;
    } else if (t === 7) {
      L('pass'); L('passOdds'); W('dp', 1, 1, true); W('dpOdds', LAY[P][0], LAY[P][1], false);
      S.point = 0; out.head = 'Seven out'; out.kind = 'sevenout'; ss.sevenOuts++;
    } else {

    }
    // Session bookkeeping
    ss.rolls++; ss.last = Date.now(); ss.net += out.net; ss.cur.rolls++; ss.cur.net += out.net;
    ss.hi = Math.max(ss.hi || 0, Casino.balance() + total(B));
    if (out.net > 0 && (!ss.best || out.net > ss.best.amt)) ss.best = { amt: out.net, t: t, hard: hard, bet: out.top ? nameOf(out.top.id) : '', d: '' + d1 + d2, no: ss.rolls };
    if (out.kind === 'sevenout') { ss.hands.push(ss.cur); ss.cur = { rolls: 0, points: 0, net: 0 }; }
    S.recent.unshift({ t: t, s: out.kind === 'sevenout' ? 1 : 0, p: out.kind === 'made' ? 1 : 0 });
    // every roll for the history view: two dice and what it did (last 150)
    ss.rl = (ss.rl || '') + d1 + d2 + ({ natural: 'N', craps: 'C', point: 'P', made: 'M', sevenout: 'S' }[out.kind] || '.');
    (ss.rn = ss.rn || []).push(out.net);

    if (S.recent.length > 30) S.recent.length = 30;
    S.dice = [d1, d2];
    return out;
  }

  // Dice fly in from the shooter's side, hit the back wall and settle.
  var tumbleT = null;
  function placeDice(random) {
    var W = R.dz.clientWidth, H = R.dz.clientHeight;
    var pos = random ? null : [[W * 0.6, H * 0.54], [W * 0.78, H * 0.46]];
    var h = DS() / 2;
    [R.d1, R.d2].forEach(function (d, i) { var p = pos[i]; d.style.transform = 'translate(' + (p[0] - h) + 'px,' + (p[1] - h) + 'px) rotate(' + (i ? 12 : -8) + 'deg)'; });
  }
  function tumble(d, done) {
    var W = R.dz.clientWidth, H = R.dz.clientHeight, ds = DS(), k = ds / 44;
    var ends = [[W * (0.5 + Math.random() * 0.12), 40 * k + Math.random() * (H - 96 * k)], [W * (0.72 + Math.random() * 0.12), 40 * k + Math.random() * (H - 96 * k)]];   // (the right of the box: the come-out or point words are at the left)
    var faces = setInterval(function () { R.d1.dataset.v = 1 + rnd(6); R.d2.dataset.v = 1 + rnd(6); }, 70);
    var anims = [R.d1, R.d2].map(function (die, i) {
      var e = ends[i], sx = W + (30 + i * 30) * k, sy = H - (20 + i * 16) * k, wallX = W * (0.35 + Math.random() * 0.35), r0 = Math.random() * 360;
      var spin = (Math.random() < 0.5 ? -1 : 1) * (540 + Math.random() * 360);
      var kf = [
        { transform: 'translate(' + (sx - ds / 2) + 'px,' + (sy - ds / 2) + 'px) rotate(' + r0 + 'deg) scale(1.15)', offset: 0 },
        { transform: 'translate(' + (wallX - ds / 2) + 'px,' + (18 * k - ds / 2 + 22 * k) + 'px) rotate(' + (r0 + spin * 0.6) + 'deg) scale(1.05)', offset: 0.45 },
        { transform: 'translate(' + ((wallX + e[0]) / 2 - ds / 2) + 'px,' + (e[1] + 10 * k - ds / 2) + 'px) rotate(' + (r0 + spin * 0.88) + 'deg) scale(1)', offset: 0.75 },
        { transform: 'translate(' + (e[0] - ds / 2) + 'px,' + (e[1] - ds / 2) + 'px) rotate(' + ((i ? 1 : -1) * (6 + Math.random() * 14)) + 'deg) scale(1)', offset: 1 }
      ];
      if (!die.animate) { die.style.transform = kf[3].transform; return null; }
      return die.animate(kf, { duration: 950 + i * 90, easing: 'cubic-bezier(.25,.7,.35,1)', fill: 'forwards' });
    });
    setTimeout(function () { Kit.sfx('flip'); }, 430);
    clearTimeout(tumbleT);
    tumbleT = setTimeout(function () {
      clearInterval(faces);
      R.d1.dataset.v = d[0]; R.d2.dataset.v = d[1];
      [R.d1, R.d2].forEach(function (die, i) { die.style.transform = 'translate(' + (ends[i][0] - ds / 2) + 'px,' + (ends[i][1] - ds / 2) + 'px) rotate(' + (i ? 9 : -7) + 'deg)'; });
      anims.forEach(function (a) { if (a) try { a.cancel(); } catch (e) {} });
      Kit.sfx('tap'); Kit.haptic('light');
      done();
    }, 1080);
  }

  function finishRoll(res, instant) {
    busy = false;
    S.anim = null; save();
    R.d1.dataset.v = res.d[0]; R.d2.dataset.v = res.d[1];
    if (turned) { turned = false; placeDice(false); }   // turned mid-roll: the dice landed in the old box
    // Pay bubbles over winning bets (before repainting the stacks)
    res.won.forEach(function (w) {
      var a = R.anchors[w.id] || R.anchors[w.id.replace(/Odds/, '')]; if (!a) return;
      var r = a.getBoundingClientRect(), f = R.felt.getBoundingClientRect();
      var b = el('div', { class: 'paybub', text: '+' + money(w.pr) });
      b.style.left = (r.left - f.left) + 'px'; b.style.top = (r.top - f.top - 18) + 'px';
      R.felt.appendChild(b); setTimeout(function () { b.remove(); }, 1900);
    });
    res.won.forEach(function (w) { var z = zoneFor(w.id); if (z) { z.classList.add('lit'); setTimeout(function () { z.classList.remove('lit'); }, 900); } });
    // Losing chips get swept away, then the table is redrawn
    var swept = 0;
    res.lost.forEach(function (id) { var a = R.anchors[id], st = a && a.firstChild; if (st && !instant) { st.classList.add('lost'); swept++; } });
    paintBank(); paintPuck(); paintState();
    if (swept) setTimeout(function () { if (!busy) paintStacks(); }, 480); else paintStacks();
    var net = res.net;
    var line = '<b>' + res.d[0] + ' + ' + res.d[1] + ' = ' + res.t + '</b><span class="k-fact">' + res.head + '</span>';   // (the roll, then what it means and what it paid, a line each)
    if (res.won.length || res.lost.length) line += '<span class="k-fact">' + (net > 0 ? 'Won ' + money(net) : net < 0 ? 'Lost ' + money(-net) : 'Even') + '</span>';
    R.msg.innerHTML = line;
    if (instant) return;
    var hardHit = res.won.some(function (w) { return /^hard/.test(w.id); });
    if (res.kind === 'sevenout') { Kit.callout('Seven out', '#ff6b6f'); Kit.sfx(net > 0 ? 'good' : 'lose'); Kit.haptic('error'); }
    else if (res.kind === 'made' && S.sess.cur.points >= 3) {
      // a hot hand: the third point made (and every one after) before the seven-out
      var pm = S.sess.cur.points;
      Kit.moment({ chip: String(pm), title: pm >= 5 ? 'A monster roll' : 'A hot roll', line: 'The shooter has made ' + pm + ' points in this hand without sevening out.', pts: net > 0 ? signed(net) : '', big: pm >= 5, at: R.felt });
      Kit.sfx('win'); Kit.haptic('success'); Kit.confetti({ count: pm >= 5 ? 180 : 100 });
    }
    else if (res.kind === 'made') { Kit.callout('Winner!'); Kit.sfx('win'); Kit.haptic('success'); if (net >= 50) Kit.confetti({ count: 100 }); }
    else if (hardHit) {
      var hw = res.won.filter(function (w) { return /^hard/.test(w.id); })[0];
      Kit.moment({ chip: 'Hard ' + res.t, title: 'The hard ' + res.t, line: S.player + ' hit the hard ' + res.t + ', two ' + (res.t === 6 ? 'threes' : res.t === 4 ? 'twos' : res.t === 8 ? 'fours' : 'fives') + ', and it paid ' + (res.t === 4 || res.t === 10 ? '7' : '9') + ' to 1.',
        pts: hw ? '+' + money(hw.pr) : '', at: R.felt });
      Kit.sfx('win'); Kit.haptic('success'); Kit.confetti({ count: 80 });

  function paintMyBets(M) {
    var b = R.myb; if (!b) return;
    b.classList.remove('gone'); b.innerHTML = ''; R.mybOn = false;
    if (BIG.dock) return;
    b.appendChild(el('h4', null, [el('span', { text: 'Your bets' }), el('b', { text: money(M.total) })]));
    var rows = el('div', { class: 'rows' }), list = betRows(M); rows.appendChild(list); b.appendChild(rows);
    if (!M.bets.length) { rows.appendChild(el('div', { class: 'none', text: 'No chips on the table' })); rows.style.display = 'flex'; }
    if (b.offsetHeight < 150) { b.classList.add('gone'); return; }
    R.mybOn = true; snapRows(list, rows.clientHeight);
  }
  function betsPanel(M) {
    var list = betRows(M), wrap = el('div', { class: 'fill', style: { display: 'flex', 'flex-direction': 'column', overflow: 'hidden' } }, [list]);
    if (!M.bets.length) wrap.appendChild(el('div', { class: 'none', text: 'No chips on the table' }));
    var p = el('div', { class: 'pn pn-bets' }, [el('h4', null, [el('span', { text: 'Your bets' }), el('b', { text: money(M.total) })]), wrap]);
    p._fill = function () { snapRows(list, wrap.clientHeight); };
    return p;
  }
  function die(v) { var d = el('span', { class: 'die', 'data-v': v }); for (var i = 0; i < 9; i++) d.appendChild(document.createElement('i')); return d; }
  var KIND = { N: 'Natural', C: 'Craps', P: 'Point', M: 'Made', S: 'Seven out' };
  function rollsPanel(M) {
    var on = M.point > 0, c = M.cur, who = '';
    if (NET && M.players && M.players[M.shooter]) who = M.shooter === M.me ? 'You are the shooter. ' : M.players[M.shooter].name + ' is the shooter. ';
    var sub = who + (c.rolls ? c.rolls + (c.rolls === 1 ? ' roll' : ' rolls') + ' in this hand' + (c.points ? ', and ' + c.points + (c.points === 1 ? ' point' : ' points') + ' made' : '') : 'A new hand starts with this roll');
    var grid = el('div', { class: 'rolls fill' });
    var p = el('div', { class: 'pn w2 pn-rolls' }, [el('div', { class: 'sh-top' }, [el('div', { class: 'pk ' + (on ? 'on' : 'off'), text: on ? 'ON' : 'OFF' }),
      el('div', { class: 'tx' + (on ? ' on' : '') }, [el('b', { text: on ? 'The point is ' + M.point : 'Come-out roll' }), el('span', { text: sub })])]), grid]);
    p._fill = function () {
      var bw = Math.floor(grid.getBoundingClientRect().width) - 1, bh = grid.clientHeight, n = M.rolls.length, g = 8, d, tw, th, cap = 0, pu = BIG.pu;
      if (!n) { grid.appendChild(el('div', { class: 'none', text: 'No rolls yet' })); grid.style.display = 'flex'; return; }
      for (d = Math.round(40 * pu); ; d -= 2) {
        tw = d * 2 + 3 + Math.round(d * 1.35) + 16; if (tw < 96) tw = 96; th = d + 12 + Math.max(11, Math.round(d * 0.42)) + 4;
        cap = Math.floor((bw + g) / (tw + g)) * Math.floor((bh + g) / (th + g));
        if (cap >= Math.min(n, 10) || d <= 20) break;
      }
      if (cap < 1) { p.classList.add('bare'); return; }
      var cols = Math.max(1, Math.floor((bw + g) / (tw + g))); tw = Math.floor((bw - (cols - 1) * g) / cols);
      grid.style.setProperty('--rd', d + 'px'); grid.style.setProperty('--rw', tw + 'px'); grid.style.setProperty('--rh', th + 'px'); grid.style.setProperty('--rg', g + 'px');
      M.rolls.slice(-cap).forEach(function (r, i, arr) {
        var t = r.t || r.a + r.b, it = el('div', { class: 'ri k' + (r.k === '.' ? 'x' : r.k) + (r.h < M.hand ? ' old' : '') + (i === arr.length - 1 ? ' now' : '') + (r.t ? ' tot' : ''), title: KIND[r.k] || '' });
        it.appendChild(el('div', { class: 'dd' }, r.t ? [el('b', { text: String(t) })] : [die(r.a), die(r.b), el('b', { text: String(t) })]));
        var cap2 = el('small', { text: KIND[r.k] || '' });
        if (r.net) cap2.appendChild(el('i', { class: r.net > 0 ? 'pos' : 'neg', text: (KIND[r.k] ? ' ' : '') + signed(r.net) }));
        if (!cap2.textContent) cap2.textContent = '\u00a0';
        it.appendChild(cap2);
        grid.appendChild(it);
      });
    };
    return p;
  }
  function sessPanel(M) {
    var stats = el('div', { class: 'stats' }), rest = el('div', { class: 'fill', style: { display: 'flex', 'flex-direction': 'column' } });
    M.stats.forEach(function (s) { stats.appendChild(el('div', null, [el('small', { text: s[0] }), el('b', { text: s[1] })])); });
    var p = el('div', { class: 'pn pn-sess' }, [el('h4', null, [el('span', { text: 'This session' }), el('b', { class: M.net > 0 ? 'pos' : M.net < 0 ? 'neg' : '', text: signed(M.net) })]), stats, rest]);
    p._fill = function () {
      // the tiles that fit whole; then, with the height left, how often each total came up and the money roll by roll
      var kids = [].slice.call(stats.children), ph = p.clientHeight - stats.offsetTop - 14, i;
      for (i = kids.length - 1; i > 0 && stats.offsetHeight > ph; i--) kids[i].remove();
      if (stats.offsetHeight > ph) { stats.style.display = 'none'; }
      var room = rest.clientHeight, rolls = M.rolls.filter(function (r) { return !r.t; });
      if (room < 124 || rolls.length < 2) return;
      var both = room >= 280;
      var cnt = {}, mx = 1, last = rolls[rolls.length - 1], t;
      rolls.forEach(function (r) { t = r.a + r.b; cnt[t] = (cnt[t] || 0) + 1; if (cnt[t] > mx) mx = cnt[t]; });
      var bars = el('div', { class: 'bars' }), ax = el('div', { class: 'ax' });
      for (t = 2; t <= 12; t++) {
        var now = t === last.a + last.b;
        bars.appendChild(el('div', { class: 'bc' + (t === 7 ? ' s' : '') + (now ? ' now' : '') }, [el('em', { text: cnt[t] ? String(cnt[t]) : '' }), el('i', { style: { height: Math.round((cnt[t] || 0) / mx * 78) + '%' } })]));
        ax.appendChild(el('span', { class: now ? 'now' : '', text: String(t) }));
      }
      rest.appendChild(el('div', { class: 'tots' }, [el('h4', null, [el('span', { text: 'Totals rolled' })]), bars, ax]));
      if (!both) return;
      var cum = [0], lo = 0, hi = 0, s = 0; M.rolls.forEach(function (r) { s += r.net; cum.push(s); if (s < lo) lo = s; if (s > hi) hi = s; });
      var span = Math.max(1, hi - lo), X = function (j) { return (j / (cum.length - 1) * 100).toFixed(2); }, Y = function (v) { return (4 + (hi - v) / span * 32).toFixed(2); };
      var pts = cum.map(function (v, j) { return X(j) + ',' + Y(v); }).join(' '), col = s > 0 ? '#3ddc84' : s < 0 ? '#ff6b78' : '#c9c1e6';
      var sp = el('div', { class: 'spark' }, [el('h4', null, [el('span', { text: 'Won and lost, roll by roll' })])]);
      sp.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="100" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="rgba(255,255,255,.3)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>');
      rest.appendChild(sp);
    };
    return p;
  }
  function tablePanel(M) {
    var list = el('div', { class: 'pls fill' });
    M.players.forEach(function (x) {
      var d = x.net, bk = el('div', { class: 'bk' }, [document.createTextNode(money(x.bank)), el('small', { class: d > 0 ? 'pos' : d < 0 ? 'neg' : '', text: d ? signed(d) : 'Even' })]);
      var nm = el('div', { class: 'nm' }, [el('span', { text: x.name })]);
      if (x.shooter) nm.insertAdjacentHTML('beforeend', Kit.icon('dice'));
      list.appendChild(el('div', { class: 'plr' + (x.me ? ' me' : '') + (x.out ? ' out' : '') }, [Kit.avatar.el(x.name, null, Kit.color(x.i)), nm, bk,
        el('div', { class: 'bts', text: x.out ? (x.me ? 'You are sitting out.' : x.name + ' is sitting out.') : x.bets.length ? x.bets.join(', ') : 'No chips on the table' })]));
    });
    var p = el('div', { class: 'pn pn-tbl' }, [el('h4', null, [el('span', { text: 'At the table' }), el('b', { text: M.players.length + ' players' })]), list]);
    // everyone shows: with their bets where there is the height, without them where there isn't, and in a list that scrolls by whole rows at the last
    p._fill = function () {
      var room = list.clientHeight;
      if (list.scrollHeight > room + 1) list.classList.add('tight');
      if (list.scrollHeight > room + 1 && list.children.length > 2 && list.clientWidth >= 350 * BIG.pu) list.classList.add('two');
      if (list.scrollHeight > room + 1) { var rh = list.firstChild.offsetHeight; list.classList.add('scr'); list.style.height = Math.max(rh, Math.floor(room / rh) * rh) + 'px'; }
    };
    return p;
  }
  function paintRoom(M) {
    var rm = R.rm; if (!rm || !rm.parentNode) return;
    rm.innerHTML = '';
    var w = BIG.r[2], h = BIG.r[3], gp = BIG.gp, minW = 250 * BIG.pu, col = !!BIG.col;
    var ps = [rollsPanel(M)]; if (M.players) ps.push(tablePanel(M)); if (!R.mybOn) ps.push(betsPanel(M)); ps.push(sessPanel(M));
    var max = col ? Math.max(1, Math.floor((h + gp) / (190 * BIG.pu + gp))) : Math.max(1, Math.floor((w + gp) / (minW + gp)));
    ps.slice(0, max).forEach(function (p) { rm.appendChild(p); });
    [].forEach.call(rm.children, function (p) { p._fill(); });
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved) {
    S = saved; moneyFor(S.player || 'You');
    if (S.sess.rolls && Date.now() - S.sess.last > 8 * 3600 * 1000 && !S.anim) {
      recordSession(S); S.sess = newSess(); S.recent = []; save();
    }
    render();
  } else showSetup();
  var turned = false;
  window.addEventListener('resize', function () { if (!shapePending()) bigLay(true); if (S && R.puck) { if (busy) turned = true; else { paintPuck(); placeDice(false); } } });
  window.addEventListener('pageshow', function () { if (S && R.bal && !busy) paintBank(); });
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Left Right Center</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
.turnline{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 8px;min-height:30px;font-family:var(--display);font-size:1.25rem;color:var(--c,var(--yellow));text-align:center;}
.turnline .dot{width:11px;height:11px;flex:none;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 25%,transparent);}
.turnline span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Oval table */
.oval{position:relative;margin:0 auto;width:100%;max-width:540px;height:clamp(420px,calc(100svh - 292px),600px);border-radius:50%;padding:12px;}
.oval > .felt-in{position:relative;width:100%;height:100%;border-radius:50%;}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(56%,220px);}

/* LRC dice */
.dice{display:flex;justify-content:center;gap:10px;min-height:50px;}
.die.ldie{--ds:clamp(40px,11.5vw,48px);}
.ldie .f{grid-area:1/1/4/4;place-self:center;font-family:var(--display);font-size:calc(var(--ds) * .62);line-height:1;color:#1f2a6b;}
.ldie[data-f="C"] .f{color:#c8102e;}
.ldie .f.pip{width:calc(var(--ds) * .3);height:calc(var(--ds) * .3);border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4660 0%,#15132a 70%);box-shadow:inset 0 1px 1px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.7);}
.ldie.act{transform:translateY(-6px) scale(1.12);box-shadow:0 0 0 3px var(--lit),0 0 18px var(--litg),0 10px 14px rgba(0,0,0,.45);}
.ldie.done{filter:brightness(.78);}
.ldie.keep{box-shadow:0 0 0 3px var(--green),0 0 16px rgba(61,220,132,.55),0 8px 12px rgba(0,0,0,.4);}

/* Pot */
.pot{position:relative;width:100%;aspect-ratio:1.7;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.34),rgba(0,0,0,.18) 80%,rgba(0,0,0,0));box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);}
.pot .lbl{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font-size:.82rem;font-weight:650;color:rgba(255,255,255,.68);white-space:nowrap;}
.pot .lbl b{color:#fff;font-family:var(--display);font-size:1.1rem;margin-left:4px;}
.pot .lchip{position:absolute;transform:translate(-50%,-50%);}

/* Chips */
.lchip{--cc:#d8263a;--cs:24px;width:var(--cs);height:var(--cs);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--cc) 0 40%,rgba(255,255,255,.85) 41% 45%,var(--cc) 46% 60%,transparent 61%),repeating-conic-gradient(#fff 0 13deg,var(--cc) 13deg 45deg);
  box-shadow:0 3px 0 color-mix(in srgb,var(--cc) 50%,#000),0 4px 5px rgba(0,0,0,.4);}
.lchip.c1{--cc:#2456c9;}.lchip.c2{--cc:#1f9a55;}.lchip.c3{--cc:#e3a823;}
.lchip.fly{position:fixed;z-index:60;margin:0;left:0;top:0;}

/* Seats */
.lseat{position:absolute;width:var(--sw,78px);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;}
.lseat .stack{position:relative;width:34px;height:var(--sh,58px);}
.lseat .stack .lchip{position:absolute;left:5px;}
.lseat .stack.empty::after{content:"";position:absolute;left:5px;bottom:0;width:24px;height:24px;border-radius:50%;border:2px dashed rgba(255,255,255,.28);box-sizing:border-box;}
.lseat .tag{display:flex;align-items:center;gap:5px;max-width:var(--sw,78px);padding:3px 4px 3px 8px;border-radius:999px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px) saturate(.7);backdrop-filter:blur(10px) saturate(.7);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 70%,transparent),0 2px 8px rgba(0,0,0,.3);font-size:.76rem;font-weight:700;color:#fff;transition:box-shadow .2s;}
.lseat .tag .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.lseat .tag b{flex:none;min-width:20px;height:20px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:var(--c);color:#14122a;font-size:.8rem;font-weight:800;font-variant-numeric:tabular-nums;}
.lseat.on .tag{box-shadow:inset 0 0 0 2px var(--c),0 0 0 2px var(--lit),0 0 18px var(--litg);}
.lseat.out .tag{opacity:.6;}
.lseat.out .tag b{background:rgba(255,255,255,.2);color:#fff;}
.lseat.bump .tag b{animation:bump .45s var(--spring);}
@keyframes bump{40%{transform:scale(1.45);}}
.lseat .say{position:absolute;bottom:calc(100% - 6px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 10px;border-radius:12px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:.8rem;font-weight:700;box-shadow:var(--plate-line),0 4px 12px rgba(0,0,0,.35);animation:pop .3s var(--spring);z-index:3;}

/* Controls */
.rollbtn{margin-top:14px;min-height:56px;}
.ctrls{display:flex;gap:10px;align-items:center;margin-top:12px;}
.ctrls .seg{flex:1;}
.ctrls .seg > button{min-height:40px;font-size:.85rem;}
.auto{display:flex;align-items:center;gap:7px;min-height:48px;padding:0 14px;border:0;border-radius:var(--r);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text-2);font:inherit;font-weight:700;font-size:.86rem;}
.auto:active{transform:scale(.97);}
.auto .box{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--text-3);}
.auto .box .ico{width:14px;height:14px;opacity:0;}
.auto[aria-pressed="true"]{color:var(--lit-ink);box-shadow:inset 0 0 0 1px rgba(255,211,77,.6),0 0 16px rgba(255,190,60,.18);}
.auto[aria-pressed="true"] .box{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));box-shadow:none;color:var(--gold-ink);}
.auto[aria-pressed="true"] .box .ico{opacity:1;}
/* Tall tablet: bigger table and dice */
/* Sideways (a phone on its side, an iPad held sideways): the table at the left as tall as the screen, to look at; the
   turn, Roll and the pace controls in a column at the right, where your thumb is */
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  #app.stage:has(> .oval){max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) clamp(200px,30vw,320px);grid-template-rows:1fr auto auto auto 1fr;
    grid-template-areas:"oval ." "oval turn" "oval roll" "oval ctrls" "oval stake";column-gap:clamp(14px,3vw,36px);align-items:center;
    padding-right:max(17px,calc(var(--safe-r,0px) + 8px));padding-bottom:max(18px,calc(var(--safe-b) + 10px));}
  #app > .turnline{grid-area:turn;justify-content:flex-start;margin:0;}
  #app > .turnline span{white-space:normal;}
  #app > .oval{grid-area:oval;max-width:none;height:calc(100svh - var(--safe-t) - var(--safe-b) - 96px);align-self:start;}
  #app > .rollbtn{grid-area:roll;margin-top:10px;}
  #app > .ctrls{grid-area:ctrls;flex-direction:column;align-items:stretch;gap:8px;margin-top:10px;}
  #app > .stakeline{grid-area:stake;align-self:start;text-align:left;}
  .oval .mid{width:min(46%,290px);}
}
@media (orientation:landscape) and (min-aspect-ratio:5/4) and (min-height:700px){
  .die.ldie{--ds:60px;} .dice{gap:14px;min-height:62px;} .lseat .tag{font-size:1rem;}
  #app > .oval{height:calc(100svh - var(--safe-t) - var(--safe-b) - 100px);}
}
/* A short table (a phone on its side): the dice beside the pot, not over it, so the middle clears the seats */
@media (orientation:landscape) and (min-aspect-ratio:5/4) and (max-height:600px){
  .oval .mid{flex-direction:row;width:min(60%,420px);gap:14px;transform:translate(-50%,-62%);}
  .oval .mid .dice{flex:none;gap:8px;}
  .oval .mid .pot{flex:1;min-width:0;}
  .die.ldie{--ds:40px;}
}
.lseat{transition:left .42s cubic-bezier(.3,.7,.25,1),top .42s cubic-bezier(.3,.7,.25,1);}
@media (min-width:700px) and (min-height:900px){
  .oval{max-width:680px;height:clamp(420px,calc(100svh - 300px),780px);}
  .mid{width:min(56%,290px);}
  .die.ldie{--ds:60px;}
  .dice{gap:14px;min-height:62px;}
  .lseat .tag{font-size:1rem;}
  .pot .lbl{font-size:.82rem;bottom:-28px;}
}
.stakeline{margin-top:10px;text-align:center;font-size:.8rem;font-weight:600;color:var(--text-3);}
/* AT A DESK (html.lr-dk, set by the script's deskPlan only while a computer's window shows the table; phones and
   tablets never get it). The script places the oval, the station and the room's panels; what is on the felt is
   sized by the table's unit --lu (1 to 2.3). */
:root.lr-dk,:root.lr-dk body{overflow:hidden;overscroll-behavior:none;}
:root.lr-dk #app.stage{max-width:none;margin:0;padding:0;display:block;}
:root.lr-dk #app > .oval{position:fixed;max-width:none;margin:0;padding:calc(12px * var(--lu));box-sizing:border-box;z-index:1;}
:root.lr-dk .lseat{width:calc(var(--sw,78px) * var(--lu));gap:calc(3px * var(--lu));}
:root.lr-dk .lseat .stack{width:calc(34px * var(--lu));height:calc(var(--sh,58px) * var(--lu));}
:root.lr-dk .lchip{--cs:calc(24px * var(--lu));}
:root.lr-dk .lseat .stack.empty::after{left:calc(5px * var(--lu));width:calc(24px * var(--lu));height:calc(24px * var(--lu));}
:root.lr-dk .lseat .tag{max-width:calc(var(--sw,78px) * var(--lu));font-size:calc(.76rem * var(--lu));padding:calc(3px * var(--lu)) calc(4px * var(--lu)) calc(3px * var(--lu)) calc(8px * var(--lu));gap:calc(5px * var(--lu));}
:root.lr-dk .lseat .tag{max-width:none;}
:root.lr-dk .lseat .tag .nm{overflow:visible;text-overflow:clip;}
:root.lr-dk .lseat .tag b{min-width:calc(20px * var(--lu));height:calc(20px * var(--lu));font-size:calc(.8rem * var(--lu));padding:0 calc(5px * var(--lu));}
:root.lr-dk .lseat .say{font-size:calc(.8rem * var(--lu));padding:calc(4px * var(--lu)) calc(10px * var(--lu));border-radius:calc(12px * var(--lu));}
:root.lr-dk .oval .mid{width:min(52%,calc(240px * var(--lu)));gap:calc(10px * var(--lu));flex-direction:column;transform:translate(-50%,-50%);}
:root.lr-dk .dice{gap:calc(10px * var(--lu));min-height:calc(50px * var(--lu));}
:root.lr-dk .die.ldie{--ds:min(calc(48px * var(--lu)),110px);}
:root.lr-dk .pot .lbl{font-size:calc(.82rem * var(--lu));bottom:calc(-24px * var(--lu));}
:root.lr-dk .pot .lbl b{font-size:calc(1.1rem * var(--lu));}
:root.lr-dk .lstn{position:fixed;z-index:2;display:flex;flex-direction:column;gap:12px;}
:root.lr-dk .lstn > *{margin:0;}
:root.lr-dk .lstn .turnline{justify-content:flex-start;font-size:1.45rem;min-height:40px;}
:root.lr-dk .lstn .turnline span{white-space:normal;}
:root.lr-dk .lstn .ctrls{flex-direction:column;align-items:stretch;gap:8px;}
:root.lr-dk .lstn .stakeline{text-align:left;font-size:.86rem;}
:root.lr-dk .auto{cursor:pointer;}
/* the room */
.lpn{position:fixed;z-index:1;display:flex;flex-direction:column;gap:.55em;padding:.85em 1em .9em;box-sizing:border-box;border-radius:20px;font-size:var(--pf,16px);color:var(--text);
  background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line),inset 0 1px 0 rgba(255,255,255,.1);overflow:hidden;}
.lpn h4{flex:none;margin:0;font-family:var(--display);font-size:1.12em;font-weight:800;}
.lpn .llist{flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
.lpn .lrc{flex:1 1 0;min-height:0;position:relative;}
.lpn .lrc svg{position:absolute;inset:0;overflow:visible;}
.lpn .lrc text{fill:var(--text-3);font-family:var(--font);font-variant-numeric:tabular-nums;}
.lpn .lrc text.tg{font-weight:750;} .lpn .lrc text.now{fill:var(--lit-ink);font-weight:800;}
.lpn .lrc line.g{stroke:var(--gl-line);}
.lpn .lrow{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.8em;padding:.45em 0;border-bottom:1px solid var(--gl-line);}
.lpn .lrow:last-child{border-bottom:0;}
.lpn .lrow.now .lb b{color:var(--lit-ink);}
.lpn .ld{display:flex;gap:.25em;min-width:calc(3 * 1.6em + .5em);}
.lpn .ld .die.ldie{--ds:1.6em;padding:0;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.lpn .lb{min-width:0;display:flex;flex-direction:column;line-height:1.2;}
.lpn .lb b{display:flex;align-items:center;gap:.4em;font-size:.95em;font-weight:750;overflow-wrap:anywhere;}
.lpn .lb b i{width:.6em;height:.6em;border-radius:50%;background:var(--c);flex:none;}
.lpn .lb small{font-size:.82em;font-weight:600;color:var(--text-2);}
.lpn .lwr{flex:none;display:grid;grid-template-columns:minmax(0,7em) 1fr auto;align-items:center;gap:.7em;padding:.35em 0;}
.lpn .lwr b{font-weight:700;font-size:.92em;overflow-wrap:anywhere;}
.lpn .lwr .bar{height:.55em;border-radius:99px;background:var(--well);overflow:hidden;}
.lpn .lwr .bar i{display:block;height:100%;border-radius:99px;background:color-mix(in srgb,var(--h) 70%,#fff 10%);}
.lpn .lwr .n{font-family:var(--display);font-weight:800;min-width:1.4em;text-align:right;}
</style>
</head>
<body>
<main class="stage" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var KEY = 'lrc', SAVE = 'lrc_state', PREFS = 'lrc_prefs';
  var FACES = ['L', 'R', 'C', '.', '.', '.'];
  var SPEEDS = { slow: 1.6, normal: 1, fast: 0.45 };

  var S = null, view = null, busy = false, token = 0, testSpd = null, held = false;
  var prefs = { auto: false, speed: 'normal' };
  try { var pr = JSON.parse(localStorage.getItem(PREFS)); if (pr) { prefs.auto = !!pr.auto; if (SPEEDS[pr.speed]) prefs.speed = pr.speed; } } catch (e) {}
  function savePrefs() { try { localStorage.setItem(PREFS, JSON.stringify(prefs)); } catch (e) {} }
  function spd() { return testSpd != null ? testSpd : SPEEDS[prefs.speed]; }
  function later(fn, ms) { var t = token; setTimeout(function () { if (t === token) fn(); }, Math.max(0, ms * spd())); }
  function money(chips) {
    if (!S || !S.stake) return '';
    var v = chips * S.stake;
    return v < 1 ? Math.round(v * 100) + '¢' : '$' + (v % 1 ? v.toFixed(2) : String(v));
  }
  function stakeName(st) { return st < 1 ? Math.round(st * 100) + '¢' : '$' + st; }

  Kit.init({
    id: KEY,
    theme: { felt: ['#17727a', '#0e4f56', '#09393e'], wood: ['#8a5530', '#5a3418'] },
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } token++; busy = false; clearSave(); showSetup(); },
    menu: TurnNet.menu().concat([{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Left Right Center: past games' }); } }]),
    rules:
      '<p class="goal">Be the last player with chips left. The winner takes the whole pot in the middle!</p>' +
      '<h3>Getting ready</h3><p>Everyone starts with <b>3 chips</b>. Play goes around the table to the left.</p>' +
      '<h3>Your turn</h3><p>Roll one die for each chip you have, but never more than 3 dice. Then do what each die says:</p>' +
      '<ul><li><b>L</b>: pass one chip to the player on your <b>left</b>.</li>' +
      '<li><b>R</b>: pass one chip to the player on your <b>right</b>.</li>' +
      '<li><b>C</b>: put one chip in the <b>center</b> pot. It stays there.</li>' +
      '<li><b>Dot</b>: you keep that chip.</li></ul>' +
      '<h3>Out of chips?</h3><p>You are still in the game! You just skip your turn. If a neighbor rolls an L or R your way, you get chips back and roll again.</p>' +
      '<h3>Winning</h3><p>When only one player still has chips, that player wins and takes everything in the center pot.</p>' +
      '<h3>Handy buttons</h3><p><b>Auto-roll</b> rolls for everyone so you can just watch. <b>Speed</b> makes the dice and chips move faster or slower.</p>' +
      '<h3>Online</h3><p><b>Play online</b> opens a table, and the others join from their own phones or tablets. Everyone rolls on their own device when it’s their turn, and the computer rolls for any seats it plays.</p>'
  });

  // ── Save / load ──────────────────────────────────────────────────────────
  function save() {
    if (!S || NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    Kit.resume.set('Round ' + S.round + ' · pot ' + S.pot);
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function load() { try { return JSON.parse(localStorage.getItem(SAVE)); } catch (e) { return null; } }

  // ── Setup ────────────────────────────────────────────────────────────────
  function showSetup() {
    DK = null; dkKey = ''; document.documentElement.classList.remove('lr-dk');
    S = null; view = null;
    Kit.setup(app, {
      modes: Kit.modes(['cpu', { id: 'pass', kind: 'local' }]),
      players: {
        range: function () { return [2, 10]; },
        cpu: function (m) { return m === 'cpu' ? 'seats' : m === 'pass' ? 'mix' : false; },
        count: 4
      },
      options: [
        { id: 'stake', label: 'Chip value', help: 'A pretend money value for each chip, just for fun. Nobody really pays anything.',
          choices: [[0, 'None', 'Chips are just chips.'], [0.25, '25¢', 'Each chip is worth a quarter, so the pot shows money too.'], [1, '$1', 'Each chip is worth one dollar.'], [5, '$5', 'High rollers: each chip is worth five dollars.']], value: 0 }
      ],
      onStart: function (cfg) { start(cfg); }
    });
  }

  function start(cfg) {
    token++; busy = false;
    var n = cfg.players.length;
    S = {
      mode: cfg.mode, stake: Number((cfg.options || {}).stake) || 0,
      players: cfg.players.map(function (p) {
        return { name: p.name, cpu: p.cpu, color: p.color, chips: 3, st: { zero: 0, peak: 3, peakR: 1, tripleC: 0, tripleDot: 0, rolls: 0 } };
      }),
      cur: 0, round: 1, pot: 0, maxPot: 0, turns: 0, last: null, winner: null, ev: [],
      rounds: [cfg.players.map(function () { return 3; }), cfg.players.map(function () { return 0; })],
      started: Date.now()
    };
    void n;
    Kit.gameStart();
    save(); view = snapshotView(); render(); next();
  }

  function snapshotView() { return { chips: S.players.map(function (p) { return p.chips; }), pot: S.pot }; }
  function left(i) { return (i + 1) % S.players.length; }
  function right(i) { return (i - 1 + S.players.length) % S.players.length; }
  function alive() { return S.players.filter(function (p) { return p.chips > 0; }); }
  function note(text) { S.ev.push({ t: text, r: S.round }); }

  // ── Turn flow ────────────────────────────────────────────────────────────
  // Decide what happens on the current turn: skip (no chips), wait for a tap, or roll.
  function next() {
    if (!S || busy) return;
    if (S.winner != null) return finish();
    var p = S.players[S.cur];
    render();
    if (held) return;   // (a demo holds the table between turns while it explains one: __lrc.hold)
    if (NET) { if (prefs.auto && NET.myTurn() && S.cur === NET.seat && p.chips > 0) later(function () { if (S && NET && !busy && S.cur === NET.seat && prefs.auto) roll(true); }, 700); return; }
    if (p.chips === 0) {
      busy = true;
      say(S.cur, 'No chips: skip');
      later(function () { busy = false; advance(); save(); render(); next(); }, 1000);
      return;
    }
    if (p.cpu || prefs.auto) later(function () { if (S && !busy && S.players[S.cur] === p) roll(true); }, 700);
  }
  function advance() {
    S.cur = left(S.cur);
    if (S.cur === 0) { S.round++; S.rounds.push(S.players.map(function () { return 0; })); }
  }

  // One roll applied to a game state (this device's game, or an online table's): who rolled, the faces and where
  // each chip went. Online, the turn then moves on past anyone with no chips (their skips ride along in skip).
  function rollState(st, online) {
    var keep = S; S = st;
    try {
      var who = S.cur, p = S.players[who];
      if (S.winner != null || p.chips === 0) return null;
      var n = Math.min(3, p.chips), faces = [];
      var rig = window.__lrc && window.__lrc.rig; if (rig) window.__lrc.rig = null;
      for (var i = 0; i < n; i++) faces.push(rig && rig[i] ? rig[i] : FACES[Math.floor(Math.random() * 6)]);
      var moves = applyFaces(who, faces), skip = [];
      if (online && S.winner == null) while (S.players[S.cur].chips === 0 && skip.length < S.players.length) { skip.push(S.cur); advance(); }
      return { state: S, mv: { t: 'r', who: who, faces: faces, moves: moves, skip: skip } };
    } finally { S = keep; }
  }
  function roll(auto) {
    if (!S || busy || S.winner != null) return;
    var who = S.cur, p = S.players[who];

      [el('span', { text: S.winner != null ? 'Game over' : busy || cur.cpu || cur.chips === 0 ? 'Rolling…' : NET && S.cur !== NET.seat ? 'Waiting for ' + cur.name : prefs.auto ? 'Auto-rolling…' : 'Roll ' + nd + (nd === 1 ? ' die' : ' dice') })]);
    rb.disabled = !canTap;
    app.appendChild(rb);

    var auto = el('button', { type: 'button', class: 'auto', 'aria-pressed': String(prefs.auto), onclick: function () {
      prefs.auto = !prefs.auto; savePrefs(); Kit.sfx('tap'); Kit.haptic('light');
      if (!busy) { render(); if (prefs.auto) next(); } else auto.setAttribute('aria-pressed', String(prefs.auto));
    } }, [el('span', { class: 'box', html: Kit.icon('check') }), el('span', { text: 'Auto-roll' })]);
    var seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Speed' });
    [['slow', 'Slow'], ['normal', 'Normal'], ['fast', 'Fast']].forEach(function (s) {
      seg.appendChild(el('button', { type: 'button', class: prefs.speed === s[0] ? 'on' : '', text: s[1], onclick: function () {
        prefs.speed = s[0]; savePrefs(); Kit.sfx('tap');
        seg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.textContent === s[1]); });
      } }));
    });
    app.appendChild(el('div', { class: 'ctrls' }, [auto, seg]));
    var tot = n * 3;
    app.appendChild(el('div', { class: 'stakeline', text: 'Round ' + S.round + ', with ' + tot + ' chips' + (S.stake ? ' at ' + stakeName(S.stake) + ' (' + money(tot) + ')' : '') }));
    if (DK) deskPaint();
  }

  // ── At a desk (a computer's window of any shape; CLAUDE.md "Large windows") ──────────────────────────────────
  // Phones and tablets keep the layouts above exactly as they were (deviceShape). In a larger window the oval table
  // is sized from the window and everything on it (the seats, their chips and name plates, the dice, the pot) grows
  // with it (--lu); the turn, Roll and the pace controls stand at the right; the room holds the game so far: every
  // roll with where its chips went, the chips each player has held round by round, and who has won the pot before.
  // html.lr-dk is on only while it shows.
  var DK = null, dkKey = '';
  function LU() { return DK ? DK.u : 1; }
  function deviceShape(w, h) { var lo = Math.min(w, h), hi = Math.max(w, h); return (lo <= 480 && hi <= 1000) || (lo >= 620 && lo <= 840 && hi >= 900 && hi <= 1200); }
  function deskPlan() {
    var W = window.innerWidth, Hw = window.innerHeight;
    if (!S || deviceShape(W, Hw) || W < 480 || Hw < 540) return null;
    var bar = document.querySelector('.gbar'), top = (bar ? Math.round(bar.getBoundingClientRect().bottom) : 60) + 4;
    var gp = Math.round(Math.max(14, Math.min(30, W / 90))), G = gp, X0 = gp, Y0 = top, AW = W - 2 * gp, AH = Hw - Y0 - Math.max(18, gp);
    var n = S.players.length, sw = Math.round(Math.max(300, Math.min(400, W * .2))), stH = 300, L = { W: W, H: Hw, gp: G, slots: [] };
    L.pf = Math.round(Math.max(14, Math.min(24, 15 * Math.min(W / 1500, Hw / 1000))));
    function slot(x, y, w, h) { if (w >= 280 && h >= 150) L.slots.push({ x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) }); }
    if (AW >= AH * 1.15 && AW - sw - G >= 420) {
      // wide: the table, the station at its right; the room at the left when there is a column for it, or under the station
      var ow = Math.min(AW - sw - G, Math.round(AH * 1.45)), oh = AH, roomW = AW - sw - ow - 2 * G;
      if (roomW < 320 && AW - sw - 2 * G - AH * 1.15 >= 320) { ow = Math.round(Math.max(AH * 1.15, AW - sw - 2 * G - 460)); roomW = AW - sw - ow - 2 * G; }
      if (roomW < 320) { roomW = 0; ow = AW - sw - G; ow = Math.min(ow, Math.round(AH * 1.6)); }
      var ox = X0 + (roomW ? roomW + G : 0);
      L.comp = 'wide'; L.oval = [ox, Y0, ow, oh];
      var sx = ox + ow + G, swr = X0 + AW - sx;
      L.stn = [sx, Y0, swr];
      if (roomW) slot(X0, Y0, roomW, AH);
      L.under = [sx, Y0 + stH + G, swr, AH - stH - G];
    } else {
      // tall or square: the table across the top, the station at the right under it, the room at its left
      var oh2 = Math.round(Math.min(AW * 1.05, AH - stH - G)), ow2 = AW;
      if (oh2 < 300) return null;
      L.comp = 'tall'; L.oval = [X0, Y0, ow2, oh2];
      var y2 = Y0 + oh2 + G, sw2 = Math.min(sw, AW);
      L.stn = [X0 + AW - sw2, y2, sw2];
      if (AW - sw2 - G >= 280) slot(X0, y2, AW - sw2 - G, AH - oh2 - G);
      else L.stn[1] = y2;
      L.under = [X0 + AW - sw2, y2 + stH + G, sw2, Y0 + AH - (y2 + stH + G)];
    }
    if (L.under[3] >= 150 && L.under[2] >= 280) slot(L.under[0], L.under[1], L.under[2], L.under[3]);
    L.u = Math.max(1, Math.min(2.3, Math.min(L.oval[2] * .78, L.oval[3]) / 520));
    L.key = [L.comp, W, Hw, n].join(':');
    return L;
  }
  function deskBoxes(oval) {
    var L = DK, o = L.oval;
    oval.style.left = o[0] + 'px'; oval.style.top = o[1] + 'px'; oval.style.width = o[2] + 'px'; oval.style.height = o[3] + 'px';
    oval.style.setProperty('--lu', L.u.toFixed(3));
    document.documentElement.style.setProperty('--lu', L.u.toFixed(3));
  }
  // the room's panels, from the game itself and this device's history
  function rollsPanel() {
    var rl = S.rl || []; if (!rl.length) return null;
    var n = S.players.length, pn = el('div', { class: 'lpn lrolls' }), list = el('div', { class: 'llist' });
    pn.appendChild(el('h4', { text: 'Rolls so far' })); pn.appendChild(list);
    for (var k = rl.length - 1; k >= 0 && k >= rl.length - 60; k--) {
      var t = rl[k], w = parseInt(t.charAt(0), 36), fs = t.slice(1).split(''), q = S.players[w]; if (!q) continue;
      var dice = el('span', { class: 'ld' });
      fs.forEach(function (f) { var d = el('span', { class: 'die ldie', 'data-f': f }); d.appendChild(el('span', { class: 'f' + (f === '.' ? ' pip' : ''), text: f === '.' ? '' : f })); dice.appendChild(d); });
      var to = {}, pot = 0, kept = 0;
      fs.forEach(function (f) { if (f === '.') kept++; else if (f === 'C') pot++; else { var j = f === 'L' ? (w + 1) % n : (w - 1 + n) % n; to[j] = (to[j] || 0) + 1; } });
      var parts = Object.keys(to).map(function (j) { return (to[j] === 1 ? 'one' : to[j] === 2 ? 'two' : 'three') + ' to ' + S.players[j].name; });
      if (pot) parts.push((pot === 1 ? 'one' : pot === 2 ? 'two' : 'three') + ' to the pot');
      var say = parts.length ? (parts.length > 1 ? 'Passed ' + parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1] : 'Passed ' + parts[0]) + '.'
        : (fs.length === 1 ? 'Kept the chip.' : fs.length === 2 ? 'Kept both chips.' : 'Kept all three chips.');
      list.appendChild(el('div', { class: 'lrow' + (k === rl.length - 1 ? ' now' : '') }, [dice, el('span', { class: 'lb' }, [el('b', { html: '<i style="--c:' + q.color + '"></i>' + Kit.esc(q.name) }), el('small', { text: say })])]));
    }
    pn._fit = function () { trim(list); };
    return pn;
  }
  function racePanel() {
    if (!S.rounds || S.rounds.length < 2 || !(S.rl || []).length) return null;
    var pn = el('div', { class: 'lpn lrace' }), box = el('div', { class: 'lrc' });
    pn.appendChild(el('h4', { text: 'Chips round by round' })); pn.appendChild(box);
    pn._draw = function () {
      var bw = box.clientWidth, bh = box.clientHeight; if (bw < 60 || bh < 60) return;
      var runs = S.players.map(function () { return []; }), cur = S.players.map(function () { return 0; });
      S.rounds.forEach(function (row) { row.forEach(function (v, i) { cur[i] += v; runs[i].push(cur[i]); }); });
      var R = S.rounds.length, mx = 3; runs.forEach(function (r) { r.forEach(function (v) { mx = Math.max(mx, v); }); });
      var fs = DK.pf * .8, pl = fs * 1.8, pb = fs * 1.6, pr = Math.min(bw * .3, fs * 7.5), pt = fs * .6;
      var X = function (i) { return pl + (bw - pl - pr) * (i / Math.max(1, R - 1)); }, Y = function (v) { return pt + (bh - pt - pb) * (1 - v / mx); };
      var svg = '<svg viewBox="0 0 ' + bw + ' ' + bh + '" width="' + bw + '" height="' + bh + '">';
      for (var v = 0; v <= mx; v += mx > 12 ? 5 : mx > 6 ? 2 : 1) svg += '<line x1="' + pl + '" x2="' + (bw - pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" class="g"/><text x="' + (pl - fs * .5) + '" y="' + (Y(v) + fs * .35) + '" text-anchor="end" font-size="' + fs + '">' + v + '</text>';
      var tags = [];
      runs.forEach(function (r, i) {
        var q = S.players[i], d = '';
        r.forEach(function (v, k) { d += (k ? ' L' : 'M') + X(k) + ' ' + Y(v); });
        svg += '<path d="' + d + '" fill="none" stroke="' + q.color + '" stroke-width="' + Math.max(2.5, fs * .2) + '" stroke-linejoin="round" opacity="' + (r[r.length - 1] ? 1 : .45) + '"/>';
        tags.push({ y: Y(r[r.length - 1]), t: q.name + ' ' + r[r.length - 1], c: q.color });
      });
      tags.sort(function (a, b) { return a.y - b.y; });
      for (var k = 1; k < tags.length; k++) if (tags[k].y - tags[k - 1].y < fs * 1.2) tags[k].y = tags[k - 1].y + fs * 1.2;
      var over = tags.length ? tags[tags.length - 1].y - (bh - pb) : 0; if (over > 0) tags.forEach(function (t) { t.y -= over; });
      tags.forEach(function (t) { svg += '<text x="' + (X(R - 1) + fs * .6) + '" y="' + (t.y + fs * .35) + '" font-size="' + fs + '" fill="' + t.c + '" class="tg">' + Kit.esc(t.t) + '</text>'; });
      svg += '<text x="' + pl + '" y="' + (bh - fs * .3) + '" font-size="' + fs + '">Start</text><text x="' + X(R - 1) + '" y="' + (bh - fs * .3) + '" text-anchor="end" font-size="' + fs + '" class="now">Round ' + (R - 1) + '</text>';
      box.innerHTML = svg + '</svg>';
    };
    return pn;
  }
  function winsPanel() {
    var past = []; try { past = GameHistory.load('lrc') || []; } catch (e) {}
    var wins = {}; past.forEach(function (e) { if (e && e.winner) wins[e.winner] = (wins[e.winner] || 0) + 1; });
    var names = Object.keys(wins).sort(function (a, b) { return wins[b] - wins[a]; });
    if (!names.length) return null;
    var pn = el('div', { class: 'lpn lwins' }), list = el('div', { class: 'llist' }), top = wins[names[0]];
    pn.appendChild(el('h4', { text: 'Pots won before' })); pn.appendChild(list);
    names.forEach(function (nm) { list.appendChild(el('div', { class: 'lwr' }, [el('b', { text: nm }), el('span', { class: 'bar' }, [el('i', { style: { width: Math.round(100 * wins[nm] / top) + '%' } })]), el('span', { class: 'n', text: String(wins[nm]) })])); });
    pn._fit = function () { trim(list); };
    pn._need = Math.round((names.length * 2.05 + 3.3) * DK.pf);
    return pn;
  }
  function trim(list) {
    var g = 200; while (list.scrollHeight > list.clientHeight + 1 && list.children.length && g--) list.removeChild(list.lastElementChild);
    if (!list.children.length) list.parentNode.style.display = 'none';
  }
  function deskPaint() {
    var L = DK; if (!L) return;
    var stn = el('div', { class: 'lstn' });
    ['.turnline', '.rollbtn', '.ctrls', '.stakeline'].forEach(function (q) { var e = app.querySelector(':scope > ' + q); if (e) stn.appendChild(e); });
    stn.style.left = L.stn[0] + 'px'; stn.style.top = L.stn[1] + 'px'; stn.style.width = L.stn[2] + 'px';
    app.appendChild(stn);
    // the station is as tall as it is; what is under it is the room's
    var sh = stn.offsetHeight, slots = L.slots.map(function (s) { return { x: s.x, y: s.y, w: s.w, h: s.h }; });
    slots.forEach(function (s) { if (s.x === L.under[0] && s.y === L.under[1]) { var y = L.stn[1] + sh + L.gp; s.h -= y - s.y; s.y = y; } });
    slots = slots.filter(function (s) { return s.h >= 150; });
    var pans = [racePanel(), rollsPanel(), winsPanel()].filter(Boolean), G = L.gp;
    if (!pans.length || !slots.length) return;
    // panels share the slots: the race a third of its slot's height (or a slot of its own), the rolls the most room
    slots.sort(function (a, b) { return b.h * b.w - a.h * a.w; });
    var put = [];
    if (slots.length > 1 && pans.length > 1) { put.push([pans.slice(0, pans.length - 1), slots[0]]); put.push([[pans[pans.length - 1]], slots[1]]); }
    else put.push([pans, slots[0]]);
    put.forEach(function (pp) {
      var ps = pp[0], s = pp[1], y = s.y, left = s.h - G * (ps.length - 1);
      ps.forEach(function (pn, i) {
        var h = ps.length === 1 ? left : pn.classList.contains('lrace') ? Math.round(Math.min(380, Math.max(170, left * .36))) : pn.classList.contains('lwins') ? Math.round(Math.min(pn._need, left * .3)) : null;
        if (h == null) { var rest = 0; ps.forEach(function (o, j) { if (j !== i) rest += o.classList.contains('lrace') ? Math.round(Math.min(380, Math.max(170, left * .36))) : Math.round(Math.min(o._need, left * .3)); }); h = left - rest; }
        pn.style.left = s.x + 'px'; pn.style.top = y + 'px'; pn.style.width = s.w + 'px'; pn.style.height = h + 'px';
        app.appendChild(pn); y += h + G;
      });
    });
    pans.forEach(function (pn) { if (pn._fit) pn._fit(); if (pn._draw) pn._draw(); });
  }
  // a new window size lays the table out again (gliding when the composition changes); true while a desk shows
  function deskSync() {
    var L = deskPlan(), key = L ? L.key : '';
    if (key !== dkKey) {
      var same = DK && L && DK.comp === L.comp;
      dkKey = key;
      var go = function () { render(busy && S.last ? true : false); };
      if (busy) { DK = L; document.documentElement.classList.toggle('lr-dk', !!L); var o = app.querySelector('.oval'); if (o && L) { deskBoxes(o); placeSeats(o); } return !!L; }
      if (same) go(); else Kit.glide(go);
    }
    return !!(L || DK);
  }

  // ── Online (turnnet.js) ──────────────────────────────────────────────────
  // The table holds the game state itself (mode 'online'). A roll is one move: the dice, where each chip went, and
  // anyone with no chips skipped after it. The computer rolls for its seats (the people's devices make those moves).
  var NET = null, showQ = [], NETREC = 'lrc_net_rec';
  function setupSaved() { try { return JSON.parse(localStorage.getItem('gn_setup_lrc')) || {}; } catch (e) { return {}; } }
  function netBots() { var s = setupSaved(), n = +s.count || 0; return (s.robots || []).filter(function (i) { return i > 0 && i < n; }).length; }
  function netOpts() { var o = setupSaved().options || {}; return { stake: +o.stake || 0, bots: netBots() }; }
  function netStart(players, opts) {
    return {
      mode: 'online', stake: +(opts && opts.stake) || 0,
      players: players.map(function (p, i) { return { name: p.name, cpu: !!p.bot, color: Kit.color(i), chips: 3, st: { zero: 0, peak: 3, peakR: 1, tripleC: 0, tripleDot: 0, rolls: 0 } }; }),
      cur: 0, round: 1, pot: 0, maxPot: 0, turns: 0, last: null, winner: null, ev: [],
      rounds: [players.map(function () { return 3; }), players.map(function () { return 0; })], started: Date.now()
    };
  }
  function netRoll() { var seat = NET.seat; NET.act(function (st) { return st.cur === seat ? rollState(st, true) : null; }); }
  function netShow(net, info) {
    NET = net;
    if (busy) { showQ.push(info); return; }
    showOne(info);
  }
  function showOne(info) {
    var st = JSON.parse(JSON.stringify(NET.state)), mv = info.mv, prev = info.prev;
    token++; busy = false;
    if ((info.again || info.fresh) && winRef) { winRef.close(); winRef = null; }
    if (mv && mv.t === 'r' && prev && !info.fresh && !info.again) {
      view = { chips: prev.players.map(function (p) { return p.chips; }), pot: prev.pot };
      S = st;
      playRoll(mv.who, mv.moves, function () {
        (mv.skip || []).forEach(function (i, k) { setTimeout(function () { say(i, 'No chips: skip'); }, k * 250); });
        if (S.winner != null) return finish();
        render(); next(); drain();
      });
      if (!info.mine && NET.myTurn() && S.cur === NET.seat) Kit.haptic('light');
      return;
    }
    S = st; view = null;
    if (info.again) { Kit.sfx('deal'); Kit.callout(S.cur === NET.seat ? 'You roll first' : S.players[S.cur].name + ' rolls first'); }
    if (S.winner != null) { render(); if (info.fresh) netWin(S, S.winner === NET.seat); else finish(); return; }
    if (NET.status === 'over' && NET.result && NET.result.left != null) { render(); netWin(S, false); return; }
    render(); next();
  }
  function drain() { if (!busy && showQ.length && NET) showOne(showQ.shift()); }
  function netRecorded() {
    if (!NET) return false;
    var key = NET.code + ':' + S.started, done = [];
    try { done = JSON.parse(localStorage.getItem(NETREC)) || []; } catch (e) {}
    if (done.indexOf(key) >= 0) return true;
    done.push(key); try { localStorage.setItem(NETREC, JSON.stringify(done.slice(-20))); } catch (e) {}
    return false;
  }
  var winRef = null;
  function netWin(st, meWon) {
    if (!NET) return;
    var res = NET.result, left = !!(res && res.left != null), w = st.winner != null ? st.players[st.winner] : null;
    if (winRef) winRef.close();
    winRef = Kit.win({
      title: left ? res.text : meWon ? 'You win!' : w.name + ' wins!',
      sub: left ? '' : (meWon ? 'You took' : w.name + ' took') + ' the pot of ' + st.pot + ' chip' + (st.pot === 1 ? '' : 's') + (st.stake ? ', worth ' + money(st.pot) + ',' : '') + ' after ' + st.round + ' round' + (st.round === 1 ? '' : 's') + '.',
      lose: !meWon && !left, againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { winRef = null; if (left) { TurnNet.leave(); TurnNet.open(); } else NET.again(); },
      look: true
    });
  }
  function netLeave() {
    NET = null; showQ = []; token++; busy = false; view = null;
    if (winRef) { winRef.close(); winRef = null; }
    var sv = load();
    if (sv && sv.players && sv.players.length && !sv.done) { S = sv; next(); } else showSetup();
  }
  TurnNet.setup({
    game: 'lrc', title: 'Left Right Center', min: 2, max: 10, botMs: 2600,
    seats: function (n, o) { return Math.min(10, n + Math.max(0, +(o && o.bots) || 0)); },
    opts: netOpts, start: netStart,
    turn: function (st) { return st.winner != null ? [] : [st.cur]; },
    over: function (st) { return st.winner == null ? null : { win: [st.winner], text: st.players[st.winner].name + ' won the pot' }; },
    bot: function (st, seat) { return st.cur === seat ? rollState(st, true) : null; },
    show: netShow, leave: netLeave
  });

  // Test hooks
  window.__lrc = { state: function () { return S; }, busy: function () { return busy; }, speed: function (x) { testSpd = x; }, start: function (cfg) { start(cfg); },
    // (a demo sets a later moment of the game: fn changes S, then the table is drawn again and play carries on)
    set: function (fn) { token++; busy = false; fn(S); view = null; save(); render(); next(); },
    hold: function (on) { held = !!on; if (!held && S && !busy) next(); } };

  // ── Boot ─────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved && saved.players && saved.players.length && !saved.done) {
    S = saved; busy = false; view = null;
    if (S.winner != null) { render(); finish(); } else next();
  } else showSetup();
})();
</script>

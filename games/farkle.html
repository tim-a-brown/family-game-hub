<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farkle</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* Scoreboard */
.board{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:6px;margin:2px 0 10px;}
.pc{position:relative;display:flex;flex-direction:column;gap:1px;padding:6px 9px 6px 11px;border-radius:14px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s,background .2s;min-width:0;}
.pc::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--c);}
.pc.on{background:color-mix(in srgb,var(--c) 16%,rgba(255,255,255,.05));box-shadow:inset 0 0 0 2px var(--c);}
.pc .nm{display:flex;align-items:center;gap:4px;font-weight:800;font-size:.8rem;color:var(--text-2);white-space:nowrap;overflow:hidden;}
.pc .nm span{overflow:hidden;text-overflow:ellipsis;}
.pc .nm .ico{width:13px;height:13px;flex:none;opacity:.8;}
.pc .sc{font-family:var(--display);font-size:1.35rem;line-height:1.05;color:var(--text);font-variant-numeric:tabular-nums;}
.pc.lead .sc{color:var(--yellow);}
.pc .sub{font-size:.66rem;font-weight:800;color:var(--text-3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:.9em;}
.pc .fk{position:absolute;right:7px;top:7px;display:flex;gap:3px;}
.pc .fk i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px rgba(255,77,94,.25);}
.pc.bump .sc{animation:bump .5s var(--spring);transform-origin:left center;}
@keyframes bump{40%{transform:scale(1.25);color:var(--green);}}

/* Table */
.table{border-radius:24px;padding:8px;}
.table .felt-in{position:relative;border-radius:18px;overflow:hidden;}
.zone{position:relative;height:clamp(196px,32vh,250px);}
.spot{position:absolute;width:0;height:0;}
.spot .die{--ds:clamp(46px,13vw,56px);position:absolute;left:calc(var(--ds) / -2);top:calc(var(--ds) / -2);}
.spot .die.held{box-shadow:0 0 0 3px var(--yellow),0 0 18px rgba(255,200,61,.65),0 10px 14px rgba(0,0,0,.45);transform:translateY(-5px) scale(1.06);}
.spot .die.bad{box-shadow:0 0 0 3px var(--red),0 0 16px rgba(255,77,94,.6),0 10px 14px rgba(0,0,0,.45);}
.spot .die.dead{filter:brightness(.8);}
.spot .die.hint{animation:hint 1.2s ease-in-out infinite;}
/* Dice that can't score this roll sit back a little; tapping one gives a no-shake */
.spot .die.cant{filter:saturate(.55) brightness(.78);}
.spot .die.nope{animation:nope .38s ease-in-out;}
@keyframes nope{20%{transform:translateX(-5px) rotate(-6deg);}50%{transform:translateX(5px) rotate(5deg);}80%{transform:translateX(-3px) rotate(-2deg);}}
@keyframes hint{50%{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 8px 12px rgba(0,0,0,.45);}}
.zone .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 80px;font-family:var(--display);font-size:1.25rem;line-height:1.15;color:rgba(255,255,255,.5);pointer-events:none;}

/* Leather dice cup */
.cup{position:absolute;right:12px;top:12px;width:58px;height:66px;border:0;padding:0;background:none;z-index:4;transform-origin:50% 90%;}
.cup .body{position:absolute;left:4px;right:4px;top:10px;bottom:0;border-radius:6px 6px 12px 12px;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 5px),linear-gradient(90deg,#3c1f10 0%,#7c4526 30%,#a2643a 45%,#6c3a1f 70%,#3a1d0e 100%);
  box-shadow:inset 0 -6px 8px rgba(0,0,0,.35);}
.cup .body::after{content:"";position:absolute;left:6%;right:6%;top:9px;border-top:2px dashed rgba(255,226,180,.45);}
.cup .rim{position:absolute;left:0;right:0;top:2px;height:18px;border-radius:50%;background:radial-gradient(60% 60% at 50% 55%,#120804 0%,#2b150a 70%,#4e2b16 100%);box-shadow:0 0 0 3px #8a5130,0 2px 0 4px rgba(0,0,0,.25);}
.cup.ready{cursor:pointer;}
.cup.ready .rim{box-shadow:0 0 0 3px #8a5130,0 0 0 6px rgba(255,229,138,.0),0 0 18px rgba(255,229,138,.55);animation:cupglow 1.2s ease-in-out infinite alternate;}
@keyframes cupglow{to{box-shadow:0 0 0 3px #b47040,0 0 0 6px rgba(255,229,138,.55),0 0 22px rgba(255,229,138,.7);}}
.cup.shaking{animation:rattle .11s linear infinite;}
@keyframes rattle{0%{transform:rotate(-9deg) translate(-2px,0);}50%{transform:rotate(9deg) translate(2px,-3px);}100%{transform:rotate(-9deg) translate(-2px,0);}}
.cup.tip{animation:tip .45s var(--ease);}
@keyframes tip{40%{transform:rotate(-70deg) translate(-6px,6px);}100%{transform:none;}}

/* Set-aside ledge */
.ledge{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;padding:7px 10px;background:rgba(0,0,0,.24);box-shadow:inset 0 2px 6px rgba(0,0,0,.35);}
.ledge .lbl{flex:none;font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);width:44px;line-height:1.15;}
.ledge .sets{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;min-width:0;}
.ledge .set{display:flex;gap:3px;align-items:center;}
.ledge .set b{font-size:.68rem;font-weight:900;color:rgba(255,255,255,.7);margin-left:3px;}
.ledge .die{--ds:26px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1),0 2px 3px rgba(0,0,0,.45);}
.ledge .die.in{animation:pop .4s var(--spring);}

/* Stamp */
.stamp{position:absolute;left:50%;top:44%;z-index:6;pointer-events:none;font-family:var(--display);font-size:clamp(2.6rem,13vw,3.6rem);letter-spacing:.06em;color:#e3263c;
  border:6px solid #e3263c;border-radius:14px;padding:0 16px;line-height:1.2;background:rgba(255,255,255,.06);
  text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 0 0 2px rgba(0,0,0,.15),inset 0 0 0 2px rgba(0,0,0,.15);
  -webkit-mask-image:radial-gradient(circle at 30% 40%,#000 0 60%,rgba(0,0,0,.75) 61% 63%,#000 64%),repeating-linear-gradient(35deg,#000 0 7px,rgba(0,0,0,.82) 7px 9px);-webkit-mask-composite:source-in;mask-composite:intersect;
  transform:translate(-50%,-50%) rotate(-13deg);animation:stamp .38s cubic-bezier(.2,1.6,.4,1) both;}
.stamp small{display:block;font-size:.3em;letter-spacing:.04em;text-align:center;margin-top:-4px;padding-bottom:4px;}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-24deg) scale(2.6);opacity:0;}60%{opacity:1;}100%{transform:translate(-50%,-50%) rotate(-13deg) scale(1);opacity:1;}}
.table.thud{animation:thud .45s;}
@keyframes thud{0%,100%{transform:none;}15%{transform:translate(-7px,2px) rotate(-.6deg);}35%{transform:translate(6px,-2px) rotate(.5deg);}55%{transform:translate(-4px,1px);}75%{transform:translate(3px,0);}}

/* Turn readout + actions */
.readout{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:12px 4px 10px;min-height:52px;}
.readout .who{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.25rem;color:var(--c);min-width:0;}
.readout .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.readout .who .dot{width:11px;height:11px;flex:none;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 25%,transparent);}
.readout .why{font-size:.8rem;font-weight:800;color:var(--text-3);margin-top:2px;}
.tscore{text-align:right;flex:none;}
.tscore small{display:block;font-size:.66rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);}
.tscore b{display:block;font-family:var(--display);font-weight:400;font-size:2rem;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
.tscore em{display:block;font-style:normal;font-weight:900;font-size:.85rem;color:var(--green);min-height:1.1em;}
.tscore em.no{color:var(--red);}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.acts .btn{min-height:58px;font-size:1.08rem;padding:0 10px;line-height:1.1;flex-direction:column;gap:0;}
.acts .btn small{display:block;font-size:.72rem;font-weight:800;opacity:.75;}
.acts .bank{--b:var(--green);--b-ink:#03290f;--b-lip:#1d8a4f;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}
.rulechip{margin-top:12px;text-align:center;font-size:.76rem;font-weight:800;color:var(--text-3);}
.rulechip button{border:0;background:none;color:var(--text-2);font:inherit;text-decoration:underline;text-underline-offset:3px;padding:6px;}

/* Flying points + flame callout */
.flypts{position:fixed;z-index:80;pointer-events:none;font-family:var(--display);font-size:1.9rem;color:var(--green);text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(61,220,132,.5);transform:translate(-50%,-50%);}
.k-callout.flame{color:#ff9a3d;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(255,120,40,.8);display:flex;align-items:center;gap:8px;}
.k-callout.flame .ico{width:1em;height:1em;stroke-width:2.4;}
.final{margin:-2px 0 10px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--orange) 18%,transparent);color:#ffd2ad;font-weight:800;font-size:.85rem;text-align:center;}
.sctbl{width:100%;border-collapse:collapse;font-size:.92rem;}
.sctbl td{padding:6px 4px;border-bottom:1px solid var(--line);}
.sctbl td:last-child{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;}
.sctbl .mini{display:inline-flex;gap:2px;vertical-align:middle;}
@media (min-width:900px) and (min-height:600px){ .spot .die{--ds:66px;} .ledge .die{--ds:32px;} }
@media (min-width:700px) and (min-height:900px){
  .spot .die{--ds:76px;}
  .ledge{min-height:64px;}
  .ledge .die{--ds:36px;}
  .zone{--zmax:560px;}
}
.sctbl .mini .die{--ds:18px;padding:2px;box-shadow:0 1px 2px rgba(0,0,0,.4);}
</style>
</head>
<body>
<main class="stage" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var KEY = 'farkle', SAVE = 'farkle_state';
  var S = null, SPD = 1, token = 0, lock = false;
  function later(fn, ms) { var t = token; setTimeout(function () { if (t === token) fn(); }, Math.max(0, ms * SPD)); }
  function fmt(n) { return Number(n || 0).toLocaleString('en-US'); }

  // ── Rules text ───────────────────────────────────────────────────────────
  var RULES =
    '<p class="goal">Be the first to reach 10,000 points. Roll six dice, set aside the ones that score, then decide: roll again for more, or bank your points before you Farkle!</p>' +
    '<h3>Your turn</h3><ol>' +
    '<li>Roll all six dice.</li>' +
    '<li>Tap the scoring dice you want to set aside. You must set aside at least one each roll.</li>' +
    '<li><b>Bank</b> to add your turn points to your score, or <b>Roll</b> the dice that are left to try for more.</li>' +
    '<li>If a roll has <b>no scoring dice at all</b>, that is a <b>Farkle</b>: you lose every point from this turn and your turn is over.</li></ol>' +
    '<h3>Hot dice</h3><p>If all six dice end up set aside, you get to pick them all up and roll six again, still adding to the same turn.</p>' +
    '<h3>What scores</h3><ul>' +
    '<li>Each <b>1</b> = 100, each <b>5</b> = 50</li>' +
    '<li>Three of a kind = 100 × the number (three 4s = 400). Three 1s = 1,000</li>' +
    '<li>Four of a kind = 1,000 · Five of a kind = 2,000 · Six of a kind = 3,000</li>' +
    '<li>Straight 1-2-3-4-5-6 = 1,500</li>' +
    '<li>Three pairs = 1,500 · Four of a kind + a pair = 1,500</li>' +
    '<li>Two sets of three of a kind = 2,500</li></ul>' +
    '<p>Combos only count when they come up in the <b>same roll</b>. Dice you set aside earlier can\'t be combined with new ones.</p>' +
    '<h3>Classic doubling (setup option)</h3><p>Four of a kind is double the three of a kind, five is double again, six is double again (four 3s = 600, five 3s = 1,200). Two triplets just score as two three of a kinds.</p>' +
    '<h3>Getting on the board</h3><p>If the 500 minimum is on, you need at least 500 in one turn before you can bank for the first time.</p>' +
    '<h3>Three farkles in a row</h3><p>If the penalty is on, farkling three turns in a row costs 1,000 points (never below 0).</p>' +
    '<h3>The end</h3><p>When someone banks 10,000 or more, everyone else gets <b>one last turn</b> to beat them. Highest score wins.</p>';

  Kit.init({
    id: KEY,
    theme: { felt: ['#26508e', '#173766', '#0f274b'], wood: ['#8a5530', '#5c3519'] },
    onNew: function () { token++; lock = false; inCup = []; undoStack = []; clearSave(); showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'chart', label: 'Scoring chart', onClick: function () { chart(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Farkle: past games' }); } }
    ],
    rules: RULES
  });

  // ── Scoring ──────────────────────────────────────────────────────────────
  function counts(vals) { var c = [0, 0, 0, 0, 0, 0, 0]; vals.forEach(function (v) { c[v]++; }); return c; }
  function kind(v, m, dbl) {
    var base = v === 1 ? 1000 : v * 100;
    if (m === 3) return base;
    if (dbl) return base * Math.pow(2, m - 3);
    return m === 4 ? 1000 : m === 5 ? 2000 : 3000;
  }
  // Best score using EVERY one of these dice, or -1 if some die doesn't score.
  function scoreOf(vals, dbl) {
    var c = counts(vals), n = vals.length, best = -1;
    if (!n) return 0;
    if (n === 6) {
      var ones = 0, twos = 0, threes = 0, fours = 0;
      for (var v = 1; v <= 6; v++) { if (c[v] === 1) ones++; if (c[v] === 2) twos++; if (c[v] === 3) threes++; if (c[v] === 4) fours++; }
      if (ones === 6) best = 1500;
      if (twos === 3 || (fours === 1 && twos === 1)) best = Math.max(best, 1500);
      if (threes === 2 && !dbl) best = Math.max(best, 2500);
    }
    var tot = 0;
    for (var f = 1; f <= 6; f++) {
      var k = c[f]; if (!k) continue;
      if (f === 1 || f === 5) {
        var single = f === 1 ? 100 : 50, opt = k * single;
        for (var m = 3; m <= k; m++) opt = Math.max(opt, kind(f, m, dbl) + (k - m) * single);
        tot += opt;
      } else if (k >= 3) tot += kind(f, k, dbl);
      else { tot = -1; break; }
    }
    return Math.max(best, tot);
  }
  function hasScore(vals) {
    var c = counts(vals);
    if (c[1] || c[5]) return true;
    for (var v = 1; v <= 6; v++) if (c[v] >= 3) return true;
    if (vals.length === 6) { var p = 0; for (v = 1; v <= 6; v++) if (c[v] === 2) p++; if (p === 3) return true; }
    return false;
  }
  // Name the special combo in a full six-dice roll (for callouts and history)
  function combo(vals, dbl) {
    if (vals.length < 3) return '';
    var c = counts(vals), mx = Math.max.apply(null, c);
    if (vals.length === 6) {
      if (c.slice(1).every(function (x) { return x === 1; })) return 'a straight';
      if (mx === 6) return 'six of a kind';
      var tw = 0, th = 0; for (var v = 1; v <= 6; v++) { if (c[v] === 2) tw++; if (c[v] === 3) th++; }
      if (th === 2) return 'two triplets';
      if (tw === 3) return 'three pairs';
      if (mx === 4 && tw === 1) return 'four of a kind and a pair';
    }
    if (mx === 5) return 'five of a kind';
    if (mx === 4) return 'four of a kind';
    if (c[1] >= 3) return 'three 1s';
    return '';
  }
  // Which dice in a selection can't score (for red rings)
  function deadIdx(sel) {
    var c = counts(sel.map(function (i) { return S.dice[i].v; }));
    if (sel.length === 6 && scoreOf(sel.map(function (i) { return S.dice[i].v; }), S.rules.dbl) > 0) return [];
    return sel.filter(function (i) { var v = S.dice[i].v; return v !== 1 && v !== 5 && c[v] < 3; });
  }

  // Which of the dice on the table can be part of a score this roll, and how
  // a tap groups them: a 1 or 5 on its own, every die of a three-or-more of a
  // kind together, or all six for a straight / three pairs / etc.
  function onTable() { return S.dice.map(function (d, i) { return i; }).filter(function (i) { return !S.dice[i].kept && S.dice[i].v; }); }
  function tableInfo() {
    var live = onTable(), vals = live.map(function (i) { return S.dice[i].v; }), c = counts(vals);
    var whole = live.length === 6 && ['a straight', 'three pairs', 'four of a kind and a pair', 'two triplets'].indexOf(combo(vals, S.rules.dbl)) >= 0 && scoreOf(vals, S.rules.dbl) > 0;
    return { live: live, c: c, whole: whole };
  }
  function canScore(i, info) { var v = S.dice[i].v; return info.whole || v === 1 || v === 5 || info.c[v] >= 3; }

  // ── State ────────────────────────────────────────────────────────────────
  // S = {mode, rules:{dbl,entry,target,pen}, players:[{name,cpu,color,score,on,fk,risk,st}],
  //      cur, round, phase:'start'|'pick'|'farkle'|'over', dice:[{v,x,y,r,kept,sel,set}],
  //      turn, sets:[[vals],...], hot, rolls, final, finalLeft, rounds:[[...]], ev:[], started}
  function save() {
    if (!S) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    var lead = Math.max.apply(null, S.players.map(function (p) { return p.score; }));
    Kit.resume.set(S.final != null ? 'Final round' : 'Round ' + S.round + ' · high ' + fmt(lead));
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function load() { try { return JSON.parse(localStorage.getItem(SAVE)); } catch (e) { return null; } }
  function P() { return S.players[S.cur]; }
  function freshDice() { var d = []; for (var i = 0; i < 6; i++) d.push({ v: 0, x: 0, y: 0, r: 0, kept: false, sel: false }); return d; }

  // ── Setup ────────────────────────────────────────────────────────────────
  function showSetup() {
    S = null;
    Kit.setup(app, {
      modes: [
        { id: 'cpu', icon: 'bot', title: 'vs Computer', desc: 'You against computer players' },
        { id: 'pass', icon: 'users', title: 'Pass & play', desc: 'Take turns on this phone' }
      ],
      players: {
        range: function (m) { return m === 'cpu' ? [2, 6] : [1, 6]; },
        cpu: function (m) { return m === 'cpu' ? 'seats' : false; },
        count: 2
      },
      options: [
        { id: 'target', label: 'Play to', help: 'The score you need to reach. Once someone gets there, everyone else gets one last turn.',
          choices: [[10000, '10,000', 'The standard game, about 20 to 30 minutes.'], [5000, '5,000', 'About half as long.'], [2500, '2,500 (quick)', 'A short game, good for a quick round.']], value: 10000 },
        { id: 'entry', label: 'Getting on the board', help: 'Whether your very first bank of the game has to be a big one.',
          choices: [[500, 'Need 500 first', 'You must score at least 500 in one turn before you can bank anything.'], [0, 'No minimum', 'You can bank any points, even 50.']], value: 500 },
        { id: 'scoring', label: 'Four, five, six of a kind', help: 'How much four, five or six matching dice are worth.',
          choices: [['std', '1,000 / 2,000 / 3,000', 'Four of a kind is 1,000, five is 2,000, six is 3,000. Two triplets score 2,500.'], ['dbl', 'Classic doubling', 'Each extra matching die doubles the three of a kind: four 3s = 600, five 3s = 1,200.']], value: 'std' },
        { id: 'pen', label: 'Three farkles in a row', help: 'What happens if you farkle three turns in a row.',
          choices: [['on', 'Lose 1,000', 'Your third farkle in a row takes 1,000 points off your score.'], ['off', 'No penalty', 'Farkles only cost you the points from that turn.']], value: 'on' }
      ],
      onStart: function (cfg) { start(cfg); }
    });
  }

  function start(cfg) {
    token++; lock = false; inCup = []; undoStack = [];
    var o = cfg.options || {};
    S = {
      mode: cfg.mode,
      rules: { dbl: o.scoring === 'dbl', entry: Number(o.entry) || 0, target: Number(o.target) || 10000, pen: o.pen !== 'off' },
      players: cfg.players.map(function (p) {
        return { name: p.name, cpu: p.cpu, color: p.color, score: 0, on: false, fk: 0, risk: 0.85 + Math.random() * 0.35,
          st: { farkles: 0, best: 0, hot: 0, maxHotTurn: 0, lostMax: 0, banks: 0 } };
      }),
      cur: 0, round: 1, phase: 'start', dice: freshDice(), turn: 0, sets: [], hot: 0, rolls: 0,
      final: null, finalLeft: 0, rounds: [cfg.players.map(function () { return 0; })], ev: [], started: Date.now()
    };
    Kit.gameStart();
    save(); render(); maybeCpu();
  }

  // ── Dice layout: six spots on the felt, scattered like real dice ─────────
  function scatter(idx) {
    // 3×2 grid with jitter; leave the top-right corner for the cup
    var slots = [[17, 30], [42, 26], [66, 34], [20, 73], [47, 72], [74, 72]];
    var order = slots.map(function (s, i) { return i; }).sort(function () { return Math.random() - .5; });
    idx.forEach(function (di, k) {

      sets.appendChild(g);
    });
    ledge.appendChild(sets);
    felt.appendChild(ledge);
    table.appendChild(felt);
    app.appendChild(table);

    // Readout
    var ss = S.phase === 'pick' ? selScore() : 0;
    var whoTxt = !live ? 'Game over' : p.cpu ? p.name + (S.phase === 'start' ? ' is up' : ' is thinking') : S.players.length === 1 ? 'Round ' + S.round : Kit.poss(p.name) + ' turn';
    var why = '';
    if (live && !p.cpu) {
      if (S.phase === 'start') why = S.hot ? '' : 'Roll all six dice';
      else if (S.phase === 'pick') {
        var restN = liveIdx().length - sel.length;
        why = !sel.length ? 'Tap the dice to keep: 1s, 5s or three of a kind'
          : ss > 0 ? (restN ? 'Roll the other ' + restN + ' to push your luck, or bank your points' : 'Hot dice! Roll all six again, or bank')
          : 'Tap a die again to put it back';
      }
    }
    if (live && S.rules.entry && !p.on && S.phase === 'pick' && ss > 0 && S.turn + ss < S.rules.entry) why = 'Need ' + fmt(S.rules.entry) + ' in one turn to get on the board';
    var em = el('em', { text: ss > 0 ? '+' + fmt(ss) + ' kept' : '' });
    if (sel.length && ss <= 0) em.classList.add('no');
    app.appendChild(el('div', { class: 'readout' }, [
      el('div', { style: { minWidth: 0 } }, [
        el('div', { class: 'who', style: { '--c': p.color }, html: '<span class="dot"></span><span>' + Kit.esc(whoTxt) + '</span>' + (p.cpu && live && S.phase !== 'farkle' ? ' <span class="think"><i></i><i></i><i></i></span>' : '') }),
        el('div', { class: 'why', text: why })
      ]),
      el('div', { class: 'tscore' }, [el('small', { text: 'This turn' }), el('b', { text: fmt(S.turn + Math.max(0, ss)) }), em])
    ]));

    // Buttons
    var left = liveIdx().length - sel.length; if (S.phase === 'pick' && left === 0 && ss > 0) left = 6;
    var rollLbl = S.phase === 'start' ? 'Roll 6 dice' : S.phase === 'pick' ? (ss > 0 ? 'Roll ' + left + (left === 1 ? ' die' : ' dice') : 'Keep dice first') : 'Roll';
    var rollSub = S.phase === 'pick' && ss > 0 && liveIdx().length === sel.length ? 'hot dice!' : '';
    var rb = el('button', { type: 'button', class: 'btn btn-primary', onclick: function () { roll(); } }, [el('span', { text: rollLbl }), rollSub ? el('small', { text: rollSub }) : null]);
    var need = S.rules.entry && !p.on && S.turn + ss < S.rules.entry;
    var bb = el('button', { type: 'button', class: 'btn bank', onclick: function () { bank(); } }, [
      el('span', { text: S.phase === 'pick' && ss > 0 ? 'Bank ' + fmt(S.turn + ss) : 'Bank' }),
      need && S.phase === 'pick' ? el('small', { text: 'need ' + fmt(S.rules.entry) }) : null
    ]);
    rb.disabled = !mine || !canRoll(); bb.disabled = !mine || !canBank();
    if (live) app.appendChild(el('div', { class: 'acts' }, [rb, bb]));
    app.appendChild(el('div', { class: 'rulechip' }, [
      document.createTextNode('To ' + fmt(S.rules.target) + (S.rules.entry ? ' · ' + fmt(S.rules.entry) + ' to get on' : '') + (S.rules.dbl ? ' · doubling' : '') + ' · '),
      el('button', { type: 'button', text: 'Scoring chart', onclick: chart })
    ]));
  }

  function tapDie(i) {
    if (!S || lock || S.phase !== 'pick' || P().cpu) return;
    var d = S.dice[i]; if (d.kept) return;
    var info = tableInfo();
    if (!canScore(i, info)) {
      var dn = app.querySelector('.spot[data-i="' + i + '"] .die');
      if (dn) { dn.classList.remove('nope'); void dn.offsetWidth; dn.classList.add('nope'); }
      Kit.sfx('bad'); Kit.haptic('error');
      Kit.toast(d.v + 's only score as three of a kind', 1800);
      return;
    }
    var on = !d.sel, group;
    if (info.whole) group = info.live;                                   // straight, three pairs…
    else if (d.v !== 1 && d.v !== 5) group = info.live.filter(function (j) { return S.dice[j].v === d.v; });   // the whole set
    else group = [i];
    group.forEach(function (j) { S.dice[j].sel = on; });
    Kit.sfx(on ? 'pop' : 'tap'); Kit.haptic('light');
    save(); render();
  }

  function chart() {
    var dbl = S ? S.rules.dbl : false;
    function mini(vs) { return '<span class="mini">' + vs.map(function (v) { return Kit.die(v).outerHTML.replace('<button', '<span').replace('</button>', '</span>'); }).join('') + '</span>'; }
    var rows = [
      [[1], 'Single 1', 100], [[5], 'Single 5', 50],
      [[2, 2, 2], 'Three 2s', 200], [[3, 3, 3], 'Three 3s', 300], [[4, 4, 4], 'Three 4s', 400], [[5, 5, 5], 'Three 5s', 500], [[6, 6, 6], 'Three 6s', 600], [[1, 1, 1], 'Three 1s', 1000],
      [[4, 4, 4, 4], 'Four of a kind', dbl ? '2 × three' : 1000], [[4, 4, 4, 4, 4], 'Five of a kind', dbl ? '4 × three' : 2000], [[4, 4, 4, 4, 4, 4], 'Six of a kind', dbl ? '8 × three' : 3000],
      [[1, 2, 3, 4, 5, 6], 'Straight', 1500], [[2, 2, 3, 3, 6, 6], 'Three pairs', 1500], [[3, 3, 3, 3, 2, 2], 'Four of a kind + pair', 1500]
    ];
    if (!dbl) rows.push([[2, 2, 2, 6, 6, 6], 'Two triplets', 2500]);
    var html = '<table class="sctbl">' + rows.map(function (r) { return '<tr><td>' + mini(r[0]) + '</td><td>' + r[1] + '</td><td>' + (typeof r[2] === 'number' ? fmt(r[2]) : r[2]) + '</td></tr>'; }).join('') + '</table>';
    Kit.sheet({ title: 'Scoring chart', html: html, actions: [{ label: 'Got it', primary: true }] });
  }

  // Test hooks
  window.__farkle = {
    state: function () { return S; }, speed: function (x) { SPD = x; }, lock: function () { return lock; },
    scoreOf: scoreOf, hasScore: hasScore, plan: function () { return cpuPlan(); }
  };

  // ── Boot ─────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved && saved.players && saved.players.length && saved.phase !== 'over') {
    S = saved; lock = false;
    if (S.phase === 'banked') { endTurn(); }
    else if (S.phase === 'farkle') { applyFarkle(); render(); later(endTurn, 900); }
    else { render(); maybeCpu(); }
  } else showSetup();
})();
</script>
</body>
</html>

  box-shadow:inset 0 1px 0 rgba(255,246,216,.08),0 10px 30px rgba(0,0,0,.45),0 0 18px rgba(227,189,98,.1);
  animation:giltedge 14s ease-in-out infinite;}
@keyframes giltedge{0%,100%{background-position:left 0 top 0,right 0 top 0,left 0 bottom 0,right 0 bottom 0,0 0,0 0,0% 0%;}50%{background-position:left 0 top 0,right 0 top 0,left 0 bottom 0,right 0 bottom 0,0 0,0 0,100% 100%;}}
@media (prefers-reduced-motion:reduce){.lz-info{animation:none;}}

.lz-info .ver{font-family:var(--serif);font-style:italic;color:var(--text-2);margin-top:1px;}
.lz-info .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
/* Stat plate in the card details */
.sp{--d1:color-mix(in srgb,var(--p1) 46%,#120d26);--d2:color-mix(in srgb,var(--p2) 46%,#120d26);display:flex;align-items:flex-start;gap:4px;margin-top:10px;padding:8px 10px 6px;border-radius:14px;
  /* the card's ink colour; two inks blend across a wide diagonal band in the middle */
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 55%,rgba(0,0,0,.18)),linear-gradient(135deg,var(--d1) 0%,var(--d1) 28%,var(--d2) 72%,var(--d2) 100%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--p1) 40%,#e3bd62),inset 0 1px 0 rgba(255,255,255,.15),0 4px 14px rgba(0,0,0,.3);}
.sp .sb small{color:rgba(255,255,255,.72);}
.sp .grp{display:flex;gap:4px;align-items:flex-start;}
.sp .mid{flex:1;display:flex;justify-content:center;min-width:0;}
.sp .grp:not(.r){gap:12px;}
.sp .grp.lc2{gap:8px;}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:40px;}
.sb .sh{position:relative;width:40px;height:40px;display:grid;place-items:center;}
.sb .sh > svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));}
.sb b{position:relative;font-family:var(--display);font-size:1.3rem;font-weight:400;line-height:1;color:#241a08;}
.sb-cost b,.sb-mv b{color:#f3ead2;font-size:1.15rem;}
.sb-mv b{margin-top:9px;font-size:1.05rem;color:#fff;}
.sb-s b{font-size:1.1rem;color:#1c1f26;}
.sb-w b{margin-top:-3px;color:#fff;}
.sb-l b{color:#f6e1a8;font-size:1rem;}
.sb small{max-height:0;opacity:0;overflow:hidden;transition:max-height .22s ease,opacity .18s;font-size:.58rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;}
.sb-cost[title="Inkable"] small{color:var(--gilt-2);}
.sb-ink .gems{display:flex;justify-content:center;width:auto;min-width:40px;}
.inkico{display:inline-block;flex:none;width:calc(var(--ih,16px) * .87);height:var(--ih,16px);background:url(lorcana-inks.webp) 0 0/600% 100% no-repeat;vertical-align:-.28em;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.55));}
.inkdots .inkico{--ih:16px;margin-right:2px;border-radius:0;box-shadow:none;}
.ink-chip .inkico{--ih:17px;margin-right:5px;}
.sb-ink .gems{height:40px;align-items:center;}
.sb-ink .inkico{--ih:24px;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.85)) drop-shadow(0 2px 3px rgba(0,0,0,.5));}
.sb-ink .inkico + .inkico{margin-left:-3px;}
.sb-ink .gems svg{position:relative;width:17px;height:17px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)) drop-shadow(0 0 6px color-mix(in srgb,var(--g) 60%,transparent));}
.sb.off{opacity:.16;}
.sp{cursor:pointer;-webkit-tap-highlight-color:transparent;}
/* Every 12 seconds a faint sheen in the card's own ink colour sweeps across the bar */
.sp{position:relative;overflow:hidden;isolation:isolate;}
.sp > *{position:relative;z-index:1;}
.sp::before{content:'';position:absolute;top:-20%;bottom:-20%;left:0;width:45%;z-index:0;pointer-events:none;transform:translateX(-120%) skewX(-20deg);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--p1) 55%,#fff6d8) 45%,color-mix(in srgb,var(--p2) 55%,#ffffff) 55%,transparent);opacity:.16;mix-blend-mode:screen;
  animation:spsheen 12s ease-in-out infinite;animation-delay:1.2s;}
@keyframes spsheen{0%{transform:translateX(-120%) skewX(-20deg);}15%,100%{transform:translateX(330%) skewX(-20deg);}}
@media (prefers-reduced-motion:reduce){.sp::before{animation:none;display:none;}}
.sp.cap .sb small{max-height:14px;opacity:1;}
/* The labels hang under their icons and take no width, so nothing moves when they're shown; the ink box
   hugs its symbol, so the rarity circle sits midway between the ink and the stats */
.sp{transition:padding-bottom .22s ease;}
.sp.cap{padding-bottom:24px;}
.sp .sb{position:relative;gap:0;}
.sp .sb small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-size:.5rem;letter-spacing:.02em;line-height:1.15;text-align:center;}
.sp.cap .sb small{max-height:24px;}
/* the ink name runs right, into the open space before the rarity */
.sp .sb-ink small{left:0;transform:none;text-align:left;}
.sp .sb-ink,.sp .sb-ink .gems{min-width:0;}
/* A second ink hangs off to the right without taking width, so the rarity stays put for dual-ink cards */
.sp .sb-ink .inkico + .inkico{margin-right:calc(3px - var(--ih) * .87);}
.sb.up b{color:#7dffa6;}.sb.dn b{color:#ff8a8a;}
.sb-s.up b{color:#0f7a37;}.sb-s.dn b{color:#c0262d;}
.sb.up .sh > svg{filter:drop-shadow(0 0 6px rgba(125,255,166,.9));}.sb.dn .sh > svg{filter:drop-shadow(0 0 6px rgba(255,107,107,.9));}
.tl{display:block;margin-top:7px;font-size:.82rem;font-weight:800;color:var(--text-2);letter-spacing:.01em;}
.tl span{display:block;}
.tl .cls-tap{all:unset;cursor:pointer;text-decoration:underline dotted rgba(246,220,149,.45);text-underline-offset:3px;text-decoration-thickness:1px;}
.tl .cls-tap:focus-visible{outline:2px solid var(--gilt);outline-offset:2px;border-radius:3px;}
.tl small{display:block;margin-top:2px;font-size:.72rem;font-weight:800;color:var(--text-3);}
.chipx{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);font-size:.78rem;font-weight:800;}
.chipx .dot{width:9px;height:9px;border-radius:50%;background:var(--c);}
.chipx svg{width:13px;height:13px;}
.chipx.warn{background:rgba(255,92,92,.18);color:#ffb3b3;}
.chipx.good{background:rgba(61,220,132,.16);color:#a5f3c5;}
.rtext{margin-top:10px;font-size:.95rem;line-height:1.45;}
.rtext p{margin:0 0 7px;}
.rtext .ab{font-weight:900;letter-spacing:.02em;}
.rtext b.em{font-weight:900;color:#fff6dc;}
.rtext b.em.kwe{color:var(--gilt-2);}
.rtext .abl{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px;}
.rtext .abl:first-child{margin-top:0;}
.rtext .abl .ab{flex:0 1 auto;min-width:0;font-size:.74rem;letter-spacing:.06em;line-height:1.25;color:#fff6e6;
  /* like the brown name plate on the cards, fading out just past the text */
  padding:3px 30px 3px 8px;margin-left:-8px;border-radius:4px 0 0 4px;background:linear-gradient(90deg,#6b4a2c 0,#5a3d22 calc(100% - 34px),rgba(90,61,34,0) 100%);text-shadow:0 1px 1px rgba(0,0,0,.4);}
.rtext .abl .ab:empty{display:none;}
.rtext .abl .setno{margin-left:auto;}
.rtext .abl .setno{flex:none;font-size:.74rem;font-weight:800;color:var(--text-3);letter-spacing:.02em;}
.rtext .abl + p{margin-top:0;}
.rtext .kw{font-weight:900;color:var(--gilt-2);}
.rtext .rem{color:var(--text-2);font-style:italic;}
.rtext .flav{font-family:var(--serif);font-style:italic;font-size:1.02rem;line-height:1.4;color:var(--text-2);}
.sym{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.17em;}
.lz-acts{margin-top:14px;}
.acts-row{display:flex;gap:8px;width:100%;}
.act{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:70px;padding:8px 6px 7px;border:0;border-radius:14px;cursor:pointer;
  color:#f6e1a8;background:linear-gradient(180deg,#3a2f63,#241c45 60%,#1b1536);box-shadow:inset 0 0 0 1.5px rgba(227,189,98,.55),inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 #120d26,0 8px 16px rgba(0,0,0,.35);
  transition:transform .12s,box-shadow .12s,filter .12s;}
.act:active{transform:translateY(3px);box-shadow:inset 0 0 0 1.5px rgba(227,189,98,.55),0 1px 0 #120d26,0 3px 8px rgba(0,0,0,.35);}
.act .ai{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(0,0,0,.25));box-shadow:inset 0 0 0 1px rgba(227,189,98,.45);}
.act .ai svg,.act .ai .ico{width:18px;height:18px;}
.act .al{display:block;max-width:100%;font-family:var(--display);font-size:1.02rem;line-height:1.05;color:#fff6dc;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.act small{display:block;max-width:100%;font-size:.7rem;font-weight:800;color:rgba(246,225,168,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.act.pri{color:#3a2400;background:linear-gradient(180deg,#fbe9b7,#e8c56f 45%,#c9973a);box-shadow:inset 0 0 0 1.5px #fff2c4,inset 0 -2px 0 rgba(120,80,10,.35),0 4px 0 #7a5413,0 8px 18px rgba(227,189,98,.35);}
.act.pri:active{box-shadow:inset 0 0 0 1.5px #fff2c4,0 1px 0 #7a5413,0 3px 8px rgba(227,189,98,.3);}
.act.pri .al{color:#2b1a00;}.act.pri small{color:rgba(58,36,0,.75);}
.act.pri .ai{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),rgba(167,122,38,.35));box-shadow:inset 0 0 0 1px rgba(122,84,19,.5);}
.acts-row.many .act{min-height:62px;padding:6px 3px;}
.acts-row.many .act .al{font-size:.86rem;}
.acts-row.many .act .ai{width:26px;height:26px;}
.lz-acts .why{font-size:.82rem;color:var(--text-3);text-align:center;margin-top:8px;}
.lz-x{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(var(--safe-t) + 10px);z-index:2;}
@media (min-width:900px) and (orientation:landscape){
  .lz-in{max-width:1000px;flex-direction:row;align-items:flex-start;justify-content:center;padding-top:calc(var(--safe-t) + 30px);}
  .lz-card{--cu:min(82vh,560px);}
  .lz-card.loc{--cu:min(60vw,70vh,620px);}
  .lz-info{max-width:430px;}
  .lz-flow{--cu:min(82vh,560px);width:auto;flex:none;}
  .lz-flow:has(.lz-side){--cu:min(74vh,500px);padding:0 calc(var(--cu) * .2);}
  .lz-flow:has(.lz-side) .lz-card{--cu:min(74vh,500px);}
  .lz-side.l1{transform:translateX(calc(var(--cu) * -.34)) rotateY(50deg) scale(.82);}
  .lz-side.r1{transform:translateX(calc(var(--cu) * .34)) rotateY(-50deg) scale(.82);}
  .lz-side.l2,.lz-side.r2{display:none;}
  .lz-flow{--fx:.34;}
  .lz-flow.strip{--cu:min(74vh,500px);width:calc(var(--cu) * 1.3);flex:none;padding:0;}
  /* Laptops and iPads in landscape: the strip gets most of the screen */
  .lz:has(.lz-flow.strip){align-items:center;}
  .lz-in:has(.lz-flow.strip){max-width:min(1700px,98vw);gap:20px;align-items:center;padding-top:calc(var(--safe-t) + 12px);padding-bottom:calc(var(--safe-b) + 34px);}
  .lz-flow.strip{--cu:min(calc(100vh - 90px),calc((98vw - 440px) / 1.45),900px);width:calc(var(--cu) * 1.45);--fx:.33;}
  .lz-in:has(.lz-flow.strip) .lz-info{max-width:380px;flex:none;width:380px;max-height:calc(100vh - 60px);overflow-x:hidden;overflow-y:auto;}
}

/* Sheets used by this game */
.tbx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tbx button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:66px;border:0;border-radius:14px;background:rgba(255,255,255,.07);color:var(--text);font-weight:800;font-size:.8rem;line-height:1.1;padding:6px 4px;text-align:center;}
.tbx button:active{transform:scale(.96);}
.tbx button svg{width:22px;height:22px;color:var(--gilt-2);}
.tbx-src{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.05);}
.tbx-src .mini{flex:none;width:52px;height:72px;border-radius:5px;background-size:cover;background-position:center;position:relative;overflow:hidden;}
.tbx-src .tx{font-size:.84rem;line-height:1.35;color:var(--text-2);}
.tbx-src .tx b{color:var(--text);}
/* Ability screens */
.abhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
.abhead .abart{flex:none;width:96px;aspect-ratio:.716;border-radius:7px;overflow:hidden;background:#1d1a2c;box-shadow:0 6px 18px rgba(0,0,0,.45);}
.abhead .abart img{width:100%;height:100%;object-fit:cover;display:block;}
.abhead .abtx{font-size:.88rem;line-height:1.4;color:var(--text-2);min-width:0;}
.abhead .abtx b{color:var(--text);display:block;}
.abhead .abn{font-family:var(--display);color:var(--gilt);font-size:.95rem;margin:3px 0 4px;}
.lz.modal .lz-info h2,.lz.reveal .lz-info h2{font-family:var(--display);}
.lz .abline{margin-top:8px;font-size:1rem;line-height:1.45;}
.lz-sub{margin-top:8px;color:var(--gilt);font-weight:800;font-size:.9rem;}
.lz-who{display:flex;align-items:center;gap:6px;font-weight:900;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px;}
.lz-who .dot{width:10px;height:10px;border-radius:50%;background:var(--c);}
.lz.reveal{cursor:pointer;flex-direction:column;align-items:center;justify-content:flex-start;}
.lz.reveal .lz-in{padding-top:6px;padding-bottom:8px;}
.rv-head{flex:none;width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:calc(var(--safe-t) + 14px) 16px 4px;pointer-events:none;}
.rv-who{display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);}
.rv-who .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);}
.rv-verb{position:relative;font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,7vw,2.5rem);line-height:1;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff4cf,#f1cf78 45%,#c9973a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(90,55,5,.65)) drop-shadow(0 0 14px rgba(246,196,80,.35));padding:0 30px;}
.rv-verb::before,.rv-verb::after{content:'';position:absolute;top:50%;width:22px;height:1.5px;background:linear-gradient(90deg,rgba(227,189,98,0),#e3bd62);}
.rv-verb::before{left:0;}
.rv-verb::after{right:0;transform:scaleX(-1);}
.rv-fx{margin-top:6px;padding:4px 14px;border-radius:999px;background:rgba(227,189,98,.12);box-shadow:inset 0 0 0 1px rgba(227,189,98,.35);color:#fff3d0;font-weight:800;font-size:.95rem;text-align:center;}
.rv-bar{flex:none;position:sticky;bottom:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:14px 16px calc(var(--safe-b) + 10px);background:linear-gradient(180deg,rgba(6,5,18,0),rgba(6,5,18,.92) 30%);}
.rv-row{display:flex;gap:10px;width:min(520px,100%);}
.rv-bar .rv-go{position:static;margin:0;flex:1.6;width:auto;}
.rv-skip{flex:1;min-height:52px;border:0;border-radius:14px;font-family:var(--display);font-size:1rem;color:#f6e1a8;cursor:pointer;background:linear-gradient(180deg,#3a2f63,#241c45);box-shadow:inset 0 0 0 1.5px rgba(227,189,98,.5),0 4px 0 #120d26;}
.rv-fast{flex:none;display:flex;align-items:center;gap:8px;margin:0;padding:4px 10px;border:0;border-radius:999px;background:rgba(10,8,28,.6);color:var(--text-2);font-size:.78rem;font-weight:700;cursor:pointer;}
.rv-fast .sw{position:relative;width:28px;height:16px;border-radius:8px;background:rgba(255,255,255,.18);flex:none;transition:background .2s;}
.rv-fast .sw::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s;}
.rv-fast.on .sw{background:var(--gilt);}
.rv-fast.on .sw::after{transform:translateX(12px);}
.rv-also{margin-bottom:6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--text-2);font-size:.82rem;text-align:center;max-width:100%;}
.rv-also b{font-family:var(--display);font-weight:400;letter-spacing:.04em;text-transform:uppercase;color:#f1cf78;margin-right:4px;}
.rv-also span{margin-left:4px;}
.lz-feed{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);transform:translateX(-50%);z-index:425;width:min(520px,calc(100% - 128px));display:flex;flex-direction:column;gap:4px;pointer-events:none;
  padding:8px 12px;border-radius:16px;background:linear-gradient(180deg,rgba(42,33,82,.94),rgba(26,20,56,.94));box-shadow:inset 0 0 0 1.5px rgba(227,189,98,.4),0 8px 22px rgba(0,0,0,.5);color:#fff3d0;font-size:.8rem;}
.lz.has-feed .lz-in{padding-top:calc(var(--safe-t) + var(--feedh,96px) + 22px);transition:padding-top .2s;}
.lzf-st{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.lzf-st > b{font-family:var(--display);font-weight:400;letter-spacing:.04em;color:#f1cf78;}
.lzf-st > span{color:var(--text-3);font-weight:800;}
.lzf-st .lzf-l{margin-left:auto;color:#fff3d0;display:inline-flex;align-items:center;gap:5px;}
.lzf-st .lzf-l b{color:#f1cf78;font-size:.9rem;}
.lzf-st .lzf-l em{font-style:normal;color:var(--text-3);}
.lzf-ev{display:flex;flex-direction:column;gap:2px;}
.lzf-e{display:flex;align-items:center;gap:7px;min-width:0;opacity:.75;animation:tickIn .28s var(--spring);}
.lzf-e:last-child{opacity:1;}
.lzf-e b{font-family:var(--display);font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:#f1cf78;flex:none;}
.lzf-e span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.lz-feed .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;}
@media (max-width:420px){.lz-feed{width:calc(100% - 112px);}}
.rv-ticks{position:fixed;left:50%;top:calc(var(--safe-t) + 64px);transform:translateX(-50%);z-index:430;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 24px));}
.rv-tick{display:flex;align-items:center;gap:8px;max-width:100%;padding:8px 14px;border-radius:999px;background:linear-gradient(180deg,#2a2152,#1a1438);box-shadow:inset 0 0 0 1.5px rgba(227,189,98,.45),0 8px 22px rgba(0,0,0,.5);color:#fff3d0;font-size:.85rem;animation:tickIn .28s var(--spring);}
.rv-tick b{font-family:var(--display);font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:#f1cf78;}
.rv-tick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rv-tick .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;}
.rv-tick.out{opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s;}
@keyframes tickIn{from{opacity:0;transform:translateY(-8px) scale(.96);}}
.rv-go{flex:none;position:sticky;bottom:calc(var(--safe-b) + 14px);z-index:300;width:min(460px,calc(100% - 32px));min-height:52px;margin:4px 16px calc(var(--safe-b) + 14px);border:0;border-radius:14px;font-family:var(--display);font-size:1.15rem;color:#2b1a00;cursor:pointer;
  background:linear-gradient(180deg,#fbe9b7,#e8c56f 45%,#c9973a);box-shadow:inset 0 0 0 1.5px #fff2c4,inset 0 -2px 0 rgba(120,80,10,.35),0 4px 0 #7a5413,0 8px 18px rgba(227,189,98,.3);}
.rv-go:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px #fff2c4,0 2px 0 #7a5413;}
.lz.reveal .lz-card{--cu:min(46vh,118vw,620px);}
.lz.reveal .lz-info{padding:12px 16px;}
.lz.reveal .lz-info .rtext{max-height:22vh;overflow:hidden;}
.lz-tap{margin-top:10px;text-align:center;font-size:.82rem;font-weight:800;color:var(--text-3);animation:tapPulse 1.6s ease-in-out infinite;}
@keyframes tapPulse{50%{opacity:.45;}}
@media (min-width:900px) and (orientation:landscape){.lz.reveal .lz-card{--cu:min(68vh,640px);}}
.lp-pick .pk-art{flex:none;border:0;padding:0;background:none;width:30px;height:42px;border-radius:4px;overflow:hidden;}
.lp-pick .pk-art .mini{display:block;width:100%;height:100%;background-size:cover;background-position:center;}
.slot.abfire .lc{animation:abfire 1.15s ease-out;}
@keyframes abfire{0%{box-shadow:0 0 0 0 rgba(246,225,168,.95);transform:rotate(var(--rot,0deg)) scale(1);}35%{box-shadow:0 0 0 4px #f6e1a8,0 0 30px 10px rgba(246,196,80,.75);transform:rotate(var(--rot,0deg)) scale(1.07);}100%{box-shadow:0 0 0 0 rgba(246,225,168,0);transform:rotate(var(--rot,0deg)) scale(1);}}
.abtag{position:fixed;z-index:300;pointer-events:none;transform:translate(-50%,0);white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;padding:5px 12px;border-radius:999px;background:linear-gradient(180deg,#5a3d06,#2c1d02);border:1.5px solid #e3bd62;color:#f6e1a8;font-family:var(--display);font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.6),0 0 18px rgba(246,196,80,.35);animation:abtag 1.7s var(--ease) forwards;}
@keyframes abtag{0%{opacity:0;transform:translate(-50%,6px) scale(.8);}15%{opacity:1;transform:translate(-50%,-18px) scale(1);}75%{opacity:1;transform:translate(-50%,-30px);}100%{opacity:0;transform:translate(-50%,-44px);}}
.spark{position:fixed;z-index:310;pointer-events:none;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle,#fff 0,#f6e1a8 35%,rgba(246,196,80,0) 70%);box-shadow:0 0 14px 6px rgba(246,196,80,.7);transition:transform .34s cubic-bezier(.5,0,.3,1),opacity .34s;}
.fxnum{position:fixed;z-index:305;pointer-events:none;transform:translate(-50%,0);font-family:var(--display);font-size:1.55rem;font-weight:700;white-space:nowrap;text-shadow:0 2px 6px #000,0 0 2px #000;animation:fxnum 1.3s var(--ease) forwards;}
.fxnum.dmg{color:#ff7b7b;}.fxnum.heal{color:#7dffa6;}.fxnum.buff{color:#f6e1a8;font-size:1.15rem;}.fxnum.debuff{color:#9ec8ff;font-size:1.15rem;}
@keyframes fxnum{0%{opacity:0;transform:translate(-50%,8px) scale(.6);}18%{opacity:1;transform:translate(-50%,-6px) scale(1.15);}70%{opacity:1;transform:translate(-50%,-26px) scale(1);}100%{opacity:0;transform:translate(-50%,-44px);}}
.slot.glowg .lc{box-shadow:0 0 0 3px #7dffa6,0 0 22px 6px rgba(125,255,166,.55);transition:box-shadow .3s;}
.slot.glowb .lc{box-shadow:0 0 0 3px #f6e1a8,0 0 22px 6px rgba(246,196,80,.5);transition:box-shadow .3s;}
.flyer.burn{animation:burn .85s ease-in forwards;}
@keyframes burn{0%{filter:none;}25%{filter:brightness(1.9) sepia(.7) saturate(2.2);transform:scale(1.05);}100%{filter:brightness(2.4) sepia(1) blur(7px);opacity:0;transform:scale(1.12) translateY(-10px);}}
.ember{position:fixed;z-index:251;pointer-events:none;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;background:#ffcf6b;box-shadow:0 0 8px 2px rgba(255,140,40,.8);opacity:0;animation:ember 1s ease-out forwards;}
@keyframes ember{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3);}}
.sugg{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.sugg .btn{justify-content:flex-start;text-align:left;min-height:46px;font-size:.92rem;}
.tb-form{display:flex;flex-direction:column;gap:12px;}
.tb-row{display:flex;align-items:center;gap:10px;}
.tb-row .label{margin:0;flex:1;}
.who2{display:flex;gap:6px;}
.lp-list{display:flex;flex-direction:column;gap:6px;}
/* Status tokens on a card's details (Ready, Exerted, Drying, damage, effects) */
.stts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.stt{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 5px;border-radius:999px;font-size:.78rem;font-weight:800;letter-spacing:.01em;line-height:1.2;color:#efe6ff;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px rgba(227,189,98,.28);}
.stt i{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-style:normal;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px currentColor;}
.stt i svg{width:15px;height:15px;}
.stt.s-rdy{color:#a8f0c0;box-shadow:inset 0 0 0 1px rgba(125,240,166,.45),0 0 10px rgba(125,240,166,.12);}
.stt.s-exd{color:#f3c39a;box-shadow:inset 0 0 0 1px rgba(240,160,100,.45);}
.stt.s-exd i svg{transform:rotate(-8deg);}
.stt.s-wet{color:#d9ecff;}
.stt.s-wet i{color:var(--ic);background:color-mix(in srgb,var(--ic) 22%,transparent);}
.stt.s-dmg{color:#ffc9c9;}
.stt.s-dmg i{background:radial-gradient(circle at 35% 30%,#ff8a8a,#c0262d);box-shadow:0 0 0 1.5px #ffd2d2,0 2px 4px rgba(0,0,0,.4);color:#fff;}
.stt.s-dmg i b{font-family:var(--display);font-size:.85rem;font-weight:400;}
.stt.s-loc,.stt.s-und{color:#f6e1a8;}
.stt.s-good{color:#f6e1a8;box-shadow:inset 0 0 0 1px rgba(227,189,98,.55);}
.stt.s-bad{color:#b9d6ff;box-shadow:inset 0 0 0 1px rgba(140,180,255,.45);}
/* ── Dialogs in Lorcana: gilded, like the card views ── */
html.lorc .k-sheet{background:radial-gradient(120% 60% at 50% 0,rgba(227,189,98,.13),rgba(227,189,98,0) 60%),linear-gradient(180deg,#272050,#1a1438 55%,#140f2c);
  box-shadow:0 -14px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(246,225,168,.55),inset 0 0 0 1px rgba(227,189,98,.18);}
html.lorc .k-sheet .grab{background:linear-gradient(90deg,rgba(227,189,98,.2),#e3bd62,rgba(227,189,98,.2));height:4px;}
html.lorc .k-sheet h2{font-family:var(--serif);font-weight:700;font-size:1.45rem;color:#fff6dc;text-align:center;margin-bottom:14px;padding-bottom:12px;
  background:linear-gradient(90deg,rgba(227,189,98,0),rgba(227,189,98,.7) 30%,rgba(227,189,98,.7) 70%,rgba(227,189,98,0)) center bottom/80% 1px no-repeat;position:relative;}
html.lorc .k-sheet h2::after{content:'';position:absolute;left:50%;bottom:-4px;width:8px;height:8px;margin-left:-4px;background:#e3bd62;transform:rotate(45deg);box-shadow:0 0 6px rgba(246,196,80,.8);}
html.lorc .k-sheet .k-acts .btn{min-height:52px;border-radius:14px;font-family:var(--display);font-size:1.1rem;font-weight:400;letter-spacing:.01em;}
html.lorc .k-sheet .k-acts .btn-primary,html.lorc .k-sheet .da-name .btn-primary{color:#2b1a00;background:linear-gradient(180deg,#fbe9b7,#e8c56f 45%,#c9973a);box-shadow:inset 0 0 0 1.5px #fff2c4,inset 0 -2px 0 rgba(120,80,10,.35),0 4px 0 #7a5413,0 8px 18px rgba(227,189,98,.3);}
html.lorc .k-sheet .k-acts .btn-soft,html.lorc .k-sheet .k-acts .btn-ghost,html.lorc .k-sheet .da-name .btn-soft{color:#f6e1a8;background:linear-gradient(180deg,#3a2f63,#241c45);box-shadow:inset 0 0 0 1.5px rgba(227,189,98,.5),0 4px 0 #120d26;}
/* The Filters sheet: comes up higher, Clear all and Done side by side and a little shorter, so more of the
   filters (down to the keywords) show straight away */
html.lorc .k-sheet.fsheet{max-height:95vh;max-height:95dvh;}
html.lorc .k-sheet.fsheet .k-acts{flex-direction:row;gap:10px;margin-top:12px;}
html.lorc .k-sheet.fsheet .k-acts .btn{min-height:44px;padding-top:0;padding-bottom:0;}
html.lorc .k-sheet.fsheet .k-acts .btn-clear{flex:0 0 36%;}
html.lorc .k-sheet.fsheet .k-acts .btn-primary{flex:1;}
html.lorc .k-sheet .k-acts{position:sticky;background:linear-gradient(180deg,rgba(20,15,44,0),#140f2c 30%);}
html.lorc .k-sheet .lp-li,html.lorc .k-sheet .dk-opt{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(227,189,98,.16);border-radius:14px;}
html.lorc .k-sheet .lp-li.on,html.lorc .k-sheet .st-row.on,html.lorc .k-sheet .dk-opt.on{box-shadow:inset 0 0 0 2px var(--gilt),0 0 14px rgba(227,189,98,.25);}
html.lorc .k-sheet .dk-h{color:var(--gilt);font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:1rem;}
/* Add-to-deck dialog */
.da{display:flex;flex-direction:column;gap:8px;}
.da-head{display:flex;align-items:center;gap:12px;padding:4px 2px 10px;}
.da-art{flex:none;width:46px;height:64px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1.5px rgba(227,189,98,.6),0 6px 14px rgba(0,0,0,.5);}
.da-art .mini{display:block;width:100%;height:100%;background-size:cover;background-position:center 20%;}
.da-head b{display:block;font-family:var(--serif);font-size:1.15rem;color:#fff6dc;line-height:1.15;}
.da-head i{display:block;font-family:var(--serif);color:var(--text-2);}
.da-head small{display:block;margin-top:3px;font-size:.75rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--gilt);}
.da-row{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));box-shadow:inset 0 0 0 1px rgba(227,189,98,.16);transition:box-shadow .2s;}
.da-row.in{box-shadow:inset 0 0 0 1.5px rgba(227,189,98,.75),0 0 16px rgba(227,189,98,.15);}
.da-row .grow{min-width:0;}
.da-row b{display:block;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.da-row small{font-size:.75rem;font-weight:800;color:var(--text-3);}
.da-ink{flex:none;display:flex;justify-content:center;width:38px;}
.da-ink .inkico{--ih:22px;}
.da-ink .inkico + .inkico{margin-left:-5px;}
/* Casual decks with 3+ inks: small gems in a tidy block instead of a long row */
.da-ink .inkdots:has(.inkico:nth-child(3)){display:grid;grid-template-columns:repeat(3,14px);gap:2px;}
.da-ink .inkdots:has(.inkico:nth-child(3)) .inkico{--ih:14px;margin:0;}
.da-pips{flex:none;display:flex;gap:3px;}
.da-pips i{width:9px;height:13px;border-radius:2px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(227,189,98,.35);}
.da-pips i.on{background:linear-gradient(160deg,#fbe9b7,#e3bd62 50%,#a77a26);box-shadow:0 0 6px rgba(246,196,80,.6);}
.da-q{flex:none;display:flex;gap:6px;}
.coin{width:38px;height:38px;border:0;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.35rem;line-height:1;cursor:pointer;
  color:#f6e1a8;background:radial-gradient(circle at 35% 30%,#4a3d7c,#251d48);box-shadow:inset 0 0 0 1.5px rgba(227,189,98,.6),0 3px 0 #120d26;transition:transform .1s;}
.coin.add{color:#2b1a00;background:radial-gradient(circle at 35% 30%,#fff1c4,#e3bd62 55%,#b8862a);box-shadow:inset 0 0 0 1.5px #fff2c4,0 3px 0 #7a5413;}
.coin:active{transform:translateY(2px);}
.coin:disabled{opacity:.3;cursor:default;}
.da-new{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;margin-top:4px;border-radius:14px;border:1.5px dashed rgba(227,189,98,.55);background:rgba(227,189,98,.05);color:#f6e1a8;font-weight:900;font-size:.98rem;cursor:pointer;}
.da-new .ico{width:18px;height:18px;}
.da-name{margin-top:4px;padding:12px;border-radius:14px;border:1.5px solid rgba(227,189,98,.55);background:rgba(227,189,98,.06);}
.da-name .label{font-size:.78rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--gilt);margin-bottom:8px;}
.da-name .row{display:flex;gap:8px;align-items:center;}
.da-name .input{flex:1;min-width:0;min-height:44px;}
.da-name .btn{min-height:44px;border-radius:12px;font-family:var(--display);font-weight:400;}
.da-name .input:focus{outline:none;border-color:var(--gilt);box-shadow:0 0 0 3px rgba(227,189,98,.25);}
@media (max-width:420px){.da-name .row{flex-wrap:wrap;}.da-name .input{flex-basis:100%;}.da-name .btn{flex:1;}}
.lp-li{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;background:rgba(255,255,255,.05);}
.lp-li .mini{flex:none;width:40px;height:56px;border-radius:4px;background-size:cover;background-position:center 15%;position:relative;overflow:hidden;}
.lp-li .grow{min-width:0;}
.lp-li .grow b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lp-li .grow small{display:block;font-size:.75rem;color:var(--text-3);}
.lp-li .btn{min-height:36px;padding:0 10px;font-size:.8rem;}
.lp-li .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.lp-li.wrap{flex-wrap:wrap;}
.lp-li.wrap > .seg,.lp-li.wrap > .acts{flex:1 1 100%;justify-content:flex-start;}

/* Mulligan */
.mull{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;background:rgba(5,8,28,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
.mull h2{font-family:var(--display);font-weight:400;font-size:1.5rem;text-align:center;}
.mull p{color:var(--text-2);font-weight:700;font-size:.88rem;text-align:center;max-width:420px;}
.mull .cards{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:820px;}
.mull .slot.out .lc{filter:brightness(.45) grayscale(.6);transform:translateY(8px);}
.mull .slot.out::after{content:"Put back";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);padding:3px 8px;border-radius:8px;background:#ff5c6c;color:#fff;font-size:.72rem;font-weight:900;white-space:nowrap;z-index:2;pointer-events:none;}
.mull .btn{min-width:220px;}
.mull .mcard{display:flex;flex-direction:column;align-items:center;gap:5px;}
.mull .mtog{border:0;border-radius:999px;padding:5px 10px;font:inherit;font-size:.74rem;font-weight:900;background:rgba(255,255,255,.12);color:var(--text);white-space:nowrap;}
.mull .mtog.on{background:#ff5c6c;color:#fff;}
.mull .slot.out::after{display:none;}

/* Loading / offline */
.lp-load{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:60vh;padding:24px;text-align:center;}
.lp-load .spin{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:var(--gilt);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.libline{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);font-size:.85rem;font-weight:700;color:var(--text-2);}
.libline .ico{color:var(--gilt);}
.libline.err{background:rgba(255,77,94,.12);color:#ffc0c6;}
.libline .grow{flex:1;min-width:0;}
.libline .btn{min-height:36px;}

/* Deck pick + deck builder */
.dk{max-width:720px;margin:0 auto;padding:4px 16px calc(var(--safe-b) + 24px);display:flex;flex-direction:column;gap:12px;}
.dk h1{font-family:var(--display);font-weight:400;font-size:1.7rem;}
.dk-seat{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-sm);}
.dk-seat .grow{min-width:0;flex:1;}
.dk-seat b{display:block;}

      '<h3>Playing on this screen</h3><ul>' +

      '<h3>Keywords (done for you)</h3><ul>' +
      '<li><b>Evasive:</b> only Evasive characters can challenge it. <b>Alert:</b> can challenge Evasive characters.</li>' +
      '<li><b>Bodyguard:</b> may enter play exerted; opponents must challenge a Bodyguard first if they can.</li>' +
      '<li><b>Ward:</b> opponents can’t choose it with effects (only challenge it).</li>' +
      '<li><b>Rush:</b> can challenge the turn it’s played. <b>Reckless:</b> can’t quest and must challenge if it can.</li>' +
      '<li><b>Challenger +N:</b> stronger while challenging. <b>Resist +N:</b> takes N less damage.</li>' +

      '<h3>Card abilities</h3><p>Card abilities work by themselves. When you play a character its “when you play” ability goes off, questing sets off “whenever this character quests”, and the same for challenges, banishing, and the start and end of your turn. Always-on abilities (like “your other characters get +1 strength”) change the numbers on the table. Paid abilities (like “exert, 2 ink: draw a card”) show up as a button on the card when you can afford them.</p>' +

      seats.appendChild(el('div', { class: 'dk-seat' }, [
        el('span', { class: 'avatar', style: { '--c': Kit.color(0) }, text: (me.name || '?').charAt(0).toUpperCase() }),
        el('div', { class: 'grow' }, [el('b', { text: me.name || 'Who’s playing?' }), el('small', { text: 'Your name at the table' })]),
        el('button', { type: 'button', class: 'btn btn-soft btn-sm', text: me.name ? 'Change' : 'Pick', onclick: function () { Kit.pickName(function (n) { me.name = n; keep(); paint(); }); } })]));
      var lab = choiceLabel(me.deck);
      seats.appendChild(el('div', { class: 'dk-seat' }, [
        el('span', { class: 'avatar', style: { '--c': 'var(--gilt)' }, html: Kit.icon('cards') }),
        el('div', { class: 'grow' }, [el('b', { text: lab.name }), el('small', { html: (lab.inks.length ? inkDots(lab.inks) + ' ' : '') + esc(lab.sub) })]),
        el('button', { type: 'button', class: 'btn btn-soft btn-sm', text: 'Change', onclick: function () { pickDeck({ name: me.name || 'you' }, me.deck, function (ch) { me.deck = ch; keep(); paint(); }, showLobby); } })]));
    }
    paint();
    wrap.appendChild(seats);
    var sub = function () { if (!seats.isConnected) { DB.subs.splice(DB.subs.indexOf(sub), 1); return; } paint(); };
    DB.subs.push(sub);
    wrap.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-lg btn-block', text: 'Open a table', onclick: function () { netHost(me); } }));
    wrap.appendChild(el('h2', { class: 'net-h', text: 'Tables waiting for a player' }));
    var rooms = el('div', { class: 'stack' }, [el('p', { class: 'net-note', text: 'Looking for open tables…' })]);
    wrap.appendChild(rooms);
    var code = el('input', { class: 'input', type: 'text', maxlength: '4', placeholder: 'Code', 'aria-label': 'Table code', autocapitalize: 'characters', autocomplete: 'off', spellcheck: 'false' });
    wrap.appendChild(el('div', { class: 'net-join' }, [code, el('button', { type: 'button', class: 'btn btn-soft', text: 'Join with code', onclick: function () { netJoin(code.value, me); } })]));
    window.scrollTo(0, 0);
    netDb().then(function (db) {
      if (ui.screen !== 'lobby' || !rooms.isConnected) return;
      NET.lobbyOff = roomCol(db).where('status', '==', 'waiting').limit(40).onSnapshot(function (qs) {
        if (!rooms.isConnected) { lobbyOff(); return; }
        var list = [];
        qs.forEach(function (doc) { var d = doc.data(); if (d.host && d.host.dev !== NET.dev && Date.now() - (d.at || 0) < 6 * 3600e3) list.push({ code: doc.id, d: d }); });
        list.sort(function (a, b) { return (b.d.at || 0) - (a.d.at || 0); });
        rooms.innerHTML = '';
        if (!list.length) rooms.appendChild(el('p', { class: 'net-note', text: 'No open tables yet. When the other player opens one, it shows up here.' }));
        list.forEach(function (r) {
          var dk = {}; try { dk = JSON.parse(r.d.host.deck); } catch (e) {}
          var inks = DB.status === 'ready' && dk.cards ? deckInks(dk.cards) : [];
          rooms.appendChild(el('div', { class: 'net-room' }, [
            el('span', { class: 'avatar', style: { '--c': Kit.color(1) }, text: (r.d.host.name || '?').charAt(0).toUpperCase() }),
            el('div', { class: 'grow' }, [el('b', { text: r.d.host.name + '’s table' }), el('small', { html: (inks.length ? inkDots(inks) + ' ' : '') + esc((dk.name || 'Deck') + ' · code ' + r.code) })]),
            el('button', { type: 'button', class: 'btn btn-primary btn-sm', text: 'Join', onclick: function () { netJoin(r.code, me); } })]));
        });
      }, function (e) { rooms.innerHTML = ''; rooms.appendChild(el('p', { class: 'net-note', text: 'Couldn’t reach the tables: ' + (e.message || e) })); });
      setTimeout(maybeNewPack, 900);
    }).catch(function (e) { rooms.innerHTML = ''; rooms.appendChild(el('p', { class: 'net-note', text: 'Couldn’t reach the tables: ' + (e.message || e) })); });
  }

  // ═════════════════════════════════════════════════════════════════════════
  // Boot
  // ═════════════════════════════════════════════════════════════════════════
  function resumeFlow() {
    if (!S) return;
    handing = false; finishing = false; ui.pick = null; ui.screen = 'game'; ui.phaseIx = null;
    if (S.phase === 'mull') {
      if (S.mode === 'pass') S.viewer = -1;
      render(); later(mullNext, 500); return;
    }
    if (S.phase !== 'play') return;
    var w = winner(); if (w) { render(); finish(w); return; }
    if (S.step === 'begin') { render(); startTurn(); return; }
    if (S.step === 'ending') { render(); endTurn(); return; }
    if (S.mode === 'pass') S.viewer = -1;
    if (S.mode === 'online') S.viewer = NET.seat;
    render();
    afterBegin();
  }
  var rz = 0;
  window.addEventListener('resize', function () {
    if (rz) return;
    rz = requestAnimationFrame(function () { rz = 0; if (S && ui.screen === 'game') render(); else layoutVars(); });
  });
  DB.load();
  // Motion for the card sheen: ask as soon as Lorcana opens. iPhone only allows the prompt from a tap,
  // so it appears on the first tap anywhere in the game (once; a yes is remembered).
  (function () {
    if (typeof DeviceOrientationEvent === 'undefined' || typeof DeviceOrientationEvent.requestPermission !== 'function') { listenOrient(); return; }
    if (lsGet('lorc_tilt', 0)) {
      listenOrient();
      // iPhone can forget the yes between pages (the home screen asked): if no motion arrives, ask again on the
      // first tap. When it's already allowed, iPhone answers straight away without showing anything.
      setTimeout(function () {
        if (tiltT.got) return;
        var again = function () { document.removeEventListener('touchend', again, true); document.removeEventListener('click', again, true); tiltT.asked = false; askOrient(); };
        document.addEventListener('touchend', again, true); document.addEventListener('click', again, true);
      }, 1500);
      return;
    }
    if (lsGet('lorc_tilt_asked', 0)) return;   // already asked when Lorcana was tapped on the home screen
    // opened some other way (a saved link): ask on the first tap instead
    var go = function () { document.removeEventListener('touchend', go, true); document.removeEventListener('click', go, true); askOrient(); };
    document.addEventListener('touchend', go, true); document.addEventListener('click', go, true);
  })();
  (function () {
    var q = new URLSearchParams(location.search), saved = lsGet(SAVE, null);
    if (q.get('mode')) ui.launchMode = q.get('mode') === 'pass' ? 'pass' : 'cpu';
    if (q.get('online')) {
      var mine = lsGet(NETK, null);
      if (mine && mine.code && window.FGHSync && FGHSync.isPin && FGHSync.isPin()) netRejoin(mine).then(function (ok) { if (!ok) showLobby(); }).catch(function () { showLobby(); });
      else showLobby();
      return;
    }
    if (q.get('library')) {
      showBuilder(null, function () {
        history.replaceState(null, '', location.pathname);
        if (saved && saved.P && saved.phase && saved.phase !== 'over') { S = saved; S.hist = S.hist || []; uidN = S.uidN || 0; app.innerHTML = ''; resumeFlow(); } else showSetup();
      }, { library: true, fromHub: true });
      return;
    }
    if (saved && saved.P && saved.P.length === 2 && saved.defs && saved.cards && saved.phase && saved.phase !== 'over') {
      S = saved; S.hist = S.hist || []; uidN = S.uidN || 0; resumeFlow();
    } else showSetup();
  })();

  // Test hooks (used by the automated checks; harmless otherwise)
  window.__storyOf = storyOf;
  window.__lorcana = {
    state: function () { return S; }, db: DB, D: D, DD: DD, C: C, parseKw: function (o) { return prep(o).K; }, fromLorcast: fromLorcast, prep: prep,
    quickDeck: quickDeck, deckProblems: deckProblems, winner: winner,
    load: function (st) { tok++; resetQ(); closeOverlays(); Kit.handoff.close(); S = st; DEF = {}; S.hist = S.hist || []; resumeFlow(); },
    run: function (a) { runAction(a); }, end: humanEnd, cpuChoose: cpuChoose, defenders: defenders, AB: AB, stx: stx, cant: cant, useAb: useAb, abUseWhy: abUseWhy, quiet: quiet, Q: function () { return Q; }, playCost: playCost, canPlay: canPlay, canQuest: canQuest,
    canShift: canShift, canSing: canSing, shiftTargets: shiftTargets, singersFor: singersFor, recklessPending: recklessPending, canChallenger: canChallenger,
    net: NET, lobby: function () { showLobby(); },
    allCpu: function () { S.P.forEach(function (p) { p.cpu = true; }); S.viewer = -1; tok++; closeOverlays(); resumeFlow(); },
    STR: STR, WP: WP, LORE: LORE, act: act, render: render, toolbox: openToolbox, speed: function (x) { SPD = x; }, ui: ui, zoom: openZoom, dropDeck: dropDeck, canonStory: canonStory, storyOf: storyOf, deEnt: deEnt, showLog: showLog,
    // tests: apply one ability effect to a card, as if from src
    // tests: queue one ability as if it had triggered, and run the queue
    rulesHTML: rulesHTML,
    fire: function (src, ab, pi, ctx) { Q.push({ src: src, ab: ab, pi: pi, ctx: ctx || {} }); pumpQ(); },
    hitFx: function (e, x, src) { var st = { pi: S.cur, src: src, ab: { name: 'Test' }, said: [] }; fx.beam(src, [x]); act(function () { hit(e, st, x); checkBanishAll(); }); }
  };
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip 7</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.f7 .tinfo{display:flex;justify-content:space-between;gap:8px;margin:0 4px 6px;font-size:.8rem;font-weight:800;color:var(--text-3);}
.f7 .tinfo b{color:var(--text-2);}
.f7 .ctable{margin:0 0 6px;padding:8px;border-radius:26px;}
.f7 .ctable .felt-in{height:auto;min-height:min(640px,calc(100dvh - 250px - var(--safe-t) - var(--safe-b)));padding:8px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;border-radius:19px;}

/* Each player's place at the table: their cards laid out in a row */
.opps{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.spot{position:relative;min-width:0;border-radius:14px;padding:5px 6px 6px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transition:box-shadow .25s, background .25s;}
.spot.wide{grid-column:1/-1;}
.spot.now{background:rgba(255,200,61,.1);box-shadow:0 0 0 2px var(--yellow), 0 0 16px rgba(255,200,61,.45);}
.spot.pick{cursor:pointer;animation:pickme 1.1s ease-in-out infinite;}
@keyframes pickme{50%{box-shadow:0 0 0 3px #fff, 0 0 18px rgba(255,255,255,.5);}}
.spot .sh{display:flex;align-items:center;gap:5px;color:#fff;font-weight:800;font-size:.8rem;}
.spot .sh .avatar{width:22px;height:22px;font-size:.7rem;flex:none;}
.spot .sh .avatar .ico{width:62%;height:62%;}
.spot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.spot .tot{flex:none;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.88);color:#1d1b2e;font-size:.72rem;font-weight:900;font-variant-numeric:tabular-nums;}
.spot .tot.lead{background:var(--yellow);}
.spot .line{display:flex;align-items:center;gap:6px;margin-top:4px;}
.spot .cards{--cw:26px;flex:1;min-width:0;display:flex;align-items:center;min-height:calc(var(--cw) * 1.4);}
.cards > .pcard + .pcard{margin-left:var(--overlap,2px);}
.spot .rp{flex:none;min-width:30px;text-align:right;font-family:var(--display);font-size:1.25rem;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums;}
.spot .empty{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.4);}
.opps.roomy .spot .cards{--cw:34px;}
.spot.out .cards .pcard:not(.dup){opacity:.45;filter:saturate(.4);}
.spot.out .rp{color:rgba(255,255,255,.45);}
.spot .rpw{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.stamp{transform:rotate(-7deg);pointer-events:none;font-family:var(--display);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;line-height:1;
  padding:2px 4px 1px;border-radius:4px;border:1.5px solid currentColor;background:rgba(0,0,0,.3);white-space:nowrap;animation:stampin .35s var(--spring);}
.spot.me .stamp{font-size:.8rem;padding:3px 6px 2px;}
@keyframes stampin{from{transform:rotate(-7deg) scale(2);opacity:0;}}
.stamp.bust{color:#ff6b6b;}
.stamp.stay{color:#e8f5ee;}
.stamp.frozen{color:#7fd8ff;}
.stamp.flip7{color:var(--yellow);}
.spot .say{position:absolute;right:6px;top:-10px;z-index:6;padding:4px 9px;border-radius:12px;background:#fff;color:#1d1b2e;font-weight:900;font-size:.78rem;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.3);animation:pop .35s var(--spring);}
.spot .say.bad{background:#ff4d5e;color:#fff;}
.spot .say.good{background:var(--yellow);}

/* Your place: bigger cards */
.spot.me{padding:7px 8px 8px;}
.spot.me .sh{font-size:.9rem;}
.spot.me .sh .avatar{width:26px;height:26px;}
.spot.me .cards{--cw:clamp(42px,12.4vw,58px);}
.spot.me .rp{font-size:1.9rem;min-width:44px;}
.spot.me .risk{flex:none;font-size:.72rem;font-weight:800;color:rgba(255,255,255,.7);}
.spot.me .risk b{color:#fff;}
.spot.me .risk.safe b{color:#ff9fb0;}

/* Middle of the table: deck, message, discard */
.mid{flex:1;display:flex;align-items:center;gap:10px;padding:4px;min-height:100px;}
.pile{position:relative;flex:none;--cw:clamp(52px,16vw,66px);display:flex;flex-direction:column;align-items:center;gap:3px;}
.pile .stack{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4);}
.pile .stack .pcard{position:absolute;left:0;top:0;}
.pile .stack .pcard:nth-child(1){transform:translate(3px,3px);}
.pile .stack .pcard:nth-child(2){transform:translate(1.5px,1.5px);}
.pile small{font-size:.68rem;font-weight:900;letter-spacing:.06em;color:rgba(255,255,255,.6);text-transform:uppercase;}
.pile.live .stack{cursor:pointer;}
.pile.live .stack .pcard:last-child{animation:deckglow 1.5s ease-in-out infinite;}
@keyframes deckglow{50%{box-shadow:inset 0 0 0 calc(var(--cw) * .06) #fff, 0 0 0 3px var(--yellow), 0 0 18px rgba(255,200,61,.6);}}
.pile .none{width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:5px;border:2px dashed rgba(255,255,255,.2);}
.pile.disc .stack .pcard{opacity:.85;}
.msg{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;color:#fff;font-family:var(--display);font-size:1.1rem;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.3);}
.msg .slot{--cw:clamp(52px,15vw,64px);flex:none;}
.msg .slot .pcard{animation:pop .35s var(--spring);box-shadow:0 0 0 3px var(--yellow), 0 8px 20px rgba(0,0,0,.4);}

/* Cards */
.pcard.custom.num{box-shadow:inset 0 0 0 calc(var(--cw) * .045) color-mix(in srgb,var(--ink) 55%,#fff), 0 1px 0 rgba(255,255,255,.8) inset, 0 2px 0 rgba(0,0,0,.15), 0 4px 10px rgba(0,0,0,.3);}
.pcard.custom .big svg{width:calc(var(--cw) * .5);height:calc(var(--cw) * .5);}
.pcard.custom.act .big{font-size:calc(var(--cw) * .5);padding-bottom:12%;}
.pcard.custom.mod .big{font-size:calc(var(--cw) * .42);padding-bottom:8%;}
.cards .pcard.custom .lbl{display:none;}
.cards .pcard.custom.mod .big,.cards .pcard.custom.act .big{padding:0;}
.spot:not(.me) .pcard.custom .ix{display:none;}
.pcard.custom.dup,.pcard.dup{box-shadow:0 0 0 2px #ff4d5e, 0 0 10px rgba(255,77,94,.8);}
.pcard.later{opacity:.55;}

.f7 .cbar{flex-wrap:wrap;gap:8px;min-height:62px;margin:4px 0 0;}
.f7 .cbar .btn-lg{flex:1;max-width:240px;}
.f7 .cbar .hint{text-align:center;}
.f7 .cbar .pickl{width:100%;text-align:center;font-weight:800;color:var(--text-2);font-size:.9rem;}
.f7 .cbar .chip{min-height:42px;padding:0 14px;font-weight:800;background:rgba(255,255,255,.1);color:var(--text);}
.f7 .cbar .chip small{opacity:.6;margin-left:4px;}
.sum{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums;}
.sum th,.sum td{padding:8px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);}
.sum th:first-child,.sum td:first-child{text-align:left;}
.sum th{font-size:.75rem;color:var(--text-3);font-weight:800;text-transform:uppercase;letter-spacing:.06em;}
.sum td.big{font-weight:900;font-size:1.15rem;}
.sum td small{display:block;font-size:.72rem;color:var(--text-3);font-weight:800;}
.sum tr.lead td{color:var(--yellow);}
.sum td.bust{color:var(--red);}
/* iPad portrait: the table fills the screen and the cards grow with it */
@media (min-width:700px) and (min-height:900px){
  .f7{max-width:720px;}
  .f7 .tinfo{font-size:.9rem;}
  .f7 .ctable .felt-in{min-height:min(880px,calc(100dvh - 290px - var(--safe-t) - var(--safe-b)));padding:10px;gap:10px;}
  .opps{gap:10px;}
  .spot{padding:8px 10px 10px;border-radius:16px;}
  .spot .sh{font-size:.95rem;gap:7px;}
  .spot .sh .avatar{width:28px;height:28px;}
  .spot .tot{font-size:.82rem;padding:2px 9px;}
  .spot .line{margin-top:6px;}
  .spot .cards{--cw:38px;}
  .opps.roomy .spot .cards{--cw:48px;}
  .spot .rp{font-size:1.6rem;min-width:38px;}
  .spot .empty{font-size:.85rem;}
  .stamp{font-size:.8rem;}
  .spot .say{font-size:.9rem;}
  .spot.me{padding:10px 12px 12px;}
  .spot.me .sh{font-size:1.05rem;}
  .spot.me .sh .avatar{width:32px;height:32px;}
  .spot.me .cards{--cw:78px;}
  .spot.me .rp{font-size:2.6rem;min-width:60px;}
  .spot.me .risk{font-size:.85rem;}
  .spot.me .stamp{font-size:1rem;}
  .pile{--cw:86px;}
  .pile small{font-size:.78rem;}
  .msg{font-size:1.45rem;}
  .msg .slot{--cw:84px;}
  .f7 .cbar .btn-lg{max-width:280px;}
  .f7 .cbar .chip{min-height:50px;padding:0 18px;font-size:1.05rem;}
  .f7 .cbar .pickl{font-size:1.05rem;}
}
/* Landscape tablets and desktops: a wider table; height already fits */
@media (min-width:1000px) and (orientation:landscape){
  .f7{max-width:900px;}
  .spot.me .cards{--cw:64px;}
}
</style>
</head>
<body>
<main class="stage f7" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'flip7_state', KEY = 'flip7', PAD_KEY = 'f7', BONUS = 15;
  // Each number has its own colour, like the real deck
  var NUMC = ['#2b2b33', '#9a7b6c', '#8f9a14', '#e0306f', '#14998c', '#3a9a3e', '#8e2bb0', '#e0352f', '#f0561d', '#c48d00', '#3346b0', '#0093a8', '#5d7484'];
  var SNOW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="m9 3.5 3 2.5 3-2.5M9 20.5l3-2.5 3 2.5M3.5 10.6l3.7-.6-1.3-3.5M20.5 13.4l-3.7.6 1.3 3.5M5.9 17.5l1.3-3.5-3.7-.6M18.1 6.5l-1.3 3.5 3.7.6"/></svg>';
  var THREE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="6" width="8" height="12" rx="1.6" transform="rotate(-12 6.5 12)" fill="rgba(255,255,255,.25)"/><rect x="8" y="5" width="8" height="12" rx="1.6" fill="rgba(255,255,255,.35)"/><rect x="13.5" y="6" width="8" height="12" rx="1.6" transform="rotate(12 17.5 12)" fill="rgba(255,255,255,.5)"/></svg>';
  var HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.6-4.7-9.6-9.4C1.1 8.3 3.3 4.8 6.9 4.8c2.1 0 3.5 1.2 5.1 3 1.6-1.8 3-3 5.1-3 3.6 0 5.8 3.5 4.5 6.8C19.6 16.3 12 21 12 21z"/></svg>';

  Kit.init({
    id: 'flip7',
    onNew: function () { clearSave(); showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'chart', label: 'Scores so far', onClick: function () { if (S) showScores(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { keys: [PAD_KEY], title: 'Flip 7: past games' }); } }
    ],
    rules:
      '<p class="goal">Flip cards to build points without getting a <b>duplicate number</b>. First to <b>200</b> at the end of a round wins.</p>' +
      '<h3>Your turn</h3><ul><li><b>Flip</b>: take the next card from the deck.</li><li><b>Stay</b>: stop and keep your points for this round. You are out until the next round.</li>' +
      '<li>Everyone starts the round with one card. Then players take turns, one card at a time, until everyone has stayed or busted.</li></ul>' +
      '<h3>Busting</h3><p>If you flip a number you already have, you <b>bust</b> and score 0 this round.</p>' +
      '<h3>Flip 7</h3><p>Get <b>7 different numbers</b> and the round ends right away for everyone. You get <b>15 bonus points</b>.</p>' +
      '<h3>Special cards</h3><ul>' +
      '<li><b>Freeze</b>: pick any player still in (even you). They stop and keep their points.</li>' +
      '<li><b>Flip Three</b>: pick any player still in (even you). They must flip the next 3 cards. If they flip a Freeze or Flip Three along the way, it is used after the 3 cards.</li>' +
      '<li><b>Second Chance</b>: keep it. If you flip a duplicate, throw away the duplicate and this card instead of busting. You can only hold one; if you flip another, give it to someone still in.</li>' +
      '<li><b>+2 to +10</b>: add to your score. <b>&times;2</b>: doubles your number cards (not the + cards).</li></ul>' +
      '<h3>Scoring</h3><p>Add your numbers, double them if you have &times;2, then add + cards and any Flip 7 bonus. The deck is not reshuffled between rounds, so watch what has gone by.</p>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null, token = 0, timer = null, undoStack = [], says = [], flyIds = [];
  function save() {
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'over') Kit.resume.set('Round ' + S.round + ' · you have ' + S.players[0].total);
  }
  function clearSave() { token++; clearTimeout(timer); try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  function showSetup() {
    S = null; token++; clearTimeout(timer);
    Kit.setup(app, {
      players: { min: 3, max: 8, count: 4, cpu: 'seats', label: 'Players (you + computers)' },
      options: [{ id: 'target', label: 'Play to', help: 'The first player to reach this many points wins.', value: 200, choices: [[100, '100 · quick'], [200, '200 · standard']] }],
      onStart: function (cfg) {
        newGame(cfg.players.map(function (p) { return { name: p.name, cpu: p.cpu }; }), +cfg.options.target || 200);
      }
    });
  }

  function makeDeck() {
    var d = [], id = 0;
    function add(k, v) { d.push({ id: 'k' + (id++), k: k, v: v }); }
    add('n', 0);
    for (var n = 1; n <= 12; n++) for (var i = 0; i < n; i++) add('n', n);
    [2, 4, 6, 8, 10].forEach(function (v) { add('m', v); });
    add('x2', 2);
    for (var j = 0; j < 3; j++) { add('fz'); add('f3'); add('sc'); }
    return Cards.shuffle(d);
  }
  function newGame(players, target) {
    var n = players.length;
    S = {
      target: target, round: 0, rounds: [], details: [], ev: [], started: Date.now(),
      dealer: n - 1, deck: makeDeck(), discard: [],
      players: players.map(function (p) { return { name: p.name, cpu: p.cpu, total: 0, bold: p.cpu ? 0.95 + Math.random() * 0.45 : 1 }; })
    };
    Kit.gameStart();
    undoStack = [];
    newRound(true);
  }
  function newRound(first) {
    var n = S.players.length;
    S.round++;
    if (!first) S.dealer = (S.dealer + 1) % n;
    S.rows = S.players.map(function () { return []; });
    S.deferred = S.players.map(function () { return []; });
    S.status = S.players.map(function () { return 'in'; });
    S.queue = []; S.choose = null; S.dealt = 0; S.turn = -1; S.acted = true;
    S.phase = 'deal'; S.lastRound = null;
    S.msg = S.players[S.dealer].cpu ? S.players[S.dealer].name + ' deals' : 'You deal';
    undoStack = [];
    Kit.sfx('deal');
    save(); render(); pump(500);
  }

  // ── Card helpers ──────────────────────────────────────────────────────────
  function who(p) { return p === 0 ? 'You' : S.players[p].name; }
  function vb(p, you, them) { return p === 0 ? you : them; }
  function cardName(c) {
    return c.k === 'n' ? String(c.v) : c.k === 'm' ? '+' + c.v : c.k === 'x2' ? '×2' : c.k === 'fz' ? 'Freeze' : c.k === 'f3' ? 'Flip Three' : 'Second Chance';
  }
  function article(c) { return c.k === 'n' ? (c.v === 8 || c.v === 11 ? 'an ' : 'a ') + c.v : c.k === 'm' ? '+' + c.v : c.k === 'x2' ? '×2' : 'a ' + cardName(c); }
  function calc(p) {
    var nums = 0, x2 = false, mods = 0, u = {};
    S.rows[p].forEach(function (c) {
      if (c.k === 'n' && !c.dup) { nums += c.v; u[c.v] = 1; }
      else if (c.k === 'm') mods += c.v;
      else if (c.k === 'x2') x2 = true;
    });
    var uniq = Object.keys(u).length;
    return { nums: nums, x2: x2, mods: mods, uniq: uniq, f7: uniq >= 7, pts: (x2 ? nums * 2 : nums) + mods + (uniq >= 7 ? BONUS : 0) };
  }
  function shown(p) { return S.status[p] === 'bust' ? 0 : calc(p).pts; }
  function hasNum(p, v) { return S.rows[p].some(function (c) { return c.k === 'n' && !c.dup && c.v === v; }); }
  function hasSC(p) { return S.rows[p].some(function (c) { return c.k === 'sc'; }); }
  function active() { var a = []; S.status.forEach(function (s, p) { if (s === 'in') a.push(p); }); return a; }
  // What a careful player could know: the cards not yet seen (the deck, by counting)
  function odds(p) {
    var pool = S.deck.length ? S.deck : S.discard, c = calc(p), dup = 0, gain = 0;
    pool.forEach(function (x) {
      if (x.k === 'n') { if (hasNum(p, x.v)) dup++; else gain += x.v * (c.x2 ? 2 : 1); }
      else if (x.k === 'm') gain += x.v;
      else if (x.k === 'x2') gain += c.nums;
    });
    var n = pool.length || 1;
    return { pb: dup / n, gain: gain / n };
  }

  function drawCard() {
    if (!S.deck.length) {
      if (!S.discard.length) return null;
      S.deck = Cards.shuffle(S.discard); S.discard = [];
      Kit.toast('Out of cards: shuffling the discards'); Kit.sfx('whoosh');
    }
    return S.deck.pop();
  }

  // ── Engine: one visible event per step ───────────────────────────────────
  function pump(ms) {
    clearTimeout(timer);
    var t = token;
    timer = setTimeout(function () { if (t === token && S) step(); }, ms);
  }
  function waitMs(fast, slow) { return S.status[0] === 'in' ? slow : fast; }

  function step() {
    if (!S || (S.phase !== 'deal' && S.phase !== 'play')) return;
    if (S.status.indexOf('flip7') >= 0) return endRound();
    if (S.choose) {
      if (S.choose.p === 0) { render(); return; }      // waiting for you
      applyChoice(cpuTarget(S.choose));
      return after(750);
    }
    if (S.queue.length) {
      var ms = runTask(S.queue.shift());
      return after(ms);
    }
    if (S.phase === 'deal') {
      var n = S.players.length;
      while (S.dealt < n) {
        var p = (S.dealer + 1 + S.dealt) % n; S.dealt++;
        if (S.status[p] === 'in') { S.queue.push({ t: 'draw', p: p }); return step(); }
      }
      S.phase = 'play'; S.turn = S.dealer; S.acted = true;
    }
    // Play: turns go around to the left until nobody is still in
    var act = active();
    if (!act.length) return endRound();
    if (S.acted || S.status[S.turn] !== 'in') {
      S.turn = nextActive(S.turn); S.acted = false;
      S.msg = S.turn === 0 ? 'Your turn' : S.players[S.turn].name + ' is thinking…';
      save(); render();
      if (S.turn === 0) { Kit.haptic('light'); return; }
      return pump(waitMs(380, 620));
    }
    if (S.turn === 0) { render(); return; }
    // Computer's turn
    var p2 = S.turn;
    S.acted = true;
    if (cpuHit(p2)) { S.queue.push({ t: 'draw', p: p2 }); return step(); }
    S.status[p2] = 'stay';
    S.msg = S.players[p2].name + ' stays with ' + calc(p2).pts;
    say(p2, 'Stay');
    Kit.sfx('chip');
    after(waitMs(420, 650));
  }
  function after(ms) {
    if (S.status.indexOf('flip7') >= 0) { save(); render(); return pump(1500); }
    save(); render();
    if (S.choose && S.choose.p === 0) { Kit.haptic('medium'); return; }
    pump(ms);
  }
  function nextActive(from) {
    var n = S.players.length;
    for (var i = 1; i <= n; i++) { var q = (from + i) % n; if (S.status[q] === 'in') return q; }
    return -1;
  }

  function runTask(t) {
    if (t.t === 'act') {
      if (S.status[t.p] !== 'in') { S.discard.push(t.c); return 0; }
      return offerAction(t.p, t.c);
    }
    if (t.t === 'f3end') {
      var later = S.deferred[t.p]; S.deferred[t.p] = [];
      if (S.status[t.p] === 'in') S.queue = later.map(function (c) { return { t: 'act', p: t.p, c: c }; }).concat(S.queue);
      else later.forEach(function (c) { S.discard.push(c); });
      return 250;
    }
    // draw
    var p = t.p;
    if (S.status[p] !== 'in') return 0;
    var c = drawCard();
    if (!c) { S.status.forEach(function (s, i) { if (s === 'in') S.status[i] = 'stay'; }); S.msg = 'The deck ran out'; return 600; }
    var slow = waitMs(480, 700) + (t.f3 ? 0 : 60);
    if (c.k === 'n') {

        if (hasSC(p)) {

          S.rows[p] = S.rows[p].filter(function (x) { return x !== sc; });
          S.discard.push(sc, c);
          S.ev.push({ k: 'save', p: p, r: S.round, v: c.v });
          S.msg = 'Second Chance saves ' + (p === 0 ? 'you' : S.players[p].name) + ' from a ' + c.v + '!';
          say(p, 'Saved!', 'good'); Kit.sfx('good'); if (p === 0) Kit.haptic('success');
          return slow + 300;
        }

        c.dup = true; S.rows[p].push(c); fly(c);
        S.status[p] = 'bust';
        S.ev.push({ k: 'bust', p: p, r: S.round, v: c.v, pts: before });
        S.msg = who(p) + ' ' + vb(p, 'bust', 'busts') + ' on ' + article(c) + '!';
        say(p, 'Bust!', 'bad'); Kit.sfx('bad'); if (p === 0) Kit.haptic('error');
        return slow + 300;
      }
      S.rows[p].push(c); fly(c); Kit.sfx('flip');
      var cc = calc(p);
      if (cc.uniq >= 7) {
        S.status[p] = 'flip7'; S.queue = []; S.choose = null;
        S.ev.push({ k: 'f7', p: p, r: S.round, pts: cc.pts });
        S.msg = who(p) + ' flipped 7!';
        Kit.callout('Flip 7!'); Kit.sfx('win'); Kit.haptic('success'); if (p === 0) Kit.confetti({ count: 80 });
        return 1500;
      }

    }
    if (c.k === 'm' || c.k === 'x2') {
      S.rows[p].push(c); fly(c); Kit.sfx('chip');

      return slow;
    }
    if (c.k === 'sc') {

      S.choose = { p: p, c: c, kind: 'sc', targets: tg };
      S.msg = who(p) + ' already ' + vb(p, 'have', 'has') + ' a Second Chance';
      if (tg.length === 1) { applyChoice(tg[0]); }

    }
    // Freeze / Flip Three

      S.msg = who(p) + ' ' + vb(p, 'flip', 'flips') + ' ' + article(c) + ': used after the 3 cards';

  }
  function offerAction(p, c) {
    var tg = active();

    S.msg = c.k === 'fz' ? who(p) + ' ' + vb(p, 'flip', 'flips') + ' a Freeze' : who(p) + ' ' + vb(p, 'flip', 'flips') + ' a Flip Three';

  function applyChoice(q) {

    var c = ch.c, p = ch.p;
    if (ch.kind === 'sc') {
      S.rows[q].push(c); fly(c, true);
      S.msg = who(p) + ' ' + vb(p, 'give', 'gives') + ' the Second Chance to ' + (q === 0 ? 'you' : S.players[q].name);

  // ── Computer players (they only use what's on the table) ──────────────────
  function bestOther(p) {
    var m = 0;

    return m;
  }
  function cpuHit(p) {
    var c = calc(p), s = c.pts, tot = S.players[p].total, o = odds(p);
    if (s === 0 && !c.x2) return true;
    var others = bestOther(p);
    if (tot + s >= S.target && tot + s > others) return false;          // stay and win
    if (hasSC(p)) return s < 55 || c.uniq >= 6;
    var bold = S.players[p].bold * (0.9 + Math.random() * 0.2);
    if (others >= S.target - 15 && tot + s <= others) bold *= 1.6;       // must catch up

    if (ch.kind === 'sc') {    // hand it to whoever is furthest behind
      return tg.slice().sort(function (a, b) { return S.players[a].total - S.players[b].total; })[0];
    }
    if (others.length && Math.random() < 0.12) return others[Math.floor(Math.random() * others.length)];
    if (ch.kind === 'fz') {

    return ranked[0].q;
  }

  // ── Your moves ────────────────────────────────────────────────────────────

  }

  }

  // ── Round end ─────────────────────────────────────────────────────────────

      var c = calc(p), st = S.status[p], v = st === 'bust' ? 0 : c.pts;
      scores.push(v); pl.total += v;
      det.push(st === 'bust' ? 'Bust' : st === 'flip7' ? 'Flip 7' : st === 'frozen' ? 'Frozen' : c.x2 ? '×2' : '');
      if (st !== 'bust') S.ev.push({ k: 'round', p: p, r: S.round, pts: v });
    });
    S.rounds.push(scores); S.details.push(det);
    S.rows.forEach(function (r) { r.forEach(function (c) { delete c.dup; S.discard.push(c); }); });
    S.deferred.forEach(function (r) { r.forEach(function (c) { S.discard.push(c); }); });

  function showScores(between) {

    var top = Math.max.apply(null, S.players.map(function (p) { return p.total; }));
    var last = S.rounds[S.rounds.length - 1], det = S.details[S.details.length - 1];

  }
  function highlights() {

    ev.filter(function (e) { return e.k === 'f7'; }).slice(0, 2).forEach(function (e) {
      hl.push(nm(e.p) + ' flipped 7 in round ' + e.r + ' for +' + BONUS + ' (' + e.pts + ' points)');
    });
    var busts = ev.filter(function (e) { return e.k === 'bust'; }).sort(function (a, b) { return b.pts - a.pts; });
    if (busts.length && busts[0].pts >= 15) hl.push(nm(busts[0].p) + ' busted on a ' + busts[0].v + ' with ' + busts[0].pts + ' points showing');
    var best = ev.filter(function (e) { return e.k === 'round'; }).sort(function (a, b) { return b.pts - a.pts; })[0];
    if (best && best.pts > 0) hl.push(nm(best.p) + "'s best round: " + best.pts + ' points in round ' + best.r);

  function finish() {

      started: S.started, mode: 'vs Computer',

      winner: w.name,

  }

  // ── Undo (your last flip, stay or pick) ───────────────────────────────────
  function snapshot() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 30) undoStack.shift(); }
  function undo() {

  }

  // ── Render ────────────────────────────────────────────────────────────────
  function face(c, o) {
    o = o || {};
    var n;
    if (c.k === 'n') n = Kit.cardFace({ rank: c.v, color: NUMC[c.v], cls: 'num', aria: 'Number ' + c.v });
    else if (c.k === 'm') n = Kit.cardFace({ center: '+' + c.v, label: 'bonus', color: '#f08400', solid: true, cls: 'mod', aria: 'Plus ' + c.v });
    else if (c.k === 'x2') n = Kit.cardFace({ center: '×2', label: 'double', color: '#7a3fe0', solid: true, cls: 'mod', aria: 'Times two' });
    else if (c.k === 'fz') n = Kit.cardFace({ html: SNOW, label: 'Freeze', color: '#1798d8', solid: true, cls: 'act', aria: 'Freeze' });
    else if (c.k === 'f3') n = Kit.cardFace({ html: THREE, label: 'Flip three', color: '#d99400', solid: true, cls: 'act', aria: 'Flip Three' });
    else n = Kit.cardFace({ html: HEART, label: '2nd chance', color: '#e0263f', solid: true, cls: 'act', aria: 'Second Chance' });

  var ORDER = { n: 0, x2: 1, m: 2, sc: 3, fz: 4, f3: 5 };
  function sorted(row) {
    return row.slice().sort(function (a, b) { return (a.dup ? 1 : 0) - (b.dup ? 1 : 0) || ORDER[a.k] - ORDER[b.k] || (a.v || 0) - (b.v || 0); });
  }
  function fit(box) {
    var cards = box.querySelectorAll('.pcard'); if (cards.length < 2) return;
    var cw = cards[0].offsetWidth, n = cards.length, w = box.clientWidth;
    var ov = Math.min(3, (w - cw) / (n - 1) - cw);
    box.style.setProperty('--overlap', Math.max(ov, -cw * .62) + 'px');
  }

  var spotEls = [], deckEl, discEl, barEl;
  function render() {
    if (!S) return;

    var n = S.players.length;
    app.appendChild(el('div', { class: 'tinfo' }, [
      el('span', { html: 'Round <b>' + S.round + '</b> · ' + Kit.esc(S.players[S.dealer].name) + ' dealt' }),
      el('span', { html: 'First to <b>' + S.target + '</b>' })
    ]));
    var table = el('div', { class: 'ctable wood' }), felt = el('div', { class: 'felt-in' });
    var opps = el('div', { class: 'opps' + (n <= 5 ? ' roomy' : '') });
    spotEls = [];
    var top = Math.max.apply(null, S.players.map(function (p) { return p.total; }));
    for (var p = 1; p < n; p++) {
      var s = spot(p, top);

      opps.appendChild(s); spotEls[p] = s;
    }
    felt.appendChild(opps);
    felt.appendChild(middle());
    spotEls[0] = spot(0, top);
    felt.appendChild(spotEls[0]);
    table.appendChild(felt);
    app.appendChild(table);
    barEl = el('div', { class: 'cbar' });
    app.appendChild(barEl);
    paintBar();
    requestAnimationFrame(function () {
      spotEls.forEach(function (s) { if (s) fit(s.querySelector('.cards')); });
      flyIds.forEach(function (f) {
        var node = app.querySelector('.cards [data-id="' + f.id + '"]');
        if (node) Cards.fly(node, f.center ? (app.querySelector('.msg') || deckEl) : deckEl, { ms: 360 });
      });
      flyIds = [];
      says.forEach(function (x) {
        var sp = spotEls[x.p]; if (!sp) return;
        var b = el('div', { class: 'say' + (x.cls ? ' ' + x.cls : ''), text: x.text }); sp.appendChild(b);
        setTimeout(function () { b.remove(); }, 1300);

    });
  }
  function spot(p, top) {

    var s = el('div', { class: 'spot' + (p === 0 ? ' me' : '') + (S.phase === 'play' && S.turn === p && st === 'in' && !S.choose ? ' now' : '') + (st === 'bust' ? ' out' : '') + (picking ? ' pick' : '') });
    if (picking) s.addEventListener('click', function () { pick(p); });
    var head = el('div', { class: 'sh' }, [
      el('span', { class: 'avatar', style: { '--c': Kit.color(p) }, html: pl.cpu ? Kit.icon('bot') : Kit.esc(pl.name.charAt(0).toUpperCase()) }),
      el('span', { class: 'nm', text: p === 0 ? (pl.name === 'You' ? 'You' : pl.name + ' (you)') : pl.name })

      else if (rows) head.appendChild(el('span', { class: 'risk', html: 'Bust risk <b>' + Math.round(o.pb * 100) + '%</b>' }));
    }
    head.appendChild(el('span', { class: 'tot' + (pl.total === top && top > 0 ? ' lead' : ''), text: String(pl.total) }));
    s.appendChild(head);
    var line = el('div', { class: 'line' }), cards = el('div', { class: 'cards' });

    if (!row.length) cards.appendChild(el('span', { class: 'empty', text: S.phase === 'deal' ? 'waiting for a card' : 'no cards' }));
    line.appendChild(cards);
    var stamp = { bust: 'Bust', stay: 'Stayed', frozen: 'Frozen', flip7: 'Flip 7' }[st];
    line.appendChild(el('span', { class: 'rpw' }, [stamp ? el('span', { class: 'stamp ' + st, text: stamp }) : null, el('span', { class: 'rp', text: String(shown(p)) })]));

  }
  function middle() {

  function paintBar() {

    }
    if (myTurn()) {
      barEl.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-lg', html: Kit.icon('plus') + '<span>Flip</span>', onclick: hit }));
      barEl.appendChild(el('button', { type: 'button', class: 'btn btn-soft btn-lg', text: 'Stay · ' + calc(0).pts, onclick: stay }));
      return;
    }
    var h = '';
    if (S.phase === 'deal') h = 'Dealing…';
    else if (S.phase === 'play') {
      var st = S.status[0];
      h = S.turn >= 0 && S.turn !== 0 && S.status[S.turn] === 'in' ? S.players[S.turn].name + ' is playing…' : '';
      if (st !== 'in') h = (st === 'bust' ? 'You busted. ' : st === 'frozen' ? 'You are frozen. ' : st === 'stay' ? 'You stayed. ' : '') + 'Waiting for the round to end…';
      if (S.status.indexOf('flip7') >= 0) h = 'Flip 7! The round is over.';
    }
    if (S.phase === 'roundover') {
      barEl.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-lg', text: 'See scores', onclick: function () { showScores(true); } }));
      return;
    }
    barEl.appendChild(el('span', { class: 'hint', text: h }));
  }
  function say(p, text, cls) { says.push({ p: p, text: text, cls: cls }); }
  function fly(c, center) { flyIds.push({ id: c.id, center: center }); }
  window.addEventListener('resize', function () { spotEls.forEach(function (s) { if (s) fit(s.querySelector('.cards')); }); });

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.players && saved.rows && saved.phase !== 'over') {
    S = saved; Kit.gameStart();
    render();
    if (S.phase === 'roundover') {
      var top = Math.max.apply(null, S.players.map(function (p) { return p.total; }));
      if (top >= S.target && S.players.filter(function (p) { return p.total === top; }).length === 1) finish();
      else setTimeout(function () { showScores(true); }, 300);
    } else pump(700);
  } else showSetup();
})();
</script>
</body>
</html>

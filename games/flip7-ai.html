<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// FLIP 7 — rules-accurate AI implementation
// Deck: 79 number cards (n copies of card n for n=1..12, plus 1 copy of 0)
//       6 modifier cards (+2,+4,+6,+8,+10,×2)
//       9 action cards (3 Freeze, 3 Flip Three, 3 Second Chance)
//       Total: 94 cards
// Scoring (per round): sum(numbers) → ×2 if present → +flat mods → +15 Flip 7
// Bust = duplicate number; unless holding Second Chance, which is discarded.
// Round ends when someone Flip 7's, or all non-busted players stayed.
// Game ends when any player reaches 200 pts.
// ═══════════════════════════════════════════════════════════════════════════

const PLAYERS = [
  (typeof FrequentPlayers !== 'undefined' && FrequentPlayers.myName()) || 'You',
  'Sam', 'Alex', 'Jess'
];
const NUMP = PLAYERS.length;
const WIN_TOTAL = 200;
const FLIP7_BONUS = 15;
const MODS = [2, 4, 6, 8, 10];

// ── Deck ───────────────────────────────────────────────────────────────────
function makeDeck(){
  const d = [];
  // Number cards: 1 zero, then n copies of each n for 1..12
  d.push({type:'num', val:0});
  for(let n = 1; n <= 12; n++){
    for(let i = 0; i < n; i++) d.push({type:'num', val:n});
  }
  // Modifiers
  MODS.forEach(v => d.push({type:'mod', val:v}));
  d.push({type:'x2'});
  // Actions
  for(let i = 0; i < 3; i++) d.push({type:'freeze'});
  for(let i = 0; i < 3; i++) d.push({type:'flip3'});
  for(let i = 0; i < 3; i++) d.push({type:'sc'});
  // Shuffle (Fisher-Yates)
  for(let i = d.length - 1; i > 0; i--){
    const j = 0 | Math.random() * (i + 1);
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}

// ── State ──────────────────────────────────────────────────────────────────
let deck;            // [card...] main draw pile
let discard;         // [card...] used cards (reshuffled when deck empty)
let scores;          // total scores across rounds
let rounds;          // round counter (for dealer rotation)
let dealer;          // who deals this round
let flipped;         // flipped[p] = array of cards in front of player p (excluding SC)
let hasSC;           // hasSC[p] = whether player p holds a Second Chance
let frozen;          // frozen via Freeze card (can't take more cards)
let busted;          // busted this round
let stopped;         // voluntarily stayed / earned Flip 7 / banked via Freeze
let roundScore;      // final banked score for each player this round (0 if busted)
let current;         // whose turn it is
let phase;           // 'flip' | 'choose-freeze' | 'choose-flip3' | 'choose-sc' | 'round-end' | 'game-over'
let forceFlips;      // forceFlips[p] = # of remaining forced flips (from flip3)
let pendingActions;  // queued flip3/freeze resolutions from nested flip3s
let pendingSC;       // when player receives a 2nd SC, index of who's passing
let log;

// ── Lifecycle ──────────────────────────────────────────────────────────────
function newGame(){
  scores = Array(NUMP).fill(0);
  rounds = 0;
  dealer = 0;
  log = [];
  newRound();
}

function newRound(){
  deck = makeDeck();
  discard = [];
  rounds++;
  flipped = Array.from({length:NUMP}, () => []);
  hasSC = Array(NUMP).fill(false);
  frozen = Array(NUMP).fill(false);
  busted = Array(NUMP).fill(false);
  stopped = Array(NUMP).fill(false);
  roundScore = Array(NUMP).fill(0);
  forceFlips = Array(NUMP).fill(0);
  pendingActions = [];
  pendingSC = null;
  phase = 'flip';
  // Rotate dealer each round; play starts LEFT of dealer
  current = (dealer + 1) % NUMP;
  addLog(`— Round ${rounds} — ${PLAYERS[dealer]} deals. ${PLAYERS[current]} goes first.`);
  render();
  if(current !== 0) setTimeout(aiDecide, 700);
}

// ── Scoring ────────────────────────────────────────────────────────────────
function calcRoundScore(p){
  const cards = flipped[p];
  const nums = cards.filter(c => c.type === 'num');
  const uniqueNums = new Set(nums.map(c => c.val));
  const isFlip7 = uniqueNums.size >= 7;
  if(busted[p]) return {score: 0, isFlip7: false};
  const numSum = nums.reduce((s,c) => s + c.val, 0);
  const hasX2 = cards.some(c => c.type === 'x2');
  const flatMods = cards.filter(c => c.type === 'mod').reduce((s,c) => s + c.val, 0);
  let score = numSum;
  if(hasX2) score *= 2;
  score += flatMods;
  if(isFlip7) score += FLIP7_BONUS;
  return {score: Math.max(0, score), isFlip7};
}

function hasDuplicate(p, card){
  if(card.type !== 'num') return false;
  return flipped[p].some(c => c.type === 'num' && c.val === card.val);
}

function activeCount(){
  let n = 0;
  for(let p = 0; p < NUMP; p++){
    if(!busted[p] && !stopped[p] && !frozen[p]) n++;
  }
  return n;
}

// ── Card drawing (with reshuffle) ──────────────────────────────────────────
function draw(){
  if(!deck.length){
    if(discard.length){
      // Reshuffle discard into deck
      deck = discard;
      discard = [];
      for(let i = deck.length - 1; i > 0; i--){
        const j = 0 | Math.random() * (i + 1);
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      addLog('Deck reshuffled from discards.');
    } else {
      return null;
    }
  }
  return deck.pop();
}

// ── Main flip logic ────────────────────────────────────────────────────────
// Flips a single card for the current player (or the force-flipped player).
// Returns true if action resolved synchronously; false if waiting on user input.
function doFlip(){
  if(phase !== 'flip') return;
  const card = draw();
  if(!card){ endRound(); return; }

  if(card.type === 'num'){
    if(hasDuplicate(current, card)){
      // Bust — unless Second Chance
      if(hasSC[current]){
        hasSC[current] = false;
        discard.push(card);
        addLog(`${PLAYERS[current]} would have busted on ${card.val} — Second Chance used!`, 'pts');
        render();
        if(!consumeForceFlip()) continueAfterFlip();
        return;
      }
      flipped[current].push(card);
      busted[current] = true;
      addLog(`${PLAYERS[current]} flipped ${card.val} — BUST! 💥`, 'bust');
      // Forced-flip busts also end any pending flip3 for this player
      forceFlips[current] = 0;
      render();
      advanceTurn();
      return;
    }
    flipped[current].push(card);
    addLog(`${PLAYERS[current]} flips ${card.val}.`);
    // Check Flip 7
    const {isFlip7} = calcRoundScore(current);
    if(isFlip7){
      stopped[current] = true;
      roundScore[current] = calcRoundScore(current).score;
      addLog(`${PLAYERS[current]} has FLIP 7! 🎉 +${FLIP7_BONUS} bonus. Round ends.`, 'flip7');
      render();
      // Flip 7 ends the round immediately
      setTimeout(endRound, 900);
      return;
    }
    render();
    if(!consumeForceFlip()) continueAfterFlip();
    return;
  }

  if(card.type === 'mod' || card.type === 'x2'){
    flipped[current].push(card);
    const lbl = card.type === 'x2' ? '×2' : '+' + card.val;
    addLog(`${PLAYERS[current]} flips ${lbl}.`);
    render();
    if(!consumeForceFlip()) continueAfterFlip();
    return;
  }

  if(card.type === 'sc'){
    if(!hasSC[current]){
      hasSC[current] = true;
      addLog(`${PLAYERS[current]} draws Second Chance.`);
      render();
      if(!consumeForceFlip()) continueAfterFlip();
    } else {
      // Must pass to another active player
      const targets = validSCTargets();
      if(!targets.length){
        // Nobody to give it to; discard
        discard.push(card);
        addLog(`${PLAYERS[current]} draws a 2nd Second Chance — discarded (nobody can receive).`);
        render();
        if(!consumeForceFlip()) continueAfterFlip();
      } else if(current !== 0){
        // AI chooses
        const target = targets[0 | Math.random() * targets.length];
        hasSC[target] = true;
        addLog(`${PLAYERS[current]} passes Second Chance to ${PLAYERS[target]}.`);
        render();
        if(!consumeForceFlip()) continueAfterFlip();
      } else {
        // Ask the player
        pendingSC = {targets};
        phase = 'choose-sc';
        render();
      }
    }
    return;
  }

  if(card.type === 'freeze'){
    discard.push(card);  // Freeze doesn't sit in front
    addLog(`${PLAYERS[current]} drew Freeze ❄️`);
    // Choose target (self or any non-frozen/non-busted/non-stopped player)
    const targets = validFreezeTargets();
    if(!targets.length){
      // Nobody to freeze; discard (rare edge)
      render();
      if(!consumeForceFlip()) continueAfterFlip();
      return;
    }
    if(current !== 0){
      // AI freezes the player with the highest current round score (or self if bank-worthy)
      const target = aiChooseFreezeTarget(targets);
      applyFreeze(target);
    } else {
      phase = 'choose-freeze';
      render();
    }
    return;
  }

  if(card.type === 'flip3'){
    discard.push(card);  // The flip3 itself is discarded
    addLog(`${PLAYERS[current]} drew Flip Three ↻3`);
    const targets = validFlip3Targets();
    if(!targets.length){
      render();
      if(!consumeForceFlip()) continueAfterFlip();
      return;
    }
    if(current !== 0){
      const target = aiChooseFlip3Target(targets);
      applyFlip3(target);
    } else {
      phase = 'choose-flip3';
      render();
    }
    return;
  }
}

// Called after each flip to continue or prompt AI/player
function continueAfterFlip(){
  // If this was a force-flip step that completed, handle queued actions
  // then advance turn.
  render();
  if(current === 0){
    // It's the human's turn — stay in flip phase for them to decide
    return;
  }
  setTimeout(aiDecide, 600);
}

// ── Force-flips (from Flip Three) ─────────────────────────────────────────
function consumeForceFlip(){
  // Returns true if another forced flip is queued and being scheduled
  if(forceFlips[current] > 0){
    forceFlips[current]--;
    if(busted[current] || stopped[current]){ forceFlips[current] = 0; return false; }
    setTimeout(() => { if(phase === 'flip') doFlip(); }, 500);
    return true;
  }
  // All force-flips done — process any queued pending actions
  if(pendingActions.length){
    const next = pendingActions.shift();
    setTimeout(() => resumePendingAction(next), 400);
    return true;
  }
  return false;
}

function resumePendingAction(act){
  if(act.kind === 'freeze'){
    const targets = validFreezeTargets();
    if(!targets.length){ advanceTurn(); return; }
    addLog(`Resolving queued Freeze from ${PLAYERS[act.from]}…`);
    if(act.from !== 0){
      applyFreeze(aiChooseFreezeTarget(targets));
    } else {
      // Player is choosing — restore context
      current = act.from;
      phase = 'choose-freeze';
      render();
    }
  } else if(act.kind === 'flip3'){
    const targets = validFlip3Targets();
    if(!targets.length){ advanceTurn(); return; }
    addLog(`Resolving queued Flip Three from ${PLAYERS[act.from]}…`);
    if(act.from !== 0){
      applyFlip3(aiChooseFlip3Target(targets));
    } else {
      current = act.from;
      phase = 'choose-flip3';
      render();
    }
  }
}

// ── Valid target helpers ─────────────────────────────────────────────────
function validFreezeTargets(){
  // Anyone active (including self) can be frozen
  const t = [];
  for(let p = 0; p < NUMP; p++){
    if(!busted[p] && !stopped[p] && !frozen[p]) t.push(p);
  }
  return t;
}
function validFlip3Targets(){ return validFreezeTargets(); }
function validSCTargets(){
  // Active players who don't already have an SC
  const t = [];
  for(let p = 0; p < NUMP; p++){
    if(p === current) continue;
    if(!busted[p] && !stopped[p] && !frozen[p] && !hasSC[p]) t.push(p);
  }
  return t;
}

// ── Apply effects ─────────────────────────────────────────────────────────
function applyFreeze(target){
  // Target immediately banks current round points and exits round
  roundScore[target] = calcRoundScore(target).score;
  stopped[target] = true;
  frozen[target] = true;
  addLog(`${PLAYERS[current]} freezes ${PLAYERS[target]} — banks ${roundScore[target]} pts.`, 'pts');
  phase = 'flip';
  render();

  // Check if target's freeze ended the round
  if(activeCount() === 0){ setTimeout(endRound, 600); return; }

  if(!consumeForceFlip()){
    advanceTurn();
  }
}

function applyFlip3(target){
  addLog(`${PLAYERS[current]} makes ${PLAYERS[target]} flip 3!`);
  const was = current;
  current = target;
  forceFlips[target] += 3;
  phase = 'flip';
  render();
  // Kick off the first force-flip
  setTimeout(() => {
    if(phase === 'flip' && !busted[current] && !stopped[current]){
      doFlip();
    }
  }, 500);
  // After force-flips complete, the turn passes to the NEXT active player after the original `was`
  // We track this by setting `_flip3Origin` so advanceTurn uses it after force-flips end.
  // For simplicity, once force-flips done and no nested actions, advanceTurn() picks up from current (target),
  // and the normal round loop continues.  The original player's turn is considered over when they drew flip3.
  // This matches "drew an action card → turn effectively done".
  _turnOriginator = was;
}
let _turnOriginator = -1;

function playerFreeze(target){
  if(phase !== 'choose-freeze') return;
  applyFreeze(target);
}
function playerFlip3(target){
  if(phase !== 'choose-flip3') return;
  applyFlip3(target);
}
function playerPassSC(target){
  if(phase !== 'choose-sc' || !pendingSC) return;
  hasSC[target] = true;
  addLog(`You pass Second Chance to ${PLAYERS[target]}.`);
  pendingSC = null;
  phase = 'flip';
  render();
  if(!consumeForceFlip()) continueAfterFlip();
}

// ── Stop / Stay ───────────────────────────────────────────────────────────
function doStop(){
  if(phase !== 'flip' || current !== 0) return;
  if(forceFlips[0] > 0){
    addLog("You can't stop — you're still flipping three!");
    return;
  }
  stopped[0] = true;
  roundScore[0] = calcRoundScore(0).score;
  addLog(`You stay with ${roundScore[0]} pts banked.`, 'pts');
  render();
  advanceTurn();
}

// ── Turn advancement ──────────────────────────────────────────────────────
function advanceTurn(){
  // If we're in the middle of someone's force-flips, stay on them
  if(forceFlips[current] > 0 && !busted[current] && !stopped[current]){
    setTimeout(() => { if(phase === 'flip') doFlip(); }, 400);
    return;
  }
  // After Flip Three completes, turn passes past the originator
  const fromP = _turnOriginator >= 0 ? _turnOriginator : current;
  _turnOriginator = -1;

  // Round ends if no active players remain
  if(activeCount() === 0){ endRound(); return; }

  let next = (fromP + 1) % NUMP;
  let guard = 0;
  while((busted[next] || stopped[next] || frozen[next]) && guard < NUMP * 2){
    next = (next + 1) % NUMP;
    guard++;
  }
  if(guard >= NUMP * 2){ endRound(); return; }
  current = next;
  phase = 'flip';
  render();
  if(current !== 0) setTimeout(aiDecide, 700);
}

// ── AI decision ───────────────────────────────────────────────────────────
function aiDecide(){
  if(current === 0) return;
  if(busted[current] || stopped[current] || frozen[current]){ advanceTurn(); return; }
  // If forced to flip, just do it
  if(forceFlips[current] > 0){
    setTimeout(doFlip, 400);
    return;
  }
  const {score, isFlip7} = calcRoundScore(current);
  const nums = flipped[current].filter(c => c.type === 'num');
  const uniqueNums = new Set(nums.map(c => c.val)).size;
  // Bust probability: count cards in deck that would duplicate
  const deckCards = deck.concat(discard);
  const totalCards = deckCards.length;
  if(totalCards === 0){ setTimeout(doFlip, 400); return; }
  const playerVals = new Set(nums.map(c => c.val));
  const dupCount = deckCards.filter(c => c.type === 'num' && playerVals.has(c.val)).length;
  const bustRisk = totalCards > 0 ? dupCount / totalCards : 0;

  // Stop heuristic:
  //  - Hold SC? Be aggressive (push for Flip 7 / big scores)
  //  - No SC and bust risk > 35% AND score > 18 → stop
  //  - Close to Flip 7 (6 unique)? Almost always push
  //  - Very low score with low risk → push
  let shouldStop = false;
  if(uniqueNums >= 6){
    // 6 unique — one more gets Flip 7. Push unless bust risk is brutal.
    shouldStop = !hasSC[current] && bustRisk > 0.55;
  } else if(hasSC[current]){
    // With SC, push harder
    shouldStop = score >= 40 && bustRisk > 0.5;
  } else {
    shouldStop = (score >= 20 && bustRisk > 0.35) || (score >= 35 && bustRisk > 0.22) || score >= 60;
  }

  // If nobody else is active and I have a positive score, stop
  const othersActive = [...Array(NUMP).keys()].some(p => p !== current && !busted[p] && !stopped[p] && !frozen[p]);
  if(!othersActive && score > 0) shouldStop = true;

  if(shouldStop){
    stopped[current] = true;
    roundScore[current] = calcRoundScore(current).score;
    addLog(`${PLAYERS[current]} stays with ${roundScore[current]} pts.`, 'pts');
    render();
    setTimeout(advanceTurn, 400);
  } else {
    addLog(`${PLAYERS[current]} flips…`);
    setTimeout(doFlip, 500);
  }
}

// AI target-choice heuristics
function aiChooseFreezeTarget(targets){
  // If I have a decent score, freeze myself (bank it)
  const {score: myScore} = calcRoundScore(current);
  const otherTargets = targets.filter(t => t !== current);
  // Freeze the opponent with the highest round score if it beats mine
  let bestOpp = -1, bestOppScore = -1;
  otherTargets.forEach(t => {
    const s = calcRoundScore(t).score;
    if(s > bestOppScore){ bestOppScore = s; bestOpp = t; }
  });
  if(bestOppScore >= 20 && bestOppScore >= myScore - 10) return bestOpp;
  if(myScore >= 15 && targets.includes(current)) return current;
  return bestOpp >= 0 ? bestOpp : targets[0];
}

function aiChooseFlip3Target(targets){
  // Target the opponent with the MOST unique numbers (highest bust likelihood)
  const otherTargets = targets.filter(t => t !== current);
  if(!otherTargets.length) return targets[0];
  otherTargets.sort((a,b) => {
    const ua = new Set(flipped[a].filter(c=>c.type==='num').map(c=>c.val)).size;
    const ub = new Set(flipped[b].filter(c=>c.type==='num').map(c=>c.val)).size;
    return ub - ua;
  });
  return otherTargets[0];
}

// ── Round/game end ───────────────────────────────────────────────────────
function endRound(){
  // Everyone who isn't busted banks their score (those who already stayed keep it)
  for(let p = 0; p < NUMP; p++){
    if(busted[p]){
      roundScore[p] = 0;
    } else if(!stopped[p]){
      roundScore[p] = calcRoundScore(p).score;
    }
    scores[p] += roundScore[p];
  }
  // Rotate dealer
  dealer = (dealer + 1) % NUMP;
  phase = 'round-end';
  addLog(`— End of Round ${rounds} —`);
  for(let p = 0; p < NUMP; p++){
    if(busted[p]) addLog(`${PLAYERS[p]}: BUST (0 pts) → total ${scores[p]}`, 'bust');
    else addLog(`${PLAYERS[p]}: +${roundScore[p]} → total ${scores[p]}`, 'pts');
  }
  if(scores.some(s => s >= WIN_TOTAL)){
    phase = 'game-over';
    endGame();
  } else {
    render();
  }
}

function endGame(){
  const winner = scores.indexOf(Math.max(...scores));
  const won = winner === 0;
  addLog(`🏆 ${PLAYERS[winner]} wins with ${scores[winner]} pts!`, 'flip7');
  try{
    const players = PLAYERS.map((n,i) => ({name: n, score: scores[i]}));
    GameHistory.savePlayerGame('flip7', 'Flip 7 (AI)', players, winner, 0, {rounds});
  }catch(e){}
  render();
}

function addLog(msg, cls = ''){
  log.push({msg, cls});
  if(log.length > 30) log.shift();
}

// ── Render ────────────────────────────────────────────────────────────────
function cardMini(c){
  if(!c) return '';
  if(c.type === 'num') return `<div class="mcard num">${c.val}</div>`;
  if(c.type === 'mod') return `<div class="mcard mod">+${c.val}</div>`;
  if(c.type === 'x2')  return `<div class="mcard x2">×2</div>`;
  if(c.type === 'freeze') return `<div class="mcard freeze">❄️</div>`;
  if(c.type === 'flip3')  return `<div class="mcard flip3">↻3</div>`;
  if(c.type === 'sc')     return `<div class="mcard sc">2nd</div>`;
  return '';
}
function cardBig(c){
  if(!c) return '';
  if(c.type === 'num') return `<div class="fcard num"><div class="num-val">${c.val}</div></div>`;
  if(c.type === 'mod') return `<div class="fcard mod"><div class="action-icon">+${c.val}</div></div>`;
  if(c.type === 'x2')  return `<div class="fcard x2"><div class="action-icon">×2</div></div>`;
  if(c.type === 'freeze') return `<div class="fcard freeze"><div class="action-icon">❄️</div><div class="action-lbl">FREEZE</div></div>`;
  if(c.type === 'flip3')  return `<div class="fcard flip3"><div class="action-icon">↻3</div><div class="action-lbl">FLIP 3</div></div>`;
  if(c.type === 'sc')     return `<div class="fcard sc"><div class="action-icon">🛡️</div><div class="action-lbl">2ND CHANCE</div></div>`;
  return '';
}

function render(){
  const root = document.getElementById('f7-root');
  let html = '';

  // Scoreboard
  html += `<div class="f7-scores">`;
  const maxScore = Math.max(...scores);
  PLAYERS.forEach((n,i) => {
    html += `<div class="f7-score-chip ${scores[i] === maxScore && scores[i] > 0 ? 'leader' : ''}">${n}: ${scores[i]}</div>`;
  });
  html += `</div>`;

  if(phase === 'game-over'){
    const w = scores.indexOf(Math.max(...scores));
    html += `<div class="f7-game-result">
      <div class="f7-game-title">${w === 0 ? '🏆 You Win!' : PLAYERS[w] + ' Wins!'}</div>
      <div style="color:#2a1a00;font-size:.85rem;margin-top:4px;">${PLAYERS.map((n,i) => n + ': ' + scores[i]).join(' · ')}</div>
      <div style="color:#3a2000;font-size:.7rem;margin-top:2px;">${rounds} rounds</div>
    </div>
    <div style="text-align:center;"><button class="btn btn-gold" id="ng-btn">New Game</button></div>`;
    html += renderLog();
    root.innerHTML = html;
    document.getElementById('ng-btn')?.addEventListener('click', newGame);
    return;
  }

  if(phase === 'round-end'){
    html += `<div class="f7-round-result">
      <div style="font-weight:700;margin-bottom:4px;">Round ${rounds} complete</div>
      <div style="font-size:.78rem;color:rgba(255,255,255,.6);">${PLAYERS.map((n,i) => busted[i] ? `<span style="color:#fca5a5">${n} bust</span>` : `${n}: +${roundScore[i]}`).join(' · ')}</div>
    </div>
    <div style="text-align:center;"><button class="btn btn-gold" id="nr-btn">Next Round →</button></div>`;
    html += renderLog();
    root.innerHTML = html;
    document.getElementById('nr-btn')?.addEventListener('click', newRound);
    return;
  }

  // Target-choice panels
  if(phase === 'choose-freeze'){
    const targets = validFreezeTargets();
    html += `<div class="f7-target-panel freeze">
      <div style="font-weight:700;margin-bottom:8px;">❄️ Freeze a player (locks in their score)</div>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
        ${targets.map(t => `<button class="btn ${t===current?'btn-gold':'btn-outline'} btn-sm f7-freeze-btn" data-target="${t}">${PLAYERS[t]}${t===current?' (self)':''}</button>`).join('')}
      </div>
    </div>`;
  }
  if(phase === 'choose-flip3'){
    const targets = validFlip3Targets();
    html += `<div class="f7-target-panel flip3">
      <div style="font-weight:700;margin-bottom:8px;">↻3 Who flips three?</div>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
        ${targets.map(t => `<button class="btn ${t===current?'btn-gold':'btn-outline'} btn-sm f7-flip3-btn" data-target="${t}">${PLAYERS[t]}${t===current?' (self)':''}</button>`).join('')}
      </div>
    </div>`;
  }
  if(phase === 'choose-sc' && pendingSC){
    html += `<div class="f7-target-panel sc">
      <div style="font-weight:700;margin-bottom:8px;">🛡️ You already have a Second Chance — pass this one to:</div>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
        ${pendingSC.targets.map(t => `<button class="btn btn-outline btn-sm f7-sc-btn" data-target="${t}">${PLAYERS[t]}</button>`).join('')}
      </div>
    </div>`;
  }

  // Status
  const isYourTurn = phase === 'flip' && current === 0;
  let status = '';
  if(phase === 'flip'){
    if(forceFlips[current] > 0){
      status = `${current===0?'You':PLAYERS[current]}: Flip Three (${forceFlips[current]} left)…`;
    } else if(isYourTurn){
      status = 'Your turn — Flip or Stay';
    } else {
      status = `${PLAYERS[current]}'s turn…`;
    }
  }
  html += `<div class="f7-status">${status}</div>`;

  // Deck area
  const lastCard = (discard.length && discard[discard.length - 1]) || null;
  html += `<div class="f7-deck-area">
    <div>
      <div style="font-size:.6rem;color:rgba(255,255,255,.3);text-align:center;margin-bottom:3px;">DECK · ${deck.length}</div>
      <div class="f7-deck-card${deck.length === 0 ? ' empty' : ''}" id="f7-deck">${deck.length ? '7' : 'empty'}</div>
    </div>
    ${lastCard ? `<div>
      <div style="font-size:.6rem;color:rgba(255,255,255,.3);text-align:center;margin-bottom:3px;">LAST FLIP</div>
      ${cardBig(lastCard)}
    </div>` : ''}
  </div>`;

  // Player panels
  html += `<div class="f7-players">`;
  PLAYERS.forEach((n,i) => {
    const isActive = current === i && phase === 'flip';
    const {score, isFlip7} = calcRoundScore(i);
    const displayScore = busted[i] ? 0 : (stopped[i] ? roundScore[i] : score);
    const cards = flipped[i];
    const nums = cards.filter(c => c.type === 'num').sort((a,b) => a.val - b.val);
    const mods = cards.filter(c => c.type === 'mod' || c.type === 'x2');
    const statusLabel = busted[i] ? '💥 BUST' :
                        stopped[i] && frozen[i] ? `❄️ Frozen (${roundScore[i]}pts)` :
                        stopped[i] ? `✋ Stayed (${roundScore[i]}pts)` :
                        frozen[i] ? `❄️ Frozen` :
                        isActive ? (forceFlips[i]>0 ? `↻3 x${forceFlips[i]}` : '▶ Active') :
                        '';
    const cls = [
      'f7-player',
      isActive ? 'active-player' : '',
      frozen[i] && !busted[i] ? 'frozen' : '',
      busted[i] ? 'busted' : '',
      stopped[i] && !busted[i] && !frozen[i] ? 'stopped-card' : ''
    ].filter(Boolean).join(' ');

    html += `<div class="${cls}">
      <div class="f7-player-name ${i===0 ? 'you' : ''}">
        ${n}
        ${hasSC[i] ? '<span class="f7-sc-badge">2ND</span>' : ''}
        ${isFlip7 && !busted[i] ? '<span class="flip7-badge">FLIP 7</span>' : ''}
      </div>
      <div class="f7-player-score">${displayScore}</div>
      <div class="f7-player-round">${statusLabel}</div>
      ${nums.length ? `<div class="f7-nums-row">${nums.map(c => cardMini(c)).join('')}</div>` : ''}
      ${mods.length ? `<div class="f7-mods-row">${mods.map(c => cardMini(c)).join('')}</div>` : ''}
    </div>`;
  });
  html += `</div>`;

  // Action buttons
  if(isYourTurn && forceFlips[0] === 0){
    html += `<div class="f7-action">
      <button class="btn btn-gold" id="flip-btn">🎴 Flip</button>
      <button class="btn btn-outline" id="stop-btn">✋ Stay (bank ${calcRoundScore(0).score} pts)</button>
    </div>`;
  } else if(isYourTurn && forceFlips[0] > 0){
    html += `<div class="f7-action">
      <button class="btn btn-gold" id="flip-btn">🎴 Forced Flip (${forceFlips[0]} left)</button>
    </div>`;
  }

  html += renderLog();
  root.innerHTML = html;

  // Wire up controls
  document.getElementById('f7-deck')?.addEventListener('click', () => { if(isYourTurn) doFlip(); });
  document.getElementById('flip-btn')?.addEventListener('click', doFlip);
  document.getElementById('stop-btn')?.addEventListener('click', doStop);
  document.querySelectorAll('.f7-freeze-btn').forEach(b => {
    b.addEventListener('click', () => playerFreeze(+b.dataset.target));
  });
  document.querySelectorAll('.f7-flip3-btn').forEach(b => {
    b.addEventListener('click', () => playerFlip3(+b.dataset.target));
  });
  document.querySelectorAll('.f7-sc-btn').forEach(b => {
    b.addEventListener('click', () => playerPassSC(+b.dataset.target));
  });
}

function renderLog(){
  return `<div class="f7-log">${log.slice(-7).map(({msg,cls}) => `<div class="${cls || ''}">${msg}</div>`).join('')}</div>`;
}

newGame();
</script>
<script>if(typeof FrequentPlayers!=="undefined") FrequentPlayers.installNameChip();</script>

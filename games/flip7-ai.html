<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip 7</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
.f7 .tinfo{display:flex;justify-content:space-between;gap:8px;margin:0 4px 6px;font-size:.82rem;font-weight:600;color:var(--text-3);}
.f7 .tinfo b{color:var(--text-2);}
.f7 .ctable{margin:0 0 6px;padding:8px;border-radius:26px;}
.f7 .ctable .felt-in{height:auto;min-height:min(760px,calc(100dvh - 226px - var(--safe-t) - var(--safe-b)));transition:min-height .42s cubic-bezier(.3,.7,.25,1);padding:8px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;border-radius:19px;}

/* Each player's place at the table: their cards laid out in a row */
.opps{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.spot{position:relative;min-width:0;border-radius:15px;padding:5px 6px 6px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);transition:box-shadow .25s, background .25s;}
.spot.wide{grid-column:1/-1;}
.spot.now{background:rgba(255,211,77,.1);box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.7),0 0 18px rgba(255,190,60,.3);}
.spot.pick{cursor:pointer;animation:pickme 1.1s ease-in-out infinite;}
@keyframes pickme{50%{box-shadow:0 0 0 3px #fff, 0 0 18px rgba(255,255,255,.5);}}
.spot .sh{display:flex;align-items:center;gap:5px;color:#fff;font-weight:700;font-size:.8rem;}
.spot .sh .avatar{width:22px;height:22px;font-size:.7rem;flex:none;}
.spot .sh .avatar .ico{width:62%;height:62%;}
.spot .nm{flex:1;min-width:0;line-height:1.05;text-wrap:balance;overflow-wrap:break-word;}   /* (Number / 5 on two lines, not cut) */
.spot .tot{flex:none;padding:2px 7px;border-radius:8px;background:var(--plate-bg);color:#fff;font-size:.74rem;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:var(--plate-line);}
.spot .tot.lead{color:var(--lit);box-shadow:inset 0 0 0 1px rgba(255,211,77,.6),0 0 10px var(--litg);}
.spot .line{display:flex;align-items:center;gap:6px;margin-top:4px;}
.spot .cards{--cw:26px;flex:1;min-width:0;display:flex;align-items:center;min-height:calc(var(--cw) * 1.4);}
.cards > .pcard + .pcard{margin-left:var(--overlap,2px);}
.spot .rp{flex:none;min-width:30px;text-align:right;font-family:var(--display);font-size:1.25rem;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums;}
.spot .empty{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.4);}
.opps.roomy .spot .cards{--cw:34px;}
.spot.out .cards .pcard:not(.dup){opacity:.45;filter:saturate(.4);}
.spot.out .rp{color:rgba(255,255,255,.45);}
.spot .rpw{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.stamp{transform:rotate(-7deg);pointer-events:none;font-family:var(--display);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;line-height:1;
  padding:2px 4px 1px;border-radius:4px;border:1.5px solid currentColor;background:rgba(0,0,0,.3);white-space:nowrap;animation:stampin .35s var(--spring);}
.spot.me .stamp{font-size:.8rem;padding:3px 6px 2px;}
@keyframes stampin{from{transform:rotate(-7deg) scale(2);opacity:0;}}
.stamp.bust{color:#ff6b6b;}
.stamp.stay{color:#e8f5ee;}
.stamp.frozen{color:#7fd8ff;}
.stamp.flip7{color:var(--yellow);}
.spot .say{position:absolute;right:6px;top:-10px;z-index:6;padding:4px 10px;border-radius:12px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-weight:700;font-size:.8rem;white-space:nowrap;box-shadow:var(--plate-line),0 4px 12px rgba(0,0,0,.35);animation:pop .35s var(--spring);}
.spot .say.bad{background:rgba(120,22,36,.94);color:#fff;}
.spot .say.good{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);}

/* Your place: bigger cards */
.spot.me{padding:7px 8px 8px;}
.spot.me .sh{font-size:.9rem;}
.spot.me .sh .avatar{width:26px;height:26px;}
.spot.me .cards{--cw:clamp(42px,12.4vw,58px);}
.spot.me .rp{font-size:1.9rem;min-width:44px;}
.spot.me .risk{flex:none;font-size:.76rem;font-weight:600;color:rgba(255,255,255,.72);}
.spot.me .risk b{color:#fff;}
.spot.me .risk.safe b{color:#ff9fb0;}

/* Middle of the table: deck, message, discard */
.mid{flex:1;display:flex;align-items:center;gap:10px;padding:4px;min-height:100px;}
.pile{position:relative;flex:none;--cw:clamp(52px,16vw,66px);display:flex;flex-direction:column;align-items:center;gap:3px;}
.pile .stack{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4);}
.pile .stack .pcard{position:absolute;left:0;top:0;}
.pile .stack .pcard:nth-child(1){transform:translate(3px,3px);}
.pile .stack .pcard:nth-child(2){transform:translate(1.5px,1.5px);}
.pile small{font-size:.76rem;font-weight:650;color:rgba(255,255,255,.66);white-space:nowrap;}
.pile.live .stack{cursor:pointer;}
.pile.live .stack .pcard:last-child{animation:deckglow 1.5s ease-in-out infinite;}
@keyframes deckglow{50%{box-shadow:inset 0 0 0 calc(var(--cw) * .06) #fff, 0 0 0 3px var(--yellow), 0 0 18px rgba(255,200,61,.6);}}
.pile .none{width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:5px;border:2px dashed rgba(255,255,255,.2);}
.pile.disc .stack .pcard{opacity:.85;}
.msg{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;color:#fff;font-family:var(--display);font-size:1.1rem;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.3);}
.msg .slot{--cw:clamp(52px,15vw,64px);flex:none;}
.msg .slot .pcard{animation:pop .35s var(--spring);box-shadow:0 0 0 3px var(--yellow), 0 8px 20px rgba(0,0,0,.4);}

/* Cards */
.pcard.custom.num{box-shadow:inset 0 0 0 calc(var(--cw) * .045) color-mix(in srgb,var(--ink) 55%,#fff), 0 1px 0 rgba(255,255,255,.8) inset, 0 2px 0 rgba(0,0,0,.15), 0 4px 10px rgba(0,0,0,.3);}
.pcard.custom .big svg{width:calc(var(--cw) * .5);height:calc(var(--cw) * .5);}
.pcard.custom.act .big{font-size:calc(var(--cw) * .5);padding-bottom:12%;}
.pcard.custom.mod .big{font-size:calc(var(--cw) * .42);padding-bottom:8%;}
.cards .pcard.custom .lbl{display:none;}
.cards .pcard.custom.mod .big,.cards .pcard.custom.act .big{padding:0;}
.spot:not(.me) .pcard.custom .ix{display:none;}
.pcard.custom.dup,.pcard.dup{box-shadow:0 0 0 2px #ff4d5e, 0 0 10px rgba(255,77,94,.8);}
.pcard.later{opacity:.55;}

.f7 .cbar{flex-wrap:wrap;gap:8px;min-height:62px;margin:4px 0 0;}
.f7 .cbar .btn-lg{flex:1;max-width:240px;}
.f7 .cbar .hint{text-align:center;}
.f7 .cbar .pickl{width:100%;text-align:center;font-weight:650;color:var(--text-2);font-size:.9rem;}
.f7 .cbar .chip{min-height:42px;padding:0 14px;font-weight:700;color:var(--text);}
.f7 .cbar .chip small{opacity:.6;margin-left:4px;}
.sum{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums;}
.sum th,.sum td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--w08);}
.sum th:first-child,.sum td:first-child{text-align:left;}
.sum th{font-size:.8rem;color:var(--text-3);font-weight:650;}
.sum td.big{font-weight:900;font-size:1.15rem;}
.sum td small{display:block;font-size:.74rem;color:var(--text-3);font-weight:600;}
.sum tr.lead td{color:var(--lit-ink);}
.sum td.bust{color:var(--red);}
/* iPad portrait: the table fills the screen and the cards grow with it */
@media (min-width:700px) and (min-height:900px){
  .f7{max-width:none;}
  .f7 .tinfo{font-size:.9rem;}
  .f7 .ctable .felt-in{min-height:min(1100px,calc(100dvh - 246px - var(--safe-t) - var(--safe-b)));padding:10px;gap:10px;}
  .opps{gap:10px;}
  .spot{padding:8px 10px 10px;border-radius:16px;}
  .spot .sh{font-size:.95rem;gap:7px;}
  .spot .sh .avatar{width:28px;height:28px;}
  .spot .tot{font-size:.82rem;padding:2px 9px;}
  .spot .line{margin-top:6px;}
  .spot .cards{--cw:46px;}
  .opps.roomy .spot .cards{--cw:58px;}
  .spot .rp{font-size:1.6rem;min-width:38px;}
  .spot .empty{font-size:.85rem;}
  .stamp{font-size:.8rem;}
  .spot .say{font-size:.9rem;}
  .spot.me{padding:10px 12px 12px;}
  .spot.me .sh{font-size:1.05rem;}
  .spot.me .sh .avatar{width:32px;height:32px;}
  .spot.me .cards{--cw:90px;}
  .spot.me .rp{font-size:2.6rem;min-width:60px;}
  .spot.me .risk{font-size:.85rem;}
  .spot.me .stamp{font-size:1rem;}
  .pile{--cw:86px;}
  .pile small{font-size:.78rem;}
  .msg{font-size:1.45rem;}
  .msg .slot{--cw:84px;}
  .f7 .cbar .btn-lg{max-width:280px;}
  .f7 .cbar .chip{min-height:50px;padding:0 18px;font-size:1.05rem;}
  .f7 .cbar .pickl{font-size:1.05rem;}
}
/* Landscape tablets and desktops: a wider table; height already fits */
@media (min-width:1000px) and (orientation:landscape){
  .f7{max-width:900px;}
  .spot.me .cards{--cw:64px;}
}
/* iPad / laptop sideways: the wide table spans the top; under it the round and target on the left, Flip and
   Stay (or what's happening) on the right */
@media (orientation:landscape) and (min-width:900px) and (min-height:560px){
  .f7:has(> .ctable){max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,520px);grid-template-areas:"tbl tbl" "info bar";column-gap:24px;align-items:center;}
  .f7 > .ctable{grid-area:tbl;margin-bottom:10px;}
  .f7 > .tinfo{grid-area:info;flex-direction:column;justify-content:center;gap:2px;margin:0;font-size:.95rem;}
  .f7 > .cbar{grid-area:bar;justify-content:flex-end;margin:0;}
  .f7 .cbar .pickl{text-align:right;}
  .f7 .ctable .felt-in{min-height:min(900px,calc(100dvh - 214px - var(--safe-t) - var(--safe-b)));}
  /* the cards as large as the wide table allows */
  .spot .cards{--cw:42px;}
  .opps.roomy .spot .cards{--cw:52px;}
  .spot.me .cards{--cw:80px;}
  .pile{--cw:86px;}
  .msg .slot{--cw:86px;}
  .msg{font-size:1.5rem;}
}

/* ── A large window (a laptop, any shape of window; CLAUDE.md "Large windows"). The script sets .dk and the shape
   (dk-wide, dk-strip, dk-square, dk-tall: the windows of Cards.DESK) on the stage only while such a layout shows, so a
   phone, a tablet and the windows in between keep the rules above. The table takes the window: every player's row
   is laid out for the felt there is (deskFit: how many columns, the deck in a row or a column of its own, your row
   larger or one of the grid), each row with seven places for its seven different numbers. Beside it the score sheet
   (left: a row a round, the round in play lit, the totals and how far each is to the target) and the round as it
   stands (right: the race with this round's points on it, safe ones solid and ones still at risk hatched, and what
   has happened this round), over Flip and Stay. ── */
.gh{display:none;}
.f7.dk:has(> .ctable){max-width:none;height:calc(100dvh - var(--bar));display:grid;column-gap:16px;row-gap:10px;align-items:stretch;padding:4px 20px max(calc(var(--safe-b) + 8px),18px);}
.f7.dk-wide:has(> .ctable),.f7.dk-strip:has(> .ctable){grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"sheet tbl side" "sheet tbl bar";}
.f7.dk-square:has(> .ctable){grid-template-columns:var(--lw) minmax(0,1fr);grid-template-rows:minmax(0,3fr) minmax(0,2fr) auto;grid-template-areas:"sheet tbl" "side tbl" "side bar";}
.f7.dk-tall:has(> .ctable){grid-template-columns:minmax(0,5fr) minmax(0,4fr);grid-template-rows:minmax(0,1fr) auto clamp(250px,27dvh,540px);grid-template-areas:"tbl tbl" "bar bar" "sheet side";}
.f7.dk > .tinfo{display:none;}
.f7.dk > .ctable{grid-area:tbl;display:flex;flex-direction:column;min-width:0;min-height:0;margin:0;padding:clamp(9px,.75vmin,14px);border-radius:clamp(28px,2.2vmin,40px);}
.f7.dk > .ctable .felt-in{flex:1 1 0;height:auto;min-height:0;display:grid;justify-content:stretch;transition:none;border-radius:clamp(21px,1.7vmin,30px);}
.f7.dk > .cdk-panel{display:flex;min-width:0;min-height:0;}
.f7.dk > .cdk-l{grid-area:sheet;}
.f7.dk > .cdk-r{grid-area:side;}
.f7.dk > .cbar{grid-area:bar;margin:0;min-height:62px;align-content:center;}
.f7.dk-wide > .cbar .btn-lg,.f7.dk-strip > .cbar .btn-lg,.f7.dk-square > .cbar .btn-lg{max-width:none;}
.f7.dk-square > .cbar{justify-content:flex-end;}
.f7.dk-stack > .cbar .btn-lg{flex:1 1 100%;}
.f7.dk-tall > .cbar .btn-lg{max-width:300px;}
.f7.dk .cbar .pickl{text-align:center;}
.f7.dk .cbar .chip{cursor:pointer;}
/* the felt: the rows are grid cells of the felt itself */
.f7.dk .opps{display:contents;}
.f7.dk .spot{--scw:var(--ocw,60px);display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;padding:calc(var(--scw) * .18) calc(var(--scw) * .26) calc(var(--scw) * .2);border-radius:clamp(15px,calc(var(--scw) * .26),26px);}
.f7.dk .spot.me{--scw:var(--mcw,80px);}
.f7.dk .spot.wide{grid-column:auto;}
.f7.dk .spot .sh{font-size:clamp(.86rem,calc(var(--scw) * .23),1.7rem);gap:.45em;}
.f7.dk .spot .sh .avatar{width:1.75em;height:1.75em;font-size:.78em;}
.f7.dk .spot .tot{font-size:.86em;padding:.12em .6em;border-radius:.5em;}
.f7.dk .spot.me .risk{font-size:.8em;}
.f7.dk .spot .line{margin-top:calc(var(--scw) * .12);gap:calc(var(--scw) * .2);}
.f7.dk .spot .cards{--cw:var(--scw);min-height:calc(var(--scw) * 1.4);}
.f7.dk .spot .cards .pcard{flex:none;}
.f7.dk .cards > * + *{margin-left:var(--overlap,2px);}
.f7.dk .spot .rp{font-size:max(1.25rem,calc(var(--scw) * .6));min-width:calc(var(--scw) * 1.25);}
.f7.dk .stamp,.f7.dk .spot.me .stamp{font-size:clamp(.66rem,calc(var(--scw) * .2),1.35rem);padding:.2em .42em .1em;border-radius:.3em;}
.f7.dk .spot .say{font-size:clamp(.8rem,calc(var(--scw) * .22),1.4rem);padding:.3em .8em;border-radius:.8em;top:calc(var(--scw) * -.1);}
/* a place for each of the seven different numbers: the ones still to come are empty */
.f7.dk .gh{display:block;flex:0 1 var(--cw);min-width:calc(var(--cw) * .2);box-sizing:border-box;height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .1);border:max(1.5px,calc(var(--cw) * .022)) dashed rgba(255,255,255,.3);background:rgba(0,0,0,.1);}
.f7.dk .spot.done .gh{border-color:rgba(255,255,255,.13);background:none;}
/* (cards large enough to read whole: the corner number on everyone's, and each special card's name) */
.f7.dk .spot.lg:not(.me) .pcard.custom .ix{display:flex;}
.f7.dk .spot.lg .cards .pcard.custom .lbl{display:block;}
.f7.dk .spot.lg .cards .pcard.custom.act .big{padding:0 0 12%;}
.f7.dk .spot.lg .cards .pcard.custom.mod .big{padding:0 0 8%;}
/* (many players on a short felt: the name stands at the left of the cards, so the cards have the row's height) */
.f7.dk .felt-in.ln .spot{flex-direction:row;align-items:center;gap:calc(var(--scw) * .2);padding:max(6px,calc(var(--scw) * .15)) calc(var(--scw) * .22);}
.f7.dk .felt-in.ln .spot .sh{flex:none;width:var(--hw,110px);flex-wrap:wrap;row-gap:.32em;align-content:center;}
.f7.dk .felt-in.ln .spot.me .sh{width:var(--mhw,var(--hw,110px));}
.f7.dk .felt-in.ln .spot .sh .nm{flex:1 1 calc(100% - 2.4em);}
.f7.dk .felt-in.ln .spot .sh .tot{order:4;}
.f7.dk .felt-in.ln .spot .sh .risk{order:5;flex:1 1 100%;}
.f7.dk .felt-in.ln .spot .line{flex:1 1 0;min-width:0;margin-top:0;}
/* the deck, what's happening and the discards: a row between the others and you, or a column of its own at the right */
.f7.dk .mid{min-height:0;min-width:0;padding:0 calc(var(--pcw) * .12);gap:calc(var(--pcw) * .3);}
.f7.dk .pile{--cw:var(--pcw,80px);gap:calc(var(--pcw) * .07);}
.f7.dk .pile small{font-size:clamp(.76rem,calc(var(--pcw) * .17),1.15rem);}
.f7.dk .msg{font-size:clamp(1.05rem,calc(var(--pcw) * .3),3.2rem);gap:.6em;}
.f7.dk .msg .slot{--cw:var(--pcw,80px);}
.f7.dk .felt-in.mcol .mid{flex-flow:row wrap;align-content:center;justify-content:center;padding:0;gap:calc(var(--pcw) * .35) calc(var(--pcw) * .22);}
.f7.dk .felt-in.mcol .mid .msg{order:3;flex:1 1 100%;flex-direction:column;font-size:clamp(1rem,calc(var(--pcw) * .26),1.9rem);text-wrap:balance;}
.f7.dk .felt-in.mcol .mid .pile.disc{order:2;}
/* the score sheet (Cards.pad): the columns narrow for many players, and nothing on it is under 9px */
.f7padw{flex:1 1 0;min-height:0;display:flex;flex-direction:column;}
.f7padw .cdk-pad{--lc:2.4em;}
.f7padw .cdk-pad .ph .pc{font-size:max(9px,.8em);overflow-wrap:break-word;}
.f7padw .cdk-pad .ph .pc .avatar{font-size:max(9px,.95em);}
.f7padw .cdk-pad .rl{font-size:max(9px,.74em);}
.f7padw .cdk-pad .pm .rl{font-size:max(9px,.68em);}
.f7padw .cdk-pad .cv.bust{font-size:1.12em;color:var(--bad-ink,#ff8f9c);}
.f7padw .cdk-pad .cv.c7{color:var(--lit-ink);}
.f7padw .cdk-pad .cv.cfz{color:#8fdcff;}
.f7padw .cdk-pad .cv .mk b{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;border-radius:.4em;background:var(--lit);color:var(--gold-ink,#2b1a00);font-weight:800;}
.f7padw .cdk-pad .cv .mk svg{width:1.6em;height:1.6em;color:#7fd8ff;}
/* the round as it stands */
.f7side{overflow:hidden;}
.f7race{flex:none;display:flex;flex-direction:column;}
.f7r{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:.55em;row-gap:calc(.32em + var(--rg,0px) * .2);padding:calc(.4em + var(--rg,0px) * .4) 1.2em;}
.f7r .avatar{width:1.7em;height:1.7em;font-size:.8em;}
.f7r .avatar .ico{width:62%;height:62%;}
.f7r .nm{min-width:0;font-weight:700;line-height:1.1;overflow-wrap:break-word;}
.f7r.me .nm{color:var(--lit-ink);}
.f7r .pts{white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums;}
.f7r .pts i{margin-left:.4em;font-style:normal;font-weight:650;font-size:.86em;color:var(--text-3);}
.f7r.safe .pts i{color:var(--text);}
.f7r.out .pts i{color:var(--bad-ink,#ff8f9c);}
.f7r .bar{grid-column:1 / -1;position:relative;height:calc(.5em + var(--rg,0px) * .2);border-radius:1em;background:var(--gl-2);overflow:hidden;}
.f7r .bar b{position:absolute;left:0;top:0;bottom:0;min-width:0;background:var(--c);}
.f7r .bar i{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(115deg,color-mix(in srgb,var(--c) 75%,transparent) 0 3px,transparent 3px 6px);}
.f7r.safe .bar i{background:color-mix(in srgb,var(--c) 55%,#fff 12%);}
.f7r.now::before{content:"";position:absolute;left:.35em;top:.45em;bottom:.45em;width:3px;border-radius:3px;background:var(--lit);box-shadow:0 0 8px var(--litg);}
.f7side.tight .f7r{padding-top:.26em;padding-bottom:.26em;}
.f7side.tight .f7r .bar{display:none;}
.f7side.two .f7race{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
.f7side.two .f7r{padding-left:1em;padding-right:.8em;}
.f7key{flex:none;display:flex;flex-wrap:wrap;gap:.2em 1.1em;padding:.35em 1.25em .2em;font-size:.76em;font-weight:600;color:var(--text-3);}
.f7key span{display:inline-flex;align-items:center;gap:.45em;white-space:nowrap;}
.f7key i{display:block;width:1.5em;height:.5em;border-radius:1em;background:repeating-linear-gradient(115deg,var(--text-2) 0 3px,transparent 3px 6px);}
.f7key i.s{background:var(--text-2);}
.f7ev{flex:none;display:flex;flex-direction:column;}
.f7ev p{margin:0;padding:.36em 1.25em;font-size:.88em;font-weight:600;line-height:1.3;color:var(--text-2);text-wrap:pretty;}
.f7ev p:first-of-type{color:var(--text);}
</style>
</head>
<body>
<main class="stage f7" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'flip7_state', KEY = 'flip7', PAD_KEY = 'f7', BONUS = 15;
  // Each number has its own colour, like the real deck
  var NUMC = ['#2b2b33', '#9a7b6c', '#8f9a14', '#e0306f', '#14998c', '#3a9a3e', '#8e2bb0', '#e0352f', '#f0561d', '#c48d00', '#3346b0', '#0093a8', '#5d7484'];
  var SNOW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="m9 3.5 3 2.5 3-2.5M9 20.5l3-2.5 3 2.5M3.5 10.6l3.7-.6-1.3-3.5M20.5 13.4l-3.7.6 1.3 3.5M5.9 17.5l1.3-3.5-3.7-.6M18.1 6.5l-1.3 3.5 3.7.6"/></svg>';
  var THREE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="6" width="8" height="12" rx="1.6" transform="rotate(-12 6.5 12)" fill="rgba(255,255,255,.25)"/><rect x="8" y="5" width="8" height="12" rx="1.6" fill="rgba(255,255,255,.35)"/><rect x="13.5" y="6" width="8" height="12" rx="1.6" transform="rotate(12 17.5 12)" fill="rgba(255,255,255,.5)"/></svg>';
  var HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.6-4.7-9.6-9.4C1.1 8.3 3.3 4.8 6.9 4.8c2.1 0 3.5 1.2 5.1 3 1.6-1.8 3-3 5.1-3 3.6 0 5.8 3.5 4.5 6.8C19.6 16.3 12 21 12 21z"/></svg>';

  Kit.init({
    orient: 'portrait',   // phones: sideways leaves no room (the hand or board falls below the screen); tablets turn freely
    id: 'flip7',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: 'Scores so far', onClick: function () { if (S) showScores(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { keys: [PAD_KEY], title: 'Flip 7: past games' }); } }
    ]),
    rules:
      '<p class="goal">Flip cards to build points without getting a <b>duplicate number</b>. First to <b>200</b> at the end of a round wins.</p>' +
      '<h3>Your turn</h3><ul><li><b>Flip</b>: take the next card from the deck.</li><li><b>Stay</b>: stop and keep your points for this round. You are out until the next round.</li>' +
      '<li>Everyone starts the round with one card. Then players take turns, one card at a time, until everyone has stayed or busted.</li></ul>' +
      '<h3>Busting</h3><p>If you flip a number you already have, you <b>bust</b> and score 0 this round.</p>' +
      '<h3>Flip 7</h3><p>Get <b>7 different numbers</b> and the round ends right away for everyone. You get <b>15 bonus points</b>.</p>' +
      '<h3>Special cards</h3><ul>' +
      '<li><b>Freeze</b>: pick any player still in (even you). They stop and keep their points.</li>' +
      '<li><b>Flip Three</b>: pick any player still in (even you). They must flip the next 3 cards. If they flip a Freeze or Flip Three along the way, it is used after the 3 cards.</li>' +
      '<li><b>Second Chance</b>: keep it. If you flip a duplicate, throw away the duplicate and this card instead of busting. You can only hold one; if you flip another, give it to someone still in.</li>' +
      '<li><b>+2 to +10</b>: add to your score. <b>&times;2</b>: doubles your number cards (not the + cards).</li></ul>' +
      '<h3>Scoring</h3><p>Add your numbers, double them if you have &times;2, then add + cards and any Flip 7 bonus. The deck is not reshuffled between rounds, so watch what has gone by.</p>' +
      '<h3>Online</h3><ul><li><b>Play online</b> beside the start button: open a table and up to 7 others join on their own devices. The computer plays any seat that nobody takes.</li>' +
      '<li>Your seat is the big one at the bottom. Take your turn whenever you like; the home screen shows when it’s your move, or when it’s yours to say who gets a Freeze or a Flip Three.</li>' +
      '<li>When a round ends, the next one is dealt at once, and everyone sees the scores for the round just played.</li>' +
      '<li>Moves can’t be taken back online.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null, token = 0, timer = null, undoStack = [], says = [], flyIds = [];
  // Online (turnnet.js): NET is the table, ME your seat there (the big spot at the bottom; seat 0 on one device).
  // QUIET: the rules running for the online table, which collect each step's sounds and words to play back instead
  var NET = null, ME = 0, QUIET = null, NETBUSY = false;
  var FX = {
    sfx: function (n) { if (QUIET) QUIET.push(['sfx', n]); else Kit.sfx(n); },
    haptic: function (k, p) { if (QUIET) QUIET.push(['hap', k, p]); else if (p == null || human(p)) Kit.haptic(k); },
    callout: function (t) { if (QUIET) QUIET.push(['call', t]); else Kit.callout(t); },
    confetti: function (p) { if (QUIET) QUIET.push(['conf', p]); else if (human(p)) Kit.confetti({ count: 80 }); },
    toast: function (t) { if (QUIET) QUIET.push(['toast', t]); else Kit.toast(t); },
    moment: function (o) { if (QUIET) QUIET.push(['mo', o]); else Kit.moment(o); }
  };
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'over') Kit.resume.set(solo() ? 'Round ' + S.round + ' · you have ' + S.players[0].total : 'Round ' + S.round + ' of pass & play');
  }
  function clearSave() { token++; clearTimeout(timer); try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  function showSetup() {
    S = null; token++; clearTimeout(timer); deskClass('');
    Kit.setup(app, {
      modes: Kit.modes(['cpu', { id: 'local' }]),
      players: { min: 3, max: 8, count: 4, cpu: function (m) { return m === 'cpu' ? 'seats' : m === 'local' ? 'mix' : false; } },
      options: [{ id: 'target', label: 'Play to', help: 'The first player to reach this many points wins.', value: 200, choices: [[100, '100\nQuick'], [200, '200\nStandard']] },
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: LEVELS }],
      onStart: function (cfg) {
        newGame(cfg.players.map(function (p) { return { name: p.name, cpu: p.cpu, level: p.cpu ? lvName(p.level || cfg.options.level) : undefined }; }), +cfg.options.target || 200);   // (each robot its own skill)
      }
    });
  }

  function makeDeck() {
    var d = [], id = 0;
    function add(k, v) { d.push({ id: 'k' + (id++), k: k, v: v }); }
    add('n', 0);
    for (var n = 1; n <= 12; n++) for (var i = 0; i < n; i++) add('n', n);
    [2, 4, 6, 8, 10].forEach(function (v) { add('m', v); });
    add('x2', 2);
    for (var j = 0; j < 3; j++) { add('fz'); add('f3'); add('sc'); }
    return Cards.shuffle(d);
  }
  function newGame(players, target) {
    var n = players.length;
    S = {
      target: target, round: 0, rounds: [], details: [], ev: [], started: Date.now(),
      dealer: n - 1, deck: makeDeck(), discard: [],
      players: players.map(function (p) { return { name: p.name, cpu: p.cpu, level: p.level, total: 0, bold: p.cpu ? 0.95 + Math.random() * 0.45 : 1 }; })
    };
    Kit.gameStart();
    undoStack = [];
    newRound(true);
  }
  function newRound(first) {
    newRoundCore(first);
    undoStack = [];
    Kit.sfx('deal');
    save(); render(); pump(500);
  }
  // a new round (the rules only: online tables deal with it too)
  function newRoundCore(first) {
    var n = S.players.length;
    S.round++;
    if (!first) S.dealer = (S.dealer + 1) % n;
    S.rows = S.players.map(function () { return []; });
    S.deferred = S.players.map(function () { return []; });
    S.status = S.players.map(function () { return 'in'; });
    S.queue = []; S.choose = null; S.dealt = 0; S.turn = -1; S.acted = true;
    S.phase = 'deal'; S.lastRound = null;
    S.msg = S.players[S.dealer].cpu || NET || QUIET ? S.players[S.dealer].name + ' deals' : 'You deal';
  }

  // ── Card helpers ──────────────────────────────────────────────────────────
  // One person at the table (seat 0 against computers): they're "you". More than one person: everyone by name.
  function solo() { return S.players.filter(function (p) { return !p.cpu; }).length === 1; }
  function human(p) { return p >= 0 && (NET && !QUIET ? p === ME : !S.players[p].cpu); }
  function isYou(p) { return QUIET ? false : NET ? p === ME : p === 0 && solo(); }
  // a computer player (online: also a seat the computer took over when its player left)
  function isCpu(p) { return NET ? !!(NET.seats[p] && NET.seats[p].bot) : !!S.players[p].cpu; }
  function who(p) { return isYou(p) ? 'You' : S.players[p].name; }
  function youOr(p) { return isYou(p) ? 'you' : S.players[p].name; }
  function vb(p, you, them) { return isYou(p) ? you : them; }
  function cardName(c) {
    return c.k === 'n' ? String(c.v) : c.k === 'm' ? '+' + c.v : c.k === 'x2' ? '×2' : c.k === 'fz' ? 'Freeze' : c.k === 'f3' ? 'Flip Three' : 'Second Chance';
  }
  function article(c) { return c.k === 'n' ? (c.v === 8 || c.v === 11 ? 'an ' : 'a ') + c.v : c.k === 'm' ? '+' + c.v : c.k === 'x2' ? '×2' : 'a ' + cardName(c); }
  function calc(p) {
    var nums = 0, x2 = false, mods = 0, u = {};
    S.rows[p].forEach(function (c) {
      if (c.k === 'n' && !c.dup) { nums += c.v; u[c.v] = 1; }
      else if (c.k === 'm') mods += c.v;
      else if (c.k === 'x2') x2 = true;
    });
    var uniq = Object.keys(u).length;
    return { nums: nums, x2: x2, mods: mods, uniq: uniq, f7: uniq >= 7, pts: (x2 ? nums * 2 : nums) + mods + (uniq >= 7 ? BONUS : 0) };
  }
  function shown(p) { return S.status[p] === 'bust' ? 0 : calc(p).pts; }
  function hasNum(p, v) { return S.rows[p].some(function (c) { return c.k === 'n' && !c.dup && c.v === v; }); }
  function hasSC(p) { return S.rows[p].some(function (c) { return c.k === 'sc'; }); }
  function active() { var a = []; S.status.forEach(function (s, p) { if (s === 'in') a.push(p); }); return a; }
  // What a careful player could know: the cards not yet seen (the deck, by counting)
  function odds(p) {
    var pool = S.deck.length ? S.deck : S.discard, c = calc(p), dup = 0, gain = 0;
    pool.forEach(function (x) {
      if (x.k === 'n') { if (hasNum(p, x.v)) dup++; else gain += x.v * (c.x2 ? 2 : 1); }
      else if (x.k === 'm') gain += x.v;
      else if (x.k === 'x2') gain += c.nums;
    });
    var n = pool.length || 1;
    return { pb: dup / n, gain: gain / n };
  }

  function drawCard() {
    if (!S.deck.length) {
      if (!S.discard.length) return null;
      S.deck = Cards.shuffle(S.discard); S.discard = [];
      FX.toast('Out of cards: shuffling the discards'); FX.sfx('whoosh');
    }
    return S.deck.pop();
  }

  // ── Engine: one visible event per step ───────────────────────────────────
  function pump(ms) {
    clearTimeout(timer);
    var t = token;
    timer = setTimeout(function () { if (t === token && S) step(); }, ms);
  }
  function waitMs(fast, slow) { return S.status[0] === 'in' ? slow : fast; }

  function step() {
    if (!S || (S.phase !== 'deal' && S.phase !== 'play')) return;
    if (S.status.indexOf('flip7') >= 0) return endRound();
    if (S.choose) {
      if (human(S.choose.p)) { render(); return; }      // waiting for a person to choose
      applyChoice(cpuTarget(S.choose));
      return after(750);
    }
    if (S.queue.length) {
      var ms = runTask(S.queue.shift());
      return after(ms);
    }
    if (S.phase === 'deal') {
      var n = S.players.length;
      while (S.dealt < n) {
        var p = (S.dealer + 1 + S.dealt) % n; S.dealt++;
        if (S.status[p] === 'in') { S.queue.push({ t: 'draw', p: p }); return step(); }
      }
      S.phase = 'play'; S.turn = S.dealer; S.acted = true;
    }
    // Play: turns go around to the left until nobody is still in
    var act = active();
    if (!act.length) return endRound();
    if (S.acted || S.status[S.turn] !== 'in') {
      S.turn = nextActive(S.turn); S.acted = false;
      S.msg = isYou(S.turn) ? 'Your turn' : human(S.turn) ? S.players[S.turn].name + ', your turn' : S.players[S.turn].name + ' is thinking…';
      save(); render();
      if (human(S.turn)) { Kit.haptic('light'); return; }
      return pump(waitMs(380, 620));
    }
    if (human(S.turn)) { render(); return; }
    // Computer's turn
    var p2 = S.turn;
    S.acted = true;
    if (cpuHit(p2)) { S.queue.push({ t: 'draw', p: p2 }); return step(); }
    S.status[p2] = 'stay';
    S.msg = S.players[p2].name + ' stays with ' + calc(p2).pts;
    say(p2, 'Stay');
    Kit.sfx('chip');
    after(waitMs(420, 650));
  }
  function after(ms) {
    if (S.status.indexOf('flip7') >= 0) { save(); render(); return pump(1500); }
    save(); render();
    if (S.choose && human(S.choose.p)) { Kit.haptic('medium'); return; }
    pump(ms);
  }
  function nextActive(from) {
    var n = S.players.length;
    for (var i = 1; i <= n; i++) { var q = (from + i) % n; if (S.status[q] === 'in') return q; }
    return -1;
  }

  function runTask(t) {
    if (t.t === 'act') {
      if (S.status[t.p] !== 'in') { S.discard.push(t.c); return 0; }
      return offerAction(t.p, t.c);
    }
    if (t.t === 'f3end') {
      var later = S.deferred[t.p]; S.deferred[t.p] = [];
      if (S.status[t.p] === 'in') S.queue = later.map(function (c) { return { t: 'act', p: t.p, c: c }; }).concat(S.queue);
      else later.forEach(function (c) { S.discard.push(c); });
      return 250;
    }
    // draw
    var p = t.p;
    if (S.status[p] !== 'in') return 0;
    var c = drawCard();
    if (!c) { S.status.forEach(function (s, i) { if (s === 'in') S.status[i] = 'stay'; }); S.msg = 'The deck ran out'; return 600; }
    var slow = waitMs(480, 700) + (t.f3 ? 0 : 60);
    if (c.k === 'n') {
      if (hasNum(p, c.v)) {
        if (hasSC(p)) {
          var sc = S.rows[p].filter(function (x) { return x.k === 'sc'; })[0];
          S.rows[p] = S.rows[p].filter(function (x) { return x !== sc; });
          S.discard.push(sc, c);
          S.ev.push({ k: 'save', p: p, r: S.round, v: c.v });
          S.msg = 'Second Chance saves ' + youOr(p) + ' from a ' + c.v + '!';
          say(p, 'Saved!', 'good'); FX.sfx('good'); FX.haptic('success', p);
          return slow + 300;
        }
        var before = calc(p).pts, six = calc(p).uniq >= 6;
        c.dup = true; S.rows[p].push(c); fly(c);
        // one card from a Flip 7: the nearest miss in the game gets its own (sad) moment
        if (six) { S.ev.push({ k: 'six', p: p, r: S.round, v: c.v, pts: before }); FX.moment({ tone: 'bad', chip: '6', title: 'So close', line: S.players[p].name + ' had six different numbers and busted on ' + article(c) + '.', ms: 2200 }); }
        S.status[p] = 'bust';
        S.ev.push({ k: 'bust', p: p, r: S.round, v: c.v, pts: before });
        S.msg = who(p) + ' ' + vb(p, 'bust', 'busts') + ' on ' + article(c) + '!';
        say(p, 'Bust!', 'bad'); FX.sfx('bad'); FX.haptic('error', p);
        return slow + 300;
      }
      S.rows[p].push(c); fly(c); FX.sfx('flip');
      var cc = calc(p);
      if (cc.uniq >= 7) {
        S.status[p] = 'flip7'; S.queue = []; S.choose = null;
        S.ev.push({ k: 'f7', p: p, r: S.round, pts: cc.pts });
        S.msg = who(p) + ' flipped 7!';
        FX.moment({ big: true, chip: '7', title: 'Flip 7', line: S.players[p].name + ' turned up seven different numbers. The round ends for everyone, with ' + BONUS + ' bonus points.', pts: '+' + cc.pts, color: '#ffd34d', ms: 2600 });
        FX.sfx('win'); FX.haptic('success'); FX.confetti(p);
        return 1500;
      }
      S.msg = who(p) + ' ' + vb(p, 'flip', 'flips') + ' ' + article(c) + (t.f3 ? ' (' + t.f3 + ' of 3)' : '');
      return slow;
    }
    if (c.k === 'm' || c.k === 'x2') {
      S.rows[p].push(c); fly(c); FX.sfx('chip');
      S.msg = who(p) + ' ' + vb(p, 'get', 'gets') + ' ' + article(c) + (c.k === 'x2' ? '! Numbers double' : ' bonus');
      return slow;
    }
    if (c.k === 'sc') {
      FX.sfx('pop');
      if (!hasSC(p)) { S.rows[p].push(c); fly(c); S.msg = who(p) + ' ' + vb(p, 'get', 'gets') + ' a Second Chance'; return slow; }
      var tg = active().filter(function (q) { return q !== p && !hasSC(q); });
      if (!tg.length) { S.discard.push(c); S.msg = 'Another Second Chance, but nobody can take it'; return slow; }
      S.choose = { p: p, c: c, kind: 'sc', targets: tg };
      S.msg = who(p) + ' already ' + vb(p, 'have', 'has') + ' a Second Chance';
      if (tg.length === 1) { applyChoice(tg[0]); }
      return slow + 200;
    }
    // Freeze / Flip Three
    FX.sfx('pop');
    if (t.f3) {
      S.deferred[p].push(c);
      S.msg = who(p) + ' ' + vb(p, 'flip', 'flips') + ' ' + article(c) + ': used after the 3 cards';
      return slow + 200;
    }
    return offerAction(p, c);
  }
  function offerAction(p, c) {
    var tg = active();
    S.choose = { p: p, c: c, kind: c.k, targets: tg };
    S.msg = c.k === 'fz' ? who(p) + ' ' + vb(p, 'flip', 'flips') + ' a Freeze' : who(p) + ' ' + vb(p, 'flip', 'flips') + ' a Flip Three';
    if (tg.length === 1) { applyChoice(tg[0]); return waitMs(600, 900); }
    return waitMs(500, 750);
  }
  function applyChoice(q) {
    var ch = S.choose; if (!ch) return;
    S.choose = null;
    var c = ch.c, p = ch.p;
    if (ch.kind === 'sc') {
      S.rows[q].push(c); fly(c, true);
      S.msg = who(p) + ' ' + vb(p, 'give', 'gives') + ' the Second Chance to ' + youOr(q);
      say(q, '+ Second Chance', 'good'); FX.sfx('chip');
      return;
    }
    S.rows[q].push(c); fly(c, true);
    if (ch.kind === 'fz') {
      S.status[q] = 'frozen';
      S.ev.push({ k: 'freeze', by: p, p: q, r: S.round, pts: calc(q).pts });
      S.msg = q === p ? who(p) + ' ' + vb(p, 'freeze yourself', 'freezes themselves') + ' at ' + calc(q).pts
        : who(p) + ' ' + vb(p, 'freeze', 'freezes') + ' ' + youOr(q) + ' at ' + calc(q).pts;
      say(q, 'Frozen'); FX.sfx('whoosh'); FX.haptic('medium', q);
    } else {
      S.msg = (q === p ? who(p) + ' ' + vb(p, 'flip three yourself', 'flips three') : who(p) + ' ' + vb(p, 'make', 'makes') + ' ' + youOr(q) + ' flip three');
      say(q, 'Flip three!'); FX.sfx('whoosh');
      S.ev.push({ k: 'f3', by: p, p: q, r: S.round });
      S.queue = [{ t: 'draw', p: q, f3: 1 }, { t: 'draw', p: q, f3: 2 }, { t: 'draw', p: q, f3: 3 }, { t: 'f3end', p: q }].concat(S.queue);
    }
  }

  // ── Computer players (they only use what's on the table) ──────────────────
  function bestOther(p) {
    var m = 0;
    S.players.forEach(function (pl, q) { if (q !== p) m = Math.max(m, pl.total + shown(q)); });
    return m;
  }
  // Its skill. Normal is how it has always played; a game saved before there were levels plays Normal.
  // (Two levels: Normal already counts the cards. Robots that took more or less risk on the same count were
  // measured against it and none won more than its even share of games.)
  var LEVELS = [['easy', 'Easy', 'Stays as soon as it has 20 points, whatever cards are left.'],
    ['normal', 'Normal', 'Counts the cards that are left and weighs what another card could win against what it could lose.']];
  function lvName(v) { return v === 'easy' ? v : 'normal'; }
  function cpuHit(p) {
    var c = calc(p), s = c.pts, tot = S.players[p].total, o = odds(p), lv = lvName(S.players[p].level);
    if (s === 0 && !c.x2) return true;
    var others = bestOther(p);

  }
  function netOver(st) {
    if (!st || st.phase !== 'over') return null;
    var top = Math.max.apply(null, st.players.map(function (p) { return p.total; })), w = [];
    st.players.forEach(function (p, i) { if (p.total === top) w.push(i); });
    return { win: w, text: st.players[w[0]].name + ' wins with ' + top };
  }
  // (inside withS) what the table looks like after one step, with what that step said and sounded like
  function snap(steps) {
    steps.push({ m: S.msg, rows: JSON.parse(JSON.stringify(S.rows)), st: S.status.slice(), df: JSON.parse(JSON.stringify(S.deferred)), ch: S.choose ? JSON.parse(JSON.stringify(S.choose)) : null,
      ph: S.phase, rd: S.round, dl: S.dealer, en: S.ev.length, tot: S.players.map(function (p) { return p.total; }), tu: S.turn, dc: S.discard[S.discard.length - 1] || null, dn: S.discard.length, fx: QUIET });
    QUIET = [];
  }
  // (inside withS) the rules run on until someone has a choice to make: step() without the waits
  function settle(steps) {
    for (var k = 0; k < 600; k++) {
      if (S.phase !== 'deal' && S.phase !== 'play') return;
      if (S.status.indexOf('flip7') >= 0) { roundEnd(steps); continue; }
      if (S.choose) return;
      if (S.queue.length) { runTask(S.queue.shift()); snap(steps); continue; }
      if (S.phase === 'deal') {
        var n = S.players.length, more = false;
        while (S.dealt < n) { var p = (S.dealer + 1 + S.dealt) % n; S.dealt++; if (S.status[p] === 'in') { S.queue.push({ t: 'draw', p: p }); more = true; break; } }
        if (more) continue;
        S.phase = 'play'; S.turn = S.dealer; S.acted = true;
      }
      if (!active().length) { roundEnd(steps); continue; }
      if (S.acted || S.status[S.turn] !== 'in') { S.turn = nextActive(S.turn); S.acted = false; S.msg = S.players[S.turn].name + '’s turn'; }
      return;
    }
  }
  function roundEnd(steps) {
    var won = endRoundCore();
    S.ended = S.round; S.msg = 'Round ' + S.round + ' is over';
    QUIET.push(['end', S.round]); snap(steps);
    if (won) { S.phase = 'over'; return; }
    newRoundCore(); QUIET.push(['sfx', 'deal']); snap(steps);
  }
  // seat p's choice, on the table's own copy: {state, mv}, or null when it can't be made
  function netApply(st, p, a) {
    if (!a || netTurn(st).indexOf(p) < 0) return null;
    return withS(st, function () {
      var steps = [];
      if (a.t === 'pick') {
        if (!S.choose || S.choose.p !== p || S.choose.targets.indexOf(a.q) < 0) return null;
        applyChoice(a.q); snap(steps);
      } else {
        if (S.choose || S.turn !== p) return null;
        S.acted = true;
        if (a.t === 'hit') S.queue.push({ t: 'draw', p: p });
        else if (a.t === 'stay') { S.status[p] = 'stay'; S.msg = S.players[p].name + ' stays with ' + calc(p).pts; say(p, 'Stay'); FX.sfx('chip'); snap(steps); }
        else return null;
      }
      settle(steps);
      return { state: S, mv: { t: a.t, p: p, steps: steps } };
    });
  }
  function netBot(st, p) {
    if (netTurn(st).indexOf(p) < 0) return null;
    var a = withS(st, function () { return S.choose ? { t: 'pick', q: cpuTarget(S.choose) } : { t: cpuHit(p) ? 'hit' : 'stay' }; });
    return netApply(st, p, a);
  }
  function netYou(a) {
    if (!NET) return;
    if (!NET.myTurn()) { Kit.toast('Wait for your turn'); Kit.haptic('error'); return; }
    var seat = NET.seat;
    if (a.t !== 'pick') Kit.haptic(a.t === 'stay' ? 'medium' : 'light');
    NET.act(function (st) { return netApply(st, seat, a); });
  }

  // Drawing the table: each move played back one step at a time. A backlog is caught up quickly.
  function netShow(net, info) {
    info = info || {};
    NET = net; ME = Math.max(0, net.seat);
    var e = { st: JSON.parse(JSON.stringify(net.state)), info: info };
    if (info.fresh || info.again) { NETQ = [e]; if (NETBUSY) { token++; NETBUSY = false; } netCloseOv(); }
    else NETQ.push(e);
    if (!NETBUSY) netNext();
  }
  function netNext() {
    if (!NET) { NETQ = []; NETBUSY = false; return; }
    var e = NETQ.shift();
    if (!e) { NETBUSY = false; if (S) render(); return; }
    NETBUSY = true;
    netDraw(e.st, e.info, NETQ.length > 2 || document.hidden, netNext);
  }
  // the final table with one step's cards and words on it
  function stepView(fin, x) {
    var v = JSON.parse(JSON.stringify(fin));
    v.msg = x.m; v.rows = x.rows; v.status = x.st; v.deferred = x.df; v.choose = x.ch; v.phase = x.ph === 'over' ? 'roundover' : x.ph; v.round = x.rd; v.dealer = x.dl; v.turn = x.tu; v.acted = true; v.queue = [];
    v.players.forEach(function (p, i) { p.total = x.tot[i]; });
    if (x.en != null && v.ev) v.ev = v.ev.slice(0, x.en);
    v.discard = []; for (var i = 0; i < x.dn; i++) v.discard.push(x.dc);
    return v;
  }
  function netDraw(st, info, quick, done) {
    var mv = info.mv, t = ++token, steps = mv && mv.steps || [], ended = 0;
    function later(ms, f) { setTimeout(function () { if (t === token && NET) f(); }, ms); }
    function finish2() {
      S = st; render();
      if (st.phase === 'over') later(info.fresh ? 300 : 700, netEnd);
      else if (ended && !quick) netRoundNote(ended);
      done();
    }
    if (info.again) { Kit.sfx('deal'); Kit.callout('New game'); }
    if (quick || info.fresh || info.again || !steps.length) { if (quick) steps.forEach(function (x) { x.fx.forEach(function (f) { if (f[0] === 'end') ended = f[1]; }); }); return finish2(); }
    var i = 0;
    (function one() {
      if (i >= steps.length) return finish2();
      var x = steps[i++], ms = 520, end = 0;
      S = stepView(st, x);
      x.fx.forEach(function (f) {
        if (f[0] === 'say') say(f[1], f[2], f[3]);
        else if (f[0] === 'fly') fly({ id: f[1] }, f[2]);
        else if (f[0] === 'end') { end = f[1]; ms = DKS ? 2400 : 900; }
      });
      render();
      x.fx.forEach(function (f) {
        if (f[0] === 'sfx') Kit.sfx(f[1]);
        else if (f[0] === 'call') { Kit.callout(f[1]); ms = 1500; }
        else if (f[0] === 'mo') { Kit.moment(f[1]); ms = Math.max(ms || 0, f[1].big ? 2000 : 1200); }
        else if (f[0] === 'conf' && f[1] === ME) Kit.confetti({ count: 80 });
        else if (f[0] === 'hap' && (f[2] == null || f[2] === NET.seat)) Kit.haptic(f[1]);
        else if (f[0] === 'toast') Kit.toast(f[1]);
      });
      if (end) ended = end;
      if (x.ch && x.ch.p === NET.seat) Kit.haptic('medium');
      later(ms, one);
    })();
  }
  function netCloseOv() { if (NETSHEET) { try { NETSHEET.close(); } catch (e) {} NETSHEET = null; } if (NETWIN) { try { NETWIN.close(); } catch (e) {} NETWIN = null; } }
  // the scores for the round just played (once per device; the next round is already dealt)
  function netRoundNote(rd) {
    if (!NET || S.phase === 'over') return;
    var key = NET.code + ':' + S.started + ':' + rd;
    if (NETSEEN[key]) return; NETSEEN[key] = 1;
    if (NETSHEET) try { NETSHEET.close(); } catch (e) {}
    if (DKS) { NETSHEET = null; return; }   // (a large window: the round was written on the score sheet as it ended)
    NETSHEET = showScores(true, { round: rd });
  }
  function netEnd() {
    if (!NET || !S || S.phase !== 'over') return;
    var key = NET.code + ':' + S.started;
    if (NETWIN && NETWIN.key === key) return;
    netCloseOv();
    NETWIN = finish() || null;
    if (NETWIN) NETWIN.key = key;
  }
  function netLeave() {
    NET = null; ME = 0; NETQ = []; NETBUSY = false; token++;
    netCloseOv();
    var sv = null; try { sv = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv && sv.players && sv.rows && sv.phase !== 'over') { S = sv; render(); if (S.phase === 'roundover') setTimeout(function () { if (!DKS) showScores(true); }, 300); else pump(700); }
    else showSetup();
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.players && saved.rows && saved.phase !== 'over') {
    S = saved; Kit.gameStart();
    render();
    if (S.phase === 'roundover') {
      var top = Math.max.apply(null, S.players.map(function (p) { return p.total; }));
      if (top >= S.target && S.players.filter(function (p) { return p.total === top; }).length === 1) finish();
      else setTimeout(function () { if (!DKS) showScores(true); }, 300);
    } else pump(700);
  } else showSetup();

  // Test hook (the demo, games/demos/flip7-ai.js): start a game, then arrange the round (the deck's order, the rows)
  // and carry on from there
  window.__flip7 = {
    state: function () { return S; },
    start: function (cfg) { token++; clearTimeout(timer); newGame(cfg.players, cfg.target || 200); },
    set: function (fn, ms) { token++; clearTimeout(timer); if (fn) fn(S); undoStack = []; save(); render(); if (!(ms < 0)) pump(ms == null ? 400 : ms); }
  };

  // online tables (after the local game is drawn): opens ?online=1&room=CODE from the home screen
  TurnNet.setup({
    game: 'flip7', title: 'Flip 7', min: 2, max: 8, botMs: 750,
    seats: function (n, o) { return Math.max(n, 3, Math.min(8, +(o && o.seats) || n)); },
    opts: netOpts, start: netStart, turn: netTurn, over: netOver, bot: netBot,
    show: netShow, leave: netLeave
  });
})();
</script>
</body>
</html>

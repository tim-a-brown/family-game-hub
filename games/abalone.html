<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abalone</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="abalone-core.js"></script>
<style>
.ab-col{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.ab-credit{margin:-6px 0 2px;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-3);}
@media (max-height:600px){.ab-credit{display:none;}}

/* A player's plate: their marble, their name and whose turn, and the tray of the other color's marbles they have
   pushed off the board (six wins) */
.pbar{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px 6px 10px;border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s,background .2s;}
.pbar.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 18%,transparent);}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;}
.pbar .nm{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.pbar .nm .ico{width:15px;height:15px;color:var(--text-3);flex:none;}
.pbar .sub{font-size:.72rem;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pbar.on .sub{color:var(--lit-ink);}
.tok{--d:28px;width:var(--d);height:var(--d);border-radius:50%;flex:none;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}
.tray{--s:17px;display:flex;gap:3px;padding:4px 6px;border-radius:999px;flex:none;
  background:linear-gradient(180deg,#1d120a,#3a2516);box-shadow:inset 0 2px 4px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.12),0 1px 0 rgba(255,255,255,.06);}
.tray .slot{width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 50% 60%,rgba(0,0,0,.55),rgba(0,0,0,.2) 70%);position:relative;}
.tray .slot.last{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--lit) 55%,transparent);}
.tray .slot .tok{--d:100%;position:absolute;inset:0;}
.tray .slot .tok.new{animation:slotpop .5s var(--spring);}
@keyframes slotpop{0%{transform:scale(.3);}60%{transform:scale(1.25);}100%{transform:scale(1);}}

/* Marbles: black onyx and white pearl */
.mbl,.tok.b{background:radial-gradient(circle at 34% 28%,#9aa0ad 0,#3a3d46 16%,#141519 48%,#030304 100%);box-shadow:inset 0 -2px 3px rgba(255,255,255,.08),0 2px 3px rgba(0,0,0,.55);}
.mwh,.tok.w{background:radial-gradient(circle at 34% 28%,#ffffff 0,#f6f3ec 22%,#d9d2c4 62%,#9d9585 100%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.18),0 2px 3px rgba(0,0,0,.55);}

/* The board: a hexagon of walnut round a slate field of 61 holes */
.frame{position:relative;aspect-ratio:1000/866;width:100%;touch-action:none;user-select:none;-webkit-user-select:none;view-transition-name:ab-board;}
.frame>svg.bsv{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));}
.frame .lay{position:absolute;inset:0;}
.mb{position:absolute;width:8.8%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);transition:left .3s cubic-bezier(.3,.75,.3,1),top .3s cubic-bezier(.3,.75,.3,1);will-change:left,top;z-index:2;}
.mb::after{content:"";position:absolute;left:20%;top:13%;width:30%;height:22%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);transform:rotate(-28deg);pointer-events:none;}
.mb.mbl::after{opacity:.55;}
.mb.pushed{transition-delay:.06s;}
.mb.sel{box-shadow:0 0 0 3px var(--lit),0 0 18px 2px var(--litg),0 3px 4px rgba(0,0,0,.5);z-index:3;}
.mb.lastm::before{content:"";position:absolute;left:41%;top:41%;width:18%;height:18%;border-radius:50%;background:#ff7a59;box-shadow:0 0 0 1.5px rgba(0,0,0,.25);}
.mb.pv{box-shadow:0 0 0 2.5px #ff7a59,0 0 14px rgba(255,110,80,.55),0 3px 4px rgba(0,0,0,.5);}
.mb.pvx{animation:pvx 1s ease-in-out infinite;}
@keyframes pvx{50%{box-shadow:0 0 0 4px #ff5b3a,0 0 22px 4px rgba(255,80,50,.8),0 3px 4px rgba(0,0,0,.5);}}
.mb.lift{transition:none;z-index:6;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4));}
.mb.ghost{opacity:.42;transition:none;pointer-events:none;z-index:1;}
.mb.landed{animation:land .32s ease-out;}
@keyframes land{40%{transform:translate(-50%,-50%) scale(1.08);}}
.mb.hit{animation:hit .34s ease-out .06s;}
@keyframes hit{30%{transform:translate(-50%,-50%) scale(.9,1.08);}}
/* where the chosen marbles can go: a gold arrow on each way they can move; a push's arrow is warm red */
.ar{position:absolute;width:8.2%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:5;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 50% 35%,#ffe9a0,#f6b93b 75%);
  box-shadow:0 0 0 2px rgba(255,236,170,.9),0 0 16px var(--litg),0 3px 6px rgba(0,0,0,.45);opacity:.94;animation:arin .28s var(--spring) both;}
.ar svg{width:70%;height:70%;color:#2a1c00;pointer-events:none;}
.ar.push{width:7%;z-index:6;}
.ar.push{background:radial-gradient(circle at 50% 35%,#ff9d7f,#e8472b 75%);box-shadow:0 0 0 2px #ffb39f,0 0 16px rgba(255,110,80,.6),0 3px 6px rgba(0,0,0,.45);}
.ar.push svg{color:#fff;}
.ar.hot{transform:translate(-50%,-50%) scale(1.18);}
@keyframes arin{from{transform:translate(-50%,-50%) scale(.4);opacity:0;}}
.dst{position:absolute;width:5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 0 2px color-mix(in srgb,var(--lit) 70%,transparent);pointer-events:none;z-index:1;}
.frame.shake{animation:shake .35s;}
/* a marble pushed off: it rides over the frame's edge and drops away */
.mb.gone{z-index:4;}
.fly{position:fixed;border-radius:50%;z-index:60;pointer-events:none;}

.turn{margin:2px 0 0;min-height:34px;}
.acts{display:flex;gap:10px;justify-content:center;margin-top:2px;}
.acts .btn{flex:1;max-width:180px;}

/* A layout for each shape (<html data-o>, set by the script, so a turn of the device glides inside Kit.glide) */
::view-transition-group(*){animation-duration:.45s;animation-timing-function:cubic-bezier(.22,1,.36,1);}
.ab-col>.turn{view-transition-name:ab-turn;}
.ab-col>.acts{view-transition-name:ab-acts;}
.ab-col>.pbar.top{view-transition-name:ab-top;}
.ab-col>.pbar.bot{view-transition-name:ab-bot;}
/* Phone upright: the board as wide as the screen, the column in the middle of the height */
html[data-o=port] #app.stage.ipl{min-height:calc(100dvh - var(--bar));display:flex;flex-direction:column;justify-content:stretch;
  padding-left:8px;padding-right:8px;padding-bottom:calc(var(--safe-b) + 18px);}
html[data-o=port] .ab-col{width:100%;gap:10px;flex:1 1 auto;justify-content:space-evenly;}
html[data-o=port] .ab-col>.frame{width:min(100%,calc((100dvh - var(--bar) - 250px) * 1.155));align-self:center;}
/* a tall phone: the board is held by the width, so the plates take the height left over: the marble and the name with
   whose turn it is, and under them the tray of six as large marbles */
@media (max-width:699px) and (min-height:740px){
  html[data-o=port] .pbar{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"k w" "k t";column-gap:14px;row-gap:8px;padding:12px 16px;min-height:0;}
  html[data-o=port] .pbar>.tok{grid-area:k;--d:52px;align-self:center;}
  html[data-o=port] .pbar>.who{grid-area:w;}
  html[data-o=port] .pbar>.tray{grid-area:t;justify-self:start;--s:min(34px,calc((100vw - 140px) / 6.6));gap:5px;padding:5px 8px;}
  html[data-o=port] .pbar .nm{font-size:1.12rem;}
  html[data-o=port] .pbar .sub{font-size:.8rem;}
  html[data-o=port] .turn{font-size:1.05rem;}
}
@media (max-height:600px){ html[data-o=port] .ab-col{gap:6px;} html[data-o=port] .pbar{min-height:46px;} html[data-o=port] .ab-col>.frame{width:min(100%,calc((100dvh - var(--bar) - 214px) * 1.155));} }
@media (min-width:700px){
  html[data-o=port] #app.stage.ipl{max-width:none;padding-left:16px;padding-right:16px;}
  html[data-o=port] .ab-col{max-width:760px;gap:12px;}
  html[data-o=port] .ab-col>.frame{width:min(100%,calc((100dvh - var(--bar) - 290px) * 1.155));}
  html[data-o=port] .pbar{min-height:64px;padding:8px 16px 8px 12px;}
  html[data-o=port] .pbar .nm{font-size:1.1rem;}
  html[data-o=port] .pbar .sub{font-size:.85rem;}
  html[data-o=port] .tok{--d:36px;}
  html[data-o=port] .tray{--s:26px;gap:5px;padding:5px 8px;}
}
/* Sideways: the players, whose turn and Undo at the left to look at; the board, where the taps go, at the right */
html[data-o=land] #app.stage.ipl{max-width:none;padding:2px max(18px,env(safe-area-inset-right)) calc(var(--safe-b) + 8px) max(18px,env(safe-area-inset-left));}
html[data-o=land] .ab-col{--lc:250px;--cg:clamp(16px,3vw,40px);--bh:calc(100dvh - var(--bar) - 12px - var(--safe-b));--bw:min(calc(var(--bh) * 1.155),calc(100vw - 40px - var(--lc) - var(--cg)));
  max-width:none;height:calc(var(--bw) * .866);display:grid;grid-template-columns:minmax(var(--lc),340px) var(--bw);
  grid-template-rows:max-content max-content minmax(0,1fr) max-content max-content max-content;
  grid-template-areas:"t b" "s b" ". b" "a b" "r b" "p b";column-gap:var(--cg);row-gap:10px;justify-content:center;align-content:center;}
html[data-o=land] .ab-col>.frame{grid-area:b;width:var(--bw);}
html[data-o=land] .ab-col>.pbar.top{grid-area:t;}
html[data-o=land] .ab-col>.pbar.bot{grid-area:p;}
html[data-o=land] .ab-col>.turn{grid-area:s;justify-self:start;}
html[data-o=land] .ab-col>.acts{grid-area:a;justify-content:flex-start;}
html[data-o=land] .ab-col>.ab-room{display:none;}
@media (min-height:600px){
  html[data-o=land] .ab-col{--lc:300px;}
  html[data-o=land] .pbar{min-height:62px;}
  html[data-o=land] .tok{--d:34px;}
  html[data-o=land] .tray{--s:24px;gap:4px;}
}
@media (max-height:420px){ html[data-o=land] .ab-col{row-gap:6px;--lc:230px;} html[data-o=land] .turn{min-height:26px;} html[data-o=land] .pbar{min-height:46px;} }
.ab-room{display:none;}

/* ── The desk: a window larger than a phone's or a tablet's (html.ab-dk, set by deskPlan) ── */
html.ab-dk #app.stage.ipl{max-width:none;padding:0;min-height:0;}
html.ab-dk .ab-col{justify-content:normal;position:fixed;left:var(--x0);top:var(--y0);width:var(--aw);height:var(--ah);max-width:none;margin:0;display:grid;gap:var(--g);
  grid-template-columns:var(--cols);grid-template-rows:max-content max-content max-content max-content minmax(0,1fr);grid-template-areas:var(--areas);}
html.ab-dk .ab-col>.frame{grid-area:b;width:var(--bw);align-self:center;justify-self:center;}
html.ab-dk .ab-col>.pbar.top{grid-area:t;}
html.ab-dk .ab-col>.pbar.bot{grid-area:p;}
html.ab-dk .ab-col>.turn{grid-area:s;justify-self:start;font-size:calc(1rem * var(--dk));}
html.ab-dk .ab-col>.acts{grid-area:a;justify-content:flex-start;}
html.ab-dk .ab-col>.ab-room{grid-area:r;display:flex;flex-direction:column;gap:var(--g);min-height:0;overflow:hidden;view-transition-name:ab-room;}
html.ab-dk .ab-room.row{align-items:flex-start;}
html.ab-dk .pbar{min-height:calc(60px * var(--dk));padding:calc(8px * var(--dk)) calc(14px * var(--dk));}
html.ab-dk .pbar .nm{font-size:calc(1.05rem * var(--dk));}
html.ab-dk .pbar{flex-wrap:wrap;row-gap:6px;}
html.ab-dk .pbar .who{min-width:7.5em;}
html.ab-dk .ab-room.row{flex-direction:row;}
html.ab-dk .ab-room.row>.pn{flex:1 1 0;min-width:0;}


html.ab-dk .pbar .sub{font-size:calc(.82rem * var(--dk));}
html.ab-dk .tok{--d:calc(34px * var(--dk));}
html.ab-dk .tray{--s:calc(24px * var(--dk));gap:calc(4px * var(--dk));}
.pn{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:18px;padding:calc(12px * var(--dk,1)) calc(14px * var(--dk,1));min-height:0;display:flex;flex-direction:column;font-size:calc(.9rem * var(--dk,1));}
.pn h3{margin:0 0 8px;font-size:calc(.82rem * var(--dk,1));font-weight:800;color:var(--text-3);}
.pn.grow{flex:1 1 0;overflow:hidden;}
.pn .rows{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;}
.mvr{display:grid;grid-template-columns:2.6em 1.1em 1fr auto;align-items:center;gap:8px;padding:3px 4px;border-radius:8px;font-variant-numeric:tabular-nums;}
.mvr .no{color:var(--text-3);font-weight:700;text-align:right;}
.mvr .tok{--d:1em;}
.mvr .nt{font-weight:700;white-space:nowrap;}
.mvr .tg{font-size:.8em;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap;}
.mvr .tg.p{background:rgba(255,122,89,.18);color:#ffb39f;}
.mvr .tg.x{background:color-mix(in srgb,var(--lit) 22%,transparent);color:var(--lit-ink);}
.mvr.now{background:color-mix(in srgb,var(--lit) 10%,transparent);}
.stt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.stt th{font-weight:700;color:var(--text-3);text-align:left;padding:3px 0;}
.stt td{text-align:right;font-weight:800;padding:3px 0 3px 10px;}
.stt td .tok{--d:1em;display:inline-block;vertical-align:-.12em;}
.pgr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:4px 2px;border-top:1px solid var(--gl-line);}
.pgr:first-child{border-top:0;}
.pgr .w{font-weight:800;}
.pgr .sc{font-weight:800;font-variant-numeric:tabular-nums;}
.pgr .dt{grid-column:1/-1;font-size:.82em;color:var(--text-3);font-weight:600;}
.pn .none{color:var(--text-3);font-weight:600;}
.offp{gap:10px;}
.ofr{display:flex;flex-direction:column;gap:6px;}
.oft{font-weight:700;}
.ofs{display:flex;gap:calc(6px * var(--dk,1));}
.ofh{width:var(--om,30px);height:var(--om,30px);border-radius:50%;position:relative;flex:none;background:radial-gradient(circle at 50% 60%,rgba(0,0,0,.6),rgba(0,0,0,.25) 70%);box-shadow:inset 0 2px 4px rgba(0,0,0,.6);}
.ofh.last{box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1.5px color-mix(in srgb,var(--lit) 55%,transparent);}
.ofh .tok{--d:100%;position:absolute;inset:0;}
.olast{color:var(--text-3);font-weight:600;}
.mvp .rows{overflow:hidden;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), Core = window.AbaloneCore;
  var SAVE = 'abalone_state', KEY = 'abalone', BLACK = 1, WHITE = 2;
  var SKILL = { easy: 'Easy', normal: 'Normal', hard: 'Hard', expert: 'Expert' };
  var DEMO = Kit.inDemo && Kit.inDemo();

  // Which way the screen is turned, as <html data-o>; a turn of the device moves everything inside Kit.glide
  var R = document.documentElement;
  function shape() { return window.innerWidth > window.innerHeight ? 'land' : 'port'; }
  R.setAttribute('data-o', shape());

  // ── State ────────────────────────────────────────────────────────────────
  // S = the core's state (b, turn, off, n, ml, over, winner, ej, st, start) and {mode, level, cover, players: [{name,
  // cpu, side}], hist: [undo snapshots], started, lo: [_, worst margin for Black, for White], busy}
  var S = null, NET = null, LEFT = null, WINO = null, NETREC = {}, SHOWN = 0;
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && !S.over) Kit.resume.set(S.n ? 'Move ' + (S.n + 1) : 'Ready');
  }
  function clearSave() { if (NET) return; try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function pl(side) { return S.players[0].side === side ? S.players[0] : S.players[1]; }
  function vsCpu() { return S.players.some(function (p) { return p.cpu; }); }
  function colorName(side) { return side === BLACK ? 'Black' : 'White'; }
  function mySide() { if (NET) return NET.seat >= 0 ? S.players[NET.seat].side : 0; return 0; }
  function isMe(p) { return NET ? NET.seat >= 0 && S.players[NET.seat] === p : !p.cpu; }
  function nameOf(p) { return NET && isMe(p) ? 'You' : p.name; }
  function humanTurn() { return S && !S.over && !S.busy && !HOLD && (NET ? !LEFT && NET.myTurn() : !pl(S.turn).cpu); }

  Kit.init({
    id: 'abalone', mark: false, snap: '.frame', snapY: 0.5,
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } cancelThink(); clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Abalone: past games' }); } }]),
    rules:
      '<p class="goal">Be the first to <b>push six of the other player’s marbles off the board</b>.</p>' +
      '<h3>Your turn</h3><ul><li><b>Black moves first.</b> Each player has 14 marbles on a board of 61 holes.</li>' +
      '<li>Move 1, 2 or 3 of your marbles that touch in a straight line, one hole in any of the six directions.</li>' +
      '<li>A move <b>in line</b> goes along the line the marbles lie in. A <b>sideways</b> move shifts every marble into the empty hole beside it, and it can never push.</li>' +
      '<li>Tap a marble, then tap one or two more in the same line to move them together. The gold arrows show every way they can go; tap one, or drag the marbles that way.</li></ul>' +
      '<h3>Pushing</h3><ul><li>A move in line can push the other player’s marbles when yours outnumber them: 3 push 2 or 1, and 2 push 1. This is called a <b>sumito</b>. A push’s arrow is red.</li>' +
      '<li>The hole past the last marble you push has to be empty, or the edge of the board: then that marble goes off the board and into your tray.</li>' +
      '<li>You can’t push equal numbers (1 against 1, 2 against 2, 3 against 3), and you can’t push when one of your own marbles is behind theirs. You can never move your own marble off the board.</li></ul>' +
      '<h3>Starting positions</h3><ul><li><b>Standard</b>: each side starts in three rows at its own end.</li><li><b>Belgian Daisy</b> and <b>German Daisy</b>: each side starts as two flowers of seven marbles, so the fight starts sooner.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b> opens a table, and the other player joins on their own device. Each new game at the table swaps colors.</li></ul>' +
      '<h3>Tips</h3><ul><li>Keep your marbles together and near the middle: a group of three can’t be pushed.</li><li>A marble alone on the edge is in danger.</li></ul>' +
      '<p class="credit">Abalone was designed by Michel Lalet and Laurent Lévi.</p>'
  });

  function showSetup() {
    S = null; deskOff();
    app.classList.remove('ipl');
    Kit.setup(app, {
      modes: Kit.modes([{ id: 'cpu', desc: 'Easy, Normal, Hard or Expert' }, { id: '2p', kind: 'local' }]),
      options: [
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: [['easy', 'Easy', 'Looks at your answer to its move, but often picks a much weaker move than it could.'], ['normal', 'Normal', 'Looks a move further ahead, and keeps its marbles together near the middle.'], ['hard', 'Hard', 'Looks five or six moves ahead and rarely leaves a marble where you can push it off.'], ['expert', 'Expert', 'Looks the furthest ahead of all and takes every marble you leave open.']], when: function (m) { return m === 'cpu'; } },
        { id: 'side', label: 'You play', value: 'b', choices: [['b', 'Black\nMoves first', 'Black always moves first, so you start.'], ['w', 'White', 'The computer plays Black and moves first.']], when: function (m) { return m === 'cpu'; } },
        { id: 'start', label: 'Starting position', value: 'std', choices: [['std', 'Standard', 'Each side starts in three rows at its own end of the board.'], ['belgian', 'Belgian Daisy', 'Each side starts as two flowers of seven marbles, side by side with the other color’s.'], ['german', 'German Daisy', 'Like the Belgian Daisy, with the flowers a row nearer the middle.']] },
        { id: 'cover', local: true, label: 'Hand over between turns', value: 'off', choices: [['off', 'Off', 'Nothing in Abalone is hidden, so the device just goes across the table.'], ['on', 'On', 'A cover names whose turn it is before each move.']], when: function (m) { return m === '2p'; } }
      ],
      players: { min: 2, max: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },
      onStart: function (cfg) {

      paintRoom();
    }
    if (w && !left) { Kit.sfx('sparkle'); Kit.moment(endMoment(w)); }
    if (WINO) WINO.close();
    setTimeout(function () {
      WINO = Kit.win({
        icon: w && wi === me ? 'trophy' : 'users',
        title: left ? left.text : wi === me ? 'You win!' : w.name + ' wins',
        sub: left ? '' : 'Six marbles off the board · ' + S.n + (S.n === 1 ? ' move' : ' moves'),
        rank: left ? null : S.players.slice().sort(function (a, c) { return S.off[3 - c.side] - S.off[3 - a.side]; }).map(function (p) { return { name: p.name, score: S.off[3 - p.side], color: p.side === BLACK ? '#2a2a30' : '#f1efe9' }; }),
        notes: left ? null : [S.players[0].name + ' has won ' + S.wins[0] + ' and ' + S.players[1].name + ' has won ' + S.wins[1] + '.'], notesTitle: 'Games at this table',
        lose: !!w && wi !== me, againLabel: left ? 'Back to the lobby' : 'Play again',
        again: function () { WINO = null; netAgain(); },
        look: { label: 'Look at the board', onClick: function () { WINO = null; } }
      });
    }, left ? 100 : 2200);
  }
  function netLeave() {
    NET = null; LEFT = null; SHOWN++; if (WINO) { WINO.close(); WINO = null; }
    var sv = null; try { sv = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv && sv.b && sv.players && !sv.over) { S = sv; S.busy = false; build(); afterTurn(); }
    else showSetup();
  }

  // ── Test and demo hooks ──────────────────────────────────────────────────
  window.__abalone = {
    core: Core, state: function () { return S; }, get sel() { return SEL.slice(); }, get legal() { return selMoves(); },
    // a fresh game for these players: {mode: '2p' | 'cpu', level, start, players: [{name, cpu, side}]}
    start: function (cfg) { cancelThink(); S = { mode: cfg.mode || '2p', level: cfg.level || 'normal', startKey: cfg.start || 'std', cover: false, players: cfg.players }; newGame(); },
    // set a position: rows like Core.grid's (9 strings), whose turn, marbles already off [black, white]
    set: function (rows, turn, off) { cancelThink(); S.busy = false; S.b = Core.fromGrid(rows); S.turn = turn || 1; S.off = [0, off ? off[0] : 0, off ? off[1] : 0]; S.hist = []; S.ml = []; S.ej = []; S.st = { push: [0, 0, 0], sumito: [0, 0, 0] }; S.lo = [0, 0, 0]; S.n = 0; S.over = false; S.winner = 0; S.start = 'x:' + Core.grid(S.b).join(''); SEL = []; save(); build(); afterTurn(); },
    play: function (str) { return playMove(str); },
    move: function (str) { if (NET) netMove(str); else playMove(str); },
    cell: function (name) { return Core.idx(name); },
    marble: function (name) { return MB[Core.idx(name)] || null; },
    // the screen point of a hole, by name
    at: function (name) { var r = frameEl.getBoundingClientRect(), q = px(Core.idx(name)); return { x: r.left + q.x / 1000 * r.width, y: r.top + q.y / 866 * r.height }; },
    arrow: function (d) { var A = ARROWS.filter(function (x) { return x.m.d === d; })[0]; return A ? A.el : null; },
    desk: function () { return DK; }
  };
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.b && saved.players && !saved.over) { S = saved; S.busy = false; build(); afterTurn(); }
  else showSetup();

  TurnNet.setup({
    game: 'abalone', title: 'Abalone', min: 2, max: 2,
    opts: netOpts, start: netStart,
    turn: function (st) { return st.over ? [] : [netSeatOf(st, st.turn)]; },
    over: function (st) { if (!st.over) return null; var w = netSeatOf(st, st.winner); return { win: [w], text: st.players[w].name + ' wins, ' + st.off[3 - st.winner] + ' to ' + st.off[st.winner] }; },
    show: netShow, leave: netLeave
  });
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d12">
<title>Hangman</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
:root{--hm-key:#3a4050;--hm-key-hi:#4a5163;}
/* ── Setup ── */
.hm-setup{max-width:480px;margin:0 auto;}
.hm-sec{margin-bottom:22px;}
.hm-sec-title{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:0 2px 10px;}
.diff-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.diff-card{
  background:var(--surface);border:2px solid var(--line-2);border-radius:var(--r-lg);
  padding:14px 10px 12px;cursor:pointer;text-align:center;touch-action:manipulation;
  transition:border-color .18s,background .18s,transform .12s var(--ease);
}
.diff-card:active{transform:scale(.97);}
.diff-card.selected{border-color:var(--gold);background:linear-gradient(160deg,rgba(245,200,66,.13),rgba(245,200,66,.03));}
.diff-card-name{font-family:var(--display);font-weight:800;font-size:1.15rem;}
.diff-card-sub{font-size:.8rem;color:var(--text-2);margin:2px 0 6px;}
.diff-preview{display:block;margin:0 auto;}
.hm-setup .tabs{margin-bottom:0;}
.hm-setup .tab{min-height:42px;font-size:.92rem;}
.cat-row{display:flex;gap:8px;flex-wrap:wrap;}
.cat-btn{
  min-height:40px;padding:0 16px;border-radius:999px;font-size:.9rem;font-weight:600;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);
  transition:background .15s,border-color .15s,color .15s;
}
.cat-btn.active{border-color:rgba(245,200,66,.6);background:rgba(245,200,66,.14);color:var(--gold);}
.hm-start-bar{position:sticky;bottom:0;padding:12px 0 calc(12px + var(--safe-b));background:linear-gradient(to top,var(--bg) 70%,transparent);}
/* Custom phrase */
.custom-entry{max-width:480px;margin:0 auto;}
.custom-entry-title{font-family:var(--display);font-size:1.4rem;font-weight:800;margin-bottom:4px;}
.custom-entry-sub{color:var(--text-2);font-size:.92rem;margin-bottom:16px;}
.phrase-input{letter-spacing:.08em;text-transform:uppercase;}
.phrase-input::placeholder{text-transform:none;letter-spacing:0;}
.handoff-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.handoff-icon{font-size:4rem;margin-bottom:16px;}
.handoff-title{font-family:var(--display);font-size:2rem;font-weight:800;margin-bottom:10px;}
.handoff-sub{color:var(--text-2);font-size:1rem;max-width:300px;line-height:1.6;margin-bottom:28px;}
/* ── Play screen: fills the viewport, keyboard docked ── */
body.playing{height:100dvh;overflow:hidden;display:flex;flex-direction:column;}
body.playing .page{display:none;}
.hm-play{display:none;}
body.playing .hm-play{
  flex:1;min-height:0;display:flex;flex-direction:column;
  width:100%;max-width:560px;margin:0 auto;
  padding:0 max(8px,var(--safe-r)) 0 max(8px,var(--safe-l));
}
.hm-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px 0;min-height:48px;}
.hm-cat{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:.88rem;font-weight:700;cursor:pointer;}
.hm-cat svg{width:14px;height:14px;color:var(--text-3);}
.hm-cat.custom{cursor:default;}
.hm-cat.custom svg{display:none;}
.hint-btn{height:36px;min-height:36px;padding:0 14px;border-radius:999px;font-size:.88rem;}
.hm-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0;}
.hangman-svg{height:100%;max-height:230px;width:auto;max-width:100%;}
.wrong-counter{display:flex;justify-content:center;gap:6px;margin:2px 0 6px;}
.wrong-pip{width:10px;height:10px;border-radius:50%;background:transparent;border:1.5px solid rgba(248,113,113,.45);transition:background .2s,transform .2s var(--spring);}
.wrong-pip.active{background:var(--red);border-color:var(--red);transform:scale(1.1);}
.status-bar{text-align:center;font-size:.92rem;font-weight:600;color:var(--text-2);min-height:22px;}
.hint-text{text-align:center;color:var(--gold);font-size:.92rem;font-weight:600;min-height:0;padding:0 12px;}
.hint-text:not(:empty){margin-top:4px;}
.word-display{
  --n:8;
  --g:clamp(3px, calc(60px / var(--n)), 6px);
  --lw:min(34px, calc((min(100vw, 560px) - 28px - (var(--n) - 1) * var(--g)) / var(--n)));
  display:flex;justify-content:center;flex-wrap:wrap;gap:10px 18px;margin:12px 0 6px;
}
.hm-word{display:flex;gap:var(--g);}
.letter-blank{
  width:var(--lw);height:calc(var(--lw) * 1.3);max-height:44px;
  border-bottom:3px solid rgba(255,255,255,.32);display:flex;align-items:flex-end;justify-content:center;
  font-family:var(--display);font-size:calc(var(--lw) * .82);font-weight:800;line-height:1;padding-bottom:3px;
  color:var(--text);
}
.letter-blank.shown{border-bottom-color:var(--green);color:var(--green);animation:gn-pop .3s var(--spring) both;}
.letter-blank.missed{border-bottom-color:var(--red);color:var(--red);}
.letter-blank.fixed{border-bottom-color:transparent;}
.keyboard{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 0 calc(10px + var(--safe-b));}
.kb-row{display:flex;gap:6px;justify-content:center;}
.kb-row .half{flex:.5;}
.key-btn{
  flex:1;height:54px;padding:0;border:0;border-radius:8px;max-width:52px;
  background:var(--hm-key);color:var(--text);font-size:1.15rem;font-weight:700;
  cursor:pointer;touch-action:manipulation;transition:background .15s,color .15s,transform .06s;
}
.kb-row .half{max-width:26px;}
.kb-row .wide-sp{flex:1.5;max-width:78px;}
.key-btn:active:not(:disabled){background:var(--hm-key-hi);transform:scale(.95);}
.key-btn:disabled{cursor:default;opacity:1;}
.key-btn.correct{background:#22a35a;color:#fff;}
.key-btn.wrong{background:#2a2e38;color:#5c6372;}
@media (max-height:700px){.key-btn{height:48px;}.keyboard{gap:7px;}}
/* Result sheet */
.hm-result{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.hm-result.show{display:flex;animation:gn-fade .2s ease both;}
.hm-sheet{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(20px + var(--safe-b));text-align:center;animation:gn-sheet .32s var(--ease) both;}
@media (min-width:600px){.hm-result{align-items:center;}.hm-sheet{border-radius:24px;border-bottom:1px solid var(--line-2);}}
.hm-grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);margin:0 auto 16px;}
.hm-res-emoji{font-size:2.6rem;line-height:1;margin-bottom:6px;}
.hm-res-title{font-family:var(--display);font-size:1.7rem;font-weight:800;letter-spacing:-.02em;}
.hm-res-word{font-family:var(--display);font-size:1.5rem;font-weight:800;letter-spacing:.08em;color:var(--gold);margin:10px 0 2px;word-break:break-word;}
.hm-res-hint{color:var(--text-2);font-size:.92rem;margin-bottom:16px;min-height:1em;}
.hm-res-stats{display:flex;gap:8px;justify-content:center;margin-bottom:18px;}
.hm-res-actions{display:flex;flex-direction:column;gap:8px;}
.nav-icon{width:36px;height:36px;padding:0!important;display:inline-grid;place-items:center;border-radius:50%!important;border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;}
.nav-icon svg{width:18px;height:18px;}
.nav-icon[hidden]{display:none;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Hangman</span>
  <button class="nav-icon" id="new-word" aria-label="New word" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg></button>
  <button class="nav-icon" id="change-diff" aria-label="Game settings" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</nav>
<div class="page">

<!-- Setup: difficulty, mode, category -->
<div id="diff-screen" class="hm-setup setup-screen">
  <div class="hm-sec">
    <div class="hm-sec-title">Difficulty</div>
    <div class="diff-cards">
      <div class="diff-card selected" id="diff-easy" onclick="selectDiff('easy')" role="button" tabindex="0">
        <div class="diff-card-name" style="color:var(--green);">Easy</div>
        <div class="diff-card-sub">10 wrong guesses</div>
        <svg class="diff-preview" viewBox="0 0 80 100" width="76" height="76">
          <g stroke="rgba(255,255,255,.3)" stroke-width="3" stroke-linecap="round"><line x1="10" y1="95" x2="70" y2="95"/><line x1="30" y1="95" x2="30" y2="10"/><line x1="30" y1="10" x2="55" y2="10"/><line x1="55" y1="10" x2="55" y2="22"/></g>
          <g stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" fill="none"><circle cx="55" cy="30" r="8"/><line x1="55" y1="38" x2="55" y2="60"/><line x1="55" y1="42" x2="44" y2="50"/><line x1="55" y1="42" x2="66" y2="50"/><line x1="55" y1="60" x2="44" y2="74"/><line x1="55" y1="60" x2="66" y2="74"/><line x1="44" y1="74" x2="40" y2="82" stroke-width="2"/><line x1="66" y1="74" x2="70" y2="82" stroke-width="2"/><line x1="44" y1="50" x2="40" y2="58" stroke-width="2"/><line x1="66" y1="50" x2="70" y2="58" stroke-width="2"/></g>
        </svg>
      </div>
      <div class="diff-card" id="diff-hard" onclick="selectDiff('hard')" role="button" tabindex="0">
        <div class="diff-card-name" style="color:var(--red);">Hard</div>
        <div class="diff-card-sub">6 wrong guesses</div>
        <svg class="diff-preview" viewBox="0 0 80 100" width="76" height="76">
          <g stroke="rgba(255,255,255,.3)" stroke-width="3" stroke-linecap="round"><line x1="10" y1="95" x2="70" y2="95"/><line x1="30" y1="95" x2="30" y2="10"/><line x1="30" y1="10" x2="55" y2="10"/><line x1="55" y1="10" x2="55" y2="22"/></g>
          <g stroke="#f87171" stroke-width="2.5" stroke-linecap="round" fill="none"><circle cx="55" cy="30" r="8"/><line x1="55" y1="38" x2="55" y2="62"/><line x1="55" y1="44" x2="43" y2="54"/><line x1="55" y1="44" x2="67" y2="54"/><line x1="55" y1="62" x2="43" y2="76"/><line x1="55" y1="62" x2="67" y2="76"/></g>
        </svg>
      </div>
    </div>
  </div>
  <div class="hm-sec">
    <div class="hm-sec-title">Mode</div>
    <div class="tabs" id="mode-row">
      <button class="tab active" id="mode-random">🎲 Random word</button>
      <button class="tab" id="mode-custom">✏️ Custom phrase</button>
    </div>
  </div>
  <div class="hm-sec" id="cats-sec">
    <div class="hm-sec-title">Category</div>
    <div class="cat-row" id="cats"></div>
  </div>
  <div class="hm-start-bar"><button class="btn btn-gold btn-block" id="diff-start">Start game</button></div>
</div>

<!-- Custom phrase entry -->
<div class="custom-entry hidden setup-screen" id="custom-entry">
  <div class="card">
    <div class="custom-entry-title">Player 1 — secret phrase</div>
    <div class="custom-entry-sub">Letters and spaces only. Player 2 won’t see this.</div>
    <label for="phrase-input">Word or phrase</label>
    <input class="input phrase-input" id="phrase-input" placeholder="Type a word or phrase…" maxlength="40" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" style="margin-bottom:14px;">
    <label for="hint-custom">Hint (optional)</label>
    <input class="input" id="hint-custom" placeholder="A clue for Player 2" maxlength="60" autocomplete="off" style="margin-bottom:12px;">
    <div id="phrase-err" style="color:var(--red);font-size:.88rem;margin-bottom:10px;display:none;"></div>
    <button class="btn btn-gold btn-block" id="set-phrase-btn">Set phrase</button>
    <button class="btn btn-ghost btn-block mt-8" id="custom-back">Back</button>
  </div>
</div>
</div>

<!-- Handoff overlay -->
<div class="handoff-overlay hidden" id="handoff">
  <div class="handoff-icon">🙈</div>
  <div class="handoff-title">Phrase set!</div>
  <div class="handoff-sub">Hand the device to <strong>Player 2</strong>.<br>Don’t peek at the screen!</div>
  <button class="btn btn-gold" id="ready-btn" style="min-width:220px;">I’m ready to guess</button>
</div>

<!-- Play screen -->
<main class="hm-play" id="hm-play">
  <div class="hm-top">
    <button class="hm-cat" id="cat-pill"><span id="cat-name">Animals</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="btn btn-outline hint-btn" id="hint-btn">💡 Hint</button>
  </div>
  <div class="hm-stage"><svg class="hangman-svg" viewBox="0 0 160 210" id="hsvg"></svg></div>
  <div class="wrong-counter" id="wrong-counter"></div>
  <div class="status-bar" id="status"></div>
  <div class="hint-text" id="hint-text"></div>
  <div class="word-display" id="word-display"></div>
  <div class="keyboard" id="keyboard"></div>
</main>

<!-- Result sheet -->
<div class="hm-result" id="hm-result">
  <div class="hm-sheet" role="dialog" aria-modal="true">
    <div class="hm-grab"></div>
    <div class="hm-res-emoji" id="hm-res-emoji"></div>
    <div class="hm-res-title" id="hm-res-title"></div>
    <div class="hm-res-word" id="hm-res-word"></div>
    <div class="hm-res-hint" id="hm-res-hint"></div>
    <div class="stat-row hm-res-stats" id="hm-res-stats"></div>
    <div class="hm-res-actions">
      <button class="btn btn-gold btn-block" id="hm-next">Next word</button>
      <button class="btn btn-outline btn-block hidden" id="new-phrase-btn">New phrase</button>
      <button class="btn btn-ghost btn-block" id="hm-settings">Change settings</button>
    </div>
  </div>
</div>

  DILEMMA:'Difficult choice between two bad options',EMPATHY:'Ability to feel what characters feel',
  IMAGERY:'Descriptive language that paints a picture',INNUENDO:'Indirect suggestive hint',
  MONOLOGUE:'Long speech by a single character',NOSTALGIA:'Sentimental longing for the past',
  SOLILOQUY:'Character speaking thoughts aloud when alone',STEREOTYPE:'Oversimplified fixed idea about a group',
  SUBTEXT:'Hidden meaning beneath the surface',ZEITGEIST:'Spirit of the times reflected in art',
};

// ── Difficulty definitions ─────────────────────────────────────────────────
// Each array item is an SVG element string revealed on that wrong guess
const DIFF={
  easy:{
    max:10,
    parts:[
      // 1: head
      `<circle id="h-0" cx="110" cy="54" r="14" stroke="#ff6b6b" stroke-width="3" fill="none" opacity="0"/>`,
      // 2: neck
      `<line id="h-1" x1="110" y1="68" x2="110" y2="78" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
      // 3: body
      `<line id="h-2" x1="110" y1="78" x2="110" y2="118" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
      // 4: left arm
      `<line id="h-3" x1="110" y1="85" x2="85" y2="108" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
      // 5: right arm
      `<line id="h-4" x1="110" y1="85" x2="135" y2="108" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
      // 6: left hand
      `<line id="h-5" x1="85" y1="108" x2="80" y2="116" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round" opacity="0"/>`,
      // 7: right hand
      `<line id="h-6" x1="135" y1="108" x2="140" y2="116" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round" opacity="0"/>`,
      // 8: left leg
      `<line id="h-7" x1="110" y1="118" x2="86" y2="150" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
      // 9: right leg
      `<line id="h-8" x1="110" y1="118" x2="134" y2="150" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
      // 10: feet (both)
      `<line id="h-9a" x1="86" y1="150" x2="78" y2="158" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round" opacity="0"/><line id="h-9b" x1="134" y1="150" x2="142" y2="158" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round" opacity="0"/>`,
    ]
  },
  hard:{
    max:6,
    parts:[
      `<circle id="h-0" cx="110" cy="54" r="14" stroke="#ff6b6b" stroke-width="3" fill="none" opacity="0"/>`,
      `<line id="h-1" x1="110" y1="68" x2="110" y2="118" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
      `<line id="h-2" x1="110" y1="82" x2="86" y2="105" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
      `<line id="h-3" x1="110" y1="82" x2="134" y2="105" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
      `<line id="h-4" x1="110" y1="118" x2="86" y2="150" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
      `<line id="h-5" x1="110" y1="118" x2="134" y2="150" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0"/>`,
    ]
  }
};

// ── State ─────────────────────────────────────────────────────────────────
let word='', guessed=new Set(), wrong=0, cat='Animals', won=false, over=false;
let customMode=false, customHint='';
let difficulty='easy'; // 'easy' | 'hard'
let gameStarted=false;
const $=id=>document.getElementById(id);
const haptic=k=>{try{window.GN&&GN.haptic(k);}catch(e){}};
const isLetter=c=>/^[A-Z]$/.test(c);           // only A–Z are guessable
const letters=()=>word.split('').filter(isLetter);

// ── Screens ────────────────────────────────────────────────────────────────
function showSetup(){
  document.body.classList.remove('playing');
  $('diff-screen').classList.remove('hidden');
  $('custom-entry').classList.add('hidden');
  $('new-word').hidden=true; $('change-diff').hidden=true;
  hideResult();
  gameStarted=false;
  window.scrollTo(0,0);
}
function showPlay(){
  document.body.classList.add('playing');
  $('diff-screen').classList.add('hidden');
  $('custom-entry').classList.add('hidden');
  $('new-word').hidden=false; $('change-diff').hidden=false;
  $('cat-name').textContent=customMode?'Custom phrase':cat;
  $('cat-pill').classList.toggle('custom',customMode);
  gameStarted=true;
  buildGallows();
}

// ── Difficulty selector ────────────────────────────────────────────────────
function selectDiff(d){
  difficulty=d;
  $('diff-easy').classList.toggle('selected',d==='easy');
  $('diff-hard').classList.toggle('selected',d==='hard');
  haptic('select');
}
['diff-easy','diff-hard'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$(id).click();}}));

function setMode(custom){
  customMode=custom;
  $('mode-random').classList.toggle('active',!custom);
  $('mode-custom').classList.toggle('active',custom);
  $('cats-sec').style.display=custom?'none':'';
  $('diff-start').textContent=custom?'Enter a phrase':'Start game';
}
$('mode-random').addEventListener('click',()=>setMode(false));
$('mode-custom').addEventListener('click',()=>setMode(true));

$('diff-start').addEventListener('click',()=>{
  if(customMode){ openCustomEntry(); return; }
  showPlay();
  newWord();
});

function openCustomEntry(){
  document.body.classList.remove('playing');
  hideResult();
  $('diff-screen').classList.add('hidden');
  $('custom-entry').classList.remove('hidden');
  $('new-word').hidden=true; $('change-diff').hidden=true;
  $('phrase-input').value='';$('hint-custom').value='';$('phrase-err').style.display='none';
  gameStarted=false;
  setTimeout(()=>$('phrase-input').focus(),50);
}
$('custom-back').addEventListener('click',showSetup);

async function goToSettings(){
  if(gameStarted&&!over&&guessed.size){
    const ok=await GN.confirm('Leave this game?',{title:'Leave this game?',body:'Your current word will be abandoned.',ok:'Leave',danger:true});
    if(!ok)return;
  }
  try{sessionStorage.removeItem('hangman');}catch(e){}
  $('word-display').innerHTML='';$('keyboard').innerHTML='';
  showSetup();
}
$('change-diff').addEventListener('click',goToSettings);
$('hm-settings').addEventListener('click',goToSettings);

// ── Build gallows + part placeholders ─────────────────────────────────────
function buildGallows(){
  const def=DIFF[difficulty];
  let svg=`
    <line x1="20" y1="195" x2="140" y2="195" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="195" x2="60" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="110" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="110" y1="20" x2="110" y2="40" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
  `;
  def.parts.forEach(p=>svg+=p);
  $('hsvg').innerHTML=svg;
  [...$('hsvg').querySelectorAll('[id^="h-"]')].forEach(el=>el.style.transition='opacity .3s');
}

// ── Wrong counter pips ─────────────────────────────────────────────────────
function renderPips(){
  const def=DIFF[difficulty];
  const c=$('wrong-counter');
  c.innerHTML='';
  for(let i=0;i<def.max;i++){
    const pip=document.createElement('div');
    pip.className='wrong-pip'+(i<wrong?' active':'');
    c.appendChild(pip);
  }
}

// ── Custom phrase entry ────────────────────────────────────────────────────
$('set-phrase-btn').addEventListener('click',()=>{
  const raw=$('phrase-input').value.trim().replace(/\s+/g,' ').toUpperCase();
  const err=$('phrase-err');
  const lettersOnly=raw.replace(/ /g,'');
  if(lettersOnly.length<2){err.textContent='Enter at least 2 letters.';err.style.display='block';haptic('error');return;}
  if(!/^[A-Z ]+$/.test(raw)){err.textContent='Letters and spaces only, please.';err.style.display='block';haptic('error');return;}
  err.style.display='none';
  word=raw;
  customHint=$('hint-custom').value.trim();
  document.activeElement&&document.activeElement.blur();
  $('custom-entry').classList.add('hidden');
  $('handoff').classList.remove('hidden');
});

$('phrase-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();$('hint-custom').focus();}
});
$('hint-custom').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();$('set-phrase-btn').click();}
});

$('ready-btn').addEventListener('click',()=>{
  $('handoff').classList.add('hidden');
  startCustomGame();
});

$('new-phrase-btn').addEventListener('click',()=>{
  try{sessionStorage.removeItem('hangman');}catch(e){}
  openCustomEntry();
});

function startCustomGame(){
  guessed=new Set(); wrong=0; won=false; over=false;
  showPlay();
  resetFigure();
  $('hint-btn').style.display=customHint?'':'none';
  $('hint-text').textContent='';
  renderPips();
  renderWord();buildKeyboard();
  setStatusDefault();
  _save_hangman();
}

function setStatusDefault(){
  const def=DIFF[difficulty];
  if(!guessed.size){
    const words=word.trim().split(' ').filter(Boolean);
    const letterCount=word.replace(/ /g,'').length;
    $('status').textContent=words.length>1?`${words.length} words · ${letterCount} letters`:`${letterCount}-letter word`;
  } else {
    $('status').textContent=`${def.max-wrong} wrong guess${def.max-wrong!==1?'es':''} left`;
  }
}

// ── Category buttons ───────────────────────────────────────────────────────
const catRow=$('cats');
function markCat(){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));$('cat-name').textContent=customMode?'Custom phrase':cat;}
Object.keys(WORDS).forEach(c=>{
  const b=document.createElement('button');b.className='cat-btn'+(c===cat?' active':'');b.textContent=c;b.dataset.cat=c;
  b.addEventListener('click',()=>{cat=c;markCat();haptic('select');});
  catRow.appendChild(b);
});
$('cat-pill').addEventListener('click',()=>{
  if(customMode)return;
  GN.sheet({title:'Category',body:'Pick a category for your next word.',
    actions:Object.keys(WORDS).map(c=>({label:(c===cat?'✓ ':'')+c,primary:c===cat,onClick:()=>{cat=c;markCat();try{sessionStorage.removeItem('hangman');}catch(e){}newWord();}}))
      .concat([{label:'Cancel'}])});
});

function resetFigure(){
  const def=DIFF[difficulty];
  for(let i=0;i<def.max;i++) setPart(i,0);
}
function setPart(i,on){
  ['','a','b'].forEach(suf=>{const el=$('h-'+i+suf);if(el)el.style.opacity=on;});
}

function newWord(){
  customMode=false;
  if(!document.body.classList.contains('playing'))showPlay();
  $('cat-name').textContent=cat;$('cat-pill').classList.remove('custom');
  hideResult();
  const list=WORDS[cat];
  word=list[Math.floor(Math.random()*list.length)];
  guessed=new Set();wrong=0;won=false;over=false;
  resetFigure();
  $('hint-text').textContent='';
  $('hint-btn').style.display='';
  renderPips();
  renderWord();buildKeyboard();
  $('status').textContent=`${letters().length}-letter word`;
  _save_hangman();
}

// ── Render word ────────────────────────────────────────────────────────────
function renderWord(revealAll){
  const d=$('word-display');d.innerHTML='';
  const parts=word.split(' ').filter(Boolean);
  d.style.setProperty('--n',Math.max(6,...parts.map(w=>w.length)));
  parts.forEach(w=>{
    const g=document.createElement('div');g.className='hm-word';
    w.split('').forEach(l=>{
      const span=document.createElement('div');span.className='letter-blank';
      if(!isLetter(l)){span.textContent=l;span.classList.add('fixed');}
      else if(guessed.has(l)){span.textContent=l;span.classList.add('shown');}
      else if(revealAll){span.textContent=l;span.classList.add('missed');}
      g.appendChild(span);
    });
    d.appendChild(g);
  });
}

// ── Keyboard ───────────────────────────────────────────────────────────────
function buildKeyboard(){
  const kb=$('keyboard');kb.innerHTML='';
  ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].forEach((row,ri)=>{
    const r=document.createElement('div');r.className='kb-row';
    if(ri===1){const s=document.createElement('span');s.className='half';r.appendChild(s);}
    if(ri===2){const s=document.createElement('span');s.className='wide-sp';r.appendChild(s);}
    row.split('').forEach(l=>{
      const b=document.createElement('button');b.type='button';b.className='key-btn';b.textContent=l;b.id='k'+l;
      if(guessed.has(l)){b.disabled=true;b.classList.add(word.includes(l)?'correct':'wrong');}
      b.addEventListener('click',()=>guess(l));
      r.appendChild(b);
    });
    if(ri===1){const s=document.createElement('span');s.className='half';r.appendChild(s);}
    if(ri===2){const s=document.createElement('span');s.className='wide-sp';r.appendChild(s);}
    kb.appendChild(r);
  });
}

// ── Guess ──────────────────────────────────────────────────────────────────
function guess(l){
  if(guessed.has(l)||over||!gameStarted)return;
  guessed.add(l);
  const kb=$('k'+l);
  const def=DIFF[difficulty];
  if(word.includes(l)){
    if(kb){kb.classList.add('correct');kb.disabled=true;}
    haptic('select');
    if(letters().every(c=>guessed.has(c))){
      won=true;over=true;
      haptic('success');
    }
  } else {
    if(kb){kb.classList.add('wrong');kb.disabled=true;}
    wrong++;
    haptic('error');
    setPart(wrong-1,1);
    renderPips();
    if(wrong>=def.max){
      over=true;
    }
  }
  renderWord(over&&!won);
  if(over){
    $('status').innerHTML=won?`<span style="color:var(--green)">🎉 Solved!</span>`:`<span style="color:var(--red)">Out of guesses</span>`;
    try{sessionStorage.removeItem('hangman');}catch(e){}
    setTimeout(()=>showResult(),won?700:900);
  } else {
    $('status').textContent=`${def.max-wrong} wrong guess${def.max-wrong!==1?'es':''} left`;
    _save_hangman();
  }
}

// ── Result sheet ───────────────────────────────────────────────────────────
function showResult(){
  if(!over)return;
  const def=DIFF[difficulty];
  $('hm-res-emoji').textContent=won?'🎉':'💀';
  $('hm-res-title').textContent=won?(wrong===0?'Flawless!':'You got it!'):'Out of guesses';
  $('hm-res-word').textContent=word;
  $('hm-res-hint').textContent=customMode?(customHint||''):(HINTS[word]||'');
  $('hm-res-stats').innerHTML=
    `<div class="stat"><div class="stat-val">${wrong}</div><div class="stat-lbl">Misses</div></div>`+
    `<div class="stat"><div class="stat-val">${guessed.size}</div><div class="stat-lbl">Guesses</div></div>`+
    `<div class="stat"><div class="stat-val" style="font-size:1.1rem;line-height:1.6">${difficulty==='easy'?'Easy':'Hard'}</div><div class="stat-lbl">Mode</div></div>`;
  $('hm-next').classList.toggle('hidden',customMode);
  $('new-phrase-btn').classList.toggle('hidden',!customMode);
  $('new-phrase-btn').classList.toggle('btn-gold',customMode);
  $('new-phrase-btn').classList.toggle('btn-outline',!customMode);
  $('hm-result').classList.add('show');
}
function hideResult(){$('hm-result').classList.remove('show');}
$('hm-result').addEventListener('click',e=>{if(e.target.id==='hm-result')hideResult();});
$('hm-next').addEventListener('click',()=>{try{sessionStorage.removeItem('hangman');}catch(e){}newWord();});

// ── Hint ───────────────────────────────────────────────────────────────────
$('hint-btn').addEventListener('click',function(){
  $('hint-text').textContent=customMode?customHint:(HINTS[word]||'No hint available');
  this.style.display='none';
  haptic('light');
});

// ── Keyboard shortcut ──────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;
  if(!gameStarted)return;
  if(e.key==='Escape'){hideResult();return;}
  if(/^[a-zA-Z]$/.test(e.key))guess(e.key.toUpperCase());
});

$('new-word').addEventListener('click',async()=>{
  if(customMode){
    if(!over&&guessed.size){const ok=await GN.confirm('Start a new phrase?',{title:'Start a new phrase?',body:'This phrase will be abandoned.',ok:'New phrase',danger:true});if(!ok)return;}
    try{sessionStorage.removeItem('hangman');}catch(e){}
    openCustomEntry();return;
  }
  if(!over&&guessed.size){const ok=await GN.confirm('Skip this word?',{title:'Skip this word?',body:'You’ll get a fresh word from '+cat+'.',ok:'New word'});if(!ok)return;}
  try{sessionStorage.removeItem('hangman');}catch(e){}
  newWord();
});

// ── Session persistence ────────────────────────────────────────────────────
function _save_hangman(){if(!gameStarted||(over||won))return;
  try{sessionStorage.setItem('hangman',JSON.stringify({word,guessed:[...guessed],wrong,cat,won,over,customMode,customHint,difficulty,gameStarted:true,_ts:Date.now()}));}catch(e){}
}
function _load_hangman(){
  try{
    const raw=sessionStorage.getItem('hangman');if(!raw)return false;
    const s=JSON.parse(raw);if(!s||!s.gameStarted)return false;
    word=s.word;guessed=new Set(s.guessed||[]);wrong=s.wrong||0;cat=s.cat||'Animals';
    won=s.won||false;over=s.over||false;customMode=s.customMode||false;customHint=s.customHint||'';
    difficulty=s.difficulty||'easy';
    selectDiff(difficulty);
    setMode(customMode);
    markCat();
    showPlay();
    for(let i=0;i<wrong;i++) setPart(i,1);   // restore the drawn figure
    $('hint-btn').style.display=(customMode&&!customHint)?'none':'';
    renderPips();
    renderWord();
    buildKeyboard();
    setStatusDefault();
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_hangman);
window.addEventListener('pagehide',_save_hangman);
if(!_load_hangman()){
  setMode(false);
}
</script>
</body>
</html>

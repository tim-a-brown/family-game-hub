<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
<title>Hangman</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{background:radial-gradient(ellipse at 50% 0%,#1a0a0a 0%,#0d1117 65%);}
.hangman-svg{display:block;margin:0 auto;max-width:200px;}
.word-display{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:16px 0;row-gap:10px;}
.letter-blank{width:clamp(22px,6.5vw,32px);border-bottom:3px solid rgba(255,255,255,.4);text-align:center;font-family:var(--serif);font-size:clamp(1.1rem,5vw,1.5rem);font-weight:900;padding-bottom:2px;min-height:36px;}
.word-gap{width:18px;flex-shrink:0;}
.keyboard{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:min(380px,calc(100vw - 24px));margin:0 auto;}
.key-btn{width:clamp(36px,(100vw - 32px)/13,44px);height:clamp(36px,(100vw - 32px)/13,44px);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:7px;color:var(--text);font-size:.88rem;font-weight:700;cursor:pointer;transition:all .15s;touch-action:manipulation;}
.key-btn:hover:not(:disabled){background:rgba(255,255,255,.15);}
.key-btn:disabled{opacity:.25;cursor:default;}
.key-btn.correct{background:rgba(126,212,126,.2);border-color:var(--green);color:var(--green);}
.key-btn.wrong{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.3);color:rgba(255,107,107,.5);}
.status-bar{text-align:center;font-size:1rem;font-weight:700;margin:10px 0;min-height:28px;}
.hint-btn{display:block;margin:8px auto 0;font-size:.78rem;}
.cat-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
.cat-btn{padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--muted);transition:all .15s;}
.cat-btn.active{border-color:var(--gold);background:rgba(245,200,66,.12);color:var(--gold);}
.mode-row{display:flex;gap:6px;justify-content:center;margin-bottom:14px;}
.mode-btn{padding:8px 16px;border-radius:9px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--muted);font-size:.82rem;font-weight:700;cursor:pointer;touch-action:manipulation;transition:all .15s;}
.mode-btn.active{border-color:var(--gold);background:rgba(245,200,66,.13);color:var(--gold);}
.custom-entry{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:20px 16px;max-width:400px;margin:0 auto 14px;}
.custom-entry-title{font-weight:700;font-size:.95rem;margin-bottom:4px;}
.custom-entry-sub{color:var(--muted);font-size:.78rem;margin-bottom:12px;}
.phrase-input{font-family:var(--font);font-size:max(16px,1rem);letter-spacing:.08em;text-transform:uppercase;}
.phrase-input::placeholder{text-transform:none;letter-spacing:0;}
.handoff-overlay{position:fixed;inset:0;background:#0d1117;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.handoff-icon{font-size:4rem;margin-bottom:16px;}
.handoff-title{font-family:var(--serif);font-size:2rem;font-weight:900;margin-bottom:10px;}
.handoff-sub{color:var(--muted);font-size:.9rem;max-width:300px;line-height:1.6;margin-bottom:28px;}
/* Difficulty selector */
.diff-screen{max-width:420px;margin:0 auto 16px;padding:0 12px;}
.diff-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.diff-card{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 10px;cursor:pointer;text-align:center;transition:all .18s;touch-action:manipulation;}
.diff-card.selected{border-color:var(--gold);background:rgba(245,200,66,.1);}
.diff-card:hover{border-color:rgba(255,255,255,.25);}
.diff-card-name{font-weight:800;font-size:.95rem;margin-bottom:3px;}
.diff-card-sub{font-size:.7rem;color:var(--muted);margin-bottom:8px;}
.diff-preview{display:block;margin:0 auto;}
.wrong-counter{display:flex;justify-content:center;gap:4px;margin-top:8px;}
.wrong-pip{width:8px;height:8px;border-radius:50%;background:rgba(255,107,107,.3);border:1px solid rgba(255,107,107,.4);}
.wrong-pip.active{background:#ff6b6b;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Hangman</span>

<div class="page">

<!-- Difficulty selector (shown before game starts) -->

      </svg>
    </div>
  </div>
  <button class="btn btn-gold btn-block" id="diff-start">Start Game →</button>
</div>

<!-- Mode toggle -->
<div class="mode-row" id="mode-row" style="display:none;">
  <button class="mode-btn active" id="mode-random">🎲 Random Word</button>
  <button class="mode-btn" id="mode-custom">✏️ Custom Phrase</button>
</div>

<!-- Category row (random mode only) -->
<div class="cat-row" id="cats" style="display:none;"></div>

<!-- Custom phrase entry (hidden by default) -->
<div class="custom-entry hidden" id="custom-entry">
  <div class="custom-entry-title">Player 1 — Enter Your Phrase</div>
  <div class="custom-entry-sub">Letters and spaces only. Player 2 won't see this.</div>
  <input class="input phrase-input" id="phrase-input" placeholder="Type a word or phrase…" maxlength="40" autocomplete="off" autocorrect="off" spellcheck="false" style="margin-bottom:10px;">
  <input class="input" id="hint-custom" placeholder="Optional: add a hint for Player 2" maxlength="60" style="margin-bottom:12px;">
  <div id="phrase-err" style="color:var(--red);font-size:.8rem;margin-bottom:8px;display:none;"></div>
  <button class="btn btn-gold btn-block" id="set-phrase-btn">Set Phrase →</button>
</div>

<!-- Handoff overlay -->
<div class="handoff-overlay hidden" id="handoff">
  <div class="handoff-icon">🙈</div>
  <div class="handoff-title">Phrase Set!</div>
  <div class="handoff-sub">Hand the device to <strong>Player 2</strong>.<br>Don't peek at the screen!</div>
  <button class="btn btn-gold" id="ready-btn" style="min-width:200px;">I'm Ready to Guess →</button>
</div>

<!-- Game area -->
<svg class="hangman-svg" viewBox="0 0 160 210" id="hsvg" style="display:none;"></svg>
<!-- Wrong guess pips -->
<div class="wrong-counter" id="wrong-counter" style="margin-bottom:4px;"></div>
<div class="status-bar" id="status"></div>
<div class="word-display" id="word-display"></div>
<div class="keyboard" id="keyboard"></div>
<button class="btn btn-outline btn-sm hint-btn" id="hint-btn">💡 Show Hint</button>
<div style="text-align:center;color:var(--muted);font-size:.8rem;margin-top:6px;min-height:20px;" id="hint-text"></div>
<div style="text-align:center;margin-top:14px;display:flex;gap:8px;justify-content:center;">
  <button class="btn btn-outline btn-sm" id="new-word" style="display:none;">New Word</button>
  <button class="btn btn-outline btn-sm hidden" id="new-phrase-btn">New Phrase</button>
  <button class="btn btn-outline btn-sm" id="change-diff">Change Difficulty</button>
</div>
</div>

  newWord();
});

document.getElementById('change-diff').addEventListener('click',()=>{
  document.getElementById('diff-screen').style.display='block';
  document.getElementById('mode-row').style.display='none';
  document.getElementById('cats').style.display='none';
  document.getElementById('hsvg').style.display='none';
  document.getElementById('word-display').innerHTML='';
  document.getElementById('keyboard').innerHTML='';
  document.getElementById('status').textContent='';
  document.getElementById('wrong-counter').innerHTML='';
  document.getElementById('hint-text').textContent='';
  document.getElementById('new-word').style.display='none';
  gameStarted=false;
  try{sessionStorage.removeItem('hangman');}catch(e){}
});

// ── Build gallows + part placeholders ─────────────────────────────────────
function buildGallows(){
  const def=DIFF[difficulty];
  let svg=`
    <line x1="20" y1="195" x2="140" y2="195" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="195" x2="60" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="110" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="110" y1="20" x2="110" y2="40" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
  `;
  def.parts.forEach(p=>svg+=p);
  document.getElementById('hsvg').innerHTML=svg;
}

// ── Wrong counter pips ─────────────────────────────────────────────────────
function renderPips(){
  const def=DIFF[difficulty];
  const c=document.getElementById('wrong-counter');
  c.innerHTML='';
  for(let i=0;i<def.max;i++){
    const pip=document.createElement('div');
    pip.className='wrong-pip'+(i<wrong?' active':'');
    c.appendChild(pip);
  }
}

// ── Mode switching ─────────────────────────────────────────────────────────
document.getElementById('mode-random').addEventListener('click',()=>{
  customMode=false;
  document.getElementById('mode-random').classList.add('active');
  document.getElementById('mode-custom').classList.remove('active');
  document.getElementById('cats').style.display='flex';
  document.getElementById('custom-entry').classList.add('hidden');
  document.getElementById('hint-btn').classList.remove('hidden');
  document.getElementById('new-word').style.display='';
  document.getElementById('new-phrase-btn').classList.add('hidden');
  newWord();
});

document.getElementById('mode-custom').addEventListener('click',()=>{
  customMode=true;
  document.getElementById('mode-custom').classList.add('active');
  document.getElementById('mode-random').classList.remove('active');
  document.getElementById('cats').style.display='none';
  document.getElementById('custom-entry').classList.remove('hidden');
  document.getElementById('hint-btn').classList.add('hidden');
  document.getElementById('hint-text').textContent='';
  document.getElementById('new-word').style.display='none';
  document.getElementById('new-phrase-btn').classList.remove('hidden');
  document.getElementById('word-display').innerHTML='';
  document.getElementById('keyboard').innerHTML='';
  document.getElementById('status').textContent='';
  document.getElementById('wrong-counter').innerHTML='';
  document.getElementById('phrase-input').value='';
  document.getElementById('hint-custom').value='';
  resetFigure();
});

// ── Custom phrase entry ────────────────────────────────────────────────────
document.getElementById('set-phrase-btn').addEventListener('click',()=>{
  const raw=document.getElementById('phrase-input').value.trim().toUpperCase();
  const err=document.getElementById('phrase-err');
  const letters=raw.replace(/ /g,'');
  if(letters.length<2){err.textContent='Enter at least 2 letters.';err.style.display='block';return;}
  if(!/^[A-Z ]+$/.test(raw)){err.textContent='Letters and spaces only, please.';err.style.display='block';return;}
  err.style.display='none';
  word=raw;
  customHint=document.getElementById('hint-custom').value.trim();
  document.getElementById('custom-entry').classList.add('hidden');
  document.getElementById('handoff').classList.remove('hidden');
});

document.getElementById('phrase-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')document.getElementById('set-phrase-btn').click();
});

document.getElementById('ready-btn').addEventListener('click',()=>{
  document.getElementById('handoff').classList.add('hidden');
  startCustomGame();
});

document.getElementById('new-phrase-btn').addEventListener('click',()=>{
  document.getElementById('custom-entry').classList.remove('hidden');
  document.getElementById('hint-btn').classList.add('hidden');
  document.getElementById('hint-text').textContent='';
  document.getElementById('word-display').innerHTML='';
  document.getElementById('keyboard').innerHTML='';
  document.getElementById('status').textContent='';
  document.getElementById('wrong-counter').innerHTML='';
  document.getElementById('phrase-input').value='';
  document.getElementById('hint-custom').value='';
  resetFigure();
});

function startCustomGame(){
  guessed=new Set(); wrong=0; won=false; over=false;
  resetFigure();
  const hb=document.getElementById('hint-btn');
  if(customHint){hb.classList.remove('hidden');hb.style.display='block';}
  else{hb.style.display='none';}
  document.getElementById('hint-text').textContent='';
  const words=word.trim().split(' ').filter(Boolean);
  const letterCount=word.replace(/ /g,'').length;
  document.getElementById('status').textContent=
    words.length>1?`${words.length} words, ${letterCount} letters`:`${letterCount}-letter word`;
  renderPips();
  renderWord();buildKeyboard();
}

// ── Category buttons ───────────────────────────────────────────────────────
const catRow=document.getElementById('cats');
Object.keys(WORDS).forEach(c=>{
  const b=document.createElement('button');b.className='cat-btn'+(c===cat?' active':'');b.textContent=c;
  b.addEventListener('click',()=>{
    cat=c;document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    newWord();
  });
  catRow.appendChild(b);
});

function resetFigure(){
  const def=DIFF[difficulty];
  for(let i=0;i<def.max;i++){
    const el=document.getElementById('h-'+i);if(el)el.style.opacity=0;
    const ela=document.getElementById('h-'+i+'a');if(ela)ela.style.opacity=0;
    const elb=document.getElementById('h-'+i+'b');if(elb)elb.style.opacity=0;
  }
}

function newWord(){
  const list=WORDS[cat];
  word=list[Math.floor(Math.random()*list.length)];
  guessed=new Set();wrong=0;won=false;over=false;
  resetFigure();
  document.getElementById('hint-text').textContent='';
  document.getElementById('hint-btn').style.display='block';
  renderPips();
  renderWord();buildKeyboard();
  document.getElementById('status').textContent=`${word.length}-letter word`;
}

// ── Render word ────────────────────────────────────────────────────────────
function renderWord(){
  const d=document.getElementById('word-display');d.innerHTML='';
  word.split('').forEach(l=>{
    if(l===' '){
      const gap=document.createElement('div');gap.className='word-gap';d.appendChild(gap);
    } else {
      const span=document.createElement('div');span.className='letter-blank';
      span.textContent=guessed.has(l)?l:' ';
      span.style.color=guessed.has(l)?'var(--green)':'transparent';
      span.style.borderBottomColor=guessed.has(l)?'var(--green)':'rgba(255,255,255,.4)';
      d.appendChild(span);
    }
  });
}

// ── Keyboard ───────────────────────────────────────────────────────────────
function buildKeyboard(){
  const kb=document.getElementById('keyboard');kb.innerHTML='';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l=>{
    const b=document.createElement('button');b.className='key-btn';b.textContent=l;b.id='k'+l;
    if(guessed.has(l)){b.disabled=true;b.classList.add(word.includes(l)?'correct':'wrong');}
    b.addEventListener('click',()=>guess(l));
    kb.appendChild(b);
  });
}

// ── Guess ──────────────────────────────────────────────────────────────────
function guess(l){
  if(guessed.has(l)||over)return;
  guessed.add(l);
  const kb=document.getElementById('k'+l);
  const def=DIFF[difficulty];
  if(word.includes(l)){
    kb.classList.add('correct');kb.disabled=true;
    if(word.split('').filter(c=>c!==' ').every(c=>guessed.has(c))){
      won=true;over=true;
      document.getElementById('status').innerHTML=`<span style="color:var(--green)">🎉 ${customMode?"Got it!":'You got it!'}</span>`;
    }
  } else {
    kb.classList.add('wrong');kb.disabled=true;wrong++;
    // Reveal body part for this wrong guess (handle compound parts like feet)
    const partSvg=def.parts[wrong-1];
    const el=document.getElementById('h-'+(wrong-1));if(el)el.style.opacity=1;
    const ela=document.getElementById('h-'+(wrong-1)+'a');if(ela)ela.style.opacity=1;
    const elb=document.getElementById('h-'+(wrong-1)+'b');if(elb)elb.style.opacity=1;
    renderPips();
    if(wrong>=def.max){
      over=true;
      document.getElementById('status').innerHTML=
        `<span style="color:var(--red)">💀 It was: <strong>${word}</strong></span>`;
      guessed=new Set(word.replace(/ /g,'').split(''));
    }
  }
  if(!over){
    document.getElementById('status').textContent=`${def.max-wrong} wrong guess${def.max-wrong!==1?'es':''} left`;
  }
  renderWord();
}

// ── Hint ───────────────────────────────────────────────────────────────────
document.getElementById('hint-btn').addEventListener('click',function(){
  document.getElementById('hint-text').textContent=customMode?customHint:(HINTS[word]||'No hint available');
  this.style.display='none';
});

// ── Keyboard shortcut ──────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(document.activeElement===document.getElementById('phrase-input'))return;
  if(document.activeElement===document.getElementById('hint-custom'))return;
  if(!gameStarted)return;
  if(e.key>='a'&&e.key<='z'||e.key>='A'&&e.key<='Z')guess(e.key.toUpperCase());
});

document.getElementById('new-word').addEventListener('click',()=>{
  try{sessionStorage.removeItem('hangman');}catch(e){}
  newWord();
});

// ── Session persistence ────────────────────────────────────────────────────
function _save_hangman(){if(!gameStarted||(over||won))return;
  try{sessionStorage.setItem('hangman',JSON.stringify({word,guessed:[...guessed],wrong,cat,won,over,customMode,customHint,difficulty,gameStarted:true,_ts:Date.now()}));}catch(e){}
}
function _load_hangman(){
  try{
    const raw=sessionStorage.getItem('hangman');if(!raw)return false;
    const s=JSON.parse(raw);if(!s||!s.gameStarted)return false;
    word=s.word;guessed=new Set(s.guessed||[]);wrong=s.wrong||0;cat=s.cat||'Animals';
    won=s.won||false;over=s.over||false;customMode=s.customMode||false;customHint=s.customHint||'';
    difficulty=s.difficulty||'easy';
    selectDiff(difficulty);
    // Start the game immediately
    document.getElementById('diff-screen').style.display='none';
    document.getElementById('mode-row').style.display='flex';
    document.getElementById('cats').style.display=customMode?'none':'flex';
    document.getElementById('hsvg').style.display='block';
    document.getElementById('new-word').style.display=customMode?'none':'';
    document.getElementById('change-diff').style.display='';
    gameStarted=true;
    buildGallows();
    renderPips();
    renderWord();
    buildKeyboard();
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.textContent===cat));
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_hangman);
if(!_load_hangman()){
  // Show difficulty screen (default)
}
</script>
</body>

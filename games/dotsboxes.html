<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
<title>Dots & Boxes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<style>
body{overscroll-behavior:none;background:radial-gradient(ellipse at 50% 0%,#1a0a3a 0%,#0d1117 60%);}
#canvas{display:block;margin:0 auto;touch-action:none;cursor:pointer;max-width:calc(100vw - 24px);}
.status-bar{text-align:center;font-size:.95rem;font-weight:700;margin:10px 0;min-height:24px;}
.score-row{display:flex;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.score-chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 16px;text-align:center;min-width:72px;transition:all .2s;}
.score-chip.active-turn{transform:scale(1.06);}
.ctrl-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.ctrl-btn{padding:6px 12px;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--muted);transition:all .15s;touch-action:manipulation;}
.ctrl-btn.active{border-color:var(--gold);background:rgba(245,200,66,.12);color:var(--gold);}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Dots & Boxes</span>
</nav>
<div class="page" style="padding:10px 8px 40px;">
<div class="ctrl-row">
  <span style="color:var(--muted);font-size:.82rem;align-self:center;">Players:</span>
  <button class="ctrl-btn active" data-players="2">2</button>
  <button class="ctrl-btn" data-players="3">3</button>
  <span style="color:var(--muted);font-size:.82rem;align-self:center;margin-left:6px;">Grid:</span>
  <button class="ctrl-btn" data-size="2">2×2</button>
  <button class="ctrl-btn" data-size="3">3×3</button>
  <button class="ctrl-btn active" data-size="4">4×4</button>
  <button class="ctrl-btn" data-size="5">5×5</button>
  <button class="ctrl-btn" data-size="6">6×6</button>
  <button class="ctrl-btn" data-size="7">7×7</button>
  <button class="ctrl-btn" id="newbtn">New Game</button>
</div>
<div class="score-row" id="score-row"></div>
<div class="status-bar" id="status"></div>
<canvas id="canvas"></canvas>
</div>
<script>
'use strict';
// Player colors: Blue, Red, Purple
const P_COLORS=['#5ac8fa','#ff6b6b','#c084fc'];
const P_EMOJIS=['🔵','🔴','🟣'];
const P_BG=['rgba(90,200,250,.18)','rgba(255,107,107,.18)','rgba(192,132,252,.18)'];

let numPlayers=2, N=4, cur=0, over=false;
let hLines, vLines, boxes;
const PAD=28, DOT=6, LINE_W=5;

function init(){
  hLines=Array.from({length:N+1},()=>Array(N).fill(0));
  vLines=Array.from({length:N},()=>Array(N+1).fill(0));
  boxes=Array.from({length:N},()=>Array(N).fill(0));
  cur=0; over=false;
  const maxW=Math.min(390, window.innerWidth-24);
  const canvas=document.getElementById('canvas');
  canvas.width=maxW; canvas.height=maxW;
  renderScores(); updateStatus(); draw();
}

function getCell(){return(document.getElementById('canvas').width-2*PAD)/N;}

function renderScores(){
  const el=document.getElementById('score-row'); el.innerHTML='';
  const scores=getScores();
  for(let p=0;p<numPlayers;p++){
    const chip=document.createElement('div');
    chip.className='score-chip'+(cur===p&&!over?' active-turn':'');
    chip.style.borderColor=cur===p&&!over?P_COLORS[p]:'rgba(255,255,255,.1)';
    chip.innerHTML=`<div style="font-size:.7rem;color:${P_COLORS[p]};font-weight:700">P${p+1} ${P_EMOJIS[p]}</div><div style="font-family:var(--serif);font-size:1.5rem;font-weight:900;color:${P_COLORS[p]}">${scores[p]}</div>`;
    el.appendChild(chip);
  }
}

function getScores(){
  const s=Array(numPlayers).fill(0);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(boxes[r][c])s[boxes[r][c]-1]++;
  return s;
}

function updateStatus(){
  if(over){document.getElementById('status').textContent='';return;}
  document.getElementById('status').textContent=`Player ${cur+1}'s turn ${P_EMOJIS[cur]}`;
}

function draw(){
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  const cw=canvas.width,ch=canvas.height;
  const CELL=getCell();
  // Scale visual elements to cell size
  const DOT_R=Math.max(3,Math.round(CELL*0.1));
  const LW=Math.max(2,Math.round(CELL*0.08));
  ctx.clearRect(0,0,cw,ch);

  // Filled boxes
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(boxes[r][c]){
      ctx.fillStyle=P_BG[boxes[r][c]-1];
      ctx.fillRect(PAD+c*CELL,PAD+r*CELL,CELL,CELL);
      ctx.fillStyle=P_COLORS[boxes[r][c]-1];
      ctx.font=`bold ${Math.round(CELL*0.32)}px Inter,sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(boxes[r][c],PAD+c*CELL+CELL/2,PAD+r*CELL+CELL/2);
    }
  }

  // H-lines
  for(let r=0;r<=N;r++)for(let c=0;c<N;c++){
    ctx.beginPath();
    ctx.moveTo(PAD+c*CELL+DOT_R+2,PAD+r*CELL);
    ctx.lineTo(PAD+(c+1)*CELL-DOT_R-2,PAD+r*CELL);
    ctx.strokeStyle=hLines[r][c]?P_COLORS[hLines[r][c]-1]:'rgba(255,255,255,.15)';
    ctx.lineWidth=hLines[r][c]?LW:1.5;
    ctx.lineCap='round'; ctx.stroke();
  }
  // V-lines
  for(let r=0;r<N;r++)for(let c=0;c<=N;c++){
    ctx.beginPath();
    ctx.moveTo(PAD+c*CELL,PAD+r*CELL+DOT_R+2);
    ctx.lineTo(PAD+c*CELL,PAD+(r+1)*CELL-DOT_R-2);
    ctx.strokeStyle=vLines[r][c]?P_COLORS[vLines[r][c]-1]:'rgba(255,255,255,.15)';
    ctx.lineWidth=vLines[r][c]?LW:1.5;
    ctx.lineCap='round'; ctx.stroke();
  }
  // Dots
  for(let r=0;r<=N;r++)for(let c=0;c<=N;c++){
    ctx.beginPath(); ctx.arc(PAD+c*CELL,PAD+r*CELL,DOT_R,0,Math.PI*2);
    ctx.fillStyle='#e2e8f0'; ctx.fill();
  }
}

function onClick(px,py){
  if(over)return;
  const CELL=getCell();
  const HIT=CELL*0.38;
  const DOT_R=Math.max(3,Math.round(CELL*0.1));
  let best=Infinity, type=null, br, bc;

  for(let r=0;r<=N;r++)for(let c=0;c<N;c++){
    const mx=PAD+c*CELL+CELL/2, my=PAD+r*CELL;
    if(Math.abs(py-my)<HIT&&px>PAD+c*CELL+DOT_R&&px<PAD+(c+1)*CELL-DOT_R){
      const d=Math.abs(py-my);if(d<best){best=d;type='h';br=r;bc=c;}
    }
  }
  for(let r=0;r<N;r++)for(let c=0;c<=N;c++){
    const mx=PAD+c*CELL, my=PAD+r*CELL+CELL/2;
    if(Math.abs(px-mx)<HIT&&py>PAD+r*CELL+DOT_R&&py<PAD+(r+1)*CELL-DOT_R){
      const d=Math.abs(px-mx);if(d<best){best=d;type='v';br=r;bc=c;}
    }
  }
  if(!type)return;
  if(type==='h'){if(hLines[br][bc])return;sLine();
    hLines[br][bc]=cur+1;}
  else{if(vLines[br][bc])return;sLine();
    vLines[br][bc]=cur+1;}

  let scored=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!boxes[r][c]&&hLines[r][c]&&hLines[r+1][c]&&vLines[r][c]&&vLines[r][c+1]){
      sBox();
          boxes[r][c]=cur+1; scored=true;
    }
  }

  const scores=getScores();
  if(scores.reduce((a,b)=>a+b,0)===N*N){
    sWin(); over=true;
    const max=Math.max(...scores);
    const winners=scores.map((s,i)=>s===max?i:-1).filter(i=>i>=0);
    const winText=winners.length===1?`Player ${winners[0]+1} ${P_EMOJIS[winners[0]]} wins!`:'It\'s a draw!';
    document.getElementById('status').innerHTML=`<span style="color:${winners.length===1?P_COLORS[winners[0]]:'var(--gold)'}">${winText}</span>`;
    renderScores(); draw(); return;
  }
  if(!scored){cur=(cur+1)%numPlayers;}
  renderScores(); updateStatus(); draw();
}

const canvas=document.getElementById('canvas');
function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
  if(e.touches){return{x:(e.touches[0].clientX-rect.left)*sx,y:(e.touches[0].clientY-rect.top)*sy};}
  return{x:(e.clientX-rect.left)*sx,y:(e.clientY-rect.top)*sy};
}
canvas.addEventListener('click',e=>{const p=getPos(e);onClick(p.x,p.y);});
canvas.addEventListener('touchend',e=>{e.preventDefault();const p=getPos(e);onClick(p.x,p.y);},{passive:false});

// Controls
document.querySelectorAll('[data-players]').forEach(b=>{
  b.addEventListener('click',()=>{
    numPlayers=+b.dataset.players;
    document.querySelectorAll('[data-players]').forEach(x=>{x.classList.remove('active');});
    b.classList.add('active'); init();
  });
});
document.querySelectorAll('[data-size]').forEach(b=>{
  b.addEventListener('click',()=>{
    N=+b.dataset.size;
    document.querySelectorAll('[data-size]').forEach(x=>{x.classList.remove('active');});
    b.classList.add('active'); init();
  });
});
document.getElementById('newbtn').addEventListener('click',init);
init();

// ── Sound ────────────────────────────────────────────────────────────────────
let _ac=null,_muted=false;
function sac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function sTone(freq,start,dur,vol,type,ramp){
  const ctx=sac(),t=ctx.currentTime+start,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(ramp)o.frequency.exponentialRampToValueAtTime(ramp,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.18,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.05);
}
function sNoise(start,dur,fc,q,vol,decay){
  const ctx=sac(),t=ctx.currentTime+start;
  const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*(decay||0.5)));
  const src=ctx.createBufferSource();src.buffer=buf;
  const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=fc||1000;filt.Q.value=q||2;
  const g=ctx.createGain();g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(filt);filt.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+dur+0.05);
}
function sWin(){if(_muted)return;[523,659,784,1047].forEach((f,i)=>sTone(f,i*.08,.5,.2));}
function sLose(){if(_muted)return;[400,320,240].forEach((f,i)=>sTone(f,i*.1,.35,.18,'triangle'));}
function sClick(pitch){if(_muted)return;sNoise(0,.035,pitch||900,5,.15,.15);}
function sDing(freq,vol){if(_muted)return;sTone(freq||660,0,.35,vol||.18);}

function sLine(){if(_muted)return;sNoise(0,.028,1100,6,.12,.1);}
function sBox(){if(_muted)return;sDing(700,.17);sDing(880,.13,.05);}

// ── Session persistence ────────────────────────────────────────────────────
function _save_db(){if(over)return;
  try{sessionStorage.setItem('db',JSON.stringify({numPlayers,N,cur,over,hLines,vLines,boxes,_ts:Date.now()}));}catch(e){}
}
function _load_db(){
  try{
    const raw=sessionStorage.getItem('db');if(!raw)return false;
    const s=JSON.parse(raw);if(!s)return false;
    numPlayers=s.numPlayers;N=s.N;cur=s.cur;over=s.over||false;hLines=s.hLines;vLines=s.vLines;boxes=s.boxes;
    render();
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_db);
document.getElementById('newbtn')?.addEventListener('click',()=>{try{sessionStorage.removeItem('db');}catch(e){}},true);
_load_db();
</script>
</body>
</html>

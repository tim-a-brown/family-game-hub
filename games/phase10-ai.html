<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phase 10</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
.stage{padding-bottom:max(calc(var(--safe-b) + 8px),18px);}
/* ── Phase 10 cards (built with Kit.cardFace) ───────────────────────────── */
.pcard.p10 .ix{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);font-family:var(--display);font-weight:400;}
.pcard.p10 .ov{display:grid;place-items:center;width:64%;height:70%;border-radius:50%;background:#fff;transform:rotate(-24deg);
  box-shadow:inset 0 0 0 calc(var(--cw) * .03) rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.25);}
.pcard.p10 .ov b{transform:rotate(24deg);color:var(--ink);font-family:var(--display);font-weight:400;font-size:calc(var(--cw) * .44);line-height:1;}
.pcard.p10.wild .ov{background:conic-gradient(#e0253a 0 25%,#1e6fdc 0 50%,#169a4c 0 75%,#f2b200 0);}
.pcard.p10.wild .ov b{color:#fff;font-size:calc(var(--cw) * .2);letter-spacing:.04em;text-shadow:0 1px 2px rgba(0,0,0,.6);}
.pcard.p10.skip .ov{background:none;box-shadow:none;transform:none;width:58%;height:auto;}
.pcard.p10.skip .ov svg{width:100%;height:auto;}
.pcard.p10 .lbl{font-size:calc(var(--cw) * .12);opacity:.92;}
.pcard.p10 .ix.bot{display:none;}
.pcard.p10.c-y .ix,.pcard.p10.c-y .lbl{text-shadow:0 1px 1px rgba(90,60,0,.55);}
/* Mini cards inside laid-down groups: just the corner number */
.pcard.p10.mini .big,.pcard.p10.mini .lbl,.pcard.p10.mini .ix.bot{display:none;}
.pcard.p10.mini .ix{font-size:13px;left:3px;top:3px;}
.pcard.p10.mini:last-child .big{display:grid;}
.pcard.p10.mini:last-child .ix{display:none;}
.pcard.p10.mini .ov b{font-size:15px;}
.pcard.p10.mini.wild .ov b{font-size:6px;}
/* ── Table ─────────────────────────────────────────────────────────────── */
.ctable .felt-in.p10f{height:auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 8px 10px;}
.opps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;}
.p10f .cseat{position:relative;min-width:0;}
.p10f .cseat .tag .nm{max-width:82px;white-space:normal;line-height:1.05;text-wrap:balance;}   /* (Optimus / Prime on two lines, not cut) */
.p10f .cseat .info{flex-wrap:wrap;justify-content:center;}
.p10f .cseat .chip-s.ph{color:#fff;}
.p10f .cseat .chip-s.laid{background:var(--green);color:#063;}
.p10f .cseat .chip-s.skp{background:var(--red);color:#fff;}
.p10f .cseat .chip-s .ico{width:11px;height:11px;vertical-align:-1px;}
.p10f .cseat .say{top:100%;}
.p10f .cseat .chip-s.cnt .ico{width:12px;height:12px;margin-right:2px;vertical-align:-2px;}
.opps.many{gap:6px 4px;}
.opps.many .cseat{flex:0 0 31.5%;}
.opps.many .cseat .tag{max-width:100%;}
.opps.many .cseat .tag{font-size:.74rem;padding:3px 8px 3px 3px;gap:4px;}
.opps.many .cseat .tag .avatar{width:22px;height:22px;}
.opps.many .cseat .tag .nm{max-width:64px;}
.opps.many .cseat .chip-s{font-size:.66rem;padding:1px 6px;}
.p10f .cseat.me .say{top:auto;bottom:100%;margin:0 0 4px;}
.mid{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:22px;padding:2px 0 0;}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;--cw:58px;background:none;border:0;padding:0;color:#fff;}
.pile .cap{font-size:.76rem;font-weight:650;color:rgba(255,255,255,.72);white-space:nowrap;}
.pile .stackwrap{position:relative;}
.pile .stackwrap .pcard.under{position:absolute;left:0;top:0;transform:translate(-3px,-3px) rotate(-5deg);filter:brightness(.85);}
.pile .stackwrap .pcard.under2{position:absolute;left:0;top:0;transform:translate(3px,-2px) rotate(4deg);filter:brightness(.8);}
.pile .empty{width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);}
.pile.live .stackwrap > .pcard:last-child{box-shadow:0 0 0 3px var(--lit),0 0 22px var(--litg);animation:breathe 1.4s ease-in-out infinite;cursor:pointer;}
@keyframes breathe{50%{transform:translateY(-4px);}}
.tablemsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;padding:6px 14px;border-radius:999px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--plate-line);color:#fff;font-weight:700;font-size:.88rem;white-space:nowrap;pointer-events:none;animation:pop .35s var(--spring);}
.melds{display:flex;flex-direction:column;gap:6px;}
.melds .none{text-align:center;color:rgba(255,255,255,.5);font-weight:600;font-size:.84rem;padding:6px 0;}
.mrow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);border-radius:14px;padding:3px 8px;}
.mrow .who{width:56px;flex:none;display:flex;flex-direction:column;font-size:.72rem;font-weight:750;color:#fff;line-height:1.15;overflow:hidden;}
.mrow .who span{overflow-wrap:anywhere;text-wrap:balance;}   /* (Optimus / Prime on two lines, never cut) */
.mrow .who small{color:rgba(255,255,255,.62);font-weight:600;font-size:.68rem;}
.grps{display:flex;flex-wrap:wrap;gap:6px 10px;min-width:0;}
.grp{display:flex;--cw:29px;padding:3px;border-radius:8px;border:0;background:none;position:relative;}
.grp .pcard{box-shadow:0 0 0 1px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.35);}
.grp .pcard+.pcard{margin-left:-15px;}
.grp.tgt{cursor:pointer;box-shadow:0 0 0 2px var(--lit),0 0 16px var(--litg);background:rgba(255,211,77,.15);}
.grp.tgt::after{content:'+';position:absolute;right:-8px;top:-8px;width:18px;height:18px;border-radius:50%;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);font-weight:900;font-size:14px;line-height:18px;text-align:center;}
.grp .pcard.newc{animation:glow 1.4s ease-in-out 2;}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--green),0 0 14px rgba(61,220,132,.8);}}
/* ── Phase strip: your phase and the ten in a row, on glass ─────────────── */
.phstrip{display:flex;align-items:center;gap:10px;border-radius:18px;padding:9px 12px;margin:0 0 4px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line),0 10px 22px -16px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
.phstrip .gl{flex:1;min-width:0;line-height:1.1;}
.phstrip .gl b{display:block;font-family:var(--display);font-size:1.1rem;color:var(--text);letter-spacing:-.02em;}
.phstrip{transition:box-shadow .25s;}
.phstrip.turn{box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.65),0 0 20px rgba(255,190,60,.2),0 10px 22px -16px rgba(0,0,0,.9);}
.phstrip.turn .gl b{color:var(--lit-ink);}
.phstrip .gl b em{font-style:normal;font-family:var(--font);font-weight:750;font-size:.74rem;background:var(--yellow-fill);color:#2b1a00;border-radius:999px;padding:2px 7px;vertical-align:3px;margin-left:4px;}
.phstrip .gl b em.skp{background:var(--red);color:#fff;}
.phstrip .gl span{font-size:.92rem;font-weight:600;color:var(--text-2);}
.phstrip .gl span .ok{color:var(--green);font-weight:700;}
.dots{display:grid;grid-template-columns:repeat(5,18px);gap:3px;}
.dots i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.64rem;font-weight:800;color:var(--text-3);box-shadow:inset 0 0 0 1.5px var(--gl-line);}
.dots i.done{background:color-mix(in srgb,var(--green) 70%,#0b3);color:#03290f;box-shadow:none;}
.dots i.cur{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);box-shadow:0 0 10px var(--litg);}
/* ── Phase builder ────────────────────────────────────────────────────── */
.builder{border-radius:18px;padding:8px;margin:6px 0 0;}
.bhead{display:flex;align-items:center;gap:8px;padding:0 2px 6px;color:#fff;font-weight:750;font-size:.88rem;}
.bhead .grow{flex:1;}
.bhead .btn{min-height:36px;padding:0 12px;font-size:.8rem;}
.mats{display:flex;gap:8px;}
.mat{flex:1;min-width:0;border:0;border-radius:15px;padding:6px 6px 5px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);color:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;}
.mat.on{box-shadow:inset 0 0 0 2px var(--lit),0 0 14px var(--litg);}
.mat.good{box-shadow:inset 0 0 0 2px var(--green);}
.mat.on.good{box-shadow:inset 0 0 0 2px var(--green),0 0 0 2px var(--lit);}
.mat .mt{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:700;}
.mat .mt .ico{width:14px;height:14px;color:var(--green);}
.mat .mc{display:flex;min-height:46px;align-items:center;--cw:33px;padding-left:2px;}
.mat .mc .pcard+.pcard{margin-left:-14px;}
.mat .mc .pcard{cursor:pointer;}
.mat .mc .ph{font-size:.76rem;font-weight:600;color:rgba(255,255,255,.58);}
.mat .ms{font-size:.76rem;font-weight:600;color:rgba(255,255,255,.75);min-height:1em;}
.mat.good .ms{color:#9ff5c4;}
.mat.bad .ms{color:#ffb3ba;}
/* ── Hand & bar ───────────────────────────────────────────────────────── */
.chand{padding-top:20px;}
.cbar .btn{min-height:46px;white-space:nowrap;padding:0 18px;}
.cbar .hint{font-size:.9rem;white-space:nowrap;}
.cbar .btn.pulse{animation:pulseb 1.3s ease-in-out infinite;}
@keyframes pulseb{50%{box-shadow:0 0 0 4px rgba(255,211,77,.45),0 0 18px var(--litg);}}
.ghost{position:fixed;z-index:60;pointer-events:none;transition:transform .42s cubic-bezier(.2,.8,.25,1),opacity .42s;}
/* ── Hand summary sheet ───────────────────────────────────────────────── */
.sum{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums;}
.sum th,.sum td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--w08);}
.sum th{font-size:.8rem;font-weight:650;color:var(--text-3);}
.sum th:first-child,.sum td:first-child{text-align:left;}
.sum td.big{font-weight:900;font-size:1.1rem;}
.sum td .ico{width:18px;height:18px;vertical-align:-3px;}
.sum td.yes{color:var(--green);}
.sum td.no{color:var(--text-3);}
.sum tr.lead td:first-child{color:var(--lit-ink);}
.skiplist{display:flex;flex-direction:column;gap:8px;}
.skiplist .btn{justify-content:flex-start;}
/* iPad portrait: a bigger table, bigger cards */
@media (min-width:700px) and (min-height:900px){
  html:not(.land) .stage{max-width:720px;}
  html:not(.land) .ctable .felt-in.p10f{min-height:clamp(380px,40dvh,480px);justify-content:space-between;gap:12px;padding:14px 12px;}
  html:not(.land) .p10f .cseat .tag{font-size:.95rem;}
  html:not(.land) .p10f .cseat .tag .avatar{width:30px;height:30px;}
  html:not(.land) .p10f .cseat .tag .nm{max-width:130px;}
  html:not(.land) .p10f .cseat .chip-s{font-size:.8rem;padding:2px 9px;}
  html:not(.land) .opps.many .cseat .tag{font-size:.85rem;}
  html:not(.land) .opps.many .cseat .tag .nm{max-width:100px;}
  html:not(.land) .opps.many .cseat .chip-s{font-size:.74rem;}
  html:not(.land) .pile{--cw:84px;}
  html:not(.land) .pile .cap{font-size:.76rem;}
  html:not(.land) .mid{gap:30px;}
  html:not(.land) .tablemsg{font-size:1rem;}
  html:not(.land) .melds{gap:8px;}
  html:not(.land) .mrow{padding:5px 10px;gap:10px;}
  html:not(.land) .mrow .who{width:76px;font-size:.82rem;}
  html:not(.land) .mrow .who small{font-size:.72rem;}
  html:not(.land) .melds .none{font-size:.9rem;}
  html:not(.land) .grp{--cw:40px;}
  html:not(.land) .grp .pcard+.pcard{margin-left:-21px;}
  html:not(.land) .pcard.p10.mini .ix{font-size:17px;}
  html:not(.land) .pcard.p10.mini .ov b{font-size:20px;}
  html:not(.land) .pcard.p10.mini.wild .ov b{font-size:8px;}
  html:not(.land) .phstrip{padding:10px 14px;}
  html:not(.land) .phstrip .gl b{font-size:1.25rem;}
  html:not(.land) .phstrip .gl span{font-size:1.35rem;}
  html:not(.land) .dots{grid-template-columns:repeat(5,22px);gap:4px;}
  html:not(.land) .dots i{width:22px;height:22px;font-size:.7rem;}
  html:not(.land) .mat .mc{--cw:44px;min-height:62px;}
  html:not(.land) .mat .mc .pcard+.pcard{margin-left:-18px;}
  html:not(.land) .mat .mt,html:not(.land) .mat .ms{font-size:.8rem;}
  html:not(.land) .bhead{font-size:.95rem;}
  html:not(.land) .chand{--cw:86px;}
  html:not(.land) .cbar .btn{min-height:52px;font-size:1.02rem;}
  html:not(.land) .cbar .hint{font-size:1rem;}
}
/* Landscape tablets and desktops: table on the left, your phase card and hand on the right */
@media (min-width:1000px) and (orientation:landscape){
  html.land .stage.p10-play{max-width:1120px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto auto 1fr;column-gap:22px;align-items:start;}
  html.land .p10-play > .ctable{grid-column:1;grid-row:1 / -1;margin:0;}
  html.land .p10-play > :not(.ctable){grid-column:2;}
  html.land .p10-play .ctable .felt-in.p10f{min-height:clamp(320px,calc(100dvh - 88px - var(--safe-b)),640px);justify-content:space-between;gap:12px;padding:12px 10px;}
  html.land .p10-play .pile{--cw:76px;}
  html.land .p10-play .grp{--cw:36px;}
  html.land .p10-play .grp .pcard+.pcard{margin-left:-19px;}
  html.land .p10-play .pcard.p10.mini .ix{font-size:15px;}
  html.land .p10-play .pcard.p10.mini .ov b{font-size:18px;}
  html.land .p10-play .mrow .who{width:70px;font-size:.78rem;}
  html.land .p10-play > .phstrip{margin-top:2px;}
  html.land .p10-play .chand{--cw:76px;}
}
/* A phone held upright: the table grows into the room the hand and buttons leave */
@media (orientation:portrait) and (max-width:600px){
  .stage.p10-play{display:flex;flex-direction:column;min-height:calc(100dvh - var(--bar));}
  .p10-play > .ctable{flex:1 1 auto;display:flex;flex-direction:column;}
  .p10-play > .ctable .felt-in.p10f{flex:1 1 auto;justify-content:space-between;}
  .p10-play .pile{--cw:clamp(58px,17vw,72px);}
}
/* A phone or iPad on its side (html.ls, set in the script): the table on the left as tall as the screen, the phase you are
   building laid along its foot; your phase, your hand and the buttons on the right, where you act */
html.ls .stage.p10-play{max-width:none;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,1fr);grid-template-rows:auto auto 1fr auto;column-gap:14px;align-items:start;
  height:calc(100dvh - var(--bar));padding:0 calc(var(--corner-x) + 6px) max(calc(var(--safe-b) + 10px),18px);}
html.ls .p10-play > .ctable{grid-column:1;grid-row:1 / -1;margin:0;padding:7px;align-self:stretch;}
html.ls .p10-play .ctable .felt-in.p10f{height:100%;min-height:0;justify-content:space-between;gap:6px;padding:8px;}
html.ls .p10-play > :not(.ctable){grid-column:2;}
html.ls .p10-play > .phstrip{grid-row:1;margin:0 0 4px;padding:6px 10px;}
html.ls .p10-play > .builder{grid-column:1;grid-row:1 / -1;align-self:end;z-index:5;margin:0 8px 8px;box-shadow:0 -10px 24px rgba(0,0,0,.45);}
html.ls .p10-play > .csort-row{grid-row:2;}
html.ls .p10-play > .chand{grid-row:3;align-self:center;--cw:clamp(52px,calc((100dvh - var(--bar)) * .2),88px);padding-top:16px;}
html.ls .p10-play > .cbar{grid-row:4;margin:0;align-self:end;}
html.ls .p10-play .pile{--cw:clamp(44px,calc((100dvh - var(--bar)) * .16),84px);}
html.ls .p10-play .mid{gap:16px;}
html.ls .p10-play .mat .mc{--cw:clamp(30px,calc((100dvh - var(--bar)) * .06),44px);min-height:42px;}
/* the same on an iPad: the table's seats at an iPad's size */
@media (min-height:600px){
  html.ls .p10f .cseat .tag{font-size:.95rem;}
  html.ls .p10f .cseat .tag .avatar{width:30px;height:30px;}
  html.ls .p10f .cseat .chip-s{font-size:.8rem;padding:2px 9px;}
  html.ls .p10-play .grp{--cw:38px;}
  html.ls .p10-play .grp .pcard+.pcard{margin-left:-20px;}
  html.ls .p10-play .pcard.p10.mini .ix{font-size:16px;}
  html.ls .p10-play .pcard.p10.mini .ov b{font-size:19px;}
}
/* Turning the device: the table, the hand and the buttons glide to their new places (a View Transition in the script) */
.p10-play > .ctable{view-transition-name:p10-table;} .p10-play > .chand{view-transition-name:p10-hand;} .p10-play > .cbar{view-transition-name:p10-bar;} .p10-play > .phstrip{view-transition-name:p10-phase;}
/* ── A large window (Cards.desk in cards.js lays the page out; html.rdesk while a layout of this kind shows) ──────
   The felt takes the room, and it is laid as a table is: the other players round it (the first on your left, then
   across the top, the last on your right), each with the phase they have laid down in front of them and whatever has
   been hit onto it; the deck and the discard pile in the middle; your own phase along the foot, where you build it.
   At the left stands the score sheet: a row a hand, each player's phase that hand (filled in when they made it) and
   the points they were caught with, the totals, and under them the climb through the phases. At the right is the
   ladder of the phases in words with every player standing on theirs, who has laid down and who loses a turn, and
   what a card left in the hand costs. Both panels are in the page at every size and drawn only at a desk. (The grid
   for each shape of window is set in the script, from Cards.DESK.) A window smaller than a desk that no phone or
   tablet has (a small square, a small wide one) gets the same table without the panels, fitted to the window so
   nothing scrolls. */
html.rdesk.rdk #app.stage:has(> .ctable){align-items:stretch;--cdk-rw:clamp(300px,20.5vw,450px);}
html.rdesk #app.stage > .ctable{view-transition-name:none;}
html.rdesk #app.stage > .chand,html.rdesk #app.stage > .cbar,html.rdesk #app.stage > .phstrip{view-transition-name:none;}
html.rdesk #app.stage > .ctable .felt-in.p10f{max-height:none;min-height:0;}
html.rdesk #app.stage > .phstrip{grid-area:goal;min-width:0;margin:0 0 8px 16px;}
html.rdesk #app.stage > .chand{min-height:calc(var(--cw) * 1.62 + 4px);}
html.rdesk #app .chand .pd-nohand{align-self:center;color:var(--text-3);font-weight:600;font-size:1rem;}
html.rdesk #app .chand .pcard.play:hover:not(.sel){transform:translateY(calc(var(--cw) * -.07));}
html.rdesk #app.stage > .cbar .hint{white-space:normal;text-wrap:balance;}
html.rdesk #app .felt-in.pd{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(24%,auto) minmax(0,1fr) auto;grid-template-areas:"n" "c" "m";justify-content:normal;gap:clamp(8px,1.3vmin,20px);padding:clamp(12px,1.5vmin,28px);}
html.rdesk #app .felt-in.pd.ring{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"n n n" "w c e" "m m m";}
.pd-n{grid-area:n;display:flex;gap:clamp(8px,1.3vmin,20px);min-width:0;min-height:0;}
.pd-w,.pd-e{display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.3vmin,20px);min-width:0;min-height:0;}
html.rdesk #app .felt-in.pd.pd-over{grid-template-rows:max-content max-content max-content;align-content:start;overflow-y:auto;overscroll-behavior:contain;}
/* (and its places stand one under another, each the felt's whole width: the top, the piles, the two sides, your own) */
html.rdesk #app .felt-in.pd.pd-over.ring{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(5,max-content);grid-template-areas:"n" "c" "w" "e" "m";}
html.rdesk #app .pd.pd-over .pd-w,html.rdesk #app .pd.pd-over .pd-e{flex-direction:row;flex-wrap:wrap;justify-content:space-around;}
html.rdesk #app .pd.pd-over .pd-w .pd-place,html.rdesk #app .pd.pd-over .pd-e .pd-place{align-items:center;}
html.rdesk #app .pd.pd-over .pd-w .grps,html.rdesk #app .pd.pd-over .pd-e .grps{justify-content:center;}

        S.turn = (p + 1) % n;
        for (var k = 0; k < n && S.skipNext[S.turn]; k++) { S.skipNext[S.turn] = false; sk.push(S.turn); S.turn = (S.turn + 1) % n; }
        S.step = 'draw'; S.lastHit = null;
        if (sk.length) mv.sk = sk;
        return { state: S, mv: mv };
      }
      return null;
    });
  }
  // (inside withS) the hand is over: counted, then the game ends or the next hand is dealt
  function netEndHand(out, mv) {
    scoreHand(out);
    mv.end = 1; mv.out = out;
    S.lastHand = { hand: S.hand, out: out };
    if (S.players.some(function (pl) { return pl.done; })) { S.stage = 'over'; return; }
    netDeal(S);
  }
  // a computer seat: one step at a time, as a person would
  function netBot(st, p) {
    if (!st || st.stage !== 'play' || st.turn !== p) return null;
    var a = withS(st, function () {
      var h = S.hands[p];
      if (S.step === 'draw') return { t: 'draw', d: cpuTake(p) ? 1 : 0 };
      if (!S.laid[p]) { var gs = findPhase(h, S.players[p].ph - 1); if (gs) return { t: 'lay', g: gs.map(function (g) { return g.map(function (c) { return c.id; }); }) }; }
      else for (var i = 0; i < h.length; i++) { var spot = findSpot(h[i]); if (spot) return { t: 'hit', id: h[i].id, o: spot[0], g: spot[1] }; }
      var pick = cpuDiscard(p);
      return { t: 'disc', id: pick.id, to: isS(pick) ? skipTarget(p) : -1 };
    });
    return netApply(st, p, a);
  }
  function netYou(a) {
    if (!NET) return;
    if (!NET.myTurn()) { Kit.toast('Wait for your turn'); Kit.haptic('error'); return; }
    var seat = NET.seat;
    paint();
    NET.act(function (st) { return netApply(st, seat, a); });
  }

  // Drawing the table: each move as it comes, with the same motion as on one device. A backlog is caught up quickly.
  function netShow(net, info) {
    info = info || {};
    NET = net;
    var e = { st: JSON.parse(JSON.stringify(net.state)), info: info };
    if (info.fresh || info.again) { NETQ = [e]; if (NETBUSY) { token++; NETBUSY = false; } netCloseOv(); }
    else NETQ.push(e);
    if (!NETBUSY) netNext();
  }
  function netNext() {
    if (!NET) { NETQ = []; NETBUSY = false; return; }
    var e = NETQ.shift();
    if (!e) { NETBUSY = false; return; }
    NETBUSY = true;
    netDraw(e.st, e.info, NETQ.length > 2 || document.hidden, netNext);
  }
  // the table as this device shows it: the picked card and the phase being built stay as they were
  function netView(st) {
    var old = S && S.hands ? S : null, me = Math.max(0, NET.seat);
    st.me = me; st.cover = false; st.sel = null; st.building = false; st.build = null; st.bActive = 0;
    if (old && old.hand === st.hand && st.turn === me && st.stage === 'play') {
      var has = {}; st.hands[me].forEach(function (c) { has[c.id] = 1; });
      if (old.sel && has[old.sel]) st.sel = old.sel;
      if (old.building && old.build && !st.laid[me]) { st.building = true; st.build = old.build.map(function (b) { return b.filter(function (id) { return has[id]; }); }); st.bActive = old.bActive || 0; }
    }
    S = st;
  }
  function netDraw(st, info, quick, done) {
    var mv = info.mv, t = ++token, me = Math.max(0, NET.seat), mine = !!mv && mv.p === me && NET.seat >= 0;
    function later(ms, f) { setTimeout(function () { if (t === token && NET) f(); }, ms); }
    // where things were before this move
    var tagR = mv && seatEls[mv.p] ? rectOf(seatEls[mv.p].querySelector('.tag')) : null, pileR = mv && mv.t === 'draw' ? rectOf(mv.d ? '#discardTop' : '#stockTop') : null;
    var fromR = mine ? (mv.t === 'lay' ? rectOf(goalEl) : NETFLY) : tagR; NETFLY = null;
    var wasOn = app.classList.contains('p10-play') && feltEl && feltEl.isConnected;
    netView(st);
    if (!wasOn || info.fresh || info.again) render(); else paint();
    if (info.again) { Kit.sfx('deal'); Kit.callout('New game'); }
    if (quick || info.fresh || info.again || !mv) {
      if (st.stage === 'over') later(info.fresh ? 300 : 600, netEnd);
      else if (st.hand === 1 && !st.turns.some(Boolean) && !st.laid.some(Boolean)) flash('Phase 1: ' + PH[0].d);
      done(); return;
    }
    if (mv.end) return netDrawEnd(mv, later, done);
    if (mv.t === 'draw') {
      Kit.sfx('flip');
      if (mv.rs) flash('Deck reshuffled');
      if (mine) flyIn(mv.id, pileR);
      else { ghost(mv.d ? mv.c : null, pileR, rectOf(seatEls[mv.p] && seatEls[mv.p].querySelector('.tag'))); if (mv.d) say(mv.p, 'Takes ' + cname(mv.c)); }
      later(420, done); return;
    }
    if (mv.t === 'lay') {
      Kit.sfx('good'); if (mine) Kit.haptic('success');
      var mr = app.querySelector('.mrow[data-p="' + mv.p + '"]');
      if (mr && fromR) Array.prototype.forEach.call(mr.querySelectorAll('.pcard'), function (n, k) { flyNode(n, fromR, 360 + k * 20); });
      say(mv.p, 'Phase ' + mv.ph + '!');
      if (mine) Kit.callout('Phase ' + mv.ph + ' down!');
      later(560, done); return;
    }
    if (mv.t === 'hit') {
      Kit.sfx('chip'); if (mine) Kit.haptic('light');
      var n = app.querySelector('.grp [data-id="' + mv.id + '"]'); if (n) { n.classList.add('newc'); flyNode(n, fromR, 340); }
      later(420, done); return;
    }
    if (mv.t === 'disc') {
      flyNode(app.querySelector('#discardTop'), fromR, 360);
      if (mv.to >= 0) { Kit.sfx('bad'); say(mv.p, 'Skip ' + (mv.to === NET.seat ? 'you' : S.players[mv.to].name) + '!'); if (mv.to === NET.seat) Kit.haptic('error'); }
      else Kit.sfx('flip');
      if (!mv.sk) { later(420, done); return; }
      later(700, function () {
        mv.sk.forEach(function (q) { say(q, 'Skipped!'); });
        Kit.sfx('bad');
        if (mv.sk.indexOf(NET.seat) >= 0) { Kit.callout('You were skipped'); Kit.haptic('error'); }
        later(800, done);
      });
      return;
    }
    done();
  }
  // the move that ended a hand: who went out, then the scores for that hand (the next one is already dealt)
  function netDrawEnd(mv, later, done) {
    var out = mv.out;
    if (out >= 0) { say(out, 'Out!'); Kit.callout(out === NET.seat ? 'You went out!' : S.players[out].name + ' went out!'); Kit.sfx('good'); }
    later(1100, function () {
      if (S.stage === 'over') { netEnd(); done(); return; }
      Kit.sfx('deal');
      netHandNote();
      done();
    });
  }
  function netCloseOv() { if (NETSHEET) { try { NETSHEET.close(); } catch (e) {} NETSHEET = null; } if (NETWIN) { try { NETWIN.close(); } catch (e) {} NETWIN = null; } }
  function netHandNote() {
    var lh = S.lastHand; if (!NET || !lh || lh.hand !== S.hand - 1) return;
    var key = NET.code + ':' + S.started + ':' + lh.hand;
    if (NETSEEN[key]) return; NETSEEN[key] = 1;
    if (NETSHEET) try { NETSHEET.close(); } catch (e) {}
    NETSHEET = showScores(true, { hand: lh.hand });
  }
  function netEnd() {
    if (!NET || !S || S.stage !== 'over') return;
    var key = NET.code + ':' + S.started;
    if (NETWIN && NETWIN.key === key) return;
    netCloseOv();
    NETWIN = finish() || null;
    if (NETWIN) NETWIN.key = key;
  }
  function netLeave() {
    NET = null; NETQ = []; NETBUSY = false; token++;
    netCloseOv();
    var sv = null; try { sv = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv && sv.players && sv.hands && sv.stage !== 'over') { S = sv; if (S.me == null) S.me = 0; S.cover = false; if (S.stage === 'ending') S.stage = 'play'; render(); next(); }
    else showSetup();
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.players && saved.hands && saved.stage !== 'over') {
    S = saved; if (S.me == null) S.me = 0; S.cover = false; Kit.gameStart();
    // older saves kept the sort choice in the game state
    if (S.sort === 'color' && Cards.sortMode('phase10_sort', null) == null) sortT.set('color');
    if (S.stage === 'ending') { S.stage = 'play'; }
    render();
    if (S.stage === 'play' && S.players.some(function (pl, i) { return !S.hands[i].length; })) endHand(S.hands.findIndex(function (h) { return !h.length; }));
    else next();
  } else showSetup();

  // Test hook (the demo, games/demos/phase10-ai.js): start a game with given players, then set the hands and carry on
  window.__p10 = {
    state: function () { return S; },
    start: function (cfg) { token++; S = freshGame(cfg.players, cfg.last || 10, cfg.mode || 'cpu'); Kit.gameStart(); newHand(); },
    set: function (fn) { token++; fn(S); undoStack = []; save(); render(); next(); }
  };

  // online tables (after the local game is drawn): opens ?online=1&room=CODE from the home screen
  TurnNet.setup({
    game: 'phase10', title: 'Phase 10', min: 2, max: 6, botMs: 850,
    seats: function (n, o) { return Math.max(n, Math.min(6, +(o && o.seats) || n)); },
    opts: netOpts, start: netStart, turn: netTurn, over: netOver, bot: netBot,
    show: netShow, leave: netLeave
  });
})();
</script>
<script>
// A large window dragged to a new shape at any moment: the cards, the places, the piles and the panels glide from where they
// showed in the last frame to their new places (where everything is, is noted every frame, since a resize has
// already moved things by the time it is heard). A card that was redrawn is found again by its id. Only where a
// window can be dragged (a mouse) and a desk layout shows before or after: a phone or tablet being turned keeps
// its own View Transition.
(function (SEL) {
  var root = document.getElementById('app') || document.body, R = document.documentElement, last = new Map(), lastId = {}, wh = innerWidth + 'x' + innerHeight;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, D = window.Cards && Cards.DESK;
  var dq = D && window.matchMedia ? matchMedia(window.__rdeskq || [D.wide, D.strip, D.square, D.tall].join(', ')) : null, mouse = window.matchMedia && matchMedia('(pointer:fine)').matches;
  if (!dq || reduce) return;
  function note() {
    var m = new Map(), ids = {};
    root.querySelectorAll(SEL).forEach(function (n) { var r = n.getBoundingClientRect(); if (!r.width) return; m.set(n, r); if (n.dataset && n.dataset.id && !n.closest('.cdk-panel')) ids[n.dataset.id] = r; });
    last = m; lastId = ids;
  }
  (function loop() { if (!document.hidden && (mouse || dq.matches)) note(); requestAnimationFrame(loop); })();
  window.addEventListener('resize', function () {
    var now = innerWidth + 'x' + innerHeight; if (now === wh) return; wh = now;
    if (!dq.matches && !R.classList.contains('rdesk')) return;
    var before = last, beforeId = lastId;
    requestAnimationFrame(function () {   // (after the game's own resize work has redrawn whatever it redraws)
      var nodes = [].slice.call(root.querySelectorAll(SEL)), set = new Set(nodes);
      nodes.forEach(function (n) {
        for (var p = n.parentElement; p && p !== root; p = p.parentElement) if (set.has(p)) return;   // (moves with its seat or its panel)
        var a = before.get(n) || (n.dataset && n.dataset.id && beforeId[n.dataset.id]), b = n.getBoundingClientRect();
        if (!b.width || !n.animate) return;
        // (a panel that wasn't showing, or that changes shape and so lays its contents out anew, comes up in its new
        // place; stretched from the old shape its words would be pulled out of true)
        var panel = n.classList.contains('cdk-panel');
        if (panel && (!a || Math.abs((a.width / b.width) / (a.height / b.height) - 1) > .12)) {
          try { n.animate([{ opacity: 0, scale: '.97' }, { opacity: 1, scale: '1' }], { duration: 360, easing: 'cubic-bezier(.25,.8,.25,1)' }); } catch (e) {}
          return;
        }
        if (!a) return;
        var dx = a.left + a.width / 2 - b.left - b.width / 2, dy = a.top + a.height / 2 - b.top - b.height / 2, sx = a.width / b.width, sy = a.height / b.height;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < .02 && Math.abs(sy - 1) < .02) return;
        try { n.animate([{ translate: dx + 'px ' + dy + 'px', scale: sx + ' ' + sy }, { translate: '0px 0px', scale: '1 1' }], { duration: 440, easing: 'cubic-bezier(.25,.8,.25,1)' }); } catch (e) {}
      });
    });
  });
})('.pcard, .pd-place, .pd-me, .mid, .phstrip, .csort-row, .cbar, .cdk-panel');
</script>

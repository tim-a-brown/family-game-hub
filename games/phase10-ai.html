<script>
'use strict';
// 3 players: You + 2 AI. First to complete Phase 10 wins. Ties broken by lowest score.
const PNAMES=[(typeof FrequentPlayers!=='undefined'&&FrequentPlayers.myName())||'You','Kai','Zoe'];
const COLORS=['red','blue','green','yellow'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function haptic(k){try{window.GN&&GN.haptic(k);}catch(e){}}

// 10 phases: [{req:[{type,count}]}]
// types: set(n)=n of same number, run(n)=n consecutive, color(n)=n of one color
const PHASES=[
  {desc:'2 sets of 3',req:[{t:'set',n:3},{t:'set',n:3}]},
  {desc:'1 set of 3 + 1 run of 4',req:[{t:'set',n:3},{t:'run',n:4}]},
  {desc:'1 set of 4 + 1 run of 4',req:[{t:'set',n:4},{t:'run',n:4}]},
  {desc:'Run of 7',req:[{t:'run',n:7}]},
  {desc:'Run of 8',req:[{t:'run',n:8}]},
  {desc:'Run of 9',req:[{t:'run',n:9}]},
  {desc:'2 sets of 4',req:[{t:'set',n:4},{t:'set',n:4}]},
  {desc:'7 of one color',req:[{t:'color',n:7}]},
  {desc:'1 set of 5 + 1 set of 2',req:[{t:'set',n:5},{t:'set',n:2}]},
  {desc:'1 set of 5 + 1 set of 3',req:[{t:'set',n:5},{t:'set',n:3}]},
];

function makeP10Deck(){
  const d=[];
  for(let rep=0;rep<2;rep++) COLORS.forEach(c=>{for(let n=1;n<=12;n++) d.push({num:n,color:c});});
  for(let i=0;i<8;i++) d.push({num:0,color:'wild',isWild:true});
  for(let i=0;i<4;i++) d.push({num:0,color:'skip',isSkip:true});
  for(let i=d.length-1;i>0;i--){const j=0|Math.random()*(i+1);[d[i],d[j]]=[d[j],d[i]];}
  return d;
}
function cKey(c,idx){return c.num+'_'+c.color+'_'+idx;}
function cardScore(c){if(c.isWild)return 25;if(c.isSkip)return 15;return c.num<=9?5:10;}
function cardName(c){return c.isWild?'Wild':c.isSkip?'Skip':c.color[0].toUpperCase()+c.color.slice(1)+' '+c.num;}

// ── Phase checking ───────────────────────────────────────────────────────────
function findPhaseGroups(hand,phaseIdx){
  const req=PHASES[phaseIdx].req;
  const wilds=hand.filter(c=>c.isWild);
  const nonWilds=hand.filter(c=>!c.isWild&&!c.isSkip);

  function tryReq(reqs,available,wildcards,groups){
    if(!reqs.length) return groups;
    const[r,...rest]=reqs;
    if(r.t==='set'){
      const byNum={};
      available.forEach(c=>{(byNum[c.num]=byNum[c.num]||[]).push(c);});
      for(const [num,cards] of Object.entries(byNum)){
        for(let w=0;w<=Math.min(wildcards.length,r.n);w++){
          if(cards.length+w>=r.n){
            const used=[...cards.slice(0,r.n-w),...wildcards.slice(0,w)];
            const leftCards=available.filter(c=>!used.slice(0,r.n-w).includes(c));
            const leftWilds=wildcards.slice(w);
            const result=tryReq(rest,leftCards,leftWilds,[...groups,used]);
            if(result) return result;
          }
        }
      }
    } else if(r.t==='run'){
      const sorted=available.filter(c=>c.num>=1).sort((a,b)=>a.num-b.num);
      // Try all starting points
      for(let start=1;start<=12-r.n+1;start++){
        let run=[]; let w=[...wildcards];
        let ok=true;
        for(let n=start;n<start+r.n;n++){
          const card=sorted.find(c=>c.num===n&&!run.includes(c));
          if(card){run.push(card);}
          else if(w.length){run.push(w.shift());}
          else{ok=false;break;}
        }
        if(ok&&run.length===r.n){
          const leftCards=available.filter(c=>!run.filter(rc=>!rc.isWild).includes(c));
          const leftWilds=wildcards.filter(wc=>!run.filter(rc=>rc.isWild).includes(wc));
          const result=tryReq(rest,leftCards,leftWilds,[...groups,run]);
          if(result) return result;
        }
      }
    } else if(r.t==='color'){
      // for…of (a forEach callback's `return` never returned a match, so phase 8 could not be laid)
      for(const col of COLORS){
        const cards=available.filter(c=>c.color===col);
        for(let w=0;w<=Math.min(wildcards.length,r.n);w++){
          if(cards.length+w>=r.n){
            const used=[...cards.slice(0,r.n-w),...wildcards.slice(0,w)];
            const leftCards=available.filter(c=>!used.slice(0,r.n-w).includes(c));
            const leftWilds=wildcards.slice(w);
            const result=tryReq(rest,leftCards,leftWilds,[...groups,used]);
            if(result) return result;
          }
        }
      }
    }
    return null;
  }
  return tryReq(req,nonWilds,wilds,[]);
}

// Laid groups remember what they are, so lay-offs follow the group's own rule
// (previously a 4 could be laid on a set of 5s because it "extended a run").
function makeLaidGroup(player,phIdx,gi,cards){
  const t=PHASES[phIdx].req[gi].t;
  const g={player,groupIdx:laidGroups.length,cards,t};
  const nat=cards.find(c=>!c.isWild);
  if(t==='set') g.num=nat?nat.num:0;
  else if(t==='color') g.color=nat?nat.color:null;
  else { const k=cards.findIndex(c=>!c.isWild); g.lo=k>=0?cards[k].num-k:1; g.hi=g.lo+cards.length-1; }
  return g;
}
function canLayOff(card,grp){
  if(card.isSkip) return false;
  if(grp.t==='set') return card.isWild||card.num===grp.num;
  if(grp.t==='color') return card.isWild||card.color===grp.color;
  // run
  if(card.isWild) return grp.lo>1||grp.hi<12;
  return (card.num===grp.lo-1&&grp.lo>1)||(card.num===grp.hi+1&&grp.hi<12);
}
function layOff(card,grp){
  if(grp.t==='run'){
    if((!card.isWild&&card.num===grp.lo-1)||(card.isWild&&grp.hi>=12)){grp.lo--;grp.cards.unshift(card);}
    else {grp.hi++;grp.cards.push(card);}
  } else grp.cards.push(card);
}

// ── State ────────────────────────────────────────────────────────────────────
let deck,discard,hands,phases,scores,laid,laidGroups,phase,current,skipped,log,selCards;
let roundPts=[0,0,0], lastOut=-1, wasLaid=[false,false,false];
// phase: 'draw'|'play'|'choose-skip'|'round-end'|'game-over'
// laidGroups: [{player,groupIdx,cards,t,...}] — all laid groups on table

let aiTimer=null;
function later(fn,ms){clearTimeout(aiTimer);aiTimer=setTimeout(fn,ms);}

function addLog(msg,cls=''){log.push({msg,cls});if(log.length>25)log.shift();}
function newGame(){clearTimeout(aiTimer);phases=[0,0,0];scores=[0,0,0];log=[];newRound();}
function newRound(){
  deck=makeP10Deck();
  hands=Array.from({length:3},()=>deck.splice(0,10));
  discard=[deck.pop()];
  laid=[false,false,false]; // has player laid their phase this round?
  laidGroups=[];
  skipped=[false,false,false];
  roundPts=[0,0,0];
  current=0; phase='draw'; selCards=[];
  addLog('New round. Draw from stock or discard.');
  render();
  try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}
  if(current!==0) later(aiTurn,600);
}

// Refill the stock from the discard pile (keeping the top card) when it runs out.
function refillStock(){
  if(deck.length||discard.length<=1) return;
  const top=discard.pop();
  deck=[...discard];discard=[top];
  for(let i=deck.length-1;i>0;i--){const j=0|Math.random()*(i+1);[deck[i],deck[j]]=[deck[j],deck[i]];}
  addLog('Stock reshuffled from the discard pile.');
}

function drawFrom(src){
  if(phase!=='draw'||current!==0) return;
  if(src==='stock') refillStock();
  const card=src==='discard'&&discard.length?discard.pop():deck.length?deck.pop():null;
  if(!card) return;
  hands[0].push(card);
  phase='play'; selCards=[];
  haptic('light');
  addLog(`You draw ${src==='discard'?cardName(card)+' from the discard':'from the stock'}.`);
  render();
}

function toggleSel(card){
  if(phase!=='play'||current!==0) return;
  const idx=selCards.findIndex(c=>c===card);
  if(idx>=0) selCards.splice(idx,1);
  else if(laid[0]) selCards=[card]; // after laying, work with one card at a time
  else selCards.push(card);
  haptic('select');
  render();
}

function tryLayPhase(){
  if(phase!=='play'||current!==0||laid[0]) return;
  const phIdx=phases[0];
  const groups=findPhaseGroups(selCards,phIdx);
  if(groups&&groups.flat().length===selCards.length){
    laid[0]=true;
    groups.forEach((grp,gi)=>laidGroups.push(makeLaidGroup(0,phIdx,gi,grp)));
    hands[0]=hands[0].filter(c=>!selCards.includes(c));
    selCards=[];
    addLog(`You lay Phase ${phIdx+1}: ${PHASES[phIdx].desc}!`,'pts');
    haptic('success');
    if(window.GN) GN.toast(`Phase ${phIdx+1} complete! 🎉`);
    if(hands[0].length===0){endRound(0);return;}
    render();
  } else {
    addLog('That does not complete Phase '+(phIdx+1)+'.');
    haptic('error');
  }
}

function tryLayOff(card){
  if(!laid[0]) return false;
  for(let i=0;i<laidGroups.length;i++){
    const grp=laidGroups[i];
    if(canLayOff(card,grp)){
      layOff(card,grp);
      hands[0]=hands[0].filter(c=>c!==card);
      return true;
    }
  }
  return false;
}
function playerLayOff(){
  const c=selCards[0];
  if(!c||phase!=='play'||current!==0) return;
  if(tryLayOff(c)){
    selCards=[];haptic('light');
    addLog(`You lay off ${cardName(c)}.`);
    if(hands[0].length===0){endRound(0);return;}
    render();
  } else { haptic('error'); if(window.GN) GN.toast('That card doesn’t fit any group'); }
}

let pendingSkip=null;
function doDiscard(card){
  if(phase!=='play'||current!==0) return;
  if(card.isSkip){
    // Choose who to skip
    pendingSkip=card;
    phase='choose-skip'; haptic('medium'); render(); return;
  }
  hands[0]=hands[0].filter(c=>c!==card);
  discard.push(card);
  selCards=[];
  haptic('light');
  addLog(`You discard ${cardName(card)}.`);
  if(hands[0].length===0){endRound(0);}
  else{phase='draw'; advanceTurn();}
}

function chooseSkipTarget(target){
  if(phase!=='choose-skip') return;
  // The Skip card itself goes to the discard pile (it used to stay in your hand).
  if(pendingSkip){hands[0]=hands[0].filter(c=>c!==pendingSkip);discard.push(pendingSkip);pendingSkip=null;}
  selCards=[];
  skipped[target]=true;
  haptic('select');
  addLog(`You skip ${PNAMES[target]}.`);
  if(hands[0].length===0){endRound(0);return;}
  phase='draw'; advanceTurn();
}
function cancelSkip(){
  if(phase!=='choose-skip') return;
  pendingSkip=null; phase='play'; render();
}

function advanceTurn(){
  const next=(current+1)%3;
  current=next; phase='draw';
  if(current===0&&skipped[0]){
    // You were skipped — show it briefly, then move on.
    skipped[0]=false;
    addLog('You are skipped!');
    if(window.GN) GN.toast('You were skipped ⊘');
    haptic('error');
    render();
    later(()=>advanceTurn(),1100);
    return;
  }
  render();
  if(current!==0) later(aiTurn,750);
  else haptic('select');
}

function aiTurn(){
  const p=current; if(p===0||phase!=='draw') return;
  if(skipped[p]){skipped[p]=false;addLog(`${PNAMES[p]} is skipped.`);advanceTurn();return;}
  // Draw: take discard if useful for phase
  const phIdx=phases[p];
  const top=discard[discard.length-1];
  let drawSrc='stock';
  if(top&&!top.isSkip){
    const testHand=[...hands[p],top];
    const grps=findPhaseGroups(testHand,phIdx);
    if(grps) drawSrc='discard';
  }
  if(drawSrc==='stock') refillStock();
  const card=drawSrc==='discard'&&discard.length?discard.pop():deck.pop();
  if(!card){endRound(-1);return;}
  hands[p].push(card);
  addLog(`${PNAMES[p]} draws${drawSrc==='discard'?' '+cardName(card)+' from the discard':''}.`);

  // Try to lay phase
  if(!laid[p]){
    const grps=findPhaseGroups(hands[p],phIdx);
    if(grps){
      laid[p]=true;
      grps.forEach((grp,gi)=>laidGroups.push(makeLaidGroup(p,phIdx,gi,grp)));
      grps.flat().forEach(c=>{hands[p]=hands[p].filter(hc=>hc!==c);});
      addLog(`${PNAMES[p]} lays Phase ${phIdx+1}!`,'pts');
    }
  }

  // Lay off
  if(laid[p]&&laidGroups.length){
    let changed=true;
    while(changed){
      changed=false;
      for(let i=hands[p].length-1;i>=0;i--){
        const c=hands[p][i];
        for(const grp of laidGroups){
          if(canLayOff(c,grp)){layOff(c,grp);hands[p].splice(i,1);changed=true;break;}
        }
        if(changed)break;
      }
    }
  }

  // Discard: skip card if available and not yet laid, else highest value non-useful card
  let toDiscard=null;
  const skips=hands[p].filter(c=>c.isSkip);
  if(skips.length&&!laid[p]){toDiscard=skips[0];}
  if(!toDiscard){
    const deadwood=hands[p].filter(c=>!c.isWild&&!c.isSkip);
    toDiscard=deadwood.length?[...deadwood].sort((a,b)=>cardScore(b)-cardScore(a))[0]:hands[p][0];
  }
  if(toDiscard&&toDiscard.isSkip){
    const skipTarget=[0,1,2].filter(x=>x!==p).sort((a,b)=>phases[a]-phases[b])[0];
    skipped[skipTarget]=true;
    addLog(`${PNAMES[p]} skips ${PNAMES[skipTarget]}!`);
  }
  if(toDiscard){
    hands[p]=hands[p].filter(c=>c!==toDiscard);
    discard.push(toDiscard);
  }

  if(hands[p].length===0){endRound(p);}
  else{advanceTurn();}
}

function endRound(outPlayer){
  clearTimeout(aiTimer);
  let msgs=[];
  wasLaid=laid.slice(); lastOut=outPlayer;
  for(let p=0;p<3;p++){
    const pts=hands[p].reduce((s,c)=>s+cardScore(c),0);
    roundPts[p]=pts;
    scores[p]+=pts;
    // Only players who actually laid their phase move on.
    if(laid[p]) phases[p]=Math.min(10,phases[p]+1);
    msgs.push(`${PNAMES[p]}: Phase ${Math.min(phases[p]+1,10)} · +${pts}`);
  }
  msgs.forEach(m=>addLog(m,'pts'));
  phase='round-end';
  if(phases.some(p=>p>=10)){phase='game-over';endGame();}
  else{haptic(outPlayer===0?'success':'light');render();}
}

function gameWinner(){
  const finishers=phases.map((p,i)=>({p,i,s:scores[i]})).filter(x=>x.p>=10);
  finishers.sort((a,b)=>a.s-b.s);
  return finishers[0].i;
}
function endGame(){
  const winner=gameWinner();
  const won=winner===0;
  addLog(`${PNAMES[winner]} wins Phase 10! Score: ${scores[winner]}.`,'pts');
  try{
    const players=PNAMES.map((n,i)=>({name:n,score:scores[i]}));
    GameHistory.savePlayerGame('p10','Phase 10 (AI)',players,winner,0,{lowestWins:true});
  }catch(e){}
  haptic(won?'success':'heavy');
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function cardEl(c,cls='',dataKey=''){
  const col=c.isWild?'wild':c.isSkip?'skip':c.color;
  return`<div class="p10c ${col} ${cls}" ${dataKey?`data-key="${dataKey}"`:''}>
    <div class="p10c-r">${c.isWild?'W':c.isSkip?'⊘':c.num}</div>
    <div class="p10c-s">${c.isWild?'WILD':c.isSkip?'SKIP':c.color.toUpperCase()}</div>
  </div>`;
}
let logOpen=false;
function renderLog(){
  const last=log.length?log[log.length-1].msg:'';
  return `<details class="g-log" id="g-log" ${logOpen?'open':''}><summary>Game log<span class="last">${esc(last)}</span></summary>
    <div class="g-log-body">${log.slice(-14).map(({msg,cls})=>`<div class="${cls||''}">${esc(msg)}</div>`).join('')}</div></details>`;
}
function wireLog(){
  const d=document.getElementById('g-log');
  if(!d) return;
  d.addEventListener('toggle',()=>{logOpen=d.open;});
  const b=d.querySelector('.g-log-body'); if(b) b.scrollTop=b.scrollHeight;
}
function setBar(html){document.getElementById('g-bar').innerHTML=html||'';}
const phLabel=i=>phases[i]>=10?'Done':phases[i]+1;

function render(){
  const root=document.getElementById('p10-root');
  let html='';

  if(phase==='game-over'||phase==='round-end'){
    const over=phase==='game-over';
    const w=over?gameWinner():-1;
    const order=[0,1,2].sort((a,b)=>phases[b]-phases[a]||scores[a]-scores[b]);
    html+=`<div class="g-result ${over&&w===0?'':'plain'}">
      <div class="g-result-icon">${over?(w===0?'🏆':'🎴'):(lastOut===0?'🎉':'🃏')}</div>
      <div class="g-result-title">${over?(w===0?'You win!':esc(PNAMES[w])+' wins'):(lastOut===0?'You went out!':lastOut>0?esc(PNAMES[lastOut])+' went out':'Round over')}</div>
      <div class="g-result-sub">${over?`Completed all 10 phases · ${scores[w]} pts`:(wasLaid[0]?`You completed phase ${phases[0]}! On to phase ${phLabel(0)}.`:`You're still on phase ${phLabel(0)}.`)}</div>
      <div class="g-rows">${order.map(i=>`<div class="g-row ${i===0?'you':''}"><span>${esc(PNAMES[i])}${wasLaid[i]?' ✓':''}</span>
        <span class="r">Phase ${phLabel(i)} <span class="${roundPts[i]?'neg':'pos'}">+${roundPts[i]}</span><b>${scores[i]}</b></span></div>`).join('')}</div>
    </div>`;
    html+=renderLog();
    root.innerHTML=html;wireLog();
    setBar(over?`<button class="btn btn-gold" id="ng-btn">New Game</button>`:`<button class="btn btn-gold" id="nr-btn">Next Round</button>`);
    document.getElementById('ng-btn')?.addEventListener('click',()=>{haptic('light');newGame();});
    document.getElementById('nr-btn')?.addEventListener('click',()=>{haptic('light');newRound();});
    return;
  }

  // Player status grid
  html+=`<div class="g-hud p10-hud">`;
  PNAMES.forEach((n,i)=>{
    html+=`<div class="g-seat ${i===0?'you':''} ${current===i?'turn':''}">
      ${i?`<span class="cnt"><i></i>${hands[i].length}</span>`:''}
      <div class="g-seat-name">${esc(n)}</div>
      <div class="g-seat-score"><small>PH </small>${phLabel(i)}</div>
      <div class="g-seat-sub">${skipped[i]?'⊘ skipped · ':laid[i]?'✓ laid · ':''}${scores[i]} pts</div>
    </div>`;
  });
  html+=`</div>`;

  // Phase strip + goal
  html+=`<div class="p10-strip">${Array.from({length:10},(_,i)=>`<div class="p10-dot ${phases[0]>i?'done':phases[0]===i?'current':''}">${i+1}</div>`).join('')}</div>`;
  html+=`<div class="p10-goal">Phase ${phases[0]+1}: ${PHASES[phases[0]].desc}${laid[0]?' <span>· laid ✓</span>':''}</div>`;

  // Table: piles + laid groups
  const isYourDraw=phase==='draw'&&current===0;
  const isYourPlay=phase==='play'&&current===0;
  const top=discard[discard.length-1];
  const sel1=isYourPlay&&laid[0]&&selCards.length===1?selCards[0]:null;
  html+=`<div class="felt g-table"><div class="p10-piles">
    <div class="p10-pile"><div class="p10-pile-lbl">Stock · ${deck.length}</div>
      <div class="p10c back ${isYourDraw?'live':'dim'}" id="stock-card"></div></div>
    <div class="p10-pile"><div class="p10-pile-lbl">Discard</div>
      ${top?cardEl(top,isYourDraw?'live':'dim').replace('class="p10c','id="discard-card" class="p10c'):'<div class="p10-empty"></div>'}</div>
  </div>`;
  if(laidGroups.length){
    html+=`<div class="p10-laid">`;
    [0,1,2].forEach(p=>{
      const mine=laidGroups.filter(g=>g.player===p);
      if(!mine.length)return;
      html+=`<div class="p10-laid-row"><span class="p10-laid-owner">${p===0?'You':esc(PNAMES[p])}</span>
        <span class="p10-laid-grps">${mine.map(g=>`<span class="p10-grp ${sel1&&canLayOff(sel1,g)?'target':''}">${g.cards.map(c=>cardEl(c,'xs')).join('')}</span>`).join('')}</span></div>`;
    });
    html+=`</div>`;
  }
  html+=`</div>`;

  // Choose skip
  if(phase==='choose-skip'){
    html+=`<div class="g-panel accent"><div class="g-panel-title">⊘ Skip a player</div>
      <div class="g-panel-sub">They lose their next turn.</div>
      <div class="g-choices">${[1,2].map(t=>`<button class="btn btn-outline p10-skip-btn" data-target="${t}">${esc(PNAMES[t])} · Ph ${phLabel(t)}</button>`).join('')}
      <button class="btn btn-ghost" id="skip-cancel">Cancel</button></div></div>`;
  }

  // Status
  let status='',scls='';
  if(isYourDraw){status='Your turn — draw from the stock or the discard';scls='yours';}
  else if(isYourPlay){
    scls='yours';
    if(!laid[0]) status=selCards.length?`${selCards.length} selected for Phase ${phases[0]+1}`:'Select cards for your phase, or pick one to discard';
    else status=sel1?(laidGroups.some(g=>canLayOff(sel1,g))?`${cardName(sel1)} fits a group — lay it off or discard it`:`Discard ${cardName(sel1)}?`):'Phase laid! Tap a card to lay off or discard';
  } else if(phase==='choose-skip'){status='Choose who to skip';scls='yours';}
  else if(current!==0) status=`${esc(PNAMES[current])} is playing…`;
  if(status) html+=`<div class="g-status ${scls}">${status}</div>`;

  // Selected-cards tray (building the phase)
  let groupsOk=false;
  if(isYourPlay&&!laid[0]&&selCards.length){
    const groups=findPhaseGroups(selCards,phases[0]);
    groupsOk=!!(groups&&groups.flat().length===selCards.length);
    html+=`<div class="g-panel ${groupsOk?'accent':''}" style="padding:12px;"><div class="p10-sel">${selCards.map(c=>cardEl(c,'')).join('')}</div>
      <div class="g-panel-sub" style="margin:0;">${groupsOk?'✓ That completes your phase!':`Need: ${PHASES[phases[0]].desc}`}</div></div>`;
  }

  // Player hand
  html+=`<div class="g-label"><span>Your hand · ${hands[0].length}</span><span>${isYourPlay?(laid[0]?'tap one card':'tap to select'):''}</span></div>
  <div class="p10-hand" id="player-hand">
    ${hands[0].map((c,i)=>cardEl(c,`${isYourPlay?'playable':''}${selCards.includes(c)?' selected':''}`,cKey(c,i))).join('')}
  </div>`;

  html+=renderLog();
  root.innerHTML=html;wireLog();

  // Action bar
  let bar='';
  if(isYourDraw){
    bar=`<button class="btn btn-outline" id="bar-stock">Draw stock</button>`+(top?`<button class="btn btn-gold" id="bar-disc">Take ${cardName(top)}</button>`:'');
  } else if(isYourPlay&&!laid[0]){
    if(groupsOk) bar=`<button class="btn btn-gold" id="lay-phase-btn">Lay Phase ${phases[0]+1}</button>`;
    else if(selCards.length===1) bar=`<button class="btn btn-gold" id="discard-sel-btn">Discard ${cardName(selCards[0])}</button>`;
    if(selCards.length) bar+=`<button class="btn btn-outline" id="clear-sel-btn">Clear</button>`;
  } else if(sel1){
    const fits=laidGroups.some(g=>canLayOff(sel1,g));
    bar=(fits?`<button class="btn btn-gold" id="layoff-btn">Lay off</button>`:'')+`<button class="btn ${fits?'btn-outline':'btn-gold'}" id="discard-sel-btn">Discard</button>`;
  }
  setBar(bar);

  // Wire events
  if(isYourDraw){
    document.getElementById('stock-card')?.addEventListener('click',()=>drawFrom('stock'));
    document.getElementById('discard-card')?.addEventListener('click',()=>drawFrom('discard'));
    document.getElementById('bar-stock')?.addEventListener('click',()=>drawFrom('stock'));
    document.getElementById('bar-disc')?.addEventListener('click',()=>drawFrom('discard'));
  }
  document.getElementById('lay-phase-btn')?.addEventListener('click',tryLayPhase);
  document.getElementById('clear-sel-btn')?.addEventListener('click',()=>{selCards=[];render();});
  document.getElementById('discard-sel-btn')?.addEventListener('click',()=>{if(selCards[0])doDiscard(selCards[0]);});
  document.getElementById('layoff-btn')?.addEventListener('click',playerLayOff);
  document.getElementById('skip-cancel')?.addEventListener('click',cancelSkip);
  document.querySelectorAll('.p10-skip-btn').forEach(b=>b.addEventListener('click',()=>chooseSkipTarget(+b.dataset.target)));
  if(isYourPlay){
    document.getElementById('player-hand')?.querySelectorAll('.p10c.playable').forEach((el,idx)=>{
      el.addEventListener('click',()=>{const c=hands[0][idx];if(c)toggleSel(c);});
    });
  }
}

newGame();
</script>
<script>if(typeof FrequentPlayers!=="undefined") FrequentPlayers.installNameChip();</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d12">
<title>Yahtzee</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
.site-nav button.icon-btn{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;display:inline-grid;place-items:center;}
.icon-btn svg{width:18px;height:18px;}
.yz{max-width:560px;margin:0 auto;}

/* Setup */
.setup-card .card-title{margin-bottom:12px;}
.field-lbl{font-size:.78rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 8px;}
.cnt-row{margin-bottom:16px;}
.cnt-row .tab{padding:0;min-width:0;flex:1 1 0;}
.name-row{display:flex;align-items:center;gap:10px;}
.name-row .dot{width:12px;height:12px;border-radius:50%;flex:none;}
.name-row > div{flex:1;min-width:0;}
#name-inputs{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.switch-row{display:flex;align-items:center;gap:12px;color:var(--text);font-size:1rem;letter-spacing:0;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:16px;cursor:pointer;}
.switch-row .t{font-size:.95rem;font-weight:700;color:var(--text);}
.switch-row .d{font-size:.8rem;font-weight:500;color:var(--text-2);margin-top:1px;line-height:1.35;}
.switch{position:relative;flex:none;width:51px;height:31px;margin:0;}
.switch input{position:absolute;opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;border-radius:999px;background:var(--surface-3);transition:background .2s;}
.switch .knob{position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s var(--spring);}
.switch input:checked ~ .track{background:var(--green);}
.switch input:checked ~ .knob{transform:translateX(20px);}

/* Player chips */
.player-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px;}
.player-tabs::-webkit-scrollbar{display:none;}
.ptab{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;}
.ptab .pd{width:9px;height:9px;border-radius:50%;}
.ptab .ps{font-family:var(--display);font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
.ptab.active{background:var(--surface-3);color:var(--text);border-color:rgba(255,255,255,.22);}
.ptab.turn{box-shadow:0 0 0 2px rgba(245,200,66,.45);}
.ptab.done-player .ps{color:var(--green);}

.turn-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.turn-banner .who{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.turn-banner .meta{font-size:.82rem;font-weight:600;color:var(--text-3);white-space:nowrap;}
.turn-banner.viewing .who{font-size:1rem;color:var(--text-2);}

/* Dice */
#dice-area{margin-bottom:12px;}
.dice-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px;}
.die{position:relative;aspect-ratio:1;max-width:72px;justify-self:center;width:100%;border-radius:16px;background:linear-gradient(160deg,#ffffff,#e9e5dc);box-shadow:0 5px 0 #b9b2a3,0 8px 16px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16%;cursor:pointer;transition:transform .18s var(--spring),box-shadow .18s;touch-action:manipulation;}
.die span{display:grid;place-items:center;}
.die i{width:72%;aspect-ratio:1;border-radius:50%;background:#1d1a15;box-shadow:inset 0 1px 1px rgba(0,0,0,.4);}
.die.blank{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line-2);cursor:default;}
.die.blank::after{content:'?';position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--text-3);}
.die.kept{transform:translateY(-4px);box-shadow:0 0 0 3px var(--gold),0 9px 18px rgba(0,0,0,.4);}
.die.kept::after{content:'HELD';position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--gold);}
@keyframes shake{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-14deg) scale(1.08)}60%{transform:rotate(10deg) scale(1.05)}100%{transform:none}}
.die.rolling{animation:shake .32s var(--ease);}
.roll-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
#roll-btn{flex:1;}
.rolls-dots{display:flex;gap:5px;}
.rolls-dots b{width:9px;height:9px;border-radius:50%;background:var(--gold);transition:background .2s;}
.rolls-dots b.off{background:var(--surface-3);}
#rolls-left{font-size:.8rem;font-weight:600;color:var(--text-3);text-align:center;margin-top:8px;min-height:18px;}

/* Scorecard (two columns) */
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;}
.sc-col{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;}
.sc-section-lbl{font-size:.68rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;padding:8px 10px 4px;}
.sc-row{display:flex;align-items:center;gap:6px;min-height:42px;padding:4px 10px;border-radius:11px;cursor:pointer;transition:background .15s,transform .1s;touch-action:manipulation;}
.sc-row + .sc-row{margin-top:2px;}
.sc-row:active:not(.used):not(.locked){transform:scale(.97);}
.sc-row.possible{background:rgba(245,200,66,.09);}
.sc-row.possible.zero{background:var(--surface-2);}
.sc-row.used{cursor:default;}
.sc-row.locked{cursor:default;}
.sc-name{flex:1;min-width:0;font-size:.86rem;font-weight:600;line-height:1.2;}
.sc-row.used .sc-name{color:var(--text-2);}
.sc-desc{font-size:.7rem;color:var(--text-3);font-weight:500;}
.sc-val{font-family:var(--display);font-size:1.12rem;font-weight:800;min-width:28px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-3);}
.sc-row.used .sc-val{color:var(--text);}
.sc-val.possible{color:var(--gold);}
.sc-row.zero .sc-val{color:var(--text-3);}
.sc-bonus{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:42px;padding:4px 10px;margin-top:2px;border-top:1px dashed var(--line-2);font-size:.8rem;color:var(--text-2);font-weight:600;}
.sc-bonus .bar{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:0 2px;}
.sc-bonus .bar i{display:block;height:100%;background:var(--gold);border-radius:3px;}
.sc-total{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(135deg,rgba(245,200,66,.14),rgba(245,200,66,.04));border:1px solid rgba(245,200,66,.3);border-radius:16px;font-weight:700;margin-top:8px;}
.sc-total .v{color:var(--gold);font-family:var(--display);font-size:1.4rem;font-weight:800;}
@media (max-width:370px){.sc-desc{display:none;}.sc-row{padding:4px 8px;}}

/* Summary table */
.summary-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;}
.summary-table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;}
.summary-table th{color:var(--text-3);font-size:.72rem;font-weight:700;padding:10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;}
.summary-table td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.summary-table tr.total-row td{font-weight:800;color:var(--gold);border-top:1px solid var(--line-2);border-bottom:none;font-family:var(--display);font-size:1rem;}
/* End */
.winner-banner .big{font-size:2.2rem;line-height:1;margin-bottom:6px;}
.end-actions{display:flex;gap:8px;}
.end-actions .btn{flex:1;}
.score-entry{display:flex;flex-direction:column;gap:12px;}
.score-entry .input{text-align:center;font-family:var(--display);font-size:1.6rem!important;font-weight:800;}
</style>
<script src="../players.js"></script>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Yahtzee</span>
  <button class="icon-btn hidden" id="quit-btn" aria-label="New game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</nav>
<div class="page">
<div class="yz">

<!-- SETUP -->
<div id="setup">
  <div class="card setup-card">
    <div class="card-title">New game</div>
    <div class="field-lbl">Players</div>
    <div class="tabs cnt-row" id="cnt-row">
      <button class="tab cnt-btn active" data-n="1">1</button>
      <button class="tab cnt-btn" data-n="2">2</button>
      <button class="tab cnt-btn" data-n="3">3</button>
      <button class="tab cnt-btn" data-n="4">4</button>
      <button class="tab cnt-btn" data-n="5">5</button>
      <button class="tab cnt-btn" data-n="6">6</button>
      <button class="tab cnt-btn" data-n="7">7</button>
      <button class="tab cnt-btn" data-n="8">8</button>
    </div>
    <div id="name-inputs"></div>
    <label class="switch-row" for="scorecard-mode-toggle">
      <span class="switch"><input type="checkbox" id="scorecard-mode-toggle"><span class="track"></span><span class="knob" id="toggle-knob"></span></span>
      <span><span class="t" style="display:block">Scorecard only</span><span class="d" style="display:block">Roll real dice at the table and just keep score here</span></span>
    </label>
    <button class="btn btn-gold btn-block" id="start-btn">Start game</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="hidden">
  <div id="player-tabs" class="player-tabs"></div>
  <div id="turn-banner" class="turn-banner"></div>

  <!-- Dice area (hidden when viewing other players' cards) -->
  <div id="dice-area">
    <div class="dice-row" id="dice-row"></div>
    <div class="roll-row">
      <button class="btn btn-gold" id="roll-btn">Roll dice</button>
    </div>
    <div id="rolls-left">Tap dice to hold them between rolls</div>
  </div>

  <!-- Scorecard for viewed player -->
  <div id="scorecard"></div>
</div>

<!-- END -->
<div id="endscreen" class="hidden">
  <div id="winner-area"></div>
  <div class="card">
    <div class="card-title">Final scores</div>
    <div id="final-table"></div>
  </div>
  <div class="end-actions">
    <button class="btn btn-gold" id="play-again-btn">Play again</button>
    <button class="btn btn-outline" id="new-setup-btn">Change players</button>
  </div>
</div>

</div>
</div>
<script>
'use strict';
window.GN=window.GN||{haptic(){},toast(){},sheet(){return{close(){},el:document.createElement('div')};},confirm:()=>Promise.resolve(true)};
const FACES=['','⚀','⚁','⚂','⚃','⚄','⚅'];
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const COLORS=['#f5c842','#ff7a5a','#5ac8fa','#7ed47e','#c084fc','#fb923c','#f472b6','#34d399'];
const P_NAMES_DEF=['Player 1','Player 2','Player 3','Player 4','Player 5','Player 6','Player 7','Player 8'];

const CATS=[
  {id:'ones',  name:'Ones',  desc:'Sum of 1s', upper:true, calc:d=>d.filter(v=>v===1).reduce((a,b)=>a+b,0)},
  {id:'twos',  name:'Twos',  desc:'Sum of 2s', upper:true, calc:d=>d.filter(v=>v===2).reduce((a,b)=>a+b,0)},
  {id:'threes',name:'Threes',desc:'Sum of 3s', upper:true, calc:d=>d.filter(v=>v===3).reduce((a,b)=>a+b,0)},
  {id:'fours', name:'Fours', desc:'Sum of 4s', upper:true, calc:d=>d.filter(v=>v===4).reduce((a,b)=>a+b,0)},
  {id:'fives', name:'Fives', desc:'Sum of 5s', upper:true, calc:d=>d.filter(v=>v===5).reduce((a,b)=>a+b,0)},
  {id:'sixes', name:'Sixes', desc:'Sum of 6s', upper:true, calc:d=>d.filter(v=>v===6).reduce((a,b)=>a+b,0)},
  {id:'3kind', name:'3 of a Kind', desc:'Sum of all dice', calc:d=>{const c=cnt(d);return Object.values(c).some(v=>v>=3)?d.reduce((a,b)=>a+b,0):0;}},
  {id:'4kind', name:'4 of a Kind',  desc:'Sum of all dice', calc:d=>{const c=cnt(d);return Object.values(c).some(v=>v>=4)?d.reduce((a,b)=>a+b,0):0;}},
  {id:'fh',    name:'Full House',      desc:'3 + 2 · 25',          calc:d=>{const c=Object.values(cnt(d)).sort();return JSON.stringify(c)==='[2,3]'?25:0;}},
  {id:'sm',    name:'Sm. Straight',  desc:'4 in a row · 30',   calc:d=>{const u=[...new Set(d)].sort((a,b)=>a-b);for(let s=1;s<=3;s++)if(u.includes(s)&&u.includes(s+1)&&u.includes(s+2)&&u.includes(s+3))return 30;return 0;}},
  {id:'lg',    name:'Lg. Straight',  desc:'5 in a row · 40',   calc:d=>{const u=[...new Set(d)].sort((a,b)=>a-b);return(JSON.stringify(u)==='[1,2,3,4,5]'||JSON.stringify(u)==='[2,3,4,5,6]')?40:0;}},
  {id:'yahtzee',name:'Yahtzee!',       desc:'5 alike · 50',  calc:d=>Object.values(cnt(d)).some(v=>v===5)?50:0},
  {id:'chance',name:'Chance',          desc:'Sum of all dice',    calc:d=>d.reduce((a,b)=>a+b,0)},
];
function cnt(d){const c={};d.forEach(v=>{c[v]=(c[v]||0)+1;});return c;}

// ── State ──────────────────────────────────────────────────────────────────
let numP, pNames, pStates; // [{dice,kept,rolls,scored}]
let curP;          // index of whose turn it is
let viewP;         // index of whose scorecard we're viewing
let gameComplete;
let scorecardMode=false; // no dice, just score entry
let rolling=false;

function mkPlayerState(){return{dice:[0,0,0,0,0],kept:[false,false,false,false,false],rolls:0,scored:{}};}

// ── Setup ──────────────────────────────────────────────────────────────────
let setupN=1;
document.querySelectorAll('.cnt-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    setupN=+b.dataset.n;
    document.querySelectorAll('.cnt-btn').forEach(x=>x.classList.toggle('active',x===b));
    GN.haptic('select');
    buildNameInputs();
  });
});

function buildNameInputs(){
  const c=document.getElementById('name-inputs');
  // Keep names already typed when changing the player count
  const prev=[...c.querySelectorAll('input')].map(i=>i.value);
  c.innerHTML='';
  for(let i=0;i<setupN;i++){
    const row=document.createElement('div');
    row.className='name-row';
    row.innerHTML=`<span class="dot" style="background:${COLORS[i]}"></span><div><input class="input" placeholder="${P_NAMES_DEF[i]}" id="pname${i}" maxlength="16"></div>`;
    row.querySelector('input').value=prev[i]!=null?prev[i]:P_NAMES_DEF[i];
    c.appendChild(row);
  }
  if(typeof FrequentPlayers!=='undefined') FrequentPlayers.attachPickersByPrefix('pname');
}
buildNameInputs();

const togEl=document.getElementById('scorecard-mode-toggle');
togEl.addEventListener('change',()=>{scorecardMode=togEl.checked;GN.haptic('select');});

document.getElementById('start-btn').addEventListener('click',()=>{
  scorecardMode=togEl.checked;
  numP=setupN;
  pNames=Array.from({length:numP},(_,i)=>document.getElementById('pname'+i).value.trim()||P_NAMES_DEF[i]);
  pStates=Array.from({length:numP},mkPlayerState);
  curP=0;viewP=0;gameComplete=false;
  show('game');hide('setup');hide('endscreen');show('quit-btn');
  startTurn();
});

// ── Turn management ────────────────────────────────────────────────────────
function startTurn(){
  const ps=pStates[curP];
  ps.dice=[0,0,0,0,0];ps.kept=[false,false,false,false,false];ps.rolls=0;
  viewP=curP;
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderAll(){renderTabs();renderDiceArea();renderScorecard();renderTurnBanner();updateRollUI();}

function updateRollUI(){
  if(!pStates||curP==null)return;
  const ps=pStates[curP];
  const rb=document.getElementById('roll-btn');
  const left=3-ps.rolls;
  rb.disabled=left<=0||rolling;
  rb.innerHTML=left<=0?'No rolls left':`${ps.rolls===0?'Roll dice':'Roll again'} <span class="rolls-dots">${[0,1,2].map(k=>`<b class="${k<left?'':'off'}"></b>`).join('')}</span>`;
  document.getElementById('rolls-left').textContent=ps.rolls===0?'Roll to start your turn':left<=0?'Pick a category to score':'Tap dice to hold them · or score now';
}

function renderTurnBanner(){
  const el=document.getElementById('turn-banner');
  if(gameComplete){el.style.display='none';return;}
  el.style.display='';
  const filled=Object.keys(pStates[curP].scored).length;
  const round=Math.min(13,filled+1);
  if(viewP===curP){
    el.className='turn-banner';
    el.innerHTML=`<span class="who" style="color:${COLORS[curP]}">${numP>1?pNames[curP]+"'s turn":'Your turn'}</span><span class="meta">Round ${round} of 13</span>`;
  } else if(viewP===-1){
    el.className='turn-banner viewing';
    el.innerHTML=`<span class="who">Scoreboard</span><span class="meta">${pNames[curP]} to play</span>`;
  } else {
    el.className='turn-banner viewing';
    el.innerHTML=`<span class="who">${pNames[viewP]}'s card</span><button class="btn btn-sm btn-outline" id="back-to-turn">Back to ${pNames[curP]}</button>`;
    el.querySelector('#back-to-turn').addEventListener('click',()=>{viewP=curP;renderAll();});
  }
}

function renderTabs(){
  const el=document.getElementById('player-tabs');el.innerHTML='';
  el.style.display=numP>1?'':'none';
  pNames.forEach((nm,i)=>{
    const t=document.createElement('button');
    const isDone=Object.keys(pStates[i].scored).length===13;
    t.className='ptab'+(i===viewP?' active':'')+(isDone?' done-player':'')+(i===curP&&!gameComplete?' turn':'');
    t.innerHTML=`<span class="pd" style="background:${COLORS[i]}"></span>${nm}<span class="ps">${calcTotal(i)}</span>`;
    t.addEventListener('click',()=>{viewP=i;GN.haptic('select');renderAll();});
    el.appendChild(t);
  });
  if(numP>1){
    const scores=document.createElement('button');
    scores.className='ptab'+(viewP===-1?' active':'');
    scores.textContent='Scoreboard';
    scores.addEventListener('click',()=>{viewP=-1;GN.haptic('select');renderAll();});
    el.appendChild(scores);
  }
}

function renderDiceArea(){
  const area=document.getElementById('dice-area');
  area.style.display=(viewP===curP&&!gameComplete&&!scorecardMode)?'block':'none';
}

// ── Scorecard-only direct score entry ──────────────────────────────────────
function promptScoreEntry(cat){
  if(!scorecardMode)return false; // not in scorecard mode
  const ps=pStates[curP];
  if(ps.scored[cat.id]!==undefined)return true; // already scored
  const wrap=document.createElement('div');wrap.className='score-entry';
  wrap.innerHTML=`<div>${cat.desc}</div><input class="input" type="number" inputmode="numeric" min="0" placeholder="0">`;
  const inp=wrap.querySelector('input');
  const save=()=>{
    const val=parseInt(inp.value);
    if(isNaN(val)||val<0){GN.toast('Enter a score of 0 or more');return;}
    ps.scored[cat.id]=val;
    GN.haptic('success');
    advanceTurnIfDone();
  };
  GN.sheet({title:`${pNames[curP]} · ${cat.name}`,body:wrap,actions:[{label:'Save score',primary:true,onClick:save},{label:'Cancel'}]});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();wrap.closest('.gn-sheet')?.querySelector('.btn-gold')?.click();}});
  setTimeout(()=>inp.focus(),250);
  return true;
}

// ── Dice ───────────────────────────────────────────────────────────────────
function renderDiceRow(){
  const ps=pStates[curP];
  const row=document.getElementById('dice-row');row.innerHTML='';
  ps.dice.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className='die'+(ps.kept[i]?' kept':'')+(v?'':' blank');
    d.setAttribute('aria-label',v?`Die ${FACES[v]} ${v}${ps.kept[i]?' (held)':''}`:'Not rolled');
    if(v){for(let k=0;k<9;k++){const s=document.createElement('span');if(PIPS[v].includes(k))s.innerHTML='<i></i>';d.appendChild(s);}}
    if(ps.rolls>0&&v){d.addEventListener('click',()=>{if(ps.rolls>=3)return;sKeep();GN.haptic('select');ps.kept[i]=!ps.kept[i];renderDiceRow();});}
    row.appendChild(d);
  });
}

document.getElementById('roll-btn').addEventListener('click',()=>{
  const ps=pStates[curP];
  if(ps.rolls>=3||rolling)return;
  sRoll();GN.haptic('medium');
  rolling=true;
  ps.dice=ps.dice.map((v,i)=>ps.kept[i]?v:Math.ceil(Math.random()*6));
  ps.rolls++;
  if(ps.rolls>=3)ps.kept=[false,false,false,false,false];
  // Animate rolling dice
  renderDiceRow();
  document.querySelectorAll('#dice-row .die').forEach((el,i)=>{
    if(!ps.kept[i]){el.classList.add('rolling');}
  });
  setTimeout(()=>{
    rolling=false;
    renderDiceRow();renderScorecard();updateRollUI();
    if(CATS.find(c=>c.id==='yahtzee').calc(ps.dice)===50){GN.haptic('success');GN.toast('🎉 Yahtzee!');}
  },330);
  updateRollUI();
});

// ── Scorecard ──────────────────────────────────────────────────────────────
function calcTotal(pi){
  const sc=pStates[pi].scored;
  const upper=CATS.filter(c=>c.upper).reduce((s,c)=>s+(sc[c.id]||0),0);
  const bonus=upper>=63?35:0;
  const lower=CATS.filter(c=>!c.upper).reduce((s,c)=>s+(sc[c.id]||0),0);
  return upper+bonus+lower;
}

function renderScorecard(){
  const sc_el=document.getElementById('scorecard');

  if(viewP===-1){
    // Summary view
    renderSummary(sc_el);return;
  }

  const pi=viewP;
  const ps=pStates[pi];
  const isActive=pi===curP&&!gameComplete;
  const dice=isActive&&ps.rolls>0?ps.dice:null;
  const sc=ps.scored;
  sc_el.innerHTML='';

  const grid=document.createElement('div');grid.className='sc-grid';
  // Upper section
  const up=document.createElement('div');up.className='sc-col';
  up.innerHTML='<div class="sc-section-lbl">Upper</div>';
  let upperSum=0;
  CATS.filter(c=>c.upper).forEach(cat=>{
    if(sc[cat.id]!==undefined)upperSum+=sc[cat.id];
    up.appendChild(makeScRow(cat,pi,dice,isActive));
  });
  const bonus=upperSum>=63?35:0;
  const bonusDiv=document.createElement('div');bonusDiv.className='sc-bonus';
  bonusDiv.innerHTML=`<span>Bonus</span><span class="bar"><i style="width:${Math.min(100,upperSum/63*100)}%"></i></span><span style="color:${bonus?'var(--gold)':'var(--text-3)'};font-weight:700">${bonus?'+35':`${upperSum}/63`}</span>`;
  up.appendChild(bonusDiv);

  // Lower section
  const lo=document.createElement('div');lo.className='sc-col';
  lo.innerHTML='<div class="sc-section-lbl">Lower</div>';
  CATS.filter(c=>!c.upper).forEach(cat=>{
    lo.appendChild(makeScRow(cat,pi,dice,isActive));
  });
  grid.appendChild(up);grid.appendChild(lo);
  sc_el.appendChild(grid);

  const total=calcTotal(pi);
  const tot=document.createElement('div');tot.className='sc-total';
  tot.innerHTML=`<span>Total${numP>1?` · ${pNames[pi]}`:''}</span><span class="v">${total}</span>`;
  sc_el.appendChild(tot);

  if(isActive)renderDiceRow();
}

function makeScRow(cat,pi,dice,isActive){
  const ps=pStates[pi];
  const sc=ps.scored;
  const row=document.createElement('div');
  if(sc[cat.id]!==undefined){
    row.className='sc-row used';
    row.innerHTML=`<div class="sc-name">${cat.name}</div><div class="sc-val">${sc[cat.id]}</div>`;
  } else {
    const poss=dice?cat.calc(dice):null;
    row.className='sc-row'+(poss!==null?' possible':'')+(poss===0?' zero':'')+(isActive?'':' locked');
    row.innerHTML=`<div class="sc-name">${cat.name}<div class="sc-desc">${cat.desc}</div></div><div class="sc-val ${poss?'possible':''}">${poss!==null?poss:'—'}</div>`;
    if(isActive){
      if(poss!==null){
        row.addEventListener('click',()=>{
          if(rolling)return;
          if(poss===0){
            GN.confirm(`Score 0 in ${cat.name}?`,{title:'Scratch this box?',ok:'Score 0',danger:true}).then(ok=>{if(ok)scoreCategory(pi,cat.id,poss);});
          } else scoreCategory(pi,cat.id,poss);
        });
      } else if(scorecardMode&&pi===curP){
        // In scorecard-only mode: clicking unscored row prompts for value
        row.className='sc-row possible zero';
        row.querySelector('.sc-val').textContent='+';
        row.addEventListener('click',()=>promptScoreEntry(cat));
      } else {
        row.addEventListener('click',()=>{GN.haptic('error');GN.toast('Roll the dice first');});
      }
    }
  }
  return row;
}

// Move to the next player who still has open boxes (or end the game)
function nextPlayer(){
  for(let i=1;i<=numP;i++){
    const ni=(curP+i)%numP;
    if(Object.keys(pStates[ni].scored).length<13){curP=ni;return true;}
  }
  return false;
}
function advanceTurnIfDone(){
  if(!nextPlayer()){endGame();}else{startTurn();}
}

function scoreCategory(pi,id,val){
  if(pi!==curP)return;
  if(val===50&&id==='yahtzee')sYahtzee();else sScore();
  GN.haptic(val>0?'success':'light');
  pStates[pi].scored[id]=val;
  pStates[pi].dice=[0,0,0,0,0];
  pStates[pi].kept=[false,false,false,false,false];
  pStates[pi].rolls=0;
  if(!nextPlayer()){endGame();return;}
  if(numP>1&&curP!==pi)GN.toast(`${pNames[pi]} scored ${val} · ${pNames[curP]}'s turn`);
  startTurn();
}

// ── Summary ────────────────────────────────────────────────────────────────
function renderSummary(el){
  el.innerHTML='';
  const wrap=document.createElement('div');wrap.className='summary-wrap';
  const tbl=document.createElement('table');tbl.className='summary-table';
  const hdr=document.createElement('tr');
  hdr.innerHTML='<th>Category</th>'+pNames.map((n,i)=>`<th style="color:${COLORS[i]};text-align:right">${n}</th>`).join('');
  tbl.appendChild(hdr);
  CATS.forEach(cat=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${cat.name}</td>`+pNames.map((_,i)=>{
      const v=pStates[i].scored[cat.id];
      return`<td style="text-align:right">${v!==undefined?v:'—'}</td>`;
    }).join('');
    tbl.appendChild(tr);
  });
  // Totals
  const tr=document.createElement('tr');tr.className='total-row';
  tr.innerHTML=`<td>Total</td>`+pNames.map((_,i)=>`<td style="text-align:right">${calcTotal(i)}</td>`).join('');
  tbl.appendChild(tr);
  wrap.appendChild(tbl);
  el.appendChild(wrap);
}

// ── End game ───────────────────────────────────────────────────────────────
function endGame(){
  sWin();GN.haptic('success');
  gameComplete=true;
  const totals=pNames.map((_,i)=>calcTotal(i));
  const maxScore=Math.max(...totals);
  const winners=totals.map((t,i)=>t===maxScore?i:-1).filter(i=>i>=0);
  hide('game');show('endscreen');hide('quit-btn');
  window.scrollTo({top:0});

  const wa=document.getElementById('winner-area');
  if(numP===1){
    wa.innerHTML=`<div class="winner-banner"><div class="big">🎲</div><div class="winner-name">${totals[0]} points</div><div class="winner-pts">${totals[0]>=300?'Excellent!':totals[0]>=200?'Great game!':'Keep practicing!'}</div></div>`;
  } else if(winners.length===1){
    wa.innerHTML=`<div class="winner-banner"><div class="big">🏆</div><div class="winner-name">${pNames[winners[0]]} wins!</div><div class="winner-pts">${maxScore} points</div></div>`;
  } else {
    wa.innerHTML=`<div class="winner-banner"><div class="big">🤝</div><div class="winner-name">It's a tie!</div><div class="winner-pts">${winners.map(i=>pNames[i]).join(' & ')} — ${maxScore} pts each</div></div>`;
  }

  // Final table (ranked)
  const ft=document.getElementById('final-table');
  const order=pNames.map((_,i)=>i).sort((a,b)=>totals[b]-totals[a]);
  const rows=order.map((i,rank)=>`<tr><td style="color:var(--text-3);width:28px">${rank+1}</td><td><span style="color:${COLORS[i]};font-weight:700">${pNames[i]}</span></td><td style="text-align:right;font-family:var(--display);font-size:1.15rem;font-weight:800;color:${COLORS[i]}">${totals[i]}</td><td style="text-align:right;width:28px">${winners.includes(i)?'🏆':''}</td></tr>`).join('');
  ft.innerHTML=`<table class="summary-table">${rows}</table>`;
}

document.getElementById('play-again-btn').addEventListener('click',()=>{
  pStates=Array.from({length:numP},mkPlayerState);
  curP=0;viewP=0;gameComplete=false;
  hide('endscreen');show('game');show('quit-btn');startTurn();
});
document.getElementById('new-setup-btn').addEventListener('click',()=>{
  hide('endscreen');show('setup');hide('quit-btn');
});
document.getElementById('quit-btn').addEventListener('click',async()=>{
  if(!(await GN.confirm('Scores for this game will be lost.',{title:'End this game?',ok:'End game',danger:true})))return;
  try{sessionStorage.removeItem('yahtzee');}catch(e){}
  gameComplete=true;
  hide('game');hide('endscreen');show('setup');hide('quit-btn');
});

function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}

// ── Sound ────────────────────────────────────────────────────────────────────
let _ac=null,_muted=false;
function sac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function sTone(freq,start,dur,vol,type,ramp){
  try{
  const ctx=sac(),t=ctx.currentTime+start,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(ramp)o.frequency.exponentialRampToValueAtTime(ramp,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.18,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function sNoise(start,dur,fc,q,vol,decay){
  try{
  const ctx=sac(),t=ctx.currentTime+start;
  const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*(decay||0.5)));
  const src=ctx.createBufferSource();src.buffer=buf;
  const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=fc||1000;filt.Q.value=q||2;
  const g=ctx.createGain();g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(filt);filt.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+dur+0.05);
  }catch(e){}
}
function sWin(){if(_muted)return;[523,659,784,1047].forEach((f,i)=>sTone(f,i*.08,.5,.2));}
function sLose(){if(_muted)return;[400,320,240].forEach((f,i)=>sTone(f,i*.1,.35,.18,'triangle'));}
function sClick(pitch){if(_muted)return;sNoise(0,.035,pitch||900,5,.15,.15);}
function sDing(freq,vol){if(_muted)return;sTone(freq||660,0,.35,vol||.18);}

function sRoll(){if(_muted)return;sNoise(0,.18,300,1,.25,.3);sNoise(.04,.15,800,3,.15,.2);}
function sKeep(){if(_muted)return;sClick(1200);}
function sScore(){if(_muted)return;sDing(880,.16);sDing(1108,.12,.08);}
function sYahtzee(){if(_muted)return;[523,659,784,1047,1319].forEach((f,i)=>{sTone(f,i*.07,.5,.22);sTone(f*2,i*.07,.5,.08);});}

// ── Session persistence ────────────────────────────────────────────────────
function _save_yahtzee(){if(gameComplete)return;
  try{sessionStorage.setItem('yahtzee',JSON.stringify({numP,pNames,pStates,curP,gameComplete,scorecardMode,_ts:Date.now()}));}catch(e){}
}
function _load_yahtzee(){
  try{
    const raw=sessionStorage.getItem('yahtzee');if(!raw)return false;
    const s=JSON.parse(raw);if(!s||!Array.isArray(s.pStates))return false;
    numP=s.numP;pNames=s.pNames;pStates=s.pStates;curP=s.curP;gameComplete=s.gameComplete||false;scorecardMode=s.scorecardMode||false;viewP=curP;
    togEl.checked=scorecardMode;
    show('game');hide('setup');hide('endscreen');show('quit-btn');renderAll();
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_yahtzee);
window.addEventListener('pagehide',_save_yahtzee);
document.getElementById('new-setup-btn')?.addEventListener('click',()=>{try{sessionStorage.removeItem('yahtzee');}catch(e){}},true);
document.getElementById('play-again-btn')?.addEventListener('click',()=>{try{sessionStorage.removeItem('yahtzee');}catch(e){}},true);
_load_yahtzee();
</script>

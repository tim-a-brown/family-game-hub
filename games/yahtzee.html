<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yahtzee</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
.turnline{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 10px;font-family:var(--display);font-size:1.35rem;color:var(--c,var(--yellow));}
.turnline.nudge{animation:ynudge .4s;}
@keyframes ynudge{20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
.turnline .dot{width:12px;height:12px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 25%,transparent);}

/* Dice tray: felt inside a wooden box */
.tray{position:sticky;top:calc(var(--safe-t) + 56px);z-index:10;border-radius:24px;padding:8px;margin-bottom:16px;}
.tray .felt-in{position:relative;border-radius:18px;padding:20px 8px 22px;min-height:112px;}
.dice{display:flex;justify-content:center;gap:clamp(6px,2.4vw,14px);}
.dice .die{--ds:min(14.5vw,58px);}
.dice .die.blank{opacity:0;}
.dice .tag{position:absolute;}
.held-lbl{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:.78rem;font-weight:650;color:rgba(255,255,255,.6);}
.empty-msg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;color:rgba(255,255,255,.45);}
.rolls{position:absolute;top:8px;right:12px;display:flex;gap:5px;}
.rolls i{width:9px;height:9px;border-radius:50%;background:var(--lit);box-shadow:0 0 6px var(--litg);}
.rolls i.used{background:rgba(255,255,255,.18);box-shadow:none;}
.tray .rollbtn{margin-top:8px;min-height:52px;}
.tray .rollbtn.wait{opacity:.45;box-shadow:none;}

/* The score pad: frosted glass ruled like the real pad, the scores written in by hand, the player whose turn it is
   lit gold down their column */
.card{border-radius:22px;padding:0 0 10px;overflow:hidden;position:relative;color:var(--text);
  background:linear-gradient(165deg,color-mix(in srgb,var(--h) 14%,transparent),transparent 50%),var(--gl);
  box-shadow:inset 0 0 0 1px var(--gl-line),inset 0 1px 0 rgba(255,255,255,.12),var(--shadow);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:color-mix(in srgb,var(--h) 70%,transparent);opacity:.8;}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 14px 9px;border-bottom:3px double color-mix(in srgb,var(--h) 55%,var(--gl-line));}
.card-head h2{font-family:var(--display);font-size:1.55rem;color:var(--text);letter-spacing:-.025em;}
.card-head small{font-size:.84rem;font-weight:600;color:var(--text-3);text-align:right;}
table.sc{width:100%;border-collapse:collapse;table-layout:fixed;}
.sc th,.sc td{height:44px;border-bottom:1px solid var(--gl-line);padding:0;}
.sc thead th{height:36px;font-family:var(--hand);font-weight:400;font-size:1.15rem;color:var(--text-2);border-bottom:1px solid color-mix(in srgb,var(--text) 22%,transparent);line-height:1;text-wrap:balance;overflow-wrap:break-word;}
.sc .lbl{text-align:left;padding-left:12px;width:52%;}
.sc .lbl b{display:block;font-size:.95rem;font-weight:750;color:var(--text);line-height:1.08;letter-spacing:-.01em;}
.sc .lbl small{display:block;font-size:.72rem;font-weight:550;color:var(--text-3);line-height:1.15;}
.sc .lbl .die{--ds:22px;padding:3px;display:inline-grid;vertical-align:middle;margin-right:8px;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.sc .lbl .row{display:flex;align-items:center;}
.sc td.v{text-align:center;border-left:1px solid var(--gl-line);font-family:var(--hand);font-size:1.5rem;color:var(--text);position:relative;}
.sc td.v.cur{background:color-mix(in srgb,var(--lit) 8%,transparent);}
.sc td.v.ghost{color:var(--text-3);}
.sc td.v.ghost.good{color:color-mix(in srgb,var(--lit-ink) 80%,transparent);}
.sc td.v.tap{cursor:pointer;}
.sc td.v.tap::after{content:"";position:absolute;inset:4px;border-radius:10px;border:1.5px dashed color-mix(in srgb,var(--text) 26%,transparent);}
.sc td.v.best::after{border:2px solid var(--lit);box-shadow:0 0 12px var(--litg);animation:pulseb 1.4s ease-in-out infinite;}
@keyframes pulseb{50%{opacity:.4;}}
.sc td.v.zero{color:var(--bad-ink);}
.sc td.v .x{text-decoration:line-through;text-decoration-thickness:2px;}
.sc td.v.just{animation:write .5s ease-out;}
@keyframes write{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}
.sc tr.sum th,.sc tr.sum td{background:var(--gl-3);}
.sc tr.sum td.v.cur{background:color-mix(in srgb,var(--lit) 14%,transparent);}
.sc tr.sum .lbl b{font-size:.9rem;}
.sc tr.grand td,.sc tr.grand th{height:50px;border-top:2px solid color-mix(in srgb,var(--h) 55%,var(--gl-line));border-bottom:0;}
.sc tr.grand .lbl b{font-family:var(--display);font-size:1.05rem;}
.sc tr.grand td.v{font-size:1.85rem;}
.sc .sect th{height:28px;text-align:left;padding:2px 0 0 12px;font-size:.8rem;font-weight:700;color:var(--text-2);background:var(--well);}
.valgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.valgrid .btn{min-height:52px;padding:0;font-family:var(--hand);font-size:1.4rem;}
/* iPad and up: bigger dice; landscape puts the scorecard on the left and the tray on the right */
@media (min-width:700px){
  .dice .die{--ds:72px;}
  .tray .felt-in{min-height:132px;}
  .sc th,.sc td{height:40px;}
}
/* iPad either way up and a phone on its side (html.yw, set in the script from the screen's width): the score card on
   the left, as tall as the screen, and the turn line, the dice and the Roll button on the right, held in view */
html.yw #app:has(.ylay){max-width:1120px;padding-top:10px;padding-bottom:max(calc(var(--safe-b) + 8px),18px);}
html.yw .ylay{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start;}
html.yw .ylay > *{grid-row:1;grid-column:1;}
html.yw .ylay .yleft{grid-column:2;position:sticky;top:calc(var(--bar) + 6px);display:flex;flex-direction:column;justify-content:center;min-height:calc(100dvh - var(--bar) - 30px);}
html.yw .ylay .tray{position:static;margin-bottom:0;}
html.yw .ylay .turnline{font-size:1.6rem;margin-bottom:16px;}
html.yw .ylay .tray .felt-in{min-height:180px;display:flex;align-items:center;justify-content:center;}
html.yw .ylay .dice{width:100%;}
html.yw .ylay .card-head{padding:8px 14px 6px;}
html.yw .ylay .card-head h2{font-size:1.35rem;}
html.yw .ylay .sc th,html.yw .ylay .sc td{height:calc((100dvh - var(--bar) - 250px) / 14);min-height:30px;}
html.yw .ylay .sc thead th{height:30px;}
html.yw .ylay .sc .sect th{height:22px;}
html.yw .ylay .sc tr.grand td,html.yw .ylay .sc tr.grand th{height:40px;}
html.yw .ylay .sc .lbl small{display:none;}
/* an upright iPad: the column is narrow and tall, so the dice lie three over two in a deep tray, as large as it allows */
@media (orientation:portrait){
  html.yw .ylay{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;}
  html.yw .ylay .tray .felt-in{min-height:min(46dvh,420px);padding:34px 10px 34px;}
  html.yw .ylay .dice{flex-wrap:wrap;gap:18px 16px;align-content:center;}
  html.yw .ylay .dice .die{--ds:min(calc((50vw - 120px) / 3),100px);}
  html.yw .ylay .sc .lbl small{display:block;}
}
/* a phone on its side: rows as tall as a finger needs, the card scrolls under the bar while the dice stay in view */
@media (max-height:520px){
  html.yw #app:has(.ylay){padding-left:calc(var(--corner-x) + 8px);padding-right:calc(var(--corner-x) + 8px);}
  html.yw .ylay{gap:16px;}
  html.yw .ylay .sc th,html.yw .ylay .sc td{height:34px;}
  html.yw .ylay .sc .lbl .die{--ds:20px;}
  html.yw .ylay .turnline{font-size:1.2rem;margin-bottom:8px;}
  html.yw .ylay .tray .felt-in{min-height:118px;padding:14px 8px;}
  html.yw .ylay .dice .die{--ds:min(calc((50vw - 100px) / 5),58px);}
  html.yw .ylay .tray .rollbtn{min-height:48px;}
}
/* Turning the device: the dice tray and the score card glide to their new places (a View Transition in the script) */
.tray{view-transition-name:y-tray;} .card{view-transition-name:y-card;} .turnline{view-transition-name:y-turn;}
/* AT A DESK (html.yz-dk, set by the script's deskPlan only while a computer's window shows the table; phones and
   tablets never get it). Every box is placed by the script from the window; the card's rows (--rh), its type (--ys)
   and its label column (--lw) are sized from the window's height, the dice from the tray (--dds). */
:root.yz-dk.yz-dk,:root.yz-dk.yz-dk body{overflow:hidden;overscroll-behavior:none;}
:root.yz-dk.yz-dk #app{max-width:none;margin:0;padding:0;}
:root.yz-dk.yz-dk .ylay,:root.yz-dk.yz-dk .ycard{position:fixed;inset:0;display:block;z-index:1;pointer-events:none;}
:root.yz-dk.yz-dk .ylay > *,:root.yz-dk.yz-dk .ycard > *{position:absolute;margin:0;box-sizing:border-box;pointer-events:auto;}
:root.yz-dk.yz-dk .ylay .yleft{min-height:0;display:flex;flex-direction:column;justify-content:center;}
:root.yz-dk.yz-dk .ycard .yleft{display:flex;flex-direction:column;justify-content:center;--dds:0px;}
:root.yz-dk.yz-dk .ycard .yleft .turnline{justify-content:flex-start;margin:0;}
:root.yz-dk.yz-dk .ylay .turnline{font-size:calc(1.35rem + var(--dds) * .06);margin:0 0 calc(var(--dds) * .12);}
:root.yz-dk.yz-dk .ylay .tray{position:static;margin:0;padding:8px;}
:root.yz-dk.yz-dk .ylay .tray .felt-in{min-height:0;height:var(--fh);padding:0 12px;display:flex;align-items:center;justify-content:center;}
:root.yz-dk.yz-dk .ylay .dice{width:100%;gap:calc(var(--dds) * .3);flex-wrap:nowrap;}
:root.yz-dk.yz-dk .ylay .yleft.k3 .dice{flex-wrap:wrap;max-width:calc(var(--dds) * 3.7);margin:0 auto;row-gap:calc(var(--dds) * .3);}
:root.yz-dk.yz-dk .ylay .dice .die{--ds:var(--dds);}
:root.yz-dk.yz-dk .ylay .rolls{top:calc(6px + var(--dds) * .06);right:calc(10px + var(--dds) * .08);gap:calc(5px + var(--dds) * .02);}
:root.yz-dk.yz-dk .ylay .rolls i{width:calc(9px + var(--dds) * .03);height:calc(9px + var(--dds) * .03);}
:root.yz-dk.yz-dk .ylay .held-lbl{font-size:calc(.78rem + var(--dds) * .015);bottom:calc(4px + var(--dds) * .04);}
:root.yz-dk.yz-dk .ylay .empty-msg{font-size:calc(1.3rem + var(--dds) * .04);}
:root.yz-dk.yz-dk .ylay .tray .rollbtn{margin-top:8px;}
:root.yz-dk.yz-dk .die{cursor:pointer;}
/* the score pad */
:root.yz-dk.yz-dk .card{display:flex;flex-direction:column;padding:0 0 10px;}
:root.yz-dk.yz-dk .card .card-head{flex:none;box-sizing:border-box;height:calc(var(--rh) * 1.05);align-items:center;padding:0 calc(14px * var(--ys));}
:root.yz-dk.yz-dk .card .card-head h2{font-size:calc(1.4rem * var(--ys));}
:root.yz-dk.yz-dk .card .card-head small{font-size:calc(.84rem * var(--ys));}
:root.yz-dk.yz-dk .card .sc2{display:flex;align-items:flex-start;}
:root.yz-dk.yz-dk .card .sc2 > table{flex:1 1 0;min-width:0;}
:root.yz-dk.yz-dk .card .sc2 > table + table{border-left:2px solid color-mix(in srgb,var(--h) 45%,var(--gl-line));}
:root.yz-dk.yz-dk .card .sc th,:root.yz-dk.yz-dk .card .sc td{height:var(--rh);min-height:0;}
:root.yz-dk.yz-dk .card .sc thead th{height:calc(var(--rh) * .8);font-size:var(--thf,calc(1.15rem * var(--ys)));overflow-wrap:normal;word-break:keep-all;padding:0 2px;}
:root.yz-dk.yz-dk .card .sc .sect th{height:calc(var(--rh) * .55);font-size:calc(.8rem * var(--ys));padding-left:calc(12px * var(--ys));}
:root.yz-dk.yz-dk .card .sc tr.grand td,:root.yz-dk.yz-dk .card .sc tr.grand th{height:calc(var(--rh) * 1.15);}
:root.yz-dk.yz-dk .card .sc .lbl{width:var(--lw);padding-left:calc(12px * var(--ys));}
:root.yz-dk.yz-dk .card .sc .lbl b{font-size:calc(.95rem * var(--ys));}
:root.yz-dk.yz-dk .card .sc .lbl small{display:none;font-size:calc(.72rem * var(--ys));}
:root.yz-dk.yz-dk .card.hints .sc .lbl small{display:block;}
:root.yz-dk.yz-dk .card .sc .lbl .die{--ds:min(calc(22px * var(--ys)),calc(var(--rh) * .62));margin-right:calc(8px * var(--ys));cursor:default;}
:root.yz-dk.yz-dk .card .sc tr.sum .lbl b{font-size:calc(.9rem * var(--ys));}
:root.yz-dk.yz-dk .card .sc tr.grand .lbl b{font-size:calc(1.05rem * var(--ys));}
:root.yz-dk.yz-dk .card .sc td.v{font-size:calc(1.5rem * var(--ys));line-height:1;}
:root.yz-dk.yz-dk .card .sc th{line-height:1.1;}
:root.yz-dk.yz-dk .card .sc tr.grand td.v{font-size:calc(1.85rem * var(--ys));}
:root.yz-dk.yz-dk .card .sc td.v.tap::after{inset:calc(4px * var(--ys));border-radius:calc(10px * var(--ys));}
:root.yz-dk.yz-dk .card .sc td.v.tap:hover::after{border-color:color-mix(in srgb,var(--lit) 70%,transparent);background:color-mix(in srgb,var(--lit) 8%,transparent);}
/* the room: glass panels with what the game has kept */
.ypn{display:flex;flex-direction:column;gap:.55em;padding:.85em 1em .9em;border-radius:20px;font-size:var(--pf,16px);color:var(--text);
  background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line),inset 0 1px 0 rgba(255,255,255,.1);overflow:hidden;}
.ypn h4{flex:none;margin:0;font-family:var(--display);font-size:1.12em;font-weight:800;color:var(--text);letter-spacing:-.01em;}
.ypn .yrc{flex:1 1 0;min-height:0;position:relative;}
.ypn .yrc svg{position:absolute;inset:0;display:block;overflow:visible;}
.ypn .yrc text{fill:var(--text-3);font-family:var(--font);font-variant-numeric:tabular-nums;}
.ypn .yrc text.now{fill:var(--lit-ink);font-weight:800;}
.ypn .yrc text.tg{font-weight:750;}
.ypn .yrc line.g{stroke:var(--gl-line);stroke-width:1;}
.ypn .ylist{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
.ypn .yrh{flex:none;padding:.45em 0 .2em;font-size:.8em;font-weight:700;color:var(--text-3);border-bottom:1px solid var(--gl-line);}
.ypn .yrow{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.75em;padding:.42em 0;border-bottom:1px solid var(--gl-line);}
.ypn .yrow:last-child{border-bottom:0;}
.ypn .yd{display:flex;gap:.18em;}
.ypn .yd .die{--ds:1.3em;padding:.16em;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.ypn .yrow.yz .yd .die{box-shadow:0 0 0 2px var(--lit),0 0 8px var(--litg);}
.ypn .yrow .yb{min-width:0;display:flex;flex-direction:column;line-height:1.15;}
.ypn .yrow .yb b{font-weight:750;font-size:.95em;overflow-wrap:anywhere;}
.ypn .yrow .yb small{font-size:.78em;font-weight:600;color:var(--text-3);display:flex;align-items:center;gap:.35em;overflow-wrap:anywhere;}
.ypn .yrow .yb small i{width:.6em;height:.6em;border-radius:50%;background:var(--c);flex:none;}
.ypn .yrow .yp{font-family:var(--hand);font-size:1.45em;line-height:1;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums;}
.ypn .yrow .yp.z{color:var(--bad-ink);text-decoration:line-through;text-decoration-thickness:2px;}
.ypn .yrow .yk{font-family:var(--display);font-weight:800;color:var(--text-3);min-width:1.3em;text-align:center;}
.ypn.ybest .yrow:first-child .yk{color:var(--lit-ink);}
.ypn .ylist.ycols{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));grid-template-rows:repeat(var(--r),auto);grid-auto-flow:column;column-gap:2.2em;align-content:start;}
.ypn .ylist.ycols .yrow:last-child{border-bottom:1px solid var(--gl-line);}
.ypn .ylist.ytab .ytr{flex:none;display:grid;grid-template-columns:2.2em repeat(var(--n),minmax(0,1fr));column-gap:1em;align-items:center;padding:.42em 0;border-bottom:1px solid var(--gl-line);}
.ypn .ylist.ytab .yth{padding:.1em 0 .4em;font-size:.82em;font-weight:700;color:var(--text-2);}
.ypn .ylist.ytab .yth span{display:flex;align-items:center;gap:.4em;overflow-wrap:anywhere;}
.ypn .ylist.ytab .yth i{width:.62em;height:.62em;border-radius:50%;background:var(--c);flex:none;}
.ypn .ylist.ytab .yc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.6em;min-width:0;}
.ypn .ylist.ytab .yc .yb b{font-size:.86em;}
.ypn .ylist.ytab .yc.yz .yd .die{box-shadow:0 0 0 2px var(--lit),0 0 8px var(--litg);}
</style>
</head>
<body>
<main class="stage" id="app"></main>

<script>
(function () {
  'use strict';
  // Turning the device: the two-column layout (html.yw: an iPad either way up, or a phone on its side) is switched
  // inside a View Transition, so the dice tray and the score card glide to their new places instead of jumping
  (function () {
    var R = document.documentElement, q = matchMedia('(min-width:700px)'), o = matchMedia('(orientation:landscape)'), wait = false, land = o.matches;
    function set() { wait = false; land = o.matches; R.classList.toggle('yw', q.matches); window.dispatchEvent(new Event('resize')); }
    R.classList.toggle('yw', q.matches);
    function turn() {
      if (wait || (R.classList.contains('yw') === q.matches && land === o.matches)) return;
      if (document.startViewTransition && !document.hidden && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        try { wait = true; var t = document.startViewTransition(set); [t.ready, t.finished, t.updateCallbackDone].forEach(function (x) { if (x) x.catch(function () {}); }); return; } catch (e) { wait = false; }
      }
      set();
    }
    [q, o].forEach(function (m) { if (m.addEventListener) m.addEventListener('change', turn); else m.addListener(turn); });
  })();
  var el = Kit.el;
  var app = document.getElementById('app');
  var SAVE = 'yahtzee_state';

  var CATS = [
    { id: 'ones', name: 'Ones', hint: 'Add up the 1s', up: 1 },
    { id: 'twos', name: 'Twos', hint: 'Add up the 2s', up: 2 },
    { id: 'threes', name: 'Threes', hint: 'Add up the 3s', up: 3 },
    { id: 'fours', name: 'Fours', hint: 'Add up the 4s', up: 4 },
    { id: 'fives', name: 'Fives', hint: 'Add up the 5s', up: 5 },
    { id: 'sixes', name: 'Sixes', hint: 'Add up the 6s', up: 6 },
    { id: 'k3', name: '3 of a Kind', hint: 'Total of all dice' },
    { id: 'k4', name: '4 of a Kind', hint: 'Total of all dice' },
    { id: 'fh', name: 'Full House', hint: '3 + 2 alike scores 25' },
    { id: 'ss', name: 'Sm. Straight', hint: '4 in a row scores 30' },
    { id: 'ls', name: 'Lg. Straight', hint: '5 in a row scores 40' },
    { id: 'yz', name: 'Yahtzee', hint: '5 alike scores 50' },
    { id: 'ch', name: 'Chance', hint: 'Total of all dice' }
  ];
  var CAT = {}; CATS.forEach(function (c) { CAT[c.id] = c; });

  // ── Rules ─────────────────────────────────────────────────────────────────
  Kit.init({
    id: 'yahtzee',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); undoStack = []; showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([{ icon: 'history', label: 'Past games', onClick: function () { openHistory(); } }]),
    rules:
      '<p class="goal">Roll five dice to make scoring combos. After 13 rounds, the highest total wins.</p>' +
      '<h3>Your turn</h3><ul><li>Roll up to <b>3 times</b>. Tap dice between rolls to <b>hold</b> them.</li>' +
      '<li>Then pick one empty box to score. Every turn fills exactly one box, even if it scores 0.</li></ul>' +
      '<h3>Upper section</h3><p>Ones through Sixes score the total of that number. Reach <b>63 or more</b> in the upper section for a <b>+35 bonus</b> (that\'s three of each).</p>' +
      '<h3>Lower section</h3><ul><li><b>3 / 4 of a Kind:</b> total of all five dice.</li><li><b>Full House:</b> three of one + two of another, 25.</li>' +

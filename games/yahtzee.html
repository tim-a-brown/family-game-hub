<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yahtzee</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.turnline{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 10px;font-family:var(--display);font-size:1.35rem;color:var(--c,var(--yellow));}
.turnline .dot{width:12px;height:12px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 25%,transparent);}

/* Dice tray: felt inside a wooden box */
.tray{position:sticky;top:calc(var(--safe-t) + 56px);z-index:10;border-radius:24px;padding:8px;margin-bottom:16px;}
.tray .felt-in{position:relative;border-radius:18px;padding:20px 8px 22px;min-height:112px;}
.dice{display:flex;justify-content:center;gap:clamp(6px,2.4vw,14px);}
.dice .die{--ds:min(14.5vw,58px);}
.dice .die.blank{opacity:0;}
.dice .tag{position:absolute;}
.held-lbl{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:.72rem;font-weight:900;letter-spacing:.12em;color:rgba(255,255,255,.55);text-transform:uppercase;}
.empty-msg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;color:rgba(255,255,255,.45);}
.rolls{position:absolute;top:8px;right:12px;display:flex;gap:5px;}
.rolls i{width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 6px rgba(255,200,61,.7);}
.rolls i.used{background:rgba(255,255,255,.18);box-shadow:none;}
.tray .rollbtn{margin-top:8px;min-height:52px;}

/* Paper scorecard */
.card{border-radius:6px 6px 14px 14px;padding:0 0 10px;overflow:hidden;position:relative;background:linear-gradient(180deg,#fffaf0,#f6eedb);}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:radial-gradient(circle at 10px 0, transparent 6px, #fffaf0 6.5px) 0 0/20px 10px;opacity:0;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px;border-bottom:3px double #c8102e;}
.card-head h2{font-family:var(--display);font-weight:400;font-size:1.7rem;color:#c8102e;letter-spacing:.04em;}
.card-head small{font-family:var(--hand);font-size:1.05rem;color:#6a6a80;}
table.sc{width:100%;border-collapse:collapse;table-layout:fixed;}
.sc th,.sc td{height:44px;border-bottom:1px solid rgba(60,80,160,.16);padding:0;}
.sc thead th{height:36px;font-family:var(--hand);font-weight:400;font-size:1.1rem;color:#3a3a50;border-bottom:2px solid rgba(60,80,160,.3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sc .lbl{text-align:left;padding-left:12px;width:52%;}
.sc .lbl b{display:block;font-size:.95rem;font-weight:900;color:#2a2a3a;line-height:1.05;}
.sc .lbl small{display:block;font-size:.7rem;font-weight:700;color:#8a8796;line-height:1.1;}
.sc .lbl .die{--ds:22px;padding:3px;display:inline-grid;vertical-align:middle;margin-right:8px;box-shadow:0 1px 2px rgba(0,0,0,.35);}
.sc .lbl .row{display:flex;align-items:center;}
.sc td.v{text-align:center;border-left:1px solid rgba(200,16,46,.22);font-family:var(--hand);font-size:1.45rem;color:var(--ink);position:relative;}
.sc td.v.cur{background:rgba(255,220,60,.28);}
.sc td.v.ghost{color:rgba(80,80,110,.42);}
.sc td.v.ghost.good{color:rgba(31,42,107,.6);}
.sc td.v.tap{cursor:pointer;}
.sc td.v.tap::after{content:"";position:absolute;inset:4px;border-radius:8px;border:2px dashed rgba(31,42,107,.25);}
.sc td.v.best::after{border-color:#c8102e;border-style:solid;animation:pulseb 1.4s ease-in-out infinite;}
@keyframes pulseb{50%{opacity:.35;}}
.sc td.v.zero{color:rgba(200,16,46,.55);}
.sc td.v .x{text-decoration:line-through;text-decoration-thickness:2px;}
.sc td.v.just{animation:write .5s ease-out;}
@keyframes write{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}
.sc tr.sum th,.sc tr.sum td{background:rgba(200,16,46,.06);}
.sc tr.sum .lbl b{color:#c8102e;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;}
.sc tr.grand td,.sc tr.grand th{height:48px;border-top:2px solid #c8102e;}
.sc tr.grand td.v{font-size:1.8rem;}
.sc .sect th{height:26px;text-align:left;padding-left:12px;font-size:.7rem;font-weight:900;letter-spacing:.14em;color:#c8102e;text-transform:uppercase;background:rgba(200,16,46,.05);}
.valgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.valgrid .btn{min-height:52px;padding:0;font-family:var(--hand);font-size:1.4rem;}
</style>
</head>
<body>
<main class="stage" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el;
  var app = document.getElementById('app');
  var SAVE = 'yahtzee_state';

  var CATS = [
    { id: 'ones', name: 'Ones', hint: 'Add up the 1s', up: 1 },
    { id: 'twos', name: 'Twos', hint: 'Add up the 2s', up: 2 },
    { id: 'threes', name: 'Threes', hint: 'Add up the 3s', up: 3 },
    { id: 'fours', name: 'Fours', hint: 'Add up the 4s', up: 4 },
    { id: 'fives', name: 'Fives', hint: 'Add up the 5s', up: 5 },
    { id: 'sixes', name: 'Sixes', hint: 'Add up the 6s', up: 6 },
    { id: 'k3', name: '3 of a Kind', hint: 'Total of all dice' },
    { id: 'k4', name: '4 of a Kind', hint: 'Total of all dice' },
    { id: 'fh', name: 'Full House', hint: '3 + 2 alike · 25' },
    { id: 'ss', name: 'Sm. Straight', hint: '4 in a row · 30' },
    { id: 'ls', name: 'Lg. Straight', hint: '5 in a row · 40' },
    { id: 'yz', name: 'Yahtzee', hint: '5 alike · 50' },
    { id: 'ch', name: 'Chance', hint: 'Total of all dice' }
  ];
  var CAT = {}; CATS.forEach(function (c) { CAT[c.id] = c; });

  // ── Rules ─────────────────────────────────────────────────────────────────
  Kit.init({
    id: 'yahtzee',
    onNew: function () { clearSave(); undoStack = []; showSetup(); },
    undo: function () { undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { openHistory(); } }],
    rules:
      '<p class="goal">Roll five dice to make scoring combos. After 13 rounds, the highest total wins.</p>' +
      '<h3>Your turn</h3><ul><li>Roll up to <b>3 times</b>. Tap dice between rolls to <b>hold</b> them.</li>' +
      '<li>Then pick one empty box to score. Every turn fills exactly one box, even if it scores 0.</li></ul>' +
      '<h3>Upper section</h3><p>Ones through Sixes score the total of that number. Reach <b>63 or more</b> in the upper section for a <b>+35 bonus</b> (that\'s three of each).</p>' +
      '<h3>Lower section</h3><ul><li><b>3 / 4 of a Kind:</b> total of all five dice.</li><li><b>Full House:</b> three of one + two of another, 25.</li>' +
      '<li><b>Small Straight:</b> four in a row, 30. <b>Large Straight:</b> five in a row, 40.</li><li><b>Yahtzee:</b> all five the same, 50.</li><li><b>Chance:</b> any dice, total of all five.</li></ul>' +
      '<h3>Extra Yahtzees</h3><p>If you already scored 50 in the Yahtzee box, every extra Yahtzee earns a <b>+100 bonus</b>. You must then use it in the matching upper box (e.g. five 4s go in Fours) if it\'s empty. If that box is full, it works as a <b>joker</b>: Full House, Small and Large Straight score full points.</p>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null;  // {mode, players:[{name,cpu,color,card:{},yb}], cur, dice, held, rolls, round, busy}
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} Kit.resume.set('Round ' + Math.min(13, S.round) + ' of 13'); }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function load() { try { return JSON.parse(localStorage.getItem(SAVE)); } catch (e) { return null; } }

  // ── Scoring ───────────────────────────────────────────────────────────────
  function counts(d) { var c = [0, 0, 0, 0, 0, 0, 0]; d.forEach(function (v) { c[v]++; }); return c; }
  function sum(d) { return d.reduce(function (a, b) { return a + b; }, 0); }
  function isYahtzee(d) { return d[0] > 0 && d.every(function (v) { return v === d[0]; }); }
  function hasRun(c, len) {
    var run = 0;
    for (var v = 1; v <= 6; v++) { run = c[v] ? run + 1 : 0; if (run >= len) return true; }
    return false;
  }
  function raw(cat, d) {
    var c = counts(d), mx = Math.max.apply(null, c);
    switch (cat) {
      case 'k3': return mx >= 3 ? sum(d) : 0;
      case 'k4': return mx >= 4 ? sum(d) : 0;
      case 'fh': return (c.indexOf(3) > 0 && c.indexOf(2) > 0) ? 25 : 0;
      case 'ss': return hasRun(c, 4) ? 30 : 0;
      case 'ls': return hasRun(c, 5) ? 40 : 0;
      case 'yz': return mx === 5 ? 50 : 0;
      case 'ch': return sum(d);
      default: return c[CAT[cat].up] * CAT[cat].up;
    }
  }
  // Which boxes may be used now, and for how much (official joker rules).
  function options(p, d) {
    var out = {}, open = CATS.filter(function (c) { return p.card[c.id] == null; });
    var joker = isYahtzee(d) && p.card.yz != null;
    if (!joker) { open.forEach(function (c) { out[c.id] = raw(c.id, d); }); return out; }
    var up = CATS[d[0] - 1];
    if (p.card[up.id] == null) { out[up.id] = raw(up.id, d); return out; }
    var lower = open.filter(function (c) { return !c.up; });
    if (lower.length) {
      lower.forEach(function (c) { out[c.id] = c.id === 'fh' ? 25 : c.id === 'ss' ? 30 : c.id === 'ls' ? 40 : raw(c.id, d); });
      return out;
    }
    open.forEach(function (c) { out[c.id] = 0; });
    return out;
  }
  function upperSum(p) { return CATS.filter(function (c) { return c.up; }).reduce(function (a, c) { return a + (p.card[c.id] || 0); }, 0); }
  function total(p) {
    var u = upperSum(p), all = CATS.reduce(function (a, c) { return a + (p.card[c.id] || 0); }, 0);
    return all + (u >= 63 ? 35 : 0) + (p.yb || 0) * 100;
  }
  function filled(p) { return CATS.filter(function (c) { return p.card[c.id] != null; }).length; }

  // ── Setup ─────────────────────────────────────────────────────────────────
  function showSetup() {
    S = null;
    Kit.setup(app, {
      modes: [
        { id: 'roll', icon: 'users', title: 'Pass & play', desc: 'Take turns rolling on this phone' },
        { id: 'cpu', icon: 'bot', title: 'vs Computer', desc: 'You against the computer' },
        { id: 'card', icon: 'pencil', title: 'Real dice', desc: 'Roll at the table, score here' }
      ],
      players: {
        range: function (m) { return m === 'cpu' ? [2, 4] : [1, 8]; },
        cpu: function (m) { return m === 'cpu' ? 'seats' : false; },
        count: 2
      },
      onStart: function (cfg) { start(cfg); }
    });
  }

  function start(cfg) {
    undoStack = []; cpuToken++;
    S = {
      mode: cfg.mode, cur: 0, round: 1, rolls: 0, busy: false,
      dice: [0, 0, 0, 0, 0], held: [false, false, false, false, false],
      players: cfg.players.map(function (p) { return { name: p.name, cpu: p.cpu, color: p.color, card: {}, yb: 0 }; })
    };
    save(); render(); maybeCpu();
  }

  // ── Play ──────────────────────────────────────────────────────────────────
  function P() { return S.players[S.cur]; }
  var diceEls = [];

  function roll() {
    if (S.busy && !P().cpu) return;
    if (S.rolls >= 3) return;
    S.rolls++;
    for (var i = 0; i < 5; i++) if (!S.held[i] || S.dice[i] === 0) { S.dice[i] = 1 + Math.floor(Math.random() * 6); S.held[i] = S.held[i] && S.dice[i] > 0; }
    Kit.sfx('roll'); Kit.haptic('medium');
    render(true);
    var d = S.dice;
    if (isYahtzee(d)) {
      setTimeout(function () { Kit.callout('YAHTZEE!'); Kit.confetti({ count: 100 }); Kit.sfx('win'); }, 350);
    } else if (raw('ls', d)) setTimeout(function () { Kit.callout('Large Straight!'); Kit.sfx('good'); }, 350);
    else if (raw('fh', d) && P().card.fh == null) setTimeout(function () { Kit.callout('Full House!'); Kit.sfx('good'); }, 350);
    save();
  }
  function toggleHold(i) {
    if (S.mode === 'card' || S.rolls === 0 || S.rolls >= 3 || P().cpu || S.busy) return;
    S.held[i] = !S.held[i]; Kit.sfx(S.held[i] ? 'pop' : 'tap'); Kit.haptic('light');
    paintDice(); save();
  }

  function scoreBox(id, val, opts) {
    var p = P();
    if (p.card[id] != null) return;
    if (!p.cpu) snapshot();
    var wasJokerBonus = S.mode !== 'card' && isYahtzee(S.dice) && p.card.yz === 50;
    p.card[id] = val; lastScored = id;
    if (wasJokerBonus) { p.yb = (p.yb || 0) + 1; Kit.callout('+100 Bonus!'); Kit.confetti({ count: 80 }); }
    var u = upperSum(p);
    if (CAT[id].up && u >= 63 && u - val < 63) setTimeout(function () { Kit.callout('+35 Bonus!'); Kit.sfx('win'); }, 200);
    Kit.sfx(val > 0 ? 'good' : 'tap'); Kit.haptic(val > 0 ? 'success' : 'light');
    if (!(opts && opts.stay)) nextTurn(); else { save(); render(); }
  }

  function nextTurn() {
    S.rolls = 0; S.dice = [0, 0, 0, 0, 0]; S.held = [false, false, false, false, false];
    if (S.players.every(function (p) { return filled(p) === 13; })) { finish(); return; }
    var n = S.players.length;
    for (var k = 1; k <= n; k++) {
      var j = (S.cur + k) % n;
      if (filled(S.players[j]) < 13) { if (j <= S.cur) S.round++; S.cur = j; break; }
    }
    if (n === 1) S.round = filled(P()) + 1;
    save(); render(); maybeCpu();
  }

  function finish() {
    var rank = S.players.map(function (p) { return { name: p.name, score: total(p), color: p.color, cpu: p.cpu }; })
      .sort(function (a, b) { return b.score - a.score; });
    var top = rank[0], tie = rank.length > 1 && rank[1].score === top.score;
    try {
      GameHistory.save('yahtzee', {
        players: rank.map(function (r) { return { name: r.name, score: r.score }; }),
        winner: tie ? null : top.name, _summary: rank.map(function (r) { return r.name + ' ' + r.score; }).join(' · ')
      });
    } catch (e) {}
    clearSave();
    var youLost = S.mode === 'cpu' && top.cpu;
    Kit.win({
      title: rank.length === 1 ? top.score + ' points!' : tie ? "It's a tie!" : top.name + ' wins!',
      sub: rank.length === 1 ? (top.score >= 300 ? 'Legendary game!' : top.score >= 250 ? 'Great game!' : 'Nice rolling!') : 'Final scores',
      rank: rank.length > 1 ? rank : null, lose: youLost,
      again: function () { start({ mode: S.mode, players: S.players.map(function (p) { return { name: p.name, cpu: p.cpu, color: p.color }; }) }); },
      extra: [{ label: 'Change players', onClick: showSetup }]
    });
  }

  // ── Computer player ───────────────────────────────────────────────────────
  function cpuHolds(p, d) {
    var c = counts(d), open = function (id) { return p.card[id] == null; };
    // Chase straights when a run of 4 (or 3 early) is showing
    if ((open('ls') || open('ss')) && !isYahtzee(d)) {
      var runs = [[1, 2, 3, 4, 5], [2, 3, 4, 5, 6], [1, 2, 3, 4], [2, 3, 4, 5], [3, 4, 5, 6]];
      for (var r = 0; r < runs.length; r++) {
        var have = runs[r].filter(function (v) { return c[v]; }).length;
        if (have >= 4 || (have >= 3 && runs[r].length === 4 && S.rolls === 1 && Math.max.apply(null, c) < 3)) {
          var keep = runs[r].slice(), h = [false, false, false, false, false];
          d.forEach(function (v, i) { var k = keep.indexOf(v); if (k >= 0) { h[i] = true; keep.splice(k, 1); } });
          return h;
        }
      }
    }
    // Full house: keep both groups
    if (open('fh') && c.indexOf(3) > 0 && c.indexOf(2) > 0) return [true, true, true, true, true];
    // Otherwise keep the best group (most of a kind, prefer high faces and open upper boxes)
    var best = 0, bestScore = -1;
    for (var v = 1; v <= 6; v++) {
      var sc = c[v] * 10 + v + (open(CATS[v - 1].id) ? 4 : 0);
      if (c[v] && sc > bestScore) { bestScore = sc; best = v; }
    }
    if (c[best] === 1 && !open(CATS[best - 1].id)) {
      // Nothing worth keeping: hold only high dice for chance / kinds
      return d.map(function (x) { return x >= 5 && c[x] === 1 && false; });
    }
    return d.map(function (x) { return x === best; });
  }
  function cpuChoose(p, d) {
    var opt = options(p, d), left = 13 - filled(p), best = null, bestV = -1e9;
    Object.keys(opt).forEach(function (id) {
      var v = opt[id], c = CAT[id], w = v;
      if (c.up) { w = v - (3 * c.up - v) * 0.6; if (v === 0) w = -c.up * 3; }
      if (id === 'ch') w = left > 3 ? v - 18 : v - 4;
      if (id === 'yz' && v === 0) w = left > 5 ? -40 : -8;
      if ((id === 'k3' || id === 'k4') && v) w = v - 6;
      if ((id === 'k3' || id === 'k4') && !v) w = -20;
      if ((id === 'fh' || id === 'ss' || id === 'ls') && !v) w = -25 + (id === 'ls' ? -4 : 0);
      if (w > bestV) { bestV = w; best = id; }
    });
    return { id: best, v: opt[best] };
  }
  var cpuToken = 0;
  function maybeCpu() {
    if (!S || S.mode === 'card' || !P().cpu) return;
    S.busy = true; render();
    var p = P(), token = ++cpuToken;
    function alive() { return S && P() === p && token === cpuToken; }
    (function go() {
      if (!alive()) return;
      if (S.rolls < 3) {
        if (S.rolls > 0) {
          var h = cpuHolds(p, S.dice), ch = cpuChoose(p, S.dice);
          // Stop early on a made hand worth keeping
          if (ch.v >= 40 || (ch.id === 'yz' && ch.v) || (ch.id === 'fh' && ch.v) || h.every(Boolean)) return finishCpu();
          S.held = h; paintDice();
        }
        setTimeout(function () { if (!alive()) return; roll(); setTimeout(go, 1000); }, 600);
      } else finishCpu();
    })();
    function finishCpu() {
      // Show the chosen box on the card for a moment before moving on
      setTimeout(function () {
        if (!alive()) return;
        var ch = cpuChoose(p, S.dice);
        cpuPick = ch.id; render();
        Kit.toast(p.name + ' scores ' + (ch.v ? ch.v + ' in ' : '0 in ') + CAT[ch.id].name);
        setTimeout(function () {
          if (!alive()) return;
          cpuPick = null; S.busy = false; scoreBox(ch.id, ch.v);
        }, 1400);
      }, 500);
    }
  }
  var cpuPick = null;

  // ── Undo (takes back your last scoring choice, including any computer turns after it)
  var undoStack = [];
  function snapshot() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 30) undoStack.shift(); }
  function undo() {
    if (!undoStack.length) return Kit.toast('Nothing to undo');
    cpuToken++;
    S = JSON.parse(undoStack.pop()); S.busy = false; cpuPick = null;
    Kit.sfx('whoosh'); Kit.toast('Undone'); save(); render(); maybeCpu();
  }

  // ── Real-dice scorecard entry ─────────────────────────────────────────────
  function enterValue(id) {
    var c = CAT[id], vals;
    if (c.up) { vals = [0, 1, 2, 3, 4, 5].map(function (k) { return k * c.up; }); }
    else if (id === 'fh') vals = [0, 25];
    else if (id === 'ss') vals = [0, 30];
    else if (id === 'ls') vals = [0, 40];
    else if (id === 'yz') vals = [0, 50];
    else { vals = []; for (var v = 5; v <= 30; v++) vals.push(v); vals.unshift(0); }
    var grid = el('div', { class: 'valgrid' }), s;
    vals.forEach(function (v) {
      grid.appendChild(el('button', { type: 'button', class: 'btn btn-sm ' + (v ? 'btn-primary' : 'btn-soft'), text: String(v), onclick: function () { s.close(); scoreBox(id, v); } }));
    });
    var node = el('div', null, [el('p', { class: 'muted', text: c.hint }), grid]);
    if (id !== 'yz' && P().card.yz === 50) {
      node.appendChild(el('button', { type: 'button', class: 'btn btn-yellow btn-block', style: { 'margin-top': '14px' }, text: 'Extra Yahtzee! Add +100', onclick: function () { P().yb = (P().yb || 0) + 1; Kit.callout('+100!'); Kit.confetti({ count: 60 }); save(); render(); } }));
    }
    s = Kit.sheet({ title: P().name + ': ' + c.name, node: node });
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function paintDice() {
    diceEls.forEach(function (d, i) {
      d.dataset.v = S.dice[i] || 1;
      d.classList.toggle('blank', !S.dice[i]);
      d.classList.toggle('held', !!S.held[i] && S.rolls > 0);
      d.setAttribute('aria-label', S.dice[i] ? 'Die showing ' + S.dice[i] + (S.held[i] ? ', held' : '') : 'Not rolled yet');
    });
  }

  function render(animate) {
    if (!S) return;
    var p = P();
    app.innerHTML = '';

    var line = S.mode === 'card' ? 'Scoring for ' + p.name
      : S.players.length === 1 ? 'Round ' + S.round + ' of 13'
      : p.cpu ? p.name + ' is rolling…' : Kit.poss(p.name) + ' turn';
    app.appendChild(el('div', { class: 'turnline', style: { '--c': p.color } }, [el('span', { class: 'dot' }), el('span', { text: line })]));

    var opts = S.mode === 'card' ? null : (S.rolls ? options(p, S.dice) : null);

    // Dice tray
    if (S.mode !== 'card') {
      var tray = el('div', { class: 'tray wood' });
      var felt = el('div', { class: 'felt-in' });
      var rl = el('div', { class: 'rolls', 'aria-label': (3 - S.rolls) + ' rolls left' });
      for (var k = 0; k < 3; k++) rl.appendChild(el('i', { class: k < S.rolls ? 'used' : '' }));
      felt.appendChild(rl);
      var row = el('div', { class: 'dice' });
      diceEls = [];
      for (var i = 0; i < 5; i++) {
        (function (i) {
          var d = Kit.die(S.dice[i] || 1);
          if (animate && !S.held[i]) {
            d.classList.add('rolling');
            d.style.animationDelay = (i * 45) + 'ms';
            d.style.setProperty('--dx', ((Math.random() - .5) * 120) + 'px');
            d.style.setProperty('--dr', ((Math.random() > .5 ? 1 : -1) * (240 + Math.random() * 300)) + 'deg');
          }
          d.addEventListener('click', function () { toggleHold(i); });
          diceEls.push(d); row.appendChild(d);
        })(i);
      }
      felt.appendChild(row);
      if (!S.rolls) felt.appendChild(el('div', { class: 'empty-msg', text: p.cpu ? '' : 'Tap Roll to start' }));
      else if (S.rolls < 3 && !p.cpu) felt.appendChild(el('div', { class: 'held-lbl', text: 'Tap dice to hold' }));
      tray.appendChild(felt);
      var left = 3 - S.rolls;
      var rb = el('button', { type: 'button', class: 'btn btn-primary btn-lg btn-block rollbtn', onclick: roll },
        [el('span', { text: S.rolls === 0 ? 'Roll!' : left ? 'Roll again' : 'Pick a score below' })]);
      rb.disabled = left === 0 || p.cpu || S.busy;
      tray.appendChild(rb);
      app.appendChild(tray);
      paintDice();
    }

    // Paper scorecard: one column per player, the active one highlighted
    var best = null, bestV = 0;
    if (opts) Object.keys(opts).forEach(function (id) { if (opts[id] > bestV) { bestV = opts[id]; best = id; } });
    var card = el('div', { class: 'card paper' });
    card.appendChild(el('div', { class: 'card-head' }, [el('h2', { text: 'YAHTZEE' }), el('small', { text: S.mode === 'card' ? 'tap a box to fill it in' : opts ? 'tap a box to score' : '' })]));
    var tbl = el('table', { class: 'sc' });
    var head = el('tr', null, [el('th', { class: 'lbl' })]);
    S.players.forEach(function (q, i) {
      var th = el('th', { text: q.name, style: { color: i === S.cur ? q.color : '' } });
      if (S.mode === 'card') th.addEventListener('click', function () { S.cur = i; Kit.sfx('tap'); save(); render(); });
      head.appendChild(th);
    });
    tbl.appendChild(el('thead', null, [head]));
    var body = el('tbody');
    function sect(t) { body.appendChild(el('tr', { class: 'sect' }, [el('th', { colspan: S.players.length + 1, text: t })])); }
    function catRow(c) {
      var tr = el('tr');
      var lbl = el('th', { class: 'lbl' });
      var inner = el('span', { class: 'row' });
      if (c.up) { var dd = Kit.die(c.up); dd.disabled = true; dd.tabIndex = -1; inner.appendChild(dd); }
      inner.appendChild(el('span', null, [el('b', { text: c.name }), el('small', { text: c.hint })]));
      lbl.appendChild(inner); tr.appendChild(lbl);
      S.players.forEach(function (q, i) {
        var done = q.card[c.id] != null, isCur = i === S.cur;
        var td = el('td', { class: 'v' + (isCur ? ' cur' : '') });
        if (done) {
          td.textContent = q.card[c.id] === 0 ? '' : String(q.card[c.id]);
          if (q.card[c.id] === 0) { td.classList.add('zero'); td.appendChild(el('span', { class: 'x', text: '0' })); }
          if (isCur && c.id === lastScored) td.classList.add('just');
          if (S.mode === 'card' && isCur) { td.classList.add('tap'); td.addEventListener('click', function () { fixValue(c.id); }); }
        } else if (isCur && S.mode === 'card') {
          td.classList.add('tap'); td.addEventListener('click', function () { enterValue(c.id); });
        } else if (isCur && opts && opts[c.id] != null) {
          var v = opts[c.id];
          td.textContent = String(v);
          td.classList.add('ghost'); if (v > 0) td.classList.add('good');
          if (p.cpu && cpuPick === c.id) td.classList.add('tap', 'best');
          if (!p.cpu && !S.busy) {
            td.classList.add('tap'); if (c.id === best) td.classList.add('best');
            td.addEventListener('click', function () {
              if (v === 0) Kit.confirm('Score 0 in ' + c.name + '?', { ok: 'Take 0', body: "You can't use this box again." }).then(function (ok) { if (ok) scoreBox(c.id, 0); });
              else scoreBox(c.id, v);
            });
          }
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    }
    function sumRow(label, fn, cls) {
      var tr = el('tr', { class: 'sum ' + (cls || '') }, [el('th', { class: 'lbl' }, [el('b', { text: label })])]);
      S.players.forEach(function (q, i) { tr.appendChild(el('td', { class: 'v' + (i === S.cur ? ' cur' : ''), text: fn(q) })); });
      body.appendChild(tr);
    }
    sect('Upper section');
    CATS.slice(0, 6).forEach(catRow);
    sumRow('Bonus', function (q) { var u = upperSum(q); return u >= 63 ? '35' : u ? u + '/63' : ''; });
    sect('Lower section');
    CATS.slice(6).forEach(catRow);
    if (S.players.some(function (q) { return q.yb; })) sumRow('Yahtzee bonus', function (q) { return q.yb ? String(q.yb * 100) : ''; });
    sumRow('Grand total', function (q) { return String(total(q)); }, 'grand');
    tbl.appendChild(body);
    card.appendChild(tbl);
    app.appendChild(card);
    lastScored = null;
  }
  var lastScored = null;

  function fixValue(id) {
    Kit.confirm('Clear ' + CAT[id].name + ' for ' + P().name + '?', { ok: 'Clear it', body: 'Use this to fix a mistake.' }).then(function (ok) {
      if (ok) { delete P().card[id]; save(); render(); }
    });
  }
  function peek(q) {
    var box = el('div', { class: 'sc' });
    CATS.forEach(function (c) {
      box.appendChild(el('div', { class: 'cat done' }, [c.up ? miniDie(c.up) : null, el('span', { class: 'nm' }, [el('b', { text: c.name })]), el('span', { class: 'v', text: q.card[c.id] == null ? '–' : String(q.card[c.id]) })]));
    });
    Kit.sheet({ title: q.name + ' · ' + total(q), node: box, actions: [{ label: 'Close', cls: 'btn-soft' }] });
  }
  function openHistory() {
    try {
      GameHistory.open('yahtzee', 'Yahtzee', function (e) {
        return e && e.players ? GameHistory.renderPlayerResults(e.players, e.winner) : document.createTextNode(e._summary || '');
      });
    } catch (e) { Kit.toast('No past games yet'); }
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved && saved.players && saved.players.length) {
    S = saved; S.busy = false;
    render(); maybeCpu();
  } else showSetup();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slots</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../casino.js"></script>
<style>
@font-face{font-family:"Bungee";src:url("../fonts/bungee.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Cinzel";src:url("../fonts/cinzel-700.woff2") format("woff2");font-weight:700;font-display:swap;}
@font-face{font-family:"Great Vibes";src:url("../fonts/great-vibes.woff2") format("woff2");font-display:swap;}
.stage{max-width:520px;padding-top:0;}
.bankrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 10px;font-weight:800;font-size:.92rem;color:var(--text-2);}
.bankrow b{color:var(--text);font-variant-numeric:tabular-nums;}
.bankrow .up{color:var(--green);} .bankrow .down{color:var(--red);}

/* ── Cabinet shell (every machine) ───────────────────────────────────────── */
.cab{position:relative;border-radius:28px;padding:4px;box-shadow:0 24px 48px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.6);
  --led:#ff5a3c;--led2:#ffd45a;--panel:#07060b;--btn-a:#5b5470;--btn-b:#2e2939;--ink:#fff;}
.cab-in{position:relative;border-radius:24px;padding:10px 10px 12px;overflow:hidden;}
.topper{position:relative;text-align:center;margin:0 0 8px;}
.frame{position:relative;border-radius:14px;padding:5px;}
.reels{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:var(--gap,3px);}
.reel{position:relative;height:calc(var(--ch,60px) * var(--rows));overflow:hidden;border-radius:7px;background:var(--reel-bg,#fffdf6);transition:box-shadow .2s;}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--reel-shade,none);}
.track{position:absolute;left:0;right:0;top:0;transform:translate3d(0,calc(var(--p,0) * var(--ch,60px) * -1),0);will-change:transform;}
.track.fast{filter:blur(1.4px);}
.cell{position:relative;height:var(--ch,60px);display:grid;place-items:center;transition:opacity .25s,filter .25s;}
.cell>svg{width:var(--sw,88%);height:var(--sw,88%);}
.reels.showing .cell:not(.hit){opacity:.42;filter:saturate(.55);}
.cell.hit::before{content:"";position:absolute;inset:2px;border-radius:9px;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 3px var(--hit,#ffc83d),0 0 14px var(--hitglow,rgba(255,200,61,.75));animation:hitpulse .8s ease-in-out infinite;}
.cell.hit>svg{animation:hitsym .8s ease-in-out infinite;}
.cell.pop>svg{animation:popsym .55s cubic-bezier(.3,1.6,.5,1);}
@keyframes hitpulse{50%{box-shadow:inset 0 0 0 3px #fff3b0,0 0 24px var(--hitglow,rgba(255,200,61,.95));}}
@keyframes hitsym{50%{transform:scale(1.09);}}
@keyframes popsym{0%{transform:scale(.6);}60%{transform:scale(1.22);}100%{transform:scale(1);}}
.reel.antic{box-shadow:0 0 0 3px #ffe066,0 0 26px 8px rgba(255,190,40,.85);animation:antic .35s ease-in-out infinite alternate;z-index:3;}
@keyframes antic{to{box-shadow:0 0 0 3px #fff7c2,0 0 36px 12px rgba(255,120,30,.95);}}
.fbv{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:Bungee,var(--display);font-size:calc(var(--ch,60px) * .22);line-height:1;color:#fff;
  text-shadow:0 0 3px #7a1000,0 1px 0 #7a1000,0 -1px 0 #7a1000,1px 0 0 #7a1000,-1px 0 0 #7a1000;pointer-events:none;white-space:nowrap;letter-spacing:-.02em;z-index:1;}
.fbv.jp{font-size:calc(var(--ch,60px) * .17);color:#fff27a;}
.fbv.jp.MAJOR{color:#ff9d9d;} .fbv.jp.MINOR{color:#d7b3ff;} .fbv.jp.MINI{color:#9dffc4;}
.wm{position:absolute;right:3px;top:3px;z-index:3;padding:1px 5px;border-radius:7px;font-family:Bungee,var(--display);font-size:calc(var(--ch,60px) * .2);line-height:1.2;color:#3a1200;
  background:linear-gradient(#fff3b0,#ffb52e);box-shadow:0 2px 0 #7a3300,0 0 10px rgba(255,180,40,.9);animation:popsym .5s cubic-bezier(.3,1.6,.5,1);}
.lines-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:4;}
.lines-svg polyline{fill:none;stroke-linecap:round;stroke-linejoin:round;}

/* Message strip + meters */
.msg{height:30px;margin:8px 0 8px;border-radius:9px;background:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 3px 8px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.8rem;font-weight:700;letter-spacing:.05em;padding:0 8px;
  color:var(--led2);text-shadow:0 0 6px currentColor;text-transform:uppercase;white-space:nowrap;overflow:hidden;}
.msg span{overflow:hidden;text-overflow:ellipsis;}
.msg.good{color:#fff2a8;}
.meters{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:6px;margin-bottom:9px;}
.meter{border-radius:9px;padding:3px 6px 4px;text-align:center;background:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 3px 8px rgba(0,0,0,.6);min-width:0;}
.meter small{display:block;font-size:.62rem;font-weight:900;letter-spacing:.14em;color:rgba(255,255,255,.5);line-height:1.3;}
.meter b{display:block;font-family:var(--mono);font-size:1.1rem;line-height:1.25;color:var(--led);text-shadow:0 0 8px currentColor;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meter.w b{color:var(--led2);}

/* Buttons */
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.ctl.one{grid-template-columns:1fr 58px;}
.ctl.two{grid-template-columns:1fr 1fr 58px;}
.step{display:flex;align-items:center;border-radius:14px;padding:3px;background:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);min-width:0;}
.step button,.ibtn{width:40px;height:40px;flex:none;border:0;border-radius:11px;color:#fff;font-size:1.3rem;font-weight:900;cursor:pointer;
  background:linear-gradient(180deg,var(--btn-a),var(--btn-b));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 #000;}
.step button:active:not(:disabled),.ibtn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);}
.step button:disabled,.ibtn:disabled{opacity:.35;}
.ibtn{width:auto;height:auto;min-height:46px;display:grid;place-items:center;border-radius:14px;}
.ibtn .ico{width:22px;height:22px;}
.step .mid{flex:1;text-align:center;min-width:0;}
.step .mid small{display:block;font-size:.6rem;font-weight:900;letter-spacing:.03em;color:rgba(255,255,255,.55);text-transform:uppercase;line-height:1.2;white-space:nowrap;}
.step .mid b{display:block;font-size:1.06rem;font-weight:900;color:#fff;line-height:1.2;}
.ctl2{display:grid;grid-template-columns:1fr 1.9fr;gap:8px;}
.mbtn{min-height:60px;border:0;border-radius:18px;cursor:pointer;font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;color:#fff;text-transform:uppercase;
  background:linear-gradient(180deg,var(--btn-a),var(--btn-b));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.35),0 3px 0 #000;transition:transform .08s;}
.mbtn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 #000;}
.mbtn:disabled{opacity:.4;}
.mbtn.spin{font-size:1.45rem;color:var(--spin-ink,#3a1600);background:var(--spin-bg,radial-gradient(120% 90% at 50% 10%,#fff3c0 0%,#ffc83d 38%,#e0870e 80%,#b45f05 100%));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.3),0 4px 0 var(--spin-edge,#5a2c00),0 0 18px var(--spin-glow,rgba(255,200,61,.3));}
.mbtn.spin small{display:block;font-family:var(--font);font-size:.72rem;font-weight:900;letter-spacing:.04em;opacity:.8;text-transform:none;}
.mbtn.spin.stop{background:radial-gradient(120% 90% at 50% 10%,#ffd0d0 0%,#ff5c6a 40%,#c41f2f 85%);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(80,0,0,.45),0 4px 0 #4a0008;}
.cab:not(.busy) .mbtn.spin{animation:spinglow 2.4s ease-in-out infinite;}
@keyframes spinglow{50%{filter:brightness(1.1);}}
.below{display:flex;gap:8px;margin-top:14px;}
.below .btn{flex:1;white-space:nowrap;padding-left:10px;padding-right:10px;}

/* Overlays: big wins, feature banners */
.fx{position:absolute;inset:0;z-index:30;display:grid;place-items:center;pointer-events:auto;border-radius:inherit;overflow:hidden;
  background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,.82));animation:fxin .25s ease-out;}
.fx.out{animation:fxout .3s ease-in forwards;}
@keyframes fxin{from{opacity:0;}} @keyframes fxout{to{opacity:0;}}
.fx .bx{text-align:center;padding:10px 14px;}
.fx .t{font-family:Bungee,var(--display);font-size:clamp(1.6rem,8.4vw,3rem);line-height:1.02;letter-spacing:.02em;
  background:linear-gradient(180deg,#fffbe6 0%,#ffe27a 40%,#e0940f 62%,#fff0a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a2600) drop-shadow(0 0 18px rgba(255,190,50,.6));animation:fxpop .6s cubic-bezier(.2,1.6,.4,1);}
.fx .t.mega{background-image:linear-gradient(180deg,#fff 0%,#ffd1f0 35%,#ff4fa8 62%,#ffe2f4 100%);filter:drop-shadow(0 3px 0 #5a0030) drop-shadow(0 0 20px rgba(255,80,170,.7));}
.fx .t.epic{background-image:linear-gradient(180deg,#fff 0%,#d4f7ff 35%,#28b8ff 62%,#e2fbff 100%);filter:drop-shadow(0 3px 0 #002a5a) drop-shadow(0 0 22px rgba(40,180,255,.8));}
.fx .a{margin-top:6px;font-family:var(--mono);font-weight:800;font-size:clamp(1.6rem,8vw,2.4rem);color:#fff;text-shadow:0 0 12px rgba(255,220,120,.9);font-variant-numeric:tabular-nums;}
.fx .s{margin-top:6px;font-weight:900;font-size:1rem;color:#ffe9b0;letter-spacing:.04em;}
.fx .tap{margin-top:12px;font-size:.75rem;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:.08em;text-transform:uppercase;}
.fx .rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,220,120,.12) 0 10deg,rgba(255,220,120,0) 10deg 20deg);animation:rays 9s linear infinite;pointer-events:none;}
@keyframes rays{to{transform:rotate(360deg);}}
@keyframes fxpop{0%{transform:scale(.2);opacity:0;}70%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}
.coins{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden;}
.coins i{position:absolute;top:-44px;width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6c0 0%,#f6c537 45%,#a8730c 100%);
  box-shadow:inset 0 0 0 3px rgba(150,98,6,.55),0 3px 5px rgba(0,0,0,.4);animation:coinfall 1.9s cubic-bezier(.35,.05,.75,1) forwards;}
.coins i::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid rgba(150,98,6,.5);}
@keyframes coinfall{to{transform:translateY(calc(100vh + 90px)) rotateY(900deg);}}

/* Free games bar */
.fsbar{display:none;align-items:center;justify-content:center;gap:10px;margin:0 0 8px;padding:5px 10px;border-radius:10px;font-weight:900;font-size:.86rem;letter-spacing:.04em;text-transform:uppercase;
  color:#fff7d6;background:linear-gradient(90deg,rgba(0,0,0,.0),rgba(0,0,0,.45),rgba(0,0,0,0));}
.fsbar b{font-family:Bungee,var(--display);font-weight:400;font-size:1.05rem;color:#ffe27a;}
.cab.fsmode .fsbar,.cab.hsmode .fsbar{display:flex;}

/* ── Diamond Sevens: 1960s chrome and walnut ─────────────────────────────── */
.classic-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 50px;gap:0;align-items:start;}
.sk-classic{--led:#ff5a3c;--led2:#ffd45a;--panel:#120c08;--btn-a:#6b4a2c;--btn-b:#3a2412;--reel-bg:linear-gradient(90deg,#c9c0ac 0%,#fffdf4 20%,#fffdf4 80%,#c9c0ac 100%);
  --reel-shade:linear-gradient(180deg,rgba(20,10,0,.62) 0%,rgba(20,10,0,.12) 22%,rgba(255,255,255,.08) 44%,rgba(255,255,255,0) 56%,rgba(20,10,0,.12) 78%,rgba(20,10,0,.62) 100%);
  --gap:12px;--sw:76%;--spin-bg:radial-gradient(120% 90% at 50% 10%,#ffd6d6 0%,#e8283a 45%,#8a0612 100%);--spin-ink:#fff;--spin-edge:#3a0006;--spin-glow:rgba(255,60,60,.3);
  background:linear-gradient(135deg,#f6f8fa 0%,#8f99a4 18%,#f1f4f7 40%,#69717b 66%,#dde2e7 100%);border-radius:34px 34px 26px 26px;}
.sk-classic .cab-in{border-radius:30px 30px 22px 22px;padding:0 10px 12px;
  background:repeating-linear-gradient(92deg,rgba(0,0,0,.0) 0 7px,rgba(0,0,0,.07) 7px 9px,rgba(255,255,255,.03) 9px 13px),linear-gradient(180deg,#7a4520 0%,#5a3216 40%,#3e220d 100%);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.12);}
.arch{position:relative;margin:0 -10px 10px;padding:12px 14px 12px;border-radius:30px 30px 0 0;
  background:linear-gradient(180deg,#f8fafb 0%,#aab2bb 30%,#eef1f4 55%,#8b939c 100%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);}
.mq{position:relative;border-radius:22px 22px 10px 10px;padding:10px 8px 9px;text-align:center;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#e8283a 0%,#a50f1d 55%,#5c0610 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.5),inset 0 0 18px rgba(0,0,0,.5);}
.mq .s1{font-family:"Great Vibes",cursive;font-size:2rem;line-height:.9;color:#ffe9a0;text-shadow:0 2px 0 #5a0008,0 0 10px rgba(255,220,120,.6);}
.mq .s2{font-family:Bungee,var(--display);font-size:1.3rem;letter-spacing:.18em;line-height:1.05;margin-top:2px;
  background:linear-gradient(180deg,#fff7d6 0%,#ffd45a 50%,#c4860f 52%,#ffe28f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6));}
.bulbs{position:absolute;inset:4px;pointer-events:none;}
.bulbs i{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe0,#ffcf4a 60%,#b77a00);opacity:.45;}
.cab.won .bulbs i{animation:chase .5s steps(1) infinite;}
.cab.won .bulbs i:nth-child(2n){animation-delay:.25s;}
@keyframes chase{0%{opacity:1;box-shadow:0 0 9px #ffd45a;}50%{opacity:.3;box-shadow:none;}}
.card{position:relative;border-radius:10px;padding:7px 9px 6px;background:linear-gradient(180deg,#fbf3dc,#eadcb4);box-shadow:inset 0 0 0 2px #b88a2a,inset 0 0 0 4px #fbf3dc,inset 0 0 0 5px #b88a2a,0 3px 6px rgba(0,0,0,.4);color:#7a0a12;}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.18) 100%);}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
.pr{display:flex;align-items:center;gap:1px;height:20px;padding:0 4px;border-radius:5px;font-size:.76rem;font-weight:800;white-space:nowrap;transition:background .2s;}
.pr .sy{width:18px;height:18px;flex:none;}
.pr .tx{margin-left:3px;font-size:.7rem;}
.pr b{margin-left:auto;color:#7a0a12;font-variant-numeric:tabular-nums;font-size:.82rem;}
.pr.hit{background:rgba(232,40,58,.25);animation:prhit .6s ease-in-out 3;}
@keyframes prhit{50%{background:rgba(232,40,58,.5);}}
.gfoot{margin-top:3px;text-align:center;font-size:.66rem;font-weight:800;color:#8a5a1a;letter-spacing:.02em;}
.sk-classic .frame{margin:10px -2px 0;padding:10px 26px;border-radius:12px;background:linear-gradient(180deg,#e9edf1 0%,#9aa3ad 40%,#f2f5f7 60%,#7e8790 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.4);}
.sk-classic .reel{border-radius:10px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.6),0 0 0 3px #3a3f46,0 0 0 4px rgba(255,255,255,.5);}
.sk-classic .reel::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;
  background:linear-gradient(115deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 26%,rgba(255,255,255,0) 72%,rgba(255,255,255,.14) 86%,rgba(255,255,255,0) 100%);}
.sk-classic .reel.antic{box-shadow:0 0 0 3px #ffe066,0 0 26px 8px rgba(255,190,40,.85);}
.sk-classic .cell>svg{filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.28));}
.sk-classic .lines-svg{left:-26px;width:calc(100% + 52px);}
.ltab{position:absolute;z-index:6;width:16px;height:16px;margin-top:-8px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff,var(--c) 55%,#000 140%);font-size:.58rem;font-weight:900;color:#1a1033;opacity:.25;transition:opacity .2s,transform .2s;box-shadow:0 0 0 1.5px rgba(0,0,0,.45);}
.ltab.on{opacity:1;} .ltab.l{left:5px;} .ltab.r{right:5px;}
.ltab.win{transform:scale(1.3);box-shadow:0 0 10px var(--c),0 0 0 1.5px rgba(0,0,0,.45);}
.sk-classic .msg{margin-top:12px;}
.tray{position:relative;height:34px;margin:12px 14% 0;border-radius:6px 6px 22px 22px;overflow:hidden;
  background:linear-gradient(180deg,#2a2e33 0%,#0e1012 45%,#3a3f46 100%);box-shadow:0 0 0 3px #c9d0d7,0 0 0 4px #6b737c,inset 0 6px 10px rgba(0,0,0,.8);}
.tray i{position:absolute;bottom:3px;width:18px;height:7px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff6c0,#e6b22c 55%,#8a5d06);box-shadow:0 1px 1px rgba(0,0,0,.6);animation:traydrop .45s cubic-bezier(.3,1.4,.6,1) both;}
@keyframes traydrop{from{transform:translateY(-34px) rotate(40deg);opacity:0;}}
.cab.shake{animation:shake .14s linear;}
@keyframes shake{25%{transform:translate(0,1.5px);}75%{transform:translate(0,-1px);}}
/* the pull handle */
.handle{position:absolute;left:0;top:0;width:50px;height:300px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none;}
.handle:focus-visible .h-ball{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent);}
.h-mount{position:absolute;left:-6px;width:30px;height:64px;margin-top:-32px;border-radius:0 14px 14px 0;
  background:linear-gradient(90deg,#6b737c 0%,#eef1f4 35%,#9aa3ad 70%,#d8dde2 100%);box-shadow:2px 3px 6px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.35);}
.h-hub{position:absolute;left:4px;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#c3cad1 35%,#59616a 100%);box-shadow:0 2px 4px rgba(0,0,0,.6);z-index:2;}
.h-rod{position:absolute;left:12px;width:10px;border-radius:5px;background:linear-gradient(90deg,#59616a 0%,#f4f6f8 40%,#9aa3ad 75%,#d8dde2 100%);box-shadow:1px 0 3px rgba(0,0,0,.45);z-index:1;}
.h-ball{position:absolute;left:-1px;width:36px;height:36px;margin:-18px 0 0;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 34% 28%,#fff 0%,#ff8a8a 12%,#e01e2e 45%,#7a0410 100%);box-shadow:0 4px 8px rgba(0,0,0,.55),inset 0 -3px 6px rgba(0,0,0,.35);}
.handle.off{cursor:default;}
.handle.off .h-ball{filter:saturate(.75) brightness(.92);}

/* ── Buffalo Stampede: canyon sunset, saddle leather, turquoise ─────────── */
.sk-buffalo{--led:#ff7a2e;--led2:#ffd45a;--panel:#120804;--btn-a:#6a3f1e;--btn-b:#341b0a;--reel-bg:linear-gradient(180deg,#2b1408 0%,#3d1d0c 50%,#2b1408 100%);
  --reel-shade:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 16%,rgba(0,0,0,0) 84%,rgba(0,0,0,.45) 100%);--gap:3px;--sw:90%;--hit:#ffcf4a;
  background:linear-gradient(135deg,#ffe7a6 0%,#b9781e 22%,#ffd77a 45%,#8a4f0e 70%,#f2c46a 100%);}
.sk-buffalo .cab-in{background:radial-gradient(130% 60% at 50% 0%,rgba(255,140,40,.22),transparent 60%),linear-gradient(180deg,#3b1d0b 0%,#1f0e05 60%,#2a1407 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.6);}

  repeating-linear-gradient(90deg,rgba(255,215,106,.07) 0 2px,transparent 2px 18px),

.setup .modes.slot-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.setup .modes.slot-cards .mode{flex-direction:column;align-items:stretch;text-align:center;padding:10px 8px 12px;gap:6px;position:relative;}
.setup .modes.slot-cards .mode .e{width:auto;height:118px;border-radius:12px;background:radial-gradient(120% 90% at 50% 20%,rgba(255,255,255,.1),rgba(0,0,0,.2));}
.setup .modes.slot-cards .mode .e svg{width:100%;height:100%;}
.setup .modes.slot-cards .mode .t{font-size:1rem;}
.setup .modes.slot-cards .mode .d{font-size:.78rem;}

@media (min-width:700px) and (orientation:portrait){

}
/* ── Wide landscape: controls on the left, reels on the right ── */
@media (orientation:landscape) and (min-width:900px) and (min-height:560px){
  .stage{max-width:1080px;}
  .cab-in{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);column-gap:16px;align-items:start;}

  .sk-classic .cab-in > .frame{grid-row:2 / span 8;}
  .below{max-width:560px;margin:12px auto 0;}
}

            mid = { 'BU:3': 2, BU: 2, EA: 4, CO: 4, WO: 5, EL: 5, A: 6, K: 6, Q: 7, J: 7, T: 7, N: 7, GC: 2, SU: 2 };

    var b = S.feat ? S.feat.b : betOf(S, M), u = E.unit(M, b), T = E.total(M, b), h = '';
    function row(k, pays) {
      return '<tr><td>' + symSvg(M.id, k, 'pt-sy') + '</td>' + [5, 4, 3, 2].map(function (n) { var v = pays[n] || 0; return '<td>' + (v ? money(v * u) : '') + '</td>'; }).join('') + '</tr>';
    }
    var st = '<style>.pt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.pt th{font-size:.72rem;color:var(--text-3);text-align:right;padding:2px 4px}.pt td{text-align:right;padding:2px 4px;font-weight:800;border-top:1px solid var(--line)}.pt td:first-child{text-align:left;width:44px}.pt-sy{width:38px;height:38px;border-radius:8px;background:' +
      (M.id === 'cleo' ? '#fbf0d2' : M.id === 'buffalo' ? '#3d1d0c' : M.id === 'dragon' ? '#2a0505' : '#fffdf4') + '}.pt-note{font-size:.88rem;color:var(--text-2);margin:8px 0}</style>';
    if (M.id === 'classic') {
      h = '<p class="pt-note">Per line at ' + money(b.bet) + ' a line. Diamonds are wild and double the win (two Diamonds: x4).</p>' +
        '<table class="pt"><tr><td>' + symSvg('classic', 'D', 'pt-sy') + symSvg('classic', 'D', 'pt-sy') + symSvg('classic', 'D', 'pt-sy') + '</td><td>' + money(1000 * b.bet) + '</td></tr>' +
        [['S7', 100], ['B3', 40], ['B2', 25], ['BE', 20], ['B1', 10], ['CH', 10]].map(function (x) { return '<tr><td>' + symSvg('classic', x[0], 'pt-sy') + symSvg('classic', x[0], 'pt-sy') + symSvg('classic', x[0], 'pt-sy') + '</td><td>' + money(x[1] * b.bet) + '</td></tr>'; }).join('') +
        '<tr><td>Any three bars</td><td>' + money(5 * b.bet) + '</td></tr><tr><td>Two Diamonds</td><td>' + money(10 * b.bet) + '</td></tr><tr><td>Two Cherries</td><td>' + money(5 * b.bet) + '</td></tr><tr><td>One Cherry</td><td>' + money(2 * b.bet) + '</td></tr></table>';
    } else {
      var order = Object.keys(M.pays);
      h = '<p class="pt-note">' + (M.kind === 'ways' ? 'Pays per way at ' + b.bet + ' credits a spin. More matching symbols on a reel multiply the ways.' : 'Pays per line at ' + money(M.unitIs === 'line' ? b.bet : T / 25) + ' a line' + (M.unitIs === 'line' ? '' : ' (' + money(T) + ' a spin)') + '.') + '</p>' +
        '<table class="pt"><tr><th></th><th>5</th><th>4</th><th>3</th><th>' + (order.some(function (k) { return M.pays[k][2]; }) ? '2' : '') + '</th></tr>' + order.map(function (k) { return row(k, M.pays[k]); }).join('') + '</table>';
      if (M.id === 'buffalo') h += '<p class="pt-note">' + symSvg('buffalo', 'SU', 'pt-sy') + ' Sunset wild on reels 2, 3 and 4. In free games each is 2x or 3x, multiplied together.</p><p class="pt-note">' + symSvg('buffalo', 'GC', 'pt-sy') + ' Gold coins anywhere: 3 pay ' + money(2 * T) + ' + 8 free games, 4 pay ' + money(10 * T) + ' + 15, 5 pay ' + money(20 * T) + ' + 20. In free games 2 coins add 5 more.</p>';
      if (M.id === 'cleo') h += '<p class="pt-note">' + symSvg('cleo', 'QN', 'pt-sy') + ' Cleo is wild and doubles every line win she is part of.</p><p class="pt-note">' + symSvg('cleo', 'SP', 'pt-sy') + ' Sphinxes anywhere: 3 pay ' + money(2 * T) + ', 4 pay ' + money(10 * T) + ', 5 pay ' + money(100 * T) + ', and 3 or more give 15 free spins with every win tripled (up to 180).</p>';
      if (M.id === 'dragon') h += '<p class="pt-note">' + symSvg('dragon', 'DR', 'pt-sy') + ' The dragon is wild.</p><p class="pt-note">' + symSvg('dragon', 'FB', 'pt-sy') + ' 6 or more fireballs start Hold &amp; Spin. Fireballs are worth 1x to 15x the bet, or a jackpot: Mini ' + money(10 * T) + ', Minor ' + money(25 * T) + ', Major ' + money(100 * T) + '. Fill all 15 spots for the Grand, ' + money(1000 * T) + '.</p>';
    }
    h += '<p class="pt-note">Pays back ' + pct(RTP[M.id].rtp) + ' over the long run, worked out exactly from the reels.</p>';
    Kit.sheet({ title: M.name + ' pays', html: st + h, actions: [{ label: 'Close', cls: 'btn-soft' }] });
  }

  // ── Bankroll / session end ────────────────────────────────────────────────
  function broke() {
    Kit.sheet({
      title: 'Out of chips',
      html: '<p class="muted">Your bankroll is ' + money(Casino.balance()) + ', not enough for a spin. Start again with $1,000? This resets the bankroll for every casino game.</p>',
      actions: [{ label: 'Reset to $1,000', primary: true, onClick: function () { Casino.reset(); if (S) { shownBank = Casino.balance(); paint(); } Kit.toast('Bankroll reset to $1,000'); } }, { label: 'Not now', cls: 'btn-ghost' }]
    });
  }
  function resetBank() {
    if (busy()) { Kit.toast('Wait for the reels to stop'); return; }
    Kit.confirm('Reset bankroll to $1,000?', { ok: 'Reset', danger: true, body: 'This is shared by every casino game.' }).then(function (ok) {
      if (!ok) return;
      Casino.reset();
      if (S) { shownBank = Casino.balance(); save(); paint(); }
      Kit.toast('Bankroll reset to $1,000');
    });
  }
  function machineName(m) { return E.M[m] ? E.M[m].name : OLD_NAMES[m] || 'Slots'; }
  function highlights(st) {
    var hl = [], net = st.won - st.wagered, nm = st.name;
    if (st.jps && st.jps.GRAND) hl.push(nm + ' hit the GRAND jackpot!');
    else if (st.jackpots) hl.push(nm + ' hit ' + (st.jackpots > 1 ? st.jackpots + ' jackpots' : 'the jackpot') + '!');
    if (st.big) hl.push('Biggest win: ' + money(st.big.amt) + ' on spin ' + st.big.spin + ' (' + st.big.label + ', ' + st.big.x + 'x the bet)');
    if (st.fsTrig) hl.push((st.mode === 'buffalo' ? 'Free games' : 'Free spins') + ' ' + (st.fsTrig === 1 ? 'once' : st.fsTrig + ' times'));
    if (st.hsTrig) hl.push('Hold & Spin ' + (st.hsTrig === 1 ? 'once' : st.hsTrig + ' times'));
    if (st.stampedes) hl.push('Stampede! Five buffalo ' + (st.stampedes === 1 ? 'once' : st.stampedes + ' times'));
    if (st.spins >= 5) hl.push('Won on ' + st.hits + ' of ' + st.spins + ' spins');
    if (st.maxDry >= 8) hl.push('Longest dry spell: ' + st.maxDry + ' spins in a row');
    if (st.peakNet >= 20 && st.peakNet > net + 10) hl.push('Was up ' + money(st.peakNet) + ' at one point');
    hl.push(net > 0 ? 'Walked away up ' + money(net) : net < 0 ? 'Finished down ' + money(-net) + ' after betting ' + money(st.wagered) : 'Broke exactly even');
    return hl.slice(0, 6);
  }
  function recordSession(st) {
    var end = st.lastBank != null ? st.lastBank : Casino.balance(), net = st.won - st.wagered;
    var combos = {}, ck = Object.keys(st.combos || {}).sort(function (a, b) { return st.combos[b] - st.combos[a]; }).slice(0, 16);
    ck.forEach(function (k) { combos[k] = st.combos[k]; });
    var dt = { m: st.mode, bank: { s: st.startBank, e: end }, spins: st.spins, bet: st.wagered, won: st.won, hits: st.hits, jp: st.jackpots || 0,
      fs: st.fsTrig || 0, hs: st.hsTrig || 0, jps: st.jps && Object.keys(st.jps).length ? st.jps : null,
      big: st.bigShot || null, last: st.lastShot && (!st.bigShot || st.lastShot.no !== st.bigShot.no) ? st.lastShot : null, combos: combos };
    // keep the synced record small
    if (JSON.stringify(dt).length > 2900 && dt.last) dt.last.w = (dt.last.w || []).slice(0, 2);
    if (JSON.stringify(dt).length > 2900) dt.last = null;
    if (JSON.stringify(dt).length > 2900 && dt.big) dt.big.w = (dt.big.w || []).slice(0, 3);
    Kit.record(HKEY, {
      started: st.started, mode: machineName(st.mode),
      players: [{ name: st.name, score: net, cpu: false }], winner: null,
      summary: st.name + (net > 0 ? ' up ' : net < 0 ? ' down ' : ' even ') + (net ? money(Math.abs(net)) : '') + ' · ' + st.spins + ' spins',
      highlights: highlights(st),
      meta: { spins: st.spins, wagered: st.wagered, won: st.won, startBank: st.startBank, endBank: end, machine: st.mode },
      detail: dt
    });
  }
  function cashOut() {
    if (busy()) { Kit.toast(S && S.feat ? 'Finish the feature first' : 'Wait for the reels to stop'); return; }
    if (!S) { showSetup(); return; }
    var st = S, end = Casino.balance(), net = st.won - st.wagered;
    if (st.spins > 0) recordSession(st);
    clearSave(); stopCycle();
    if (!st.spins) { showSetup(); return; }
    var name = st.name, mode = st.mode;
    S = null;
    showSetup();
    Kit.win({
      icon: net >= 0 ? 'trophy' : 'coins',
      title: net > 0 ? 'Up ' + money(net) + '!' : net < 0 ? 'Down ' + money(-net) : 'Broke even',
      sub: st.spins + ' spins · ' + (st.big ? 'best win ' + money(st.big.amt) + ' · ' : '') + 'bankroll ' + money(end),
      lose: net < 0,
      againLabel: 'Play again',
      again: function () { start(mode, name); },
      extra: [{ label: 'Change machine', onClick: function () {} }]
    });
  }

  // Keyboard: space or enter spins
  document.addEventListener('keydown', function (e) {
    if (!S || !dom.spin || document.querySelector('.k-scrim,.k-win,.k-sheet')) return;
    if (e.code === 'Space' || e.key === 'Enter') {
      if (e.target && /INPUT|TEXTAREA|BUTTON/.test(e.target.tagName) && e.target !== dom.spin) return;
      e.preventDefault(); if (counting) { skipNow = true; return; } onSpin();
    }
  });
  function refreshBank() { if (S && !busy() && !counting && dom.mCredit) { shownBank = Casino.balance(); paint(); } }
  window.addEventListener('pageshow', refreshBank);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshBank(); });

  // ── Boot: resume a session, or close out a stale one ──────────────────────
  var saved = load();
  if (saved && saved.mode && !E.M[saved.mode]) {
    // a machine that has been retired (Royal Fruits): save its session to history, then pick again
    try { if (saved.spins > 0) recordSession(saved); } catch (e) { console.warn(e); }
    clearSave(); showSetup();
  } else if (saved && saved.mode && E.M[saved.mode]) {
    if (!saved.combos) saved.combos = {};
    if (!saved.jps) saved.jps = {};
    if (Date.now() - (saved.lastAt || 0) > 6 * 3600 * 1000) {
      if (saved.feat) settleFeature(saved);
      if (saved.spins > 0) recordSession(saved);
      clearSave(); showSetup();
    } else { S = saved; Kit.gameStart(); render(); }
  } else showSetup();
})();
</script>
</body>

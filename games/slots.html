<style>
body{overscroll-behavior:none;background:radial-gradient(ellipse at 50% 0%,#1a0a30 0%,#0d0818 60%);}
.slots-wrap{max-width:400px;margin:0 auto;padding:0 12px 60px;}
/* Machine */
.machine{background:linear-gradient(145deg,#2a1a4a,#1a0f35);border:3px solid #6b46c1;
  border-radius:20px;padding:16px;box-shadow:0 8px 32px rgba(107,70,193,.3),inset 0 2px 0 rgba(255,255,255,.08);
  margin-bottom:14px;position:relative;}
/* Reels - 3 rows × 3 reels */
.reels-container{position:relative;margin-bottom:12px;}
.reels{display:flex;gap:6px;justify-content:center;}
.reel-wrap{flex:1;max-width:96px;border-radius:10px;background:#0d0818;border:2px solid rgba(107,70,193,.4);
  overflow:hidden;height:252px;position:relative;box-shadow:inset 0 2px 10px rgba(0,0,0,.6);}
.reel-track{position:absolute;top:0;left:0;right:0;}
.reel-sym{height:84px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;}
/* Row highlight borders */
.reels-container::before,.reels-container::after{content:'';position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.08);pointer-events:none;z-index:5;}
.reels-container::before{top:84px;}
.reels-container::after{top:168px;}
/* Payline canvas — always sits above reels to show active lines */
#payline-canvas{position:absolute;inset:0;pointer-events:none;z-index:6;}
/* Payline selector */
.paylines-row{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap;}
.pl-btn{padding:5px 12px;border-radius:20px;font-size:.72rem;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);transition:all .15s;}
.pl-btn.active{background:rgba(124,58,237,.25);border-color:#7c3aed;color:#c4b5fd;}
/* Payline color dots in the selector */
.pl-legend{display:flex;gap:8px;justify-content:center;align-items:center;margin:6px 0 10px;font-size:.62rem;color:rgba(255,255,255,.5);flex-wrap:wrap;}
.pl-legend-item{display:inline-flex;align-items:center;gap:5px;}
.pl-legend-swatch{width:14px;height:3px;border-radius:2px;}
/* Pay table */
.pay-table{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;
  padding:10px 12px;margin-bottom:12px;font-size:.75rem;}
.pay-row{display:flex;justify-content:space-between;padding:2px 0;color:rgba(255,255,255,.55);}
.pay-row.jackpot{color:#f5c842;font-weight:700;}
/* Bankroll */
.slots-bank{display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.05);border-radius:10px;padding:8px 14px;margin-bottom:10px;}
.slots-bank-num{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:900;color:#f5c842;}
/* Bet + lines info */
.bet-row{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:10px;}
.bet-adj{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;user-select:none;}
.bet-adj:hover{background:rgba(255,255,255,.2);}
.bet-adj:active{transform:scale(.94);}
.bet-val{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;color:#fff;min-width:76px;text-align:center;line-height:1;}
/* Prominent total bet display */
.total-bet-pill{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(135deg,rgba(245,200,66,.18),rgba(245,200,66,.06));
  border:1.5px solid rgba(245,200,66,.45);
  border-radius:12px;padding:10px 16px;margin:4px 0 12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 10px rgba(245,200,66,.12);
}
.total-bet-lbl{
  font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.15em;
  color:rgba(245,200,66,.75);line-height:1.1;
}
.total-bet-sub{
  font-size:.62rem;font-weight:600;color:rgba(255,255,255,.5);margin-top:2px;
}
.total-bet-amount{
  font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;
  color:#f5c842;line-height:1;letter-spacing:.01em;
  text-shadow:0 2px 10px rgba(245,200,66,.35);
}
/* Spin button */
.spin-btn{width:100%;padding:14px;border-radius:14px;font-size:1.1rem;font-weight:800;cursor:pointer;
  border:none;font-family:'Inter',sans-serif;letter-spacing:.04em;transition:all .15s;
  background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;
  box-shadow:0 4px 20px rgba(124,58,237,.4);}
.spin-btn:hover:not(:disabled){transform:scale(1.02);}
.spin-btn:disabled{opacity:.5;cursor:not-allowed;}
/* Result */
.slots-result{text-align:center;font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;
  min-height:36px;margin-bottom:8px;transition:all .3s;}
.slots-result.win{color:#22c55e;animation:bounce-in .4s ease both;}
.slots-result.jackpot{color:#f5c842;animation:jackpot-flash 1.5s ease;}
.slots-result.loss{color:rgba(255,255,255,.3);}
@keyframes bounce-in{0%{transform:scale(.6);opacity:0}80%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes jackpot-flash{0%,100%{color:#f5c842}50%{color:#fff;text-shadow:0 0 20px #f5c842;}}
</style>
</head>

<div class="page" style="padding:10px 0 60px;">
<div class="slots-wrap">

<div class="slots-bank">
  <div>
    <div style="font-size:.62rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;">Balance</div>

  </div>
  <button class="btn btn-outline btn-sm" id="slots-reset">↺ Reset Bank</button>

<div class="machine">
  <!-- Payline selectors -->
  <div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35);text-align:center;margin-bottom:6px;">Paylines</div>
  <div class="paylines-row">
    <button class="pl-btn" data-lines="1">1 Line<br><span style="font-size:.6rem;opacity:.7">Center</span></button>
    <button class="pl-btn active" data-lines="3">3 Lines<br><span style="font-size:.6rem;opacity:.7">Horizontal</span></button>

  <!-- Reels -->
  <div class="reels-container" id="reels-container">
    <div class="reels" id="reels">
      <div class="reel-wrap"><div class="reel-track" id="reel-0"></div></div>
      <div class="reel-wrap"><div class="reel-track" id="reel-1"></div></div>

  <div class="pay-row jackpot"><span>🍀🍀🍀</span><span>×250 JACKPOT</span></div>

  <div class="pay-row"><span>7️⃣7️⃣7️⃣</span><span>×25</span></div>
  <div class="pay-row"><span>🔔🔔🔔</span><span>×15</span></div>
  <div class="pay-row"><span>🍇🍇🍇</span><span>×10</span></div>
  <div class="pay-row"><span>🍊🍊🍊</span><span>×8</span></div>
  <div class="pay-row"><span>🍋🍋🍋</span><span>×5</span></div>
  <div class="pay-row"><span>🍒🍒🍒</span><span>×4</span></div>
  <div class="pay-row"><span>Any two 🍒</span><span>×2</span></div>
  <div class="pay-row"><span>Any two matching</span><span>×1.5</span></div>
</div>

<script>
'use strict';
const SYMS=['🍒','🍒','🍒','🍋','🍋','🍊','🍊','🍇','🍇','🔔','🔔','7️⃣','⭐','💎','🍀'];
const PAYOUTS={'🍀🍀🍀':250,'💎💎💎':100,'⭐⭐⭐':50,'7️⃣7️⃣7️⃣':25,'🔔🔔🔔':15,'🍇🍇🍇':10,'🍊🍊🍊':8,'🍋🍋🍋':5,'🍒🍒🍒':4};
const BETS=[5,10,25,50,100];
let betIdx=1, spinning=false, activelines=3;

// Payline definitions: each line has a color + the 3 rows it passes through
// Row 0 = top, row 1 = center, row 2 = bottom
const PAYLINES = [
  {idx:0, name:'Top',        color:'#22c55e', rows:[0,0,0]},
  {idx:1, name:'Center',     color:'#f5c842', rows:[1,1,1]},
  {idx:2, name:'Bottom',     color:'#ef4444', rows:[2,2,2]},
  {idx:3, name:'Diagonal ↘', color:'#a855f7', rows:[0,1,2]},
  {idx:4, name:'Diagonal ↗', color:'#06b6d4', rows:[2,1,0]},
];
const LINE_MAP = {1:[1], 3:[0,1,2], 5:[0,1,2,3,4]};

function weightedPick(){ return SYMS[Math.floor(Math.random()*SYMS.length)]; }
function updateBank(){ document.getElementById('slots-balance').textContent='$'+Casino.balance().toLocaleString(); }
function updateBetDisplay(){
  const bet=BETS[betIdx];
  document.getElementById('bet-val').textContent='$'+bet;
  document.getElementById('total-bet-amount').textContent='$'+(bet*activelines).toLocaleString();
  document.getElementById('total-bet-sub').textContent=
    `${activelines} line${activelines>1?'s':''} × $${bet}`;
  renderLegend();
  drawPaylines([]);
}

function renderLegend(){
  const host = document.getElementById('pl-legend');
  if(!host) return;
  const activeIdxs = LINE_MAP[activelines];
  host.innerHTML = activeIdxs.map(i => {
    const pl = PAYLINES[i];
    return `<span class="pl-legend-item">
      <span class="pl-legend-swatch" style="background:${pl.color}"></span>${pl.name}
    </span>`;
  }).join('');
}

// Build 3-row reel strip and get top/middle/bottom results
function buildStrip(finalRow){
  // finalRow = [top, mid, bot] for this reel
  const strip=[];
  for(let i=0;i<15;i++) strip.push(SYMS[Math.floor(Math.random()*SYMS.length)]);
  strip.push(finalRow[0],finalRow[1],finalRow[2]); // last 3 = visible result
  return strip;
}

function spin(){
  if(spinning)return;
  const bet=BETS[betIdx];
  const totalBet=bet*activelines;
  if(!Casino.bet(totalBet)){
    document.getElementById('slots-result').innerHTML='<span style="color:#f87171">Not enough balance!</span>';
    return;
  }
  spinning=true;
  document.getElementById('spin-btn').disabled=true;
  document.getElementById('slots-result').textContent='';
  // Reset winning highlights (redraw baseline paylines)
  drawPaylines([]);

  // Generate 3 rows of results for each reel
  const reelResults=[];
  for(let r=0;r<3;r++){
    reelResults.push([weightedPick(),weightedPick(),weightedPick()]);
  }
  // reelResults[reel][row]

  [0,1,2].forEach((ri,delay)=>{
    const track=document.getElementById(`reel-${ri}`);
    const finalCol=[reelResults[ri][0],reelResults[ri][1],reelResults[ri][2]];
    const strip=buildStrip(finalCol);
    track.innerHTML=strip.map(s=>`<div class="reel-sym">${s}</div>`).join('');

    // Each reel sym = 84px, show last 3 (indices 15,16,17)
    const visibleStart=15*84;
    const dur=900+delay*300;
    const start=performance.now();
    track.style.top='0px';

    function frame(now){
      const t=Math.min(1,(now-start)/dur);
      const ease=t<0.75?t/0.75:1-(t-0.75)/0.25*0.04;
      const y=-(visibleStart*ease);
      track.style.top=y+'px';
      if(t<1){requestAnimationFrame(frame);}
      else{
        track.style.top=(-visibleStart)+'px';
        if(delay===2) setTimeout(()=>resolveResult(reelResults,bet,totalBet),250);
      }
    }
    setTimeout(()=>requestAnimationFrame(frame),delay*80);
  });
}

function getRow(reelResults, row){
  // reelResults[reel][row]
  return [reelResults[0][row], reelResults[1][row], reelResults[2][row]];
}

function scoreLine(line, bet){
  const key=line.join('');
  if(PAYOUTS[key]) return PAYOUTS[key]*bet;
  if(line[0]==='🍒'&&line[1]==='🍒') return 2*bet;
  if(line[0]==='🍒'&&line[2]==='🍒') return 2*bet;
  if(line[1]==='🍒'&&line[2]==='🍒') return 2*bet;
  if(line[0]===line[1]||line[1]===line[2]||line[0]===line[2]) return Math.floor(1.5*bet);
  return 0;
}

function resolveResult(reelResults, bet, totalBet){
  // Check each active payline
  // Lines: 0=top, 1=center, 2=bottom, 3=diag ↘, 4=diag ↗
  const lineMap={
    1:[1],              // center only
    3:[0,1,2],          // all 3 rows
    5:[0,1,2,3,4]       // rows + diagonals
  };

  const lines=lineMap[activelines];
  let totalWin=0;
  const winningLines=[];

  lines.forEach(lineIdx=>{
    let combo;
    if(lineIdx<=2){
      combo=getRow(reelResults,lineIdx);
    } else if(lineIdx===3){
      // Diagonal top-left to bottom-right
      combo=[reelResults[0][0],reelResults[1][1],reelResults[2][2]];
    } else {
      // Diagonal bottom-left to top-right
      combo=[reelResults[0][2],reelResults[1][1],reelResults[2][0]];
    }
    const w=scoreLine(combo,bet);
    if(w>0){totalWin+=w;winningLines.push({lineIdx,combo,w});}
  });

  // Highlight winning lines (draw them prominently on the canvas)
  const winningIdxs = winningLines.map(l => l.lineIdx);
  drawPaylines(winningIdxs);

  const resultEl=document.getElementById('slots-result');
  if(totalWin>0){
    Casino.win(totalWin);
    const net=totalWin-totalBet;
    const maxMult=Math.max(...winningLines.map(l=>scoreLine(l.combo,bet)/bet));
    const cls=maxMult>=50?'jackpot':'win';
    resultEl.textContent=maxMult>=250?`🎉 JACKPOT! +$${net}`:maxMult>=50?`🔥 Big Win! +$${net}`:winningLines.length>1?`✨ ${winningLines.length} wins! +$${net}`:`Win! +$${net}`;
    resultEl.className='slots-result '+cls;
  } else {
    resultEl.textContent='No win';
    resultEl.className='slots-result loss';
  }

  updateBank();
  spinning=false;
  document.getElementById('spin-btn').disabled=false;
}

// Draw all currently-active paylines. Winners (indices in `winningIdxs`) are
// rendered thick + glowing; non-winners render as thin guides so the player
// can always see where the active paylines are before spinning.
let _winPulsePhase = 0;
let _winPulseTimer = null;

function drawPaylines(winningIdxs){
  const c = document.getElementById('payline-canvas');
  if(!c) return;
  const container = document.getElementById('reels-container');
  c.width = container.offsetWidth;
  c.height = 252;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);

  const reels = document.getElementById('reels');
  const rwraps = reels.querySelectorAll('.reel-wrap');
  if(!rwraps.length) return;
  const cRect = c.getBoundingClientRect();
  const xs = [];
  rwraps.forEach(w => {
    const r = w.getBoundingClientRect();
    xs.push(r.left - cRect.left + r.width / 2);
  });
  const cellH = 84;

  const activeIdxs = LINE_MAP[activelines];
  const winSet = new Set(winningIdxs || []);

  // Draw non-winning active lines first (as background guides)
  activeIdxs.forEach(idx => {
    if(winSet.has(idx)) return;
    drawLine(ctx, PAYLINES[idx], xs, cellH, /*winning*/false);
  });
  // Then draw winning lines prominently on top
  activeIdxs.forEach(idx => {
    if(!winSet.has(idx)) return;
    drawLine(ctx, PAYLINES[idx], xs, cellH, /*winning*/true);
  });

  // Animate the pulse for winning lines
  if(winningIdxs && winningIdxs.length){
    if(!_winPulseTimer){
      _winPulsePhase = 0;
      _winPulseTimer = setInterval(() => {
        _winPulsePhase = (_winPulsePhase + 1) % 60;
        drawPaylinesAnimated(winningIdxs);
      }, 40);
    }
  } else if(_winPulseTimer){
    clearInterval(_winPulseTimer);
    _winPulseTimer = null;
  }
}

function drawPaylinesAnimated(winningIdxs){
  const c = document.getElementById('payline-canvas');
  if(!c) return;
  const ctx = c.getContext('2d');
  const reels = document.getElementById('reels');
  const rwraps = reels.querySelectorAll('.reel-wrap');
  if(!rwraps.length) return;
  const cRect = c.getBoundingClientRect();
  const xs = [];
  rwraps.forEach(w => {
    const r = w.getBoundingClientRect();
    xs.push(r.left - cRect.left + r.width / 2);
  });
  const cellH = 84;
  ctx.clearRect(0, 0, c.width, c.height);
  const activeIdxs = LINE_MAP[activelines];
  const winSet = new Set(winningIdxs || []);
  const pulse = 0.65 + 0.35 * Math.sin(_winPulsePhase * 0.1);
  // Non-winners dim
  activeIdxs.forEach(idx => {
    if(winSet.has(idx)) return;
    drawLine(ctx, PAYLINES[idx], xs, cellH, false);
  });
  // Winners pulse
  activeIdxs.forEach(idx => {
    if(!winSet.has(idx)) return;
    drawLine(ctx, PAYLINES[idx], xs, cellH, true, pulse);
  });
}

function drawLine(ctx, pl, xs, cellH, winning, pulse){
  ctx.save();
  ctx.beginPath();
  pl.rows.forEach((row, i) => {
    const y = row * cellH + cellH / 2;
    if(i === 0) ctx.moveTo(xs[i], y);
    else ctx.lineTo(xs[i], y);
  });
  // Extend the line slightly past the outer reels so it's clearly readable
  const firstY = pl.rows[0] * cellH + cellH / 2;
  const lastY  = pl.rows[pl.rows.length - 1] * cellH + cellH / 2;
  // (The ends stay inside the reel area to avoid clipping — the path above
  // already runs from reel 1 center to reel 3 center, which reads clearly.)

  if(winning){
    ctx.strokeStyle = pl.color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = pl.color;
    ctx.shadowBlur = 14 * (pulse != null ? pulse : 1);
    ctx.globalAlpha = 0.95 * (pulse != null ? pulse : 1);
    ctx.stroke();
    // Second pass for extra glow
    ctx.globalAlpha = 0.4 * (pulse != null ? pulse : 1);
    ctx.lineWidth = 10;
    ctx.stroke();
  } else {
    ctx.strokeStyle = pl.color;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.55;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
  }
  ctx.restore();

  // Draw a small color dot at each reel center for that line
  pl.rows.forEach((row, i) => {
    const y = row * cellH + cellH / 2;
    ctx.save();
    ctx.beginPath();
    ctx.arc(xs[i], y, winning ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = pl.color;
    ctx.globalAlpha = winning ? 0.95 * (pulse != null ? pulse : 1) : 0.7;
    ctx.fill();
    ctx.restore();
  });
}

// Controls
document.querySelectorAll('.pl-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.pl-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    activelines=+b.dataset.lines;
    updateBetDisplay();
  });
});
document.getElementById('bet-down').addEventListener('click',()=>{betIdx=Math.max(0,betIdx-1);updateBetDisplay();});
document.getElementById('bet-up').addEventListener('click',()=>{betIdx=Math.min(BETS.length-1,betIdx+1);updateBetDisplay();});
document.getElementById('spin-btn').addEventListener('click',spin);
document.getElementById('slots-reset').addEventListener('click',()=>{
  if(confirm('Reset casino bankroll to $1,000?')){
    try{localStorage.setItem('casino_bank','1000');if(typeof FGHSync!=='undefined')FGHSync.noteWrite('casino_bank');}catch(e){}
    updateBank();
  }
});

updateBank();
updateBetDisplay();
// Ensure the payline canvas paints once layout is ready (fonts/reels measured)
requestAnimationFrame(() => requestAnimationFrame(() => drawPaylines([])));

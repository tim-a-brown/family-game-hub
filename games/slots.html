<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
.stage{max-width:500px;padding-top:0;}
.bankrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 10px;font-weight:800;font-size:.92rem;color:var(--text-2);}
.bankrow b{color:var(--text);font-variant-numeric:tabular-nums;}
.bankrow .up{color:var(--green);} .bankrow .down{color:var(--red);}

/* ── Cabinet: chrome bezel around a dark lacquered body ─────────────────── */
.cab{position:relative;border-radius:30px;padding:3px;
  background:linear-gradient(135deg,#f4f6f8 0%,#97a0aa 20%,#eef1f4 42%,#6b737d 68%,#d5dbe0 100%);
  box-shadow:0 22px 44px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.5);}
.cab-in{border-radius:27px;padding:10px 12px 14px;
  background:radial-gradient(120% 50% at 50% 0%,rgba(255,255,255,.07),transparent 60%),linear-gradient(180deg,#262030 0%,#141119 55%,#1c1824 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.08);}
.marquee{text-align:center;padding:2px 0 8px;}
.marquee h2{font-family:var(--display);font-weight:400;font-size:1.65rem;letter-spacing:.07em;line-height:1.05;margin:0;
  background:linear-gradient(180deg,#fff7d6 0%,#ffd45a 46%,#c4860f 54%,#ffe28f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.65));}
.lights{display:flex;justify-content:center;gap:10px;margin-top:5px;}
.lights i{width:5px;height:5px;border-radius:50%;background:#ffd45a;opacity:.3;}
.cab.won .lights i{animation:chase .5s steps(1) infinite;}
.cab.won .lights i:nth-child(2n){animation-delay:.25s;}
@keyframes chase{0%{opacity:1;box-shadow:0 0 8px #ffd45a;}50%{opacity:.25;box-shadow:none;}}

/* Pay table glass */
.glass{position:relative;border-radius:14px;padding:7px 10px 6px;overflow:hidden;
  background:linear-gradient(180deg,#121a36,#0a0f22);box-shadow:inset 0 0 0 1px rgba(255,212,90,.35),inset 0 6px 16px rgba(0,0,0,.55);}
.glass::after,.window::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.02) 28%,rgba(255,255,255,0) 60%,rgba(255,255,255,.05) 100%);}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;}
.pr{display:flex;align-items:center;gap:2px;height:21px;padding:0 4px;border-radius:6px;font-size:.78rem;font-weight:800;color:rgba(255,255,255,.75);white-space:nowrap;transition:background .2s;}
.pr .sy{width:19px;height:19px;flex:none;}
.pr .tx{margin-left:3px;font-size:.72rem;letter-spacing:.02em;}
.pr b{margin-left:auto;color:#ffd45a;font-variant-numeric:tabular-nums;font-size:.84rem;}
.pr.hit{background:rgba(255,212,90,.22);color:#fff;animation:prhit .6s ease-in-out 3;}
@keyframes prhit{50%{background:rgba(255,212,90,.45);}}
.pays5{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
.pays5 table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.pays5 th{font-size:.64rem;font-weight:900;color:rgba(255,255,255,.45);letter-spacing:.06em;text-align:right;padding:0 2px;}
.pays5 td{height:22px;padding:0 2px;text-align:right;font-size:.8rem;font-weight:800;color:#ffd45a;border-radius:5px;}
.pays5 td:first-child{text-align:left;width:24px;}
.pays5 td .sy{width:19px;height:19px;display:block;}
.pays5 td.hit{background:rgba(255,212,90,.35);color:#fff;}
.pays5 td.na{color:rgba(255,255,255,.25);}
.gfoot{margin-top:4px;text-align:center;font-size:.7rem;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.02em;}

/* Reel window */
.window{position:relative;margin:10px 0 8px;padding:6px 22px;border-radius:16px;
  background:linear-gradient(180deg,#09080d,#1b1824);box-shadow:inset 0 0 0 2px #000,0 0 0 2px rgba(255,255,255,.14),inset 0 10px 20px rgba(0,0,0,.6);}
.reels{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;}
.reel{position:relative;height:calc(var(--cell) * 3);overflow:hidden;border-radius:6px;
  background:linear-gradient(90deg,#cfc8b8 0%,#fffdf6 18%,#fffdf6 82%,#cfc8b8 100%);}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,6,20,.55) 0%,rgba(10,6,20,0) 24%,rgba(10,6,20,0) 76%,rgba(10,6,20,.55) 100%);}
.track{position:absolute;left:0;right:0;top:0;transform:translate3d(0,calc(var(--p,0) * var(--cell) * -1),0);will-change:transform;}
.track.fast{filter:blur(1.3px);}
.cell{position:relative;height:var(--cell);display:grid;place-items:center;}
.cell svg{width:74%;height:74%;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.28));}
.cell.hit::before{content:"";position:absolute;inset:3px;border-radius:8px;box-shadow:inset 0 0 0 3px #ffc83d,0 0 14px rgba(255,200,61,.7);animation:hitpulse .8s ease-in-out infinite;}
.cell.hit svg{animation:hitsym .8s ease-in-out infinite;}
@keyframes hitpulse{50%{box-shadow:inset 0 0 0 3px #fff3b0,0 0 22px rgba(255,200,61,.95);}}
@keyframes hitsym{50%{transform:scale(1.1);}}
.lines-svg{position:absolute;top:0;bottom:0;left:-22px;width:calc(100% + 44px);height:100%;pointer-events:none;overflow:visible;z-index:2;}
.ltab{z-index:3;}
.lines-svg polyline{fill:none;stroke-linecap:round;stroke-linejoin:round;}
.ltab{position:absolute;width:17px;height:17px;margin-top:-8.5px;border-radius:50%;display:grid;place-items:center;background:var(--c);
  font-size:.62rem;font-weight:900;color:#1a1033;opacity:.22;transition:opacity .2s,transform .2s;}
.ltab.on{opacity:1;}
.ltab.l{left:3px;} .ltab.r{right:3px;}
.ltab.win{transform:scale(1.25);box-shadow:0 0 10px var(--c);}

/* Message strip + meters */
.msg{height:28px;margin:0 0 8px;border-radius:8px;background:#06060a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.06em;
  color:#ffb347;text-shadow:0 0 6px rgba(255,140,40,.55);text-transform:uppercase;white-space:nowrap;overflow:hidden;}
.msg.good{color:#ffe07a;text-shadow:0 0 8px rgba(255,210,80,.8);}
.meters{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:6px;margin-bottom:10px;}
.meter{border-radius:9px;padding:3px 6px 4px;text-align:center;background:#06060a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);min-width:0;}
.meter small{display:block;font-size:.66rem;font-weight:900;letter-spacing:.14em;color:#8d86a0;line-height:1.3;}
.meter b{display:block;font-family:var(--mono);font-size:1.12rem;line-height:1.25;color:#ff5a3c;text-shadow:0 0 8px rgba(255,90,60,.6);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meter.w b{color:#ffd45a;text-shadow:0 0 8px rgba(255,212,90,.7);}

/* Machine buttons */
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.step{display:flex;align-items:center;border-radius:14px;padding:3px;background:linear-gradient(180deg,#0d0b12,#1e1a28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
.step button{width:40px;height:40px;flex:none;border:0;border-radius:11px;color:#fff;font-size:1.3rem;font-weight:900;cursor:pointer;
  background:linear-gradient(180deg,#4a4458,#2a2533);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 0 #000;}
.step button:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);}
.step button:disabled{opacity:.35;}
.step .mid{flex:1;text-align:center;min-width:0;}
.step .mid small{display:block;font-size:.66rem;font-weight:900;letter-spacing:.12em;color:#8d86a0;text-transform:uppercase;line-height:1.2;}
.step .mid b{display:block;font-size:1.08rem;font-weight:900;color:#fff;line-height:1.2;}
.ctl2{display:grid;grid-template-columns:1fr 1.9fr;gap:8px;}
.mbtn{min-height:58px;border:0;border-radius:16px;cursor:pointer;font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;color:#fff;text-transform:uppercase;
  background:linear-gradient(180deg,#5b5470,#2e2939);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.35),0 3px 0 #000;transition:transform .08s;}
.mbtn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 #000;}
.mbtn:disabled{opacity:.4;}
.mbtn.spin{font-size:1.45rem;color:#3a1600;
  background:radial-gradient(120% 90% at 50% 10%,#fff3c0 0%,#ffc83d 38%,#e0870e 80%,#b45f05 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(120,50,0,.45),0 4px 0 #5a2c00,0 0 18px rgba(255,200,61,.25);}
.mbtn.spin small{display:block;font-family:var(--font);font-size:.72rem;font-weight:900;letter-spacing:.04em;opacity:.75;text-transform:none;}
.mbtn.spin.stop{background:radial-gradient(120% 90% at 50% 10%,#ffd0d0 0%,#ff5c6a 40%,#c41f2f 85%);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(80,0,0,.45),0 4px 0 #4a0008;}
.below{display:flex;gap:8px;margin-top:14px;}
.below .btn{flex:1;white-space:nowrap;padding-left:10px;padding-right:10px;}

/* Coins */
.coins{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden;}
.coins i{position:absolute;top:-44px;width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6c0 0%,#f6c537 45%,#a8730c 100%);
  box-shadow:inset 0 0 0 3px rgba(150,98,6,.55),0 3px 5px rgba(0,0,0,.4);animation:coinfall 1.9s cubic-bezier(.35,.05,.75,1) forwards;}
.coins i::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid rgba(150,98,6,.5);}
@keyframes coinfall{to{transform:translateY(calc(100vh + 90px)) rotateY(900deg);}}
.cell .blank{display:block;}
</style>
</head>

<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'slots_state', HKEY = 'slots', PREFS = 'slots_prefs';

  // ── Money ─────────────────────────────────────────────────────────────────
  function money(n) { n = Math.round(n); return (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString(); }
  function signed(n) { n = Math.round(n); return (n > 0 ? '+$' : n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString(); }

  // ── Honest RNG: every reel stop equally likely (crypto when available) ────
  function rnd(n) {
    var c = window.crypto || window.msCrypto;
    if (c && c.getRandomValues) {
      var a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n, x;
      do { c.getRandomValues(a); x = a[0]; } while (x >= lim);
      return x % n;
    }
    return Math.floor(Math.random() * n);
  }

  // ── Machines ──────────────────────────────────────────────────────────────
  var NAMES = { D: 'Diamond', W: 'Diamond', S7: 'Seven', B3: 'Triple Bar', B2: 'Double Bar', B1: 'Bar', BE: 'Bell', CH: 'Cherry', PL: 'Plum', OR: 'Orange', LE: 'Lemon' };
  var PLURAL = { D: 'Diamonds', W: 'Diamonds', S7: 'Sevens', B3: 'Triple Bars', B2: 'Double Bars', B1: 'Bars', BE: 'Bells', CH: 'Cherries', PL: 'Plums', OR: 'Oranges', LE: 'Lemons' };
  var WORD = ['', 'One', 'Two', 'Three', 'Four', 'Five'];
  var LINE_COLORS = ['#ffd45a', '#ff5c9a', '#4da3ff', '#3ddc84', '#ff8a3d', '#b89bff', '#2fd3c0', '#ff4d5e', '#e8e8f0', '#c6e14a'];

  // Classic: physical strips of 32 stops, symbols separated by blanks ("_").
  function withBlanks(list, len) {
    var out = [];
    list.forEach(function (s) { out.push(s, '_'); });
    while (out.length < len) out.push('_');
    return out;
  }
  var CLASSIC_STRIPS = [
    withBlanks(['S7', 'B1', 'CH', 'B2', 'BE', 'B1', 'B3', 'D', 'B1', 'B2', 'CH', 'S7', 'B1', 'B3', 'BE', 'B2'], 32),
    withBlanks(['S7', 'B1', 'B2', 'CH', 'BE', 'B1', 'B3', 'B2', 'D', 'B1', 'CH', 'B3', 'BE', 'B1', 'B2'], 32),

    var tb = totalBet(), bal = Casino.balance();
    if (bal < tb) {
      // Lower the bet to something affordable, or offer a fresh bankroll
      var ok = false;
      for (var li = S.li; li >= 0 && !ok; li--) for (var bi = S.bi; bi >= 0; bi--) if (M.lineOpts[li] * M.bets[bi] <= bal) { S.li = li; S.bi = bi; ok = true; break; }
      if (ok) { Kit.toast('Bet lowered to ' + money(totalBet()) + ' to fit your bankroll'); renderPays(); paintControls(); save(); }
      else broke();
      Kit.haptic('error');
      return;
    }
    if (!Casino.bet(tb)) { broke(); return; }
    clearWins();
    shownBank = bal - tb;
    // Decide the result first, settle it, then let the reels show it
    var stops = M.strips.map(function (st) { return rnd(st.length); });
    var res = evaluate(stops);
    if (res.total > 0) Casino.win(res.total);
    tally(res, tb);
    S.stops = stops; S.last = res;
    save();
    spinning = true; dom.svg.dataset.win = '';
    paintControls();
    dom.mWin.textContent = '0';
    msg('Good luck!');
    Kit.sfx('whoosh'); Kit.haptic('medium');
    animate(stops, function () {
      spinning = false; slam = null;
      showWins(res, false);
    });
  }

  function evaluate(stops) {
    var wins = [], total = 0, b = bet();
    for (var li = 0; li < lines(); li++) {
      var ln = M.lines[li];
      var syms = ln.map(function (row, ri) { var st = M.strips[ri]; return st[(stops[ri] + row) % st.length]; });
      var w = M.evalLine(syms);
      if (w) { wins.push({ li: li, k: w.k, label: w.label, m: w.m, amt: w.m * b, cells: w.cells, jackpot: !!w.jackpot }); total += w.m * b; }
    }
    return { stops: stops, wins: wins, total: total, bet: b, lines: lines(), tb: lines() * b };
  }

  function tally(res, tb) {
    S.spins++; S.wagered += tb; S.won += res.total;
    var bal = Casino.balance();
    S.lastBank = bal; S.peakNet = Math.max(S.peakNet || 0, S.won - S.wagered);
    if (res.total > 0) {
      S.hits++; S.dry = 0;
      res.wins.forEach(function (w) { S.combos[w.k] = (S.combos[w.k] || 0) + 1; if (w.jackpot) S.jackpots++; });
      var top = res.wins.slice().sort(function (a, b) { return b.amt - a.amt; })[0];
      if (!S.big || res.total > S.big.amt) S.big = { amt: res.total, label: top.label, spin: S.spins, x: Math.round(res.total / tb) };
      if (res.total >= tb * 10) S.bigWins++;
    } else { S.dry++; S.maxDry = Math.max(S.maxDry, S.dry); }
  }

  function animate(stops, done) {
    var n = R.length, now = performance.now(), V = n === 3 ? 15 : 19;
    var base = n === 3 ? 650 : 520, stag = n === 3 ? 420 : 260, D = n === 3 ? 2.4 : 2.6;
    R.forEach(function (r, i) {
      r.state = 'wind'; r.t0 = now + i * 70; r.stopAt = r.t0 + base + i * stag; r.target = stops[i]; r.vel = 0;
    });
    slam = function () {
      var t = performance.now();
      R.forEach(function (r, i) { if (r.state === 'wind' || r.state === 'run') r.stopAt = Math.min(r.stopAt, t + i * 110); });
      Kit.haptic('light');
    };
    var last = now;
    cancelAnimationFrame(raf);
    function frame(t) {
      var dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
      var pending = false;
      R.forEach(function (r, i) {
        if (r.state === 'done') return;
        pending = true;
        if (t < r.t0) return;
        if (r.state === 'wind') { if (t - r.t0 < 110) { setP(r, r.p + 2.4 * dt); return; } r.state = 'run'; }
        if (r.state === 'run') {
          r.vel = Math.min(V, r.vel + V * dt / 0.22);
          if (r.vel > V * 0.6) r.track.classList.add('fast');
          var prevOk = i === 0 || R[i - 1].state === 'land' || R[i - 1].state === 'done';
          if (t >= r.stopAt && r.vel >= V * 0.98 && prevOk) {
            // Take over at full speed and ease into the chosen stop with a small bounce
            r.land = { from: r.target + D, t0: t, d: 4.2 * D / V * 1000 };
            r.state = 'land';
          } else { setP(r, r.p - r.vel * dt); return; }
        }
        if (r.state === 'land') {
          var u = Math.min(1, (t - r.land.t0) / r.land.d), x = u - 1, c1 = 1.2;
          var e = 1 + (c1 + 1) * x * x * x + c1 * x * x;
          setP(r, r.land.from - D * e);
          if (u > 0.3) r.track.classList.remove('fast');
          if (u >= 1) { setP(r, r.target); r.state = 'done'; Kit.sfx('tap'); Kit.haptic('light'); }
        }
      });
      if (pending) raf = requestAnimationFrame(frame);
      else done();
    }
    raf = requestAnimationFrame(frame);
  }

  // ── Wins ──────────────────────────────────────────────────────────────────
  function msg(t, good) { dom.msg.textContent = t; dom.msg.classList.toggle('good', !!good); }
  function stopCycle() { clearInterval(cycleT); cycleT = 0; }
  function clearWins() {
    stopCycle();
    if (!dom.cab) return;
    dom.cab.classList.remove('won');
    dom.svg.innerHTML = ''; dom.svg.dataset.win = ''; drawn = null;
    app.querySelectorAll('.cell.hit').forEach(function (c) { c.classList.remove('hit'); });
    app.querySelectorAll('.pr.hit,.pays5 td.hit').forEach(function (c) { c.classList.remove('hit'); });
    dom.tabs.forEach(function (t) { t.classList.remove('win'); });
  }
  function markCells(w, stops) {
    var ln = M.lines[w.li];
    w.cells.forEach(function (ri) {
      var c = R[ri].track.children[stops[ri] + ln[ri]];
      if (c) c.classList.add('hit');
    });
  }
  function showWins(res, quiet) {
    paintControls();
    if (!res.wins.length) {
      dom.mWin.textContent = '0';
      msg(quiet ? 'Good luck!' : 'No win this time');
      return;
    }
    dom.cab.classList.add('won');
    dom.svg.dataset.win = '1';
    drawLines(res.wins.map(function (w) { return w.li; }), true);
    res.wins.forEach(function (w) {
      markCells(w, res.stops);
      if (dom.tabs[w.li]) dom.tabs[w.li].classList.add('win');
      var p = dom.glass.querySelector('[data-k="' + w.k + '"]'); if (p) p.classList.add('hit');
    });
    var i = 0;
    function show() {
      var w = res.wins[i % res.wins.length];
      msg((res.wins.length > 1 ? 'Line ' + (w.li + 1) + ': ' : '') + w.label + ' ' + money(w.amt), true);
      if (res.wins.length > 1) {
        drawLines(res.wins.map(function (x) { return x.li; }).filter(function (li) { return li !== w.li; }), false);
        dom.svg.insertAdjacentHTML('beforeend', '<polyline points="' + linePoints(w.li) + '" stroke="' + LINE_COLORS[w.li] + '" stroke-width="12" opacity=".3" vector-effect="non-scaling-stroke"/><polyline points="' + linePoints(w.li) + '" stroke="' + LINE_COLORS[w.li] + '" stroke-width="4" vector-effect="non-scaling-stroke"/>');
      }
      i++;
    }
    show();
    if (res.wins.length > 1) cycleT = setInterval(show, 1500);
    if (quiet) { dom.mWin.textContent = money(res.total); return; }
    // Coin count-up on the WIN and CREDIT meters
    var from = shownBank, x = res.total / res.tb;
    var dur = Math.min(3200, 600 + 2600 * Math.min(1, x / 40)), t0 = performance.now(), lastTick = 0;
    function step(t) {
      var u = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - u, 2), v = Math.round(res.total * e);
      dom.mWin.textContent = money(v);
      dom.mCredit.textContent = money(from + v);
      if (t - lastTick > 75 && u < 1) { Kit.sfx('tick'); lastTick = t; }
      if (u < 1) requestAnimationFrame(step); else { shownBank = Casino.balance(); paintControls(); }
    }
    requestAnimationFrame(step);
    var jackpot = res.wins.some(function (w) { return w.jackpot; });
    if (jackpot) {
      Kit.callout('JACKPOT!'); Kit.sfx('win'); Kit.haptic('success'); Kit.confetti({ count: 160 }); coins(46);
    } else if (x >= 25) {
      Kit.callout('HUGE WIN!'); Kit.sfx('win'); Kit.haptic('success'); Kit.confetti({ count: 90 }); coins(32);
    } else if (x >= 8) {
      Kit.callout('BIG WIN!'); Kit.sfx('win'); Kit.haptic('success'); coins(20);
    } else if (res.total >= res.tb) { Kit.sfx('good'); Kit.haptic('success'); }
    else Kit.sfx('pop');
  }
  function coins(n) {
    var box = el('div', { class: 'coins', 'aria-hidden': 'true' });
    for (var i = 0; i < n; i++) {
      box.appendChild(el('i', { style: { left: (Math.random() * 96) + '%', 'animation-delay': (Math.random() * 0.9).toFixed(2) + 's', 'animation-duration': (1.5 + Math.random() * 0.9).toFixed(2) + 's' } }));
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 3600);
  }

  // ── Bankroll / session end ────────────────────────────────────────────────
  function broke() {
    Kit.sheet({
      title: 'Out of chips',
      html: '<p class="muted">Your bankroll is ' + money(Casino.balance()) + ', not enough for a spin. Start again with $1,000? This resets the bankroll for every casino game.</p>',
      actions: [{ label: 'Reset to $1,000', primary: true, onClick: function () { Casino.reset(); if (S) paintControls(); Kit.toast('Bankroll reset to $1,000'); } }, { label: 'Not now', cls: 'btn-ghost' }]
    });
  }
  function resetBank() {
    if (spinning) return;
    Kit.confirm('Reset bankroll to $1,000?', { ok: 'Reset', danger: true, body: 'This is shared by every casino game.' }).then(function (ok) {
      if (!ok) return;
      Casino.reset();
      if (S) { shownBank = Casino.balance(); save(); paintControls(); }
      Kit.toast('Bankroll reset to $1,000');
    });
  }

  function highlights(st, endBank) {
    var hl = [], net = st.won - st.wagered;
    if (st.jackpots) hl.push(st.name + ' hit the jackpot' + (st.jackpots > 1 ? ' ' + st.jackpots + ' times' : '') + '!');
    if (st.big) hl.push('Biggest win: ' + money(st.big.amt) + ' on spin ' + st.big.spin + ' (' + st.big.label + ', ' + st.big.x + 'x the bet)');
    var rare = Object.keys(st.combos).filter(function (k) { return /^(S7|B3|BE)[345]$|^W[345]$|^DD$/.test(k) && st.combos[k]; })
      .sort(function (a, b) { return st.combos[b] - st.combos[a]; });
    if (rare.length) {
      var k = rare[0];
      var nm = k === 'DD' ? 'Two Diamonds' : WORD[+k.slice(-1)] + ' ' + PLURAL[k.slice(0, -1)];
      hl.push('Lined up ' + nm + ' ' + (st.combos[k] === 1 ? 'once' : st.combos[k] + ' times'));
    }
    if (st.spins >= 5) hl.push('Won on ' + st.hits + ' of ' + st.spins + ' spins');
    if (st.maxDry >= 8) hl.push('Longest dry spell: ' + st.maxDry + ' spins in a row');
    if (st.peakNet >= 20 && st.peakNet > net + 10) hl.push('Was up ' + money(st.peakNet) + ' at one point');
    hl.push(net > 0 ? 'Walked away up ' + money(net) : net < 0 ? 'Finished down ' + money(-net) + ' after betting ' + money(st.wagered) : 'Broke exactly even');
    return hl.slice(0, 6);
  }
  function recordSession(st) {
    var end = st.lastBank != null ? st.lastBank : Casino.balance(), net = st.won - st.wagered, M2 = MACHINES[st.mode];
    Kit.record(HKEY, {
      started: st.started, mode: M2.name,
      players: [{ name: st.name, score: net, cpu: false }], winner: null,
      summary: st.name + (net > 0 ? ' up ' : net < 0 ? ' down ' : ' even ') + (net ? money(Math.abs(net)) : '') + ' · ' + st.spins + ' spins',
      highlights: highlights(st, end),
      meta: { spins: st.spins, wagered: st.wagered, won: st.won, startBank: st.startBank, endBank: end, machine: st.mode }
    });
  }
  function cashOut() {
    if (spinning) { Kit.toast('Wait for the reels to stop'); return; }
    if (!S) { showSetup(); return; }
    var st = S, end = Casino.balance(), net = st.won - st.wagered;
    if (st.spins > 0) recordSession(st);
    clearSave(); stopCycle();
    if (!st.spins) { showSetup(); return; }
    var name = st.name, mode = st.mode;
    S = null;
    showSetup();
    Kit.win({
      icon: net >= 0 ? 'trophy' : 'coins',
      title: net > 0 ? 'Up ' + money(net) + '!' : net < 0 ? 'Down ' + money(-net) : 'Broke even',
      sub: st.spins + ' spins · ' + (st.big ? 'best win ' + money(st.big.amt) + ' · ' : '') + 'bankroll ' + money(end),
      lose: net < 0,
      againLabel: 'Play again',
      again: function () { start(mode, name); },
      extra: [{ label: 'Change machine', onClick: function () {} }]
    });
  }

  // Keyboard: space or enter spins
  document.addEventListener('keydown', function (e) {
    if (!S || !dom.spin || document.querySelector('.k-scrim,.k-win')) return;
    if (e.code === 'Space' || e.key === 'Enter') { if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return; e.preventDefault(); onSpin(); }
  });
  function refreshBank() { if (S && !spinning && dom.mCredit) { shownBank = Casino.balance(); paintControls(); } }
  window.addEventListener('pageshow', refreshBank);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshBank(); });

  // ── Boot: resume a session, or close out a stale one ──────────────────────
  var saved = load();
  if (saved && saved.mode && MACHINES[saved.mode]) {
    if (Date.now() - (saved.lastAt || 0) > 6 * 3600 * 1000) {
      if (saved.spins > 0) recordSession(saved);
      clearSave(); showSetup();
    } else { S = saved; Kit.gameStart(); render(); }
  } else showSetup();
})();
</script>

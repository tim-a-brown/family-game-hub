<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xiangqi</title>
<link rel="stylesheet" href="../kit.css">
<link rel="preload" href="../fonts/xiangqi-kai.woff2" as="font" type="font/woff2" crossorigin>
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="xiangqi-core.js"></script>
<style>
/* the carved characters (LXGW WenKai TC, fonts/xiangqi-LICENSE.txt) */
@font-face{font-family:'XQ Kai';src:url(../fonts/xiangqi-kai.woff2) format('woff2');font-weight:700;font-display:block;}
.cb-col{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
/* Player bars */
.pbar{--c:var(--accent);display:flex;align-items:center;gap:10px;min-height:46px;padding:5px 10px;border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s, background .2s;}
.pbar.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 18%,transparent);}
.pbar.chk{box-shadow:inset 0 0 0 1.5px rgba(255,80,80,.8),0 0 18px rgba(255,60,60,.25);}
.pbar .tok{width:34px;height:34px;flex:none;position:relative;}
.pbar .tok .dk{width:100%;height:100%;}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;}
.pbar .nm{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.pbar .nm .ico{width:15px;height:15px;color:var(--text-3);flex:none;}
.pbar .nm span{overflow:hidden;text-overflow:ellipsis;}
.pbar .sub{font-size:.72rem;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pbar.on .sub{color:var(--lit-ink);}
.pbar.chk .sub{color:#ff8a8a;}
.tray{display:flex;align-items:center;flex-wrap:nowrap;max-width:48%;overflow:hidden;padding:2px 0;}
.tray .dk{width:20px;height:20px;flex:none;margin-left:-7px;}
.tray .dk:first-child{margin-left:0;}
.tray .adv{margin-left:6px;font-size:.78rem;font-weight:900;color:var(--text-2);flex:none;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* The board: a walnut frame round a sheet of pale boxwood with the lines printed on it */
.frame{--rim:clamp(16px,4.6vw,24px);position:relative;box-sizing:border-box;padding:var(--rim);border-radius:14px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(88deg,rgba(0,0,0,.08) 0 1px,transparent 1px 11px),
    linear-gradient(180deg,#6b3a1d,#4a2612);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.35),0 16px 34px rgba(0,0,0,.5);}
.fno{position:absolute;left:var(--rim);right:var(--rim);height:var(--rim);display:grid;grid-template-columns:repeat(9,1fr);pointer-events:none;
  font:800 clamp(9px,2.5vw,12px)/var(--rim) var(--font);color:#f0d6a6;opacity:.78;text-align:center;font-variant-numeric:tabular-nums;}
.fno.b{bottom:0;}.fno.t{top:0;}
.bd{position:relative;aspect-ratio:9/10;container-type:inline-size;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:3px;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.16),transparent 60%),
    repeating-linear-gradient(93deg,rgba(120,70,20,.05) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(87deg,rgba(120,70,20,.04) 0 1px,transparent 1px 13px),
    linear-gradient(170deg,#f1d49c,#e2b977 55%,#d6a964);
  box-shadow:0 0 0 2px #2c160a,inset 0 0 18px rgba(90,50,10,.28);}
.bd>svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.bd.flip>svg.grid{transform:rotate(180deg);}
.river{position:absolute;left:5.6%;right:5.6%;top:45%;height:10%;pointer-events:none;}
.layer{position:absolute;inset:0;pointer-events:none;}
/* marks on the points */
.mk{position:absolute;width:calc(100% / 9);height:10%;display:grid;place-items:center;pointer-events:none;}
.mk::after{content:"";display:block;}
.mk.mv::after{width:28%;height:28%;border-radius:50%;background:rgba(40,70,40,.55);box-shadow:0 0 0 3px rgba(255,255,255,.35);}
.mk.cap::after{width:96%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 3.5px rgba(30,120,40,.85),0 0 10px rgba(30,160,60,.45);}
.mk.blk::after,.mk.face::after,.mk.chkx::after{width:46%;aspect-ratio:1;border-radius:50%;border:2px dashed rgba(150,40,20,.75);
  background:linear-gradient(45deg,transparent 45%,rgba(150,40,20,.8) 45% 55%,transparent 55%);}
.mk.face::after,.mk.chkx::after{border-color:rgba(200,30,30,.85);background:linear-gradient(45deg,transparent 44%,rgba(200,30,30,.9) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,rgba(200,30,30,.9) 44% 56%,transparent 56%);}
.mk.from::after{width:34%;height:34%;border-radius:50%;border:2.5px solid rgba(214,140,20,.85);}
.mk.to::after{width:104%;aspect-ratio:1;border-radius:50%;
  background:conic-gradient(from 45deg,rgba(230,150,20,.95) 0 8%,transparent 8% 17%,rgba(230,150,20,.95) 17% 33%,transparent 33% 42%,rgba(230,150,20,.95) 42% 58%,transparent 58% 67%,rgba(230,150,20,.95) 67% 83%,transparent 83% 92%,rgba(230,150,20,.95) 92%);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63% 70%,transparent 71%);mask:radial-gradient(circle,transparent 62%,#000 63% 70%,transparent 71%);}
.mk.hit::after{width:100%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 3px rgba(255,190,60,.95),0 0 16px rgba(255,170,40,.7);animation:hit 1.1s ease-in-out infinite;}
.mk.leg::after{width:100%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 3px rgba(190,40,30,.85),0 0 12px rgba(190,40,30,.5);}
@keyframes hit{50%{transform:scale(1.08);opacity:.7;}}
.mk.shake{animation:shake .4s;}
/* the pieces: boxwood discs with the character carved in and inked */
.pc{position:absolute;width:calc(100% / 9);height:10%;display:grid;place-items:center;}
.dk{--ink:#a8141c;position:relative;width:90%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 36% 28%,#fbecc9,#ecd09b 50%,#c99a5c 92%);
  box-shadow:0 2px 0 #8a5a2a,0 3.5px 0 #5e3a17,0 5px 7px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 3px rgba(120,70,20,.35);
  transition:transform .15s var(--spring);}
.dk.k{--ink:#1c1a18;}
.dk::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1.5px solid var(--ink);opacity:.72;box-shadow:inset 0 1px 1px rgba(0,0,0,.15),0 1px 0 rgba(255,255,255,.45);}
.dk .ch{position:relative;font-family:'XQ Kai',serif;font-weight:700;font-size:calc(100cqw / 9 * .54);line-height:1;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,250,235,.75),0 -.5px 0 rgba(60,30,5,.45);transform:translateY(-1%);}
.pbar .dk .ch,.tray .dk .ch{font-size:19px;}.tray .dk .ch{font-size:11px;}
.pbar .dk,.tray .dk{box-shadow:0 1.5px 0 #8a5a2a,0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6);}
.tray .dk::before{border-width:1px;}
.dk .lt{position:absolute;right:-6%;bottom:-6%;width:36%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font:900 calc(100cqw / 9 * .2)/1 var(--font);color:#fff;background:var(--ink);box-shadow:0 0 0 1.5px #f3dcae,0 1px 2px rgba(0,0,0,.5);}
.pc.mine .dk{cursor:pointer;}
.pc.lift .dk{transform:translateY(-7%) scale(1.1);box-shadow:0 7px 0 #5e3a17,0 12px 14px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.6);}
.pc.chk .dk{animation:chk 1s ease-in-out infinite;}
@keyframes chk{50%{box-shadow:0 2px 0 #8a5a2a,0 0 0 4px rgba(230,40,40,.9),0 0 20px rgba(255,40,40,.85);}}
.pc.gone{animation:gone .4s ease-out forwards;z-index:4;}
@keyframes gone{30%{transform:scale(1.15);}to{opacity:0;transform:scale(.4) rotate(25deg);}}
.pc.screen .dk{box-shadow:0 2px 0 #8a5a2a,0 0 0 3px rgba(255,190,60,.95),0 0 18px rgba(255,170,40,.8);}
.pc.nudge .dk{animation:shake .4s;}
.bd.shake{animation:shake .4s;}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}

.turn{margin:2px 0 0;min-height:34px;}
.turn.alert{--c:#ff5a5a !important;}
.turn.nudge{animation:shake .4s;}
.tip{font-size:.82rem;font-weight:600;color:var(--text-2);line-height:1.35;min-height:4.05em;padding:0 4px;}
@media (max-width:380px), (max-height:620px){ .tip{font-size:.74rem;} }
.tip b{color:var(--text);}
.tip.last{color:var(--text-3);}
.moves{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0;min-height:34px;align-items:center;}
.moves::-webkit-scrollbar{display:none;}
.moves .mp{flex:none;display:inline-flex;gap:6px;align-items:baseline;height:30px;padding:0 10px;border-radius:11px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);font-size:.85rem;font-weight:650;color:var(--text-2);line-height:30px;font-variant-numeric:tabular-nums;}
.moves .mp i{font-style:normal;color:var(--text-3);font-weight:800;}
.moves .mp .r{color:#ff8f86;}
.moves .mp.now{background:color-mix(in srgb,var(--lit) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--lit) 55%,transparent);color:var(--lit-ink);}
.moves .empty{color:var(--text-3);font-size:.85rem;font-weight:700;margin:0 auto;}
.acts{display:flex;gap:10px;justify-content:center;margin-top:2px;}
.acts .btn{flex:1;max-width:180px;}
.acts .btn-sm{padding-left:10px;padding-right:10px;white-space:nowrap;}

/* A layout for each shape (fit() sizes the board). Upright: the players over and under the board, the board as large
   as the room allows. Sideways: the player bars, whose turn, the moves and the buttons in a column at the left, the
   board you play on at the right, as tall as the room */
#app.stage.ipl{max-width:none;box-sizing:border-box;height:var(--avh,auto);display:flex;flex-direction:column;align-items:center;
  padding:4px max(17px,var(--corner-x)) max(calc(var(--safe-b) + 10px),18px);}
#app.ipl>.cb-col{width:var(--colw,100%);max-width:none;flex:none;margin:auto 0;}
#app.ipl:not(.xq-land)>.cb-col>.frame{width:var(--cw,100%);align-self:center;flex:none;}
#app.ipl:not(.xq-land):not(.xq-desk)>.cb-col{height:var(--colh,auto);margin:0;}
#app.ipl:not(.xq-land):not(.xq-desk)>.cb-col>*{flex:none;}
#app.ipl:not(.xq-land):not(.xq-desk)>.cb-col>.moves{flex:1 1 44px;min-height:44px;padding:6px;border-radius:16px;background:var(--well);box-shadow:inset 0 0 0 1px var(--gl-line);flex-wrap:wrap;align-content:flex-start;align-items:flex-start;overflow-x:hidden;overflow-y:auto;}
#app.ipl:not(.xq-land):not(.xq-desk)>.cb-col>.moves .empty{margin:6px auto;}
#app.xq-short>.cb-col>.tip{flex:1 1 auto !important;}
#app.xq-tall .frame{--rim:26px;}
#app.xq-tall .fno{font-size:13px;}
#app.xq-land>.cb-col{width:auto;height:var(--bh);display:grid;grid-template-columns:var(--sw,300px) var(--bw);
  grid-template-rows:max-content max-content max-content minmax(0,1fr) max-content max-content;
  grid-template-areas:"t b" "s b" "h b" "m b" "a b" "p b";column-gap:var(--cg,24px);row-gap:9px;justify-content:center;}
#app.xq-land>.cb-col>.frame{grid-area:b;--rim:clamp(14px,3vh,26px);}
#app.xq-land>.cb-col>.pbar:nth-child(1){grid-area:t;}
#app.xq-land>.cb-col>.pbar:nth-child(3){grid-area:p;}
#app.xq-land>.cb-col>.turn{grid-area:s;justify-self:start;}
#app.xq-land>.cb-col>.tip{grid-area:h;}
#app.xq-land>.cb-col>.moves{grid-area:m;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start;overflow-y:auto;overflow-x:hidden;padding:10px;border-radius:18px;background:var(--well);box-shadow:inset 0 0 0 1px var(--gl-line);}
#app.xq-land>.cb-col>.moves .mp{justify-content:flex-start;}
#app.xq-land>.cb-col>.moves .empty{grid-column:1/-1;margin:6px auto;}
#app.xq-land>.cb-col>.acts{grid-area:a;}
#app.xq-land .fno{font-size:11px;}
/* a phone on its side: the column is narrow and short */
#app.xq-low>.cb-col{row-gap:6px;}
#app.xq-low .pbar{min-height:40px;padding:3px 8px;}
#app.xq-low .pbar .tray{display:none;}
#app.xq-low>.cb-col>.turn{min-height:28px;font-size:.95rem;margin:0;}
#app.xq-low>.cb-col>.tip{font-size:.74rem;min-height:0;}
#app.xq-low>.cb-col>.moves{padding:6px;gap:4px;}
#app.xq-low>.cb-col>.moves .mp{height:26px;line-height:26px;padding:0 8px;font-size:.8rem;}
#app.xq-low .acts .btn-sm .ico{display:none;}
#app.xq-low .fno{font-size:9px;}
@media (max-width:360px){ .acts .btn-sm .ico{display:none;} }
/* a small phone upright: the moves stay in the game's history, the bars and the note slim down so the board keeps its size */
#app.xq-short>.cb-col{gap:6px;}
#app.xq-short>.cb-col>.moves{display:none;}
#app.xq-short .pbar{min-height:40px;padding:3px 8px;}
#app.xq-short .pbar .tok{width:30px;height:30px;}
#app.xq-short>.cb-col>.turn{min-height:28px;margin:0;font-size:.95rem;}
#app.xq-short>.cb-col>.tip{min-height:2.7em;font-size:.72rem;}
/* A large window (a computer): the board sized from the window, the room at the left with what a phone keeps a tap away
   (every move written out, the pieces each side has taken, the past games at this table), the players and the buttons
   at the right where you act. xq-dw: three columns; xq-ds: a window too square for that, the players and buttons under
   the board. Phones and tablets never get xq-desk. */
.xq-room,.xq-side{display:none;}
#app.xq-desk.xq-dw .xq-side{display:flex;flex-direction:column;gap:12px;grid-area:x;min-height:0;overflow:hidden;align-self:start;}
.xq-side .pn{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.xq-side h4{margin:0;font-size:.9rem;font-weight:700;color:var(--text-2);}
.xq-side .lm{margin:0;font-size:.95rem;font-weight:600;line-height:1.35;color:var(--text);}
.xq-side .wx{font-size:.85rem;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;}
.xq-side .mat{margin:2px 0 0;font-size:.85rem;font-weight:600;line-height:1.35;color:var(--text-2);}
.xq-side .cr{display:flex;align-items:center;gap:10px;min-height:30px;}
.xq-side .cr .who{width:84px;flex:none;font-weight:750;font-size:.88rem;white-space:nowrap;overflow:hidden;}
.xq-side .cr .dks{display:flex;flex-wrap:wrap;gap:3px;flex:1;min-width:0;}
.xq-side .cr .dk{width:28px;height:28px;flex:none;box-shadow:0 1.5px 0 #8a5a2a,0 2px 4px rgba(0,0,0,.45);}
.xq-side .cr .dk .ch{font-size:16px;}.xq-side .cr .dk::before{border-width:1px;}
.xq-side .cr .v{font-weight:800;color:var(--text-3);font-size:.85rem;flex:none;}
.xq-room .pn.mv{flex:0 1 auto;min-height:90px;}
#app.xq-desk>.cb-col>.tip{min-height:0;}
#app.xq-desk>.cb-col>.tip:empty{display:none;}
.xq-room .rf{display:flex;align-items:center;gap:10px;font-size:.85rem;line-height:1.3;color:var(--text-2);}
.xq-room .rf .two{display:flex;gap:3px;flex:none;}
.xq-room .rf .dk{width:26px;height:26px;box-shadow:0 1.5px 0 #8a5a2a,0 2px 4px rgba(0,0,0,.45);}
.xq-room .rf .dk .ch{font-size:15px;}.xq-room .rf .dk::before{border-width:1px;}
.xq-room .rf b{color:var(--text);font-weight:750;}
#app.xq-desk>.cb-col{width:auto;max-width:none;height:var(--ch);display:grid;column-gap:28px;row-gap:10px;justify-content:center;align-content:center;}
#app.xq-desk>.cb-col>.frame{grid-area:b;width:var(--bw);--rim:var(--drim);align-self:center;}
#app.xq-desk>.cb-col>.pbar:nth-child(1){grid-area:t;}
#app.xq-desk>.cb-col>.pbar:nth-child(3){grid-area:p;}
#app.xq-desk>.cb-col>.turn{grid-area:s;justify-self:start;}
#app.xq-desk>.cb-col>.tip{grid-area:h;}
#app.xq-desk>.cb-col>.acts{grid-area:a;}
#app.xq-desk>.cb-col>.moves{display:none;}
#app.xq-desk .fno{font-size:calc(var(--drim) * .48);line-height:var(--drim);}
#app.xq-desk.xq-dw>.cb-col{grid-template-columns:var(--rw) var(--bw) var(--sw);grid-template-rows:max-content max-content max-content minmax(0,1fr) max-content max-content;
  grid-template-areas:"r b t" "r b s" "r b h" "r b x" "r b ." "r b a" "r b p";}
#app.xq-desk.xq-dw>.cb-col{grid-template-rows:max-content max-content max-content minmax(0,max-content) minmax(0,1fr) max-content max-content;}
#app.xq-desk.xq-ds>.cb-col{grid-template-columns:var(--rw) calc((var(--bw) - 20px) / 2) calc((var(--bw) - 20px) / 2);column-gap:20px;grid-template-rows:max-content max-content max-content max-content;
  grid-template-areas:"r b b" "r t s" "r p a" "r h h";align-items:center;}
#app.xq-desk.xq-ds>.cb-col>.frame{justify-self:end;}
#app.xq-desk .xq-room{display:flex;flex-direction:column;gap:12px;grid-area:r;min-height:0;height:var(--ch);overflow:hidden;}
.xq-room .pn{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;flex:none;}
.xq-room .pn.grow{flex:1 1 auto;}
.xq-room h4{margin:0;font-size:.9rem;font-weight:700;color:var(--text-2);}
.xq-room .ml{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:max-content 1fr 1fr;gap:3px 12px;align-content:start;font-size:.95rem;font-weight:650;font-variant-numeric:tabular-nums;color:var(--text-2);scrollbar-width:thin;}
.xq-room .ml .no{color:var(--text-3);font-weight:800;}
.xq-room .ml .r{color:#ff8f86;}
.xq-room .ml .on{color:var(--lit-ink);font-weight:850;}
.xq-room .ml .em{grid-column:1/-1;color:var(--text-3);}
.xq-room .cr{display:flex;align-items:center;gap:10px;min-height:30px;}
.xq-room .cr .who{width:84px;flex:none;font-weight:750;font-size:.88rem;white-space:nowrap;overflow:hidden;}
.xq-room .cr .dks{display:flex;flex-wrap:wrap;gap:3px;flex:1;min-width:0;}
.xq-room .cr .dk{width:26px;height:26px;flex:none;box-shadow:0 1.5px 0 #8a5a2a,0 2px 4px rgba(0,0,0,.45);}
.xq-room .cr .dk .ch{font-size:15px;}.xq-room .cr .dk::before{border-width:1px;}
.xq-room .cr .v{font-weight:800;color:var(--text-3);font-size:.85rem;flex:none;}
.xq-room .pg{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:3px 0;border-top:1px solid var(--gl-line);}
.xq-room .pg:first-of-type{border-top:0;}
.xq-room .pg b{font-weight:750;}.xq-room .pg span{color:var(--text-3);white-space:nowrap;}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,.7,.25,1);}
::view-transition-old(root),::view-transition-new(root){animation:none;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  function vtGo(fn) { var t = document.startViewTransition(fn); ['ready', 'finished', 'updateCallbackDone'].forEach(function (k) { if (t && t[k] && t[k].catch) t[k].catch(function () {}); }); }
  var el = Kit.el, app = document.getElementById('app'), X = window.XiangqiCore;

  });
})();
</script>

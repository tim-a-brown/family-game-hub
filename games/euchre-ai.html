<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euchre</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
.stage{padding-bottom:calc(var(--safe-b) + 8px);}
.ctable .felt-in{height:clamp(300px,50dvh,450px);}
.chand{--cw:clamp(62px,17vw,82px);}
.cseat .tag .nm{max-width:104px;overflow:hidden;text-overflow:ellipsis;}
.cseat.out{opacity:.5;}
.chand .pcard.play.hint{box-shadow:0 0 0 3px var(--green),0 8px 18px rgba(0,0,0,.35);}
.cseat .say.stay{animation:none;}
.cseat .say.call{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);}
.dbtn{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:-2px;border-radius:50%;background:#fff;color:#1d1b2e;font-size:.68rem;font-weight:900;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 1px 3px rgba(0,0,0,.4);}
.cseat .chip-s.pt{background:rgba(255,255,255,.22);color:#fff;}
.cseat .chip-s.mk{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);}
.cseat .chip-s .r,.red-s{color:#d81e3a;}
/* Turn-up card and kitty in the middle of the table */
.kitty{position:absolute;left:50%;top:47%;z-index:2;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;--cw:clamp(54px,14vw,66px);}
.kitty .stack{position:relative;width:calc(var(--cw) + 14px);height:calc(var(--cw) * 1.4 + 6px);}
.kitty .stack .pcard{position:absolute;left:0;top:0;}
.kitty .stack .pcard:nth-child(2){left:3px;top:2px;}
.kitty .stack .pcard:nth-child(3){left:6px;top:4px;}
.kitty .stack .pcard.up{left:12px;top:4px;transform:rotate(6deg);box-shadow:0 0 0 3px var(--lit),0 0 18px var(--litg),0 8px 18px rgba(0,0,0,.4);}
.kitty .klbl{padding:4px 11px;border-radius:13px;background:var(--plate-bg);box-shadow:var(--plate-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font-size:.8rem;font-weight:700;white-space:nowrap;}
/* Trump plaque and score card in the felt corners */
.plaque{position:absolute;top:10px;z-index:3;width:86px;padding:6px 6px 7px;border-radius:12px;text-align:center;color:#2a2a3a;
  background:linear-gradient(180deg,#fffaf0,#f1e6cc);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 14px rgba(0,0,0,.4);}
.plaque.tl{left:10px;transform:rotate(-3deg);}
.plaque.tr{right:10px;transform:rotate(2deg);}
.plaque .lb{font-size:.74rem;font-weight:700;color:#8a7a5a;}
.plaque .st{font-size:2.3rem;line-height:1;margin:2px 0 1px;}
.plaque .st.r{color:#d81e3a;}
.plaque .by{font-family:var(--hand);font-size:.95rem;line-height:1.05;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.plaque .al{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:999px;background:#c8102e;color:#fff;font-size:.7rem;font-weight:750;}
.plaque.pop{animation:pop .45s var(--spring);}
.plaque .row2{display:flex;align-items:center;gap:4px;padding:1px 0;}
.plaque .row2 .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.plaque .row2 .t{flex:1;min-width:0;text-align:left;font-weight:900;font-size:.74rem;}
.plaque .row2 .n{font-family:var(--display);font-size:1.3rem;line-height:1.05;min-width:1.1em;text-align:right;}
.plaque .goal{font-family:var(--hand);font-size:.85rem;color:#8a7a5a;margin-top:1px;}
/* Bidding controls under your hand */
.bidbox{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;}
.bidbox .q{font-weight:800;color:var(--text);text-align:center;}
.bidbox .q .s{font-size:1.1em;}
.bidbox .btns{display:flex;gap:8px;justify-content:center;width:100%;max-width:420px;}
.bidbox .btns .btn{flex:1;min-height:50px;padding:0 10px;}
.suitbtn{flex:1;min-height:56px;border:0;border-radius:var(--r);background:var(--gl-2);color:var(--text);font-size:1.7rem;line-height:1;font-weight:900;box-shadow:inset 0 0 0 1px var(--gl-line),0 10px 22px -16px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .12s var(--ease),filter .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.suitbtn small{font-size:.78rem;font-weight:650;color:var(--text-2);}
.suitbtn.r{color:#ff5a72;}
.suitbtn:active{transform:translateY(1px) scale(.97);filter:brightness(.94);}
.alone{display:flex;align-items:center;gap:10px;color:var(--text-2);font-weight:800;font-size:.92rem;}
.sum{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums;}
.sum th,.sum td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--w08);}
.sum th:first-child,.sum td:first-child{text-align:left;}
.sum td.big{font-weight:900;font-size:1.2rem;}
.sum tr.lead td{color:var(--lit-ink);}
.hsum{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r);background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);}
.hsum .res{font-family:var(--display);font-size:1.5rem;color:var(--lit-ink);}
.hsum .res.bad{color:var(--red);}
.hsum .why{color:var(--text-2);font-weight:700;}
/* Tablet and larger: bigger pieces on the table */
@media (min-width:700px) and (min-height:600px){
  .cseat .tag{font-size:.98rem;padding:5px 13px 5px 5px;gap:8px;}
  .cseat .tag .avatar{width:32px;height:32px;font-size:.88rem;}
  .cseat .chip-s{font-size:.84rem;padding:2px 10px;}
  .cseat .backs{--cw:30px;}
  .cseat .backs .pcard+.pcard{margin-left:-21px;}
  .ctrick .pcard{--cw:86px;}
  .cmsg{font-size:.98rem;padding:8px 16px;}
  .cbar .hint{font-size:1.06rem;}
  .kitty{--cw:84px;}
  .plaque{width:108px;padding:8px 8px 9px;}
  .plaque .lb{font-size:.68rem;} .plaque .st{font-size:2.8rem;} .plaque .by{font-size:1.1rem;}
  .plaque .row2 .t{font-size:.86rem;} .plaque .row2 .n{font-size:1.55rem;} .plaque .goal{font-size:1rem;}
  .cseat .tag .nm{max-width:150px;}
}
/* iPad portrait: a larger table and hand that use the height */
@media (min-width:700px) and (min-height:900px) and (orientation:portrait){
  .stage{max-width:740px;}
  .ctable .felt-in{height:clamp(460px,58dvh,680px);}
  .chand{--cw:98px;}
}
/* Landscape tablet / desktop: table with a side panel for the controls, hand below */
@media (orientation:landscape) and (min-width:1000px) and (min-height:600px){
  .stage:has(> .ctable){max-width:1120px;display:grid;grid-template-columns:minmax(0,1fr) 270px;grid-template-rows:1fr auto auto;grid-template-areas:"table bar" "table sort" "hand hand";column-gap:18px;}
  .stage > .ctable{grid-area:table;margin-bottom:6px;}
  .stage > .ctable .felt-in{height:clamp(340px,calc(100dvh - 262px),600px);}
  .stage > .cbar{grid-area:bar;align-self:end;flex-wrap:wrap;margin:0 0 14px;text-align:center;}
  .stage > .cbar .btn{width:100%;}
  .stage > .csort-row{grid-area:sort;align-self:end;justify-content:center;margin:0 0 8px;}
  .stage > .chand{grid-area:hand;--cw:84px;}
  .stage > .cbar .bidbox .btns{flex-wrap:wrap;}
}
/* ── Every shape uses the whole screen (the baseline, 2026-11-15) ─────────────────────────────────────────────────
   Upright, phone and iPad: the page is the screen, and the table takes all the height the hand and the bar leave;
   the trick's cards grow with the table (container units of the felt). */
#app .ctable .felt-in{container-type:size;}
#app .ctrick .pcard{--cw:clamp(40px,min(17cqw,15cqh),96px);}
@media (orientation:portrait){
  #app.stage:has(> .ctable){display:flex;flex-direction:column;height:calc(100dvh - var(--bar));padding-bottom:max(calc(var(--safe-b) + 6px),18px);}
  #app.stage > .ctable{flex:1 1 0;display:flex;flex-direction:column;margin-bottom:6px;}
  #app.stage > .ctable .felt-in{flex:1 1 0;height:auto;min-height:250px;}
  #app.stage > .csort-row,#app.stage > .chand,#app.stage > .cbar{flex:none;}
  #app.stage > .chand{--cw:clamp(56px,17vw,80px);}
}
@media (orientation:portrait) and (min-width:700px){
  #app.stage > .chand{--cw:clamp(84px,12.5vw,104px);}
}
/* a short screen leaves out the fanned backs (everyone holds as many cards as you do) */
@media (max-height:640px){#app .cseat .backs{display:none;}}
/* A phone on its side: the table at the left as tall as the screen; at the right what you act with, the bar
   (bids, buttons, what's happening) over your hand */
@media (orientation:landscape) and (max-height:520px){
  #app.stage:has(> .ctable){max-width:none;height:calc(100dvh - var(--bar));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"table bar" "table sort" "table hand";column-gap:14px;padding:0 calc(12px + var(--corner-x)) max(calc(var(--safe-b) + 6px),18px);}
  #app.stage > .ctable{grid-area:table;margin:0;display:flex;flex-direction:column;min-height:0;padding:6px;border-radius:22px;}
  #app.stage > .ctable .felt-in{flex:1 1 0;height:auto;min-height:0;border-radius:17px;}
  #app.stage > .cbar{grid-area:bar;align-self:center;flex-wrap:wrap;margin:0;min-height:0;text-align:center;}
  #app.stage > .csort-row{grid-area:sort;margin:0;}
  #app.stage > .chand{grid-area:hand;--cw:clamp(48px,18dvh,76px);padding:14px 0 0;min-height:0;}
  #app.stage > .cbar .bidgrid button{min-height:38px;}
  #app .cmsg{bottom:auto;top:64%;transform:translate(-50%,-50%);}
}
/* An iPad on its side: the table and its side panel fill the height down to the hand */
@media (orientation:landscape) and (min-width:1000px) and (min-height:600px){
  #app.stage:has(> .ctable){height:calc(100dvh - var(--bar));grid-template-rows:minmax(0,1fr) auto auto;padding-bottom:max(calc(var(--safe-b) + 6px),18px);}
  #app.stage > .ctable{display:flex;flex-direction:column;min-height:0;}
  #app.stage > .ctable .felt-in{flex:1 1 0;height:auto;min-height:0;}
  #app.stage > .chand{--cw:clamp(84px,11dvh,100px);}
}
/* ── A large window (Cards.desk in cards.js lays the page out; html.cdesk-on while it does) ───────────────────────
   At the left stands the score sheet, hand by hand: who made trump and in which suit (alone or not), the tricks and
   the points of each side, a euchre marked on the side that was euchred, and under the totals a pip for each point
   toward the score the game is played to. At the right is the hand in play: the trump and how it came to be (the
   turned-up card and what happened to it), each player's call while trump is being picked, the tricks of each side
   against the three it needs, who took each trick, and the last trick. Both panels are in the page at every size
   and drawn only at a desk. On the felt the turned-up card and the two plaques grow with the table. */
html.cdesk-on #app .kitty{--cw:clamp(54px,min(13cqw,12cqh),170px);gap:clamp(8px,1.2cqmin,16px);}
html.cdesk-on #app .kitty .stack{width:calc(var(--cw) * 1.22);height:calc(var(--cw) * 1.5);}
html.cdesk-on #app .kitty .stack .pcard:nth-child(2){left:calc(var(--cw) * .045);top:calc(var(--cw) * .03);}
html.cdesk-on #app .kitty .stack .pcard:nth-child(3){left:calc(var(--cw) * .09);top:calc(var(--cw) * .06);}
html.cdesk-on #app .kitty .stack .pcard.up{left:calc(var(--cw) * .18);top:calc(var(--cw) * .06);}
html.cdesk-on #app .kitty .klbl{font-size:clamp(.82rem,1.7cqmin,1.5rem);padding:.3em .85em;border-radius:.85em;}
html.cdesk-on #app .plaque{top:clamp(10px,1.8cqmin,26px);width:6.9em;padding:.5em .5em .55em;border-radius:.75em;font-size:clamp(.98rem,2cqmin,1.85rem);}
html.cdesk-on #app .plaque.tl{left:clamp(10px,1.8cqmin,26px);} html.cdesk-on #app .plaque.tr{right:clamp(10px,1.8cqmin,26px);}
html.cdesk-on #app .plaque .lb{font-size:.7em;} html.cdesk-on #app .plaque .st{font-size:2.9em;} html.cdesk-on #app .plaque .by{font-size:1.1em;}
html.cdesk-on #app .plaque .al{font-size:.7em;padding:.08em .6em;margin-top:.25em;}
html.cdesk-on #app .plaque .row2{gap:.3em;} html.cdesk-on #app .plaque .row2 .dot{width:.58em;height:.58em;}
html.cdesk-on #app .plaque .row2 .t{font-size:.86em;} html.cdesk-on #app .plaque .row2 .n{font-size:1.55em;} html.cdesk-on #app .plaque .goal{font-size:1em;}
html.cdesk-on #app .cseat .tag .nm{max-width:9em;}
html.cdesk-on #app .dbtn{width:1.5em;height:1.5em;margin-left:-.1em;font-size:.72em;}
/* a short felt at a desk: the side seats sit lower, clear of the plaques in the top corners */
@container cfelt (max-height:500px){
  html.cdesk-on #app .cseat.w,html.cdesk-on #app .cseat.e{top:62%;}
}
/* a small window, upright or square (cards.js lays it out): the side seats sit below the plaques */
@media (orientation:portrait) and (min-width:480px) and (max-height:759.98px){
  html.cdesk #app .cseat.w,html.cdesk #app .cseat.e{top:66%;}
  html.cdesk #app .kitty{top:57%;gap:4px;--cw:clamp(34px,16cqh,66px);}
  html.cdesk #app .kitty .klbl{font-size:.72rem;padding:3px 9px;}
  html.cdesk #app .cseat.n .say{top:2px;left:100%;margin:0 0 0 6px;}
  html.cdesk #app .felt-in:has(.cmsg:not([hidden])) .kitty{top:44%;}
  html.cdesk #app .felt-in:has(.cmsg:not([hidden])) .kitty .klbl{display:none;}
}
/* a narrow table at a desk (a tall, narrow window, or a strip): the trick's cards and the side seats keep clear of each other */
@container cfelt (max-width:540px){
  html.cdesk-on #app.stage .ctable .ctrick .pcard{--cw:clamp(40px,min(14cqw,15cqh),210px);}
  html.cdesk-on #app .cseat.w .info,html.cdesk-on #app .cseat.e .info{flex-direction:column;align-items:center;}
}
@container cfelt (max-width:460px){
  html.cdesk-on #app .cseat.w,html.cdesk-on #app .cseat.e{top:70%;}
  html.cdesk-on #app.stage .ctable .cmsg{font-size:.8rem;padding:.4em .7em;}
}
@container cfelt (max-height:500px){
  html.cdesk-on #app .felt-in:has(.cmsg:not([hidden])) .kitty .klbl{display:none;}
}
/* a window a little wider than a tablet on its side (the tablet's layout, the table the full width): the turned-up card and the
   trick sit a little lower, clear of the seat across the table, and the side seats clear of the plaques */
@media (orientation:landscape) and (min-width:1100px) and (max-width:1199.98px) and (max-height:720px){
  html.cdesk #app .kitty{top:53%;--cw:64px;}
  html.cdesk #app .ctrick{top:52%;}
  html.cdesk #app .cseat.w,html.cdesk #app .cseat.e{top:53%;}
  html.cdesk #app .felt-in:has(.cmsg:not([hidden])) .kitty .klbl{display:none;}
}
/* a mouse over the calls */
@media (hover:hover){html.cdesk-on #app .suitbtn:hover{filter:brightness(1.18);}}
/* calling trump in a narrow bar beside the table */
html.cdesk-on #app.stage > .cbar .bidbox .q{font-size:.95rem;line-height:1.25;}
/* the score sheet: the kit's ruled pad (.cdk-pad): the trump and who made it, then each side's tricks and points
   (a window wide enough gives it the width) */
#app{--cdk-lmin:340px;}
@media (min-width:1360px){#app{--cdk-lmin:384px;}}
.eu-pad{--lc:2em;--px:.35em;--side:calc((100% - var(--px) * 2 - var(--lc)) * 1.8 / 6.3);}
.eu-pad .pr{grid-template-columns:var(--lc) minmax(0,2.7fr) repeat(4,minmax(0,.9fr));}
.eu-pad .eu-meb{position:absolute;top:0;bottom:0;left:calc(var(--px) + var(--lc) + (100% - var(--px) * 2 - var(--lc)) * (2.7 + 1.8 * var(--mt,0)) / 6.3);width:var(--side);pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--lit) 11%,transparent),color-mix(in srgb,var(--lit) 5%,transparent));box-shadow:inset 1px 0 0 color-mix(in srgb,var(--lit) 22%,transparent),inset -1px 0 0 color-mix(in srgb,var(--lit) 22%,transparent);}
.eu-pad::before,.eu-pad::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--h,#6c7bff) 45%,var(--gl-line));pointer-events:none;}
.eu-pad::before{left:calc(var(--px) + var(--lc) + (100% - var(--px) * 2 - var(--lc)) * 2.7 / 6.3);}
.eu-pad::after{left:calc(var(--px) + var(--lc) + (100% - var(--px) * 2 - var(--lc)) * 4.5 / 6.3);}
.eu-pad .tm{grid-column:span 2;display:flex;flex-direction:column;align-items:center;gap:.3em;min-width:0;padding:0 .2em;font-size:.8em;font-weight:700;line-height:1.1;text-align:center;overflow-wrap:anywhere;color:var(--text-2);}
.eu-pad .tm.me{color:var(--lit-ink);}
.eu-pad .tm .av{display:flex;}
.eu-pad .tm .avatar{width:2em;height:2em;font-size:.95em;}
.eu-pad .tm .avatar + .avatar{margin-left:-.35em;box-shadow:0 0 0 2px var(--sheet-solid,#1d1b2e);}
.eu-pad .tm .nm2{display:block;}
.eu-pad .ph.eu-tms{border-bottom:0;padding-bottom:.3em;}
.eu-pad .eu-hd{flex:none;align-items:end;padding-bottom:.35em;border-bottom:3px double color-mix(in srgb,var(--h,#6c7bff) 55%,var(--gl-line));}
.eu-pad .eu-hd span{font-size:.6em;font-weight:700;color:var(--text-3);text-align:center;white-space:nowrap;}
.eu-pad .eu-hd span.l{text-align:left;padding-left:.6em;}
.eu-pad .pb .cv{font-size:1.3em;}
.eu-pad .cv.bad{color:var(--bad-ink);}
.eu-pad .cv.pt{color:var(--lit-ink);}
.eu-pad .cv .eu-eu{display:inline-block;padding:.26em .34em;border-radius:.5em;background:var(--red);color:#fff;font-family:var(--font);font-size:.46em;font-weight:800;letter-spacing:-.02em;line-height:1;vertical-align:.3em;white-space:nowrap;}
/* (the trump and who made it: the suit on a small card face, the name, and Alone when they went alone) */
.eu-mk{display:flex;align-items:center;gap:.4em;min-width:0;padding-left:.35em;font-size:.8em;font-weight:700;line-height:1.05;color:var(--text);white-space:nowrap;}
.eu-mk .nw{display:flex;align-items:center;gap:.4em;min-width:0;}
.eu-mk .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;}
.eu-s{flex:none;display:inline-grid;place-items:center;width:1.5em;height:1.7em;border-radius:.34em;background:linear-gradient(160deg,#fff,#f1ead9);color:#1d1b2e;font-family:var(--font);font-size:1.05em;font-weight:900;line-height:1;box-shadow:0 0 0 1px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.35);}
.eu-s.red{color:#d81e3a;}
:root.k-4c .eu-s[data-s="c"]{color:#14803e;}
:root.k-4c .eu-s[data-s="d"]{color:#1c5fd0;}
.eu-al{flex:none;padding:.22em .5em;border-radius:1em;background:#c8102e;color:#fff;font-size:.8em;font-weight:750;line-height:1;}
.eu-pad .pf .tot{grid-column:span 2;}
.eu-pad .pf .rl2{grid-column:span 1;}
.eu-pad .eu-pp{flex:none;padding:.15em var(--px) .7em;background:var(--gl-3);}
.eu-pad .eu-pp .rl{font-size:.64em;grid-column:1 / span 2;text-align:right;padding-right:.9em;}
.eu-pad .eu-pp .pp{grid-column:span 2;display:grid;grid-template-columns:repeat(5,auto);justify-content:center;gap:.24em;padding:0 .2em;}
.eu-pad .eu-pp .pp i{width:.62em;height:.62em;border-radius:50%;background:var(--gl-2);box-shadow:inset 0 0 0 1px var(--gl-line);}
.eu-pad .eu-pp .pp i.on{background:var(--c);box-shadow:0 0 6px color-mix(in srgb,var(--c) 60%,transparent);}
.eu-pad .pf .rl{grid-column:1 / span 2;text-align:right;padding-right:.9em;}
@container cdkp (max-height:430px){.eu-pad .tm .av{display:none;}}
@container cdkp (max-width:336px){.eu-pad .cv .eu-eu{font-size:.38em;padding:.26em .22em;} .eu-mk .nw{flex-direction:column;align-items:flex-start;gap:.12em;} .eu-al{font-size:.66em;padding:.16em .45em;}}
/* the hand in play, at the right */
.eu-tr{flex:none;display:flex;align-items:center;gap:.7em;padding:0 1.25em .5em;font-size:.86em;font-weight:650;line-height:1.3;color:var(--text-2);}
.eu-tr .big{flex:none;display:grid;place-items:center;width:2.2em;height:2.9em;border-radius:.45em;background:linear-gradient(180deg,#fffaf0,#f1e6cc);color:#1d1b2e;font-size:1.25em;font-weight:900;line-height:1;box-shadow:0 0 0 2px var(--lit),0 0 12px var(--litg),0 3px 8px rgba(0,0,0,.4);}
.eu-tr .big.red{color:#d81e3a;}
:root.k-4c .eu-tr .big[data-s="c"]{color:#14803e;}
:root.k-4c .eu-tr .big[data-s="d"]{color:#1c5fd0;}
.eu-tr .big span{font-size:1.5em;}
.eu-tr .pcard{flex:none;--cw:2.9em;}
.eu-tr .pcard.sm{--cw:2.2em;}
.eu-tr .pcard.dn{opacity:.75;}
.eu-tr .tx{flex:1 1 auto;min-width:0;}
.eu-tr .tx b{color:var(--text);font-weight:750;}
.eu-g1{flex:1 1 0;min-height:0;max-height:calc(125cqw + 4.2em);display:flex;flex-direction:column;}
.eu-g2,.eu-g3,.eu-g4,.eu-g5{flex:none;display:flex;flex-direction:column;min-height:0;padding-bottom:.6em;}
.eu-took{flex:none;display:flex;align-items:center;gap:.5em;min-height:2.3em;padding:.45em 1.25em .3em;font-size:.86em;font-weight:650;line-height:1.2;color:var(--text-2);}
.eu-took .avatar{width:1.8em;height:1.8em;font-size:.85em;}
/* each side's tricks: five places, the three a side needs marked off */
.eu-sd{display:flex;flex-wrap:wrap;align-items:center;gap:.2em .5em;min-height:2.3em;padding:.1em 1.25em;font-size:.86em;font-weight:650;line-height:1.2;color:var(--text-2);}
.eu-sd .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;}
.eu-sd .mkr{flex:none;padding:.16em .5em;border-radius:.55em;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);font-size:.82em;font-weight:750;line-height:1.1;white-space:nowrap;}
.eu-sd .pn{flex:none;display:flex;align-items:center;gap:.5em;margin-left:auto;}
.eu-sd .pp{flex:none;display:flex;align-items:center;gap:.26em;}
.eu-sd .pp i{width:.9em;height:.9em;border-radius:50%;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 34%,transparent);}
.eu-sd .pp i.on{background:var(--c);box-shadow:none;}
.eu-sd .pp i:nth-child(3){margin-right:.4em;}
.eu-sd .pp i:nth-child(n+4){box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 16%,transparent);}
.eu-sd .pp i.on:nth-child(n+4){box-shadow:none;}
.eu-sd .n{flex:none;min-width:1.2em;text-align:right;font-family:var(--display);font-size:1.15em;color:var(--text);font-variant-numeric:tabular-nums;}
.eu-sd.done .n{color:var(--lit-ink);}
/* who took each trick */
.eu-tl{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:.2em .9em 0;}
.eu-tk{display:flex;flex-direction:column;align-items:center;gap:.2em;min-width:0;}
.eu-tk .avatar{width:2em;height:2em;font-size:.8em;}
.eu-tk .o{display:grid;place-items:center;width:2.35em;height:2.35em;border-radius:50%;font-size:.68em;font-weight:700;color:var(--text-3);box-shadow:inset 0 0 0 1.5px var(--gl-line);font-variant-numeric:tabular-nums;}
.eu-tk.now .o{color:var(--lit-ink);box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.7),0 0 10px var(--litg);}
.eu-tk .nm{min-height:1.1em;font-size:.66em;font-weight:650;line-height:1.1;color:var(--text-3);text-align:center;overflow-wrap:anywhere;}
/* the trumps from the highest down, as small card faces; one that has been played is faded */
.eu-ts{flex:none;display:flex;flex-wrap:wrap;gap:.24em;padding:.1em 1.25em 0;}
.eu-c{display:inline-grid;place-items:center;min-width:2.05em;height:1.75em;padding:0 .18em;border-radius:.4em;background:linear-gradient(160deg,#fff,#f1ead9);color:#1d1b2e;font-family:var(--font);font-weight:900;font-size:.84em;letter-spacing:-.04em;line-height:1;white-space:nowrap;box-shadow:0 0 0 1px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.35);}
.eu-c.red{color:#d81e3a;}
:root.k-4c .eu-c[data-s="c"]{color:#14803e;}
:root.k-4c .eu-c[data-s="d"]{color:#1c5fd0;}
.eu-c.out{opacity:.42;box-shadow:0 0 0 1px rgba(0,0,0,.1);text-decoration:line-through;}
/* each player's call while trump is being picked */
.eu-cl{display:flex;align-items:center;gap:.5em;min-height:2.2em;padding:.1em 1.25em;font-size:.86em;font-weight:650;line-height:1.2;color:var(--text-2);}
.eu-cl .avatar{flex:none;width:1.8em;height:1.8em;font-size:.85em;}
.eu-cl .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;}
.eu-cl.now .nm{color:var(--lit-ink);}
.eu-cl .dbtn{font-size:.62em;width:1.6em;height:1.6em;margin-left:.9em;vertical-align:.1em;}
.eu-cl .c{flex:none;margin-left:auto;padding:.2em .6em;border-radius:.6em;font-size:.9em;color:var(--text-3);white-space:nowrap;}
.eu-cl .c.pass{background:var(--gl-2);color:var(--text-2);}
.eu-cl .c.call{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);font-weight:750;}
/* a hand just scored */
.eu-res{flex:none;display:flex;flex-direction:column;gap:.2em;margin:0 1em .7em;padding:.7em .85em .8em;border-radius:.9em;background:var(--gl-2);box-shadow:inset 0 0 0 1px var(--gl-line);}
.eu-res .w{font-family:var(--display);font-size:1.35em;line-height:1.1;color:var(--lit-ink);}
.eu-res.bad .w{color:var(--red);}
.eu-res .y{font-size:.86em;font-weight:650;line-height:1.3;color:var(--text-2);}
/* a panel too short for everything keeps what matters most: the trump, then the tricks, then who took each, then the last trick */
@container cdkp (max-height:600px){.eu-g1{display:none;}}
@container cdkp (max-height:440px){.eu-g3{display:none;}}
@container cdkp (max-height:410px){.eu-side.pick .eu-g5{display:none;}}
@container cdkp (max-height:370px){.eu-g5{display:none;}}
@container cdkp (max-height:300px){.eu-tr .tx2,.eu-tr .pcard.sm{display:none;} .eu-side.pick .eu-tr{display:none;} .eu-g2 > .cdk-lbl{display:none;}}
@container cdkp (max-height:230px){.eu-side:not(.over) .eu-tr{display:none;} .eu-side.pick .eu-g4 > .cdk-lbl{display:none;}}
@container cdkp (max-height:190px){.eu-side > .cdk-h{padding:.6em 1em .3em;} .eu-cl{min-height:1.75em;} .eu-sd{min-height:1.9em;}}
@container cdkp (max-height:130px){.eu-g2,.eu-g4,.eu-side .eu-tr,.eu-res .y{display:none;}}
/* (a hand just scored: how it came out first, then the tricks, then the trump, who took each trick, the last trick) */
@container cdkp (max-height:700px){.eu-side.over .eu-g1{display:none;}}
@container cdkp (max-height:500px){.eu-side.over .eu-g3{display:none;}}
@container cdkp (max-height:430px){.eu-side.over .eu-tr{display:none;}}
@container cdkp (max-height:330px){.eu-side.over .eu-g2{display:none;} .eu-side.over .eu-tr{display:flex;}}
@container cdkp (max-height:290px){.eu-side.over .eu-tr{display:none;}}
@container cdkp (max-width:270px){.eu-tr .pcard.sm{display:none;}}
/* a panel wider than tall (a strip of a window): the last trick at the left, the rest at the right */
@container cdkp (min-aspect-ratio:5/4) and (min-width:460px){
  .eu-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);grid-auto-rows:auto;align-content:start;}
  .eu-side > *,.eu-side > .eu-g1 > *{grid-column:2;}
  .eu-side > .eu-g1,.eu-side.over > .eu-g1{display:contents;}
  .eu-side > .eu-g1 > .cdk-lt{grid-column:1;grid-row:1 / span 8;margin:1em 0 1em 1em;}
  .eu-side > .eu-g1 > .cdk-lbl,.eu-side > .eu-g1 > .eu-took{display:none;}
  .eu-side > .eu-g3{display:none;}
  .eu-side > .eu-g5 > .cdk-lbl{display:none;}
  .eu-side.pick > .eu-g5{grid-column:1;}
  .eu-side.pick > .eu-tr,.eu-side:not(.over) > .eu-tr{display:flex;}
  .eu-side.pick{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .eu-side.pick > .cdk-h{grid-column:1 / -1;}
  .eu-side.pick > .eu-tr{grid-column:1;align-self:start;}
  .eu-side.pick > .eu-g4{grid-column:2;grid-row:2;padding-bottom:0;}
  .eu-side.pick > .eu-g4 > .cdk-lbl{display:none;}
  .eu-side.pick .eu-cl{min-height:1.75em;padding:0 1.1em;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'euchre_state', SEATS = ['s', 'w', 'n', 'e'];
  var RV = { '9': 0, '10': 1, J: 2, Q: 3, K: 4, A: 5 };
  var SAME = { s: 'c', c: 's', h: 'd', d: 'h' };
  var GLYPH = Cards.GLYPH, SNAME = { s: 'Spades', h: 'Hearts', d: 'Diamonds', c: 'Clubs' };
  var CPU_MS = 750;

  Kit.init({
    id: 'euchre',
    snapHide: function () { return !onePerson() ? '.chand' : null; },   // (Keep playing's picture: a person's hand never shows in pass and play)
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: 'Scores so far', onClick: function () { if (S) showScores(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history('euchre', { keys: ['eu'], title: 'Euchre: past games' }); } }
    ]),
    rules:
      '<p class="goal">You and your partner (sitting across from you) team up against the other two. Win tricks to score points. <b>First team to 10 points wins.</b></p>' +
      '<h3>The cards</h3><p>Only 24 cards: 9, 10, J, Q, K and A of each suit. Everyone gets 5 cards. The next card is turned face up in the middle.</p>' +
      '<h3>Picking trump</h3><ul>' +
      '<li><b>Round 1:</b> going around the table, each player can <b>order up</b> the face-up card, which makes its suit trump. The dealer picks that card up and throws away one card. Or you can <b>pass</b>.</li>' +
      '<li><b>Round 2:</b> if everyone passed, the card is turned down. Now each player can <b>name any other suit</b> as trump, or pass.</li>' +
      '<li>If everyone passes twice, the cards are thrown in and the next player deals.</li>' +
      '<li>The team that picks trump are the <b>makers</b>. They need to win at least 3 of the 5 tricks.</li></ul>' +
      '<h3>The bowers (the best cards)</h3><ul>' +
      '<li>The <b>Jack of trump</b> is the <b>right bower</b>, the highest card of all.</li>' +
      '<li>The <b>other Jack of the same color</b> is the <b>left bower</b>, the second highest. It counts as a trump, not as its own suit. (If hearts are trump, the J♦ is a heart.)</li>' +
      '<li>Then trump goes A, K, Q, 10, 9. Other suits go A, K, Q, J, 10, 9.</li></ul>' +
      '<h3>Playing</h3><ul>' +
      '<li>The player left of the dealer leads first. You must <b>follow the suit</b> that was led if you can. Remember the left bower counts as trump.</li>' +
      '<li>If you can\'t follow suit, play anything, including a trump.</li>' +
      '<li>The highest trump wins the trick. If no trump was played, the highest card of the suit led wins. The winner leads next.</li></ul>' +
      '<h3>Going alone</h3><p>When you pick trump you can choose to <b>go alone</b>. Your partner puts their cards down and sits out. Win all 5 tricks by yourself for 4 points!</p>' +
      '<h3>Scoring</h3><ul>' +
      '<li>Makers win 3 or 4 tricks: <b>1 point</b>.</li>' +
      '<li>Makers win all 5 (a <b>march</b>): <b>2 points</b>.</li>' +
      '<li>Going alone and winning all 5: <b>4 points</b>.</li>' +
      '<li>Makers win fewer than 3: they are <b>euchred</b> and the other team gets <b>2 points</b>.</li></ul>' +
      '<h3>Stick the dealer (optional)</h3><p>A popular house rule: if everyone passes in round 2, the dealer is <b>stuck</b> and must name a suit, so the hand is never thrown in.</p>' +
      '<h3>Online</h3><ul><li><b>Play online</b>, beside the start button, opens a table that the others join on their own devices. Partners sit the way you seated them in the setup, and anyone else who joins takes an open seat. The computer plays every seat that nobody takes.</li>' +
      '<li>Call and play whenever it’s your turn. The home screen shows when it’s your move, and each new hand deals itself.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null, token = 0, undoStack = [];
  var NET = null;   // the online table while playing at one (see Online below)
  // Pass & play: ME is the seat drawn at the bottom with its hand face up (the person holding the device, S.me);
  // BLIND hides every hand while the device is handed over. One person among robots never sees the cover.
  var ME = 0, BLIND = false;
  function posOf(p) { return SEATS[(p - ME + 4) % 4]; }
  function MT() { return ME % 2; }
  function person(p) { return p >= 0 && !!S.players[p] && !S.players[p].cpu; }
  function onePerson() { return !!NET || !S || S.players.filter(function (q) { return !q.cpu; }).length < 2; }
  function showFor(p) { BLIND = false; ME = p; S.me = p; S.wantAlone = false; save(); render(); }
  function gate(p, then) {
    if (NET || !person(p) || p === ME) { then && then(); return; }
    BLIND = true; undoStack = []; render();
    var t = token;
    Kit.handoff({ name: S.players[p].name, color: Kit.color(p % 2), what: 'cards' }).then(function () {
      if (t !== token || !S) return;
      showFor(p); then && then();
    });
  }
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'over') Kit.resume.set('Hand ' + S.handNo + ' · ' + S.scores[0] + '–' + S.scores[1]);
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function nm(p) { return S.players[p].name; }
  function who(p) { return p === ME && onePerson() ? 'You' : S.players[p].name; }
  function team(t) { return S.players[t].name + ' & ' + S.players[t + 2].name; }
  function partner(p) { return (p + 2) % 4; }

  // The computer's skill. Normal is how it has always played; a game saved before there were levels plays Normal.
  var LEVELS = [['easy', 'Easy', 'Calls trump on a whim and plays the wrong card about half the time.'],
    ['normal', 'Normal', 'Calls trump on a good hand and keeps track of the trumps.'],
    ['hard', 'Hard', 'Remembers every card played and thinks each call and play through.'],
    ['expert', 'Expert', 'Remembers every card and who is out of which suit, and thinks each call and play through four times as thoroughly as Hard.']];
  function lvName(v) { return v === 'easy' || v === 'hard' || v === 'expert' ? v : 'normal'; }
  function lvOf(p) { var pl = S.players && S.players[p]; return lvName((pl && pl.level) || S.level); }
  // Hints: at a desk, the seven trumps highest first with the ones played faded (trumpStrip). A game saved before there
  // was a choice has no hints field and plays with them on.
  function hintsOn() { return !S || S.hints !== false; }
  function freshGame(players, o) {
    return {
      mode: o.mode || 'cpu', me: 0, level: o.level || 'normal', target: o.target, stick: o.stick, hints: o.hints !== false, players: players, scores: [0, 0], dealer: Math.floor(Math.random() * 4), handNo: 0,
      rounds: [], log: [], highlights: [], started: Date.now(), throwins: 0, worst: [null, null]
    };
  }
  function showSetup() {
    S = null; token++; BLIND = false; ME = 0; Kit.handoff.close();
    var st = Kit.setup(app, {
      modes: Kit.modes(['cpu', 'local']),
      players: { min: 4, max: 4, cpu: function (m) { return m === 'cpu' ? 'seats' : m === 'local' ? 'mix' : false; }, teams: [[0, 2], [1, 3]] },
      intro: 'You and a computer partner against two computers',
      options: [
        { id: 'target', label: 'Play to', help: 'The first team to reach this many points wins.', value: 10, choices: [[5, '5\nQuick'], [10, '10\nStandard']] },
        { id: 'stick', label: 'Stick the dealer', help: 'What happens if all four players pass on picking trump twice.', value: 0, choices: [[0, 'Off\nRedeal', 'The cards are thrown in and the next player deals.'], [1, 'On\nDealer must call', 'The dealer is stuck and has to pick a trump suit.']] },
        { id: 'hints', label: 'Hints', value: 'on',
          choices: [['on', 'On', 'On a large screen, the seven trumps stand beside the table, highest first, with the ones already played faded.'],
            ['off', 'Off', 'No list of trumps: remember what has been played, as at a real table.']] },
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: LEVELS }
      ],
      onStart: function (cfg) {
        var players = cfg.players.map(function (p) { return { name: p.name, cpu: !!p.cpu, level: p.cpu && p.level ? lvName(p.level) : undefined }; });   // (each robot its own skill at a mixed table)
        S = freshGame(players, { target: +cfg.options.target || 10, stick: +cfg.options.stick === 1, mode: cfg.mode, level: lvName(cfg.options.level), hints: cfg.options.hints !== 'off' });
        hideTeamName(); ME = 0;
        undoStack = []; Kit.gameStart(); newHand();
      }
    });
  }
  // Team names like "Tim & Bender" go in game history; keep them out of the
  // frequent-players list on this device.
  function hideTeamName() {
    try {
      var h = JSON.parse(localStorage.getItem('gn_hidden_names') || '[]');
      [team(0), team(1)].forEach(function (n) { if (h.indexOf(n) < 0) h.push(n); });
      localStorage.setItem('gn_hidden_names', JSON.stringify(h.slice(-200)));
    } catch (e) {}
  }

  // ── Card rules ────────────────────────────────────────────────────────────
  function isRight(c, t) { return c.r === 'J' && c.s === t; }
  function isLeft(c, t) { return c.r === 'J' && c.s === SAME[t]; }
  function eff(c, t) { return t && isLeft(c, t) ? t : c.s; }
  function isTrump(c, t) { return !!t && eff(c, t) === t; }
  // Strength of a card in a trick (led = effective suit led)
  function power(c, t, led) {
    if (isRight(c, t)) return 40;
    if (isLeft(c, t)) return 39;
    if (eff(c, t) === t) return 30 + RV[c.r];
    if (c.s === led) return 20 + RV[c.r];
    return RV[c.r];
  }
  function trickWinner(trick, t) {
    var led = eff(trick[0].c, t), best = trick[0];
    trick.forEach(function (x) { if (power(x.c, t, led) > power(best.c, t, led)) best = x; });
    return best;
  }
  function legal(p) {
    var h = S.hands[p];
    if (!S.trick.length) return h.slice();
    var led = eff(S.trick[0].c, S.trump), f = h.filter(function (c) { return eff(c, S.trump) === led; });
    return f.length ? f : h.slice();
  }
  function suitOrder(t) {
    if (!t) return ['s', 'h', 'c', 'd'];
    var opp = t === 's' || t === 'c' ? ['h', 'd'] : ['s', 'c'];
    return [t, opp[0], SAME[t], opp[1]];
  }
  function sortHand(h, t) {
    var order = suitOrder(t);
    return h.sort(function (a, b) {
      return order.indexOf(eff(a, t)) - order.indexOf(eff(b, t)) || power(b, t, eff(b, t)) - power(a, t, eff(a, t));
    });
  }
  function find(h, id) { for (var i = 0; i < h.length; i++) if (h[i].id === id) return i; return -1; }
  // Your hand on screen (display only). Suit: euchre grouping (trump and both
  // bowers first once trump is set). Rank: A K Q J 10 9, suits in table order.
  var sortT = Cards.sortToggle(null, { key: 'euchre_sort', value: 'suit', flip: function () { return handEl; }, onChange: function () { if (S && handEl) paintHand(); } });
  function view(h) {
    var t = S.trump, a = h.slice();
    if (sortT.get() !== 'rank') return sortHand(a, t);
    var order = suitOrder(t);
    return Cards.sortBy(a, 'rank', { rank: function (x, y) { return RV[y.r] - RV[x.r] || order.indexOf(eff(x, t)) - order.indexOf(eff(y, t)); } });
  }
  function suitHtml(s) { return '<span class="' + (s === 'h' || s === 'd' ? 'red-s' : '') + '">' + GLYPH[s] + '</span>'; }
  function active(p) { return p !== S.out; }
  function nextActive(p) { var q = (p + 1) % 4; if (!active(q)) q = (q + 1) % 4; return q; }
  function activeCount() { return S.out >= 0 ? 3 : 4; }

  // ── Dealing ───────────────────────────────────────────────────────────────
  function newHand() {
    token++;
    S.handNo++;
    if (S.handNo > 1 || S.rounds.length || S.throwins) S.dealer = (S.dealer + 1) % 4;
    var d = Cards.shuffle(Cards.deck({ ranks: ['9', '10', 'J', 'Q', 'K', 'A'] }));
    S.hands = [[], [], [], []];
    // Real deal: 3-2 then 2-3, starting left of the dealer
    var k = 0;
    [[3, 2, 3, 2], [2, 3, 2, 3]].forEach(function (pat) {
      for (var i = 1; i <= 4; i++) { var p = (S.dealer + i) % 4, n = pat[i - 1]; for (var j = 0; j < n; j++) S.hands[p].push(d[k++]); }
    });
    S.up = d[20]; S.kitty = d.slice(21);
    S.hands.forEach(function (h) { sortHand(h, null); });
    S.trump = null; S.maker = -1; S.alone = false; S.out = -1; S.callRound = 0; S.picked = false;

    }
    if (suit === st.up.s || !SNAME[suit]) return null;

  function nDisc(st, p, id) {

  }
  function nPlay(st, p, id) {

    var i = find(st.hands[p], id); if (i < 0 || !legal(p).some(function (c) { return c.id === id; })) return null;
    var card = st.hands[p][i], mv = { k: 'play', p: p, c: card };
    if (st.trick.length) { var led = eff(st.trick[0].c, st.trump); if (eff(card, st.trump) !== led) st.voids[p][led] = 1; }
    st.hands[p].splice(i, 1);

  }
  function nEndHand(st) {

    if (mk >= 3) { pts[mt] = mk === 5 ? (st.alone ? 4 : 2) : 1; res = mk === 5 ? (st.alone ? 'alone-march' : 'march') : 'made'; }
    else { pts[1 - mt] = 2; res = 'euchred'; }
    st.scores[0] += pts[0]; st.scores[1] += pts[1];
    [0, 1].forEach(function (tm) {
      var d = st.scores[1 - tm] - st.scores[tm];
      if (d > 0 && (!st.worst[tm] || d > st.worst[tm].d)) st.worst[tm] = { d: d, a: st.scores[tm], b: st.scores[1 - tm] };

    st.log.push({ hand: st.handNo, maker: st.maker, alone: st.alone, trump: st.trump, tricks: mk, res: res, pts: pts.slice(), up: st.up ? st.up.r + st.up.s : '', cr: st.callRound, dl: st.dealer,
      mh: st.dtA ? st.dtA[st.maker] : null, w: st.tricks.join('.'), ya: st.dtA || null, sc: st.scores.join('.') });
    var name = st.players[st.maker].name;
    if (res === 'alone-march') st.highlights.push(name + ' went alone and marched in hand ' + st.handNo);
    if (st.alone && res === 'euchred') st.highlights.push(name + ' went alone and got euchred in hand ' + st.handNo);
    if (st.scores[0] >= st.target || st.scores[1] >= st.target) {

    } else nDeal(st);
  }
  function netTurn(st) {
    if (!st || !st.at || st.phase === 'over') return [];
    return st.turn >= 0 && /^(bid1|bid2|discard|play)$/.test(st.phase) ? [st.at[st.turn]] : [];
  }
  function netOver(st) {
    if (!st || st.phase !== 'over') return null;
    var w = st.winner;
    return { win: [st.at[w], st.at[w + 2]], text: st.players[w].name + ' & ' + st.players[w + 2].name + ' win ' + st.scores[w] + ' to ' + st.scores[1 - w] };
  }
  // A computer seat (or a person who left): the computer player above
  function netBot(st, seat) {
    var p = st.pos[seat];
    var mv = withS(st, function () {
      if (st.turn !== p) return null;
      if (st.phase === 'bid1') { var a = cpuCall1(p); return nBid1(st, p, a.order, a.alone); }
      if (st.phase === 'bid2') { var b = cpuCall2(p); return nBid2(st, p, b.suit, b.alone); }
      if (st.phase === 'discard') return nDisc(st, p, cpuDiscard(p).id);
      if (st.phase === 'play') return nPlay(st, p, cpuChoose(p).id);
      return null;
    });
    return mv ? { state: st, mv: mv } : null;
  }
  // your move: f(state, your place) -> the move, or null
  function netAct(f) {
    if (!NET || NBUSY) return;
    if (!NET.myTurn()) { Kit.haptic('error'); return; }
    var me = ME;
    NALONE = false;
    NET.act(function (st) { var mv = withS(st, function () { return f(st, me); }); return mv ? { state: st, mv: mv } : null; });
  }
  function netFly(id) { var n = handEl && handEl.querySelector('[data-id="' + id + '"]'); NFLY = n ? { id: id, r: n.getBoundingClientRect() } : null; }
  // What this device draws: its own hand face up, the others as card backs, no face-down cards
  function netView(st) {
    var mine = !!NET && NET.seat >= 0, V = JSON.parse(JSON.stringify(st)), seats = NET ? NET.seats : [];
    ME = mine ? st.pos[NET.seat] : 0;
    V.hands = V.hands.map(function (h, q) { return q === ME && mine ? h : h.map(function () { return {}; }); });
    V.kitty = []; V.dtA = null; V.wantAlone = NALONE;
    V.players = V.players.map(function (pl, q) { var s = seats[st.at[q]]; return { name: pl.name, cpu: s ? !!s.bot : pl.cpu }; });
    return V;
  }
  function netShow(net, info) {
    NET = net; NST = net.state;
    if (info.fresh || info.again) { NQ = []; NGEN++; NBUSY = false; netCloseOv(); }
    NQ.push({ st: JSON.parse(JSON.stringify(net.state)), prev: info.prev ? JSON.parse(JSON.stringify(info.prev)) : null, mv: info.mv, info: info });
    if (NQ.length > 6) NQ = NQ.slice(-1).map(function (x) { x.skip = true; return x; });   // far behind: jump to now
    if (!NBUSY) netPump();
  }
  function netPump() {
    var it = NQ.shift(); if (!it) return;
    var g = NGEN; NBUSY = true;
    netStep(it, function () {
      if (g !== NGEN) return;
      NBUSY = false;
      if (NQ.length) netPump();
      else if (NET && S) paintAll();
    });
  }
  function bubble(p, t, call) {
    var s = seatEls[p]; if (!s) return;
    var b = el('div', { class: 'say' + (call ? ' call' : ''), text: t }); s.appendChild(b);
    setTimeout(function () { b.remove(); }, 1500);
  }
  function netStep(it, done) {
    var st = it.st, prev = it.prev, mv = it.mv, info = it.info, g = NGEN;
    function later(f, ms) { setTimeout(function () { if (g === NGEN && NET) f(); }, ms); }
    token++;
    if (!mv || !prev || info.fresh || info.again || it.skip || !prev.hands) {
      S = netView(st); render();
      if (info.again) { Kit.gameStart(); Kit.sfx('deal'); Kit.callout('New game'); dealAnim(); }
      else if (info.fresh) { Kit.gameStart(); if (st.phase !== 'over') Kit.sfx('deal'); }
      if (st.phase === 'over') later(netEnd, info.fresh ? 300 : 900);
      done(); return;
    }
    if (mv.k === 'b1' || mv.k === 'b2') {
      if (mv.pick) {   // the dealer picks up the turned card
        S = netView(prev); render();
        var upNode = kittyEl && kittyEl.querySelector('.up'), dest = seatEls[st.dealer] && seatEls[st.dealer].querySelector('.tag');
        bubble(mv.p, mv.say, true);
        Kit.sfx('chip'); if (mv.alone) Kit.callout('Alone!');
        if (upNode && dest) {
          var a = upNode.getBoundingClientRect(), b = dest.getBoundingClientRect();
          upNode.style.transition = 'transform .5s cubic-bezier(.3,.7,.3,1), opacity .5s';
          upNode.style.transform = 'translate(' + (b.left + b.width / 2 - a.left - a.width / 2) + 'px,' + (b.top - a.top) + 'px) scale(.6)';
          upNode.style.opacity = '.2';
        }
        later(function () { S = netView(st); render(); later(done, 400); }, 650);
        return;
      }
      S = netView(st); render();
      if (mv.call) { bubble(mv.p, mv.say, true); Kit.sfx('chip'); Kit.haptic('medium'); if (mv.alone) Kit.callout('Alone!'); }
      else if (mv.thrown) { flash('Everyone passed. New deal!'); Kit.sfx('whoosh'); later(function () { Kit.sfx('deal'); dealAnim(); }, 300); }
      else if (mv.down) { bubble(mv.p, 'Pass'); flash('Turned down. Name another suit'); Kit.sfx('flip'); }
      else Kit.sfx('tap');

    if (mv.k === 'disc') { S = netView(st); render(); Kit.sfx('flip'); later(done, 350); return; }

    var ok = mv.k === 'play' && prev.phase === 'play' && prev.turn === mv.p && find(prev.hands[mv.p], mv.c.id) >= 0;
    if (!ok) { S = netView(st); render(); if (st.phase === 'over') later(netEnd, 600); done(); return; }

    function fly(node) {
      var from = fromRect && mv.p === ME ? { getBoundingClientRect: function () { return fromRect; } } : seatEls[mv.p] && seatEls[mv.p].querySelector('.tag');
      Cards.fly(node, from, { ms: 340 });

    S = V; render();
    fly(trickEl.querySelector('[data-id="' + mv.c.id + '"]'));
    later(function () {
      var wc = mv.t.filter(function (x) { return x.p === mv.w; })[0], wn = wc && trickEl.querySelector('[data-id="' + wc.c.id + '"]');
      if (wn) wn.classList.add('win');
      if (mv.w % 2 === MT()) Kit.haptic('light');
      later(function () {
        var dest = seatEls[mv.w].querySelector('.tag').getBoundingClientRect(), box = trickEl.getBoundingClientRect();
        Array.prototype.forEach.call(trickEl.children, function (n) {
          n.style.transition = 'transform .35s ease-in, opacity .35s ease-in';

    else if (L.res === 'alone-march') Kit.callout('Alone march!');
    else if (L.res === 'march') Kit.callout('March!');

    render();

      var tn = team(L.res === 'euchred' ? 1 - mt : mt);
      flash(L.res === 'euchred' ? tn + ' score 2 points for the euchre' : L.res === 'alone-march' ? S.players[L.maker].name + ' marches alone for 4 points' : L.res === 'march' ? tn + ' march for 2 points' : tn + ' score 1 point');
      done(); return;
    }
    var r = resultText(L);

      el('div', { class: 'hsum' }, [
        el('div', { class: 'why', html: Kit.esc(who(L.maker)) + (L.alone ? ' went alone in ' : ' called ') + suitHtml(L.trump) + ' ' + SNAME[L.trump] }),
        el('div', { class: 'res' + (r.bad ? ' bad' : ''), text: r.big }),
        el('div', { class: 'why', text: r.why })
      ]),
      scoreTable(L.pts),

        var mar = st.log.filter(function (L) { return L.maker % 2 === tm && L.res === 'march'; }).length;
        if (mar) hl.push(team(tm) + ' marched ' + (mar === 1 ? 'once' : mar === 2 ? 'twice' : mar + ' times'));
      });
      if (st.worst[w] && st.worst[w].d >= 4) hl.push('Comeback! ' + team(w) + ' were down ' + st.worst[w].a + '–' + st.worst[w].b + ' and won');

        winner: team(w),

        highlights: hl.slice(0, 5).concat([st.rounds.length + ' hands, played to ' + st.target]),
        detail: { names: st.players.map(function (p) { return p.name; }), to: st.target, throwins: st.throwins || 0,
          hx: st.log.map(function (L) { var o = { m: L.maker, t: L.trump, k: L.tricks, r: L.res, u: L.up || '', c: L.cr || 0, d: L.dl, h: L.mh || [] }; if (L.alone) o.a = 1;
            if (L.w) o.w = L.w; if (L.ya && L.maker !== me && L.ya[me]) o.y = L.ya[me]; if (L.sc) o.s = L.sc; return o; }) }

      sub: won ? 'You and ' + st.players[partner(ME)].name + ' won ' + st.scores[w] + ' to ' + st.scores[1 - w] : 'They won ' + st.scores[w] + ' to ' + st.scores[1 - w],
      rank: [w, 1 - w].map(function (tm) { return { name: team(tm), score: st.scores[tm], color: Kit.color(tm) }; }),
      lose: !won, icon: won ? 'trophy' : 'users',
      againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { if (left) { TurnNet.leave(); TurnNet.open(); } else NET.again(); },
      closeLabel: 'Back to games'

  // ── Boot ──────────────────────────────────────────────────────────────────
  function boot() {

  window.__euchre = {
    state: function () { return S; },
    start: function (cfg) {

      S = freshGame(cfg.players, { target: cfg.target || 10, stick: false, mode: 'cpu', level: lvName(cfg.level) });
      if (cfg.dealer != null) S.dealer = cfg.dealer;
      undoStack = []; Kit.gameStart(); newHand();
    },
    set: function (fn) { token++; fn(S); save(); render(); next(true); }
  };
  TurnNet.setup({
    game: 'euchre', title: 'Euchre', min: 2, max: 4, botMs: 900,
    seats: function () { return 4; },
    opts: netOpts, start: netStart, turn: netTurn, over: netOver, bot: netBot,

})();
</script>
<script>
// Turning the device (or resizing the window) at any moment: the cards and seats glide from where they showed in the
// last frame to their new places (where everything is, is noted every frame, since a resize has already moved things
// by the time it is heard). A card that was redrawn is found again by its id.
(function (SEL) {
  var root = document.getElementById('app') || document.body, last = new Map(), lastId = {}, wh = innerWidth + 'x' + innerHeight;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function note() {
    var m = new Map(), ids = {};
    root.querySelectorAll(SEL).forEach(function (n) { var r = n.getBoundingClientRect(); if (!r.width) return; m.set(n, r); if (n.dataset && n.dataset.id) ids[n.dataset.id] = r; });
    last = m; lastId = ids;
  }
  (function loop() { if (!document.hidden) note(); requestAnimationFrame(loop); })();
  window.addEventListener('resize', function () {
    var now = innerWidth + 'x' + innerHeight; if (now === wh || reduce) return; wh = now;
    var before = last, beforeId = lastId;
    requestAnimationFrame(function () {   // (after the game's own resize work has redrawn whatever it redraws)
      var nodes = [].slice.call(root.querySelectorAll(SEL)), set = new Set(nodes);
      nodes.forEach(function (n) {
        for (var p = n.parentElement; p && p !== root; p = p.parentElement) if (set.has(p)) return;   // (moves with its seat)
        var a = before.get(n) || (n.dataset && n.dataset.id && beforeId[n.dataset.id]), b = n.getBoundingClientRect();
        if (!b.width || !n.animate) return;
        // (a desk panel that wasn't showing, or that changes shape and so lays its contents out anew, comes up in its
        // new place; stretched from the old shape its words would be pulled out of true)
        var panel = n.classList.contains('cdk-panel');
        if (panel && (!a || Math.abs((a.width / b.width) / (a.height / b.height) - 1) > .12)) {
          try { n.animate([{ opacity: 0, scale: '.97' }, { opacity: 1, scale: '1' }], { duration: 360, easing: 'cubic-bezier(.25,.8,.25,1)' }); } catch (e) {}
          return;
        }
        if (!a) return;
        var dx = a.left + a.width / 2 - b.left - b.width / 2, dy = a.top + a.height / 2 - b.top - b.height / 2, sx = a.width / b.width, sy = a.height / b.height;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < .02 && Math.abs(sy - 1) < .02) return;
        try { n.animate([{ translate: dx + 'px ' + dy + 'px', scale: sx + ' ' + sy }, { translate: '0px 0px', scale: '1 1' }], { duration: 440, easing: 'cubic-bezier(.25,.8,.25,1)' }); } catch (e) {}
      });
    });
  });
})('.pcard, .cseat, .plaque, .kitty, .cmsg, .cdk-panel');
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euchre</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
.stage{padding-bottom:calc(var(--safe-b) + 8px);}
.ctable .felt-in{height:clamp(300px,50dvh,450px);}
.chand{--cw:clamp(62px,17vw,82px);}
.cseat .tag .nm{max-width:104px;overflow:hidden;text-overflow:ellipsis;}
.cseat.out{opacity:.5;}
.chand .pcard.play.hint{box-shadow:0 0 0 3px var(--green),0 8px 18px rgba(0,0,0,.35);}
.cseat .say.stay{animation:none;}
.cseat .say.call{background:var(--yellow);}
.dbtn{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:-2px;border-radius:50%;background:#fff;color:#1d1b2e;font-size:.68rem;font-weight:900;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 1px 3px rgba(0,0,0,.4);}
.cseat .chip-s.pt{background:rgba(255,255,255,.22);color:#fff;}
.cseat .chip-s.mk{background:var(--yellow);}
.cseat .chip-s .r,.red-s{color:#d81e3a;}
/* Turn-up card and kitty in the middle of the table */
.kitty{position:absolute;left:50%;top:47%;z-index:2;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;--cw:clamp(54px,14vw,66px);}
.kitty .stack{position:relative;width:calc(var(--cw) + 14px);height:calc(var(--cw) * 1.4 + 6px);}
.kitty .stack .pcard{position:absolute;left:0;top:0;}
.kitty .stack .pcard:nth-child(2){left:3px;top:2px;}
.kitty .stack .pcard:nth-child(3){left:6px;top:4px;}
.kitty .stack .pcard.up{left:12px;top:4px;transform:rotate(6deg);box-shadow:0 0 0 3px rgba(255,200,61,.85),0 8px 18px rgba(0,0,0,.4);}
.kitty .klbl{padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.4);color:#fff;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}
/* Trump plaque and score card in the felt corners */
.plaque{position:absolute;top:10px;z-index:3;width:86px;padding:6px 6px 7px;border-radius:12px;text-align:center;color:#2a2a3a;
  background:linear-gradient(180deg,#fffaf0,#f1e6cc);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 14px rgba(0,0,0,.4);}
.plaque.tl{left:10px;transform:rotate(-3deg);}
.plaque.tr{right:10px;transform:rotate(2deg);}
.plaque .lb{font-size:.6rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#8a7a5a;}
.plaque .st{font-size:2.3rem;line-height:1;margin:2px 0 1px;}
.plaque .st.r{color:#d81e3a;}
.plaque .by{font-family:var(--hand);font-size:.95rem;line-height:1.05;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.plaque .al{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:999px;background:#c8102e;color:#fff;font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;}
.plaque.pop{animation:pop .45s var(--spring);}
.plaque .row2{display:flex;align-items:center;gap:4px;padding:1px 0;}
.plaque .row2 .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.plaque .row2 .t{flex:1;min-width:0;text-align:left;font-weight:900;font-size:.74rem;}
.plaque .row2 .n{font-family:var(--display);font-size:1.3rem;line-height:1.05;min-width:1.1em;text-align:right;}
.plaque .goal{font-family:var(--hand);font-size:.85rem;color:#8a7a5a;margin-top:1px;}
/* Bidding controls under your hand */
.bidbox{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;}
.bidbox .q{font-weight:800;color:var(--text);text-align:center;}
.bidbox .q .s{font-size:1.1em;}
.bidbox .btns{display:flex;gap:8px;justify-content:center;width:100%;max-width:420px;}
.bidbox .btns .btn{flex:1;min-height:50px;padding:0 10px;}
.suitbtn{flex:1;min-height:56px;border:0;border-radius:14px;background:linear-gradient(180deg,#fff,#f1ead9);color:#1d1b2e;font-size:1.7rem;line-height:1;font-weight:900;box-shadow:0 4px 0 #b9ad92,0 6px 12px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.suitbtn small{font-size:.66rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#6a6a80;}
.suitbtn.r{color:#d81e3a;}
.suitbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9ad92;}
.alone{display:flex;align-items:center;gap:10px;color:var(--text-2);font-weight:800;font-size:.92rem;}
.sum{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums;}
.sum th,.sum td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--w08);}
.sum th:first-child,.sum td:first-child{text-align:left;}
.sum td.big{font-weight:900;font-size:1.2rem;}
.sum tr.lead td{color:var(--yellow);}
.hsum{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r);background:var(--w06);}
.hsum .res{font-family:var(--display);font-size:1.5rem;color:var(--yellow);}
.hsum .res.bad{color:var(--red);}
.hsum .why{color:var(--text-2);font-weight:700;}
/* Tablet and larger: bigger pieces on the table */
@media (min-width:700px) and (min-height:600px){
  .cseat .tag{font-size:.98rem;padding:5px 13px 5px 5px;gap:8px;}
  .cseat .tag .avatar{width:32px;height:32px;font-size:.88rem;}
  .cseat .chip-s{font-size:.84rem;padding:2px 10px;}
  .cseat .backs{--cw:30px;}
  .cseat .backs .pcard+.pcard{margin-left:-21px;}
  .ctrick .pcard{--cw:86px;}
  .cmsg{font-size:.98rem;padding:8px 16px;}
  .cbar .hint{font-size:1.06rem;}
  .kitty{--cw:84px;}
  .plaque{width:108px;padding:8px 8px 9px;}
  .plaque .lb{font-size:.68rem;} .plaque .st{font-size:2.8rem;} .plaque .by{font-size:1.1rem;}
  .plaque .row2 .t{font-size:.86rem;} .plaque .row2 .n{font-size:1.55rem;} .plaque .goal{font-size:1rem;}
  .cseat .tag .nm{max-width:150px;}
}
/* iPad portrait: a larger table and hand that use the height */
@media (min-width:700px) and (min-height:900px) and (orientation:portrait){
  .stage{max-width:740px;}
  .ctable .felt-in{height:clamp(460px,58dvh,680px);}
  .chand{--cw:98px;}
}
/* Landscape tablet / desktop: table with a side panel for the controls, hand below */
@media (orientation:landscape) and (min-width:1000px) and (min-height:600px){
  .stage:has(> .ctable){max-width:1120px;display:grid;grid-template-columns:minmax(0,1fr) 270px;grid-template-rows:1fr auto auto;grid-template-areas:"table bar" "table sort" "hand hand";column-gap:18px;}
  .stage > .ctable{grid-area:table;margin-bottom:6px;}
  .stage > .ctable .felt-in{height:clamp(340px,calc(100dvh - 262px),600px);}
  .stage > .cbar{grid-area:bar;align-self:end;flex-wrap:wrap;margin:0 0 14px;text-align:center;}
  .stage > .cbar .btn{width:100%;}
  .stage > .csort-row{grid-area:sort;align-self:end;justify-content:center;margin:0 0 8px;}
  .stage > .chand{grid-area:hand;--cw:84px;}
  .stage > .cbar .bidbox .btns{flex-wrap:wrap;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'euchre_state', SEATS = ['s', 'w', 'n', 'e'];
  var RV = { '9': 0, '10': 1, J: 2, Q: 3, K: 4, A: 5 };
  var SAME = { s: 'c', c: 's', h: 'd', d: 'h' };
  var GLYPH = Cards.GLYPH, SNAME = { s: 'Spades', h: 'Hearts', d: 'Diamonds', c: 'Clubs' };
  var CPU_MS = 750;

  Kit.init({
    orient: 'portrait',   // phones: sideways leaves no room (the hand or board falls below the screen); tablets turn freely
    id: 'euchre',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: 'Scores so far', onClick: function () { if (S) showScores(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history('euchre', { keys: ['eu'], title: 'Euchre: past games' }); } }
    ]),
    rules:
      '<p class="goal">You and your partner (sitting across from you) team up against the other two. Win tricks to score points. <b>First team to 10 points wins.</b></p>' +
      '<h3>The cards</h3><p>Only 24 cards: 9, 10, J, Q, K and A of each suit. Everyone gets 5 cards. The next card is turned face up in the middle.</p>' +
      '<h3>Picking trump</h3><ul>' +
      '<li><b>Round 1:</b> going around the table, each player can <b>order up</b> the face-up card, which makes its suit trump. The dealer picks that card up and throws away one card. Or you can <b>pass</b>.</li>' +
      '<li><b>Round 2:</b> if everyone passed, the card is turned down. Now each player can <b>name any other suit</b> as trump, or pass.</li>' +
      '<li>If everyone passes twice, the cards are thrown in and the next player deals.</li>' +
      '<li>The team that picks trump are the <b>makers</b>. They need to win at least 3 of the 5 tricks.</li></ul>' +
      '<h3>The bowers (the best cards)</h3><ul>' +
      '<li>The <b>Jack of trump</b> is the <b>right bower</b>, the highest card of all.</li>' +
      '<li>The <b>other Jack of the same color</b> is the <b>left bower</b>, the second highest. It counts as a trump, not as its own suit. (If hearts are trump, the J♦ is a heart.)</li>' +
      '<li>Then trump goes A, K, Q, 10, 9. Other suits go A, K, Q, J, 10, 9.</li></ul>' +
      '<h3>Playing</h3><ul>' +
      '<li>The player left of the dealer leads first. You must <b>follow the suit</b> that was led if you can. Remember the left bower counts as trump.</li>' +
      '<li>If you can\'t follow suit, play anything, including a trump.</li>' +
      '<li>The highest trump wins the trick. If no trump was played, the highest card of the suit led wins. The winner leads next.</li></ul>' +
      '<h3>Going alone</h3><p>When you pick trump you can choose to <b>go alone</b>. Your partner puts their cards down and sits out. Win all 5 tricks by yourself for 4 points!</p>' +
      '<h3>Scoring</h3><ul>' +
      '<li>Makers win 3 or 4 tricks: <b>1 point</b>.</li>' +
      '<li>Makers win all 5 (a <b>march</b>): <b>2 points</b>.</li>' +
      '<li>Going alone and winning all 5: <b>4 points</b>.</li>' +
      '<li>Makers win fewer than 3: they are <b>euchred</b> and the other team gets <b>2 points</b>.</li></ul>' +
      '<h3>Stick the dealer (optional)</h3><p>A popular house rule: if everyone passes in round 2, the dealer is <b>stuck</b> and must name a suit, so the hand is never thrown in.</p>' +
      '<h3>Online</h3><ul><li><b>Play online</b>, beside the start button, opens a table that the others join on their own devices. Partners sit the way you seated them in the setup, and anyone else who joins takes an open seat. The computer plays every seat that nobody takes.</li>' +
      '<li>Call and play whenever it’s your turn. The home screen shows when it’s your move, and each new hand deals itself.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null, token = 0, undoStack = [];
  var NET = null;   // the online table while playing at one (see Online below)
  // Pass & play: ME is the seat drawn at the bottom with its hand face up (the person holding the device, S.me);
  // BLIND hides every hand while the device is handed over. One person among robots never sees the cover.
  var ME = 0, BLIND = false;
  function posOf(p) { return SEATS[(p - ME + 4) % 4]; }
  function MT() { return ME % 2; }
  function person(p) { return p >= 0 && !!S.players[p] && !S.players[p].cpu; }
  function onePerson() { return !!NET || !S || S.players.filter(function (q) { return !q.cpu; }).length < 2; }
  function showFor(p) { BLIND = false; ME = p; S.me = p; S.wantAlone = false; save(); render(); }
  function gate(p, then) {
    if (NET || !person(p) || p === ME) { then && then(); return; }
    BLIND = true; undoStack = []; render();
    var t = token;
    Kit.handoff({ name: S.players[p].name, color: Kit.color(p % 2), what: 'cards' }).then(function () {
      if (t !== token || !S) return;
      showFor(p); then && then();
    });
  }
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'over') Kit.resume.set('Hand ' + S.handNo + ' · ' + S.scores[0] + '–' + S.scores[1]);
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function nm(p) { return S.players[p].name; }
  function who(p) { return p === ME && onePerson() ? 'You' : S.players[p].name; }
  function team(t) { return S.players[t].name + ' & ' + S.players[t + 2].name; }
  function partner(p) { return (p + 2) % 4; }

  // The computer's skill. Normal is how it has always played; a game saved before there were levels plays Normal.
  var LEVELS = [['easy', 'Easy', 'Calls trump on a whim and often plays the wrong card.'],
    ['normal', 'Normal', 'Calls trump on a good hand and keeps track of the trumps.'],
    ['hard', 'Hard', 'Remembers every card played and thinks each call and play through.']];
  function lvName(v) { return v === 'easy' || v === 'hard' ? v : 'normal'; }
  function lvOf(p) { var pl = S.players && S.players[p]; return lvName((pl && pl.level) || S.level); }
  function freshGame(players, o) {
    return {
      mode: o.mode || 'cpu', me: 0, level: o.level || 'normal', target: o.target, stick: o.stick, players: players, scores: [0, 0], dealer: Math.floor(Math.random() * 4), handNo: 0,
      rounds: [], log: [], highlights: [], started: Date.now(), throwins: 0, worst: [null, null]
    };
  }
  function showSetup() {
    S = null; token++; BLIND = false; ME = 0; Kit.handoff.close();
    var st = Kit.setup(app, {
      modes: Kit.modes(['cpu', 'local']),
      players: { min: 4, max: 4, cpu: function (m) { return m === 'cpu' ? 'seats' : m === 'local' ? 'mix' : false; }, teams: [[0, 2], [1, 3]] },
      intro: 'You and a computer partner against two computers',
      options: [
        { id: 'target', label: 'Play to', help: 'The first team to reach this many points wins.', value: 10, choices: [[5, '5\nQuick'], [10, '10\nStandard']] },
        { id: 'stick', label: 'Stick the dealer', help: 'What happens if all four players pass on picking trump twice.', value: 0, choices: [[0, 'Off\nRedeal', 'The cards are thrown in and the next player deals.'], [1, 'On\nDealer must call', 'The dealer is stuck and has to pick a trump suit.']] },
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: LEVELS }
      ],
      onStart: function (cfg) {
        var players = cfg.players.map(function (p) { return { name: p.name, cpu: !!p.cpu, level: p.cpu && p.level ? lvName(p.level) : undefined }; });   // (each robot its own skill at a mixed table)
        S = freshGame(players, { target: +cfg.options.target || 10, stick: +cfg.options.stick === 1, mode: cfg.mode, level: lvName(cfg.options.level) });
        hideTeamName(); ME = 0;
        undoStack = []; Kit.gameStart(); newHand();
      }
    });
  }
  // Team names like "Tim & Bender" go in game history; keep them out of the
  // frequent-players list on this device.
  function hideTeamName() {
    try {
      var h = JSON.parse(localStorage.getItem('gn_hidden_names') || '[]');
      [team(0), team(1)].forEach(function (n) { if (h.indexOf(n) < 0) h.push(n); });
      localStorage.setItem('gn_hidden_names', JSON.stringify(h.slice(-200)));
    } catch (e) {}
  }

  // ── Card rules ────────────────────────────────────────────────────────────
  function isRight(c, t) { return c.r === 'J' && c.s === t; }
  function isLeft(c, t) { return c.r === 'J' && c.s === SAME[t]; }
  function eff(c, t) { return t && isLeft(c, t) ? t : c.s; }
  function isTrump(c, t) { return !!t && eff(c, t) === t; }
  // Strength of a card in a trick (led = effective suit led)
  function power(c, t, led) {
    if (isRight(c, t)) return 40;
    if (isLeft(c, t)) return 39;
    if (eff(c, t) === t) return 30 + RV[c.r];
    if (c.s === led) return 20 + RV[c.r];
    return RV[c.r];
  }
  function trickWinner(trick, t) {
    var led = eff(trick[0].c, t), best = trick[0];
    trick.forEach(function (x) { if (power(x.c, t, led) > power(best.c, t, led)) best = x; });
    return best;
  }
  function legal(p) {
    var h = S.hands[p];
    if (!S.trick.length) return h.slice();
    var led = eff(S.trick[0].c, S.trump), f = h.filter(function (c) { return eff(c, S.trump) === led; });
    return f.length ? f : h.slice();
  }
  function suitOrder(t) {
    if (!t) return ['s', 'h', 'c', 'd'];
    var opp = t === 's' || t === 'c' ? ['h', 'd'] : ['s', 'c'];
    return [t, opp[0], SAME[t], opp[1]];
  }
  function sortHand(h, t) {
    var order = suitOrder(t);
    return h.sort(function (a, b) {
      return order.indexOf(eff(a, t)) - order.indexOf(eff(b, t)) || power(b, t, eff(b, t)) - power(a, t, eff(a, t));
    });
  }
  function find(h, id) { for (var i = 0; i < h.length; i++) if (h[i].id === id) return i; return -1; }
  // Your hand on screen (display only). Suit: euchre grouping (trump and both
  // bowers first once trump is set). Rank: A K Q J 10 9, suits in table order.
  var sortT = Cards.sortToggle(null, { key: 'euchre_sort', value: 'suit', flip: function () { return handEl; }, onChange: function () { if (S && handEl) paintHand(); } });
  function view(h) {
    var t = S.trump, a = h.slice();
    if (sortT.get() !== 'rank') return sortHand(a, t);
    var order = suitOrder(t);
    return Cards.sortBy(a, 'rank', { rank: function (x, y) { return RV[y.r] - RV[x.r] || order.indexOf(eff(x, t)) - order.indexOf(eff(y, t)); } });
  }
  function suitHtml(s) { return '<span class="' + (s === 'h' || s === 'd' ? 'red-s' : '') + '">' + GLYPH[s] + '</span>'; }
  function active(p) { return p !== S.out; }
  function nextActive(p) { var q = (p + 1) % 4; if (!active(q)) q = (q + 1) % 4; return q; }
  function activeCount() { return S.out >= 0 ? 3 : 4; }

  // ── Dealing ───────────────────────────────────────────────────────────────
  function newHand() {
    token++;
    S.handNo++;
    if (S.handNo > 1 || S.rounds.length || S.throwins) S.dealer = (S.dealer + 1) % 4;
    var d = Cards.shuffle(Cards.deck({ ranks: ['9', '10', 'J', 'Q', 'K', 'A'] }));
    S.hands = [[], [], [], []];
    // Real deal: 3-2 then 2-3, starting left of the dealer
    var k = 0;
    [[3, 2, 3, 2], [2, 3, 2, 3]].forEach(function (pat) {
      for (var i = 1; i <= 4; i++) { var p = (S.dealer + i) % 4, n = pat[i - 1]; for (var j = 0; j < n; j++) S.hands[p].push(d[k++]); }
    });
    S.up = d[20]; S.kitty = d.slice(21);
    S.hands.forEach(function (h) { sortHand(h, null); });
    S.trump = null; S.maker = -1; S.alone = false; S.out = -1; S.callRound = 0; S.picked = false;
    S.bids = [null, null, null, null]; S.passes = 0;
    S.trick = []; S.trickNo = 0; S.tricks = [0, 0, 0, 0]; S.played = []; S.voids = [{}, {}, {}, {}]; S.lastWin = -1;
    S.phase = 'bid1'; S.turn = (S.dealer + 1) % 4; S.wantAlone = false;
    undoStack = [];
    save(); render(); Kit.sfx('deal');
    next(true);
    dealAnim();
  }
  function dealAnim() {
    var from = seatEls[S.dealer] && seatEls[S.dealer].querySelector('.tag');
    Array.prototype.forEach.call(handEl.querySelectorAll('.pcard'), function (n, i) {
      n.style.opacity = '0';
      setTimeout(function () { n.style.opacity = ''; Cards.fly(n, from, { ms: 360 }); Kit.sfx('deal'); }, 80 + i * 70);
    });
  }

  // ── Turn driver ───────────────────────────────────────────────────────────
  function next(first) {
    if (!S) return;
    var p = S.turn, ph = S.phase;
    // a different person's turn: hands down, pass the device, then carry on as them
    if ((ph === 'bid1' || ph === 'bid2' || ph === 'play' || ph === 'discard') && person(p) && p !== ME) { gate(p, function () { next(first); }); return; }
    paintAll();
    if ((ph === 'bid1' || ph === 'bid2' || ph === 'play') && p >= 0 && !person(p)) {
      var t = token;
      setTimeout(function () {
        if (t !== token || !S || S.phase !== ph || S.turn !== p) return;
        if (ph === 'bid1') cpuBid1(p); else if (ph === 'bid2') cpuBid2(p); else play(p, cpuChoose(p));
      }, first ? CPU_MS + 500 : CPU_MS + Math.random() * 200);
    }
  }

  // ── Bidding ───────────────────────────────────────────────────────────────
  function bid1(p, order, alone) {
    if (NET) { if (p === ME) netAct(function (st, me) { return nBid1(st, me, order, alone); }); return; }
    if (!S || S.phase !== 'bid1' || S.turn !== p) return;
    if (!order) {
      S.bids[p] = 'Pass'; S.passes++; Kit.sfx('tap');
      if (S.passes === 4) { turnDown(); return; }
      S.turn = (p + 1) % 4; save(); next(); return;
    }
    S.bids[p] = alone ? 'Alone!' : p === S.dealer ? 'I’ll take it' : 'Order up!';
    callTrump(p, S.up.s, alone, 1);
  }
  function turnDown() {

    st.trump = null; st.maker = -1; st.alone = false; st.out = -1; st.callRound = 0; st.picked = false;
    st.bids = [null, null, null, null]; st.passes = 0;
    st.trick = []; st.trickNo = 0; st.tricks = [0, 0, 0, 0]; st.played = []; st.voids = [{}, {}, {}, {}]; st.lastWin = -1;
    st.phase = 'bid1'; st.turn = (st.dealer + 1) % 4;
  }
  // The moves, on the table's state (S is st while they run): each returns the move, or null when it isn't allowed
  function nCall(st, p, suit, alone, round, mv) {
    st.trump = suit; st.maker = p; st.alone = !!alone; st.out = alone ? partner(p) : -1; st.callRound = round;
    st.hands.forEach(function (h) { sortHand(h, suit); });
    mv.call = 1; mv.alone = alone ? 1 : 0; mv.s = suit;
    if (round === 1 && st.dealer !== st.out) {
      st.picked = true; st.hands[st.dealer].push(st.up); sortHand(st.hands[st.dealer], suit);
      st.phase = 'discard'; st.turn = st.dealer; mv.pick = 1;
      return mv;
    }
    nStart(st);
    return mv;
  }
  function nStart(st) {
    st.dtA = st.hands.map(function (h) { return h.map(function (c) { return c.r + c.s; }); });
    st.phase = 'play'; st.trick = []; st.trickNo = 0; st.tricks = [0, 0, 0, 0]; st.bids = [null, null, null, null];
    st.turn = st.leader = nextActive(st.dealer);
  }
  function nBid1(st, p, order, alone) {
    if (st.phase !== 'bid1' || st.turn !== p) return null;
    var mv = { k: 'b1', p: p };
    if (!order) {
      st.bids[p] = 'Pass'; st.passes++;
      if (st.passes === 4) { st.phase = 'bid2'; st.passes = 0; st.bids = [null, null, null, null]; st.turn = (st.dealer + 1) % 4; mv.down = 1; }
      else st.turn = (p + 1) % 4;
      return mv;
    }
    st.bids[p] = mv.say = alone ? 'Alone!' : p === st.dealer ? 'I’ll take it' : 'Order up!';
    return nCall(st, p, st.up.s, alone, 1, mv);
  }
  function nBid2(st, p, suit, alone) {
    if (st.phase !== 'bid2' || st.turn !== p) return null;
    var mv = { k: 'b2', p: p };
    if (!suit) {
      if (st.stick && p === st.dealer) return null;
      st.bids[p] = 'Pass'; st.passes++;
      if (st.passes === 4) { st.throwins++; st.handNo--; nDeal(st); mv.thrown = 1; }
      else st.turn = (p + 1) % 4;
      return mv;
    }
    if (suit === st.up.s || !SNAME[suit]) return null;
    st.bids[p] = mv.say = (alone ? 'Alone, ' : '') + SNAME[suit] + '!';
    return nCall(st, p, suit, alone, 2, mv);
  }
  function nDisc(st, p, id) {
    if (st.phase !== 'discard' || st.dealer !== p || st.turn !== p) return null;
    var i = find(st.hands[p], id); if (i < 0) return null;
    st.hands[p].splice(i, 1);
    nStart(st);
    return { k: 'disc', p: p };
  }
  function nPlay(st, p, id) {
    if (st.phase !== 'play' || st.turn !== p) return null;
    var i = find(st.hands[p], id); if (i < 0 || !legal(p).some(function (c) { return c.id === id; })) return null;
    var card = st.hands[p][i], mv = { k: 'play', p: p, c: card };
    if (st.trick.length) { var led = eff(st.trick[0].c, st.trump); if (eff(card, st.trump) !== led) st.voids[p][led] = 1; }
    st.hands[p].splice(i, 1);
    st.trick.push({ p: p, c: card });
    if (st.trick.length < activeCount()) { st.turn = nextActive(p); return mv; }
    var win = trickWinner(st.trick, st.trump);
    mv.t = st.trick.slice(); mv.w = win.p;
    st.trick.forEach(function (x) { st.played.push(x.c.id); });
    st.tricks[win.p]++; st.lastWin = win.p;
    st.trick = []; st.trickNo++; st.leader = st.turn = win.p;
    if (st.trickNo === 5) { nEndHand(st); mv.end = 1; }
    return mv;
  }
  function nEndHand(st) {
    var mt = st.maker % 2, mk = st.tricks[mt] + st.tricks[mt + 2], pts = [0, 0], res;
    if (mk >= 3) { pts[mt] = mk === 5 ? (st.alone ? 4 : 2) : 1; res = mk === 5 ? (st.alone ? 'alone-march' : 'march') : 'made'; }
    else { pts[1 - mt] = 2; res = 'euchred'; }
    st.scores[0] += pts[0]; st.scores[1] += pts[1];
    [0, 1].forEach(function (tm) {
      var d = st.scores[1 - tm] - st.scores[tm];
      if (d > 0 && (!st.worst[tm] || d > st.worst[tm].d)) st.worst[tm] = { d: d, a: st.scores[tm], b: st.scores[1 - tm] };
    });
    st.rounds.push(pts);
    st.log.push({ hand: st.handNo, maker: st.maker, alone: st.alone, trump: st.trump, tricks: mk, res: res, pts: pts.slice(), up: st.up ? st.up.r + st.up.s : '', cr: st.callRound, dl: st.dealer,
      mh: st.dtA ? st.dtA[st.maker] : null, w: st.tricks.join('.'), ya: st.dtA || null, sc: st.scores.join('.') });
    var name = st.players[st.maker].name;
    if (res === 'alone-march') st.highlights.push(name + ' went alone and marched in hand ' + st.handNo);
    if (st.alone && res === 'euchred') st.highlights.push(name + ' went alone and got euchred in hand ' + st.handNo);
    if (st.scores[0] >= st.target || st.scores[1] >= st.target) {
      st.phase = 'over'; st.turn = -1; st.winner = st.scores[0] > st.scores[1] ? 0 : 1; st.series[st.winner]++;
    } else nDeal(st);
  }
  function netTurn(st) {
    if (!st || !st.at || st.phase === 'over') return [];
    return st.turn >= 0 && /^(bid1|bid2|discard|play)$/.test(st.phase) ? [st.at[st.turn]] : [];
  }
  function netOver(st) {
    if (!st || st.phase !== 'over') return null;
    var w = st.winner;
    return { win: [st.at[w], st.at[w + 2]], text: st.players[w].name + ' & ' + st.players[w + 2].name + ' win ' + st.scores[w] + ' to ' + st.scores[1 - w] };
  }
  // A computer seat (or a person who left): the computer player above
  function netBot(st, seat) {
    var p = st.pos[seat];
    var mv = withS(st, function () {
      if (st.turn !== p) return null;
      if (st.phase === 'bid1') { var a = cpuCall1(p); return nBid1(st, p, a.order, a.alone); }
      if (st.phase === 'bid2') { var b = cpuCall2(p); return nBid2(st, p, b.suit, b.alone); }
      if (st.phase === 'discard') return nDisc(st, p, cpuDiscard(p).id);
      if (st.phase === 'play') return nPlay(st, p, cpuChoose(p).id);
      return null;
    });
    return mv ? { state: st, mv: mv } : null;
  }
  // your move: f(state, your place) -> the move, or null
  function netAct(f) {
    if (!NET || NBUSY) return;
    if (!NET.myTurn()) { Kit.haptic('error'); return; }
    var me = ME;
    NALONE = false;
    NET.act(function (st) { var mv = withS(st, function () { return f(st, me); }); return mv ? { state: st, mv: mv } : null; });
  }
  function netFly(id) { var n = handEl && handEl.querySelector('[data-id="' + id + '"]'); NFLY = n ? { id: id, r: n.getBoundingClientRect() } : null; }
  // What this device draws: its own hand face up, the others as card backs, no face-down cards
  function netView(st) {
    var mine = !!NET && NET.seat >= 0, V = JSON.parse(JSON.stringify(st)), seats = NET ? NET.seats : [];
    ME = mine ? st.pos[NET.seat] : 0;
    V.hands = V.hands.map(function (h, q) { return q === ME && mine ? h : h.map(function () { return {}; }); });
    V.kitty = []; V.dtA = null; V.wantAlone = NALONE;
    V.players = V.players.map(function (pl, q) { var s = seats[st.at[q]]; return { name: pl.name, cpu: s ? !!s.bot : pl.cpu }; });
    return V;
  }
  function netShow(net, info) {
    NET = net; NST = net.state;
    if (info.fresh || info.again) { NQ = []; NGEN++; NBUSY = false; netCloseOv(); }
    NQ.push({ st: JSON.parse(JSON.stringify(net.state)), prev: info.prev ? JSON.parse(JSON.stringify(info.prev)) : null, mv: info.mv, info: info });
    if (NQ.length > 6) NQ = NQ.slice(-1).map(function (x) { x.skip = true; return x; });   // far behind: jump to now
    if (!NBUSY) netPump();
  }
  function netPump() {
    var it = NQ.shift(); if (!it) return;
    var g = NGEN; NBUSY = true;
    netStep(it, function () {
      if (g !== NGEN) return;
      NBUSY = false;
      if (NQ.length) netPump();
      else if (NET && S) paintAll();
    });
  }
  function bubble(p, t, call) {
    var s = seatEls[p]; if (!s) return;
    var b = el('div', { class: 'say' + (call ? ' call' : ''), text: t }); s.appendChild(b);
    setTimeout(function () { b.remove(); }, 1500);
  }
  function netStep(it, done) {
    var st = it.st, prev = it.prev, mv = it.mv, info = it.info, g = NGEN;
    function later(f, ms) { setTimeout(function () { if (g === NGEN && NET) f(); }, ms); }
    token++;
    if (!mv || !prev || info.fresh || info.again || it.skip || !prev.hands) {
      S = netView(st); render();
      if (info.again) { Kit.gameStart(); Kit.sfx('deal'); Kit.callout('New game'); dealAnim(); }
      else if (info.fresh) { Kit.gameStart(); if (st.phase !== 'over') Kit.sfx('deal'); }
      if (st.phase === 'over') later(netEnd, info.fresh ? 300 : 900);
      done(); return;
    }
    if (mv.k === 'b1' || mv.k === 'b2') {
      if (mv.pick) {   // the dealer picks up the turned card
        S = netView(prev); render();
        var upNode = kittyEl && kittyEl.querySelector('.up'), dest = seatEls[st.dealer] && seatEls[st.dealer].querySelector('.tag');
        bubble(mv.p, mv.say, true);
        Kit.sfx('chip'); if (mv.alone) Kit.callout('Alone!');
        if (upNode && dest) {
          var a = upNode.getBoundingClientRect(), b = dest.getBoundingClientRect();
          upNode.style.transition = 'transform .5s cubic-bezier(.3,.7,.3,1), opacity .5s';
          upNode.style.transform = 'translate(' + (b.left + b.width / 2 - a.left - a.width / 2) + 'px,' + (b.top - a.top) + 'px) scale(.6)';
          upNode.style.opacity = '.2';
        }
        later(function () { S = netView(st); render(); later(done, 400); }, 650);
        return;
      }
      S = netView(st); render();
      if (mv.call) { bubble(mv.p, mv.say, true); Kit.sfx('chip'); Kit.haptic('medium'); if (mv.alone) Kit.callout('Alone!'); }
      else if (mv.thrown) { flash('Everyone passed. New deal!'); Kit.sfx('whoosh'); later(function () { Kit.sfx('deal'); dealAnim(); }, 300); }
      else if (mv.down) { bubble(mv.p, 'Pass'); flash('Turned down. Name another suit'); Kit.sfx('flip'); }
      else Kit.sfx('tap');
      later(done, mv.call || mv.thrown ? 900 : 420); return;
    }
    if (mv.k === 'disc') { S = netView(st); render(); Kit.sfx('flip'); later(done, 350); return; }
    // a card: check it follows from what's on screen, otherwise just draw the table as it is now
    var ok = mv.k === 'play' && prev.phase === 'play' && prev.turn === mv.p && find(prev.hands[mv.p], mv.c.id) >= 0;
    if (!ok) { S = netView(st); render(); if (st.phase === 'over') later(netEnd, 600); done(); return; }
    var fromRect = NFLY && NFLY.id === mv.c.id ? NFLY.r : null; NFLY = null;
    function fly(node) {
      var from = fromRect && mv.p === ME ? { getBoundingClientRect: function () { return fromRect; } } : seatEls[mv.p] && seatEls[mv.p].querySelector('.tag');
      Cards.fly(node, from, { ms: 340 });
      Kit.sfx(isRight(mv.c, prev.trump) || isLeft(mv.c, prev.trump) ? 'chip' : 'flip');
      if (mv.p === ME) Kit.haptic('light');
    }
    if (mv.w == null) {
      S = netView(st); render();
      fly(trickEl.querySelector('[data-id="' + mv.c.id + '"]'));
      later(done, 380); return;
    }
    // the last card of a trick: show it land, light the winner, sweep the trick to them
    var V = netView(prev);
    V.hands[mv.p] = V.hands[mv.p].filter(function (c, i) { return mv.p === ME ? c.id !== mv.c.id : i > 0; });
    V.trick = mv.t; V.turn = -1;
    S = V; render();
    fly(trickEl.querySelector('[data-id="' + mv.c.id + '"]'));
    later(function () {
      var wc = mv.t.filter(function (x) { return x.p === mv.w; })[0], wn = wc && trickEl.querySelector('[data-id="' + wc.c.id + '"]');
      if (wn) wn.classList.add('win');
      if (mv.w % 2 === MT()) Kit.haptic('light');
      later(function () {
        var dest = seatEls[mv.w].querySelector('.tag').getBoundingClientRect(), box = trickEl.getBoundingClientRect();
        Array.prototype.forEach.call(trickEl.children, function (n) {
          n.style.transition = 'transform .35s ease-in, opacity .35s ease-in';
          n.style.transform = 'translate(' + (dest.left - box.left - 30) + 'px,' + (dest.top - box.top - 30) + 'px) scale(.4)';
          n.style.opacity = '0';
        });
        Kit.sfx('whoosh');
        later(function () {
          trickEl.innerHTML = '';
          if (!mv.end) { S = netView(st); render(); done(); return; }
          netHandEnd(st, done);
        }, 380);
      }, 650);
    }, 850);
  }
  // A hand just finished: its result, then the next deal (already dealt underneath) or the end
  function netHandEnd(st, done) {
    var L = st.log[st.log.length - 1], g = NGEN;
    S = netView(st);
    var mt = L.maker % 2, good = (L.res === 'euchred') !== (mt === MT());
    if (L.res === 'euchred') Kit.callout('Euchred!', good ? null : '#ff4d5e');
    else if (L.res === 'alone-march') Kit.callout('Alone march!');
    else if (L.res === 'march') Kit.callout('March!');
    if (good) { Kit.sfx('good'); Kit.haptic('success'); if (L.res !== 'made') Kit.confetti({ count: 70 }); } else Kit.sfx('bad');
    render();
    if (st.phase === 'over') { setTimeout(function () { if (g === NGEN && NET) netEnd(); }, L.res === 'made' ? 700 : 1300); done(); return; }
    Kit.sfx('deal'); dealAnim();
    var r = resultText(L);
    var node = el('div', null, [
      el('div', { class: 'hsum' }, [
        el('div', { class: 'why', html: Kit.esc(who(L.maker)) + (L.alone ? ' went alone in ' : ' called ') + suitHtml(L.trump) + ' ' + SNAME[L.trump] }),
        el('div', { class: 'res' + (r.bad ? ' bad' : ''), text: r.big }),
        el('div', { class: 'why', text: r.why })
      ]),
      scoreTable(L.pts),
      el('p', { class: 'muted', style: { 'margin-top': '10px', 'text-align': 'center' }, text: 'First team to ' + S.target + ' wins.' })
    ]);
    setTimeout(function () {
      if (g !== NGEN || !NET) return;
      netCloseOv();
      NOV = Kit.sheet({ title: 'Hand ' + L.hand, node: node, onClose: function () { NOV = null; }, actions: [{ label: 'Next hand', primary: true }] });
    }, L.res === 'made' ? 500 : 1100);
    done();
  }
  function netEnd() {
    if (!NET || !NST || NST.phase !== 'over') return;
    var st = NST, w = st.winner, key = NET.code + ':' + st.started;
    var V = netView(st); S = V;
    // recorded once per device per game (remembered here, so opening the finished table again doesn't add it twice)
    var done = []; try { done = JSON.parse(localStorage.getItem('euchre_netrec')) || []; } catch (e) {}
    if (NET.seat >= 0 && !NREC[key] && done.indexOf(key) < 0) {
      NREC[key] = 1;
      try { localStorage.setItem('euchre_netrec', JSON.stringify(done.concat([key]).slice(-20))); } catch (e) {}
      var hl = st.highlights.slice(), me = ME;
      [0, 1].forEach(function (tm) {
        var eu = st.log.filter(function (L) { return L.maker % 2 === tm && L.res === 'euchred'; }).length;
        if (eu) hl.push(team(tm) + ' got euchred ' + (eu === 1 ? 'once' : eu === 2 ? 'twice' : eu + ' times'));
        var mar = st.log.filter(function (L) { return L.maker % 2 === tm && L.res === 'march'; }).length;
        if (mar) hl.push(team(tm) + ' marched ' + (mar === 1 ? 'once' : mar === 2 ? 'twice' : mar + ' times'));
      });
      if (st.worst[w] && st.worst[w].d >= 4) hl.push('Comeback! ' + team(w) + ' were down ' + st.worst[w].a + '–' + st.worst[w].b + ' and won');
      Kit.record('euchre', {
        started: st.started, mode: 'Online',
        players: [0, 1].map(function (tm) { return { name: team(tm), score: st.scores[tm], cpu: !!V.players[tm].cpu && !!V.players[tm + 2].cpu }; }),
        winner: team(w),
        rounds: { labels: st.rounds.map(function (r, i) { return 'H' + (i + 1); }), scores: st.rounds },
        highlights: hl.slice(0, 5).concat([st.rounds.length + ' hands, played to ' + st.target]),
        detail: { names: st.players.map(function (p) { return p.name; }), to: st.target, throwins: st.throwins || 0,
          hx: st.log.map(function (L) { var o = { m: L.maker, t: L.trump, k: L.tricks, r: L.res, u: L.up || '', c: L.cr || 0, d: L.dl, h: L.mh || [] }; if (L.alone) o.a = 1;
            if (L.w) o.w = L.w; if (L.ya && L.maker !== me && L.ya[me]) o.y = L.ya[me]; if (L.sc) o.s = L.sc; return o; }) }
      });
    }
    var watching = NET.seat < 0, res = NET.result, left = res && res.left != null, m = MT();
    var won = !watching && w === m;
    netCloseOv();
    NOV = Kit.win({
      title: left ? res.text : won ? 'You win!' : team(w) + ' win',
      sub: won ? 'You and ' + st.players[partner(ME)].name + ' won ' + st.scores[w] + ' to ' + st.scores[1 - w] : 'They won ' + st.scores[w] + ' to ' + st.scores[1 - w],
      rank: [w, 1 - w].map(function (tm) { return { name: team(tm), score: st.scores[tm], color: Kit.color(tm) }; }),
      lose: !won, icon: won ? 'trophy' : 'users',
      againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { if (left) { TurnNet.leave(); TurnNet.open(); } else NET.again(); },
      closeLabel: 'Back to games'
    });
  }
  function netLeave() {
    NET = null; NST = null; NQ = []; NGEN++; NBUSY = false; token++; NALONE = false;
    netCloseOv();
    boot();
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  function boot() {
    var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (saved && saved.players && saved.hands && saved.phase !== 'over') {
      S = saved; ME = S.me || 0; Kit.gameStart();
      if (S.phase === 'starting') S.phase = 'play', S.trick = [], S.trickNo = 0, S.tricks = [0, 0, 0, 0], S.turn = S.leader = nextActive(S.dealer), S.bids = [null, null, null, null];
      render();
      if (S.phase === 'thrown') newHand();
      else if (S.phase === 'play' && S.trick.length === activeCount()) setTimeout(resolveTrick, 600);
      else next();
    } else showSetup();
  }
  boot();
  TurnNet.setup({
    game: 'euchre', title: 'Euchre', min: 2, max: 4, botMs: 900,
    seats: function () { return 4; },
    opts: netOpts, start: netStart, turn: netTurn, over: netOver, bot: netBot,
    show: netShow, leave: netLeave
  });
})();
</script>

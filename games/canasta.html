<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canasta</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="canasta-core.js"></script>
<style>
/* ── The page is laid out to the screen: four shapes, chosen by layoutFor() and sized by fit() ── */
.cn{position:relative;display:grid;gap:8px;padding:4px 8px 0;box-sizing:border-box;margin:0 auto;width:100%;
  height:var(--ph,calc(100dvh - var(--bar,64px)));padding-bottom:max(calc(var(--safe-b) + 6px),12px);}
.cn.L-pu{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "tbl" "act" "hand";gap:6px;}
.cn.L-tu{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "tbl" "act" "hand";max-width:900px;padding-left:14px;padding-right:14px;gap:10px;}
.cn.L-ps{grid-template-columns:minmax(0,1fr) var(--side,380px);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"tbl top" "tbl act" "tbl hand";column-gap:10px;row-gap:6px;
  padding-left:max(var(--safe-l,0px),10px);padding-right:max(var(--safe-r,0px),17px);}
.cn.L-ts{grid-template-columns:minmax(0,1fr) var(--side,360px);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"tbl top" "tbl pad" "tbl act" "hand hand";column-gap:14px;row-gap:8px;padding-left:18px;padding-right:18px;}
.cn > .tblw{grid-area:tbl;min-height:0;min-width:0;position:relative;}
.cn > .top{grid-area:top;min-width:0;}
.cn > .act{grid-area:act;min-width:0;}
.cn > .hand{grid-area:hand;min-width:0;}
.cn > .lpad{display:none;}
.cn.L-ts > .lpad{display:block;grid-area:pad;min-height:0;overflow:auto;border-radius:6px 6px 14px 14px;-webkit-overflow-scrolling:touch;align-self:start;max-height:100%;}
/* setup on an iPad held sideways: two columns, a little larger */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  .stage:has(> .setup){max-width:min(1000px,94vw);display:flex;flex-direction:column;justify-content:center;min-height:calc(100dvh - var(--bar,64px) - 30px);}
  .stage > .setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;row-gap:22px;align-items:start;zoom:1.22;}
  .stage > .setup > .setup-hero,.stage > .setup > .k-joins,.stage > .setup > .k-startdock{grid-column:1 / -1;}
}

/* ── The table: wood and felt, with each side's melds in its own band and the stock and pile between ── */
.tblw{border-radius:26px;padding:8px;}
.tblw > .felt-in{position:absolute;inset:8px;border-radius:19px;}
.tbl{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr);gap:4px;padding:6px 8px 8px;box-sizing:border-box;--mw:40px;--tcw:58px;}
.tbl.n3 .bands-them{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
/* a felt wider than tall: the stock and the pile stand in a column at the right, the two bands stacked beside them */
.tbl.wide{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);grid-template-areas:"seats seats" "them mid" "us mid";column-gap:8px;}
.tbl.wide > .seats{grid-area:seats;} .tbl.wide > .bands-them{grid-area:them;} .tbl.wide > .bands-us{grid-area:us;}
.tbl.wide > .mid{grid-area:mid;flex-direction:column;gap:6px;padding:0 2px;}
.seats{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;min-width:0;}
.seats.one{justify-content:center;}
.st{display:flex;align-items:center;gap:6px;min-width:0;padding:3px 10px 3px 3px;border-radius:10px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--plate-line),0 2px 8px rgba(0,0,0,.3);color:#fff;position:relative;transition:box-shadow .25s,scale .3s var(--spring);}
.st .avatar{width:26px;height:26px;font-size:.72rem;flex:none;}
.st .avatar .ico{width:60%;height:60%;}
.st .tx{display:flex;flex-direction:column;min-width:0;line-height:1.1;}
.st .nm{font-weight:700;font-size:.8rem;white-space:nowrap;}
.st .ct{font-size:.7rem;font-weight:600;color:rgba(255,255,255,.7);white-space:nowrap;}
.st .bk{display:flex;--cw:14px;margin-left:2px;}
.st .bk .pcard{flex:none;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.st .bk .pcard+.pcard{margin-left:calc(var(--cw) * -.7);}
.st.turn{box-shadow:inset 0 0 0 1px rgba(255,211,77,.75),0 0 18px var(--litg),0 2px 8px rgba(0,0,0,.3);scale:1.04;}
.st.turn::before{content:"";position:absolute;left:8px;right:8px;top:-1px;height:2px;border-radius:2px;background:var(--lit);box-shadow:0 0 8px 1px var(--litg);}
.st.mate{box-shadow:var(--plate-line),inset 3px 0 0 var(--sc),0 2px 8px rgba(0,0,0,.3);}
.st.mate.turn{box-shadow:inset 0 0 0 1px rgba(255,211,77,.75),inset 3px 0 0 var(--sc),0 0 18px var(--litg);}
.st.away{opacity:.6;}
.st .say{position:absolute;top:100%;left:50%;translate:-50% 0;margin-top:5px;padding:5px 11px;border-radius:9px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-weight:700;font-size:.84rem;white-space:nowrap;box-shadow:var(--plate-line),0 4px 12px rgba(0,0,0,.35);animation:cnpop .35s var(--spring);z-index:20;}
.st .say.big{color:var(--lit);box-shadow:inset 0 0 0 1px rgba(255,211,77,.7),0 0 16px var(--litg);}
@keyframes cnpop{from{scale:.5;opacity:0;}to{scale:1;opacity:1;}}

/* a side's band of melds */
.bands-them{display:grid;gap:6px;min-height:0;}
.band{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;gap:3px;border-radius:14px;padding:4px 6px 5px;background:rgba(0,0,0,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
.band.mine{background:rgba(255,255,255,.05);}
.band.tgt{box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.5);}
.band .bh{display:flex;align-items:center;gap:8px;min-width:0;font-size:.74rem;font-weight:700;color:rgba(255,255,255,.78);line-height:1.1;}
.band .bh i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--sc);}
.band .bh .who{min-width:0;overflow-wrap:anywhere;}
.band .bh .r3{display:flex;--cw:clamp(16px,calc(var(--mw) * .6),40px);margin-left:auto;}
.band .bh .r3 .pcard{flex:none;box-shadow:0 1px 3px rgba(0,0,0,.45);}
.band .bh .r3 .pcard+.pcard{margin-left:calc(var(--cw) * -.55);}
.band .bh .need{flex:none;padding:1px 7px;border-radius:7px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);white-space:nowrap;}
.band .ms{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px 7px;--cw:var(--mw);}
.band .none{font-size:.76rem;font-weight:600;color:rgba(255,255,255,.4);align-self:center;}
/* a meld: its cards fanned down, the count under it */
.ml{position:relative;display:flex;flex-direction:column;align-items:center;flex:none;transition:filter .2s,translate .2s var(--spring);}
.ml .fan{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4 + (var(--k) - 1) * var(--cw) * .27);}
.ml .fan .pcard{position:absolute;left:0;top:calc(var(--i) * var(--cw) * .27);box-shadow:0 1px 3px rgba(0,0,0,.45);}
.ml .n{margin-top:2px;font-size:calc(var(--cw) * .26 + 3px);font-weight:800;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;line-height:1;}
.ml.near .n{color:var(--lit);}
.ml.tgt{cursor:pointer;}
.ml.tgt .fan,.ml.tgt .pile3{filter:drop-shadow(0 0 7px rgba(255,211,77,.85));}
.ml.stg .fan{outline:2px dashed rgba(255,211,77,.7);outline-offset:3px;border-radius:5px;}
/* a canasta: squared into one pile, a red card on top for a natural one and a black card for a mixed one */
.ml .pile3{position:relative;width:calc(var(--cw) + 6px);height:calc(var(--cw) * 1.4 + 6px);}
.ml .pile3 .pcard{position:absolute;box-shadow:0 1px 2px rgba(0,0,0,.5);}
.ml .pile3 .pcard:nth-child(1){left:6px;top:6px;} .ml .pile3 .pcard:nth-child(2){left:4px;top:4px;} .ml .pile3 .pcard:nth-child(3){left:2px;top:2px;} .ml .pile3 .pcard:nth-child(4){left:0;top:0;}
.ml.can .tag{position:absolute;left:50%;bottom:calc(var(--cw) * .28 + 18px);translate:-50% 0;padding:1px 6px;border-radius:6px;font-size:calc(var(--cw) * .2 + 3px);font-weight:800;white-space:nowrap;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:2;}
.ml.can.nat .tag{background:#c8102e;} .ml.can.mix .tag{background:#16161c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.4);}
.ml.squ .pile3{animation:cnsq .6s var(--spring);}
@keyframes cnsq{0%{scale:1.25;rotate:-6deg;}50%{scale:.92;rotate:2deg;}100%{scale:1;rotate:0;}}
.ml.squ.nat .pile3{filter:drop-shadow(0 0 14px rgba(255,90,110,.95));}
.ml.grow .fan{animation:cngrow .4s var(--spring);}
@keyframes cngrow{40%{scale:1.08;}}

/* the middle: the stock and the discard pile */
.mid{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,34px);min-width:0;position:relative;}
.stock,.disc{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:0;color:#fff;--cw:var(--tcw);font:inherit;}
.stock .stk{position:relative;width:calc(var(--cw) + 6px);height:calc(var(--cw) * 1.4 + 6px);}
.stock .stk .pcard{position:absolute;box-shadow:0 1px 2px rgba(0,0,0,.5);}
.stock .stk .pcard:nth-child(1){left:6px;top:6px;} .stock .stk .pcard:nth-child(2){left:3px;top:3px;} .stock .stk .pcard:nth-child(3){left:0;top:0;}
.stock .lb,.disc .lb{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.8);white-space:nowrap;font-variant-numeric:tabular-nums;}
.disc .pl{position:relative;width:calc(var(--cw) * 1.4 + 6px);height:calc(var(--cw) * 1.4 + 6px);display:grid;place-items:center;}
.disc .pl .under{position:absolute;left:50%;top:50%;translate:-50% -50%;box-shadow:0 1px 2px rgba(0,0,0,.5);}
.disc .pl .under:nth-child(1){rotate:-7deg;} .disc .pl .under:nth-child(2){rotate:5deg;}
.disc .pl .cross{position:absolute;left:50%;top:50%;translate:-50% -50%;rotate:90deg;box-shadow:0 2px 6px rgba(0,0,0,.5);}
.disc .pl .topc{position:relative;z-index:2;box-shadow:0 3px 10px rgba(0,0,0,.45);}
.disc .pl .empty{width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .08);outline:1.5px dashed rgba(255,255,255,.25);outline-offset:-2px;}
.disc.frozen .lb{color:#bfe6ff;}
.disc.blocked .topc{box-shadow:0 0 0 3px rgba(20,20,26,.85),0 0 14px rgba(0,0,0,.6);}
.stock.go .stk,.disc.go .pl{filter:drop-shadow(0 0 10px rgba(255,211,77,.8));cursor:pointer;}
.stock.go:active .stk,.disc.go:active .pl{scale:.96;}
.disc.bump .pl{animation:cngrow .35s var(--spring);}
.mid .pnum{position:absolute;right:4px;bottom:0;}

/* ── The score strip: a paper pad for each side ── */
.top{display:flex;gap:6px;align-items:stretch;cursor:pointer;}
.sd{flex:1 1 0;min-width:0;position:relative;border-radius:9px;padding:4px 9px 5px;color:#2a2a3a;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 5px 12px rgba(0,0,0,.35);border-top:4px solid var(--sc);
  background-image:repeating-linear-gradient(180deg,transparent 0 17px,rgba(60,80,160,.12) 17px 18px),linear-gradient(180deg,#fffaf0,#f1e6cc);}
.sd .nm{display:block;font-size:.68rem;font-weight:800;line-height:1.15;color:#5a5a70;overflow-wrap:anywhere;}
.sd .row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
.sd .tot{font-family:var(--hand);font-size:1.6rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
.sd .tot.neg{color:#c8102e;}
.sd .now{font-family:var(--hand);font-size:.98rem;line-height:1;color:#3a7d4a;white-space:nowrap;font-variant-numeric:tabular-nums;}
.sd .now.bad{color:#c8102e;}
.sd .bar{position:relative;height:5px;border-radius:3px;background:rgba(0,0,0,.1);margin-top:3px;overflow:hidden;}
.sd .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--sc);transition:width .6s ease;}
.sd .cans{display:flex;gap:3px;min-height:9px;margin-top:3px;}
.sd .cans b{width:9px;height:12px;border-radius:2px;background:#c8102e;box-shadow:1px 1px 0 rgba(0,0,0,.25);}
.sd .cans b.m{background:#1b1b22;}
.sd.mine{box-shadow:0 0 0 2px var(--sc),0 5px 12px rgba(0,0,0,.35);}

/* ── The action bar ── */
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:52px;}
.act .hint{color:var(--text-2);font-weight:700;text-align:center;font-size:.95rem;line-height:1.25;}
.act .sub{color:var(--text-3);font-weight:600;font-size:.8rem;text-align:center;}
.act .row{display:flex;gap:8px;width:100%;max-width:480px;justify-content:center;flex-wrap:wrap;}
.act .row .btn{flex:1 1 0;min-width:0;min-height:48px;padding-left:10px;padding-right:10px;}
.act .row .btn small{display:block;font-size:.72rem;font-weight:600;opacity:.85;}
.act .stage{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:12px;background:var(--well);box-shadow:inset 0 0 0 1px var(--gl-line);font-weight:700;}
.act .stage b{font-family:var(--display);font-size:1.3rem;color:var(--lit);font-variant-numeric:tabular-nums;}
.act .stage .meter{width:90px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;}
.act .stage .meter i{display:block;height:100%;background:var(--lit);transition:width .35s ease;}
.act.nudge .hint{animation:cnnudge .4s;}
@keyframes cnnudge{20%{translate:-6px 0;}40%{translate:6px 0;}60%{translate:-4px 0;}80%{translate:3px 0;}}

/* ── Your hand ── */
.hand{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:16px 4px 2px;--cw:64px;touch-action:none;}
.hand .hr{display:flex;justify-content:center;align-items:flex-end;max-width:100%;}
.hand .hr + .hr{margin-top:calc(var(--cw) * -.62);}
.hand .pcard{flex:none;transition:translate .18s var(--spring),box-shadow .2s,filter .2s;cursor:pointer;}
.hand .pcard + .pcard{margin-left:var(--ov,-24px);}
.hand .pcard.gap{margin-left:calc(var(--ov,-24px) + var(--gp,0px));}
.hand .pcard.sel{translate:0 calc(var(--cw) * -.24);box-shadow:0 0 0 3px var(--lit),0 10px 18px rgba(0,0,0,.4);}
.hand .pcard.new{box-shadow:0 0 0 3px #8ff0b0,0 8px 18px rgba(0,0,0,.35);}
.hand .pcard.stg{filter:brightness(.55) saturate(.5);translate:0 calc(var(--cw) * .1);}
.hand .pcard.hl{translate:0 calc(var(--cw) * -.18);box-shadow:0 0 0 3px #8ff0b0,0 10px 18px rgba(0,0,0,.4);}
.hand .pcard.drag{transition:none;z-index:40;box-shadow:0 18px 30px rgba(0,0,0,.5);}
.hand.hidden .pcard{cursor:default;}

/* jokers and wild 2s */
.pcard.jk{background:linear-gradient(180deg,#fffdf8,#f3ecdc);}
.pcard.jk .big svg{width:calc(var(--cw) * .6);height:calc(var(--cw) * .6);}
.pcard.jk .ix{font-size:calc(var(--cw) * .2);}
.pcard.wild::after{content:"";position:absolute;inset:auto 14% 5% 14%;height:3px;border-radius:2px;background:linear-gradient(90deg,#c9a24a,#ffe3a0,#c9a24a);opacity:.9;}

/* floating points, the line across the table */
.fl{position:absolute;z-index:30;pointer-events:none;font-family:var(--display);font-size:1.35rem;color:#ffd166;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:cnfl 1.2s ease-out forwards;white-space:nowrap;}
.fl.g{color:#8ff0b0;} .fl.r{color:#ff9aa5;}
@keyframes cnfl{0%{opacity:0;translate:-50% 0;scale:.6;}15%{opacity:1;scale:1.1;}100%{opacity:0;translate:-50% -46px;scale:1;}}
.flash{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:25;padding:7px 14px;border-radius:14px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--plate-line);color:#fff;font-weight:700;font-size:.9rem;width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.25;animation:cnpop .25s;pointer-events:none;}
.ghost{position:absolute;left:0;top:0;z-index:40;pointer-events:none;}

/* the hand's count and the score pad (in sheets) */
.cnt{display:flex;flex-direction:column;gap:10px;}
.cr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 12px;border-radius:15px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line),inset 4px 0 0 var(--sc);position:relative;overflow:hidden;}
.cr .who{font-weight:800;font-size:.95rem;min-width:0;}
.cr .who small{display:block;font-size:.76rem;font-weight:600;color:var(--text-3);}
.cr .pts{font-family:var(--display);font-size:1.7rem;line-height:1;text-align:right;font-variant-numeric:tabular-nums;}
.cr .pts.neg{color:var(--red);}
.cr .lines{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:.84rem;font-weight:600;color:var(--text-2);}
.cr .lines span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:800;color:var(--text);}
.cr .lines span.neg{color:var(--red) !important;}
.cr .lines .ln{opacity:0;transition:opacity .25s;}
.cr .lines .ln.on{opacity:1;}
.cr .cs{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;--cw:26px;}.cr .cs:empty{display:none;}
.cr .cs .ml .n{display:none;}
.cr .cs .ml.can .tag{bottom:6px;}
.cr .stamp{margin-left:auto;align-self:center;rotate:-8deg;padding:3px 10px;border:3px solid currentColor;border-radius:8px;font-family:var(--display);font-size:1.15rem;opacity:0;scale:2;transition:opacity .25s,scale .35s var(--spring);pointer-events:none;background:rgba(20,16,10,.6);color:#4ade80;}
.cr .stamp.on{opacity:1;scale:1;}
.cr.out .pts{margin-right:0;}
.padw{margin-top:12px;}
.spad td small.k{font-size:.7rem;color:#7a7a90;display:block;line-height:1.1;}
.spad thead th{font-size:1rem;}
.lpad .spad{box-shadow:0 8px 20px rgba(0,0,0,.4);}
.lpad .spad th,.lpad .spad td{height:34px;} .lpad .spad td{font-size:1.15rem;}

/* phone sideways: a slimmer strip and bar */
.cn.L-ps .sd{padding:3px 8px 4px;} .cn.L-ps .sd .tot{font-size:1.3rem;} .cn.L-ps .sd .cans{display:none;}
.cn.L-ps .act{min-height:34px;gap:4px;} .cn.L-ps .act .hint{font-size:.86rem;} .cn.L-ps .act .sub{display:none;}
.cn.L-ps .act .row .btn{min-height:44px;font-size:.9rem;}
.cn.L-ps .hand{padding-top:14px;}
.cn.L-pu .act{min-height:84px;}
.cn.L-tu .act{min-height:96px;}
.cn.L-tu .sd .nm,.cn.L-ts .sd .nm{font-size:.8rem;} .cn.L-tu .sd .tot,.cn.L-ts .sd .tot{font-size:2rem;}
.cn.L-tu .act .hint,.cn.L-ts .act .hint{font-size:1.05rem;}
.cn.L-tu .band .bh,.cn.L-ts .band .bh{font-size:.84rem;}
.cn.L-ts .top{flex-direction:column;}
.cn.L-pu .st .bk,.cn.L-ps .st .bk,.tbl.tight .st .bk{display:none;}
.tbl.tight .ml .fan .pcard{top:calc(var(--i) * var(--cw) * .22);} .tbl.tight .ml .fan{height:calc(var(--cw) * 1.4 + (var(--k) - 1) * var(--cw) * .22);}
.tbl.tight .band{padding:2px 5px 3px;} .tbl.tight .band .bh{font-size:.68rem;} .tbl.tight .st.turn{scale:1;} .tbl.tight .st .nm{font-size:.74rem;}
@media (max-height:640px){ .cn.L-pu .act{min-height:58px;} .cn.L-pu{gap:4px;} } .tbl.tight .st .ct{display:none;} .tbl.tight .st{padding:2px 8px 2px 2px;} .tbl.tight .st .avatar{width:20px;height:20px;}
</style>
</head>
<body>
<main class="cn k-hold" id="app"></main>
<script>
(function () {
  'use strict';
  var Core = window.CanastaCore, el = Kit.el, app = document.getElementById('app');
  var SAVE = 'canasta_state', HKEY = 'canasta';
  var POS = { 4: ['s', 'w', 'n', 'e'], 3: ['s', 'w', 'e'], 2: ['s', 'n'] };
  var STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 5.9 6.6 1-4.8 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.5 9.4l6.6-1z"/></svg>';

  Kit.init({
    id: 'canasta',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: 'Score pad', onClick: function () { if (S && S.players) showPad(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(HKEY, { title: 'Canasta: past games' }); } }
    ]),
    rules:
      '<p class="goal">Canasta is a rummy game for two partnerships. You score by laying down <b>melds</b>, sets of cards of the same rank, and above all <b>canastas</b>, melds of seven cards. The first side to 5,000 wins.</p>' +
      '<h3>The cards</h3><ul><li>Two decks and four jokers, 108 cards. Each player is dealt 11 cards.</li>' +
      '<li><b>Jokers and 2s are wild.</b> A wild card stands in for any rank in a meld.</li>' +
      '<li><b>Red 3s</b> are bonus cards. As soon as you’re dealt or draw one, it goes face up on the table and you draw a card to replace it. Each is worth 100, and all four on one side are worth 800. If your side hasn’t melded by the end of the hand, they count against you.</li>' +
      '<li><b>Black 3s</b> block the discard pile: the next player can’t take the pile while a black 3 is on top.</li>' +
      '<li>Card values: a joker is 50, a 2 or an ace is 20, a king down to an 8 is 10, and a 7 down to a 4, or a black 3, is 5.</li></ul>' +
      '<h3>Your turn</h3><ul><li>Draw the top card of the stock, or take the whole discard pile (below).</li>' +
      '<li>Then lay down any melds you want, or add cards to your side’s melds.</li>' +
      '<li>End your turn by discarding one card onto the pile.</li></ul>' +
      '<h3>Melds</h3><ul><li>A meld is three or more cards of the same rank, from 4s up to aces. It needs at least two natural cards and can hold no more than three wild cards.</li>' +
      '<li>Partners share their melds, and a side has only one meld of each rank. More cards of that rank go on the same meld.</li>' +
      '<li>A meld of seven cards is a <b>canasta</b>. With no wild card in it, it’s a natural canasta, worth 500, and it’s squared up with a red card on top. With a wild card, it’s a mixed canasta, worth 300, with a black card on top. You can keep adding cards to a canasta.</li></ul>' +
      '<h3>Your side’s first meld</h3><p>The cards in your side’s first meld have to add up to a minimum, which depends on your side’s score: <b>15</b> below zero, <b>50</b> from 0, <b>90</b> from 1,500, and <b>120</b> from 3,000. You can lay several melds at once to reach it. Bonuses don’t count toward it.</p>' +
      '<h3>Taking the discard pile</h3><ul><li>To take the pile, you have to meld its top card at once, using cards from your hand. Then the rest of the pile goes into your hand.</li>' +
      '<li>You can use a natural pair that matches the top card, or one natural card and a wild card, or add the top card to a meld your side already has.</li>' +
      '<li><b>The pile is frozen</b> while it holds a wild card (the first one is turned across the pile), and for a side that hasn’t made its first meld. A frozen pile can only be taken with a natural pair that matches the top card.</li>' +
      '<li>Nobody can take the pile with a wild card or a black 3 on top. For a first meld made by taking the pile, only the top card and cards from your hand count toward the minimum.</li></ul>' +
      '<h3>Going out</h3><ul><li>You go out by melding all your cards, or by discarding your last one. Your side needs at least one canasta before you can go out.</li>' +
      '<li>Going out is worth 100. Going out <b>concealed</b>, melding your whole hand in one turn without having melded before, is worth 200, and when you drew from the stock your melds don’t need to reach the first-meld minimum.</li>' +
      '<li>Before going out you can ask your partner, “May I go out?” Your partner answers, and the answer binds you: if it’s no, you can’t go out this turn, and if it’s yes, you have to.</li></ul>' +
      '<h3>Scoring</h3><ul><li>At the end of each hand, each side scores its canastas, red 3s and going-out bonus, plus the value of every card it has melded, minus the value of the cards still in its hands.</li>' +
      '<li>If the stock runs out, play goes on as long as each player takes the discard pile. You have to take it when its top card goes on one of your side’s melds. If the last card of the stock is a red 3, the hand ends at once.</li>' +
      '<li>The game ends at the end of the hand in which a side reaches 5,000. The higher score wins.</li></ul>' +
      '<h3>Two and three players</h3><ul><li><b>Two players:</b> each gets 15 cards and draws two cards from the stock each turn, discarding one. You need two canastas to go out.</li>' +
      '<li><b>Three players:</b> everyone plays alone, with 13 cards each.</li></ul>' +
      '<h3>Playing here</h3><ul><li>Tap cards in your hand to choose them, then tap a button, or tap one of your melds to add them. Tap the stock to draw, or the pile to take it.</li>' +
      '<li>Before your side’s first meld, the melds you choose wait on the table until they reach the minimum, then Lay down puts them all down at once.</li>' +
      '<li><b>Play online</b> in the menu: open a table and the others join on their own devices. With four, the first two people to sit are partners. The computer plays any empty seat.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null, token = 0, undoStack = [], busy = false, sel = [], staged = [], fresh = [];
  var NET = null, MYSEAT = 0, LME = 0, BLIND = false;
  function me() { return NET ? MYSEAT : LME; }
  function N() { return S ? S.n : 4; }
  function posOf(p) { return POS[N()][(p - me() + N() * 4) % N()]; }
  function sideOf(p) { return Core.sideOf(S, p); }
  function MS() { return sideOf(Math.max(0, me())); }
  function person(p) { return p >= 0 && S.players[p] && !S.players[p].cpu; }
  function people() { return S.players.filter(function (x) { return !x.cpu; }).length; }
  function onePerson() { return !!NET || people() < 2; }
  function first(n) { return String(n || '').split(' ')[0]; }
  function fn(p) { var pl = S.players[p]; return pl.cpu ? pl.name : first(pl.name); }
  function nm(p) { return S.players[p].name; }
  function isYou(p) { return p === me() && onePerson() && (!NET || MYSEAT >= 0); }
  function who(p) { return isYou(p) ? 'You' : fn(p); }
  function sideName(s) { return Core.seatsOf(S, s).map(function (p) { return fn(p); }).join(' & '); }
  function mineSide(s) { return s === MS() && onePerson() && (!NET || MYSEAT >= 0); }
  function sideSay(s) {
    if (!mineSide(s)) return sideName(s);
    return S.kind === 'part' ? 'You & ' + fn((me() + 2) % 4) : 'You';
  }
  function sideColor(s) { return Kit.color(s); }
  function seatColor(p) { return Kit.color(sideOf(p)); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function save() {
    if (NET || !S) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S.phase !== 'over') Kit.resume.set('Hand ' + S.round + ' · ' + S.scores.map(function (v, s) { return sideName(s) + ' ' + v.toLocaleString('en-US'); }).join(' · '));
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); token++; busy = false; }
  function fmt(v) { return (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('en-US'); }
  function plural(r) { return Core.PLURAL[r] || r; }

  var LEVELS = [['easy', 'Easy', 'Melds what it sees and doesn’t mind what it throws away.'],
    ['normal', 'Normal', 'Reaches its first meld early, builds canastas and watches what the next player could take.'],
    ['hard', 'Hard', 'Saves its wild cards for natural canastas, guards the pile and remembers every discard.']];

  // ── Setup ─────────────────────────────────────────────────────────────────
  function kindFor(n) { return n === 2 ? 'two' : n === 3 ? 'three' : 'part'; }
  function showSetup() {
    S = null; token++; BLIND = false; LME = 0; sel = []; staged = []; Kit.handoff.close();
    app.className = 'stage'; app.innerHTML = ''; app.removeAttribute('style'); tbl = null;
    Kit.setup(app, {
      modes: Kit.modes(['cpu', 'local']),
      players: { min: 2, max: 4, count: 4, cpu: function (m) { return m === 'cpu' ? 'seats' : 'mix'; }, teams: function (n) { return n === 4 ? [[0, 2], [1, 3]] : null; } },
      options: [
        { id: 'to', label: 'Play to', help: 'The first side to reach this score wins.', value: 5000, choices: [[2500, '2,500\nShorter'], [5000, '5,000\nStandard']] },
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: LEVELS }
      ],
      onStart: function (cfg) {
        var n = cfg.players.length, o = cfg.options;
        S = Core.newGame({ kind: kindFor(n), players: cfg.players.map(function (p) { return { name: p.name, cpu: !!p.cpu, level: p.cpu ? (p.level || o.level) : undefined }; }), target: +o.to || 5000, level: o.level });
        S.mode = cfg.mode; S.me = 0; S.seen = 0;
        LME = 0; Kit.gameStart(); undoStack = []; startHand();
      }
    });
  }

  // ═══ Layout ══════════════════════════════════════════════════════════════════════════════════════
  var LAY = '', tbl = null, tblW, topEl, actEl, handEl, padEl, seatsEl, themEl, midEl, usEl, stockEl, discEl, seatEls = {}, bandEls = {};
  function layoutFor() {
    var w = innerWidth, h = innerHeight, big = Math.min(w, h) >= 600;
    if (w > h * 1.05) return big ? 'L-ts' : 'L-ps';
    return big ? 'L-tu' : 'L-pu';
  }
  function build() {
    app.innerHTML = '';
    LAY = layoutFor(); app.className = 'cn k-hold ' + LAY;
    topEl = el('div', { class: 'top', role: 'button', 'aria-label': 'Score pad', onclick: function () { if (S) { Kit.sfx('tap'); showPad(); } } });
    tblW = el('div', { class: 'tblw wood' }, [el('div', { class: 'felt-in' })]);
    tbl = el('div', { class: 'tbl n' + N() }); tblW.appendChild(tbl);
    seatsEl = el('div', { class: 'seats' });
    themEl = el('div', { class: 'bands-them' });
    midEl = el('div', { class: 'mid' });
    usEl = el('div', { class: 'bands-us' });
    usEl.style.display = 'grid'; usEl.style.minHeight = '0';
    tbl.appendChild(seatsEl); tbl.appendChild(themEl); tbl.appendChild(midEl); tbl.appendChild(usEl);
    stockEl = el('button', { type: 'button', class: 'stock', 'aria-label': 'The stock', onclick: tapStock });
    discEl = el('button', { type: 'button', class: 'disc', 'aria-label': 'The discard pile', onclick: tapPile });
    midEl.appendChild(stockEl); midEl.appendChild(discEl);
    seatEls = {}; bandEls = {};
    for (var p = 0; p < N(); p++) if (p !== me() || NET && MYSEAT < 0) { seatEls[p] = el('div', { class: 'st' }); }
    actEl = el('div', { class: 'act' });
    handEl = el('div', { class: 'hand' });
    padEl = el('div', { class: 'lpad' });
    app.appendChild(topEl); app.appendChild(tblW); app.appendChild(padEl); app.appendChild(actEl); app.appendChild(handEl);
    handDrag();
  }
  // seats from this device's point of view: left, across, right
  function otherSeats() { var out = []; for (var i = 1; i < N(); i++) out.push((Math.max(0, me()) + i) % N()); return out; }
  function sidesOther() { var a = []; for (var s = 0; s < Core.nSides(S); s++) if (s !== MS()) a.push(s); return a.sort(function (x, y) { return ((x - MS() + 3) % 3) - ((y - MS() + 3) % 3); }); }
  function fit() {
    if (!app.classList.contains('cn') || !tbl) return;
    var topY = app.getBoundingClientRect().top + (window.scrollY || 0);
    app.style.setProperty('--ph', Math.max(300, innerHeight - topY) + 'px');
    var side = LAY === 'L-ps' ? Math.min(420, Math.max(320, Math.round(innerWidth * 0.43))) : LAY === 'L-ts' ? Math.min(400, Math.round(innerWidth * 0.34)) : 0;
    if (side) app.style.setProperty('--side', side + 'px');
    fitHand();
    var r = tbl.getBoundingClientRect(), wide = r.width > r.height * 1.15;
    tbl.classList.toggle('tight', r.width < 340 || r.height < 300);
    tbl.classList.toggle('wide', wide);
    var sh = seatsEl ? seatsEl.offsetHeight : 36;
    var tcw = wide ? Math.max(26, Math.min(84, (r.height - sh - 56) / 3.1, r.width / 8)) : Math.max(34, Math.min(84, r.height / 6.4, r.width / 6));
    tbl.style.setProperty('--tcw', Math.round(tcw) + 'px');
    fitBands();
  }
  // one card size for every band, eased down until every meld fits its band with nothing cut off
  function fitBands() {
    var bands = [].slice.call(tbl.querySelectorAll('.band'));
    if (!bands.length) return;
    var r = tbl.getBoundingClientRect();
    var room = Math.min.apply(null, bands.map(function (b) { var h = b.querySelector('.bh'); return b.clientHeight - (h ? h.offsetHeight : 0) - 12; }));
    var mw = Math.max(18, Math.min(104, room / 2.15, r.width / 6.5));
    for (var i = 0; i < 30; i++) {
      tbl.style.setProperty('--mw', mw.toFixed(1) + 'px');
      // (measured from the layout, not the screen: a card in flight or a canasta squaring up is transformed)
      var ok = bands.every(function (b) {
        var ms = b.querySelector('.ms'); if (!ms) return true;
        var bot = ms.offsetTop + ms.clientHeight + 1, rt = ms.offsetLeft + ms.clientWidth + 1;
        return [].every.call(ms.children, function (c) { return c.offsetTop + c.offsetHeight <= bot && c.offsetLeft + c.offsetWidth <= rt; });
      });
      if (ok || mw <= 16) break;
      mw *= 0.95;
    }
  }
  function fitHand() {
    if (!handEl) return;
    var cards = handEl.querySelectorAll('.pcard'), k = cards.length;
    var W = handEl.clientWidth - 8, H = innerHeight;
    var capH = LAY === 'L-pu' ? H * 0.115 : LAY === 'L-tu' ? H * 0.13 : LAY === 'L-ps' ? H * 0.3 : H * 0.15;
    var rows = handEl.querySelectorAll('.hr').length || 1, perRow = Math.ceil(Math.max(k, 1) / rows);
    var cw = Math.max(40, Math.min(132, capH, W / (Math.max(perRow, 11) * 0.34 + 0.66)));
    if (LAY === 'L-ps' && actEl && topEl) { var room = (parseFloat(app.style.getPropertyValue('--ph')) || innerHeight) - topEl.offsetHeight - actEl.offsetHeight - 30 - (rows > 1 ? 1 : 0); cw = Math.max(36, Math.min(cw, room / (rows > 1 ? 1.4 * 1.38 + .12 : 1.4 * 1.12))); }
    handEl.style.setProperty('--cw', Math.round(cw) + 'px');
    var gaps = handEl.querySelectorAll('.pcard.gap').length / rows, gp = Math.min(cw * 0.18, 8);
    var ov = perRow > 1 ? Math.min(4, (W - cw - gaps * gp) / (perRow - 1) - cw) : 0;
    if (ov < -cw * 0.78) gp = 0;
    handEl.style.setProperty('--ov', Math.max(-cw * 0.8, ov).toFixed(1) + 'px');
    handEl.style.setProperty('--gp', gp.toFixed(1) + 'px');
  }
  // A turn of the device at any moment: the table is laid out again inside a View Transition, so everything glides
  window.addEventListener('resize', function () { relayout(); });
  var rlT = 0;
  function relayout() {
    if (!S || !tbl || !tbl.isConnected) return;
    clearTimeout(rlT);
    rlT = setTimeout(function () {
      dragCancel();
      var next = layoutFor();
      Kit.glide(function () {
        if (next !== LAY) { app.classList.remove(LAY); LAY = next; app.classList.add(LAY); }
        paintAll(); fit();
      });
    }, 30);
  }

  // ═══ Painting the table from S ═══════════════════════════════════════════════════════════════════
  function render() {
    if (!S) return;
    if (!tbl || !tbl.isConnected) build();
    paintAll();
    fit(); requestAnimationFrame(fit);
  }
  function paintAll() { paintTop(); paintSeats(); paintBands(); paintMid(); paintHand(); paintAct(); paintPad(); fitHand(); fitBands(); }
  function cardEl(c, o) {
    if (c.r === 'JK') {
      var n = Kit.cardFace({ html: STAR, label: 'Joker', rank: '★', color: c.s === 'r' ? '#d81e3a' : '#22222c', cls: 'jk wild' + (o && o.cls ? ' ' + o.cls : ''), aria: 'Joker, wild' });
      n.dataset.id = c.id; return n;
    }
    var e = Cards.el(c, o); if (c.r === '2') e.classList.add('wild');
    return e;
  }
  function vn(i) { return 'cn' + i; }
  function paintTop() {
    topEl.innerHTML = '';
    var order = [MS()].concat(sidesOther());
    if (NET && MYSEAT < 0) { order = []; for (var s0 = 0; s0 < Core.nSides(S); s0++) order.push(s0); }
    order.forEach(function (s) {
      var pts = handPts(s), mel = Core.melded(S, s), need = Core.needFor(S, s), cans = el('span', { class: 'cans' });
      S.melds[s].forEach(function (m) { if (Core.isCanasta(m)) cans.appendChild(el('b', { class: Core.isNatural(m) ? '' : 'm' })); });
      topEl.appendChild(el('div', { class: 'sd' + (mineSide(s) ? ' mine' : ''), style: { '--sc': sideColor(s), 'view-transition-name': 'cnsd' + s } }, [
        el('span', { class: 'nm', text: sideSay(s) }),
        el('div', { class: 'row' }, [el('span', { class: 'tot' + (S.scores[s] < 0 ? ' neg' : ''), text: fmt(S.scores[s]) }),
          el('span', { class: 'now' + (pts < 0 ? ' bad' : ''), text: mel ? (pts >= 0 ? '+' : '') + fmt(pts) : 'First meld ' + need })]),
        el('div', { class: 'bar' }, [el('i', { style: { width: Math.max(0, Math.min(100, S.scores[s] / S.target * 100)) + '%' } })]),
        cans
      ]));
    });
  }
  // this hand so far, as the table shows it: canastas, red 3s and melded cards (cards in hands aren't counted yet)
  function handPts(s) {
    var t = 0, mel = Core.melded(S, s);
    S.melds[s].forEach(function (m) { t += Core.sum(m.cards) + (Core.isCanasta(m) ? (Core.isNatural(m) ? 500 : 300) : 0); });
    var r3 = S.red3[s].length === 4 ? 800 : S.red3[s].length * 100;
    return t + (mel ? r3 : -r3);
  }
  function avatar(p) {
    var pl = S.players[p];
    return pl.cpu ? el('span', { class: 'avatar sm', style: { '--c': seatColor(p) }, html: Kit.icon('bot') }) : Kit.avatar.el(pl.name, 'sm', seatColor(p));
  }
  function paintSeats() {
    seatsEl.innerHTML = '';
    var list = NET && MYSEAT < 0 ? S.players.map(function (x, i) { return i; }) : otherSeats(), tp = Core.turn(S);
    seatsEl.classList.toggle('one', list.length === 1);
    list.forEach(function (p) {
      var s = seatEls[p] || (seatEls[p] = el('div', { class: 'st' }));
      s.innerHTML = '';
      s.className = 'st' + (tp === p ? ' turn' : '') + (sideOf(p) === MS() && S.kind === 'part' ? ' mate' : '') + (S.players[p].away ? ' away' : '');
      s.style.setProperty('--sc', seatColor(p)); s.style.viewTransitionName = 'cnseat' + p;
      var n = S.hands[p].length, bk = el('span', { class: 'bk' });
      for (var i = 0; i < Math.min(n, 5); i++) bk.appendChild(Kit.card('', '', { back: true }));
      s.appendChild(avatar(p));
      s.appendChild(el('span', { class: 'tx' }, [el('span', { class: 'nm', text: fn(p) }), el('span', { class: 'ct', text: n === 1 ? '1 card' : n + ' cards' })]));
      s.appendChild(bk);
      seatsEl.appendChild(s);
    });
  }
  function seatAnchor(p) { return p === me() && handEl && !(NET && MYSEAT < 0) ? handEl : seatEls[p] && seatEls[p].isConnected ? seatEls[p] : tbl; }
  function paintBands() {
    themEl.innerHTML = ''; usEl.innerHTML = '';
    var others = sidesOther();
    if (NET && MYSEAT < 0) { others = [1].concat(S.kind === 'three' ? [2] : []); }
    others.forEach(function (s) { themEl.appendChild(band(s)); });
    usEl.appendChild(band(NET && MYSEAT < 0 ? 0 : MS()));
  }
  function band(s) {
    var mine = mineSide(s), b = el('div', { class: 'band' + (mine ? ' mine' : ''), style: { '--sc': sideColor(s), 'view-transition-name': 'cnband' + s } });
    bandEls[s] = b;
    var r3 = el('span', { class: 'r3' }); S.red3[s].forEach(function (c) { r3.appendChild(cardEl(c)); });
    var head = el('div', { class: 'bh' }, [el('i'), el('span', { class: 'who', text: sideSay(s) })]);
    if (!Core.melded(S, s)) head.appendChild(el('span', { class: 'need', text: 'First meld ' + Core.needFor(S, s) }));
    head.appendChild(r3);
    b.appendChild(head);
    var ms = el('div', { class: 'ms' });
    var list = S.melds[s].slice().sort(function (a, b2) { return (Core.isCanasta(b2) - Core.isCanasta(a)) || Core.ORD[b2.r] - Core.ORD[a.r]; });
    list.forEach(function (m) { ms.appendChild(meldEl(m, s)); });
    if (mine && staged.length) staged.forEach(function (g, gi) { ms.appendChild(stagedEl(g, gi)); });
    if (!ms.children.length) ms.appendChild(el('span', { class: 'none', text: mine ? 'Your side’s melds go here.' : 'No melds yet.' }));
    b.appendChild(ms);
    return b;
  }
  function meldCards(m) {
    var nat = m.cards.filter(function (c) { return !Core.isWild(c); }), w = m.cards.filter(Core.isWild);
    return nat.concat(w);
  }
  function meldEl(m, s) {
    var can = Core.isCanasta(m), nat = Core.isNatural(m), cs = meldCards(m);
    var e = el('div', { class: 'ml' + (can ? ' can ' + (nat ? 'nat' : 'mix') : '') + (m.cards.length >= 5 && !can ? ' near' : ''), 'data-r': m.r, 'data-side': String(s), style: { 'view-transition-name': 'cnm' + s + '-' + m.r } });
    if (can) {
      // squared up: a red card on top for a natural canasta, a black one for a mixed canasta
      var pile = el('div', { class: 'pile3' });

    save(); build(); fit();
    busy = true; var t = token;
    dealIn(function () { if (t !== token) return; busy = false; next(); });
  }

  // ═══ The end of the game ═════════════════════════════════════════════════════════════════════════
  function recordGame(st, mode, extraHl) {
    var ns = Core.nSides(st), w = st.winner, names = st.players.map(function (p) { return p.name; });
    var seen = {}, hl = st.highlights.slice().reverse().filter(function (h) { var k = h.replace(/ in hand \d+$/, ''); if (seen[k]) return false; seen[k] = 1; return true; }).slice(0, 8).reverse();
    hl.push(st.hx.length + (st.hx.length === 1 ? ' hand' : ' hands') + ', played to ' + st.target.toLocaleString('en-US'));
    (extraHl || []).forEach(function (x) { hl.push(x); });
    var sides = []; for (var s = 0; s < ns; s++) sides.push({ name: Core.sideName(st, s), score: st.scores[s], cpu: Core.seatsOf(st, s).every(function (p) { return st.players[p].cpu; }) });
    var detail = { kind: st.kind, names: names, cpu: st.players.map(function (p) { return p.cpu ? 1 : 0; }).join(''), to: st.target, ws: w, hx: clone(st.hx),
      canN: st.stats.canN.join('.'), canM: st.stats.canM.join('.'), outs: st.stats.outs.join('.'), conc: st.stats.conc.join('.'), red4: st.stats.red4.join('.'),
      big: st.stats.bigPile ? st.stats.bigPile.n + '.' + st.stats.bigPile.p + '.' + st.stats.bigPile.r : '', back: st.last && st.last.comeback || 0 };
    for (var i = 0; JSON.stringify(detail).length > 5600 && i < detail.hx.length; i++) { delete detail.hx[i].m; delete detail.hx[i].l; }
    Kit.record(HKEY, {
      started: st.started, mode: mode, players: sides, winner: Core.sideName(st, w),
      rounds: { labels: st.rounds.map(function (r, i) { return 'H' + (i + 1); }), scores: st.rounds },
      highlights: hl, detail: detail
    });
  }
  function modeName(st) { return st.kind === 'part' ? 'Partnership' : st.kind === 'two' ? 'Two-handed' : 'Three-handed'; }
  function finish() {
    var st = S, w = st.winner;
    recordGame(st, modeName(st) + ' · ' + (st.mode === 'local' ? 'Pass & play' : 'Against the computer'));
    var cfg = { players: st.players, target: st.target, level: st.level, mode: st.mode, kind: st.kind };
    var mine = w === MS() && onePerson(), lose = Core.seatsOf(st, w).every(function (p) { return !person(p); });
    var ranks = []; for (var s = 0; s < Core.nSides(st); s++) ranks.push(s);
    ranks.sort(function (a, b) { return st.scores[b] - st.scores[a]; });
    clearSave(); S.phase = 'over';
    var back = st.last && st.last.comeback;
    if (back) setTimeout(function () { Kit.moment({ title: 'What a comeback!', line: sideName(w) + (Core.seatsOf(st, w).length > 1 ? ' were ' : ' was ') + fmt(back) + ' behind and won.', big: true, at: tblW }); }, 200);
    setTimeout(function () {
      Kit.win({
        title: mine ? 'You win!' : sideName(w) + (Core.seatsOf(st, w).length > 1 ? ' win!' : ' wins!'),
        sub: (mine ? (st.kind === 'part' ? 'You and ' + fn((me() + 2) % 4) + ' won by ' : 'You won by ') : 'Won by ') + fmt(st.scores[w] - st.scores[ranks[1]]) + ' · ' + st.hx.length + (st.hx.length === 1 ? ' hand' : ' hands') + (back ? ' · Came back from ' + fmt(back) + ' behind' : ''),
        rank: ranks.map(function (s) { return { name: sideName(s), score: st.scores[s], color: sideColor(s), cpu: Core.seatsOf(st, s).every(function (p) { return st.players[p].cpu; }), me: s === MS() && onePerson() }; }),
        lose: lose, icon: lose ? 'bot' : 'trophy',
        again: function () { S = Core.newGame(cfg); S.mode = cfg.mode; S.seen = 0; LME = 0; Kit.gameStart(); undoStack = []; startHand(); },
        look: 'Look at the table',
        extra: [{ label: 'Score pad', onClick: function () { showPad(); } }],
        setup: function () { clearSave(); showSetup(); }
      });
    }, back ? 2600 : 0);
  }

  // ── Undo (your own moves this turn and since) ──
  function snapshot() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 40) undoStack.shift(); }
  function undo() {
    if (busy) return Kit.toast('One moment');
    if (!undoStack.length) return Kit.toast('Nothing to undo');
    var back = JSON.parse(undoStack[undoStack.length - 1]);
    if (back.round !== S.round) { undoStack = []; return Kit.toast('Nothing to undo this hand'); }
    if ((back.me || 0) !== LME && !onePersonLocal()) return Kit.toast('Only your own last move can be taken back');
    undoStack.pop();
    token++; busy = false; sel = []; staged = []; goingOut = null; S = back; ST0 = S; Kit.sfx('whoosh'); Kit.toast('Undone'); save(); render(); next();
  }

  // ═══ Online (turnnet.js) ═════════════════════════════════════════════════════════════════════════
  // The table holds the whole game in fixed seats. With four, people take the seats in the order 0, 2, 1, 3, so the
  // first two to sit are partners. Each device draws the table from its own seat with only its own hand face up.
  var NQ = [], NGEN = 0, NETREC = {}, NOVER = null, NST = null, ST0 = null;
  function PS(st, x) { return st && st.n === 4 ? [0, 2, 1, 3][x] : x; }
  function netCloseOver() { if (NOVER) { var o = NOVER; NOVER = null; try { o.close(); } catch (e) {} } }
  function netOpts() {
    var g = {}; try { g = JSON.parse(localStorage.getItem('gn_setup_canasta')) || {}; } catch (e) {}
    var o = g.options || {}, n = Math.max(2, Math.min(4, +g.count || 4));
    return { seats: n, to: +o.to || 5000, level: Core.lv(o.level) };
  }
  function netStart(players, opts, last) {
    var n = players.length, pl = [];
    for (var p = 0; p < n; p++) { var x = players[PS({ n: n }, p)] || { name: 'Robot', bot: true }; pl.push({ name: x.name, cpu: !!x.bot, level: x.bot ? opts.level : undefined }); }
    var st = Core.newGame({ kind: kindFor(n), players: pl, target: opts.to, level: opts.level });
    st.online = 1;
    return st;
  }
  function netTurn(st) { var p = Core.turn(st); return p < 0 ? [] : [PS(st, p)]; }
  function netOver(st) {
    if (!st || st.phase !== 'over') return null;
    var w = st.winner;
    return { win: Core.seatsOf(st, w).map(function (p) { return PS(st, p); }), text: Core.sideName(st, w) + ' win ' + st.scores[w] };
  }
  function netBot(st, seat) {
    var p = PS(st, seat), a = Core.bot(st, p); if (!a) return null;
    var mv = Core.apply(st, p, a);
    return mv ? { state: st, mv: mv } : null;
  }
  function netNudge() { if (busy || !NET) return; Kit.haptic('error'); actEl.classList.remove('nudge'); void actEl.offsetWidth; actEl.classList.add('nudge'); }
  function netShow(net, info) {
    NET = net;
    if (info.fresh || info.again) { NQ = []; NGEN++; busy = false; netCloseOver(); }
    NQ.push({ st: clone(net.state), prev: info.prev ? clone(info.prev) : null, mv: info.mv, info: info });
    if (net.state && net.state.phase === 'over') netRecord(clone(net.state));
    if (NQ.length > 8) NQ = NQ.slice(-1).map(function (x) { x.skip = true; return x; });
    if (!busy) netPump();
  }
  function netPump() {
    var it = NQ.shift(); if (!it) return;
    var g = NGEN; busy = true;
    netStep(it, function () {
      if (g !== NGEN) return; busy = false;
      if (NQ.length) { netPump(); return; }
      if (NET && S) paintAll();
      // Go out: after its melds, the card left
      if (goingOut && NET && S && S.phase === 'play' && Core.turn(S) === MYSEAT) { var gid = goingOut; goingOut = null; if (Core.find(S.hands[MYSEAT], gid) >= 0) move({ k: 'discard', id: gid }); }
    });
  }
  function netStep(it, done) {
    var st = it.st, prev = it.prev, mv = it.mv, info = it.info;
    MYSEAT = NET.seat >= 0 ? PS(st, NET.seat) : -1;
    st.players.forEach(function (pl, p) { var s = NET.seats[PS(st, p)]; if (s) { pl.cpu = !!s.bot; pl.away = !!(!s.bot && !s.me && s.away); } });
    NST = st; ST0 = st; token++;
    if (!mv || !prev || info.fresh || info.again || it.skip) {
      S = st; sel = []; staged = []; build(); render(); fit();
      if (info.again) { Kit.gameStart(); Kit.callout('New game'); }
      else if (info.fresh) Kit.gameStart();
      if (st.phase === 'over') { setTimeout(function () { if (NET) netEnd(); }, info.fresh ? 300 : 900); }
      else if (info.fresh || info.again) { busy = true; dealIn(done); return; }
      done(); return;
    }
    prev.players = st.players;
    var act = mvAction(mv), ok = (Core.turn(prev) === mv.p) && (!act || !!Core.apply(clone(prev), mv.p, act));
    if (!ok) { S = st; render(); done(); return; }
    if (mv.p !== MYSEAT) { sel = []; }
    step(prev, mv, st, function () {
      if (st.phase === 'over' && (mv.end || mv.out)) { S = st; render(); netEnd(); }
      done();
    });
  }
  function mvAction(mv) {
    switch (mv.k) {
      case 'draw': return { k: 'draw' };
      case 'discard': return { k: 'discard', id: mv.c.id };
      case 'meld': return { k: 'meld', groups: mv.groups, adds: mv.adds };
      case 'take': return { k: 'take', ids: mv.ids, groups: mv.groups };
      case 'ask': return { k: 'ask' };
      case 'end': return { k: 'end' };
      default: return null;
    }
  }
  function netRecord(st) {
    if (!NET || !st || st.phase !== 'over' || NET.seat < 0) return;
    var key = NET.code + ':' + st.started, list = [];
    try { list = JSON.parse(localStorage.getItem('canasta_netrec')) || []; } catch (e) {}
    if (NETREC[key] || list.indexOf(key) >= 0) return;
    NETREC[key] = 1;
    try { localStorage.setItem('canasta_netrec', JSON.stringify(list.concat([key]).slice(-20))); } catch (e) {}
    recordGame(st, modeName(st) + ' · Online', ['Played online at table ' + NET.code]);
  }
  function netEnd() {
    if (!NET || !NST || NST.phase !== 'over') return;
    var st = NST, w = st.winner;
    netRecord(st);
    var res = NET.result, left = res && res.left != null, watching = MYSEAT < 0, won = !watching && Core.sideOf(st, MYSEAT) === w;
    var ranks = []; for (var s = 0; s < Core.nSides(st); s++) ranks.push(s);
    ranks.sort(function (a, b) { return st.scores[b] - st.scores[a]; });
    netCloseOver(); S = st;
    NOVER = Kit.win({
      title: left ? res.text : won ? 'You win!' : sideName(w) + (Core.seatsOf(st, w).length > 1 ? ' win' : ' wins'),
      sub: 'Won by ' + fmt(st.scores[w] - st.scores[ranks[1]]) + ' · ' + st.hx.length + ' hands',
      rank: ranks.map(function (s) { return { name: sideName(s), score: st.scores[s], color: sideColor(s), me: !watching && s === Core.sideOf(st, MYSEAT) }; }),
      lose: !won, icon: won ? 'trophy' : 'users',
      againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { if (left) { TurnNet.leave(); TurnNet.open(); } else NET.again(); },
      look: 'Look at the table',
      extra: [{ label: 'Score pad', onClick: function () { showPad(); } }],
      closeLabel: 'Back to games'
    });
  }
  function netLeave() { NET = null; NST = null; NQ = []; NGEN++; busy = false; token++; netCloseOver(); resumeLocal(true); }

  // ── Boot ──
  function resumeLocal(back) {
    var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (saved && saved.v === 1 && saved.players && saved.hands && saved.phase !== 'over') {
      S = saved; ST0 = S; LME = S.me || 0; BLIND = false; Kit.gameStart();
      if (back) save();
      build(); render(); fit();
      // a hand that ended just before the page closed: its count first
      if (S.last && (S.seen || 0) < S.last.round && S.hx.length) {
        busy = true; var t = token, st = S;
        S = endView(clone(S), st, null); render();
        handEnd(clone(st), st, {}, function () { if (t !== token) return; busy = false; next(); });
        return;
      }
      next();
    } else showSetup();
  }
  resumeLocal();
  TurnNet.setup({
    game: 'canasta', title: 'Canasta', min: 2, max: 4, botMs: 1000,
    seats: function (n, o) { return Math.max(n, Math.min(4, +(o && o.seats) || 4)); },
    opts: netOpts, start: netStart, turn: netTurn, over: netOver, bot: netBot,
    show: netShow, leave: netLeave
  });
  // (tests)
  window.__canasta = { get S() { return S; }, get busy() { return busy; }, get seat() { return NET ? MYSEAT : LME; }, get net() { return !!NET; }, move: move, core: Core, record: recordGame,
    sel: function (ids) { sel = ids.slice(); paintAll(); },
    load: function (st) { token++; busy = false; sel = []; staged = []; S = st; ST0 = S; LME = S.me || 0; build(); render(); next(); } };
})();
</script>
</body>
</html>

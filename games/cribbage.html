<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cribbage</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
.stage{padding-bottom:calc(var(--safe-b) + 8px);}

/* ── Wooden cribbage board ─────────────────────────────────────────────── */
.cboard{position:relative;border-radius:18px;padding:6px 8px 4px;margin:0 0 10px;}
.cboard svg{width:100%;height:auto;overflow:visible;}
.cb-sc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px 2px;}
.cb-p{display:flex;align-items:center;gap:6px;min-width:0;color:#fbe9cf;text-shadow:0 1px 0 rgba(0,0,0,.45);}
.cb-p.r{flex-direction:row-reverse;}
.cb-p .dot{width:12px;height:12px;flex:none;border-radius:50%;background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.5);}
.cb-p .nm{font-weight:800;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:118px;}
.cb-p .pt{font-family:var(--display);font-size:1.45rem;line-height:1;font-variant-numeric:tabular-nums;}
.cb-p .dl{font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.3);color:#ffd98a;}
.cb-p .plus{font-family:var(--display);font-size:1.05rem;color:var(--yellow);animation:plus 1.4s var(--ease) forwards;}
@keyframes plus{0%{opacity:0;transform:translateY(6px) scale(.6);}15%{opacity:1;transform:none;}75%{opacity:1;}100%{opacity:0;transform:translateY(-8px);}}

/* ── Table ─────────────────────────────────────────────────────────────── */
.ctable .felt-in{height:clamp(270px,43dvh,400px);min-height:270px;transition:height .35s var(--ease);}
.ctable.tall .felt-in{height:calc(clamp(270px,43dvh,400px) + 70px);}
.cseat .backs{--cw:24px;}
.cseat .dlr{font-size:.6rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:var(--yellow);color:#2b1a00;margin-left:2px;}
.deck{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;--cw:clamp(42px,11.5vw,50px);}
.deck .stack{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4);}
.deck .stack .pcard{position:absolute;left:0;top:0;}
.deck .stack .pcard:nth-child(2){left:2px;top:-2px;}
.deck .stack .pcard:nth-child(3){left:4px;top:-4px;}
.deck .stack .pcard.starter{left:6px;top:-8px;transform:rotate(-4deg);box-shadow:0 0 0 2px var(--yellow),0 8px 16px rgba(0,0,0,.4);}
.deck .stack .pcard.starter.flip{animation:flipin .5s var(--ease);}
@keyframes flipin{0%{transform:rotateY(90deg) translateY(-20px);}100%{transform:rotate(-4deg);}}
.tlbl{font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.62);white-space:nowrap;text-align:center;line-height:1.15;}
.crib{position:absolute;right:12px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;--cw:clamp(36px,10vw,44px);transition:top .4s var(--ease);}
.crib.top{top:24%;} .crib.bot{top:52%;}
.crib .stack{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4);}
.crib .stack .pcard{position:absolute;left:0;top:0;}
.crib .stack .pcard.slot{opacity:.7;}
.crib .stack .pcard:nth-child(2){left:2px;top:-2px;transform:rotate(3deg);}
.crib .stack .pcard:nth-child(3){left:-1px;top:-4px;transform:rotate(-3deg);}
.crib .stack .pcard:nth-child(4){left:3px;top:-6px;transform:rotate(2deg);}
.pile{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;--cw:clamp(42px,11.5vw,50px);}
.pile .row{display:flex;align-items:center;justify-content:center;min-height:calc(var(--cw) * 1.4 + 20px);gap:0;}
.pile .row .pcard{margin-left:var(--ov,-24px);}
.pile .row .pcard:first-child{margin-left:0;}
.pile .row .pcard.o-top{transform:translateY(-9px) rotate(-2deg);}
.pile .row .pcard.o-bot{transform:translateY(9px) rotate(2deg);}
.pile .row .pcard.gone{transition:transform .4s ease-in, opacity .4s ease-in;opacity:0;transform:translateY(0) scale(.7);}
.count{display:flex;align-items:baseline;gap:6px;padding:3px 12px;border-radius:999px;background:rgba(0,0,0,.32);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
.count small{font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);}
.count b{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums;min-width:1.3em;text-align:center;}
.count.hot b{color:var(--yellow);}
.count.bump{animation:bounce .5s var(--spring);}
.feltmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-weight:800;z-index:2;width:62%;}
.feltmsg .display{font-size:1.5rem;display:block;margin-bottom:4px;}

/* Cut for deal */
.cutdeal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:34px;z-index:2;--cw:clamp(58px,16vw,70px);}
.cutdeal .who{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:.9rem;}
.cutdeal .pcard.flip{animation:flipin .5s var(--ease);}
.cutdeal .pcard.low{box-shadow:0 0 0 3px var(--yellow),0 0 20px rgba(255,200,61,.6);}

/* The show: counting a hand */
.showv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px 12px;z-index:2;}
.showv .who{display:flex;align-items:center;gap:8px;color:#fff;font-family:var(--display);font-size:1.35rem;letter-spacing:.01em;}
.showv .who .avatar{width:28px;height:28px;font-size:.8rem;font-family:var(--font);}
.showv .who .step{font-family:var(--font);font-size:.68rem;font-weight:900;letter-spacing:.1em;color:rgba(255,255,255,.6);text-transform:uppercase;}
.showv .cards{display:flex;align-items:flex-end;gap:5px;--cw:clamp(46px,13vw,60px);}
.showv .cards .gap{width:10px;}
.showv .cards .pcard.lit{transform:translateY(-10px);box-shadow:0 0 0 3px var(--yellow),0 10px 18px rgba(0,0,0,.4);}
.showv .cards .pcard.st{box-shadow:0 0 0 2px rgba(255,255,255,.75),0 6px 14px rgba(0,0,0,.3);}
.showv .cards .pcard.st.lit{box-shadow:0 0 0 3px var(--yellow),0 10px 18px rgba(0,0,0,.4);}
.showv .stl{font-size:.58rem;font-weight:900;letter-spacing:.1em;color:rgba(255,255,255,.6);text-transform:uppercase;text-align:center;margin-top:3px;}
.slip{width:100%;max-width:400px;border-radius:6px 6px 12px 12px;padding:10px 14px 10px;transform:rotate(-.6deg);position:relative;}
.slip .say{font-family:var(--hand);font-size:1.3rem;line-height:1.25;color:var(--ink);min-height:1.6em;}
.slip .say .sg{animation:rise .35s var(--ease) both;}
.slip .tot{position:absolute;right:-4px;top:-12px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#c8102e;color:#fff;font-family:var(--display);font-size:1.4rem;box-shadow:0 4px 10px rgba(0,0,0,.35);transform:rotate(8deg);}
.slip .tot.pop{animation:pop .45s var(--spring);}
.slip .combos{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.slip .combos span{font-size:.72rem;font-weight:800;color:#4a4a62;background:rgba(31,42,107,.08);border-radius:6px;padding:2px 6px;}
.slip .combos span.on{background:rgba(255,200,61,.55);color:#2b1a00;}

/* Hand + bar */
.chand{--cw:clamp(56px,16vw,74px);}
.chand .pcard.cover{pointer-events:none;}
.cbar .btn{min-width:200px;}
.cbar .hint{text-align:center;}
.cbar .hint b{color:var(--yellow);}
.passcard{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;}
.passcard .hint{color:var(--text-2);font-weight:800;}
.sum{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums;}
.sum th,.sum td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--w08);}
.sum th:first-child,.sum td:first-child{text-align:left;}
.sum td.big{font-weight:900;font-size:1.15rem;}
@media (max-width:360px){.cb-p .nm{max-width:84px;}}
/* Three players, or two partnerships: a track each on the board; the score plates stack name over points (on a
   tablet held sideways they stand at the board's ends instead: below) */
@media (max-width:979px),(orientation:portrait),(max-height:599px){
  .cboard.k3 .cb-p,.cboard.tm .cb-p{display:grid;grid-template-columns:auto auto auto;grid-template-areas:"dot nm nm" "pt pt dl";column-gap:6px;row-gap:1px;align-items:center;justify-content:start;position:relative;}
  .cboard.k3 .cb-p.r,.cboard.tm .cb-p.r{grid-template-columns:auto auto auto;grid-template-areas:"nm nm dot" "dl pt pt";justify-content:end;justify-items:end;}
  .cboard.k3 .cb-p.m{grid-template-areas:"dot nm nm" "pt pt dl";justify-content:center;}
  .cboard.k3 .cb-p .dot,.cboard.tm .cb-p .dot{grid-area:dot;} .cboard.k3 .cb-p .nm,.cboard.tm .cb-p .nm{grid-area:nm;max-width:none;}
  .cboard.k3 .cb-p .pt,.cboard.tm .cb-p .pt{grid-area:pt;} .cboard.k3 .cb-p .dl,.cboard.tm .cb-p .dl{grid-area:dl;justify-self:start;}
  .cboard.k3 .cb-p.r .dl,.cboard.tm .cb-p.r .dl{justify-self:end;}
  .cboard.k3 .cb-p .plus,.cboard.tm .cb-p .plus{position:absolute;left:100%;top:50%;margin-left:4px;}
  .cboard.k3 .cb-p.r .plus,.cboard.tm .cb-p.r .plus{left:auto;right:100%;margin:0 4px 0 0;}
  .cboard.k3 .cb-sc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));}
  .cboard.k3 .cb-p.m{justify-self:center;} .cboard.k3 .cb-p.r{justify-self:end;}
  .cboard.tm .cb-p .nm{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.1;max-width:150px;}
}
@media (max-width:360px){.cb-p .dl{display:none;} .cboard.tm .cb-p .nm{max-width:104px;}}
/* the table with three or four: the deck and the crib in the lower corners, clear of the seats */
.n3 .deck,.n4 .deck{top:auto;bottom:10px;left:10px;transform:none;}
.crib.low{top:auto;bottom:10px;}
.n4 .cseat.w,.n4 .cseat.e{top:36%;} .n4 .pile{top:60%;} .n4 .feltmsg{top:62%;width:54%;}
/* four on a small or short screen: the three others sit along the top, so the play has the middle */
.cseat.nw,.cseat.ne{top:8px;transform:translateX(-50%);}
.n4c .pile{top:57%;} .n4c .feltmsg{top:50%;width:56%;}
.n4c .cseat .backs{--cw:16px;} .n4c .cseat .backs .pcard+.pcard{margin-left:-11px;}
.n4c .cseat{min-width:0;} .n4c .cseat .tag{font-size:.7rem;gap:4px;padding:3px 7px 3px 3px;}
.n4c .cseat .tag .avatar{width:20px;height:20px;font-size:.62rem;}
#app .n4c .cseat .tag > span:nth-child(2){max-width:56px;}
/* the dealer's mark as a small round D (a dealer button) where the seats are tight */
.n4c .cseat .dlr,.n3 .cseat.nw .dlr,.n3 .cseat.ne .dlr{font-size:0;letter-spacing:0;width:17px;height:17px;padding:0;display:inline-grid;place-items:center;border-radius:50%;flex:none;}
.n4c .cseat .dlr::after,.n3 .cseat.nw .dlr::after,.n3 .cseat.ne .dlr::after{content:'D';font-size:.62rem;font-weight:900;}
.n3 .cseat.nw,.n3 .cseat.ne{top:8px;transform:translateX(-50%);}
.n3 .cutdeal,.n4 .cutdeal{gap:12px;--cw:clamp(46px,13vw,64px);}
.n3 .cseat .tag > span:nth-child(2),.n4 .cseat .tag > span:nth-child(2){max-width:96px;overflow:hidden;text-overflow:ellipsis;}
#app .n3 .cseat.s .tag > span:nth-child(2),#app .n4 .cseat.s .tag > span:nth-child(2){max-width:none;}
@media (max-width:360px){
  .feltmsg{width:56%;}
  .n3 .cseat .tag > span:nth-child(2),.n4 .cseat .tag > span:nth-child(2){max-width:64px;}
  .n3 .pile,.n4 .pile{--cw:40px;}
  .n3 .deck,.n4 .deck{--cw:38px;} .n3 .crib,.n4 .crib{--cw:34px;}
  .n4 .cseat .backs,.n3 .cseat .backs{--cw:18px;}
  .n4 .cseat .tag{font-size:.74rem;}
}
/* iPad portrait: bigger table and hand to use the extra height */
@media (min-width:700px) and (min-height:1000px){
  #app .ctable .felt-in{height:clamp(270px,43dvh,500px);}
  #app .ctable.tall .felt-in{height:calc(clamp(270px,43dvh,500px) + 70px);}
  #app .ctable.n3 .felt-in,#app .ctable.n4 .felt-in{height:calc(clamp(270px,43dvh,500px) - 14px);}
  #app .ctable.n3.tall .felt-in,#app .ctable.n4.tall .felt-in{height:calc(clamp(270px,43dvh,500px) + 56px);}
  #app .chand{--cw:88px;}
  #app .deck,#app .pile{--cw:64px;} #app .crib{--cw:56px;} #app .showv .cards{--cw:74px;} #app .cutdeal{--cw:84px;}
  #app .cseat .backs{--cw:30px;}
  .cb-p .nm{font-size:1rem;max-width:200px;}
  .cb-p .pt{font-size:1.7rem;}
}
/* Tablet / desktop landscape: the pegboard (scores at its ends) and the felt across the top; below them
   a strip with messages on the left, your hand in the middle, and sort + the button on the right */
@media (orientation:landscape) and (min-width:980px) and (min-height:600px){
  #app:has(> .cboard){--pbh:min(24dvh,calc((100vw - 460px) * .295),290px);max-width:1440px;height:calc(100dvh - var(--bar));
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
    grid-template-areas:"board board board" "felt felt felt" "info hand sort" "info hand bar";column-gap:18px;
    padding:4px calc(12px + var(--corner-x)) calc(var(--safe-b) + 6px + var(--corner-y));}
  #app > .cboard{grid-area:board;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;margin:0 0 10px;padding:8px 10px;}
  .cb-sc{display:contents;}
  .cb-p{grid-row:1;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto 20px;justify-content:center;align-items:center;column-gap:7px;row-gap:3px;position:relative;}
  .cb-p:first-child{grid-column:1;} .cb-p.r{grid-column:3;}
  .cb-p .dot{width:14px;height:14px;}
  .cb-p .nm{font-size:1.05rem;max-width:150px;}
  .cb-p .pt{grid-column:1 / -1;justify-self:center;font-size:calc(var(--pbh) * .22);}
  .cb-p .dl{grid-column:1 / -1;justify-self:center;font-size:.68rem;}
  .cb-p .plus{position:absolute;left:calc(50% + var(--pbh) * .2);top:34%;font-size:1.4rem;}
  .cboard svg{grid-column:2;grid-row:1;height:var(--pbh);width:calc(var(--pbh) * 400 / 118);}
  #app > .ctable{grid-area:felt;display:flex;flex-direction:column;min-height:0;margin:0 0 10px;}
  #app .ctable .felt-in,#app .ctable.tall .felt-in{flex:1;height:auto;min-height:0;}
  #app > .chand{grid-area:hand;width:min(620px,calc(100vw - 600px));--cw:clamp(64px,10.5dvh,92px);padding-top:18px;}
  #app > .csort-row{grid-area:sort;align-self:end;margin:0 0 8px;padding:0;}
  #app > .cbar{display:contents;}
  #app > .cbar .passcard{display:contents;}
  #app > .cbar .hint{grid-area:info;align-self:center;text-align:left;font-size:1.1rem;color:var(--text-2);}
  #app > .cbar .btn{grid-area:bar;justify-self:end;align-self:end;min-width:0;width:100%;max-width:300px;margin-bottom:6px;padding:0 16px;white-space:nowrap;}
  #app .deck,#app .pile{--cw:clamp(54px,9dvh,74px);} #app .crib{--cw:clamp(48px,8dvh,64px);} #app .showv .cards{--cw:clamp(64px,10.5dvh,86px);} #app .cutdeal{--cw:90px;}
  #app .pile{flex-direction:row;gap:16px;transform:translate(-50%,-50%);}
  #app .deck{left:24px;} #app .crib{right:24px;}
  #app .cseat .backs{--cw:30px;}
}
@media (orientation:landscape) and (min-width:980px) and (min-height:600px){
  #app > .cboard.k3{grid-template-columns:minmax(0,1fr) auto;}
  .cboard.k3 .cb-sc{display:grid;grid-template-columns:14px auto auto auto auto;align-content:center;align-items:center;justify-content:center;column-gap:8px;row-gap:8px;grid-column:1;grid-row:1;}
  .cboard.k3 .cb-p,.cboard.k3 .cb-p.r{display:contents;}
  .cboard.k3 .cb-p .dot{grid-column:1;} .cboard.k3 .cb-p .nm{grid-column:2;grid-row:auto;max-width:none;}
  .cboard.k3 .cb-p .pt{grid-column:3;justify-self:end;font-size:calc(var(--pbh) * .15);}
  .cboard.k3 .cb-p .dl{grid-column:4;justify-self:start;}
  .cboard.k3 .cb-p .plus{grid-column:5;position:static;}
  .cboard.k3 svg{grid-column:2;}
  .cboard.tm .cb-p .nm{white-space:normal;overflow:visible;text-overflow:clip;text-align:center;line-height:1.15;}
}
@media (orientation:landscape) and (min-width:980px) and (min-height:600px) and (display-mode:standalone){
  #app:has(> .cboard){height:calc(100dvh - var(--safe-t) - 64px);}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'cribbage_state', KEY = 'cribbage', WIN = 121;

  Kit.init({
    id: 'cribbage',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: 'Scores by hand', onClick: function () { if (S) showScores(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Cribbage: past games' }); } }
    ]),
    rules:
      '<p class="goal">Be the first to move your peg all the way around the board to <b>121</b> points.</p>' +
      '<h3>Card values</h3><ul><li>Ace = 1, number cards = their number, Jack, Queen and King = 10.</li>' +
      '<li>For runs, cards go in order A, 2, 3 … 10, J, Q, K (Ace is always low).</li></ul>' +
      '<h3>1. Deal and the crib</h3><ul><li>With two players, each gets <b>6 cards</b> and puts <b>2</b> face down into the <b>crib</b>.</li>' +
      '<li>With three, each gets <b>5 cards</b>, one card from the deck goes into the crib, and each player puts in <b>1</b>.</li>' +
      '<li>With four, you play in two partnerships, partners sitting across from each other. Each player gets <b>5 cards</b> and puts in <b>1</b>.</li>' +
      '<li>The crib is an extra hand of 4 cards that belongs to the <b>dealer</b>, so give your best cards to your own side\'s crib and your worst to anyone else\'s.</li>' +
      '<li>The deal passes to the left every hand.</li></ul>' +
      '<h3>2. The starter</h3><ul><li>The player on the dealer\'s left cuts the deck (with two players, the non-dealer) and the top card is turned up. It counts as part of every hand.</li>' +
      '<li>If it\'s a Jack, the dealer pegs 2 right away ("<b>his heels</b>").</li></ul>' +
      '<h3>3. The play (pegging)</h3><ul><li>The player on the dealer\'s left plays first, and play goes round to the left. Take turns laying one card and saying the running total (the "count"). The count can\'t go over 31.</li>' +
      '<li>Score as you play: make the count <b>15</b> = 2, make it exactly <b>31</b> = 2.</li>' +
      '<li>Play the same rank as the card before: <b>pair</b> = 2, three in a row = 6 ("pair royal"), four = 12.</li>' +
      '<li>Make a <b>run</b> of 3 or more with the last cards played, in any order = 1 point per card.</li>' +
      '<li>If you can\'t play without going over 31, say "<b>Go</b>". Everyone else keeps playing in turn while they can. Whoever played last gets <b>1</b> (unless they hit 31). Then the count starts again from 0, with the player on the left of whoever played last.</li>' +
      '<li>Whoever plays the very last card gets 1 for <b>last card</b>.</li></ul>' +
      '<h3>4. The show (counting)</h3><p>Each hand is your 4 cards plus the starter. The player on the dealer\'s left counts first, then the count goes round to the left, the dealer counts last, and then the dealer counts the crib.</p>' +
      '<ul><li><b>Fifteens:</b> every different group of cards that adds up to 15 = 2.</li>' +
      '<li><b>Pairs:</b> each pair = 2 (three of a kind = 6, four = 12).</li>' +

    NOV = Kit.win({
      title: left ? res.text : won ? (teams(st) ? sideSays(w) + ' win!' : 'You win!') : sideName(w, st) + (teams(st) ? ' win!' : ' wins!'),
      sub: r.sub, rank: rankOf(st),
      lose: !won && !left, icon: won ? 'trophy' : 'users',
      againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { if (left) { TurnNet.leave(); TurnNet.open(); } else NET.again(); },
      closeLabel: 'Back to games'
    });
  }
  function netLeave() {
    NET = null; NST = null; NQ = []; NGEN++; NBUSY = false; token++; NSEL = []; NSHOW = null; MEC = 0;
    netCloseOv();
    resetBoard();
    boot();
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  function boot() {
    var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (saved && saved.players && saved.score && saved.phase && saved.phase !== 'over') {
      S = saved; Kit.gameStart();
      if (S.mode === 'pass') S.revealed = false;
      render(); proceed();
    } else showSetup();
  }
  boot();
  TurnNet.setup({
    game: 'cribbage', title: 'Cribbage', min: 2, max: 4, botMs: 900,
    seats: function (n, o) { return Math.max(n, Math.min(4, +(o && o.seats) || n)); },
    opts: netOpts, start: netStart, turn: netTurn, over: netOver, bot: netBot,
    show: netShow, leave: netLeave
  });
})();
</script>

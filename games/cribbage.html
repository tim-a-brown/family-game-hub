<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cribbage</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.stage{padding-bottom:calc(var(--safe-b) + 8px);}

/* ── Wooden cribbage board ─────────────────────────────────────────────── */
.cboard{position:relative;border-radius:18px;padding:6px 8px 4px;margin:0 0 10px;}
.cboard svg{width:100%;height:auto;overflow:visible;}
.cb-sc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px 2px;}
.cb-p{display:flex;align-items:center;gap:6px;min-width:0;color:#fbe9cf;text-shadow:0 1px 0 rgba(0,0,0,.45);}
.cb-p.r{flex-direction:row-reverse;}
.cb-p .dot{width:12px;height:12px;flex:none;border-radius:50%;background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.5);}
.cb-p .nm{font-weight:800;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:118px;}
.cb-p .pt{font-family:var(--display);font-size:1.45rem;line-height:1;font-variant-numeric:tabular-nums;}
.cb-p .dl{font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.3);color:#ffd98a;}
.cb-p .plus{font-family:var(--display);font-size:1.05rem;color:var(--yellow);animation:plus 1.4s var(--ease) forwards;}
@keyframes plus{0%{opacity:0;transform:translateY(6px) scale(.6);}15%{opacity:1;transform:none;}75%{opacity:1;}100%{opacity:0;transform:translateY(-8px);}}

/* ── Table ─────────────────────────────────────────────────────────────── */
.ctable .felt-in{height:clamp(270px,43dvh,400px);min-height:270px;transition:height .35s var(--ease);}
.ctable.tall .felt-in{height:calc(clamp(270px,43dvh,400px) + 70px);}
.cseat .backs{--cw:24px;}
.cseat .dlr{font-size:.6rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:var(--yellow);color:#2b1a00;margin-left:2px;}
.deck{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;--cw:clamp(42px,11.5vw,50px);}
.deck .stack{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4);}
.deck .stack .pcard{position:absolute;left:0;top:0;}
.deck .stack .pcard:nth-child(2){left:2px;top:-2px;}
.deck .stack .pcard:nth-child(3){left:4px;top:-4px;}
.deck .stack .pcard.starter{left:6px;top:-8px;transform:rotate(-4deg);box-shadow:0 0 0 2px var(--yellow),0 8px 16px rgba(0,0,0,.4);}
.deck .stack .pcard.starter.flip{animation:flipin .5s var(--ease);}
@keyframes flipin{0%{transform:rotateY(90deg) translateY(-20px);}100%{transform:rotate(-4deg);}}
.tlbl{font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.62);white-space:nowrap;text-align:center;line-height:1.15;}
.crib{position:absolute;right:12px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;--cw:clamp(36px,10vw,44px);transition:top .4s var(--ease);}
.crib.top{top:24%;} .crib.bot{top:52%;}
.crib .stack{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4);}
.crib .stack .pcard{position:absolute;left:0;top:0;}
.crib .stack .pcard.slot{opacity:.7;}
.crib .stack .pcard:nth-child(2){left:2px;top:-2px;transform:rotate(3deg);}
.crib .stack .pcard:nth-child(3){left:-1px;top:-4px;transform:rotate(-3deg);}
.crib .stack .pcard:nth-child(4){left:3px;top:-6px;transform:rotate(2deg);}
.pile{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;--cw:clamp(42px,11.5vw,50px);}
.pile .row{display:flex;align-items:center;justify-content:center;min-height:calc(var(--cw) * 1.4 + 20px);gap:0;}
.pile .row .pcard{margin-left:var(--ov,-24px);}
.pile .row .pcard:first-child{margin-left:0;}
.pile .row .pcard.o-top{transform:translateY(-9px) rotate(-2deg);}
.pile .row .pcard.o-bot{transform:translateY(9px) rotate(2deg);}
.pile .row .pcard.gone{transition:transform .4s ease-in, opacity .4s ease-in;opacity:0;transform:translateY(0) scale(.7);}
.count{display:flex;align-items:baseline;gap:6px;padding:3px 12px;border-radius:999px;background:rgba(0,0,0,.32);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
.count small{font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);}
.count b{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums;min-width:1.3em;text-align:center;}
.count.hot b{color:var(--yellow);}
.count.bump{animation:bounce .5s var(--spring);}
.feltmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-weight:800;z-index:2;width:62%;}
.feltmsg .display{font-size:1.5rem;display:block;margin-bottom:4px;}

/* Cut for deal */
.cutdeal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:34px;z-index:2;--cw:clamp(58px,16vw,70px);}
.cutdeal .who{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:.9rem;}
.cutdeal .pcard.flip{animation:flipin .5s var(--ease);}
.cutdeal .pcard.low{box-shadow:0 0 0 3px var(--yellow),0 0 20px rgba(255,200,61,.6);}

/* The show: counting a hand */
.showv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px 12px;z-index:2;}
.showv .who{display:flex;align-items:center;gap:8px;color:#fff;font-family:var(--display);font-size:1.35rem;letter-spacing:.01em;}
.showv .who .avatar{width:28px;height:28px;font-size:.8rem;font-family:var(--font);}
.showv .who .step{font-family:var(--font);font-size:.68rem;font-weight:900;letter-spacing:.1em;color:rgba(255,255,255,.6);text-transform:uppercase;}
.showv .cards{display:flex;align-items:flex-end;gap:5px;--cw:clamp(46px,13vw,60px);}
.showv .cards .gap{width:10px;}
.showv .cards .pcard.lit{transform:translateY(-10px);box-shadow:0 0 0 3px var(--yellow),0 10px 18px rgba(0,0,0,.4);}
.showv .cards .pcard.st{box-shadow:0 0 0 2px rgba(255,255,255,.75),0 6px 14px rgba(0,0,0,.3);}
.showv .cards .pcard.st.lit{box-shadow:0 0 0 3px var(--yellow),0 10px 18px rgba(0,0,0,.4);}
.showv .stl{font-size:.58rem;font-weight:900;letter-spacing:.1em;color:rgba(255,255,255,.6);text-transform:uppercase;text-align:center;margin-top:3px;}
.slip{width:100%;max-width:400px;border-radius:6px 6px 12px 12px;padding:10px 14px 10px;transform:rotate(-.6deg);position:relative;}
.slip .say{font-family:var(--hand);font-size:1.3rem;line-height:1.25;color:var(--ink);min-height:1.6em;}
.slip .say .sg{animation:rise .35s var(--ease) both;}
.slip .tot{position:absolute;right:-4px;top:-12px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#c8102e;color:#fff;font-family:var(--display);font-size:1.4rem;box-shadow:0 4px 10px rgba(0,0,0,.35);transform:rotate(8deg);}
.slip .tot.pop{animation:pop .45s var(--spring);}
.slip .combos{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.slip .combos span{font-size:.72rem;font-weight:800;color:#4a4a62;background:rgba(31,42,107,.08);border-radius:6px;padding:2px 6px;}
.slip .combos span.on{background:rgba(255,200,61,.55);color:#2b1a00;}

/* Hand + bar */
.chand{--cw:clamp(56px,16vw,74px);}
.chand .pcard.cover{pointer-events:none;}
.cbar .btn{min-width:200px;}
.cbar .hint{text-align:center;}
.cbar .hint b{color:var(--yellow);}
.passcard{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;}
.passcard .hint{color:var(--text-2);font-weight:800;}
.sum{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums;}
.sum th,.sum td{padding:8px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);}
.sum th:first-child,.sum td:first-child{text-align:left;}
.sum td.big{font-weight:900;font-size:1.15rem;}
@media (max-width:360px){.cb-p .nm{max-width:84px;}}
/* iPad portrait: bigger table and hand to use the extra height */
@media (min-width:700px) and (min-height:1000px){
  #app .ctable .felt-in{height:clamp(270px,43dvh,500px);}
  #app .ctable.tall .felt-in{height:calc(clamp(270px,43dvh,500px) + 70px);}
  #app .chand{--cw:88px;}
  #app .deck,#app .pile{--cw:64px;} #app .crib{--cw:56px;} #app .showv .cards{--cw:74px;} #app .cutdeal{--cw:84px;}
  #app .cseat .backs{--cw:30px;}
  .cb-p .nm{font-size:1rem;max-width:200px;}
  .cb-p .pt{font-size:1.7rem;}
}
/* Tablet / desktop landscape: felt on the left, board + hand on the right */
@media (orientation:landscape) and (min-width:980px) and (min-height:600px){
  #app:has(> .cboard){max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,40%);grid-template-rows:auto 1fr auto auto auto;column-gap:20px;}
  #app > .cboard{grid-column:2;grid-row:1;}
  #app > .ctable{grid-column:1;grid-row:1 / 6;align-self:start;margin:0;}
  #app > .csort-row{grid-column:2;grid-row:3;}
  #app > .chand{grid-column:2;grid-row:4;--cw:80px;}
  #app > .cbar{grid-column:2;grid-row:5;}
  #app .ctable .felt-in,#app .ctable.tall .felt-in{height:calc(100dvh - var(--safe-t) - var(--safe-b) - 98px);min-height:420px;max-height:640px;}
  .cb-p .nm{max-width:110px;}
  #app .deck,#app .pile{--cw:70px;} #app .crib{--cw:60px;} #app .showv .cards{--cw:80px;} #app .cutdeal{--cw:90px;}
  #app .cseat .backs{--cw:32px;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'cribbage_state', KEY = 'cribbage', WIN = 121;

  Kit.init({
    id: 'cribbage',
    onNew: function () { clearSave(); showSetup(); },
    undo: function () { undo(); },
    menu: [
      { icon: 'chart', label: 'Scores by hand', onClick: function () { if (S) showScores(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Cribbage: past games' }); } }
    ],
    rules:
      '<p class="goal">Be the first to move your peg all the way around the board to <b>121</b> points.</p>' +
      '<h3>Card values</h3><ul><li>Ace = 1, number cards = their number, Jack, Queen and King = 10.</li>' +
      '<li>For runs, cards go in order A, 2, 3 … 10, J, Q, K (Ace is always low).</li></ul>' +
      '<h3>1. Deal and the crib</h3><ul><li>Each player gets <b>6 cards</b>. The dealer switches every hand.</li>' +
      '<li>Both players put <b>2 cards</b> face down into the <b>crib</b>. The crib is an extra hand that belongs to the <b>dealer</b>, so give your best cards to your own crib and your worst to your opponent\'s.</li></ul>' +
      '<h3>2. The starter</h3><ul><li>The non-dealer cuts the deck and the top card is turned up. It counts as part of every hand.</li>' +
      '<li>If it\'s a Jack, the dealer pegs 2 right away ("<b>his heels</b>").</li></ul>' +
      '<h3>3. The play (pegging)</h3><ul><li>The non-dealer plays first. Take turns laying one card and saying the running total (the "count"). The count can\'t go over 31.</li>' +
      '<li>Score as you play: make the count <b>15</b> = 2, make it exactly <b>31</b> = 2.</li>' +
      '<li>Play the same rank as the card before: <b>pair</b> = 2, three in a row = 6 ("pair royal"), four = 12.</li>' +
      '<li>Make a <b>run</b> of 3 or more with the last cards played, in any order = 1 point per card.</li>' +
      '<li>If you can\'t play without going over 31, say "<b>Go</b>". Your opponent keeps playing if they can. Whoever played last gets <b>1</b> (unless they hit 31). Then the count starts again from 0.</li>' +
      '<li>Whoever plays the very last card gets 1 for <b>last card</b>.</li></ul>' +
      '<h3>4. The show (counting)</h3><p>Each hand is your 4 cards plus the starter. The non-dealer counts first, then the dealer, then the dealer\'s crib.</p>' +
      '<ul><li><b>Fifteens:</b> every different group of cards that adds up to 15 = 2.</li>' +
      '<li><b>Pairs:</b> each pair = 2 (three of a kind = 6, four = 12).</li>' +
      '<li><b>Runs:</b> 3 or more in a row = 1 per card. Duplicates make double runs (3-3-4-5 is two runs of 3).</li>' +
      '<li><b>Flush:</b> all 4 hand cards the same suit = 4, or 5 if the starter matches too. The crib only scores a 5-card flush.</li>' +
      '<li><b>His nobs:</b> the Jack of the same suit as the starter = 1.</li></ul>' +
      '<h3>Winning</h3><p>The game ends the moment someone reaches 121, even in the middle of a hand. If the loser hasn\'t passed the <b>skunk line</b> (91), they\'re skunked. Under 61 is a double skunk.</p>' +
      '<p class="muted">Pegs leap-frog: the back peg jumps ahead of the front peg by the points scored, so you can always see your last score.</p>'
  });

  // ── Cards & scoring ─────────────────────────────────────────────────────
  var ORD = { A: 1, J: 11, Q: 12, K: 13 };
  function ord(c) { return ORD[c.r] || +c.r; }
  function val(c) { return Math.min(10, ord(c)); }
  function lbl(c) { return Cards.label(c); }
  function rk(c) { return c.r; }
  function plural(r) { return ({ A: 'Aces', J: 'Jacks', Q: 'Queens', K: 'Kings', '6': 'Sixes' }[r]) || r + 's'; }

  // Count a hand of 4 + starter. Returns {total, items:[{k, pts, ids, label}], say}
  function scoreHand(hand, st, crib) {
    var all = hand.concat([st]), items = [], i, j;
    // Fifteens
    for (var m = 1; m < 32; m++) {
      var sub = all.filter(function (c, k) { return m >> k & 1; });
      if (sub.length > 1 && sub.reduce(function (a, c) { return a + val(c); }, 0) === 15)
        items.push({ k: '15', pts: 2, ids: sub.map(function (c) { return c.id; }), label: sub.map(rk).join('+') });
    }
    // Pairs (grouped by rank)
    var byR = {};
    all.forEach(function (c) { (byR[c.r] = byR[c.r] || []).push(c); });
    Object.keys(byR).sort(function (a, b) { return ord(byR[a][0]) - ord(byR[b][0]); }).forEach(function (r) {
      var n = byR[r].length; if (n < 2) return;
      items.push({ k: n === 2 ? 'pair' : n === 3 ? 'royal' : 'double', pts: n * (n - 1), ids: byR[r].map(function (c) { return c.id; }),
        label: n === 2 ? 'Pair of ' + plural(r) : n === 3 ? 'Three ' + plural(r) : 'Four ' + plural(r) });
    });
    // Runs (longest only; duplicates make multiple runs)
    var cnt = []; for (i = 0; i <= 14; i++) cnt.push([]);
    all.forEach(function (c) { cnt[ord(c)].push(c); });
    for (i = 1; i <= 13; i++) {
      if (!cnt[i].length || cnt[i - 1].length) continue;
      j = i; while (j <= 13 && cnt[j].length) j++;
      var L = j - i;
      if (L >= 3) {
        var combos = [[]];
        for (var q = i; q < j; q++) {
          var nx = []; combos.forEach(function (cb) { cnt[q].forEach(function (c) { nx.push(cb.concat([c])); }); }); combos = nx;
        }
        combos.forEach(function (cb) { items.push({ k: 'run', pts: L, ids: cb.map(function (c) { return c.id; }), label: 'Run ' + cb.map(rk).join('-') }); });
      }
    }
    // Flush
    if (hand.every(function (c) { return c.s === hand[0].s; })) {
      if (st.s === hand[0].s) items.push({ k: 'flush', pts: 5, ids: all.map(function (c) { return c.id; }), label: '5-card flush' });
      else if (!crib) items.push({ k: 'flush', pts: 4, ids: hand.map(function (c) { return c.id; }), label: '4-card flush' });
    }
    // His nobs
    hand.forEach(function (c) { if (c.r === 'J' && c.s === st.s) items.push({ k: 'nobs', pts: 1, ids: [c.id, st.id], label: 'His nobs ' + lbl(c) }); });
    var total = 0, segs = [];
    items.forEach(function (it, n) {
      total += it.pts;
      var t = it.k === '15' ? 'fifteen ' + total
        : it.k === 'pair' ? 'a pair is ' + total
        : it.k === 'royal' ? 'pair royal is ' + total
        : it.k === 'double' ? 'double pair royal is ' + total
        : it.k === 'run' ? 'a run of ' + it.pts + ' is ' + total
        : it.k === 'flush' ? (it.pts === 5 ? 'a 5-card flush is ' : 'a flush is ') + total
        : 'his nobs is ' + total;
      if (n === 0) t = t.charAt(0).toUpperCase() + t.slice(1);
      segs.push(t);
      it.say = t;
    });
    return { total: total, items: items, segs: segs };
  }
  function handTotal(hand, st, crib) { return scoreHand(hand, st, crib).total; }

  // Points for the card just played onto the pile (cards in the current count)
  function pegScore(pile) {
    var n = pile.length, count = pile.reduce(function (a, c) { return a + val(c); }, 0), pts = 0, parts = [];
    if (count === 15) { pts += 2; parts.push(['Fifteen', 2]); }
    if (count === 31) { pts += 2; parts.push(['Thirty-one', 2]); }
    var same = 1; while (same < n && pile[n - 1 - same].r === pile[n - 1].r) same++;
    if (same === 2) { pts += 2; parts.push(['Pair', 2]); }
    if (same === 3) { pts += 6; parts.push(['Pair royal', 6]); }
    if (same === 4) { pts += 12; parts.push(['Double pair royal', 12]); }
    for (var L = n; L >= 3; L--) {
      var o = pile.slice(n - L).map(ord).sort(function (a, b) { return a - b; }), ok = true;
      for (var i = 1; i < L; i++) if (o[i] !== o[i - 1] + 1) { ok = false; break; }
      if (ok) { pts += L; parts.push(['Run of ' + L, L]); break; }
    }
    return { pts: pts, parts: parts, count: count };
  }
  function partsText(parts) { return parts.map(function (p) { return p[0] + ' for ' + p[1]; }).join(', '); }

  // ── Computer player ─────────────────────────────────────────────────────
  function fullDeck() { return Cards.deck(); }
  function unknownTo(known) {
    var ids = {}; known.forEach(function (c) { ids[c.id] = 1; });
    return fullDeck().filter(function (c) { return !ids[c.id]; });
  }
  // Pick 2 of 6 to throw: expected hand value over every possible starter,
  // plus (dealer) or minus (non-dealer) the expected crib value from sampling.
  function cpuDiscard(hand, isDealer) {
    var unk = unknownTo(hand), best = null;
    for (var i = 0; i < 6; i++) for (var j = i + 1; j < 6; j++) {
      var keep = hand.filter(function (c, k) { return k !== i && k !== j; }), toss = [hand[i], hand[j]];
      var hv = 0; unk.forEach(function (st) { hv += handTotal(keep, st, false); }); hv /= unk.length;
      var cv = 0, N = 70;
      for (var s = 0; s < N; s++) {
        var a = Math.floor(Math.random() * unk.length), b, c;
        do { b = Math.floor(Math.random() * unk.length); } while (b === a);
        do { c = Math.floor(Math.random() * unk.length); } while (c === a || c === b);
        cv += handTotal(toss.concat([unk[a], unk[b]]), unk[c], true);
      }
      cv /= N;
      // a little pegging sense: low cards and pairs help in the play
      var pegBonus = keep.filter(function (c) { return val(c) <= 4; }).length * 0.12;
      if (!isDealer && toss.some(function (c) { return c.r === '5'; })) cv += 0.6;
      var ev = hv + (isDealer ? cv : -cv) + pegBonus + Math.random() * 0.15;
      if (!best || ev > best.ev) best = { ev: ev, ids: [hand[i].id, hand[j].id] };
    }
    return best.ids;
  }
  // Choose a card in the play: take points now, avoid setting up easy points
  // for the opponent (using only cards it hasn't seen).
  function cpuPeg(p) {
    var P = S.peg, hand = P.hand[p], count = P.count, pile = P.pile.map(function (x) { return x.c; });
    var opts = hand.filter(function (c) { return count + val(c) <= 31; });
    if (opts.length === 1) return opts[0];
    var seen = S.keep[p].concat(S.tossed[p], [S.starter], P.played.map(function (x) { return x.c; }));
    var unk = unknownTo(seen), byOrd = {};
    unk.forEach(function (c) { byOrd[ord(c)] = (byOrd[ord(c)] || 0) + 1; });
    var oppLeft = P.hand[1 - p].length, best = null;
    opts.forEach(function (c) {
      var after = pile.concat([c]), mine = pegScore(after).pts, nc = count + val(c), risk = 0;
      if (oppLeft) for (var o = 1; o <= 13; o++) {
        if (!byOrd[o] || nc + Math.min(10, o) > 31) continue;
        var fake = { r: o === 1 ? 'A' : o === 11 ? 'J' : o === 12 ? 'Q' : o === 13 ? 'K' : String(o), s: 'x' };
        risk += byOrd[o] / unk.length * pegScore(after.concat([fake])).pts;
      }
      risk *= Math.min(1.6, 0.55 * oppLeft + 0.3);
      var v = mine - risk;

  // ── State ───────────────────────────────────────────────────────────────

  // ── Cut for deal ────────────────────────────────────────────────────────

  // ── Dealing & the crib ──────────────────────────────────────────────────

  // ── The starter ─────────────────────────────────────────────────────────

    undoStack = [];

  // ── Scoring & pegs ──────────────────────────────────────────────────────

    svg.appendChild(defs);
    for (var s = 0; s < 3; s++) {
      svg.appendChild(svgEl('rect', { x: 31, y: laneY(s, 0) - 7.5, width: 334, height: 27, rx: 7, fill: 'rgba(0,0,0,.13)' }));
      for (var p = 0; p < 2; p++) {
        svg.appendChild(svgEl('rect', { x: 34, y: laneY(s, p) - 4, width: 328, height: 8, rx: 4, fill: Kit.color(p), opacity: .2 }));
        for (var j = 0; j < 40; j++) {
          var x = colX(j), y = laneY(s, p);
          svg.appendChild(svgEl('circle', { cx: x, cy: y + .7, r: 2.15, fill: 'rgba(255,225,190,.22)' }));
          svg.appendChild(svgEl('circle', { cx: x, cy: y, r: 2, fill: 'url(#hole)' }));
        }
      }
    }
    // start holes
    for (var p2 = 0; p2 < 2; p2++) [15, 25].forEach(function (x) {
      svg.appendChild(svgEl('circle', { cx: x, cy: laneY(0, p2) + .7, r: 2.4, fill: 'rgba(255,225,190,.22)' }));
      svg.appendChild(svgEl('circle', { cx: x, cy: laneY(0, p2), r: 2.3, fill: 'url(#hole)' }));
    });
    // finish hole
    var fx = 382, fy = laneY(1, 0) + 6;
    svg.appendChild(svgEl('circle', { cx: fx, cy: fy, r: 7, fill: 'rgba(0,0,0,.18)' }));
    svg.appendChild(svgEl('circle', { cx: fx, cy: fy + .8, r: 3.4, fill: 'rgba(255,225,190,.25)' }));
    svg.appendChild(svgEl('circle', { cx: fx, cy: fy, r: 3.2, fill: 'url(#hole)' }));
    var t121 = svgEl('text', { x: fx, y: fy - 11, 'text-anchor': 'middle', 'font-size': 7.5, 'font-weight': 900, fill: 'rgba(255,236,205,.8)', 'font-family': 'ui-rounded,system-ui,sans-serif' }); t121.textContent = '121'; svg.appendChild(t121);
    // street-end numbers
    [[40, 0, 'r'], [80, 1, 'l'], [120, 2, 'r']].forEach(function (a) {
      var x = a[2] === 'r' ? 371 : 29, y = laneY(a[1], 0) + 8.5;
      var tt = svgEl('text', { x: x, y: y, 'text-anchor': 'middle', 'font-size': 6, 'font-weight': 900, fill: 'rgba(255,236,205,.55)', 'font-family': 'ui-rounded,system-ui,sans-serif' }); tt.textContent = a[0]; svg.appendChild(tt);
    });
    var go = svgEl('text', { x: 20, y: laneY(0, 1) + 13, 'text-anchor': 'middle', 'font-size': 5.5, 'font-weight': 900, fill: 'rgba(255,236,205,.5)', 'font-family': 'ui-rounded,system-ui,sans-serif', 'letter-spacing': '.5' }); go.textContent = 'START'; svg.appendChild(go);
    // skunk line between 90 and 91
    var sx = (holeXY(0, 90)[0] + holeXY(0, 91)[0]) / 2, sy = laneY(2, 0);
    svg.appendChild(svgEl('line', { x1: sx, x2: sx, y1: sy - 8, y2: sy + 20, stroke: '#e8203a', 'stroke-width': 1.4, 'stroke-linecap': 'round' }));
    var sk = svgEl('text', { x: sx, y: sy + 27.5, 'text-anchor': 'middle', 'font-size': 6, 'font-weight': 900, fill: '#ffb3a8', 'font-family': 'ui-rounded,system-ui,sans-serif', 'letter-spacing': '.6' }); sk.textContent = 'SKUNK'; svg.appendChild(sk);
    // pegs
    pegNodes = [[], []];
    for (var pp = 0; pp < 2; pp++) for (var k = 0; k < 2; k++) {
      var g = svgEl('g', { class: 'peg', filter: 'url(#pegsh)' });
      var col = Kit.color(pp);
      g.appendChild(svgEl('circle', { r: 3.5, fill: col, stroke: 'rgba(0,0,0,.35)', 'stroke-width': .6 }));
      g.appendChild(svgEl('circle', { r: 1.2, cx: -1.1, cy: -1.2, fill: '#fff', opacity: .75 }));
      svg.appendChild(g); pegNodes[pp].push(g);
    }
    boardEl.appendChild(svg);
  }
  function placePeg(g, pos, scale) {
    var xy = holeXY(+g.dataset.pl, pos);
    g.setAttribute('transform', 'translate(' + xy[0].toFixed(2) + ',' + xy[1].toFixed(2) + ')' + (scale ? ' scale(' + scale + ')' : ''));
  }
  function leap(g, from, to) {
    var p = +g.dataset.pl, a = holeXY(p, from), b = holeXY(p, to);
    var dist = Math.hypot(b[0] - a[0], b[1] - a[1]), ms = Math.min(950, 380 + dist * 2.2), h = Math.min(26, 8 + dist * .12);
    var t0 = performance.now();
    g.parentNode.appendChild(g); // on top
    (function frame(now) {
      var t = Math.min(1, (now - t0) / ms), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      var x = a[0] + (b[0] - a[0]) * e, y = a[1] + (b[1] - a[1]) * e - Math.sin(Math.PI * t) * h, sc = 1 + Math.sin(Math.PI * t) * .55;
      g.setAttribute('transform', 'translate(' + x.toFixed(2) + ',' + y.toFixed(2) + ') scale(' + sc.toFixed(3) + ')');
      if (t < 1) requestAnimationFrame(frame); else { placePeg(g, to); Kit.sfx('tick'); }
    })(t0);
  }
  function resetBoard() { pegNodes.forEach(function (ps) { ps.forEach(function (g) { delete g.dataset.pos; }); }); }
  function updateBoard(animate, who, plus) {
    if (!boardEl || !S) return;
    for (var p = 0; p < 2; p++) for (var k = 0; k < 2; k++) {
      var g = pegNodes[p][k], pos = S.pegs[p][k];
      g.dataset.pl = p;
      var cur = g.dataset.pos == null ? null : +g.dataset.pos;
      if (cur === pos) continue;
      if (animate && cur != null && document.visibilityState === 'visible') leap(g, cur, pos); else placePeg(g, pos);
      g.dataset.pos = pos;
    }
    paintScores(who, plus);
  }
  function paintScores(who, plus) {
    for (var p = 0; p < 2; p++) {
      var b = scEls[p]; b.innerHTML = '';
      b.appendChild(el('span', { class: 'dot' }));
      b.appendChild(el('span', { class: 'nm', text: nm(p) }));
      b.appendChild(el('span', { class: 'pt', text: String(S.score[p]) }));
      if (S.dealer === p && S.phase !== 'cutdeal') b.appendChild(el('span', { class: 'dl', text: 'Deal' }));
      if (who === p && plus) b.appendChild(el('span', { class: 'plus', text: '+' + plus }));
    }
  }

  // ── Render ──────────────────────────────────────────────────────────────
  var tableEl, feltEl, seatEls = {}, pileEl, handEl, barEl, sortRow;
  function render() {
    if (!boardEl) createBoard();
    app.innerHTML = '';
    app.appendChild(boardEl);
    tableEl = el('div', { class: 'ctable wood' + (S.phase === 'show' || S.phase === 'cutdeal' ? ' tall' : '') });
    feltEl = el('div', { class: 'felt-in' });
    tableEl.appendChild(feltEl);
    app.appendChild(tableEl);
    sortRow = el('div', { class: 'csort-row' }, [sortT.el]); app.appendChild(sortRow);
    handEl = el('div', { class: 'chand' }); app.appendChild(handEl);
    barEl = el('div', { class: 'cbar' }); app.appendChild(barEl);
    handEl.hidden = S.phase === 'show';
    updateBoard(false);
    paintAll();
  }
  function paintAll() { paintFelt(); paintHand(); paintBar(); }

  function seatTag(p, pos) {
    var s = el('div', { class: 'cseat ' + pos + (actor() === p && (S.phase === 'peg' || S.phase === 'discard') ? ' turn' : '') });
    var tag = el('div', { class: 'tag' }, [
      el('span', { class: 'avatar', style: { '--c': Kit.color(p) }, html: isCpu(p) ? Kit.icon('bot') : Kit.esc(nm(p).charAt(0).toUpperCase()) }),
      el('span', { text: short(p) }),
      S.dealer === p ? el('span', { class: 'dlr', text: 'Dealer' }) : null
    ]);
    if (pos === 's') s.appendChild(tag);
    else {
      s.appendChild(tag);
      var n = S.phase === 'peg' ? S.peg.hand[p].length : S.phase === 'discard' || S.phase === 'cut' ? (S.keep[p] ? 4 : 6) : 0;
      if (n) { var backs = el('div', { class: 'backs' }); for (var k = 0; k < n; k++) backs.appendChild(Kit.card('', '', { back: true })); s.appendChild(backs); }
    }
    return s;
  }
  function paintFelt() {
    feltEl.innerHTML = ''; pileEl = null; seatEls = {};
    if (S.phase === 'cutdeal') return paintCutDeal();
    if (S.phase === 'show' || (S.phase === 'over' && S.showStep >= 0)) return paintShow();
    var bot = bottomSeat(), top = other(bot);
    seatEls.n = seatTag(top, 'n'); seatEls.s = seatTag(bot, 's');
    feltEl.appendChild(seatEls.n); feltEl.appendChild(seatEls.s);
    // Deck + starter
    var stack = el('div', { class: 'stack' });
    for (var i = 0; i < 3; i++) stack.appendChild(Kit.card('', '', { back: true }));
    if (S.starter) { var stc = Cards.el(S.starter, { cls: 'starter' }); stack.appendChild(stc); }
    feltEl.appendChild(el('div', { class: 'deck' }, [stack, el('div', { class: 'tlbl', text: S.starter ? 'Starter' : 'Deck' })]));
    // Crib, beside the dealer
    var cs = el('div', { class: 'stack' });
    if (!S.crib.length) cs.appendChild(Kit.card('', '', { cls: 'slot' }));
    S.crib.forEach(function () { cs.appendChild(Kit.card('', '', { back: true })); });
    feltEl.appendChild(el('div', { class: 'crib ' + (S.dealer === top ? 'top' : 'bot') }, [cs, el('div', { class: 'tlbl', html: Kit.esc(short(S.dealer) === 'You' ? 'Your' : short(S.dealer) + "'s") + '<br>crib' })]));
    // Pile + count
    if (S.phase === 'peg') {
      var P = S.peg, row = el('div', { class: 'row' });
      var n = P.pile.length, ov = n > 1 ? Math.min(-14, Math.max(-34, (176 - 50) / (n - 1) - 50)) : 0;
      row.style.setProperty('--ov', ov + 'px');
      P.pile.forEach(function (x) { row.appendChild(Cards.el(x.c, { cls: x.p === top ? 'o-top' : 'o-bot' })); });
      if (!n) row.appendChild(Kit.card('', '', { cls: 'slot' }));
      var cnt = el('div', { class: 'count' + (P.count === 15 || P.count === 31 ? ' hot' : '') }, [el('small', { text: 'Count' }), el('b', { text: String(P.count) })]);
      pileEl = el('div', { class: 'pile' }, [cnt, row]);
      feltEl.appendChild(pileEl);
    } else if (S.phase === 'discard') {
      var a = discardActor();
      feltEl.appendChild(el('div', { class: 'feltmsg' }, [el('span', { class: 'display', text: 'Hand ' + S.hand }), el('span', { text: a >= 0 && isCpu(a) ? nm(a) + ' is choosing…' : 'Choose 2 cards for ' + (a === S.dealer ? 'your' : short(S.dealer) + "'s") + ' crib' })]));
    } else if (S.phase === 'cut') {
      feltEl.appendChild(el('div', { class: 'feltmsg' }, [el('span', { class: 'display', text: 'Cut' }), el('span', { text: isCpu(other(S.dealer)) ? nm(other(S.dealer)) + ' cuts the deck…' : short(other(S.dealer)) + (you(other(S.dealer)) ? ' cut' : ' cuts') + ' the deck for the starter' })]));
    }
  }
  function paintCutDeal() {
    var box = el('div', { class: 'cutdeal' });
    [0, 1].forEach(function (p) {
      var c = S.cutCards ? Cards.el(S.cutCards[p], { cls: 'flip' + (S.dealer === p ? ' low' : '') }) : Kit.card('', '', { back: true });
      box.appendChild(el('div', { class: 'who' }, [c, el('span', { text: short(p) })]));
    });
    feltEl.appendChild(box);
  }
  function paintShow() {
    var step = Math.max(0, S.showStep), sp = showSpec(step), r = scoreHand(sp.cards, S.starter, sp.crib);
    var box = el('div', { class: 'showv' });
    box.appendChild(el('div', { class: 'who' }, [
      el('span', { class: 'avatar', style: { '--c': Kit.color(sp.p) }, html: isCpu(sp.p) ? Kit.icon('bot') : Kit.esc(nm(sp.p).charAt(0).toUpperCase()) }),
      el('span', { text: poss(sp.p) + (sp.crib ? ' crib' : ' hand') })
    ]));
    var cards = el('div', { class: 'cards' });
    sp.cards.slice().sort(function (a, b) { return ord(a) - ord(b); }).forEach(function (c) { cards.appendChild(Cards.el(c)); });
    cards.appendChild(el('div', { class: 'gap' }));
    cards.appendChild(el('div', null, [Cards.el(S.starter, { cls: 'st' }), el('div', { class: 'stl', text: 'Starter' })]));
    box.appendChild(cards);
    var slip = el('div', { class: 'slip paper' });
    slip.appendChild(el('div', { class: 'tot', text: String(r.total) }));
    slip.appendChild(el('div', { class: 'say', text: r.items.length ? r.segs.join(', ') : 'Nineteen! Not a single point.' }));
    if (r.items.length) {
      var cb = el('div', { class: 'combos' });
      r.items.forEach(function (it) { cb.appendChild(el('span', { text: it.k === '15' ? it.label + ' = 15' : it.label })); });
      slip.appendChild(cb);
    }
    box.appendChild(slip);
    box.appendChild(el('div', { class: 'stl', text: ['Non-dealer counts first', 'Dealer counts next', 'Dealer counts the crib last'][step] }));
    feltEl.appendChild(box);
  }

  function paintHand() {
    handEl.innerHTML = '';
    handEl.hidden = S.phase === 'show' || S.phase === 'cutdeal' || S.phase === 'over';
    if (sortRow) sortRow.hidden = handEl.hidden;
    if (handEl.hidden) return;
    var bot = bottomSeat(), cover = needCover() || (S.mode === 'pass' && S.phase === 'cut');
    if (sortRow) sortRow.style.visibility = cover ? 'hidden' : '';
    var mine = S.phase === 'peg' ? S.peg.hand[bot] : S.phase === 'discard' ? (S.keep[bot] || S.hands[bot]) : (S.keep[bot] || []);
    var a = actor();
    var canTapDiscard = S.phase === 'discard' && a === bot && !isCpu(bot) && !cover;
    var canTapPlay = S.phase === 'peg' && a === bot && !isCpu(bot) && !cover && !S.peg.reset;
    view(mine).forEach(function (c) {
      var n = cover ? Kit.card('', '', { back: true, cls: 'cover' }) : Cards.el(c);
      if (canTapDiscard) {
        n.classList.add('play'); if (S.sel.indexOf(c.id) >= 0) n.classList.add('sel');
        n.addEventListener('click', function () {
          var i = S.sel.indexOf(c.id);
          if (i >= 0) S.sel.splice(i, 1); else if (S.sel.length < 2) S.sel.push(c.id); else { Kit.toast('Just 2 cards. Tap one to put it back.'); return; }
          Kit.sfx('tap'); Kit.haptic('light'); save(); paintHand(); paintBar();
        });
      } else if (canTapPlay) {
        if (S.peg.count + val(c) <= 31) { n.classList.add('play'); n.addEventListener('click', function () { snapshot(); playCard(bot, c); }); }
        else { n.classList.add('dim'); n.addEventListener('click', function () { Kit.haptic('error'); Kit.toast('That would take the count past 31'); }); }
      } else if (S.phase === 'peg' && !cover && S.peg.count + val(c) > 31) n.classList.add('dim');
      if (cover) n.dataset.id = c.id;
      handEl.appendChild(n);
    });
    requestAnimationFrame(function () { Cards.fan(handEl); });
  }
  function hint(html) { barEl.appendChild(el('span', { class: 'hint', html: html })); }
  function paintBar() {
    barEl.innerHTML = '';
    if (S.phase === 'over') return;
    if (needCover()) { hint('Pass the phone to ' + Kit.esc(nm(actor()))); askHandoff(); return; }
    if (S.phase === 'cutdeal') {
      if (!S.cutCards) barEl.appendChild(el('button', { type: 'button', class: 'btn btn-primary', html: Kit.icon('cards') + '<span>Cut for deal</span>', onclick: cutForDeal }));
      else {
        barEl.appendChild(el('div', { class: 'passcard' }, [
          el('span', { class: 'hint', html: 'Low card deals: <b>' + Kit.esc(short(S.dealer)) + (you(S.dealer) ? ' deal' : ' deals') + '</b> first' }),
          el('button', { type: 'button', class: 'btn btn-primary', html: Kit.icon('play') + '<span>Deal</span>', onclick: function () { Kit.sfx('tap'); deal(); } })
        ]));
      }
      return;
    }
    if (S.phase === 'discard') {
      var p = discardActor();
      if (p < 0 || isCpu(p)) return hint('…');
      var b = el('button', { type: 'button', class: 'btn btn-primary', html: '<span>' + (S.sel.length === 2 ? 'Send to ' + (p === S.dealer ? 'your' : Kit.esc(short(S.dealer) + "'s")) + ' crib' : 'Pick 2 for the crib (' + S.sel.length + '/2)') + '</span>', onclick: sendToCrib });
      b.disabled = S.sel.length !== 2;
      barEl.appendChild(b);
      return;
    }
    if (S.phase === 'cut') {
      var nd = other(S.dealer);
      if (isCpu(nd)) return hint(Kit.esc(nm(nd)) + ' is cutting the deck…');
      barEl.appendChild(el('button', { type: 'button', class: 'btn btn-primary', html: Kit.icon('cards') + '<span>' + (S.mode === 'pass' ? Kit.esc(nm(nd)) + ': cut the deck' : 'Cut the deck') + '</span>', onclick: cutStarter }));
      return;
    }
    if (S.phase === 'peg') {
      var P = S.peg, t = P.turn;
      if (P.reset) return hint(P.count === 31 ? 'Thirty-one! New count' : 'New count from 0');
      if (isCpu(t)) return hint(Kit.esc(nm(t)) + ' is thinking…');
      if (!canPlay(t)) return hint(P.hand[t].length ? 'Go' : '');
      return hint((you(t) ? 'Your turn' : Kit.esc(nm(t)) + "'s turn") + ': count is <b>' + P.count + '</b>');
    }
    if (S.phase === 'show') {
      var lbls = ['Next: ' + (you(S.dealer) ? 'your' : Kit.esc(nm(S.dealer)) + "'s") + ' hand', 'Next: ' + (you(S.dealer) ? 'your' : Kit.esc(nm(S.dealer)) + "'s") + ' crib', 'Deal next hand'];
      barEl.appendChild(el('button', { type: 'button', class: 'btn btn-primary', html: '<span>' + lbls[Math.max(0, S.showStep)] + '</span>' + Kit.icon('right'), onclick: function () { Kit.sfx('tap'); nextShow(); } }));
    }
  }

  function say(p, text) {
    if (!feltEl) return;
    var pos = p === topSeat() ? 'n' : 's', seat = seatEls[pos];
    if (!seat || !seat.isConnected) return;
    var b = el('div', { class: 'say', text: text }); seat.appendChild(b);
    setTimeout(function () { b.remove(); }, 1500);
  }

  // Resume whatever the computer (or timer) was about to do
  function proceed() {
    if (!S) return;
    var t = token;
    if (S.phase === 'cut' && isCpu(other(S.dealer))) setTimeout(function () { if (t === token) cutStarter(); }, 900);
    else if (S.phase === 'peg') setTimeout(function () { if (t === token) pegStep(); }, 500);
  }
  window.addEventListener('resize', function () { if (handEl) Cards.fan(handEl); });

  // ── Boot ────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.players && saved.score && saved.phase && saved.phase !== 'over') {
    S = saved; Kit.gameStart();
    if (S.mode === 'pass') S.revealed = false;
    render(); proceed();
  } else showSetup();
})();
</script>

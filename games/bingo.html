<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Bingo Hopper</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
body{background:radial-gradient(700px 460px at 50% -8%, rgba(124,58,237,.18), transparent 62%), var(--bg);}
.page{padding-bottom:calc(110px + var(--safe-b));}
.bn-intro{font-size:.88rem;color:var(--text-2);text-align:center;margin:0 auto 14px;max-width:320px;line-height:1.45;}

/* Hero: the ball */
.bn-hero{display:flex;flex-direction:column;align-items:center;padding:22px 16px 18px;margin-bottom:14px;
  border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);}
@keyframes ball-drop{0%{transform:translateY(-70px) rotate(-200deg) scale(.6);opacity:0}55%{transform:translateY(8px) rotate(12deg) scale(1.06);opacity:1}75%{transform:translateY(-6px) rotate(-4deg)}100%{transform:none}}
@keyframes ball-glow{0%,100%{box-shadow:0 14px 34px rgba(0,0,0,.55),inset -10px -14px 24px rgba(0,0,0,.35),inset 8px 10px 18px rgba(255,255,255,.25)}50%{box-shadow:0 14px 44px rgba(255,255,255,.22),inset -10px -14px 24px rgba(0,0,0,.35),inset 8px 10px 18px rgba(255,255,255,.25)}}
.bn-ball-big{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 14px 34px rgba(0,0,0,.55),inset -10px -14px 24px rgba(0,0,0,.35),inset 8px 10px 18px rgba(255,255,255,.25);
  user-select:none;position:relative;transition:transform .12s;}
.bn-ball-big:active{transform:scale(.96);}
.bn-ball-big.just-drawn{animation:ball-drop .6s cubic-bezier(.22,.68,0,1) both, ball-glow 1.4s ease .6s 2;}
.bn-face{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#e9e9ef);color:#14141c;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -3px 6px rgba(0,0,0,.15);}
.bn-ball-big .letter{font-family:var(--display);font-size:1.05rem;font-weight:800;line-height:1;opacity:.7;}
.bn-ball-big .number{font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1;letter-spacing:-.03em;}
.bn-ball-empty{background:var(--surface-2);border:2px dashed var(--line-2);box-shadow:none;color:var(--text-3);
  flex-direction:column;font-size:.9rem;font-weight:700;line-height:1.3;}
.bn-ball-empty .big{font-size:2rem;margin-bottom:4px;}
.bn-called-count{font-size:.9rem;font-weight:600;color:var(--text-2);margin-top:16px;font-variant-numeric:tabular-nums;}
.bn-progress{width:100%;max-width:240px;height:6px;border-radius:99px;background:var(--surface-3);margin-top:8px;overflow:hidden;}
.bn-progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s var(--ease);}

/* Column colors */
.col-B{background:linear-gradient(145deg,#3b82f6,#1d4ed8);}
.col-I{background:linear-gradient(145deg,#ef4444,#b91c1c);}
.col-N{background:linear-gradient(145deg,#22c55e,#15803d);}
.col-O{background:linear-gradient(145deg,#f97316,#c2410c);}
.col-G{background:linear-gradient(145deg,#a855f7,#6d28d9);}

.sec-lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:0 4px 8px;}

/* Recent balls */
.bn-history{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:2px 16px;min-height:40px;align-items:center;}
.bn-history::-webkit-scrollbar{display:none;}
.bn-hist-chip{flex:none;min-width:48px;height:36px;padding:0 10px;border-radius:999px;font-size:.88rem;font-weight:800;color:#fff;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
.bn-hist-chip:first-child{animation:gn-pop .35s var(--spring) both;}
.bn-hist-empty{font-size:.88rem;color:var(--text-3);padding:0 4px;}

/* Board */
.bn-board-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;}
.bn-board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.bn-col-header{text-align:center;font-family:var(--display);font-size:1.1rem;font-weight:800;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:#fff;margin-bottom:4px;}
.bn-num{height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:.86rem;font-weight:700;background:var(--surface-2);color:var(--text-3);transition:background .25s,color .25s;font-variant-numeric:tabular-nums;}
.bn-num.called{color:#fff;}
.bn-num.called.col-B{background:rgba(59,130,246,.55);}
.bn-num.called.col-I{background:rgba(239,68,68,.55);}
.bn-num.called.col-N{background:rgba(34,197,94,.5);}
.bn-num.called.col-G{background:rgba(168,85,247,.55);}
.bn-num.called.col-O{background:rgba(249,115,22,.55);}
@keyframes pop-in{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.bn-num.latest{box-shadow:0 0 0 2px var(--gold);animation:pop-in .3s ease both;}

/* Docked action bar (thumb zone) */
.bn-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;justify-content:center;
  padding:12px max(16px,var(--safe-r)) calc(12px + var(--safe-b)) max(16px,var(--safe-l));
  background:rgba(11,13,18,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);}
.bn-bar-in{display:flex;gap:10px;width:100%;max-width:688px;}
.bn-bar .btn-gold{flex:1;min-height:54px;font-size:1.05rem;}
.bn-bar .btn-outline{width:54px;min-height:54px;padding:0;}
#bn-result-area .winner-banner{padding:14px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a>
  <span class="nav-title">Bingo Hopper</span>
</nav>
<div class="page">

<p class="bn-intro">Use your own Bingo cards. Draw a ball, call it out, and everyone marks their cards.</p>

<div id="bn-result-area"></div>

<div class="bn-hero">
  <div class="bn-ball-big bn-ball-empty" id="bn-ball" role="button" aria-label="Draw a ball">
    <span class="big">🎱</span><span>Tap to draw</span>
  </div>
  <div class="bn-called-count" id="bn-count">0 of 75 called</div>
  <div class="bn-progress"><i id="bn-prog"></i></div>
</div>

<div class="sec-lbl">Last called</div>
<div class="bn-history" id="bn-history"><span class="bn-hist-empty">No balls drawn yet</span></div>

<div class="sec-lbl">Caller board</div>
<div class="bn-board-wrap">
  <div class="bn-board" id="bn-headers"></div>
  <div class="bn-board" id="bn-board"></div>
</div>

</div>

<div class="bn-bar"><div class="bn-bar-in">
  <button class="btn btn-outline" id="bn-reset" aria-label="Reset"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg></button>
  <button class="btn btn-gold" id="bn-draw">Draw ball</button>
</div></div>

<script>
'use strict';
const COLS=['B','I','N','G','O'];
const COL_RANGE=[[1,15],[16,30],[31,45],[46,60],[61,75]];
const COL_COLOR={'B':'col-B','I':'col-I','N':'col-N','G':'col-G','O':'col-O'};
const CHIP_BG={'B':'#2563eb','I':'#dc2626','N':'#16a34a','G':'#9333ea','O':'#ea580c'};
const haptic=k=>{try{window.GN&&GN.haptic(k);}catch(e){}};

let pool=[], called=new Set(), latest=null;

function colFor(n){
  for(let i=0;i<5;i++) if(n>=COL_RANGE[i][0]&&n<=COL_RANGE[i][1]) return COLS[i];
}

function initPool(){
  pool=[];
  for(let n=1;n<=75;n++) pool.push(n);
  pool.sort(()=>Math.random()-.5);
  called=new Set(); latest=null;
}

function drawBall(){
  if(!pool.length){
    document.getElementById('bn-result-area').innerHTML=
      `<div class="winner-banner"><div class="winner-name" style="font-size:1.3rem">🎉 All 75 balls called!</div></div>`;
    return;
  }
  const n=pool.pop();
  called.add(n); latest=n;
  haptic('medium');
  renderBall(n);
  renderBoard();
  renderHistory();
}

function renderBall(n){
  const col=colFor(n);
  const el=document.getElementById('bn-ball');
  el.className=`bn-ball-big ${COL_COLOR[col]}`;
  el.innerHTML=`<div class="bn-face"><span class="letter">${col}</span><span class="number">${n}</span></div>`;
  // Re-trigger animation
  void el.offsetWidth;
  el.classList.add('just-drawn');
  updateCount();
}

function updateCount(){
  document.getElementById('bn-count').textContent=`${called.size} of 75 called`;
  document.getElementById('bn-prog').style.width=(called.size/75*100)+'%';
  const btn=document.getElementById('bn-draw');
  btn.textContent=called.size>=75?'All balls called':called.size?'Draw next ball':'Draw ball';
  btn.disabled=called.size>=75;
}

function buildBoard(){
  // Headers
  const hdr=document.getElementById('bn-headers');
  hdr.innerHTML=COLS.map(c=>`<div class="bn-col-header ${COL_COLOR[c]}">${c}</div>`).join('');

  // Numbers: render row by row (1 per column per row = 15 rows)
  const board=document.getElementById('bn-board');
  let html='';
  for(let row=0;row<15;row++){
    for(let col=0;col<5;col++){
      const n=COL_RANGE[col][0]+row;
      html+=`<div class="bn-num" id="bn-${n}">${n}</div>`;
    }
  }
  board.innerHTML=html;
}

function renderBoard(){
  for(let n=1;n<=75;n++){
    const el=document.getElementById(`bn-${n}`);
    if(!el) continue;
    const col=colFor(n);
    const isCalled=called.has(n);
    const isLatest=n===latest;
    el.className=`bn-num${isCalled?' '+COL_COLOR[col]+' called':''}${isLatest?' latest':''}`;
  }
}

function renderHistory(){
  const hist=document.getElementById('bn-history');
  const recent=[...called].slice(-15).reverse();
  if(!recent.length){hist.innerHTML='<span class="bn-hist-empty">No balls drawn yet</span>';return;}
  hist.scrollLeft=0;
  hist.innerHTML=recent.map(n=>{
    const c=colFor(n);
    return`<div class="bn-hist-chip" style="background:${CHIP_BG[c]}">${c}${n}</div>`;
  }).join('');
}

document.getElementById('bn-draw').addEventListener('click',drawBall);
document.getElementById('bn-reset').addEventListener('click',async()=>{
  if(called.size&&window.GN&&!(await GN.confirm('All called numbers will be cleared.',{title:'Start a new game?',ok:'Reset',danger:true})))return;
  initPool();
  document.getElementById('bn-result-area').innerHTML='';
  document.getElementById('bn-ball').className='bn-ball-big bn-ball-empty';
  document.getElementById('bn-ball').innerHTML='<span class="big">🎱</span><span>Tap to draw</span>';
  updateCount();
  buildBoard();
  renderHistory();
});

// Also draw on ball tap
document.getElementById('bn-ball').addEventListener('click', drawBall);

initPool();
buildBoard();
</script>
</body>
</html>

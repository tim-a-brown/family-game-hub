<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
<title>Bingo Hopper</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<style>
body{background:radial-gradient(ellipse at 50% 0%,#1a0a2e 0%,#0d0618 60%);min-height:100%;}
.bn-wrap{max-width:420px;margin:0 auto;padding:0 10px 60px;}

/* Ball animation */
@keyframes ball-drop{0%{transform:translateY(-40px) scale(.5);opacity:0}60%{transform:translateY(6px) scale(1.08)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes ball-pulse{0%,100%{box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.2)}50%{box-shadow:0 8px 40px rgba(255,255,255,.3),inset 0 2px 0 rgba(255,255,255,.2)}}

/* Current ball */
.bn-current{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;}
.bn-ball-big{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:'Playfair Display',serif;
  box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.2);
  user-select:none;}
.bn-ball-big.just-drawn{animation:ball-drop .45s cubic-bezier(.22,.68,0,1.2) both, ball-pulse 1.5s ease 0.5s 2;}
.bn-ball-big .letter{font-size:1.3rem;font-weight:900;opacity:.85;line-height:1;}
.bn-ball-big .number{font-size:2.4rem;font-weight:900;line-height:1;}
.bn-ball-empty{background:rgba(255,255,255,.08);border:3px dashed rgba(255,255,255,.2);
  color:rgba(255,255,255,.25);font-size:.85rem;font-weight:700;}
.bn-called-count{font-size:.75rem;color:rgba(255,255,255,.4);margin-top:8px;}

/* Column colors */
.col-B{background:linear-gradient(145deg,#1d4ed8,#1e40af);}
.col-I{background:linear-gradient(145deg,#dc2626,#b91c1c);}
.col-N{background:linear-gradient(145deg,#15803d,#166534);}
.col-O{background:linear-gradient(145deg,#ea580c,#c2410c);}
.col-G{background:linear-gradient(145deg,#7c3aed,#6d28d9);}

/* Board - proper column layout */
.bn-board-wrap{margin-bottom:14px;}
.bn-board{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;}
.bn-col-header{text-align:center;font-size:.9rem;font-weight:900;padding:6px 2px;border-radius:6px;color:#fff;margin-bottom:2px;}
.bn-col-nums{display:flex;flex-direction:column;gap:2px;}
.bn-num{width:100%;aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:700;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.4);transition:all .25s;}
.bn-num.called{color:#fff;font-size:.78rem;}
.bn-num.called.col-B{background:rgba(29,78,216,.6);border-color:rgba(96,165,250,.4);}
.bn-num.called.col-I{background:rgba(220,38,38,.6);border-color:rgba(252,165,165,.4);}
.bn-num.called.col-N{background:rgba(21,128,61,.6);border-color:rgba(134,239,172,.4);}
.bn-num.called.col-G{background:rgba(124,58,237,.6);border-color:rgba(196,181,253,.4);}
.bn-num.called.col-O{background:rgba(234,88,12,.6);border-color:rgba(253,186,116,.4);}
@keyframes pop-in{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.bn-num.latest{outline:3px solid #f5c842;outline-offset:1px;animation:pop-in .3s ease both;}

/* History */
.bn-history{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;min-height:28px;}
.bn-hist-chip{padding:2px 7px;border-radius:12px;font-size:.7rem;font-weight:700;color:#fff;}

/* Controls */
.bn-controls{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a>
  <span class="nav-title">Bingo Hopper</span>
</nav>
<div class="page" style="padding:10px 0 60px;">
<div class="bn-wrap">

<div style="font-size:.75rem;color:rgba(255,255,255,.4);text-align:center;margin-bottom:12px;">
  Use your own physical Bingo cards. Draw balls below and mark your cards!
</div>

<div id="bn-result-area"></div>

<div class="bn-current">
  <div class="bn-ball-big bn-ball-empty" id="bn-ball">
    <span>Tap Draw</span><span>to begin</span>
  </div>
  <div class="bn-called-count" id="bn-count">0 of 75 called</div>
</div>

<div class="bn-controls">
  <button class="btn btn-gold" id="bn-draw">🎱 Draw Ball</button>
  <button class="btn btn-outline btn-sm" id="bn-reset">↺ Reset</button>
</div>

<div style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3);margin-bottom:6px;text-align:center;">Last Called</div>
<div class="bn-history" id="bn-history"></div>

<div style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3);margin-bottom:6px;">All Numbers</div>
<div class="bn-board-wrap">
  <!-- Headers row -->
  <div class="bn-board" id="bn-headers"></div>
  <!-- Numbers: 5 columns side by side, each 15 numbers tall -->
  <div class="bn-board" id="bn-board"></div>
</div>

</div>
</div>

<script>
'use strict';
const COLS=['B','I','N','G','O'];
const COL_RANGE=[[1,15],[16,30],[31,45],[46,60],[61,75]];
const COL_COLOR={'B':'col-B','I':'col-I','N':'col-N','G':'col-G','O':'col-O'};
const CHIP_BG={'B':'#1d4ed8','I':'#dc2626','N':'#15803d','G':'#7c3aed','O':'#ea580c'};

let pool=[], called=new Set(), latest=null;

function colFor(n){
  for(let i=0;i<5;i++) if(n>=COL_RANGE[i][0]&&n<=COL_RANGE[i][1]) return COLS[i];
}

function initPool(){
  pool=[];
  for(let n=1;n<=75;n++) pool.push(n);
  pool.sort(()=>Math.random()-.5);
  called=new Set(); latest=null;
}

function drawBall(){
  if(!pool.length){
    document.getElementById('bn-result-area').innerHTML=
      `<div style="background:rgba(245,200,66,.1);border:1px solid rgba(245,200,66,.3);border-radius:10px;padding:10px;text-align:center;font-weight:700;color:#f5c842;margin-bottom:12px;">🎉 All 75 balls called!</div>`;
    return;
  }
  const n=pool.pop();
  called.add(n); latest=n;
  renderBall(n);
  renderBoard();
  renderHistory();
}

function renderBall(n){
  const col=colFor(n);
  const el=document.getElementById('bn-ball');
  el.className=`bn-ball-big ${COL_COLOR[col]} just-drawn`;
  el.innerHTML=`<span class="letter">${col}</span><span class="number">${n}</span>`;
  // Re-trigger animation
  void el.offsetWidth;
  document.getElementById('bn-count').textContent=`${called.size} of 75 called`;
}

function buildBoard(){
  // Headers
  const hdr=document.getElementById('bn-headers');
  hdr.innerHTML=COLS.map(c=>`<div class="bn-col-header ${COL_COLOR[c]}">${c}</div>`).join('');

  // Numbers: render row by row (1 per column per row = 15 rows)
  const board=document.getElementById('bn-board');
  let html='';
  for(let row=0;row<15;row++){
    for(let col=0;col<5;col++){
      const n=COL_RANGE[col][0]+row;
      html+=`<div class="bn-num" id="bn-${n}">${n}</div>`;
    }
  }
  board.innerHTML=html;
}

function renderBoard(){
  for(let n=1;n<=75;n++){
    const el=document.getElementById(`bn-${n}`);
    if(!el) continue;
    const col=colFor(n);
    const isCalled=called.has(n);
    const isLatest=n===latest;
    el.className=`bn-num${isCalled?' '+COL_COLOR[col]+' called':''}${isLatest?' latest':''}`;
  }
}

function renderHistory(){
  const hist=document.getElementById('bn-history');
  const recent=[...called].slice(-15).reverse();
  hist.innerHTML=recent.map(n=>{
    const c=colFor(n);
    return`<div class="bn-hist-chip" style="background:${CHIP_BG[c]}">${c}${n}</div>`;
  }).join('');
}

document.getElementById('bn-draw').addEventListener('click',drawBall);
document.getElementById('bn-reset').addEventListener('click',()=>{
  initPool();
  document.getElementById('bn-result-area').innerHTML='';
  document.getElementById('bn-ball').className='bn-ball-big bn-ball-empty';
  document.getElementById('bn-ball').innerHTML='<span>Tap Draw</span><span>to begin</span>';
  document.getElementById('bn-count').textContent='0 of 75 called';
  buildBoard();
  renderHistory();
});

// Also draw on ball tap
document.getElementById('bn-ball').addEventListener('click', drawBall);

initPool();
buildBoard();
</script>
</body>
</html>

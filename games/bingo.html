<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo Caller</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* Ball colours: the standard 75-ball set */
.cB{--c:#1f6fe5;--ci:#fff;}
.cI{--c:#e0263a;--ci:#fff;}
.cN{--c:#eef0f5;--ci:#1b1d2e;}
.cG{--c:#1fa64a;--ci:#fff;}
.cO{--c:#f28a10;--ci:#fff;}

/* ── The machine: cage + tray in a wooden box ─────────────────────────── */
.machine{border-radius:26px;padding:8px;margin-top:2px;}
.machine .felt-in{position:relative;border-radius:20px;padding:12px 10px 10px;display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center;min-height:200px;}
.cagewrap{position:relative;width:var(--cw2);}
.machine{--cw2:min(42vw,176px);}
#cage{display:block;width:var(--cw2);height:calc(var(--cw2) * 1.1);}
.cagecount{margin-top:4px;text-align:center;font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);}
.tray{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;}
.callline{font-family:var(--display);font-size:clamp(1.5rem,7vw,2.1rem);line-height:1;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:.02em;min-height:1em;}
.callline small{display:block;text-align:center;font-family:var(--font);font-size:.72rem;font-weight:900;letter-spacing:.1em;color:rgba(255,255,255,.55);text-transform:uppercase;margin-top:6px;text-shadow:none;}

/* Balls */
.ball{--s:64px;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.85) 0, rgba(255,255,255,.25) 14%, rgba(255,255,255,0) 30%),
    radial-gradient(circle at 50% 45%, var(--c) 52%, color-mix(in srgb,var(--c) 55%,#000) 100%);
  box-shadow:0 calc(var(--s) * .08) calc(var(--s) * .16) rgba(0,0,0,.5), inset 0 calc(var(--s) * -.05) calc(var(--s) * .1) rgba(0,0,0,.25);}
.ball .face{width:60%;height:60%;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fff 0,#f1f1f6 60%,#d9d9e4 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#16182a;box-shadow:inset 0 -2px 3px rgba(0,0,0,.12);line-height:.9;}
.cN.ball .face{box-shadow:inset 0 0 0 calc(var(--s) * .025) #8b90a8, inset 0 -2px 3px rgba(0,0,0,.12);}
.ball .l{font-family:var(--display);font-size:calc(var(--s) * .14);opacity:.7;}
.ball .n{font-family:var(--display);font-size:calc(var(--s) * .27);letter-spacing:-.02em;}
.ball.big{--s:min(30vw,128px);}
.ball.empty{background:rgba(0,0,0,.18);box-shadow:inset 0 3px 10px rgba(0,0,0,.4);border:2px dashed var(--w18);}
.ball.empty .face{display:none;}
.ball.empty::after{content:"Ready";font-family:var(--display);font-size:1.1rem;color:rgba(255,255,255,.4);}
.ball.tap{cursor:pointer;}

/* Previous calls */
.recent{grid-column:1/-1;display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 4px 0;border-top:1px dashed var(--w14);margin-top:4px;}
.recent .lbl{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-right:2px;white-space:nowrap;}
.recent .ball{--s:34px;}
.recent .ball .l{display:none;}
.recent .ball .n{font-size:13px;}
.recent .ball:nth-child(n+5){opacity:.8;}
.recent .ball:nth-child(n+6){opacity:.6;}
.recent .none{font-size:.85rem;color:rgba(255,255,255,.4);}

/* ── Controls ─────────────────────────────────────────────────────────── */
.ctl{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;margin:16px 0 10px;}
.ctl .btn{min-height:58px;padding:0;}
.ctl .drawbtn{font-size:1.25rem;}
.ctl .sq .ico{width:24px;height:24px;}
.autobtn{position:relative;}
.autobtn.on{--b:var(--green);--b-ink:#03290f;--b-lip:#1d8a4f;}
.autobar{height:4px;border-radius:2px;background:var(--w08);overflow:hidden;margin:-4px 0 10px;opacity:0;transition:opacity .2s;}
.autobar.on{opacity:1;}
.autobar i{display:block;height:100%;width:calc(var(--p,0) * 100%);background:var(--green);border-radius:inherit;}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.opts .chip{flex:1;justify-content:center;min-height:44px;padding:0 10px;}
.opts .chip .ico{width:18px;height:18px;flex:none;}
.opts .chip{gap:6px;}
.patbtn .ico{flex:none;}
.opts .chip.checkbtn{background:var(--accent);color:var(--accent-ink);}

/* ── Called board (flashboard) ───────────────────────────────────────── */
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px;}
.bhead .label{margin:0;}
.patbtn{border:0;background:var(--w07);color:var(--text-2);font-weight:800;font-size:.85rem;min-height:40px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;}
.patbtn .ico{width:16px;height:16px;}
.flash{border-radius:18px;padding:8px;background:linear-gradient(180deg,#17132e,#0e0b1f);box-shadow:inset 0 2px 12px rgba(0,0,0,.6), 0 0 0 1px var(--w06), 0 10px 24px rgba(0,0,0,.35);}
.frow{display:grid;grid-template-columns:26px repeat(15,1fr);gap:2px;}
.frow + .frow{margin-top:3px;}
.fl{display:grid;place-items:center;border-radius:6px;background:var(--c);color:var(--ci);font-family:var(--display);font-size:1rem;height:26px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);}
.fc{display:grid;place-items:center;height:26px;border-radius:5px;background:rgba(255,255,255,.045);color:rgba(255,255,255,.26);
  font-size:clamp(9.5px,2.8vw,14px);font-weight:900;font-variant-numeric:tabular-nums;transition:background .3s, color .3s, box-shadow .3s;}
.fc.on{background:var(--c);color:var(--ci);box-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent), inset 0 -2px 0 rgba(0,0,0,.18);}
.fc.last{animation:lastp 1.2s ease-in-out infinite;position:relative;z-index:1;}
/* The two shadow lists can't blend (one is inset), so the browser flips between
   them a quarter of the way in and out. Same flip, as two layers switched by opacity. */
.fc.on.last:not(.hit){box-shadow:none;transition:background .3s, color .3s;animation:none;}
.fc.on.last:not(.hit)::before,.fc.on.last:not(.hit)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;}
.fc.on.last:not(.hit)::before{box-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent), inset 0 -2px 0 rgba(0,0,0,.18);animation:lastp 1.2s infinite;}
.fc.on.last:not(.hit)::after{box-shadow:0 0 0 2px #fff, 0 0 16px var(--c);opacity:0;animation:lastp-on 1.2s infinite;}
@keyframes lastp{0%{animation-timing-function:step-end;}25%{opacity:0;animation-timing-function:step-end;}75%{opacity:1;}}
@keyframes lastp-on{0%{animation-timing-function:step-end;}25%{opacity:1;animation-timing-function:step-end;}75%{opacity:0;}}
@media (prefers-reduced-motion:reduce){.fc.on.last:not(.hit)::before,.fc.on.last:not(.hit)::after{animation-duration:.01ms!important;}}
.fc.hit{animation:pop .45s var(--spring);}
.bfoot{display:flex;justify-content:space-between;margin:8px 4px 0;font-size:.8rem;font-weight:800;color:var(--text-3);}
@media (min-width:640px){ .fc,.fl{height:34px;} .machine{--cw2:190px;} }

/* ── Check-a-card sheet ───────────────────────────────────────────────── */
.ck-pat{font-size:.92rem;color:var(--text-2);margin-bottom:10px;}
.ck-nums{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;align-items:center;padding:8px;border-radius:16px;background:rgba(0,0,0,.25);}
.ck-nums .ph{color:var(--text-3);font-size:.9rem;padding:0 6px;}
.ck-n{position:relative;border:0;padding:0;background:none;}
.ck-n .ball{--s:44px;}
.ck-n .ball .n{font-size:15px;}
.ck-n .ball .l{font-size:9px;}
.ck-n .mk{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 2px var(--bg-2);}
.ck-n .mk .ico{width:12px;height:12px;stroke-width:3.4;}
.ck-n.ok .mk{background:var(--green);color:#03290f;}
.ck-n.no .mk{background:var(--red);}
.ck-n.no .ball{filter:saturate(.5) brightness(.8);}
.ck-free{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:#eef0f5;color:#1b1d2e;font-family:var(--display);font-size:.8rem;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);}
.ck-typed{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 8px;}
.ck-typed .v{font-family:var(--display);font-size:1.8rem;min-width:90px;}
.ck-typed .v.dim{color:var(--text-3);font-family:var(--font);font-size:.95rem;font-weight:700;}
.ck-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ck-pad .btn{min-height:52px;padding:0;font-size:1.3rem;}
.ck-pad .btn.sm{font-size:.9rem;}
.ck-verdict{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--w05);font-weight:700;line-height:1.35;}
.ck-verdict.good{background:color-mix(in srgb,var(--green) 18%,transparent);color:#b6f5cf;}
.ck-verdict.bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:#ffc2c8;}
.ck-verdict b{font-family:var(--display);font-weight:400;font-size:1.3rem;display:block;margin-bottom:2px;color:#fff;}
.ck-acts{display:flex;flex-direction:column;gap:10px;margin-top:14px;}

.bcol{display:contents;}
/* ── iPad portrait: bigger cage, ball and called board ── */
@media (min-width:700px) and (orientation:portrait){
  .stage{max-width:680px;}
  .machine{--cw2:220px;}
  .ball.big{--s:150px;}
  .fl,.fc{height:40px;font-size:1.05rem;}
  .frow{grid-template-columns:34px repeat(15,1fr);gap:3px;}
  .frow + .frow{margin-top:4px;}
}
/* ── Wide landscape (iPad, laptop): machine and buttons on the left, called board on the right ── */
@media (orientation:landscape) and (min-width:900px) and (min-height:560px){
  .stage:has(> .bcol){max-width:1120px;display:flex;align-items:flex-start;gap:26px;}
  .bcol{display:block;}
  .bcol.a{flex:0 1 460px;min-width:380px;}
  .bcol.b{flex:1 1 0;min-width:0;padding-top:4px;}
  .machine{--cw2:min(190px,calc(100dvh - 520px));}
  .fl,.fc{height:clamp(30px,calc((100dvh - 230px) / 5 - 6px),64px);font-size:1.1rem;}
  .frow{grid-template-columns:32px repeat(15,1fr);gap:3px;}
  .frow + .frow{margin-top:5px;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el, icon = Kit.icon;
  var app = document.getElementById('app');
  var SAVE = 'bingo_state', PREFS = 'bingo_prefs', KEY = 'bingo';
  var L = ['B', 'I', 'N', 'G', 'O'];
  var PAT = {
    line: { name: 'Line', long: 'Line: any row, column or diagonal' },
    corners: { name: '4 corners', long: 'Four corners: the four corner squares' },
    x: { name: 'X', long: 'X: both diagonals (8 numbers plus the free space)' },
    blackout: { name: 'Blackout', long: 'Blackout: cover the whole card' }
  };
  var PAUSE = '<svg class="ico" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1.3"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.3"/></svg>';
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function letter(n) { return L[Math.floor((n - 1) / 15)]; }
  function call(n) { return letter(n) + '-' + n; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  Kit.init({
    id: 'bingo',
    theme: { felt: ['#25508f', '#173766', '#0f2649'] },
    onNew: function () { stopAuto(); clearSave(); S = null; showSetup(); },
    undo: function () { undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Bingo: past games' }); } }],
    rules:
      '<p class="goal">Everyone plays their own Bingo card. The caller draws balls one at a time. First to cover the pattern shouts <b>BINGO!</b></p>' +
      '<h3>The card</h3><ul><li>A card has 5 columns: <b>B I N G O</b>.</li><li>B has numbers 1 to 15, I has 16 to 30, N has 31 to 45, G has 46 to 60, O has 61 to 75.</li><li>The middle square is a <b>free space</b>. It counts as covered from the start.</li></ul>' +
      '<h3>Calling</h3><ul><li>Tap <b>Draw ball</b>. The ball rolls out of the cage and is read out, like "B 12".</li><li>If that number is on your card, cover it with a marker.</li><li>Turn on <b>Auto</b> to draw a ball every few seconds, and <b>Voice</b> to have the phone read the calls.</li></ul>' +
      '<h3>Winning</h3><ul><li><b>Line</b> (standard): 5 in a row across, down, or corner to corner. The free space can be one of them.</li><li><b>4 corners</b>, <b>X</b> (both diagonals) and <b>Blackout</b> (the whole card) are fun variations. Pick one when you start.</li></ul>' +
      '<h3>Shout Bingo!</h3><p>The player reads out their numbers. Tap <b>Check a card</b> and type them in. The caller checks every one was really called. If it is good, pick the winner and celebrate. You can keep calling for second place.</p>'
  });

  // ── Saved state & prefs ────────────────────────────────────────────────
  var S = null;      // {pool:[remaining, shuffled], called:[...], pattern, started, wins:[{name,ball}]}
  var P = loadPrefs();
  function loadPrefs() { try { var p = JSON.parse(localStorage.getItem(PREFS)); if (p) return { voice: p.voice !== false, every: p.every || 8 }; } catch (e) {} return { voice: true, every: 8 }; }
  function savePrefs() { try { localStorage.setItem(PREFS, JSON.stringify(P)); } catch (e) {} }
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} if (S.called.length) Kit.resume.set(S.called.length + ' balls called'); }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function load() { try { var s = JSON.parse(localStorage.getItem(SAVE)); if (s && Array.isArray(s.pool) && Array.isArray(s.called)) return s; } catch (e) {} return null; }

  function freshGame(pattern) {
    var pool = []; for (var n = 1; n <= 75; n++) pool.push(n);
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    S = { pool: pool, called: [], pattern: pattern || 'line', started: Date.now(), wins: [] };
    Kit.gameStart();
    save();
  }

  // ── Voice ──────────────────────────────────────────────────────────────
  var voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    var vs = speechSynthesis.getVoices() || [];
    voice = vs.filter(function (v) { return /^en[-_]US/i.test(v.lang) && /samantha|google|natural|aria|jenny/i.test(v.name); })[0] ||
      vs.filter(function (v) { return /^en[-_]US/i.test(v.lang); })[0] || vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
  function say(n) {
    if (!P.voice || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(letter(n) + '.  ' + n + (n > 9 ? '.  ' + String(n).split('').join(' ') : ''));
      if (voice) u.voice = voice;
      u.lang = 'en-US'; u.rate = 0.88; u.pitch = 1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ── Setup ──────────────────────────────────────────────────────────────
  function showSetup() {
    app.innerHTML = '';
    if (cage) cage.off();
    cage = null;
    Kit.setup(app, {
      intro: 'You call the balls. Everyone marks their own cards.',
      options: [{ id: 'pattern', label: 'Winning pattern', help: 'What you need to cover on your card to shout Bingo.', value: 'line',
        choices: [['line', 'Line', 'Five in a row across, down or corner to corner. This is the standard way.'], ['corners', '4 corners', 'Just the four corner squares.'], ['x', 'X', 'Both diagonals, making a big X.'], ['blackout', 'Blackout', 'Every square on the card. This takes the longest!']] }],
      start: 'Start calling',
      onStart: function (cfg) { freshGame(cfg.options.pattern); build(); }
    });
  }

  // ── Play screen ────────────────────────────────────────────────────────
  var R = {}, busy = false;
  function build() {
    app.innerHTML = '';
    var canvas = el('canvas', { id: 'cage', 'aria-hidden': 'true' });
    R.count = el('div', { class: 'cagecount' });
    R.big = el('div', { class: 'ball big empty tap', role: 'button', 'aria-label': 'Draw a ball', onclick: function () { if (S.called.length && !busy) { say(last()); Kit.sfx('tap'); } else draw(); } });
    R.line = el('div', { class: 'callline' });
    R.recent = el('div', { class: 'recent' });
    var felt = el('div', { class: 'felt-in' }, [
      el('div', { class: 'cagewrap' }, [canvas, R.count]),
      el('div', { class: 'tray' }, [R.big, R.line]),
      R.recent
    ]);
    R.machine = el('section', { class: 'machine wood' }, [felt]);
    // Two columns on wide landscape screens (display:contents everywhere else)
    var app0 = app, colA = el('div', { class: 'bcol a' }), colB = el('div', { class: 'bcol b' });
    app0.appendChild(colA); app0.appendChild(colB);
    app = colA;
    app.appendChild(R.machine);

    R.undo = el('button', { type: 'button', class: 'btn btn-soft sq', 'aria-label': 'Undo last call', html: icon('undo'), onclick: function () { undo(); } });
    R.draw = el('button', { type: 'button', class: 'btn btn-primary drawbtn', onclick: function () { draw(); } });
    R.auto = el('button', { type: 'button', class: 'btn btn-soft sq autobtn', 'aria-label': 'Auto draw', onclick: function () { toggleAuto(); } });
    app.appendChild(el('div', { class: 'ctl' }, [R.undo, R.draw, R.auto]));
    R.bar = el('div', { class: 'autobar' }, [el('i')]);
    app.appendChild(R.bar);

    R.voice = el('button', { type: 'button', class: 'chip', onclick: function () {
      P.voice = !P.voice; savePrefs(); paintOpts(); Kit.sfx('tap'); Kit.haptic('light');
      if (P.voice && S.called.length) say(last());
      if (P.voice && !('speechSynthesis' in window)) Kit.toast('This browser cannot speak');
    } });
    R.every = el('button', { type: 'button', class: 'chip', onclick: function () {
      var opts = [5, 8, 12, 20], i = opts.indexOf(P.every); P.every = opts[(i + 1) % opts.length]; savePrefs(); paintOpts(); Kit.sfx('tap');
      if (autoOn) restartTimer();
    } });
    var check = el('button', { type: 'button', class: 'chip checkbtn', html: icon('check') + '<span>Check a card</span>', onclick: function () { openCheck(); } });
    app.appendChild(el('div', { class: 'opts' }, [R.voice, R.every, check]));
    app = colB;

    R.pat = el('button', { type: 'button', class: 'patbtn', onclick: function () { choosePattern(); } });
    app.appendChild(el('div', { class: 'bhead' }, [el('div', { class: 'label', text: 'Called numbers' }), R.pat]));
    var board = el('div', { class: 'flash' });
    R.cells = {};
    for (var c = 0; c < 5; c++) {
      var row = el('div', { class: 'frow c' + L[c] }, [el('div', { class: 'fl', text: L[c] })]);
      for (var k = 1; k <= 15; k++) {
        var n = c * 15 + k;
        R.cells[n] = el('div', { class: 'fc', text: String(n) });
        row.appendChild(R.cells[n]);
      }
      board.appendChild(row);
    }
    app.appendChild(board);
    R.foot = el('div', { class: 'bfoot' });
    app.appendChild(R.foot);
    app = app0;

    if (cage) cage.off();   // a new game builds a new cage: drop the old one's resize listener (and its balls)
    cage = makeCage(canvas);
    cage.fill(S.pool);
    paint();
  }
  function last() { return S.called[S.called.length - 1]; }

  function ballEl(n, cls) {
    return el('div', { class: 'ball c' + letter(n) + (cls ? ' ' + cls : '') }, [
      el('div', { class: 'face' }, [el('span', { class: 'l', text: letter(n) }), el('span', { class: 'n', text: String(n) })])
    ]);
  }
  function setBig(n) {
    R.big.className = 'ball big tap' + (n ? ' c' + letter(n) : ' empty');
    R.big.innerHTML = n ? '<div class="face"><span class="l">' + letter(n) + '</span><span class="n">' + n + '</span></div>' : '<div class="face"></div>';
    R.big.setAttribute('aria-label', n ? 'Last call ' + call(n) + '. Tap to hear it again.' : 'Draw a ball');
    R.line.innerHTML = n ? Kit.esc(letter(n) + ' ' + n) + '<small>Ball ' + S.called.length + ' of 75</small>' : '<small>Tap Draw ball</small>';
  }
  function paintRecent() {
    R.recent.innerHTML = '';
    var prev = S.called.slice(0, -1).slice(-6).reverse();
    R.recent.appendChild(el('span', { class: 'lbl', text: 'Before' }));
    if (!prev.length) R.recent.appendChild(el('span', { class: 'none', text: 'Earlier calls show here' }));
    prev.forEach(function (n) { R.recent.appendChild(ballEl(n)); });
  }
  function paintOpts() {
    R.voice.innerHTML = icon(P.voice ? 'sound' : 'mute') + '<span>Voice ' + (P.voice ? 'on' : 'off') + '</span>';
    R.voice.setAttribute('aria-pressed', 'false');
    R.every.innerHTML = icon('history') + '<span>Every ' + P.every + 's</span>';
  }
  function paintBoard(fresh) {
    var lastN = last();
    for (var n = 1; n <= 75; n++) {
      var c = R.cells[n], on = S.called.indexOf(n) >= 0;
      c.classList.toggle('on', on);
      c.classList.toggle('last', n === lastN);
      if (fresh === n) { c.classList.remove('hit'); void c.offsetWidth; c.classList.add('hit'); }
    }
    R.foot.innerHTML = '';
    R.foot.appendChild(el('span', { text: S.called.length + ' called · ' + S.pool.length + ' left' }));
    if (lastN) R.foot.appendChild(el('span', { text: 'Last call ' + call(lastN) }));
  }
  function paintButtons() {
    var done = !S.pool.length;
    R.draw.disabled = busy || done;
    R.draw.innerHTML = done ? '<span>All 75 called</span>' : '<span>' + (S.called.length ? 'Draw next ball' : 'Draw ball') + '</span>';
    R.undo.disabled = !S.called.length || busy;
    R.auto.classList.toggle('on', autoOn);
    R.auto.innerHTML = autoOn ? PAUSE : icon('play');
    R.auto.setAttribute('aria-label', autoOn ? 'Pause auto draw' : 'Start auto draw');
    R.auto.disabled = done;
    R.bar.classList.toggle('on', autoOn);
    R.pat.innerHTML = '<span>Pattern: ' + PAT[S.pattern].name + '</span>' + icon('down');
    R.count.textContent = S.pool.length + ' in cage';
  }
  function paint() { setBig(last()); paintRecent(); paintOpts(); paintBoard(); paintButtons(); }

  // ── Drawing a ball ─────────────────────────────────────────────────────
  function draw() {
    if (busy || !S || !S.pool.length) return;
    busy = true; paintButtons();
    var n = S.pool.pop();
    Kit.sfx('roll'); Kit.haptic('light');
    var spin = reduce ? 0 : (autoOn && P.every <= 5 ? 650 : 900);
    if (cage) cage.spin(spin);
    wait(spin).then(function () {
      if (cage) cage.remove(n);
      S.called.push(n);
      save();
      setBig(n);
      flyIn();
      paintRecent(); paintBoard(n); paintButtons();
      Kit.sfx('pop'); Kit.haptic('medium');
      say(n);
      return wait(reduce ? 50 : 650);
    }).then(function () {
      busy = false; paintButtons();
      if (!S.pool.length) { stopAuto(); Kit.callout('All 75 called'); Kit.sfx('good'); }
      else if (autoOn) restartTimer();
    });
  }
  function flyIn() {
    if (reduce || !R.big.animate || !cage) return;
    var b = R.big.getBoundingClientRect(), ex = cage.exit();
    var dx = ex.x - (b.left + b.width / 2), dy = ex.y - (b.top + b.height / 2);
    var s0 = (cage.r * 2) / b.width;
    R.big.animate([
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s0 + ') rotate(-260deg)', offset: 0 },
      { transform: 'translate(' + (dx * 0.45) + 'px,' + (dy * 0.2 + 18) + 'px) scale(.55) rotate(-120deg)', offset: 0.45 },
      { transform: 'translate(0,-10px) scale(1.08) rotate(10deg)', offset: 0.78 },
      { transform: 'none', offset: 1 }
    ], { duration: 650, easing: 'cubic-bezier(.3,.7,.3,1)' });
  }

  function undo() {
    if (!S || !S.called.length) { Kit.toast('Nothing to undo'); return; }
    if (busy) return;
    stopAuto();
    var n = S.called.pop();
    S.pool.splice(Math.floor(Math.random() * (S.pool.length + 1)), 0, n);
    save();
    if (cage) cage.add(n);
    paint();
    Kit.toast(call(n) + ' put back in the cage');
    Kit.sfx('tap'); Kit.haptic('light');
  }

  // ── Auto draw ──────────────────────────────────────────────────────────
  var autoOn = false, timer = null, tStart = 0, raf = 0;
  function toggleAuto() {
    if (autoOn) { stopAuto(); Kit.sfx('tap'); return; }
    if (!S.pool.length) return;
    autoOn = true; Kit.sfx('good'); Kit.haptic('light');
    paintButtons();
    if (!busy) draw();
  }
  function restartTimer() {
    clearTimeout(timer); cancelAnimationFrame(raf);
    if (!autoOn) return;
    tStart = performance.now();
    var ms = P.every * 1000;
    timer = setTimeout(function () { if (autoOn) draw(); }, ms);
    (function tick() {
      var p = Math.min(1, (performance.now() - tStart) / ms);
      R.bar.style.setProperty('--p', p.toFixed(3));
      if (autoOn && p < 1) raf = requestAnimationFrame(tick);
    })();
  }
  function stopAuto() {
    autoOn = false; clearTimeout(timer); cancelAnimationFrame(raf);
    if (R.bar) R.bar.style.setProperty('--p', 0);
    if (R.auto && S) paintButtons();
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden && autoOn) stopAuto(); else if (!document.hidden && cage) cage.wake(); });
  document.addEventListener('keydown', function (e) {
    if (!R.draw || !document.body.contains(R.draw) || document.querySelector('.k-scrim')) return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); draw(); }
  });

  // ── Pattern picker ─────────────────────────────────────────────────────
  function choosePattern() {
    var seg = el('div', { class: 'stack' }), s;
    Object.keys(PAT).forEach(function (k) {
      seg.appendChild(el('button', { type: 'button', class: 'btn btn-block ' + (S.pattern === k ? 'btn-primary' : 'btn-soft'), text: PAT[k].long,
        style: { 'justify-content': 'flex-start', 'text-align': 'left', 'font-size': '.98rem' },
        onclick: function () { S.pattern = k; save(); paintButtons(); s.close(); Kit.sfx('tap'); Kit.toast('Pattern: ' + PAT[k].name); } }));
    });
    s = Kit.sheet({ title: 'Winning pattern', node: seg });
  }

  // ── Check a card ───────────────────────────────────────────────────────
  // The player reads out the numbers in their winning pattern; we check each
  // was called, and that the columns add up to that pattern.
  function verdict(nums, free) {
    var cnt = { B: 0, I: 0, N: 0, G: 0, O: 0 };
    nums.forEach(function (n) { cnt[letter(n)]++; });
    var missing = nums.filter(function (n) { return S.called.indexOf(n) < 0; });
    var pat = S.pattern, ok = false, need = '';
    function eq(o) { return L.every(function (x) { return cnt[x] === (o[x] || 0); }); }
    if (pat === 'line') {
      var across = free ? eq({ B: 1, I: 1, G: 1, O: 1 }) : eq({ B: 1, I: 1, N: 1, G: 1, O: 1 });
      var down = L.some(function (x) { var o = {}; o[x] = 5; return !free && eq(o); }) || (free && eq({ N: 4 }));
      ok = across || down;
      need = 'A line is 5 numbers: one from each letter (across or corner to corner), or 5 from one letter (down). The free space can stand in for an N.';
    } else if (pat === 'corners') {
      ok = !free && eq({ B: 2, O: 2 });
      need = 'Four corners is 2 numbers from B and 2 from O.';
    } else if (pat === 'x') {
      ok = free && eq({ B: 2, I: 2, G: 2, O: 2 });
      need = 'An X is 2 numbers each from B, I, G and O, plus the free space.';
    } else {
      ok = eq({ B: 5, I: 5, N: 4, G: 5, O: 5 });
      need = 'Blackout is all 24 numbers on the card: 5 each from B, I, G, O and 4 from N.';
    }
    return { missing: missing, shape: ok, need: need, win: ok && !missing.length && nums.length > 0 };
  }

  function openCheck() {
    if (!S) return;
    var wasAuto = autoOn; stopAuto();
    if (wasAuto) Kit.toast('Auto draw paused');
    var nums = [], free = S.pattern === 'x' || S.pattern === 'blackout', typed = '';
    var box = el('div');
    box.appendChild(el('p', { class: 'ck-pat', text: PAT[S.pattern].long + '. Type in each number the player reads out.' }));
    var list = el('div', { class: 'ck-nums' });
    box.appendChild(list);
    var tv = el('div', { class: 'v' });
    var addBtn = el('button', { type: 'button', class: 'btn btn-primary btn-sm', html: icon('plus') + '<span>Add</span>', onclick: function () { commit(); } });
    box.appendChild(el('div', { class: 'ck-typed' }, [tv, addBtn]));
    var pad = el('div', { class: 'ck-pad' });
    ['1', '2', '3', 'back', '4', '5', '6', 'free', '7', '8', '9', '0'].forEach(function (k) {
      var b;
      if (k === 'back') b = el('button', { type: 'button', class: 'btn btn-soft', 'aria-label': 'Delete', html: icon('back'), onclick: function () { if (typed) typed = typed.slice(0, -1); else nums.pop(); Kit.sfx('tap'); paint2(); } });
      else if (k === 'free') b = el('button', { type: 'button', class: 'btn btn-soft sm', text: 'Free', onclick: function () { free = !free; Kit.sfx('tap'); paint2(); } });
      else b = el('button', { type: 'button', class: 'btn btn-soft', text: k, onclick: function () { key(k); } });
      pad.appendChild(b);
    });
    box.appendChild(pad);
    var ver = el('div', { class: 'ck-verdict' });
    box.appendChild(ver);
    var winBtn = el('button', { type: 'button', class: 'btn btn-green btn-lg btn-block', html: icon('trophy') + '<span>It\'s a Bingo! Who won?</span>', onclick: function () {
      sh.close();
      Kit.pickName(function (name) { celebrate(name, nums.slice(), free); }, { title: 'Who got Bingo?' });
    } });
    var clrBtn = el('button', { type: 'button', class: 'btn btn-soft btn-block', text: 'Clear and check another card', onclick: function () { nums = []; typed = ''; free = S.pattern === 'x' || S.pattern === 'blackout'; paint2(); Kit.sfx('tap'); } });
    box.appendChild(el('div', { class: 'ck-acts' }, [winBtn, clrBtn, el('button', { type: 'button', class: 'btn btn-ghost btn-block', text: 'Close', onclick: function () { sh.close(); } })]));

    function key(k) {
      Kit.sfx('tap'); Kit.haptic('tick');
      var t = (typed + k).replace(/^0+/, '');
      if (!t) return;
      if (+t > 75) { tv.classList.add('shake'); setTimeout(function () { tv.classList.remove('shake'); }, 400); Kit.sfx('bad'); return; }
      typed = t;
      if (+typed * 10 > 75 || typed.length === 2) commit(); else paint2();
    }
    function commit() {
      if (!typed) return;
      var n = +typed; typed = '';
      if (n >= 1 && n <= 75 && nums.indexOf(n) < 0) nums.push(n);
      else if (nums.indexOf(n) >= 0) Kit.toast(call(n) + ' is already in');
      paint2(true);
    }
    var lastWin = false;
    function paint2(added) {
      list.innerHTML = '';
      if (!nums.length && !free) list.appendChild(el('span', { class: 'ph', text: 'No numbers yet' }));
      if (free) list.appendChild(el('button', { type: 'button', class: 'ck-n', 'aria-label': 'Free space', onclick: function () { free = false; paint2(); } }, [el('div', { class: 'ck-free', text: 'FREE' })]));
      nums.forEach(function (n, i) {
        var okn = S.called.indexOf(n) >= 0;
        var b = el('button', { type: 'button', class: 'ck-n ' + (okn ? 'ok' : 'no'), 'aria-label': call(n) + (okn ? ' called' : ' not called') + '. Tap to remove.', onclick: function () { nums.splice(i, 1); Kit.sfx('tap'); paint2(); } }, [
          ballEl(n), el('span', { class: 'mk', html: icon(okn ? 'check' : 'close') })]);
        if (added && i === nums.length - 1) b.classList.add('pop');
        list.appendChild(b);
      });
      tv.className = 'v' + (typed ? '' : ' dim');
      tv.textContent = typed ? letter(+typed || 1) + '-' + typed : 'Type a number';
      if (typed && +typed < 1) tv.textContent = typed;
      addBtn.disabled = !typed;
      var v = verdict(nums, free);
      ver.className = 'ck-verdict';
      if (!nums.length) ver.innerHTML = 'Tap the numbers on the keypad. Numbers that were called get a green tick.';
      else if (v.missing.length) { ver.className += ' bad'; ver.innerHTML = '<b>Not yet</b>' + Kit.esc(v.missing.map(call).join(', ')) + (v.missing.length > 1 ? ' have' : ' has') + ' not been called.'; }
      else if (!v.shape) ver.innerHTML = '<b>All called so far</b>' + Kit.esc(v.need);
      else { ver.className += ' good'; ver.innerHTML = '<b>Bingo!</b>Every number has been called. ' + (nums.indexOf(last()) >= 0 ? 'It includes the last ball, ' + call(last()) + '.' : ''); }
      winBtn.hidden = !v.win;
      if (v.win && !lastWin) { Kit.sfx('good'); Kit.haptic('success'); }
      if (added && !v.win && v.missing.indexOf(nums[nums.length - 1]) >= 0) { Kit.sfx('bad'); Kit.haptic('error'); }
      lastWin = v.win;
    }
    var sh = Kit.sheet({ title: 'Check a card', node: box });
    paint2();
  }

  // ── Winner ─────────────────────────────────────────────────────────────
  function celebrate(name, nums, free) {
    var k = S.called.length, lastN = last();
    S.wins = S.wins || [];
    S.wins.push({ name: name, ball: k });
    save();
    var prev = []; try { prev = GameHistory.load(KEY) || []; } catch (e) {}
    var best = prev.filter(function (e) { return e && e.balls && e.pattern === S.pattern; }).map(function (e) { return e.balls; });
    var hl = [];
    hl.push(name + ' got Bingo on ball ' + k + (lastN ? ', and ' + call(lastN) + ' sealed it' : ''));
    if (nums.length && nums.length <= 8) hl.push('Winning numbers: ' + (free ? ['free space'] : []).concat(nums.map(call)).join(', '));
    if (best.length && k < Math.min.apply(null, best)) hl.push('Quickest ' + PAT[S.pattern].name + ' Bingo yet (the old record was ' + Math.min.apply(null, best) + ' balls)');
    if (S.wins.length > 1) hl.push(['', 'First', 'Second', 'Third', 'Fourth', 'Fifth'][S.wins.length] ? (['', 'First', 'Second', 'Third', 'Fourth', 'Fifth'][S.wins.length] + ' Bingo of the game, after ' + S.wins.slice(0, -1).map(function (w) { return w.name; }).join(' and ')) : 'Another Bingo in the same game');
    if (k >= 55) hl.push('A long one: ' + k + ' of 75 balls called');
    var cols = L.map(function (x, i) { return { x: x, c: S.called.filter(function (n) { return Math.floor((n - 1) / 15) === i; }).length }; }).sort(function (a, b) { return b.c - a.c; });
    if (k >= 10 && cols[0].c >= cols[1].c + 2) hl.push(cols[0].x + ' was the hot letter (' + cols[0].c + ' calls)');
    Kit.record(KEY, {
      started: S.started, mode: PAT[S.pattern].name,
      players: [{ name: name }], winner: name,
      summary: name + ' won · ball ' + k,
      highlights: hl, meta: { balls: k, pattern: S.pattern, last: lastN },
      // for game history: every ball in the order called, and the winning numbers as read out
      detail: { c: S.called.join(','), w: nums.join(','), f: free ? 1 : 0, n: S.wins.length }
    });
    Kit.win({
      title: name + ' wins!', sub: 'Bingo on ball ' + k + ' · ' + PAT[S.pattern].name,
      againLabel: 'New game', again: function () { var p = S.pattern; freshGame(p); build(); },
      closeLabel: 'Keep calling', onClose: function () { save(); }
    });
  }

  // ── The cage: a little physics sim on a canvas ─────────────────────────
  var cage = null;
  var BCOL = { B: '#1f6fe5', I: '#e0263a', N: '#eef0f5', G: '#1fa64a', O: '#f28a10' };
  function makeCage(cv) {
    var g = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 3);
    var W, H, cx, cy, Rr, r, balls = [], angle = 0, omega = 0, spinUntil = 0, running = false;
    function size() {
      var w = cv.clientWidth || 160, h = cv.clientHeight || 176;
      W = w; H = h; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = W / 2; cy = W * 0.47; Rr = W * 0.43; r = Math.max(4, Rr * 0.088);
    }
    size();
    function addBall(n, settled) {
      var a = Math.random() * Math.PI * 2, d = Math.random() * (Rr - r) * 0.8;
      var x = cx + Math.cos(a) * d, y = cy + Math.abs(Math.sin(a)) * d * (settled ? 1 : 0.3);
      balls.push({ n: n, x: x, y: y, px: x, py: y, vx: 0, vy: 0, c: BCOL[letter(n)] });
    }
    // Time scale: 1 while the drum turns; once it has stopped it winds down to 0 over a second, so the pile
    // settles like a real one (the position-correction pass below would otherwise keep it jittering for ever)
    var ts = 1;
    function step() {
      var gr = 0.32 * ts, e = 0.45, lim = Rr - r - 2, ws = omega * lim, i, j, b, dm = 0.995 - 0.25 * (1 - ts);
      for (i = 0; i < balls.length; i++) {
        b = balls[i];
        b.vy += gr; b.vx *= dm; b.vy *= dm; b.x += b.vx * ts; b.y += b.vy * ts;
        var dx = b.x - cx, dy = b.y - cy, d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d > lim) {
          var nx = dx / d, ny = dy / d;
          b.x = cx + nx * lim; b.y = cy + ny * lim;
          var vn = b.vx * nx + b.vy * ny;
          if (vn > 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; }
          var tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty, dv = (ws - vt) * 0.22;
          b.vx += dv * tx; b.vy += dv * ty;
        }
      }
      var d2min = 4 * r * r;
      for (i = 0; i < balls.length; i++) for (j = i + 1; j < balls.length; j++) {
        var a1 = balls[i], a2 = balls[j], ddx = a2.x - a1.x, ddy = a2.y - a1.y, dd = ddx * ddx + ddy * ddy;
        if (dd < d2min && dd > 0.0001) {
          var dist = Math.sqrt(dd), ux = ddx / dist, uy = ddy / dist, ov = (2 * r - dist) / 2 * ts;
          a1.x -= ux * ov; a1.y -= uy * ov; a2.x += ux * ov; a2.y += uy * ov;
          var rv = (a2.vx - a1.vx) * ux + (a2.vy - a1.vy) * uy;
          if (rv < 0) { var im = -(1 + e) * rv / 2; a1.vx -= im * ux; a1.vy -= im * uy; a2.vx += im * ux; a2.vy += im * uy; }
        }
      }
    }
    function drawFrame() {
      g.clearRect(0, 0, W, H);
      // stand
      g.lineCap = 'round';
      g.strokeStyle = '#5a3a1e'; g.lineWidth = 6;
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx - Rr * 0.85, H - 6); g.moveTo(cx, cy); g.lineTo(cx + Rr * 0.85, H - 6); g.stroke();
      g.strokeStyle = '#7a5130'; g.lineWidth = 7;
      g.beginPath(); g.moveTo(cx - Rr * 1.0, H - 5); g.lineTo(cx + Rr * 1.0, H - 5); g.stroke();
      // back of drum
      g.fillStyle = 'rgba(255,255,255,.05)';
      g.beginPath(); g.arc(cx, cy, Rr, 0, Math.PI * 2); g.fill();
      // exit cup
      g.fillStyle = '#c9ccd8';
      g.beginPath(); g.ellipse(cx, cy + Rr + 3, r * 1.7, r * 0.8, 0, 0, Math.PI * 2); g.fill();
      // balls
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        g.fillStyle = b.c; g.beginPath(); g.arc(b.x, b.y, r, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.arc(b.x + r * 0.25, b.y + r * 0.3, r * 0.82, 0, Math.PI * 2); g.fill();
        g.fillStyle = b.c; g.beginPath(); g.arc(b.x - r * 0.08, b.y - r * 0.08, r * 0.78, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#fff'; g.globalAlpha = .9; g.beginPath(); g.arc(b.x, b.y, r * 0.42, 0, Math.PI * 2); g.fill();
        g.globalAlpha = .75; g.beginPath(); g.arc(b.x - r * 0.42, b.y - r * 0.45, r * 0.2, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
      }
      // front wire drum
      g.save(); g.translate(cx, cy); g.rotate(angle);
      g.strokeStyle = 'rgba(225,230,245,.55)'; g.lineWidth = 1.4;
      for (var k = 0; k < 8; k++) {
        var a = k * Math.PI / 4; g.beginPath(); g.moveTo(Math.cos(a) * Rr * 0.12, Math.sin(a) * Rr * 0.12); g.lineTo(Math.cos(a) * Rr, Math.sin(a) * Rr); g.stroke();
      }
      g.beginPath(); g.arc(0, 0, Rr * 0.55, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = '#dfe3ee'; g.lineWidth = 3.2;
      g.beginPath(); g.arc(0, 0, Rr, 0, Math.PI * 2); g.stroke();
      // crank
      g.strokeStyle = '#b9bfcf'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(Rr * 0.42, 0); g.stroke();
      g.fillStyle = '#c8102e'; g.beginPath(); g.arc(Rr * 0.42, 0, 4.5, 0, Math.PI * 2); g.fill();
      g.restore();
      g.fillStyle = '#e8ebf3'; g.beginPath(); g.arc(cx, cy, 5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#8a90a6'; g.beginPath(); g.arc(cx, cy, 2.2, 0, Math.PI * 2); g.fill();
    }
    var quietFrames = 0, stoppedAt = 0;
    function loop(t) {
      var now = performance.now();
      if (now < spinUntil) omega = Math.min(0.2, omega + 0.02);
      else omega *= 0.9;
      if (Math.abs(omega) < 0.002) omega = 0;
      angle += omega;
      if (omega) { stoppedAt = 0; ts = 1; }
      else { if (!stoppedAt) stoppedAt = now; ts = Math.max(0, 1 - (now - stoppedAt) / 1000); }
      step(); step();
      if (omega > 0.05 && Math.random() < 0.3) { var b = balls[Math.floor(Math.random() * balls.length)]; if (b) { b.vx += (Math.random() - 0.5) * 6; b.vy -= Math.random() * 6; } }
      drawFrame();

      var mv = 0; for (var k = 0; k < balls.length; k++) { b = balls[k]; mv += Math.abs(b.x - b.px) + Math.abs(b.y - b.py); b.px = b.x; b.py = b.y; }

      if (quietFrames > 10) { running = false; return; }
      requestAnimationFrame(loop);
    }
    function wake() { if (!running) { running = true; quietFrames = 0; stoppedAt = 0; ts = 1; requestAnimationFrame(loop); } }
    var api = {
      r: r,
      wake: wake,
      fill: function (nums) {
        balls = []; nums.forEach(function (n) { addBall(n, true); });
        ts = 1; for (var i = 0; i < 160; i++) step();
        balls.forEach(function (b) { b.vx = 0; b.vy = 0; });

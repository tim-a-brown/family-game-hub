<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Continuo</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="continuo-core.js"></script>
<style>
.ct-credit{margin:-6px 0 2px;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-3);}
/* the four enamel colors, shared by the cards, the plates and the room */
:root{--c0:#d9363e;--c1:#f2c12e;--c2:#2e9a57;--c3:#2f62c8;}

/* ── The column: plates, the table, the dock ── */
#app.stage.ipl{max-width:none;padding:4px 10px calc(var(--safe-b) + 18px);height:calc(100dvh - var(--bar));min-height:0;display:flex;flex-direction:column;box-sizing:border-box;}
.ct-col{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:900px;margin:0 auto;}
.ct-plates{display:flex;flex-wrap:wrap;gap:6px;view-transition-name:ct-plates;}
.pl{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;min-height:48px;padding:5px 10px 5px 7px;border-radius:15px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s,background .2s;}
.pl.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 18%,transparent);}
.pl .av{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff;background:var(--pc);box-shadow:inset 0 -2px 3px rgba(0,0,0,.3),0 0 0 2px rgba(255,255,255,.14);}
.pl .av .ico{width:16px;height:16px;}
.pl .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;}
.pl .nm{font-weight:800;font-size:.9rem;white-space:nowrap;overflow:hidden;}
.pl .sub{font-size:.7rem;font-weight:700;color:var(--text-3);white-space:nowrap;overflow:hidden;}
.pl.on .sub{color:var(--lit-ink);}
.pl .pts{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums;flex:none;}
.pl.on .pts{color:var(--lit-ink);}
.pl .gain{position:absolute;pointer-events:none;}
.pl.bump .pts{animation:bump .5s var(--spring,cubic-bezier(.3,1.6,.5,1));}
@keyframes bump{40%{transform:scale(1.35);}}
.ct-plates.many .pl{flex:1 1 calc(33% - 6px);}
/* many players in a narrow row: the name across the top of the plate, the avatar and the points under it */
.ct-plates.tight .pl{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"who who" "av pts";gap:2px 6px;padding:5px 9px 5px 7px;align-items:center;}
.ct-plates.tight .pl .who{grid-area:who;}
.ct-plates.tight .pl .sub{display:none;}
.ct-plates.tight .pl .av{grid-area:av;width:22px;height:22px;font-size:.72rem;}
.ct-plates.tight .pl .av .ico{width:13px;height:13px;}
.ct-plates.tight .pl .pts{grid-area:pts;text-align:right;font-size:1.15rem;line-height:1;}
.ct-plates.tight .pl .nm{font-size:.8rem;}
.ct-plates.four .pl{flex:1 1 calc(50% - 6px);}
.think i{display:inline-block;width:4px;height:4px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* ── The table: a walnut tabletop, the cards lying on it ── */
.frame{position:relative;flex:1 1 auto;min-height:160px;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;view-transition-name:ct-board;
  background:
    radial-gradient(120% 90% at 50% 40%,rgba(255,214,160,.10),transparent 60%),
    repeating-linear-gradient(97deg,rgba(0,0,0,.0) 0 7px,rgba(0,0,0,.09) 7px 8px,rgba(255,220,170,.03) 8px 15px,rgba(0,0,0,.05) 15px 17px),
    repeating-linear-gradient(93deg,rgba(255,230,190,.035) 0 31px,rgba(0,0,0,.08) 31px 33px,rgba(0,0,0,0) 33px 61px),
    linear-gradient(160deg,#5a3720,#3c2212 45%,#2a170b);
  box-shadow:inset 0 0 0 2px rgba(255,220,170,.10),inset 0 0 0 7px rgba(0,0,0,.25),inset 0 0 60px rgba(0,0,0,.55),0 14px 28px rgba(0,0,0,.45);}
.frame>svg.bd{position:absolute;inset:0;width:100%;height:100%;display:block;}
.frame .lay{position:absolute;inset:0;pointer-events:none;}
.frame.mouse{cursor:crosshair;}
.zm{position:absolute;right:10px;top:10px;z-index:8;width:44px;height:44px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;background:rgba(14,16,26,.82);color:#fff;box-shadow:0 0 0 1.5px var(--gl-line),0 3px 10px rgba(0,0,0,.5);cursor:pointer;}
.zm svg{width:22px;height:22px;}
.zm.on{background:color-mix(in srgb,var(--lit) 30%,rgba(14,16,26,.9));box-shadow:0 0 0 1.5px var(--lit);}
.zm[hidden]{display:none;}
.tl .in{transform-box:fill-box;transform-origin:center;}
.tl .in.drop{animation:drop .42s cubic-bezier(.2,.9,.3,1.15) both;}
@keyframes drop{0%{transform:scale(1.22) translateY(-6%);opacity:.0;}60%{opacity:1;}100%{transform:none;opacity:1;}}
.tl.last .edge{stroke:#ffe9a3;stroke-width:.07;}
.gh{pointer-events:none;}
.gh .in{opacity:.93;}
.gh .ring{fill:none;stroke-width:.12;stroke:#fff6d0;filter:drop-shadow(0 0 .25px #ffd34d);}
.gh.bad .ring{stroke:#ff5a3c;stroke-dasharray:.35 .22;filter:none;}
.gh.bad .in{opacity:.6;}
.gh.lift{transition:none;}
.mk .ok{fill:#ffe9a3;stroke:#3b2a00;stroke-width:.035;}
.mk .no{stroke:#ff4a2e;stroke-width:.11;stroke-linecap:round;filter:drop-shadow(0 0 .12px #000);}
.hl rect{fill:rgba(255,248,215,.20);stroke:#fff4c4;stroke-width:.06;pointer-events:none;}
.hl.on rect{fill:rgba(255,248,215,.42);stroke-width:.09;}
.fl rect{fill:#fff7d8;opacity:0;animation:flash .9s ease-out both;}
@keyframes flash{25%{opacity:.85;}100%{opacity:0;}}
.won rect.cel{animation:wonp 1.4s ease-in-out infinite;}
@keyframes wonp{50%{filter:brightness(1.35);}}
.tag{position:absolute;transform:translate(-50%,-100%);z-index:6;pointer-events:none;padding:4px 11px;border-radius:999px;background:rgba(12,14,22,.92);box-shadow:0 0 0 1px var(--gl-line),0 3px 8px rgba(0,0,0,.5);font-size:.8rem;font-weight:800;white-space:nowrap;color:#fff;}
.tag.good{background:rgba(70,52,8,.95);color:#ffe9a3;box-shadow:0 0 0 1.5px #c99a3c,0 3px 10px rgba(0,0,0,.5);}
.tag.bad{background:rgba(120,22,12,.95);}
.tag.pt{pointer-events:auto;cursor:help;font-size:.95rem;padding:4px 12px;}
.tag.pt small{font-size:.72em;font-weight:700;opacity:.8;margin-left:2px;}
.tag.chn{font-size:.72rem;padding:2px 8px;transform:translate(-50%,-50%);background:rgba(25,18,2,.92);color:#ffe9a3;box-shadow:0 0 0 1.5px var(--cc,#c99a3c);}
.gain{position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-50%);font-weight:900;font-size:1.6rem;color:#ffe9a3;text-shadow:0 2px 0 #3b2a00,0 0 16px rgba(255,211,77,.8);animation:gain 1.5s ease-out forwards;}
@keyframes gain{0%{opacity:0;transform:translate(-50%,-30%) scale(.6);}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15);}100%{opacity:0;transform:translate(-50%,-170%) scale(1);}}

/* the places the card in hand can go: a marker in the middle of each */
.sps .sp{transform-box:fill-box;transform-origin:center;}
.sps.fresh .sp{animation:spIn .34s cubic-bezier(.3,1.5,.5,1) both;}
@keyframes spIn{0%{opacity:0;transform:scale(.3);}}
.sps.nudge .sp{animation:spNudge .55s ease-in-out;}
@keyframes spNudge{40%{transform:scale(1.35);}}
.sp rect{fill:rgba(16,18,28,.84);stroke:rgba(255,246,214,.6);stroke-width:.05;}
.sp text{fill:#fff3d0;font-weight:800;text-anchor:middle;font-family:var(--font,inherit);letter-spacing:.06em;}
.sp.dot circle{fill:rgba(255,246,214,.3);stroke:#fff6d6;stroke-width:.08;}
.sp.gold rect{fill:rgba(84,60,6,.95);stroke:#ffd34d;stroke-width:.08;}
.sp.gold text{fill:#ffe9a3;}
.sp.gold.dot circle{fill:#ffd34d;stroke:#3b2a00;}
.fp{fill:rgba(255,211,77,.07);stroke:rgba(255,211,77,.55);stroke-width:.06;stroke-dasharray:.28 .18;pointer-events:none;}
.gh .in.spin{animation:spin .3s cubic-bezier(.3,1.3,.5,1);}
@keyframes spin{0%{transform:rotate(-90deg) scale(.94);}}
.gh.lift .in{transform:scale(1.06);filter:drop-shadow(0 .35px .3px rgba(0,0,0,.55));transition:transform .15s;}
.gh.float .in{opacity:.62;transform:scale(1.08);}
.gh .home{fill:rgba(255,246,214,.08);stroke:#fff6d0;stroke-width:.09;stroke-dasharray:.3 .2;}
.frame.panning{cursor:grabbing;}
/* the small map, and the gold tabs at the table's edge for a best place out of view */
.mm{position:absolute;right:10px;top:10px;z-index:8;padding:5px;border:0;border-radius:12px;background:rgba(14,16,26,.8);box-shadow:0 0 0 1.5px var(--gl-line),0 3px 10px rgba(0,0,0,.5);cursor:pointer;line-height:0;}
.mm[hidden]{display:none;}
.mm svg{display:block;overflow:visible;}
.mm .mt rect{fill:rgba(240,226,200,.55);}
.mm .mv{fill:rgba(255,211,77,.12);stroke:#ffd34d;stroke-width:.7;}
.mm .mh{fill:#fff;}
.mm .mg{fill:#ffd34d;}
.ct-edge{position:absolute;z-index:7;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;min-height:34px;padding:4px 11px 4px 8px;border:0;border-radius:999px;background:rgba(84,60,6,.96);color:#ffe9a3;font:inherit;font-weight:800;font-size:.86rem;box-shadow:0 0 0 1.5px #ffd34d,0 3px 10px rgba(0,0,0,.5);cursor:pointer;animation:edgeIn .3s both;}
.ct-edge i{display:flex;width:16px;height:16px;}
.ct-edge svg{width:16px;height:16px;}
@keyframes edgeIn{0%{opacity:0;}}

/* ── The dock: the card in hand, whose turn, the buttons ── */
.ct-dock{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"hand side" "acts acts";column-gap:14px;row-gap:10px;align-items:center;flex:none;view-transition-name:ct-dock;}
.ct-dock.noc{grid-template-areas:"side side" "acts acts";}
.ct-dock.noc .ct-hand{display:none;}
.ct-dock.h3{grid-template-columns:minmax(0,1fr);grid-template-areas:"hand" "side" "acts";row-gap:8px;}
.ct-hand{grid-area:hand;display:flex;gap:8px;align-items:center;justify-content:center;}
.hc{position:relative;width:var(--hcw,104px);aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;border-radius:12px;transition:transform .25s cubic-bezier(.3,1.4,.5,1);touch-action:none;}
.hc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5));transition:transform .32s cubic-bezier(.3,1.3,.5,1);}
.hc.sel::after{content:"";position:absolute;inset:-4px;border-radius:14px;box-shadow:0 0 0 2.5px var(--lit),0 0 16px var(--litg);pointer-events:none;}
.hc.wait{cursor:default;}
.hc.wait::after{display:none;}
.hc .rot{position:absolute;right:-9px;bottom:-9px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(14,16,26,.92);box-shadow:0 0 0 1.5px var(--gl-line),0 3px 8px rgba(0,0,0,.5);color:#fff;}
.hc .rot svg{width:19px;height:19px;filter:none;}
.hc.dim{opacity:.45;}
html .ct-hand .hc.mini{--hcw:calc(var(--hcw0,104px) * .64);}
.ct-side{grid-area:side;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;}
.ct-info{display:flex;align-items:center;gap:10px;min-width:0;}
.ct-info .turn{--c:var(--lit);flex:1 1 auto;min-width:0;margin:0;min-height:0;justify-content:flex-start;color:var(--text);font-weight:800;font-size:1.08rem;line-height:1.2;display:flex;align-items:center;gap:9px;}
.ct-info .turn .tt{min-width:0;}
.ct-info .turn .dot{flex:none;}
.ct-line{font-size:.88rem;font-weight:600;line-height:1.3;color:var(--text-2);min-height:2.6em;}
.deck{flex:none;display:flex;align-items:center;gap:7px;}
.deck[hidden]{display:none;}
.deck .pile{position:relative;width:24px;height:28px;}
.deck .pile i{position:absolute;left:3px;bottom:0;width:21px;height:21px;border-radius:4px;background:linear-gradient(135deg,#2a2c38,#0c0d12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 2px 3px rgba(0,0,0,.5);}
.deck .pile i::after{content:"";position:absolute;inset:4px;border-radius:2px;background:conic-gradient(var(--c0) 0 25%,var(--c1) 0 50%,var(--c2) 0 75%,var(--c3) 0);opacity:.6;}
.deck .pile.empty i{opacity:.25;}
.deck .n{font-size:.84rem;font-weight:700;color:var(--text-2);white-space:nowrap;}
.deck .n b{font-size:1.15em;color:var(--text);font-variant-numeric:tabular-nums;}
.acts{grid-area:acts;display:flex;gap:8px;min-height:50px;}
.acts .btn{min-height:50px;margin:0;}
.acts .btn .ico{width:20px;height:20px;}
.acts .ct-go{flex:1 1 auto;min-width:0;white-space:nowrap;font-size:1rem;}
.acts .ct-go .sh{display:none;}
.acts .ct-go.short .lg{display:none;}
.acts .ct-go.short .sh{display:inline;}
.acts .btn-soft.sq{flex:0 0 auto;padding:0 16px;position:relative;gap:6px;}
.acts .ct-undo{width:54px;padding:0 !important;justify-content:center;}
.acts .ct-rot .bdg{position:absolute;top:-8px;right:-6px;padding:1px 7px;border-radius:999px;background:#5a4108;color:#ffe9a3;font-size:.74rem;font-weight:800;box-shadow:0 0 0 1.5px #ffd34d;}
@media (max-width:420px){ .acts .ct-rot{padding:0 14px;} }
@media (max-width:360px){ .acts .ct-rot span{display:none;} .pl .sub{font-size:.66rem;} .pl .pts{font-size:1.1rem;} .pl .av{width:24px;height:24px;} .pl{gap:6px;padding-left:5px;padding-right:7px;} .ct-line{font-size:.8rem;} .turn{font-size:.98rem;} }

/* a phone held upright: the dock under the table */
@media (max-height:620px){ html[data-o=port] .hc{--hcw:76px;--hcw0:76px;} html[data-o=port] .ct-line{font-size:.8rem;min-height:0;} html[data-o=port] .turn{font-size:.98rem;} html[data-o=port] .ct-dock.h3 .hc{--hcw:66px;--hcw0:66px;} html[data-o=port] .pl{min-height:40px;padding-top:3px;padding-bottom:3px;} html[data-o=port] .acts,html[data-o=port] .acts .btn{min-height:46px;} html[data-o=port] .ct-dock{row-gap:8px;} }
@media (min-width:700px){
  html[data-o=port] #app.stage.ipl{padding-left:18px;padding-right:18px;}
  html[data-o=port] .ct-col{gap:12px;}
  html[data-o=port] .pl{min-height:60px;padding:8px 14px 8px 10px;}
  html[data-o=port] .pl .nm{font-size:1.05rem;}
  html[data-o=port] .pl .sub{font-size:.82rem;}
  html[data-o=port] .pl .av{width:36px;height:36px;}
  html[data-o=port] .pl .pts{font-size:1.6rem;}
  html[data-o=port] .hc{--hcw:128px;--hcw0:128px;}
  html[data-o=port] .turn{font-size:1.25rem;}
  html[data-o=port] .ct-line{font-size:1rem;}
  html[data-o=port] .ct-dock{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"hand side acts";column-gap:20px;}
  html[data-o=port] .ct-dock.h3{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"hand hand" "side acts";}
  html[data-o=port] .ct-dock.noc{grid-template-areas:"side side acts";}
  html[data-o=port] .acts{align-self:center;}
  html[data-o=port] .acts .ct-go{min-width:240px;}
  html[data-o=port] .acts .btn{min-height:56px;}
}
/* sideways: the players, the card in hand and the buttons at the left; the table, where the taps go, at the right */
html[data-o=land] #app.stage.ipl{padding:2px max(14px,env(safe-area-inset-right)) calc(var(--safe-b) + 10px) max(14px,env(safe-area-inset-left));}
html[data-o=land] .ct-col{max-width:none;display:grid;grid-template-columns:var(--lc,280px) minmax(0,1fr);grid-template-rows:max-content minmax(0,1fr) max-content;grid-template-areas:"p b" ". b" "d b";column-gap:16px;row-gap:8px;}
html[data-o=land] .ct-plates{grid-area:p;flex-direction:column;flex-wrap:nowrap;}
html[data-o=land] .ct-plates .pl{flex:none;}
html[data-o=land] .ct-plates.many{display:grid;grid-template-columns:1fr 1fr;}
html[data-o=land] .frame{grid-area:b;min-height:0;}
html[data-o=land] .ct-dock{grid-area:d;column-gap:12px;row-gap:8px;}
html[data-o=land] .hc{--hcw:96px;--hcw0:96px;}
html[data-o=land] .ct-dock.h3 .ct-hand{justify-content:flex-start;}
html[data-o=land] .ct-room{display:none;}
@media (max-height:440px){ html[data-o=land] .pl{min-height:36px;padding:2px 8px 2px 5px;} html[data-o=land] .pl .av{width:22px;height:22px;font-size:.72rem;} html[data-o=land] .pl .pts{font-size:1.05rem;} html[data-o=land] .pl .sub{display:none;} html[data-o=land] .hc{--hcw:78px;--hcw0:78px;} html[data-o=land] .turn{font-size:.95rem;} html[data-o=land] .ct-line{font-size:.8rem;min-height:0;} html[data-o=land] .acts,html[data-o=land] .acts .btn{min-height:46px;} html[data-o=land] .ct-col{row-gap:6px;} html[data-o=land] .ct-side{gap:2px;} html[data-o=land] .deck .n{font-size:.78rem;} }
@media (min-height:600px){ html[data-o=land] .ct-col{--lc:330px;} html[data-o=land] .hc{--hcw:124px;--hcw0:124px;} html[data-o=land] .pl{min-height:58px;} html[data-o=land] .pl .av{width:34px;height:34px;} html[data-o=land] .pl .pts{font-size:1.5rem;} html[data-o=land] .turn{font-size:1.15rem;} html[data-o=land] .ct-line{font-size:.95rem;} html[data-o=land] .acts .btn{min-height:54px;} }
.ct-room{display:none;}
@media (max-height:440px){ html[data-o=land] .pl{min-height:36px;padding:2px 8px 2px 5px;} html[data-o=land] .pl .av{width:22px;height:22px;font-size:.72rem;} html[data-o=land] .pl .pts{font-size:1.05rem;} html[data-o=land] .pl .sub{display:none;} html[data-o=land] .hc{--hcw:70px;--hcw0:70px;} html[data-o=land] .turn{min-height:0;font-size:.8rem;} html[data-o=land] .acts .btn{min-height:38px;} html[data-o=land] .ct-col{row-gap:6px;} }
@media (min-height:600px){ html[data-o=land] .ct-col{--lc:310px;} html[data-o=land] .hc{--hcw:120px;--hcw0:120px;} html[data-o=land] .pl{min-height:58px;} html[data-o=land] .pl .av{width:34px;height:34px;} html[data-o=land] .pl .pts{font-size:1.5rem;} html[data-o=land] .turn{font-size:1rem;} }
.ct-room{display:none;}
::view-transition-group(*){animation-duration:.45s;animation-timing-function:cubic-bezier(.22,1,.36,1);}

/* ── The desk: a window larger than a phone's or a tablet's (html.ct-dk, set by deskPlan) ── */
html.ct-dk #app.stage.ipl{padding:0;height:auto;}
html.ct-dk .ct-col{position:fixed;left:var(--x0);top:var(--y0);width:var(--aw);height:var(--ah);max-width:none;margin:0;display:grid;gap:var(--g);
  grid-template-columns:var(--cols);grid-template-rows:max-content max-content minmax(0,1fr);grid-template-areas:var(--areas);}
html.ct-dk .ct-plates{grid-area:p;flex-direction:column;flex-wrap:nowrap;}
html.ct-dk .ct-plates .pl{flex:none;}
html.ct-dk .ct-plates.many{display:flex;}
html.ct-dk .frame{grid-area:b;min-height:0;}
html.ct-dk .ct-dock{grid-area:d;}
html.ct-dk .ct-room{grid-area:r;display:flex;flex-direction:column;gap:var(--g);min-height:0;overflow:hidden;view-transition-name:ct-room;}
html.ct-dk .ct-room.row{flex-direction:row;align-items:stretch;}
html.ct-dk .ct-room.row>.pn{flex:1 1 0;min-width:0;}
html.ct-dk .pl{min-height:calc(58px * var(--dk));padding:calc(7px * var(--dk)) calc(14px * var(--dk));}
html.ct-dk .pl .nm{font-size:calc(1.02rem * var(--dk));}
html.ct-dk .pl .sub{font-size:calc(.8rem * var(--dk));}
html.ct-dk .pl .av{width:calc(34px * var(--dk));height:calc(34px * var(--dk));}
html.ct-dk .pl .pts{font-size:calc(1.5rem * var(--dk));}
html.ct-dk .hc{--hcw:calc(132px * var(--dk));--hcw0:calc(132px * var(--dk));}

.race{margin-top:8px;}

.mvr .no{color:var(--text-3);font-weight:700;text-align:right;}

.mvr .tg{font-size:.82em;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap;}
.mvr .tg.f{background:color-mix(in srgb,var(--lit) 22%,transparent);color:var(--lit-ink);}
.mvr .tg.t{background:rgba(255,255,255,.1);color:var(--text-2);}

.left{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(30px * var(--dk,1)),1fr));gap:6px;}

.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chs span{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 4px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:800;font-size:.86em;}
.chs span i{width:.9em;height:.9em;border-radius:3px;background:var(--cc);}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), C = window.ContinuoCore;
  var SAVE = 'continuo_state', KEY = 'continuo';
  var SKILL = { easy: 'Easy', normal: 'Normal', hard: 'Hard', expert: 'Expert' };
  var DEMO = Kit.inDemo && Kit.inDemo();
  var CREDIT = 'Continuo was designed by Maureen Hiron and is published by David Westnedge Ltd.';
  var INK = ['#d9363e', '#f2c12e', '#2e9a57', '#2f62c8'], LIGHT = ['#f2707a', '#ffe48a', '#5fc985', '#6c95ec'], DARK = ['#8f1820', '#b8860f', '#176135', '#1a3a85'];
  var CN = ['red', 'yellow', 'green', 'blue'];
  var R = document.documentElement;
  function shape() { return window.innerWidth > window.innerHeight ? 'land' : 'port'; }
  R.setAttribute('data-o', shape());

  // ── State ────────────────────────────────────────────────────────────────
  // S = the core's state and {mode, cover, hints, players: [{name, cpu, level}], hist (undo snapshots), started, busy}
  var S = null, NET = null, LEFT = null, WINO = null, NETREC = {}, SHOWN = 0, HOLD = false, ANIM = false, LASTP = -1;
  var BRD = null;   // the table as the core's Board, for the cards down now
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && !S.over) Kit.resume.set(S.np === 1 ? S.sc[0] + ' points, ' + left() + ' cards left' : 'Card ' + (S.pl.length + 1) + ' of 42');
  }
  function clearSave() { if (NET) return; try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function left() { var n = S.deck.length; S.hands.forEach(function (h) { n += h.length; }); return n; }
  function humans() { return S.players.filter(function (p) { return !p.cpu; }).length; }
  function vsCpu() { return S.players.some(function (p) { return p.cpu; }); }
  function solo() { return S.np === 1; }
  function isMe(i) { return NET ? NET.seat === i : (humans() === 1 && !S.players[i].cpu); }
  function nm(i) { return isMe(i) && (NET || vsCpu() || solo()) ? 'You' : S.players[i].name; }
  function pc(i) { return Kit.color(i); }
  function hintsOn() { return !S || S.hints !== false; }
  function humanTurn() { return S && !S.over && !S.busy && !HOLD && !ANIM && (NET ? !LEFT && NET.myTurn() : !S.players[S.turn].cpu); }
  function brd() { if (!BRD) BRD = C.boardOf(S.pl); return BRD; }
  function fresh() { BRD = null; LEG = {}; }
  function listAnd(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
  function pts(n) { return n + (n === 1 ? ' point' : ' points'); }

  function rulesHtml() {
    return '<p class="goal">Lay the cards so their colors run on in <b>chains</b>, and score the length of every chain your card makes longer.</p>' +
      '<h3>The cards</h3><ul><li>There are 42 cards, each a grid of 16 small squares in red, yellow, green and blue. Every card has the same pattern in its own mix of two or three colors, and no two cards are alike.</li>' +
      '<li>The first card of the shuffled deck is turned up in the middle of the table.</li></ul>' +
      '<h3>Your turn</h3><ul><li>Take the top card of the deck and put it down so it touches at least one card on the table, its squares lined up with theirs.</li>' +
      '<li>Wherever its squares touch squares of other cards along a side, <b>the colors must match</b>. That is the one rule.</li>' +
      '<li>The card can be slid along the cards it touches, so the cards need not line up in rows, and it can touch by just one square.</li>' +
      '<li>You can turn the card before you put it down: tap the card in your hand, tap the turn button, or press R.</li>' +
      '<li>A card that fits nowhere goes under the deck and you take the next one.</li>' +
      '<li>On the screen, a marker stands in every place your card fits. Drag the card and it snaps into each place it passes, or tap a marker to move it there. With hints on, each marker shows the points the card would score there, and the best are gold. Drag the table to look round it, pinch to zoom, and tap the small map to see the whole table.</li></ul>' +
      '<h3>Scoring</h3><ul><li>A chain is a run of squares of one color that touch along their sides, from card to card.</li>' +
      '<li>For every chain your card makes longer, you score <b>the whole chain’s length</b>, counting the squares on your card. A chain that stays on your card alone scores nothing.</li>' +
      '<li>When your card joins two chains of one color, they become one chain and score once, at their new length.</li>' +
      '<li>For example: your card’s red corner touches a red chain of 5 squares, making it 6, and its blue L of 3 squares joins a blue chain of 3 to a blue chain of 4, making one chain of 10. You score 6 and 10, 16 points.</li>' +
      '<li>With hints on, the points your card would score stand over it; point at the number, or press and hold it, and each chain it counts lights with its own length.</li></ul>' +
      '<h3>The end</h3><ul><li>The game ends when the last card is down. The highest score wins, and equal scores share the win.</li>' +
      '<li>Playing alone, try to beat your best score.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b> opens a table, and the others join on their own devices. Seats nobody takes are played by the computer.</li></ul>' +
      '<h3>Tips</h3><ul><li>Join chains: two chains of 8 joined by one card score 16 or more at once.</li><li>Think about what you leave the next player: a long chain left open at its end is points for whoever extends it.</li></ul>' +
      '<p class="src">These are the rules in the published game. Two details here come from no rule sheet that could be read: a card that fits nowhere goes under the deck, and the Cards in hand choice of three is a house rule.</p>' +
      '<p class="credit">' + CREDIT + '</p>';
  }

  Kit.init({
    id: KEY, mark: false, snap: '.frame', snapY: 0.5, snapFit: '.frame .tiles .tl',   // (Keep playing's picture: round the cards down)
    snapHide: function () { return S && !NET && S.hand > 1 && humans() > 1 ? '.ct-hand' : null; },   // (three cards in hand are a hand: never in the picture in pass and play)
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } cancelThink(); clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Continuo: past games' }); } }]),
    rules: rulesHtml()
  });

  function showSetup() {
    S = null; deskOff(); BRD = null;
    app.className = 'stage';
    Kit.setup(app, {
      modes: Kit.modes([{ id: 'cpu', desc: 'You against 1 to 4 computer players' }, { id: 'pp', kind: 'local' }]),
      options: [
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: [['easy', 'Easy', 'Puts its card where it scores something, often far from where it scores most.'], ['normal', 'Normal', 'Puts its card where it scores the most points now.'], ['hard', 'Hard', 'Weighs its points against what the next player could score after it.'], ['expert', 'Expert', 'Weighs more places against more of the cards the next player could draw.']] },
        { id: 'hints', label: 'Hints', value: 'on', choices: [['on', 'On', 'The points a card would score stand over it, and the chains they come from light up, with every match and mismatch marked.'], ['off', 'Off', 'Only whether a card fits is shown. You count the chains yourself.']] },
        { id: 'hand', label: 'Cards in hand', value: '1', choices: [['1', 'One\nStandard', 'Take the top card and put it down, as the published rules have it.'], ['3', 'Three\nHouse rule', 'Hold three cards, put one down and draw back up: more choice each turn.']] },
        { id: 'cover', local: true, label: 'Hand over between turns', value: 'off', choices: [['off', 'Off', 'Nothing on the table is hidden, so the device just goes round.'], ['on', 'On', 'A cover names whose turn it is before each card.']], when: function (m) { return m === 'pp'; } }
      ],
      players: {
        range: function (m) { return m === 'cpu' ? [2, 5] : [1, 5]; },
        cpu: function (m) { return m === 'cpu' ? 'seats' : 'mix'; },
        count: 2
      },
      onStart: function (cfg) {
        var players = cfg.players.map(function (p) { return { name: p.name, cpu: !!p.cpu, level: p.level || cfg.options.level || 'normal' }; });
        newGame({ mode: cfg.mode, cover: cfg.options.cover === 'on' && cfg.mode === 'pp', hints: cfg.options.hints !== 'off', hand: +cfg.options.hand || 1, players: players });
      }
    });
    var hero = app.querySelector('.setup-hero');
    if (hero && !app.querySelector('.ct-credit')) hero.parentNode.insertBefore(el('p', { class: 'ct-credit', text: CREDIT }), hero.nextSibling);
    var hideC = function () { var c = app.querySelector('.ct-credit'); if (c && document.documentElement.scrollHeight > window.innerHeight + 1) c.style.display = 'none'; };
    requestAnimationFrame(hideC); setTimeout(hideC, 700);
  }
  function freshFields(st) { st.hist = []; st.started = Date.now(); st.busy = false; }
  function newGame(o, rotate) {
    cancelThink();
    var keep = o || { mode: S.mode, cover: S.cover, hints: S.hints, hand: S.hand, players: S.players };
    var players = keep.players.slice();
    if (rotate && players.length > 1) players = players.slice(1).concat([players[0]]);
    var st = C.newGame({ np: players.length, hand: keep.hand || 1, seed: o && o.seed, deck: o && o.deck });
    st.mode = keep.mode; st.cover = keep.cover; st.hints = keep.hints !== false; st.players = players;
    freshFields(st);
    S = st; fresh(); SEL = 0; AIMK = null;
    Kit.gameStart(); save(); build(); Kit.sfx('deal');
    afterTurn();
  }

  // ── Moves ────────────────────────────────────────────────────────────────
  function snap(byCpu) { var c = JSON.parse(JSON.stringify(S)); delete c.hist; return { s: c, cpu: !!byCpu }; }
  function playMove(str, byCpu) {
    if (!S || S.over) return false;
    var h0 = snap(byCpu), prevSc = S.sc.slice();
    var res = C.play(S, str);
    if (!res) return false;
    S.hist.push(h0); if (S.hist.length > 60) S.hist.shift();
    fresh(); SEL = 0; AIMK = null; GH = null;
    save();
    var t = show(res, prevSc);
    setTimeout(function () { afterMove(); }, t);
    return true;
  }
  function afterMove() {
    if (!S) return;
    if (S.over) { finish(); return; }
    afterTurn();
  }
  function afterTurn() {
    if (!S || S.over) return;
    if (NET) { startAim(); paintAll(); return; }
    var p = S.players[S.turn];
    if (p.cpu) { paintAll(); maybeCpu(); return; }
    if (S.cover && humans() > 1 && S.n > 0 && LASTP !== S.turn && !DEMO) {
      HOLD = true; paintAll();
      Kit.handoff({ name: p.name, color: pc(S.turn), msg: 'Your card is ready.', hint: 'Hold for a moment to take your turn', hold: 700 }).then(function () { HOLD = false; LASTP = S.turn; startAim(); paintAll(); });
      return;
    }
    LASTP = S.turn; startAim(); paintAll();
  }
  function undo() {
    if (!S || S.over == null) return;
    if (S.over) return Kit.toast('The game is over');
    var cpu = vsCpu();
    if (!S.hist.some(function (h) { return !h.cpu; })) return Kit.toast('Nothing to undo');
    cancelThink(); S.busy = false;
    var h, hist = S.hist;
    while (hist.length) { h = hist.pop(); if (!cpu || !h.cpu) break; }
    S = h.s; S.hist = hist; S.busy = false; fresh(); SEL = 0; AIMK = null; GH = null;
    Kit.sfx('whoosh'); save(); build(); afterTurn();
  }

  // ── The computer ─────────────────────────────────────────────────────────
  var worker = null, workerOk = true, reqId = 0, pending = null;
  function coreOf(st) { return { np: st.np, hand: st.hand, deck: st.deck, hands: st.hands, pl: st.pl, turn: st.turn, n: st.n, sc: st.sc, over: st.over }; }
  function getWorker() {
    if (worker || !workerOk) return worker;
    try {
      var url = new URL('continuo-core.js', location.href).href;
      var src = 'importScripts(' + JSON.stringify(url) + ');onmessage=function(e){var d=e.data;postMessage({id:d.id,res:ContinuoCore.search(d.st,d.o)});};';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = function (e) { if (pending && e.data.id === pending.id) { var p = pending; pending = null; p.cb(e.data.res); } };
      worker.onerror = function () { workerOk = false; worker = null; if (pending) { var p = pending; pending = null; p.cb(C.search(p.st, p.o)); } };
    } catch (e) { workerOk = false; worker = null; }
    return worker;
  }
  function think(st, o, cb) {
    var id = ++reqId, w = getWorker();
    pending = { id: id, cb: cb, st: st, o: o };
    if (w) w.postMessage({ id: id, st: st, o: o });
    else setTimeout(function () { if (pending && pending.id === id) { pending = null; cb(C.search(st, o)); } }, 30);
  }
  function cancelThink() { pending = null; }
  function maybeCpu() {
    if (NET || !S || S.over || !S.players[S.turn].cpu || S.busy) return;
    S.busy = true; paintAll();
    var t0 = Date.now(), myN = S.ml.length, p = S.players[S.turn];
    think(coreOf(S), { level: p.level || 'normal', seed: Math.floor(Math.random() * 1e9) }, function (res) {
      if (!S || S.ml.length !== myN) return;
      setTimeout(function () {
        if (!S || S.ml.length !== myN) return;
        S.busy = false;
        if (res && res.move) playMove(res.move, true);
      }, Math.max(0, (S.players.every(function (q) { return q.cpu; }) ? 250 : 700) - (Date.now() - t0)));
    });
  }

  // ── Drawing a card ───────────────────────────────────────────────────────
  // A card is a lacquered black card with 16 enamel squares; units are squares (a card is 4 across)
  var NS = 'http://www.w3.org/2000/svg';
  function sv(tag, a) { var n = document.createElementNS(NS, tag); if (a) for (var k in a) n.setAttribute(k, a[k]); return n; }
  function defs() {
    var s = '<defs>';
    for (var c = 0; c < 4; c++) s += '<linearGradient id="ctc' + c + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + LIGHT[c] + '"/><stop offset=".42" stop-color="' + INK[c] + '"/><stop offset="1" stop-color="' + DARK[c] + '"/></linearGradient>';
    s += '<linearGradient id="ctg" x1="0" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".38" stop-color="#fff" stop-opacity=".04"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>';
    s += '<linearGradient id="cte" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3d4a"/><stop offset=".5" stop-color="#15161d"/><stop offset="1" stop-color="#050507"/></linearGradient>';
    return s + '</defs>';
  }
  // a card as SVG markup at (x, y) (squares); o.shadow, o.cls
  function cardMarkup(t, o, x, y, opt) {
    opt = opt || {};
    var cl = C.cells(t, o), s = '';
    if (opt.shadow !== false) s += '<rect x=".1" y=".16" width="4" height="4" rx=".26" fill="rgba(0,0,0,.42)"/>';
    s += '<rect class="edge" x="0" y="0" width="4" height="4" rx=".24" fill="url(#cte)"/>';
    for (var i = 0; i < 16; i++) s += '<rect class="cel" x="' + ((i & 3) + .085) + '" y="' + ((i >> 2) + .085) + '" width=".83" height=".83" rx=".1" fill="url(#ctc' + cl[i] + ')"/>';
    s += '<rect x=".03" y=".03" width="3.94" height="3.94" rx=".22" fill="url(#ctg)" pointer-events="none"/>';
    return '<g transform="translate(' + x + ' ' + y + ')"' + (opt.attrs || '') + '><g class="in' + (opt.drop ? ' drop' : '') + '">' + s + '</g></g>';
  }
  // a small card on its own (the hand, the room)
  function cardSvg(t, o, cls) {
    return '<svg viewBox="-0.15 -0.15 4.4 4.45" class="' + (cls || '') + '" aria-hidden="true">' + defs().replace(/id="ct/g, 'id="cs' + t + o + (cls || '') + '_').replace(/url\(#ct/g, 'url(#cs' + t + o + (cls || '') + '_') + cardMarkup(t, o, 0, 0).replace(/url\(#ct/g, 'url(#cs' + t + o + (cls || '') + '_') + '</svg>';
  }
  // a tiny flat card (the room's lists): no gradients
  function flatCard(t, o) {
    var cl = C.cells(t, o || 0), s = '<svg viewBox="0 0 4 4" aria-hidden="true"><rect width="4" height="4" rx=".3" fill="#0c0d12"/>';
    for (var i = 0; i < 16; i++) s += '<rect x="' + ((i & 3) + .1) + '" y="' + ((i >> 2) + .1) + '" width=".8" height=".8" rx=".12" fill="' + INK[cl[i]] + '"/>';
    return s + '</svg>';
  }

  // ── The table ────────────────────────────────────────────────────────────
  var zoomEl, mmEl, colEl, platesEl, frameEl, svgEl, gTiles, gSp, gHl, gGh, gMk, gFl, layEl, dockEl, handEl, sideEl, turnEl, deckEl, lineEl, actsEl, roomEl;
  var VB = { x: -6, y: -6, w: 16, h: 16, sc: 20 }, VBT = null;
  // The camera: CAM {cx, cy, sc} (the middle of the view in squares, and pixels a square). CMODE 'play' frames the
  // places the card in hand can go (never smaller than a comfortable square), 'all' the whole table, 'user' where a
  // drag of the table or a pinch left it, until the next turn.
  var CAM = null, CMODE = 'play';
  function build() {
    if (!S || !S.pl) return;
    app.innerHTML = ''; app.className = 'stage ipl';
    colEl = el('div', { class: 'ct-col' });
    platesEl = el('div', { class: 'ct-plates' });
    frameEl = el('div', { class: 'frame', role: 'img', 'aria-label': 'The table' });
    svgEl = sv('svg', { class: 'bd' }); svgEl.innerHTML = defs();
    gTiles = sv('g', { class: 'tiles' }); gSp = sv('g', { class: 'sps' }); gHl = sv('g', { class: 'hl' }); gFl = sv('g', { class: 'fl' }); gGh = sv('g', { class: 'gh' }); gMk = sv('g', { class: 'mk' });
    [gTiles, gSp, gHl, gFl, gGh, gMk].forEach(function (g) { svgEl.appendChild(g); });
    frameEl.appendChild(svgEl);
    layEl = el('div', { class: 'lay' }); frameEl.appendChild(layEl);
    // the small map of the whole table (a tap shows the whole table), and the way back in from it
    mmEl = el('button', { type: 'button', class: 'mm', hidden: true, 'aria-label': 'See the whole table', onclick: function (e) { e.stopPropagation(); setMode('all'); } });
    zoomEl = el('button', { type: 'button', class: 'zm', hidden: true, 'aria-label': 'Look closer', onclick: function (e) { e.stopPropagation(); setMode('play'); } });
    zoomEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/><path d="M7.5 10.5h6"/><path d="M10.5 7.5v6"/></svg>';
    [mmEl, zoomEl].forEach(function (b) { b.addEventListener('pointerdown', function (e) { e.stopPropagation(); }); frameEl.appendChild(b); });

    if (w.length > 1) return listAnd(w) + ' tie with ' + S.sc[S.win[0]] + ' points.';
    return (w[0] === 'You' ? 'You win' : w[0] + ' wins') + ' with ' + S.sc[S.win[0]] + ' points.';
  }
  // the results card's line: facts under the title, not the title again
  function subLine() {
    var lg = C.longest(brd()), b = bestMove(), f = [(S.pl.length - 1) + ' cards down'];
    if (b) f.push('Best card ' + pts(b.p[5]) + (S.np > 1 ? ' by ' + S.players[b.p[4]].name : ''));
    if (lg.len) f.push('Longest chain ' + lg.len + ' ' + CN[lg.c]);
    return f.join(' · ');
  }
  function bestMove() { var b = null; S.pl.forEach(function (p, k) { if (p[4] >= 0 && (!b || p[5] > b.p[5])) b = { p: p, k: k }; }); return b; }
  function highlights() {
    var hl = [solo() ? S.players[0].name + ' scored ' + S.sc[0] + ' points alone' : S.win.length > 1 ? listAnd(S.win.map(function (i) { return S.players[i].name; })) + ' tied with ' + S.sc[S.win[0]] + ' points' : S.players[S.win[0]].name + ' won with ' + S.sc[S.win[0]] + ' points'], b = bestMove();
    if (b) hl.push(S.players[b.p[4]].name + ' scored the most with one card: ' + b.p[5] + ' points');
    var lg = C.longest(brd()); if (lg.len >= 10) hl.push('The longest chain on the table was ' + lg.len + ' ' + CN[lg.c] + ' squares');
    var under = S.ml.filter(function (m) { return /-$/.test(m); }).length; if (under) hl.push(under === 1 ? 'One card fit nowhere and went under the deck' : under + ' cards fit nowhere and went under the deck');
    if (S.hand > 1) hl.push('Played with three cards in hand');
    if (!S.hints) hl.push('Played without hints');
    if (vsCpu()) hl.push('Computer skill: ' + S.players.filter(function (p) { return p.cpu; }).map(function (p) { return SKILL[p.level] || 'Normal'; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(' and '));
    return hl;
  }
  function detail() {
    var lg = C.longest(brd());
    return { np: S.np, hand: S.hand, pl: C.packPl(S.pl), sc: S.sc.slice(), win: S.win.slice(), lc: lg.len, lcc: lg.c, n: S.n, hints: S.hints ? 1 : 0, under: S.ml.filter(function (m) { return /-$/.test(m); }).length };
  }
  function recPlayers() { return S.players.map(function (p, i) { return { name: p.name, score: S.sc[i], cpu: p.cpu }; }); }
  function winWave() {
    var tl = svgEl.querySelectorAll('.tl'), list = [];
    S.pl.forEach(function (p, k) { if (S.win.indexOf(p[4]) >= 0) list.push(tl[k]); });
    list.forEach(function (g, i) { setTimeout(function () { if (g) g.classList.add('won'); if (i % 3 === 0) Kit.sfx('tick', .4); }, i * 70); });
    return list.length * 70 + 900;
  }
  function finish() {
    save(); clearSave(); GH = null; CMODE = 'all'; fitView(true); paintAll();   // (the finished table, whole)
    var prevBest = BEST; BEST = null;
    Kit.record(KEY, { started: S.started, mode: solo() ? 'Just me' : vsCpu() ? (humans() > 1 ? 'Pass & play with the computer' : 'vs Computer') : 'Pass & play',
      players: recPlayers(), winner: solo() ? S.players[0].name : S.win.map(function (i) { return S.players[i].name; }).join(' and '), highlights: highlights(), detail: detail() });
    var wave = winWave(), newBest = solo() && prevBest != null && S.sc[0] > prevBest && prevBest > 0;
    paintRoom();
    if (newBest) setTimeout(function () { Kit.moment({ big: true, title: 'A new best', line: 'You scored ' + S.sc[0] + ' points, beating your best of ' + prevBest + '.', icon: 'trophy', pts: String(S.sc[0]), color: INK[1] }); Kit.confetti(); }, 300);
    endShow(wave + (newBest ? 2600 : 0), false);
  }
  function endShow(wave, net) {
    setTimeout(function () {
      if (net) return netWin();
      var lose = !solo() && S.win.every(function (i) { return S.players[i].cpu; }) && humans() > 0;
      Kit.sfx(lose ? 'lose' : 'sparkle'); Kit.haptic(lose ? 'heavy' : 'success');
      var one = S.win.length === 1, w = S.players[S.win[0]], wn = nm(S.win[0]);
      Kit.win({
        icon: solo() ? 'star' : !one ? 'users' : lose ? 'bot' : 'trophy',
        title: solo() ? S.sc[0] + ' points' : !one ? 'A tie' : wn === 'You' ? 'You win!' : w.name + ' wins' + (lose ? ' this one' : '!'),
        sub: subLine(),
        rank: rankRows(), lose: !!lose,
        again: function () { newGame(null, true); }, look: true,
        setup: function () { cancelThink(); clearSave(); showSetup(); }
      });
    }, wave);
  }
  function rankRows() {
    return S.players.map(function (p, i) { return i; }).sort(function (a, b) { return S.sc[b] - S.sc[a]; }).map(function (i) {
      return { name: S.players[i].name, me: isMe(i), score: pts(S.sc[i]), color: pc(i) };
    });
  }

  // ── Online (turnnet.js) ──────────────────────────────────────────────────
  // Two to five people, each on their own device; the seats nobody takes are the computer's, played from whichever
  // device has the table open. Each new game at the table moves the seats round one. The host's Hints and Cards in
  // hand go for everyone at the table.
  function netOpts() {
    var o = { seats: 2, level: 'normal', hints: 'on', hand: 1 };
    try { var g = JSON.parse(localStorage.getItem('gn_setup_' + KEY)) || {}, op = g.options || {}; if (+g.count >= 2 && +g.count <= 5) o.seats = +g.count; if (SKILL[op.level]) o.level = op.level; if (op.hints === 'off') o.hints = 'off'; if (+op.hand === 3) o.hand = 3; } catch (e) {}
    return o;
  }
  function netStart(players, opts, last) {
    var ps = players.map(function (p) { return { name: p.name, cpu: !!p.bot, level: (opts && opts.level) || 'normal' }; });
    var rot = last && last.rot != null ? (last.rot + 1) % ps.length : 0;
    var st = C.newGame({ np: ps.length, hand: (opts && +opts.hand) || 1, first: rot });
    st.mode = 'online'; st.players = ps; st.rot = rot; st.hints = !(opts && opts.hints === 'off'); st.started = Date.now();
    st.wins = last && last.wins ? last.wins.slice() : ps.map(function () { return 0; });
    return st;
  }
  function netApply(st, m) {
    if (st.over) return null;
    var prev = st.sc.slice(), res = C.play(st, m);
    if (!res) return null;
    if (st.over) st.win.forEach(function (i) { st.wins[i] = (st.wins[i] || 0) + 1; });
    return { state: st, mv: { m: m, p: res.p, n: st.ml.length } };
  }
  function netBot(st, seat) {
    var p = st.players[seat];
    return new Promise(function (res) {
      think(coreOf(st), { level: p.level || 'normal', seed: Math.floor(Math.random() * 1e9) }, function (r) { res(r && r.move ? netApply(st, r.move) : null); });
    });
  }
  function netMove(m) { if (!S || S.over || LEFT || !NET.myTurn()) return; S.busy = true; paintActs(); NET.act(function (st) { return netApply(st, m); }); setTimeout(function () { if (S) S.busy = false; }, 4000); }
  function netAgain() { if (!NET) return; if (LEFT) { TurnNet.leave(); TurnNet.open(); } else NET.again(); }
  function netShow(net, info) {
    NET = net; cancelThink();
    if (WINO && (info.again || info.fresh)) { WINO.close(); WINO = null; }
    var prev = S;
    S = JSON.parse(JSON.stringify(net.state)); S.busy = false; S.hist = []; fresh(); AIMK = null; GH = null; SEL = 0;
    LEFT = net.status === 'over' && !S.over && net.result && net.result.left != null ? net.result : null;
    var tok = ++SHOWN, mv = info.mv && info.mv.m && !info.fresh && !info.again ? info.mv : null;
    if (mv && prev && prev.pl && prev.ml && prev.ml.length === S.ml.length - 1 && frameEl && frameEl.isConnected) {
      var cp = C.clone(prev), res = C.play(cp, mv.m);
      if (res) {
        var t = show(res, prev.sc, true);
        setTimeout(function () { if (tok !== SHOWN) return; if (S.over || LEFT) netEnd(); else { startAim(); paintAll(); if (!info.mine && net.myTurn()) Kit.haptic('light'); } }, t);
        return;
      }
    }
    build(); startAim(); paintAll();
    if (info.again) { Kit.sfx('deal'); Kit.callout(isMe(S.turn) ? 'You start' : S.players[S.turn].name + ' starts'); }
    if (S.over || LEFT) setTimeout(function () { if (tok === SHOWN) netEnd(); }, 150);
  }
  function netEnd() {
    if (!NET || !S) return;
    var left = LEFT, key = NET.code + ':' + S.started;
    var done = NETREC[key]; try { done = done || (JSON.parse(localStorage.getItem('continuo_net_rec')) || []).indexOf(key) >= 0; } catch (e) {}
    if (!done && !left) {
      NETREC[key] = 1;
      try { var rl = JSON.parse(localStorage.getItem('continuo_net_rec')) || []; rl.push(key); localStorage.setItem('continuo_net_rec', JSON.stringify(rl.slice(-30))); } catch (e) {}
      var hl = highlights(); hl.push('Played online at table ' + NET.code);
      Kit.record(KEY, { started: S.started, mode: 'Online', players: recPlayers(), winner: S.win.map(function (i) { return S.players[i].name; }).join(' and '), highlights: hl, detail: detail() });
    }
    if (WINO) WINO.close();
    CMODE = 'all'; fitView(true); paintAll();
    if (left) return netWin();
    endShow(winWave(), true);
  }
  function netWin() {
    if (!NET) return;
    var me = NET.seat, left = LEFT, one = S.win && S.win.length === 1;
    WINO = Kit.win({
      icon: left || !one ? 'users' : S.win[0] === me ? 'trophy' : 'users',
      title: left ? left.text : !one ? 'A tie' : S.win[0] === me ? 'You win!' : S.players[S.win[0]].name + ' wins',
      sub: left ? '' : subLine(), rank: left ? null : rankRows(),
      notes: left ? null : [S.players.map(function (p, i) { return p.name + ' ' + (S.wins[i] || 0); }).join(', ')], notesTitle: 'Games won at this table',
      lose: !left && one && S.win[0] !== me, againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { WINO = null; netAgain(); },
      look: { label: 'Look at the table', onClick: function () { WINO = null; } }
    });
  }
  function netLeave() {
    NET = null; LEFT = null; SHOWN++; if (WINO) { WINO.close(); WINO = null; }
    var sv2 = null; try { sv2 = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv2 && sv2.pl && sv2.players && !sv2.over) { S = sv2; S.busy = false; S.hist = S.hist || []; fresh(); build(); afterTurn(); }
    else showSetup();
  }

  // ── Test and demo hooks ──────────────────────────────────────────────────
  window.__continuo = {
    C: C, state: function () { return S; }, get busy() { return ANIM || !!(S && S.busy) || !!pending; },
    aim: function () { return GH ? { x: GH.x, y: GH.y, o: ORI, t: card(), j: judgeGhost() } : null; },
    // a fresh game: {mode: 'pp' | 'cpu', hints, hand, players: [{name, cpu, level}], deck: [card order], seed}
    start: function (cfg) { cancelThink(); newGame({ mode: cfg.mode || 'pp', cover: false, hints: cfg.hints !== false, hand: cfg.hand || 1, players: cfg.players, deck: cfg.deck, seed: cfg.seed }); },
    // put cards down without the animations: a list of move strings, played in turn
    set: function (list) { cancelThink(); (list || []).forEach(function (m) { C.play(S, m); }); S.hist = []; fresh(); GH = null; save(); build(); afterTurn(); },
    play: function (m) { if (NET) return netMove(m); return playMove(m); },
    to: function (x, y, o) { if (o != null) ORI = o; GH = { x: x, y: y }; PEEK = false; paintAll(); follow(x, y, 0); },
    rotate: rotate, place: placeNow, peek: function (on) { PEEK = !!on; paintPeek(); },
    // where a square of the table is on the screen (for the demo's finger): an element over it
    sq: function (x, y) { return function () { if (!layEl) return null; var d = layEl.querySelector('.dh[data-x="' + x + '"][data-y="' + y + '"]'); if (!d) { d = el('span', { class: 'dh', 'data-x': x, 'data-y': y, style: 'position:absolute;pointer-events:none;transform:translate(-50%,-50%)' }); layEl.appendChild(d); } var p = toPx(x + .5, y + .5), s = VB.sc; d.style.left = p.x + 'px'; d.style.top = p.y + 'px'; d.style.width = s + 'px'; d.style.height = s + 'px'; return d; }; },
    // where a finger lets go to drag the card to (x, y): under the card's middle by the lift a finger carries it with
    under: function (x, y) { return function () { if (!layEl) return null; var d = layEl.querySelector('.dun'); if (!d) { d = el('span', { class: 'dun', style: 'position:absolute;pointer-events:none;width:8px;height:8px;transform:translate(-50%,-50%)' }); layEl.appendChild(d); } var p = toPx(x + 2, y + 2); d.style.left = p.x + 'px'; d.style.top = (p.y + Math.min(80, VB.sc * 2.6)) + 'px'; return d; }; },
    // an element the size of a card lying at (x, y): where the demo's finger taps to move the card there
    spot: function (x, y) { return function () { if (!layEl) return null; var d = layEl.querySelector('.dsp[data-x="' + x + '"][data-y="' + y + '"]'); if (!d) { d = el('span', { class: 'dsp', 'data-x': x, 'data-y': y, style: 'position:absolute;pointer-events:none;transform:translate(-50%,-50%)' }); layEl.appendChild(d); } var p = toPx(x + 2, y + 2), w = VB.sc * 4; d.style.left = p.x + 'px'; d.style.top = p.y + 'px'; d.style.width = w + 'px'; d.style.height = w + 'px'; return d; }; },
    orient: function (o) { ORI = o ? 1 : 0; if (GH && card() >= 0) { var n = nearest(card(), ORI, GH.x + 2, GH.y + 2); if (n) GH = { x: n.x, y: n.y }; } paintAll(); }, get peeked() { return PEEK; },
    zoom: function (on, x, y) { stopCam(); if (on && x != null) { CMODE = 'user'; setCam(clampCam({ cx: x, cy: y, sc: range().lo * 1.1 })); } else { CMODE = on ? 'all' : 'play'; fitView(false); } paintZoom(); },
    mode: function (m) { if (m) { CMODE = m; fitView(false); paintZoom(); } return CMODE; }, cam: function () { return CAM; }, spots: function () { return SPOTS.map(function (a) { return { x: a.f.x, y: a.f.y, s: a.f.s, gold: a.gold }; }); },
    ghostTag: function () { return layEl ? layEl.querySelector('.tag.pt') : null; },
    hand: function (i) { return handEl ? handEl.querySelectorAll('.hc')[i || 0] : null; },
    fitView: function () { fitView(false); }, desk: function () { return DK; }, view: function () { return VB; }
  };

  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.pl && saved.players && !saved.over) { S = saved; S.busy = false; S.hist = S.hist || []; build(); afterTurn(); }
  else showSetup();

  TurnNet.setup({
    game: KEY, title: 'Continuo', min: 2, max: 5, botMs: 600,
    seats: function (n, o) { return Math.max(n, Math.min(5, o && +o.seats || n)); },
    opts: netOpts, start: netStart, bot: netBot,
    turn: function (st) { return st.over ? [] : [st.turn]; },
    over: function (st) {
      if (!st.over) return null;
      return { win: st.win.slice(), text: st.win.length > 1 ? 'A tie' : st.players[st.win[0]].name + ' wins with ' + st.sc[st.win[0]] };
    },
    show: netShow, leave: netLeave
  });
})();
</script>

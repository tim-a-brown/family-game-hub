<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peggle</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<script src="../arcade-music.js"></script>
<style>
/* ── Level select (inside the kit setup screen) ─────────────────────────── */
.pg-setup .setup-hero{padding-top:4px;}
.pg-setup .setup > .btn-primary.btn-lg{position:sticky;bottom:calc(var(--safe-b) + 10px);z-index:5;box-shadow:0 6px 0 var(--b-lip),0 14px 30px rgba(0,0,0,.55);}
.pg-lvh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.pg-lvh .label{margin:0;}
.pg-lvh small{font-weight:800;color:var(--text-3);font-size:.8rem;}
.pg-levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (min-width:540px){.pg-levels{grid-template-columns:repeat(5,1fr);}}
.pg-lt{position:relative;display:block;border:0;padding:0;border-radius:14px;overflow:hidden;background:#0b0b1c;color:#fff;text-align:left;
  box-shadow:0 0 0 2px var(--w08),0 6px 14px rgba(0,0,0,.35);transition:transform .15s var(--spring),box-shadow .15s;}
.pg-lt:active{transform:scale(.95);}
.pg-lt canvas{display:block;width:100%;height:auto;aspect-ratio:9/11;}
.pg-lt .no{position:absolute;left:5px;top:5px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;
  font-family:var(--display);font-size:.9rem;line-height:1;background:rgba(0,0,0,.55);color:#fff;}
.pg-lt .nm{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 6px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85) 55%);
  font-weight:900;font-size:.76rem;line-height:1.1;}
.pg-lt .nm small{display:block;font-weight:800;font-size:.66rem;color:#ffd27a;margin-top:2px;font-variant-numeric:tabular-nums;}
.pg-lt .nm small.none{color:rgba(255,255,255,.5);}
.pg-lt.on{box-shadow:0 0 0 3px var(--accent),0 8px 20px rgba(0,0,0,.45);}
.pg-lt.on .no{background:var(--accent);color:var(--accent-ink);}
.pg-lt.lock canvas{filter:grayscale(.85) brightness(.4);}
.pg-lt.lock .lk{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.75);padding-bottom:14px;}
.pg-lt.lock .lk svg{width:26px;height:26px;}
.pg-lt .ck{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#3ddc84;color:#04220f;}
.pg-lt .ck .ico{width:13px;height:13px;stroke-width:3.4;}

/* ── Play view: fills the screen, no page scroll ────────────────────────── */
html.pg-on,html.pg-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.pg-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 50% at 50% 0%, rgba(255,150,60,.13) 0%, rgba(255,150,60,0) 70%),var(--bg);}
html.pg-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 6px calc(var(--safe-b) + 8px);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pg-hud{flex:none;display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;width:100%;max-width:100%;margin-bottom:6px;}
/* the full game under way: a quiet line under the plates */
.pg-run{flex:1 0 100%;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:-1px;font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.pg-run b{color:var(--yellow);font-weight:900;}
.pg-run i{font-style:normal;opacity:.5;}
.pg-runl{margin:-2px 0 10px;font-size:.8rem;font-weight:700;color:var(--text-2);line-height:1.35;}
.pg-runl b{color:var(--text);}
.pg-plate.pg-best{flex:.7;}
.pg-plate{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;padding:5px 11px;border-radius:14px;
  background:linear-gradient(180deg,#2a1d12 0%,#170f08 100%);
  box-shadow:inset 0 0 0 1.5px rgba(232,180,90,.55),inset 0 0 0 3.5px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.4);}
.pg-plate small{display:block;font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,210,140,.7);white-space:nowrap;}
.pg-plate b{display:block;font-weight:900;color:#fbf8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pg-lv{flex:none;min-width:64px;text-align:center;align-items:center;}
.pg-lv b{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1;color:#fff;overflow:visible;}
.pg-sc{flex:1;text-align:center;align-items:center;}
.pg-sc b{overflow:visible;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1;color:#ffd45a;font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px rgba(255,190,40,.45),0 2px 0 rgba(0,0,0,.55);}
.pg-sc.bump b{animation:bounce .45s var(--spring);}
.pg-pw{flex:1.25;flex-direction:row;align-items:center;gap:7px;padding-left:8px;}
.pg-pw .pi{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8cf5a6,#20bf55 55%,#0b5e28);color:#03220e;}
.pg-pw .pi .ico{width:16px;height:16px;stroke-width:2.6;}
.pg-pw > span:last-child{min-width:0;}
.pg-pw b{font-size:.84rem;color:#fff;}
.pg-pw.live .pi{box-shadow:0 0 0 3px rgba(140,245,166,.35),0 0 14px rgba(140,245,166,.7);}
.pg-pw.live b{color:#9df5b5;}
.pg-wrap{flex:none;width:100%;display:flex;align-items:center;justify-content:center;position:relative;}
.pg-frame{position:relative;padding:5px;border-radius:19px;}
.pg-frame canvas{display:block;border-radius:14px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair;}
.pg-ctl{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding-top:8px;}
.pg-nudge{flex:none;width:52px;height:52px;border:0;border-radius:50%;display:grid;place-items:center;color:#f7dc9a;
  background:radial-gradient(circle at 40% 30%,#3a2a1a,#1a120a);box-shadow:inset 0 0 0 2px rgba(232,180,90,.55),0 4px 0 #0b0704,0 8px 16px rgba(0,0,0,.4);
  touch-action:none;}
.pg-nudge:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px rgba(232,180,90,.55),0 1px 0 #0b0704;}
.pg-nudge .ico{width:24px;height:24px;stroke-width:2.8;}
.pg-fire{flex:1;max-width:220px;height:54px;border:0;border-radius:27px;font-family:var(--display);font-size:1.45rem;letter-spacing:.08em;color:#3a2200;
  background:linear-gradient(180deg,#ffe9a8 0%,#f2c14e 45%,#c98a1c 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(120,70,0,.35),0 5px 0 #7a4c08,0 10px 20px rgba(0,0,0,.45);
  text-shadow:0 1px 0 rgba(255,255,255,.5);touch-action:manipulation;}
.pg-fire:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 1px 0 #7a4c08;}
.pg-fire:disabled{filter:saturate(.3) brightness(.65);}
/* Tablet landscape: aim buttons in the lower-left corner, FIRE in the lower-right, under the thumbs; the board gets the full height */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px) and (pointer:coarse){
  html.pg-on #app{position:relative;}
  .pg-ctl{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 18px);width:auto!important;justify-content:flex-start;gap:14px;padding:0 24px;pointer-events:none;}
  .pg-ctl > *{pointer-events:auto;}
  .pg-nudge{width:72px;height:72px;order:1;} .pg-nudge .ico{width:30px;height:30px;}
  .pg-nudge + .pg-fire + .pg-nudge{order:2;}
  .pg-fire{order:3;margin-left:auto;flex:none;width:200px;max-width:none;height:84px;border-radius:42px;font-size:1.9rem;}
}
/* Wide screens (iPad sideways, computers): the board stands at the right; scores, aim and FIRE get the room on the left */
html.pg-on #app.side{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;column-gap:clamp(24px,4vw,64px);padding-right:clamp(8px,4vw,64px);align-items:center;}
#app.side .pg-hud{grid-column:1;grid-row:1;align-self:center;justify-self:center;flex-direction:column;flex-wrap:nowrap;gap:12px;width:min(320px,100%);margin:0;}
#app.side .pg-plate{flex:none;padding:12px 16px;text-align:left;align-items:flex-start;}
#app.side .pg-plate small{font-size:.78rem;}
#app.side .pg-lv b,#app.side .pg-sc b{font-size:2.6rem;}
#app.side .pg-best b{font-size:1.5rem;}
#app.side .pg-pw{flex-direction:row;align-items:center;justify-content:flex-start;} #app.side .pg-pw b{font-size:1rem;}
#app.side .pg-run{flex:none;font-size:.78rem;}
#app.side .pg-wrap{grid-column:2;grid-row:1 / span 2;}
#app.side .pg-ctl{position:static;grid-column:1;grid-row:2;justify-self:center;justify-content:center;width:min(360px,100%)!important;padding:0 0 10px;pointer-events:auto;}
#app.side .pg-nudge{order:1;} #app.side .pg-fire{order:2;margin-left:0;flex:1;width:auto;} #app.side .pg-nudge + .pg-fire + .pg-nudge{order:3;}
.pg-pause{position:absolute;inset:5px;border-radius:14px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(8,6,20,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.pg-pause.show{display:flex;}
.pg-pause .card{width:min(260px,80%);text-align:center;padding:22px 18px 16px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.pg-pause h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 4px;}
.pg-pause p{color:var(--text-2);margin:0 0 14px;font-weight:700;}
.pg-pause .btn{margin-top:8px;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), root = document.documentElement;
  var KEY = 'peggle', SAVE = 'peggle_state', PROG = 'peggle_progress';
  // High scores: a board per level (hi_peggle_l1, l2, ... one per level) and the full game (hi_peggle_run). The run under way is kept
  // on this device only (peggle_runstate). Old one-for-all board hi_peggle: see peggleOld in games.js.
  var RUNK = 'peggle_runstate', RUNB = 'peggle_run';
  function lvKey(n) { return 'peggle_l' + n; }
  var PI = Math.PI, TAU = PI * 2;

  // ═══ Playfield geometry & physics constants (logical units) ═══════════════
  var FW = 360, FH = 640, RAIL = 34, CW = FW + RAIL * 2, CH = FH;
  var BR = 7, PR = 9, KR = 5;                    // ball, peg, brick half-thickness
  var GRAV = 460, V0 = 455, E_PEG = 0.75, E_WALL = 0.86, VMAX = 1100;
  var LX = 180, LY = 26, BARREL = 30;            // launcher pivot and barrel length
  var TICK = 1 / 240;                            // fixed physics step
  var BUCKET_Y = 604, FEVER_VALUES = [10000, 50000, 100000, 50000, 10000];
  var LONG_SHOT = 280;
  var MAX_ANG = 88 * PI / 180;
  var DRAG_DEG = 0.32;   // degrees the launcher turns per board unit a finger drags sideways (the board is 360 wide)
  var POWERS = {
    guide: { name: 'Super Guide', icon: 'eye', desc: 'Long aiming line for 3 shots' },
    multi: { name: 'Multiball', icon: 'infinity', desc: 'A second ball pops out' },
    spooky: { name: 'Spooky Ball', icon: 'sync', desc: 'Ball comes back once from the top' },
    random: { name: 'Random power', icon: 'shuffle', desc: 'A surprise power each time' },
    off: { name: 'No power', icon: 'close', desc: 'Green pegs are plain pegs' }
  };
  var REAL_POWERS = ['guide', 'multi', 'spooky'];

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function mkRng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function soundOn() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }

  // ═══ Sound: WebAudio synth (no files) ═════════════════════════════════════
  var AC = null, master = null, noiseBuf = null;
  function ac() {
    if (!soundOn()) return null;
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
      master = AC.createGain(); master.gain.value = 0.9;
      var comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function osc(type, f, t0, dur, vol, o) {
    var a = ac(); if (!a) return; o = o || {};
    var t = a.currentTime + t0, n = a.createOscillator(), g = a.createGain(), out = n;
    n.type = type; n.frequency.setValueAtTime(f, t);
    if (o.to) n.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (o.att || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (o.lp) { var f2 = a.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; n.connect(f2); out = f2; }
    out.connect(g); g.connect(o.dest || master); n.start(t); n.stop(t + dur + 0.05);
  }
  function noise(t0, dur, vol, type, freq, q, dest) {
    var a = ac(); if (!a) return;
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
      var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;
    s.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || master); s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.02);
  }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  // Peg notes climb a major scale with every new peg hit in a shot, like the real game.
  var SCALE = [0, 2, 4, 5, 7, 9, 11], lastNote = 0, lastTick = 0;
  function sPeg(i, c) {
    var a = ac(); if (!a) return;
    var now = a.currentTime; if (now - lastNote < 0.032) return; lastNote = now;
    i = Math.min(i, 16);
    var f = mtof(67 + Math.floor(i / 7) * 12 + SCALE[i % 7]);
    osc('sine', f, 0, 0.5, 0.15); osc('triangle', f * 2, 0, 0.16, 0.045);
    if (c === 'o' || c === 'p') osc('sine', f * 3, 0, 0.3, 0.035);
    if (c === 'g') osc('sine', f * 1.5, 0.04, 0.3, 0.06);
  }
  function sRehit() { var a = ac(); if (!a || a.currentTime - lastTick < 0.05) return; lastTick = a.currentTime; osc('sine', 1500, 0, 0.04, 0.02); }
  function sWall() { var a = ac(); if (!a || a.currentTime - lastTick < 0.05) return; lastTick = a.currentTime; osc('triangle', 240, 0, 0.06, 0.05); }
  function sLaunch() { osc('sine', 150, 0, 0.2, 0.25, { to: 55 }); noise(0, 0.09, 0.12, 'highpass', 2400); osc('triangle', 520, 0, 0.06, 0.04, { to: 260 }); }
  function sPop(i) { osc('sine', 500 + i * 22, 0, 0.07, 0.05, { to: 820 + i * 30 }); }
  function sFree() { [72, 76, 79, 84, 88].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.07, 0.25, 0.1); }); osc('sine', mtof(91), 0.36, 0.5, 0.08); }
  function sStyle() { osc('triangle', mtof(84), 0, 0.18, 0.09); osc('triangle', mtof(91), 0.1, 0.35, 0.09); }
  function sMult() { osc('square', mtof(79), 0, 0.12, 0.04, { lp: 2000 }); osc('square', mtof(86), 0.09, 0.2, 0.04, { lp: 2000 }); }
  function sPower() { [79, 83, 86, 91, 95].forEach(function (m, i) { osc('sine', mtof(m), i * 0.045, 0.22, 0.06); }); }
  function sSpooky() { osc('sine', 300, 0, 0.6, 0.08, { to: 900 }); osc('sine', 450, 0.05, 0.6, 0.05, { to: 1300 }); }
  // Special pieces on the later levels
  var lastFx = 0;
  function fxGate(gap) { var a = ac(); if (!a || a.currentTime - lastFx < gap) return null; lastFx = a.currentTime; return a; }
  function sBump() { if (!fxGate(0.04)) return; osc('sine', 180, 0, 0.16, 0.2, { to: 560 }); osc('triangle', 940, 0, 0.07, 0.05, { to: 1300 }); }
  function sIron() { if (!fxGate(0.04)) return; osc('triangle', 2350, 0, 0.16, 0.05); osc('square', 1180, 0, 0.05, 0.03, { lp: 3200 }); noise(0, 0.07, 0.1, 'highpass', 5200); }
  function sPortal() { osc('sine', 260, 0, 0.26, 0.08, { to: 1500 }); osc('sine', 1500, 0.1, 0.22, 0.05, { to: 420 }); }
  function sSwitch() { osc('square', 660, 0, 0.07, 0.04, { lp: 2000 }); noise(0.05, 0.55, 0.2, 'highpass', 3200); [84, 88, 91, 96].forEach(function (m, i) { osc('sine', mtof(m), 0.08 + i * 0.05, 0.3, 0.05); }); }
  function sShieldUp() { osc('sine', 220, 0, 0.45, 0.06, { to: 660 }); osc('triangle', 660, 0.2, 0.25, 0.03); }
  function sGlass() { if (!fxGate(0.05)) return; osc('sine', 2600, 0, 0.09, 0.035); osc('sine', 3900, 0, 0.05, 0.015); }
  function sBelt() { if (!fxGate(0.08)) return; osc('sine', 110, 0, 0.09, 0.12, { to: 70 }); noise(0, 0.05, 0.05, 'lowpass', 600); }
  function sWell() { osc('sine', 90, 0, 0.7, 0.1, { to: 45 }); osc('sine', 180, 0.05, 0.6, 0.03, { to: 120 }); }
  function sWind() { noise(0, 0.6, 0.07, 'bandpass', 900, 0.6); }
  function sSplit() { osc('triangle', 700, 0, 0.12, 0.07, { to: 1400 }); osc('triangle', 1050, 0.05, 0.14, 0.05, { to: 2100 }); }
  // Each level has its own loop (arcade-music.js songs.peggleLevels, in LEVELS order). Levels past those
  // play a variation of one of them (mus: [song, semitones up, tempo factor]).
  var songVar = {};
  function levelSong(n) {
    var s = ArcadeMusic.songs.peggleLevels, d = LEVELS && LEVELS[n - 1];
    if (!s) return ArcadeMusic.songs.peggle;
    if (d && d.mus) {
      if (!songVar[n]) {
        var b = s[d.mus[0] % s.length], v = {}, k;
        for (k in b) v[k] = b[k];
        v.lead = b.lead.map(function (m) { return m ? m + d.mus[1] : 0; });
        v.bass = b.bass.map(function (m) { return m ? m + d.mus[1] : 0; });
        v.eighth = b.eighth * d.mus[2];
        songVar[n] = v;
      }
      return songVar[n];
    }
    return s[(n - 1) % s.length] || ArcadeMusic.songs.peggle;
  }
  var Mus = ArcadeMusic.create({ key: 'peggle_music', song: levelSong(1), ctx: ac, out: function () { return master; } });
  function sLose() { [64, 60, 57, 52].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.18, 0.3, 0.08); }); }
  function sLastBall() { osc('square', 440, 0, 0.1, 0.035, { lp: 1800 }); osc('square', 440, 0.16, 0.1, 0.035, { lp: 1800 }); }
  function sBucket(big) {
    [60, 64, 67, 72].forEach(function (m) { osc('triangle', mtof(m + (big ? 12 : 0)), 0, 0.9, 0.06); });
    for (var i = 0; i < 6; i++) osc('sine', mtof(96 + (i % 3) * 4), 0.05 + i * 0.05, 0.12, 0.04);
  }
  // Drum roll that builds while the camera zooms toward the last orange peg.
  var drumBus = null;
  function sDrum(dur) {
    var a = ac(); if (!a) return;
    drumBus = a.createGain(); drumBus.gain.value = 1; drumBus.connect(master);
    var t = 0, k = 0;
    while (t < dur && k < 120) {
      var p = t / dur, step = 0.085 - 0.05 * p;
      noise(t, 0.06, 0.05 + 0.13 * p, 'bandpass', 1900, 0.7, drumBus);
      osc('sine', 120 + 30 * p, t, 0.07, 0.03 + 0.04 * p, { dest: drumBus });
      t += step; k++;
    }
  }
  function stopDrum() {
    if (!drumBus || !AC) return;
    try { drumBus.gain.setTargetAtTime(0.0001, AC.currentTime, 0.03); } catch (e) {}
    drumBus = null;
  }
  function sCrash() { noise(0, 1.8, 0.28, 'highpass', 4500, 0.5); noise(0, 0.5, 0.25, 'lowpass', 180, 0.7); osc('sine', 70, 0, 0.6, 0.25, { to: 40 }); }
  // "Ode to Joy" fanfare for Extreme Fever
  function sOde() {

    bars.forEach(function (ch, i) { ch.forEach(function (m) { osc('triangle', mtof(m), 0.3 + i * 4 * beat, 4 * beat * 0.95, 0.04); }); });
    [60, 64, 67, 72, 76].forEach(function (m) { osc('triangle', mtof(m), t, 1.8, 0.06); osc('sine', mtof(m + 12), t, 1.4, 0.025); });

  // ═══ Levels ═══════════════════════════════════════════════════════════════
  // Each level is handcrafted from pegs, bricks (capsules) and optional moving
  // groups. Orange and green pegs are picked with a fixed seed per level so a
  // level always looks the same.
  // Later levels add special pieces (extras: bumpers, switches, shields, belts, steel walls; they collide but are
  // never cleared) and zones the ball flies through (portals, gravity wells, wind, splitters). While building:
  //   B.w      weight for picking orange pegs (higher = more likely orange; puts oranges in the hard spots)
  //   B.iron   pegs take two hits          B.phase  {per, duty, off(x,y)}: ghost pegs that come and go
  //   B.kind   'shield' | 'wall': bricks made now are that kind of extra (B.grp: which switch drops a shield)
  function Builder() {
    var objs = [], extras = [], zones = [], B = { objs: objs, extras: extras, zones: zones, mov: null, w: 1, iron: 0, phase: null, kind: null, grp: 1 };
    B.peg = function (x, y) {
      if (x < 14 || x > FW - 14 || y < 92 || y > 566) return;
      for (var i = 0; i < objs.length; i++) {
        var o = objs[i];
        if (o.k === 'peg' && o.mov === B.mov && Math.abs(o.bx - x) < 18 && Math.abs(o.by - y) < 18 && Math.hypot(o.bx - x, o.by - y) < 18) return;
      }
      var p = { k: 'peg', bx: x, by: y, r: PR, mov: B.mov };
      if (B.w !== 1) p.w = B.w;
      if (B.iron) { p.iron = 1; p.hp = 2; }
      if (B.phase) p.ph = { per: B.phase.per, duty: B.phase.duty, off: B.phase.off ? B.phase.off(x, y) : 0 };
      objs.push(p);
    };
    B.brick = function (x1, y1, x2, y2) {
      var o = { k: 'brick', bx: x1, by: y1, bx2: x2, by2: y2, r: KR, mov: B.mov };
      if (B.kind) { o.t = B.kind; o.grp = B.grp; extras.push(o); return; }
      if (B.w !== 1) o.w = B.w;
      objs.push(o);
    };
    B.bumper = function (x, y, r) { extras.push({ k: 'peg', t: 'bump', bx: x, by: y, r: r || 14, mov: B.mov }); };
    B.sw = function (x, y, grp) { extras.push({ k: 'peg', t: 'sw', bx: x, by: y, r: PR + 1, grp: grp || 1, mov: B.mov }); };
    // a conveyor belt: v is the belt's speed from (x1,y1) toward (x2,y2); negative runs the other way
    B.belt = function (x1, y1, x2, y2, v) { extras.push({ k: 'brick', t: 'belt', bx: x1, by: y1, bx2: x2, by2: y2, r: 6, belt: v, mov: null }); };
    // portals come in pairs: a ball that falls into one comes out of the other, still moving the same way
    B.portal = function (x1, y1, x2, y2, col) {
      var a = { t: 'portal', x: x1, y: y1, r: 15, col: col }, b = { t: 'portal', x: x2, y: y2, r: 15, col: col };
      a.to = b; b.to = a; zones.push(a, b);
    };
    B.well = function (x, y, R, K) { zones.push({ t: 'well', x: x, y: y, R: R, K: K }); };
    // wind band: ax is the push (units/s²); gust > 0 makes it swing from one side to the other
    B.wind = function (x, y, w, h, ax, gust) { zones.push({ t: 'wind', x: x, y: y, w: w, h: h, ax: ax, gust: gust || 0, drift: 0 }); };
    B.split = function (x, y, r) { zones.push({ t: 'split', x: x, y: y, r: r || 16 }); };
    // n pegs spaced along a closed path fn(s), s in 0..1, going round lps laps a second
    B.track = function (n, fn, lps) {
      var c = fn(0);
      for (var i = 0; i < n; i++) B.group({ t: 'path', fn: fn, w: lps, ph: i / n, cx: c[0], cy: c[1] }, function () { B.peg(c[0], c[1]); });
    };
    B.arc = function (cx, cy, r, a0, a1, n, ry) {
      for (var i = 0; i < n; i++) { var a = a0 + (a1 - a0) * (n === 1 ? 0.5 : i / (n - 1)); B.peg(cx + r * Math.cos(a), cy + (ry || r) * Math.sin(a)); }
    };
    B.ring = function (cx, cy, r, n, a0) { for (var i = 0; i < n; i++) { var a = (a0 || 0) + TAU * i / n; B.peg(cx + r * Math.cos(a), cy + r * Math.sin(a)); } };
    B.arcBricks = function (cx, cy, r, a0, a1, n) {
      var dA = (a1 - a0) / n, sh = (KR + 2.5) / r;
      for (var i = 0; i < n; i++) {
        var s = a0 + i * dA + sh, e = a0 + (i + 1) * dA - sh;
        B.brick(cx + r * Math.cos(s), cy + r * Math.sin(s), cx + r * Math.cos(e), cy + r * Math.sin(e));
      }
    };
    B.lineBricks = function (x1, y1, x2, y2, n) {
      var L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L, seg = L / n, sh = KR + 2.5;
      for (var i = 0; i < n; i++) {
        var a = i * seg + sh, b = (i + 1) * seg - sh;
        B.brick(x1 + ux * a, y1 + uy * a, x1 + ux * b, y1 + uy * b);
      }
    };
    B.row = function (y, x0, x1, step) { for (var x = x0; x <= x1 + 0.1; x += step) B.peg(x, y); };
    // Hex lattice centred on x=180 so shapes stay symmetric
    B.lattice = function (test, sp, y0, y1) {
      var row = 0;
      for (var y = y0; y <= y1 + 0.1; y += sp * 0.866, row++) {
        var off = row % 2 ? sp / 2 : 0;
        for (var k = -12; k <= 12; k++) { var x = 180 + off + k * sp; if (x >= 14 && x <= FW - 14 && test(x, y)) B.peg(x, y); }
      }
    };
    B.group = function (mov, fn) { mov.cx = mov.cx || 0; mov.cy = mov.cy || 0; B.mov = mov; fn(); B.mov = null; };
    return B;
  }

      return { extras: extras.map(function (o) { return { t: o.t, x: o.x, y: o.y, off: !!o.off, on: !!o.on, grp: o.grp }; }),
        zones: zones.map(function (z) { return { t: z.t, x: z.x, y: z.y }; }), open: Object.keys(L.open || {}),
        iron: objs.filter(function (o) { return o.iron && !o.gone; }).map(function (o) { return { i: o.i, hp: o.hp, c: o.c, lit: o.lit }; }),
        ghosts: phasers.filter(function (o) { return !o.gone; }).length, ghostsOff: phasers.filter(function (o) { return o.off && !o.gone; }).length,
        orangeIdx: objs.filter(function (o) { return o.c === 'o' && !o.gone; }).map(function (o) { return o.i; }), balls: balls.length, stats: L.stats,
        bucket: L.fever ? null : bucketX(wt), movers: movers.slice(0, 3).map(function (o) { return [o.x, o.y]; }) };
    },
    // tests: drop a ball anywhere with any speed
    drop: function (x, y, vx, vy) { if (!L || state !== 'aim') return false; fire(); balls = [newBall(x, y, vx, vy)]; return true; },
    // tests: for each orange peg left, is there a launcher angle whose path reaches it (lighting and iron ignored)?
    reach: function () {
      var want = {}, got = {};
      objs.forEach(function (o) { if (o.c === 'o' && !o.gone && !o.lit) want[o.i] = 1; });
      for (var d = -87; d <= 87; d += 0.5) {
        var a = d * PI / 180, dx = Math.sin(a), dy = Math.cos(a);
        simulate(LX + dx * BARREL, LY + dy * BARREL, dx * V0, dy * V0, 4, function (b, o) { if (o && want[o.i]) got[o.i] = 1; return null; });
      }
      return Object.keys(want).filter(function (k) { return !got[k]; }).map(Number);
    },
    open: function (g) { L.open[g || 1] = 1; setShields(); },
    tune: function (e, g) { E_PEG = e; GRAV = g; }
  };

  // ═══ Boot ════════════════════════════════════════════════════════════════
  try { if (typeof peggleOld === 'function') peggleOld(true); } catch (e) {}
  var saved = loadSave();
  if (saved) startLevel(saved.n, { who: saved.who, master: saved.master, fireMode: saved.fireMode }, saved);
  else showSetup();
})();
</script>

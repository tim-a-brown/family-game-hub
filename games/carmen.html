<style>
/* Pixel fonts: Press Start 2P and Jersey 10 (SIL Open Font License, see fonts/) */
@font-face{font-family:"Press Start 2P";src:url("../fonts/press-start-2p.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Jersey 10";src:url("../fonts/jersey-10.woff2") format("woff2");font-display:swap;}
:root{--px:"Press Start 2P",ui-monospace,monospace;--vt:"Jersey 10",ui-monospace,monospace;
  --steel:#a8acb8;--steel-hi:#e4e6ee;--steel-lo:#5a5e6c;--navy:#0a0c2e;--crt:#7df0ff;--amber:#ffd860;--red:#e8262e;}
html,body{overflow:hidden;overscroll-behavior:none;}
/* the bottom keys clear the home bar and the screen's rounded corners */
.cs{position:relative;display:grid;gap:8px;height:calc(100dvh - var(--bar));padding:4px 8px calc(var(--safe-b) + var(--corner-y) + 16px);
  grid-template-rows:auto auto minmax(70px,1fr) auto;grid-template-areas:"head" "pic" "text" "act";max-width:720px;margin:0 auto;}
@media (orientation:landscape) and (min-width:640px){
  .cs{max-width:1240px;grid-template-columns:minmax(0,1fr) minmax(250px,32%);grid-template-rows:auto minmax(0,1fr) clamp(76px,20vh,170px);
    grid-template-areas:"head act" "pic act" "text act";}
  /* the picture keeps its 16:10 shape inside whatever room it gets */
  .cs-picw{container-type:size;min-height:0;}
  .cs-picw .cs-pic{width:min(100cqw,160cqh);}
}
/* phones held sideways: the city and clock stack beside the picture, the text runs under both */
@media (orientation:landscape) and (min-width:640px) and (max-height:560px){
  .cs{grid-template-columns:minmax(0,1fr) minmax(140px,190px) minmax(220px,30%);grid-template-rows:minmax(0,1fr) clamp(64px,24vh,110px);
    grid-template-areas:"pic head act" "text text act";gap:6px;padding-top:2px;}
  .cs .cs-head{flex-direction:column;}
  .cs .cs-city b{white-space:normal;font-size:.62rem;}
  .cs .cs-time{flex:1;}
  .cs .cs-time b{font-size:.5rem;white-space:normal;}
  .cs .key{min-height:40px;padding:6px 8px;}
  .cs .cs-act{padding:6px;gap:6px;}
}
/* Beveled steel panels, like the 1990s PC version's chrome */
.bevel{background:linear-gradient(180deg,#b8bcc8,#9a9eac);border-radius:3px;
  box-shadow:inset 2px 2px 0 var(--steel-hi),inset -2px -2px 0 var(--steel-lo),0 3px 8px rgba(0,0,0,.45);}
.cs-head{grid-area:head;display:flex;align-items:stretch;gap:8px;padding:5px;min-width:0;}
.cs-city{flex:1;min-width:0;background:var(--navy);border-radius:2px;padding:7px 10px;box-shadow:inset 2px 2px 0 #000,inset -1px -1px 0 #3a3e5a;}
.cs-city b{display:block;font:400 clamp(.72rem,2.4vw,1rem)/1.25 var(--px);color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 #5a2a00;}
.cs-city small{display:block;font:400 1.15rem/1 var(--vt);color:#a8b4ff;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cs-time{display:flex;align-items:center;gap:8px;background:var(--navy);border-radius:2px;padding:4px 10px 4px 6px;box-shadow:inset 2px 2px 0 #000,inset -1px -1px 0 #3a3e5a;}
.cs-time canvas{width:40px;height:40px;image-rendering:pixelated;}
.cs-time b{display:block;font:400 clamp(.62rem,2vw,.8rem)/1.2 var(--px);color:#fff;white-space:nowrap;}
.cs-time small{display:block;font:400 1.05rem/1 var(--vt);color:#ff8a8a;margin-top:4px;white-space:nowrap;}
.cs-time.late small{animation:blink .8s steps(2) infinite;}
@keyframes blink{50%{opacity:.25;}}
.cs-picw{grid-area:pic;display:grid;place-items:center;}
.cs-pic{position:relative;aspect-ratio:16/10;width:100%;padding:6px;overflow:hidden;}
.cs-pic > canvas,.cs-scr{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);image-rendering:pixelated;background:#000;}
.cs-pic::after{content:"";position:absolute;inset:6px;pointer-events:none;z-index:8;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),radial-gradient(120% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.35));}
.cs-pic canvas.wipe{animation:wipe .7s steps(12) both;}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}
.cs-pic canvas.fade{animation:fadein .5s steps(5) both;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.cs-ov{position:absolute;inset:6px;z-index:5;pointer-events:none;}
.cs-ov > *{pointer-events:auto;}
.cs-text{grid-area:text;overflow-y:auto;background:#000;border-radius:3px;padding:8px 12px;color:#e8f4ff;font:400 clamp(1.25rem,3.6vw,1.5rem)/1.12 var(--vt);
  box-shadow:inset 0 0 0 2px #3a3e5a,inset 0 0 0 4px #000,inset 0 0 0 5px #6a6e84;text-shadow:0 0 6px rgba(140,220,255,.35);cursor:pointer;}
.cs-text .who{display:block;font:400 .6rem/1.4 var(--px);color:var(--crt);margin-bottom:4px;letter-spacing:.04em;}
.cs-text em{font-style:normal;color:var(--amber);}
.cs-text .caret{display:inline-block;width:.5em;height:.9em;background:#e8f4ff;vertical-align:-.1em;animation:blink .6s steps(2) infinite;}
.cs-text .sub{color:#9aa4c8;}
.cs-text.warn{color:#ffb0b0;}
/* a message added below the one you were reading (night falls, the witness after a scare) */
.cs-text .more{display:block;margin-top:10px;padding-top:8px;border-top:1px dashed rgba(125,240,255,.3);}
.cs-text .more.warn{color:#ffb0b0;}
/* the action side */
.cs-act{grid-area:act;display:flex;flex-direction:column;gap:8px;padding:8px;min-height:0;}
.cs-act h4{font:400 .62rem/1.3 var(--px);color:#1a1c2e;margin:2px 2px 0;text-shadow:1px 1px 0 rgba(255,255,255,.5);}
.cs-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cs-btns > :only-child{grid-column:1/-1;}
@media (orientation:landscape) and (min-width:640px){ .cs-btns{grid-template-columns:1fr;} .cs-act{overflow-y:auto;} }
.key{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 10px;border:0;border-radius:3px;cursor:pointer;text-align:left;color:#14162a;
  background:linear-gradient(180deg,#d4d8e2,#b0b4c2);font:400 clamp(.56rem,1.9vw,.7rem)/1.35 var(--px);
  box-shadow:inset 2px 2px 0 #f4f6fc,inset -2px -2px 0 #6a6e7c,0 2px 0 #2a2c3a;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.key:active:not(:disabled){transform:translateY(2px);box-shadow:inset 2px 2px 0 #6a6e7c,inset -2px -2px 0 #f4f6fc;}
.key:disabled{opacity:.5;cursor:default;}
.key svg{width:26px;height:26px;flex:none;shape-rendering:crispEdges;}
.key .lb{flex:1;min-width:0;}
.key .lb small{display:block;font:400 1.05rem/1 var(--vt);color:#3a3e5a;margin-top:3px;}
.key.go{background:linear-gradient(180deg,#ffd860,#e8a828);box-shadow:inset 2px 2px 0 #fff2b0,inset -2px -2px 0 #9a6410,0 2px 0 #3a2400;}
.key.red{background:linear-gradient(180deg,#ff6a6a,#c82a2a);color:#fff;box-shadow:inset 2px 2px 0 #ffb0b0,inset -2px -2px 0 #7a1010,0 2px 0 #3a0000;}
.key.on{background:linear-gradient(180deg,#9ae8ff,#5ab8e0);}
.key.seen{background:linear-gradient(180deg,#b8bcc8,#9a9eac);color:#3a3e5a;}
.key.hot{outline:3px solid var(--amber);outline-offset:1px;}
.cs-list{display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;}
.cs-back{min-height:44px;justify-content:center;}
.trait{display:flex;align-items:center;gap:8px;}
.trait span{width:74px;flex:none;font:400 .55rem/1 var(--px);color:#1a1c2e;}
.trait .key{flex:1;min-height:42px;justify-content:center;text-align:center;}
/* map overlay */
.dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;box-shadow:0 0 0 2px #000;image-rendering:pixelated;}
.dot.opt{background:var(--amber);animation:blink .5s steps(2) infinite;}
.dot.opt.hot{animation:none;background:#fff;transform:scale(1.4);}
.dot.here{background:var(--red);}
.dot i{position:absolute;left:12px;top:-6px;white-space:nowrap;font:400 .5rem/1 var(--px);color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;font-style:normal;}
.dot.left i{left:auto;right:12px;}
.plane{position:absolute;width:32px;height:20px;margin:-10px 0 0 -16px;image-rendering:pixelated;z-index:3;}
.trailline{position:absolute;inset:0;width:100%;height:100%;}
/* witness, henchman, dossier, crt */
.wit{position:absolute;right:3%;bottom:0;width:30%;aspect-ratio:48/56;image-rendering:pixelated;border:3px solid #000;box-shadow:0 0 0 2px #c8ccd8;bottom:4%;animation:pop .3s steps(4) both;}
@keyframes pop{from{transform:translateY(40%);opacity:0;}}
.hench{position:absolute;bottom:6%;height:52%;aspect-ratio:20/34;image-rendering:pixelated;animation:dash 1.1s steps(14) both;}
@keyframes dash{from{left:-15%;}to{left:110%;}}
.zzz{position:absolute;inset:0;background:rgba(0,0,30,.72);display:grid;place-items:center;font:400 1.4rem/1 var(--px);color:#fff;animation:fadein .4s steps(4) both;}
.zzz b{animation:float 1.2s steps(6) infinite;}
@keyframes float{50%{transform:translateY(-10px);}}
.crt{position:absolute;inset:0;background:#020a02;color:#58f070;font:400 clamp(1rem,2.6vw,1.35rem)/1.05 var(--vt);padding:6px 10px;overflow:hidden;text-shadow:0 0 6px rgba(88,240,112,.6);}
.crt .h{font:400 clamp(.45rem,1.4vw,.6rem)/1.6 var(--px);color:#a8ffb8;}
.crt .m{color:#fff;}
.dossier{position:absolute;inset:0;display:flex;gap:4%;padding:4%;background:#efe6cc;color:#2a2010;
  background-image:repeating-linear-gradient(180deg,transparent 0 22px,rgba(90,120,200,.25) 22px 23px);overflow:hidden;}
.dossier canvas{height:100%;aspect-ratio:48/56;image-rendering:pixelated;border:3px solid #2a2010;background:#000;flex:none;}
.dossier .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font:400 clamp(1rem,2.6vw,1.3rem)/1.05 var(--vt);}
.dossier .tx b{font:400 clamp(.5rem,1.7vw,.72rem)/1.3 var(--px);color:#8a1010;margin-bottom:4px;}
.dossier .tx p{margin:4px 0 0;color:#5a4a30;}
.dossier .tx span{color:#5a4a30;}
.notes{position:absolute;inset:0;background:#efe6cc;color:#2a2010;padding:3% 4%;overflow-y:auto;font:400 clamp(1rem,2.6vw,1.25rem)/1.1 var(--vt);
  background-image:repeating-linear-gradient(180deg,transparent 0 22px,rgba(90,120,200,.25) 22px 23px);}
.notes b{font:400 .55rem/1.6 var(--px);color:#8a1010;display:block;margin-top:6px;}
.warrant{position:absolute;left:12%;right:12%;top:8%;bottom:8%;background:#f4ecd4;color:#2a2010;border:4px double #5a4a30;padding:4%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  font:400 clamp(1rem,2.6vw,1.3rem)/1.05 var(--vt);animation:slidein .5s steps(8) both;}
.warrant b{font:400 clamp(.5rem,1.8vw,.8rem)/1.3 var(--px);color:#2a2010;}
.warrant .stamp{font:400 clamp(.55rem,2vw,.9rem)/1 var(--px);color:#c81e24;border:3px solid #c81e24;padding:6px 8px;transform:rotate(-10deg);animation:stamp .35s .6s steps(4) both;}
@keyframes slidein{from{transform:translateY(-110%);}}
@keyframes stamp{from{transform:rotate(-10deg) scale(3);opacity:0;}}
.bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,#3a3e4a 9% 11%,#8a8e9a 11% 12%,transparent 12% 16%);animation:barsdown .6s steps(10) both;}
@keyframes barsdown{from{transform:translateY(-100%);}}
.siren{position:absolute;inset:0;animation:siren .5s steps(2) infinite;mix-blend-mode:screen;}
@keyframes siren{0%{background:rgba(255,0,0,.35);}50%{background:rgba(0,60,255,.35);}}
.big{position:absolute;left:0;right:0;top:38%;text-align:center;font:400 clamp(.9rem,4vw,1.8rem)/1.3 var(--px);color:var(--amber);text-shadow:3px 3px 0 #000,-1px -1px 0 #000;animation:zoom .5s steps(6) both;}
@keyframes zoom{from{transform:scale(3);opacity:0;}}
.flash{position:absolute;inset:0;background:#fff;animation:flashout .5s steps(5) forwards;}
@keyframes flashout{to{opacity:0;}}
.cs-ov .ttl{position:absolute;left:2%;right:2%;top:4%;text-align:center;font:400 clamp(.42rem,1.7vw,.8rem)/1.4 var(--px);color:#fff;text-shadow:2px 2px 0 #8a1010;}
.cs-ov .ttl b{display:block;color:var(--amber);font-size:1.45em;line-height:1.25;margin:2px 0;text-shadow:3px 3px 0 #8a1010;}
.cs-ov .ttl small{display:block;color:#ff8a8a;font-size:.7em;margin-top:2px;letter-spacing:.3em;}
.cs-pic.shake{animation:shake .35s steps(6);}
@keyframes shake{25%{transform:translate(-5px,2px);}50%{transform:translate(4px,-3px);}75%{transform:translate(-3px,1px);}}
@media (prefers-reduced-motion:reduce){.dot.opt,.cs-text .caret{animation:none;}}
</style>

    $.ov.appendChild(el('div', { class: 'ttl', html: esc(words[0]) + ' is<b>Carmen Sandiego?</b><small>' + esc(V[C.v].name.toUpperCase()) + '</small>' }));
    playTheme(true);
    say('Welcome to the ACME Detective Agency, <em>' + esc(C.player) + '</em>. Rank: <em>' + RANKS[C.rank][0] + '</em>. Cases solved: ' + car.solved + '.' +
      (C.rank < RANKS.length - 1 ? ' <span class="sub">Next rank, ' + RANKS[C.rank + 1][0] + ', after ' + RANKS[C.rank + 1][1] + ' arrests.</span>' : ''), 'ACME DETECTIVE AGENCY');
    panel('A new case', [keyBtn('star', 'Accept the case', RANKS[C.rank][2] + ' ' + V[C.v].unit + ' on the trail', briefing, 'go')]);
  }
  function briefing() {
    clearInterval(titleT); stopTheme(); Kit.gameStart();
    var S = SUS[C.sus], p = place(C.trail[0]);
    header(p); scenePic('wipe');
    panel('Your assignment', [keyBtn('mag', 'Start investigating', null, function () { busy = false; arrive(true); }, 'go')]);
    sfx('blip');
    var who = S.carmen ? 'Carmen Sandiego herself was' : 'A ' + S.sex.toLowerCase() + ' suspect was';
    save();
    return say('<em>*** FLASH ***</em> ' + (C.v === 'time' ? 'A treasure has been stolen from history! In ' + esc(p.name) + ', ' + yr(p.year) : 'National treasure stolen from ' + esc(p.name)) +
      '. The treasure: <em>' + esc(C.treasure) + '</em>. ' + who + ' seen at the scene of the crime. Track the thief to the hideout and make the arrest by <em>Sunday, 5 pm</em>. Good luck, ' + esc(RANKS[C.rank][0]) + ' ' + esc(C.player) + '.', 'ACME HEADQUARTERS');
  }

  // ── Setup ───────────────────────────────────────────────────────────────
  function showSetup() {
    clearInterval(titleT); stopTheme(); busy = false; app.innerHTML = '';
    Kit.setup(app, {
      modes: ORDER.map(function (k) { return { id: k, icon: V[k].icon, title: V[k].name, desc: V[k].desc + ' · ' + ((window.CARMEN_DATA[k] || []).length) + ' ' + V[k].unit }; }),
      mode: 'world', start: 'Report for duty',
      players: { min: 1, max: 1, count: 1, label: 'Detective' },
      onStart: function (cfg) { begin(cfg.mode, cfg.players[0].name); }
    });
  }

  Kit.init({
    id: 'carmen',
    onNew: function () { if (C && !C.over) { clearSave(); } C = null; showSetup(); },
    undo: undo,
    menu: [
      { icon: 'trophy', label: 'High scores', onClick: function () { ArcadeHi.show('carmen_' + (C ? C.v : 'world')); } },
      { icon: 'star', label: 'Career', onClick: careerSheet },
      { icon: 'history', label: 'Past cases', onClick: function () { Kit.history(HKEY, { title: 'Carmen Sandiego: past cases' }); } },
      { icon: 'users', label: 'Frequent players', onClick: function () { Kit.managePlayers(); } }
    ],
    rules:
      '<p class="goal">A V.I.L.E. thief has stolen a treasure. Follow the trail from city to city, get a warrant, and arrest the thief in the hideout by <b>Sunday at 5 pm</b>.</p>' +
      '<h3>Each city</h3><ul><li><b>Investigate</b>: question witnesses in three places. Each one costs time: 1 hour, then 2, then 3. Asking again costs 1 hour.</li>' +
      '<li>Witnesses on the right trail describe where the thief went next (a flag, money, a language, a landmark), and sometimes the thief: hair, hobby, a feature, a car.</li>' +
      '<li>If witnesses have never seen the thief, you are in the wrong city. Go back.</li>' +
      '<li>A dark figure dashing past means a V.I.L.E. henchman: you are on the right trail.</li></ul>' +
      '<h3>Travel</h3><ul><li><b>Depart</b> shows the places you can reach. Longer trips cost more hours. At 11 pm you stop to sleep until 7 am.</li></ul>' +
      '<h3>Crime computer</h3><ul><li>Enter the traits you have heard. When only one V.I.L.E. member fits, you get a <b>warrant</b> for them.</li>' +
      '<li>In the hideout city witnesses warn you the thief is close. Find the thief with the right warrant to make the arrest. No warrant, or the wrong one, and the thief goes free.</li></ul>' +
      '<h3>Ranks</h3><ul><li>Gumshoe, Private Eye (2 arrests), Investigator (5), Detective (9), Ace Detective (14), Super Sleuth (20). Higher ranks mean longer trails.</li>' +
      '<li>The 20th arrest is Carmen Sandiego herself. Each version keeps its own rank for each player.</li></ul>' +
      '<h3>Versions</h3><p>World, USA (all 50 states), Time (history, by Chronoskimmer), Europe, Asia, Africa and the Americas. Keep an atlas or encyclopedia handy, just like in 1985.</p>'
  });
  function careerSheet() {
    var name = C ? C.player : (Kit.player && Kit.player()) || '';
    var rows = ORDER.map(function (k) { var c = careerOf(name, k); return '<tr><td>' + V[k].name + '</td><td>' + RANKS[rankOf(c.solved)][0] + '</td><td style="text-align:right">' + c.solved + '</td><td style="text-align:right">' + (c.carmen ? 'Yes' : '') + '</td></tr>'; }).join('');
    Kit.sheet({ title: (name ? name + ': ' : '') + 'ACME career', html: '<table style="width:100%;border-collapse:collapse;font-size:.95rem"><tr style="text-align:left;opacity:.7"><th>Version</th><th>Rank</th><th style="text-align:right">Arrests</th><th style="text-align:right">Carmen</th></tr>' + rows + '</table>', actions: [{ label: 'Done', cls: 'btn-soft' }] });
  }

  // test hooks
  window.__cs = { C: function () { return C; }, place: place, fly: fly, win: win, lose: lose, caseFile: caseFile, investigate: investigate };

  // Resume a case in progress, or start at the setup screen
  var sv = rd(SAVE, null);
  if (sv && sv.C && !sv.C.over && window.CARMEN_DATA[sv.C.v]) {
    C = sv.C; UNDO = sv.U || []; loadData(C.v);
    if (!C.trail.every(function (id) { return BYID[id]; })) { clearSave(); showSetup(); }
    else { screen(); arrive(true); }
  } else showSetup();
})();
</script>
</body>
</html>

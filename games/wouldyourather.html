<style>
body{overflow-x:hidden;}
.wy{max-width:760px;margin:0 auto;padding:0 10px calc(var(--safe-b) + 18px);}
.wy .scores{margin-bottom:2px;}

/* Table */
.table{border-radius:24px;padding:8px;}
.table .felt-in{position:relative;border-radius:18px;padding:12px 12px 14px;overflow:hidden;}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px;}
.ttl h2{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1;color:#ffe08a;text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap;}
.ttl .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:999px;background:rgba(0,0,0,.28);color:rgba(255,255,255,.85);font-size:.74rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
.tag .ico{width:13px;height:13px;}
.tag.cat{background:var(--cc);color:#fff;}
.prompt{text-align:center;font-weight:900;color:#fff;font-size:1.02rem;margin:-2px 0 10px;min-height:1.3em;}
.prompt b{color:var(--c,#ffe08a);}

/* The two big choice cards */
.cards{position:relative;display:grid;grid-template-columns:1fr;gap:12px;}
.wcard.a .chips,.wcard.a .res{padding-bottom:24px;}
.wcard.b .txt{padding-top:28px;}
.wcard{--a:#2f8fe0;--b:#1b5aa8;position:relative;display:flex;flex-direction:column;min-height:158px;border-radius:18px;overflow:hidden;text-align:center;color:#fff;
  background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.22),transparent 60%),linear-gradient(160deg,var(--a),var(--b));
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.9),inset 0 0 0 7px rgba(0,0,0,.12),0 10px 22px rgba(0,0,0,.45);
  transition:transform .15s var(--ease),filter .35s,box-shadow .35s,opacity .35s;-webkit-tap-highlight-color:transparent;}
.wcard.b{--a:#f0606a;--b:#b42740;}
.wcard::before{content:attr(data-l);position:absolute;right:14px;top:6px;font-family:var(--display);font-size:3.2rem;line-height:1;color:rgba(255,255,255,.16);pointer-events:none;}
.wcard .txt{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 22px 14px;font-family:var(--display);font-weight:400;
  font-size:clamp(1.3rem,5.8vw,1.75rem);line-height:1.15;letter-spacing:.005em;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.18);}
.wcard.tap{cursor:pointer;}
.wcard.tap:active{transform:scale(.975);}
@media (hover:hover){.wcard.tap:hover{filter:brightness(1.07);}}
.wcard.in-a{animation:slideA .55s var(--spring) both;}
.wcard.in-b{animation:slideB .55s var(--spring) both;animation-delay:.08s;}
@keyframes slideA{from{transform:translateX(-115%) rotate(-6deg);opacity:0;}to{transform:none;opacity:1;}}
@keyframes slideB{from{transform:translateX(115%) rotate(6deg);opacity:0;}to{transform:none;opacity:1;}}
.cards.out .wcard{animation:slideOut .32s cubic-bezier(.5,0,.75,0) forwards;}
.cards.out .wcard.b{animation-delay:.05s;}
@keyframes slideOut{to{transform:translateX(-120%) rotate(-8deg);opacity:0;}}
.wcard.picked{transform:scale(1.03);box-shadow:inset 0 0 0 5px #fff,0 0 0 4px #ffd447,0 14px 30px rgba(0,0,0,.5);}
.wcard.dimmed{filter:saturate(.35) brightness(.7);}
.wcard.win{box-shadow:inset 0 0 0 5px #fff,0 0 0 4px #ffd447,0 0 34px rgba(255,212,71,.55),0 14px 30px rgba(0,0,0,.5);}
.wcard.lose{filter:saturate(.6) brightness(.82);}
.or{position:relative;justify-self:center;z-index:3;width:52px;height:52px;margin:-32px 0;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-size:1.15rem;color:#5a3a00;letter-spacing:.02em;
  background:radial-gradient(circle at 35% 30%,#fff3b8,#ffd447 45%,#d99a12);box-shadow:0 0 0 4px rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.18);
  animation:orin .5s var(--spring) .25s both;}
@keyframes orin{from{transform:scale(0) rotate(-90deg);}}
.cards.out .or{opacity:0;transition:opacity .2s;}

/* Voter chips inside a card */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 12px 14px;}
.vchip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 5px;border-radius:999px;border:0;font-weight:900;font-size:.9rem;
  background:rgba(0,0,0,.2);color:rgba(255,255,255,.75);transition:transform .15s var(--spring),background .15s,color .15s;-webkit-tap-highlight-color:transparent;}
.vchip .avatar{width:30px;height:30px;font-size:.82rem;}
.vchip.on{background:#fff;color:#1d1835;transform:scale(1.06);box-shadow:0 3px 8px rgba(0,0,0,.3);}
.vchip:active{transform:scale(.95);}
.vchip.drop{animation:drop .45s var(--spring) both;}
@keyframes drop{from{transform:translateY(-22px) scale(.6);opacity:0;}}

/* Result on a revealed card */
.res{padding:0 16px 14px;}
.res .row1{display:flex;align-items:baseline;justify-content:center;gap:8px;}
.res .pct{font-family:var(--display);font-size:2.3rem;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums;}
.res .cnt{font-weight:900;font-size:.9rem;color:rgba(255,255,255,.85);}
.bar{height:12px;border-radius:999px;background:rgba(0,0,0,.28);overflow:hidden;margin:6px 0 10px;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(180deg,#fff,#e9e4ff);transition:width 1.1s var(--ease);}
.res .chips{padding:0;}
.res .vchip{background:#fff;color:#1d1835;min-height:34px;font-size:.84rem;}
.res .vchip .avatar{width:26px;height:26px;}
.res .none{font-weight:800;font-size:.85rem;color:rgba(255,255,255,.7);}

/* Pass-the-phone cover */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 8px 18px;}
.cover .spot{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;color:#1a1033;
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 60%,#000));
  box-shadow:0 0 0 6px rgba(255,255,255,.1),0 0 50px color-mix(in srgb,var(--c) 50%,transparent);animation:pop .5s var(--spring) both;}
@keyframes pop{from{transform:scale(.6);opacity:0;}}
.cover h3{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.05;color:#fff;}
.cover p{color:rgba(255,255,255,.75);max-width:300px;font-weight:700;}
.cover .done{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.cover .done span{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 4px;border-radius:999px;background:rgba(0,0,0,.25);color:rgba(255,255,255,.8);font-size:.8rem;font-weight:800;}
.cover .done .avatar{width:22px;height:22px;font-size:.7rem;}
.cover .done .ico{width:14px;height:14px;color:#7ee2a8;}
.cover .btn{min-width:230px;margin-top:6px;}
.cover .back{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(260px,70vw);margin:4px 0 2px;}
.cover .back i{height:70px;border-radius:12px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 5px,transparent 5px 12px),linear-gradient(160deg,#2f8fe0,#1b5aa8);box-shadow:inset 0 0 0 4px rgba(255,255,255,.85);}
.cover .back i+i{background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 5px,transparent 5px 12px),linear-gradient(160deg,#f0606a,#b42740);}

/* Controls under the table */
.acts{display:flex;gap:10px;margin-top:12px;}
.acts .btn{flex:1;}
.acts .btn.sq{flex:0 0 auto;padding:0 18px;}
.hint{text-align:center;color:var(--text-3);font-size:.85rem;font-weight:700;margin-top:8px;}

/* End screen */
.sum{display:flex;flex-direction:column;gap:8px;}
.sum h3{font-family:var(--display);font-weight:400;font-size:1.6rem;color:#ffe08a;text-align:center;margin:4px 0 2px;}
.sum .q{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.25);color:#fff;font-weight:800;font-size:.88rem;line-height:1.25;}
.sum .q .t{flex:1;min-width:0;}
.sum .q .t s{text-decoration:none;color:rgba(255,255,255,.55);font-weight:700;}
.sum .q .n{flex:none;font-family:var(--display);font-size:1rem;color:#ffe08a;white-space:nowrap;}

/* Setup categories */
.cats{display:flex;flex-wrap:wrap;gap:6px;}
.cats .chip{min-height:40px;}
.cats .chip .ico{width:16px;height:16px;}
.cats .chip.on{background:var(--cc,var(--accent));color:#fff;}
.cats .chip .n{opacity:.7;font-size:.78rem;}

/* History extra */
.hx{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
.hx div{padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.04);font-size:.84rem;font-weight:700;color:var(--text-2);line-height:1.3;}
.hx b{color:var(--text);}
.hx em{font-style:normal;color:var(--text-3);}

@media (min-width:700px){
  .cards{grid-template-columns:1fr 1fr;gap:22px;}
  .or{position:absolute;left:50%;top:50%;margin:-28px 0 0 -28px;width:56px;height:56px;}
  .wcard.a .chips,.wcard.a .res{padding-bottom:14px;}
  .wcard.b .txt{padding-top:20px;}
  .wcard{min-height:240px;}
  .wcard .txt{font-size:1.75rem;}
  .ttl h2{font-size:1.8rem;}
}
</style>
</head>

    if (!voted) app.appendChild(el('div', { class: 'acts' }, [el('button', { type: 'button', class: 'btn btn-ghost', html: Kit.icon('right') + '<span>Skip this question</span>', onclick: skip })]));
  }

  // ── Stats and the end ─────────────────────────────────────────────────────
  function stats() {
    var P = S.players, n = P.length, agree = [], lone = P.map(function () { return 0; }), unan = [], splits = [];
    for (var i = 0; i < n; i++) { agree.push([]); for (var j = 0; j < n; j++) agree[i].push([0, 0]); }
    S.log.forEach(function (l) {
      var a = [], b = [];
      l.v.forEach(function (v, i) { if (v === 'a') a.push(i); else if (v === 'b') b.push(i); });
      for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) if (l.v[i] && l.v[j]) { agree[i][j][1]++; if (l.v[i] === l.v[j]) agree[i][j][0]++; }
      var tot = a.length + b.length;
      if (tot > 2 && a.length === 1) lone[a[0]]++;
      if (tot > 2 && b.length === 1) lone[b[0]]++;
      if (tot > 1 && (!a.length || !b.length)) unan.push({ l: l, side: a.length ? 'a' : 'b' });
      if (tot > 1 && a.length === b.length) splits.push({ l: l, a: a.length, b: b.length });
    });
    return { agree: agree, lone: lone, unan: unan, splits: splits };
  }
  function short(s) { return s.length > 48 ? s.slice(0, 46) + '…' : s; }
  function lc(s) { return s.charAt(0).toLowerCase() + s.slice(1); }
  function finish() {
    if (!S || !S.log.length) return;
    S.phase = 'over'; busy = false;
    var P = S.players, n = N(), st = stats(), hl = [];
    // Best and worst matched pair
    var pairs = [];
    for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) { var x = st.agree[i][j]; if (x[1] >= 3) pairs.push({ i: i, j: j, k: x[0], of: x[1], r: x[0] / x[1] }); }
    pairs.sort(function (a, b) { return b.r - a.r || b.of - a.of; });
    if (pairs.length) {
      var best = pairs[0];
      hl.push({ w: 6, t: P[best.i].name + ' and ' + P[best.j].name + ' agreed on ' + best.k + ' of ' + best.of + ' questions' });
      var worst = pairs[pairs.length - 1];
      if (pairs.length > 1 && worst.r < 0.5) hl.push({ w: 5, t: P[worst.i].name + ' and ' + P[worst.j].name + ' only agreed ' + worst.k + (worst.k === 1 ? ' time' : ' times') + ' out of ' + worst.of });
    }
    var mx = Math.max.apply(null, st.lone);
    if (mx >= 2) { var r = st.lone.indexOf(mx); hl.push({ w: 5, t: 'Most independent thinker: ' + P[r].name + ', who stood alone ' + mx + ' times' }); }
    if (st.unan.length) {
      var u = st.unan[Math.floor(Math.random() * st.unan.length)], q = ALL[u.l.id];
      if (q) hl.push({ w: 4, t: 'Everyone would rather ' + lc(short(u.side === 'a' ? q.a : q.b)) + ' than ' + lc(short(u.side === 'a' ? q.b : q.a)) });
      if (st.unan.length >= 3) hl.push({ w: 2, t: 'Everyone agreed on ' + st.unan.length + ' of ' + S.log.length + ' questions' });
    }
    if (st.splits.length) {
      var s = st.splits[0], q2 = ALL[s.l.id];
      if (q2) hl.push({ w: 3, t: 'Split decision ' + s.a + '–' + s.b + ': ' + short(q2.a) + ' or ' + lc(short(q2.b)) });
    }
    var ord = P.map(function (p, i) { return i; }).sort(function (a, b) { return S.scores[b] - S.scores[a]; });
    var scored = S.score !== 'none';
    var top = scored && n > 1 && S.scores[ord[0]] > S.scores[ord[1]] ? P[ord[0]].name : null;
    if (top) hl.push({ w: 7, t: top + ' won with ' + S.scores[ord[0]] + (S.score === 'crowd' ? ' votes with the crowd' : ' votes against the crowd') });
    hl.sort(function (a, b) { return b.w - a.w; });
    var qs = S.log.slice(0, 40).map(function (l) {
      var q = ALL[l.id] || { a: '?', b: '?' }, va = l.v.filter(function (v) { return v === 'a'; }).length, vb = l.v.filter(function (v) { return v === 'b'; }).length;
      return { a: q.a, b: q.b, va: va, vb: vb, who: l.v.map(function (v) { return v || ''; }).join('') };
    });
    Kit.record(KEY, {
      started: S.started,
      mode: (S.mode === 'pass' ? 'Secret vote' : 'Quick vote') + (scored ? ' · ' + (S.score === 'crowd' ? 'Agree to score' : 'Be different') : ''),
      players: P.map(function (p, i) { return scored ? { name: p.name, score: S.scores[i] } : { name: p.name }; }),
      winner: top,
      summary: scored ? undefined : S.log.length + ' questions · ' + st.unan.length + ' agreed by all',
      rounds: scored ? { labels: S.log.map(function (l, k) { return 'Q' + (k + 1); }), scores: S.log.map(function (l) { return l.pts; }) } : undefined,
      highlights: hl.slice(0, 6).map(function (h) { return h.t; }),
      meta: { qs: qs }
    });
    clearSave(); undoStack = [];
    render();
    setTimeout(function () {
      if (!S || S.phase !== 'over') return;
      Kit.win({
        icon: scored ? 'trophy' : 'swap',
        title: scored ? (top ? top + ' wins!' : "It's a tie!") : "That's a wrap!",
        sub: S.log.length + ' questions · ' + st.unan.length + ' agreed by everyone',
        rank: scored ? ord.map(function (i) { return { name: P[i].name, score: S.scores[i], color: P[i].color }; }) : null,
        againLabel: 'Play again', again: again,
        extra: [{ label: 'Change settings', onClick: showSetup }],
        closeLabel: 'See the results', onClose: function () {}
      });
    }, 500);
  }
  function renderOver(felt) {
    var box = el('div', { class: 'sum' }, [el('h3', { text: 'How everyone voted' })]);
    S.log.forEach(function (l) {
      var q = ALL[l.id]; if (!q) return;
      var va = l.v.filter(function (v) { return v === 'a'; }).length, vb = l.v.filter(function (v) { return v === 'b'; }).length;
      var aw = va >= vb;
      box.appendChild(el('div', { class: 'q' }, [el('span', { class: 't', html: (aw ? esc(q.a) + ' <s>over ' + esc(lc(q.b)) + '</s>' : esc(q.b) + ' <s>over ' + esc(lc(q.a)) + '</s>') }), el('span', { class: 'n', text: Math.max(va, vb) + '–' + Math.min(va, vb) })]));
    });
    felt.appendChild(box);
    app.appendChild(el('div', { class: 'acts', style: { 'flex-direction': 'column' } }, [
      el('button', { type: 'button', class: 'btn btn-primary btn-lg btn-block', text: 'Play again', onclick: again }),
      el('button', { type: 'button', class: 'btn btn-soft btn-block', text: 'Change settings', onclick: showSetup }),
      el('button', { type: 'button', class: 'btn btn-ghost btn-block', html: Kit.icon('history') + '<span>Past games</span>', onclick: function () { Kit.history(KEY, { title: 'Would You Rather: past games', extra: histExtra }); } })
    ]));
  }
  function again() {
    var o = S;
    start({ mode: o.mode, players: o.players, options: { rounds: o.rounds, score: o.score } }, o.cats);
  }
  function histExtra(e) {
    if (!e || !Array.isArray(e.qs) || !e.qs.length) return null;
    var box = el('div', { class: 'hx' });
    e.qs.slice(0, 12).forEach(function (q) {
      var aw = q.va >= q.vb;
      box.appendChild(el('div', { html: '<b>' + esc(aw ? q.a : q.b) + '</b> <em>over</em> ' + esc(lc(aw ? q.b : q.a)) + ' <em>(' + Math.max(q.va, q.vb) + '–' + Math.min(q.va, q.vb) + ')</em>' }));
    });
    if (e.qs.length > 12) box.appendChild(el('div', { html: '<em>…and ' + (e.qs.length - 12) + ' more</em>' }));
    return box;
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = lsGet(SAVE, null);
  if (saved && saved.players && saved.deck && saved.phase && saved.phase !== 'over' && ALL[saved.deck[saved.qi]]) {
    S = saved;
    if (S.mode === 'pass' && S.phase === 'vote') S.phase = 'cover';   // keep the next vote secret
    anim = 'in'; render();
  } else showSetup();
  window.__wy = { state: function () { return S; }, all: ALL, total: TOTAL };
})();
</script>
</body>

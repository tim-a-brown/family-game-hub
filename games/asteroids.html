<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asteroids</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<style>
/* ── Play view: fills the screen, no page scroll ────────────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 50% at 50% 0%, rgba(110,110,255,.14) 0%, rgba(110,110,255,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 8px calc(var(--safe-b) + 8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.ar-hud{flex:none;display:flex;gap:6px;width:100%;}
.ar-plate{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 8px;border-radius:14px;
  background:linear-gradient(180deg,#1c1c3a 0%,#0e0e22 100%);
  box-shadow:inset 0 0 0 1.5px rgba(160,160,255,.3),inset 0 0 0 3.5px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.4);}
.ar-plate small{font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(200,200,255,.65);white-space:nowrap;}
.ar-plate b{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;}
.ar-plate.sc{flex:1.5;}
.ar-plate.sc b{color:#9ff3ff;text-shadow:0 0 14px rgba(90,220,255,.5),0 2px 0 rgba(0,0,0,.5);}
.ar-plate.bump b{animation:bounce .45s var(--spring);}
.ar-pbtn{flex:none;width:48px;border:0;border-radius:14px;display:grid;place-items:center;color:#d6d6ff;
  background:linear-gradient(180deg,#1c1c3a,#0e0e22);box-shadow:inset 0 0 0 1.5px rgba(160,160,255,.3),0 6px 16px rgba(0,0,0,.4);}
.ar-pbtn:active{transform:scale(.94);}
.ar-pbtn svg{width:22px;height:22px;}
.ar-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;}
.ar-cab{position:relative;padding:7px;border-radius:20px;}
.ar-cab canvas{display:block;border-radius:13px;background:#03030a;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.ar-cab::after{content:"";position:absolute;inset:7px;border-radius:13px;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 50%,transparent 62%,rgba(0,0,0,.5) 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.6);}
.ar-ov{position:absolute;inset:7px;border-radius:13px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(4,4,16,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(260px,84%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
.ar-hint{flex:none;font-size:.8rem;color:var(--text-3);text-align:center;font-weight:700;}
/* ── Touch deck: steering on the left, fire on the right ──────────────── */
.deck{flex:none;width:100%;max-width:520px;height:148px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.deck *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.stick{position:relative;width:138px;height:138px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#25254a 0%,#16162e 62%,#0d0d1f 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -6px 14px rgba(0,0,0,.45),0 0 0 5px rgba(0,0,0,.25),0 12px 24px rgba(0,0,0,.45);}
.stick::before{content:"";position:absolute;inset:16%;border-radius:50%;border:1.5px dashed rgba(160,170,255,.22);}
.stick .lab{position:absolute;left:0;right:0;top:7px;text-align:center;font-size:.56rem;font-weight:900;letter-spacing:.14em;color:rgba(255,170,90,.55);text-transform:uppercase;transition:color .1s;}
.stick.thr .lab{color:#ffb35c;}
.stick .nub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#e9edff,#9aa6ff 55%,#4b54b8);box-shadow:0 4px 0 #2a2f74,0 8px 16px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.6);}
.stick.thr .nub{background:radial-gradient(circle at 40% 32%,#fff3d6,#ffb35c 55%,#c0601a);box-shadow:0 4px 0 #7a3a0a,0 0 18px rgba(255,160,60,.6),inset 0 2px 0 rgba(255,255,255,.6);}
.btns{display:grid;grid-template-columns:62px 62px;grid-template-rows:62px 62px;gap:8px;}
.abtn{border:0;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#e6e8ff;
  background:linear-gradient(180deg,#2c2c58 0%,#1a1a38 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.16),inset 0 0 0 1.5px rgba(160,170,255,.28),0 4px 0 #090918,0 8px 14px rgba(0,0,0,.4);transition:transform .06s,box-shadow .06s;}
.abtn svg{width:28px;height:28px;}
.abtn.on{transform:translateY(3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.16),inset 0 0 0 1.5px rgba(160,170,255,.55),0 1px 0 #090918;}
.abtn.thrust{grid-column:1/3;color:#ffc27a;}
.abtn.thrust.on{background:linear-gradient(180deg,#5a3418,#3a1f0c);}
.right{position:relative;width:150px;height:138px;}
.fire{position:absolute;right:2px;bottom:4px;width:104px;height:104px;border-radius:50%;border:0;color:#fff;
  font-family:var(--display);font-size:1.25rem;letter-spacing:.06em;
  background:radial-gradient(circle at 40% 30%,#ff9aa8 0%,#f0435d 45%,#a3152c 100%);
  box-shadow:0 6px 0 #5e0a19,0 12px 22px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 5px rgba(0,0,0,.25);transition:transform .05s,box-shadow .05s;}
.fire.on{transform:translateY(4px);box-shadow:0 2px 0 #5e0a19,0 0 24px rgba(255,80,100,.55),inset 0 2px 0 rgba(255,255,255,.45),0 0 0 5px rgba(0,0,0,.25);}
.hyper{position:absolute;left:0;top:0;width:56px;height:56px;border-radius:50%;border:0;color:#cfe9ff;font-size:.56rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 40% 30%,#4a5a9a 0%,#28305e 60%,#171c3c 100%);
  box-shadow:0 4px 0 #0b0e22,0 8px 14px rgba(0,0,0,.45),inset 0 1.5px 0 rgba(255,255,255,.25),inset 0 0 0 1.5px rgba(140,190,255,.35);}
.hyper svg{width:20px;height:20px;}
.hyper.on{transform:translateY(3px);box-shadow:0 1px 0 #0b0e22,0 0 18px rgba(120,200,255,.6),inset 0 0 0 1.5px rgba(140,190,255,.6);}
@media (hover:hover) and (pointer:fine){ .ar-touch{display:none!important;} .ar-cab canvas{cursor:none;} }
@media (hover:none),(pointer:coarse){ .ar-desk{display:none!important;} }
@media (max-height:700px){ .ar-plate b{font-size:1.2rem;} .deck{height:122px;} .stick{width:116px;height:116px;} .stick .nub{width:46px;height:46px;margin:-23px 0 0 -23px;}
  .fire{width:88px;height:88px;} .right{height:116px;} .btns{grid-template-columns:54px 54px;grid-template-rows:54px 54px;} }
/* Tablet landscape: steering in the lower-left corner, fire in the lower-right, under the thumbs; the field sits between them */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px) and (pointer:coarse){
  html.ar-on #app{position:relative;}
  .ar-wrap{padding:0 196px;}
  .deck{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 16px);max-width:none;height:auto;align-items:flex-end;padding:0 20px;pointer-events:none;}
  .deck > *{pointer-events:auto;}
  .stick{width:164px;height:164px;} .stick .nub{width:62px;height:62px;margin:-31px 0 0 -31px;} .stick .lab{font-size:.62rem;top:9px;}
  .btns{grid-template-columns:72px 72px;grid-template-rows:72px 72px;gap:10px;}
  .right{width:170px;height:180px;}
  .fire{width:120px;height:120px;font-size:1.25rem;}
  .hyper{width:62px;height:62px;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), root = document.documentElement;
  var KEY = 'asteroids', HI = 'ast', SAVE = 'asteroids_state';
  var TOUCH = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  var PI = Math.PI, TAU = PI * 2;
  function fmt(n) { return Number(n).toLocaleString('en-US'); }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  // ═══ Tuning (world units; the short side of the field is 420 units) ══════
  var SHORT = 420;
  var TURN = 4.6, ACCEL = 250, MAXV = 330, DRAG = 0.72;     // rad/s, u/s², u/s, speed kept per second
  var SHIP_R = 10, B_SPEED = 430, B_LIFE = 0.95, MAX_B = 4, FIRE_GAP = 0.11, AUTO_GAP = 0.2;
  var ROCK_R = [0, 10, 19, 36], ROCK_PTS = [0, 100, 50, 20];
  var UFO_PTS = { big: 200, small: 1000 }, EXTRA_EVERY = 10000;

  // ═══ Sound: small WebAudio synth that follows the kit's sound setting ═══
  var AC = null, master = null, nbuf = null, thrustNode = null, ufoNode = null, soundOn = true, lastPoll = 0;
  function sndEnabled() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }
  function ac() {
    if (!soundOn) return null;
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      nbuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      var d = nbuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended' && !paused) { try { AC.resume(); } catch (e) {} }
    return AC;
  }
  function pollSound() {
    var now = Date.now(); if (now - lastPoll < 500) return; lastPoll = now;
    var was = soundOn; soundOn = sndEnabled();
    if (master) master.gain.value = soundOn ? 0.55 : 0;
    if (was && !soundOn) { setThrustSound(false); setUfoSound(null); }
  }
  function tone(f, t0, dur, type, vol, f2) {
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), gg = a.createGain(), t = a.currentTime + (t0 || 0);
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.006);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gg); gg.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function boom(dur, vol, freq, t0) {
    var a = ac(); if (!a) return;
    var s = a.createBufferSource(), f = a.createBiquadFilter(), gg = a.createGain(), t = a.currentTime + (t0 || 0);
    s.buffer = nbuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.25), t + dur);
    gg.gain.setValueAtTime(vol, t); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(gg); gg.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  function setThrustSound(on) {
    var a = on ? ac() : AC; if (!a) return;
    if (!thrustNode) {
      var s = a.createBufferSource(), f = a.createBiquadFilter(), gg = a.createGain();
      s.buffer = nbuf; s.loop = true; f.type = 'lowpass'; f.frequency.value = 520; gg.gain.value = 0;
      s.connect(f); f.connect(gg); gg.connect(master); s.start();
      thrustNode = gg;
    }
    thrustNode.gain.setTargetAtTime(on && soundOn ? 0.22 : 0, a.currentTime, 0.03);
  }
  function setUfoSound(kind) {
    var a = kind ? ac() : AC; if (!a) return;
    if (!ufoNode) {
      var o = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain(), gg = a.createGain();
      o.type = 'square'; lfo.type = 'triangle'; lg.gain.value = 0; gg.gain.value = 0;
      lfo.connect(lg); lg.connect(o.frequency); o.connect(gg); gg.connect(master); o.start(); lfo.start();
      ufoNode = { o: o, lfo: lfo, lg: lg, g: gg };
    }
    var t = a.currentTime, u = ufoNode;
    if (!kind || !soundOn) { u.g.gain.setTargetAtTime(0, t, 0.03); return; }
    u.o.frequency.setTargetAtTime(kind === 'big' ? 380 : 720, t, 0.02);
    u.lfo.frequency.setTargetAtTime(kind === 'big' ? 5 : 9, t, 0.02);
    u.lg.gain.setTargetAtTime(kind === 'big' ? 90 : 160, t, 0.02);
    u.g.gain.setTargetAtTime(0.022, t, 0.05);
  }
  var S = {
    fire: function () { tone(1200, 0, 0.09, 'square', 0.035, 260); },
    ufoFire: function () { tone(900, 0, 0.12, 'sawtooth', 0.025, 400); },
    rock: function (size) { boom([0, 0.22, 0.38, 0.6][size], [0, 0.35, 0.45, 0.6][size], [0, 2400, 1300, 700][size]); },
    beat: function (hi) { tone(hi ? 62 : 54, 0, 0.11, 'triangle', 0.22, hi ? 48 : 42); },
    die: function () { boom(1.3, 0.75, 1600); tone(240, 0.02, 1.1, 'sawtooth', 0.05, 40); },
    ufoDie: function () { boom(0.6, 0.55, 2600); tone(900, 0, 0.5, 'square', 0.035, 120); },
    life: function () { [880, 1175, 1480, 1760].forEach(function (f, i) { tone(f, i * 0.09, 0.14, 'square', 0.035); }); },
    hyper: function () { tone(180, 0, 0.35, 'sine', 0.09, 1800); tone(360, 0.05, 0.3, 'triangle', 0.05, 2600); },
    wave: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.08, 0.12, 'triangle', 0.06); }); }
  };

  // ═══ State ══════════════════════════════════════════════════════════════
  var G = null, view = 'none', paused = false, welcome = false;
  var WW = SHORT, WH = SHORT * 1.4;            // world size, fixed for a game
  var ship, bullets, rocks, ufo, parts, debris, rings, pops;
  var fx = { shake: 0, flash: 0, banner: null };
  var ctl = { left: false, right: false, thrust: false, fire: false, aim: null, hyper: false };
  var keys = {};

  function bestScore() { try { var l = JSON.parse(localStorage.getItem('hi_' + HI) || '[]'); return l.length ? l[0].score : 0; } catch (e) { return 0; } }

  // ═══ Kit shell ══════════════════════════════════════════════════════════
  Kit.init({
    id: 'asteroids',
    theme: { wood: ['#30325c', '#181a36'] },
    onNew: function () { clearSave(); showSetup(); },
    menu: [
      { icon: 'trophy', label: 'High scores', onClick: function () { pauseGame(); ArcadeHi.show(HI, 'Asteroids'); } },
      { icon: 'history', label: 'Past games', onClick: function () { pauseGame(); Kit.history(KEY, { title: 'Asteroids: past games' }); } }
    ],
    rules:
      '<p class="goal">Fly your ship, blast the space rocks and stay alive. Clear every rock to start the next wave.</p>' +
      '<h3>Flying</h3><ul><li>Your ship keeps drifting after you let go, just like in space. Thrust the other way to slow down.</li>' +
      '<li>Fly off one edge and you come back on the other side.</li>' +
      '<li><b>Stick</b> controls: push the left stick the way you want to point. Push it all the way out to fire the engine.</li>' +
      '<li><b>Button</b> controls: turn left, turn right and thrust buttons on the left.</li>' +
      '<li>The red button fires. Hold it down to keep firing. You can have 4 shots in the air at once.</li>' +
      '<li>Keyboard: <b>Left</b>/<b>Right</b> or A/D to turn, <b>Up</b> or W to thrust, <b>Space</b> to fire, <b>Shift</b> or <b>Down</b> for hyperspace, <b>P</b> to pause.</li></ul>' +
      '<h3>Hyperspace</h3><p>In a tight spot, jump to hyperspace. Your ship vanishes and pops up somewhere random. It\'s a gamble: you might land right next to a rock!</p>' +
      '<h3>Rocks</h3><ul><li>Big rocks split into two medium rocks, and medium rocks split into two small ones.</li>' +
      '<li>Big rock: <b>20</b>. Medium rock: <b>50</b>. Small rock: <b>100</b>.</li></ul>' +
      '<h3>Flying saucers</h3><ul><li>Now and then a saucer flies across and shoots at you.</li>' +
      '<li>The big saucer shoots wildly and is worth <b>200</b>. The small saucer aims at you and is worth <b>1,000</b>. Small saucers show up more as your score grows.</li></ul>' +
      '<h3>Ships</h3><p>You start with 3 ships and get an extra ship every <b>10,000</b> points. Touching a rock, a saucer or a saucer\'s shot costs a ship. A new ship waits for the middle to be clear before it appears.</p>' +
      '<p>If your score makes the top 15, enter your initials for the high-score board.</p>'
  });

  // ═══ Setup ══════════════════════════════════════════════════════════════
  function showSetup() {
    leaveGame();
    app.className = 'stage';
    var opts = [];
    if (TOUCH) opts.push({ id: 'steer', label: 'Steering', help: 'How you turn and fly the ship with your left thumb.',
      choices: [['stick', 'Stick', 'Push the stick where you want to point. Push it all the way to thrust.'],
        ['buttons', 'Buttons', 'Classic arcade style: turn left, turn right and thrust buttons.']], value: 'stick' });
    Kit.setup(app, {
      intro: 'Blast the rocks, dodge the saucers',
      options: opts,
      players: { min: 1, max: 1, count: 1, label: 'Player' },
      start: 'Play',
      onStart: function (cfg) {
        var o = cfg.options || {};
        startGame({ who: (cfg.players[0] && cfg.players[0].name) || 'Player', steer: o.steer === 'buttons' ? 'buttons' : 'stick' });
      }
    });
    window.scrollTo(0, 0);
  }

  // ═══ Play view ══════════════════════════════════════════════════════════
  var cv, g, wrapEl, cabEl, hudEl, ovEl, scoreEl, bestEl, waveEl, deckEl, pauseBtn, ro = null;
  var DPR = 1, SC = 1, cssW = 0, cssH = 0, starImg = null, hudDirty = true, bumpScore = false;

  function plate(label, cls) { var b = el('b', { text: '0' }); var p = el('div', { class: 'ar-plate ' + (cls || '') }, [el('small', { text: label }), b]); p._b = b; return p; }
  var SVG_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>';
  var SVG_ROT_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 3v5h5"/></svg>';
  var SVG_ROT_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5"/></svg>';
  var SVG_THRUST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3 5 19l7-4 7 4z"/></svg>';
  var SVG_HYPER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M16.5 16.5 19 19M19 5l-2.5 2.5M7.5 16.5 5 19"/></svg>';

  function buildView() {
    app.className = ''; app.innerHTML = '';
    root.classList.add('ar-on');
    scoreEl = plate('Score', 'sc'); bestEl = plate('Best'); waveEl = plate('Wave');
    pauseBtn = el('button', { type: 'button', class: 'ar-pbtn', 'aria-label': 'Pause', html: SVG_PAUSE, onclick: function () { Kit.sfx('tap'); pauseGame(); } });
    hudEl = el('div', { class: 'ar-hud' }, [scoreEl, bestEl, waveEl, pauseBtn]);
    cv = el('canvas', { 'aria-label': 'Asteroids playfield' }); g = cv.getContext('2d');
    ovEl = el('div', { class: 'ar-ov' });
    cabEl = el('div', { class: 'ar-cab wood' }, [cv, ovEl]);
    wrapEl = el('div', { class: 'ar-wrap' }, [cabEl]);
    deckEl = buildDeck();
    app.appendChild(hudEl); app.appendChild(wrapEl); app.appendChild(deckEl);
    app.appendChild(el('div', { class: 'ar-hint ar-desk', text: 'Left / Right to turn · Up to thrust · Space to fire · Shift for hyperspace · P pauses' }));
    if (ro) ro.disconnect();
    ro = new ResizeObserver(fit); ro.observe(app);
    cssW = 0; fit();
    view = 'game';
    if (!raf) { lastT = 0; raf = requestAnimationFrame(loop); }
  }
  function leaveGame() {
    view = 'none'; paused = false; welcome = false;
    root.classList.remove('ar-on');
    if (ro) { ro.disconnect(); ro = null; }
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    setThrustSound(false); setUfoSound(null);
    keys = {}; resetCtl();
  }

  }
  function killUfo() {
    burst(ufo.x, ufo.y, 26, 200, '#ff8be6', 0.8); burst(ufo.x, ufo.y, 10, 120, '#ffffff', 0.5);
    rings.push({ x: ufo.x, y: ufo.y, r: 6, v: 140, life: 0.5, max: 0.5, col: '255,139,230' });
    fx.shake = Math.max(fx.shake, 5); S.ufoDie(); Kit.haptic('medium');
    ufo = null; setUfoSound(null);
    G.ufoT = Math.max(7, 18 - G.wave) + rnd(0, 8);
  }
  function splitRock(j, ivx, ivy) {
    var r = rocks[j];
    rocks.splice(j, 1);
    S.rock(r.size);
    burst(r.x, r.y, [0, 9, 14, 22][r.size], [0, 110, 130, 150][r.size], '#dcd8ff', 0.7);
    rings.push({ x: r.x, y: r.y, r: r.r * 0.4, v: 90 + r.size * 25, life: 0.35, max: 0.35, col: '210,205,255' });
    fx.shake = Math.max(fx.shake, r.size * 1.5);
    if (r.size === 3) Kit.haptic('light');
    if (r.size > 1) {
      var speed = Math.hypot(r.vx, r.vy) * 1.25 + 18;
      for (var i = 0; i < 2; i++) {
        var base = Math.atan2(r.vy + (ivy || 0) * 0.04, r.vx + (ivx || 0) * 0.04), a = base + (i ? 1 : -1) * rnd(0.35, 1.2);
        var sp = speed * rnd(0.85, 1.25) * (1 + Math.min(0.5, (G.wave - 1) * 0.04));
        rocks.push(mkRock(r.x, r.y, r.size - 1, Math.cos(a) * sp, Math.sin(a) * sp));
      }
    }
  }
  function killShip(cause) {
    var s = ship; s.dead = true; G.lives--; hudDirty = true;
    G.stats.deaths.push({ by: cause, wave: G.wave });
    // break the ship into its line pieces
    var segs = [[13, 0, -9.6, -8.4], [13, 0, -9.6, 8.4], [-6.6, -6.2, -6.6, 6.2]];
    segs.forEach(function (sg) {
      var mx = (sg[0] + sg[2]) / 2, my = (sg[1] + sg[3]) / 2, ca = Math.cos(s.a), sa = Math.sin(s.a);
      var wx = s.x + mx * ca - my * sa, wy = s.y + mx * sa + my * ca, len = Math.hypot(sg[2] - sg[0], sg[3] - sg[1]), ang = s.a + Math.atan2(sg[3] - sg[1], sg[2] - sg[0]);
      var a = Math.atan2(wy - s.y, wx - s.x) + rnd(-0.6, 0.6), sp = rnd(18, 45);
      debris.push({ x: wx, y: wy, vx: Math.cos(a) * sp + s.vx * 0.3, vy: Math.sin(a) * sp + s.vy * 0.3, a: ang, spin: rnd(-3, 3), len: len, life: 2.2, max: 2.2 });
    });
    burst(s.x, s.y, 34, 190, '#9ff3ff', 1); burst(s.x, s.y, 16, 120, '#ffffff', 0.6);
    rings.push({ x: s.x, y: s.y, r: 6, v: 170, life: 0.6, max: 0.6, col: '159,243,255' });
    fx.shake = 10; fx.flash = 0.6;
    S.die(); Kit.haptic('error'); setThrustSound(false);
    G.respawnT = G.lives > 0 ? 2.2 : 1.3;
    save();
  }
  function addScore(n, x, y, pop) {
    var before = G.score; G.score += n; hudDirty = true; bumpScore = true;
    if (pop) pops.push({ x: x, y: y, text: fmt(n), life: 1.1, max: 1.1 });
    while (G.score >= G.nextLife) {
      G.nextLife += EXTRA_EVERY; G.lives++; G.stats.extra++;
      S.life(); Kit.callout('Extra ship!', '#9ff3ff'); Kit.haptic('success');
    }
    return before;
  }
  function burst(x, y, n, spd, col, life) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU, s = spd * rnd(0.2, 1);
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.35, 1) * life, max: life, col: col, sz: rnd(0.9, 1.8) });
    }
  }

  // ═══ Game over ══════════════════════════════════════════════════════════
  function gameOver() {
    if (G.phase === 'over') return;
    G.phase = 'over'; G.overT = 0;
    setThrustSound(false); setUfoSound(null);
    clearSave();
    var st = G.stats, h = [], rk = st.rocks[1] + st.rocks[2] + st.rocks[3];
    st.perWave.push(G.score - st.waveStartScore);
    h.push('Reached wave ' + G.wave + (G.wave > 1 ? ' (cleared ' + (G.wave - 1) + ')' : ''));
    if (rk) h.push('Blasted ' + rk + (rk === 1 ? ' rock' : ' rocks') + ' (' + st.rocks[3] + ' big, ' + st.rocks[2] + ' medium, ' + st.rocks[1] + ' small)');
    if (st.ufoSmall) h.push((st.ufoSmall === 1 ? 'Shot down a small saucer (1,000 points)' : 'Shot down ' + st.ufoSmall + ' small saucers (1,000 points each)') + (st.ufoBig ? ', plus ' + st.ufoBig + ' big' : ''));
    else if (st.ufoBig) h.push('Shot down ' + st.ufoBig + (st.ufoBig === 1 ? ' big saucer' : ' big saucers'));
    if (st.shots >= 20) h.push('Hit with ' + Math.round(st.hits / st.shots * 100) + '% of ' + st.shots + ' shots');
    if (st.hypers) h.push('Jumped to hyperspace ' + st.hypers + (st.hypers === 1 ? ' time' : ' times') + (st.hyperDeaths ? ' (landed on a rock ' + st.hyperDeaths + (st.hyperDeaths === 1 ? ' time)' : ' times)') : ''));
    if (st.extra) h.push('Earned ' + st.extra + (st.extra === 1 ? ' extra ship' : ' extra ships'));
    var last = st.deaths[st.deaths.length - 1];
    if (last) h.push('Last ship lost to ' + last.by + ' in wave ' + last.wave);
    var pw = st.perWave;
    Kit.record(KEY, {
      started: G.started, mode: G.steer === 'buttons' ? 'Button controls' : '',
      players: [{ name: G.who, score: G.score }], winner: null,
      rounds: pw.length > 1 ? { labels: pw.map(function (x, i) { return 'W' + (i + 1); }), scores: pw.map(function (x) { return [x]; }) } : null,
      highlights: h.slice(0, 6), summary: fmt(G.score) + ' points · wave ' + G.wave, badge: 'Wave ' + G.wave,
      meta: { score: G.score, wave: G.wave, rocks: rk, saucers: st.ufoBig + st.ufoSmall }
    });
    var who = G.who, steer = G.steer, sc = G.score, best = sc > 0 && sc > G.best0, wave = G.wave;
    setTimeout(function () {
      if (!G || G.phase !== 'over') return;
      ArcadeHi.check(HI, sc, function () {
        hudDirty = true;
        Kit.win({
          lose: !best, icon: best ? 'trophy' : 'meh',
          title: best ? 'New high score!' : 'Game over',
          sub: fmt(sc) + ' points · reached wave ' + wave,
          again: function () { startGame({ who: who, steer: steer }); }, againLabel: 'Play again',
          extra: [{ label: 'High scores', onClick: function () { ArcadeHi.show(HI, 'Asteroids'); showSetup(); } }, { label: 'Change settings', onClick: showSetup }]
        });
      });
    }, 1800);
  }

  // ═══ Save / resume ══════════════════════════════════════════════════════
  function save() {
    if (!G || G.phase !== 'play') return;
    var s = { v: 1, who: G.who, steer: G.steer, ww: WW, wh: WH, score: G.score, lives: G.lives, wave: G.wave, nextLife: G.nextLife,
      started: G.started, stats: G.stats,
      rocks: rocks.map(function (r) { return { x: Math.round(r.x), y: Math.round(r.y), vx: Math.round(r.vx), vy: Math.round(r.vy), size: r.size, shape: r.shape }; }) };
    if (s.lives <= 0) { clearSave(); return; }
    try { localStorage.setItem(SAVE, JSON.stringify(s)); } catch (e) {}
    Kit.resume.set('Wave ' + G.wave + ' · ' + fmt(G.score) + ' points');
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function loadSave() { try { var s = JSON.parse(localStorage.getItem(SAVE)); return s && s.v === 1 && s.lives > 0 ? s : null; } catch (e) { return null; } }

  // ═══ HUD ════════════════════════════════════════════════════════════════
  function updateHud() {
    if (!G || !scoreEl) return;
    hudDirty = false;
    scoreEl._b.textContent = fmt(G.score);
    bestEl._b.textContent = fmt(Math.max(G.best0, G.score));
    waveEl._b.textContent = G.wave;
    if (bumpScore) { bumpScore = false; scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
    pauseBtn.style.visibility = G.phase === 'over' ? 'hidden' : 'visible';
  }

  // ═══ Drawing ════════════════════════════════════════════════════════════
  function stars() {
    var c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
    var x = c.getContext('2d'), n = Math.round(WW * WH / 900);
    var gr = x.createRadialGradient(c.width * 0.7, c.height * 0.25, 0, c.width * 0.7, c.height * 0.25, c.width * 0.9);
    gr.addColorStop(0, 'rgba(70,60,160,.16)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = '#03030a'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height);
    var seed = 11; function R() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    for (var i = 0; i < n; i++) {
      var b = R(); x.fillStyle = 'rgba(' + (200 + R() * 55 | 0) + ',' + (200 + R() * 55 | 0) + ',255,' + (0.15 + b * 0.5) + ')';
      var s = (b > 0.93 ? 1.6 : 0.9) * SC; x.fillRect(R() * c.width, R() * c.height, s, s);
    }
    return c;
  }
  // Draw something at its position plus any wrapped copies near the edges.
  function wrapped(x, y, r, fn) {
    var xs = [x], ys = [y];
    if (x < r) xs.push(x + WW); else if (x > WW - r) xs.push(x - WW);
    if (y < r) ys.push(y + WH); else if (y > WH - r) ys.push(y - WH);
    for (var i = 0; i < xs.length; i++) for (var j = 0; j < ys.length; j++) fn(xs[i], ys[j]);
  }
  function glowStroke(col, w, blur) {
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.shadowColor = col; g.shadowBlur = blur * SC;
    g.strokeStyle = col; g.lineWidth = w; g.stroke();
    g.shadowBlur = 0;
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = w * 0.45; g.stroke();
  }
  function shipPath(x, y, a, sc) {
    var ca = Math.cos(a) * sc, sa = Math.sin(a) * sc;
    function P(px, py, m) { var X = x + px * ca - py * sa, Y = y + px * sa + py * ca; if (m) g.moveTo(X, Y); else g.lineTo(X, Y); }
    P(11, 0, 1); P(-8, -7); P(-5.5, -5.2); P(-5.5, 5.2); P(-8, 7); P(11, 0);
  }
  function draw() {
    if (!g) return;
    g.setTransform(1, 0, 0, 1, 0, 0);
    if (!starImg && cv.width) starImg = stars();
    if (starImg) g.drawImage(starImg, 0, 0); else { g.fillStyle = '#03030a'; g.fillRect(0, 0, cv.width, cv.height); }
    if (!G) return;
    var sx = fx.shake ? rnd(-fx.shake, fx.shake) * 0.5 : 0, sy = fx.shake ? rnd(-fx.shake, fx.shake) * 0.5 : 0;
    g.setTransform(SC, 0, 0, SC, sx * SC, sy * SC);

    // rocks (one path, one glow)
    g.beginPath();
    rocks.forEach(function (r) {
      wrapped(r.x, r.y, r.r + 2, function (x, y) {
        var n = r.shape.length;
        for (var i = 0; i <= n; i++) {
          var k = i % n, a = r.rot + k / n * TAU, rr = r.r * r.shape[k];
          var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
          if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
        }
      });
    });
    glowStroke('#c9c4ff', 1.8, 10);

    // saucer
    if (ufo) (function (x, y) {
      var s = ufo.r / 13;
      g.beginPath();
      g.moveTo(x - 13 * s, y + 1 * s); g.lineTo(x + 13 * s, y + 1 * s);
      g.moveTo(x - 13 * s, y + 1 * s); g.lineTo(x - 6 * s, y + 6 * s); g.lineTo(x + 6 * s, y + 6 * s); g.lineTo(x + 13 * s, y + 1 * s);
      g.lineTo(x + 6 * s, y - 4 * s); g.lineTo(x - 6 * s, y - 4 * s); g.lineTo(x - 13 * s, y + 1 * s);
      g.moveTo(x - 6 * s, y - 4 * s); g.lineTo(x - 3.5 * s, y - 9 * s); g.lineTo(x + 3.5 * s, y - 9 * s); g.lineTo(x + 6 * s, y - 4 * s);
      glowStroke('#ff7ae0', 1.5, 9);
      var blink = Math.floor(ufo.t * 8) % 3;
      g.fillStyle = ['#fff4a8', '#9ff3ff', '#ff9ae8'][blink];
      for (var i = -1; i <= 1; i++) { g.beginPath(); g.arc(x + i * 5 * s, y + 3.5 * s, 0.9 * s + 0.3, 0, TAU); g.fill(); }
    })(ufo.x, ufo.y);

    // bullets
    bullets.forEach(function (b) {
      var col = b.ufo ? '#ff9ae8' : '#fff4c2';
      g.fillStyle = col; g.shadowColor = b.ufo ? '#ff4fd0' : '#ffd36b'; g.shadowBlur = 8 * SC;
      g.beginPath(); g.arc(b.x, b.y, b.ufo ? 1.8 : 1.6, 0, TAU); g.fill();
      g.shadowBlur = 0;
      g.strokeStyle = b.ufo ? 'rgba(255,120,220,.35)' : 'rgba(255,220,140,.35)'; g.lineWidth = 1.4;
      var sp = Math.hypot(b.vx, b.vy) || 1; g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x - b.vx / sp * 6, b.y - b.vy / sp * 6); g.stroke();
    });

    // ship
    if (ship && !ship.dead && !(ship.hyper > 0)) {
      var blinkOff = ship.inv > 0 && Math.floor(ship.inv * 10) % 2 === 0;
      if (!blinkOff) {
        wrapped(ship.x, ship.y, 14, function (x, y) {
          var k = (ship.kick || 0) * 1.5, bx = x - Math.cos(ship.a) * k, by = y - Math.sin(ship.a) * k;
          if (ship.thrust && G.phase === 'play') {
            var fl = rnd(6, 12), ca = Math.cos(ship.a), sa = Math.sin(ship.a);
            g.beginPath();
            g.moveTo(bx + (-6.6) * ca - (-3.4) * sa, by + (-6.6) * sa + (-3.4) * ca);
            g.lineTo(bx + (-6.6 - fl) * ca, by + (-6.6 - fl) * sa);
            g.lineTo(bx + (-6.6) * ca - 3.4 * sa, by + (-6.6) * sa + 3.4 * ca);
            glowStroke('#ffa24a', 1.5, 10);
          }
          g.beginPath(); shipPath(bx, by, ship.a, 1.2);
          glowStroke('#7df4ff', 1.8, 11);
        });
      }
      if (ship.inv > 0 && G.phase === 'play') {
        g.strokeStyle = 'rgba(125,244,255,' + Math.min(0.35, ship.inv * 0.3) + ')'; g.lineWidth = 1;
        g.beginPath(); g.arc(ship.x, ship.y, 17, 0, TAU); g.stroke();
      }
    }
    // debris
    debris.forEach(function (d) {
      var a = Math.max(0, d.life / d.max), ca = Math.cos(d.a) * d.len / 2, sa = Math.sin(d.a) * d.len / 2;
      g.globalAlpha = a; g.beginPath(); g.moveTo(d.x - ca, d.y - sa); g.lineTo(d.x + ca, d.y + sa);
      glowStroke('#7df4ff', 1.6, 8); g.globalAlpha = 1;
    });
    // particles
    g.globalCompositeOperation = 'lighter';
    parts.forEach(function (p) {
      var a = Math.max(0, Math.min(1, p.life / (p.max * 0.6)));
      g.globalAlpha = a; g.fillStyle = p.col;
      var s = p.sz || 1.2; g.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    });
    rings.forEach(function (r) {
      g.globalAlpha = Math.max(0, r.life / r.max) * 0.7; g.strokeStyle = 'rgb(' + r.col + ')'; g.lineWidth = 1.2;
      g.beginPath(); g.arc(r.x, r.y, Math.max(0.5, r.r), 0, TAU); g.stroke();
    });
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    // popups
    pops.forEach(function (p) { g.globalAlpha = Math.min(1, p.life / p.max * 2); vtext(p.text, p.x, p.y - 14, 11, '#ff9ae8'); g.globalAlpha = 1; });

    // lives (classic: little ships top-left)
    g.setTransform(SC, 0, 0, SC, 0, 0);
    var nl = Math.max(0, Math.min(G.lives - 1, 8));
    g.beginPath();
    for (var i = 0; i < nl; i++) shipPath(16 + i * 15, 18, -PI / 2, 0.72);
    glowStroke('#7df4ff', 1.3, 5);
    if (G.lives - 1 > 8) vtext('+' + (G.lives - 9), 16 + 8 * 15 - 2, 19, 10, '#7df4ff', 'left');

    // banners
    if (fx.banner && G.phase === 'play') {
      var t = fx.banner.t, al = t < 0.25 ? t / 0.25 : t > 1.6 ? Math.max(0, (2 - t) / 0.4) : 1;
      g.globalAlpha = al; vtext(fx.banner.text, WW / 2, WH * 0.32, 26, '#ffffff'); g.globalAlpha = 1;
    }
    if (G.phase === 'play' && ship && ship.dead && G.lives > 0 && G.respawnT <= 0) {
      g.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now() / 200); vtext('GET READY', WW / 2, WH / 2 + 34, 13, '#9ff3ff'); g.globalAlpha = 1;
    }
    if (G.phase === 'over') {
      var ot = Math.min(1, G.overT / 0.6);
      g.globalAlpha = ot; vtext('GAME OVER', WW / 2, WH * 0.45, 32, '#ff6b81'); g.globalAlpha = 1;
    }
    if (fx.flash > 0) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = 'rgba(160,240,255,' + fx.flash * 0.25 + ')'; g.fillRect(0, 0, cv.width, cv.height); }
  }
  function vtext(t, x, y, size, col, align) {
    g.font = '400 ' + size + 'px "Lilita One", system-ui, sans-serif'; g.textAlign = align || 'center'; g.textBaseline = 'middle';
    g.shadowColor = col; g.shadowBlur = 12 * SC; g.fillStyle = col; g.fillText(t, x, y);
    g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,.75)'; g.fillText(t, x, y);
  }

  // ═══ Loop ═══════════════════════════════════════════════════════════════
  var raf = 0, lastT = 0, acc = 0;
  function loop(t) {
    raf = requestAnimationFrame(loop);
    pollSound();
    var dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0; lastT = t;
    if (view !== 'game' || !G) return;
    if (!paused) {
      acc += dt; var n = 0;
      while (acc >= TICK && n++ < 10) { acc -= TICK; update(TICK); }
    }
    if (hudDirty) updateHud();
    draw();
  }

  // ═══ Test hooks ═════════════════════════════════════════════════════════
  window.__ast = {
    G: function () { return G; }, ship: function () { return ship; }, rocks: function () { return rocks; }, ufo: function () { return ufo; },
    bullets: function () { return bullets; }, paused: function () { return paused; },
    ctl: ctl, fire: function () { tryFire(true); }, hyper: hyperspace,
    clearRocks: function (keep) { rocks = rocks.slice(0, keep || 0); },
    spawnUfo: function (big) { spawnUfo(); if (big != null) { ufo.big = big; ufo.r = big ? 13 : 8; } },
    lives: function (n) { G.lives = n; hudDirty = true; },
    kill: function () { if (ship && !ship.dead) killShip('a test'); },
    rockAt: function () { if (ship) rocks.push(mkRock(ship.x + 60, ship.y, 2, -80, 0)); }
  };

  // ═══ Boot ═══════════════════════════════════════════════════════════════
  var saved = loadSave();
  if (saved) startGame({ who: saved.who, steer: saved.steer }, saved);
  else showSetup();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Asteroids</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<script src="../arcade-hi.js"></script>
<style>
html,body{height:100%;}
body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:#000;}
.site-nav{flex:none;}
.site-nav .icon-btn{width:38px;height:38px;min-height:38px;padding:0;font-size:1rem;border-radius:50%;}
/* Play field fills everything between nav and controls */
.field{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;}
#cv{display:block;position:absolute;inset:0;touch-action:none;}
/* HUD overlay */
.hud{position:absolute;top:10px;left:max(12px,var(--safe-l));right:max(12px,var(--safe-r));display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;z-index:10;}
.hud-group{display:flex;gap:6px;}
.pill{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;background:rgba(18,21,28,.7);border:1px solid var(--line-2);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
.pill span{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.pill b{font-family:var(--display);font-size:1.08rem;font-weight:800;font-variant-numeric:tabular-nums;}
.pill.accent b{color:var(--gold);}
.hud-lives{display:flex;gap:5px;align-items:center;}
/* Touch controls docked in the thumb zone */
.tc{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px max(14px,var(--safe-l)) calc(12px + var(--safe-b)) max(14px,var(--safe-r));
  background:linear-gradient(180deg,rgba(11,13,18,.0),rgba(11,13,18,.9) 30%);border-top:1px solid var(--line);}
.tc-group{display:flex;gap:10px;align-items:center;}
.tc-btn{width:64px;height:64px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;transition:transform .08s,background .1s;}
.tc-btn svg{width:26px;height:26px;}
.tc-btn.pressed{background:var(--surface-3);transform:scale(.93);}
.tc-thrust{border-color:rgba(90,200,250,.45);background:rgba(90,200,250,.12);color:#5ac8fa;}
.tc-thrust.pressed{background:rgba(90,200,250,.28);}
.tc-fire{width:76px;height:76px;border-radius:50%;border:1px solid rgba(248,113,113,.55);background:rgba(248,113,113,.16);color:#fca5a5;
  font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.06em;}
.tc-fire.pressed{background:rgba(248,113,113,.36);}
@media (hover:hover) and (pointer:fine){ .tc{display:none !important;} }
/* Overlay */
#ov{position:absolute;inset:0;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;text-align:center;animation:gn-fade .2s ease both;}
.ov-card{width:100%;max-width:320px;padding:26px 22px;border-radius:26px;background:rgba(18,21,28,.85);border:1px solid var(--line-2);box-shadow:0 24px 60px rgba(0,0,0,.6);animation:gn-pop .3s var(--spring) both;}
.ov-emoji{font-size:2.6rem;line-height:1;margin-bottom:8px;}
.ov-title{font-family:var(--display);font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-bottom:8px;}
.ov-sub{font-size:.92rem;color:var(--text-2);margin-bottom:18px;line-height:1.7;}
.ov-sub kbd{font-family:var(--font);font-size:.8rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-3);border:1px solid var(--line-2);}
.ov-stats{display:flex;gap:8px;justify-content:center;margin:6px 0 18px;}
.ov-stat{flex:1;max-width:120px;padding:8px 6px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);}
.ov-stat b{display:block;font-family:var(--display);font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;}
.ov-stat span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.ov-card .btn{width:100%;}
.ov-card .btn + .btn{margin-top:8px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Asteroids</span>
  <button class="icon-btn" id="btn-pause" aria-label="Pause"></button>
  <button class="icon-btn" onclick="ArcadeHi.show('ast','Asteroids')" aria-label="High scores">🏆</button>
</nav>
<div class="field" id="field">
  <canvas id="cv"></canvas>
  <!-- HUD -->
  <div class="hud">
    <div class="hud-group">
      <div class="pill accent"><span>Score</span><b id="h-score">0</b></div>
      <div class="pill"><span>Lvl</span><b id="h-level">1</b></div>
    </div>
    <div class="pill"><div class="hud-lives" id="h-lives"></div></div>
  </div>
  <!-- Overlay -->
  <div id="ov">
    <div class="ov-card">
      <div class="ov-emoji">🚀</div>
      <div class="ov-title">Asteroids</div>
      <div class="ov-sub" id="ov-help"></div>
      <button class="btn btn-gold" id="ov-start">Play</button>
      <button class="btn btn-outline" onclick="ArcadeHi.show('ast','Asteroids')">🏆 High scores</button>
    </div>
  </div>
</div>

<!-- Touch controls -->
<div class="tc" id="tc-area">
  <div class="tc-group">
    <div class="tc-btn" id="tc-left" aria-label="Rotate left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg></div>
    <div class="tc-btn" id="tc-right" aria-label="Rotate right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></div>
  </div>
  <div class="tc-group">
    <div class="tc-btn tc-thrust" id="tc-thrust" aria-label="Thrust"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4 5 18l7-4 7 4z"/></svg></div>
    <div class="tc-btn tc-fire" id="tc-fire" aria-label="Fire">FIRE</div>
  </div>
</div>

<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const field=document.getElementById('field');
const haptic=k=>{try{window.GN&&GN.haptic(k);}catch(e){}};
let W=0,H=0;
// Logical size = CSS px of the play field; backing store scaled for retina.
function resize(){
  const r=field.getBoundingClientRect();
  W=Math.max(200,Math.round(r.width));H=Math.max(200,Math.round(r.height));
  const d=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);
  ctx.setTransform(d,0,0,d,0,0);
  if(ship)draw();
}

// ── Detect mobile ────────────────────────────────────────────────────────
const isMobile=('ontouchstart' in window)||navigator.maxTouchPoints>0;
document.getElementById('ov-help').innerHTML=matchMedia('(pointer:coarse)').matches
  ? 'Rotate with the left buttons.<br>Thrust and fire on the right.'
  : '<kbd>←</kbd> <kbd>→</kbd> rotate · <kbd>↑</kbd> thrust<br><kbd>Space</kbd> fire · <kbd>P</kbd> pause';

// ── Input ────────────────────────────────────────────────────────────────
const keys={};
document.addEventListener('keydown',e=>{
  if(document.querySelector('.ahi-overlay'))return;
  if(e.code==='KeyP'||e.code==='Escape'){togglePause();return;}
  if((e.code==='Enter')&&(paused||!started||gameOver)){e.preventDefault(); if(paused)togglePause(); else initGame(); return;}
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function bindTC(id,code){
  const el=document.getElementById(id);
  if(!el)return;
  const on=e=>{e.preventDefault();keys[code]=true;el.classList.add('pressed');haptic('select');};
  const off=e=>{e.preventDefault();keys[code]=false;el.classList.remove('pressed');};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}
bindTC('tc-left','ArrowLeft');
bindTC('tc-right','ArrowRight');
bindTC('tc-thrust','ArrowUp');
bindTC('tc-fire','Space');

// ── Sound ────────────────────────────────────────────────────────────────
let _ac=null;
function ac(){
  if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==='suspended')_ac.resume();
  return _ac;
}
function tone(freq,start,dur,vol,type,freqEnd){
  try{
    const c=ac(),t=c.currentTime+start;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(freq,t);
    if(freqEnd)o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.06,t+.008);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.04);
  }catch(e){}
}
function noise(start,dur,fc,vol){
  try{
    const c=ac(),t=c.currentTime+start;
    const sr=c.sampleRate,buf=c.createBuffer(1,Math.ceil(sr*dur),sr),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*.55));
    const src=c.createBufferSource();src.buffer=buf;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fc||400;f.Q.value=1.8;
    const g=c.createGain();g.gain.setValueAtTime(vol||.18,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    src.connect(f);f.connect(g);g.connect(c.destination);src.start(t);src.stop(t+dur+.04);
  }catch(e){}
}

// Continuous thrust sound using ScriptProcessorNode approach → simpler: just fire periodic tones
let _thrustActive=false,_thrustTimer=0;
function thrustTick(){
  if(!_thrustActive)return;
  _thrustTimer++;
  if(_thrustTimer%4===0)tone(55+Math.random()*20,0,.06,.035,'sawtooth');
}
function setThrust(on){_thrustActive=on;if(!on)_thrustTimer=0;}

function sShoot(){tone(700,0,.07,.06,'square',180);}
function sBeat(low){tone(low?85:105,0,.055,.06,'sine');}
function sDie(){noise(0,.5,250,.35);tone(120,0,.4,.15,'sawtooth',50);}
function sExp(size){
  if(size===3){noise(0,.45,90,.32);noise(.04,.3,50,.18);}
  else if(size===2){noise(0,.28,180,.24);}
  else{noise(0,.15,380,.16);}
}

// ── Game state ───────────────────────────────────────────────────────────
let score=0,lives=3,level=1,gameOver=false,started=false,paused=false,levelPending=false;
let ship=null,bullets=[],rocks=[],parts=[];
let invFrames=0,fireCool=0,beatTimer=0,beatPhase=0;
let animId=null;

const SHIP_R=13,BULL_SPD=7.2,BULL_LIFE=52,MAX_BULL=4,FIRE_RATE=11;
const ROCK_R=[0,16,32,52]; // size 1,2,3
const ROCK_PTS=[0,100,50,20];

function wrap(o){
  if(o.x<-o.r)o.x=W+o.r; if(o.x>W+o.r)o.x=-o.r;
  if(o.y<-o.r)o.y=H+o.r; if(o.y>H+o.r)o.y=-o.r;
}

// ── Rocks ────────────────────────────────────────────────────────────────
function makeRock(x,y,size,vx,vy){
  const n=7+Math.floor(Math.random()*3);
  const verts=[];
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    verts.push({a,r:ROCK_R[size]*(0.72+Math.random()*0.55)});
  }
  const speed=(1.0+level*.12)*(size===1?1.8:size===2?1.2:0.8);
  return{x,y,vx:vx??((Math.random()-.5)*speed*2),vy:vy??((Math.random()-.5)*speed*2),
         r:ROCK_R[size],size,verts,spin:(Math.random()-.5)*.055,ang:0};
}

function spawnRocks(){
  const n=3+level;rocks=[];
  for(let i=0;i<n;i++){
    let x,y;
    do{x=Math.random()*W;y=Math.random()*H;}while(Math.hypot(x-W/2,y-H/2)<130);
    rocks.push(makeRock(x,y,3));
  }
}

// ── Particles ────────────────────────────────────────────────────────────
function burst(x,y,n,spd,col){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=spd*(.25+Math.random()*.85);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
                life:1,decay:.016+Math.random()*.024,r:1.2+Math.random()*2.2,col:col||'#ddd'});
  }
}

// ── Init ─────────────────────────────────────────────────────────────────
function initGame(){
  score=0;lives=3;level=1;gameOver=false;started=true;
  ship={x:W/2,y:H/2,vx:0,vy:0,ang:-Math.PI/2,thrusting:false,dead:false,r:SHIP_R};
  bullets=[];parts=[];
  invFrames=150;fireCool=0;beatTimer=0;beatPhase=0;
  paused=false;levelPending=false;
  spawnRocks();
  updateHUD();
  document.getElementById('ov').style.display='none';
  setPauseIcon();
  if(animId)cancelAnimationFrame(animId);
  lastT=0;acc=0;animId=requestAnimationFrame(loop);
}

function respawn(){
  ship={x:W/2,y:H/2,vx:0,vy:0,ang:-Math.PI/2,thrusting:false,dead:false,r:SHIP_R};
  invFrames=180;fireCool=0;
}

function nextLevel(){
  levelPending=false;
  if(gameOver)return;
  level++;haptic('success');
  ship={x:W/2,y:H/2,vx:0,vy:0,ang:-Math.PI/2,thrusting:false,dead:false,r:SHIP_R};
  bullets=[];invFrames=150;fireCool=0;
  spawnRocks();
  updateHUD();
}

function updateHUD(){
  document.getElementById('h-score').textContent=score.toLocaleString();
  document.getElementById('h-level').textContent=level;
  const lv=document.getElementById('h-lives');lv.innerHTML='';
  for(let i=0;i<lives;i++){
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('width','13');s.setAttribute('height','16');s.setAttribute('viewBox','-7 -10 14 17');
    const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    p.setAttribute('points','0,-9 -5,6 0,2 5,6');
    p.setAttribute('fill','none');p.setAttribute('stroke','#5ac8fa');p.setAttribute('stroke-width','1.5');
    s.appendChild(p);lv.appendChild(s);
  }
}

// ── Step ─────────────────────────────────────────────────────────────────
function step(){
  if(gameOver||!started||paused)return;

  thrustTick();

  if(!ship.dead){
    if(keys['ArrowLeft']||keys['KeyA'])ship.ang-=.062;
    if(keys['ArrowRight']||keys['KeyD'])ship.ang+=.062;
    ship.thrusting=!!(keys['ArrowUp']||keys['KeyW']);
    if(ship.thrusting){
      ship.vx+=Math.cos(ship.ang)*.2;
      ship.vy+=Math.sin(ship.ang)*.2;
      // Thrust particles
      if(Math.random()<.7){
        const a=ship.ang+Math.PI+(Math.random()-.5)*.7;
        const spd=1.5+Math.random()*2;
        parts.push({x:ship.x+Math.cos(ship.ang+Math.PI)*10,
                    y:ship.y+Math.sin(ship.ang+Math.PI)*10,
                    vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
                    life:1,decay:.08+Math.random()*.06,r:1.5,
                    col:`hsl(${20+Math.random()*30},100%,${55+Math.random()*25}%)`});
      }
    }
    setThrust(ship.thrusting);
    // Drag + speed cap
    ship.vx*=.988;ship.vy*=.988;
    const spd=Math.hypot(ship.vx,ship.vy);
    if(spd>7.5){ship.vx=ship.vx/spd*7.5;ship.vy=ship.vy/spd*7.5;}
    ship.x+=ship.vx;ship.y+=ship.vy;
    wrap(ship);
    // Fire
    fireCool--;
    if((keys['Space']||keys['KeyZ']||keys['KeyX'])&&fireCool<=0&&bullets.length<MAX_BULL){
      bullets.push({x:ship.x+Math.cos(ship.ang)*SHIP_R,y:ship.y+Math.sin(ship.ang)*SHIP_R,
                    vx:Math.cos(ship.ang)*BULL_SPD+ship.vx*.25,
                    vy:Math.sin(ship.ang)*BULL_SPD+ship.vy*.25,
                    life:BULL_LIFE,r:2.5});
      fireCool=FIRE_RATE;sShoot();
    }
    // Collision vs rocks
    if(invFrames<=0){
      for(const r of rocks){
        if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+SHIP_R-5){
          lives--;ship.dead=true;
          burst(ship.x,ship.y,28,3.5,'#5ac8fa');
          setThrust(false);sDie();updateHUD();haptic('error');
          if(lives<=0){setTimeout(endGame,800);}else{setTimeout(respawn,1400);}
          break;
        }
      }
    }
    if(invFrames>0)invFrames--;
  } else {
    setThrust(false);
  }

  // Bullets
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);});
  bullets=bullets.filter(b=>b.life>0);

  // Rocks
  rocks.forEach(r=>{r.x+=r.vx;r.y+=r.vy;r.ang+=r.spin;wrap(r);});

  // Bullet vs rock
  outer: for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];
    for(let ri=rocks.length-1;ri>=0;ri--){
      const r=rocks[ri];
      if(Math.hypot(b.x-r.x,b.y-r.y)<r.r+2.5){
        score+=ROCK_PTS[r.size];haptic('light');
        bullets.splice(bi,1);
        splitRock(ri);
        updateHUD();
        continue outer;
      }
    }
  }

  // Particles
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.life-=p.decay;});
  parts=parts.filter(p=>p.life>0);

  // Level clear (schedule once — previously this fired every frame for 700ms
  // and skipped dozens of levels)
  if(rocks.length===0&&!ship.dead&&!levelPending){levelPending=true;setTimeout(nextLevel,700);}

  // Heartbeat
  beatTimer++;
  const interval=Math.max(14,58-Math.min(rocks.length,15)*2);
  if(beatTimer>=interval){beatTimer=0;beatPhase=1-beatPhase;sBeat(beatPhase===0);}
}

function splitRock(ri){
  const r=rocks[ri];
  sExp(r.size);
  const col=r.size===3?'#ccc':r.size===2?'#bbb':'#aaa';
  burst(r.x,r.y,r.size===3?22:r.size===2?14:8,r.size===3?3.5:2.5,col);
  rocks.splice(ri,1);
  if(r.size>1){
    for(let i=0;i<2;i++){
      const a=Math.random()*Math.PI*2,s=1.1+Math.random()*1.2;
      rocks.push(makeRock(r.x,r.y,r.size-1,Math.cos(a)*s,Math.sin(a)*s));
    }
  }
}

function bestScore(){try{const l=JSON.parse(localStorage.getItem('hi_ast')||'[]');return Math.max(score,l.length?l[0].score:0);}catch(e){return score;}}
function endGame(){
  gameOver=true;setThrust(false);setPauseIcon();
  const best=bestScore();
  const ov=document.getElementById('ov');
  ov.innerHTML=`
    <div class="ov-card">
      <div class="ov-title">Game over</div>
      <div class="ov-sub" style="margin-bottom:8px">${score>0&&score>=best?'🎉 New high score!':'Reached level '+level}</div>
      <div class="ov-stats"><div class="ov-stat"><b>${score.toLocaleString()}</b><span>Score</span></div><div class="ov-stat"><b>${best.toLocaleString()}</b><span>Best</span></div></div>
      <button class="btn btn-gold" onclick="initGame()">Play again</button>
      <button class="btn btn-outline" onclick="ArcadeHi.show('ast','Asteroids')">🏆 High scores</button>
    </div>`;
  ov.style.display='flex';
  ArcadeHi.check('ast',score,()=>{});
}

// ── Pause ────────────────────────────────────────────────────────────────
const ICON_PAUSE='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_PLAY='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
function setPauseIcon(){document.getElementById('btn-pause').innerHTML=paused?ICON_PLAY:ICON_PAUSE;}
function togglePause(force){
  if(!started||gameOver)return;
  paused=typeof force==='boolean'?force:!paused;
  for(const k in keys)keys[k]=false;
  document.querySelectorAll('.pressed').forEach(el=>el.classList.remove('pressed'));
  setThrust(false);
  const ov=document.getElementById('ov');
  if(paused){
    ov.innerHTML=`<div class="ov-card"><div class="ov-title">Paused</div><div class="ov-sub">Level ${level} · ${score.toLocaleString()} pts</div>
      <button class="btn btn-gold" onclick="togglePause(false)">Resume</button></div>`;
    ov.style.display='flex';
  }else{ov.style.display='none';lastT=0;acc=0;}
  setPauseIcon();
}
document.getElementById('btn-pause').addEventListener('click',()=>togglePause());
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&started&&!gameOver)togglePause(true); });
window.addEventListener('blur',()=>{ if(started&&!gameOver&&!paused)togglePause(true); });

// ── Draw ─────────────────────────────────────────────────────────────────
// Static star positions
const STARS=[];
for(let i=0;i<70;i++){STARS.push({x:Math.random(),y:Math.random(),r:Math.random()<.15?1.5:1});}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  // Stars
  ctx.fillStyle='rgba(255,255,255,.28)';
  STARS.forEach(s=>ctx.fillRect(s.x*W,s.y*H,s.r,s.r));

  // Particles
  parts.forEach(p=>{
    ctx.save();ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  // Rocks
  ctx.lineWidth=1.5;
  rocks.forEach(r=>{
    const brightness=Math.min(255,Math.floor(160+level*8));
    ctx.strokeStyle=`rgb(${brightness},${brightness},${brightness})`;
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.ang);
    ctx.beginPath();
    r.verts.forEach((v,i)=>{
      const x=Math.cos(v.a)*v.r,y=Math.sin(v.a)*v.r;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.closePath();ctx.stroke();ctx.restore();
  });

  // Bullets
  ctx.fillStyle='#fff';
  bullets.forEach(b=>{
    ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,Math.PI*2);ctx.fill();
  });

  // Ship
  if(!ship.dead&&(invFrames<=0||Math.floor(invFrames/7)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.ang);
    ctx.strokeStyle='#5ac8fa';ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.moveTo(SHIP_R,0);
    ctx.lineTo(-SHIP_R*.65,SHIP_R*.58);
    ctx.lineTo(-SHIP_R*.38,0);
    ctx.lineTo(-SHIP_R*.65,-SHIP_R*.58);
    ctx.closePath();ctx.stroke();
    // Flame
    if(ship.thrusting){
      const fl=6+Math.random()*9;
      ctx.strokeStyle=`hsl(${22+Math.random()*22},100%,${52+Math.random()*28}%)`;
      ctx.lineWidth=1.8;
      ctx.beginPath();
      ctx.moveTo(-SHIP_R*.38,SHIP_R*.18);
      ctx.lineTo(-SHIP_R*.38-fl,0);
      ctx.lineTo(-SHIP_R*.38,-SHIP_R*.18);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ── Loop ─────────────────────────────────────────────────────────────────
// Fixed 60 Hz simulation (same speed on 60 and 120 Hz displays)
let lastT=0,acc=0;const DT=1000/60;
function loop(t){
  if(!lastT)lastT=t;
  acc+=Math.min(100,t-lastT);lastT=t;
  while(acc>=DT){step();acc-=DT;}
  draw();
  animId=requestAnimationFrame(loop);
}

document.getElementById('ov-start').addEventListener('click',initGame);
resize();
new ResizeObserver(resize).observe(field);
setPauseIcon();updateHUD();
// Idle backdrop: a few drifting rocks behind the start card
ship={x:-999,y:-999,vx:0,vy:0,ang:0,dead:true,r:SHIP_R};
spawnRocks();draw();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goblin Defenders</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<script src="goblindefenders-data.js"></script>
<script src="goblindefenders-core.js"></script>
<script src="goblindefenders-art.js"></script>
<style>
html.gd-on,html.gd-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.gd-on body{display:flex;flex-direction:column;background:#2a160a;}
html.gd-on #app{flex:1;min-height:0;width:100%;display:flex;padding:0 calc(var(--safe-r,0px)) var(--safe-b) calc(var(--safe-l,0px));}
@media (orientation:landscape) and (max-height:500px){
  html.gd-on .gbar{padding-top:calc(var(--safe-t) + 3px);padding-bottom:3px;}
  html.gd-on .gbar .icon-btn{width:36px;height:36px;}
  html.gd-on .gbar .ttl{font-size:1.05rem;}
}
.gd-view{flex:1;min-height:0;width:100%;position:relative;touch-action:none;-webkit-user-select:none;user-select:none;}
.gd-view[hidden]{display:none;}
.gd-view canvas{position:absolute;left:0;top:0;display:block;touch-action:none;}
.gd-load{position:absolute;inset:0;display:grid;place-items:center;color:#f6e3c0;font-family:var(--display);font-size:1.3rem;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.5);}
.gd-load[hidden]{display:none;}
/* sheets: the level card and the gem shop */
.gd-card{display:flex;flex-direction:column;gap:12px;}
.gd-land{font-family:var(--display);font-size:.95rem;color:var(--text-2);letter-spacing:.04em;text-transform:uppercase;}
.gd-stars{display:flex;gap:6px;}
.gd-stars i{width:30px;height:30px;display:block;background-size:contain;background-repeat:no-repeat;}
.gd-facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-weight:700;}
.gd-facts span:nth-child(odd){color:var(--text-3);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;align-self:center;}
.gd-shop{display:flex;flex-direction:column;gap:8px;}
.gd-gems{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.35rem;}
.gd-gems canvas,.gd-item canvas{flex:none;}
.gd-sec{font-family:var(--display);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-top:6px;}
.gd-item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--w06,rgba(255,255,255,.06));}
.gd-item b{display:block;font-size:1rem;}
.gd-item small{display:block;color:var(--text-2);font-size:.82rem;line-height:1.3;}
.gd-pips{display:flex;gap:4px;margin-top:4px;}
.gd-pips i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);}
.gd-pips i.on{background:#ffc83d;}
.gd-buy{min-width:74px;min-height:40px;border:0;border-radius:12px;font-weight:900;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(180deg,#ff5ad8,#b0218f);color:#fff;box-shadow:0 3px 0 #6a0f55,inset 0 1px 0 rgba(255,255,255,.4);}
.gd-buy:active{transform:translateY(2px);box-shadow:0 1px 0 #6a0f55;}
.gd-buy[disabled]{background:rgba(255,255,255,.1);color:var(--text-3);box-shadow:none;}
.gd-buy.max{background:none;color:#ffc83d;box-shadow:none;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<div class="gd-view" id="view" hidden>
  <canvas id="cv" aria-label="Goblin Defenders"></canvas>
  <div class="gd-load" id="load">Loading the goblins</div>
</div>

(function () {

  // ═══ Layout ══════════════════════════════════════════════════════════════

    sell: [['selling'], .75], leak: [['castle_hit'], .8], baa: [['m_sheep_die1'], .8], rocket: [['t_rocket_shoot'], .75], star: [['achieve'], .6], tap: [['button_wood'], .6],

    spider: ['m_spider_die1', 'm_spider_die2', 'm_spider_die3', 'm_spider_die4', 'm_spider_die5'], ogre: ['m_ogre_die1', 'm_ogre_die2'], wraith: ['m_ghost_die1', 'm_ghost_die2', 'm_ghost_die3'],

    zap: function () { var a = ac(), t = a.currentTime; for (var i = 0; i < 6; i++) tone(200 + Math.random() * 1600, i * .022, .03, 'sawtooth', .04); noise(0, .16, .09, 3500, 1.5, 900); },
    slam: function () { tone(70, 0, .25, 'sine', .22, 40); noise(0, .14, .12, 2600, 3); tone(1300, 0, .18, 'square', .025, 900); },
    boomS: function () { noise(0, .35, .22, 900, .7, 120, 'lowpass'); tone(100, 0, .3, 'sine', .2, 40); },

  window.__gd = { state: function () { return S; }, start: function (i, w) { who = w || who; showView(); startMap(i); }, world: function () { toWorld(); }, prog: prog, saveProg: saveProg, setWho: function (w) { who = w; },

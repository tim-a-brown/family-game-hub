<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.go-col{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}

/* Player bars: stone, name, and the wooden bowl that holds their prisoners */
.pbar{--c:var(--accent);display:flex;align-items:center;gap:10px;min-height:52px;padding:5px 8px 5px 10px;border-radius:14px;background:var(--w05);border:2px solid transparent;transition:border-color .2s, background .2s;}
.pbar.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;}
.pbar .nm{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.pbar .nm .ico{width:15px;height:15px;color:var(--text-3);flex:none;}
.pbar .nm span{overflow:hidden;text-overflow:ellipsis;}
.pbar .sub{font-size:.72rem;font-weight:700;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbar.on .sub{color:var(--c);}
.tok{width:28px;height:28px;border-radius:50%;flex:none;}
.tok.b,.mini.b{background:radial-gradient(circle at 36% 30%,#6a6a72 0%,#2b2b30 32%,#0c0c0e 72%);box-shadow:0 2px 3px rgba(0,0,0,.55);}
.tok.w,.mini.w{background:radial-gradient(circle at 36% 30%,#ffffff 0%,#f4f1ea 42%,#cfc8b8 100%);box-shadow:0 2px 3px rgba(0,0,0,.5);}
.pris{display:flex;align-items:center;gap:7px;flex:none;}
.pris .n{font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums;min-width:1.4ch;text-align:right;line-height:1;}
.pris .n.bump{animation:pop .45s var(--spring);}
.pris .lb{font-size:.62rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;text-align:right;line-height:1.1;}
/* Go-ke: a lathe-turned wooden bowl seen from above */
.bowl{position:relative;width:42px;height:42px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 50%,transparent 0 55%,rgba(0,0,0,.25) 56%,transparent 60%),
    repeating-radial-gradient(circle at 46% 44%,rgba(90,50,15,.18) 0 1.5px,transparent 1.5px 4px),
    radial-gradient(circle at 38% 32%,#d79a58,#a5652c 55%,#6d3d17);
  box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.25);}
.bowl::before{content:"";position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#7a4a22,#4c2b10 70%);box-shadow:inset 0 3px 6px rgba(0,0,0,.6);}
.bowl i{position:absolute;width:11px;height:11px;border-radius:50%;z-index:1;}
.bowl i.b{background:radial-gradient(circle at 36% 30%,#6a6a72,#1a1a1e 65%);box-shadow:0 1px 1px rgba(0,0,0,.6);}
.bowl i.w{background:radial-gradient(circle at 36% 30%,#fff,#ddd7ca 75%);box-shadow:0 1px 1px rgba(0,0,0,.5);}
.bowl.thud{animation:thud .3s ease-out;}
@keyframes thud{40%{transform:scale(1.12);}}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* The goban: a thick block of kaya with ink lines */
.goban{position:relative;aspect-ratio:1;border-radius:6px;margin-bottom:8px;
  background:var(--kaya,linear-gradient(160deg,#e6bd72,#d6a65a));background-size:cover;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 30px rgba(120,70,20,.18),0 2px 0 #c38f48,0 5px 0 #a8762f,0 8px 0 #8a5d22,0 18px 30px rgba(0,0,0,.55);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;}
.goban.shake{animation:shake .4s;}
.goban svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.goban svg.lines line{stroke:#2b1a0b;stroke-opacity:.82;stroke-width:1;vector-effect:non-scaling-stroke;}
.goban svg.lines line.e{stroke-width:1.7;}
.goban svg.lines circle{fill:#2b1a0b;fill-opacity:.9;}
.lay{position:absolute;inset:0;pointer-events:none;}
.st{position:absolute;border-radius:50%;}
.st.b{background:
    radial-gradient(circle at 34% 28%,rgba(255,255,255,.34) 0,rgba(255,255,255,0) 22%),
    radial-gradient(circle at 40% 36%,#4a4a50 0%,#232327 40%,#0a0a0b 78%);
  box-shadow:.06em .1em .14em rgba(0,0,0,.55),inset -.04em -.06em .1em rgba(0,0,0,.6);}
.st.w{background:
    radial-gradient(circle at 34% 28%,rgba(255,255,255,1) 0,rgba(255,255,255,0) 30%),
    repeating-linear-gradient(-28deg,rgba(150,140,120,0) 0 9%,rgba(150,140,120,.07) 9% 11%),
    radial-gradient(circle at 42% 38%,#fbfaf6 0%,#ece7dc 55%,#c9c1b0 100%);
  box-shadow:.06em .1em .14em rgba(0,0,0,.45),inset -.04em -.06em .1em rgba(120,105,80,.35);}
.lay.stones{font-size:var(--fs,16px);}
.st.new{animation:place .2s cubic-bezier(.5,0,.9,.6);}
@keyframes place{0%{transform:translate(-4%,-18%) scale(1.14);box-shadow:.3em .5em .5em rgba(0,0,0,.35);}100%{transform:none;}}
.st.lastm::after{content:"";position:absolute;left:30%;top:30%;width:40%;height:40%;box-sizing:border-box;border-radius:50%;border:max(1.5px,.09em) solid;}
.st.b.lastm::after{border-color:rgba(255,255,255,.85);}
.st.w.lastm::after{border-color:rgba(20,20,20,.8);}
.st.atari{box-shadow:0 0 0 max(1.5px,.08em) rgba(255,70,60,.95),0 0 .45em .12em rgba(255,50,40,.75),.06em .1em .14em rgba(0,0,0,.5);animation:atari 1.2s ease-in-out infinite;}
@keyframes atari{50%{box-shadow:0 0 0 max(1.5px,.08em) rgba(255,70,60,.6),0 0 .2em 0 rgba(255,50,40,.3),.06em .1em .14em rgba(0,0,0,.5);}}
/* Same pulse as opacity-only layers (no repaint per frame): the ring stays at its
   dim strength on the stone; the extra ring strength + wide glow fade out while the
   tight glow fades in. (The last-move stone keeps the old pulse: its ::after is the marker.) */
.st.atari:not(.lastm){box-shadow:0 0 0 max(1.5px,.08em) rgba(255,70,60,.6),.06em .1em .14em rgba(0,0,0,.5);animation:none;}
.st.atari:not(.lastm)::before,.st.atari:not(.lastm)::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;}
.st.atari:not(.lastm)::before{box-shadow:0 0 0 max(1.5px,.08em) rgba(255,70,60,.875),0 0 .45em .12em rgba(255,50,40,.75);animation:atari-out 1.2s ease-in-out infinite;}
.st.atari:not(.lastm)::after{box-shadow:0 0 .2em 0 rgba(255,50,40,.3);opacity:0;animation:atari-in 1.2s ease-in-out infinite;}
@keyframes atari-out{50%{opacity:0;}}
@keyframes atari-in{50%{opacity:1;}}
@media (prefers-reduced-motion:reduce){.st.atari:not(.lastm)::before,.st.atari:not(.lastm)::after{animation-duration:.01ms!important;}}
.st.dead{opacity:.42;filter:saturate(.6);}
.st.ghost{opacity:.5;box-shadow:none;transition:left .06s, top .06s;}
.st.ghost.pv{opacity:.72;animation:pv 1s ease-in-out infinite;}
@keyframes pv{50%{opacity:.45;}}
.xh{position:absolute;background:var(--accent);opacity:.55;pointer-events:none;}
.tm{position:absolute;border-radius:12%;}
.tm.b{background:#141416;box-shadow:0 0 0 1px rgba(255,255,255,.25);}
.tm.w{background:#f7f4ec;box-shadow:0 0 0 1px rgba(0,0,0,.35);}
.fly{position:fixed;z-index:400;border-radius:50%;pointer-events:none;font-size:16px;}

.turn{margin:0;min-height:34px;text-align:center;}
.turn span:last-child{min-width:0;}
.acts{display:flex;gap:10px;justify-content:center;}
.acts .btn{flex:1;max-width:180px;}
.acts .btn.ic{flex:0 0 auto;width:52px;padding:0;}
.acts .btn[disabled]{opacity:.45;}
.go-col.end>.info{display:none;}
.info{font-size:.78rem;font-weight:700;color:var(--text-3);text-align:center;}

/* Score sheet for the end of the game */
.sc{border-radius:12px;padding:8px 12px 10px;font-variant-numeric:tabular-nums;}
.sc.paper{background:linear-gradient(180deg,#fffaf0,#f3ead6);}
.sc table{width:100%;border-collapse:collapse;}
.sc table{table-layout:auto;}
.sc th,.sc td{padding:2px 3px;text-align:center;white-space:nowrap;}
.sc th:first-child,.sc td:first-child{text-align:left;}
.sc thead th{font-family:var(--font);font-size:.62rem;font-weight:800;color:#6b604c;text-transform:uppercase;letter-spacing:0;}
.sc td{font-family:var(--hand);font-size:1.15rem;color:var(--ink);border-top:1px dashed rgba(60,80,160,.22);line-height:1.15;}
.sc td:first-child{font-family:var(--font);font-size:.85rem;font-weight:800;color:#2a2a3a;max-width:6.5em;overflow:hidden;text-overflow:ellipsis;}
.sc td:first-child .mini{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;margin-right:6px;}
.sc td.t{font-size:1.3rem;padding-left:6px;font-weight:700;border-left:2px solid rgba(40,40,60,.35);}
.sc .res{font-family:var(--display);color:#2a2a3a;font-size:1.05rem;text-align:center;margin-top:4px;}
.sc .wait{color:#6b604c;font-weight:700;text-align:center;padding:16px 0;}

/* Rules diagrams */
.dgs{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:6px 0 4px;}
.dg{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:150px;}
.dg svg{display:block;border-radius:6px;box-shadow:0 3px 8px rgba(0,0,0,.35);}
.dg small{font-size:.78rem;color:var(--text-2);text-align:center;line-height:1.25;}

/* iPad portrait: bigger board */
@media (min-width:700px) and (orientation:portrait){
  #app.stage.ipl{max-width:none;}
  .go-col{max-width:min(700px,calc(100dvh - 450px));}
  .pbar{min-height:58px;}
  .pbar .nm{font-size:1.05rem;}
  .pbar .sub{font-size:.8rem;}
  .info{font-size:.85rem;}
}
/* Landscape (iPad, desktop, phones on their side): board left, panel right */
@media (orientation:landscape) and (min-width:640px){
  #app.stage.ipl{max-width:none;padding-bottom:calc(var(--safe-b) + 10px);padding-left:calc(16px + var(--corner-x));padding-right:calc(16px + var(--corner-x));}
  .go-col{--bsz:min(calc(100dvh - 82px - var(--safe-t) - var(--safe-b)),calc(100vw - 2 * var(--corner-x) - 360px));max-width:none;height:calc(var(--bsz) + 8px);
    display:grid;grid-template-columns:var(--bsz) minmax(250px,320px);grid-template-rows:max-content max-content max-content minmax(0,1fr) max-content max-content;
    grid-template-areas:"b t" "b s" "b i" "b x" "b a" "b p";column-gap:22px;row-gap:8px;justify-content:center;}
  .go-col>.goban{grid-area:b;width:var(--bsz);}
  .go-col>.pbar.top{grid-area:t;}
  .go-col>.pbar.bot{grid-area:p;}
  .go-col>.turn{grid-area:s;justify-content:flex-start;text-align:left;}
  .go-col>.info{grid-area:i;text-align:left;}
  .go-col>.scw{grid-area:x;align-self:start;min-height:0;overflow:auto;}
  .go-col>.acts{grid-area:a;}
  .acts .btn{max-width:none;}
}
@media (orientation:landscape) and (min-width:640px) and (max-height:500px){
  .go-col{--bsz:min(calc(100dvh - 84px - var(--safe-t) - var(--safe-b)),calc(100vw - 2 * var(--corner-x) - 330px));row-gap:6px;}
  .pbar{min-height:44px;padding:3px 8px;}
  .bowl{width:34px;height:34px;}
  .bowl::before{inset:5px;}
  .bowl i{width:9px;height:9px;}
  .turn{min-height:28px;font-size:.95rem;}
  .sc{padding:4px 10px 6px;}
  .sc td{font-size:1rem;}
  .sc tr.tot td{font-size:1.15rem;}
}
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  .go-col{grid-template-columns:var(--bsz) minmax(280px,330px);column-gap:28px;row-gap:10px;}
  .pbar{min-height:60px;}
  .pbar .nm{font-size:1.05rem;}
  .bowl{width:48px;height:48px;}
  .bowl::before{inset:7px;}
  .bowl i{width:12px;height:12px;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
/*ENGINE-START*/
// ═══════════════════════════════════════════════════════════════════════════
// Go engine. Pure code, no DOM: it also runs inside a Web Worker (toString).
// Boards are padded: (n+2)^2 points with an EDGE border. Colours: 1 black,
// 2 white. Chains are kept incrementally (circular stone lists + pseudo
// liberties), which makes Monte Carlo playouts fast.
// ═══════════════════════════════════════════════════════════════════════════
function GoEngine() {
  'use strict';
  var EDGE = 3, GEO = {};
  var MAXA = 21 * 21;
  var mark = new Int32Array(MAXA), stamp = 0, cmark = new Int32Array(MAXA), cstamp = 0;
  var libPt = 0, afterSize = 0;
  var rs = (Date.now() ^ 0x5bd1e995) | 0 || 7;
  function rnd() { rs ^= rs << 13; rs ^= rs >>> 17; rs ^= rs << 5; return (rs >>> 0) / 4294967296; }

  function geo(n) {
    if (GEO[n]) return GEO[n];
    var W = n + 2, A = W * W, pts = new Int16Array(n * n), p2i = new Int16Array(A), line = new Int8Array(A), r, c;
    p2i.fill(-1);
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) {
      var p = (r + 1) * W + c + 1; pts[r * n + c] = p; p2i[p] = r * n + c;
      line[p] = 1 + Math.min(r, c, n - 1 - r, n - 1 - c);
    }
    return (GEO[n] = { n: n, W: W, A: A, pts: pts, p2i: p2i, line: line, D: [1, -1, W, -W], DG: [W + 1, W - 1, -W + 1, -W - 1] });
  }
  function make(n) {
    var g = geo(n), A = g.A;
    var b = { n: n, g: g, col: new Int8Array(A), nxt: new Int16Array(A), chn: new Int16Array(A), lib: new Int16Array(A), sz: new Int16Array(A),
      emp: new Int16Array(n * n), eix: new Int16Array(A), ne: 0, ko: 0, toPlay: 1, passes: 0, last: 0, last2: 0, mv: 0, cap1: 0, cap2: 0 };
    b.col.fill(EDGE);
    for (var k = 0; k < n * n; k++) { var p = g.pts[k]; b.col[p] = 0; b.eix[p] = b.ne; b.emp[b.ne++] = p; }
    return b;
  }
  function copyTo(a, b) {
    b.col.set(a.col); b.nxt.set(a.nxt); b.chn.set(a.chn); b.lib.set(a.lib); b.sz.set(a.sz); b.emp.set(a.emp); b.eix.set(a.eix);
    b.ne = a.ne; b.ko = a.ko; b.toPlay = a.toPlay; b.passes = a.passes; b.last = a.last; b.last2 = a.last2; b.mv = a.mv; b.cap1 = a.cap1; b.cap2 = a.cap2;
  }
  function delEmpty(b, p) { var k = b.eix[p], q = b.emp[--b.ne]; b.emp[k] = q; b.eix[q] = k; }
  function addEmpty(b, p) { b.eix[p] = b.ne; b.emp[b.ne++] = p; }
  function merge(b, r1, r2) {
    var chn = b.chn, nxt = b.nxt, sz = b.sz, t;
    if (sz[r1] < sz[r2]) { t = r1; r1 = r2; r2 = t; }
    var s = r2; do { chn[s] = r1; s = nxt[s]; } while (s !== r2);
    t = nxt[r1]; nxt[r1] = nxt[r2]; nxt[r2] = t;
    sz[r1] += sz[r2]; b.lib[r1] += b.lib[r2];
  }
  function removeChain(b, r, out) {
    var col = b.col, nxt = b.nxt, D = b.g.D, s = r, d, q, cq;
    do { col[s] = 0; addEmpty(b, s); if (out) out.push(s); s = nxt[s]; } while (s !== r);
    s = r;
    do {
      for (d = 0; d < 4; d++) { q = s + D[d]; cq = col[q]; if (cq === 1 || cq === 2) b.lib[b.chn[q]]++; }
      s = nxt[s];
    } while (s !== r);
  }
  // Build a board from a plain array (index r*n+c, 0 empty, 1 black, 2 white)
  function fromArr(arr, n, toPlay, koI) {
    var b = make(n), g = b.g, col = b.col, chn = b.chn, k, p, d;
    for (k = 0; k < n * n; k++) if (arr[k]) { p = g.pts[k]; delEmpty(b, p); col[p] = arr[k]; chn[p] = p; b.nxt[p] = p; b.sz[p] = 1; b.lib[p] = 0; }
    for (k = 0; k < n * n; k++) if (arr[k]) {
      p = g.pts[k];
      if (col[p - 1] === col[p] && chn[p - 1] !== chn[p]) merge(b, chn[p], chn[p - 1]);
      if (col[p - g.W] === col[p] && chn[p - g.W] !== chn[p]) merge(b, chn[p], chn[p - g.W]);
    }
    for (k = 0; k < n * n; k++) if (arr[k]) { p = g.pts[k]; for (d = 0; d < 4; d++) if (col[p + g.D[d]] === 0) b.lib[chn[p]]++; }
    b.toPlay = toPlay || 1; b.ko = koI >= 0 ? g.pts[koI] : 0;
    return b;
  }
  function toArr(b) { var g = b.g, out = []; for (var k = 0; k < b.n * b.n; k++) out.push(b.col[g.pts[k]]); return out; }

  // Play p (0 = pass) for b.toPlay. The caller checks legality first.
  function play(b, p, out) {
    var c = b.toPlay, o = 3 - c;
    if (!p) { b.passes++; b.ko = 0; b.last2 = b.last; b.last = 0; b.toPlay = o; b.mv++; return 0; }
    var col = b.col, chn = b.chn, lib = b.lib, D = b.g.D, d, q, cq, cap = 0, capPt = 0;
    delEmpty(b, p); col[p] = c; chn[p] = p; b.nxt[p] = p; b.sz[p] = 1; lib[p] = 0;
    for (d = 0; d < 4; d++) { q = p + D[d]; cq = col[q]; if (cq === 0) lib[p]++; else if (cq !== EDGE) lib[chn[q]]--; }
    for (d = 0; d < 4; d++) { q = p + D[d]; if (col[q] === c && chn[q] !== chn[p]) merge(b, chn[p], chn[q]); }
    for (d = 0; d < 4; d++) { q = p + D[d]; if (col[q] === o && lib[chn[q]] <= 0) { cap += b.sz[chn[q]]; capPt = q; removeChain(b, chn[q], out); } }
    var r = chn[p];
    b.ko = cap === 1 && b.sz[r] === 1 && lib[r] === 1 ? capPt : 0;
    if (c === 1) b.cap1 += cap; else b.cap2 += cap;
    b.passes = 0; b.last2 = b.last; b.last = p; b.toPlay = o; b.mv++;
    return cap;
  }
  // 0 legal, 1 occupied, 2 suicide, 3 ko
  function why(b, p) {
    var col = b.col, D = b.g.D, c = b.toPlay, d, e, q, cq, r, k;
    if (col[p] !== 0) return 1;
    if (p === b.ko) return 3;
    for (d = 0; d < 4; d++) if (col[p + D[d]] === 0) return 0;
    for (d = 0; d < 4; d++) {
      q = p + D[d]; cq = col[q]; if (cq === EDGE) continue;
      r = b.chn[q]; k = 0;
      for (e = 0; e < 4; e++) { var qq = p + D[e]; if (col[qq] === cq && b.chn[qq] === r) k++; }
      if (cq === c) { if (b.lib[r] > k) return 0; } else if (b.lib[r] === k) return 0;
    }
    return 2;
  }
  function legal(b, p) { return why(b, p) === 0; }
  // An "eye" for c: all four neighbours are c (or the edge), and not a false eye
  function isEye(b, p, c) {
    var col = b.col, g = b.g, d, cq, bad = 0, edge = 0;
    for (d = 0; d < 4; d++) { cq = col[p + g.D[d]]; if (cq !== c && cq !== EDGE) return false; }
    for (d = 0; d < 4; d++) { cq = col[p + g.DG[d]]; if (cq === EDGE) edge = 1; else if (cq === 3 - c) bad++; }
    return bad + edge < 2;
  }
  // Real liberties of chain r, counting up to max. libPt = first one found.
  function libsCount(b, r, max) {
    var col = b.col, D = b.g.D, s = r, n = 0, d, q;
    stamp++;
    do {
      for (d = 0; d < 4; d++) {
        q = s + D[d];
        if (col[q] === 0 && mark[q] !== stamp) { mark[q] = stamp; if (!n) libPt = q; n++; if (n >= max) return n; }
      }
      s = b.nxt[s];
    } while (s !== r);
    return n;
  }
  // Liberties of the chain c would have after playing p (up to max; captures count as max).
  function libsAfter(b, p, c, max) {

    if (sc && dead[1] + dead[2]) hl.push(plural(dead[1] + dead[2], 'dead stone') + ' came off at the end');
    if (sc) {
      var tc = sc.terr[1] >= sc.terr[2] ? BLACK : WHITE;
      if (sc.terr[tc] >= 5) hl.push(pl(tc).name + ' surrounded ' + sc.terr[tc] + ' points of territory');
    }
    if (S.kos >= 2) hl.push('A ko fight: ' + S.kos + ' ko captures back and forth');
    var setupBits = S.n + '×' + S.n + (S.hcap >= 2 ? ', ' + S.hcap + '-stone handicap' : '') + ', komi ' + S.komi + ', ' + RULE_NAME[S.rule].toLowerCase();
    if (hl.length < 6) hl.push('Played on ' + setupBits + (vsCpu() ? ' vs the ' + LEVEL_NAME[S.level] + ' computer' : '') + ' in ' + plural(S.mv, 'move'));
    Kit.record(KEY, {
      started: S.started,
      mode: (vsCpu() ? 'vs Computer (' + LEVEL_NAME[S.level] + ')' : 'Pass & play') + ' · ' + S.n + '×' + S.n,
      players: [BLACK, WHITE].map(function (c) { var p = pl(c); return { name: p.name + ' (' + cname(c) + ')', score: sc ? sc.total[c] : (c === winC ? 1 : 0), cpu: p.cpu }; }),
      winner: winner.name + ' (' + cname(winC) + ')',
      summary: o.resign ? winner.name + ' won by resignation' : winner.name + ' won by ' + fmt(margin),
      highlights: hl, meta: { size: S.n, komi: S.komi, handicap: S.hcap, rule: S.rule, moves: S.mv }, detail: detail(sc)
    });
    clearSave();
    paint();
    setTimeout(function () {
      var lose = vsCpu() && winner.cpu;
      Kit.win({
        icon: lose ? 'bot' : 'trophy',
        title: lose ? winner.name + ' wins this one' : winner.name === 'You' ? 'You win!' : winner.name + ' wins!',
        sub: o.resign ? loser.name + ' resigned' : cname(winC) + ' wins by ' + fmt(margin) + ' points',
        rank: sc ? [winC, 3 - winC].map(function (c) { return { name: pl(c).name, score: sc.total[c], color: c === BLACK ? '#8b8b96' : '#f1efe9' }; }) : null,
        lose: !!lose, againLabel: 'Play again',
        again: function () { newGame(true); },
        extra: [{ label: 'View the board', onClick: function () {} }],
        closeLabel: 'Back to games'
      });
    }, o.resign ? 300 : 900);
  }

  // ── Layout ───────────────────────────────────────────────────────────────
  var col, topBar, botBar, bd, stonesL, terrL, hlL, ghost, xh, xv, turnEl, infoEl, scw, acts, pv = -1, hov = -1, touch = null;
  function pct(k) { return k * 100 / (S.n + 0.5) + '%'; }
  function place(node, i, size) {
    var r = (i / S.n) | 0, c = i % S.n, s = size || 0.96;
    node.style.left = pct(0.75 + c - s / 2); node.style.top = pct(0.75 + r - s / 2);
    node.style.width = node.style.height = pct(s);
  }
  function build() {
    app.innerHTML = ''; app.classList.add('ipl');
    col = el('div', { class: 'go-col' });
    topBar = el('div', { class: 'pbar top' }); botBar = el('div', { class: 'pbar bot' });
    bd = el('div', { class: 'goban', role: 'grid', 'aria-label': S.n + ' by ' + S.n + ' Go board' });
    var n = S.n, V = n + 0.5, a = 0.75, z = 0.75 + n - 1, svg = '<svg class="lines" viewBox="0 0 ' + V + ' ' + V + '" aria-hidden="true">';
    for (var k = 0; k < n; k++) {
      var e = k === 0 || k === n - 1 ? ' class="e"' : '';
      svg += '<line' + e + ' x1="' + a + '" x2="' + z + '" y1="' + (a + k) + '" y2="' + (a + k) + '"/>';
      svg += '<line' + e + ' y1="' + a + '" y2="' + z + '" x1="' + (a + k) + '" x2="' + (a + k) + '"/>';
    }
    E.stars(n).forEach(function (rc) { svg += '<circle cx="' + (a + rc[1]) + '" cy="' + (a + rc[0]) + '" r="' + (n >= 19 ? 0.13 : 0.1) + '"/>'; });
    bd.innerHTML = svg + '</svg>';
    terrL = el('div', { class: 'lay terr' }); stonesL = el('div', { class: 'lay stones' }); hlL = el('div', { class: 'lay hl' });
    xh = el('div', { class: 'xh', hidden: true }); xv = el('div', { class: 'xh', hidden: true }); ghost = el('div', { class: 'st ghost', hidden: true });
    hlL.appendChild(xh); hlL.appendChild(xv); hlL.appendChild(ghost);
    bd.appendChild(terrL); bd.appendChild(stonesL); bd.appendChild(hlL);
    bindBoard();
    turnEl = el('div', { class: 'turn' });
    infoEl = el('div', { class: 'info' });
    scw = el('div', { class: 'scw' });
    acts = el('div', { class: 'acts' });
    col.appendChild(topBar); col.appendChild(bd); col.appendChild(botBar);
    col.appendChild(turnEl); col.appendChild(acts); col.appendChild(infoEl); col.appendChild(scw);
    app.appendChild(col);
    fitFont();
  }
  // Stone shading is sized in em: keep the font size near one stone's size
  function fitFont() { if (bd && S) stonesL.style.setProperty('--fs', Math.max(8, bd.clientWidth / (S.n + 0.5) * 0.9) + 'px'); }
  window.addEventListener('resize', function () { fitFont(); });

  function capRects(list) {
    var out = [];
    if (!stonesL) return out;
    list.forEach(function (i) { var s = stonesL.querySelector('.st[data-i="' + i + '"]'); if (s) out.push({ i: i, r: s.getBoundingClientRect(), cls: s.classList.contains('b') ? 'b' : 'w' }); });
    return out;
  }
  function paint(anim) {
    if (!S || !S.b || !bd) return;
    var n = S.n, N2 = n * n, sc = S.phase !== 'play' && S.dead ? currentScore() : null;
    var at = {}; if (S.atari && S.phase === 'play') E.ataris(S.b, n).forEach(function (i) { at[i] = 1; });
    var dead = {}; (S.phase !== 'play' && S.dead ? S.dead : []).forEach(function (i) { dead[i] = 1; });
    stonesL.innerHTML = ''; terrL.innerHTML = '';
    for (var i = 0; i < N2; i++) {
      var v = S.b[i];
      if (v) {
        var s = el('div', { class: 'st ' + (v === BLACK ? 'b' : 'w') + (at[i] ? ' atari' : '') + (dead[i] ? ' dead' : '') + (i === S.last && S.phase === 'play' ? ' lastm' : '') + (anim && anim.i === i ? ' new' : ''), 'data-i': i });
        place(s, i); stonesL.appendChild(s);
      }
      if (sc && sc.owner[i]) { var t = el('div', { class: 'tm ' + (sc.owner[i] === BLACK ? 'b' : 'w') }); place(t, i, 0.32); terrL.appendChild(t); }
    }
    hideGhost();
    if (pv >= 0) showGhost(pv, true);
    paintBars(anim); paintStatus(); paintActs(); paintInfo(sc);
    if (anim && anim.from.length) flyCaptures(anim);
  }
  function bowlHtml(c) {
    // c's bowl holds the stones c captured (the other colour)
    var k = Math.min(9, S.caps[c]), cls = c === BLACK ? 'w' : 'b', out = '';
    var spots = [[16, 15], [22, 21], [12, 22], [20, 12], [25, 15], [15, 9], [9, 15], [18, 26], [26, 23]];
    for (var j = 0; j < k; j++) out += '<i class="' + cls + '" style="left:' + (spots[j][0] / 42 * 100 - 13) + '%;top:' + (spots[j][1] / 42 * 100 - 13) + '%"></i>';
    return out;
  }
  function paintBars(anim) {
    var hu = S.players.filter(function (p) { return !p.cpu; }), bs = hu.length === 1 ? hu[0].color : BLACK;
    bar(topBar, 3 - bs, anim); bar(botBar, bs, anim);
  }
  function bar(node, c, anim) {
    var p = pl(c), on = S.phase === 'play' && S.turn === c;
    node.className = 'pbar ' + (node === topBar ? 'top' : 'bot') + (on ? ' on' : '');
    node.style.setProperty('--c', c === BLACK ? '#a9a9b3' : '#f4f1e8');
    var sub;
    if (on && p.cpu && S.busy) sub = '<span class="think">Thinking <i></i><i></i><i></i></span>';
    else if (S.phase === 'play' && S.lastPass === c) sub = cname(c) + ' · passed';
    else sub = cname(c) + (S.hcap >= 2 && c === BLACK ? ' · ' + S.hcap + ' handicap' : '') + (c === WHITE ? ' · komi ' + S.komi : '') + (on ? ' · to play' : '');
    node.innerHTML = '';
    node.appendChild(el('span', { class: 'tok ' + (c === BLACK ? 'b' : 'w') }));
    node.appendChild(el('div', { class: 'who' }, [el('span', { class: 'nm', html: (p.cpu ? Kit.icon('bot') : '') + '<span>' + Kit.esc(p.name) + '</span>' }), el('span', { class: 'sub', html: sub })]));
    var bump = anim && anim.c === c && anim.caps.length;
    node.appendChild(el('div', { class: 'pris', 'aria-label': S.caps[c] + ' prisoners' }, [
      el('div', null, [el('div', { class: 'n' + (bump ? ' bump' : ''), text: String(S.caps[c]) }), el('div', { class: 'lb', text: 'caught' })]),
      el('div', { class: 'bowl', 'data-c': c, html: bowlHtml(c) })
    ]));
  }
  function paintStatus() {
    if (!turnEl || !S) return;
    paintBarsLite();
    var p = pl(S.turn), txt, color = S.turn === BLACK ? '#c4c4cf' : '#f4f1e8', dot = true;
    if (S.phase === 'over') {
      var r = S.result; dot = false;
      txt = r ? (r.resign ? pl(r.win).name + ' wins: ' + pl(r.resign).name + ' resigned' : (pl(r.win).name === 'You' ? 'You win' : pl(r.win).name + ' wins') + ' by ' + fmt(r.margin)) : 'Game over';
      color = 'var(--accent)';
    } else if (S.phase === 'mark') {
      txt = S.counting ? 'Finding dead stones…' : 'Tap a group to mark it dead or alive';
      color = 'var(--accent)';
    } else if (p.cpu) txt = S.busy ? p.name + ' is thinking…' : p.name + ' to play';
    else if (pv >= 0) txt = 'Tap again to place';
    else if (S.lastPass && S.lastPass !== S.turn) txt = (pl(S.lastPass).name === 'You' ? 'You' : pl(S.lastPass).name) + ' passed. ' + (p.name === 'You' ? 'Pass' : p.name + ', pass') + ' to end, or play on';
    else txt = Kit.poss(p.name) + ' turn' + (vsCpu() ? '' : ' (' + cname(S.turn) + ')');
    turnEl.innerHTML = ''; turnEl.style.setProperty('--c', color);
    if (dot) turnEl.appendChild(el('span', { class: 'dot' }));
    turnEl.appendChild(el('span', { text: txt }));
  }
  // Only refresh the "thinking" line in the bars (keeps bowls untouched)
  function paintBarsLite() {
    [topBar, botBar].forEach(function (node) {
      if (!node || !node.firstChild) return;
      var c = node.querySelector('.tok.b') ? BLACK : WHITE, p = pl(c), on = S.phase === 'play' && S.turn === c, sub = node.querySelector('.sub');
      node.classList.toggle('on', on);
      if (sub && on && p.cpu && S.busy) sub.innerHTML = '<span class="think">Thinking <i></i><i></i><i></i></span>';
    });
  }
  function paintActs() {
    acts.innerHTML = '';
    var human = S.phase === 'play' && !pl(S.turn).cpu && !S.busy;
    if (S.phase === 'play') {
      acts.appendChild(el('button', { type: 'button', class: 'btn btn-soft btn-sm', text: 'Pass', disabled: !human, onclick: function () { if (canAct()) { move(-1); } } }));
      if (touchy()) acts.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-sm', text: 'Place', disabled: !(human && pv >= 0), onclick: function () { if (pv >= 0 && canAct()) move(pv); } }));
      acts.appendChild(el('button', { type: 'button', class: 'btn btn-soft btn-sm ic', 'aria-label': 'Undo', html: Kit.icon('undo'), onclick: undo }));
    } else if (S.phase === 'mark') {
      acts.appendChild(el('button', { type: 'button', class: 'btn btn-soft btn-sm', text: 'Keep playing', onclick: keepPlaying }));
      acts.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-sm', text: 'Count score', disabled: !!S.counting, onclick: function () { finish(); } }));
    } else {
      acts.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-sm', text: 'Play again', onclick: function () { newGame(true); } }));
      acts.appendChild(el('button', { type: 'button', class: 'btn btn-soft btn-sm', text: 'New game', onclick: function () { epoch++; cancelThink(); clearSave(); showSetup(); } }));
    }
  }
  function paintInfo(sc) {
    col.classList.toggle('end', S.phase !== 'play');
    infoEl.textContent = S.n + '×' + S.n + ' · ' + RULE_NAME[S.rule] + ' · Komi ' + S.komi + (S.hcap >= 2 ? ' · Handicap ' + S.hcap : '') + (S.phase === 'play' ? ' · Move ' + (S.mv + 1) : '');
    scw.innerHTML = '';
    if (S.phase === 'play') return;
    var card = el('div', { class: 'sc paper' });
    if (!sc) { card.appendChild(el('div', { class: 'wait', text: S.result && S.result.resign ? pl(S.result.resign).name + ' resigned.' : 'Counting…' })); scw.appendChild(card); return; }
    var area = S.rule === 'area';
    function cell(c) {
      var p = pl(c), parts = [sc.terr[c], area ? sc.stones[c] : sc.pris[c], c === WHITE ? sc.komi + sc.hc : '–'];
      return '<tr><td><span class="mini ' + (c === BLACK ? 'b' : 'w') + '"></span>' + Kit.esc(p.name) + '</td><td>' + parts.join('</td><td>') + '</td><td class="t">' + sc.total[c] + '</td></tr>';
    }
    var h = '<table><thead><tr><th></th><th>Territory</th><th>' + (area ? 'Stones' : 'Prisoners') + '</th><th>' + (sc.hc ? 'Komi + hcp' : 'Komi') + '</th><th>Total</th></tr></thead><tbody>' + cell(BLACK) + cell(WHITE) + '</tbody></table>';
    var lead = sc.total[1] > sc.total[2] ? BLACK : WHITE, m = Math.abs(sc.total[1] - sc.total[2]);
    h += '<div class="res">' + (S.phase === 'over' ? (pl(lead).name === 'You' ? 'You win' : Kit.esc(pl(lead).name) + ' wins') : Kit.esc(cname(lead)) + ' leads') + ' by ' + m + ' · ' + RULE_NAME[S.rule].toLowerCase() + '</div>';
    card.innerHTML = h;
    scw.appendChild(card);
  }

  // ── Captured stones lift off and fly into the capturer's bowl ─────────────
  function flyCaptures(anim) {
    var bowl = col.querySelector('.bowl[data-c="' + anim.c + '"]');
    if (!bowl || !document.body.animate) return;
    var br = bowl.getBoundingClientRect(), list = anim.from.slice(0, 24);
    list.forEach(function (f, k) {
      var s = el('div', { class: 'fly st ' + f.cls });
      s.style.left = f.r.left + 'px'; s.style.top = f.r.top + 'px'; s.style.width = f.r.width + 'px'; s.style.height = f.r.height + 'px';
      document.body.appendChild(s);
      var dx = br.left + br.width / 2 - (f.r.left + f.r.width / 2), dy = br.top + br.height / 2 - (f.r.top + f.r.height / 2);
      var sc = Math.max(0.3, 12 / Math.max(1, f.r.width));
      var a = s.animate([
        { transform: 'translate(0,0) scale(1)', boxShadow: '1px 2px 3px rgba(0,0,0,.5)', offset: 0 },
        { transform: 'translate(0,-10px) scale(1.18)', boxShadow: '6px 12px 14px rgba(0,0,0,.4)', offset: 0.22 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ')', boxShadow: '1px 1px 2px rgba(0,0,0,.5)', offset: 1 }
      ], { duration: 560, delay: 60 + k * 45, easing: 'cubic-bezier(.45,0,.3,1)', fill: 'forwards' });
      a.onfinish = function () { s.remove(); if (k < 6) tock(0.35, 0); bowl.classList.remove('thud'); void bowl.offsetWidth; bowl.classList.add('thud'); };
      setTimeout(function () { s.remove(); }, 2000 + k * 50);
    });
  }

  // ── Board input: hover ghost with a mouse; tap to preview, tap again to place on touch
  function touchy() { return (navigator.maxTouchPoints || 0) > 0 || !finePointer(); }
  function finePointer() { try { return matchMedia('(hover:hover) and (pointer:fine)').matches; } catch (e) { return true; } }
  function canAct() { return S && S.phase === 'play' && !S.busy && !pl(S.turn).cpu; }
  function pointAt(e) {
    var r = bd.getBoundingClientRect(), u = r.width / (S.n + 0.5);
    var c = Math.round((e.clientX - r.left) / u - 0.75), rr = Math.round((e.clientY - r.top) / u - 0.75);
    if (c < 0 || rr < 0 || c >= S.n || rr >= S.n) return -1;
    return rr * S.n + c;
  }
  function showGhost(i, isPv) {
    if (i < 0 || !S) return hideGhost();
    ghost.hidden = false; ghost.className = 'st ghost ' + (S.turn === BLACK ? 'b' : 'w') + (isPv ? ' pv' : '');
    place(ghost, i);
    if (isPv && S.n >= 9) {
      var r = (i / S.n) | 0, c = i % S.n, th = Math.max(2, bd.clientWidth / 300) + 'px';
      xh.hidden = false; xv.hidden = false;
      xh.style.left = pct(0.75); xh.style.width = pct(S.n - 1); xh.style.top = 'calc(' + pct(0.75 + r) + ' - ' + parseFloat(th) / 2 + 'px)'; xh.style.height = th;
      xv.style.top = pct(0.75); xv.style.height = pct(S.n - 1); xv.style.left = 'calc(' + pct(0.75 + c) + ' - ' + parseFloat(th) / 2 + 'px)'; xv.style.width = th;
    } else { xh.hidden = true; xv.hidden = true; }
  }
  function hideGhost() { if (ghost) { ghost.hidden = true; xh.hidden = true; xv.hidden = true; } }
  function setPreview(i, quiet) {
    if (i < 0 || S.b[i]) { if (pv >= 0) { pv = -1; hideGhost(); paintStatus(); paintActs(); } return; }
    var w = E.tryPlay(S.b, S.n, i, S.turn, S.ko);
    if (!w.ok) { if (!quiet && WHY[w.why]) { Kit.toast(WHY[w.why]); Kit.haptic('error'); } pv = -1; hideGhost(); paintStatus(); paintActs(); return; }
    if (pv !== i) Kit.haptic('tick');
    pv = i; showGhost(i, true); paintStatus(); paintActs();
  }
  function bindBoard() {
    bd.addEventListener('pointermove', function (e) {
      if (!S) return;
      if (e.pointerType === 'mouse') {
        if (!canAct()) return hideGhost();
        var i = pointAt(e);
        if (i !== hov) { hov = i; if (i >= 0 && !S.b[i]) showGhost(i, false); else hideGhost(); }
      } else if (touch && canAct()) {
        var j = pointAt(e);
        if (j !== touch.i) { touch.moved = true; touch.i = j; if (j >= 0 && !S.b[j]) { pv = -1; showGhost(j, true); } }
      }
    });
    bd.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') { hov = -1; if (pv < 0) hideGhost(); } });
    bd.addEventListener('pointerdown', function (e) {
      if (!S || e.pointerType === 'mouse' || e.button) return;
      e.preventDefault();
      touch = { i: pointAt(e), start: pointAt(e), wasPv: pv, moved: false };
      try { bd.setPointerCapture(e.pointerId); } catch (er) {}
      if (canAct() && touch.i >= 0 && !S.b[touch.i] && touch.i !== pv) showGhost(touch.i, true);
    });
    bd.addEventListener('pointercancel', function () { touch = null; if (pv >= 0) showGhost(pv, true); else hideGhost(); });
    bd.addEventListener('pointerup', function (e) {
      if (!S) return;
      var i = pointAt(e);
      if (S.phase === 'mark') { touch = null; if (i >= 0) toggleDead(i); return; }
      if (e.pointerType === 'mouse') {
        if (e.button) return;
        if (!canAct() || i < 0) return;
        if (S.b[i]) return;
        hideGhost(); hov = -1; move(i); return;
      }
      var t = touch; touch = null;
      if (!canAct()) return;
      if (t && !t.moved && i >= 0 && i === t.wasPv) { move(i); return; }
      setPreview(i);
    });
    bd.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  // Test hooks
  window.__go = {
    E: E, state: function () { return S; },
    set: function (arr, turn, extra) { epoch++; cancelThink(); S.busy = false; S.b = arr.slice(); S.turn = turn || BLACK; S.hist = []; S.last = -1; S.ko = -1; S.phase = 'play'; S.passes = 0; S.lastPass = 0; S.dead = null; if (extra) for (var k in extra) S[k] = extra[k]; save(); paint(); maybeCpu(); },
    move: function (i) { return move(i); }, pass: function () { return move(-1); }, finish: function () { finish(); }, undo: undo, toggle: toggleDead
  };

  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.b && saved.players && saved.phase && saved.phase !== 'over') {
    S = saved; S.busy = false; S.counting = false;
    build(); paint();
    if (S.phase === 'mark' && !S.dead) enterMark();
    else maybeCpu();
  } else showSetup();
})();
</script>

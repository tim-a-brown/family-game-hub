body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;

.site-nav{flex:none;}
.site-nav .icon-btn{width:38px;height:38px;min-height:38px;padding:0;font-size:1rem;border-radius:50%;}
.arc{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:10px max(12px,var(--safe-r)) calc(10px + var(--safe-b)) max(12px,var(--safe-l));touch-action:none;}
.hud{flex:none;display:flex;gap:8px;justify-content:center;width:100%;}
.pill{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);}
.pill span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.pill b{font-family:var(--display);font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;}

#cv{display:block;touch-action:none;}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(5,10,20,.68);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:gn-fade .2s ease both;z-index:5;}
.ov.hidden{display:none;}
.ov-card{text-align:center;width:100%;max-width:280px;animation:gn-pop .3s var(--spring) both;}
.ov-emoji{font-size:2.6rem;line-height:1;margin-bottom:6px;}
.ov-title{font-family:var(--display);font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;}
.ov-title.red{color:var(--red);} .ov-title.gold{color:var(--gold);}
.ov-sub{color:var(--text-2);font-size:.92rem;margin-top:6px;line-height:1.45;}
.ov-stats{display:flex;gap:8px;justify-content:center;margin:16px 0 4px;}
.ov-stat{flex:1;max-width:120px;padding:8px 6px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);}
.ov-stat b{display:block;font-family:var(--display);font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;}
.ov-stat span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.ov .btn{min-width:180px;margin-top:16px;}
.hint{flex:none;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:480px;border-radius:999px;

@media (hover:hover) and (pointer:fine){ .touch-only{display:none !important;} }

// Logical size is in CSS pixels (same units the game was tuned in); the
// backing store is multiplied by devicePixelRatio for crisp rendering.
let LW=360,LH=500;
function resize(){
  const r=stage.getBoundingClientRect();
  const nw=Math.max(200,Math.floor(Math.min(480,r.width)));
  const nh=Math.max(240,Math.floor(Math.min(Math.round(nw*1.4),r.height)));
  const changed=nw!==LW||nh!==LH;
  LW=nw;LH=nh;
  const d=Math.min(window.devicePixelRatio||1,3);
  boardEl.style.width=LW+'px';boardEl.style.height=LH+'px';
  cv.style.width=LW+'px';cv.style.height=LH+'px';
  cv.width=Math.round(LW*d);cv.height=Math.round(LH*d);
  ctx.setTransform(d,0,0,d,0,0);
  return changed;
}
resize();

// ── Constants ─────────────────────────────────────────────────────────────

// ── State ─────────────────────────────────────────────────────────────────
let state='idle'; // idle | play | paused | won | dead | gameover
let level=1, score=0, lives=LIVES_START;
let bricks=[], ball={}, pad={}, particles=[];
let animId=null;
let leftHeld=false, rightHeld=false;
let touchX=null;
let launchPending=false;

// ── Build level ───────────────────────────────────────────────────────────
function buildLevel(lvl){
  const layout=LEVELS[(lvl-1)%LEVELS.length];
  const rows=layout.length;
  const bw=Math.floor((W()-BRICK_GAP*(COLS+1))/COLS);
  const topPad=Math.round(H()*0.08);
  bricks=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<COLS;c++){
      const t=layout[r][c];
      if(t===0)continue;
      const x=BRICK_GAP+(bw+BRICK_GAP)*c;
      const y=topPad+r*(BRICK_H+BRICK_GAP);
      const indestructible=t<0;
      const tier=indestructible?Math.abs(t):t;
      bricks.push({x,y,w:bw,h:BRICK_H,tier,indestructible,alive:true,pts:indestructible?0:TIER_PTS[tier]||10});
    }
  }
}

function resetBall(){
  const padW=getPadW();
  pad.x=W()/2-padW/2;
  ball.x=W()/2;
  ball.y=H()-PAD_Y_OFF-PAD_H-BALL_R-2;
  const spd=getBallSpeed();
  ball.vx=spd*(Math.random()>0.5?1:-1)*0.5;
  ball.vy=-spd;
  ball.speed=spd;
  launchPending=true;
}

function getPadW(){return Math.max(50,Math.round(W()*0.22)-level*1.5);}
function getBallSpeed(){return Math.min(9,4+level*0.35);}

function startLevel(lvl){
  level=lvl; buildLevel(lvl); resetBall(); particles=[];
  updateHud(); state='play'; render();
}

function initGame(){
  score=0; lives=LIVES_START; level=1;
  startLevel(1);
}

// ── HUD ───────────────────────────────────────────────────────────────────
function updateHud(){
  document.getElementById('hud-score').textContent=score.toLocaleString();
  document.getElementById('hud-level').textContent=level+'/'+LEVELS.length;
  const lv=document.getElementById('hud-lives');
  lv.innerHTML='';
  for(let i=0;i<lives;i++){const d=document.createElement('span');d.className='life';lv.appendChild(d);}
}

// ── Particles ─────────────────────────────────────────────────────────────
function spawnParticles(x,y,color,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const spd=1.5+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,color,r:2+Math.random()*2});
  }
}

// ── Physics step ─────────────────────────────────────────────────────────
function step(){
  if(state!=='play')return;
  const padW=getPadW();

  // Paddle movement — track velocity for physics
  const padSpd=7+level*0.3;
  const prevPadX=pad.x;
  if(leftHeld)  pad.x=Math.max(0,pad.x-padSpd);
  if(rightHeld) pad.x=Math.min(W()-padW,pad.x+padSpd);

  // Touch follow
  if(touchX!==null){
    const target=touchX-padW/2;
    const diff=target-pad.x;
    pad.x+=diff*0.3;
    pad.x=Math.max(0,Math.min(W()-padW,pad.x));
  }
  const padVx=pad.x-prevPadX; // paddle horizontal velocity this frame

  // Ball stuck to paddle until first touch
  if(launchPending){
    ball.x=pad.x+padW/2;
    return;
  }

  ball.x+=ball.vx; ball.y+=ball.vy;

  // Wall collisions
  if(ball.x-BALL_R<0){ball.x=BALL_R;ball.vx=Math.abs(ball.vx);}
  if(ball.x+BALL_R>W()){ball.x=W()-BALL_R;ball.vx=-Math.abs(ball.vx);}
  if(ball.y-BALL_R<0){ball.y=BALL_R;ball.vy=Math.abs(ball.vy);}

  // Paddle collision — top, side, and corner hits
  const padY=H()-PAD_Y_OFF-PAD_H;
  const padLeft=pad.x, padRight=pad.x+padW;
  const padTop=padY, padBot=padY+PAD_H;
  const bx=ball.x, by=ball.y+BALL_R; // bottom of ball

  // Top surface hit: ball moving down, bottom of ball in paddle's top band
  const onTop=ball.vy>0&&by>padTop&&by<padTop+PAD_H+Math.abs(ball.vy)+2
              &&bx>=padLeft-BALL_R&&bx<=padRight+BALL_R;
  // Side hit: ball moving into either side of the paddle
  const hitLeft= ball.vx>0&&ball.x+BALL_R>padLeft&&ball.x+BALL_R<padLeft+8&&ball.y+BALL_R>padTop&&ball.y-BALL_R<padBot;
  const hitRight=ball.vx<0&&ball.x-BALL_R<padRight&&ball.x-BALL_R>padRight-8&&ball.y+BALL_R>padTop&&ball.y-BALL_R<padBot;

  if(onTop&&bx>=padLeft-BALL_R&&bx<=padRight+BALL_R){
    ball.y=padTop-BALL_R;
    // rel: -1=left edge, 0=center, +1=right edge
    const rel=(ball.x-(pad.x+padW/2))/(padW/2);
    const clampedRel=Math.max(-1,Math.min(1,rel));
    const maxAngle=Math.PI*0.38; // max ~68° from vertical
    // angle measured from straight UP (0 = straight up, positive = rightward)
    const angle=clampedRel*maxAngle;
    const paddleInfluence=padVx*0.18;
    ball.vx=ball.speed*Math.sin(angle)+paddleInfluence;
    ball.vy=-ball.speed*Math.cos(angle); // cos(0)=1 → always strongly upward at center
    // Ensure minimum upward velocity so ball never goes horizontal/down
    const minVY=ball.speed*0.3;
    if(ball.vy>-minVY)ball.vy=-minVY;
    // Re-normalise to maintain constant speed
    const mag=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
    ball.vx=ball.vx/mag*ball.speed;
    ball.vy=ball.vy/mag*ball.speed;
    sBounce(0.6);
  } else if(hitLeft){
    ball.x=padLeft-BALL_R;ball.vx=-Math.abs(ball.vx);sBounce(0.4);
  } else if(hitRight){
    ball.x=padRight+BALL_R;ball.vx=Math.abs(ball.vx);sBounce(0.4);
  }

  // Ball out of bounds
  if(ball.y>H()+20){
    lives--;
    updateHud();
    haptic('error');
    if(lives<=0){
      state='gameover';
      ArcadeHi.check('breakout',score,()=>{});
    } else {
      state='dead';
    }
    return;
  }

  // Brick collisions
  for(const b of bricks){
    if(!b.alive)continue;
    if(ball.x+BALL_R<b.x||ball.x-BALL_R>b.x+b.w||ball.y+BALL_R<b.y||ball.y-BALL_R>b.y+b.h)continue;
    if(!b.indestructible){
      b.alive=false;
      score+=b.pts*(level);
      updateHud();
      spawnParticles(b.x+b.w/2,b.y+b.h/2,TIER_COLOR[b.tier]||'#fff');
      sBrick();haptic('light');
    } else {
      spawnParticles(b.x+b.w/2,b.y+b.h/2,'rgba(255,255,255,.5)',4);
      sWall();
    }
    // Reflect
    const overlapL=ball.x+BALL_R-b.x;
    const overlapR=b.x+b.w-(ball.x-BALL_R);
    const overlapT=ball.y+BALL_R-b.y;
    const overlapB=b.y+b.h-(ball.y-BALL_R);
    const minH=Math.min(overlapL,overlapR);
    const minV=Math.min(overlapT,overlapB);
    if(minH<minV){
      ball.vx*=-1;
      ball.x+=overlapL<overlapR?-(overlapL-BALL_R*0.1):overlapR-BALL_R*0.1;
    } else {
      ball.vy*=-1;
      ball.y+=overlapT<overlapB?-(overlapT-BALL_R*0.1):overlapB-BALL_R*0.1;
    }
    break;
  }

  // Check win
  if(bricks.filter(b=>!b.indestructible).every(b=>!b.alive)){
    score+=1000*level; // level clear bonus
    updateHud();
    haptic('success');
    if(level>=LEVELS.length){
      state='won';
      ArcadeHi.check('breakout',score,()=>{});
    } else {
      state='levelwin';
    }
    return;
  }

  // Particles
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=0.04;p.r*=0.97;});
}

// ── Render ────────────────────────────────────────────────────────────────
function render(){
  const w=W(),h=H();
  const padW=getPadW();
  const padY=h-PAD_Y_OFF-PAD_H;

  // Background gradient
  const bg=ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#050a14');bg.addColorStop(1,'#0a1628');
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);

  // Bricks
  bricks.forEach(b=>{
    if(!b.alive)return;
    const col=b.indestructible?'#4b5563':TIER_COLOR[b.tier]||'#888';
    const grad=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
    grad.addColorStop(0,col+'dd');grad.addColorStop(1,col+'88');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,3);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,3);ctx.stroke();
    if(b.indestructible){
      ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='bold 9px Inter,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('■',b.x+b.w/2,b.y+b.h/2);
    }
  });

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  // Paddle — flat-edged rectangle
  const padGrad=ctx.createLinearGradient(pad.x,padY,pad.x,padY+PAD_H);
  padGrad.addColorStop(0,'#93c5fd');padGrad.addColorStop(1,'#3b82f6');
  ctx.fillStyle=padGrad;
  ctx.fillRect(pad.x,padY,padW,PAD_H);
  // Highlight strip
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.fillRect(pad.x+4,padY+3,padW-8,4);

  // Ball
  if(state!=='gameover'){
    ctx.shadowColor='rgba(150,210,255,.9)';ctx.shadowBlur=10;
    const bGrad=ctx.createRadialGradient(ball.x-1,ball.y-1,1,ball.x,ball.y,BALL_R);
    bGrad.addColorStop(0,'#fff');bGrad.addColorStop(1,'#93c5fd');
    ctx.fillStyle=bGrad;
    ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  syncOverlay();

  // Launch hint
  if(launchPending&&state==='play'){
    ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,.6)';ctx.font=`600 ${Math.max(13,Math.round(w*0.034))}px Inter,system-ui,sans-serif`;
    ctx.textBaseline='bottom';
    ctx.fillText(isMobile?'Tap to launch':'Space or click to launch',w/2,padY-14);
    ctx.textBaseline='middle';
  }
}

// ── Game loop ─────────────────────────────────────────────────────────────
// Fixed 60 Hz physics so the game runs at the same speed on 120 Hz phones.
let lastT=0,acc=0;const DT=1000/60;
function loop(t){
  if(!lastT)lastT=t;
  acc+=Math.min(100,t-lastT);lastT=t;
  while(acc>=DT){step();acc-=DT;}
  render();
  animId=requestAnimationFrame(loop);
}

function startLoop(){if(!animId){lastT=0;acc=0;animId=requestAnimationFrame(loop);}}
function stopLoop(){if(animId){cancelAnimationFrame(animId);animId=null;}}

// ── Input ─────────────────────────────────────────────────────────────────
function handleAction(){
  if(state==='idle'){initGame();startLoop();return;}
  if(state==='dead'){resetBall();state='play';return;}
  if(state==='gameover'||state==='won'){stopLoop();state='idle';score=0;lives=LIVES_START;render();return;}
  if(state==='levelwin'){startLevel(level+1);return;}
  if(state==='paused'){state='play';return;}
  if(state==='play'&&launchPending){launchPending=false;return;}
  if(state==='play'&&!launchPending){state='paused';return;}
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){leftHeld=true;e.preventDefault();}
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){rightHeld=true;e.preventDefault();}
  if(document.querySelector('.ahi-overlay'))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();handleAction();}
  if(e.key==='p'||e.key==='P'){if(state==='play')state='paused';else if(state==='paused')state='play';}
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')leftHeld=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')rightHeld=false;
});

// Mouse
cv.addEventListener('mousemove',e=>{
  if(!isMobile){const r=cv.getBoundingClientRect();touchX=e.clientX-r.left;}
});
cv.addEventListener('click',e=>{if(!isMobile)handleAction();});

// Touch — drag anywhere on the play area to steer; a quick tap launches.
// (Taps no longer pause mid-rally; use the pause button in the nav.)
const arc=document.getElementById('arc');
let _tsTime=0, _tsMoved=false, _tsX0=0;
arc.addEventListener('touchstart',e=>{
  if(e.target.closest('.ov,button'))return;
  e.preventDefault();
  _tsTime=Date.now(); _tsMoved=false; _tsX0=e.touches[0].clientX;
  const r=cv.getBoundingClientRect();
  touchX=(e.touches[0].clientX-r.left);
},{passive:false});
arc.addEventListener('touchmove',e=>{
  if(e.target.closest('.ov,button'))return;
  e.preventDefault();
  if(Math.abs(e.touches[0].clientX-_tsX0)>6)_tsMoved=true;
  const r=cv.getBoundingClientRect();
  touchX=(e.touches[0].clientX-r.left);
},{passive:false});
arc.addEventListener('touchend',e=>{
  if(e.target.closest('.ov,button'))return;
  e.preventDefault();
  const held=Date.now()-_tsTime;
  if(!_tsMoved && held<260 && state==='play' && launchPending){ launchPending=false; }
  touchX=null;
},{passive:false});

// ── Overlays ──────────────────────────────────────────────────────────────
const ICON_PAUSE='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_PLAY='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
let shownState=null;
function bestScore(){try{const l=JSON.parse(localStorage.getItem('hi_breakout')||'[]');return Math.max(score,l.length?l[0].score:0);}catch(e){return score;}}
function syncOverlay(){
  if(state===shownState)return;
  shownState=state;
  document.getElementById('btn-pause').innerHTML=state==='paused'?ICON_PLAY:ICON_PAUSE;
  const ov=document.getElementById('ov'),card=document.getElementById('ov-card');
  let html='',btn='',twice=false;
  if(state==='idle'){
    html=`<div class="ov-emoji">🧱</div><div class="ov-title gold">Breakout</div>
      <div class="ov-sub">${LEVELS.length} levels · ${LIVES_START} lives<br>${isMobile?'Drag to move the paddle, tap to launch.':'Mouse or arrow keys to move, Space to launch.'}</div>`;
    btn='Play';
  }else if(state==='dead'){
    html=`<div class="ov-title red">Ball lost</div><div class="ov-sub">${lives} ${lives===1?'life':'lives'} remaining</div>`;
    btn='Continue';
  }else if(state==='paused'){
    html=`<div class="ov-title">Paused</div><div class="ov-sub">Level ${level} · ${score.toLocaleString()} pts</div>`;
    btn='Resume';
  }else if(state==='levelwin'){
    html=`<div class="ov-emoji">✨</div><div class="ov-title gold">Level ${level} clear!</div><div class="ov-sub" style="color:var(--green);font-weight:700">+${(1000*level).toLocaleString()} bonus</div>`;
    btn='Level '+(level+1)+' →';
  }else if(state==='gameover'||state==='won'){
    const best=bestScore();
    html=`${state==='won'?'<div class="ov-emoji">🏆</div>':''}<div class="ov-title ${state==='won'?'gold':''}">${state==='won'?'You win!':'Game over'}</div>
      <div class="ov-sub">${score>0&&score>=best?'🎉 New high score!':'Reached level '+level}</div>
      <div class="ov-stats"><div class="ov-stat"><b>${score.toLocaleString()}</b><span>Score</span></div><div class="ov-stat"><b>${best.toLocaleString()}</b><span>Best</span></div></div>`;
    btn='Play again';twice=true;
  }
  if(!html){ov.classList.add('hidden');return;}
  card.innerHTML=html+`<button class="btn btn-gold" id="ov-go">${btn}</button>`;
  ov.classList.remove('hidden');
  document.getElementById('ov-go').onclick=()=>{handleAction();if(twice)handleAction();};
}
document.getElementById('btn-pause').addEventListener('click',()=>{
  if(state==='play')state='paused';else if(state==='paused')state='play';
  render();
});
// Auto-pause when the app is backgrounded
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play'){state='paused';render();} });
window.addEventListener('blur',()=>{ if(state==='play'){state='paused';render();} });
new ResizeObserver(()=>{ if(resize()&&state==='idle'){pad.x=W()/2-60;ball.x=W()/2;ball.y=H()-PAD_Y_OFF-PAD_H-BALL_R-2;buildLevel(1);} render(); }).observe(stage);

// ── Sound ─────────────────────────────────────────────────────────────────
let _ac=null;
function sac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function sTone(f,s,d,v,type){try{const ctx=sac(),t=ctx.currentTime+s,o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.08,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
function sBounce(v){sTone(220,0,.08,v||0.06);}
function sBrick(){sTone(440,0,.06,.07);sTone(330,.02,.06,.05);}
function sWall(){sTone(180,0,.06,.04,'sawtooth');}

// ── Init ──────────────────────────────────────────────────────────────────
// Initialize paddle position for idle screen
pad={x:W()/2-60,y:0};
ball={x:W()/2,y:H()-PAD_Y_OFF-PAD_H-BALL_R-2,vx:0,vy:0,speed:5};
buildLevel(1);
updateHud();
render(); // show idle screen

// ── Session persistence ────────────────────────────────────────────────────
window.addEventListener('beforeunload',()=>{
  if(state==='play'||state==='paused'){
    try{sessionStorage.setItem('breakout',JSON.stringify({level,score,lives,_ts:Date.now()}));}catch(e){}
  }
});
(function(){
  try{
    const raw=sessionStorage.getItem('breakout');if(!raw)return;
    const s=JSON.parse(raw);if(!s)return;
    level=s.level||1;score=s.score||0;lives=s.lives||LIVES_START;
    startLevel(level);startLoop();
  }catch(e){}
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breakout</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<style>
/* ── Play view: fills the screen, no page scroll ────────────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 50% at 50% 0%, rgba(244,63,94,.14) 0%, rgba(244,63,94,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 8px calc(var(--safe-b) + 10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.ar-hud{flex:none;display:flex;gap:6px;width:100%;}
.ar-plate{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 8px;border-radius:14px;
  background:linear-gradient(180deg,#2a1a26 0%,#170d15 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,160,180,.3),inset 0 0 0 3.5px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.4);}
.ar-plate small{font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,205,215,.65);white-space:nowrap;}
.ar-plate b{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;}
.ar-plate.sc{flex:1.6;}
.ar-plate.sc b{color:#ffd45a;text-shadow:0 0 14px rgba(255,190,40,.4),0 2px 0 rgba(0,0,0,.5);}
.ar-plate.bump b{animation:bounce .45s var(--spring);}
.ar-lives{display:flex;gap:4px;height:1.52rem;align-items:center;}
.ar-lives i{display:block;width:18px;height:7px;border-radius:4px;background:linear-gradient(90deg,#e8384f 0 22%,#d9dde8 22% 78%,#e8384f 78%);box-shadow:0 0 6px rgba(255,255,255,.25);}
.ar-lives em{font-style:normal;font-family:var(--display);font-size:1.1rem;color:#fff;}
.ar-wrap{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:none;}
.ar-cab{position:relative;padding:7px;border-radius:20px;}
.ar-cab canvas{display:block;border-radius:13px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.ar-ov{position:absolute;inset:7px;border-radius:13px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(12,6,18,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(250px,84%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
.ar-hint{flex:none;font-size:.82rem;color:var(--text-3);text-align:center;font-weight:800;letter-spacing:.02em;}
@media (hover:hover) and (pointer:fine){ .ar-touch{display:none!important;} .ar-cab canvas{cursor:none;} }
@media (hover:none),(pointer:coarse){ .ar-desk{display:none!important;} }
@media (max-height:700px){ .ar-plate b{font-size:1.2rem;} }
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), root = document.documentElement;
  var KEY = 'breakout', SAVE = 'breakout_state', PROG = 'breakout_progress';
  var FW = 360, FH = 560;
  var COLS = 11, BW = 30, BH = 14, BG = 2, BX0 = (FW - (COLS * BW + (COLS - 1) * BG)) / 2, BY0 = 46;
  var PAD_Y = FH - 42, PAD_H = 12, PAD_W = 62, BALL_R = 5.5;
  var TICK = 1 / 120;
  var TOUCH = window.matchMedia && matchMedia('(pointer:coarse)').matches;

  // Brick colours (Arkanoid-style values)
  var BRICK = {
    w: { c: '#f2f2f6', pts: 50 }, o: { c: '#ff8a2a', pts: 60 }, c: { c: '#2fd3e0', pts: 70 }, g: { c: '#3ddc5a', pts: 80 },
    r: { c: '#ff3b4f', pts: 90 }, b: { c: '#3d6cff', pts: 100 }, p: { c: '#ff5cc8', pts: 110 }, y: { c: '#ffd02e', pts: 120 },
    s: { c: '#b8c0d0', pts: 50 }, '#': { c: '#d9a520', pts: 0 }
  };
  var LEVELS = [
    { name: 'Rainbow', rows: ['...........', 'rrrrrrrrrrr', 'ooooooooooo', 'yyyyyyyyyyy', 'ggggggggggg', 'ccccccccccc', 'bbbbbbbbbbb'] },
    { name: 'Staircase', rows: ['w..........', 'wo.........', 'woy........', 'woyg.......', 'woygc......', 'woygcb.....', 'woygcbp....', 'woygcbpr...', 'woygcbpry..', 'woygcbpryg.', 'sssssssssss'] },
    { name: 'Diamond', rows: ['.....p.....', '....pbp....', '...pbcbp...', '..pbcscbp..', '.pbcssscbp.', '..pbcscbp..', '...pbcbp...', '....pbp....', '.....p.....'] },
    { name: 'Fortress', rows: ['#.........#', '#.rrrrrrr.#', '#.ooooooo.#', '#.yyyyyyy.#', '#.........#', '#####.#####', '...........', 'ggggggggggg'] },
    { name: 'Invader', rows: ['..c.....c..', '...c...c...', '..ccccccc..', '.cc.ccc.cc.', 'ccccccccccc', 'c.ccccccc.c', 'c.c.....c.c', '...cc.cc...', '...........', 'yyyyyyyyyyy'] },
    { name: 'Checkers', rows: ['r.o.y.g.c.b', '.s.s.s.s.s.', 'p.r.o.y.g.c', '.s.s.s.s.s.', 'b.p.r.o.y.g', '.s.s.s.s.s.', 'c.b.p.r.o.y'] },
    { name: 'Pillars', rows: ['ooooooooooo', 'r#rrr#rrr#r', 'y#yyy#yyy#y', 'g#ggg#ggg#g', 'c#ccc#ccc#c', 'b.bbb.bbb.b', 'sssssssssss'] },
    { name: 'Heart', rows: ['..rr...rr..', '.rwwr.rrrr.', 'rwwrrrrrrrr', 'rrrrrrrrrrr', '.rrrrrrrrr.', '..rrrrrrr..', '...rrrrr...', '....rrr....', '.....r.....', '...........', 'sss.....sss'] },
    { name: 'Crossroads', rows: ['b.........b', 'bc.......cb', '.cg.....gc.', '..gy...yg..', '...yo.oy...', '....oro....', '...yo.oy...', '..gy...yg..', '.cg.....gc.', 'bc.......cb', 'b.........b'] },
    { name: 'The Vault', rows: ['...........', '#yyyyyyyyy#', '#ysssssssy#', '#ysrrrrrsy#', '#ysrwwwrsy#', '#ysrrrrrsy#', '#ysssssssy#', '#yyyyyyyyy#', '####...####'] },
    { name: 'Shelves', rows: ['ppppppppppp', 'sssssssssss', 'bbbbbbbbbbb', '##.##.##.##', 'ccccccccccc', 'sssssssssss', 'ggggggggggg', '.##.##.##..', 'yyyyyyyyyyy'] },
    { name: 'Grand Finale', rows: ['w.w.w.w.w.w', 'sssssssssss', 'rrrrrrrrrrr', 'o#ooooooo#o', 'yyyyyyyyyyy', 'g#ggggggg#g', 'ccccccccccc', 'b#bbbbbbb#b', 'ppppppppppp', 's.s.s.s.s.s'] }
  ];
  var NL = LEVELS.length;
  var POWERS = {
    W: { name: 'Wide', c: '#4d8bff', dur: 20, w: 26 },
    M: { name: 'Multiball', c: '#2fd3c0', dur: 0, w: 20 },
    S: { name: 'Slow', c: '#ff9a2e', dur: 14, w: 22 },
    L: { name: 'Laser', c: '#ff3b4f', dur: 12, w: 18 },
    P: { name: 'Extra life', c: '#b8c0d0', dur: 0, w: 4 }
  };

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function soundOn() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }

  // ═══ Sound ═══════════════════════════════════════════════════════════════
  var AC = null, master = null, noiseBuf = null;
  function ac() {
    if (!soundOn()) return null;
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
      master = AC.createGain(); master.gain.value = 0.8;
      var comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function osc(type, f, t0, dur, vol, o) {
    var a = ac(); if (!a) return; o = o || {};
    var t = a.currentTime + t0, n = a.createOscillator(), g = a.createGain(), out = n;
    n.type = type; n.frequency.setValueAtTime(f, t);
    if (o.to) n.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (o.lp) { var f2 = a.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; n.connect(f2); out = f2; }
    out.connect(g); g.connect(master); n.start(t); n.stop(t + dur + 0.05);
  }
  function noise(t0, dur, vol, type, freq) {
    var a = ac(); if (!a) return;
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;
    s.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq || 1000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  var lastS = {};
  function gate(k, gap) { var a = ac(); if (!a) return false; if (a.currentTime - (lastS[k] || 0) < gap) return false; lastS[k] = a.currentTime; return true; }
  function sPaddle(rel) { if (!gate('pad', 0.03)) return; osc('triangle', 330 + rel * 60, 0, 0.09, 0.09); osc('sine', 165, 0, 0.08, 0.06); }
  function sWall() { if (!gate('wall', 0.04)) return; osc('triangle', 220, 0, 0.05, 0.04); }
  function sBrick(chain) { if (!gate('brick', 0.02)) return; var m = 67 + Math.min(chain, 20); osc('square', mtof(m), 0, 0.07, 0.04, { lp: 3000 }); osc('triangle', mtof(m + 12), 0, 0.05, 0.03); noise(0, 0.07, 0.07, 'highpass', 3500); }
  function sMetal() { if (!gate('metal', 0.03)) return; osc('sine', 1760, 0, 0.18, 0.04); osc('sine', 2637, 0, 0.12, 0.025); osc('triangle', 440, 0, 0.05, 0.04); }
  function sGold() { if (!gate('gold', 0.04)) return; osc('triangle', 1200, 0, 0.08, 0.05); osc('sine', 2400, 0, 0.14, 0.03); }
  function sPower() { [72, 76, 79, 84].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.05, 0.16, 0.07); }); }
  function sLaser() { if (!gate('laser', 0.08)) return; osc('square', 1400, 0, 0.09, 0.025, { to: 320, lp: 4000 }); }
  function sLaunch() { osc('sine', 300, 0, 0.14, 0.08, { to: 700 }); }
  function sLose() { osc('sawtooth', 440, 0, 0.6, 0.07, { to: 70, lp: 1600 }); noise(0, 0.4, 0.15, 'lowpass', 800); }
  function sClear() { [72, 76, 79, 84, 88].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.08, 0.3, 0.08); osc('square', mtof(m), i * 0.08, 0.1, 0.02, { lp: 2500 }); }); }
  function sUp() { [79, 84, 91].forEach(function (m, i) { osc('sine', mtof(m), i * 0.07, 0.25, 0.08); }); }

  // ═══ State ═══════════════════════════════════════════════════════════════
  var G = null, view = 'none', paused = false;
  var bricks = [], balls = [], caps = [], bolts = [];
  var fx = { parts: [], pops: [], banner: null, shake: 0, flash: 0 };
  var pad = { x: FW / 2, tx: FW / 2, vx: 0, w: PAD_W, squash: 0 };

  function loadProg() { try { var p = JSON.parse(localStorage.getItem(PROG)) || {}; return { reached: clamp(p.reached || 1, 1, NL), best: p.best || {} }; } catch (e) { return { reached: 1, best: {} }; } }
  function saveProg(p) { try { localStorage.setItem(PROG, JSON.stringify(p)); } catch (e) {} }

  function buildBricks(n, hitsStr) {
    var L = LEVELS[n - 1], out = [], k = 0;
    L.rows.forEach(function (row, r) {
      for (var c = 0; c < COLS; c++) {
        var ch = row.charAt(c); if (ch === '.' || !ch) continue;
        var hits = ch === '#' ? -1 : ch === 's' ? (n >= 9 ? 3 : 2) : 1;
        out.push({ ch: ch, x: BX0 + c * (BW + BG), y: BY0 + r * (BH + 3), w: BW, h: BH, hits: hits, max: hits, flash: 0, idx: k++ });
      }
    });
    if (hitsStr) out.forEach(function (b, i) { var v = hitsStr.charAt(i); if (v !== '' && b.hits > 0) b.hits = +v; });
    return out.filter(function (b) { return b.hits !== 0; });
  }
  function breakableLeft() { var n = 0; for (var i = 0; i < bricks.length; i++) if (bricks[i].hits > 0) n++; return n; }
  function baseSpeed() { return Math.min(430, 285 + (G.level - 1) * 12); }
  function curSpeed() { return baseSpeed() * G.speedMul * (G.pw.S > 0 ? 0.62 : 1); }
  function padW() { return PAD_W * (G && G.pw.W > 0 ? 1.55 : 1); }

  function serve() {
    balls = [{ x: pad.x, y: PAD_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true, off: 6, trail: [] }];
    G.phase = 'serve'; G.serveT = 0; G.chain = 0;
  }
  function launch() {
    var b = balls.find(function (x) { return x.stuck; }); if (!b) return false;
    var a = clamp((b.off / (padW() / 2)) * 0.9, -0.9, 0.9) || 0.25;
    var v = curSpeed(); b.vx = Math.sin(a) * v; b.vy = -Math.cos(a) * v; b.stuck = false;
    G.phase = 'play'; sLaunch(); Kit.haptic('light');
    return true;
  }

  // ═══ Physics ═════════════════════════════════════════════════════════════
  function physics(dt) {
    // Paddle chases its target fast but not instantly (gives it velocity for spin)
    var w = padW(), maxV = 1500, dx = clamp(pad.tx, w / 2, FW - w / 2) - pad.x;
    var mv = clamp(dx, -maxV * dt, maxV * dt);
    if (Math.abs(dx) < 0.5) mv = dx;
    pad.x += mv; pad.vx = pad.vx * 0.7 + (mv / dt) * 0.3;
    pad.x = clamp(pad.x, w / 2, FW - w / 2);
    pad.squash = Math.max(0, pad.squash - dt * 6);
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (b.stuck) { b.x = pad.x + b.off; b.y = PAD_Y - BALL_R - 1; continue; }
      var sp = Math.hypot(b.vx, b.vy), steps = Math.ceil(sp * dt / (BALL_R * 0.7));
      var sdt = dt / steps;
      for (var s = 0; s < steps && !b.dead; s++) moveBall(b, sdt);
    }
    var before = balls.length;
    balls = balls.filter(function (b) { return !b.dead; });
    if (before && !balls.length && G.phase === 'play') loseLife();
    // Capsules
    caps.forEach(function (c) {
      c.y += 95 * dt; c.rot += dt * 4;
      if (c.y + 7 >= PAD_Y && c.y - 7 <= PAD_Y + PAD_H && Math.abs(c.x - pad.x) < padW() / 2 + 14) { c.dead = true; catchPower(c); }
      if (c.y > FH + 20) c.dead = true;
    });
    caps = caps.filter(function (c) { return !c.dead; });
    // Laser bolts
    bolts.forEach(function (bt) {
      bt.y -= 620 * dt;
      if (bt.y < 0) { bt.dead = true; return; }
      for (var j = 0; j < bricks.length; j++) {
        var k = bricks[j]; if (k.hits === 0) continue;
        if (bt.x > k.x && bt.x < k.x + k.w && bt.y < k.y + k.h && bt.y > k.y - 10) { bt.dead = true; hitBrick(k, null); break; }
      }
    });
    bolts = bolts.filter(function (b) { return !b.dead; });
    if (G.pw.L > 0 && G.phase === 'play') { G.laserT -= dt; if (G.laserT <= 0) { G.laserT = 0.34; fireLaser(); } }
    // Power timers
    ['W', 'S', 'L'].forEach(function (k) {
      if (G.pw[k] > 0) {
        G.pw[k] -= dt;
        if (G.pw[k] <= 0) { G.pw[k] = 0; if (k === 'S') balls.forEach(function (b) { if (!b.stuck) setSpeed(b, curSpeed()); }); }
      }
    });
    bricks = bricks.filter(function (k) { return k.hits !== 0; });
    if (G.phase === 'play' && breakableLeft() === 0) levelClear();
  }
  function setSpeed(b, v) { var m = Math.hypot(b.vx, b.vy) || 1; b.vx = b.vx / m * v; b.vy = b.vy / m * v; }
  function fixAngle(b) {
    // never let the ball travel too flat
    var v = Math.hypot(b.vx, b.vy), min = v * 0.3;
    if (Math.abs(b.vy) < min) { b.vy = (b.vy < 0 ? -1 : 1) * min; b.vx = Math.sign(b.vx || 1) * Math.sqrt(v * v - min * min); }
  }
  function moveBall(b, dt) {
    var px = b.x, py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    // walls
    if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); sWall(); }
    if (b.x > FW - BALL_R) { b.x = FW - BALL_R; b.vx = -Math.abs(b.vx); sWall(); }
    if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy); sWall(); }
    // paddle (top surface, only when falling)
    var w = padW();
    if (b.vy > 0 && py + BALL_R <= PAD_Y + 2 && b.y + BALL_R >= PAD_Y && b.x > pad.x - w / 2 - BALL_R && b.x < pad.x + w / 2 + BALL_R) {
      var rel = clamp((b.x - pad.x) / (w / 2), -1, 1);
      rel = clamp(rel + pad.vx * 0.00025, -1, 1);
      var a = rel * (Math.PI / 3), v = Math.min(Math.hypot(b.vx, b.vy) * 1.004, curSpeed() * 1.1);
      b.vx = Math.sin(a) * v; b.vy = -Math.cos(a) * v;
      b.y = PAD_Y - BALL_R;
      pad.squash = 1; G.chain = 0; G.stats.paddleHits++;
      if (G.speedMul < 1.3) G.speedMul += 0.004;
      for (var q = 0; q < 4; q++) part(b.x, PAD_Y, (Math.random() - 0.5) * 80, -40 - Math.random() * 60, '#cfe3ff', 0.25, 1.5);
      sPaddle(rel);
      return;
    }
    if (b.y > FH + 30) { b.dead = true; return; }
    // bricks
    for (var i = 0; i < bricks.length; i++) {
      var k = bricks[i]; if (k.hits === 0) continue;
      var cx = clamp(b.x, k.x, k.x + k.w), cy = clamp(b.y, k.y, k.y + k.h), dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;
      // which face did we come through?
      var fromSide;
      if (dx === 0 && dy === 0) {
        fromSide = (px < k.x || px > k.x + k.w) && !(py < k.y || py > k.y + k.h);
      } else fromSide = Math.abs(dx) > Math.abs(dy);
      if (fromSide) { b.vx = dx > 0 || (dx === 0 && px > k.x + k.w / 2) ? Math.abs(b.vx) : -Math.abs(b.vx); b.x = px; }
      else { b.vy = dy > 0 || (dy === 0 && py > k.y + k.h / 2) ? Math.abs(b.vy) : -Math.abs(b.vy); b.y = py; }
      fixAngle(b);
      hitBrick(k, b);
      break;
    }
  }
  function hitBrick(k, ball) {
    if (k.hits < 0) { k.flash = 1; sGold(); fx.shake = Math.max(fx.shake, 0.12); G.stats.goldHits++; return; }
    k.hits--; k.flash = 1;
    if (k.hits > 0) { sMetal(); burst(k.x + k.w / 2, k.y + k.h / 2, '#e8eef8', 4); return; }
    // shatter
    G.chain++; G.stats.bricks++;
    if (G.chain > G.stats.maxChain) G.stats.maxChain = G.chain;
    var base = k.ch === 's' ? 50 * G.level : BRICK[k.ch].pts;
    var pts = base * (G.chain >= 5 ? 2 : 1);
    addScore(pts);
    shatter(k);
    if (G.chain >= 5 && G.chain % 5 === 0) pop(k.x + k.w / 2, k.y, G.chain + ' chain! x2', '#ffd45a', 13);
    else if (k.ch === 's') pop(k.x + k.w / 2, k.y, '+' + pts, '#e8eef8', 11);
    sBrick(G.chain);
    if (G.speedMul < 1.3) G.speedMul += 0.0025;
    // Power-up capsule
    if (k.ch !== 's' && caps.length < 2 && balls.length < 6 && Math.random() < 0.12) dropCapsule(k.x + k.w / 2, k.y + k.h / 2);
    if (G.stats.bricks % 8 === 0) save();
    Kit.haptic('tick');
  }
  function dropCapsule(x, y) {
    var pool = [];
    Object.keys(POWERS).forEach(function (t) { if (t === 'P' && G.gotLife) return; for (var i = 0; i < POWERS[t].w; i++) pool.push(t); });
    var t = pool[Math.floor(Math.random() * pool.length)];
    caps.push({ t: t, x: x, y: y, rot: 0 });

  // ═══ Loop ════════════════════════════════════════════════════════════════

    }

    if (!paused && !G.ended && !document.hidden) raf = requestAnimationFrame(loop);
  }
  function wake() { if (!raf && view === 'game' && G && !paused && !G.ended && !document.hidden) { lastT = 0; raf = requestAnimationFrame(loop); } }

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blokus</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="blokus-core.js"></script>
<style>
.bk-credit{margin:-6px 0 2px;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-3);}
:root{--c1:#2f74e0;--c2:#f2c418;--c3:#e2382c;--c4:#2fa152;}

/* ── The page: plates (each color's tray and squares left), the board, the dock (whose turn, your tray, the buttons),
   and at a desk the room. fit() picks the composition and sizes every part from the window ── */
#app.stage.ipl{max-width:none;box-sizing:border-box;height:var(--avh,auto);padding:4px max(10px,var(--corner-x,0px)) max(calc(var(--safe-b) + 10px),18px);display:flex;align-items:stretch;justify-content:center;}
.bk{display:grid;gap:var(--gp,10px);width:100%;height:100%;min-height:0;}
.bk-port .bk{grid-template-columns:var(--cw);grid-template-rows:max-content var(--fsz) minmax(0,1fr);grid-template-areas:"p" "b" "d";justify-content:center;align-content:center;}
.bk-land .bk{grid-template-columns:var(--pl) var(--fsz) var(--dw);grid-template-rows:var(--fsz);grid-template-areas:"p b d";justify-content:center;align-content:center;column-gap:var(--cg,16px);}
.bk-dw .bk{grid-template-columns:var(--pl) var(--fsz) var(--dw);grid-template-rows:minmax(0,1fr);grid-template-areas:"p b d";justify-content:center;align-content:stretch;column-gap:var(--cg,28px);}
.bk-dv .bk{grid-template-columns:var(--pl) var(--fsz);grid-template-rows:var(--fsz) minmax(0,1fr);grid-template-areas:"p b" "p d";justify-content:center;column-gap:var(--cg,28px);row-gap:var(--gp,16px);}
.bk>.lcol{grid-area:p;min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px;}
.bk>.frame{grid-area:b;align-self:center;justify-self:center;}
.bk>.dock{grid-area:d;min-height:0;min-width:0;}

/* the plates: one a color, its owner, how many squares it has left and its tray drawn small */
.plates{display:grid;gap:8px;align-content:start;}
.bk-port .plates{grid-template-columns:1fr 1fr;}
.bk-port.bk-four .plates{grid-template-columns:repeat(4,1fr);}
.bk-land .plates,.bk-dw .plates,.bk-dv .plates{display:flex;flex-direction:column;gap:8px;}
.bk-land .plates{flex:1 1 auto;}
.bk-land .plate{flex:1 1 0;align-content:center;max-height:150px;}
.plate{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"s w n" "m m m";align-items:center;column-gap:8px;row-gap:4px;padding:6px 10px 7px 8px;border-radius:14px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s,background .2s,opacity .3s;}
.plate.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 16%,transparent);}
.plate.out:not(.on){opacity:.72;}
.plate .sw{grid-area:s;width:22px;height:22px;border-radius:6px;background:var(--pc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35),0 2px 4px rgba(0,0,0,.35);}
.plate .who{grid-area:w;min-width:0;display:flex;flex-direction:column;line-height:1.15;}
.plate .nm{font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:5px;min-width:0;}
.plate .nm>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.plate .nm .ico{width:14px;height:14px;color:var(--text-3);flex:none;}
.plate .sub{font-size:.7rem;font-weight:700;color:var(--text-3);}
.plate.on .sub{color:var(--lit-ink);}
.plate .n{grid-area:n;display:flex;flex-direction:column;align-items:flex-end;line-height:1;}
.plate .n b{font-family:var(--display);font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;}
.plate .n small{font-size:.64rem;font-weight:700;color:var(--text-3);margin-top:2px;white-space:nowrap;}
.plate .n b.bump{animation:pop .45s var(--spring);}
.plate .mini{grid-area:m;display:block;width:100%;height:var(--mh,18px);}
.plate.nomini .mini{display:none;}
.plate.nomini{grid-template-areas:"s w n";}
.bk-short .plate{padding:4px 8px;column-gap:6px;}
/* the smallest phones: the four plates in one row, each its color with its owner's initial and the squares left */
.bk-tiny .plates{grid-template-columns:repeat(4,1fr);gap:6px;}
.bk-tiny .plate{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"s n";padding:4px 7px;}
.bk-tiny .plate .who{display:none;}
.bk-tiny .plate .sw{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);}
.bk-tiny .plate .n small{font-size:.58rem;}
.bk-short .plate .sw{width:16px;height:16px;}
.bk-short .plate .nm{font-size:.8rem;}
.bk-short .plate .n b{font-size:1.1rem;}

/* the board: smoked slate in a dark frame, the four start squares marked in their colors */
.frame{--rim:clamp(5px,1.6vmin,14px);position:relative;padding:var(--rim);border-radius:16px;width:var(--fsz);height:var(--fsz);box-sizing:border-box;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 30%,#2a2f3d) 0,#262a36 22%,#20242f 50%,#262a36 78%,color-mix(in srgb,var(--c3) 30%,#2a2f3d) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.45),0 16px 34px rgba(0,0,0,.5);view-transition-name:bk-board;}
.frame::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;background:linear-gradient(225deg,color-mix(in srgb,var(--c2) 34%,transparent) 0,transparent 22%),linear-gradient(45deg,color-mix(in srgb,var(--c4) 34%,transparent) 0,transparent 22%);mix-blend-mode:screen;opacity:.8;}
.bd{position:relative;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.bd>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;}
.bd .hz{fill:transparent;}
.bd .pz.drop{animation:pdrop .38s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:center;}
@keyframes pdrop{0%{transform:scale(1.35);opacity:0;}60%{opacity:1;}100%{transform:none;opacity:1;}}
.bd .pz.won{animation:pwon 1.1s ease-in-out 2;transform-box:fill-box;transform-origin:center;}
@keyframes pwon{50%{filter:brightness(1.45) drop-shadow(0 0 .25px #fff3b0);}}
.bd .dot{animation:dotp 1.8s ease-in-out infinite;}
.bd .dot.lit{animation:none;opacity:1;}
@keyframes dotp{50%{opacity:.45;}}
.bd .gh.spin{animation:gspin .22s ease-out;transform-box:fill-box;transform-origin:center;}
@keyframes gspin{from{transform:rotate(-90deg);}}
.bd .gh.flip{animation:gflip .22s ease-out;transform-box:fill-box;transform-origin:center;}
@keyframes gflip{from{transform:scaleX(-1);}}
.bd .spk{animation:spk 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes spk{50%{transform:scale(1.5);opacity:.6;}}
.bd .ripple{fill:none;stroke:#ffd75a;stroke-width:.1;animation:rip .7s ease-out forwards;transform-box:fill-box;transform-origin:center;}
.bd .ripple.bad{stroke:#ff6a4d;}
@keyframes rip{from{transform:scale(.4);opacity:1;}to{transform:scale(2.6);opacity:0;}}
.bd.shake{animation:shake .4s;}
.fly{position:fixed;z-index:60;pointer-events:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));}
.fly svg{display:block;width:100%;height:100%;overflow:visible;}

/* the dock: whose turn, your tray, the buttons */
.dock{display:flex;flex-direction:column;gap:8px;}
.dock .turn{min-height:24px;margin:0;font-size:.92rem;font-weight:700;line-height:1.3;}
.tray{position:relative;flex:1 1 auto;min-height:0;}
.bk-strip .tray{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:0 0 58px;}
.bk-strip .tray::-webkit-scrollbar{display:none;}
.bk-strip .tray .pc{touch-action:pan-x;}
.tray .pc{position:absolute;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:0;border-radius:10px;background:transparent;cursor:pointer;touch-action:none;transition:background .15s,opacity .2s,transform .15s;-webkit-tap-highlight-color:transparent;}
.tray .pc svg{display:block;overflow:visible;pointer-events:none;}
.tray .pc:hover{background:rgba(255,255,255,.05);}
.tray .pc.sel{background:color-mix(in srgb,var(--lit) 16%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 70%,transparent);transform:translateY(-2px);}
.tray .pc.dead{opacity:.32;}
.tray .pc.used{cursor:default;pointer-events:none;}
.tray .pc:active:not(.used){transform:scale(.94);}
.tray.idle .pc{cursor:default;}
.tray.idle{opacity:.78;}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.acts .btn{flex:1 1 0;min-width:0;max-width:200px;}
.acts .btn.place{animation:pop .35s var(--spring);}
.acts .btn .ico{width:18px;height:18px;}
.bk-land .acts .btn,.bk-dw .acts .btn{flex:1 1 calc(50% - 8px);max-width:none;}
.bk-short .dock .turn{min-height:20px;font-size:.84rem;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}
.bk-dv .dock{display:grid;grid-template-columns:minmax(0,1fr) var(--aw,260px);grid-template-rows:max-content minmax(0,1fr);grid-template-areas:"t t" "y a";column-gap:20px;}
.bk-dv .dock .turn{grid-area:t;}
.bk-dv .dock .tray{grid-area:y;}
.bk-dv .dock .acts{grid-area:a;flex-direction:column;justify-content:flex-start;}
.bk-dv .dock .acts .btn{flex:none;max-width:none;}

/* at a desk: words a step up, and the room under the plates */
.room{display:none;}
.bk-desk .plates{gap:12px;}
.bk-desk .plate{padding:calc(8px * var(--dk,1)) calc(12px * var(--dk,1));border-radius:18px;}
.bk-desk .plate .nm{font-size:calc(1rem * var(--dk,1));}
.bk-desk .plate .sub{font-size:calc(.78rem * var(--dk,1));}
.bk-desk .plate .n b{font-size:calc(1.6rem * var(--dk,1));}
.bk-desk .plate .n small{font-size:calc(.72rem * var(--dk,1));}
.bk-desk .plate .sw{width:calc(26px * var(--dk,1));height:calc(26px * var(--dk,1));}
.bk-desk .dock .turn{font-size:calc(1rem * var(--dk,1));}
.bk-desk .lcol{gap:14px;}
.bk-desk .lcol>.plates{flex:none;}
.bk-desk .plates.two{display:grid;grid-template-columns:1fr 1fr;}
.bk-desk .room{display:grid;grid-template-columns:repeat(var(--rc,1),minmax(0,1fr));grid-auto-rows:max-content;gap:12px;align-content:start;align-items:start;flex:1 1 auto;min-height:0;overflow:hidden;}
.room .pn{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;font-size:calc(.92rem * var(--dk,1));}
.room h4{margin:0;font-size:.88em;font-weight:800;color:var(--text-3);}
.room .say{margin:0;font-weight:600;line-height:1.35;}
.room .sc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;}
.room .sc .pn2{display:flex;align-items:center;gap:6px;font-weight:700;overflow-wrap:anywhere;}
.room .sc .pn2 i{width:.95em;height:.95em;border-radius:3px;flex:none;background:var(--pc);}
.room .sc b{font-family:var(--display);font-size:1.35em;font-variant-numeric:tabular-nums;text-align:right;}
.room .sc .lead b{color:var(--lit-ink);}
.room .sc small{grid-column:1/-1;margin:-3px 0 2px 1.6em;color:var(--text-3);font-weight:700;font-size:.82em;}
.room .mvl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-height:0;}
.room .mvl li{display:grid;grid-template-columns:2.2em .9em minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px;border-radius:9px;}
.room .mvl li:first-child{background:color-mix(in srgb,var(--lit) 12%,transparent);}
.room .mvl li .no{color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:700;text-align:right;}
.room .mvl li i{width:.9em;height:.9em;border-radius:3px;background:var(--pc);}
.room .mvl li .t{font-weight:600;overflow-wrap:anywhere;}
.room .mvl li .tag{font-size:.8em;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--lit) 20%,transparent);color:var(--lit-ink);}
.room .mvl li .tag.blk{background:rgba(255,122,89,.18);color:#ffb39f;}
.room .mvl li.none{display:block;color:var(--text-3);}
.room .wins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.room .wins li{display:flex;justify-content:space-between;gap:10px;}
.room .wins li span{font-weight:700;overflow-wrap:anywhere;}
.plates{view-transition-name:bk-plates;}
.dock{view-transition-name:bk-dock;}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,.7,.25,1);}
::view-transition-old(root),::view-transition-new(root){animation:none;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), C = window.BlokusCore;
  var SAVE = 'blokus_state', KEY = 'blokus', N = 20, H = 400;
  var CREDIT = 'Blokus was designed by Bernard Tavitian and is published by Mattel Games.';
  var HEX = [null, '#2f74e0', '#f2c418', '#e2382c', '#2fa152'];
  var DARK = [null, '#123a86', '#8a6200', '#7c0f0a', '#0e5527'];
  var LIGHT = [null, '#9cc4ff', '#fff0a0', '#ffad9f', '#9be8b3'];
  var CNAME = [null, 'Blue', 'Yellow', 'Red', 'Green'];
  var NUM = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
  function num(n) { return NUM[n] || String(n); }
  function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  var ICO_ROT = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>';
  var ICO_FLIP = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M8 7 3 12l5 5z"/><path d="M16 7l5 5-5 5z"/></svg>';

  // ── The computer thinks in a Web Worker (blokus-core.js again), or on the page where a worker can't start ──
  var worker = null, workerOk = true, reqId = 0, pending = null;
  function getWorker() {
    if (worker || !workerOk) return worker;
    try {
      var url = new URL('blokus-core.js', location.href).href;
      var src = 'importScripts(' + JSON.stringify(url) + ');onmessage=function(e){var d=e.data;postMessage({id:d.id,res:self.BlokusCore.search(d.st,d.o)});};';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = function (e) { if (pending && e.data.id === pending.id) { var p = pending; pending = null; p.cb(e.data.res); } };
      worker.onerror = function () { workerOk = false; worker = null; if (pending) { var p = pending; pending = null; p.cb(C.search(p.st, p.o)); } };
    } catch (e) { workerOk = false; worker = null; }
    return worker;
  }
  function think(st, o, cb) {
    var id = ++reqId, w = getWorker();
    pending = { id: id, cb: cb, st: st, o: o };
    if (w) w.postMessage({ id: id, st: st, o: o });
    else setTimeout(function () { if (pending && pending.id === id) { pending = null; cb(C.search(st, o)); } }, 30);
  }
  function cancelThink() { pending = null; }
  function coreOf(st) { return { np: st.np, own: st.own, sh: st.sh, b: st.b, turn: st.turn, left: st.left, out: st.out, lastP: st.lastP, ml: [], n: st.n, over: st.over, sc: st.sc, psc: st.psc, win: st.win, last: null }; }

  // ── State ────────────────────────────────────────────────────────────────
  // S = the core's state (blokus-core.js) and {mode, cover, players: [{name, cpu, level}], hist (undo snapshots),
  //   started, bl: [squares of other players' corners each move covered], outN: [_, move when each color went out]}
  var S = null, SEL = -1, ORI = 0, GA = -1, GMOVED = false, LEG = null, LEGC = 0, LEGN = -1, OR_OF = {};
  var LEVEL_NAME = { easy: 'Easy', normal: 'Normal', hard: 'Hard' };
  var NET = null, LEFT = null, WINO = null, NETREC = {}, SHOWN = 0, HOLD = false, LASTP = -1;
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && !S.over) Kit.resume.set(S.n ? 'Move ' + (S.n + 1) : 'Ready');
  }
  function clearSave() { if (NET) return; try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function humans() { return S.players.filter(function (p) { return !p.cpu; }).length; }
  function vsCpu() { return S.players.some(function (p) { return p.cpu; }); }
  function solo() { return !NET && humans() === 1; }
  function isMe(i) { return NET ? NET.seat === i : solo() && !S.players[i].cpu; }
  function nmI(i) { return isMe(i) ? 'You' : S.players[i].name; }
  function whoC(c) { return S.own[c] < 0 ? -1 : S.own[c]; }
  // a color's name for a sentence: "Blue" (whose it is goes on the plate)
  function ownerLine(c) {
    var o = whoC(c);
    if (o < 0) return S.over ? 'Shared, not scored' : 'Shared: ' + nmI(C.ctrl(S, c)).replace(/^You$/, 'you') + ' next';
    return nmI(o);
  }
  function ctrlNow() { return C.ctrl(S, S.turn); }

  function rulesHtml() {
    return '<p class="goal">Fit as many of <b>your 21 pieces</b> onto the board as you can. The player with the fewest squares left over wins.</p>' +
      '<h3>Your turn</h3><ul><li>The colors play in turn: <b>Blue, Yellow, Red, Green</b>.</li>' +
      '<li>Each color’s <b>first piece covers its corner square</b>: Blue the top left, Yellow the top right, Red the bottom right and Green the bottom left.</li>' +
      '<li>Every piece after that must touch a piece of <b>its own color corner to corner</b>, and it can’t touch its own color along a side. It may touch other colors anywhere.</li>' +
      '<li>You can turn a piece and flip it over before you put it down.</li>' +
      '<li>When a color has no piece that fits anywhere, it is out for the rest of the game. The game ends when no color can play.</li></ul>' +
      '<h3>Placing a piece</h3><ul><li>Tap a piece in your tray. It appears on the board, outlined in white where it fits and in red where it doesn’t. Drag it, or tap the square where you want it.</li>' +
      '<li>Turn it with the turn button, or by tapping the piece in your tray again, and flip it with the flip button. On a keyboard, R turns, F flips, the arrow keys move it and Enter puts it down.</li>' +
      '<li>The small diamonds are the squares where your color can start a piece, and the gold sparks show the corners your piece touches.</li>' +
      '<li>Tap Place, or tap the piece on the board again, to put it down. A piece that can’t go anywhere is dimmed in your tray.</li></ul>' +
      '<h3>Scoring</h3><ul><li>Each color loses a point for each square left in its tray.</li>' +
      '<li>A color that places all 21 pieces gets <b>15 points</b>, or <b>20</b> if its last piece was the single square.</li>' +
      '<li>The highest score wins.</li></ul>' +
      '<h3>Two and three players</h3><ul><li><b>Two players:</b> one plays Blue and Red, the other Yellow and Green, and each adds their two colors’ scores together.</li>' +
      '<li><b>Three players:</b> each plays one color, and Green is shared. Green’s turns go to each player in turn, and Green’s score doesn’t count for anyone.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b> opens a table, and the others join on their own devices. Seats nobody takes are played by the computer. Take your turn whenever you like: the home screen shows when it’s your move.</li></ul>' +
      '<h3>Tips</h3><ul><li>Play your big pieces early, while there is room for them.</li>' +
      '<li>Head for the middle of the board, and keep plenty of corners open for yourself.</li>' +
      '<li>A piece laid across the corners another color needs can shut it in.</li></ul>' +
      '<p class="src">These are the rules in Mattel’s Blokus instructions, with the advanced scoring. Blokus Duo’s smaller two-player board is not included.</p>' +
      '<p class="credit">' + CREDIT + '</p>';
  }

  Kit.init({
    id: KEY, mark: false, snap: '.frame', snapY: 0.5,
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } cancelThink(); clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Blokus: past games' }); } }]),
    rules: rulesHtml()
  });

  function showSetup() {
    S = null; SEL = -1; GA = -1;
    app.className = 'stage';
    app.style.cssText = '';
    Kit.setup(app, {

      title: left ? left.text : !one ? 'A tie' : S.win[0] === me ? 'You win!' : S.players[S.win[0]].name + ' wins',
      sub: left ? '' : endLine(),
      rank: left ? null : rankRows(),
      notes: left ? null : [S.players.map(function (p, i) { return p.name + ' ' + (S.wins[i] || 0); }).join(', ')], notesTitle: 'Games won at this table',
      lose: !left && one && S.win[0] !== me, againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { WINO = null; netAgain(); },
      look: { label: 'Look at the board', onClick: function () { WINO = null; } }
    });
  }
  function netLeave() {
    NET = null; LEFT = null; SHOWN++; if (WINO) { WINO.close(); WINO = null; }
    var sv = null; try { sv = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv && sv.b && sv.players && !sv.over) { S = sv; S.busy = false; S.hist = S.hist || []; render(); afterTurn(); }
    else showSetup();
  }

  // ── Test and demo hooks ──────────────────────────────────────────────────
  window.__blokus = {
    C: C, state: function () { return S; }, sel: function () { return { p: SEL, o: ORI, a: GA, ok: ghostOk() }; },
    // a fresh game for these players: {mode: 'pp' | 'cpu', players: [{name, cpu, level}]}
    start: function (cfg) { cancelThink(); newGame({ mode: cfg.mode || 'pp', cover: false, players: cfg.players }); },
    // a position from a list of moves (codes, played in turn from an empty board), without the animations
    set: function (list) {
      cancelThink();
      var st = C.newGame(S.np);
      ['mode', 'cover', 'players', 'started'].forEach(function (k) { st[k] = S[k]; });
      freshFields(st);
      (Array.isArray(list) ? list : String(list).split(/\s+/).filter(Boolean)).forEach(function (cd) { var m = C.uncode(cd), cov = covered(st, m), r = C.play(st, m); if (r) note(st, r, cov); });
      S = st; SEL = -1; GA = -1; LEG = null; save(); render(); afterTurn();
    },
    code: C.code, play: function (m) { m = typeof m === 'string' ? C.uncode(m) : m; if (NET) return netMove(m); return play(m); },
    pick: function (p) { select(p); }, turn: turnPiece, flip: flipPiece, at: function (x) { aimAt(x); }, place: placeNow,
    piece: function (p) { return trayEl ? trayEl.querySelector('.pc[data-p="' + p + '"]') : null; },
    cell: function (x) { return bdEl ? bdEl.querySelector('.hz[data-x="' + x + '"]') : null; },
    ghost: function () { return bdEl ? bdEl.querySelector('.gh') : null; },
    fit: function () { fit(); }
  };

  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.b && saved.players && !saved.over) { S = saved; S.busy = false; S.hist = S.hist || []; render(); afterTurn(); }
  else showSetup();

  TurnNet.setup({
    game: KEY, title: 'Blokus', min: 2, max: 4, botMs: 600,
    seats: function (n, o) { return Math.max(n, Math.min(4, o && +o.seats || n)); },
    opts: netOpts, start: netStart, bot: netBot,
    turn: function (st) { return st.over ? [] : [C.ctrl(st, st.turn)]; },
    over: function (st) {
      if (!st.over) return null;
      return { win: st.win.slice(), text: st.win.length > 1 ? 'A tie' : st.players[st.win[0]].name + ' wins with ' + scoreStr(st.psc[st.win[0]]) };
    },
    show: netShow, leave: netLeave
  });
})();
</script>
</body>

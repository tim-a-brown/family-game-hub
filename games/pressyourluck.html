<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Press Your Luck</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="pressyourluck/art.js"></script>
<script src="pressyourluck/sound.js"></script>
<style>
@font-face{font-family:"Bungee";src:url("../fonts/bungee.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Jersey 10";src:url("../fonts/jersey-10.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Sofia Sans Condensed";src:url("../fonts/sofia-sans-condensed.woff2") format("woff2");font-weight:100 900;font-display:swap;}

/* ── The studio ──────────────────────────────────────────────────────── */
/* the game-show stage is dark in every theme: the bar and panels use the dark colours on it */
body.pyl-on{color:#fbf8ff;color-scheme:dark;--text:#fbf8ff;--text-2:#c9c1e6;--text-3:#8f86b3;--yellow:#ffc83d;--surface:#231c45;--surface-2:#2d2556;--surface-3:#3a3169;--bg:#141029;--bg-2:#1c1638;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);--seg:rgba(0,0,0,.25);--inset:rgba(0,0,0,.28);--inset-2:rgba(0,0,0,.38);--glass:rgba(20,16,41,.82);--shade:rgba(8,5,22,.55);--w03:rgba(255,255,255,.03);--w09:rgba(255,255,255,.09);--w15:rgba(255,255,255,.15);--w16:rgba(255,255,255,.16);--w04:rgba(255,255,255,.04);--w05:rgba(255,255,255,.05);--w06:rgba(255,255,255,.06);--w07:rgba(255,255,255,.07);--w08:rgba(255,255,255,.08);--w1:rgba(255,255,255,.1);--w12:rgba(255,255,255,.12);--w14:rgba(255,255,255,.14);--w18:rgba(255,255,255,.18);--w2:rgba(255,255,255,.2);--gold:#ffc83d;--text-dim:#c9c1e6;--shadow:0 10px 30px rgba(5,2,20,.45);--shadow-sm:0 4px 12px rgba(5,2,20,.35);--yellow-fill:#ffc83d;--seg-track:rgba(0,0,0,.3);--green:#3ddc84;--red:#ff4d5e;--orange:#ff8a3d;--blue:#4da3ff;}
body.pyl-on{
  background:
    radial-gradient(70% 30% at 50% 0%, rgba(255,70,190,.28), transparent 72%),
    radial-gradient(50% 40% at 0% 100%, rgba(40,200,255,.16), transparent 70%),
    radial-gradient(50% 40% at 100% 100%, rgba(255,200,40,.12), transparent 70%),
    repeating-conic-gradient(from 0deg at 50% 42%, rgba(140,110,255,.09) 0 5deg, transparent 5deg 14deg),
    radial-gradient(130% 90% at 50% 40%, #2b1886 0%, #170b58 46%, #08031f 100%);
  background-color:#0c0530;min-height:100dvh;}
#app.pyl{max-width:1240px;margin:0 auto;padding:2px 10px calc(var(--safe-b) + 10px);}
.pyls{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;}
.pyls > *{flex:none;}
.pyls.land{flex-direction:row;align-items:stretch;justify-content:center;gap:14px;}
.bwrap{position:relative;width:var(--bw,360px);height:var(--bh,400px);flex:none;}
.side{width:var(--bw,360px);display:flex;flex-direction:column;gap:10px;}
.pyls.land .side{width:var(--sw,320px);height:var(--bh);justify-content:space-between;}

/* ── The Big Board ───────────────────────────────────────────────────── */
.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));
  gap:var(--gap,5px);padding:var(--pad,12px);border-radius:calc(var(--pad,12px) * 1.5);
  background:linear-gradient(180deg,#2a1c78 0%,#140c4a 50%,#0b0630 100%);
  box-shadow:inset 0 0 0 2px #4b36b8, inset 0 0 0 5px #0d0733, inset 0 2px 30px rgba(140,110,255,.25), 0 0 0 2px #05021a, 0 16px 40px rgba(0,0,0,.55), 0 0 60px rgba(120,80,255,.25);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
.bulbs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0;}
.bulbs circle{fill:#5c3f12;stroke:#2a1a05;stroke-width:.6;animation:bulb var(--cs,1.6s) steps(1) infinite;}
.bulbs circle.b1{animation-delay:calc(var(--cs,1.6s) / -3);}
.bulbs circle.b2{animation-delay:calc(var(--cs,1.6s) / -1.5);}
@keyframes bulb{0%{fill:#fff6c6;stroke:#ffd23d;}33.3%,100%{fill:#5c3f12;stroke:#2a1a05;}}
.board.run{--cs:.42s;}
.board.flash .bulbs circle,.pan .bulbs circle.flash{animation:bulbAll .24s steps(1) infinite;animation-delay:0s;}
@keyframes bulbAll{0%{fill:#fff6c6;stroke:#ffd23d;}50%{fill:#5c3f12;stroke:#2a1a05;}}
.board.red .bulbs circle{animation:bulbRed .2s steps(1) infinite;animation-delay:0s;}
@keyframes bulbRed{0%{fill:#ff5a6a;stroke:#ff2b4a;}50%{fill:#4a0710;stroke:#2a0308;}}

.sq{position:relative;z-index:1;border-radius:calc(var(--pad,12px) * .7);background:#06031a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1), 0 2px 0 rgba(0,0,0,.4);cursor:pointer;}
.sq .face{position:absolute;inset:3px;border-radius:calc(var(--pad,12px) * .5);overflow:hidden;container-type:size;background:#0b0630;}
.sq .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 38%);mix-blend-mode:screen;}
.sq.lit{z-index:4;box-shadow:0 0 0 3px #fff8cc, 0 0 0 6px #ffcc1a, 0 0 22px 8px rgba(255,196,0,.8), 0 0 50px 10px rgba(255,150,0,.35);}
.sq.lit .face{filter:brightness(1.2) saturate(1.1);}
.board.run .sq:not(.lit) .face,.board.dim .sq:not(.lit) .face{filter:brightness(.55) saturate(.8);}
.sq.blink{animation:sqBlink .5s steps(1) 3;}
@keyframes sqBlink{0%{box-shadow:0 0 0 3px #fff8cc, 0 0 0 6px #ffcc1a, 0 0 30px 12px rgba(255,196,0,.9);}50%{box-shadow:0 0 0 2px #6a4a10;}}
.sq.won{animation:sqWon .9s var(--ease);}
@keyframes sqWon{0%{transform:scale(1);}30%{transform:scale(1.12);}100%{transform:scale(1);}}

/* Slides: what a square is showing right now */
.sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1;overflow:hidden;}
.sl.in{animation:slIn .3s var(--ease);}
@keyframes slIn{from{transform:perspective(200px) rotateX(-88deg);filter:brightness(2.2);}to{transform:none;}}
.sl .v{font-family:"Bungee",var(--display);font-weight:400;font-size:min(18.5cqw,30cqh);color:#ffe14d;letter-spacing:-.03em;white-space:nowrap;
  text-shadow:0 .08em 0 #7a3d00, 0 0 .4em rgba(255,200,40,.45);}
.sl .one{font-family:"Sofia Sans Condensed",var(--font);font-weight:900;font-style:normal;font-size:min(12.5cqw,17cqh);text-transform:uppercase;white-space:nowrap;
  color:#06301a;background:linear-gradient(#8bffb0,#3fe07a);padding:.12em .5em .1em;border-radius:99px;margin-top:7cqh;box-shadow:0 .1em 0 #0c6a33;}
.s-cash{background:radial-gradient(90% 80% at 50% 38%,#4a86ff,#1a3fc4 58%,#0b1d78);}
.s-cash.s-plus{background:radial-gradient(90% 80% at 50% 38%,#a06bff,#5d22cc 58%,#300c7c);}
.s-prize{background:linear-gradient(160deg,#ff58b6,#c01f92 60%,#6d0f5c);justify-content:space-evenly;padding:5cqh 0;}
.s-prize .win{width:86cqw;height:48cqh;background:linear-gradient(#fffaf0,#ffe9c2);border-radius:6cqw;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px #ffd23d, 0 .15em .3em rgba(0,0,0,.3);}
.s-prize .win svg{width:94%;height:94%;}
.s-prize .pn{display:none;font-family:"Sofia Sans Condensed",var(--font);font-weight:800;font-size:10cqw;color:#fff;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;}
.s-prize .v{font-size:min(15cqw,20cqh);color:#fff;text-shadow:0 .08em 0 #5a0040;}
.s-prize .one{margin-top:0;font-size:min(10cqw,13cqh);}
.s-prize.s-plus .win{height:38cqh;}
@container (min-width:118px) and (min-height:100px){ .s-prize .pn{display:block;} .s-prize .win{height:40cqh;} .s-prize.s-plus .win{height:32cqh;} }
.s-wh{background:radial-gradient(circle at 50% 40%,#3a1430,#1a0714 62%,#0a0208);box-shadow:inset 0 0 0 .14em #ff2b4a;}
.s-wh .g-sq{width:84cqw;height:62cqh;margin-top:-4cqh;filter:drop-shadow(0 .15em .2em rgba(0,0,0,.45));}
.s-wh b,.sl .sp{font-family:"Bungee",var(--display);font-weight:400;color:#fff;text-shadow:0 .09em 0 rgba(0,0,0,.4);}
.s-wh b{font-size:min(13cqw,16cqh);margin-top:1cqh;letter-spacing:.02em;}
.sl .sp{font-size:min(16.5cqw,14cqh);line-height:1.02;}
.sl .arr{width:30cqw;height:17cqh;margin-top:3cqh;transform:rotate(var(--rot,0deg));}
.s-move{background:linear-gradient(160deg,#ffbd4a,#ff7a00 60%,#b03c00);}
.s-back{background:linear-gradient(160deg,#3ff0d4,#0aa6a2 60%,#055a63);}
.s-big{background:radial-gradient(circle at 50% 35%,#fff7b8,#ffcd1a 48%,#d48a00);}
.s-big .sp{color:#c4001d;text-shadow:0 .08em 0 #fff2a0;font-size:min(16cqw,19cqh);}
.s-big .arr{color:#c4001d;}
.s-dbl{background:linear-gradient(160deg,#6dff9c,#16b052 60%,#076b2c);}
.s-dbl .sp{font-size:min(16.5cqw,17cqh);}

/* ── The centre screen ───────────────────────────────────────────────── */
.screen{grid-column:2/5;grid-row:2/6;position:relative;z-index:1;border-radius:calc(var(--pad,12px) * 1.1);
  background:linear-gradient(#1a1050,#0a0628);box-shadow:inset 0 0 0 2px #3a29a0, 0 0 0 3px #06031a, 0 6px 20px rgba(0,0,0,.5);}
.scr{position:absolute;inset:calc(var(--pad,12px) * .95);border-radius:calc(var(--pad,12px) * .6);overflow:hidden;container-type:size;
  background:radial-gradient(120% 90% at 50% 18%,#2238a8 0%,#0d1660 52%,#050728 100%);box-shadow:inset 0 0 0 2px #000, inset 0 0 30px rgba(0,0,0,.6);}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px), radial-gradient(120% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.45));}
.st{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqh;padding:4cqh 4cqw;text-align:center;transition:opacity .25s, transform .25s;}
.st.hide{opacity:0;transform:scale(.94);}
.st-r{font-family:"Bungee",var(--display);font-size:min(5.6cqw,4.6cqh);color:#ff7ad1;letter-spacing:.08em;}
.st-n{font-family:"Bungee",var(--display);font-size:min(12cqw,9.5cqh);color:var(--pc,#fff);line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 .5em color-mix(in srgb,var(--pc,#fff) 55%,transparent);}
.st-b{font-family:"Jersey 10",var(--mono);font-size:min(30cqw,24cqh);line-height:.8;color:#ffd23d;letter-spacing:.02em;text-shadow:0 0 .25em rgba(255,200,40,.6), 0 .04em 0 #7a4a00;}
.st-b.bump{animation:bump .5s var(--spring);}
@keyframes bump{0%{transform:scale(1);}35%{transform:scale(1.18);}100%{transform:scale(1);}}
.st-s{font-family:"Sofia Sans Condensed",var(--font);font-weight:800;color:#dfe6ff;font-size:min(7.4cqw,6cqh);letter-spacing:.03em;text-transform:uppercase;line-height:1.15;}
.st-s b{font-family:"Bungee",var(--display);font-weight:400;color:#7dff9e;font-size:1.3em;margin-right:.2em;}
.st-s small{display:block;font-size:.72em;color:#9fb0e8;font-weight:700;}
.st-w{display:flex;gap:2.4cqw;align-items:center;justify-content:center;}
.st-w svg{width:min(11cqw,9cqh);height:min(9cqw,7.4cqh);opacity:.22;filter:grayscale(1) brightness(1.6);}
.st-w svg.hit{opacity:1;filter:drop-shadow(0 0 .3em rgba(255,40,70,.9));}
.st-p{display:flex;gap:1.6cqw;justify-content:center;min-height:0;}
.st-p span{width:min(13cqw,9cqh);height:min(8cqw,5.6cqh);background:#fff6e2;border-radius:3px;display:grid;place-items:center;}
.st-p span svg{width:92%;height:92%;}
.st-m{font-family:"Bungee",var(--display);font-size:min(6cqw,4.8cqh);color:#fff;letter-spacing:.03em;min-height:1.2em;}
.st-m.chant span{display:inline-block;animation:chant 1.3s steps(1) infinite;opacity:0;position:absolute;left:0;right:0;}
.st-m.chant{position:relative;width:100%;height:1.2em;}
.st-m.chant span:nth-child(2){animation-delay:.43s;} .st-m.chant span:nth-child(3){animation-delay:.86s;color:#ff4a5c;}
@keyframes chant{0%{opacity:1;transform:scale(1.08);}33%,100%{opacity:0;}}
.fx{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5;}
.fx > *{grid-area:1/1;}
.fx-big{display:flex;flex-direction:column;align-items:center;gap:3cqh;animation:fxIn .45s var(--spring);}
.fx-big b{font-family:"Bungee",var(--display);font-weight:400;font-size:min(19cqw,17cqh);color:#ffe14d;line-height:1;text-shadow:0 .07em 0 #7a3d00, 0 0 .4em rgba(255,200,40,.6);white-space:nowrap;}
.fx-big i{font-style:normal;font-family:"Bungee",var(--display);font-size:min(9cqw,8cqh);color:#06301a;background:linear-gradient(#8bffb0,#3fe07a);padding:.15em .6em;border-radius:99px;box-shadow:0 .1em 0 #0c6a33;}
.fx-big.sp b{font-size:min(13cqw,12cqh);color:#fff;white-space:normal;text-align:center;line-height:1.05;}
.fx-big.sp.gold b{color:#ffe14d;}
.fx-big.red b{color:#ff4a5c;}
.fx-big small{font-family:"Sofia Sans Condensed",var(--font);font-weight:800;font-size:min(6.5cqw,5.5cqh);color:#cfd8ff;text-transform:uppercase;letter-spacing:.04em;text-align:center;max-width:90%;}
@keyframes fxIn{from{transform:scale(.3);opacity:0;}to{transform:none;opacity:1;}}
.fx-out{animation:fxOut .3s ease forwards;}
@keyframes fxOut{to{opacity:0;transform:scale(1.1);}}
.przc{display:flex;flex-direction:column;align-items:center;gap:2cqh;padding:4cqh 5cqw 4.5cqh;border-radius:4cqw;background:linear-gradient(160deg,#ff58b6,#b01c8a 60%,#6d0f5c);
  box-shadow:0 0 0 3px #ffd23d, 0 0 0 6px #6d0f5c, 0 10px 30px rgba(0,0,0,.6);animation:przIn .7s var(--spring);width:74cqw;}
@keyframes przIn{0%{transform:rotateY(90deg) scale(.6);}100%{transform:none;}}
.przc .win{width:100%;aspect-ratio:64/40;background:linear-gradient(#fffaf0,#ffe6b8);border-radius:3cqw;display:grid;place-items:center;box-shadow:inset 0 0 0 2px #ffd23d;}
.przc .win svg{width:92%;height:92%;}
.przc .nm{font-family:"Bungee",var(--display);font-size:min(7.6cqw,6.4cqh);color:#fff;text-align:center;line-height:1.05;}
.przc .vl{font-family:"Jersey 10",var(--mono);font-size:min(14cqw,11cqh);color:#ffe14d;line-height:.8;text-shadow:0 0 .3em rgba(255,200,40,.6);}
.przc i{font-style:normal;font-family:"Sofia Sans Condensed",var(--font);font-weight:900;text-transform:uppercase;font-size:min(6cqw,5cqh);color:#06301a;background:#5cf08a;padding:.1em .6em;border-radius:99px;}

/* Whammy scenes (art.js draws them; these keyframes run them, about 3 seconds) */
.wscene{position:absolute;inset:0;width:100%;height:100%;}
.wscene *,.wpod *{transform-box:view-box;}
.w-flash{opacity:0;animation:wFlash .9s ease-out;}
@keyframes wFlash{0%{opacity:0;}8%{opacity:.85;}20%{opacity:.2;}30%{opacity:.7;}100%{opacity:0;}}
.w-stamp{transform-origin:120px -18px;transform:scale(0);animation:wStamp .45s var(--spring) forwards;animation-delay:var(--st,2s);}
@keyframes wStamp{0%{transform:scale(3);opacity:0;}100%{transform:scale(1);opacity:1;}}
.g-eyes{animation:gBlink 2.4s infinite;transform-origin:0 -7px;transform-box:fill-box;}
@keyframes gBlink{0%,92%,100%{transform:scaleY(1);}95%{transform:scaleY(.1);}}
.g-wink{opacity:0;animation:gWink 7s infinite;}
.g-reye{animation:gWinkEye 7s infinite;}
@keyframes gWink{0%,85%,95%,100%{opacity:0;}86%,94%{opacity:1;}}
@keyframes gWinkEye{0%,85%,95%,100%{opacity:1;}86%,94%{opacity:0;}}
/* The Whammy's rig (joint positions from art.js): shoulders and elbows bend, he squashes at the feet */
.g-armr{transform-origin:28px -56px;} .g-forer{transform-origin:40px -40px;}
.g-arml{transform-origin:-28px -56px;} .g-forel{transform-origin:-40px -41px;}
.w-sq,.g-bod{transform-origin:0 0;} .g-hd{transform-origin:0 -50px;} .g-hair{transform-origin:0 -20px;} .g-cape{transform-origin:0 -60px;}
/* life while he stands there: breathing, the cape stirring, the hair springing; --hit is when he lands (follow-through) */
.wscene .g-bod,.wpod .g-bod{animation:gBreathe 1.3s ease-in-out infinite alternate;}
@keyframes gBreathe{to{transform:scale(.99,1.018);}}
.wscene .g-cape,.wpod .g-cape{animation:gCape 1.1s ease-in-out infinite alternate,gCapeHit .9s ease-out var(--hit,.5s);}
@keyframes gCape{from{transform:skewX(-2deg);}to{transform:skewX(2.5deg) scaleY(1.02);}}
@keyframes gCapeHit{0%{transform:none;}25%{transform:scale(1.06,.84);}55%{transform:scaleY(1.07) skewX(-5deg);}80%{transform:scaleY(.98) skewX(2deg);}100%{transform:none;}}
.wscene .g-hair,.wpod .g-hair{animation:gHair 1.3s ease-in-out infinite alternate,gHairHit .7s ease-out var(--hit,.5s);}
@keyframes gHair{to{transform:scaleY(1.04);}}
@keyframes gHairHit{0%{transform:none;}25%{transform:scale(1.06,.78);}55%{transform:scale(.97,1.15);}80%{transform:scale(1.01,.97);}100%{transform:none;}}
/* shared moves: a hop in on an arc, the squash and spring back on landing */
@keyframes arcIn{0%{transform:translateY(-24px);animation-timing-function:cubic-bezier(.25,.6,.45,1);}45%{transform:translateY(-52px);animation-timing-function:cubic-bezier(.55,0,.75,.45);}100%{transform:none;}}
@keyframes land{0%{transform:none;}30%{transform:scale(1.16,.82);}65%{transform:scale(.95,1.07);}100%{transform:none;}}
@keyframes hop{0%{transform:none;animation-timing-function:cubic-bezier(.3,.6,.5,1);}50%{transform:translateY(-12px);animation-timing-function:cubic-bezier(.5,0,.7,.4);}100%{transform:none;}}
@keyframes gone{0%{opacity:1;}100%{opacity:0;}}
@keyframes fadeOut{to{opacity:0;}}
/* eraser: hops in, scrubs back and forth, holds the eraser up */
.w-eraser{--hit:.46s;}
.w-eraser .w-guy{animation:erGuy 2.4s ease-in-out forwards;}
@keyframes erGuy{0%{transform:translateX(280px);animation-timing-function:cubic-bezier(.25,.6,.45,1);}20%{transform:translateX(170px);}30%{transform:translateX(120px);}40%{transform:translateX(165px);}50%{transform:translateX(95px);}60%{transform:translateX(140px);}70%{transform:translateX(70px);}82%,100%{transform:translateX(40px);}}
.w-eraser .w-hop{animation:arcIn .48s both;}
.w-eraser .w-sq{animation:land .42s ease-out .46s;}
.w-eraser .g-forer{animation:scrub .15s ease-in-out .55s 10 alternate;}
@keyframes scrub{from{transform:rotate(-16deg);}to{transform:rotate(14deg);}}
.w-eraser .g-armr{animation:armUp .55s cubic-bezier(.3,1.5,.5,1) 2.05s forwards;}
@keyframes armUp{to{transform:rotate(-70deg);}}
.w-erase{clip-path:inset(-10% 0 -10% 0);animation:erase 1.5s linear .55s forwards;}
@keyframes erase{to{clip-path:inset(-10% 100% -10% 0);}}
.w-crumbs{opacity:0;animation:erCrumb 1.6s ease-in .6s forwards;}
@keyframes erCrumb{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(40px);}}
/* bomb: tiptoes in, cowers with his hands up, comes out sooty and dizzy */
.w-bomb{--hit:.4s;}
.w-bomb .w-bomb{transform:translateY(-170px);transform-origin:150px 140px;animation:bmDrop 1.35s forwards;}

.w-teeth .g-armr{animation:tdrop .5s ease-out .45s both;}
@keyframes tdrop{0%{transform:rotate(-20deg);}40%{transform:rotate(14deg);}100%{transform:none;}}
.w-tdrop{opacity:0;animation:tFall .42s .45s both;}
@keyframes tFall{0%{opacity:0;transform:translateY(-30px) scale(.5);}25%{opacity:1;transform:translateY(-34px);animation-timing-function:cubic-bezier(.5,0,.9,.5);}100%{opacity:1;transform:none;}}
.w-tsq{animation:land .35s ease-out .85s;}
.w-thop{animation:hop .15s 1s 13;}
.w-jaw{transform-origin:-24px -20px;animation:chatter .09s ease-in-out .85s infinite alternate;}
@keyframes chatter{to{transform:rotate(-26deg);}}
.w-key{transform-origin:-34px -17px;animation:keyTurn .2s linear .85s infinite alternate;}
@keyframes keyTurn{to{transform:scaleY(-1);}}
.w-march{animation:tMarch 1.95s linear 1s forwards;}
@keyframes tMarch{to{transform:translateX(260px);}}
.w-teeth .w-ch{animation:eat .16s ease-in forwards;}
@keyframes eat{0%{transform:none;}40%{transform:scale(1.1,.8);}100%{transform:translate(-8px,6px) scale(0);opacity:0;}}
/* off to the podium: hops in with his gear, crouches, then zips toward the podiums (down or right) */
.w-dash{--hit:.45s;}
.w-dash .w-guy{animation:dsIn .45s cubic-bezier(.25,.6,.45,1) both;}
.w-dash.w-rt .w-guy{animation:dsIn .45s cubic-bezier(.25,.6,.45,1) both,dsRt .26s cubic-bezier(.6,0,.9,.5) .97s forwards;}
@keyframes dsIn{from{transform:translateX(-180px);}to{transform:none;}}
@keyframes dsRt{from{transform:none;}to{transform:translateX(300px);}}
.w-dash .w-hop{animation:arcIn .45s both;}
.w-dash.w-dn .w-hop{animation:arcIn .45s both,dsDn .3s .9s forwards;}
@keyframes dsDn{0%{transform:none;animation-timing-function:cubic-bezier(.3,.6,.5,1);}25%{transform:translateY(-16px);animation-timing-function:cubic-bezier(.6,0,.9,.4);}100%{transform:translateY(260px);}}
.w-dash .w-sq{animation:dsBody 1.25s both;}
@keyframes dsBody{0%,36%{transform:none;}41%{transform:scale(1.14,.84);}46%{transform:scale(.95,1.06);}50%,60%{transform:none;}72%{transform:scale(1.12,.8);}78%{transform:scale(.8,1.32);}100%{transform:scale(.7,1.5);}}
.w-dash.w-rt .w-sq{animation-name:dsBodyR;}
@keyframes dsBodyR{0%,36%{transform:none;}41%{transform:scale(1.14,.84);}46%{transform:scale(.95,1.06);}50%,60%{transform:none;}72%{transform:scale(1.1,.84) rotate(-7deg);}78%{transform:scale(1.3,.8) skewX(-14deg);}100%{transform:scale(1.5,.72) skewX(-20deg);}}
.w-dash .g-arml{animation:waveUp .35s cubic-bezier(.3,1.4,.5,1) .5s both;}
.w-dash .g-forel{animation:waveF .2s ease-in-out .7s 2 alternate;}
.w-zl{opacity:0;}
.w-dn .w-zl-dn,.w-rt .w-zl-rt{animation:zipL .7s ease-out 1s;}
@keyframes zipL{0%{opacity:1;}100%{opacity:0;}}
.w-dpuff{opacity:0;transform-origin:120px 132px;animation:poof .6s ease-out .98s;}
.w-chev{opacity:0;}
.w-dn .w-chev-dn,.w-rt .w-chev-rt{animation:chev 1s ease-in-out 1.15s;}
.w-chev path{animation:chevB .5s ease-in-out 1.15s 2;}
.w-chev-dn path{--cx:0;--cy:10px;} .w-chev-rt path{--cx:10px;--cy:0;}
@keyframes chev{0%,100%{opacity:0;}20%,75%{opacity:1;}}
@keyframes chevB{50%{transform:translate(var(--cx),var(--cy));}}
/* fourth Whammy: he springs up, lands and waves goodbye */
.w-out{--hit:.43s;--st:.5s;}
.w-out .w-hop{animation:outUp .45s both;}
@keyframes outUp{0%{transform:translateY(150px);animation-timing-function:cubic-bezier(.25,.6,.45,1);}60%{transform:translateY(-18px);animation-timing-function:cubic-bezier(.5,0,.75,.45);}100%{transform:none;}}
.w-out .w-sq{animation:land .42s ease-out .43s,sway .9s ease-in-out .9s infinite alternate;}
@keyframes sway{from{transform:rotate(-3deg);}to{transform:rotate(3deg);}}
.w-out .g-arml{animation:waveUp .4s cubic-bezier(.3,1.4,.5,1) .65s both;}
.w-out .g-forel{animation:waveF .26s ease-in-out .9s infinite alternate;}
/* The Whammy on the podium (the page lays him over the player's podium; see podWhammy) */
.wpod{position:absolute;z-index:30;pointer-events:none;--hit:1.3s;}
.wp-clip{position:absolute;inset:0;overflow:hidden;border-radius:14px;}
.wp-num{position:absolute;white-space:nowrap;box-sizing:border-box;margin:0;}
.wp-num span{display:inline-block;}
.wp-num i{display:inline-block;width:0;height:0;}
.wp-svg{position:absolute;left:0;top:0;overflow:visible;}
.wpod .w-hop{animation:wpDrop 1.9s .95s both;}
@keyframes wpDrop{0%{transform:translateY(-130px);opacity:0;animation-timing-function:cubic-bezier(.5,0,.9,.5);}2%{opacity:1;}19%{transform:none;}82%{transform:none;opacity:1;animation-timing-function:cubic-bezier(.3,.6,.5,1);}90%{transform:translateY(-36px);opacity:1;animation-timing-function:cubic-bezier(.5,0,.8,.4);}100%{transform:translateY(-80px);opacity:0;}}
.wpod .w-sq{animation:wpSq 1.9s .95s both;}
@keyframes wpSq{0%,18%{transform:scale(.85,1.2);}21%{transform:scale(1.22,.76);}26%{transform:scale(.94,1.08);}31%,79%{transform:none;}82%{transform:scale(1.12,.84);}86%{transform:scale(.86,1.18);}100%{transform:scale(.9,1.1);}}
.wp-stomp .w-sq{animation-name:wpStomp;}
@keyframes wpStomp{0%,18%{transform:scale(.85,1.2);}21%{transform:scale(1.22,.76);}24%{transform:scale(.95,1.06);}26%{transform:none;}
  29.5%{transform:translateY(-26px) scale(.95,1.06);animation-timing-function:cubic-bezier(.6,0,1,.6);}31.6%{transform:scale(1.22,.76);}35%{transform:scale(.95,1.06);}38%{transform:none;}
  47.5%{transform:translateY(-26px) scale(.95,1.06);animation-timing-function:cubic-bezier(.6,0,1,.6);}50%{transform:scale(1.22,.76);}53%{transform:scale(.95,1.06);}56%{transform:none;}
  65.5%{transform:translateY(-32px) scale(.94,1.08);animation-timing-function:cubic-bezier(.6,0,1,.6);}68.4%{transform:scale(1.26,.74);}72%{transform:scale(.95,1.06);}75%,79%{transform:none;}82%{transform:scale(1.12,.84);}86%{transform:scale(.86,1.18);}100%{transform:scale(.9,1.1);}}
.wp-stomp .g-arml{animation:waveUp .3s ease-out 1.38s both;}
.wp-stomp .g-armr{animation:armUp .3s ease-out 1.38s both;}
.wp-stomp .g-hair{animation:gHairHit .5s ease-out 1.55s,gHairHit .5s ease-out 1.9s,gHairHit .5s ease-out 2.25s;}
.wp-stomp .wp-num span{animation:wpFall .52s cubic-bezier(.4,0,.9,.6) var(--d) forwards;}
@keyframes wpFall{0%{transform:none;}15%{transform:translateY(-6px) rotate(calc(var(--r) * .2deg));}100%{transform:translateY(calc(var(--h) * 1px)) rotate(calc(var(--r) * 1deg));}}
.wp-broom .wp-guy{animation:wpSweep 1s 1.4s both;}
@keyframes wpSweep{0%{transform:none;animation-timing-function:ease-in-out;}33%{transform:translateX(calc(var(--sx) * .36px));animation-timing-function:ease-in-out;}66%{transform:translateX(calc(var(--sx) * .7px));animation-timing-function:ease-in-out;}100%{transform:translateX(calc(var(--sx) * 1px));}}
.wp-broom .g-forer{animation:push .33s ease-in-out 1.4s 3;}
@keyframes push{50%{transform:rotate(14deg);}}
.wp-broom .wp-num span{animation:wpFly .55s cubic-bezier(.2,.6,.4,1) var(--d) forwards;}
@keyframes wpFly{0%{transform:none;}30%{transform:translate(8px,-10px) rotate(30deg);}100%{transform:translate(48px,8px) rotate(170deg);opacity:0;}}
.wp-sack .wp-num span{animation:wpBag .36s var(--d) forwards;}
@keyframes wpBag{0%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.5,1);}45%{transform:translate(calc(var(--tx) * .5px),calc(var(--ty) * .5px - 18px)) rotate(-90deg);animation-timing-function:cubic-bezier(.5,0,.8,.5);}96%{opacity:1;}100%{transform:translate(calc(var(--tx) * 1px),calc(var(--ty) * 1px)) rotate(-200deg) scale(.3);opacity:0;}}
.wp-sack .w-sackb{transform-origin:44px -44px;animation:bulge 1.1s ease-out 1.4s both;}
@keyframes bulge{0%{transform:none;}20%{transform:scale(1.06,.96);}40%{transform:scale(1.1,1.06);}60%{transform:scale(1.16,1.04);}80%{transform:scale(1.2,1.14);}100%{transform:scale(1.24,1.16);}}
.wp-sack .g-armr{animation:hoist .3s cubic-bezier(.3,1.4,.5,1) 2.38s both;}
@keyframes hoist{to{transform:rotate(-55deg);}}
@media (prefers-reduced-motion:reduce){
  .wscene .g-bod,.wscene .g-cape,.wscene .g-hair,.wpod .g-bod,.wpod .g-cape,.wpod .g-hair{animation:none;}
  .wscene.w-bomb{animation:none;}
}

/* The Whammy takes over the whole board */
.wover{position:absolute;inset:var(--pad,12px);z-index:7;border-radius:calc(var(--pad,12px) * .8);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;
  background:radial-gradient(90% 60% at 50% 42%,#3d1170 0%,#1a0840 60%,#08031c 100%);box-shadow:inset 0 0 0 3px #ff2b4a, inset 0 0 50px rgba(255,40,70,.45);animation:panIn .2s ease-out;}
.wover::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);}
.wover .wscene{position:relative;inset:auto;width:100%;height:auto;max-height:80%;flex:none;}
.wcap{font-family:"Bungee",var(--display);color:#fff;text-align:center;line-height:1.05;opacity:0;animation:capIn .45s var(--spring) forwards;animation-delay:2.1s;padding:0 12px;font-size:clamp(15px,4.4vw,24px);}
.wcap b{display:block;font-weight:400;color:#ff4a5c;font-size:1.9em;text-shadow:0 0 .4em rgba(255,40,70,.6);}
.wcap small{display:block;font-family:"Sofia Sans Condensed",var(--font);font-weight:800;font-size:.7em;color:#d6c8ff;text-transform:uppercase;letter-spacing:.05em;margin-top:.3em;}
.wover.out .wcap{animation-delay:.9s;}
@keyframes capIn{from{opacity:0;transform:scale(.5);}to{opacity:1;transform:none;}}

/* ── Podiums ──────────────────────────────────────────────────────────── */
.pods{display:flex;gap:8px;}
.pyls.land .pods{flex-direction:column;gap:10px;}
.pod{flex:1 1 0;min-width:0;position:relative;border-radius:14px;overflow:hidden;text-align:center;
  background:linear-gradient(180deg,#3c2b92 0%,#22166a 55%,#150d48 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12), 0 4px 0 #0a0628, 0 8px 18px rgba(0,0,0,.4);transition:transform .25s var(--spring), box-shadow .25s;}
.pod .pn{background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 80%,#fff),var(--pc));color:#1a1033;font-family:"Bungee",var(--display);font-size:13px;line-height:1;padding:5px 6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pod .pb{font-family:"Jersey 10",var(--mono);font-size:30px;line-height:.85;color:#ffd23d;margin-top:5px;text-shadow:0 0 8px rgba(255,200,40,.55);font-variant-numeric:tabular-nums;}
.pod .ps{font-family:"Sofia Sans Condensed",var(--font);font-weight:800;font-size:12.5px;color:#d6dcff;text-transform:uppercase;letter-spacing:.03em;margin-top:2px;white-space:nowrap;}
.pod .ps b{color:#7dff9e;font-weight:900;}
.pod .ps em{font-style:normal;color:#ffb35c;}
.pod .pw{display:flex;justify-content:center;gap:3px;padding:3px 0 7px;}
.pod .pw svg{width:17px;height:14px;opacity:.2;filter:grayscale(1) brightness(1.7);}
.pod .pw svg.hit{opacity:1;filter:none;}
.pod.on{transform:translateY(-3px);box-shadow:inset 0 0 0 2px var(--pc), 0 0 0 2px var(--pc), 0 0 22px color-mix(in srgb,var(--pc) 70%,transparent), 0 4px 0 #0a0628;}
.pod.out{filter:grayscale(.85) brightness(.7);}
.pod.out::after{content:"OUT";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);font-family:"Bungee",var(--display);font-size:22px;color:#ff2b4a;border:3px solid #ff2b4a;border-radius:8px;padding:0 6px;background:rgba(20,8,30,.75);}
.pod.gain .pb{animation:bump .5s var(--spring);}
.pyls.land .pod{flex:none;display:grid;grid-template-columns:1fr auto;grid-template-areas:"n n" "b w" "s s";text-align:left;}
.pyls.land .pod .pn{grid-area:n;font-size:15px;padding:6px 10px 5px;}
.pyls.land .pod .pb{grid-area:b;font-size:40px;padding-left:10px;margin-top:6px;}
.pyls.land .pod .pw{grid-area:w;align-items:center;padding:6px 10px 0;}
.pyls.land .pod .pw svg{width:22px;height:18px;}
.pyls.land .pod .ps{grid-area:s;padding:0 10px 9px;font-size:14px;}

/* ── Controls: the big red button and Pass ───────────────────────────── */
.ctl{display:grid;grid-template-columns:minmax(0,1fr) var(--dome) minmax(0,1fr);align-items:center;gap:10px;--dome:clamp(108px,33vw,150px);min-height:calc(var(--dome) + 4px);}
.pyls.land .ctl{grid-template-columns:var(--dome) minmax(0,1fr);grid-template-areas:"h h" "d p";row-gap:10px;}
.pyls.land .ctl .hint{grid-area:h;text-align:center;}
.pyls.land .ctl .dome{grid-area:d;}
.pyls.land .ctl .passb{grid-area:p;}
.hint{font-family:"Sofia Sans Condensed",var(--font);font-weight:800;font-size:15px;line-height:1.15;color:#e8e2ff;text-transform:uppercase;letter-spacing:.03em;text-shadow:0 1px 0 rgba(0,0,0,.5);}
.hint b{display:block;font-family:"Bungee",var(--display);font-weight:400;color:var(--pc,#ffd23d);font-size:16px;letter-spacing:0;margin-bottom:2px;}
.dome{width:var(--dome);height:var(--dome);border:0;padding:0;border-radius:50%;position:relative;cursor:pointer;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.dome::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 200deg,#f4f6fb,#8a90a2,#e7eaf1,#6d7386,#f4f6fb,#9298aa,#f4f6fb);box-shadow:0 8px 20px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.6);}
.dome::after{content:"";position:absolute;inset:8%;border-radius:50%;background:#2a0006;box-shadow:inset 0 3px 6px rgba(0,0,0,.8);}
.dome .cap{position:absolute;inset:12%;z-index:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 38% 28%,#ffb0b0 0,#ff3445 22%,#d4001a 55%,#7a000e 100%);
  box-shadow:inset 0 -.09em .16em rgba(0,0,0,.4), inset 0 .07em .1em rgba(255,255,255,.4), 0 .06em 0 #5a0009, 0 .1em .2em rgba(0,0,0,.5);
  font-size:var(--dome);transition:transform .08s ease, box-shadow .08s ease, filter .2s;}
.dome .cap span{font-family:"Bungee",var(--display);font-size:.2em;color:#fff;line-height:1;text-shadow:0 .05em 0 #6a000b;letter-spacing:.02em;}
.dome .cap small{font-family:"Sofia Sans Condensed",var(--font);font-weight:900;font-size:.085em;color:#ffd8d8;text-transform:uppercase;letter-spacing:.06em;margin-top:.25em;}
.dome:active .cap,.dome.press .cap{transform:translateY(.045em);box-shadow:inset 0 -.04em .1em rgba(0,0,0,.45), inset 0 .07em .1em rgba(255,255,255,.3), 0 .01em 0 #5a0009;}
.dome.go .cap{animation:domeGo .45s ease-in-out infinite alternate;}
@keyframes domeGo{from{filter:brightness(1);}to{filter:brightness(1.3) drop-shadow(0 0 .12em #ff3445);}}
.dome:disabled{cursor:default;}
.dome:disabled .cap{filter:saturate(.35) brightness(.55);}
.passb{justify-self:center;border:0;border-radius:16px;padding:10px 12px 9px;min-width:0;max-width:100%;cursor:pointer;text-align:center;
  background:linear-gradient(180deg,#ffe066,#f2b300);color:#2b1a00;box-shadow:0 4px 0 #9a6400, 0 8px 16px rgba(0,0,0,.35);transition:transform .08s, box-shadow .08s, opacity .2s;}
.passb span{display:block;font-family:"Bungee",var(--display);font-size:18px;line-height:1;}
.passb small{display:block;font-family:"Sofia Sans Condensed",var(--font);font-weight:800;font-size:12px;text-transform:uppercase;line-height:1.1;margin-top:3px;letter-spacing:.02em;}
.passb:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6400;}
.passb:disabled{opacity:.3;cursor:default;transform:none;}
.passb.hide{visibility:hidden;}
.pyls.land .passb{justify-self:stretch;}

/* ── Panels over the board: round intros, spin questions, standings ──── */
.pan{position:absolute;inset:0;z-index:6;border-radius:calc(var(--pad,12px) * 1.5);overflow:hidden;
  background:linear-gradient(180deg,#2a1c78 0%,#140c4a 50%,#0b0630 100%);box-shadow:inset 0 0 0 2px #4b36b8, 0 16px 40px rgba(0,0,0,.55);animation:panIn .35s var(--ease);}
@keyframes panIn{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
.pan-in{position:absolute;inset:var(--pad,12px);border-radius:calc(var(--pad,12px) * .8);overflow:auto;overscroll-behavior:contain;
  background:radial-gradient(120% 80% at 50% 0%,#2840b8 0%,#101a70 50%,#070b38 100%);box-shadow:inset 0 0 0 2px #000, inset 0 0 0 4px #3a5cff55;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:16px 14px;text-align:center;}
.pan-in > :first-child{margin-top:auto;} .pan-in > :last-child{margin-bottom:auto;}
.logo{font-family:"Bungee",var(--display);line-height:.92;letter-spacing:.01em;font-size:clamp(34px,10vw,64px);
  background:linear-gradient(180deg,#fff7b0 0%,#ffd23d 45%,#ff8a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #b0003a) drop-shadow(0 6px 0 #5a0030) drop-shadow(0 0 18px rgba(255,90,170,.45));transform:rotate(-3deg);}
.logo span{display:block;}
.logo span:nth-child(2){font-size:.72em;background:linear-gradient(180deg,#bff4ff,#3fd6ff 50%,#0a8ad8);-webkit-background-clip:text;background-clip:text;}
.rnd{font-family:"Bungee",var(--display);font-size:22px;color:#ff7ad1;letter-spacing:.06em;}
.rnd.big{font-size:clamp(28px,8vw,44px);color:#ffe14d;text-shadow:0 3px 0 #b0003a, 0 0 18px rgba(255,90,170,.5);}
.pan p{font-family:"Sofia Sans Condensed",var(--font);font-weight:700;font-size:17px;color:#dfe6ff;line-height:1.25;max-width:30em;margin:0;}
.pan p b{color:#ffe14d;}
.gobtn{border:0;border-radius:16px;padding:13px 26px 12px;cursor:pointer;font-family:"Bungee",var(--display);font-size:19px;color:#2b1a00;
  background:linear-gradient(180deg,#ffe066,#f2b300);box-shadow:0 5px 0 #9a6400, 0 10px 20px rgba(0,0,0,.4);}
.gobtn:active{transform:translateY(3px);box-shadow:0 2px 0 #9a6400;}
.stand{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px;}
.stand div{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pc) 60%,transparent);}
.stand .nm{font-family:"Bungee",var(--display);font-size:16px;color:var(--pc);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stand .pl{font-family:"Bungee",var(--display);font-size:13px;color:#9fb0e8;}
.stand .bk{font-family:"Jersey 10",var(--mono);font-size:30px;line-height:.8;color:#ffd23d;}
.stand .ex{font-family:"Sofia Sans Condensed",var(--font);font-weight:800;font-size:14px;color:#7dff9e;text-transform:uppercase;}
.stand .ex.wh{color:#ff6a7a;}

/* Spin questions */
.q{gap:10px;padding:14px 12px;}
.qh{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;}
.qh .who{font-family:"Bungee",var(--display);font-size:17px;color:#1a1033;background:var(--pc);padding:4px 10px 3px;border-radius:99px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qh .qn,.qh .cat{font-family:"Sofia Sans Condensed",var(--font);font-weight:800;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;color:#bcc8ff;}
.qh .cat{color:#ffe14d;}
.qclock{display:flex;align-items:center;gap:8px;}
.qbulbs{display:flex;gap:4px;}
.qbulbs i{width:12px;height:12px;border-radius:50%;background:#fff6c6;box-shadow:0 0 6px 2px rgba(255,210,61,.8), inset 0 -2px 0 #e6b400;transition:all .2s;}
.qbulbs i.off{background:#3c2a10;box-shadow:inset 0 1px 2px #000;}
.ql{font-family:"Bungee",var(--display);font-size:14px;color:#7dff9e;white-space:nowrap;min-width:5.6em;text-align:left;}
.ql.one{color:#ffb35c;}
.qt{font-family:"Sofia Sans Condensed",var(--font);font-weight:800;font-size:clamp(19px,5.2vw,28px);line-height:1.15;color:#fff;text-wrap:balance;padding:2px 4px;}

<body>
<main id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, esc = Kit.esc, app = document.getElementById('app');
  var SND = PYLSound, ART = PYLArt;
  var HKEY = 'pressyourluck', SAVE = 'pyl_state', SEEN = 'pyl_seen';
  var CANCEL = { cancel: true }, epoch = 0, speed = 1;
  var NAMES = { 1: 'Round one', 2: 'Round two' };
  function money(n) { return '$' + Math.round(n || 0).toLocaleString('en-US'); }
  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function sleep(ms) { var e = epoch; return new Promise(function (res, rej) { setTimeout(function () { if (e === epoch) res(); else rej(CANCEL); }, ms / speed); }); }
  function run(fn) { var e = epoch; return Promise.resolve().then(fn).catch(function (err) { if (err !== CANCEL && e === epoch) console.error(err); }); }
  function spins(p) { return p.earned + p.passed; }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  // ── Spin questions: the Trivia game's own question bank, read (not copied) from trivia.html ──
  var QB = null, QLOAD = null;
  function hid(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
  var FALLBACK = [
    ['How many legs does a spider have?', '8', ['6', '10', '12'], 'Spiders are arachnids: eight legs.', 1, 'Animals'],
    ['Which planet is known as the Red Planet?', 'Mars', ['Venus', 'Jupiter', 'Mercury'], 'Rusty iron in its dust makes Mars look red.', 1, 'Space'],
    ['What is the largest ocean on Earth?', 'The Pacific', ['The Atlantic', 'The Indian', 'The Arctic'], 'The Pacific covers about a third of the planet.', 1, 'World'],
    ['How many minutes are in 2 hours?', '120', ['100', '60', '200'], '60 minutes in each hour, times 2.', 1, 'Math'],
    ['What gas do plants take in from the air?', 'Carbon dioxide', ['Oxygen', 'Nitrogen', 'Helium'], 'Plants use it to make sugar from sunlight.', 2, 'Science'],
    ['Who was the first President of the United States?', 'George Washington', ['John Adams', 'Thomas Jefferson', 'Abraham Lincoln'], 'He took office in 1789.', 1, 'History'],
    ['What is a baby kangaroo called?', 'A joey', ['A kit', 'A cub', 'A calf'], 'A joey lives in its mother\'s pouch.', 1, 'Animals'],
    ['How many players are on a soccer team on the field?', '11', ['9', '10', '12'], 'Ten field players and a goalkeeper.', 2, 'Sports'],
    ['What is the hardest natural substance?', 'Diamond', ['Gold', 'Iron', 'Quartz'], 'Diamonds are pure carbon in a tight crystal.', 2, 'Science'],
    ['Which is the longest river in South America?', 'The Amazon', ['The Orinoco', 'The Paraná', 'The Magdalena'], 'It carries more water than any other river.', 2, 'World'],
    ['What is 9 squared?', '81', ['18', '72', '99'], '9 × 9 = 81.', 1, 'Math'],
    ['What is the closest star to Earth?', 'The Sun', ['Proxima Centauri', 'Sirius', 'Polaris'], 'Proxima Centauri is the next closest.', 2, 'Space']
  ];
  function useBank(list) { QB = list; return QB; }
  function loadQuestions() {
    if (QLOAD) return QLOAD;
    QLOAD = fetch('trivia.html').then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (t) {
      var m = /var CATS = (\[[\s\S]*?\]);\s*var QB = (\{[\s\S]*?\});\s*<\/script>/.exec(t);
      if (!m) throw new Error('no bank');
      var cats = JSON.parse(m[1]), qb = JSON.parse(m[2]), list = [];
      cats.forEach(function (c) { (qb[c[0]] || []).forEach(function (r) { if (r && r[0] && r[1] && r[2] && r[2].length >= 3) list.push({ id: hid(r[0]), cat: c[1], q: r[0], c: r[1], w: r[2].slice(0, 3), e: r[3] || '', d: +r[4] || 2 }); }); });
      if (list.length < 20) throw new Error('small bank');
      return useBank(list);
    }).catch(function () {
      return useBank(FALLBACK.map(function (r) { return { id: hid(r[0]), cat: r[5], q: r[0], c: r[1], w: r[2], e: r[3], d: r[4] }; }));
    });
    return QLOAD;
  }
  function pickQuestion() {
    var lvl = S.opts.level, seen = [];
    try { seen = JSON.parse(localStorage.getItem(SEEN) || '[]') || []; } catch (e) {}
    function ok(q) { return lvl === 'easy' ? q.d === 1 : lvl === 'hard' ? q.d >= 2 : true; }
    var pool = QB.filter(function (q) { return ok(q) && S.used.indexOf(q.id) < 0; });
    var fresh = pool.filter(function (q) { return seen.indexOf(q.id) < 0; });
    if (fresh.length) pool = fresh;
    if (!pool.length) pool = QB.filter(function (q) { return S.used.indexOf(q.id) < 0; });
    if (!pool.length) pool = QB;
    // Mixed: round one leans easy, round two leans harder
    if (lvl === 'mixed') {
      var want = S.round === 1 ? [1, 1, 2, 2, 3] : [1, 2, 2, 3, 3], d = want[rnd(want.length)];
      var byD = pool.filter(function (q) { return q.d === d; }); if (byD.length) pool = byD;
    }
    var q = pool[rnd(pool.length)];
    S.used.push(q.id); seen.push(q.id); if (seen.length > 400) seen = seen.slice(-400);
    try { localStorage.setItem(SEEN, JSON.stringify(seen)); } catch (e) {}
    return q;
  }
  function qById(id) { for (var i = 0; i < QB.length; i++) if (QB[i].id === id) return QB[i]; return null; }

  // ── The Big Board ─────────────────────────────────────────────────────────
  // 18 squares clockwise from the top-left corner (5 across the top and bottom, 4 down each side).
  // Each square shows three things in turn, like the show's board. Square 2 is the top middle: Big Bucks sends you there.
  function c(v, s) { return { t: 'cash', v: v, s: s ? 1 : 0 }; }
  function P(s) { return { t: 'prize', s: s ? 1 : 0 }; }
  var WH = { t: 'wh' }, M1 = { t: 'move' }, B2 = { t: 'back' }, BB = { t: 'big' }, DB = { t: 'dbl' };
  var TOP = 2;
  var BOARDS = {
    1: [
      [c(500, 1), P(), c(1000)], [c(750), WH, c(1250, 1)], [c(1500, 1), c(2000, 1), c(2500, 1)], [c(600), P(1), WH], [c(1000, 1), c(700), P()],
      [M1, c(800), c(1500)], [c(500), WH, P()], [c(1250), c(750, 1), c(900)], [P(), c(1000), BB],
      [c(700, 1), c(1500), WH], [c(2000), P(), c(600)], [B2, c(1000, 1), c(800)], [c(500, 1), c(1750), c(1250)], [WH, c(750), c(1000)],
      [c(900), c(1500, 1), P()], [c(600), c(1250, 1), c(750)], [c(2000, 1), c(800, 1), c(1000)], [c(1500), P(), c(500)]
    ],
    2: [
      [c(1500, 1), WH, P()], [c(2000), P(1), c(3000)], [c(3000, 1), c(4000, 1), c(5000, 1)], [WH, c(2500), c(1000, 1)], [P(), c(1500), WH],
      [c(2000, 1), BB, c(1250)], [WH, c(4000), P()], [c(1000, 1), DB, c(2500)], [P(1), WH, c(2000)],
      [c(3000), c(1500, 1), M1], [WH, P(), c(2500, 1)], [c(1250), c(5000), WH], [B2, c(2000, 1), P()], [c(4000), WH, c(1500)],
      [P(), c(3000, 1), c(1000)], [c(2500), WH, BB], [c(1500), P(1), c(2000, 1)], [c(1250, 1), c(1000), M1]
    ]
  };
  function makeBoard(r) {
    var pool = shuffle(ART.PRIZES['r' + r].slice());
    return BOARDS[r].map(function (sq) {
      return sq.map(function (sl) {
        if (sl.t !== 'prize') return JSON.parse(JSON.stringify(sl));
        var pz = pool.shift();
        return pz ? { t: 'prize', s: sl.s, k: pz[0], n: pz[1], v: pz[2] } : c(r === 1 ? 1000 : 2500, sl.s);
      });
    });
  }
  // grid position of square i, and which way the light moves from it
  function pos(i) { i = (i + 18) % 18; if (i < 5) return [i, 0]; if (i < 9) return [4, i - 4]; if (i < 14) return [13 - i, 5]; return [0, 18 - i]; }
  function dirTo(i, j) { var a = pos(i), b = pos(j); return Math.round(Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI); }
  var ARROW = '<svg class="arr" viewBox="0 0 30 20" fill="currentColor" aria-hidden="true"><path d="M2 7h16V1.5L29 10 18 18.5V13H2z" stroke="rgba(0,0,0,.35)" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  function slideHTML(sl, i) {
    var one = sl.s ? '<i class="one">+ One Spin</i>' : '';
    switch (sl.t) {
      case 'cash': return '<div class="sl s-cash' + (sl.s ? ' s-plus' : '') + '"><b class="v">' + money(sl.v) + '</b>' + one + '</div>';
      case 'prize': return '<div class="sl s-prize' + (sl.s ? ' s-plus' : '') + '"><span class="win">' + ART.prize(sl.k) + '</span><span class="pn">' + esc(sl.n) + '</span><b class="v">' + money(sl.v) + '</b>' + one + '</div>';
      case 'wh': return '<div class="sl s-wh">' + ART.headSVG() + '<b>Whammy</b></div>';
      case 'move': return '<div class="sl s-move"><b class="sp">Move<br>one<br>space</b><span style="--rot:' + dirTo(i, i + 1) + 'deg;color:#fff">' + ARROW + '</span></div>';
      case 'back': return '<div class="sl s-back"><b class="sp">Go back<br>two<br>spaces</b><span style="--rot:' + dirTo(i, i - 1) + 'deg;color:#fff">' + ARROW + '</span></div>';
      case 'big': return '<div class="sl s-big"><b class="sp">Big<br>Bucks</b><span style="--rot:' + (i === TOP ? -90 : dirTo(i, TOP)) + 'deg">' + ARROW + '</span></div>';
      case 'dbl': return '<div class="sl s-dbl"><b class="sp">Double<br>your<br>$$</b></div>';
    }
    return '<div class="sl"></div>';
  }
  function slideName(sl) {
    if (!sl) return '';
    return sl.t === 'cash' ? money(sl.v) + (sl.s ? ' + one spin' : '') : sl.t === 'prize' ? sl.n + ' (' + money(sl.v) + ')' + (sl.s ? ' + one spin' : '')
      : sl.t === 'wh' ? 'a Whammy' : sl.t === 'dbl' ? 'Double your $$' : sl.t === 'big' ? 'Big Bucks' : sl.t === 'move' ? 'Move one space' : 'Go back two spaces';
  }

  // ── State ─────────────────────────────────────────────────────────────────

  // ── Computer contestants ──────────────────────────────────────────────────
  function boardStats() {
    var n = 0, wh = 0, ev = 0, topAvg = 0;
    S.board[TOP].forEach(function (sl) { topAvg += (sl.v || 0) / 3; });
    S.board.forEach(function (sq) { sq.forEach(function (sl) { n++; if (sl.t === 'wh') wh++; else if (sl.t === 'cash' || sl.t === 'prize') ev += sl.v + (sl.s ? 900 * S.round : 0); else if (sl.t === 'big') ev += topAvg; else ev += 900 * S.round; }); });

    var st = boardStats(), rec = receivers(p);

    var top = Math.max.apply(null, others.map(function (q) { return q.bank; }));
    var lead = p.bank - top;
    var lossW = p.wh >= 3 ? 2.6 : p.wh === 2 ? 1.3 : 1;
    var score = (1 - st.risk) * st.ev - st.risk * p.bank * lossW;
    var pressure = 1 - Math.pow(1 - st.risk, p.earned);
    if (lead > 0) score -= lead * pressure * (S.round === 2 ? 0.45 : 0.2);
    else if (S.round === 2) score += Math.min(-lead, 8000) * 0.25;
    return score * p.nerve > 0;
  }

    return gameOver();
  }
  // what each contestant takes home: their bank (money and prizes at their value), plus the champion's bonus
  function home(i) {
    var B = S.bonus, b = S.players[i].bank;
    if (!B || B.p !== i || !B.result) return b;
    return B.result === 'jackpot' ? JACKPOT : b + (B.kept || 0);
  }
  function bonusLine() {
    var B = S.bonus; if (!B || !B.result) return '';
    var n = S.players[B.p].name;
    if (B.result === 'jackpot') return 'Bonus round: ' + n + ' reached ' + money(JACKPOT_AT) + ' and won ' + money(JACKPOT) + '!';
    if (B.result === 'keep') return 'Bonus round: ' + n + ' kept ' + money(B.kept) + ' after level ' + B.level;
    if (B.result === 'out') return 'Bonus round: four Whammies stopped ' + n + ' in level ' + B.level;
    return 'Bonus round: the Whammy took ' + n + "'s bonus money";
  }
  function highlights() {
    var L = S.log, P = S.players, out = [];
    if (bonusLine()) out.push(bonusLine());
    if (L.best) out.push('Biggest spin: ' + P[L.best.p].name + ', ' + L.best.w + ' in round ' + L.best.r);
    L.dbl.forEach(function (d) { if (d.from > 0) out.push(P[d.p].name + ' doubled ' + money(d.from) + ' to ' + money(d.from * 2)); });
    L.prizes.slice().sort(function (a, b) { return b.v - a.v; }).slice(0, 3).forEach(function (z) { out.push(P[z.p].name + ' won a ' + z.n.charAt(0).toLowerCase() + z.n.slice(1) + ' (' + money(z.v) + ')'); });
    var big = L.wh.slice().sort(function (a, b) { return b.lost - a.lost; })[0];
    if (big && big.lost >= 3000) out.push('A Whammy took ' + money(big.lost) + ' from ' + P[big.p].name);
    P.forEach(function (p) { if (p.wh && !p.out) out.push(p.name + ' hit ' + plural(p.wh, 'Whammy').replace('Whammys', 'Whammies')); });
    L.outs.forEach(function (o) { out.push(P[o.p].name + ' was knocked out by a fourth Whammy in round ' + o.r); });
    var bp = L.passes.slice().sort(function (a, b) { return b.n - a.n; })[0];
    if (bp && bp.n >= 2) out.push(P[bp.f].name + ' passed ' + bp.n + ' spins to ' + P[bp.t].name);
    if (!L.wh.length) out.push('No Whammies all game!');
    return out.slice(0, 8);
  }
  // the main game is won on money and prizes (bank); the bonus only adds to the champion's take-home
  function rankList() {
    return S.players.map(function (p, i) { return { name: p.name, score: money(home(i)), color: pc(i), cpu: p.cpu, t: p.bank, h: home(i), i: i }; })
      .sort(function (a, b) { return b.t - a.t || a.i - b.i; });
  }
  async function gameOver() {
    ui.await = null; S.cur = -1;
    var rank = rankList(), tie = rank[1] && rank[1].t === rank[0].t;
    renderAll();
    shell.board.classList.add('flash');
    fxShow('<b>' + (tie ? "It's a tie!" : esc(rank[0].name)) + '</b><small>' + (tie ? 'Both have ' + money(rank[0].t) : 'wins with ' + money(rank[0].t)) + '</small>', 'fx-big sp gold');
    SND.finale();
    await sleep(2600);
    shell.board.classList.remove('flash'); fxClear();
    if (S.opts.bonus !== 'off' && !tie && rank[0].t > 0) return startBonus(rank[0].i);
    return finishGame();
  }
  function finishGame() {
    S.phase = 'over'; ui.await = null; S.cur = -1;
    var rank = rankList(), tie = rank[1] && rank[1].t === rank[0].t, B = S.bonus;
    Kit.record(HKEY, {
      started: S.started, mode: (S.mode === 'cpu' ? 'vs Computer' : 'Family game') + (B && B.result ? ' · bonus round' : ''),
      players: S.players.map(function (p, i) { return { name: p.name, score: home(i), cpu: p.cpu }; }),
      winner: tie ? null : rank[0].name,
      rounds: { labels: S.rows.map(function (r) { return r.label; }), scores: S.rows.map(function (r) { return r.sc; }) },
      highlights: highlights(),
      detail: { wh: S.players.map(function (p) { return p.wh; }), pz: S.log.prizes.map(function (z) { return z.p + ':' + z.n + ':' + (z.v || 0); }),
        kp: S.players.map(function (p) { return p.prizes.map(function (z) { return z.n + ':' + (z.v || 0); }).join('|'); }), bk: S.players.map(function (p) { return p.bank; }),
        bonus: B && B.result ? { p: B.p, r: B.result, lv: B.level, k: B.kept || 0, w: B.wh } : null },
      summary: (tie ? 'Tie' : rank[0].name + ' won') + ' · ' + money(rank[0].h),
      badge: money(rank[0].h)
    });
    clearSave();
    closePanel(); shell.board.classList.remove('bonus');
    renderAll();
    showResults();
  }
  function showResults() {
    var rank = rankList(), tie = rank[1] && rank[1].t === rank[0].t, cfg = S.cfg, B = S.bonus, w = rank[0];
    var sub = w.t > 0 ? money(w.t) + ' in cash and prizes' : 'Nobody beat the Whammies this time';
    if (B && B.result && !tie) {
      sub = B.result === 'jackpot' ? 'JACKPOT! ' + money(JACKPOT) + ' with the bonus round'
        : B.result === 'keep' ? money(w.t) + ' + ' + money(B.kept) + ' bonus = ' + money(w.h)
        : money(w.t) + ' (the Whammy took the bonus money)';
    }
    Kit.win({
      title: tie ? "It's a tie!" : w.name === 'You' ? 'You win!' : w.name + ' wins!',
      sub: sub, rank: rank, lose: S.mode === 'cpu' && (w.cpu || tie),
      notes: highlights().slice(0, 4), notesTitle: 'Highlights',
      again: function () { start(cfg); },
      extra: [{ label: 'Change players', onClick: showSetup }]
    });
  }

  // ── Bonus round: the champion alone against the Whammy (after the 2019 revival) ──
  // Five levels of 5, 4, 3, 3 and 3 spins, every spin must be taken. The board's money goes up each level and
  // two big prizes join it. A Whammy wipes the bonus bank (game winnings are safe); four Whammies end it.
  // After any level with money in the bonus bank you can stop and keep it. Reach $500,000 and it becomes $1,000,000.
  var JACKPOT_AT = 500000, JACKPOT = 1000000;
  var BLEVELS = [null,
    { spins: 5, mult: 2, top: [6000, 8000, 10000], wh: 0 },
    { spins: 4, mult: 3, top: [10000, 15000, 20000], wh: 1 },
    { spins: 3, mult: 5, top: [20000, 25000, 30000], wh: 2 },
    { spins: 3, mult: 8, top: [30000, 40000, 50000], wh: 3 },
    { spins: 3, mult: 12, top: [50000, 75000, 100000], wh: 4 }];
  var BPRIZES = [['trip', 'Trip around the world', 40000], ['car', 'Luxury convertible', 62000], ['boat', 'Cabin cruiser', 85000], ['ski', 'Mountain cabin getaway', 30000],
    ['camper', 'Deluxe motor home', 95000], ['piano', 'Concert grand piano', 55000], ['ring', 'Diamond necklace', 35000], ['moto', 'Vintage motorcycle', 28000],
    ['hottub', 'Backyard pool and spa', 45000], ['jukebox', 'Jukebox collection', 22000]];
  function makeBonusBoard(lv) {
    var L = BLEVELS[lv], B = S.bonus, r500 = function (v) { return Math.max(500, Math.round(v / 500) * 500); };
    var b = BOARDS[2].map(function (sq) { return sq.map(function (sl) {
      if (sl.t === 'cash') return c(r500(sl.v * L.mult), sl.s);
      if (sl.t === 'prize') return c(r500(2500 * L.mult), sl.s);
      return JSON.parse(JSON.stringify(sl));
    }); });
    b[TOP] = L.top.map(function (v) { return c(v, 1); });
    var slots = []; b.forEach(function (sq, i) { sq.forEach(function (sl, k) { if (i !== TOP) slots.push([i, k]); }); });
    shuffle(slots);
    // fewer Whammies than round two to start (6), one more each level after that
    var wh = slots.filter(function (s) { return b[s[0]][s[1]].t === 'wh'; });
    wh.slice(0, 3).forEach(function (s) { b[s[0]][s[1]] = c(r500(2000 * L.mult), 0); });
    var cash = slots.filter(function (s) { return b[s[0]][s[1]].t === 'cash' && !b[s[0]][s[1]].s; });
    cash.slice(0, L.wh).forEach(function (s) { b[s[0]][s[1]] = { t: 'wh' }; });
    // two dream prizes join the board each level
    cash.slice(L.wh, L.wh + 2).forEach(function (s, k) {
      var z = BPRIZES[B.pool[((lv - 1) * 2 + k) % BPRIZES.length]];
      b[s[0]][s[1]] = { t: 'prize', s: 0, k: z[0], n: z[1], v: z[2] };
    });
    return b;
  }
  async function startBonus(w) {
    S.phase = 'bonus'; S.cur = w; S.quiz = null; S.undo = null;
    S.bonus = { p: w, level: 0, bank: 0, earned: 0, passed: 0, wh: 0, prizes: [], out: false, pool: shuffle(BPRIZES.map(function (x, i) { return i; })), kept: 0, result: null, atEnd: false, best: 0 };
    save();
    return bonusIntro();
  }
  function bonusIntro() {
    var B = S.bonus, p = S.players[B.p], e = epoch;
    shell.board.classList.add('bonus');
    renderAll();
    SND.bonus();
    var go = el('button', { type: 'button', class: 'gobtn', text: p.cpu ? 'Watch ' + p.name + ' play' : 'Face the Whammy', onclick: function () { if (ui.busy) return; ui.busy = true; Kit.sfx('tap'); run(function () { ui.busy = false; return bonusLevel(); }); } });
    panel('bonusin', [
      el('div', { class: 'rnd big', text: 'Bonus round' }),
      el('div', { class: 'vs', style: { '--pc': pc(B.p) }, html: '<b>' + esc(p.name) + '</b><i>vs</i><svg viewBox="-50 -48 100 80" aria-hidden="true">' + ART.head() + '</svg>' }),
      el('div', { class: 'jack', html: '<small>Jackpot</small>' + money(JACKPOT) }),
      el('ul', { class: 'brules', html: '<li><b>5 levels</b>: 5, 4, 3, 3 and 3 spins. Every spin must be played, and the money gets bigger each level.</li>' +
        '<li>After a level you can <b>stop and keep</b> your bonus money, or press on.</li>' +
        '<li>Reach <b>' + money(JACKPOT_AT) + '</b> and it becomes <b>' + money(JACKPOT) + '</b>.</li>' +
        '<li>A Whammy takes your bonus money (your ' + money(p.bank) + ' is safe). <b>Four Whammies</b> and it\'s over.</li>' }),
      go
    ]);
    if (p.cpu) sleep(4500).then(function () { if (e === epoch && S.phase === 'bonus' && S.bonus.level === 0 && go.isConnected) go.click(); }).catch(function () {});
  }
  async function bonusLevel() {
    var B = S.bonus, p = S.players[B.p], e = epoch;
    B.level++; B.atEnd = false;
    var L = BLEVELS[B.level];
    S.board = makeBonusBoard(B.level); B.earned = L.spins;
    save(); paintBoard(); renderAll();
    SND.round(B.level > 2 ? 2 : 1);
    var go = el('button', { type: 'button', class: 'gobtn', text: 'Light it up', onclick: function () { if (ui.busy) return; ui.busy = true; Kit.sfx('tap'); run(function () { ui.busy = false; return bonusPlay(); }); } });
    panel('lvl', [
      el('div', { class: 'rnd', text: 'Bonus round' }),
      el('div', { class: 'rnd big', text: 'Level ' + B.level }),
      el('p', { html: '<b>' + plural(L.spins, 'spin') + '</b> to play. Up to <b>' + money(L.top[2]) + ' + one spin</b> at the top of the board.' }),
      B.bank ? el('p', { html: 'Bonus bank: <b>' + money(B.bank) + '</b>' }) : null,
      go
    ]);
    if (p.cpu) sleep(2600).then(function () { if (e === epoch && go.isConnected) go.click(); }).catch(function () {});
  }
  async function bonusPlay() {
    closePanel();
    S.phase = 'bonus'; S.cur = S.bonus.p; save(); renderAll();
    shell.board.classList.add('flash');
    for (var i = 0; i < 18; i++) { setLit(i); if (i % 2 === 0) SND.hop(); await sleep(40); }
    setLit(-1); shell.board.classList.remove('flash');
    return decide();
  }
  // after a level: keep the bonus money or press on
  async function levelEnd() {
    var B = S.bonus, p = S.players[B.p], e = epoch;
    ui.await = null;
    if (B.level >= 5) return bonusEnd(B.bank > 0 ? 'keep' : 'zero');
    B.atEnd = true; save();
    if (B.bank <= 0) {
      panel('lvl', [el('div', { class: 'rnd big', text: 'Level ' + B.level + ' done' }), el('p', { html: 'Nothing in the bonus bank to keep yet. <b>On to level ' + (B.level + 1) + '!</b>' })]);
      await sleep(2400);
      return bonusLevel();
    }
    var n = BLEVELS[B.level + 1];
    var keep = el('button', { type: 'button', class: 'gobtn', text: 'Stop and keep ' + money(B.bank), onclick: function () { if (ui.busy) return; Kit.sfx('tap'); run(function () { return bonusEnd('keep'); }); } });
    var more = el('button', { type: 'button', class: 'gobtn alt', text: 'Press on to level ' + (B.level + 1), onclick: function () { if (ui.busy) return; Kit.sfx('tap'); run(bonusLevel); } });
    panel('lvl', [
      el('div', { class: 'rnd', text: 'End of level ' + B.level }),
      el('div', { class: 'bbank', text: money(B.bank) }),
      el('p', { html: 'Level ' + (B.level + 1) + ': <b>' + plural(n.spins, 'spin') + '</b>, up to <b>' + money(n.top[2]) + '</b>, and more Whammies. ' + (B.wh ? plural(B.wh, 'Whammy').replace('Whammys', 'Whammies') + ' so far.' : '') }),
      el('div', { class: 'two' }, [keep, more])
    ]);
    SND.turn();
    if (p.cpu) {
      await sleep(2600);
      if (e !== epoch || !keep.isConnected) return;
      (cpuBonusGo() ? more : keep).click();
    }
  }
  function cpuBonusGo() {
    var B = S.bonus, p = S.players[B.p], n = BLEVELS[B.level + 1], r = (6 + n.wh) / 54;
    var ev = 0, cnt = 0; BOARDS[2].forEach(function (sq) { sq.forEach(function (sl) { if (sl.v) { ev += sl.v * n.mult; cnt++; } }); }); ev /= Math.max(1, cnt);
    var survive = Math.pow(1 - r, n.spins), need = B.wh >= 3 ? 1.7 : 1.25;   // one more Whammy would end it: more careful
    return survive * (B.bank + n.spins * ev) > B.bank * (need / p.nerve);
  }
  async function bonusEnd(kind) {
    var B = S.bonus, p = S.players[B.p];
    closePanel(); ui.await = null;
    B.result = kind === 'jackpot' ? 'jackpot' : kind === 'keep' ? 'keep' : kind === 'out' ? 'out' : 'zero';
    B.kept = B.result === 'keep' ? B.bank : B.result === 'jackpot' ? JACKPOT - p.bank : 0;
    save();
    if (B.result === 'jackpot') {
      shell.board.classList.add('flash'); SND.finale(); setTimeout(function () { SND.bigBucks(); }, 1200);
      Kit.confetti({ count: 260 }); Kit.haptic('success');
      fxShow('<b>Jackpot!</b><small>' + esc(p.name) + ' wins ' + money(JACKPOT) + '</small>', 'fx-big sp gold');
      await sleep(4200);
    } else if (B.result === 'keep') {
      SND.prize(); Kit.haptic('success');
      fxShow('<b>' + money(B.kept) + '</b><small>' + esc(p.name) + ' stops and keeps it</small>', 'fx-big sp gold');
      await sleep(2800);
    } else {
      fxShow('<b>The Whammy wins</b><small>No bonus money this time</small>', 'fx-big sp red');
      await sleep(2400);
    }
    fxClear(); shell.board.classList.remove('flash');
    return finishGame();
  }

  // ── Undo: take back a pass, until the next spin ───────────────────────────
  function undo() {
    if (!S || !S.undo || S.phase !== 'board' || T.running) {
      Kit.toast(S && S.phase === 'board' ? 'You can undo a pass until the next spin. Spins can\'t be taken back.' : 'Nothing to undo');
      return;
    }
    stopAll();
    S = JSON.parse(S.undo); S.undo = null;
    closePanel(); fxClear(); setLit(-1);
    shell.board.classList.remove('run', 'dim', 'red', 'flash');
    paintBoard(); save();
    Kit.toast('Took back the pass');
    run(decide);
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  function resume() {
    buildShell(); paintBoard(); renderAll();
    var ph = S.phase;
    if (ph === 'intro') showIntro();
    else if (ph === 'quiz') loadQuestions().then(function () { buildBuzzers(); nextToss(); });
    else if (ph === 'quizdone') quizDone();
    else if (ph === 'bonus') {
      var B = S.bonus; shell.board.classList.add('bonus');
      if (!B) showSetup();
      else if (B.result) finishGame();
      else if (!B.level) bonusIntro();
      else if (B.atEnd || !B.earned || B.out) run(B.out ? function () { return bonusEnd('out'); } : levelEnd);
      else run(decide);
    }
    else if (ph === 'board') {
      var p = cur();
      if (p && !p.out && spins(p)) run(decide); else run(endTurn);
    } else showSetup();
  }
  var saved = load();
  if (saved && saved.v === 1 && saved.players && saved.phase && saved.phase !== 'over' && saved.board) {
    S = saved; loadQuestions(); resume();
  } else showSetup();

  // ── Test hooks ────────────────────────────────────────────────────────────
  window.__pyl = {
    state: function () { return S; },
    ui: function () { return { await: ui.await, running: T.running, lit: T.lit, show: T.show.slice(), phase: S && S.phase }; },
    speed: function (n) { speed = n || 1; },
    force: function () { for (var i = 0; i < arguments.length; i++) FORCE.push(arguments[i]); return FORCE.length; },
    whammy: function (v) { if (S) S.whNext = v; },
    spin: function () { domeTap(); }, stop: function () { domeTap(); }, pass: function () { passTap(); },
    // toss-ups: the live question; buzz(seat) as if that person hit their buzzer; answer(k) for the buzzer (0-3)
    // or the person picking from three (0-2); plan(seat, {know, at}) fixes a computer's next toss-up
    toss: function () {
      if (!Z || !S || !S.quiz || !S.quiz.cur) return null;
      var cu = S.quiz.cur;
      return { phase: Z.phase, buzz: cu.buzz, locked: cu.locked.slice(), ch: cu.ch, mc: cu.mc, picks: cu.picks, aw: cu.aw, right: cu.ch.indexOf(Z.q.c), rightMc: cu.mc ? cu.mc.indexOf(Z.q.c) : -1,
        picker: Z.pick ? Z.pick.seat : -1, handoff: Z.handoff != null ? Z.handoff : -1, i: S.quiz.i, n: S.quiz.n, d: Z.q.d, plans: Z.plans };
    },
    buzz: function (i) { buzzIn(i); },
    answer: function (k) { if (Z && Z.phase === 'answer') buzzAnswer(k); else if (Z && Z.pick) Z.pick.done(k); },
    plan: function (i, o) { FPLAN[i] = o; },
    next: function () { if (Z && Z.phase === 'reveal') nextToss(); },
    // jump to the end of round two with these banks (tests the bonus round without playing a whole game)
    endNow: function (banks) { stopAll(); closePanel(); fxClear(); S.round = 2; S.phase = 'board'; S.cur = -1; S.board = makeBoard(2); paintBoard(); S.players.forEach(function (p, i) { p.bank = banks[i] || 0; p.earned = p.passed = 0; }); renderAll(); run(gameOver); },
    keep: function () { var b = document.querySelector('.pan .two .gobtn:not(.alt)'); if (b) b.click(); return !!b; },
    pressOn: function () { var b = document.querySelector('.pan .two .gobtn.alt'); if (b) b.click(); return !!b; },
    clickGo: function () { var b = document.querySelector('.pan .gobtn'); if (b) b.click(); return !!b; },
    loaded: function () { return loadQuestions().then(function () { return QB.length; }); },
    boards: BOARDS, receivers: function (i) { return receivers(S.players[i]); }, cpuWantsSpin: function (i) { return cpuWantsSpin(S.players[i]); }
  };
})();
</script>

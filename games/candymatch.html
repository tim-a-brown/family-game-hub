<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy Match</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>

<style>
/* ── Setup: run or pick a level ─────────────────────────────────────────── */
.cm-setup .setup-hero{padding-top:4px;}
.cm-setup .setup-hero .k-hero-ic .gicon{width:80px;height:80px;}
.cm-setup .setup > .k-start{position:sticky;bottom:calc(var(--safe-b) + 10px);z-index:5;box-shadow:0 6px 0 var(--b-lip),0 14px 30px rgba(0,0,0,.45);}
.cm-pick[hidden]{display:none;}
.cm-lvh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.cm-lvh .label{margin:0;}
.cm-lvh small{font-weight:800;color:var(--text-3);font-size:.8rem;}
.cm-levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
@media (min-width:540px){.cm-levels{grid-template-columns:repeat(6,1fr);}}
.cm-lt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1/1.08;border:0;padding:6px 2px 5px;border-radius:14px;color:#fff;
  background:radial-gradient(120% 90% at 50% 20%,#6a3a82 0%,#43205a 60%,#2c1240 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1.5px rgba(255,190,230,.18),0 4px 0 #1d0a2a,0 8px 14px rgba(0,0,0,.3);transition:transform .15s var(--spring);}
.cm-lt:active{transform:scale(.94);}
.cm-lt b{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35);}
.cm-lt .gi{width:16px;height:16px;opacity:.9;}
.cm-lt .st{display:flex;gap:1px;}
.cm-lt .st svg{width:13px;height:13px;}
.cm-lt.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 3px var(--accent),0 4px 0 #1d0a2a,0 10px 18px rgba(0,0,0,.4);}
.cm-lt.lock{filter:grayscale(.8) brightness(.55);}
.cm-lt.lock .lk{position:absolute;inset:0;display:grid;place-items:center;}
.cm-lt.lock .lk svg{width:22px;height:22px;opacity:.85;}
.cm-lt.lock b,.cm-lt.lock .st,.cm-lt.lock .gi{opacity:.25;}

/* ── Play view: fills the screen, no page scroll ────────────────────────── */
html.cm-on,html.cm-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.cm-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 55% at 50% 0%,rgba(255,105,180,.16) 0%,rgba(255,105,180,0) 70%),var(--bg);}
html.cm-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;
  padding:0 max(8px,env(safe-area-inset-right)) calc(var(--safe-b) + 10px) max(8px,env(safe-area-inset-left));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.cm-side{flex:none;display:flex;flex-direction:column;gap:6px;}
.cm-hud{display:flex;align-items:stretch;gap:6px;}
.cm-plate{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;padding:5px 10px;border-radius:14px;color:#fff;
  background:linear-gradient(180deg,#3a1d3c 0%,#1f0d22 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,190,120,.5),inset 0 0 0 3.5px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.35);}
.cm-plate small{display:block;font-size:.6rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,214,170,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cm-plate b{display:block;font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums;}
.cm-plate i{display:block;font-style:normal;font-size:.62rem;font-weight:800;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cm-lv{flex:none;min-width:58px;text-align:center;align-items:center;}
.cm-mv{flex:none;min-width:66px;text-align:center;align-items:center;}
.cm-mv b{font-size:1.85rem;color:#ffe9a6;text-shadow:0 0 12px rgba(255,200,80,.35),0 2px 0 rgba(0,0,0,.5);}
.cm-mv.low b{color:#ff9a9a;}
.cm-mv.bump b{animation:bounce .4s var(--spring);}
.cm-sc{flex:1.4;align-items:stretch;}
.cm-sc b{color:#ffd45a;text-shadow:0 0 14px rgba(255,190,40,.4),0 2px 0 rgba(0,0,0,.55);}
.cm-sc.bump b{animation:bounce .45s var(--spring);}
.cm-meter{position:relative;height:7px;margin:3px 2px 2px;border-radius:4px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.cm-meter > span{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#ff7ab8,#ffd45a);transition:width .4s var(--ease);}
.cm-meter svg{position:absolute;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;}
.cm-best{flex:1;}
.cm-best b{font-size:1.15rem;color:#fff;}
.cm-goal{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 7px;border-radius:14px;color:#fff;
  background:linear-gradient(180deg,#fff7ea 0%,#f4e3c6 100%);color:#4a2510;
  box-shadow:inset 0 1px 0 #fff,0 3px 0 #b88d5c,0 8px 16px rgba(0,0,0,.3);}
.cm-goal .gi{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(120,60,20,.1);}
.cm-goal .gi svg{width:28px;height:28px;}
.cm-goal .tx{flex:1;min-width:0;line-height:1.15;}
.cm-goal .tx small{display:block;font-size:.62rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(110,55,20,.65);}
.cm-goal .tx span{display:block;font-weight:900;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cm-goal b{flex:none;font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1;color:#c2185b;font-variant-numeric:tabular-nums;}
.cm-goal.done b{color:#1f8a43;}
.cm-goal.bump b{animation:bounce .4s var(--spring);}
.cm-wrap{flex:none;position:relative;}
.cm-frame{position:relative;padding:8px;border-radius:22px;}
.cm-frame canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:pointer;}
/* Phone sideways and tablets sideways: plates in a column beside the board */
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  html.cm-on #app{flex-direction:row;gap:16px;padding-left:max(10px,calc(env(safe-area-inset-left) + var(--corner-x)));padding-right:max(10px,calc(env(safe-area-inset-right) + var(--corner-x)));}
  .cm-side{width:clamp(168px,24vw,250px);}
  .cm-hud{flex-direction:column;}
  .cm-hud .cm-plate{flex:none;align-items:flex-start;text-align:left;}
  .cm-hud .cm-sc{align-items:stretch;}
}
@media (orientation:landscape) and (min-aspect-ratio:5/4) and (max-height:500px){
  .cm-plate{padding:3px 10px;}
  .cm-plate b{font-size:1.2rem;}
  .cm-mv b{font-size:1.45rem;}
  .cm-plate i{display:none;}
  .cm-goal{padding:4px 10px 4px 5px;}
  .cm-goal .gi{width:28px;height:28px;}
  .cm-goal .gi svg{width:22px;height:22px;}
}
@media (min-width:700px) and (min-height:700px){
  .cm-plate b{font-size:1.7rem;}
  .cm-mv b{font-size:2.2rem;}
  .cm-best b{font-size:1.35rem;}
  .cm-plate small{font-size:.68rem;}
  .cm-goal .tx span{font-size:1.05rem;}
  .cm-goal b{font-size:1.8rem;}
}
/* Level intro card on the board */
.cm-intro{position:absolute;inset:8px;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:auto;
  background:rgba(25,6,30,.38);border-radius:14px;opacity:0;transition:opacity .3s;}
.cm-intro.show{opacity:1;}
.cm-intro .card{width:min(290px,84%);text-align:center;padding:16px 16px 14px;border-radius:18px;color:#4a2510;
  background:linear-gradient(180deg,#fff9ef,#f6e6c8);box-shadow:inset 0 1px 0 #fff,0 5px 0 #b88d5c,0 18px 40px rgba(0,0,0,.5);
  transform:scale(.7) rotate(-2deg);transition:transform .45s var(--spring);}
.cm-intro.show .card{transform:none;}
.cm-intro small{display:block;font-size:.7rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(110,55,20,.65);}
.cm-intro h2{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1.05;color:#c2185b;margin:2px 0 6px;}
.cm-intro .gl{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:1.02rem;}
.cm-intro .gl svg{width:30px;height:30px;flex:none;}
.cm-intro p{margin-top:6px;font-weight:800;color:rgba(80,40,15,.75);font-size:.9rem;}
/* Win card stars */
.cm-stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px;}
.cm-stars svg{width:46px;height:46px;opacity:0;transform:scale(.3) rotate(-30deg);}
.cm-stars svg.in{animation:cmstar .55s var(--spring) forwards;}
.cm-stars svg:nth-child(2){width:56px;height:56px;margin-top:-8px;}
@keyframes cmstar{to{opacity:1;transform:none;}}
.cm-pause{position:absolute;inset:8px;border-radius:14px;display:none;align-items:center;justify-content:center;z-index:5;
  background:rgba(25,6,30,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';

  // ==ENGINE==
  // Pure game rules: no DOM, no drawing. A move returns a list of events that
  // the animation player turns into motion. Also used by the level tuning script.
  var CM = (function () {
    var TAU = Math.PI * 2;
    function Rng(s) { this.s = s | 0; }
    Rng.prototype.next = function () {
      var a = this.s = (this.s + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    Rng.prototype.int = function (n) { return Math.floor(this.next() * n); };

    // Scoring (multiplied by the cascade step: 1st clear x1, 2nd x2, ...)
    var PTS = { m3: 60, m4: 120, m5: 200, lt: 200, blast: 60, jelly: 1000, frost: 100, ing: 10000 };
    function striped(s) { return s === 'h' || s === 'v'; }
    function special(x) { return x && (x.s === 'h' || x.s === 'v' || x.s === 'w' || x.s === 'b'); }
    function mcol(x) { return x && x.c >= 0 && !x.armed ? x.c : -1; }

    // ── Board setup ───────────────────────────────────────────────────────
    // def.rows: strings, one char per cell:
    //   .  plain cell    j/J  jelly (1 or 2 layers)    f/F  frosting (1 or 2 layers)    _  no cell
    function create(def, seed) {
      var rows = def.rows, R = rows.length, C = rows[0].length, g = {
        R: R, C: C, N: R * C, mask: [], jelly: [], frost: [], cell: [],
        colors: def.colors || 6, moves: def.moves, moves0: def.moves, score: 0,
        goal: def.goal || 'score', target: def.target || 0,
        ingTotal: def.ings || 0, ingDone: 0, ingSpawned: 0, ingMax: def.ingMax || 1,
        rng: new Rng(seed == null ? 12345 : seed), nextId: 1, forceQ: null,
        stats: { moves: 0, made: { h: 0, w: 0, b: 0 }, combos: 0, maxStep: 0, bestMove: 0, shuffles: 0, jellyCleared: 0, frostBroken: 0 }
      };
      for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) {
        var ch = rows[r].charAt(c) || '_';
        g.mask.push(ch !== '_' ? 1 : 0);
        g.jelly.push(ch === 'j' ? 1 : ch === 'J' ? 2 : 0);
        g.frost.push(ch === 'f' ? 1 : ch === 'F' ? 2 : 0);
        g.cell.push(null);
      }
      prep(g);
      g.jelly0 = jellyLeft(g);
      fill(g);
      return g;
    }
    function prep(g) {
      g.spawn = []; g.exit = [];
      for (var c = 0; c < g.C; c++) {
        var top = -1, bot = -1;
        for (var r = 0; r < g.R; r++) if (g.mask[r * g.C + c]) { if (top < 0) top = r * g.C + c; bot = r * g.C + c; }
        g.spawn.push(top); g.exit.push(bot);
      }
      // Ingredients leave through the bottom row only
      var last = 0; g.exit.forEach(function (e) { if (e >= 0) last = Math.max(last, (e / g.C) | 0); });
      g.exit = g.exit.map(function (e) { return e >= 0 && ((e / g.C) | 0) === last ? e : -1; });
    }
    function idx(g, r, c) { return r < 0 || c < 0 || r >= g.R || c >= g.C || !g.mask[r * g.C + c] ? -1 : r * g.C + c; }
    function mk(g, c, s, k) { return { id: g.nextId++, c: c, s: s || '', k: k || 0, armed: 0 }; }
    function newCandy(g) {
      if (g.forceQ && g.forceQ.length) { var f = g.forceQ.shift(); return mk(g, f, ''); }
      return mk(g, g.rng.int(g.colors), '');
    }
    function fill(g) {
      for (var tries = 0; tries < 80; tries++) {
        for (var i = 0; i < g.N; i++) {
          if (!g.mask[i] || g.frost[i]) { g.cell[i] = null; continue; }
          if (g.cell[i] && g.cell[i].fixed) continue;
          var r = (i / g.C) | 0, c = i % g.C, col, n = 0;
          do {
            col = g.rng.int(g.colors); n++;
            var a1 = idx(g, r, c - 1), a2 = idx(g, r, c - 2), b1 = idx(g, r - 1, c), b2 = idx(g, r - 2, c);
            var bad = (a1 >= 0 && a2 >= 0 && mcol(g.cell[a1]) === col && mcol(g.cell[a2]) === col) ||
                      (b1 >= 0 && b2 >= 0 && mcol(g.cell[b1]) === col && mcol(g.cell[b2]) === col);
          } while (bad && n < 30);
          g.cell[i] = mk(g, col, '');
        }
        if (hasMove(g)) break;
      }
      // Ingredient levels start with one ingredient in the top row
      if (g.ingTotal && !g.ingSpawned) {
        var tops = [];
        for (var c2 = 0; c2 < g.C; c2++) { var s = g.spawn[c2]; if (s >= 0 && !g.frost[s] && g.exit[c2] >= 0 && g.exit[c2] !== s) tops.push(s); }
        if (tops.length) { var at = tops[g.rng.int(tops.length)]; g.cell[at] = mk(g, -2, 'i', 0); g.ingSpawned = 1; }
      }
    }
    function jellyLeft(g) { var n = 0; for (var i = 0; i < g.N; i++) if (g.jelly[i] > 0) n++; return n; }
    function ingsOnBoard(g) { var n = 0; for (var i = 0; i < g.N; i++) if (g.cell[i] && g.cell[i].s === 'i') n++; return n; }
    function goalLeft(g) {
      if (g.goal === 'jelly') return jellyLeft(g);
      if (g.goal === 'ingred') return g.ingTotal - g.ingDone;
      return Math.max(0, g.target - g.score);
    }
    function goalMet(g) { return goalLeft(g) <= 0; }

    // ── Matching ──────────────────────────────────────────────────────────
    function runs(g) {
      var out = [], r, c, i, col, e, j, cells;
      for (r = 0; r < g.R; r++) for (c = 0; c < g.C;) {
        i = idx(g, r, c); col = i >= 0 ? mcol(g.cell[i]) : -1;
        if (col < 0) { c++; continue; }
        e = c + 1; while (e < g.C && (j = idx(g, r, e)) >= 0 && mcol(g.cell[j]) === col) e++;
        if (e - c >= 3) { cells = []; for (var k = c; k < e; k++) cells.push(r * g.C + k); out.push({ d: 'h', cells: cells, c: col }); }
        c = e;
      }
      for (c = 0; c < g.C; c++) for (r = 0; r < g.R;) {
        i = idx(g, r, c); col = i >= 0 ? mcol(g.cell[i]) : -1;
        if (col < 0) { r++; continue; }
        e = r + 1; while (e < g.R && (j = idx(g, e, c)) >= 0 && mcol(g.cell[j]) === col) e++;
        if (e - r >= 3) { cells = []; for (var k2 = r; k2 < e; k2++) cells.push(k2 * g.C + c); out.push({ d: 'v', cells: cells, c: col }); }
        r = e;
      }
      return out;
    }
    // Runs that share a cell (an L, T or + shape) form one group
    function groupsOf(rs) {
      var gs = [];
      rs.forEach(function (run) {
        var hit = gs.filter(function (gr) { return run.cells.some(function (x) { return gr.set[x]; }); });
        var gr = hit[0];
        if (!gr) { gr = { set: {}, cells: [], runs: [], c: run.c }; gs.push(gr); }
        for (var h = 1; h < hit.length; h++) {
          hit[h].runs.forEach(function (rr) { gr.runs.push(rr); });
          hit[h].cells.forEach(function (x) { if (!gr.set[x]) { gr.set[x] = 1; gr.cells.push(x); } });
          gs.splice(gs.indexOf(hit[h]), 1);
        }
        gr.runs.push(run);
        run.cells.forEach(function (x) { if (!gr.set[x]) { gr.set[x] = 1; gr.cells.push(x); } });
      });
      return gs;
    }
    // What special (if any) a group makes, and where
    function plan(g, gr, pref, dir, moved) {
      var longest = gr.runs[0], hs = [], vs = [];
      gr.runs.forEach(function (r) { if (r.cells.length > longest.cells.length) longest = r; (r.d === 'h' ? hs : vs).push(r); });
      function pick(cells) {
        for (var p = 0; p < (pref || []).length; p++) if (cells.indexOf(pref[p]) >= 0) return pref[p];
        if (moved) { var ms = cells.filter(function (x) { return moved[x]; }); if (ms.length) return ms[ms.length >> 1]; }
        return cells[cells.length >> 1];
      }
      var L = longest.cells.length;
      if (L >= 5) return { s: 'b', at: pick(longest.cells), pts: PTS.m5 };
      if (hs.length && vs.length) {
        var inter = gr.cells.filter(function (x) { return hs.some(function (r) { return r.cells.indexOf(x) >= 0; }) && vs.some(function (r) { return r.cells.indexOf(x) >= 0; }); });
        return { s: 'w', at: pick(inter.length ? inter : gr.cells), pts: PTS.lt };
      }
      if (L === 4) return { s: dir || (longest.d === 'h' ? 'v' : 'h'), at: pick(longest.cells), pts: PTS.m4 };
      return { s: '', at: -1, pts: gr.cells.length > 3 ? PTS.m4 : PTS.m3 };
    }

    // ── A clear phase: matches, specials firing, blasts, jelly and frosting ─
    function Phase(g, step) {
      var P = {
        g: g, step: step, clr: {}, order: [], fired: {}, keep: {}, matched: {}, hitJ: {}, hitF: {}, merge: {},
        creates: [], tallies: [],
        ev: { t: 'clear', step: step, pops: [], fx: [], creates: [], trans: [], arm: [], jelly: [], frost: [], pts: [], score: 0 }
      };
      function tally(i, c, d) { var t = { i: i, v: 0, c: c, d: d || 0 }; P.tallies.push(t); return t; }
      P.tally = tally;
      function jelly(i, d, src) {
        if (P.hitJ[i] || !(g.jelly[i] > 0)) return;
        P.hitJ[i] = 1; g.jelly[i]--; g.stats.jellyCleared++;
        P.ev.jelly.push({ i: i, v: g.jelly[i], d: d });
        add(PTS.jelly, src, true);
      }
      function frost(i, d, src) {
        if (P.hitF[i] || !(g.frost[i] > 0)) return;
        P.hitF[i] = 1; g.frost[i]--; if (!g.frost[i]) g.stats.frostBroken++;
        P.ev.frost.push({ i: i, v: g.frost[i], d: d });
        add(PTS.frost, src, true);
      }
      function add(v, src, flat) { var pts = flat ? v : v * step; P.ev.score += pts; g.score += pts; if (src) src.v += pts; }
      P.add = add;
      // Hit a cell: frosting takes a layer, jelly takes a layer, a candy is cleared (specials fire)
      P.hit = function (i, d, src, nofire) {
        if (i < 0) return;
        if (g.frost[i]) { frost(i, d, src); return; }
        jelly(i, d, src);
        var x = g.cell[i]; if (!x || x.s === 'i') return;
        if (P.clr[i] != null) { if (d < P.clr[i] && !P.fired[x.id]) P.clr[i] = d; return; }
        P.clr[i] = d; P.order.push(i);
        if (nofire) P.fired[x.id] = 1;
        if (!P.matched[i]) add(PTS.blast, src);
        if (special(x) && !P.fired[x.id]) { P.fired[x.id] = 1; fire(i, d); }
      };
      // Remove a special without firing it (used up by a combo)
      P.consume = function (i, d) {
        var x = g.cell[i]; if (!x) return;
        P.fired[x.id] = 1; P.matched[i] = 1;
        if (P.clr[i] == null) { P.clr[i] = d; P.order.push(i); }
        jelly(i, d, null);
      };
      P.line = function (i0, dir, d, color, src) {
        var r0 = (i0 / g.C) | 0, c0 = i0 % g.C;
        var fx = { k: 'line', dir: dir, r: r0, c: c0, t: d, col: color };
        P.ev.fx.push(fx);
        src = src || tally(i0, color, d);
        var n = dir === 'h' ? g.C : g.R;
        for (var k = 1; k < n; k++) {
          var a = dir === 'h' ? idx(g, r0, c0 - k) : idx(g, r0 - k, c0);

      '<path d="M12 1.8l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.6l-6.2 3.3L7 14l-5-4.9 6.9-1z" fill="url(#' + id + ')" stroke="' + (on ? '#8f5200' : '#251829') + '" stroke-width="1.3" stroke-linejoin="round"/>' +
      (on ? '<path d="M8.6 8.9l2.1-.4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>' : '') + '</svg>';
  }
  var GI = {
    jelly: '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="8" fill="#ff86c4" stroke="#d63384" stroke-width="2"/><rect x="8" y="8" width="16" height="16" rx="5" fill="none" stroke="#ffe0f0" stroke-width="1.6" opacity=".7"/><path d="M8 9.5q2.5-2.5 7-2" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".85"/></svg>',
    ingred: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 18C12 11 15 7 20 4M21 19c0-6 0-11-1-15" stroke="#4c7a22" stroke-width="2.2" fill="none" stroke-linecap="round"/><ellipse cx="24" cy="5.5" rx="4.5" ry="2" fill="#3fae3a" transform="rotate(-20 24 5.5)"/><circle cx="10.5" cy="22" r="6.5" fill="#d4102a"/><circle cx="21.5" cy="23" r="6.2" fill="#b80a22"/><circle cx="8.3" cy="19.8" r="1.8" fill="#fff" opacity=".8"/><circle cx="19.4" cy="20.8" r="1.7" fill="#fff" opacity=".8"/></svg>',
    score: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l4 8.2 9 1.3-6.5 6.4 1.5 9L16 23.6 8 27.9l1.5-9L3 12.5l9-1.3z" fill="#ffc83d" stroke="#a86a00" stroke-width="1.8" stroke-linejoin="round"/></svg>'
  };
  var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  function plate(cls, label) { return el('div', { class: 'cm-plate ' + cls }, [el('small', { text: label }), el('b', { text: '' })]); }
  function bump(n) { n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); }
  function stars3() { return L.def.stars || [L.def.target || 0, 0, 0]; }
  function starsFor(score) { var st = stars3(); return 1 + (score >= st[1] ? 1 : 0) + (score >= st[2] ? 1 : 0); }
  function goalText(def) {
    if (def.goal === 'jelly') return 'Clear all the jelly';
    if (def.goal === 'ingred') return 'Bring down ' + def.ings + (def.ings === 1 ? ' cherry or nut' : ' cherries and nuts');
    return 'Score ' + fmt(def.target) + ' points';
  }
  function goalLeftView() {
    if (G.goal === 'jelly') { var n = 0; for (var i = 0; i < vJelly.length; i++) if (vJelly[i] > 0) n++; return n; }
    if (G.goal === 'ingred') return Math.max(0, G.ingTotal - shownIng);
    return Math.max(0, G.target - scoreVis);
  }
  function buildView() {
    app.className = 'stage'; app.innerHTML = '';
    root.classList.add('cm-on');
    lvEl = plate('cm-lv', 'Level'); mvEl = plate('cm-mv', 'Moves'); scEl = plate('cm-sc', 'Score'); bestEl = plate('cm-best', 'Best');
    bestEl.appendChild(el('i', { text: '' }));
    meterFill = el('span');
    var meter = el('div', { class: 'cm-meter' }, [meterFill]);
    meterStars = [0, 1, 2].map(function () { var s = el('span', { style: { position: 'absolute', top: '50%' } }); meter.appendChild(s); return s; });
    scEl.appendChild(meter);
    hudEl = el('div', { class: 'cm-hud' }, [lvEl, mvEl, scEl, bestEl]);
    goalEl = el('div', { class: 'cm-goal' });
    sideEl = el('div', { class: 'cm-side' }, [hudEl, goalEl]);
    canvas = el('canvas', { 'aria-label': 'Candy board' }); ctx = canvas.getContext('2d');
    frameEl = el('div', { class: 'cm-frame wood' }, [canvas]);
    wrapEl = el('div', { class: 'cm-wrap' }, [frameEl]);
    app.appendChild(sideEl); app.appendChild(wrapEl);
    bindInput();
    if (ro) ro.disconnect();
    ro = new ResizeObserver(fit); ro.observe(app);
    view = 'game';
    W = 0; fit();
  }
  function fit() {
    if (!G || !canvas || !sideEl) return;
    var land = matchMedia('(orientation: landscape) and (min-aspect-ratio: 5/4)').matches;
    var cs = getComputedStyle(app), cell = 0;
    for (var pass = 0; pass < 2; pass++) {
      var aw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var ah = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      if (land) { sideEl.style.width = ''; aw -= sideEl.offsetWidth + 16; } else ah -= sideEl.offsetHeight + 8;
      cell = Math.max(22, Math.floor(Math.min((aw - 16) / G.C, (ah - 16) / G.R, 86)));
      if (!land) sideEl.style.width = (cell * G.C + 16) + 'px';
    }
    var w = cell * G.C, h = cell * G.R, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    if (cell === CELL && w === W && h === H && dpr === DPR && canvas.width) return;
    CELL = cell; W = w; H = h; DPR = dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
    sprites = {}; buildBg(); render();
  }
  function hudMoves(b) {
    if (!mvEl) return;
    mvEl.querySelector('b').textContent = String(shownMoves);
    mvEl.classList.toggle('low', shownMoves <= 5);
    if (b) bump(mvEl);
  }
  var goalKey = '';
  function hudGoal(b) {
    if (!goalEl || !G) return;
    var left = goalLeftView(), done = left <= 0, key = G.goal + left + done;
    if (key === goalKey && !b) return; goalKey = key;
    var count = G.goal === 'ingred' ? (G.ingTotal - left) + ' / ' + G.ingTotal : G.goal === 'jelly' ? String(left) : done ? '' : fmt(left);
    goalEl.className = 'cm-goal' + (done ? ' done' : '');
    goalEl.innerHTML = '';
    goalEl.appendChild(el('span', { class: 'gi', html: GI[G.goal] }));
    goalEl.appendChild(el('span', { class: 'tx' }, [el('small', { text: done ? 'Goal done' : G.goal === 'score' ? 'Goal · points to go' : G.goal === 'jelly' ? 'Goal · jelly left' : 'Goal' }), el('span', { text: goalText(L.def) })]));
    goalEl.appendChild(el('b', { html: done ? Kit.icon('check') : count }));
    if (b) bump(goalEl);
  }
  var meterKey = '';
  function hudMeter() {
    var st = stars3(), top = st[2] || 1, p = Math.min(1, scoreVis / top);
    var pos = [G.goal === 'score' ? st[0] / top : Math.min(0.3, st[1] / top * 0.5), st[1] / top, 1];
    var met = G.goal === 'score' ? scoreVis >= st[0] : goalLeftView() <= 0;
    var on = [met, met && scoreVis >= st[1], met && scoreVis >= st[2]];
    meterFill.style.width = (p * 100).toFixed(1) + '%';
    var key = on.join() + pos.join();
    if (key === meterKey) return; meterKey = key;
    meterStars.forEach(function (s, k) { s.style.left = 'calc(' + (pos[k] * 100).toFixed(1) + '% - ' + (k === 2 ? 4 : 0) + 'px)'; s.innerHTML = starSvg(on[k]); });
  }
  function bestNow() {
    var b = 0;
    if (L.mode === 'run') { try { var bd = ArcadeHi.board(KEY); if (bd.length) b = bd[0].score; } catch (e) {} return Math.max(b, L.run.total + scoreVis); }
    return Math.max(loadProg().best[L.n] || 0, scoreVis);
  }
  var bestBase = -1;
  function hudBest() {
    if (!bestEl) return;
    if (bestBase < 0) { bestBase = 0; try { if (L.mode === 'run') { var bd = ArcadeHi.board(KEY); if (bd.length) bestBase = bd[0].score; } else bestBase = loadProg().best[L.n] || 0; } catch (e) {} }
    var cur = L.mode === 'run' ? L.run.total + scoreVis : scoreVis;
    bestEl.querySelector('small').textContent = L.mode === 'run' ? 'Best run' : 'Level best';
    bestEl.querySelector('b').textContent = fmt(Math.max(bestBase, cur));
    bestEl.querySelector('i').textContent = L.mode === 'run' ? 'This run ' + fmt(cur) : 'Practice';
  }
  function hudAll() {
    if (!lvEl || !G) return;
    lvEl.querySelector('b').textContent = String(L.n); lvEl.title = L.def.name;
    hudMoves(); goalKey = ''; hudGoal(); meterKey = ''; hudMeter(); hudBest();
    scEl.querySelector('b').textContent = fmt(shownScore);
  }
  function addScore(v) { scoreVis += v; kick(); }
  function syncHud() {
    if (!scEl || !G) return;
    if (shownScore !== scoreVis) {
      var d = scoreVis - shownScore;
      shownScore = Math.abs(d) < 12 ? scoreVis : Math.round(shownScore + d * 0.2);
      scEl.querySelector('b').textContent = fmt(shownScore);
      if (shownScore === scoreVis) bump(scEl);
      hudBest();
    }
    hudMeter(); hudGoal();
  }

  // ═══ Input: swipe a candy toward a neighbour, or tap one then the other ═══
  var down = null;
  function cellAt(e) {
    var r = canvas.getBoundingClientRect();
    return CM.idx(G, Math.floor((e.clientY - r.top) / r.height * G.R), Math.floor((e.clientX - r.left) / r.width * G.C));
  }
  function canAct() { return G && state === 'play' && !playing && !document.querySelector('.k-scrim,.k-win,.ahi-overlay'); }
  function bindInput() {
    canvas.addEventListener('pointerdown', function (e) {
      ac();
      if (state === 'intro') { hideIntro(); return; }
      if (!canAct()) return;
      e.preventDefault();
      var i = cellAt(e);
      if (i < 0 || !G.cell[i] || G.frost[i]) { if (sel >= 0) { sel = -1; render(); } return; }
      down = { id: e.pointerId, i: i, x: e.clientX, y: e.clientY, done: false };
      try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
      clearHint();
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!down || e.pointerId !== down.id || down.done) return;
      var dx = e.clientX - down.x, dy = e.clientY - down.y, th = Math.max(10, CELL * 0.3);
      if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
      down.done = true;
      var r = (down.i / G.C) | 0, c = down.i % G.C;
      var j = Math.abs(dx) > Math.abs(dy) ? CM.idx(G, r, c + (dx > 0 ? 1 : -1)) : CM.idx(G, r + (dy > 0 ? 1 : -1), c);
      sel = -1;
      if (j >= 0) attempt(down.i, j); else render();
    });
    canvas.addEventListener('pointerup', function (e) {
      if (!down || e.pointerId !== down.id) return;
      var d = down; down = null;
      if (!d.done) tapCell(d.i);
    });
    canvas.addEventListener('pointercancel', function () { down = null; });
  }
  function adjacent(a, b) { return Math.abs(((a / G.C) | 0) - ((b / G.C) | 0)) + Math.abs(a % G.C - b % G.C) === 1; }
  function tapCell(i) {
    if (sel < 0) { sel = i; sTick(); Kit.haptic('light'); }
    else if (sel === i) sel = -1;
    else if (adjacent(sel, i)) { var a = sel; sel = -1; attempt(a, i); return; }
    else { sel = i; sTick(); }
    render(); armHint();
  }
  function attempt(a, b) {
    if (!canAct()) return;
    clearHint();
    var snap = L.mode === 'level' ? JSON.stringify(CM.save(G)) : null;
    var res = CM.move(G, a, b);
    if (!res.ok) { if (res.ida) badSwap(res); return; }
    undoSnap = snap;
    state = 'busy';
    shownMoves = G.moves; hudMoves(true);
    save();
    play(res.ev, function () { afterMove(res); });
  }
  function badSwap(res) {
    var va = V[res.ida], vb = V[res.idb]; if (!va || !vb) return;
    var ax = va.x, ay = va.y, bx = vb.x, by = vb.y;
    playing = true; sSwap();
    tw(va, { x: bx, y: by }, 130, 'io'); tw(vb, { x: ax, y: ay }, 130, 'io');
    after(140, function () { sBad(); Kit.haptic('light'); tw(va, { x: ax, y: ay }, 210, 'back'); tw(vb, { x: bx, y: by }, 210, 'back'); });
    after(360, function () { playing = false; armHint(); });
  }
  var STEP_WORDS = ['', '', '', 'Nice!', 'Great!', 'Yummy!', 'Wonderful!', 'Incredible!'];
  var COMBO_WORDS = { ss: 'Crossfire!', sw: 'Giant cross!', ww: 'Double boom!', b: 'Color storm!', bb: 'Board wipe!' };
  function afterMove(res) {
    var w = res.kind ? COMBO_WORDS[res.kind] : res.step >= 3 ? STEP_WORDS[Math.min(STEP_WORDS.length - 1, res.step)] : '';
    if (w) { Kit.callout(w, res.kind ? '#ff8fc8' : res.step >= 5 ? '#7ef0ff' : '#ffd45a'); if (res.step >= 5 || res.kind === 'bb') Kit.haptic('heavy'); }
    scoreVis = G.score; shownIng = G.ingDone; vJelly = G.jelly.slice(); vFrost = G.frost.slice();
    hudAll();
    checkEnd();
  }
  function checkEnd() {
    if (G.goal !== 'score' && CM.goalMet(G)) return finish(true);
    if (G.moves <= 0) return finish(G.goal === 'score' ? null : false);
    state = 'play'; armHint();
  }
  // End of a level. won: true (goal done, moves left become bonus), null (score level out of moves), false (failed)
  function finish(won) {
    state = 'bonus'; clearHint(); sel = -1;
    if (won === false) { banner = { text: 'Out of moves', sub: G.goal === 'jelly' ? goalLeftView() + ' jelly left' : (G.ingTotal - G.ingDone) + ' still to bring down', t0: clock, life: 1500 }; kick(); after(1300, function () { levelOver(false); }); return; }
    var ev = CM.bonus(G, won === true), reached = won === true || G.score >= G.target;
    banner = { text: reached ? 'Goal complete!' : 'Out of moves', sub: ev.length ? 'Bonus time' : reached ? 'Well done' : 'Leftover specials go off', t0: clock, life: 1400 };
    if (reached) { Kit.sfx('good'); Kit.haptic('success'); }
    kick();
    after(1250, function () {
      play(ev, function () {
        scoreVis = G.score; shownMoves = G.moves; hudAll();
        after(450, function () { levelOver(G.goal === 'score' ? G.score >= G.target : true); });
      });
    });
  }

  // ═══ Level intro card ═════════════════════════════════════════════════════
  function showIntro() {
    state = 'intro';
    if (introEl) introEl.remove();
    var d = L.def;
    introEl = el('div', { class: 'cm-intro' }, [el('div', { class: 'card' }, [
      el('small', { text: 'Level ' + L.n + (L.mode === 'run' ? ' · run' : '') }),
      el('h2', { text: d.name }),
      el('div', { class: 'gl' }, [el('span', { html: GI[d.goal] }), el('span', { text: goalText(d) })]),
      el('p', { text: 'in ' + d.moves + ' moves' })
    ])]);
    introEl.addEventListener('pointerdown', function (e) { e.preventDefault(); hideIntro(); });
    wrapEl.appendChild(introEl);
    requestAnimationFrame(function () { requestAnimationFrame(function () { if (introEl) introEl.classList.add('show'); }); });
    Kit.sfx('pop');
    clearTimeout(showIntro.t); showIntro.t = setTimeout(hideIntro, 2400);
  }
  function hideIntro() {
    clearTimeout(showIntro.t);
    if (introEl) { var n = introEl; introEl = null; n.classList.remove('show'); setTimeout(function () { n.remove(); }, 320); }
    if (state === 'intro') { state = 'play'; armHint(); }
  }

})();

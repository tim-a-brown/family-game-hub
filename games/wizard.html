<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizard Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.deal{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm);}
.deal .num{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:1.7rem;line-height:1;}
.deal .num small{display:block;color:#c9c1e6;font-family:var(--font);font-size:.55rem;font-weight:900;letter-spacing:.08em;margin-bottom:-1px;}
.deal .num{grid-auto-flow:row;align-content:center;justify-items:center;}
.deal .tx{min-width:0;flex:1;}
.deal b{display:block;font-size:1rem;}
.deal small{display:block;color:var(--text-2);font-weight:700;font-size:.84rem;}
.deal .bl{color:var(--yellow);}
.spad td .eq.dl{color:#b8860b;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null, cfg = null;
  var SETUP = 'wizard_pad_setup', DRAFT = 'wizard_pad_bids', KEY = 'wz';

  Kit.init({
    id: 'wizard', title: 'Wizard score',
    onNew: function () { if (pad) pad.clear(); dropDraft(); localStorage.removeItem(SETUP); showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { keys: ['wizard'], title: 'Wizard: past games' }); } }],
    rules:
      '<p class="goal">Play Wizard with real cards and keep score here. Guess exactly how many tricks you will win. Highest score after the last round wins.</p>' +
      '<h3>Each round</h3><ol><li>Deal the round number of cards (1 in round 1, 2 in round 2…). The dealer moves left each round.</li>' +
      '<li>Turn the next card over for trump. A Wizard: the dealer picks trump. A Jester, or no cards left: no trump.</li>' +
      '<li>Starting left of the dealer, everyone bids. Set each bid in the <b>Bid</b> row on the sheet. It stays there while you play.</li>' +
      '<li>After the last trick, set how many tricks each player <b>took</b> in the row under it, and tap <b>Score round</b>. A fresh round opens below.</li></ol>' +
      '<p>Made a mistake? Tap a round on the sheet to change or delete it right there.</p>' +
      '<h3>Playing</h3><ul><li>Follow the suit led if you can. A Wizard or Jester can always be played.</li>' +
      '<li>The first Wizard wins the trick. Otherwise the highest trump, otherwise the highest card of the suit led. Jesters always lose (all Jesters: the first one wins).</li></ul>' +
      '<h3>Scoring (done for you)</h3><ul><li>Hit your bid exactly: <b>20 + 10 per trick</b>.</li><li>Miss: <b>−10 for each trick</b> you were off.</li></ul>' +
      '<p>Rounds: 20 with 3 players, 15 with 4, 12 with 5, 10 with 6. On the score sheet the small numbers under each score are <b>bid / took</b>.</p>'
  });

  function getDraft() { try { return JSON.parse(localStorage.getItem(DRAFT)); } catch (e) { return null; } }
  function dropDraft() { try { localStorage.removeItem(DRAFT); } catch (e) {} }

  function showSetup() {
    pad = null;
    Kit.setup(app, {
      players: { min: 3, max: 6, count: 4, label: "Who's playing? (in seat order, player 1 deals first)" },
      options: [{ id: 'len', label: 'Game length', value: 'full', choices: [['full', 'Full · 60 ÷ players', 'Deal one more card each round until the deck runs out.'], ['half', 'Half', 'Stop halfway for a shorter game.']] }],
      start: 'Start scoring',
      onStart: function (c) {
        var n = c.players.length, full = Math.floor(60 / n);
        localStorage.setItem(SETUP, JSON.stringify({ names: c.players.map(function (p) { return p.name; }), rounds: c.options.len === 'half' ? Math.ceil(full / 2) : full }));
        dropDraft(); startPad();
      }
    });
  }

  function score(b, t) { return b === t ? 20 + 10 * b : -10 * Math.abs(b - t); }
  function parse(detail) {
    return (detail || []).map(function (d) { var m = /^(\d+)\s*\/\s*(\d+)$/.exec(String(d || '')); return m ? { b: +m[1], t: +m[2] } : null; });
  }

  // Whole-game highlights, worked out when the last round is entered
  function gameHighlights(all, names) {
    var out = [], n = names.length;
    var best = { len: 0 };
    for (var i = 0; i < n; i++) {
      var run = 0;
      all.forEach(function (r) { var x = r[i]; run = x && x.b === x.t ? run + 1 : 0; if (run > best.len) best = { len: run, i: i }; });
    }
    if (best.len >= 3) out.push(names[best.i] + ' nailed ' + best.len + ' bids in a row');
    var miss = { d: 0 }, made = { b: 0 };
    all.forEach(function (r, ri) {
      r.forEach(function (x, j) {
        if (!x) return;
        var d = Math.abs(x.b - x.t);
        if (d > miss.d || (d === miss.d && x.b > miss.b)) miss = { d: d, i: j, b: x.b, t: x.t, r: ri + 1 };
        if (d === 0 && x.b > made.b) made = { b: x.b, i: j, r: ri + 1 };
      });
    });
    if (miss.d >= 2) out.push(names[miss.i] + ' bid ' + miss.b + ' and took ' + miss.t + ' in round ' + miss.r);
    if (made.b >= 3) out.push(names[made.i] + ' bid ' + made.b + ' and got exactly ' + made.b + ' in round ' + made.r + ' (+' + score(made.b, made.b) + ')');
    var hits = names.map(function (nm, j) { return all.filter(function (r) { return r[j] && r[j].b === r[j].t; }).length; });
    var top = hits.indexOf(Math.max.apply(null, hits));
    out.push(names[top] + ' hit their bid in ' + hits[top] + ' of ' + all.length + ' rounds');
    var zeros = names.map(function (nm, j) { return all.filter(function (r) { return r[j] && r[j].b === 0 && r[j].t === 0; }).length; });
    var z = zeros.indexOf(Math.max.apply(null, zeros));
    if (zeros[z] >= 3) out.push(names[z] + ' bid zero and dodged every trick ' + zeros[z] + ' times');
    return out;
  }

  function startPad() {
    cfg = JSON.parse(localStorage.getItem(SETUP));
    var n = cfg.names.length;
    app.innerHTML = '';
    var strip = el('div', { class: 'deal' }), host = el('div');
    app.appendChild(strip); app.appendChild(host);
    function paintStrip() {
      var st = pad ? pad.state() : null, r = st ? st.rounds.length + 1 : 1;
      if (!st || st.over || r > cfg.rounds) { strip.hidden = true; return; }
      strip.hidden = false; strip.innerHTML = '';
      var dealer = (r - 1) % n, first = r % n;
      var kids = [el('b', { text: 'Deal ' + r + (r === 1 ? ' card' : ' cards') + ' each' + (r === cfg.rounds ? ' · last round, no trump' : '') }),
        el('small', { text: cfg.names[dealer] + ' deals · ' + cfg.names[first] + ' goes first' })];
      strip.appendChild(el('div', { class: 'num', html: '<small>RND</small>' + r }));
      strip.appendChild(el('div', { class: 'tx' }, kids));
    }
    new MutationObserver(paintStrip).observe(host, { childList: true });

    pad = Scorepad(host, {
      key: KEY, title: 'Wizard', mode: 'Scorekeeper', rounds: cfg.rounds,
      sides: cfg.names.map(function (nm) { return { name: nm }; }),
      goal: 'Highest score after ' + cfg.rounds + ' rounds wins · small numbers: bid / took',
      // The open round on the sheet: a Bid row, then a Took row under it
      entryRows: function (ctx) {
        var R = ctx.round, prev = ctx.editing ? parse(ctx.prev.detail) : null, dr = ctx.editing ? null : getDraft();
        var bids = cfg.names.map(function (nm, i) { return prev && prev[i] ? prev[i].b : dr && dr.round === R && dr.bids ? dr.bids[i] : null; });
        var took = cfg.names.map(function (nm, i) { return prev && prev[i] ? prev[i].t : dr && dr.round === R && dr.took ? dr.took[i] : null; });
        var dealer = (R - 1) % n;
        var rowB = el('tr', { class: 'open' }, [el('th', { class: 'rn' }, [String(R), el('small', { text: 'BID' })])]);
        var rowT = el('tr', { class: 'open' }, [el('th', { class: 'rn' }, [el('small', { text: 'TOOK' })])]);
        var beq = [], teq = [];
        cfg.names.forEach(function (nm, i) {
          var sb = Scorepad.step({ value: bids[i], min: 0, max: R, label: nm + ' bid', onChange: function (v) { bids[i] = v == null ? null : Math.min(R, v); refresh(); } });
          beq[i] = el('small', { class: 'eq' + (i === dealer ? ' dl' : ''), text: i === dealer ? 'deals' : '' });
          rowB.appendChild(el('td', null, [sb, beq[i]]));
          var stt = Scorepad.step({ value: took[i], min: 0, max: R, label: nm + ' tricks taken', onChange: function (v) { took[i] = v == null ? null : Math.min(R, v); refresh(); } });
          teq[i] = el('small', { class: 'eq' });
          rowT.appendChild(el('td', null, [stt, teq[i]]));
        });
        function refresh() {
          var bSet = bids.every(function (b) { return b != null; }), tSet = took.every(function (t) { return t != null; });
          var bsum = bids.reduce(function (a, b) { return a + (b || 0); }, 0), tsum = took.reduce(function (a, t) { return a + (t || 0); }, 0);
          var pts = cfg.names.map(function (nm, i) {
            if (bids[i] == null || took[i] == null) { teq[i].textContent = ''; teq[i].className = 'eq'; return 0; }
            var s = score(bids[i], took[i]); teq[i].textContent = (s > 0 ? '+' : '') + s; teq[i].className = 'eq ' + (s > 0 ? 'good' : 'bad'); return s;
          });
          ctx.pending(pts);
          if (!bSet) ctx.status('Set everyone\'s bid' + (bsum ? ' (' + bsum + ' bid so far).' : '.'), 'wait');
          else if (!tSet) ctx.status('Bids total ' + bsum + ' for ' + R + (R === 1 ? ' trick' : ' tricks') + (bsum > R ? ' (overbid)' : bsum < R ? ' (underbid)' : ' (even)') + '. After the hand, set tricks taken.', 'wait');
          else if (tsum !== R) ctx.status('Tricks add up to ' + tsum + '. There ' + (R === 1 ? 'was 1 trick.' : 'were ' + R + '.'), tsum > R ? false : 'wait');
          else ctx.status('Looks right.', true);
          if (!ctx.editing) { try { localStorage.setItem(DRAFT, JSON.stringify({ round: R, bids: bids.slice(), took: took.slice() })); } catch (e) {} }
        }
        refresh();
        ctx.entry = { bids: bids, took: took };
        return [rowB, rowT];
      },
      lockLabel: 'Score round',
      onLock: function (ctx) {
        var R = ctx.round, bids = ctx.entry.bids, took = ctx.entry.took;
        if (bids.some(function (b) { return b == null; }) || took.some(function (t) { return t == null; }) || took.reduce(function (a, t) { return a + t; }, 0) !== R) return;
        var scores = bids.map(function (b, i) { return score(b, took[i]); });
        var extra = { detail: bids.map(function (b, i) { return b + '/' + took[i]; }), highlights: [] };
        var big = -1; bids.forEach(function (b, i) { if (b === took[i] && b >= 4 && (big < 0 || b > bids[big])) big = i; });
        if (big >= 0) extra.callout = cfg.names[big] + ' nailed ' + bids[big] + '!';
        if (!ctx.editing && R === cfg.rounds) {
          var all = pad.state().rounds.map(function (r) { return parse(r.detail); });
          all.push(bids.map(function (b, i) { return { b: b, t: took[i] }; }));
          extra.highlights = gameHighlights(all, cfg.names);
        }
        if (!ctx.editing) dropDraft();
        ctx.done(scores, extra);
      }
    });
    paintStrip();
  }

  if (localStorage.getItem(SETUP)) startPad(); else showSetup();
})();
</script>
</body>
</html>

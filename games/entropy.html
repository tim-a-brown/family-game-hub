<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entropy</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="entropy-core.js"></script>
<style>
.en-credit{margin:-6px 0 2px;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-3);}
.cb-col{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
/* The chips: enamel discs in seven colors, each with its own mark pressed into it, so no two are told apart by color
   alone */
.k1{--c:#d8352c;--hi:#ff9d90;--lo:#6e0f0a;--gl:rgba(70,0,0,.42);}
.k2{--c:#f0b41f;--hi:#fff0a6;--lo:#8a5a00;--gl:rgba(90,50,0,.42);}
.k3{--c:#2f9a4c;--hi:#9cf0a8;--lo:#0d4a1f;--gl:rgba(0,40,10,.45);}
.k4{--c:#2c6fd8;--hi:#a6c8ff;--lo:#0c2c6a;--gl:rgba(0,20,70,.45);}
.k5{--c:#8a4fd0;--hi:#dcbcff;--lo:#3a1470;--gl:rgba(40,0,80,.45);}
.k6{--c:#ece4d2;--hi:#ffffff;--lo:#9a8f78;--gl:rgba(80,60,30,.38);}
.k7{--c:#2b2d33;--hi:#8f939e;--lo:#050507;--gl:rgba(255,255,255,.4);}
.disc{position:relative;border-radius:50%;background:radial-gradient(circle at 34% 28%,var(--hi) 0,var(--c) 40%,var(--lo) 100%);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.32),inset 0 1.5px 1.5px rgba(255,255,255,.4),0 2px 0 rgba(0,0,0,.35),0 4px 7px rgba(0,0,0,.35);}
.disc::before{content:'';position:absolute;inset:13%;border-radius:50%;box-shadow:inset 0 1px 1px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.25);}
.disc svg{position:absolute;inset:27%;width:46%;height:46%;fill:var(--gl);display:block;}
.k7.disc{box-shadow:inset 0 -2px 3px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(200,205,220,.35),inset 0 1.5px 1.5px rgba(255,255,255,.35),0 2px 0 rgba(0,0,0,.4),0 4px 7px rgba(0,0,0,.35);}

/* A player's plate: their role (Order's mirror, Chaos's scatter), their name, and their points as Order */
.pbar{display:flex;align-items:center;gap:10px;min-height:50px;padding:5px 12px 5px 10px;border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s,background .2s;}
.pbar.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 18%,transparent);}
.pbar .role{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.pbar .role svg{width:24px;height:24px;display:block;}
.pbar.on .role{background:color-mix(in srgb,var(--lit) 22%,transparent);}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;}
.pbar .nm{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.pbar .nm .ico{width:15px;height:15px;color:var(--text-3);flex:none;}
.pbar .nm span{overflow:hidden;text-overflow:ellipsis;}
.pbar .sub{font-size:.74rem;font-weight:700;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbar.on .sub{color:var(--lit-ink);}
.pbar .pt{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:3.4em;}
.pbar .pt b{font-family:var(--display);font-size:1.55rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.pbar .pt small{font-size:.68rem;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pbar .pt.live b{color:var(--lit-ink);}
.pbar .pt b.bump{animation:pop .45s var(--spring);}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* The bag: a cloth bag on the table, the chip just drawn beside it, and how many of each color are still inside, as
   stacks of chips */
.bagbox{display:flex;align-items:center;gap:12px;padding:6px 12px 6px 8px;border-radius:18px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);min-height:var(--bh,74px);}
.bag{width:calc(var(--bh,74px) * .82);height:calc(var(--bh,74px) * .9);flex:none;position:relative;}
.bag svg{width:100%;height:100%;display:block;overflow:visible;}
.bag .body{transform-origin:50% 100%;transition:transform .5s var(--spring);}
.bag.shake{animation:bagsh .5s ease-in-out;}
@keyframes bagsh{20%{transform:rotate(-7deg);}45%{transform:rotate(6deg);}70%{transform:rotate(-3deg);}}
.tray{width:calc(var(--bh,74px) * .78);height:calc(var(--bh,74px) * .78);flex:none;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(0,0,0,.42),rgba(0,0,0,.2) 70%,rgba(255,255,255,.05));box-shadow:inset 0 2px 5px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.08);}
.tray .disc{width:84%;height:84%;}
.tray .disc.rise{animation:rise .62s cubic-bezier(.25,1.4,.5,1) both;}
@keyframes rise{0%{transform:translate(calc(var(--bh,74px) * -.9),calc(var(--bh,74px) * .1)) scale(.3);opacity:0;}35%{opacity:1;transform:translate(calc(var(--bh,74px) * -.6),calc(var(--bh,74px) * -.55)) scale(.8);}100%{transform:none;}}
.tray .disc.lift{transform:translateY(-3px) scale(1.06);box-shadow:0 0 0 3px #ffd75a,0 8px 16px rgba(0,0,0,.5);}
.tray.empty::after{content:'';width:30%;height:30%;border-radius:50%;border:2px dashed rgba(255,255,255,.18);}
.counts{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:flex-end;gap:2px;}
.counts .st{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1;}
.counts .stk{position:relative;width:min(calc(var(--bh,74px) * .3),100%);height:calc(var(--bh,74px) * .52);}
.counts .stk .disc{position:absolute;left:0;width:100%;height:auto;aspect-ratio:1/.42;border-radius:50%;box-shadow:inset 0 -1px 1px rgba(0,0,0,.4),0 1px 0 rgba(0,0,0,.4);}
.counts .stk .disc::before,.counts .stk .disc svg{display:none;}
.counts small{font-size:.72rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text-2);line-height:1;}
.counts .st.out{opacity:.35;}
.counts .st.drew small{color:var(--lit-ink);}
.bagbox .gtag{display:none;}

/* The board: a walnut frame round a slate tray with a carved well for every square */
.frame{--rim:clamp(7px,2vw,14px);position:relative;padding:var(--rim);border-radius:16px;
  background:repeating-linear-gradient(91deg,rgba(255,255,255,.035) 0 2px,transparent 2px 8px),repeating-linear-gradient(87deg,rgba(0,0,0,.12) 0 1px,transparent 1px 13px),linear-gradient(180deg,#5a3720,#33200f);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.4),0 16px 34px rgba(0,0,0,.5);}
.bd{--n:7;position:relative;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;border-radius:8px;
  background:radial-gradient(120% 90% at 30% 20%,#4a5662,#323b45 60%,#262d35);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.4);}
.bd .lyr{position:absolute;inset:0;pointer-events:none;}
.bd .lyr.wls{pointer-events:auto;}
.bd .wl{position:absolute;width:calc(100% / var(--n));height:calc(100% / var(--n));display:grid;place-items:center;}
.bd .wl::before{content:'';width:84%;height:84%;border-radius:50%;background:radial-gradient(circle at 50% 38%,rgba(0,0,0,.38),rgba(0,0,0,.18) 70%,rgba(255,255,255,.05));box-shadow:inset 0 2px 4px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.07);}
.bd .wl.lit::before{box-shadow:inset 0 2px 4px rgba(0,0,0,.55),0 0 0 1.5px rgba(255,215,90,.2);}
.bd .ch{position:absolute;width:calc(100% / var(--n));height:calc(100% / var(--n));display:grid;place-items:center;pointer-events:none;}
.bd .ch .disc{width:84%;height:84%;transition:transform .2s var(--spring),box-shadow .2s;}
.bd .ch.sel .disc{transform:translateY(-3px) scale(1.07);box-shadow:0 0 0 3px #ffd75a,0 0 18px rgba(255,215,90,.55),0 8px 14px rgba(0,0,0,.5);}
.bd .ch.last .disc{box-shadow:inset 0 -2px 3px rgba(0,0,0,.32),inset 0 1.5px 1.5px rgba(255,255,255,.4),0 0 0 2px rgba(255,215,90,.75),0 4px 7px rgba(0,0,0,.35);}
.bd .ch.gone{opacity:.28;}
.bd .ch.ghost{opacity:.62;}
.bd .ch.drag{z-index:5;}
.bd .ch.drag .disc{transform:scale(1.12);box-shadow:0 0 0 3px #ffd75a,0 14px 22px rgba(0,0,0,.55);}
.bd .ch.fly{z-index:4;}
.bd .ch.pop .disc{animation:cpop .42s cubic-bezier(.3,1.6,.5,1);}
@keyframes cpop{0%{transform:scale(1.25);}100%{transform:none;}}
.bd svg.runs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.bd .run{fill:none;stroke:rgba(255,215,90,.42);stroke-width:.035;}
.bd .run.new{fill:none;stroke:#ffd75a;stroke-width:.06;filter:drop-shadow(0 0 .08px #ffd75a);animation:rnew 1.4s ease-out;}
@keyframes rnew{0%{stroke-width:.16;opacity:.2;}25%{opacity:1;}}
.bd .run.pv{fill:none;stroke:#ffd75a;stroke-width:.05;stroke-dasharray:.14 .09;}
.bd .run.cnt{fill:none;stroke:#ffe27a;stroke-width:.07;filter:drop-shadow(0 0 .1px #ffd75a);}
.bd .run.dim{opacity:.35;}
.bd .lnhl{fill:rgba(255,226,140,.04);stroke:rgba(255,226,140,.5);stroke-width:.03;}
.bd .dst{position:absolute;width:calc(100% / var(--n));height:calc(100% / var(--n));display:grid;place-items:center;pointer-events:none;}
.bd .dst span{min-width:46%;height:46%;padding:0 3px;box-sizing:border-box;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:calc(var(--cell) * .24);font-variant-numeric:tabular-nums;line-height:1;
  background:rgba(255,215,90,.16);box-shadow:0 0 0 2px rgba(255,215,90,.75);color:#ffe9a8;animation:din .2s ease-out both;}
.bd .dst span.z{min-width:26%;height:26%;padding:0;background:rgba(255,215,90,.55);box-shadow:0 0 0 2px rgba(255,215,90,.35);}
.bd .dst span.neg{background:rgba(255,106,77,.16);box-shadow:0 0 0 2px rgba(255,120,90,.7);color:#ffc2b2;}
.bd .dst span.give{background:rgba(255,106,77,.12);box-shadow:0 0 0 1.5px rgba(255,120,90,.55);color:#ffc2b2;min-width:40%;height:40%;}
.bd .dst.hov span{transform:scale(1.15);background:rgba(255,215,90,.32);}
.bd .dst span.give.hov{transform:scale(1.15);}
.bd .lyr.dim .dst.hov{z-index:10;}
.bd .lyr.dim .dst.hov span{box-shadow:0 0 0 2px rgba(255,215,90,.9),0 0 0 4px rgba(10,8,4,.55);background:rgba(58,44,10,.92);color:#ffe9a8;}
.bd .lyr.dim .dst.hov span.neg{box-shadow:0 0 0 2px rgba(255,120,90,.9),0 0 0 4px rgba(10,8,4,.55);background:rgba(70,20,10,.92);color:#ffc2b2;}
.bd .lyr.dim .dst:not(.hov) span{opacity:.28;transition:opacity .15s;}
/* Where a number comes from (paintBreak): each palindrome it counts as a gold bar from chip to chip, nested ones side by
   side, each with its own points; one a slide would break in red */
.bd .bk{z-index:8;}
.bd .bk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.bd .bk .u{stroke:rgba(10,8,4,.62);stroke-width:.17;stroke-linecap:round;fill:none;}
.bd .bk .l{stroke:#ffd75a;stroke-width:.085;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 .05px #ffd75a);}
.bd .bk .d{fill:#ffe9a8;stroke:rgba(10,8,4,.62);stroke-width:.035;}
.bd .bk .neg .l{stroke:#ff8a6b;stroke-dasharray:.13 .09;stroke-linecap:butt;filter:none;}
.bd .bk .neg .d{fill:#ffc2b2;}
.bd .bk .t{position:absolute;transform:translate(-50%,-50%);min-width:1.75em;padding:.12em .42em;box-sizing:border-box;border-radius:999px;text-align:center;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;
  background:linear-gradient(180deg,#ffe48a,#d9a223);color:#3a2600;box-shadow:0 0 0 1.5px rgba(10,8,4,.55),0 2px 5px rgba(0,0,0,.5);animation:bkin .18s ease-out both;}
.bd .bk .t.neg{background:linear-gradient(180deg,#ffb4a0,#d9573a);color:#3a0c00;}
.bd .bk g{animation:bkin .18s ease-out both;}
@keyframes bkin{from{opacity:0;}}
.bd .lp.pk{cursor:help;pointer-events:auto;}
.bd .lp.pk.on{box-shadow:0 0 0 2px #fff3c4,0 2px 8px rgba(0,0,0,.6);}
@keyframes din{from{opacity:0;transform:scale(.5);}}
.bd .gf{position:absolute;font-family:var(--display);font-weight:800;font-size:calc(var(--cell) * .5);color:#ffe27a;text-shadow:0 2px 6px rgba(0,0,0,.7),0 0 12px rgba(255,200,60,.6);pointer-events:none;transform:translate(-50%,-50%);animation:gfloat 1.3s ease-out forwards;white-space:nowrap;z-index:6;}
.bd .gf.neg{color:#ff9b85;text-shadow:0 2px 6px rgba(0,0,0,.7);}
@keyframes gfloat{0%{opacity:0;transform:translate(-50%,-20%) scale(.6);}20%{opacity:1;transform:translate(-50%,-60%) scale(1.1);}100%{opacity:0;transform:translate(-50%,-170%) scale(1);}}
.bd .lp{position:absolute;z-index:9;transform:translate(-50%,-50%);min-width:1.9em;padding:2px 7px;border-radius:999px;text-align:center;font-weight:800;font-size:min(calc(var(--cell) * .26),24px);font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#ffe48a,#d9a223);color:#3a2600;box-shadow:0 2px 6px rgba(0,0,0,.5);animation:lpin .35s ease-out;pointer-events:none;}
@keyframes lpin{from{opacity:0;filter:brightness(1.8);}}
.bd .lp.z{background:rgba(30,34,40,.85);color:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(255,255,255,.15);}
.bd.shake{animation:shake .4s;}
.frame .lbl{position:absolute;font-size:calc(var(--cell) * .2);font-weight:800;color:rgba(255,226,180,.55);pointer-events:none;transform:translate(-50%,-50%);font-family:var(--display);}
.turn{margin:2px 0 0;min-height:34px;}
.turn .bks{color:var(--lit-ink);font-weight:700;}
.acts{display:flex;gap:10px;justify-content:center;margin-top:2px;}
.acts .btn{flex:1;max-width:200px;}

/* A layout for each shape (fit() sizes the board to the room). Upright: the other player, the bag, the board, you, whose
   turn and the buttons. Sideways: the players, the bag, whose turn and the buttons in a column at the left, the board
   you play on at the right */
#app.stage.ipl{max-width:none;box-sizing:border-box;height:var(--avh,auto);display:flex;flex-direction:column;align-items:center;
  padding:4px max(10px,var(--corner-x,0px)) max(calc(var(--safe-b) + 10px),18px);}
#app.ipl>.cb-col{width:var(--cw,100%);max-width:none;flex:none;margin:auto 0;}
#app.en-port>.cb-col{height:100%;margin:0;gap:var(--gp,10px);justify-content:center;}
#app.en-port>.cb-col>*{flex:none;}
#app.en-port>.cb-col>.turn{font-size:1.02rem;margin:0;}
.pbar .sub .lg{display:none;}
#app.en-tall .pbar .sub .lg,#app.en-desk .pbar .sub .lg,#app.en-land:not(.en-low) .pbar .sub .lg{display:inline;}
#app.en-tall .pbar .sub .sh,#app.en-desk .pbar .sub .sh,#app.en-land:not(.en-low) .pbar .sub .sh{display:none;}
#app.en-port>.cb-col>.acts{margin:0;}
#app.en-port.en-short .pbar{min-height:42px;padding:3px 10px;}
#app.en-port.en-short .pbar .role{width:28px;height:28px;}
#app.en-port.en-short .pbar .pt b{font-size:1.3rem;}
#app.en-port.en-short>.cb-col>.turn{min-height:24px;font-size:.9rem;}
#app.en-port.en-short>.cb-col>.acts .btn{min-height:40px;}
#app.en-tall .pbar{min-height:62px;padding:8px 16px 8px 12px;}
#app.en-tall .pbar .nm{font-size:1.1rem;}
#app.en-tall .pbar .sub{font-size:.85rem;}
#app.en-tall .pbar .pt b{font-size:2rem;}
#app.en-tall .pbar .role{width:42px;height:42px;}
#app.en-tall .pbar .role svg{width:30px;height:30px;}
#app.en-tall .counts small{font-size:.85rem;}
#app.en-land>.cb-col{width:auto;height:var(--bsz);display:grid;grid-template-columns:var(--sw,300px) var(--bsz);
  grid-template-rows:max-content max-content max-content minmax(0,1fr) max-content max-content;
  grid-template-areas:"t b" "g b" "s b" ". b" "a b" "p b";column-gap:var(--cg,24px);row-gap:10px;justify-content:center;}
#app.en-land>.cb-col>.frame{grid-area:b;--rim:clamp(7px,1.8vh,20px);}
#app.en-land>.cb-col>.pbar.top{grid-area:t;}
#app.en-land>.cb-col>.pbar.bot{grid-area:p;}
#app.en-land>.cb-col>.bagbox{grid-area:g;}
#app.en-land>.cb-col>.turn{grid-area:s;justify-self:start;}
#app.en-land>.cb-col>.acts{grid-area:a;justify-content:flex-start;flex-wrap:wrap;}
#app.en-low>.cb-col{row-gap:6px;}
#app.en-low .pbar{min-height:40px;padding:3px 9px;}
#app.en-low .pbar .role{width:26px;height:26px;}
#app.en-low .pbar .role svg{width:19px;height:19px;}
#app.en-low .pbar .pt b{font-size:1.25rem;}
#app.en-low>.cb-col>.turn{min-height:24px;font-size:.9rem;margin:0;}
#app.en-low>.cb-col>.acts .btn{min-height:40px;}
/* A large window: the room in the column at the left (or a column of its own), between whose turn it is and the
   buttons */
.room{display:none;}
#app.en-land.en-desk>.cb-col{grid-template-areas:"t b" "g b" "s b" "m b" "a b" "p b";}
#app.en-land.en-desk.en-two>.cb-col{grid-template-columns:var(--sw) var(--rw) var(--bsz);grid-template-areas:"t m b" "g m b" "s m b" ". m b" "a m b" "p m b";}
#app.en-land.en-desk>.cb-col>.room{grid-area:m;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden;}
#app.en-desk .pbar{min-height:calc(62px * var(--dk,1));padding:calc(8px * var(--dk,1)) calc(16px * var(--dk,1));}
#app.en-desk .pbar .nm{font-size:calc(1.05rem * var(--dk,1));}
#app.en-desk .pbar .sub{font-size:calc(.8rem * var(--dk,1));}
#app.en-desk .pbar .pt b{font-size:calc(1.9rem * var(--dk,1));}
#app.en-desk .pbar .role{width:calc(40px * var(--dk,1));height:calc(40px * var(--dk,1));}
#app.en-desk .pbar .role svg{width:calc(28px * var(--dk,1));height:calc(28px * var(--dk,1));}
#app.en-desk .counts small{font-size:calc(.85rem * var(--dk,1));}
#app.en-desk>.cb-col>.turn{font-size:calc(1rem * var(--dk,1));}
.room .pn{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;flex:none;font-size:calc(.92rem * var(--dk,1));}
.room .pn.mv{flex:0 1 auto;}
.room h4{margin:0;font-size:.88em;font-weight:800;color:var(--text-3);display:flex;justify-content:space-between;gap:8px;}
.room h4 b{color:var(--lit-ink);font-family:var(--display);font-size:1.35em;line-height:1;}
.room .say{margin:0;font-weight:600;line-height:1.35;}
.room .lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
.room .lines li{display:grid;grid-template-columns:5.2em minmax(0,1fr) 2.2em;align-items:center;gap:8px;}
.room .lines li span{font-weight:700;white-space:nowrap;}
.room .lines li b{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--display);font-size:1.15em;}
.room .mini{display:flex;gap:2px;align-items:center;position:relative;}
.room .mini .disc{width:1.05em;height:1.05em;flex:none;box-shadow:inset 0 -1px 1px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.35);}
.room .mini .disc::before,.room .mini .disc svg{display:none;}
.room .mini .disc.on{box-shadow:0 0 0 1.5px #ffd75a,0 0 6px rgba(255,215,90,.6);}
.room .mini .disc.off{opacity:.4;}
.room .mvl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-height:0;}
.room .mvl li{display:grid;grid-template-columns:2.2em 1.1em minmax(0,1fr) auto;align-items:center;gap:8px;padding:3px 4px;border-radius:9px;}
.room .mvl li:first-child{background:color-mix(in srgb,var(--lit) 12%,transparent);}
.room .mvl li .no{color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:700;text-align:right;}
.room .mvl li .disc{width:1em;height:1em;}
.room .mvl li .disc::before,.room .mvl li .disc svg{display:none;}
.room .mvl li .who{font-weight:700;overflow-wrap:anywhere;}
.room .mvl li .tag{font-size:.8em;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--lit) 20%,transparent);color:var(--lit-ink);}
.room .mvl li .tag.neg{background:rgba(255,122,89,.18);color:#ffb39f;}
.room .mvl li.none{display:block;color:var(--text-3);}
.room .g1 .mb{display:block;width:100%;max-width:calc(260px * var(--dk,1));aspect-ratio:1;margin:0 auto;border-radius:8px;box-shadow:0 0 0 3px #4a2e1a,0 4px 10px rgba(0,0,0,.4);}
.room .wins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.room .wins li{display:flex;justify-content:space-between;gap:10px;}
.room .wins li span{font-weight:700;overflow-wrap:anywhere;}
.frame{view-transition-name:en-board;}
.pbar.top{view-transition-name:en-top;}
.pbar.bot{view-transition-name:en-bot;}
.bagbox{view-transition-name:en-bag;}
.cb-col>.turn{view-transition-name:en-turn;}
.cb-col>.acts{view-transition-name:en-acts;}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,.7,.25,1);}
::view-transition-old(root),::view-transition-new(root){animation:none;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), C = window.EntropyCore;
  var SAVE = 'entropy_state', KEY = 'entropy';
  var CREDIT = 'Entropy was designed by Eric Solomon.';
  var CNAME = [null, 'red', 'yellow', 'green', 'blue', 'purple', 'white', 'black'];
  var CHEX = [null, '#d8352c', '#f0b41f', '#2f9a4c', '#2c6fd8', '#8a4fd0', '#ece4d2', '#55585f'];
  // each color's mark: a ring, a triangle, a square, a diamond, a cross, a star, a hexagon (in a 10 by 10 box)
  var GLYPH = [null,
    '<path d="M5 2.2a2.8 2.8 0 1 0 .01 0zm0 1.5a1.3 1.3 0 1 1-.01 0z" fill-rule="evenodd"/>',
    '<path d="M5 1.8 8.4 7.9H1.6z"/>',
    '<path d="M2.4 2.4h5.2v5.2H2.4z"/>',
    '<path d="M5 1.4 8.6 5 5 8.6 1.4 5z"/>',
    '<path d="M4 1.6h2v2.4h2.4v2H6v2.4H4V6H1.6V4H4z"/>',
    '<path d="M5 1.3l1.1 2.4 2.6.3-1.9 1.8.5 2.6L5 7.1 2.7 8.4l.5-2.6L1.3 4l2.6-.3z"/>',
    '<path d="M5 1.5 8.1 3.25v3.5L5 8.5 1.9 6.75v-3.5z"/>'];
  var NUM = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven'];
  function num(n) { return NUM[n] || String(n); }
  function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function disc(c, cls) { return '<span class="disc k' + c + (cls ? ' ' + cls : '') + '"><svg viewBox="0 0 10 10" aria-hidden="true">' + GLYPH[c] + '</svg></span>'; }
  // the roles' marks: Order a mirrored pattern either side of a line, Chaos chips flung apart
  var ROLE_SVG = {
    order: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18" stroke="#ffd75a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 2.4"/><circle cx="6.5" cy="7" r="2.6" fill="#2c6fd8"/><circle cx="17.5" cy="7" r="2.6" fill="#2c6fd8"/><circle cx="7.5" cy="16.5" r="2.6" fill="#d8352c"/><circle cx="16.5" cy="16.5" r="2.6" fill="#d8352c"/></svg>',
    chaos: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="8" r="2.5" fill="#f0b41f"/><circle cx="16.5" cy="5.5" r="2.3" fill="#2f9a4c"/><circle cx="18" cy="16" r="2.6" fill="#8a4fd0"/><circle cx="8.5" cy="17.5" r="2.4" fill="#d8352c"/><circle cx="12.2" cy="11.6" r="1.7" fill="#ece4d2"/><path d="M3 13.5c2-.6 3 .8 4.5 0M14 2.8c.8 1.2 2.4 1 3.2 2" stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none" stroke-linecap="round"/></svg>'
  };

  // ── State ────────────────────────────────────────────────────────────────
  // S = the core's state (entropy-core.js) and {mode, level, cover, players: [{name, cpu}], hist (undo snapshots),
  //   started, ev: ['+3', '-2', '0', ...] (each Order move's points, this game), best: [longest run each seat made as
  //   Order], big: [best single slide each seat made]}
  var S = null, VIEW = null, SEL = -1, HOV = -1, DRAG = null, BUSY = 0, HOLD = false;
  var LEVEL_NAME = { easy: 'Easy', normal: 'Normal', hard: 'Hard' };
  var NET = null, LEFT = null, WINO = null, NETREC = {}, SHOWN = 0;
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && !S.over) Kit.resume.set('Game ' + (S.g + 1) + ' of 2');
  }
  function clearSave() { if (NET) return; try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function vsCpu() { return S.players.some(function (p) { return p.cpu; }); }
  function mySeat() { if (NET) return NET.seat; if (vsCpu()) return S.players[0].cpu ? 1 : 0; return -1; }
  function isMe(seat) { return NET ? NET.seat === seat : vsCpu() && !S.players[seat].cpu; }
  function nmOf(seat) { return isMe(seat) ? 'You' : S.players[seat].name; }
  function nmIn(seat) { return isMe(seat) ? 'you' : S.players[seat].name; }
  function orderSeat() { return S.ord[S.g]; }
  function chaosSeat() { return 1 - S.ord[S.g]; }
  function sz() { return S.sz; }

  function rulesHtml() {
    return '<p class="goal">One player is <b>Order</b> and makes patterns; the other is <b>Chaos</b> and tries to stop them. You play two games, one in each role. Whoever scores more points as Order wins.</p>' +
      '<h3>A turn</h3><ul><li><b>Chaos</b> draws a chip from the bag at random, so both players see its color, and puts it on any empty square.</li>' +
      '<li>Then <b>Order</b> may slide any one chip on the board, any number of empty squares along its row or its column, as a rook moves in chess. A chip can’t jump over another chip. Order can also pass.</li>' +
      '<li>Every chip belongs to nobody: Order can slide any chip, wherever it came from.</li>' +
      '<li>Tap a chip to see where it can slide. With Hints on, each lit square shows the points that slide would make or lose for Order, and on Chaos’s turn a number marks each square where the chip would give Order points.</li>' +
      '<li>Point at a number, or press and hold it, to light each palindrome it counts with its own points.</li></ul>' +
      '<h3>Scoring</h3><ul><li>When Chaos puts the last chip on the board, Order scores every <b>palindrome</b> in every row and every column: two or more chips side by side that read the same in both directions.</li>' +
      '<li>A palindrome scores one point for each chip in it. Red, blue, red scores 3. Red, red scores 2.</li>' +
      '<li>Palindromes inside palindromes count too, and so do ones that overlap. Red, blue, blue, red scores 4 for itself and 2 for the two blues, 6 in all.</li>' +
      '<li>Three chips of one color in a row score 7: 3 for the whole run and 2 for each pair of two inside it. Four of one color score 4, 3 and 3, and 2 for each of the three pairs, 16 in all.</li>' +
      '<li>The gold outlines on the board show the palindromes standing now, and Order’s plate shows the points they make. When the board is counted, point at a line’s number to see where its points come from.</li></ul>' +
      '<h3>Two games</h3><ul><li>After the first game, the players change roles and play again on an empty board. The player with more points as Order wins the match. Equal points are a draw.</li>' +
      '<li>The 7 by 7 board has 49 chips, seven of each of seven colors. The 5 by 5 board, the game’s first version, has 25 chips, five of each of five colors.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b> opens a table, and the other player joins on their own device. Take your turn whenever you like: the home screen shows when it’s your move. Every draw comes from the table’s bag, so both devices see the same chip.</li></ul>' +
      '<h3>Tips</h3><ul><li>As Chaos, put a chip where its color matches nothing near it in its row and column.</li>' +
      '<li>As Order, build the middle of a pattern first. A palindrome can grow outward from both ends.</li></ul>' +
      '<p class="src">Entropy was first published in 1977. Its later editions were called Hyle, and the 7 by 7 game Hyle7.</p>' +
      '<p class="credit">' + CREDIT + '</p>';
  }

  Kit.init({
    id: KEY, mark: false, snap: '.frame', snapY: 0.5, snapFit: '.ch',   // (Keep playing's picture: round the chips)
   
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } stopAll(); clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Entropy: past games' }); } }]),
    rules: rulesHtml()
  });

  function showSetup() {
    S = null; VIEW = null; SEL = HOV = -1;
    app.classList.remove('ipl', 'en-land', 'en-low', 'en-tall', 'en-port', 'en-short', 'en-desk', 'en-two');
    Kit.setup(app, {
      modes: Kit.modes([{ id: 'cpu', desc: 'Easy, Normal or Hard' }, { id: '2p', kind: 'local' }]),
      options: [
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: [['easy', 'Easy', 'Often makes a weaker move, and looks only at the patterns standing now.'], ['normal', 'Normal', 'Weighs every pattern each move could lead to.'], ['hard', 'Hard', 'Looks at your answer too: as Order, every chip the bag could give next.']], when: function (m) { return m === 'cpu'; } },
        { id: 'size', label: 'Board', value: '7', choices: [['7', '7 by 7\n49 chips', 'Seven colors, seven chips of each: Hyle7, the larger game.'], ['5', '5 by 5\n25 chips', 'Five colors, five chips of each: the first Entropy, a shorter game.']] },
        { id: 'role', label: 'You start as', value: 'order', choices: [['order', 'Order', 'In the first game you slide chips to make patterns, and the computer is Chaos. Then you change roles.'], ['chaos', 'Chaos', 'In the first game you place the chips to spoil patterns, and the computer is Order. Then you change roles.']], when: function (m) { return m === 'cpu'; } },
        { id: 'role2', label: 'Order in the first game', value: 'p1', choices: [['p1', 'First player', 'The first player on the Players card is Order in the first game, then Chaos.'], ['p2', 'Second player', 'The second player on the Players card is Order in the first game, then Chaos.']], when: function (m) { return m === '2p'; } },
        { id: 'hints', label: 'Hints', value: 'on', choices: [['on', 'On', 'Each square shows the points a move there would make or lose for Order, and pointing at a number shows the palindromes it counts.'], ['off', 'Off', 'The board shows only where a chip can slide. The palindromes standing, Order’s score and the count at the end still show.']] },
        { id: 'cover', local: true, label: 'Hand over between turns', value: 'off', choices: [['off', 'Off', 'Nothing in Entropy is hidden, so the device just goes across the table.'], ['on', 'On', 'A cover names whose turn it is before each move.']], when: function (m) { return m === '2p'; } }
      ],
      players: { min: 2, max: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },
      onStart: function (cfg) {
        var cpu = cfg.mode === 'cpu', o = cfg.options;
        var first = cpu ? (o.role === 'chaos' ? 1 : 0) : (o.role2 === 'p2' ? 1 : 0);
        // vs the computer, seat 0 is the person
        var pls = cfg.players.map(function (p) { return { name: p.name, cpu: !!p.cpu }; });
        if (cpu && pls[0].cpu && !pls[1].cpu) pls.reverse();
        newGame({ mode: cfg.mode, level: o.level || 'normal', sz: o.size === '5' ? 5 : 7, first: first, cover: o.cover === 'on' && !cpu, hints: o.hints !== 'off', players: pls });
      }
    });
    var hero = app.querySelector('.setup-hero');
    if (hero && !app.querySelector('.en-credit')) hero.parentNode.insertBefore(el('p', { class: 'en-credit', text: CREDIT }), hero.nextSibling);
    // (only where the line doesn't make the setup scroll)
    requestAnimationFrame(function () { var c = app.querySelector('.en-credit'); if (c && document.documentElement.scrollHeight > window.innerHeight + 1) c.style.display = 'none'; });
  }
  function freshFields(st) { st.hist = []; st.started = Date.now(); st.ev = []; st.best = [0, 0]; st.big = [0, 0]; }
  function newGame(o, again) {
    stopAll();
    var keep = o || { mode: S.mode, level: S.level, sz: S.sz, first: S.ord[0], cover: S.cover, hints: S.hints !== false, players: S.players };
    // a rematch: the other player is Order first this time
    var first = again ? 1 - keep.first : keep.first;
    S = C.newMatch({ sz: keep.sz, first: first });
    S.mode = keep.mode; S.level = keep.level; S.cover = keep.cover; S.hints = keep.hints !== false; S.players = keep.players;
    freshFields(S); VIEW = null; SEL = HOV = -1;
    Kit.gameStart(); save(); render();
    Kit.sfx('deal');
    drawShow(function () { afterTurn(); });
  }
  var TIMERS = [];
  function later(fn, ms) { var t = setTimeout(function () { TIMERS.splice(TIMERS.indexOf(t), 1); fn(); }, ms); TIMERS.push(t); return t; }
  function stopAll() { TIMERS.forEach(clearTimeout); TIMERS = []; BUSY = 0; VIEW = null; DRAG = null; PEEK = LINEPK = -1; }

  // ── Moves ────────────────────────────────────────────────────────────────
  function snap(byCpu) { var c = JSON.parse(JSON.stringify(S)); delete c.hist; return { s: c, cpu: !!byCpu }; }
  // what a move did, for the moments and the room: the palindromes it made that weren't there before
  function runsKey(b) { var o = {}; C.score(b, S.sz).runs.forEach(function (r) { o[r.join(',')] = r; }); return o; }
  function newRuns(b0, b1) { var a = runsKey(b0), b = runsKey(b1), out = []; Object.keys(b).forEach(function (k) { if (!a[k]) out.push(b[k]); }); return out; }
  function play(mv, byCpu) {
    if (!S || S.over || BUSY) return false;
    var b0 = S.b.slice(), h0 = snap(byCpu), trayR = trayRect();
    var res = C.play(S, mv);
    if (!res) return false;
    if (res.end) S.hist = []; else { S.hist.push(h0); if (S.hist.length > 200) S.hist.shift(); }
    note(S, res, b0);
    SEL = HOV = PEEK = -1;
    save();
    show(res, b0, trayR);
    return true;
  }
  function note(st, res, b0) {
    if (res.t === 'place') return;
    var seat = res.seat, nr = res.t === 'slide' ? newRuns(b0, boardBeforeDraw(st, res)) : [];
    st.ev.push(res.t === 'pass' ? 'p' : (res.gain0 = gainOf(b0, res)) > 0 ? '+' + res.gain0 : String(res.gain0));
    if (st.ev.length > 120) st.ev.shift();
    nr.forEach(function (r) { if (r[2] > st.best[seat]) st.best[seat] = r[2]; });
    if (res.gain0 > st.big[seat]) st.big[seat] = res.gain0;
    res.nr = nr;
  }
  // the board just after Order's slide, before the next chip lands (the auto-placed last chip comes after it)
  function boardBeforeDraw(st, res) {
    if (res.end) { var b = res.end.b.slice(); if (res.auto) b[res.auto.i] = 0; return b; }
    var c = st.b.slice(); if (res.auto) c[res.auto.i] = 0; return c;
  }
  function gainOf(b0, res) { if (res.t !== 'slide') return 0; var b = b0.slice(); b[res.to] = b[res.f]; b[res.f] = 0; return C.total(b, S.sz) - C.total(b0, S.sz); }

  // Play a move out on the table: the chip flies from the tray (a placement) or slides along its line, the palindromes
  // it makes light and count up, then the next chip is drawn from the bag (or the game is counted)
  function show(res, b0, trayR, net) {
    BUSY++;
    var endB = res.end ? res.end.b : null;
    if (res.t === 'place') {
      VIEW = endB ? { b: endB } : null;
      paintAll();
      flyIn(res.i, trayR);
      Kit.sfx('chip'); Kit.haptic('light');
      var nrP = newRuns(b0, (endB || S.b));
      if (nrP.length) later(function () { flashRuns(nrP); floatGain(res.i, res.gain); }, 260);
      later(function () { BUSY--; if (res.end) return endGame(res, net); if (net) netAfter(); else afterTurn(); }, 420);
      return;
    }
    // Order: the slide (or a pass), then the draw
    var mid = boardBeforeDraw(S, res);
    VIEW = { b: mid, chip: 0 };
    paintAll();
    if (res.t === 'slide') {
      slideAnim(res.f, res.to);
      Kit.sfx('slide'); later(function () { Kit.sfx('chip', 0.6); Kit.haptic('light'); }, 260);
      later(function () { reward(res); }, 300);
    } else { Kit.sfx('tap'); Kit.callout(isMe(res.seat) ? 'You pass' : S.players[res.seat].name + ' passes'); }
    var T = res.t === 'slide' ? 700 + (res.nr && res.nr.some(function (r) { return r[2] >= 5; }) ? 900 : 0) : 650;
    later(function () {
      VIEW = res.end ? { b: mid, chip: res.auto ? res.auto.c : 0 } : null;
      paintAll();
      drawAnim(res.auto ? res.auto.c : S.chip);
      if (res.auto) {
        later(function () {
          var tr = trayRect();
          VIEW = { b: res.end.b };
          paintAll(); flyIn(res.auto.i, tr); Kit.sfx('chip'); Kit.haptic('light');
          later(function () { BUSY--; endGame(res, net); }, 600);
        }, 800);
      } else later(function () { BUSY--; if (!net) afterTurn(); else netAfter(); }, 520);
    }, T);
  }
  // A good slide's reward where it happens: the new palindromes light, the points rise from the chip; a run of five or
  // more and a big slide are moments
  function reward(res) {
    var g = res.gain0 || 0, who = res.seat;
    if (res.nr && res.nr.length) flashRuns(res.nr);
    if (g) floatGain(res.to, g);
    if (g > 0) { Kit.sfx(g >= 4 ? 'good' : 'tick', g >= 4 ? 0.8 : 0.6); if (isMe(who) || !vsCpu()) Kit.haptic(g >= 4 ? 'medium' : 'light'); }
    else if (g < 0) Kit.sfx('bad', 0.4);
    var long = (res.nr || []).reduce(function (m, r) { return r[2] > m[2] ? r : m; }, [0, 0, 0]);
    var frame = document.querySelector('.frame');
    if (long[2] >= 5) later(function () {
      Kit.sfx('sparkle'); Kit.haptic('success');
      var cols = lineColors(boardBeforeDraw(S, res), long);
      Kit.moment({ title: 'A run of ' + num(long[2]), line: cap1(C.lineName(long[0], S.sz)) + ' reads ' + cols.join(', ') + ', the same both ways.', pts: '+' + g, color: CHEX[cols.c], at: frame, ms: 2200 });
    }, 380);
    else if (g >= 8) later(function () {
      Kit.sfx('sparkle'); Kit.haptic('success');
      Kit.moment({ title: 'A big slide', line: (isMe(who) ? 'Your' : Kit.poss(S.players[who].name)) + ' slide of the ' + CNAME[res.c] + ' chip from ' + C.name(res.f, S.sz) + ' to ' + C.name(res.to, S.sz) + ' made ' + g + ' points of palindromes.', pts: '+' + g, color: CHEX[res.c], at: frame, ms: 2000 });
    }, 380);
  }
  function lineColors(b, run) {
    var ln = C.lines(S.sz)[run[0]], out = [];
    for (var k = run[1]; k < run[1] + run[2]; k++) out.push(CNAME[b[ln[k]]]);
    out.c = b[ln[run[1]]];
    return out;
  }
  // After each turn: the hand-over cover between people, or the computer's move
  function afterTurn() {
    if (!S || S.over || NET || BUSY) return;
    paintStatus(); paintActs();
    var seat = C.seatToMove(S);
    if (S.players[seat].cpu) return maybeCpu();
    if (S.cover && !vsCpu() && !(Kit.inDemo && Kit.inDemo())) {
      HOLD = true; paintStatus(); paintActs();
      var role = S.ph === 'place' ? 'Chaos' : 'Order';
      Kit.handoff({ name: S.players[seat].name, msg: 'You are ' + role + '. ' + (S.ph === 'place' ? 'Put the ' + CNAME[S.chip] + ' chip on an empty square.' : 'Slide a chip, or pass.'), hint: 'Hold for a moment to take your turn', hold: 700 }).then(function () { HOLD = false; paintStatus(); paintActs(); paintBoard(); });
    }
  }
  function maybeCpu() {
    if (NET || !S || S.over || BUSY) return;
    var seat = C.seatToMove(S); if (!S.players[seat].cpu) return;
    BUSY++; paintStatus(); paintActs();
    var myN = S.n, myG = S.g, t0 = Date.now();
    later(function () {
      var r = C.search(S, { level: S.level, seed: Math.floor(Math.random() * 1e9) });
      later(function () {
        BUSY--;
        if (!S || S.n !== myN || S.g !== myG) return;
        play(r.move, true);
      }, Math.max(0, (S.ph === 'place' ? 650 : 800) - (Date.now() - t0)));
    }, 60);
  }

  // ── The end of a game: every palindrome counted, line by line ────────────
  function endGame(res, net) {
    var g = res.end.g, b = res.end.b, o = S.gm[g].o;
    BUSY++;
    VIEW = { b: b, count: true };
    SEL = HOV = -1;
    paintAll();
    countLines(b, o, function () {
      var frame = document.querySelector('.frame'), sc = res.end.sc;
      var bestPrev = bestBefore();
      if (g === 0) {
        Kit.sfx('good'); Kit.haptic('medium');
        Kit.moment({ big: true, title: 'Change roles', line: (isMe(o) ? 'You' : S.players[o].name) + ' scored ' + sc + ' points as Order. Now ' + nmIn(1 - o) + (isMe(1 - o) ? ' play' : ' plays') + ' Order, and ' + nmIn(o) + (isMe(o) ? ' play' : ' plays') + ' Chaos.', pts: String(sc), icon: 'swap', ms: 3000 });
        if (bestPrev != null && sc > bestPrev) later(function () { Kit.callout('A new best as Order'); }, 3100);
        later(function () {
          sweepBack(function () {
            VIEW = null; BUSY--; paintAll();
            drawShow(function () { if (net) netAfter(); else afterTurn(); });
          });
        }, 3300);
      } else {
        if (net) { BUSY--; return netEnd(); }
        BUSY--; finish(bestPrev);
      }

  }

  });
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<style>
/* ── Play view: fills the screen, no page scroll ────────────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 50% at 50% 0%, rgba(61,220,132,.13) 0%, rgba(61,220,132,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 8px calc(var(--safe-b) + 10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.ar-hud{flex:none;display:flex;gap:6px;width:100%;}
.ar-plate{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 8px;border-radius:14px;
  background:linear-gradient(180deg,#1c2a22 0%,#0f1813 100%);
  box-shadow:inset 0 0 0 1.5px rgba(140,230,170,.3),inset 0 0 0 3.5px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.4);}
.ar-plate small{font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(190,240,205,.65);white-space:nowrap;}
.ar-plate b{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;}
.ar-plate.sc{flex:1.5;}
.ar-plate.sc b{color:#ffd45a;text-shadow:0 0 14px rgba(255,190,40,.4),0 2px 0 rgba(0,0,0,.5);}
.ar-plate.bump b{animation:bounce .45s var(--spring);}
.ar-wrap{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:none;}
.ar-cab{position:relative;padding:7px;border-radius:20px;}
.ar-cab canvas{display:block;border-radius:13px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.ar-ov{position:absolute;inset:7px;border-radius:13px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(6,14,9,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(250px,84%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
/* D-pad: left | up/down | right, compact for the thumb zone */
.ar-pad{flex:none;display:grid;width:100%;max-width:330px;grid-template-columns:1fr 1.15fr 1fr;grid-template-rows:54px 54px;gap:7px;}
.ar-key{border:0;border-radius:18px;display:flex;align-items:center;justify-content:center;
  color:#eafff0;background:linear-gradient(180deg,#2f4a3a 0%,#1b2d22 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.18),inset 0 0 0 1.5px rgba(140,230,170,.25),0 4px 0 #0a140e,0 8px 14px rgba(0,0,0,.4);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .06s,box-shadow .06s;}
.ar-key .ico{width:26px;height:26px;stroke-width:3;}
.ar-key.on{transform:translateY(3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.18),inset 0 0 0 1.5px rgba(140,230,170,.5),0 1px 0 #0a140e;}
.ar-key.l{grid-row:1/3;grid-column:1;} .ar-key.r{grid-row:1/3;grid-column:3;}
.ar-key.u{grid-row:1;grid-column:2;} .ar-key.d{grid-row:2;grid-column:2;}
.ar-hint{flex:none;font-size:.8rem;color:var(--text-3);text-align:center;font-weight:700;}
@media (hover:hover) and (pointer:fine){ .ar-touch{display:none!important;} }
@media (hover:none),(pointer:coarse){ .ar-desk{display:none!important;} }
@media (max-height:700px){ .ar-pad{grid-template-rows:44px 44px;} .ar-plate b{font-size:1.2rem;} }
/* Tablet landscape: the d-pad sits in the lower-left corner, under the left thumb; the board gets the full height */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px) and (pointer:coarse){
  html.ar-on #app{position:relative;}
  .ar-pad{position:absolute;left:22px;bottom:calc(var(--safe-b) + 18px);width:270px;max-width:none;grid-template-rows:72px 72px;gap:9px;}
  .ar-key{border-radius:22px;}
  .ar-key .ico{width:32px;height:32px;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), root = document.documentElement;
  var KEY = 'snake', SAVE = 'snake_state';
  var COLS = 16, ROWS = 20;
  var SPEEDS = { relaxed: { ms: 170, pts: 5, name: 'Relaxed' }, normal: { ms: 125, pts: 10, name: 'Normal' }, fast: { ms: 90, pts: 15, name: 'Fast' }, turbo: { ms: 65, pts: 20, name: 'Turbo' } };
  var DIRS = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] }, OPP = { u: 'd', d: 'u', l: 'r', r: 'l' };
  var TOUCH = window.matchMedia && matchMedia('(pointer:coarse)').matches;

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function soundOn() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }

  // ═══ Sound ═══════════════════════════════════════════════════════════════
  var AC = null, master = null, noiseBuf = null;
  function ac() {
    if (!soundOn()) return null;
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
      master = AC.createGain(); master.gain.value = 0.8;
      var comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function osc(type, f, t0, dur, vol, o) {
    var a = ac(); if (!a) return; o = o || {};
    var t = a.currentTime + t0, n = a.createOscillator(), g = a.createGain(), out = n;
    n.type = type; n.frequency.setValueAtTime(f, t);
    if (o.to) n.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (o.lp) { var f2 = a.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; n.connect(f2); out = f2; }
    out.connect(g); g.connect(master); n.start(t); n.stop(t + dur + 0.05);
  }
  function noise(t0, dur, vol, type, freq) {
    var a = ac(); if (!a) return;
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;
    s.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq || 1000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function sTurn() { osc('triangle', 330, 0, 0.04, 0.03); }
  function sEat(n) { var m = 72 + (n % 8); osc('square', mtof(m), 0, 0.07, 0.05, { lp: 2500 }); osc('triangle', mtof(m + 7), 0.05, 0.1, 0.07); noise(0, 0.06, 0.08, 'bandpass', 2600); }
  function sGold() { [76, 80, 83, 88, 92].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.05, 0.18, 0.07); }); noise(0, 0.25, 0.02, 'bandpass', 3000); }
  function sGoldAppear() { osc('sine', mtof(88), 0, 0.15, 0.05); osc('sine', mtof(95), 0.08, 0.2, 0.05); }
  function sCrash() { noise(0, 0.35, 0.3, 'lowpass', 500); osc('sawtooth', 220, 0, 0.4, 0.08, { to: 55, lp: 900 }); }
  function sPopSeg(i) { osc('sine', 300 + (i % 12) * 30, 0, 0.05, 0.03, { to: 160 }); }
  function sOver() { [67, 63, 60, 55].forEach(function (m, i) { osc('triangle', mtof(m), 0.3 + i * 0.16, 0.3, 0.07); }); }
  function sStart() { osc('triangle', mtof(72), 0, 0.1, 0.06); osc('triangle', mtof(79), 0.08, 0.16, 0.07); }

  // ═══ State ═══════════════════════════════════════════════════════════════
  var G = null, view = 'none', paused = false;
  var fx = { parts: [], pops: [], shake: 0, flash: 0 };

  function cellFree(x, y, ignoreTail) {
    var n = G.body.length - (ignoreTail ? 1 : 0);
    for (var i = 0; i < n; i++) if (G.body[i].x === x && G.body[i].y === y) return false;
    return true;
  }
  function placeFood(kind) {
    var free = [];
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
      if (!cellFree(x, y)) continue;
      if (G.food && G.food.x === x && G.food.y === y) continue;
      if (G.gold && G.gold.x === x && G.gold.y === y) continue;
      free.push([x, y]);
    }
    if (!free.length) return null;
    var c = free[Math.floor(Math.random() * free.length)];
    return { x: c[0], y: c[1], t: 0, kind: kind || 'apple' };
  }

  function step() {
    G.prev = G.body.map(function (s) { return { x: s.x, y: s.y }; });
    // Next direction from the buffered turns
    while (G.queue.length) {
      var nd = G.queue.shift();
      if (nd !== G.dir && nd !== OPP[G.dir]) { G.dir = nd; sTurn(); break; }
    }
    var d = DIRS[G.dir], h = G.body[0], nx = h.x + d[0], ny = h.y + d[1], wrapped = false;
    if (G.wrap) {
      if (nx < 0) { nx = COLS - 1; wrapped = true; } else if (nx >= COLS) { nx = 0; wrapped = true; }
      if (ny < 0) { ny = ROWS - 1; wrapped = true; } else if (ny >= ROWS) { ny = 0; wrapped = true; }
    }
    if (wrapped) G.stats.wraps++;
    var growing = G.grow > 0;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { die('wall', nx, ny); return; }
    if (!cellFree(nx, ny, !growing)) { die('self', nx, ny); return; }
    G.body.unshift({ x: nx, y: ny });
    if (growing) G.grow--; else G.body.pop();
    G.bulges.forEach(function (b) { b.i++; }); G.bulges = G.bulges.filter(function (b) { return b.i < G.body.length; });
    G.steps++;
    if (G.food && nx === G.food.x && ny === G.food.y) eat(G.food, false);
    if (G.gold && nx === G.gold.x && ny === G.gold.y) eat(G.gold, true);
    if (G.gold) { G.gold.left--; if (G.gold.left <= 0) { burst(G.gold.x + 0.5, G.gold.y + 0.5, '#ffd45a', 8); G.gold = null; } }
    if (G.body.length >= COLS * ROWS) { G.full = true; die('full', nx, ny); }
  }
  function eat(f, gold) {
    var sp = SPEEDS[G.speed], pts = gold ? sp.pts * 5 : sp.pts;
    G.score += pts; G.grow += 1; G.apples++;
    if (gold) { G.golds++; G.gold = null; sGold(); Kit.haptic('success'); }
    else { G.food = placeFood('apple'); sEat(G.apples); Kit.haptic('light'); }
    G.bulges.push({ i: 0 });
    burst(f.x + 0.5, f.y + 0.5, gold ? '#ffd45a' : '#ff4d5e', gold ? 18 : 12);
    burst(f.x + 0.5, f.y + 0.5, '#fff6d8', gold ? 6 : 4);
    pop(f.x + 0.5, f.y, '+' + pts, gold ? '#ffd45a' : '#fff');
    G.maxLen = Math.max(G.maxLen, G.body.length + G.grow);
    if (!G.gold && !gold && G.apples % 6 === 0) { G.gold = placeFood('gold'); if (G.gold) { G.gold.left = 42; sGoldAppear(); } }
    var lenNow = G.body.length + G.grow;
    if (lenNow % 25 === 0) { banner('Length ' + lenNow + '!'); Kit.sfx('good'); }
    hudDirty = true; bumpScore = true;
    if (G.apples % 3 === 0) save();
  }
  function interval() { return SPEEDS[G.speed].ms * Math.max(0.72, 1 - G.apples * 0.005) / 1000; }

  function die(why, x, y) {
    G.phase = 'dying'; G.why = why; G.dieT = 0; G.popped = 0; G.crash = { x: x, y: y };
    G.prev = null;
    clearSave();
    fx.shake = 0.7; fx.flash = 1;
    if (why !== 'full') { sCrash(); Kit.haptic('error'); }
    else { Kit.sfx('win'); }
  }

  // ═══ Effects ═════════════════════════════════════════════════════════════
  function part(x, y, vx, vy, c, life, s) { if (fx.parts.length < 400) fx.parts.push({ x: x, y: y, vx: vx, vy: vy, c: c, life: life, max: life, s: s }); }
  function burst(x, y, c, n) { for (var i = 0; i < n; i++) { var a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 6; part(x, y, Math.cos(a) * v, Math.sin(a) * v, c, 0.4 + Math.random() * 0.4, 0.1 + Math.random() * 0.16); } }
  function pop(x, y, text, c) { fx.pops.push({ x: x, y: y, text: text, c: c, life: 0.8, max: 0.8 }); }
  function banner(text) { fx.banner = { text: text, life: 1.4, max: 1.4 }; }

  // ═══ Persistence ═════════════════════════════════════════════════════════
  function save() {
    if (!G || G.phase === 'dying' || G.phase === 'over') return;
    var s = { v: 1, body: G.body, dir: G.dir, grow: G.grow, food: G.food, gold: G.gold, score: G.score, apples: G.apples, golds: G.golds, maxLen: G.maxLen,
      speed: G.speed, wrap: G.wrap, pad: G.pad, who: G.who, started: G.started, playMs: G.playMs, stats: G.stats, steps: G.steps };
    try { localStorage.setItem(SAVE, JSON.stringify(s)); } catch (e) {}
    Kit.resume.set('Length ' + G.body.length + ' · ' + fmt(G.score) + ' points');
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function loadSave() { try { var s = JSON.parse(localStorage.getItem(SAVE)); return s && s.v === 1 && s.body && s.body.length ? s : null; } catch (e) { return null; } }

  // ═══ Kit shell ═══════════════════════════════════════════════════════════
  Kit.init({
    id: 'snake',
    theme: { wood: ['#7a5232', '#4a2f1a'] },
    onNew: function () { clearSave(); showSetup(); },
    menu: [
      { icon: 'trophy', label: 'High scores', onClick: function () { pauseGame(); ArcadeHi.show('snake', 'Snake'); } },
      { icon: 'history', label: 'Past games', onClick: function () { pauseGame(); Kit.history(KEY, { title: 'Snake: past games' }); } }
    ],
    rules:
      '<p class="goal">Guide the snake to the apples. Every apple makes it longer. Don\'t crash!</p>' +
      '<h3>Steering</h3><ul><li><b>Swipe</b> anywhere on the screen in the direction you want to go. You can keep your finger down and swipe again to turn again.</li>' +
      '<li>Or use the arrow pad under the board.</li><li>Keyboard: arrow keys or W A S D. Space or P pauses.</li>' +
      '<li>The snake can\'t turn straight back on itself.</li><li>The snake waits for your first swipe before it starts moving.</li></ul>' +
      '<h3>Apples</h3><ul><li><b>Red apple</b>: points and one more piece of tail.</li>' +
      '<li><b>Golden apple</b>: shows up now and then for a short time. Worth 5 times as much. Grab it before it disappears!</li></ul>' +
      '<h3>Crashing</h3><p>The game ends if the snake runs into its own tail, or into the wall when walls are on. With <b>Wrap around</b>, the snake goes out one side and comes back in the other.</p>' +
      '<h3>Speed</h3><p>Pick Relaxed, Normal, Fast or Turbo. Faster speeds score more for each apple: 5, 10, 15 or 20 points. The snake also speeds up a little as it grows.</p>'
  });

  // ═══ Setup ═══════════════════════════════════════════════════════════════
  function showSetup() {
    leaveGame();
    app.className = 'stage';
    var opts = [
      { id: 'speed', label: 'Speed', help: 'How fast the snake moves. Faster speeds score more for each apple.',
        choices: [['relaxed', 'Relaxed', 'Slow and steady. 5 points an apple.'], ['normal', 'Normal', 'The classic speed. 10 points an apple.'], ['fast', 'Fast', 'Quick! 15 points an apple.'], ['turbo', 'Turbo', 'Super fast. 20 points an apple.']], value: 'normal' },
      { id: 'walls', label: 'Walls', choices: [['solid', 'Solid walls', 'Bumping into the edge ends the game.'], ['wrap', 'Wrap around', 'Go off one edge and come back on the other side.']], value: 'solid' }
    ];
    if (TOUCH) opts.push({ id: 'pad', label: 'Controls', choices: [['pad', 'Swipe + pad', 'Swipe on the board, or press the arrow buttons under it.'], ['swipe', 'Swipe only', 'Hides the arrow buttons for a bigger board. Swipe to steer.']], value: 'pad' });
    Kit.setup(app, {
      intro: 'Eat the apples, grow your tail, don\'t crash',
      options: opts,
      players: { min: 1, max: 1, count: 1, label: 'Player' },
      start: 'Play',
      onStart: function (cfg) {
        var o = cfg.options || {};
        startGame({ who: cfg.players[0] ? cfg.players[0].name : 'Player', speed: o.speed || 'normal', wrap: o.walls === 'wrap', pad: o.pad !== 'swipe' });
      }
    });
    window.scrollTo(0, 0);
  }

  // ═══ Play view ═══════════════════════════════════════════════════════════
  var cv, g, wrapEl, cabEl, hudEl, padEl, ovEl, scoreEl, lenEl, bestEl, ro = null;
  var C = 20, DPR = 1, cssW = 0, hudDirty = true, bumpScore = false, bgCanvas = null;

  function plate(label, cls) { var b = el('b', { text: '0' }); var p = el('div', { class: 'ar-plate ' + (cls || '') }, [el('small', { text: label }), b]); p._b = b; return p; }
  function buildView() {
    app.className = 'stage'; app.innerHTML = '';
    root.classList.add('ar-on');
    lenEl = plate('Length'); scoreEl = plate('Score', 'sc'); bestEl = plate('Best');
    hudEl = el('div', { class: 'ar-hud' }, [lenEl, scoreEl, bestEl]);
    cv = el('canvas', { 'aria-label': 'Snake board' }); g = cv.getContext('2d');
    ovEl = el('div', { class: 'ar-ov' });
    cabEl = el('div', { class: 'ar-cab wood' }, [cv, ovEl]);
    wrapEl = el('div', { class: 'ar-wrap' }, [hudEl, cabEl]);
    function key(d, ic, lab) { var b = el('button', { type: 'button', class: 'ar-key ' + d, 'aria-label': lab, html: Kit.icon(ic) }); b.addEventListener('pointerdown', function (e) { e.preventDefault(); b.classList.add('on'); steer(d); }); ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { b.addEventListener(ev, function () { b.classList.remove('on'); }); }); b.addEventListener('contextmenu', function (e) { e.preventDefault(); }); return b; }
    var ku = key('u', 'down', 'Up'); ku.querySelector('svg').style.transform = 'rotate(180deg)';
    padEl = el('div', { class: 'ar-pad ar-touch' }, [key('l', 'back', 'Left'), ku, key('d', 'down', 'Down'), key('r', 'right', 'Right')]);
    if (!G.pad) padEl.style.display = 'none';
    app.appendChild(wrapEl); app.appendChild(padEl);
    app.appendChild(el('div', { class: 'ar-hint ar-desk', text: 'Arrow keys or W A S D to steer · Space pauses' }));
    bindGestures();
    if (ro) ro.disconnect();
    ro = new ResizeObserver(fit); ro.observe(app);
    cssW = 0; fit();
    view = 'game';
    if (!raf) { lastT = 0; raf = requestAnimationFrame(loop); }
  }
  function leaveGame() {
    view = 'none'; paused = false;
    root.classList.remove('ar-on');
    if (ro) { ro.disconnect(); ro = null; }
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  function fit() {
    if (!wrapEl) return;
    var aw = wrapEl.clientWidth - 14, ah = wrapEl.clientHeight - 14 - hudEl.offsetHeight - 8;
    var c = Math.min(aw / COLS, ah / ROWS, 44); c = Math.max(8, Math.floor(c * 2) / 2);
    var w = Math.round(c * COLS), h = Math.round(c * ROWS);
    if (w === cssW && cv.width) return;
    cssW = w; C = c;
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    hudEl.style.maxWidth = Math.min(wrapEl.clientWidth, w + 14) + 'px';
    bgCanvas = null;
    draw();
  }

  // ── Input
  function steer(d) {
    ac();
    if (view !== 'game' || !G || paused) return;
    if (G.phase === 'wait') {
      if (d === OPP[G.dir]) return;
      G.dir = d; G.queue = []; G.phase = 'play'; G.acc = 0; sStart();
      return;
    }
    if (G.phase !== 'play') return;
    var last = G.queue.length ? G.queue[G.queue.length - 1] : G.dir;
    if (d === last || d === OPP[last]) return;
    if (G.queue.length < 3) G.queue.push(d);
  }
  var gest = null;
  function bindGestures() {
    wrapEl.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.ar-ov')) return;
      e.preventDefault(); ac();
      try { wrapEl.setPointerCapture(e.pointerId); } catch (er) {}
      gest = { id: e.pointerId, ax: e.clientX, ay: e.clientY };
    });
    wrapEl.addEventListener('pointermove', function (e) {
      if (!gest || e.pointerId !== gest.id) return;
      e.preventDefault();

      g.fillStyle = '#4a7cf0'; g.strokeStyle = '#1f3e9e'; g.lineWidth = C * 0.06;
      g.beginPath(); g.arc(x * C, y * C, C * sz, 0, Math.PI * 2); g.fill(); g.stroke();
      g.fillStyle = 'rgba(170,205,255,.45)'; g.beginPath(); g.arc(x * C - C * 0.1, y * C - C * 0.14, C * 0.15, 0, Math.PI * 2); g.fill();
    });
    if (start > 0) return;
    // Head
    var h = pts[0], d = DIRS[G.dir], hx = h[0] * C, hy = h[1] * C;
    g.fillStyle = grey ? '#6b7088' : '#4f82f5'; g.strokeStyle = grey ? '#3a3f55' : '#1f3e9e'; g.lineWidth = C * 0.06;
    g.beginPath(); g.arc(hx, hy, C * 0.46, 0, Math.PI * 2); g.fill(); g.stroke();
    // tongue flick
    if (!dying && (G.t % 2.2) < 0.25) {
      var tl = C * (0.55 + 0.25 * Math.sin((G.t % 2.2) / 0.25 * Math.PI));
      g.strokeStyle = '#ff3b5c'; g.lineWidth = C * 0.07; g.lineCap = 'round';
      var tx = hx + d[0] * (C * 0.4 + tl), ty = hy + d[1] * (C * 0.4 + tl);
      g.beginPath(); g.moveTo(hx + d[0] * C * 0.4, hy + d[1] * C * 0.4); g.lineTo(tx, ty);
      g.moveTo(tx, ty); g.lineTo(tx + (d[0] * 0.15 + d[1] * 0.12) * C, ty + (d[1] * 0.15 + d[0] * 0.12) * C);
      g.moveTo(tx, ty); g.lineTo(tx + (d[0] * 0.15 - d[1] * 0.12) * C, ty + (d[1] * 0.15 - d[0] * 0.12) * C);
      g.stroke();
    }
    // eyes
    var px = -d[1], py = d[0], blink = !dying && (G.t % 3.7) < 0.12;
    [1, -1].forEach(function (sgn) {
      var ex = hx + d[0] * C * 0.12 + px * sgn * C * 0.22, ey = hy + d[1] * C * 0.12 + py * sgn * C * 0.22;
      g.fillStyle = '#fff'; g.beginPath();
      if (blink) g.ellipse(ex, ey, C * 0.14, C * 0.03, Math.atan2(py, px), 0, Math.PI * 2); else g.arc(ex, ey, C * 0.14, 0, Math.PI * 2);
      g.fill();
      if (!blink) {
        if (dying) { g.strokeStyle = '#111'; g.lineWidth = C * 0.05; g.beginPath(); g.moveTo(ex - C * 0.07, ey - C * 0.07); g.lineTo(ex + C * 0.07, ey + C * 0.07); g.moveTo(ex + C * 0.07, ey - C * 0.07); g.lineTo(ex - C * 0.07, ey + C * 0.07); g.stroke(); }
        else { g.fillStyle = '#111'; g.beginPath(); g.arc(ex + d[0] * C * 0.05, ey + d[1] * C * 0.05, C * 0.075, 0, Math.PI * 2); g.fill(); }
      }
    });
  }

  // ═══ Test hooks ══════════════════════════════════════════════════════════
  window.__snk = {
    get: function () { return G && { body: G.body, wrap: G.wrap, phase: G.phase, score: G.score, len: G.body.length, head: G.body[0], dir: G.dir, food: G.food, gold: G.gold, apples: G.apples, paused: paused, queue: G.queue.slice() }; },
    steer: steer,
    foodAhead: function () { var h = G.body[0], d = DIRS[G.dir]; G.food = { x: h.x + d[0] * 2, y: h.y + d[1] * 2, t: 0, kind: 'apple' }; },
    goldAhead: function () { var h = G.body[0], d = DIRS[G.dir]; G.gold = { x: h.x + d[0] * 2, y: h.y + d[1] * 2, t: 0, kind: 'gold', left: 40 }; },
    grow: function (n) { G.grow += n; G.maxLen = Math.max(G.maxLen, G.body.length + G.grow); }
  };

  // ═══ Boot ════════════════════════════════════════════════════════════════
  var saved = loadSave();
  if (saved) startGame({ who: saved.who, speed: saved.speed, wrap: saved.wrap, pad: saved.pad }, saved);
  else showSetup();
})();
</script>

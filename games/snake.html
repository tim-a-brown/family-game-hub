<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Snake</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<script src="../arcade-hi.js"></script>
<style>
/* ── Arcade shell: full-screen, no scroll, canvas scales to fit ── */
html,body{height:100%;}
body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(700px 420px at 50% -10%, rgba(34,197,94,.10), transparent 60%), var(--bg);}
.site-nav{flex:none;}
.site-nav .icon-btn{width:38px;height:38px;min-height:38px;padding:0;font-size:1rem;border-radius:50%;}
.arc{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:10px max(12px,var(--safe-r)) calc(12px + var(--safe-b)) max(12px,var(--safe-l));}
.hud{flex:none;display:flex;gap:8px;justify-content:center;width:100%;}
.pill{display:flex;align-items:baseline;gap:7px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);align-items:center;}
.pill span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.pill b{font-family:var(--display);font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);}
.pill.accent b{color:#4ade80;}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;}
.board{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px rgba(74,222,128,.18),0 20px 50px rgba(0,0,0,.55);}
.board canvas{display:block;}
/* Overlays (start / pause / game over) */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(6,10,8,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:gn-fade .2s ease both;z-index:5;}
.ov.hidden{display:none;}
.ov-card{text-align:center;width:100%;max-width:280px;animation:gn-pop .3s var(--spring) both;}
.ov-emoji{font-size:2.6rem;line-height:1;margin-bottom:6px;}
.ov-title{font-family:var(--display);font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;}
.ov-sub{color:var(--text-2);font-size:.92rem;margin-top:6px;}
.ov-stats{display:flex;gap:8px;justify-content:center;margin:16px 0 18px;}
.ov-stat{flex:1;max-width:110px;padding:8px 6px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);}
.ov-stat b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;}
.ov-stat span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.ov .btn{min-width:180px;margin-top:14px;}
.ov-new{display:inline-block;margin-top:8px;}
.hint{flex:none;font-size:.82rem;color:var(--text-3);text-align:center;}
/* D-pad docked at the bottom (thumb zone) */
.dpad{flex:none;display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,58px);gap:6px;}
.dp-btn{display:flex;align-items:center;justify-content:center;border-radius:18px;background:var(--surface-2);border:1px solid var(--line-2);
  color:var(--text);cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;transition:transform .08s,background .12s;}
.dp-btn svg{width:26px;height:26px;}
.dp-btn.on,.dp-btn:active{background:rgba(74,222,128,.22);border-color:rgba(74,222,128,.5);transform:scale(.94);}
.dp-center{background:transparent;border-color:var(--line);color:var(--text-2);}
.dp-center svg{width:20px;height:20px;}
@media (hover:hover) and (pointer:fine){ .touch-only{display:none !important;} }
@media (hover:none),(pointer:coarse){ .desk-only{display:none !important;} }
@media (max-height:700px){ .dpad{grid-template-rows:repeat(3,50px);grid-template-columns:repeat(3,58px);} }
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Snake</span>
  <button class="icon-btn" id="btn-pause" aria-label="Pause"></button>
  <button class="icon-btn" onclick="ArcadeHi.show('snake','Snake')" aria-label="High scores">🏆</button>
</nav>
<main class="arc">
  <div class="hud">
    <div class="pill accent"><span>Score</span><b id="sn-score">0</b></div>
    <div class="pill"><span>Best</span><b id="sn-best">0</b></div>
    <div class="pill"><span>Lvl</span><b id="sn-level">1</b></div>
  </div>
  <div class="stage" id="stage">
    <div class="board" id="board">
      <canvas id="cv"></canvas>
      <div class="ov" id="ov">
        <div class="ov-card" id="ov-card"></div>
      </div>
    </div>
  </div>
  <div class="hint desk-only" id="sn-status">Arrow keys to steer · Space to pause</div>
  <div class="dpad touch-only" aria-label="Direction pad">
    <div></div>
    <button class="dp-btn" id="dp-up" aria-label="Up"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 6 4 17h16z"/></svg></button>
    <div></div>
    <button class="dp-btn" id="dp-left" aria-label="Left"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 12 17 4v16z"/></svg></button>
    <button class="dp-btn dp-center" id="dp-pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="dp-btn" id="dp-right" aria-label="Right"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 12 7 4v16z"/></svg></button>
    <div></div>
    <button class="dp-btn" id="dp-down" aria-label="Down"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 18 4 7h16z"/></svg></button>
    <div></div>
  </div>
</main>
<script>
'use strict';
const COLS=20,ROWS=20,CELL=18;
const W=COLS*CELL,H=ROWS*CELL;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const stage=document.getElementById('stage'),board=document.getElementById('board');
const $=id=>document.getElementById(id);
const haptic=k=>{try{window.GN&&GN.haptic(k);}catch(e){}};

let snake,dir,nextDir,food,score=0,best=parseInt(localStorage.getItem('snakeBest')||'0'),running=false,paused=false,gameLoopId;
let level=1,speed=150;

// ── Canvas fit (keeps aspect, crisp on retina) ──
function fit(){
  const r=stage.getBoundingClientRect();
  const s=Math.max(0.1,Math.min(r.width/W,r.height/H));
  const w=Math.floor(W*s),h=Math.floor(H*s);
  const d=Math.min(window.devicePixelRatio||1,3);
  board.style.width=w+'px';board.style.height=h+'px';
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*d);cv.height=Math.round(h*d);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  render();
}

function rnd(max){return Math.floor(Math.random()*max);}
function newFood(){
  let f;
  do{f={x:rnd(COLS),y:rnd(ROWS)};}while(snake.some(s=>s.x===f.x&&s.y===f.y));
  food=f;
}
function newGame(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;level=1;speed=150;
  newFood();render();
  $('sn-score').textContent=0;
  $('sn-level').textContent=1;
}
function start(){
  newGame();running=true;paused=false;
  clearInterval(gameLoopId);gameLoopId=setInterval(step,speed);
  hideOverlay();setPauseIcon();
}
function setPaused(p){
  if(!running)return;
  paused=p;
  if(paused)showOverlay('pause');else hideOverlay();
  setPauseIcon();
}
const ICON_PAUSE='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_PLAY='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
function setPauseIcon(){$('btn-pause').innerHTML=(running&&paused)?ICON_PLAY:ICON_PAUSE;}
function step(){
  if(!running||paused)return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    running=false;clearInterval(gameLoopId);
    haptic('error');
    if(score>best){best=score;localStorage.setItem('snakeBest',best);$('sn-best').textContent=best;}
    render();
    showOverlay('over');
    ArcadeHi.check('snake',score,()=>{});
    return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=level*10;
    haptic('light');
    $('sn-score').textContent=score;
    if(score>best){best=score;localStorage.setItem('snakeBest',best);$('sn-best').textContent=best;}
    const prevLevel=level;
    level=Math.floor(score/100)+1;
    if(level>prevLevel)haptic('success');
    const newSpeed=Math.max(60,150-level*10);
    if(newSpeed!==speed){speed=newSpeed;clearInterval(gameLoopId);gameLoopId=setInterval(step,speed);}
    $('sn-level').textContent=level;
    newFood();
  } else {snake.pop();}
  render();
}
function render(){
  ctx.fillStyle='#07110b';ctx.fillRect(0,0,W,H);
  // Checkerboard
  ctx.fillStyle='rgba(74,222,128,.035)';
  for(let y=0;y<ROWS;y++)for(let x=(y&1);x<COLS;x+=2)ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  if(!snake)return;
  // Food
  if(food){
    ctx.fillStyle='#f87171';
    ctx.shadowColor='#f87171';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath();ctx.arc(food.x*CELL+CELL/2-2.5,food.y*CELL+CELL/2-2.5,2,0,Math.PI*2);ctx.fill();
  }
  // Snake
  snake.forEach((s,i)=>{
    const pct=1-i/snake.length;
    ctx.fillStyle=`rgba(34,${155+Math.round(pct*100)},94,${0.7+pct*0.3})`;
    if(i===0){ctx.shadowColor='#22c55e';ctx.shadowBlur=8;}
    ctx.beginPath();ctx.roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,i===0?6:4);ctx.fill();
    ctx.shadowBlur=0;
  });
  // Eyes
  const h=snake[0],d=dir||{x:1,y:0};
  const cx=h.x*CELL+CELL/2,cy=h.y*CELL+CELL/2;
  const ex=d.y!==0?4:0,ey=d.x!==0?4:0;
  ctx.fillStyle='#062010';
  [[1],[-1]].forEach(([k])=>{ctx.beginPath();ctx.arc(cx+d.x*3+ex*k,cy+d.y*3+ey*k,1.8,0,Math.PI*2);ctx.fill();});
}

// ── Overlays ──
function showOverlay(kind){
  const card=$('ov-card');
  if(kind==='start'){
    card.innerHTML=`<div class="ov-emoji">🐍</div><div class="ov-title">Snake</div>
      <div class="ov-sub">${matchMedia('(pointer:coarse)').matches?'Swipe on the board or use the pad to steer.':'Use the arrow keys to steer. Space pauses.'}</div>
      <button class="btn btn-gold" id="ov-go">Play</button>`;
  }else if(kind==='pause'){
    card.innerHTML=`<div class="ov-title">Paused</div><div class="ov-sub">Score ${score}</div>
      <button class="btn btn-gold" id="ov-go">Resume</button>
      <div><button class="btn btn-ghost ov-new" id="ov-restart">Restart</button></div>`;
  }else{
    const isBest=score>0&&score>=best;
    card.innerHTML=`<div class="ov-title">Game over</div>
      <div class="ov-sub">${isBest?'🎉 New personal best!':'Level '+level}</div>
      <div class="ov-stats"><div class="ov-stat"><b>${score}</b><span>Score</span></div><div class="ov-stat"><b>${best}</b><span>Best</span></div></div>
      <button class="btn btn-gold" id="ov-go" style="margin-top:0">Play again</button>`;
  }
  $('ov').classList.remove('hidden');
  $('ov-go').onclick=()=>{ if(kind==='pause')setPaused(false); else start(); };
  const rs=$('ov-restart'); if(rs)rs.onclick=start;
}
function hideOverlay(){$('ov').classList.add('hidden');}

function setDir(dx,dy){
  if(!dir){nextDir={x:dx,y:dy};return;}
  if(dx===0&&dir.x===0)return;if(dy===0&&dir.y===0)return;nextDir={x:dx,y:dy};
}
function steer(dx,dy){
  if(!running){start();}
  else if(paused)setPaused(false);
  setDir(dx,dy);
}
document.addEventListener('keydown',e=>{
  if(document.querySelector('.ahi-overlay'))return;
  const k=e.key;
  if(k==='ArrowLeft')steer(-1,0);
  else if(k==='ArrowRight')steer(1,0);
  else if(k==='ArrowUp')steer(0,-1);
  else if(k==='ArrowDown')steer(0,1);
  else if(k===' '){ if(running)setPaused(!paused); }
  else if(k==='Enter'&&!running)start();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
});
// D-pad: react on pointerdown for zero latency
[['dp-up',0,-1],['dp-down',0,1],['dp-left',-1,0],['dp-right',1,0]].forEach(([id,dx,dy])=>{
  const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');haptic('select');steer(dx,dy);});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('on')));
});
$('dp-pause').addEventListener('click',()=>{ if(running)setPaused(!paused); });
$('btn-pause').addEventListener('click',()=>{ if(running)setPaused(!paused); });
// Swipe anywhere on the play area (direction changes as soon as the finger moves)
let tx=0,ty=0,swiping=false;
stage.addEventListener('touchstart',e=>{if(e.target.closest('.ov'))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;swiping=true;},{passive:true});
stage.addEventListener('touchmove',e=>{
  if(!swiping)return;
  e.preventDefault();
  const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  if(!running){swiping=false;return;}
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;
},{passive:false});
stage.addEventListener('touchend',()=>{swiping=false;},{passive:true});
// Auto-pause when the app is backgrounded
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&running&&!paused)setPaused(true); });
window.addEventListener('blur',()=>{ if(running&&!paused)setPaused(true); });

$('sn-best').textContent=best;
setPauseIcon();
new ResizeObserver(fit).observe(stage);
fit();
showOverlay('start');
</script>
</body>
</html>

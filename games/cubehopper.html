<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q*bert</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>

<style>
/* ── Play view: fills the screen, no page scroll ────────────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 50% at 50% 0%, rgba(255,138,31,.13) 0%, rgba(255,138,31,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 8px calc(var(--safe-b) + 10px);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;}
.ar-hud{flex:none;display:flex;gap:6px;width:100%;max-width:520px;}
.ar-plate{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 8px;border-radius:14px;
  background:linear-gradient(180deg,#2a2036 0%,#150f1d 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,180,110,.3),inset 0 0 0 3.5px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.4);}
.ar-plate small{font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,215,180,.65);white-space:nowrap;}
.ar-plate b{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;}
.ar-plate.sc{flex:1.5;}
.ar-plate.sc b{color:#ffb347;text-shadow:0 0 14px rgba(255,140,40,.45),0 2px 0 rgba(0,0,0,.5);}
.ar-plate.bump b{animation:bounce .45s var(--spring);}
.ar-lives{display:flex;gap:3px;height:1.52rem;align-items:center;}
.ar-lives svg{width:20px;height:20px;display:block;}
.ar-lives em{font-style:normal;font-family:var(--display);font-size:1.1rem;color:#fff;}
.ar-pbtn{flex:none;width:48px;border:0;border-radius:14px;display:grid;place-items:center;color:#ffd9b0;
  background:linear-gradient(180deg,#2a2036 0%,#150f1d 100%);box-shadow:inset 0 0 0 1.5px rgba(255,180,110,.3),0 6px 16px rgba(0,0,0,.4);}
.ar-pbtn:active{transform:scale(.94);}
.ar-pbtn svg{width:22px;height:22px;}
.ar-wrap{flex:none;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;}
.ar-cab{position:relative;padding:7px;border-radius:20px;}
.ar-cab canvas{display:block;border-radius:13px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.ar-ov{position:absolute;inset:7px;border-radius:13px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(10,6,18,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(260px,86%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;color:#ffb347;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
.ar-hint{flex:none;font-size:.82rem;color:var(--text-3);text-align:center;font-weight:800;letter-spacing:.02em;}
/* Diagonal joystick: four big buttons set at the corners, like the
   arcade stick that was mounted at 45 degrees. */
.qb-padwrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
.qb-pad{position:relative;width:var(--pd,206px);height:var(--pd,206px);touch-action:none;-webkit-user-select:none;user-select:none;}
.qb-pad::before{content:"";position:absolute;inset:14%;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,#2c2340 0%,#1a1428 62%,#100b1a 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -6px 14px rgba(0,0,0,.5),0 0 0 5px rgba(0,0,0,.25);}
.qb-pad i{position:absolute;width:45%;height:45%;display:grid;place-items:center;border-radius:28px;
  background:linear-gradient(180deg,#3a2e52 0%,#231b34 100%);color:rgba(255,200,150,.75);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.12),inset 0 0 0 1.5px rgba(255,170,90,.25),0 5px 0 #0c0814,0 10px 18px rgba(0,0,0,.45);
  transition:transform .07s,box-shadow .07s,color .07s;}
.qb-pad i svg{width:44%;height:44%;}
.qb-pad i.ul{left:0;top:0;border-top-left-radius:50%;} .qb-pad i.ur{right:0;top:0;border-top-right-radius:50%;}
.qb-pad i.dl{left:0;bottom:0;border-bottom-left-radius:50%;} .qb-pad i.dr{right:0;bottom:0;border-bottom-right-radius:50%;}
.qb-pad i.on{transform:translateY(4px);color:#ffb347;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.12),inset 0 0 0 2px rgba(255,170,90,.7),0 1px 0 #0c0814,0 0 16px rgba(255,140,40,.45);}
.qb-pad .nub{position:absolute;left:50%;top:50%;width:22%;height:22%;margin:-11% 0 0 -11%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 40% 32%,#ffc27a,#ff8a1f 55%,#a84a00);box-shadow:0 4px 0 #5c2800,0 8px 14px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.55);
  transition:transform .08s;}
@media (hover:hover) and (pointer:fine){ .qb-padwrap{display:none!important;} .ar-wrap{flex:1;min-height:0;} html.ar-on #app{justify-content:center;} }
@media (hover:none),(pointer:coarse){ .ar-desk{display:none!important;} }
@media (max-height:700px){ .ar-plate b{font-size:1.2rem;} }
/* Tablet landscape: the pyramid takes the full height and the hop pad sits in the lower-left corner, under the left thumb */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px) and (pointer:coarse){
  html.ar-on #app{position:relative;}
  .qb-padwrap{position:absolute;left:24px;bottom:calc(var(--safe-b) + 18px);width:auto;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), root = document.documentElement;
  var KEY = 'cubehopper', SAVE = 'cubehopper_state', PROG = 'cubehopper_progress';
  var FW = 360, FH = 430;
  // Cube geometry (isometric): top diamond half-width HW, half-height TH, side height SH
  var W = 44, HW = 22, TH = 12, SH = 26, DY = TH + SH, AX = FW / 2, AY = 100;
  var ROWS = 7, NCUBES = 28, CS = 1.2; // CS: creature scale
  var TICK = 1 / 120;
  var TOUCH = (window.matchMedia && matchMedia('(pointer:coarse), (hover:none)').matches) || navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
  var DIRS = { ul: [-1, -1], ur: [-1, 0], dl: [1, 0], dr: [1, 1] };

  // Round colour schemes: side faces + top colours [start, middle, target]
  var SCHEMES = [
    { l: '#cdb98a', r: '#55636b', t: ['#3f63d8', '#8a63d6', '#f5d33f'] },
    { l: '#c45a8c', r: '#3b3c80', t: ['#e6e3ec', '#7fd0e6', '#3cbf6a'] },
    { l: '#8a909b', r: '#2e3850', t: ['#d8552c', '#f2a03a', '#4fc7f0'] },
    { l: '#3f9070', r: '#22404a', t: ['#b24ad2', '#e575b8', '#f6f1e6'] },
    { l: '#c98b48', r: '#583820', t: ['#2b9a8b', '#7cd3aa', '#ffd24a'] },
    { l: '#5b6cc4', r: '#232a5e', t: ['#e3a21f', '#ea6a3a', '#7bdc4a'] },
    { l: '#b8a6cf', r: '#4b3d66', t: ['#3a8f3e', '#c9d84a', '#ff6d8a'] },
    { l: '#d07a5a', r: '#5a2a24', t: ['#f0e6c8', '#f2b6c8', '#5a8cff'] }
  ];
  // Level rules (levels 5+ keep the level 5 rule and get faster)
  var RULES = [
    { id: 'one', steps: 1, hint: 'One hop changes a cube' },
    { id: 'two', steps: 2, hint: 'Each cube needs two hops' },
    { id: 'toggle', steps: 1, hint: 'Hop a finished cube and it flips back' },
    { id: 'twoback', steps: 2, hint: 'Two hops, and a finished cube slips back one' },
    { id: 'tworeset', steps: 2, hint: 'Two hops, and a finished cube resets' }
  ];
  function ruleFor(level) { return RULES[Math.min(level, 5) - 1]; }

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function soundOn() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }
  function idx(r, c) { return r * (r + 1) / 2 + c; }
  function onBoard(r, c) { return r >= 0 && r < ROWS && c >= 0 && c <= r; }
  function cellXY(r, c) { return { x: AX + (c - r / 2) * W, y: AY + r * DY }; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  // ═══ Sound (all synthesized) ════════════════════════════════════════════
  var AC = null, master = null, noiseBuf = null;
  function ac() {
    if (!soundOn()) return null;
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
      master = AC.createGain(); master.gain.value = 0.8;
      var comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function osc(type, f, t0, dur, vol, o) {
    var a = ac(); if (!a) return; o = o || {};
    var t = a.currentTime + t0, n = a.createOscillator(), g = a.createGain(), out = n;
    n.type = type; n.frequency.setValueAtTime(f, t);
    if (o.to) n.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (o.lp) { var f2 = a.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; n.connect(f2); out = f2; }
    out.connect(g); g.connect(master); n.start(t); n.stop(t + dur + 0.05);
  }
  function noise(t0, dur, vol, type, freq) {
    var a = ac(); if (!a) return;
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;
    s.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq || 1000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function sHop() { osc('square', 540, 0, 0.07, 0.03, { to: 250, lp: 2200 }); }
  function sPaint(step) { osc('triangle', mtof(72 + step * 4), 0, 0.09, 0.06); osc('sine', mtof(84 + step * 4), 0.02, 0.07, 0.03); }
  function sThud(kind) { var f = kind === 'coily' ? 120 : kind === 'ugg' ? 95 : 160; osc('sine', f, 0, 0.08, 0.05, { to: f * 0.6 }); }
  function sCoily() { osc('sawtooth', 220, 0, 0.1, 0.03, { to: 330, lp: 900 }); }
  function sHatch() { osc('sawtooth', 110, 0, 0.35, 0.05, { to: 330, lp: 1200 }); noise(0, 0.2, 0.05, 'bandpass', 600); }
  function sCurse() {
    for (var i = 0; i < 10; i++) { var f = 170 + Math.random() * 650; osc('square', f, i * 0.06, 0.055, 0.045, { to: f * (0.55 + Math.random() * 0.9), lp: 1600 }); }
    noise(0, 0.55, 0.04, 'bandpass', 900);
  }
  function sFall() { osc('sine', 1500, 0, 1.1, 0.07, { to: 160 }); }
  function sLure() { osc('sine', 1800, 0, 1.3, 0.07, { to: 140 }); osc('triangle', 900, 0.05, 1.2, 0.03, { to: 90 }); }
  function sDisc() { for (var i = 0; i < 8; i++) osc('triangle', mtof(64 + i * 2), i * 0.07, 0.12, 0.05); }
  function sFreeze() { [88, 91, 96, 100].forEach(function (m, i) { osc('sine', mtof(m), i * 0.06, 0.3, 0.05); }); }
  function sCatch() { osc('square', 900, 0, 0.06, 0.03, { to: 1600, lp: 3000 }); osc('triangle', 1400, 0.06, 0.12, 0.05); }
  function sRevert() { osc('triangle', 500, 0, 0.12, 0.04, { to: 260 }); }
  function sHit() { noise(0, 0.25, 0.18, 'lowpass', 900); osc('square', 140, 0, 0.2, 0.06, { to: 60, lp: 900 }); }
  function sClear() { [72, 76, 79, 84, 88, 91].forEach(function (m, i) { osc('triangle', mtof(m), i * 0.08, 0.28, 0.07); osc('square', mtof(m), i * 0.08, 0.08, 0.02, { lp: 2500 }); }); }
  function sUp() { [79, 84, 91].forEach(function (m, i) { osc('sine', mtof(m), i * 0.07, 0.25, 0.08); }); }

  // ═══ State ═══════════════════════════════════════════════════════════════
  var G = null, view = 'none', paused = false;
  var q = null, enemies = [], cubes = [], discs = [];
  var fx = { parts: [], pops: [], banner: null, shake: 0, flash: 0 };
  var held = null;

  function loadProg() { try { var p = JSON.parse(localStorage.getItem(PROG)) || {}; return { reached: clamp(p.reached || 1, 1, 9), best: p.best || 0 }; } catch (e) { return { reached: 1, best: 0 }; } }
  function saveProg(p) { try { localStorage.setItem(PROG, JSON.stringify(p)); } catch (e) {} }
  function scheme() { return SCHEMES[(G.ri - 1) % SCHEMES.length]; }
  function rule() { return ruleFor(G.level); }
  function pace() { return G.pace === 'easy' ? 1.35 : 1; }
  function baseInt() { return clamp(0.84 - 0.03 * (G.ri - 1), 0.42, 0.84) * pace(); }
  function interval(type) {
    var b = baseInt();
    if (type === 'coily') return b * 1.02;
    if (type === 'ugg' || type === 'wrong') return b * 1.15;
    if (type === 'slick' || type === 'sam') return b * 1.05;
    return b * 0.95;
  }

  // ── Anchors: where a creature stands for a cell
  function anchor(kind, r, c) {
    var p = cellXY(r, c);
    if (kind === 'lface') return { x: p.x - 13, y: p.y + 19 };
    if (kind === 'rface') return { x: p.x + 13, y: p.y + 19 };
    return p;
  }
  function startHop(o, r, c, dur, arc) {
    var from = { x: o.x, y: o.y }, to = anchor(o.kind || 'top', r, c);
    o.hop = { x0: from.x, y0: from.y, x1: to.x, y1: to.y, t: 0, dur: dur, arc: arc, fr: o.r, fc: o.c, tr: r, tc: c };
  }
  function hopPos(o) {
    var h = o.hop, p = clamp(h.t, 0, 1);
    o.x = h.x0 + (h.x1 - h.x0) * p;
    o.y = h.y0 + (h.y1 - h.y0) * p - h.arc * 4 * p * (1 - p);
  }
  // Logical cell for collisions (switches at the top of the hop)
  function logical(o) {
    if (o.hop) return o.hop.t < 0.5 ? { r: o.hop.fr, c: o.hop.fc } : { r: o.hop.tr, c: o.hop.tc };
    return { r: o.r, c: o.c };
  }

  // ═══ Rounds ══════════════════════════════════════════════════════════════
  function makeDiscs() {
    var n = G.level <= 2 ? 2 : G.level <= 4 ? 3 : 4, out = [], rows = [1, 2, 3, 4, 5];
    var sides = ['L', 'R'];
    for (var i = 0; i < n; i++) {
      var side = i < 2 ? sides[i] : pick(sides);
      var free = rows.filter(function (r) { return !out.some(function (d) { return d.side === side && Math.abs(d.row - r) < 2; }); });
      if (!free.length) continue;
      out.push({ side: side, row: pick(free), spin: Math.random() * 6 });
    }
    return out;
  }
  function discCell(d) { return { r: d.row, c: d.side === 'L' ? -1 : d.row + 1 }; }
  function discAt(r, c) { for (var i = 0; i < discs.length; i++) { var k = discCell(discs[i]); if (k.r === r && k.c === c) return discs[i]; } return null; }

  function placeQ(r, c) {
    var p = cellXY(r, c);
    q = { kind: 'top', r: r, c: c, x: p.x, y: p.y, face: 'dr', hop: null, cool: 0.1, buf: null, ride: null, fall: null, grace: 0, squash: 0 };
  }
  function startRound(fresh) {
    cubes = []; for (var i = 0; i < NCUBES; i++) cubes.push(0);
    discs = makeDiscs();
    enemies = []; G.lure = null; G.freeze = 0; G.spawnT = 2.2 * pace(); G.spawned = 0; G.greens = 0;
    G.roundDeaths = 0; G.roundStart = G.score;
    placeQ(0, 0);
    q.y -= 90; startHop(q, 0, 0, 0.45, 0); q.hop.fr = 0; q.hop.fc = 0; q.hop.drop = true;
    G.phase = 'play';
    var R = rule();
    if (G.round === 1 || fresh) fx.banner = { text: 'LEVEL ' + G.level, sub: G.round === 1 ? R.hint : 'Round ' + G.round, c: '#ffb347', life: 2.6, max: 2.6 };
    else fx.banner = { text: 'ROUND ' + G.round, sub: 'Level ' + G.level, c: '#fff', life: 1.6, max: 1.6 };
    hudDirty = true;
    save();
  }
  function cubesLeft() { var t = rule().steps, n = 0; for (var i = 0; i < NCUBES; i++) if (cubes[i] !== t) n++; return n; }

  // Q*bert lands on a cube: change its colour by this level's rule
  function paint(r, c) {
    var k = idx(r, c), s = cubes[k], R = rule(), ns = s;
    if (R.id === 'one') ns = Math.max(s, 1);
    else if (R.id === 'two') ns = Math.min(2, s + 1);
    else if (R.id === 'toggle') ns = s === 1 ? 0 : 1;
    else if (R.id === 'twoback') ns = s === 2 ? 1 : s + 1;
    else if (R.id === 'tworeset') ns = s === 2 ? 0 : s + 1;
    if (ns === s) return;
    cubes[k] = ns;
    var p = cellXY(r, c);
    if (ns > s) {
      addScore(25); G.stats.cubes++;
      sPaint(ns);
      var col = scheme().t[R.steps === 1 ? (ns ? 2 : 0) : ns];
      for (var i = 0; i < 8; i++) { var a = i / 8 * Math.PI * 2; part(p.x + Math.cos(a) * 8, p.y + Math.sin(a) * 4, Math.cos(a) * 70, Math.sin(a) * 35 - 30, col, 0.4, 1.6, 60); }
    } else { sRevert(); G.stats.undone++; }
    if (cubesLeft() === 0) roundClear();
  }
  function cubeColor(k) {
    var R = rule(), S = scheme(), s = cubes[k];
    if (R.steps === 1) return s ? S.t[2] : S.t[0];
    return S.t[s];
  }
  function roundClear() {
    G.phase = 'clear'; G.clearT = 0;
    enemies.forEach(function (e) { burst(e.x, e.y - 8, '#fff', 8); });
    enemies = []; G.lure = null; G.freeze = 0;
    var bonus = Math.min(5000, 1000 + 250 * (G.ri - 1)), db = discs.length * 50;
    addScore(bonus + db);
    G.stats.rounds++;
    if (!G.roundDeaths) G.stats.perfect++;
    G.perRound.push({ l: G.level + '-' + G.round, s: G.score - G.roundStart });
    fx.banner = { text: 'ROUND CLEAR', sub: '+' + fmt(bonus) + ' bonus' + (db ? ' · discs +' + db : ''), c: '#ffd24a', life: 2.3, max: 2.3 };
    sClear(); Kit.haptic('success');
    var p = loadProg(); var nextLevel = G.round === 4 ? G.level + 1 : G.level;
    if (nextLevel > p.reached) { p.reached = Math.min(9, nextLevel); saveProg(p); }
  }
  function nextRound() {
    G.ri++; G.round++;
    if (G.round > 4) { G.round = 1; G.level++; }
    startRound(false);
  }

  // ═══ Enemies ═════════════════════════════════════════════════════════════
  function count(types) { return enemies.filter(function (e) { return types.indexOf(e.type) >= 0 && !e.fall; }).length; }
  function spawnOne() {
    var ri = G.ri, opts = [];
    var cap = Math.min(5, 3 + Math.floor((ri - 1) / 4));
    if (count(['red', 'purple', 'egg', 'coily', 'green', 'slick', 'sam', 'ugg', 'wrong']) >= cap) return;
    if (!count(['purple', 'egg', 'coily']) && G.spawned >= 1) opts.push(['purple', G.sinceCoily >= 2 ? 50 : 3]);
    if (count(['red']) < Math.min(3, 1 + Math.floor(ri / 3))) opts.push(['red', 4]);
    if (ri >= 2 && !count(['green']) && G.greens < 2) opts.push(['green', 1]);
    if (ri >= 3 && !count(['slick', 'sam'])) opts.push([Math.random() < 0.5 ? 'slick' : 'sam', 1.6]);
    if (ri >= 5 && !count(['ugg'])) opts.push(['ugg', 1.3]);
    if (ri >= 5 && !count(['wrong'])) opts.push(['wrong', 1.3]);
    if (!opts.length) return;
    var tot = opts.reduce(function (s, o) { return s + o[1]; }, 0), x = Math.random() * tot, t = opts[0][0];
    for (var i = 0; i < opts.length; i++) { x -= opts[i][1]; if (x <= 0) { t = opts[i][0]; break; } }
    spawn(t);
  }
  function spawn(type, r, c) {
    var e = { type: type, kind: 'top', hop: null, wait: 0, fall: null, drop: null, squash: 0, id: Math.random() };

  function drawEnemy(e) {

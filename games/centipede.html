<style>
/* ── Play view: fills the screen, no page scroll ────────────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 50% at 50% 0%, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:0 8px calc(var(--safe-b) + 6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.ar-hud{flex:none;display:flex;gap:6px;width:100%;}
.ar-plate{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 6px;border-radius:8px;background:#000;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--hc,#3dff3d) 50%,transparent),inset 0 0 0 3.5px #000,0 6px 16px rgba(0,0,0,.4);}
.ar-plate small{font-size:.6rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);white-space:nowrap;line-height:1;}
.ar-plate canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;}
.ar-plate.sc{flex:1.6;}
.ar-plate.bump canvas{animation:bounce .45s var(--spring);}
.ar-pbtn{flex:none;width:46px;border:0;border-radius:14px;display:grid;place-items:center;color:#c8ffd9;
  background:linear-gradient(180deg,#14261c,#0a140f);box-shadow:inset 0 0 0 1.5px rgba(120,255,170,.28),0 6px 16px rgba(0,0,0,.4);}
.ar-pbtn:active{transform:scale(.94);}
.ar-pbtn svg{width:22px;height:22px;}
.cc-team{flex:none;display:flex;gap:6px;width:100%;}
.cc-chip{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:12px;background:rgba(10,20,15,.85);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pc) 55%,transparent);font-weight:800;font-size:.78rem;color:#e8fff0;}
.cc-chip i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--pc);box-shadow:0 0 8px var(--pc);}
.cc-chip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cc-chip b{font-variant-numeric:tabular-nums;}
.cc-chip.out{opacity:.45;}
.ar-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
.ar-cab{position:relative;padding:6px;border-radius:18px;}
.ar-cab canvas{display:block;border-radius:6px;background:#000;}
.ar-cab::after{content:"";position:absolute;inset:6px;border-radius:6px;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 45%,transparent 64%,rgba(0,0,0,.45) 100%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.6);}
.ar-ov{position:absolute;inset:6px;border-radius:12px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(2,10,6,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(260px,86%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
/* Touch strip under the field: drag anywhere (field or strip) to move; the switch sets auto-fire */
.cc-strip{flex:none;width:100%;max-width:520px;display:flex;align-items:center;gap:10px;height:46px;padding:0 4px;}
.cc-pad{flex:1;min-width:0;height:100%;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  color:rgba(200,255,220,.55);font-weight:800;font-size:.8rem;letter-spacing:.04em;
  background:repeating-linear-gradient(90deg,rgba(120,255,170,.06) 0 2px,transparent 2px 10px),linear-gradient(180deg,#0e1d15,#08110c);
  box-shadow:inset 0 0 0 1.5px rgba(120,255,170,.18);}
.cc-pad svg{width:18px;height:18px;opacity:.7;}
.cc-fire{flex:none;height:100%;border:0;border-radius:14px;padding:0 12px;display:flex;align-items:center;gap:8px;font-weight:900;font-size:.78rem;color:#e8fff0;
  background:linear-gradient(180deg,#1d3326,#0e1a13);box-shadow:inset 0 0 0 1.5px rgba(120,255,170,.3),0 4px 10px rgba(0,0,0,.35);}
.cc-fire i{width:30px;height:18px;border-radius:9px;background:#33443a;position:relative;transition:background .15s;}
.cc-fire i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#cfe;transition:transform .15s;}
.cc-fire.on i{background:#3ddc84;} .cc-fire.on i::after{transform:translateX(12px);}
.ar-hint{flex:none;font-size:.8rem;color:var(--text-3);text-align:center;font-weight:700;}
@media (hover:hover) and (pointer:fine){ .ar-touch{display:none!important;} .ar-cab canvas{cursor:none;} }
@media (hover:none),(pointer:coarse){ .ar-desk{display:none!important;} }
@media (max-height:700px){ .cc-strip{height:40px;} }
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), root = document.documentElement;
  var KEY = 'centipede', HI = 'centipede', NETME = 'centi_net_me';
  var TOUCH = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  var PI = Math.PI, TAU = PI * 2;
  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // ═══ The field: 24 × 42 cells of 10 units; the bottom 7 rows are the player zone ═══
  var CELL = 10, COLS = 24, ROWS = 42, W = COLS * CELL, H = ROWS * CELL, PZ = ROWS - 7, PZY = PZ * CELL, LIFE_EVERY = 12000;
  var BOSS = {
    wasp: { name: 'The Wasp Queen', hp: 44, pts: 5000, r: [16, 11] },
    firefly: { name: 'The Firefly', hp: 52, pts: 7500, r: [12, 12] },
    beetle: { name: 'The Iron Beetle', hp: 80, pts: 10000, r: [18, 13] },
    mega: { name: 'Mega Spider', hp: 210, pts: 25000, r: [27, 19] }
  };
  // Like the 1981 cabinet: every centipede wave has 12 pieces in all. Wave 1 is one 12-long centipede; each
  // later wave's centipede is one segment shorter and brings one more loose head (which moves faster).
  // The non-boss waves here are the cabinet's waves 1 to 6.
  var WAVES = [null,
    { chain: 12, heads: 0 },
    { chain: 11, heads: 1 },
    { boss: 'wasp' },
    { chain: 10, heads: 2 },
    { chain: 9, heads: 3 },
    { boss: 'firefly' },
    { chain: 8, heads: 4 },
    { chain: 7, heads: 5 },
    { boss: 'beetle' },
    { boss: 'mega' }];
  var LAST = WAVES.length - 1;
  var CSPD = 62, HEAD_X = 1.5, FAST_AT = 40000, FAST_X = 1.3;   // cabinet: 1 px/frame, loose heads faster, a speed-up at 40,000
  // Per wave colours, cycling like the cabinet's: mushroom cap, mushroom stem/rim, centipede legs, body, head.
  // A poisoned mushroom swaps its two colours.
  var PAL = [
    ['#ff3a3a', '#3d8bff', '#f2d39b', '#3dff3d', '#ff4fe0'],
    ['#3df2ff', '#ff4fe0', '#ff8a1f', '#ffe23d', '#3dff3d'],
    ['#ffe23d', '#3dff3d', '#3df2ff', '#ff4fe0', '#ffffff'],
    ['#ff4fe0', '#ffe23d', '#ffffff', '#3df2ff', '#ff3a3a'],
    ['#3dff3d', '#ff3a3a', '#ffe23d', '#b46bff', '#3df2ff'],
    ['#ff8a1f', '#b46bff', '#ff4fe0', '#3dff3d', '#ffe23d'],
    ['#b46bff', '#3df2ff', '#ffe23d', '#ff3a3a', '#3dff3d'],
    ['#ffffff', '#ff3a3a', '#3df2ff', '#ff8a1f', '#ff4fe0']];
  var PCOL = ['#3df2ff', '#ff5ce1', '#d4ff3d'];
  // Damage a boss takes from each kind of hit, and how often a Beam bites a boss. Power-ups help against a boss
  // but never melt one: each is capped at about 1.6 times plain shots.
  var BDMG = { shot: 1, pellet: 1, big: 0.65, beam: 1, beamTick: 0.26 };
  var BOSS_NP = 1.25;     // each extra online player adds 125% to a boss's health (more shooters also clear the mushrooms in the way)
  var BST = ['enter', 'fly', 'warn', 'dive', 'rise', 'slam', 'back', 'die'];
  var POW = { scatter: { c: '#ffa23d', name: 'Scatter' }, shock: { c: '#5ec8ff', name: 'Shock' }, blaster: { c: '#ff4f5e', name: 'Blaster' }, beam: { c: '#6bff8a', name: 'Beam' } };
  var POWK = ['scatter', 'shock', 'blaster', 'beam'], POW_T = 10;
  var DIFF = { relaxed: { lives: 5, spd: 0.85, name: 'Relaxed' }, arcade: { lives: 3, spd: 1, name: 'Arcade' } };
  var DRAG = { slow: 1.2, normal: 1.7, fast: 2.4 };
  var FT = ['spider', 'flea', 'scorp', 'ball'], KT = ['sting', 'spark', 'venom', 'ember'], BT = ['wasp', 'firefly', 'beetle', 'mega'];
  var PH = ['intro', 'play', 'clear', 'dead', 'over', 'won'];

  // ═══ Sound: small WebAudio synth that follows the kit's sound setting ═══
  var AC = null, master = null, nbuf = null;
  function sndOn() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }
  function ac() {
    if (!sndOn()) return null;
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
      master = AC.createGain(); master.gain.value = 0.6;
      var comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
      nbuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      var d = nbuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended' && !paused) { try { AC.resume(); } catch (e) {} }
    return AC;
  }
  function osc(type, f, t0, dur, vol, o) {
    var a = ac(); if (!a) return; o = o || {};
    var t = a.currentTime + t0, n = a.createOscillator(), gn = a.createGain(), out = n;
    n.type = type; n.frequency.setValueAtTime(f, t);
    if (o.to) n.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.005); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (o.lp) { var f2 = a.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; n.connect(f2); out = f2; }
    out.connect(gn); gn.connect(master); n.start(t); n.stop(t + dur + 0.05);
  }
  function noise(t0, dur, vol, type, freq, o) {
    var a = ac(); if (!a) return; o = o || {};
    var s = a.createBufferSource(), f = a.createBiquadFilter(), gn = a.createGain(), t = a.currentTime + t0;
    s.buffer = nbuf; f.type = type || 'bandpass'; f.frequency.setValueAtTime(freq || 1000, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    if (o.q) f.Q.value = o.q;
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.004); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(gn); gn.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  var SND = {
    shot: function () { osc('square', 1900, 0, 0.045, 0.028, { to: 900, lp: 5000 }); },
    big: function () { osc('sawtooth', 700, 0, 0.08, 0.05, { to: 220, lp: 2400 }); noise(0, 0.05, 0.05, 'highpass', 3000); },
    mush: function () { noise(0, 0.03, 0.08, 'bandpass', 2400, { q: 3 }); },
    pop: function () { noise(0, 0.05, 0.1, 'bandpass', 1500, { q: 2 }); },
    seg: function () { osc('square', 520, 0, 0.07, 0.07, { to: 160, lp: 2600 }); noise(0, 0.04, 0.1, 'bandpass', 1800, { q: 2 }); },
    head: function () { osc('square', 880, 0, 0.1, 0.08, { to: 220, lp: 3000 }); osc('triangle', 1320, 0.03, 0.12, 0.06); noise(0, 0.07, 0.14, 'bandpass', 1200, { q: 1.5 }); },
    spider: function () { [0, 1, 2].forEach(function (i) { osc('square', 700 + i * 260, i * 0.05, 0.08, 0.06, { lp: 3500 }); }); noise(0, 0.12, 0.12, 'bandpass', 900); },
    flea: function () { osc('sine', 1400, 0, 0.5, 0.05, { to: 300 }); },
    scorp: function () { osc('sawtooth', 160, 0, 0.35, 0.05, { to: 320, lp: 900 }); },
    kill: function () { noise(0, 0.25, 0.25, 'lowpass', 1600, { to: 200 }); osc('square', 330, 0, 0.2, 0.07, { to: 110, lp: 1600 }); },
    die: function () { noise(0, 0.7, 0.5, 'lowpass', 1200, { to: 90 }); osc('sawtooth', 300, 0, 0.7, 0.12, { to: 40, lp: 1200 }); osc('sine', 120, 0, 0.6, 0.3, { to: 35 }); },
    power: function () { [72, 76, 79, 84, 88].forEach(function (m, i) { osc('square', mtof(m), i * 0.045, 0.09, 0.05, { lp: 4200 }); osc('triangle', mtof(m + 12), i * 0.045, 0.14, 0.05); }); },
    bhit: function () { osc('square', 180, 0, 0.07, 0.09, { to: 80, lp: 1400 }); noise(0, 0.05, 0.12, 'bandpass', 700, { q: 2 }); },
    bdie: function () { noise(0, 1.2, 0.6, 'lowpass', 2000, { to: 60 }); osc('sine', 90, 0, 1.0, 0.4, { to: 30 }); [60, 64, 67, 72, 76, 79, 84].forEach(function (m, i) { osc('square', mtof(m), 0.5 + i * 0.07, 0.14, 0.06, { lp: 4000 }); }); },
    wave: function () { [60, 64, 67, 72].forEach(function (m, i) { osc('square', mtof(m), i * 0.08, 0.12, 0.06, { lp: 3500 }); }); osc('triangle', mtof(84), 0.32, 0.35, 0.09); },
    clear: function () { [72, 71, 72, 76, 79, 84].forEach(function (m, i) { osc('square', mtof(m), i * 0.07, 0.11, 0.06, { lp: 3600 }); osc('triangle', mtof(m - 12), i * 0.07, 0.15, 0.06); }); },
    extra: function () { [79, 83, 86, 91].forEach(function (m, i) { osc('square', mtof(m), i * 0.06, 0.1, 0.05, { lp: 5000 }); }); osc('triangle', mtof(95), 0.24, 0.3, 0.07); },
    warn: function () { [0, 0.22].forEach(function (t) { osc('sawtooth', 440, t, 0.18, 0.06, { to: 880, lp: 2000 }); }); },
    beam: function () { osc('sawtooth', 220 + Math.random() * 40, 0, 0.06, 0.025, { lp: 1800 }); },
    zap: function () { noise(0, 0.08, 0.14, 'highpass', 4000); osc('square', 1200, 0, 0.06, 0.04, { to: 3000, lp: 6000 }); },
    restore: function () { osc('triangle', 1200 + Math.random() * 400, 0, 0.04, 0.05); },
    over: function () { [67, 66, 65, 64].forEach(function (m, i) { osc('square', mtof(m), 0.2 + i * 0.22, i === 3 ? 0.7 : 0.2, 0.06, { lp: 1800 }); osc('triangle', mtof(m - 12), 0.2 + i * 0.22, i === 3 ? 0.7 : 0.2, 0.09); }); },
    shoot: function () { osc('sawtooth', 900, 0, 0.12, 0.04, { to: 400, lp: 2400 }); }
  };
  var sLast = {};
  function snd(name) {
    var now = performance.now(); if (sLast[name] && now - sLast[name] < 35) return; sLast[name] = now;
    if (SND[name]) try { SND[name](); } catch (e) {}
  }

  // ═══ Music: an original creepy-crawly chiptune (A minor: Am F Dm E). Tempo rises with the waves ═══
  function rep(a, n) { var o = []; for (var i = 0; i < n; i++) o = o.concat(a); return o; }
  var SONG = {
    eighth: 0.15, leadVol: 0.035, leadLp: 2800, bassVol: 0.1, drumVol: 0.8, echo: 0.22,
    lead: [69, 0, 72, 76, 75, 76, 72, 0, 69, 0, 72, 76, 79, 76, 72, 71,
           65, 0, 69, 72, 71, 72, 69, 0, 65, 0, 69, 72, 76, 72, 69, 68,
           62, 0, 65, 69, 68, 69, 65, 0, 62, 0, 65, 69, 74, 72, 69, 65,
           64, 0, 68, 71, 70, 71, 68, 0, 76, 0, 74, 72, 71, 68, 64, 0],
    bass: [].concat(rep([45, 0, 57, 45, 0, 45, 57, 0], 2), rep([41, 0, 53, 41, 0, 41, 53, 0], 2), rep([38, 0, 50, 38, 0, 38, 50, 0], 2), rep([40, 0, 52, 40, 0, 40, 52, 44], 2)),
    drums: 'k.hsk.hs'
  };
  var Mus = ArcadeMusic.create({ key: 'centipede_music', song: SONG, ctx: ac, out: function () { return master; },
    tempo: function () { var R = view(); return R ? 1 + Math.min(0.25, (R.wave - 1) * 0.025) + (R.boss ? 0.06 : 0) : 1; } });

  // ═══ Shell ══════════════════════════════════════════════════════════════
  var inCat = typeof findGame === 'function' && !!findGame('centipede');
  Kit.init({ orient: 'portrait', orientTablets: true,
    id: 'centipede', title: inCat ? null : 'Centipede', color: inCat ? null : '#5b3df0',
    theme: { wood: ['#2a4630', '#132418'] },
    onNew: function () { if (net.mode) { leaveOnline(true); return; } showSetup(); },
    menu: [
      { icon: 'trophy', label: 'High scores', onClick: function () { pauseGame(); ArcadeHi.show(HI, 'Centipede'); } },
      { icon: 'history', label: 'Past games', onClick: function () { pauseGame(); Kit.history(KEY, { title: 'Centipede: past games' }); } },
      Mus.menuItem,
      { icon: 'users', label: 'Play online', sub: '2 or 3 players, each on their own device', when: function () { return !net.mode && screen !== 'lobby'; }, onClick: function () { goLobby(); } },
      { icon: 'user', label: 'Play solo', when: function () { return screen === 'lobby'; }, onClick: function () { showSetup(); } },
      { icon: 'logout', label: 'Leave the online game', when: function () { return !!net.mode; }, onClick: function () { leaveOnline(true); } }
    ],
    rules:
      '<p class="goal">Centipedes wind down through a field of mushrooms. Blast every segment before they reach you. Survive ten waves, beat four bosses, and save the garden.</p>' +
      '<h3>Moving and shooting</h3><ul><li><b>Phone or tablet:</b> put a finger down anywhere on the field or the strip under it and drag. Your shooter moves with your finger, like a trackball, so your thumb never covers it.</li>' +
      '<li>You fire while your finger is down. Turn on <b>Auto-fire</b> (the switch under the field) to fire all the time.</li>' +
      '<li><b>Computer:</b> move with the mouse or the arrow keys. Hold the mouse button or Space to fire. F turns auto-fire on or off, P pauses.</li>' +
      '<li>Your shooter stays in the bottom area and can\'t pass through mushrooms. Only one regular shot flies at a time, so shooting close up fires faster.</li></ul>' +
      '<h3>The centipede</h3><ul><li>It crawls sideways. When it bumps a mushroom or the edge, it drops down a row and turns around.</li>' +
      '<li>Shoot a segment and it turns into a mushroom. The centipede splits in two, and the back half grows a new head.</li>' +
      '<li>Wave 1 is one centipede, 12 segments long. Each new wave\'s centipede is one segment shorter and comes with one more loose head, and the loose heads move faster.</li>' +
      '<li>Body segment <b>10</b>, head <b>100</b>. Clear every segment to finish the wave. Once the score passes <b>40,000</b>, centipedes move faster.</li>' +
      '<li>Once a centipede gets down into your area, extra heads start crawling in from the sides.</li>' +
      '<li>Clear a wave for a bonus of <b>250</b> times the wave number.</li></ul>' +
      '<h3>Mushrooms</h3><p>The field starts with about two mushrooms in every row and an open strip at the bottom. Mushrooms stay from wave to wave, and their colours change each wave. A mushroom takes 4 hits and wears down from the bottom (<b>1</b> point). Mushrooms in your area get in the way, so keep it clear. A <b>poisoned</b> mushroom has its two colours swapped. A centipede that touches one dives straight down at you.</p>' +
      '<h3>Other bugs</h3><ul><li><b>Spider</b>: zigzags through your area and eats mushrooms. Comes more often as your score climbs. <b>300</b>, <b>600</b> or <b>900</b>: the closer it is when you hit it, the more it\'s worth.</li>' +
      '<li><b>Flea</b>: from wave 2. Drops straight down, planting mushrooms, whenever your area has 5 or fewer (one more for every 20,000 points, up to 9). Takes 2 hits. <b>200</b>.</li>' +
      '<li><b>Scorpion</b>: from wave 4. Crawls across the upper field and poisons every mushroom it touches. <b>1,000</b>.</li></ul>' +
      '<h3>Power-ups</h3><p>Some bugs drop a flashing capsule. Shoot it or touch it for 10 seconds of: <b>Scatter</b> (three shots at once), <b>Shock</b> (each hit zaps the bugs nearby), <b>Blaster</b> (big shots, two at a time, double strength) or <b>Beam</b> (a laser that cuts straight up). Bosses shrug off some of it: Blaster and Beam hurt a boss less than they hurt bugs.</p>' +

  // ── Hosting ──
  function hostTable(name) {
    closeLobby(); busy('Opening your table…');

      // the server refused the new table: back to the lobby instead of a waiting room nobody can find

        Kit.toast(peerName(peer) + ' joined'); Kit.sfx('pop');

        }

    var s = { t: 's', q: ++net.seq, tm: Math.round(now), w: G.wave, ph: PH.indexOf(G.phase), pt: Math.round(G.phaseT * 10), sc: G.score, pl: G.pal, c: [], f: [], k: [], u: [], cp: [], p: [], b: 0, bm: [] };
    G.segs.forEach(function (sg) { s.c.push(sg.id, q4(sg.x), q4(sg.y), (sg.head ? 1 : 0) | (sg.dx < 0 ? 2 : 0)); });
    G.foes.forEach(function (o) { s.f.push(o.id, FT.indexOf(o.type), q4(o.x), q4(o.y), o.hp, o.vx < 0 ? 1 : 0); });
    G.shots.forEach(function (o) { s.k.push(o.id, KT.indexOf(o.k), q4(o.x), q4(o.y), Math.round(Math.atan2(o.vy, o.vx) * 100)); });
    G.bullets.forEach(function (b) { s.u.push(b.id, b.o, q4(b.x), q4(b.y), b.big ? 1 : 0); });
    G.caps.forEach(function (c) { s.cp.push(c.id, POWK.indexOf(c.k), q4(c.x), q4(c.y)); });
    G.players.forEach(function (p) { s.p.push([p.id, q4(p.x), q4(p.y), (p.alive ? 1 : 0) | (p.inv > 0 ? 2 : 0), p.lives, p.score, p.power ? POWK.indexOf(p.power) + 1 : 0, Math.ceil(p.powerT), p.ci, p.name]); });
    if (G.boss) { var B = G.boss; s.b = [B.id, BT.indexOf(B.type), q4(B.x), q4(B.y), Math.round(B.hp * 10) / 10, Math.round(B.max * 10) / 10, BST.indexOf(B.st), Math.round(B.lit * 100), B.flash > 0 ? 1 : 0, B.enraged ? 1 : 0, B.lane == null ? -1 : q4(B.lane)]; }
    G.beams.forEach(function (bm) { s.bm.push(bm.o, q4(bm.x), q4(bm.y0), q4(bm.y1)); });
    t.broadcast(s, false);
  }
  function netOver(R) {
    if (!net.table) return;
    if (net.evq.length || G.md.length) { net.table.broadcast({ t: 'e', ev: net.evq, m: G.md }, true); net.evq = []; G.md = []; }
    net.table.broadcast({ t: 'over', r: R }, true);
    net.table.setStatus('open', '');
  }
  function backToTable() {
    if (net.mode === 'host' && net.table && !net.table.closed) { G = null; showWait(); sendRoster(); return; }
    if (net.mode === 'guest' && net.peer && !net.peer.closed) { GV = null; showWait(); return; }
    leaveOnline(false); goLobby();
  }

  // ── Joining ──
  function joinTable(code, name) {
    closeLobby(); busy('Connecting to the table…');
    Online.join(code, { game: 'centipede', name: name }).then(function (peer) {
      net.mode = 'guest'; net.peer = peer; net.hostName = peer.name; net.me = name; net.roster = []; net.myPid = null;
      peer.on('msg', guestMsg);
      peer.on('close', function (why) {
        if (net.peer !== peer) return;
        var playing = screen === 'game' && GV && !GV.ended;
        net.peer = null; net.mode = null;
        if (playing) { GV.ended = true; var res = GV.lastRes(); endGame(false, res, (net.hostName || 'The host') + (why === 'host' || why === 'left' ? ' left the game' : '’s table lost its connection')); }
        else if (screen === 'wait') { Kit.toast((net.hostName || 'The host') + ' closed the table'); goLobby(); }
      });
      showWait();
    }).catch(function (e) {
      var msg = e && e.nat ? e.message : Online.errText(e);
      if (e && e.nat) Kit.sheet({ title: 'Couldn’t connect', html: '<p>' + Kit.esc(msg) + '</p>' }); else Kit.toast(msg);
      goLobby();
    });
  }
  function guestMsg(m) {
    if (m.t === 'hi') { net.myPid = m.you; return; }
    if (m.t === 'ro') { net.roster = m.ro; if (net.wait) net.wait.update(waitPlayers(m.ro, net.myPid)); if (GV) GV.names = m.ro; return; }
    if (m.t === 'init') { net.myPid = m.you; net.roster = m.ro; guestStart(m); return; }
    if (!GV) return;
    if (m.t === 's') { guestSnap(m); return; }
    if (m.t === 'e') { setTimeout(function () { if (!GV) return; guestDiffs(m.m); (m.ev || []).forEach(applyFx); if (m.ev && m.ev.length) hudDirty = true; }, DELAY); return; }
    if (m.t === 'over') { var R = m.r; setTimeout(function () { if (!GV || GV.ended) return; GV.ended = true; GV.phase = R.won ? 'won' : 'over'; GV.phaseT = 0; setTimeout(function () { endGame(R.won, R); }, 1800); }, DELAY); }
  }
  function guestStart(m) {
    net.wait = null;
    Array.prototype.forEach.call(document.querySelectorAll('.k-win'), function (n) { n.remove(); });
    GV = { mode: 'guest', me: m.you, ci: 0, grid: new Uint8Array(COLS * ROWS), pois: new Uint8Array(COLS * ROWS), wave: m.w, pal: m.pl, phase: PH[m.ph] || 'intro', phaseT: 0, score: 0,
      segs: [], foes: [], shots: [], bullets: [], caps: [], players: [], boss: null, beams: [], buf: [], off: null, lastAt: performance.now(),
      pred: { x: W / 2, y: H - 15, alive: false, cool: 0, beamT: 0 }, lb: [], beam: null, hostName: m.host || net.hostName, stall: false, ended: false, sendT: 0, diff: m.diff, started: Date.now() };
    for (var i = 0; i < m.g.length; i++) { var v = m.g.charCodeAt(i) - 48; GV.grid[i] = v % 5; GV.pois[i] = v >= 5 ? 1 : 0; }
    GV.lastRes = function () { return { won: false, wave: GV.wave, score: GV.score, players: GV.players.map(function (p) { return { id: p.id, name: p.name, score: p.score, ci: p.ci }; }), stats: {}, started: GV.started, diff: GV.diff }; };
    G = null;
    Kit.gameStart();
    buildView();
  }
  function guestDiffs(md) { if (!md) return; for (var i = 0; i + 2 < md.length; i += 3) { GV.grid[md[i]] = md[i + 1]; GV.pois[md[i]] = md[i + 2]; } }
  function guestSnap(s) {
    var now = performance.now(), sample = s.tm - now;
    GV.off = GV.off == null ? sample : Math.max(sample, GV.off - 1);
    GV.lastAt = now;
    var b = GV.buf; if (b.length && s.q <= b[b.length - 1].q) return;
    b.push(s); if (b.length > 14) b.shift();
  }
  function lerpArr(A, B, stride, a, build) {
    var out = [], map = {};
    if (A) for (var i = 0; i < A.length; i += stride) map[A[i]] = i;
    for (var j = 0; j < B.length; j += stride) {
      var k = map[B[j]], x = B[j + 2] / 4, y = B[j + 3] / 4;
      if (k != null && A) { x = A[k + 2] / 4 + (x - A[k + 2] / 4) * a; y = A[k + 3] / 4 + (y - A[k + 3] / 4) * a; }
      out.push(build(B, j, x, y));
    }
    return out;
  }
  function guestFrame(dt) {
    var V = GV, now = performance.now();
    V.phaseT += dt;
    V.stall = !V.ended && now - V.lastAt > 1500;
    if (V.buf.length) {
      var rt = now + V.off - DELAY, b = V.buf, A = b[0], B = b[b.length - 1];
      for (var i = 0; i < b.length - 1; i++) if (b[i].tm <= rt && b[i + 1].tm >= rt) { A = b[i]; B = b[i + 1]; break; }
      if (rt >= b[b.length - 1].tm) A = B = b[b.length - 1];
      else if (rt <= b[0].tm) A = B = b[0];
      var a = B.tm > A.tm ? clamp((rt - A.tm) / (B.tm - A.tm), 0, 1) : 1;
      if (V.wave !== B.w || V.pal !== B.pl) { V.wave = B.w; V.pal = B.pl; hudDirty = true; }
      var ph = PH[B.ph]; if (!V.ended && ph !== V.phase) { V.phase = ph; V.phaseT = B.pt / 10; }
      if (V.score !== B.sc) { V.score = B.sc; hudDirty = true; }
      V.segs = lerpArr(A.c, B.c, 4, a, function (r, j, x, y) { return { id: r[j], x: x, y: y, head: !!(r[j + 3] & 1), dx: r[j + 3] & 2 ? -1 : 1 }; });
      V.foes = lerpArr(A.f, B.f, 6, a, function (r, j, x, y) { return { id: r[j], type: FT[r[j + 1]], x: x, y: y, hp: r[j + 4], vx: r[j + 5] ? -1 : 1 }; });
      V.shots = lerpArr(A.k, B.k, 5, a, function (r, j, x, y) { var an = r[j + 4] / 100; return { id: r[j], k: KT[r[j + 1]], x: x, y: y, vx: Math.cos(an), vy: Math.sin(an) }; });
      V.bullets = lerpArr(A.u, B.u, 5, a, function (r, j, x, y) { return { id: r[j], o: r[j + 1], x: x, y: y, big: !!r[j + 4] }; });
      V.caps = lerpArr(A.cp, B.cp, 4, a, function (r, j, x, y) { return { id: r[j], k: POWK[r[j + 1]], x: x, y: y }; });
      V.beams = []; for (var bi = 0; bi < B.bm.length; bi += 4) V.beams.push({ o: B.bm[bi], x: B.bm[bi + 1] / 4, y0: B.bm[bi + 2] / 4, y1: B.bm[bi + 3] / 4 });
      if (B.b) {
        var bb = B.b, ab = A.b && A.b[0] === bb[0] ? A.b : bb;
        if (Math.abs(bb[2] - ab[2]) > 400 || Math.abs(bb[3] - ab[3]) > 400) ab = bb;   // a jump (the Wasp back in at the top, the Firefly moving in the dark): don't slide across
        var bx = ab[2] / 4 + (bb[2] - ab[2]) / 4 * a, by = ab[3] / 4 + (bb[3] - ab[3]) / 4 * a;
        if (!V.boss || V.boss.id !== bb[0]) V.boss = { id: bb[0] };
        var VB = V.boss; VB.type = BT[bb[1]]; VB.x = bx; VB.y = by; VB.hp = bb[4]; VB.max = bb[5]; VB.st = BST[bb[6]]; VB.lit = bb[7] / 100; VB.hitf = !!bb[8]; VB.flash = 0; VB.enraged = !!bb[9]; VB.lane = bb[10] == null || bb[10] < 0 ? null : bb[10] / 4;
      } else V.boss = null;
      var pm = {}; (A.p || []).forEach(function (p) { pm[p[0]] = p; });
      var wasAlive = V.pred.alive;
      V.players = B.p.map(function (p) {
        var o = pm[p[0]] || p, P = { id: p[0], x: o[1] / 4 + (p[1] - o[1]) / 4 * a, y: o[2] / 4 + (p[2] - o[2]) / 4 * a, alive: !!(p[3] & 1), inv: p[3] & 2 ? 1 : 0, lives: p[4], score: p[5], power: p[6] ? POWK[p[6] - 1] : null, powerT: p[7], ci: p[8], name: p[9] };
        if (P.id === V.me) { V.ci = P.ci; V.power = P.power; var lp = B.p.filter(function (q) { return q[0] === V.me; })[0]; if (lp) { V.pred.alive = !!(lp[3] & 1); if (V.pred.alive && !wasAlive) { V.pred.x = lp[1] / 4; V.pred.y = lp[2] / 4; } } }
        return P;
      });
      var sig = V.players.map(function (p) { return p.lives + ':' + p.score + ':' + p.alive; }).join(); if (sig !== V.psig) { V.psig = sig; hudDirty = true; }
    }
    guestLocal(dt);
  }
  // A guest's own shooter: moved here straight away; its shots are drawn here too (the host's copy decides what they hit)
  function guestLocal(dt) {
    var V = GV, P = V.pred;
    if (P.alive && !V.ended) {
      var m = takeInput(P, dt); movePlayer(P, m[0], m[1]);
      var f = firing();
      V.sendT -= dt;
      if (V.sendT <= 0 && net.peer) { V.sendT = 1 / 30; net.peer.send({ t: 'i', x: q4(P.x), y: q4(P.y), f: f ? 1 : 0 }, false); }
      P.cool -= dt; V.beam = null;
      if (f && V.power === 'beam') {
        var c = Math.floor(P.x / CELL), top = 0;
        for (var r = Math.floor((P.y - 6) / CELL); r >= 0; r--) if (V.grid[idx(c, r)]) { top = r * CELL + 9; break; }
        V.segs.forEach(function (s) { if (Math.abs(s.x - P.x) < 5 && s.y < P.y && s.y + 4 > top) top = s.y + 4; });
        V.beam = { o: V.me, x: P.x, y0: P.y - 7, y1: top };
      } else if (f && !V.lb.length && P.cool <= 0) {
        if (V.power === 'scatter') { [-0.2, 0, 0.2].forEach(function (an) { V.lb.push({ x: P.x, y: P.y - 7, vx: Math.sin(an) * BSPD, vy: -Math.cos(an) * BSPD }); }); P.cool = 0.1; snd('shot'); }
        else { V.lb.push({ x: P.x, y: P.y - 7, vx: 0, vy: -BSPD, big: V.power === 'blaster' }); P.cool = V.power === 'blaster' ? 0.09 : 0.03; snd(V.power === 'blaster' ? 'big' : 'shot'); }
      }
    } else { V.beam = null; if (net.peer && !V.ended) { V.sendT -= dt; if (V.sendT <= 0) { V.sendT = 0.2; net.peer.send({ t: 'i', x: q4(P.x), y: q4(P.y), f: 0 }, false); } } }
    for (var i = V.lb.length - 1; i >= 0; i--) {
      var b = V.lb[i], n = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 4), gone = false;
      for (var s = 0; s < n && !gone; s++) {
        b.x += b.vx * dt / n; b.y += b.vy * dt / n;
        if (b.y < -4 || b.x < 0 || b.x > W) { gone = true; break; }
        var cc = Math.floor(b.x / CELL), rr = Math.floor(b.y / CELL);
        if (inField(cc, rr) && V.grid[idx(cc, rr)]) gone = true;
        for (var k = 0; k < V.segs.length && !gone; k++) if (Math.abs(V.segs[k].x - b.x) < 5.5 && Math.abs(V.segs[k].y - b.y) < 6) gone = true;
        for (var f2 = 0; f2 < V.foes.length && !gone; f2++) if (Math.abs(V.foes[f2].x - b.x) < 7 && Math.abs(V.foes[f2].y - b.y) < 6) gone = true;
        if (!gone && V.boss && V.boss.st !== 'die') { var R = BOSS[V.boss.type].r, ex = (b.x - V.boss.x) / R[0], ey = (b.y - V.boss.y) / R[1]; if (ex * ex + ey * ey < 1 && !(V.boss.type === 'firefly' && V.boss.lit < 0.45)) gone = true; }
      }
      if (gone) V.lb.splice(i, 1);
    }
  }

  // ── Leaving ──
  // ask: confirm first (from a menu or button). quiet: the page is closing
  function leaveOnline(ask, quiet) {
    if (!net.mode) { closeLobby(); return; }
    if (ask) {
      var body = net.mode === 'host' ? 'The game ends for everyone at your table.' : 'You can join again from the list.';
      Kit.confirm(screen === 'game' ? 'Leave the game?' : 'Leave the table?', { ok: 'Leave', body: body }).then(function (ok) { if (ok) { leaveOnline(false); goLobby(); } });
      return;
    }
    if (net.table) net.table.close();
    if (net.peer) { var p = net.peer; net.peer = null; p.close('left'); }
    net.mode = null; net.table = null; net.wait = null; net.roster = [];
    if (!quiet) { GV = null; if (G && G.mode === 'host') G = null; }
    closeLobby();
  }

  // ═══ Test hooks (automated checks) ══════════════════════════════════════
  window.__centi = {
    state: function () { return G; }, view: function () { return GV; }, net: net, ctl: ctl,
    solo: function (o) { o = o || {}; applyOpts({}); startSolo({ who: o.who || 'Tim', diff: o.diff || 'arcade' }); },
    hold: function (on) { hold = !!on; },
    run: function (sec) { var n = Math.round(sec / STEP); for (var i = 0; i < n && G && !G.ended; i++) { sim(STEP); if (G.mode === 'host') netHostTick(); } draw(); updateHud(); },
    step: function (n) { for (var i = 0; i < n && G && !G.ended; i++) sim(STEP); },     // simulate without drawing
    threats: function (on) { if (on) G.threats = []; return G.threats; },               // with god on: what would have hit
    field: function () { var rows = []; for (var r = 0; r < ROWS; r++) { var n = 0; for (var c = 0; c < COLS; c++) if (G.grid[idx(c, r)]) n++; rows.push(n); } return rows; },
    put: function (c, r, hp, po) { setMush(c, r, hp, po); },
    consts: { W: W, H: H, CELL: CELL, COLS: COLS, ROWS: ROWS, PZ: PZ, PZY: PZY, WAVES: WAVES, BOSS: BOSS, BDMG: BDMG, PAL: PAL },
    fleaLimit: function () { return fleaLimit(); },
    wave: function (n) { G.chains = []; G.segs = []; G.boss = null; G.foes = []; G.shots = []; startWave(n); },
    clearWave: function () { G.chains = []; G.segs = []; if (G.boss) G.boss.hp = 1; },
    god: function (on) { G.noDie = !!on; },
    power: function (k) { var P = G.players[0]; P.power = k; P.powerT = POW_T; },
    move: function (x, y) { var P = G.players[0]; P.x = x; P.y = y; },
    fire: function (on) { ctl.keys[' '] = !!on; },
    kill: function () { killPlayer(G.players[0]); },
    hitBoss: function (n) { for (var i = 0; i < n; i++) hitBoss(G.players[0], 1, G.boss.x, G.boss.y); },
    lobby: function () { goLobby(); }, host: function (n) { hostTable(n || 'Tim'); }, join: function (c, n) { joinTable(c, n || 'Sam'); }, start: function () { hostStart(); },
    draw: function () { draw(); }, fx: fx
  };
  window.__cc = window.__centi;

  // ═══ Boot ═══════════════════════════════════════════════════════════════
  bindInput();
  (function () {
    var s = lsGet('centi_opts', {}) || {}; ctl.auto = !!s.auto; ctl.drag = DRAG[s.drag] || DRAG.normal;
    if (/[?&]online=1/.test(location.search)) goLobby(); else showSetup();
  })();
})();

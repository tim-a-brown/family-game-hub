<!DOCTYPE html>

<style>
/* ── Play view: the arcade screen fills the page, no page scroll ─────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(120% 70% at 50% 45%,#0b1238 0%,#050818 60%,#020309 100%);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;
  padding:0 calc(6px + var(--corner-x)) calc(var(--safe-b) + 6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.cc-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
/* the screen: a thin dark bezel lit by the stage colour */
.cc-cab{position:relative;padding:2px;border-radius:12px;background:#01020a;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--cc-glow,#3f8cff) 55%,transparent),0 0 30px -8px var(--cc-glow,#3f8cff),0 16px 40px rgba(0,0,0,.6);
  transition:box-shadow .8s;}
.cc-cab canvas{display:block;border-radius:10px;position:relative;}
.cc-cab canvas.cc-floor{position:absolute;left:2px;top:2px;background:#02040e;}
/* a slow band of light sweeping down the floor (drawn by the browser, not the game loop) */
.cc-sweep{position:absolute;inset:2px;border-radius:10px;overflow:hidden;pointer-events:none;mix-blend-mode:screen;}
.cc-sweep::before{content:"";position:absolute;left:0;right:0;top:0;height:32%;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--cc-glow,#3f8cff) 16%,transparent),transparent);
  animation:cc-sweep 12s linear infinite;}
@keyframes cc-sweep{from{transform:translateY(-110%);}to{transform:translateY(330%);}}
@media (prefers-reduced-motion:reduce){.cc-sweep{display:none;}}
.ar-ov{position:absolute;inset:2px;border-radius:10px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(2,6,20,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(260px,86%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
.cc-pbtn svg{width:22px;height:22px;}
.ar-hint{flex:none;font-size:.8rem;color:var(--text-3);text-align:center;font-weight:700;}
@media (hover:hover) and (pointer:fine){ .ar-touch{display:none!important;} .cc-cab canvas{cursor:none;} }
@media (hover:none),(pointer:coarse){ .ar-desk{display:none!important;} }
@media (max-height:700px){ .ar-hint{display:none;} }
/* back from upright: 3, 2, 1 */
.cc-count{font-family:var(--display);font-size:5rem;line-height:1;color:#fff;text-shadow:0 0 24px var(--cc-glow,#3f8cff),0 6px 0 rgba(0,0,0,.4);animation:pop .7s var(--spring) infinite;}
/* Phones on their side: a slimmer game bar leaves more room for the screen */
@media (orientation:landscape) and (max-height:500px){
  html.ar-on .gbar{padding-top:calc(var(--safe-t) + 1px);padding-bottom:1px;}
  html.ar-on #app{padding-bottom:calc(var(--safe-b) + 4px);}
}
</style>
</head>

    rules:
      '<p class="goal">Centipedes crawl down through a glowing field of mushrooms, with spiders, wasps, ants and more close behind. Blast them before they reach you, beat the four bosses, and see how far you can go: after wave 10 the game keeps going, faster each time round.</p>' +
      '<h3>Flying and shooting</h3><ul><li><b>Phone or tablet:</b> put a finger down anywhere and drag. Your ship moves with your finger, like a trackball, so your thumb never hides it.</li>' +
      '<li>Your ship fires on its own. To fire only while a finger is down, change <b>Firing</b> on the setup screen, or tap <b>Auto-fire on or off</b> in the menu.</li>' +
      '<li>You can fly anywhere in the bottom part of the screen. The faint line shows the top of your area. Your ship flies over mushrooms.</li>' +
      '<li><b>Computer:</b> fly with the mouse, the arrow keys or WASD. With auto-fire off, hold the mouse button or Space to fire. F turns auto-fire on or off, P pauses.</li>' +
      '<li>Hold your phone or tablet sideways to play. If you turn it upright, the game pauses until you turn it back.</li></ul>' +
      '<h3>Waves</h3><p>A wave sends centipede after centipede: a new one comes in every few seconds, sooner once you\'ve cleared the field. Clear them all to finish the wave (<b>250</b> times the wave number as a bonus). The longer a wave goes on, the more bugs join in, and after 40 seconds fast black wasps start coming. Waves 3, 6, 9 and 10 are boss battles.</p>' +
      '<h3>The centipede</h3><ul><li>It crawls sideways. When it bumps a mushroom or the edge, it drops down a row and turns around. In your area it bounces back up a little and keeps coming.</li>' +
      '<li>Shoot a segment and it turns into a mushroom. The centipede splits in two, and the back half grows a new head (in later waves the back half is faster).</li>' +
      '<li>Body segment <b>10</b>, head <b>100</b>. Once a centipede gets into your area, extra heads crawl in from the sides.</li></ul>' +
      '<h3>Mushrooms</h3><p>Every wave sets its mushrooms out in its own pattern. A mushroom takes 3 hits and is worth <b>1</b> point (nothing during a boss fight).</p>' +
      '<h3>Other bugs</h3><ul><li><b>Spider</b>: zigzags through your area and eats mushrooms. <b>300</b>, <b>600</b> or <b>900</b>: the closer it is when you hit it, the more it\'s worth.</li>' +
      '<li><b>Flea</b>: drops straight down, leaving a trail of mushrooms. Takes 2 hits. <b>200</b>.</li>' +
      '<li><b>Wasp</b>: flies in, locks on to you and dive-bombs. <b>200</b>. A <b>black wasp</b> is faster, takes 2 hits and comes back round for another go. <b>400</b>.</li>' +
      '<li><b>Ants</b>: a sudden line marching across or down the field. <b>50</b> each.</li>' +
      '<li><b>Firefly</b>: flies down at an angle from a top corner. When its glow builds, a circle lights up under it: get out of the circle before it flashes. <b>250</b>.</li>' +
      '<li><b>Blast beetle</b>: walks down toward you and takes 3 hits. When it goes, it blows up the mushrooms and bugs around it. <b>300</b>.</li></ul>' +
      '<h3>Power-ups</h3><p>Power-ups are rare: one floats in high up every 20 to 30 seconds and stays about 12 seconds. Shoot it to take it (clear a path through the mushrooms if you need to).</p><ul>' +
      '<li><b>Scatter</b>: five shots in a fan.</li>' +
      '<li><b>Shock</b>: every hit throws lightning on to the nearest bugs.</li>' +
      '<li><b>Beam</b>: a laser straight up that goes through everything in its path.</li>' +
      '<li>Those three last 12 seconds. The ring around your ship shows the time left. Picking up a new one swaps it.</li>' +
      '<li><b>Bomb</b>: blows up everything near the ring, right away.</li>' +
      '<li><b>Shield</b>: 8 seconds when nothing can hurt you, and bugs that touch you get smashed.</li></ul>' +
      '<h3>Combos</h3><p>Hit bugs quickly, one after another. Every 5 in a row is a combo bonus: x5 is <b>100</b>, x10 is <b>200</b>, x15 is <b>300</b> and so on.</p>' +
      '<h3>Bosses</h3><p>Each boss is armoured: your shots bounce off except at its weak spot or in its weak moment. The bar at the top shows its health, and it gets angrier at two thirds and one third.</p><ul>' +
      '<li><b>Killer Wasp</b> (wave 3): follows you along the top, locks on, loops and dives straight at you. Dodge sideways, then get under it: only while it climbs back up, thorax glowing, can it be hurt. It sends ordinary wasps too.</li>' +
      '<li><b>Night Flyer</b> (wave 6): sweeps corner to corner, lighting up circles on the ground as it goes (the sides are the worst place to be), and brings fireflies. Between sweeps it rests at the top with its glowing core open: only the core takes damage.</li>' +
      '<li><b>Blast Beetle</b> (wave 9): crawls across lane by lane, lobbing fireballs that roll across the mushrooms and go off. Only straight shots on its head plate hurt it (Scatter bounces off). Shoot a fireball down near it and the blast hurts it too. It sends blast beetles.</li>' +
      '<li><b>Mega Spider</b> (wave 10): crawls along the top firing venom, spins web walls of mushrooms and sends baby spiders, then leaps over you and pounds the ground (move away from its shadow). It can only be hurt properly while it\'s down on the ground; up top only Beam and Shock get through, a little. <b>One life:</b> if you\'re hit during this fight, it\'s over (for you, online).</li></ul>' +
      '<p>Beating the Killer Wasp, the Night Flyer or the Blast Beetle is worth <b>10,000</b>. The Mega Spider is worth <b>100,000</b>. Every hit on a boss is <b>5</b>.</p>' +
      '<h3>Endless</h3><p>After wave 10 the waves start again from the first stage, with the wave number still counting up. Each time round everything is faster, the waves are longer, the bosses are tougher, and their bonuses go up.</p>' +
      '<h3>Lives</h3><p>Touching a bug, a boss, a boss\'s shot or a flashing circle costs a life. You\'re back a moment later, with a few seconds of safety. You get an extra life every <b>20,000</b> points. Arcade starts with 3 lives. Relaxed starts with 5, with slower bugs and weaker, slower bosses.</p>' +
      '<h3>Play online</h3><p>Two or three players, each on their own phone or tablet, play the same field together, like the three-player cabinet. Each player has their own coloured ship (blue, yellow, purple), score and lives. One opens a table; the others join it from the list (tables opened by people you\'ve linked show up first) or with the 4-letter code. Everyone shares the team score and also has their own. Bosses get tougher for each extra player. Extra lives come from the team score and go to everyone. If you lose your last life, you\'re back in at the start of the next wave, or sooner if the team earns an extra life. The game ends when everyone is out at once. Players can join a game already going. An online game can\'t be paused, and it ends for everyone if the host leaves.</p>' +

  // ═══ State ══════════════════════════════════════════════════════════════
  var G = null;          // the game (solo, or the host's copy online)

  var screen = 'none', paused = false, cfgLast = null, refit = false;

  }

  // ═══ Effects (also sent to the other devices online) ════════════════════

  function r1(v) { return Math.round(v * 10) / 10; }

  function boom(x, y, c, big) { ev(['x', r1(x), r1(y), c, big ? 1 : 0]); }
  function popup(x, y, t, c, big) { ev(['p', r1(x), r1(y), String(t), c || '#fff', big ? 1 : 0]); }

  function flash(c, a) { ev(['f', c, a]); }
  function banner(t, sub, c) { ev(['n', t, sub || '', c || '#ffffff']); }
  function ring(x, y, r, c) { ev(['r', r1(x), r1(y), r, c]); }
  function arc(x1, y1, x2, y2, c) { ev(['z', r1(x1), r1(y1), r1(x2), r1(y2), c || '#bff8ff']); }

  // ═══ A new game ═════════════════════════════════════════════════════════
  // cfg: {mode: 'solo'|'host', cols, rows, players: [{id, name, local}], diff}
  function makeGame(cfg) {

      grid: new Uint8Array(COLS * ROWS), pois: new Uint8Array(COLS * ROWS), md: cfg.mode === 'host' ? [] : null,
      chains: [], segs: [], foes: [], boss: null, shots: [], caps: [], bullets: [], zones: [], players: [],
      trainsLeft: 0, tTrain: 0, tSpider: 4, tFlea: 5, tWasp: 8, tAnt: 10, tFfly: 8, tBeetle: 10, tBlack: 0, tHead: 0, tCap: 14, inZone: false, oneLife: false,
      started: Date.now(), ended: false, best0: ArcadeHi.best(HI),

  function bugSpeed() { return DIFF[G.diff].spd * (waveDef(G.wave).speed || 1); }
  function spawnX(ci) { return [W / 2, W * 0.25, W * 0.75][ci] || W / 2; }
  function spawnY() { return H - 28; }

      inv: 2.5, respawn: 0, power: null, powerT: 0, shield: 0, fire: false, cool: 0, beamT: 0, beaming: false, side: 1, combo: 0, comboT: 0, benched: false,

  function isBossWave(n) { return !!waveDef(n).boss; }

    G.stats.maxWave = Math.max(G.stats.maxWave, n);
    G.chains = []; G.segs = []; G.foes = []; G.shots = []; G.caps = []; G.zones = []; G.boss = null; G.oneLife = false;
    G.trainsLeft = w.trains || 0; G.tTrain = 0;
    G.tSpider = rnd(3, 6); G.tFlea = rnd(4, 8); G.tWasp = rnd(7, 11); G.tAnt = rnd(9, 13); G.tFfly = rnd(5, 9); G.tBeetle = rnd(8, 12); G.tBlack = 0; G.tCap = rnd(12, 18);

  }
  function bossBonus(type) { return BOSS[type].bonus * (1 + (waveDef(G.wave).loop || 0)); }

  // ═══ Mushroom layouts: a designed pattern for each wave ═════════════════
  // Patterns are drawn in field fractions (u across, v down the upper field and a little into the
  // players' area), so the same design fits any field.
  function plant(w) {
    G.grid.fill(0); G.pois.fill(0);
    var top = 2, bot = Math.min(ROWS - 4, PZ + 1);
    function U(u) { return u * (COLS - 1); }
    function V(v) { return top + v * (bot - top); }
    function put(c, r) { c = Math.round(c); r = Math.round(r); if (c < 0 || c >= COLS || r < top || r > ROWS - 4) return; G.grid[idx(c, r)] = MUSH_HP; }

    function line(u0, v0, u1, v1, gap) {
      var c0 = U(u0), r0 = V(v0), c1 = U(u1), r1 = V(v1), d = Math.max(Math.abs(c1 - c0), Math.abs(r1 - r0)), n = Math.max(1, Math.round(d / (gap || 1.5)));
      for (var i = 0; i <= n; i++) put(c0 + (c1 - c0) * i / n, r0 + (r1 - r0) * i / n);
    }
    // a chevron: point at (u, v), arms going down (dir 1) or up (dir -1)
    function chev(u, v, dir, arm) { var du = 2 / (COLS - 1), dv = 1 / (bot - top); for (var k = 0; k <= arm; k++) { at(u - k * du, v + dir * k * dv); at(u + k * du, v + dir * k * dv); } }
    var p = w.pat, n, i, j;

      line(0.04, 0, 0.16, 0.62, 1.4); line(0.96, 0, 0.84, 0.62, 1.4);
      n = Math.max(2, Math.floor(COLS / 9));
      for (i = 0; i < n; i++) chev(0.28 + 0.44 * (n === 1 ? 0.5 : i / (n - 1)), 0.66, 1, 2);
      line(0.4, 0.22, 0.6, 0.22, 2);
    } else if (p === 'stripes') {
      n = Math.max(3, Math.round(COLS / 8));

      at(0.5, 0.42); at(0.5, 0.52);
    } else if (p === 'arrows') {
      n = Math.max(2, Math.floor(COLS / 8));

      line(0.02, 0.92, 0.12, 0.92, 2); line(0.88, 0.92, 0.98, 0.92, 2);
    } else if (p === 'rows') {
      [0.12, 0.45, 0.8].forEach(function (v, k) { for (var c = 1 + (k % 2) * 4; c < COLS - 1; c += 8) { put(c, V(v)); put(c + 1, V(v)); put(c + 2, V(v)); } });
    } else if (p === 'diamonds') {
      var nx = Math.max(2, Math.round(COLS / 11)), ny = 2;
      for (i = 0; i < nx; i++) for (j = 0; j < ny; j++) {

      for (i = 0; i < 6; i++) { var su = i % 2 ? rnd(0.03, 0.2) : rnd(0.8, 0.97), sv = rnd(0.1, 0.85); at(su, sv); at(su + 1 / COLS, sv); at(su, sv + 1 / (bot - top)); }
    }
  }

  // ═══ Centipedes ═════════════════════════════════════════════════════════

    if (P.shield > 0) P.shield = Math.max(0, P.shield - dt);

  // ── Bullets ──

  // ── The bugs ──

    if (pts >= 600) buzz(P && P.id, 'light');
  }
  function count(type) { var n = 0; G.foes.forEach(function (o) { if (o.type === type) n++; }); return n; }
  function nearPlayer(x, y) { return G.players.some(function (p) { return p.alive && Math.abs(p.x - x) < 16 && Math.abs(p.y - y) < 16; }); }
  function addFoe(o) { o.id = newId(); o.t = 0; G.foes.push(o); return o; }
  function spawnSpider(mini, x, y) {
    var left = Math.random() < 0.5, sp = bugSpeed();
    return addFoe({ type: mini ? 'mini' : 'spider', x: x != null ? x : left ? -12 : W + 12, y: y != null ? y : rnd(PZY - 20, H - 14), vx: (x != null ? (Math.random() < 0.5 ? 1 : -1) : left ? 1 : -1) * (mini ? 70 : 46) * sp, vy: 80, zt: 0, hp: 1, drop: y != null && y < PZY - 20 });
  }
  function spawnFlea() { sound('flea'); return addFoe({ type: 'flea', x: cx(ri(1, COLS - 2)), y: -8, vy: (105 + 10 * Math.min(8, G.wave)) * bugSpeed(), hp: 2, row: -1 }); }
  function spawnWasps(n, black) {
    for (var i = 0; i < n; i++) addFoe({ type: black ? 'bwasp' : 'wasp', st: 'in', x: rnd(20, W - 20), y: -10 - i * 18, ty: rnd(0.2, 0.62) * PZY, hp: black ? 2 : 1, aim: rnd(0.5, 0.9), loops: 0 });
    sound('flea');
  }
  // ants: a sudden line marching across (a random height) or down from the top (a random column)
  function spawnAnts() {
    var n = ri(5, 8), across = Math.random() < 0.55, sp = 58 * bugSpeed();
    if (across) { var left = Math.random() < 0.5, y = rnd(PZY * 0.35, H - 20); for (var i = 0; i < n; i++) addFoe({ type: 'ant', x: left ? -10 - i * 13 : W + 10 + i * 13, y: y, vx: left ? sp : -sp, vy: 0, hp: 1 }); }
    else { var x = rnd(20, W - 20); for (var j = 0; j < n; j++) addFoe({ type: 'ant', x: x, y: -10 - j * 13, vx: 0, vy: sp * 0.9, hp: 1 }); }
    sound('scorp');
  }
  function spawnFirefly(fromX, fromY) {
    var left = fromX != null ? fromX < W / 2 : Math.random() < 0.5, sp = bugSpeed();
    return addFoe({ type: 'ffly', x: fromX != null ? fromX : left ? -10 : W + 10, y: fromY != null ? fromY : rnd(0.08, 0.3) * PZY, vx: (left ? 1 : -1) * rnd(62, 80) * sp, vy: rnd(26, 36) * sp, hp: 1, tp: rnd(0.4, 1.2), glow: 0 });
  }
  function spawnBeetle(x, y) { return addFoe({ type: 'beetle', x: x != null ? x : rnd(20, W - 20), y: y != null ? y : -10, vx: 0, hp: 3 }); }
  function foesStep(dt) {

          if (!mini && key !== o.cell) { o.cell = key; if (mush(c, r) && Math.random() < 0.3) { setMush(c, r, 0); burst(cx(c), cx(r), themeOf(G).mush[0], 4, 0.6); } }
        }

      } else if (o.type === 'flea') {

  // Who comes in, wave by wave (see WAVES). Centipede trains arrive on a timer, sooner once the field is

  function spawnStep(dt) {

      if (G.trainsLeft > 0 && G.tTrain <= 0 && live < w.live) { spawnTrain(); G.tTrain = w.gap * rnd(0.85, 1.15); }

  // ── Enemy shots and power-up rings ──

  // ═══ Bosses ═════════════════════════════════════════════════════════════

  //     only the core takes damage.

  //     off. Its armour stops everything but straight shots on the head plate (Scatter bounces off). A fireball

  // ═══ End of a game ══════════════════════════════════════════════════════

    if (G) G.ended = true;
    Mus.stop(true);
    if (!R) {
      R = { won: !!won, wave: G.wave, score: G.score, players: G.players.map(function (p) { return { id: p.id, name: p.name, score: p.score, ci: p.ci }; }), stats: G.stats, started: G.started, diff: G.diff };
      if (G.mode === 'host') netOver(R);
    }
    var me = R.players.filter(function (p) { return p.id === myPid(); })[0] || R.players[0] || { name: 'Player', score: 0 };
    var online = R.players.length > 1 || !!net.mode, st = R.stats || {}, h = [];

    if (st.bosses) h.push('Beat ' + st.bosses + (st.bosses === 1 ? ' boss' : ' bosses'));
    if (st.segs) h.push('Shot ' + st.segs + ' centipede segments (' + (st.heads || 0) + ' heads)');
    if (st.spiders) h.push('Got ' + st.spiders + (st.spiders === 1 ? ' spider' : ' spiders'));
    if (st.powers) h.push('Picked up ' + st.powers + (st.powers === 1 ? ' power-up' : ' power-ups'));
    if (st.combo >= 5) h.push('Best combo x' + st.combo);

      started: R.started || null, mode: (online ? 'Online co-op' : 'Solo') + ' · ' + (DIFF[R.diff] || DIFF.arcade).name,
      players: online ? R.players.map(function (p) { return { name: p.name, score: p.score }; }) : [{ name: me.name, score: R.score }],
      winner: online ? null : undefined, highlights: h,
      summary: (online ? fmt(R.score) + ' team · ' : fmt(R.score) + ' points · ') + (R.won ? 'garden saved' : 'wave ' + R.wave),
      badge: R.won ? 'Saved' : 'Wave ' + R.wave,
      meta: { score: R.score, wave: R.wave, won: !!R.won, online: online }

    var best0 = G ? G.best0 : ArcadeHi.best(HI), best = myScore > best0 && myScore > 0;

        sub: (online ? 'Team ' + fmt(R.score) + ' · you ' + fmt(me.score) : fmt(R.score) + ' points') + ' · ' + (R.won ? 'all 10 waves' : 'wave ' + R.wave),
        rank: online ? R.players.slice().sort(function (a, b) { return b.score - a.score; }).map(function (p) { return { name: p.name, score: fmt(p.score), color: PCOL[p.ci % 3] }; }) : null,

  // ═══ Online ═════════════════════════════════════════════════════════════
  // The host's device runs the game. Every 50 ms it sends everyone a snapshot (fast lane: positions of
  // everything that moves) and, on the reliable lane, the effects and mushroom changes since the last one
  // (the whole field, with its shape, at the start of each wave). Each guest sends its ship's position and
  // fire button about 30 times a second, moves its own ship at once (so it feels instant) and draws
  // everything else 100 ms in the past, smoothly between two snapshots.
  var net = { mode: null, table: null, peer: null, roster: [], evq: [], snapT: 0, seq: 0, lobby: null, wait: null, gridDirty: false, pidN: 1, inT: 0, me: null, hostName: '' };

    var s = lsGet('centi_opts', {}) || {}; ctl.auto = s.auto !== false; ctl.drag = DRAG[s.drag] || DRAG.normal;
    net.lobby = Online.lobby(app, {
      game: 'centipede', title: 'Play Online', max: 3,
      intro: 'Two or three players, each on their own device, on the same field.',
      me: { name: meName() },
      onName: function (n) { var m = lsGet(NETME, {}) || {}; m.name = n; lsSet(NETME, m); },
      onHost: function (me) { hostTable(me.name); },
      onJoin: function (code, room, me) { joinTable(code, me.name); },
      onSolo: function () { showSetup(); }, solo: 'Play solo instead',
      sub: function (r) { return r.status === 'playing' ? (r.info || 'Playing') + ' · ' + (r.n || 1) + ' of 3 · join in' : (r.n || 1) + ' of 3 players'; },
      note: 'Each device connects straight to the host’s. If a device can’t connect, try both on the same Wi-Fi.'
    });
    window.scrollTo(0, 0);
  }
  function closeLobby() { if (net.lobby) { net.lobby.close(); net.lobby = null; } }
  function busy(text) { app.innerHTML = ''; app.appendChild(el('div', { class: 'ol' }, [el('div', { class: 'ol-row' }, [el('i', { class: 'ol-spin' }), el('div', { class: 'grow' }, [el('b', { text: text })])])])); }

  // ── Hosting ──
  function hostTable(name) {
    closeLobby(); busy('Opening your table…');
    Online.host({ game: 'centipede', name: name, max: 3 }).then(function (table) {
      // the server refused the new table: back to the lobby instead of a waiting room nobody can find
      table.on('fail', function (e) { Kit.toast('Couldn’t open a table. ' + (Online.errText ? Online.errText(e) : '')); leaveOnline(false); goLobby(); });
      net.mode = 'host'; net.table = table; net.me = name; net.pidN = 1;
      net.roster = [{ pid: 1, name: name, dev: Online.dev(), host: true }];
      table.on('peer', function (peer) {
        peer._pid = ++net.pidN;
        peer.send({ t: 'hi', you: peer._pid }, true);
        net.roster.push({ pid: peer._pid, name: uniqueName(peer.name), dev: peer.id, peer: peer });
        sendRoster();
        Kit.toast(peerName(peer) + ' joined'); Kit.sfx('pop');
        if (G && G.mode === 'host' && !G.ended) {     // joining a game already going
          var P = addPlayer({ id: peer._pid, name: peerName(peer), dev: peer.id });
          popup(P.x, P.y - 14, P.name + ' joined', P.color, true); sound('extra');
          sendInit(peer);
        }
      });
      table.on('leave', function (peer) {
        net.roster = net.roster.filter(function (r) { return r.peer !== peer; });
        sendRoster();
        Kit.toast(peerName(peer) + ' left');
        if (G && G.mode === 'host') {
          var P = G.players.filter(function (p) { return p.id === peer._pid; })[0];
          if (P) { if (P.alive) burst(P.x, P.y, P.color, 20, 1.2); G.players.splice(G.players.indexOf(P), 1); G.bullets = G.bullets.filter(function (b) { return b.o !== P.id; }); }
        }
      });
      table.on('msg', function (peer, m) {
        if (m.t === 'i' && G && G.mode === 'host') {
          var P = G.players.filter(function (p) { return p.id === peer._pid; })[0];
          if (P) { P.tx = m.x / 4; P.ty = m.y / 4; P.fire = !!m.f; P.lastIn = performance.now(); }
        }
      });
      showWait();
    }).catch(function (e) { Kit.toast('Couldn’t open a table. ' + Online.errText(e)); goLobby(); });
  }

  function sendRoster() { if (net.table) net.table.broadcast(rosterMsg(), true); if (net.wait) net.wait.update(waitPlayers(net.roster, 1)); }
  function waitPlayers(ro, mePid) { return ro.map(function (r, i) { return { name: r.name, host: !!r.host, me: r.pid === mePid, color: PCOL[i % 3] }; }); }
  function showWait() {
    leaveView(); closeLobby(); screen = 'wait'; app.className = 'stage'; root.classList.remove('ar-on');
    if (net.mode === 'host') {

    } else {

  function hostStart() {

  }
  function q4(v) { return Math.round(v * 4); }
  function ang(vx, vy) { return Math.round(Math.atan2(vy, vx) * 100); }
  function netHostTick() {
    var now = performance.now();
    if (now - net.snapT < 50) return;
    net.snapT = now;
    var t = net.table; if (!t || !t.count()) { net.evq = []; if (G.md) G.md.length = 0; net.gridDirty = false; return; }
    if (net.gridDirty) { net.gridDirty = false; G.md = []; t.broadcast({ t: 'e', ev: net.evq, w: G.wave, g: gridStr(), fc: COLS, fr: ROWS }, true); net.evq = []; }
    else if (net.evq.length || G.md.length) { t.broadcast({ t: 'e', ev: net.evq, m: G.md, w: G.wave }, true); net.evq = []; G.md = []; }
    var s = { t: 's', q: ++net.seq, tm: Math.round(now), w: G.wave, ph: PH.indexOf(G.phase), pt: Math.round(G.phaseT * 10), sc: G.score, c: [], f: [], k: [], u: [], cp: [], p: [], b: 0 };
    G.segs.forEach(function (sg) { s.c.push(sg.id, q4(sg.x), q4(sg.y), (sg.head ? 1 : 0) | (sg.dx < 0 ? 2 : 0) | (sg.frz ? 4 : 0)); });
    G.foes.forEach(function (o) { s.f.push(o.id, FT.indexOf(o.type), q4(o.x), q4(o.y), o.hp, (o.vx < 0 ? 1 : 0) | (o.frz > 0 ? 2 : 0)); });
    G.shots.forEach(function (o) { s.k.push(o.id, KT.indexOf(o.k), q4(o.x), q4(o.y), ang(o.vx, o.vy)); });
    G.bullets.forEach(function (b) { s.u.push(b.id, b.o, q4(b.x), q4(b.y), BK.indexOf(b.k), ang(b.vx, b.vy)); });
    G.caps.forEach(function (c) { s.cp.push(c.id, POWK.indexOf(c.k), q4(c.x), q4(c.y)); });
    G.players.forEach(function (p) { s.p.push([p.id, q4(p.x), q4(p.y), (p.alive ? 1 : 0) | (p.inv > 0 ? 2 : 0) | (p.flaming ? 4 : 0), p.lives, p.score, p.power ? POWK.indexOf(p.power) + 1 : 0, Math.round(p.powerT * 10), p.ci, p.name, Math.round(p.shield * 10)]); });
    if (G.boss) { var B = G.boss; s.b = [B.id, BT.indexOf(B.type), q4(B.x), q4(B.y), Math.round(B.hp * 10) / 10, Math.round(B.max * 10) / 10, BST.indexOf(B.st), Math.round(B.lit * 100), B.flash > 0 ? 1 : 0, B.enraged ? 1 : 0, B.lane == null ? -1 : q4(B.lane), B.frz > 0 ? 1 : 0]; }
    t.broadcast(s, false);
  }
  function netOver(R) {
    if (!net.table) return;
    if (net.evq.length || G.md.length) { net.table.broadcast({ t: 'e', ev: net.evq, m: G.md }, true); net.evq = []; G.md = []; }
    net.table.broadcast({ t: 'over', r: R }, true);
    net.table.setStatus('open', '');
  }
  function backToTable() {
    if (net.mode === 'host' && net.table && !net.table.closed) { G = null; showWait(); sendRoster(); return; }
    if (net.mode === 'guest' && net.peer && !net.peer.closed) { GV = null; showWait(); return; }
    leaveOnline(false); goLobby();
  }

  // ── Joining ──
  function joinTable(code, name) {
    closeLobby(); busy('Connecting to the table…');
    Online.join(code, { game: 'centipede', name: name }).then(function (peer) {
      net.mode = 'guest'; net.peer = peer; net.hostName = peer.name; net.me = name; net.roster = []; net.myPid = null;
      peer.on('msg', guestMsg);
      peer.on('close', function (why) {
        if (net.peer !== peer) return;
        var playing = screen === 'game' && GV && !GV.ended;
        net.peer = null; net.mode = null;
        if (playing) { GV.ended = true; var res = GV.lastRes(); endGame(false, res, (net.hostName || 'The host') + (why === 'host' || why === 'left' ? ' left the game' : '’s table lost its connection')); }
        else if (screen === 'wait') { Kit.toast((net.hostName || 'The host') + ' closed the table'); goLobby(); }
      });
      showWait();
    }).catch(function (e) {
      var msg = e && e.nat ? e.message : Online.errText(e);
      if (e && e.nat) Kit.sheet({ title: 'Couldn’t connect', html: '<p>' + Kit.esc(msg) + '</p>' }); else Kit.toast(msg);
      goLobby();
    });
  }
  function guestMsg(m) {
    if (m.t === 'hi') { net.myPid = m.you; return; }
    if (m.t === 'ro') { net.roster = m.ro; if (net.wait) net.wait.update(waitPlayers(m.ro, net.myPid)); if (GV) GV.names = m.ro; return; }
    if (m.t === 'init') { net.myPid = m.you; net.roster = m.ro; guestStart(m); return; }
    if (!GV) return;
    if (m.t === 's') { guestSnap(m); return; }
    if (m.t === 'e') { setTimeout(function () { if (!GV) return; if (m.g) guestGrid(m.g, m.fc, m.fr); else guestDiffs(m.m); (m.ev || []).forEach(applyFx); }, DELAY); return; }
    if (m.t === 'over') { var R = m.r; setTimeout(function () { if (!GV || GV.ended) return; GV.ended = true; GV.phase = R.won ? 'won' : 'over'; GV.phaseT = 0; setTimeout(function () { endGame(R.won, R); }, 1800); }, DELAY); }
  }
  // the whole field from the host (a new wave), and its shape if that changed
  function guestGrid(gs, fc, fr) {
    if (fc && fr && (fc !== COLS || fr !== ROWS)) { setField(fc, fr); refit = true; }
    GV.grid = new Uint8Array(COLS * ROWS); GV.pois = new Uint8Array(COLS * ROWS);
    for (var i = 0; i < gs.length && i < GV.grid.length; i++) { var v = gs.charCodeAt(i) - 48; GV.grid[i] = v & 3; GV.pois[i] = v >= 4 ? 1 : 0; }
  }
  function guestStart(m) {
    net.wait = null;
    Array.prototype.forEach.call(document.querySelectorAll('.k-win'), function (n) { n.remove(); });
    setField(m.fc || FIELD[0], m.fr || FIELD[1]);
    GV = { mode: 'guest', me: m.you, ci: 0, grid: null, pois: null, wave: m.w, phase: PH[m.ph] || 'intro', phaseT: 0, score: 0,
      segs: [], foes: [], shots: [], bullets: [], caps: [], players: [], boss: null, buf: [], off: null, lastAt: performance.now(),
      pred: { x: W / 2, y: H - 16, alive: false, cool: 0, side: 1 }, lb: [], flameLocal: false, power: null, hostName: m.host || net.hostName, stall: false, ended: false, sendT: 0, diff: m.diff, started: Date.now() };
    guestGrid(m.g, m.fc, m.fr);
    GV.lastRes = function () { return { won: false, wave: GV.wave, score: GV.score, players: GV.players.map(function (p) { return { id: p.id, name: p.name, score: p.score, ci: p.ci }; }), stats: {}, started: GV.started, diff: GV.diff }; };
    G = null;
    Kit.gameStart();
    buildView();
  }
  function guestDiffs(md) { if (!md) return; for (var i = 0; i + 2 < md.length; i += 3) { if (md[i] < GV.grid.length) { GV.grid[md[i]] = md[i + 1]; GV.pois[md[i]] = md[i + 2]; } } }
  function guestSnap(s) {
    var now = performance.now(), sample = s.tm - now;
    GV.off = GV.off == null ? sample : Math.max(sample, GV.off - 1);
    GV.lastAt = now;
    var b = GV.buf; if (b.length && s.q <= b[b.length - 1].q) return;
    b.push(s); if (b.length > 14) b.shift();
  }
  function lerpArr(A, B, stride, a, build) {
    var out = [], map = {};
    if (A) for (var i = 0; i < A.length; i += stride) map[A[i]] = i;
    for (var j = 0; j < B.length; j += stride) {
      var k = map[B[j]], x = B[j + 2] / 4, y = B[j + 3] / 4;
      if (k != null && A) { x = A[k + 2] / 4 + (x - A[k + 2] / 4) * a; y = A[k + 3] / 4 + (y - A[k + 3] / 4) * a; }

    }
    return out;
  }
  function guestFrame(dt) {
    var V = GV, now = performance.now();
    V.phaseT += dt;
    V.stall = !V.ended && now - V.lastAt > 1500;
    if (V.buf.length) {
      var rt = now + V.off - DELAY, b = V.buf, A = b[0], B = b[b.length - 1];
      for (var i = 0; i < b.length - 1; i++) if (b[i].tm <= rt && b[i + 1].tm >= rt) { A = b[i]; B = b[i + 1]; break; }
      if (rt >= b[b.length - 1].tm) A = B = b[b.length - 1];
      else if (rt <= b[0].tm) A = B = b[0];
      var a = B.tm > A.tm ? clamp((rt - A.tm) / (B.tm - A.tm), 0, 1) : 1;
      if (V.wave !== B.w) V.wave = B.w;
      var ph = PH[B.ph]; if (!V.ended && ph !== V.phase) { V.phase = ph; V.phaseT = B.pt / 10; }
      V.score = B.sc;
      V.segs = lerpArr(A.c, B.c, 4, a, function (r, j, x, y) { return { id: r[j], x: x, y: y, head: !!(r[j + 3] & 1), dx: r[j + 3] & 2 ? -1 : 1, frz: !!(r[j + 3] & 4) }; });
      V.foes = lerpArr(A.f, B.f, 6, a, function (r, j, x, y) { return { id: r[j], type: FT[r[j + 1]], x: x, y: y, hp: r[j + 4], vx: r[j + 5] & 1 ? -1 : 1, frz: r[j + 5] & 2 ? 1 : 0 }; });
      V.shots = lerpArr(A.k, B.k, 5, a, function (r, j, x, y) { var an = r[j + 4] / 100; return { id: r[j], k: KT[r[j + 1]], x: x, y: y, vx: Math.cos(an), vy: Math.sin(an) }; });
      V.bullets = lerpArr(A.u, B.u, 6, a, function (r, j, x, y) { var an = r[j + 5] / 100; return { id: r[j], o: r[j + 1], x: x, y: y, k: BK[r[j + 4]], vx: Math.cos(an) * 100, vy: Math.sin(an) * 100 }; });
      V.caps = lerpArr(A.cp, B.cp, 4, a, function (r, j, x, y) { return { id: r[j], k: POWK[r[j + 1]], x: x, y: y }; });
      if (B.b) {
        var bb = B.b, ab = A.b && A.b[0] === bb[0] ? A.b : bb;
        if (Math.abs(bb[2] - ab[2]) > 400 || Math.abs(bb[3] - ab[3]) > 400) ab = bb;   // a jump (the Wasp back in at the top, the Firefly moving in the dark): don't slide across
        var bx = ab[2] / 4 + (bb[2] - ab[2]) / 4 * a, by = ab[3] / 4 + (bb[3] - ab[3]) / 4 * a;
        if (!V.boss || V.boss.id !== bb[0]) V.boss = { id: bb[0] };
        var VB = V.boss; VB.type = BT[bb[1]]; VB.x = bx; VB.y = by; VB.hp = bb[4]; VB.max = bb[5]; VB.st = BST[bb[6]]; VB.lit = bb[7] / 100; VB.hitf = !!bb[8]; VB.flash = 0; VB.enraged = !!bb[9]; VB.lane = bb[10] == null || bb[10] < 0 ? null : bb[10] / 4; VB.frz = bb[11] ? 1 : 0;
      } else V.boss = null;

      var wasAlive = V.pred.alive;

        var o = pm[p[0]] || p, P = { id: p[0], x: o[1] / 4 + (p[1] - o[1]) / 4 * a, y: o[2] / 4 + (p[2] - o[2]) / 4 * a, alive: !!(p[3] & 1), inv: p[3] & 2 ? 1 : 0, flaming: !!(p[3] & 4), lives: p[4], score: p[5], power: p[6] ? POWK[p[6] - 1] : null, powerT: p[7] / 10, ci: p[8], name: p[9], shield: (p[10] || 0) / 10 };
        if (P.id === V.me) { V.ci = P.ci; V.power = P.power; if (P.alive && !wasAlive) { V.pred.x = p[1] / 4; V.pred.y = p[2] / 4; } V.pred.alive = P.alive; }
        return P;
      });
    }

  }
  // A guest's own ship: moved here straight away; its plain, rapid and ice shots are drawn here too (the
  // host's copy decides what they hit). Homing missiles and hits come from the host.
  function guestLocal(dt) {
    var V = GV, P = V.pred;
    V.flameLocal = false;
    if (P.alive && !V.ended) {
      var m = takeInput(P, dt); movePlayer(P, m[0], m[1]);
      var f = firing();
      V.sendT -= dt;
      if (V.sendT <= 0 && net.peer) { V.sendT = 1 / 30; net.peer.send({ t: 'i', x: q4(P.x), y: q4(P.y), f: f ? 1 : 0 }, false); }
      P.cool -= dt;
      var pw = V.power;
      if (f && pw === 'flame') { V.flameLocal = true; snd('flame'); }
      else if (f && P.cool <= 0 && pw !== 'homing') {
        if (pw === 'rapid') { P.side = -P.side; V.lb.push({ x: P.x + P.side * 3.4, y: P.y - 9, vx: 0, vy: -BSPD.rapid, k: 'rapid' }); P.cool = 0.065; snd('rapid'); }
        else if (pw === 'ice') { [-0.34, -0.17, 0, 0.17, 0.34].forEach(function (an) { V.lb.push({ x: P.x, y: P.y - 9, vx: Math.sin(an) * BSPD.ice, vy: -Math.cos(an) * BSPD.ice, k: 'ice' }); }); P.cool = 0.17; snd('ice'); }
        else { V.lb.push({ x: P.x, y: P.y - 9, vx: 0, vy: -BSPD.laser, k: 'laser' }); P.cool = 0.12; snd('shot'); }
      } else if (f && pw === 'homing' && P.cool <= 0) { P.cool = 0.32; snd('homing'); }
    } else if (net.peer && !V.ended) { V.sendT -= dt; if (V.sendT <= 0) { V.sendT = 0.2; net.peer.send({ t: 'i', x: q4(P.x), y: q4(P.y), f: 0 }, false); } }
    for (var i = V.lb.length - 1; i >= 0; i--) {
      var b = V.lb[i], n = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 4), gone = false;
      for (var s = 0; s < n && !gone; s++) {
        b.x += b.vx * dt / n; b.y += b.vy * dt / n;
        if (b.y < -8 || b.x < -8 || b.x > W + 8) { gone = true; break; }
        var cc = Math.floor(b.x / CELL), rr = Math.floor(b.y / CELL);
        if (inField(cc, rr) && V.grid[idx(cc, rr)]) gone = true;
        for (var k = 0; k < V.segs.length && !gone; k++) if (Math.abs(V.segs[k].x - b.x) < 6 && Math.abs(V.segs[k].y - b.y) < 6) gone = true;
        for (var f2 = 0; f2 < V.foes.length && !gone; f2++) if (Math.abs(V.foes[f2].x - b.x) < 10 && Math.abs(V.foes[f2].y - b.y) < 7.5) gone = true;
        for (var c2 = 0; c2 < V.caps.length && !gone; c2++) if (Math.abs(V.caps[c2].x - b.x) < 8 && Math.abs(V.caps[c2].y - b.y) < 8) gone = true;
        if (!gone && V.boss && V.boss.st !== 'die') { var R = BOSS[V.boss.type].r, ex = (b.x - V.boss.x) / R[0], ey = (b.y - V.boss.y) / R[1]; if (ex * ex + ey * ey < 1 && !(V.boss.type === 'firefly' && V.boss.lit < 0.45)) gone = true; }
      }

  }

  // ── Leaving ──
  // ask: confirm first (from a menu or button). quiet: the page is closing
  function leaveOnline(ask, quiet) {
    if (!net.mode) { closeLobby(); return; }
    if (ask) {
      var body = net.mode === 'host' ? 'The game ends for everyone at your table.' : 'You can join again from the list.';
      Kit.confirm(screen === 'game' ? 'Leave the game?' : 'Leave the table?', { ok: 'Leave', body: body }).then(function (ok) { if (ok) { leaveOnline(false); goLobby(); } });
      return;
    }
    if (net.table) net.table.close();
    if (net.peer) { var p = net.peer; net.peer = null; p.close('left'); }
    net.mode = null; net.table = null; net.wait = null; net.roster = [];
    if (!quiet) { GV = null; if (G && G.mode === 'host') G = null; }
    closeLobby();
  }

  // ═══ Test hooks (automated checks) ══════════════════════════════════════
  window.__centi = {
    state: function () { return G; }, view: function () { return GV; }, net: net, ctl: ctl, perf: perf,
    solo: function (o) { o = o || {}; applyOpts({}); startSolo({ who: o.who || 'Tim', diff: o.diff || 'arcade' }); },
    hold: function (on) { hold = !!on; },
    run: function (sec) { var n = Math.round(sec / STEP); for (var i = 0; i < n && G && !G.ended; i++) { sim(STEP); if (G.mode === 'host') netHostTick(); fxStep(STEP); if (n - i < 24) { lastDraw = performance.now() - STEP * 1000; draw(); } } if (refit) { refit = false; cssW = 0; fit(); } lastDraw = performance.now() - STEP * 1000; draw(); },
    step: function (n) { for (var i = 0; i < n && G && !G.ended; i++) sim(STEP); },     // simulate without drawing
    threats: function (on) { if (on) G.threats = []; return G.threats; },               // with god on: what would have hit
    field: function () { var rows = []; for (var r = 0; r < ROWS; r++) { var n = 0; for (var c = 0; c < COLS; c++) if (G.grid[idx(c, r)]) n++; rows.push(n); } return rows; },
    dims: function () { return { cols: COLS, rows: ROWS, W: W, H: H, PZ: PZ, PZY: PZY, S: S, canvas: cv ? [cv.width, cv.height, cv.style.width, cv.style.height] : null }; },
    put: function (c, r, hp, po) { setMush(c, r, hp, po); },
    consts: { CELL: CELL, WAVES: WAVES, BOSS: BOSS, BDMG: BDMG, POWK: POWK, THEMES: THEMES },
    wave: function (n) { G.chains = []; G.segs = []; G.boss = null; G.foes = []; G.shots = []; startWave(n); },
    clearWave: function () { G.chains = []; G.segs = []; if (G.boss) G.boss.hp = 1; },
    god: function (on) { G.noDie = !!on; },
    power: function (k, pid) { var P = pid ? G.players.filter(function (p) { return p.id === pid; })[0] : G.players[0]; if (k === 'shield') P.shield = SHIELD_T; else if (k === 'bomb') bomb(P, P.x, P.y - 40); else { P.power = k; P.powerT = POW_T; } },
    cap: function (k, x, y) { G.caps.push({ id: newId(), x: x, y: y, k: k, t: 0 }); },
    move: function (x, y) { var P = G.players[0]; P.x = x; P.y = y; },
    fire: function (on) { ctl.keys[' '] = !!on; },
    auto: function (on) { ctl.auto = !!on; },
    kill: function () { killPlayer(G.players[0]); },
    hitBoss: function (n) { for (var i = 0; i < n; i++) hitBoss(G.players[0], 1, G.boss.x, G.boss.y); },
    lobby: function () { goLobby(); }, host: function (n) { hostTable(n || 'Tim'); }, join: function (c, n) { joinTable(c, n || 'Sam'); }, start: function () { hostStart(); },
    draw: function () { draw(); }, fx: fx, prof: function () { var o = {}, t0 = performance.now(); mushSpr('green', 3, 0); o.mush = performance.now() - t0; t0 = performance.now(); txt('Wave 9', '#ffffff', 9, '#ff0000'); o.txtGlow = performance.now() - t0; t0 = performance.now(); txt('Wave 9', '#ffffff', 5); o.txt = performance.now() - t0; t0 = performance.now(); capSpr('ice'); o.cap = performance.now() - t0; t0 = performance.now(); segSpr('green', true, 0, 0, 0); o.seg = performance.now() - t0; for (var k in o) o[k] = Math.round(o[k]); return o; }, bgTime: function (tk) { var t0 = performance.now(); bgSpr(tk); return Math.round(performance.now() - t0); }, sprites: function () { return Object.keys(SPX).length; }
  };
  window.__cc = window.__centi;

  // ═══ Boot ═══════════════════════════════════════════════════════════════
  bindInput();
  (function () {
    var s = lsGet('centi_opts', {}) || {}; ctl.auto = s.auto !== false; ctl.drag = DRAG[s.drag] || DRAG.normal;
    if (/[?&]online=1/.test(location.search)) goLobby(); else showSetup();
  })();
})();

<style>
/* ── Play view: the arcade screen fills the page, no page scroll ─────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(120% 70% at 50% 45%,#0b1238 0%,#050818 60%,#020309 100%);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:none;margin:0;
  padding:0 calc(6px + var(--corner-x)) calc(var(--safe-b) + 6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.cc-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
/* the screen: a thin dark bezel lit by the stage colour */
.cc-cab{position:relative;padding:2px;border-radius:12px;background:#01020a;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--cc-glow,#3f8cff) 55%,transparent),0 0 30px -8px var(--cc-glow,#3f8cff),0 16px 40px rgba(0,0,0,.6);
  transition:box-shadow .8s;}
.cc-cab canvas{display:block;border-radius:10px;position:relative;}
.cc-cab canvas.cc-floor{position:absolute;left:2px;top:2px;background:#02040e;}
/* a slow band of light sweeping down the floor (drawn by the browser, not the game loop) */
.cc-sweep{position:absolute;inset:2px;border-radius:10px;overflow:hidden;pointer-events:none;mix-blend-mode:screen;}
.cc-sweep::before{content:"";position:absolute;left:0;right:0;top:0;height:32%;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--cc-glow,#3f8cff) 16%,transparent),transparent);
  animation:cc-sweep 12s linear infinite;}
@keyframes cc-sweep{from{transform:translateY(-110%);}to{transform:translateY(330%);}}
@media (prefers-reduced-motion:reduce){.cc-sweep{display:none;}}
.ar-ov{position:absolute;inset:2px;border-radius:10px;display:none;align-items:center;justify-content:center;z-index:4;
  background:rgba(2,6,20,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.ar-ov.show{display:flex;animation:pop .3s var(--spring);}
.ar-ov .card{width:min(260px,86%);text-align:center;padding:20px 16px 14px;border-radius:var(--r-lg);background:var(--bg-2);box-shadow:var(--shadow);}
.ar-ov h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 2px;}
.ar-ov p{color:var(--text-2);margin:0 0 12px;font-weight:700;font-size:.92rem;}
.ar-ov .btn{margin-top:8px;}
.cc-pbtn svg{width:22px;height:22px;}
.ar-hint{flex:none;font-size:.8rem;color:var(--text-3);text-align:center;font-weight:700;}
@media (hover:hover) and (pointer:fine){ .ar-touch{display:none!important;} .cc-cab canvas{cursor:none;} }
@media (hover:none),(pointer:coarse){ .ar-desk{display:none!important;} }
@media (max-height:700px){ .ar-hint{display:none;} }
/* back from upright: 3, 2, 1 */
.cc-count{font-family:var(--display);font-size:5rem;line-height:1;color:#fff;text-shadow:0 0 24px var(--cc-glow,#3f8cff),0 6px 0 rgba(0,0,0,.4);animation:pop .7s var(--spring) infinite;}
/* Phones on their side: a slimmer game bar leaves more room for the screen */
@media (orientation:landscape) and (max-height:500px){
  html.ar-on .gbar{padding-top:calc(var(--safe-t) + 1px);padding-bottom:1px;}
  html.ar-on #app{padding-bottom:calc(var(--safe-b) + 4px);}
}
</style>
</head>

    rules:
      '<p class="goal">Centipedes crawl down through a glowing field of mushrooms, with spiders, wasps, ants and more close behind. Blast them before they reach you, beat the four bosses, and see how far you can go: after wave 10 the game keeps going, faster each time round.</p>' +
      '<h3>Flying and shooting</h3><ul><li><b>Phone or tablet:</b> put a finger down anywhere and drag. Your ship moves with your finger, like a trackball, so your thumb never hides it.</li>' +
      '<li>Your ship fires on its own. To fire only while a finger is down, change <b>Firing</b> on the setup screen, or tap <b>Auto-fire on or off</b> in the menu.</li>' +
      '<li>You can fly anywhere on the field, right up to the top. Your ship flies over mushrooms.</li>' +
      '<li><b>Computer:</b> fly with the mouse, the arrow keys or WASD. With auto-fire off, hold the mouse button or Space to fire. F turns auto-fire on or off, P pauses.</li>' +
      '<li>Hold your phone or tablet sideways to play. If you turn it upright, the game pauses until you turn it back.</li></ul>' +
      '<h3>Waves</h3><p>Each wave has its own colours and its own mushroom layout, and sends its centipedes and bugs in a set order (later waves pick from a few layouts). Clear every centipede to finish the wave (<b>250</b> times the wave number as a bonus). If a wave, or a boss fight, drags past 40 seconds, fast black wasps start coming. Waves 3, 6, 9 and 10 are boss battles.</p>' +
      '<h3>The centipede</h3><ul><li>It crawls sideways. When it bumps a mushroom or the edge, it drops down a row and turns around. At the bottom it turns back up and keeps coming.</li>' +
      '<li>Shoot a segment and it turns into a mushroom. The centipede splits in two, and the back half grows a new head (in later waves the back half is faster).</li>' +
      '<li>Body segment <b>25</b>, head <b>100</b>. Once a centipede gets low, loose heads crawl in from the sides now and then.</li></ul>' +
      '<h3>Mushrooms</h3><p>A mushroom takes 3 hits. They\'re worth nothing: they\'re just in the way.</p>' +
      '<h3>Other bugs</h3><ul><li><b>Spider</b>: comes in at a bottom corner and zigzags fast up and down the lower field, eating mushrooms. <b>300</b>, <b>600</b> or <b>900</b>: the closer it is when you hit it, the more it\'s worth.</li>' +
      '<li><b>Flea</b>: drops straight down, leaving a trail of mushrooms. Takes 2 hits. <b>200</b>.</li>' +
      '<li><b>Wasp</b>: swoops in from the side, sometimes with a loop first, then homes in on you, faster the longer it chases. Dodge so it dives into the floor: it slows right down there. <b>200</b>. A <b>black wasp</b> is faster and takes 2 hits. <b>400</b>.</li>' +
      '<li><b>Ants</b>: a pair marches in from each side, then a column comes down from the top. <b>50</b> each.</li>' +
      '<li><b>Fireflies</b>: a small group flies straight across from a top corner. <b>250</b> each.</li>' +
      '<li><b>Bomb beetle</b>: the bug in the red rings. It crawls slowly toward you and blows up when shot, when it reaches you, or on its own when its rings flash fast. The blast takes out mushrooms, bugs and any ship close by, so shoot it from a distance or keep away. <b>300</b>.</li></ul>' +
      '<h3>Power-ups</h3><p>A power-up floats in every 20 to 30 seconds. Shoot it or fly into it to take it. While you have one, its name and ammo bar show in place of your lives (bottom left); what\'s left is gone at the end of the wave.</p><ul>' +
      '<li><b>Scatter</b>: three shots in a spread, 30 times.</li>' +
      '<li><b>Shock</b>: every hit throws lightning on to the nearest bugs, for 50 shots.</li>' +
      '<li><b>Bomb</b>: 10 bombs that fly up and blow up the first thing they hit, taking everything around it with them.</li>' +
      '<li>Those three use ammo only as they fire: with nothing to shoot, turn auto-fire off to save it.</li>' +
      '<li><b>Beam</b>: a laser straight up that goes through everything in its path. It burns out about 4 seconds after you first fire it, whether you keep firing or not.</li></ul>' +
      '<h3>Combos</h3><p>Hit bugs quickly, one after another. Every 5 in a row is a combo bonus: x5 is <b>100</b>, x10 is <b>200</b>, x15 is <b>300</b> and so on.</p>' +
      '<h3>Bosses</h3><p>Every hit on a boss counts, in every move it makes: keep firing and stay out of its way. Watch for the moment it stops and gets ready: that\'s when it attacks, and when it\'s easiest to hit.</p><ul>' +
      '<li><b>Killer Wasp</b> (wave 3): flies little circles at the middle, then the right, then the left. When it pulls back to the top and glows white, look out: it may dive straight down in a streak of fire (or it\'s bluffing). Small wasps come in from the top corners.</li>' +
      '<li><b>Night Flyer</b> (wave 6): flies between six spots. At each one it folds its wings up and lets go a ring of green poison on the floor under it: stay out of the ring while it spreads. Fireflies dive in when it comes to the middle.</li>' +
      '<li><b>Blast Beetle</b> (wave 9): roams the top dropping fireballs straight down its lanes (you can\'t shoot them). When it stops and rears back, it lunges straight down to the floor a second later. Bomb beetles come in from the top.</li>' +
      '<li><b>Mega Spider</b> (wave 10, Wave X): you have one chance. It walks the top spitting webs straight down or on a slant. Lower down its health it rears up over you and drops to your row; near the end it drops on you with no warning and slides sideways. If it hits you, the bonus round is over (no life lost) and the game goes on.</li></ul>' +
      '<p>Beating the Killer Wasp, the Night Flyer or the Blast Beetle is worth <b>10,000</b>. The Mega Spider is worth <b>100,000</b> and wins the round.</p>' +
      '<h3>Endless</h3><p>After wave 10 (win or lose the bonus) the waves start again from the first stage, with the wave number still counting up. Each time round everything is faster and busier, the bosses are tougher, and their bonuses go up.</p>' +
      '<h3>Lives</h3><p>Touching a bug, a boss, a boss\'s shot or a flashing circle costs a life. You\'re back a moment later, with 5 seconds of safety (the ring of dots). You get an extra life every <b>20,000</b> points. Arcade starts with 3 lives. Relaxed starts with 5, with slower bugs and weaker, slower bosses.</p>' +
      '<h3>Play online</h3><p>Two or three players, each on their own phone or tablet, play the same field together, like the three-player cabinet. Each player has their own coloured ship (blue, yellow, purple), score and lives. One opens a table; the others join it from the list (tables opened by people you\'ve linked show up first) or with the 4-letter code. Everyone shares the team score and also has their own. Each extra player brings more bugs, another centipede and more power-ups, and the bosses get tougher. Extra lives come from the team score and go to everyone. If you lose your last life, you\'re back in at the start of the next wave, or sooner if the team earns an extra life. The game ends when everyone is out at once. Players can join a game already going. An online game can\'t be paused, and it ends for everyone if the host leaves.</p>' +

  // ═══ Wave scripts ═══════════════════════════════════════════════════════
  // Each regular wave runs like the cabinet's: who comes in when (seconds into the wave), then the stragglers

  function at(t, fn) { G.ev.push([t, fn]); }

    var k = (n - 1) % LAST + 1, np = G.players.length, loop = w.loop || 0, L = G.lay, more = np + loop;
    function entry(t, len) {
      if (L === 'bowl') { train(t, function () { makeChain(len, Math.round(0.345 * (COLS - 1)), 1, cspeed(), -1).dn = 5; }); train(t + 0.2, function () { makeChain(len, Math.round(0.655 * (COLS - 1)), -1, cspeed(), -1).dn = 5; }); }
      else { train(t, function () { sideTrain(len, 1, 1); }); train(t + 0.3, function () { sideTrain(len, -1, 2); }); }
      for (var e = 1; e < np; e++) train(t + 3 + e, function () { makeChain(len - 2, ri(4, COLS - 5), Math.random() < 0.5 ? 1 : -1, cspeed(), -1).dn = 2; });
    }
    if (k === 1) {

    } else if (k === 2) {
      at(0.3, function () { spawnFlea(0.46); spawnFlea(0.55); });
      [0.28, 0.5, 0.69].forEach(function (u, i) { train(2.5 + i * 0.25, function () { makeChain(11, Math.round(u * (COLS - 1)), i % 2 ? -1 : 1, cspeed(), -1).dn = 2 + i % 2; }); });
      for (var t = 4; t < 22; t += rnd(1.4, 2.2)) at(t, function () { if (count('flea') < 2 + np) spawnFlea(); });
      at(12, function () { spawnCap('scatter', 0.12, 0.74); });
      at(16, function () { times(more, function () { spawnWasp(false); }); });
    } else if (k === 4) {
      entry(1.2, 14);
      at(2, function () { times(np, function () { spawnWasp(false); }); });
      at(6, function () { times(3, function () { spawnFlea(); }); });
      at(7, function () { spawnAnts(np); });
      at(14, function () { times(more, function () { spawnWasp(false); }); });
      at(22, function () { times(np, function () { spawnSpider(); }); });
    } else if (k === 5) {
      entry(1.2, 15);
      at(1.5, function () { times(np, function () { spawnWasp(false); }); });
      at(12, function () { times(1 + more, function () { spawnBeetle(); }); });
      at(18, function () { times(2 + more, function (i) { setTimeout0(i * 0.35, function () { spawnSpider(); }); }); });
      at(19, function () { spawnFireflies(3 + 2 * (np - 1)); });
      at(23, function () { times(2, function () { spawnFlea(); }); });

      at(1.5, function () { times(np, function () { spawnWasp(false); }); });
      at(4.5, function () { spawnFireflies(5 + np); });
      at(5, function () { times(np, function () { spawnSpider(); }); });
      at(9, function () { times(more, function () { spawnBeetle(); }); });
      at(15, function () { times(more, function () { spawnWasp(false); }); spawnAnts(np); });
    } else {
      entry(1.0, 15);
      at(4, function () { spawnFireflies(4 + np); times(more, function () { spawnBeetle(); }); });
      at(5, function () { times(np, function () { spawnSpider(); spawnWasp(false); }); });
      at(15, function () { times(1 + more, function () { spawnSpider(); }); });
      at(20, function () { spawnAnts(np); times(more, function () { spawnWasp(false); }); });

  // something a moment later within the wave (a staggered group)

  function runScript() { while (G.ev.length && G.ev[0][0] <= G.waveT) { var e = G.ev.shift(); e[1](); } }

  // ═══ Centipedes ═════════════════════════════════════════════════════════
  // A chain's head walks from cell to cell; trail[] holds the cells it left (newest first), each with the
  // head's direction when it left. Segment k sits between trail[k] and trail[k-1] (the head between
  // trail[0] and `to`), all at the same progress, so the body follows the head's exact path.
  function makeChain(len, c, dx, sp, r0) {
    r0 = r0 == null ? -1 : r0;

    for (var i = 0; i < len; i++) ch.segs.push({ id: newId() });

  // The next centipede train of a wave comes in at the top, away from the others (in later waves with a loose

  function spawnTrain() {
    var w = waveDef(G.wave), len = ri(w.len[0], w.len[1]), sp = cspeed(), used = G.chains.map(function (c) { return c.to.c; }), col, tries = 0;
    do { col = ri(2, COLS - 3); } while (used.some(function (x) { return Math.abs(x - col) < 5; }) && tries++ < 30);
    makeChain(len, col, Math.random() < 0.5 ? 1 : -1, sp, -1);
    var heads = (G.wave % LAST) >= 4 || G.wave > LAST ? (Math.random() < 0.5 ? 1 : 0) + ((G.wave - 1) % LAST >= 6 ? 1 : 0) : 0;
    for (var i = 0; i < heads; i++) makeChain(1, ri(1, COLS - 2), Math.random() < 0.5 ? 1 : -1, sp * HEAD_X, -3 - i * 2);

  // a whole train coming in along row r from the left (dx 1) or right (dx -1) edge
  function sideTrain(len, dx, r) {
    var c = dx > 0 ? -1 : COLS;
    var ch = { id: newId(), segs: [], trail: [], to: { c: c + dx, r: r }, prog: 0, dx: dx, vy: 1, vert: false, pz: false, sp: cspeed(), frz: 0 };
    for (var i = 0; i < len; i++) ch.segs.push({ id: newId() });
    for (var j = 0; j < len + 2; j++) ch.trail.push({ c: c - dx * j, r: r, dx: dx, vy: 1, vert: false, pz: false });
    G.chains.push(ch);

  }
  function sideHead() {
    var dx = Math.random() < 0.5 ? 1 : -1, r = ri(PZ, ROWS - 2), c = dx > 0 ? -1 : COLS;
    var ch = { id: newId(), segs: [{ id: newId() }], trail: [], to: { c: c + dx, r: r }, prog: 0, dx: dx, vy: 1, vert: false, pz: false, sp: cspeed() * HEAD_X, frz: 0 };
    for (var j = 0; j < 3; j++) ch.trail.push({ c: c - dx * j, r: r, dx: dx, vy: 1, vert: false, pz: false });

  }
  function decide(ch, c, r) {
    if (r < 0) { ch.vert = true; return { c: c, r: r + 1 }; }                     // still coming in from the top
    if (ch.dn != null) {                                                           // coming straight down a lane to row dn
      if (r < ch.dn && c >= 0 && c < COLS && !(G.grid[idx(c, r + 1)] > 0)) { ch.vert = true; return { c: c, r: r + 1 }; }
      ch.dn = null;
    }
    if (c < 0 || c >= COLS) { ch.vert = false; return { c: c + ch.dx, r: r }; }   // coming in from the side
    if (ch.pz) {                                                                   // poisoned: straight down

      ch.pz = false; ch.vy = -1;

    if (!blocked) { ch.vert = false; return { c: nc, r: r }; }
    if (nc >= 0 && nc < COLS && G.pois[idx(nc, r)] && r < ROWS - 1) { ch.pz = true; ch.vert = true; ch.dx = -ch.dx; return { c: c, r: r + 1 }; }

  // ═══ Scoring, lives, power-ups ══════════════════════════════════════════
  function award(P, pts, x, y, show) {
    if (P) P.score += pts;
    G.score += pts;
    if (show) popup(x, y - 6, fmt(pts), P ? P.color : '#fff', pts >= 5000);
    // passing your best score (solo): a moment to celebrate, once a game
    if (G.mode === 'solo' && !G.beatBest && G.best0 > 0 && G.score > G.best0) { G.beatBest = true; banner('New high score!', '', '#ffd23d'); sound('extra'); buzz(P && P.id, 'success'); }
    while (G.score >= G.nextLife) {
      G.nextLife += LIFE_EVERY;
      G.players.forEach(function (p) { p.lives++; if (!p.alive && !p.benched && p.lives === 1 && p.respawn <= 0) p.respawn = 0.8; });
      sound('extra'); popup(W / 2, PZY - 14, 'Extra life', '#7dffb0', true);
      G.players.forEach(function (p) { buzz(p.id, 'success'); });
    }
  }
  // Combos: kills less than a second apart build a chain; every 5th in a row pays a bonus

      var b = P.combo * 20;
      award(P, b, 0, 0, false);

    }
  }

  // fights put them near the top). Shoot it or fly into it to take it. The first of a game comes with a pointer.
  function spawnCap(k, u, v, tut) {
    var x = u != null ? u * W : rnd(30, W - 30), y = v != null ? v * H : (G.boss ? rnd(0.1, 0.3) : rnd(0.3, 0.7)) * H;
    G.caps.push({ id: newId(), x: x, y: y, y0: y, k: k || capKind(), t: 0, tut: !!tut });
    sound('capin');
  }
  function givePower(P, cap) {
    var i = G.caps.indexOf(cap); if (i < 0) return;

  }

  // A blast: everything within reach goes up (mushrooms, bugs, centipede segments); a boss in reach takes a hit
  function blast(P, x, y, R, bossDmg, cause) {
    var R2 = R * R, ids = G.segs.filter(function (s) { return (s.x - x) * (s.x - x) + (s.y - y) * (s.y - y) < R2; }).map(function (s) { return s.id; });
    ids.forEach(function (id) { var s = segById(id); if (s) hitSeg(s, P); });
    G.foes.slice().forEach(function (o) { if (o !== cause && (o.x - x) * (o.x - x) + (o.y - y) * (o.y - y) < R2) hitFoe(o, P, 9); });

    var B = G.boss; if (B && bossDmg && B.st !== 'die' && B.st !== 'enter' && Math.hypot(B.x - x, B.y - y) < R + BOSS[B.type].r[0] * 0.8) hitBoss(P, bossDmg, B.x, B.y, 'blast');

    sound('bomb'); shake(0.5); flash('#ffb13d', 0.18);

  // ═══ Simulation (solo, or the host's copy) ══════════════════════════════

    if (G.phase === 'intro' && G.phaseT > G.introT) { G.phase = 'play'; G.phaseT = 0; if (G.boss && G.boss.type === 'mega') G.oneLife = true; }

    bulletsStep(dt);

    if (G.phase === 'clear' && G.phaseT > 2.2) { G.lostBonus = false; startWave(G.wave + 1); }
    if (G.oneLife && G.phase === 'play' && G.players.length && G.players.every(function (p) { return !p.alive && (p.lives <= 0 || p.benched); })) bonusLost();
    if (G.phase !== 'over' && G.players.length && G.players.every(function (p) { return !p.alive && (p.lives <= 0 || p.benched); }) && !(G.phase === 'clear' && G.lostBonus)) { G.phase = 'over'; G.phaseT = 0; sound('over'); }
  }

    G.score += b;
    if (mega) { card('You win!', 'Mega bonus', '#ff2d8a', 'The loop starts again, faster'); ev(['w']); }
    else banner(bw ? 'Boss battle complete' : 'Wave complete', '+' + fmt(b) + ' bonus', bw ? '#ff3d4a' : '#ffd23d');

  // ── Players ──
  function movePlayer(P, tx, ty) {
    P.x = clamp(tx, 6, W - 6); P.y = clamp(ty, 8, H - 9);
  }
  function playerStep(P, dt) {
    if (P.inv > 0) P.inv -= dt;
    if (P.comboT > 0) { P.comboT -= dt; if (P.comboT <= 0) P.combo = 0; }
    if (P.power === 'beam' && P.beamOn) useAmmo(P, dt / AMMO.beam);     // Beam drains from its first shot on

    G.caps.forEach(function (c) { s.cp.push(c.id, POWK.indexOf(c.k) + (c.tut ? 10 : 0), q4(c.x), q4(c.y), Math.round(c.t * 10)); });
    G.players.forEach(function (p) { s.p.push([p.id, q4(p.x), q4(p.y), (p.alive ? 1 : 0) | (p.inv > 0 ? 2 : 0) | (p.beaming ? 4 : 0), p.lives, p.score, p.power ? POWK.indexOf(p.power) + 1 : 0, Math.round(p.powerT * 100), p.ci, p.name]); });
    if (G.boss) { var B = G.boss; s.b = [B.id, BT.indexOf(B.type), q4(B.x), q4(B.y), Math.round(B.hp * 10) / 10, Math.round(B.max * 10) / 10, BST.indexOf(B.st), Math.round(B.z || 0), B.flash > 0 ? 1 : 0, B.ph, B.st === 'hold' ? Math.round(B.tx) * 1000 + Math.round(B.ty) : -1, B.vul ? 1 : 0]; }

  }
  function netOver(R) {
    if (!net.table) return;

    net.table.broadcast({ t: 'over', r: R }, true);

  }
  function backToTable() {
    if (net.mode === 'host' && net.table && !net.table.closed) { G = null; showWait(); sendRoster(); return; }
    if (net.mode === 'guest' && net.peer && !net.peer.closed) { GV = null; showWait(); return; }
    leaveOnline(false); goLobby();
  }

  // ── Joining ──
  function joinTable(code, name) {
    closeLobby(); busy('Connecting to the table…');
    Online.join(code, { game: 'centipede', name: name, min: 1, screen: app, relay: false }).then(function (peer) {
      net.mode = 'guest'; net.peer = peer; net.hostName = peer.name; net.me = name; net.roster = []; net.myPid = null;

        else if (screen === 'wait') { Kit.toast((net.hostName || 'The host') + ' closed the table'); goLobby(); }
      });

    }).catch(function (e) {
      var msg = e && e.nat ? 'Couldn’t link up with the other device. Centipede is too fast to play through the relay, so it needs a direct link: put both devices on the same Wi-Fi, or turn on Personal Hotspot on one iPhone and join the other device to it. Phone data on its own often blocks this.' : Online.errText(e);
      if (e && e.nat) Kit.sheet({ title: 'Couldn’t connect', html: '<p>' + Kit.esc(msg) + '</p>' + (e.diag ? '<p style="margin-top:10px;font-size:.75rem;opacity:.55">' + Kit.esc(e.diag) + '</p>' : '') }); else Kit.toast(msg);
      goLobby();
    });
  }
  function guestMsg(m) {
    if (m.t === 'hi') { net.myPid = m.you; return; }
    if (m.t === 'ro') { net.roster = m.ro; if (net.wait) net.wait.update(waitPlayers(m.ro, net.myPid)); if (GV) GV.names = m.ro; return; }
    if (m.t === 'init') { net.myPid = m.you; net.roster = m.ro; guestStart(m); return; }
    if (!GV) return;
    if (m.t === 's') { guestSnap(m); return; }
    if (m.t === 'e') { setTimeout(function () { if (!GV) return; if (m.g) guestGrid(m.g, m.fc, m.fr); else guestDiffs(m.m); (m.ev || []).forEach(applyFx); }, DELAY); return; }
    if (m.t === 'over') { var R = m.r; setTimeout(function () { if (!GV || GV.ended) return; GV.ended = true; GV.phase = R.won ? 'won' : 'over'; GV.phaseT = 0; setTimeout(function () { endGame(R.won, R); }, 1800); }, DELAY); }
  }
  // the whole field from the host (a new wave), and its shape if that changed
  function guestGrid(gs, fc, fr) {
    if (fc && fr && (fc !== COLS || fr !== ROWS)) { setField(fc, fr); refit = true; }
    GV.grid = new Uint8Array(COLS * ROWS); GV.pois = new Uint8Array(COLS * ROWS);
    for (var i = 0; i < gs.length && i < GV.grid.length; i++) { var v = gs.charCodeAt(i) - 48; GV.grid[i] = v & 3; GV.pois[i] = v >= 4 ? 1 : 0; }
  }
  function guestStart(m) {
    net.wait = null;
    Array.prototype.forEach.call(document.querySelectorAll('.k-win'), function (n) { n.remove(); });
    setField(m.fc || FIELD[0], m.fr || FIELD[1]);
    GV = { mode: 'guest', me: m.you, ci: 0, grid: null, pois: null, wave: m.w, phase: PH[m.ph] || 'intro', phaseT: 0, score: 0,
      segs: [], foes: [], shots: [], bullets: [], caps: [], zones: [], players: [], boss: null, buf: [], off: null, lastAt: performance.now(),
      pred: { x: W / 2, y: H - 16, alive: false, cool: 0, side: 1 }, lb: [], beamLocal: false, power: null, hostName: m.host || net.hostName, stall: false, ended: false, sendT: 0, diff: m.diff, started: Date.now() };
    guestGrid(m.g, m.fc, m.fr);
    GV.lastRes = function () { return { won: false, wave: GV.wave, score: GV.score, players: GV.players.map(function (p) { return { id: p.id, name: p.name, score: p.score, ci: p.ci }; }), stats: {}, started: GV.started, diff: GV.diff }; };

    Kit.gameStart();
    buildView();
  }
  function guestDiffs(md) { if (!md) return; for (var i = 0; i + 2 < md.length; i += 3) { if (md[i] < GV.grid.length) { GV.grid[md[i]] = md[i + 1]; GV.pois[md[i]] = md[i + 2]; } } }
  function guestSnap(s) {
    var now = performance.now(), sample = s.tm - now;

    GV.lastAt = now;

  }
  // xo: where x sits in each entry (y follows it); 2 for most lists ([id, kind, x, y, …]), 1 for segments ([id, x, y, flags])
  function lerpArr(A, B, stride, a, build, xo) {

  }
  function guestFrame(dt) {
    var V = GV, now = performance.now();
    V.phaseT += dt;
    V.stall = !V.ended && now - V.lastAt > 1500;
    if (V.buf.length) {
      var rt = now + V.off - DELAY, b = V.buf, A = b[0], B = b[b.length - 1];
      for (var i = 0; i < b.length - 1; i++) if (b[i].tm <= rt && b[i + 1].tm >= rt) { A = b[i]; B = b[i + 1]; break; }

      V.score = B.sc;
      V.segs = lerpArr(A.c, B.c, 4, a, function (r, j, x, y) { return { id: r[j], x: x, y: y, head: !!(r[j + 3] & 1), dx: r[j + 3] & 2 ? -1 : 1, frz: !!(r[j + 3] & 4) }; }, 1);
      V.foes = lerpArr(A.f, B.f, 6, a, function (r, j, x, y) { return { id: r[j], type: FT[r[j + 1]], x: x, y: y, hp: r[j + 4], vx: r[j + 5] & 1 ? -1 : 1, hurt: r[j + 5] & 2 ? 1 : 0, glow: r[j + 5] & 4 ? 1 : 0 }; });
      V.shots = lerpArr(A.k, B.k, 6, a, function (r, j, x, y) { var an = r[j + 4] / 100; return { id: r[j], k: KT[r[j + 1]], x: x, y: y, vx: Math.cos(an), vy: Math.sin(an), z: r[j + 5] / 4 }; });
      V.zones = []; for (var zi = 0; zi + 5 < (B.zn || []).length; zi += 6) V.zones.push({ id: B.zn[zi], x: B.zn[zi + 1] / 4, y: B.zn[zi + 2] / 4, R: B.zn[zi + 3], t: B.zn[zi + 4] / 100, ci: B.zn[zi + 5] });
      V.bullets = lerpArr(A.u, B.u, 6, a, function (r, j, x, y) { var an = r[j + 5] / 100; return { id: r[j], o: r[j + 1], x: x, y: y, k: BK[r[j + 4]], vx: Math.cos(an) * 100, vy: Math.sin(an) * 100 }; });
      V.caps = lerpArr(A.cp, B.cp, 5, a, function (r, j, x, y) { return { id: r[j], k: POWK[r[j + 1] % 10], tut: r[j + 1] >= 10, x: x, y: y, t: r[j + 4] / 10 }; });
      if (B.b) {
        var bb = B.b, ab = A.b && A.b[0] === bb[0] ? A.b : bb;
        if (Math.abs(bb[2] - ab[2]) > 400 || Math.abs(bb[3] - ab[3]) > 400) ab = bb;   // a jump (the Wasp back in at the top, the Firefly moving in the dark): don't slide across
        var bx = ab[2] / 4 + (bb[2] - ab[2]) / 4 * a, by = ab[3] / 4 + (bb[3] - ab[3]) / 4 * a;

      var wasAlive = V.pred.alive;
      V.players = B.p.map(function (p) {
        var o = pm[p[0]] || p, P = { id: p[0], x: o[1] / 4 + (p[1] - o[1]) / 4 * a, y: o[2] / 4 + (p[2] - o[2]) / 4 * a, alive: !!(p[3] & 1), inv: p[3] & 2 ? 1 : 0, beaming: !!(p[3] & 4), lives: p[4], score: p[5], power: p[6] ? POWK[p[6] - 1] : null, powerT: p[7] / 100, ci: p[8], name: p[9] };
        if (P.id === V.me) { V.ci = P.ci; V.power = P.power; if (P.alive && !wasAlive) { V.pred.x = p[1] / 4; V.pred.y = p[2] / 4; } V.pred.alive = P.alive; }

      });
    }
    guestLocal(dt);
  }
  // A guest's own ship: moved here straight away; its plain, rapid and ice shots are drawn here too (the
  // host's copy decides what they hit). Homing missiles and hits come from the host.
  function guestLocal(dt) {
    var V = GV, P = V.pred;
    V.beamLocal = false;
    if (P.alive && !V.ended) {
      var m = takeInput(P, dt); movePlayer(P, m[0], m[1]);
      var f = firing();
      V.sendT -= dt;
      if (V.sendT <= 0 && net.peer) { V.sendT = 1 / 30; net.peer.send({ t: 'i', x: q4(P.x), y: q4(P.y), f: f ? 1 : 0 }, false); }
      P.cool -= dt;
      var pw = V.power;
      if (f && pw === 'beam') { V.beamLocal = true; snd('beam'); }
      else if (f && P.cool <= 0) {
        if (pw === 'scatter') { [-0.19, 0, 0.19].forEach(function (an) { V.lb.push({ x: P.x, y: P.y - 9, vx: Math.sin(an) * BSPD.scatter, vy: -Math.cos(an) * BSPD.scatter, k: 'scatter' }); }); P.cool = 0.2; snd('scatter'); }
        else if (pw === 'bomb') { V.lb.push({ x: P.x, y: P.y - 9, vx: 0, vy: -BSPD.bomb, k: 'bomb' }); P.cool = 0.42; snd('shoot'); }
        else { V.lb.push({ x: P.x, y: P.y - 9, vx: 0, vy: -BSPD.laser, k: pw === 'shock' ? 'shock' : 'laser' }); P.cool = 0.12; snd('shot'); }
      }
    } else if (net.peer && !V.ended) { V.sendT -= dt; if (V.sendT <= 0) { V.sendT = 0.2; net.peer.send({ t: 'i', x: q4(P.x), y: q4(P.y), f: 0 }, false); } }
    for (var i = V.lb.length - 1; i >= 0; i--) {
      var b = V.lb[i], n = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 4), gone = false;
      for (var s = 0; s < n && !gone; s++) {
        b.x += b.vx * dt / n; b.y += b.vy * dt / n;
        if (b.y < -8 || b.x < -8 || b.x > W + 8) { gone = true; break; }
        var cc = Math.floor(b.x / CELL), rr = Math.floor(b.y / CELL);
        if (inField(cc, rr) && V.grid[idx(cc, rr)]) gone = true;
        for (var k = 0; k < V.segs.length && !gone; k++) if (Math.abs(V.segs[k].x - b.x) < 6 && Math.abs(V.segs[k].y - b.y) < 6) gone = true;
        for (var f2 = 0; f2 < V.foes.length && !gone; f2++) if (Math.abs(V.foes[f2].x - b.x) < 10 && Math.abs(V.foes[f2].y - b.y) < 7.5) gone = true;
        for (var c2 = 0; c2 < V.caps.length && !gone; c2++) if (Math.abs(V.caps[c2].x - b.x) < 8 && Math.abs(V.caps[c2].y - b.y) < 8) gone = true;
        if (!gone && V.boss && V.boss.st !== 'die') { var R = BOSS[V.boss.type].r, ex = (b.x - V.boss.x) / R[0], ey = (b.y - V.boss.y) / R[1]; if (ex * ex + ey * ey < 1) gone = true; }

  // ── Leaving ──
  // ask: confirm first (from a menu or button). quiet: the page is closing
  function leaveOnline(ask, quiet) {

      Kit.confirm(screen === 'game' ? 'Leave the game?' : 'Leave the table?', { ok: 'Leave', body: body }).then(function (ok) { if (ok) { leaveOnline(false); goLobby(); } });
      return;
    }
    if (net.table) net.table.close();
    if (net.peer) { var p = net.peer; net.peer = null; p.close(); }  // no arg: we're the one leaving, so the bye goes out
    hostTimer(false);
    net.mode = null; net.table = null; net.wait = null; net.roster = [];
    if (!quiet) { GV = null; if (G && G.mode === 'host') G = null; }
    closeLobby();
  }

  // ═══ Test hooks (automated checks) ══════════════════════════════════════
  window.__centi = {
    state: function () { return G; }, view: function () { return GV; }, net: net, ctl: ctl, perf: perf,
    solo: function (o) { o = o || {}; applyOpts({}); startSolo({ who: o.who || 'Tim', diff: o.diff || 'arcade' }); },
    hold: function (on) { hold = !!on; },
    run: function (sec) { var n = Math.round(sec / STEP); for (var i = 0; i < n && G && !G.ended; i++) { sim(STEP); if (G.mode === 'host') netHostTick(); fxStep(STEP); if (n - i < 24) { lastDraw = performance.now() - STEP * 1000; draw(); } } if (refit) { refit = false; cssW = 0; fit(); } lastDraw = performance.now() - STEP * 1000; draw(); },
    step: function (n) { for (var i = 0; i < n && G && !G.ended; i++) sim(STEP); },     // simulate without drawing
    threats: function (on) { if (on) G.threats = []; return G.threats; },               // with god on: what would have hit
    field: function () { var rows = []; for (var r = 0; r < ROWS; r++) { var n = 0; for (var c = 0; c < COLS; c++) if (G.grid[idx(c, r)]) n++; rows.push(n); } return rows; },
    dims: function () { return { cols: COLS, rows: ROWS, W: W, H: H, PZ: PZ, PZY: PZY, S: S, canvas: cv ? [cv.width, cv.height, cv.style.width, cv.style.height] : null }; },
    put: function (c, r, hp, po) { setMush(c, r, hp, po); },
    consts: { CELL: CELL, WAVES: WAVES, BOSS: BOSS, BDMG: BDMG, POWK: POWK, THEMES: THEMES },
    wave: function (n, lay) { G.chains = []; G.segs = []; G.boss = null; G.foes = []; G.shots = []; G.forceLay = lay || null; startWave(n); },
    clearWave: function () { G.chains = []; G.segs = []; if (G.boss) G.boss.hp = 1; },
    god: function (on) { G.noDie = !!on; },
    power: function (k, pid) { var P = pid ? G.players.filter(function (p) { return p.id === pid; })[0] : G.players[0]; P.power = k; P.powerT = 1; P.beamOn = false; },
    cap: function (k, x, y) { G.caps.push({ id: newId(), x: x, y: y, y0: y, k: k, t: 0 }); },
    spawn: function (type, x, y) { return type === 'wasp' || type === 'bwasp' ? spawnWasps(1, type === 'bwasp') : type === 'ant' ? spawnAnts() : type === 'ffly' ? spawnFirefly(x, y) : type === 'beetle' ? spawnBeetle(x, y) : type === 'flea' ? spawnFlea() : type === 'mini' ? spawnSpider(true, x, y) : spawnSpider(false); },

    kill: function () { killPlayer(G.players[0]); },
    hitBoss: function (n) { for (var i = 0; i < n && G.boss; i++) hitBoss(G.players[0], 1, G.boss.x, G.boss.y); },

    draw: function () { draw(); }, fx: fx, prof: function () { var o = {}, t0 = performance.now(); mushSpr('green', 3, 0); o.mush = performance.now() - t0; t0 = performance.now(); txt('Wave 9', '#ffffff', 9, '#ff0000'); o.txtGlow = performance.now() - t0; t0 = performance.now(); txt('Wave 9', '#ffffff', 5); o.txt = performance.now() - t0; t0 = performance.now(); capSpr('scatter'); o.cap = performance.now() - t0; t0 = performance.now(); segSpr('green', true, 0, 0, 0); o.seg = performance.now() - t0; for (var k in o) o[k] = Math.round(o[k]); return o; }, bgTime: function (tk) { var t0 = performance.now(); bgSpr(tk); return Math.round(performance.now() - t0); }, sprites: function () { return Object.keys(SPX).length; }
  };
  window.__cc = window.__centi;

  // ═══ Boot ═══════════════════════════════════════════════════════════════
  bindInput();
  (function () {
    var s = lsGet('centi_opts', {}) || {}; ctl.auto = s.auto !== false; ctl.drag = DRAG[s.drag] || DRAG.normal;

})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Oregon Trail</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<script src="../arcade-music.js"></script>
<script src="oregon/data.js"></script>
<script src="oregon/art.js"></script>
<script src="oregon/usmap.js"></script>
<style>
/* Pixel fonts: Jersey 10 and Press Start 2P (SIL Open Font License, see fonts/) */
@font-face{font-family:"Jersey 10";src:url("../fonts/jersey-10.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Press Start 2P";src:url("../fonts/press-start-2p.woff2") format("woff2");font-display:swap;}
:root{--vt:"Jersey 10",ui-monospace,monospace;--px:"Press Start 2P",ui-monospace,monospace;
  --e-blue:#0000aa;--e-lblue:#5555ff;--e-green:#00aa00;--e-lgreen:#55ff55;--e-cyan:#55ffff;--e-red:#ff5555;--e-yel:#ffff55;--e-brown:#aa5500;--e-gray:#aaaaaa;--e-dgray:#555555;}
body{overflow:hidden;}
/* The game is one black pixel screen under the game bar: the picture on top, the panel below it */
.ot{position:relative;display:flex;flex-direction:column;height:calc(100dvh - var(--bar));max-width:1180px;margin:0 auto;background:#000;color:#fff;
  font:400 1.4rem/1.08 var(--vt);-webkit-user-select:none;user-select:none;}
.ot-scr{position:relative;flex:none;overflow:hidden;background:#000;touch-action:none;}
.ot-scr canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
.ot-scr.wipe canvas{animation:otWipe .55s steps(11) both;}
@keyframes otWipe{from{clip-path:inset(0 0 0 100%);}to{clip-path:inset(0 0 0 0);}}
.ot-ov{position:absolute;inset:0;pointer-events:none;}
.ot-ov > *{pointer-events:auto;}
/* the bottom edge clears the home bar and the screen's rounded corners (kit.css --safe-b, --corner-x/y) */
.ot-low{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px calc(12px + var(--corner-x,0px)) calc(10px + var(--safe-b,0px) + var(--corner-y,0px));overflow:hidden;}
.ot-info{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;}
/* the old map over the trail: above the picture upright, at the left of the lower half sideways */
.ot-map{flex:none;padding:8px 10px 6px;background:#000;}
.ot-map canvas{display:block;width:100%;image-rendering:pixelated;box-shadow:0 0 0 2px #2a1a0a,4px 4px 0 #000;}
@media (orientation:landscape) and (min-width:600px){ .ot-low > .ot-map{padding:0;width:min(36%,440px);align-self:flex-start;} .ot.trav .ot-act{width:min(28%,320px);} }
@media (orientation:landscape) and (min-width:600px) and (max-height:560px){ .ot-low > .ot-map{width:30%;} .ot.trav .ot-act{width:26%;} .ot.trav .ot-act .ob{font-size:1.15rem;} }
.ot-act{flex:none;display:flex;flex-direction:column;gap:7px;}
@media (orientation:landscape) and (min-width:600px){
  .ot-low{flex-direction:row;gap:14px;padding:8px calc(12px + var(--corner-x,0px)) calc(8px + var(--safe-b,0px) + var(--corner-y,0px));}
  .ot-act{flex:none;width:min(46%,430px);justify-content:flex-end;overflow-y:auto;}
}
.ot.full .ot-scr{flex:1;}
/* typing a name (or an epitaph) with the on-screen keyboard up: the page shrinks to the space above the keyboard and
   the picture steps aside, so the boxes and the button stay in view (kit.js sets html.k-kb and --vvh) */
html.k-kb .ot{height:calc(var(--vvh, 100dvh) - var(--bar));}
html.k-kb .ot.typing .ot-scr{display:none;}
.ot.full .ot-low{display:none;}

/* big screens (tablets, desktop): bigger type */
@media (min-width:900px) and (min-height:700px){
  .ot{font-size:1.85rem;}
  .ob{font-size:1.75rem;min-height:56px;} .ob.go{font-size:1.95rem;} .ob .sub{font-size:1.3rem;} .ob svg{width:24px;height:24px;}
  .ot-grid .ob{font-size:1.55rem;min-height:70px;}
  .ot-pp{font-size:1.45rem;}
  .ot-ban b{font-size:1.1rem;} .ot-ban small{font-size:1.5rem;}
  .ot h2{font-size:1.15rem;}
  .st-row .q{font-size:1.9rem;} .st-b{width:52px;height:48px;font-size:2rem;} .st-bill{font-size:1.9rem;} .st-row .nm small{font-size:1.3rem;}
  .nm-row input,.ot-in{height:52px;font-size:1.9rem;} .nm-chips button{font-size:1.5rem;}
  .sc-t{font-size:1.7rem;} .sc-t tr.tot td{font-size:2rem;}
  .hud{font-size:1.8rem;}
}
/* the banner over the picture: where you are, the date */
.ot-ban{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000;border:2px solid #fff;padding:4px 14px 5px;text-align:center;white-space:nowrap;
  animation:otBan .5s steps(6) both;box-shadow:4px 4px 0 rgba(0,0,0,.6);}
.ot-ban b{display:block;font:400 clamp(.6rem,2.2vw,.95rem)/1.35 var(--px);color:#fff;}
.ot-ban small{display:block;font:400 1.15rem/1 var(--vt);color:var(--e-yel);}
@keyframes otBan{from{transform:translate(-50%,-40px);}to{transform:translate(-50%,0);}}

/* text */
.ot h2{margin:0 0 6px;font:400 clamp(.7rem,2.6vw,1rem)/1.4 var(--px);color:var(--e-yel);letter-spacing:.02em;}
.ot p{margin:0 0 6px;}
.ot .dim{color:var(--e-gray);}
.ot .yel{color:var(--e-yel);} .ot .red{color:var(--e-red);} .ot .grn{color:var(--e-lgreen);} .ot .cyn{color:var(--e-cyan);}
.ot-say{white-space:pre-wrap;}
.ot-say .caret{display:inline-block;width:.45em;height:.85em;background:#fff;vertical-align:-.05em;animation:otBlink .6s steps(2) infinite;}
@keyframes otBlink{50%{opacity:0;}}

/* the status rows: Date, Weather, Health... */
.ot-stat{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;align-items:baseline;}
.ot-stat dt{color:var(--e-gray);white-space:nowrap;}
.ot-stat dd{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (orientation:landscape) and (min-width:600px) and (max-height:560px){
  .ot-stat{grid-template-columns:auto 1fr auto 1fr;}
  /* traveling, the map takes part of the row: one column of facts, a little smaller */
  .ot.trav .ot-stat{grid-template-columns:auto 1fr;font-size:1.08rem;line-height:1.02;}
}
.ot-seg{position:relative;height:10px;margin:6px 0 2px;background:#222;border:2px solid var(--e-dgray);}
.ot-seg i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--e-brown) 0 6px,#7a3d00 6px 8px);transition:width .6s steps(8);}
.ot-seg b{position:absolute;top:-6px;width:4px;height:18px;background:#fff;}
/* the party: one chip each */
.ot-party{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px;}
.ot-pp{display:inline-flex;align-items:center;gap:5px;padding:1px 7px 2px;border:2px solid var(--e-dgray);color:#fff;font-size:1.15rem;}
.ot-pp.sick{border-color:var(--e-red);color:var(--e-red);animation:otPulse 1.2s steps(2) infinite;}
.ot-pp.hurt{border-color:var(--e-yel);color:var(--e-yel);}
.ot-pp.dead{border-color:#333;color:#666;text-decoration:line-through;}
.ot-pp.lead::before{content:"";width:6px;height:6px;background:var(--e-yel);}
@keyframes otPulse{50%{border-color:#600;}}

/* buttons, in the game's own look */
.ob{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:5px 12px 7px;border:0;border-radius:0;cursor:pointer;
  font:400 1.4rem/1 var(--vt);color:#fff;background:var(--e-blue);box-shadow:inset 0 0 0 2px var(--e-lblue),4px 4px 0 #000;-webkit-tap-highlight-color:transparent;text-align:left;}
.ob svg{width:20px;height:20px;flex:none;stroke-width:2.2;}
.ob:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 2px var(--e-lblue),2px 2px 0 #000;}
.ob.go{background:linear-gradient(#1ec01e,#009a00 55%,#007a00);min-height:52px;font-size:1.6rem;text-shadow:2px 2px 0 #004a00;
  box-shadow:inset 0 3px 0 #8aff8a,inset 3px 0 0 #4ae04a,inset -3px 0 0 #006a00,inset 0 -5px 0 #005200,0 4px 0 #002a00,0 6px 14px rgba(0,0,0,.55);}
.ob.go:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #5ae05a,inset 0 -2px 0 #005200,0 1px 0 #002a00;}
.ob.warn{background:#7a0000;box-shadow:inset 0 0 0 2px var(--e-red),4px 4px 0 #000;}
.ob.plain{background:#111;box-shadow:inset 0 0 0 2px var(--e-dgray),4px 4px 0 #000;}
.ob[disabled]{opacity:.38;cursor:default;}
.ob .sub{display:block;font-size:1.05rem;color:rgba(255,255,255,.72);margin-top:2px;}
.ob .tx{flex:1;min-width:0;}
.ob.hot{animation:otHot 1s steps(2) infinite;}
@keyframes otHot{50%{box-shadow:inset 0 0 0 2px var(--e-yel),4px 4px 0 #000;}}
.ot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
.ot-grid .ob{flex-direction:column;gap:3px;min-height:56px;font-size:1.2rem;text-align:center;padding:6px 4px;}
@media (orientation:landscape) and (min-width:600px) and (max-height:560px){
  .ot-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;}
  .ot-grid .ob{flex-direction:row;min-height:34px;font-size:1.15rem;padding:2px 4px 4px;gap:4px;}
  .ot-grid .ob svg{width:15px;height:15px;}
  .ob{min-height:36px;padding:3px 10px 5px;}
  .ob.go{font-size:1.4rem;min-height:40px;}
  .ob .sub{font-size:.98rem;}
  .ot-act{gap:5px;}
  .ot-low{padding-top:6px;}
  .ot{font-size:1.25rem;}
  .ot-pp{font-size:1.05rem;padding:0 5px 1px;}
}
.ot-row2{display:flex;gap:7px;} .ot-row2 > .ob{flex:1;}

/* the store's shelf: rows with amount steppers */
.st-row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed #333;}
.st-row .nm small{display:block;font-size:1.02rem;color:var(--e-gray);}
.st-row .q{min-width:3.4em;text-align:center;color:var(--e-yel);font-size:1.5rem;}
.st-row .q.bump{animation:otBump .25s steps(3);}
@keyframes otBump{50%{transform:scale(1.35);color:#fff;}}
.st-b{width:40px;height:38px;border:0;background:var(--e-blue);color:#fff;font:400 1.6rem/1 var(--vt);box-shadow:inset 0 0 0 2px var(--e-lblue);cursor:pointer;}
.st-b:active{background:var(--e-lblue);}
.st-b[disabled]{opacity:.3;}
.st-b.full{opacity:.35;box-shadow:inset 0 0 0 2px var(--e-dgray);background:#1a1a3a;}
.st-bill{display:flex;justify-content:space-between;gap:10px;font-size:1.5rem;margin-top:4px;}
.st-bill b{color:var(--e-yel);font-weight:400;}
.ot-quote{border-left:4px solid var(--e-brown);padding-left:8px;}
.ot-quote b{display:block;color:var(--e-yel);font-weight:400;font-size:1.15rem;}

/* names */
.nm-row{display:flex;gap:6px;align-items:center;margin-bottom:5px;}
.nm-row label{width:1.4em;color:var(--e-gray);text-align:right;}
.nm-row input{flex:1;min-width:0;height:40px;border:0;border-radius:0;background:#111;color:#fff;font:400 1.5rem/1 var(--vt);padding:2px 10px;box-shadow:inset 0 0 0 2px var(--e-dgray);outline:none;}
.nm-row input:focus{box-shadow:inset 0 0 0 2px var(--e-yel);}
/* a typing field and the keypad under it (no phone keyboard: the game has its own, like the old computers) */
.ot-tf{flex:1;min-width:0;height:40px;display:flex;align-items:center;background:#111;color:#fff;font:400 1.5rem/1 var(--vt);padding:2px 10px;
  box-shadow:inset 0 0 0 2px var(--e-dgray);cursor:text;white-space:nowrap;overflow:hidden;}
.ot-tf.on{box-shadow:inset 0 0 0 2px var(--e-yel);}
.ot-tf .ph{color:#666;}
@media (max-width:599px){ .ot.typing .nm-row .ot-tf,.ot.typing .nm-row .st-b{height:36px;} .ot.typing .nm-row{margin-bottom:4px;} .ot.typing .kp button{height:38px;} .ot.typing .ot-info h2{margin-bottom:6px;} .ot.typing .ot-info .nm-sub{display:none;} }
.ot-tf.on.fresh .tx{background:var(--e-yel);color:#000;}
@media (orientation:landscape) and (min-width:600px) and (max-height:560px){ .ot.typing .ot-info .nm-sub,.ot.typing .ot-info h2{display:none;} .ot-act{padding-bottom:6px;} }
.ot-tf .cur{display:none;width:.55em;height:1em;background:var(--e-yel);margin-left:1px;flex:none;}
.ot-tf.on .cur{display:inline-block;animation:otCur 1s steps(1) infinite;}
@keyframes otCur{50%{opacity:0;}}
.kp{display:flex;flex-direction:column;gap:5px;padding:7px;background:#1a1a1a;box-shadow:inset 0 0 0 2px #333,4px 4px 0 #000;}
.kp-r{display:flex;gap:5px;justify-content:center;}
.kp button{flex:1 1 0;min-width:0;height:40px;border:0;padding:0;cursor:pointer;color:#f4f4f4;font:400 1.45rem/1 var(--vt);
  background:linear-gradient(#4a4a4a,#333);box-shadow:inset 0 2px 0 #6a6a6a,inset 0 -3px 0 #1a1a1a,0 2px 0 #000;}
.kp button.w2{flex-grow:1.6;} .kp button.sp{flex-grow:5;} .kp button.nx{flex-grow:2.2;background:linear-gradient(#0a7a0a,#005a00);box-shadow:inset 0 2px 0 var(--e-lgreen),inset 0 -3px 0 #003a00,0 2px 0 #000;}
.kp button.dim{color:#aaa;font-size:1.3rem;}
.kp button svg{width:20px;height:20px;}
.kp button.hit,.kp button:active{transform:translateY(2px);background:#5a5a5a;box-shadow:inset 0 1px 0 #7a7a7a,0 0 0 #000;}
.kp .spacer{flex:.5 1 0;}
@media (min-width:900px) and (min-height:700px){ .kp button{height:52px;font-size:1.8rem;} .ot-tf{height:52px;font-size:1.9rem;} }
@media (orientation:landscape) and (min-width:600px) and (max-height:560px){ .kp{gap:3px;padding:4px;} .kp-r{gap:3px;} .kp button{height:30px;font-size:1.2rem;} .ot-tf{height:32px;} .nm-row{margin-bottom:3px;} }
.nm-chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px;}
.nm-chips button{border:0;background:#222;color:#fff;font:400 1.15rem/1 var(--vt);padding:5px 9px;box-shadow:inset 0 0 0 2px var(--e-dgray);cursor:pointer;}
.ot-in{width:100%;height:42px;border:0;background:#111;color:#fff;font:400 1.45rem/1 var(--vt);padding:2px 10px;box-shadow:inset 0 0 0 2px var(--e-yel);outline:none;border-radius:0;}

/* the tombstone's writing, over the picture */
.tb-txt{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;color:#222;pointer-events:none;overflow:hidden;}
.tb-txt .hl{font:400 calc(var(--s,2) * 3.4px)/1.4 var(--px);color:#333;}
.tb-txt .nm{font:400 calc(var(--s,2) * 12px)/1 var(--vt);color:#111;margin-top:.15em;}
.tb-txt .ep{font:400 calc(var(--s,2) * 7.4px)/1.05 var(--vt);color:#333;margin-top:.3em;max-width:96%;overflow-wrap:anywhere;}
.tb-txt .dt{font:400 calc(var(--s,2) * 6px)/1 var(--vt);color:#555;margin-top:.4em;}

/* score tally and the top ten */
.sc-t{width:100%;border-collapse:collapse;font-size:1.3rem;}
.sc-t td{padding:1px 4px;}
.sc-t td:last-child{text-align:right;color:var(--e-yel);font-variant-numeric:tabular-nums;}
.sc-t tr.in{animation:otIn .3s steps(4) both;}
@keyframes otIn{from{opacity:0;transform:translateX(-12px);}}
.sc-t tr.tot td{border-top:2px solid #fff;color:#fff;font-size:1.6rem;}
.tt td:nth-child(1){color:var(--e-gray);width:1.6em;}
.tt td:nth-child(3){text-align:right;color:var(--e-yel);}
.tt td:nth-child(4){color:var(--e-gray);text-align:right;font-size:1.1rem;}
.tt tr.me td{color:var(--e-lgreen);animation:otPulse2 .8s steps(2) 6;}
.tt tr.old td{color:#888;}
@keyframes otPulse2{50%{color:#fff;}}

/* hunting and rafting heads-up display */
.hud{position:absolute;left:8px;right:8px;top:6px;display:flex;justify-content:space-between;gap:8px;font:400 1.35rem/1 var(--vt);color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none;}
.hud b{font-weight:400;color:var(--e-yel);}
.hud-end{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;border:2px solid #fff;padding:12px 16px;text-align:center;min-width:240px;max-width:90%;box-shadow:6px 6px 0 rgba(0,0,0,.6);}
.hud-end .ob{margin-top:10px;width:100%;}
.hud-tip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:4px 10px 5px;font:400 1.2rem/1 var(--vt);white-space:nowrap;pointer-events:none;}
.hud-quit{position:absolute;right:8px;bottom:8px;min-height:36px;font-size:1.2rem;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var N = OT.NODES, DAY = 864e5, SAVE = 'oregon_state', GRAVES = 'oregon_graves', HKEY = 'oregon', BOARD = 'oregon';
  function el(t, a, kids) { return Kit.el ? Kit.el(t, a, kids) : document.createElement(t); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function chance(p) { return Math.random() < p; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function n(v) { return Math.round(v).toLocaleString('en-US'); }
  function money(v) { v = Math.round(v * 100) / 100; return '$' + (v % 1 ? v.toFixed(2) : n(v)); }
  function plural(k, one, many) { return n(k) + ' ' + (k === 1 ? one : (many || one + 's')); }
  function ic(name) { return Kit.icon(name); }
  function dstr(ms) { var d = new Date(ms); return OT.MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear(); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // ── Sound: a PC speaker and a little noise ──────────────────────────────
  var AC = null, MASTER = null;
  function ac() {
    try { if (localStorage.getItem('gn_sound') === '0') return null; } catch (e) {}
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); MASTER = AC.createGain(); MASTER.gain.value = 0.9; MASTER.connect(AC.destination); }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, t0, dur, type, vol, slide) {
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(t0, dur, vol, type, freq, q, sweepTo) {
    var a = ac(); if (!a) return;
    var len = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;
    f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq || 1000, t); if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur); f.Q.value = q || 0.7;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.buffer = b; s.connect(f); f.connect(g); g.connect(MASTER); s.start(t);
  }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  // a tune on the speaker: [[midi, beats], ...]
  function jingle(notes, beat, vol, type) { var t = 0; beat = beat || 0.11; notes.forEach(function (x) { if (x[0]) tone(mtof(x[0]), t, beat * x[1] * 0.92, type || 'square', vol || 0.05); t += beat * x[1]; }); return t; }
  var SND = {
    clop: function (hi) { noise(0, 0.05, 0.16, 'bandpass', hi ? 900 : 650, 3); tone(hi ? 170 : 140, 0, 0.04, 'triangle', 0.08); },
    creak: function () { tone(260 + Math.random() * 80, 0, 0.18, 'sawtooth', 0.012, 200); },
    tick: function () { tone(1800, 0, 0.012, 'square', 0.012); },

  // ── On the trail ────────────────────────────────────────────────────────
  var T = null;   // the travel animation: {art, scroll, moving, dayStart, res, stop}
  var DAY_MS = 760;
  function travelView() {

    return {
      isTravel: true,
      resize: function (W, H) { if (W === w && H === h && art) return; w = W; h = H; art = new OTArt.Travel(W, H); art.key = ''; },

        var scroll = T ? T.scroll + (moving ? T.dpx * p : 0) : (S.miles * 6) | 0;
        var step = Math.floor(t / 170);
        if (moving && T.lastStep !== step) { T.lastStep = step; SND.clop(step % 2); if (step % 9 === 0 && chance(0.4)) SND.creak(); }
        var dist = S.segMi - (S.done - (moving ? T.res.mi * (1 - p) : 0));
        drawTrailMap(S.done - (moving ? T.res.mi * (1 - p) : 0), t);
        var nx = S.next ? N[S.next] : null;
        var gs = [];
        if (S.next) graves().forEach(function (g) { if (g.at === S.at && g.to === S.next) gs.push({ dmi: g.d - (S.done - (moving ? T.res.mi * (1 - p) : 0)) }); });

  }
  // the old map of the country above the trail: the whole route, red where you've been, the wagon creeping west
  var TM = null;
  function trailMap() {
    var cv = el('canvas'), box = el('div', { class: 'ot-map' }, [cv]);

    root.classList.add('trav');
    TM = { box: box, cv: cv, w: 0, key: '' };
    layout();
  }
  function drawTrailMap(done, t) {
    if (!TM || !TM.box.isConnected) return;
    var cw = TM.box.clientWidth - (land() ? 0 : 20), W = Math.max(60, Math.round(cw / 2)), H = Math.round(W / 1.9);
    if (TM.w !== W) { TM.w = W; TM.cv.width = W; TM.cv.height = H; TM.base = OTArt.oldMap(W, H, { map: OT.MAP }); TM.key = ''; }
    var a = N[S.at], b = S.next ? N[S.next] : null, f = b ? clamp(done / S.segMi, 0, 1) : 0;
    var here = b ? { lon: a.lon + (b.lon - a.lon) * f, lat: a.lat + (b.lat - a.lat) * f } : { lon: a.lon, lat: a.lat };

    c.drawImage(M.img, 0, 0);

  function showTravelAgain() { if (!(view && view.isTravel) || !T) { showTravel(false); return; } paintTravel(); setTimeout(nextDay, 300); }

  // show what happened, one thing at a time. Resolves 'over' when the game has ended, 'stop' to stop travelling
  function present(queue) {

    function next() {

  // ── Arriving somewhere ──────────────────────────────────────────────────

  // ── The stop menu's pages ───────────────────────────────────────────────

    view = null; setView(mv, { frac: land() ? 0.62 : 0.62 }); mv.resize(LW, LH);

  // ── Rivers ──────────────────────────────────────────────────────────────
  function riverNow(id) {
    var R = OT.RIVERS[id], m = month();
    var d = R.base + R.spring * OT.SPRING[m] + (S.wet || 0) * 0.5;
    d = Math.max(0.6, d * (0.85 + Math.random() * 0.3));
    return { id: id, depth: Math.round(d * 10) / 10, width: ri(R.width[0], R.width[1]), waited: 0 };
  }
  var crossing = null;   // the wagon crossing: {how, t0, fail}
  function riverView(id) {
    return picView(id, {}, function (c, t, pic) {
      if (!crossing) return;

  function lossText(k, q) { return k === 'food' ? plural(q, 'pound') + ' of food' : k === 'clothes' ? plural(q, 'set') + ' of clothing' : k === 'bullets' ? plural(q, 'bullet') : plural(q, 'wagon ' + k.replace(/s$/, '')); }

    var R = { d: 0, x: 0, vx: 0, target: null, keys: {}, started: false, over: false, hits: 0, lost: {}, out: [], inv: 0, paddle: 0, end: 0 };
    var w = 0, h = 0, last = 0, hud, rocks = [], pools = [], trees = [], rng0 = OTArt.rng(OTArt.hash('columbia' + S.days)), PPM = 40, END = OT.COLUMBIA.mi * PPM;
    function center(D) { return w / 2 + Math.sin(D / 190) * w * 0.14 + Math.sin(D / 71 + 1.3) * w * 0.05; }
    function rap(D) { if (D < 300) return 0; var k = (D / 640) % 1; return clamp(1 - Math.abs(k - 0.735) / 0.13, 0, 1); }   // how much rapids, 0..1

        if (rng0() < 0.12) pools.push({ D: D + 40, x: c + (rng0() * 2 - 1) * (hw - 20) });
        D += dense ? 46 + rng0() * 36 : 82 + rng0() * 70;

      resize: function (W, Hh) { if (W === w && Hh === h) return; w = W; h = Hh; build(); R.x = center(R.d); },
      draw: function (c, t, now) {

        trees.forEach(function (tr) { var y = rowsY(tr.D); if (y < -20 || y > h + 20) return; var x = tr.side < 0 ? center(tr.D) - half(tr.D) - tr.off : center(tr.D) + half(tr.D) + tr.off; OTArt.tree(P, 'pine', Math.round(x), y, tr.s, false); });

  // ── Deaths and graves ───────────────────────────────────────────────────

  }

    }
    box.innerHTML = '<div class="hl">Here lies</div><div class="nm">' + esc(lines.name) + '</div><div class="ep">' + esc(lines.ep || '') + '</div><div class="dt">' + esc(lines.date || '') + '</div>';

  // ── Oregon! ─────────────────────────────────────────────────────────────

    banner('Willamette Valley, Oregon', dstr(S.date));
    jingle([[72, 1], [72, 1], [74, 1], [76, 2], [79, 2], [79, 1], [81, 1], [79, 1], [76, 1], [72, 1], [74, 1], [76, 2], [76, 1], [74, 1], [72, 4]], 0.14, 0.05);

  }
  function scoreRows() {

  // ── History ─────────────────────────────────────────────────────────────

    var where = died ? (N[died.at].short || N[died.at].name) : arrived ? 'Oregon' : (N[S.at].short || N[S.at].name);

    else if (died) hl.push(died.n + ' ' + causeText(died.cause) + ' near ' + where + ', ' + plural(Math.floor(S.miles), 'mile') + ' along the trail');
    (S.log || []).forEach(function (d) { if (!died || d.n !== died.n) hl.push(d.n + ' ' + causeText(d.c) + ' near ' + d.at + ' (' + d.date + ')'); });

      started: S.started, mode: occ.name, players: [{ name: nm, score: score }], winner: arrived ? nm : null,
      summary: arrived ? 'Reached Oregon · ' + n(score) + ' points' : 'Died near ' + where,
      badge: arrived ? n(score) : 'RIP', highlights: hl,
      meta: { arrived: arrived, occ: S.occ, score: score, miles: Math.floor(S.miles) },
      detail: { o: S.occ, a: arrived ? 1 : 0, s: score, r: arrived ? rating(score) : '', mi: Math.floor(S.miles), dy: S.days, st: dstr(S.start), en: dstr(S.date), w: where,
        p: S.people.map(function (p) { return { n: p.n, a: p.alive ? 1 : 0, c: p.cause || '', e: p.ep || '', at: p.at ? (N[p.at].short || N[p.at].name) : '' }; }),
        h: OT.HEALTH[hIdx()], route: S.path.map(function (id) { return N[id].short || N[id].name; }).join('|'), f: S.food, c: Math.floor(S.cash), ox: S.oxen, b: S.bullets, cl: S.clothes, hu: S.hunted || 0 }
    });
  }

  // ── The game bar ────────────────────────────────────────────────────────
  Kit.init({
    id: 'oregon',
    theme: { felt: ['#3f5a2a', '#2b3f1c', '#1c2a12'], wood: ['#9a6a3e', '#6a4424'] },
    onNew: function () {
      if (S && S.phase !== 'over' && S.phase !== 'names') Kit.confirm('Start a new trip? This one ends here.', { ok: 'New trip', danger: true }).then(function (y) { if (y) { recordTrip(false); clearSave(); S = null; showSetup(); } });
      else { clearSave(); S = null; showSetup(); }
    },
    menu: [
      music.menuItem,
      { icon: 'trophy', label: 'Oregon Top Ten', onClick: function () { if (S && S.phase !== 'over') ArcadeHi.show(BOARD); else showTopTen(null); } },
      { icon: 'history', label: 'Past trips', onClick: function () { Kit.history(HKEY, { title: 'The Oregon Trail: past trips' }); } }
    ],
    rules:
      '<p class="goal">Lead your party of five from Independence, Missouri to the Willamette Valley in Oregon, 2,000 miles away, in 1848. Get there with as many people, supplies and as much money as you can.</p>' +
      '<h3>Before you leave</h3><ul><li><b>Occupation.</b> A banker starts with $1,600, a carpenter with $800, a farmer with $400. A carpenter\'s points are doubled and a farmer\'s tripled. Carpenters are better at fixing the wagon; farmers keep their oxen healthier.</li>' +
      '<li><b>Month.</b> Leave too early and there\'s no grass for the oxen; too late and you\'ll meet snow in the mountains.</li>' +
      '<li><b>Matt\'s General Store.</b> Oxen ($40 a yoke), food (20 cents a pound), clothing ($10 a set), ammunition ($2 a box of 20 bullets) and spare wheels, axles and tongues ($10 each). Prices at the forts are higher.</li></ul>' +
      '<h3>On the trail</h3><ul><li>Stop any time to check supplies, look at the map, change your <b>pace</b> (steady, strenuous, grueling) and <b>rations</b> (filling, meager, bare bones), rest, or trade.</li>' +
      '<li>A faster pace and smaller rations save time and food but wear your party down. Poor health brings sickness: dysentery, cholera, typhoid, measles, fevers and exhaustion. Resting helps.</li>' +
      '<li>At landmarks you can talk to people; at forts you can buy supplies.</li></ul>' +
      '<h3>Rivers</h3><p>Ford if the water is shallow (under 2½ feet is safe, over 3 feet risks tipping the wagon), caulk the wagon and float it, take a ferry where there is one, or hire a guide at the Snake River. You can also wait a day for the river to drop.</p>' +
      '<h3>The end of the trail</h3><p>At The Dalles, float the Columbia River on a raft or take the Barlow Toll Road around Mount Hood.</p>' +
      '<h3>Points</h3><p>Each survivor scores 500 (good health), 400 (fair), 300 (poor) or 200 (very poor). Add 50 for the wagon, 4 per ox, 2 per spare part, 2 per set of clothing, 1 per 50 bullets, 1 per 25 pounds of food and 1 per $5. Then the occupation bonus. Trail guides score 7,000 or more.</p>'
  });
  ArcadeHi.config(BOARD, { unit: 'points' });

  // test hooks
  window.__ot = { __setS: function (s) { S = s; }, state: function () { return S; }, set: function (s) { S = s; save(); go(); }, go: go, day: day, travelDay: travelDay, score: finalScore, showTopTen: showTopTen, arrive: arrive, newGame: newGame,
    deathScreen: deathScreen, showRiver: showRiver, riverNow: riverNow, showStore: showStore, showStop: showStop, showDalles: showDalles, showMap: showMap, arriveOregon: arriveOregon, showScore: showScore, graveScreen: graveScreen, present: present, message: message, setT: function (v) { DAY_MS = v; } };

  // ── Boot ────────────────────────────────────────────────────────────────
  S = load();
  if (S && S.phase !== 'over') go();
  else { S = null; showSetup(); }
})();
</script>

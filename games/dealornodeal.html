<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal or No Deal</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* ── TV studio ──────────────────────────────────────────────────────────── */
.studio{
  position:relative;border-radius:22px;padding:14px 8px 12px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(60% 40% at 18% 0%, rgba(90,150,255,.30), transparent 70%),
    radial-gradient(60% 40% at 82% 0%, rgba(255,196,70,.22), transparent 70%),
    radial-gradient(90% 50% at 50% 105%, rgba(70,110,255,.28), transparent 70%),
    linear-gradient(180deg,#0d1636 0%,#070b1f 70%,#0b1230 100%);
  box-shadow:inset 0 0 0 2px rgba(255,205,90,.35), inset 0 0 40px rgba(0,0,0,.6), 0 16px 34px rgba(0,0,0,.5);
}
/* Marquee bulbs along the top edge */
.studio::before{content:"";position:absolute;left:14px;right:14px;top:4px;height:6px;z-index:-1;
  background:radial-gradient(circle,#ffe39a 0 1.6px,rgba(255,200,80,.35) 2.4px,transparent 3.2px) 0 50%/12px 6px repeat-x;
  animation:bulbs 1.2s steps(2) infinite;}
@keyframes bulbs{50%{background-position:6px 50%;}}
/* Spotlight beams */
.studio::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    conic-gradient(from 168deg at 20% -8%, transparent 0deg, rgba(160,200,255,.07) 10deg, transparent 22deg),
    conic-gradient(from 172deg at 80% -8%, transparent 0deg, rgba(255,220,150,.06) 12deg, transparent 24deg);}
.marq{display:flex;align-items:center;justify-content:space-between;gap:8px;height:28px;padding:0 6px 4px;
  font-family:var(--display);font-size:.95rem;letter-spacing:.05em;color:#ffdf8a;text-transform:uppercase;text-shadow:0 0 12px rgba(255,200,80,.45);}
.marq .who{display:flex;align-items:center;gap:6px;min-width:0;color:#fff;text-shadow:none;}
.marq .who i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent);flex:none;}
.marq .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.marq .r{color:#9fc3ff;text-shadow:0 0 12px rgba(100,160,255,.5);}

.floor{display:grid;grid-template-columns:var(--colw,78px) 1fr var(--colw,78px);gap:6px;align-items:stretch;}
.col{display:flex;flex-direction:column;gap:3px;justify-content:center;}
/* Money board: each value is a lit bar that slides off when its case is opened */
.mv{position:relative;height:var(--mvh,21px);border-radius:5px;overflow:hidden;
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:var(--mvf,12.5px);letter-spacing:-.01em;color:rgba(255,255,255,.2);font-variant-numeric:tabular-nums;}
.mv .lit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:5px;}
.col.lo .mv .lit{color:#fff;text-shadow:0 1px 0 rgba(0,0,40,.5);
  background:linear-gradient(180deg,#7db7ff 0%,#2f78e6 45%,#1c55b8 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 10px rgba(60,130,255,.25);}
.col.hi .mv .lit{color:#3b2500;text-shadow:0 1px 0 rgba(255,255,255,.35);
  background:linear-gradient(180deg,#fff0a8 0%,#ffc93a 45%,#d99a12 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 10px rgba(255,190,40,.25);}
.mv.gone .lit{display:none;}
.mv.going .lit{display:flex;animation:mv-off-l .8s cubic-bezier(.5,0,.75,0) forwards;}
.col.hi .mv.going .lit{animation-name:mv-off-r;}
@keyframes mv-off-l{0%{filter:brightness(2);transform:none;}25%{filter:brightness(2.2);transform:none;}100%{transform:translateX(-115%);opacity:.2;}}
@keyframes mv-off-r{0%{filter:brightness(2);transform:none;}25%{filter:brightness(2.2);transform:none;}100%{transform:translateX(115%);opacity:.2;}}
.mv.mine{box-shadow:0 0 0 2px #fff,0 0 16px rgba(255,255,255,.6);animation:pulse-mine 1.2s ease-in-out infinite;}
.mv.mine .lit{display:flex;}
@keyframes pulse-mine{50%{box-shadow:0 0 0 2px #fff,0 0 4px rgba(255,255,255,.2);}}

/* ── Briefcases ─────────────────────────────────────────────────────────── */
.cases{display:flex;flex-direction:column;justify-content:space-evenly;gap:var(--rg,5px);min-width:0;}
.crow{display:flex;justify-content:center;gap:var(--cg,4px);}
.case{--cs:44px;position:relative;flex:none;width:var(--cs);height:calc(var(--cs) * .9);padding:0;border:0;background:none;color:#111;
  transition:transform .25s var(--spring),opacity .3s;-webkit-tap-highlight-color:transparent;}
.case::before{content:"";position:absolute;top:0;left:32%;right:32%;height:calc(var(--cs) * .2);
  border:calc(var(--cs) * .055) solid #3f444c;border-bottom:0;border-radius:calc(var(--cs) * .09) calc(var(--cs) * .09) 0 0;}
.case .shell{position:absolute;left:0;right:0;bottom:0;top:calc(var(--cs) * .16);border-radius:calc(var(--cs) * .1);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#f7f9fb 0%,#d3d8df 30%,#a9b0ba 31%,#c7ccd4 60%,#e6e9ee 100%);
  box-shadow:inset 0 0 0 1px #7b838e,inset 0 2px 0 rgba(255,255,255,.95),inset 0 -2px 0 rgba(0,0,0,.18),0 3px 6px rgba(0,0,0,.55);}
.case .shell::before{content:"";position:absolute;left:12%;right:12%;top:calc(31% - 2px);height:calc(var(--cs) * .1);
  background:linear-gradient(90deg,#33383f 0 13%,transparent 13% 87%,#33383f 87%);border-radius:1px;}
.case .tag{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);min-width:56%;padding:0 calc(var(--cs) * .05);
  border-radius:calc(var(--cs) * .07);background:linear-gradient(180deg,#fffef6,#ece6cf);color:#111;
  font-family:var(--display);font-size:calc(var(--cs) * .33);line-height:1.18;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.3);}
.case .shine{position:absolute;left:0;right:0;bottom:0;top:calc(var(--cs) * .16);border-radius:calc(var(--cs) * .1);overflow:hidden;pointer-events:none;}
.case .shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);
  transform:translateX(-120%);animation:sheen 5s ease-in-out infinite;animation-delay:var(--d,0s);}
@keyframes sheen{0%,70%{transform:translateX(-120%);}90%,100%{transform:translateX(120%);}}
.case.can{cursor:pointer;}
@media (hover:hover){.case.can:hover{transform:translateY(-4px) scale(1.06);}}
.case.can:active{transform:scale(.92);}
.case.lock{cursor:default;}
.case.pickme .shell{animation:glowc 1.6s ease-in-out infinite;}
@keyframes glowc{50%{box-shadow:inset 0 0 0 1px #7b838e,inset 0 2px 0 rgba(255,255,255,.95),0 0 12px rgba(255,220,120,.7);}}
/* Opened: an empty spot on the risers with the amount ghosted in */
.case.open::before{opacity:.12;}
.case.open .shell{background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.case.open .shell::before{display:none;}
.case.open .amt{position:absolute;left:0;right:0;top:calc(var(--cs) * .16);bottom:0;display:grid;place-items:center;
  font-family:var(--display);font-size:calc(var(--cs) * .25);letter-spacing:-.02em;color:rgba(150,190,255,.45);}
.case.open .amt.hi{color:rgba(255,205,90,.5);}
.case.open.just{animation:slotin .55s var(--spring);}
@keyframes slotin{0%{transform:rotateY(90deg) scale(1.2);}100%{transform:none;}}
/* Your case's empty spot while it sits on the podium */
.case.away::before{opacity:.25;border-color:#d9a21b;}
.case.away .shell{background:rgba(255,200,60,.06);box-shadow:inset 0 0 0 1.5px rgba(255,200,60,.45);border:0;}
.case.away .shell::before{display:none;}
.case.away .tag{background:none;color:rgba(255,215,110,.7);box-shadow:none;}
.case.picked{transform:translateY(-6px) scale(1.12);z-index:2;}
.case.picked .shell{box-shadow:inset 0 0 0 1px #7b838e,0 0 0 2px #ffd76a,0 0 18px rgba(255,210,90,.8);}

/* ── Contestant desk (below the stage) ──────────────────────────────────── */
.desk{position:relative;margin-top:12px;border-radius:20px;padding:14px 14px 14px;
  background:linear-gradient(180deg,#1d2550 0%,#11163a 55%,#0b0f2a 100%);
  box-shadow:inset 0 3px 0 #e2ac2a,inset 0 4px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(255,255,255,.06),0 14px 30px rgba(0,0,0,.45);}
.desk-row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;}
.ped{position:relative;width:96px;display:flex;flex-direction:column;align-items:center;}
.ped .case{--cs:70px;z-index:1;}
.ped .slot{width:70px;height:63px;border-radius:9px;border:2px dashed rgba(255,215,110,.5);display:grid;place-items:center;color:rgba(255,215,110,.8);
  font-family:var(--display);font-size:.8rem;letter-spacing:.04em;text-align:center;line-height:1.05;animation:glowslot 1.6s ease-in-out infinite;}
@keyframes glowslot{50%{border-color:rgba(255,215,110,.95);box-shadow:0 0 14px rgba(255,210,90,.35);}}
.ped .top{width:92px;height:14px;margin-top:-5px;border-radius:50%;background:radial-gradient(50% 50% at 50% 40%,#fff3c4,#e2ac2a 60%,#8a5d0a);box-shadow:0 0 18px rgba(255,200,70,.55);}
.ped .base{width:80px;height:26px;margin-top:-4px;clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,#2b3468,#141a40);display:grid;place-items:center;
  font-size:.62rem;font-weight:900;letter-spacing:.12em;color:#ffd76a;}
.prompt h2{font-family:var(--display);font-weight:400;font-size:1.65rem;line-height:1.05;color:#fff;}
.prompt h2 b{font-weight:400;color:#ffd76a;}
.prompt p{color:var(--text-2);font-size:.92rem;margin-top:4px;line-height:1.3;}
.pips{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.pips i{width:14px;height:10px;border-radius:3px;background:linear-gradient(180deg,#eef1f5,#a9b0ba);box-shadow:0 1px 2px rgba(0,0,0,.4);}
.pips i.done{background:rgba(255,255,255,.12);box-shadow:none;}

/* Offer timeline */
.tl{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);}
.tl-h{display:flex;justify-content:space-between;font-size:.68rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px;}
.tl-bars{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;align-items:end;height:58px;}
.tl-c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}
.tl-c .a{font-size:.6rem;font-weight:900;color:var(--text-2);white-space:nowrap;letter-spacing:-.02em;margin-bottom:2px;}
.tl-c .b{width:100%;max-width:26px;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,#ffe27a,#d99a12);min-height:3px;transform-origin:bottom;}
.tl-c.new .b{animation:grow .6s var(--spring);}
@keyframes grow{from{transform:scaleY(0);}}
.tl-c.ghost .b{background:none;border:1.5px dashed rgba(255,215,110,.55);}
.tl-c.ghost .a{color:var(--text-3);}
.tl-c.deal .b{background:linear-gradient(180deg,#ff7a7a,#c81818);box-shadow:0 0 10px rgba(255,60,60,.5);}
.tl-c.deal .a{color:#ff9a9a;}
.tl-c.empty .b{background:rgba(255,255,255,.07);}
.tl-c .n{font-size:.62rem;font-weight:900;color:var(--text-3);margin-top:3px;}
.tl-c.deal .n{color:#ff8a8a;}

/* Banker's offer */
.bank-h{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.78rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#9fc3ff;}
.bank-h .ico{width:18px;height:18px;}
.led{margin:6px auto 2px;max-width:330px;border-radius:14px;padding:6px 10px;text-align:center;
  background:
    repeating-linear-gradient(180deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px),
    linear-gradient(180deg,#05070f,#0d1226);
  box-shadow:inset 0 0 0 2px #2b3468,inset 0 0 22px rgba(0,0,0,.8);}
.led span{display:block;font-family:var(--display);font-size:clamp(2.3rem,11.5vw,3.2rem);line-height:1.1;color:#ffd447;letter-spacing:.01em;
  text-shadow:0 0 14px rgba(255,190,40,.7),0 0 2px #fff6c8;font-variant-numeric:tabular-nums;}
.led.done span{animation:ledpop .5s var(--spring);}
@keyframes ledpop{40%{transform:scale(1.08);}}
.bank-sub{text-align:center;color:var(--text-2);font-size:.86rem;line-height:1.3;min-height:1.3em;}
.dnd{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:8px;transition:opacity .3s;}
.dnd.wait{opacity:.25;pointer-events:none;}
.dealw{display:flex;flex-direction:column;align-items:center;gap:4px;}
.dealbtn{position:relative;width:96px;height:96px;border:0;border-radius:50%;padding:0;
  background:radial-gradient(circle,#2a2f36 0 60%,#f4f6f8 63%,#9aa2ac 70%,#e9ecf0 76%,#5d646d 82%,#2a2f36 86%,transparent 87%);
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));}
.dealbtn .dome{position:absolute;inset:17%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 30%,#ff9c9c 0,#f22b2b 30%,#b30d0d 72%,#6a0606 100%);
  box-shadow:inset 0 -5px 8px rgba(0,0,0,.45),inset 0 3px 4px rgba(255,255,255,.35),0 0 18px rgba(255,40,40,.55);
  font-family:var(--display);font-size:1.45rem;color:#fff;letter-spacing:.04em;text-shadow:0 2px 0 rgba(90,0,0,.6);transition:transform .1s;}
.dealbtn:active .dome{transform:scale(.93) translateY(2px);}
.dealbtn .cover{position:absolute;inset:4%;border-radius:50%;pointer-events:none;
  background:
    linear-gradient(125deg,transparent 30%,rgba(255,255,255,.55) 34%,transparent 40%,transparent 46%,rgba(255,255,255,.3) 49%,transparent 53%),
    radial-gradient(circle at 50% 50%,rgba(190,220,255,.16) 0 62%,rgba(255,255,255,.45) 70%,rgba(190,220,255,.2) 100%);
  border:2px solid rgba(225,240,255,.7);box-shadow:inset 0 0 12px rgba(255,255,255,.35);
  transform-origin:50% 0;transition:transform .5s var(--spring),opacity .4s;}
.dealbtn .cover::after{content:"";position:absolute;left:42%;right:42%;top:-5px;height:7px;border-radius:3px;background:linear-gradient(180deg,#e9ecf0,#7d848e);}
.dealbtn.armed .cover{transform:perspective(220px) rotateX(-80deg) translateY(-6px);opacity:.85;}
.dealbtn.armed .dome{animation:armed 1s ease-in-out infinite;}
@keyframes armed{50%{box-shadow:inset 0 -5px 8px rgba(0,0,0,.45),inset 0 3px 4px rgba(255,255,255,.35),0 0 34px rgba(255,60,60,.95);}}
.dealw small{font-size:.7rem;font-weight:800;color:var(--text-3);text-align:center;line-height:1.1;max-width:120px;white-space:nowrap;}
.dealw.armed small{color:#ff9a9a;}
.nodeal{min-height:72px;border-radius:16px;border:0;padding:0 10px;
  background:linear-gradient(180deg,#30386e 0%,#161c45 55%,#0e1232 100%);
  box-shadow:inset 0 0 0 2px #e2ac2a,inset 0 3px 0 rgba(255,255,255,.2),0 6px 0 #6b4e0a,0 10px 18px rgba(0,0,0,.5);
  font-family:var(--display);font-size:1.75rem;letter-spacing:.04em;color:#ffd76a;text-shadow:0 0 12px rgba(255,200,70,.5);
  transition:transform .08s,box-shadow .08s;}
.nodeal:active{transform:translateY(5px);box-shadow:inset 0 0 0 2px #e2ac2a,0 1px 0 #6b4e0a;}

/* Swap / result */
.duo{display:flex;justify-content:center;align-items:flex-end;gap:22px;margin:4px 0 12px;}
.duo .one{display:flex;flex-direction:column;align-items:center;gap:6px;}
.duo .case{--cs:68px;}
.duo small{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.duo .vs{font-family:var(--display);color:var(--text-3);font-size:1.1rem;padding-bottom:22px;}
.center h2{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1;text-align:center;}
.center p{text-align:center;color:var(--text-2);margin-top:4px;}
.btn-row{margin-top:12px;}
.btn-row .btn{padding:0 10px;white-space:nowrap;}
.res-amt{font-family:var(--display);font-size:2.6rem;line-height:1.05;text-align:center;color:#ffd447;text-shadow:0 0 18px rgba(255,190,40,.5);}
.res-line{text-align:center;color:var(--text-2);font-size:.95rem;}
.res-line b{color:var(--text);}
.tag-good{color:var(--green)!important;}
.tag-bad{color:#ff8a8a!important;}
.stand{display:flex;flex-direction:column;gap:5px;margin-top:12px;}
.stand div{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.05);font-weight:800;}
.stand .v{margin-left:auto;font-variant-numeric:tabular-nums;color:#ffd76a;}
.stand .p{color:var(--text-3);font-weight:700;margin-left:auto;}
.after-note{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
.after-note span{color:var(--text-2);font-size:.9rem;font-weight:700;}
.after-note b{color:#ffd76a;}

/* ── Reveal overlay: the case close-up ──────────────────────────────────── */
.rv{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;
  background:radial-gradient(60% 45% at 50% 45%,rgba(40,70,160,.55),rgba(4,6,18,.92));
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s;}
.rv.show{opacity:1;}
.rv-in{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:calc(min(64vw,250px) * .55);transform:scale(.6);transition:transform .45s var(--spring);}
.rv.show .rv-in{transform:none;}
.rv-lbl{text-align:center;font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;color:#fff;text-transform:uppercase;text-shadow:0 0 16px rgba(120,170,255,.6);}
.rv-lbl small{display:block;text-align:center;margin-bottom:2px;font-family:var(--font);font-size:.75rem;font-weight:900;letter-spacing:.14em;color:#9fc3ff;}
.bc{--cs:min(64vw,250px);position:relative;width:var(--cs);height:calc(var(--cs) * .88);perspective:900px;}
.bc .hdl{position:absolute;top:0;left:33%;right:33%;height:calc(var(--cs) * .16);border:calc(var(--cs) * .045) solid #3f444c;border-bottom:0;border-radius:calc(var(--cs) * .07) calc(var(--cs) * .07) 0 0;}
.bc .box{position:absolute;left:0;right:0;bottom:0;top:calc(var(--cs) * .14);transform-style:preserve-3d;}
.bc .inside{position:absolute;inset:0;border-radius:calc(var(--cs) * .07);display:grid;place-items:center;
  background:radial-gradient(80% 70% at 50% 40%,#2c2156,#120b2a);box-shadow:inset 0 0 0 calc(var(--cs) * .03) #8d949e,inset 0 0 30px rgba(0,0,0,.8);}
.bc .plate{min-width:78%;padding:calc(var(--cs) * .03) calc(var(--cs) * .05);border-radius:calc(var(--cs) * .04);text-align:center;
  font-family:var(--display);font-size:calc(var(--cs) * .17);line-height:1.15;white-space:nowrap;transform:scale(.6);opacity:0;transition:transform .5s var(--spring) .1s,opacity .2s .1s,box-shadow .3s;}
.bc .plate.lo{color:#fff;background:linear-gradient(180deg,#7db7ff,#2f78e6 45%,#1c55b8);text-shadow:0 2px 0 rgba(0,0,40,.4);}
.bc .plate.hi{color:#3b2500;background:linear-gradient(180deg,#fff0a8,#ffc93a 45%,#d99a12);}
.bc .lid{position:absolute;inset:0;transform-origin:50% 0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.55,1);}
.bc .lid .f,.bc .lid .k{position:absolute;inset:0;border-radius:calc(var(--cs) * .07);backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.bc .lid .f{background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#f7f9fb 0%,#d3d8df 30%,#a9b0ba 31%,#c7ccd4 60%,#e6e9ee 100%);
  box-shadow:inset 0 0 0 2px #7b838e,inset 0 3px 0 rgba(255,255,255,.95),inset 0 -4px 0 rgba(0,0,0,.2),0 14px 30px rgba(0,0,0,.6);}
.bc .lid .f::before{content:"";position:absolute;left:12%;right:12%;top:calc(31% - 6px);height:calc(var(--cs) * .08);
  background:linear-gradient(90deg,#33383f 0 13%,transparent 13% 87%,#33383f 87%);border-radius:2px;}
.bc .lid .f .tag{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);min-width:46%;padding:0 calc(var(--cs) * .04);border-radius:calc(var(--cs) * .04);
  background:linear-gradient(180deg,#fffef6,#ece6cf);color:#111;font-family:var(--display);font-size:calc(var(--cs) * .27);line-height:1.15;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.3);}

.rv.open .bc .plate{transform:none;opacity:1;}
.rv.good .bc .plate{box-shadow:0 0 0 3px #3ddc84,0 0 34px rgba(61,220,132,.85);}

.rv.good{background:radial-gradient(60% 45% at 50% 45%,rgba(40,160,100,.5),rgba(4,6,18,.92));}

.flash{position:fixed;inset:0;z-index:310;pointer-events:none;background:#ff2a3c;animation:flash .6s ease-out forwards;}

/* Banker's phone call */
.ring{position:fixed;inset:0;z-index:300;display:grid;place-items:center;
  background:radial-gradient(55% 40% at 50% 45%,rgba(30,20,60,.9),rgba(3,4,12,.96));-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;transition:opacity .3s;}

  background:radial-gradient(circle at 38% 30%,#fff3c4,#ffc93a 55%,#c8870c);box-shadow:0 0 0 6px rgba(255,200,60,.2),0 0 40px rgba(255,190,40,.55);}

/* Hand-off between contestants */

.handoff .avatar{margin:0 auto 8px;}

/* ── Desktop: bigger stage, two-tier risers ─────────────────────────────── */
@media (min-width:760px){

  .floor{--colw:150px;gap:14px;}
  .marq{font-size:1.15rem;}
  .desk{max-width:820px;margin-left:auto;margin-right:auto;}
  .bank-top{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;}
  .bank-top .dnd{margin-top:0;}

}

  .col{gap:6px;}
}

</head>
<body>
<main class="stage wide" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el, esc = Kit.esc, icon = Kit.icon;
  var app = document.getElementById('app');
  var SAVE = 'dond_state', HKEY = 'dond';

  // ── The game's numbers (US version) ───────────────────────────────────────
  var VALUES = [0.01, 1, 5, 10, 25, 50, 75, 100, 200, 300, 400, 500, 750,
    1000, 5000, 10000, 25000, 50000, 75000, 100000, 200000, 300000, 400000, 500000, 750000, 1000000];
  var ROUNDS = [6, 5, 4, 3, 2, 1, 1, 1, 1];            // cases to open each round
  var CUM = []; ROUNDS.reduce(function (a, b, i) { CUM[i] = a + b; return a + b; }, 0);
  // Banker's offer as a share of the average left, round by round (noise added)
  var PCT = [0.19, 0.28, 0.38, 0.50, 0.62, 0.73, 0.83, 0.92, 1.0];

  function fmt(v) { return v < 1 ? '$0.01' : '$' + Math.round(v).toLocaleString('en-US'); }
  function fmtK(v) {
    if (v < 1) return '1¢';
    if (v < 1000) return '$' + Math.round(v);
    if (v < 10000) return '$' + (Math.round(v / 100) / 10).toString().replace(/\.0$/, '') + 'K';
    if (v < 999500) return '$' + Math.round(v / 1000) + 'K';
    return '$' + (Math.round(v / 10000) / 100).toString().replace(/\.?0+$/, '') + 'M';
  }
  function isHi(v) { return v >= 1000; }
  function mean(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : 0; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // ── Rules ─────────────────────────────────────────────────────────────────
  Kit.init({
    id: 'dealornodeal',
    onNew: function () { gen++; clearSave(); undoStack = []; showSetup(); },
    undo: function () { undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { openHistory(); } }],
    rules:
      '<p class="goal">26 briefcases hold amounts from 1 cent to $1,000,000. Keep one case, open the others, and decide: take the Banker\'s offer, or keep going?</p>' +
      '<h3>How a game goes</h3><ol>' +
      '<li><b>Pick your case.</b> Nobody knows what\'s inside. It sits on your podium until the very end.</li>' +
      '<li><b>Open cases</b> from the stage: 6 in round 1, then 5, 4, 3, 2, and then 1 at a time. Every amount you open goes dark on the money board, so you know it\'s <b>not</b> in your case.</li>' +
      '<li>After each round <b>the Banker calls</b> with an offer to buy your case.</li>' +
      '<li><b>Deal</b>: take the money and the game is over. To take it, lift the clear cover and press the red button. <b>No Deal</b>: keep playing.</li>' +
      '<li>When only your case and one other are left, you can <b>keep your case or swap</b> it for the last one. Then your case is opened.</li></ol>' +
      '<h3>Tips</h3><ul>' +
      '<li>Opening small amounts (blue) is good news: the offers go up. Opening big amounts (gold) hurts.</li>' +
      '<li>The Banker offers much less than the average early on and gets fairer near the end.</li>' +
      '<li>If you take a deal, the game keeps opening cases to show what would have happened.</li></ul>' +
      '<h3>Playing with family</h3><p>In <b>Pass &amp; play</b>, 2 to 4 people each play a full game in turn, with their own shuffled cases. Whoever walks away with the most money wins.</p>' +
      '<h3>Undo</h3><p>You can put back a case you just opened, until the Banker calls. Once the offer is in, those cases stay open.</p>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  // S = {mode, pace, started, cur, players:[{name,color,g}]}
  // g = {vals[26], my, orig, opened[], round, offers[{r,amt}], ghost[{r,amt}], deal{r,amt}, phase, swapped, result}
  // phase: pick → open → offer → (open … ) → swap → final → done   |  offer → after (deal) → final → done
  var S = null, gen = 0, busy = false, undoStack = [];
  var fx = { just: null, offerFresh: false, tlNew: -1 };
  function save() {
    if (!S) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    var g = G(), p = P();
    var lbl = !g ? 'Next contestant' : g.phase === 'pick' ? 'Picking a case' : g.phase === 'done' ? 'Next contestant' : 'Round ' + Math.min(9, g.round + 1) + ' of 9';
    Kit.resume.set((S.players.length > 1 ? p.name + ': ' : '') + lbl);
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function load() { try { return JSON.parse(localStorage.getItem(SAVE)); } catch (e) { return null; } }
  function P() { return S.players[S.cur]; }
  function G() { return S && S.players[S.cur] ? S.players[S.cur].g : null; }
  function newGame() {
    return { vals: shuffle(VALUES.slice()), my: null, orig: null, opened: [], round: 0, offers: [], ghost: [], deal: null, phase: 'pick', swapped: false, result: null };
  }
  function isOpen(g, i) { return g.opened.indexOf(i) >= 0; }
  function unopened(g) { var a = []; for (var i = 0; i < 26; i++) if (!isOpen(g, i)) a.push(i); return a; }
  function need(g) { return Math.max(0, CUM[Math.min(8, g.round)] - g.opened.length); }
  function leftVals(g) { return unopened(g).map(function (i) { return g.vals[i]; }); }

  // ── The Banker ────────────────────────────────────────────────────────────
  // A share of the average of what's left, rising from ~20% to ~100%, with a
  // little noise and a nudge from the biggest amounts still in play.
  function nice(o) {
    if (o < 10) return Math.max(1, Math.round(o));
    if (o < 1000) return Math.round(o);
    if (o < 10000) return Math.round(o / 10) * 10;
    if (o < 100000) return Math.round(o / 100) * 100;
    return Math.round(o / 1000) * 1000;
  }
  function bankerOffer(g, r) {
    var left = leftVals(g), ev = mean(left);
    var top = left.slice().sort(function (a, b) { return b - a; }).slice(0, 3);
    var base = 0.95 * ev + 0.05 * mean(top);
    var spread = r >= 7 ? 0.08 : 0.14;
    var o = base * PCT[r] * (1 + (Math.random() - 0.5) * spread);
    o = Math.min(o, Math.max.apply(null, left) * 0.97);
    o = Math.max(o, Math.min.apply(null, left));
    return nice(o);
  }

  // ── Setup ─────────────────────────────────────────────────────────────────
  function showSetup() {
    S = null; busy = false; closeOverlays();
    Kit.setup(app, {
      intro: 'Pick a case, beat the Banker',
      modes: [
        { id: 'solo', icon: 'user', title: 'Solo', desc: 'One game against the Banker' },
        { id: 'pass', icon: 'users', title: 'Pass & play', desc: '2 to 4 players each play a game. Most money wins' }
      ],
      players: { range: function (m) { return m === 'pass' ? [2, 4] : [1, 1]; }, count: 1 },
      options: [{ id: 'pace', label: 'Case reveals', choices: [['tv', 'TV drama', 'Slower reveals and more suspense, like the TV show.'], ['quick', 'Quick', 'Cases open fast with less waiting.']], value: 'tv' }],
      start: 'Open the show',
      onStart: start
    });
  }
  function start(cfg) {
    gen++; undoStack = []; busy = false;
    var solo = cfg.mode !== 'pass';
    S = {
      v: 2, mode: solo ? 'solo' : 'pass', pace: (cfg.options && cfg.options.pace) || 'tv', started: Date.now(), cur: 0,
      players: cfg.players.map(function (p, i) {
        var n = p.name; if (solo && /^Player \d$/.test(n)) n = 'You';
        return { name: n, color: p.color, g: i === 0 ? newGame() : null };
      })
    };
    fx = { just: null, offerFresh: false, tlNew: -1 };
    save(); render();
    if (S.players.length > 1) setTimeout(function () { Kit.callout(S.players[0].name + ', come on down!'); }, 250);
    Kit.sfx('whoosh');
  }

  // ── Little timing helpers (taps on an overlay hurry things along) ─────────
  var wakers = [];
  function sleep(ms) { return new Promise(function (res) { var t = setTimeout(done, ms); function done() { clearTimeout(t); res(); } wakers.push(done); }); }
  function hurry() { var w = wakers; wakers = []; w.forEach(function (f) { f(); }); }
  function tv() { return S && S.pace !== 'quick'; }
  function closeOverlays() { document.querySelectorAll('.rv,.ring').forEach(function (n) { n.remove(); }); hurry(); }

  // Phone ring: a quick bell trill (synthesised here; Kit.sfx has no ring)
  var ac = null;
  function ringSound() {
    try { if (localStorage.getItem('gn_sound') === '0') return; } catch (e) {}
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      var t0 = ac.currentTime;
      for (var k = 0; k < 20; k++) {
        var o = ac.createOscillator(), gn = ac.createGain(), t = t0 + k * 0.04;
        o.type = 'triangle'; o.frequency.value = k % 2 ? 1250 : 940;
        gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.07, t + 0.004); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.038);
        o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + 0.045);
      }
    } catch (e) {}
  }
  function flash(good) {
    var f = el('div', { class: 'flash' + (good ? ' g' : '') }); document.body.appendChild(f);
    setTimeout(function () { f.remove(); }, 700);
  }

  // ── Picking and opening cases ─────────────────────────────────────────────
  function snapshot() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 30) undoStack.shift(); }
  function tapCase(i) {
    var g = G(); if (!g || busy) return;
    if (g.phase === 'pick') return pickCase(i);
    if (g.phase !== 'open' || i === g.my || isOpen(g, i) || need(g) <= 0) return;
    openCase(i);
  }
  function pickCase(i) {
    var g = G();
    snapshot();
    var from = caseEl(i) && caseEl(i).getBoundingClientRect();
    g.my = i; g.orig = i; g.phase = 'open';
    Kit.sfx('whoosh'); Kit.haptic('medium');
    save(); render();
    flyTo(from, document.querySelector('.ped .case'));
    setTimeout(function () { Kit.callout('Case ' + (i + 1) + '!'); }, 450);
  }
  function caseEl(i) { return document.querySelector('.cases .case[data-i="' + i + '"]'); }
  function flyTo(from, node) {
    if (!from || !node || !node.animate) return;
    var to = node.getBoundingClientRect();
    var dx = from.left + from.width / 2 - (to.left + to.width / 2), dy = from.top + from.height / 2 - (to.top + to.height / 2), s = from.width / to.width;
    node.animate([
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')', offset: 0 },
      { transform: 'translate(' + dx * 0.5 + 'px,' + (dy * 0.5 - 40) + 'px) scale(' + (s + 1) / 2 * 1.2 + ')', offset: 0.5 },
      { transform: 'none', offset: 1 }
    ], { duration: 700, easing: 'cubic-bezier(.3,.7,.3,1)' });
  }

  function openCase(i) {
    var g = G(), myGen = gen;
    snapshot();
    busy = true;
    var ce = caseEl(i); if (ce) ce.classList.add('picked');
    Kit.sfx('tap'); Kit.haptic('light');
    g.opened.push(i); save();
    reveal(g, i, { round: g.round }).then(function () {
      if (myGen !== gen) return;
      busy = false; fx.just = i;
      render(); fx.just = null;
      if (need(g) === 0) bankerCall();
    });
  }

  // How an opened amount lands: small is good news, big is bad news
  function toneOf(g, v) {
    if (v <= 750) return 'good';
    if (v >= 100000) return 'bad';
    return '';
  }
  function bigCallout(g, v) {
    var hiLeft = leftVals(g).filter(function (x) { return x >= 100000; }).length;
    if (v === 1000000) return 'The $1,000,000 is gone!';
    if (v >= 300000) return fmt(v) + ' gone!';
    if (v === 0.01) return 'The penny! Nice!';
    if (v <= 750 && need(g) === 0 && g.round >= 4 && hiLeft >= 2) return 'Phew!';
    return null;
  }

  // The close-up: case zooms in, a tense pause, the lid flips, the amount shows.
  function reveal(g, i, o) {
    o = o || {};
    var myGen = gen, v = g.vals[i];
    var quick = !tv() && !o.mine;
    var ov = el('div', { class: 'rv', role: 'dialog', 'aria-label': 'Opening case ' + (i + 1) });
    ov.innerHTML =
      '<div class="rv-in"><div class="bc"><div class="hdl"></div><div class="box"><div class="inside"><div class="plate ' + (isHi(v) ? 'hi' : 'lo') + '">' + fmt(v) + '</div></div>' +
      '<div class="lid"><div class="f"><span class="tag">' + (i + 1) + '</span></div><div class="k"></div></div></div></div>' +
      '<div class="rv-lbl">' + (o.mine ? '<small>' + esc(o.kicker || 'Your case') + '</small>' : o.kicker ? '<small>' + esc(o.kicker) + '</small>' : '') + 'Case ' + (i + 1) + '</div>' +
      '<div class="rv-cap"></div><div class="rv-hint">Tap to hurry</div></div>';
    document.body.appendChild(ov);
    var stage = 0;
    ov.addEventListener('click', function () { hurry(); });
    return (async function () {
      await sleep(16); ov.classList.add('show'); Kit.sfx('whoosh');
      await sleep(quick ? 260 : 420);
      // Suspense: a drum-roll of ticks that speeds up
      var hold = quick ? 250 : (o.mine ? 2600 : 1100 + Math.min(1100, (o.round || 0) * 150));
      ov.classList.add('tense');
      var t = 0, step = quick ? 125 : 230, skipped = false;
      var hurried = new Promise(function (res) { wakers.push(function () { skipped = true; res(); }); });
      while (t < hold && !skipped) {
        Kit.sfx('tick'); Kit.haptic('tick');
        await Promise.race([sleep(step), hurried]);
        t += step; step = Math.max(65, step * 0.88);
      }
      if (myGen !== gen) { ov.remove(); return; }
      ov.classList.remove('tense');
      ov.classList.add('open'); Kit.sfx('flip'); Kit.haptic('medium');
      ov.querySelector('.rv-hint').textContent = 'Tap to continue';
      await sleep(quick ? 260 : 420);
      var tone = o.tone != null ? o.tone : toneOf(g, v);
      if (tone) ov.classList.add(tone);
      var cap = o.caption != null ? o.caption : tone === 'good' ? 'Good news' : tone === 'bad' ? 'Ouch' : '';
      ov.querySelector('.rv-cap').textContent = cap;
      if (tone === 'bad') {
        Kit.sfx('bad'); if (v >= 300000) setTimeout(function () { Kit.sfx('lose'); }, 120);
        Kit.haptic('error'); flash(false);
      } else if (tone === 'good') { Kit.sfx('good'); Kit.haptic('success'); }
      else Kit.sfx('pop');
      var co = o.callout !== undefined ? o.callout : bigCallout(g, v);
      if (co) setTimeout(function () { Kit.callout(co, tone === 'bad' ? '#ff6b78' : tone === 'good' ? '#5dffa6' : null); }, 80);
      await sleep(quick ? 650 : (o.mine ? 2200 : 1700));
      ov.classList.remove('show');
      await sleep(220); ov.remove();
    })();
  }

  // ── The Banker calls ──────────────────────────────────────────────────────
  function bankerCall() {
    var g = G(), myGen = gen;
    var r = g.round;
    if (!g.offers.some(function (x) { return x.r === r; })) g.offers.push({ r: r, amt: bankerOffer(g, r) });
    g.phase = 'offer'; undoStack = []; save();
    busy = true;
    var ov = el('div', { class: 'ring', role: 'dialog', 'aria-label': 'The Banker is calling' });
    ov.innerHTML = '<div class="ring-in"><div class="phone">' + icon('phone') + '</div><div class="ring-t">The Banker<br>is calling<small>Round ' + (r + 1) + ' offer</small></div></div>';
    ov.addEventListener('click', hurry);
    document.body.appendChild(ov);
    (async function () {
      await sleep(16); ov.classList.add('show');
      var rings = tv() ? 2 : 1;
      for (var k = 0; k < rings; k++) { ringSound(); Kit.haptic('heavy'); await sleep(k === 0 ? 1150 : 1000); if (!document.body.contains(ov)) break; }
      ov.classList.remove('show'); await sleep(260); ov.remove();
      if (myGen !== gen) return;
      busy = false; fx.offerFresh = true; fx.tlNew = r;
      render(); fx.tlNew = -1;
    })();
  }
  function quip(g, amt) {
    var left = leftVals(g), mx = Math.max.apply(null, left), ev = mean(left), pct = Math.round(amt / ev * 100);
    var bits = [];
    if (mx === 1000000) bits.push('The $1M is still out there.');
    else if (mx >= 300000) bits.push(fmtK(mx) + ' still in play.');
    else bits.push('The big money is gone.');
    bits.push(pct + '% of the ' + fmtK(ev) + ' average.');
    return bits.join(' ');
  }
  function armDeal(btn) {
    if (busy) return;
    var w = btn.parentNode;
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); w.classList.add('armed');
      w.querySelector('small').textContent = 'Press to take the deal';
      Kit.sfx('pop'); Kit.haptic('light');
      return;
    }
    takeDeal();
  }
  function takeDeal() {
    var g = G(), off = g.offers.filter(function (x) { return x.r === g.round; })[0];
    if (!off) return;
    undoStack = [];
    g.deal = { r: g.round, amt: off.amt };
    g.round++;
    g.phase = g.round > 8 ? 'final' : 'after';
    save();
    Kit.sfx('win'); Kit.haptic('success'); Kit.confetti({ count: 90 });
    Kit.callout('DEAL!', '#ff5a5a');
    render();
    var myGen = gen;
    setTimeout(function () { if (myGen === gen) runOn(); }, 1300);
  }
  function noDeal() {
    if (busy) return;
    var g = G();
    g.round++;
    g.phase = g.round > 8 ? 'swap' : 'open';
    save();
    Kit.sfx('whoosh'); Kit.haptic('medium');
    Kit.callout('NO DEAL!');
    render();
    if (g.phase === 'swap') {
      var two = unopened(g).map(function (i) { return g.vals[i]; });
      if (two.indexOf(1000000) >= 0) setTimeout(function () { Kit.callout('The $1,000,000 is still alive!'); Kit.sfx('good'); }, 1300);
    }
  }

  // ── Final two: keep or swap ───────────────────────────────────────────────
  function lastOther(g) { return unopened(g).filter(function (i) { return i !== g.my; })[0]; }
  function choose(swap) {
    if (busy) return;

  // ── After a deal: what would have happened ────────────────────────────────
  var skipAfter = false;

  async function runAfter() {

  // ── Final reveal: the last case on stage, then yours ──────────────────────

  }

  function nextPlayer() {

  // ── Undo ──────────────────────────────────────────────────────────────────
  function undo() {
    if (busy) return Kit.toast('One moment…');
    var g = G();
    if (!undoStack.length) {
      if (g && (g.phase === 'offer' || g.phase === 'swap')) Kit.toast('The Banker already called. Opened cases stay open.', 2600);
      else if (g && (g.phase === 'after' || g.phase === 'final' || g.phase === 'done')) Kit.toast('A deal is a deal. No take-backs!');

  // ── Highlights & the record ───────────────────────────────────────────────
  function highlights(p, solo) {
    var g = p.g, out = [], won = g.result.won;
    var Sub = function (s) { return solo ? s.charAt(0).toUpperCase() + s.slice(1) : p.name + ' ' + s; };
    var poss = solo ? 'your' : p.name + '\'s';
    var mv = g.vals[g.my];
    if (g.deal) {
      out.push(Sub('took the deal at ' + fmt(g.deal.amt) + ' in round ' + (g.deal.r + 1) + '; ' + poss + ' case held ' + fmt(mv)));
      var bestG = g.ghost.slice().sort(function (a, b) { return b.amt - a.amt; })[0];
      if (bestG && bestG.amt > g.deal.amt * 1.15) out.push('The Banker would have gone up to ' + fmt(bestG.amt) + ' in round ' + (bestG.r + 1));
      else if (g.ghost.length >= 2 && bestG && bestG.amt < g.deal.amt) out.push(Sub('sold at the top: every later offer would have been lower'));
    } else {
      var otherV = g.vals[g.swapped ? g.orig : lastOtherAt(g)];
      if (g.swapped) out.push(Sub('swapped cases at the end and it ' + (won > otherV ? 'paid off' : 'backfired') + ' (' + fmt(won) + ' instead of ' + fmt(otherV) + ')'));
      else out.push(Sub('said No Deal all the way and won ' + fmt(won) + ' with case #' + (g.my + 1)));
      if (won === 1000000 || otherV === 1000000) out.push(Sub('kept the $1,000,000 case alive to the final two'));
    }
    var mi = g.vals.indexOf(1000000), pos = g.opened.indexOf(mi);
    if (mi !== g.my && pos >= 0 && pos < CUM[0]) out.push(Sub('opened the $1,000,000 in round 1'));
    if (g.opened.slice(0, 6).every(function (i) { return g.vals[i] <= 750; })) out.push(Sub('had a perfect first round: six small amounts'));
    var best = g.offers.slice().sort(function (a, b) { return b.amt - a.amt; })[0];
    if (best && (!g.deal || best.amt > g.deal.amt)) out.push('Highest offer' + (solo ? '' : ' to ' + p.name) + ': ' + fmt(best.amt) + ' in round ' + (best.r + 1));
    return out;
  }
  function lastOtherAt(g) {

  function finish() {

      return { name: p.name, won: g.result.won, deal: g.deal, myCase: g.my + 1, myValue: g.vals[g.my], orig: g.orig + 1, swapped: g.swapped, offers: g.offers, ghost: g.ghost };
    });

    Kit.record(HKEY, {

  // ── Render ────────────────────────────────────────────────────────────────
  function timelineHTML(g, compact) {
    var offers = g.offers || [], ghost = g.ghost || [];
    var all = offers.concat(ghost), mx = Math.max.apply(null, all.map(function (x) { return x.amt; }).concat([1]));
    var h = '<div class="tl"' + (compact ? ' style="margin:0;padding:0;border:0"' : '') + '>';

      var it = o || gh, isDeal = g.deal && g.deal.r === r;

      var hgt = it ? Math.max(3, Math.round(it.amt / mx * 32)) : 3;
      h += '<div class="' + cls + '"><span class="a">' + (it ? fmtK(it.amt) : '') + '</span><span class="b" style="height:' + hgt + 'px"></span><span class="n">' + (isDeal ? 'DEAL' : r + 1) + '</span></div>';
    }

  function render() {

  // Cases sit on risers: 3-4-4-4-4-4-3 on a phone, 6-7-6-7 on a wide screen

    }
    if (g.phase === 'after' || g.phase === 'final') {
      var row2 = el('div', { class: 'desk-row' });
      row2.appendChild(pedestal(g));
      var pr2 = el('div', { class: 'prompt' });
      if (g.deal) {
        var lastG = g.ghost[g.ghost.length - 1];
        pr2.innerHTML = '<h2>Deal at <b>' + fmt(g.deal.amt) + '</b></h2><p>' + (g.phase === 'after'
          ? (lastG && fx.tlNew === lastG.r ? 'The Banker would have offered <b style="color:#ffd76a">' + fmt(lastG.amt) + '</b>' : 'Let\'s see what would have happened…')
          : 'Now, what was in your case?') + '</p>';
      } else pr2.innerHTML = '<h2>' + (g.swapped ? 'You <b>swapped</b>' : 'You <b>kept</b> it') + '</h2><p>The moment of truth…</p>';
      row2.appendChild(pr2);
      d.appendChild(row2);
      if (g.phase === 'after') {
        var note = el('div', { class: 'after-note' }, [
          el('span', { text: (unopened(g).length - 1) + ' left on stage' }),
          el('button', { type: 'button', class: 'btn btn-soft btn-sm', style: { 'white-space': 'nowrap' }, text: 'Skip to my case', onclick: function () { skipAfter = true; hurry(); } })
        ]);
        d.appendChild(note);
      }
      d.insertAdjacentHTML('beforeend', timelineHTML(g));
      return d;
    }
    // done
    var won = g.result.won, mv = g.vals[g.my];
    var line = g.deal
      ? 'Deal in round ' + (g.deal.r + 1) + '. Case ' + (g.my + 1) + ' held <b class="' + (mv <= g.deal.amt ? 'tag-good' : 'tag-bad') + '">' + fmt(mv) + '</b>'
      : g.swapped ? 'Swapped to case ' + (g.my + 1) + '. Case ' + (g.orig + 1) + ' had <b>' + fmt(g.vals[g.orig]) + '</b>'
      : 'No Deal all the way with case ' + (g.my + 1);
    d.innerHTML = '<div class="center"><p style="margin:0">' + (solo ? 'You win' : esc(p.name) + ' wins') + '</p></div><div class="res-amt">' + fmt(won) + '</div><div class="res-line">' + line + '</div>';
    var more = S.players.length > 1 && S.cur < S.players.length - 1;
    if (S.players.length > 1) {
      var st = '<div class="stand">';
      S.players.forEach(function (q, i) {
        st += '<div><span class="avatar sm" style="--c:' + q.color + '">' + esc(q.name.charAt(0).toUpperCase()) + '</span><span>' + esc(q.name) + '</span>' +
          (q.g && q.g.result ? '<span class="v">' + fmt(q.g.result.won) + '</span>' : '<span class="p">' + (i === S.cur + 1 ? 'up next' : 'waiting') + '</span>') + '</div>';
      });
      d.insertAdjacentHTML('beforeend', st + '</div>');
    }
    if (more) d.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-lg btn-block', style: { 'margin-top': '14px' }, html: '<span>Next contestant: ' + esc(S.players[S.cur + 1].name) + '</span>' + icon('right'), onclick: nextPlayer }));
    d.insertAdjacentHTML('beforeend', timelineHTML(g));
    return d;
  }
  function handoffDesk() { return el('div'); }

  function countUp(node, amt, ms) {
    return new Promise(function (res) {
      var t0 = 0, lastTick = 0, myGen = gen;
      function f(t) {
        if (myGen !== gen || !document.body.contains(node)) return res();
        var k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3), x = amt * e;
        node.textContent = k >= 1 ? fmt(amt) : x < 1 ? '$0' : fmt(x >= 1000 ? Math.round(x / 10) * 10 : x);
        if (k < 1 && t - lastTick > 80) { Kit.sfx('chip'); lastTick = t; }
        if (k < 1) requestAnimationFrame(f); else res();
      }
      requestAnimationFrame(function (t) { t0 = t; f(t); });
    });
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved && saved.v === 2 && saved.players && saved.players.length) {
    S = saved;
    render();
    var g0 = G();
    if (g0 && g0.phase === 'done' && S.players.every(function (p) { return p.g && p.g.phase === 'done'; })) finish();
    else runOn();
  } else showSetup();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truth or Lies</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* TeX Gyre Pagella (GUST font licence, fonts/pagella-LICENSE.txt): the playbill's printed type */
@font-face{font-family:'Pagella';src:url('../fonts/pagella-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Pagella';src:url('../fonts/pagella-400italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap;}
@font-face{font-family:'Pagella';src:url('../fonts/pagella-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
body{overflow-x:hidden;}
.tl{max-width:560px;margin:0 auto;padding:0 12px calc(var(--safe-b) + 14px);}
.tl .play{position:relative;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:calc(100dvh - var(--safe-t) - var(--safe-b) - 74px);padding-bottom:2vh;}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center;font-family:var(--hand);font-size:1.5rem;color:var(--text-2);}

/* ── The playbill: what's on tonight and the house rules ── */
.bill{position:relative;padding:9px 14px 10px;border-radius:3px;color:#2b2118;font-family:'Pagella',Georgia,serif;
  background:radial-gradient(rgba(120,90,40,.06) 1px,transparent 1.2px) 0 0/5px 5px,radial-gradient(140% 100% at 50% 0%,#fffaf0 0%,#f5ead2 75%,#ecdcbb 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 0 #dccaa3,0 12px 26px rgba(0,0,0,.45);}
.bill::before,.bill::after{content:"";position:absolute;top:7px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d27a,#9a6b12);box-shadow:0 1px 2px rgba(0,0,0,.4);}
.bill::before{left:7px;}.bill::after{right:7px;}
.bill .top{display:flex;align-items:baseline;gap:8px;padding:0 8px 4px;border-bottom:1.5px solid #2b2118;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;}
.bill .top .lv{font-weight:700;}
.bill .top .no{font-style:italic;text-transform:none;letter-spacing:0;color:#6d5f49;font-size:.85rem;}
.bill .top .tm{margin-left:auto;font-family:var(--hand);font-size:1.15rem;letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums;}
.bill h2{margin:6px 0 2px;font-family:'Pagella',Georgia,serif;font-weight:700;font-size:1.3rem;line-height:1.1;text-align:center;letter-spacing:.01em;}
.bill .rule{margin:0;text-align:center;font-style:italic;font-size:.98rem;line-height:1.3;color:#3d3125;}
.bill .rule b{font-style:normal;font-weight:700;color:#2b2118;}
.bill .rule.flash{animation:ruleFlash 1.6s ease;}
@keyframes ruleFlash{0%,60%{background:rgba(255,190,40,.45);}100%{background:transparent;}}
.bill .rule .tw{font-style:normal;font-weight:700;padding:0 2px;border-radius:3px;}
.bill .rule .tw.t{color:#1d7a46;}.bill .rule .tw.l{color:#b3202f;}.bill .rule .tw.s{color:#6a3fb0;}

/* ── The theatre: wooden proscenium, painted backdrop, velvet curtains, a wooden stage ── */
.thr{position:relative;padding:6px;border-radius:16px;--drape:14px;--fh:118px;--tok:34px;}
.stg{position:relative;overflow:hidden;border-radius:11px;isolation:isolate;min-height:200px;background:#1b1420;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.45),inset 0 10px 30px rgba(0,0,0,.6);}
.backdrop{position:absolute;inset:0;z-index:0;pointer-events:none;}
.backdrop svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.backdrop::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 70%,transparent 30%,rgba(10,6,14,.55) 100%),linear-gradient(180deg,rgba(10,6,14,.15),rgba(10,6,14,.0) 40%,rgba(10,6,14,.35));}
/* stage floor: boards seen from the stalls, footlights along the front */
.boards{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tok) + 50px);z-index:1;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1.5px,transparent 1.5px 46px),repeating-linear-gradient(92deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),linear-gradient(180deg,#7d4d2b,#5a3219 60%,#3f220f);
  box-shadow:inset 0 3px 0 rgba(255,220,170,.25),inset 0 6px 10px rgba(0,0,0,.35);}
.boards::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35));}
.boards::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:8px;
  background:radial-gradient(circle,#fff3c4 0 2px,rgba(255,206,110,.6) 3px,transparent 7px) 0 50%/34px 8px repeat-x;filter:blur(.2px);opacity:.9;}
.glow{position:absolute;left:0;right:0;bottom:0;height:70%;z-index:1;pointer-events:none;background:radial-gradient(80% 60% at 50% 100%,rgba(255,200,120,.22),transparent 70%);}
/* curtains */
.valance{position:absolute;left:0;right:0;top:0;height:20px;z-index:6;pointer-events:none;
  background:radial-gradient(circle at 50% 0,#a3203a 0 13px,transparent 14px) 0 0/26px 20px repeat-x,linear-gradient(180deg,#7a1028,#9c1c36);
  -webkit-mask:linear-gradient(#000 0 9px,transparent 9px),radial-gradient(circle at 50% 0,#000 0 13px,transparent 13.5px) 0 0/26px 20px repeat-x;
  mask:linear-gradient(#000 0 9px,transparent 9px),radial-gradient(circle at 50% 0,#000 0 13px,transparent 13.5px) 0 0/26px 20px repeat-x;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));}
.valance::after{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:linear-gradient(90deg,#c99a2e,#f3d27a,#c99a2e);}
.drape{position:absolute;top:0;bottom:0;width:51%;z-index:5;pointer-events:none;transition:width 1s cubic-bezier(.6,.05,.25,1);
  background:repeating-linear-gradient(90deg,#5e0a1d 0,#9c1c36 9px,#c0304d 13px,#8a1530 19px,#5e0a1d 26px);box-shadow:0 0 18px rgba(0,0,0,.6);}
.drape.l{left:0;border-radius:0 0 30% 0;}
.drape.r{right:0;border-radius:0 0 0 30%;}
.stg.open .drape{width:var(--drape);}
.stg.open .drape.l{border-radius:0 0 10px 0;}.stg.open .drape.r{border-radius:0 0 0 10px;}

/* the cast and what they say: one grid, two arrangements */
.scene{position:relative;z-index:3;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:4px;row-gap:7px;
  padding:28px calc(var(--drape) + 6px) 8px;}
.scene.stack .bub{grid-column:1 / -1;grid-row:var(--row);justify-self:start;width:max-content;min-width:min(55%,240px);max-width:min(var(--bmax,92%),calc(100% - var(--ml,0px) - 10px));margin-left:var(--ml,0px);}
.scene.stack .actor{grid-row:calc(var(--n) + 1);grid-column:var(--col);}
.scene.cols{column-gap:10px;}
.scene.cols .bub{grid-row:1;grid-column:var(--col);align-self:end;margin-bottom:6px;}
.scene.cols .actor{grid-row:2;grid-column:var(--col);}
.scene.cols .bub .who{display:none;}

/* speech bubbles: paper balloons, comic lettering */
.bub{position:relative;padding:7px 12px 8px;border-radius:16px;background:#fffdf6;color:#20202a;
  box-shadow:0 0 0 2px #2a2230,0 5px 0 -1px rgba(0,0,0,.3),0 10px 18px -6px rgba(0,0,0,.55);
  font-family:var(--hand);font-size:1.08rem;line-height:1.22;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transform-origin:var(--tx,50%) 100%;transition:background .4s,box-shadow .3s,transform .25s var(--spring);}
.bub::after{content:"";position:absolute;bottom:-11px;left:var(--tx,50%);width:16px;height:13px;margin-left:-8px;background:#fffdf6;
  clip-path:polygon(0 0,100% 0,30% 100%);filter:drop-shadow(0 2px 0 #2a2230);transition:background .4s;}
.bub::before{content:"";position:absolute;bottom:-13.5px;left:var(--tx,50%);width:20px;height:16px;margin-left:-10px;background:#2a2230;clip-path:polygon(0 0,100% 0,30% 100%);}
.bub .who{float:left;display:flex;align-items:center;gap:5px;margin:1px 7px 0 -3px;padding-right:7px;border-right:1.5px solid rgba(0,0,0,.12);font-family:var(--font);font-weight:900;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#222);}
.bub .who .mh{width:26px;height:26px;margin:-4px 0 -4px -4px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,#fff);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 60%,#000);overflow:hidden;flex:none;}
.bub .who .mh svg{width:100%;height:100%;display:block;}
.bub .say{margin:0;padding-right:14px;}
.bub,.actor{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.nmx{white-space:nowrap;box-shadow:inset 0 -.36em 0 color-mix(in srgb,var(--c) 38%,transparent);border-radius:2px;padding:0 1px;}
.bub .tv{position:absolute;top:-9px;right:-7px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;
  box-shadow:0 2px 0 rgba(0,0,0,.3),0 0 0 2px #fffdf6;transform:scale(0);transition:transform .3s var(--spring),background .2s;}
.bub .tv .ico{width:16px;height:16px;stroke-width:3;}
.bub .tv.on{transform:scale(1);}
.bub .tv.t{background:#1f9a55;}.bub .tv.f{background:#d0283c;}.bub .tv.q{background:#7a52c7;}
.bub .exp{display:none;margin:5px 0 0;padding-top:5px;border-top:1.5px dashed rgba(0,0,0,.18);font-family:var(--font);font-size:.8rem;font-weight:700;line-height:1.3;color:#3a3a46;}
.bub.lit{animation:lit .5s var(--spring);}
@keyframes lit{40%{transform:scale(1.04);}}
.bub.hint{box-shadow:0 0 0 2px #2a2230,0 0 0 6px rgba(255,200,61,.9),0 0 26px 6px rgba(255,200,61,.55);animation:hintPulse 1.4s ease-in-out 3;}
@keyframes hintPulse{50%{box-shadow:0 0 0 2px #2a2230,0 0 0 9px rgba(255,200,61,.5),0 0 34px 10px rgba(255,200,61,.35);}}
.bub.bad{box-shadow:0 0 0 2px #2a2230,0 0 0 5px #ff4d5e,0 10px 18px -6px rgba(0,0,0,.55);animation:wob .5s;}
@keyframes wob{20%{transform:rotate(-2deg);}40%{transform:rotate(2deg);}60%{transform:rotate(-1.4deg);}80%{transform:rotate(1deg);}}
.bub.would{background:#ffe9ea;}.bub.would::after{background:#ffe9ea;}
.bub.rv .exp{display:block;animation:rise .45s var(--ease) both;}
.bub.rv-t{background:#e7f7ea;}.bub.rv-t::after{background:#e7f7ea;}
.bub.rv-f{background:#fde6e6;}.bub.rv-f::after{background:#fde6e6;}
.bub .stamp{position:absolute;right:9px;bottom:8px;padding:1px 6px;border:2.5px solid currentColor;border-radius:5px;font-family:var(--font);font-weight:900;font-size:.68rem;letter-spacing:.14em;opacity:0;transform:rotate(-9deg) scale(1.5);transform-origin:100% 50%;pointer-events:none;}
.bub.rv .stamp{opacity:.85;transform:rotate(-9deg) scale(1);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s;}
.bub.rv-t .stamp{color:#1d7a46;}.bub.rv-f .stamp{color:#b3202f;}
.bub.rv .exp{padding-right:62px;min-height:1.6em;}

/* the cast: paper-cut puppets on little wooden stands */
.actor{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;padding:0;border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.actor .fig{position:relative;height:var(--fh);width:100%;display:flex;justify-content:center;align-items:flex-end;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate;animation-delay:calc(var(--col) * -1.3s);}
@keyframes sway{from{transform:rotate(-1.2deg);}to{transform:rotate(1.2deg);}}
.actor .fig svg{height:100%;width:auto;max-width:118%;display:block;overflow:visible;
  filter:drop-shadow(1.5px 0 0 #fff6e2) drop-shadow(-1.5px 0 0 #fff6e2) drop-shadow(0 1.5px 0 #fff6e2) drop-shadow(0 -1.5px 0 #fff6e2) drop-shadow(0 4px 3px rgba(0,0,0,.55));}
.actor .hop{transition:transform .32s var(--spring);height:var(--fh);width:100%;display:flex;justify-content:center;align-items:flex-end;}
.actor.jump .hop{animation:hop .45s var(--ease);}
@keyframes hop{30%{transform:translateY(-14%) scale(1.03,.97);}60%{transform:translateY(0) scale(.98,1.03);}}
.actor .base{position:relative;height:calc(var(--tok) + 46px);width:100%;display:flex;flex-direction:column;align-items:center;}
.actor .stand{position:absolute;top:-5px;width:58%;max-width:60px;height:8px;border-radius:3px;background:linear-gradient(180deg,#a8723f,#6b3f1c);box-shadow:0 3px 4px rgba(0,0,0,.45);}
.tok{position:relative;margin-top:7px;width:var(--tok);height:var(--tok);border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.08),transparent 60%);box-shadow:inset 0 0 0 2px rgba(255,236,200,.35);transition:transform .35s var(--spring);}
.tok::before{content:"?";font-family:var(--display);font-size:calc(var(--tok) * .5);color:rgba(255,236,200,.4);}
.tok .ico{width:58%;height:58%;stroke-width:3.2;color:#fff;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35));}
.tok.m0,.tok.m1,.tok.m2{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 1px rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.35),0 5px 8px rgba(0,0,0,.4);}
.tok.m0::before,.tok.m1::before,.tok.m2::before{content:none;}
.tok.m0{background:radial-gradient(circle at 35% 28%,#5fd38a,#1f9a55 55%,#147040);}
.tok.m1{background:radial-gradient(circle at 35% 28%,#ff7d8a,#d0283c 55%,#9a1426);}
.tok.m2{background:radial-gradient(circle at 35% 28%,#b48cf0,#7a52c7 55%,#563394);}
.tok.flip{animation:coin .45s var(--ease);}
@keyframes coin{0%{transform:rotateY(90deg) translateY(-12px);}60%{transform:rotateY(-15deg) translateY(2px);}100%{transform:none;}}
.actor .nmp{margin-top:3px;max-width:100%;padding:1px 7px 2px;border-radius:4px;background:#f6edd8;color:#2b2118;font-family:var(--font);font-weight:900;font-size:.74rem;line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 2px 0 #b89f74,0 3px 5px rgba(0,0,0,.35),inset 0 -2px 0 color-mix(in srgb,var(--c) 70%,#000);}
.actor .nmp small{display:block;font-weight:800;font-size:.62rem;letter-spacing:.02em;color:#7a6a52;line-height:1.05;white-space:normal;}
.actor .nmp small:empty{display:none;}
.actor:focus-visible{outline:none;}
.actor:focus-visible .nmp{box-shadow:0 0 0 3px var(--yellow);}
.actor.lit .fig svg{filter:drop-shadow(1.5px 0 0 #fff6e2) drop-shadow(-1.5px 0 0 #fff6e2) drop-shadow(0 1.5px 0 #fff6e2) drop-shadow(0 -1.5px 0 #fff6e2) drop-shadow(0 0 10px rgba(255,214,110,.95));}
.actor.bad .tok{animation:shake .4s;}
/* faces: the figure shows one mouth at a time */
.fg .mo{display:none;}
.fg.f-n .mo.n,.fg.f-s .mo.s,.fg.f-k .mo.k,.fg.f-o .mo.o{display:inline;}
.fg .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 6s infinite;animation-delay:var(--bd,0s);}
@keyframes blink{0%,94%,100%{transform:scaleY(1);}96%{transform:scaleY(.1);}}
.fg.f-k .brow.r{transform:translateY(-2px) rotate(-8deg);transform-box:fill-box;transform-origin:50% 50%;}
.fg.f-o .brow{transform:translateY(-3px);}
/* verdicts at the end */
.actor.v0 .fig::after,.actor.v1 .fig::after,.actor.v2 .fig::after{content:"";position:absolute;left:50%;bottom:-6px;width:80%;height:22px;margin-left:-40%;border-radius:50%;z-index:-1;filter:blur(6px);}
.actor.v0 .fig::after{background:rgba(80,230,140,.6);}.actor.v1 .fig::after{background:rgba(255,80,100,.55);}.actor.v2 .fig::after{background:rgba(170,120,255,.6);}
.actor.bow .hop{animation:bow .7s var(--ease);}
@keyframes bow{40%{transform:rotate(-10deg) translateY(4%);}}

/* accusing: the house lights drop and a spotlight waits for you */
.stg .dim{position:absolute;inset:0;z-index:2;background:rgba(6,3,12,.62);opacity:0;pointer-events:none;transition:opacity .35s;}
.stg.accuse .dim{opacity:1;}
.stg.accuse .bub{opacity:.45;}
.stg.accuse .actor .nmp{box-shadow:0 0 0 2px #ffd36b,0 0 14px rgba(255,211,107,.6);}
.stg.accuse .actor .fig{animation:none;}
.stg.accuse .actor:hover .fig svg,.stg.accuse .actor.pick .fig svg{filter:drop-shadow(1.5px 0 0 #fff6e2) drop-shadow(-1.5px 0 0 #fff6e2) drop-shadow(0 1.5px 0 #fff6e2) drop-shadow(0 -1.5px 0 #fff6e2) drop-shadow(0 0 14px rgba(255,236,170,1));}
.beam{position:absolute;z-index:2;top:0;width:150px;margin-left:-75px;pointer-events:none;opacity:0;transition:opacity .3s,left .35s var(--ease);
  background:linear-gradient(180deg,rgba(255,244,200,.0),rgba(255,240,190,.28) 70%,rgba(255,240,190,.4));clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);}
.beam.on{opacity:1;}
.cue{position:absolute;left:50%;top:26px;z-index:7;transform:translateX(-50%);padding:5px 14px;border-radius:999px;background:rgba(20,14,30,.85);color:#ffe7a6;font-weight:900;font-size:.85rem;white-space:nowrap;box-shadow:0 0 0 1.5px rgba(255,211,107,.6);opacity:0;transition:opacity .3s;pointer-events:none;}
.stg.accuse .cue{opacity:1;}
/* caught: the evidence turns up in their hand */
.prop{position:absolute;z-index:4;width:calc(var(--fh) * .3);left:calc(50% + var(--fh) * .16);bottom:calc(var(--fh) * .1);opacity:0;transform:translateY(20px) rotate(-20deg) scale(.4);transition:all .55s cubic-bezier(.2,1.5,.4,1);pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));}
.actor.caught .prop{opacity:1;transform:none;}
.guilty{position:absolute;left:50%;top:38%;z-index:5;padding:2px 8px;border:3px solid #e8344a;border-radius:6px;color:#e8344a;background:rgba(255,250,240,.9);font-family:var(--font);font-weight:900;font-size:.8rem;letter-spacing:.14em;white-space:nowrap;opacity:0;transform:translateX(-50%) rotate(-12deg) scale(2.2);pointer-events:none;}
.actor.caught .guilty{opacity:1;transform:translateX(-50%) rotate(-12deg) scale(1);transition:transform .4s cubic-bezier(.2,1.6,.4,1) .5s,opacity .2s .5s;}

/* entrances */
.stg.open .actor .hop{animation:enter .7s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.35s + var(--col) * .09s);}
@keyframes enter{from{transform:translateY(70%);}to{transform:none;}}
.stg.open .bub{animation:bubIn .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(.8s + var(--row) * .14s);}
@keyframes bubIn{from{transform:scale(.2);opacity:0;}to{transform:none;opacity:1;}}
.stg.settled .actor .hop,.stg.settled .bub{animation-delay:0s;}
.stg.settled .bub{animation:none;}
.stg.settled .bub.lit{animation:lit .5s var(--spring);}
.stg.settled .bub.bad{animation:wob .5s;}
.stg.settled .bub.hint{animation:hintPulse 1.4s ease-in-out 3;}
.stg.settled .actor .hop{animation:none;}
.stg.settled .actor.jump .hop{animation:hop .45s var(--ease);}
.stg.settled .actor.bow .hop{animation:bow .7s var(--ease);}

/* ── Tray: clean chrome ── */
.tray{position:relative;display:grid;grid-template-columns:62px 62px 1fr;gap:8px;align-items:stretch;}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:0;border-radius:14px;background:var(--w07);color:var(--text-2);font-weight:800;font-size:.7rem;transition:transform .12s var(--spring),background .15s;}
.tool .ico{width:22px;height:22px;}
.tool:active{transform:scale(.93);background:var(--w14);}
.tool:disabled{opacity:.35;}
.tool .pips{display:flex;gap:3px;height:6px;}
.tool .pips i{width:6px;height:6px;border-radius:50%;background:var(--yellow);}
.tool .pips i.used{background:var(--w14);}
.go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;font-size:1.15rem;}
.go .ico{width:22px;height:22px;}
.go .dots{display:flex;gap:4px;}
.go .dots i{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--accent-ink) 30%,transparent);}
.go .dots i.on{background:var(--accent-ink);}
.go:disabled{filter:saturate(.5);opacity:.6;}
.go.cancel{--b:var(--w12);--b-ink:var(--text);}
.tray.done{grid-template-columns:1fr 1fr;}
.tray.done .go{font-size:1.02rem;white-space:nowrap;gap:8px;padding:0 10px;}

      '<h3>Playing</h3><ul>' +
      '<li>Tap a character to put a token at their feet: <b>green</b> for truth, <b>red</b> for lies (and <b>purple</b> for a spy, who can say anything). Tap again to change it.</li>' +
      '<li>Each speech bubble then shows a tick or a cross: a truth-teller\'s words must be true, a liar\'s must be false. When the ticks and crosses all fit, you have it.</li>' +
      '<li><b>Who is who</b> puzzles: when everyone has a token, press <b>Check</b>.</li>' +
      '<li><b>Whodunits</b>: someone did it, and the playbill says how many are lying. Tokens are your notes. Press <b>Accuse</b>, then tap the one who did it.</li></ul>' +
      '<h3>Help</h3><ul><li><b>Hint</b>, two per puzzle: the first shows which words to look at, the second says what they prove.</li>' +
      '<li>A wrong answer points at the words that can\'t be right, without giving the answer away.</li>' +
      '<li>When you solve it, every bubble lights up true or false and says why. <b>Step by step</b> walks through the whole chain of reasoning.</li></ul>' +
      '<h3>Levels</h3><ul><li><b>Easy:</b> two or three people. Each statement can be cracked on its own.</li>' +
      '<li><b>Medium:</b> three or four people. You\'ll need to put two statements together.</li>' +
      '<li><b>Hard:</b> four or five people, with counting, "if… then", "would tell you", spies and two liars.</li>' +

    // tray
    tray = el('div', { class: 'tray' });
    play.appendChild(tray);
    play.appendChild(el('div', { class: 'note', id: 'note' }));
    app.appendChild(play);
    buildTray();
    layout(); render();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
    if (fresh) {
      requestAnimationFrame(function () { requestAnimationFrame(function () { stage.classList.add('open'); Kit.sfx('whoosh'); }); });
      setTimeout(function () { stage.classList.add('settled'); }, 2200);
    }
    if (S.done) { reveal(true); } else startClock();
  }
  function buildTray() {
    tray.innerHTML = '';
    tray.className = 'tray' + (S.done ? ' done' : '');
    if (S.done) {
      tray.appendChild(el('button', { type: 'button', class: 'btn btn-soft go', html: Kit.icon('rows') + '<span>Step by step</span>', onclick: function () { Kit.sfx('pop'); steps(); } }));
      tray.appendChild(el('button', { type: 'button', class: 'btn btn-primary go', html: Kit.icon('sparkle') + '<span>' + (S.cls >= 0 ? 'Next classic' : 'Next puzzle') + '</span>', onclick: function () { Kit.sfx('pop'); newPuzzle(S.mode === 'daily' ? S.lvl : S.mode); } }));
      goBtn = hintBtn = undoBtn = null; return;
    }
    undoBtn = el('button', { type: 'button', class: 'tool', 'aria-label': 'Undo', html: Kit.icon('undo') + '<span>Undo</span>', onclick: undo });
    hintBtn = el('button', { type: 'button', class: 'tool', 'aria-label': 'Hint', html: Kit.icon('lightbulb') + '<span class="pips"><i></i><i></i></span>', onclick: hint });
    goBtn = el('button', { type: 'button', class: 'btn btn-primary go', onclick: check });
    tray.appendChild(undoBtn); tray.appendChild(hintBtn); tray.appendChild(goBtn);
  }
  function bump(i) { var a = actorEls[i]; if (!a) return; a.classList.remove('jump'); void a.offsetWidth; a.classList.add('jump'); }
  function render(changed) {
    if (!S || !actorEls.length) return;
    var Nn = N();
    for (var i = 0; i < P.n; i++) {
      var m = S.marks[i], a = actorEls[i], tok = a.querySelector('.tok'), b = bubbleEls[i], tv = b.querySelector('.tv');
      var key = String(m);
      if (tok._k !== key) {
        tok._k = key; tok.className = 'tok' + (m >= 0 ? ' m' + m : '');
        tok.innerHTML = m === 0 ? Kit.icon('check') : m === 1 ? Kit.icon('close') : m === 2 ? Kit.icon('eye') : '';
        if (changed === i && m >= 0) { void tok.offsetWidth; tok.classList.add('flip'); }
        a.querySelector('.nmp small').textContent = m >= 0 ? typeName(m) : '';
        tv.className = 'tv' + (m === 0 ? ' on t' : m === 1 ? ' on f' : m === 2 ? ' on q' : '');
        tv.innerHTML = m === 0 ? Kit.icon('check') : m === 1 ? Kit.icon('close') : m === 2 ? '<b style="font-family:var(--display);font-size:.95rem">?</b>' : '';
      }
      a.setAttribute('aria-label', P.names[i] + (m >= 0 ? ', marked ' + typeName(m) : ', no token') + (S.done ? '' : '. Tap to change.'));
    }
    if (S.done) { if (tray && !tray.classList.contains('done')) buildTray(); return; }
    if (undoBtn) undoBtn.disabled = !U.length || busy;
    if (hintBtn) {
      hintBtn.disabled = busy;
      Array.prototype.forEach.call(hintBtn.querySelectorAll('.pips i'), function (p, k) { p.classList.toggle('used', k < S.hints); });
    }
    if (goBtn) {
      if (P.fam === 'wd') {
        goBtn.className = 'btn go ' + (accusing ? 'btn-soft cancel' : 'btn-primary');
        goBtn.innerHTML = accusing ? Kit.icon('close') + '<span>Cancel</span>' : Kit.icon('target') + '<span>Accuse</span>';
        goBtn.disabled = busy;
      } else {
        var n = S.marks.filter(function (x) { return x >= 0; }).length;
        goBtn.className = 'btn btn-primary go';
        goBtn.innerHTML = Kit.icon('check') + '<span>Check</span><span class="dots">' + S.marks.map(function (x) { return '<i class="' + (x >= 0 ? 'on' : '') + '"></i>'; }).join('') + '</span>';
        goBtn.disabled = n < P.n || busy;
      }
    }
  }
  // Wide enough for a column each: bubbles stand over their speakers. Otherwise they stack, each nudged
  // toward its speaker with the tail pointing down at them.
  function layout() {
    if (!scene || !scene.isConnected) return;
    var cs = getComputedStyle(scene), pl = parseFloat(cs.paddingLeft), W = scene.clientWidth - pl - parseFloat(cs.paddingRight);
    var cols = W / P.n >= 128;
    scene.classList.toggle('cols', cols); scene.classList.toggle('stack', !cols);
    // the badge in each bubble's corner hangs 7px past its edge: keep 10px clear of the stage's right side
    bubbleEls.forEach(function (b) { b.style.removeProperty('--ml'); b.style.removeProperty('--tx'); b.style.setProperty('--bmax', Math.round(W * 0.92) + 'px'); });
    if (cols) return;
    var ml = bubbleEls.map(function (b, i) {
      var a = actorEls[i], cx = a.offsetLeft + a.offsetWidth / 2 - pl, bw = b.offsetWidth;
      var m = Math.max(0, Math.min(W - bw - 10, cx - bw * (0.25 + 0.5 * i / Math.max(1, P.n - 1))));
      return { m: m, tx: Math.max(18, Math.min(bw - 18, cx - m)) };
    });
    bubbleEls.forEach(function (b, i) { b.style.setProperty('--ml', ml[i].m + 'px'); b.style.setProperty('--tx', ml[i].tx + 'px'); });
  }
  var lt = 0;
  window.addEventListener('resize', function () { clearTimeout(lt); lt = setTimeout(layout, 80); });

  // ── Keyboard ──────────────────────────────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    if (!S || document.querySelector('.k-scrim,.k-win') || !actorEls.length) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || S.done) return;
    if (/^[1-5]$/.test(e.key) && +e.key <= P.n) { cycle(+e.key - 1); return; }
    if (e.key === 'Enter') { check(); return; }
    if (e.key === 'h' || e.key === 'H') hint();
    if (e.key === 'Escape' && accusing) setAccuse(false);
  });

  // ── Classics: hand-written puzzles in the old style (each checked by the solver: one answer) ──
  // [set, level, names, statements (kind, args...), extra {spy, rule, v:[text variants]}]
  // ==CLASSICS==
  var CLASSICS = [
    ['island', 'easy', ['Ada', 'Ben'], [['bL', 0, 1], ['L', 0]]],
    ['island', 'easy', ['Cleo', 'Dev'], [['oL', 0, 1], ['L', 0]]],
    ['bakeoff', 'easy', ['Ada', 'Ben', 'Cleo'], [['not', 0], ['did', 0], ['not', 1]], { rule: 'thief' }],
    ['castle', 'easy', ['Hugo', 'Iris'], [['same', 0, 1], ['L', 0]], { v: [0, 1] }],
    ['woods', 'easy', ['Juno', 'Kai'], [['diff', 0, 1], ['T', 0]]],
    ['museum', 'easy', ['Dev', 'Edie', 'Finn'], [['did', 1], ['not', 1], ['not', 2]], { rule: 'onet' }],
    ['market', 'easy', ['Lena', 'Milo', 'Nell'], [['L', 1], ['same', 0, 2], ['bL', 0, 2]]],
    ['island', 'easy', ['Otto', 'Pia', 'Quinn'], [['nL', 2], ['same', 0, 1], ['T', 1]], { v: [0, 0, 1] }],
    ['ship', 'easy', ['Gia', 'Hugo', 'Iris'], [['did', 1], ['did', 2], ['lie', 1]], { rule: 'one', v: [1, 0, 0] }],
    ['woods', 'easy', ['Uma', 'Vic', 'Wren'], [['L', 2], ['bL', 0, 2], ['diff', 0, 2]]],
    ['market', 'easy', ['Abe', 'Bea', 'Cal'], [['oL', 1, 2], ['diff', 0, 1], ['would', 1, 0, 1]]],
    ['castle', 'medium', ['Rosa', 'Sam', 'Tess'], [['allT'], ['L', 0], ['L', 1]]],
    ['island', 'medium', ['Dora', 'Eli', 'Fay', 'Gus'], [['nL', 1], ['nL', 2], ['nL', 3], ['nL', 4]]],
    ['library', 'medium', ['Jack', 'Kai', 'Lena', 'Milo'], [['did', 1], ['did', 3], ['not', 2], ['lie', 1]], { rule: 'one' }],
    ['castle', 'medium', ['Hana', 'Ivo', 'Jack', 'Kit'], [['L', 1], ['L', 2], ['L', 3], ['bL', 0, 3]], { v: [0, 1, 2, 0] }],
    ['woods', 'medium', ['Lou', 'Mae', 'Nico', 'Omar'], [['same', 1, 2], ['if', 0, 0, 3, 1], ['L', 0], ['L', 1]]],
    ['train', 'medium', ['Nell', 'Otto', 'Pia', 'Quinn'], [['did', 1], ['did', 3], ['not', 2], ['lie', 1]], { rule: 'onet' }],
    ['bakeoff', 'medium', ['Rosa', 'Sam', 'Tess', 'Uma'], [['nei', 0, 1], ['or', 2, 3], ['did', 0], ['not', 3]], { rule: 'one' }],
    ['museum', 'medium', ['Vic', 'Wren', 'Yara', 'Zack'], [['not', 0], ['did', 2], ['did', 3], ['not', 3]], { rule: 'onet' }],
    ['library', 'medium', ['Fay', 'Gus', 'Hana', 'Ivo', 'Juno'], [['not', 0], ['tru', 3], ['nei', 2, 3], ['did', 4], ['lie', 3]], { rule: 'one' }],
    ['market', 'hard', ['Pip', 'Raj', 'Sol', 'Theo', 'Vera'], [['more'], ['aL', 3], ['would', 0, 4, 0], ['one', 0, 1, 4], ['nL', 2]]],
    ['island', 'hard', ['Wes', 'Yara', 'Zoe', 'Ari'], [['would', 1, 2, 1], ['diff', 0, 2], ['oL', 0, 3], ['if', 1, 0, 2, 0]]],
    ['ship', 'hard', ['Abe', 'Bea', 'Cal', 'Dora', 'Eli'], [['did', 1], ['not', 2], ['or', 3, 4], ['lie', 0], ['not', 0]], { rule: 'two' }],
    ['castle', 'hard', ['Bo', 'Cy', 'Dot', 'Emil', 'Flo'], [['nL', 1], ['nL', 2], ['nL', 3], ['nL', 4], ['nL', 5]]],
    ['island', 'hard', ['Gia', 'Hal', 'Ida'], [['if', 0, 0, 1, 0], ['S', 0], ['nS', 2]], { spy: 1 }],
    ['train', 'hard', ['Kit', 'Lou', 'Mae', 'Nico'], [['did', 2], ['did', 0], ['tru', 1], ['not', 3]], { rule: 'onet' }],
    ['castle', 'hard', ['Jo', 'Lev', 'Mira'], [['oL', 0, 2], ['S', 0], ['T', 0]], { spy: 1 }],
    ['woods', 'hard', ['Ned', 'Ora', 'Ray', 'Ski'], [['nS', 0], ['if', 1, 0, 2, 0], ['S', 1], ['bL', 0, 1]], { spy: 1 }],
    ['bakeoff', 'hard', ['Omar', 'Pip', 'Raj', 'Sol', 'Theo'], [['or', 1, 2], ['or', 0, 2], ['did', 3], ['lie', 2], ['nei', 0, 4]], { rule: 'two' }],
    ['market', 'hard', ['Tam', 'Uma', 'Vic', 'Wren'], [['S', 1], ['T', 0], ['nL', 1], ['if', 1, 1, 3, 1]], { spy: 1 }]
  ];
  // ==/CLASSICS==
  function classic(i) {
    var c = CLASSICS[i], ex = c[4] || {};
    var p = { fam: TL.SETS[c[0]].fam, set: c[0], n: c[2].length, names: c[2].slice(), spy: ex.spy ? 1 : 0, rule: ex.rule || undefined,
      st: c[3].map(function (s, k) { return { k: s[0], a: s.slice(1), v: (ex.v && ex.v[k]) || 0, f: (ex.f && ex.f[k]) || 0 }; }) };
    if (p.fam === 'kk') delete p.rule; else delete p.spy;
    p.sol = TL.solve(p)[0]; p.level = c[1];
    return p;
  }

  // Test hook
  // the history view draws each speaker's face with this (on this page only)
  window.TruthArt = { heads: function (set, names) { var L = Art.looks({ set: set, names: names, n: names.length }), u = 'hv' + Math.floor(Math.random() * 1e6); return L.map(function (x, i) { return Art.head(x, u + 'h' + i); }); } };
  window.__tl = { get: function () { return S; }, TL: TL, Art: Art, classics: CLASSICS, classic: classic,
    answer: function () { return P ? (P.fam === 'wd' ? P.sol.c : P.sol.t.slice()) : null; },
    mark: function (arr) { S.marks = arr.slice(); render(); save(); }, layout: function () { layout(); },
    start: newPuzzle, hint: function () { hint(); }, check: function () { check(); }, pick: function (i) { pick(i); }, fam: function () { return P && P.fam; } };

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  var going = saved && saved.S && saved.S.p && Array.isArray(saved.S.marks) && !saved.S.done;
  function resumeSaved() { S = saved.S; U = saved.U || []; build(false); }
  if (/[?&]daily=1/.test(location.search)) {
    try { history.replaceState(history.state, '', location.pathname + location.search.replace(/([?&])daily=1&?/, '$1').replace(/[?&]$/, '') + location.hash); } catch (e) {}
    if (going && saved.S.daily === today()) resumeSaved();
    else if (dailyDone()) showSetup();
    else if (going && saved.S.time > 5) Kit.confirm("Start today's daily?", { ok: 'Start daily', cancel: 'Keep playing', body: 'The ' + LVN[saved.S.lvl] + ' puzzle you have going will be dropped.' }).then(function (ok) { if (ok) newPuzzle('daily'); else resumeSaved(); });
    else newPuzzle('daily');
  } else if (going) resumeSaved();
  else showSetup();
})();

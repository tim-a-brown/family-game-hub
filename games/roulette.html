<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roulette</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>

<style>
/* ── Casino chips (local; candidates for the kit) ─────────────────────────
   Standard colours: 1 white, 5 red, 25 green, 100 black, 500 purple. */
.c3{--cs:28px;--c:#c8202f;--s:#fff;--k:#fff;
  position:relative;width:var(--cs);height:var(--cs);border-radius:50%;flex:none;
  display:grid;place-items:center;color:var(--k);font:900 calc(var(--cs) * .36)/1 var(--font);letter-spacing:-.03em;
  background:
    radial-gradient(circle, var(--c) 0 46%, var(--s) 47% 50%, var(--c) 51% 63%, transparent 64%),
    repeating-conic-gradient(from 8deg, var(--s) 0 16deg, var(--c) 16deg 45deg);
  box-shadow:0 calc(var(--cs) * .06) 0 color-mix(in srgb,var(--c) 55%,#000), 0 calc(var(--cs) * .1) calc(var(--cs) * .14) rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.18);}
.c3.d1{--c:#f1ece0;--s:#2f6bd8;--k:#1d2440;}
.c3.d5{--c:#c8202f;--s:#fff;}
.c3.d25{--c:#1d8a4b;--s:#fff;}
.c3.d100{--c:#1b1b22;--s:#e8e2d0;}
.c3.d500{--c:#6a3aa2;--s:#f3d34a;}
.stk{position:absolute;width:var(--cs);height:var(--cs);transform:translate(-50%,-50%);pointer-events:none;z-index:5;transition:opacity .5s, transform .5s var(--ease);}
.stk .c3{position:absolute;left:0;}
.stk .c3:not(:last-child){font-size:0;}
.stk.drop{animation:chipdrop .28s var(--spring);}
@keyframes chipdrop{from{transform:translate(-50%,-90%) scale(1.25);opacity:.4;}to{transform:translate(-50%,-50%);}}
.stk.lost{opacity:0;transform:translate(-50%,-260%) scale(.7);}
.stk.won .c3:last-child{box-shadow:0 0 0 3px #ffd54a, 0 0 16px rgba(255,213,74,.9);}
.stk .pay{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;padding:2px 7px;border-radius:999px;
  background:#ffd54a;color:#3a2600;font:900 .78rem/1.2 var(--font);box-shadow:0 2px 6px rgba(0,0,0,.4);animation:pop .4s var(--spring);}

/* ── Head: little wheel + last numbers board ─────────────────────────── */
/* --rail already includes the safe-area inset (it's the rail's full height) */
.stage.rl{max-width:560px;padding-bottom:calc(var(--rail,150px) + 8px);}
.hcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
@media (min-width:700px) and (orientation:portrait){ .stage.rl{max-width:680px;} .rail .rail-in{max-width:680px;padding:0 16px;box-sizing:border-box;} }
.head{display:flex;gap:10px;align-items:stretch;border-radius:20px;padding:8px;margin-bottom:10px;}
.mini{flex:none;width:118px;height:118px;border-radius:50%;cursor:pointer;}
.board{flex:1;min-width:0;border-radius:12px;padding:8px 10px;background:linear-gradient(#141218,#0b0a0e);box-shadow:inset 0 2px 8px rgba(0,0,0,.8), 0 0 0 2px rgba(0,0,0,.4);display:flex;flex-direction:column;}
.board .lbl{font-size:.64rem;font-weight:900;letter-spacing:.14em;color:#8d8678;text-transform:uppercase;display:flex;justify-content:space-between;}
.board .nums{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;margin-top:6px;}
.board .nb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:400 .98rem/1 var(--display);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3);}
.board .nb.first{width:38px;height:38px;font-size:1.3rem;box-shadow:0 0 0 2px #ffd54a, inset 0 -2px 0 rgba(0,0,0,.3);}
.nb.red{background:#c62a35;} .nb.black{background:#2a2a31;} .nb.green{background:#11804a;}
.board .empty{color:#6b655a;font-size:.85rem;font-weight:700;margin:auto 0;}
.board .hot{font-size:.74rem;font-weight:800;color:#c8bfa8;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.bank{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.bank div{background:rgba(255,255,255,.06);border-radius:12px;padding:5px 8px;text-align:center;min-width:0;}
.bank small{display:block;font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.bank b{display:block;font-size:1.08rem;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bank .gold{color:var(--yellow);} .pos{color:var(--green)!important;} .neg{color:var(--red)!important;}

.msg{min-height:24px;text-align:center;font-weight:800;color:var(--text-2);margin:-2px 0 8px;font-size:.92rem;line-height:1.3;}
.msg b{color:var(--text);}
/* Bet guide: tag under the message line, and the tables in its sheet */
.bg-row{display:flex;justify-content:center;min-height:25px;margin:-2px 0 8px;}
.bg-row.hide{visibility:hidden;}
.cmp .bg-row{margin:-2px 0 6px;}
.cch-best .bg-note{display:block;margin-top:8px;font-size:.82rem;line-height:1.35;color:var(--text-3);}
.bg-ride{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:baseline;font-size:.86rem;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums;}
.bg-ride b{color:var(--text);font-weight:900;}
.bg-ride .r{text-align:right;white-space:nowrap;}
.bg-ride .hd{font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}

/* ── Betting layout on felt ──────────────────────────────────────────── */
.tbl{border-radius:22px;padding:8px;}
.tbl .felt-in{position:relative;border-radius:16px;padding:10px;}
.lay{--rh:30px;position:relative;margin:0 auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer;}
.cell{position:absolute;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);font-family:var(--display);line-height:1;transition:box-shadow .15s, filter .15s;}
.cell.n{font-size:min(1.18rem, calc(var(--rh) * .66));text-shadow:0 1px 0 rgba(0,0,0,.4);}
.cell.red{background:linear-gradient(180deg,#d0333e,#a8161f);}
.cell.black{background:linear-gradient(180deg,#2c2c33,#141418);}
.cell.green{background:linear-gradient(180deg,#169155,#0c6a3c);font-size:min(1.4rem, calc(var(--rh) * .8));}
.cell.zero.eu{border-radius:50% 50% 0 0 / 70% 70% 0 0;}
.cell.zero.l{border-radius:60% 0 0 0 / 80% 0 0 0;}
.cell.zero.r{border-radius:0 60% 0 0 / 0 80% 0 0;}
/* the table on its side (wide screens): the zero rounds off to the left, the dozens read straight across */
.lay.rot .cell.zero.eu{border-radius:70% 0 0 70% / 50% 0 0 50%;}
.lay.rot .cell.zero.l{border-radius:0 0 0 80% / 0 0 0 60%;}
.lay.rot .cell.zero.r{border-radius:80% 0 0 0 / 60% 0 0 0;}
.lay.rot .cell.fx.dz span{transform:none;font-size:.95rem;}
.lay.rot .cell.fx{font-size:.9rem;}
.cell.fx{background:transparent;font-family:var(--font);font-weight:900;font-size:.8rem;letter-spacing:.04em;color:#f3ecd6;text-transform:uppercase;}
.cell.fx.dz span{transform:rotate(-90deg);white-space:nowrap;font-size:.86rem;}
.cell.strip{background:rgba(0,0,0,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);}
.cell.note{box-shadow:none;color:rgba(255,255,255,.35);font-size:.6rem;letter-spacing:.12em;text-align:center;line-height:1.25;}
.diamond{width:62%;height:52%;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.diamond.red{background:#c62a35;} .diamond.black{background:#18181c;}
.diamond-wrap{position:relative;width:100%;height:100%;display:grid;place-items:center;}
.diamond-wrap::before{content:"";position:absolute;width:calc(62% + 4px);height:calc(52% + 4px);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:rgba(255,255,255,.75);}
.diamond{position:relative;}
.cell.lit{box-shadow:inset 0 0 0 3px #ffd54a, inset 0 0 18px rgba(255,213,74,.75);filter:brightness(1.12);}
.cell.hitn{animation:hitn 1s ease-in-out 3;}
/* Drag and drop: the bet a drop would make */
.cell.tgt{box-shadow:inset 0 0 0 3px #ffd54a, inset 0 0 16px rgba(255,213,74,.6);filter:brightness(1.2);}
.tring{position:absolute;z-index:6;width:var(--cs);height:var(--cs);transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  border:2px dashed #ffd54a;background:rgba(255,213,74,.22);box-shadow:0 0 12px rgba(255,213,74,.85);animation:pop .25s var(--spring);}
.stk.lifted{opacity:.28;}
@keyframes hitn{50%{box-shadow:inset 0 0 0 3px #fff, 0 0 18px #ffd54a;filter:brightness(1.4);}}
.dolly{position:absolute;z-index:8;width:17px;height:24px;transform:translate(-50%,-78%);pointer-events:none;animation:dolly .5s var(--spring);
  background:radial-gradient(circle at 40% 30%,#fff,#d8d2c4 60%,#9d968a);border-radius:50% 50% 40% 40% / 60% 60% 40% 40%;box-shadow:0 6px 8px rgba(0,0,0,.5);}
.dolly::after{content:"";position:absolute;left:50%;top:-6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#cfc8b8);box-shadow:0 1px 2px rgba(0,0,0,.4);}
@keyframes dolly{from{transform:translate(-50%,-180%);opacity:0;}}

/* ── Rail: chip tray and buttons (fixed to the bottom) ───────────────── */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px calc(12px + var(--corner-x)) calc(var(--safe-b) + 10px + var(--corner-y));border-radius:22px 22px 0 0;}
.rail-in{max-width:560px;margin:0 auto;}
.rail .cz-rack{margin-top:2px;margin-bottom:8px;}
.acts{display:flex;gap:8px;align-items:center;}
.acts .icon-btn{width:52px;height:52px;background:rgba(0,0,0,.28);}
.acts .btn{min-height:52px;}
.acts .spin{flex:1;}
.acts .rep{min-width:104px;padding:0 12px;white-space:nowrap;}

/* ── Spin overlay ────────────────────────────────────────────────────── */
.spinov{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(8,5,20,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s;}
.spinov.show{opacity:1;}
.spinov canvas{width:min(92vw,520px,66dvh);height:min(92vw,520px,66dvh);transform:scale(.85);transition:transform .45s var(--spring);}
.spinov.show canvas{transform:none;}
.spinov .res{min-height:64px;display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:1.9rem;color:#fff;}
.spinov .res .nb{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:2rem;box-shadow:0 0 0 3px #ffd54a, 0 8px 20px rgba(0,0,0,.5);animation:pop .45s var(--spring);}
.spinov .tip{font-size:.85rem;font-weight:800;color:var(--text-3);}
.mini, .spinov canvas{display:block;}

/* ── Phones: compact head (wheel + last numbers + bankroll in one wood box) so
   the whole table fits the screen; the layout is sized to the height left ── */
.stage.rl.cmp{padding-top:2px;}
.cmp .head{padding:6px;gap:8px;margin-bottom:6px;align-items:center;border-radius:16px;}
.cmp .mini{width:clamp(70px,11.5dvh,100px);height:clamp(70px,11.5dvh,100px);}
.cmp .board{flex:none;padding:5px 8px 4px;border-radius:10px;}
.cmp .board .lbl{font-size:.56rem;}
.cmp .board .nums{flex:none;flex-wrap:nowrap;overflow:hidden;align-items:center;gap:4px;height:32px;margin-top:2px;padding:0 2px;}
.cmp .board .nb{flex:none;width:24px;height:24px;font-size:.85rem;}
.cmp .board .nb.first{width:28px;height:28px;font-size:1.05rem;}
.cmp .board .hot{display:none;}
.cmp .board .empty{font-size:.8rem;margin:0;}
.cmp .bank{margin:0;gap:4px;}
.cmp .bank div{padding:3px 4px;border-radius:9px;background:rgba(0,0,0,.25);}
.cmp .bank small{font-size:.52rem;}
.cmp .bank b{font-size:.92rem;}
.cmp .msg{min-height:0;height:20px;line-height:20px;margin:0 0 4px;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmp .tbl{padding:5px;border-radius:18px;}
.cmp .tbl .felt-in{padding:6px;border-radius:13px;}
@media (max-height:760px){
  .rail .cz-rack{--cs:40px;margin-top:0;margin-bottom:6px;padding:5px 8px 6px;}
  .rail{padding-top:6px;} .acts .icon-btn{width:46px;height:46px;} .acts .btn{min-height:46px;}
}

/* ── Wide landscape (iPad, laptop): wheel, last numbers and bankroll along the top; the table on its side across the screen ── */
@media (orientation:landscape) and (min-width:900px) and (min-height:560px){
  .stage.rl:has(> .tbl){max-width:1180px;padding-bottom:calc(var(--rail,150px) + 2px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);grid-template-rows:auto auto auto 1fr;column-gap:18px;align-items:start;}
  .stage.rl > .head{grid-column:1;grid-row:1 / span 3;margin-bottom:8px;}
  .stage.rl > .bank{grid-column:2;grid-row:1;margin-bottom:6px;}
  .stage.rl > .msg{grid-column:2;grid-row:2;margin:4px 0 4px;}
  .stage.rl > .bg-row{grid-column:2;grid-row:3;}
  .stage.rl > .tbl{grid-column:1 / span 2;grid-row:4;width:100%;margin:0 auto;}
  .stage.rl .mini{width:110px;height:110px;}
  .stage.rl .board{min-height:0;}
  .rail-in{max-width:640px;}
}
</style>
</head>
<body>
<main class="stage rl" id="app"></main>

<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'rl_state', HKEY = 'roulette';
  try { sessionStorage.removeItem('rl_state'); } catch (e) {}   // old versions kept the table here

  // ── Wheel data ───────────────────────────────────────────────────────────
  var RED = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
  var DZ = 37;  // internal number for 00
  var ORDER = {
    eu: [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26],
    us: [0, 28, 9, 26, 30, 11, 7, 20, 32, 17, 5, 22, 34, 15, 3, 24, 36, 13, 1, DZ, 27, 10, 25, 29, 12, 8, 19, 31, 18, 6, 21, 33, 16, 4, 23, 35, 14, 2]
  };
  var DENOMS = [500, 100, 25, 5, 1];
  function isRed(n) { return RED.indexOf(n) >= 0; }
  function colorOf(n) { return n === 0 || n === DZ ? 'green' : isRed(n) ? 'red' : 'black'; }
  function lbl(n) { return n === DZ ? '00' : String(n); }
  function money(n) { n = Math.round(n); return (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString(); }
  function signed(n) { n = Math.round(n); return (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString(); }
  function short(a) { return a >= 10000 ? Math.round(a / 1000) + 'k' : a >= 1000 ? (Math.round(a / 100) / 10) + 'k' : String(a); }
  function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ── Bets: id -> {nums, pay, name} ────────────────────────────────────────
  var BETS = {};
  function defBet(id, nums, name, pay) { BETS[id] = { id: id, nums: nums, name: name, pay: pay != null ? pay : 36 / nums.length - 1 }; }
  function buildBets(wheel) {
    BETS = {};
    var i, a;
    for (i = 1; i <= 36; i++) defBet('n' + i, [i], 'Straight ' + i);
    defBet('n0', [0], 'Straight 0');
    for (a = 1; a <= 36; a++) {
      if (a % 3) defBet('sh' + a, [a, a + 1], 'Split ' + a + '/' + (a + 1));
      if (a <= 33) defBet('sv' + a, [a, a + 3], 'Split ' + a + '/' + (a + 3));
      if (a % 3 && a <= 32) defBet('co' + a, [a, a + 1, a + 3, a + 4], 'Corner ' + a + '-' + (a + 4));
    }
    for (a = 1; a <= 34; a += 3) defBet('st' + a, [a, a + 1, a + 2], 'Street ' + a + '-' + (a + 2));
    for (a = 1; a <= 31; a += 3) defBet('sl' + a, range(a, a + 5), 'Six line ' + a + '-' + (a + 5));
    if (wheel === 'us') {
      defBet('n00', [DZ], 'Straight 00');
      defBet('zz', [0, DZ], 'Split 0/00');
      defBet('z1', [0, 1], 'Split 0/1'); defBet('z2', [0, 2], 'Split 0/2');
      defBet('y2', [DZ, 2], 'Split 00/2'); defBet('y3', [DZ, 3], 'Split 00/3');
      defBet('t1', [0, 1, 2], 'Trio 0-1-2'); defBet('tz', [0, DZ, 2], 'Trio 0-00-2'); defBet('t3', [DZ, 2, 3], 'Trio 00-2-3');
      defBet('bk', [0, DZ, 1, 2, 3], 'Top line 0-00-1-2-3', 6);
    } else {
      defBet('z1', [0, 1], 'Split 0/1'); defBet('z2', [0, 2], 'Split 0/2'); defBet('z3', [0, 3], 'Split 0/3');
      defBet('t1', [0, 1, 2], 'Trio 0-1-2'); defBet('t2', [0, 2, 3], 'Trio 0-2-3');
      defBet('ff', [0, 1, 2, 3], 'First four 0-1-2-3');
    }
    defBet('d1', range(1, 12), '1st dozen'); defBet('d2', range(13, 24), '2nd dozen'); defBet('d3', range(25, 36), '3rd dozen');
    [1, 2, 3].forEach(function (c) { defBet('c' + c, range(0, 11).map(function (r) { return r * 3 + c; }), 'Column ' + c); });
    defBet('low', range(1, 18), '1 to 18'); defBet('high', range(19, 36), '19 to 36');
    defBet('even', range(1, 36).filter(function (n) { return n % 2 === 0; }), 'Even');
    defBet('odd', range(1, 36).filter(function (n) { return n % 2 === 1; }), 'Odd');
    defBet('red', RED.slice(), 'Red');
    defBet('black', range(1, 36).filter(function (n) { return !isRed(n); }), 'Black');
  }
  function payText(b) { return b.pay + ' to 1'; }

  // ── Menu & rules ─────────────────────────────────────────────────────────
  Kit.init({ orient: 'portrait',   // phones: the table and chip rack only fit upright
    id: 'roulette', confirmNew: false,
    onNew: function () { endSession(true); },
    undo: function () { undoChip(); },
    menu: [
      { icon: 'coins', label: 'Cash out (end session)', onClick: function () { endSession(false); } },
      { icon: 'history', label: 'Past sessions', onClick: function () { Kit.history(HKEY, { title: 'Roulette: past sessions' }); } },
      { icon: 'sync', label: 'Reset bankroll to $1,000', onClick: resetBank }
    ],
    rules:
      '<p class="goal">Bet on where the little ball will land. Drag a chip onto the table (or pick a chip and tap the table), then spin.</p>' +
      '<h3>Moving chips</h3><ul><li>Drag a chip from the rack onto the table. The spot it will land on lights up.</li>' +
      '<li>Drag a bet to another spot to move it. Drag it off the table to take it back.</li></ul>' +
      '<h3>The wheel</h3><p><b>European</b> wheels have 37 pockets: 1 to 36 plus a green <b>0</b>. <b>American</b> wheels add a second green pocket, <b>00</b>, which makes the house edge bigger (5.3% instead of 2.7%). Pick the wheel when you start a session.</p>' +
      '<h3>Inside bets (tap on the numbers)</h3><ul>' +
      '<li><b>Straight</b>, one number: tap the middle of it. Pays <b>35 to 1</b>.</li>' +
      '<li><b>Split</b>, two numbers side by side: tap the line between them. Pays <b>17 to 1</b>.</li>' +
      '<li><b>Street</b>, a row of three: tap the thin strip at the left end of the row. Pays <b>11 to 1</b>.</li>' +
      '<li><b>Corner</b>, four numbers: tap where four numbers meet. Pays <b>8 to 1</b>.</li>' +
      '<li><b>Six line</b>, two rows: tap the strip on the line between two rows. Pays <b>5 to 1</b>.</li>' +
      '<li>Zero bets: tap the line under the 0 for 0/1, 0/2, 0/3 splits and trios (11 to 1). European: the corner by the 0 and the 1 is <b>first four</b> (0-1-2-3, 8 to 1). American: that corner is the <b>top line</b> (0-00-1-2-3, 6 to 1).</li></ul>' +
      '<h3>Outside bets</h3><ul>' +
      '<li><b>Dozens</b> (1st 12, 2nd 12, 3rd 12) and <b>Columns</b> (the 2:1 boxes at the bottom): pay <b>2 to 1</b>.</li>' +
      '<li><b>Red / Black</b>, <b>Odd / Even</b>, <b>1-18 / 19-36</b>: pay <b>1 to 1</b>. They lose if the ball lands on 0 or 00.</li></ul>' +
      '<h3>Buttons</h3><ul><li><b>Undo</b> takes back your last chip (or your last move). <b>Clear</b> takes all your chips back.</li>' +
      '<li>After a spin, <b>Repeat</b> puts the same bets down again.</li>' +
      '<li>Tap the little wheel to see the last spin again.</li></ul>' +
      '<h3>Your money</h3><p>The bankroll is shared with all the casino games. <b>Cash out</b> (in the menu) ends your session and saves how it went to Past sessions.</p>'
  });

  // ── State ────────────────────────────────────────────────────────────────
  // S = {v, wheel, player, bets:{id:amt}, undo:[{id,v}], last:{}, recent:[n], wAng,

  // ── Rendering ────────────────────────────────────────────────────────────

  // Phones: compact head, bankroll tucked into the wood box beside the wheel

      takeOff(u.to, u.v); S.bets[u.mv] = (S.bets[u.mv] || 0) + u.v;
      Kit.sfx('chip'); paintStacks(u.mv);
    } else if (u.rm) {     // a bet dragged off the table: put it back down
      if (Casino.balance() < u.v) { S.undo.push(u); Kit.sfx('bad'); Kit.toast('Not enough in your bankroll to put ' + money(u.v) + ' back'); return; }
      Casino.bet(u.v); S.bets[u.rm] = (S.bets[u.rm] || 0) + u.v;
      Kit.sfx('chip'); paintStacks(u.rm);
    } else {
      takeOff(u.id, u.v); Casino.win(u.v); Kit.sfx('whoosh');
      paintStacks();
    }

  }
  function takeOff(id, v) { S.bets[id] -= v; if (!(S.bets[id] > 0)) delete S.bets[id]; }

  // ── Drag and drop (shared chip rack in casino.js) ────────────────────────
  // Drag a chip from the rack onto the table; the bet it would make lights up.
  // Bets on the table can be dragged to another spot, or off the table to take
  // them back. A quick tap on a rack chip selects it for tap-to-bet.
  function layPt(cx, cy) { var r = R.lay.getBoundingClientRect(); return logi((cx - r.left) * G.sw / r.width, (cy - r.top) * G.sh / r.height); }
  function scrPt(cx, cy) { var r = R.lay.getBoundingClientRect(); return { x: (cx - r.left) * G.sw / r.width, y: (cy - r.top) * G.sh / r.height }; }
  function chipRack() {
    return Casino.rack({

      enabled: function () { return !busy && !!S && !!G; },
      can: function (v) { return v <= Casino.balance(); },
      ghost: function () { return Math.round(Math.max(34, G.cs * 1.35)); },
      tap: function (v) { selectChip(v); Kit.sfx('chip'); Kit.haptic('light'); },
      hit: function (x, y) {

      mark: function (id) { showTarget(id); },
      start: function (kind) { if (kind === 'new') { chipV = R.rack.value(); clearResult(); } },
      over: function (id, v, kind, off) {
        if (kind === 'end') return;
        if (id) {
          var b = BETS[id];
          R.msg.innerHTML = '<b>' + b.name + '</b> · pays ' + payText(b) + (kind === 'move' && id !== dragFrom ? ' · move ' + money(v) + ' here' : '');
        } else if (kind === 'move') R.msg.innerHTML = off ? 'Let go to take <b>' + money(v) + '</b> back' : 'Drag to a new spot, or off the table to take it back';
        else R.msg.innerHTML = 'Drop the <b>' + money(v) + '</b> chip on a bet';
      },
      done: function (placed) { dragFrom = null; if (!placed) hintMsg(); },
      drop: function (id, v) { return placeChip(id, v); },
      // Pick a bet up off the table

        Object.keys(S.bets).forEach(function (id) {
          var s = sspot(id); if (!s) return;

        S.undo.push({ mv: from, to: tgt, v: amt });

        var b = BETS[tgt];

        return true;
      },
      remove: function (from) {
        var amt = S.bets[from] || 0;

        clearResult();

        Kit.sfx('whoosh'); Kit.haptic('light');
        paintStacks(); paintBank(); save();

  var dragFrom = null;

      clearResult();

  }

  // ── Spin ─────────────────────────────────────────────────────────────────
  function spin() {
    if (busy) return;
    var stake = total(S.bets);
    if (!stake) { Kit.toast('Place a bet first'); return; }
    clearResult();
    var order = ORDER[S.wheel];
    var idx = Math.floor(Math.random() * order.length), n = order[idx];
    // Settle the money now so leaving mid-spin can't lose the result; reveal when the ball drops.
    var ret = 0, winners = [];
    Object.keys(S.bets).forEach(function (id) {
      var b = BETS[id];
      if (b && b.nums.indexOf(n) >= 0) { var p = S.bets[id] * (b.pay + 1); ret += p; winners.push({ id: id, amt: S.bets[id], pay: p }); }
    });
    if (ret) Casino.win(ret);
    var net = ret - stake, ss = S.sess;
    ss.spins++; ss.net += net; ss.wagered += stake; ss.last = Date.now(); ss.series.push(net);
    ss.counts[n] = (ss.counts[n] || 0) + 1;
    ss.hi = Math.max(ss.hi || 0, Casino.balance());
    var col = colorOf(n);
    if (col !== 'green') {
      ss.streak = ss.streak && ss.streak.col === col ? { col: col, len: ss.streak.len + 1 } : { col: col, len: 1 };
      if (!ss.bestStreak || ss.streak.len > ss.bestStreak.len) ss.bestStreak = { col: col, len: ss.streak.len };
    } else ss.streak = null;
    var top = winners.slice().sort(function (a, b) { return b.pay - a.pay; })[0];
    if (net > 0 && (!ss.best || net > ss.best.amt)) ss.best = { amt: net, n: n, bet: top ? BETS[top.id].name : '' };
    // for the history view: every spin (last 60) and the bets on the best and the last spin
    var betList = Object.keys(S.bets).sort(function (a, b) { return S.bets[b] - S.bets[a]; }).slice(0, 10).map(function (id) {
      var w = winners.filter(function (x) { return x.id === id; })[0]; return { t: BETS[id] ? BETS[id].name : id, a: S.bets[id], p: w ? w.pay : 0 };
    });
    (ss.slog = ss.slog || []).push({ n: lbl(n), s: stake, r: ret }); if (ss.slog.length > 60) ss.slog.shift();
    ss.lastSpin = { no: ss.spins, n: lbl(n), s: stake, r: ret, b: betList };
    if (net > 0 && ss.best && ss.best.amt === net && ss.best.n === n) ss.bestSpin = ss.lastSpin;
    winners.forEach(function (w) { if (/^n/.test(w.id) && ss.straights.length < 6) ss.straights.push({ n: n, won: w.amt * 35 }); });
    S.spin = { n: n, idx: idx, stake: stake, ret: ret, winners: winners, bets: S.bets };
    S.last = JSON.parse(JSON.stringify(S.bets));
    S.recent.unshift(n); if (S.recent.length > 40) S.recent.length = 40;
    save();
    busy = true; paintBank();
    Kit.sfx('roll'); Kit.haptic('medium');
    animateSpin(idx, function () { finishSpin(false); });
  }

  // Result on the table: dolly on the number, winners glow, losers swept away
  function finishSpin(instant) {
    var sp = S.spin; if (!sp) return;
    busy = false;
    if (fitLater) { fitLater = false; arrange(); layout(); drawMini(); }   // the device turned during the spin
    S.bets = {}; S.undo = []; S.spin = null;
    save();
    var n = sp.n, col = colorOf(n), net = sp.ret - sp.stake;
    // Show the old bets as stacks for the reveal, then clear
    R.stacks = R.stacks || {};
    Object.keys(R.stacks).forEach(function (id) { R.stacks[id].remove(); });
    R.stacks = {};
    var topW = sp.winners.slice().sort(function (a, b) { return b.pay - a.pay; })[0];
    Object.keys(sp.bets).forEach(function (id) {
      var p = sspot(id); if (!p) return;
      var s = stackEl(sp.bets[id], G.cs); s.style.left = p.x + 'px'; s.style.top = p.y + 'px';
      R.lay.appendChild(s); R.stacks[id] = s;
      var w = sp.winners.filter(function (x) { return x.id === id; })[0];
      if (w) { s.classList.add('won'); if (w === topW) s.appendChild(el('div', { class: 'pay', text: '+' + money(w.pay - w.amt) })); }
      else setTimeout(function () { s.classList.add('lost'); }, instant ? 0 : 700);
    });
    var c = R.cells[n];
    if (c) {
      c.classList.add('hitn');
      var p = n === DZ ? sspot('n00') : sspot('n' + n);
      var cw = G.rot ? G.RH : G.CW, chh = G.rot ? G.CW : G.RH;   // the number's box on screen
      var dx = n === 0 || n === DZ ? (G.rot ? G.ZH * 0.3 : G.CW * 0.45) : cw * 0.3;
      R.dolly = el('div', { class: 'dolly' }); R.dolly.style.left = (p.x - dx) + 'px'; R.dolly.style.top = (p.y + chh * 0.32) + 'px';
      R.lay.appendChild(R.dolly);
    }
    // Winning bets come back to the player after a moment
    setTimeout(function () {
      Object.keys(R.stacks).forEach(function (id) { if (!S.bets[id]) { var s = R.stacks[id]; s.classList.add('lost'); s.style.transform = 'translate(-50%,200%) scale(.7)'; } });
      setTimeout(function () { Object.keys(R.stacks).forEach(function (id) { if (!S.bets[id]) { R.stacks[id].remove(); delete R.stacks[id]; } }); }, 520);
    }, instant ? 300 : 2400);
    var parity = n === 0 || n === DZ ? '' : (n % 2 ? ' · Odd' : ' · Even') + (n <= 18 ? ' · 1-18' : ' · 19-36');
    var hitStraight = sp.winners.some(function (w) { return /^n/.test(w.id); });
    R.msg.innerHTML = (hitStraight ? 'Straight up! ' : '') + '<b>' + lbl(n) + ' ' + cap(col) + '</b>' + parity + ' · ' + (sp.ret ? 'paid ' + money(sp.ret) + ' (' + signed(net) + ')' : 'no winners (' + signed(net) + ')');
    paintBoard(); paintBank(); drawMini();
    if (instant) return;
    var straight = sp.winners.some(function (w) { return /^n/.test(w.id); });
    if (straight) { Kit.callout('35 to 1!'); Kit.confetti({ count: 120 }); Kit.sfx('win'); Kit.haptic('success'); }
    else if (net > 0) { Kit.callout(signed(net), '#3ddc84'); Kit.sfx('good'); Kit.haptic('success'); }
    else if (sp.ret > 0) { Kit.sfx('tap'); }
    else { Kit.sfx('bad'); Kit.haptic('error'); }
    if (Casino.balance() < 1) setTimeout(brokeSheet, 1600);
  }

  // ── Bet guide (setup option): what the bets on this wheel really cost ──────────
  // Worked out pocket by pocket from this table's own bets and payouts (BETS), so it always matches the wheel.
  function pockets() { return range(0, 36).concat(S.wheel === 'us' ? [DZ] : []); }
  function pcT(x, d) { return (x * 100).toFixed(d == null ? 2 : d) + '%'; }
  function dollars(x) { return '$' + Math.abs(x).toFixed(2); }
  function edgeOf(k, pay) { return 1 - (pay + 1) * k / pockets().length; }   // share of each bet the house keeps on average
  function spinStats(bets) {
    var ps = pockets(), N = ps.length, stake = total(bets), ev = 0, any = 0, ahead = 0, top = -Infinity;
    ps.forEach(function (n) {
      var ret = 0;
      Object.keys(bets).forEach(function (id) { var b = BETS[id]; if (b && b.nums.indexOf(n) >= 0) ret += bets[id] * (b.pay + 1); });
      ev += (ret - stake) / N; if (ret > 0) any++; if (ret > stake) ahead++; top = Math.max(top, ret - stake);
    });
    return { ev: ev, any: any / N, ahead: ahead / N, top: top, stake: stake };
  }
  function paintGuide() {
    if (!R.guide || !S) return;
    R.guide.classList.toggle('hide', busy);
    if (busy) return;
    var us = S.wheel === 'us', html;
    if (us && S.bets.bk) html = 'Tip: <b>skip the Top line</b>';
    else if (total(S.bets)) html = 'Your bets: avg loss <b>' + dollars(spinStats(S.bets).ev) + '</b> a spin';
    else html = 'Every bet: <b>' + (us ? '5.26%' : '2.70%') + ' house edge</b>';
    if (R.guide.dataset.h === html) return;
    R.guide.dataset.h = html; R.guide.innerHTML = '';
    R.guide.appendChild(Coach.chip(html, showGuide));
  }
  // Middle half of results after 100 spins of $10 on one bet (exact, from the binomial distribution)
  function middleHalf(k, pay, N) {
    var n = 100, p = k / N, pm = Math.pow(1 - p, n), cdf = 0, lo = null, hi = null;
    for (var w = 0; w <= n; w++) {
      if (w > 0) pm *= (n - w + 1) / w * p / (1 - p);
      cdf += pm;
      if (lo == null && cdf >= 0.25) lo = w;
      if (hi == null && cdf >= 0.75) { hi = w; break; }
    }
    function net(w) { return 10 * (pay + 1) * w - 10 * n; }
    return [net(lo), net(hi)];
  }
  function showGuide() {
    var us = S.wheel === 'us', N = pockets().length, edge = 1 / N * (us ? 2 : 1), eTxt = pcT(edge);
    var rows = [
      { name: 'Even-money bets', k: 18, pay: 1, what: 'Red or Black, Odd or Even, 1-18 or 19-36' },
      { name: 'Dozen or Column', k: 12, pay: 2 },
      { name: 'Six line', k: 6, pay: 5 },
      { name: us ? 'Corner' : 'Corner · First four', k: 4, pay: 8 },
      { name: 'Street · Trio', k: 3, pay: 11 },
      { name: 'Split', k: 2, pay: 17 },
      { name: 'Straight up', k: 1, pay: 35 }
    ];
    if (us) rows.push({ name: 'Top line (0-00-1-2-3)', k: 5, pay: 6 });
    function fair(k) { var f = (N - k) / k; return parseFloat(f.toFixed(2)) + ' to 1'; }
    var moves = rows.map(function (r) {
      var w = r.k / N, e = edgeOf(r.k, r.pay);
      return { name: r.name, w: w, l: 1 - w, value: -10 * e,
        note: (r.what ? r.what + ' · covers ' : 'Covers ') + r.k + ' number' + (r.k > 1 ? 's' : '') + ' · pays ' + r.pay + ' to 1 (fair would be ' + fair(r.k) + ') · wins ' + pcT(w, 1) + ' of spins, about 1 in ' + (N / r.k).toFixed(1).replace(/\.0$/, '') + ' · house edge <b>' + pcT(e) + '</b>' };
    });
    var best, t = total(S.bets);
    if (t) {
      var st = spinStats(S.bets), hasBk = us && S.bets.bk;
      best = { label: 'Your bets · ' + money(t) + ' on the table', value: 'Avg loss ' + dollars(st.ev) + ' a spin',
        text: 'Chance at least one bet wins: <strong>' + pcT(st.any, 1) + '</strong><br>Chance you finish the spin ahead: <strong>' + pcT(st.ahead, 1) + '</strong><br>' +
          (st.top > 0 ? 'Best possible spin: <strong>+' + money(st.top) + '</strong>' : 'No single spin can put you ahead with these bets') +
          '<span class="bg-note">' + (hasBk ? 'The Top line costs 7.89%, the worst bet here. Every other bet costs ' + eTxt + '.' :
            'Every bet on this wheel costs ' + eTxt + ', so your average loss is ' + eTxt + ' of what is on the table however you spread it. Spreading chips around changes how often you win, not what it costs.') + '</span>' };
    } else {
      best = { label: 'The honest answer', value: 'Every bet costs the same',
        text: 'On this ' + (us ? 'American' : 'European') + ' wheel every bet loses <strong>' + eTxt + '</strong> on average: about ' + (us ? '53' : '27') + ' cents for every $10, whether you bet Red or a single number' +
          (us ? ' (except the Top line, at 7.89%)' : '') + '. So pick the ride you like: outside bets win often and pay a little; inside bets win rarely and pay a lot.' };
    }
    var ride = el('div', { class: 'bg-ride' });
    ['Bet', 'Wins', 'Middle half'].forEach(function (h, i) { ride.appendChild(el('span', { class: 'hd' + (i ? ' r' : ''), text: h })); });
    rows.filter(function (r) { return r.k !== 5; }).forEach(function (r) {
      var mh = middleHalf(r.k, r.pay, N);
      ride.appendChild(el('b', { text: { 18: 'Red / Black', 12: 'Dozen', 6: 'Six line', 4: 'Corner', 3: 'Street', 2: 'Split', 1: 'Straight up' }[r.k] }));
      ride.appendChild(el('span', { class: 'r', text: pcT(r.k / N, 1) }));
      ride.appendChild(el('span', { class: 'r', text: signed(mh[0]) + ' to ' + signed(mh[1]) }));
    });
    Coach.sheet({
      title: 'Bet guide',
      best: best,
      movesTitle: 'Every bet, compared',
      intro: 'Smoothest ride to bumpiest. The amount on the right is the average result for every <b>$10</b> you bet: the same for every bet' + (us ? ' but the Top line' : '') + '.',
      moves: moves,
      sections: [
        { title: 'Why every bet costs the same', text: 'Payouts are set as if the wheel had only the numbers 1 to 36. The green ' + (us ? '0 and 00 are' : '0 is') + ' the casino’s cut. A single number pays 35 to 1, but with ' + N + ' pockets a fair price would be ' + (N - 1) + ' to 1. Every other bet is priced the same way, so each one gives up the same ' + eTxt + '.' +
          (us ? ' The one exception is the Top line: five numbers paying 6 to 1, where the usual pricing would give 6.2 to 1, so it costs <b>7.89%</b>.' : '') },
        { title: 'How bumpy is the ride?', text: 'Same cost, very different ride. Say you bet $10 a spin for 100 spins: on average you’d be down about ' + money(1000 * edge) + ' whichever bet you pick. But half the time you’d finish somewhere in this range:', node: ride },
        { title: 'Past spins don’t matter', items: [
          '<b>The wheel has no memory.</b> After five reds in a row, red is still ' + pcT(18 / N, 1) + ' on the next spin.',
          'The Last numbers board and “hot” numbers are just a record. No number is due, and none is hot.',
          '<b>No betting system beats the wheel.</b> Doubling up after a loss, or covering lots of numbers, only changes the ride. You win more often, but smaller, and the cost per dollar stays ' + eTxt + '.'
        ] },
        { title: 'European vs American wheel', items: [
          '<b>European</b> (one 0): every bet costs 2.70%.',
          '<b>American</b> (0 and 00): every bet costs 5.26%, nearly double, and the Top line 7.89%. You pick the wheel when you start a session.',
          'Some European casinos give back half of an even-money bet (like Red) when the ball lands on 0. That rule, called <b>la partage</b>, cuts those bets to 1.35%. This table doesn’t use it.'
        ] },
        { title: 'What the numbers mean', text: '<b>House edge</b> is the share of every bet the casino keeps on average. ' + eTxt + ' means about $' + (100 * edge).toFixed(2) + ' of every $100 you bet, over many spins. Over a few spins anything can happen; the more you play, the closer you get to the average.' }
      ]
    });
  }

  // ── Wheel drawing ────────────────────────────────────────────────────────
  function drawWheel(cv, sizeCss, wAng, ball, hlIdx) {
    var dpr = Math.min(3, window.devicePixelRatio || 1), px = Math.round(sizeCss * dpr);
    if (cv.width !== px) { cv.width = px; cv.height = px; }
    var x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    var Rr = sizeCss / 2, c = Rr, order = ORDER[S.wheel], N = order.length, sl = 2 * Math.PI / N;
    x.clearRect(0, 0, sizeCss, sizeCss);
    function ring(r0, r1, fill) { x.beginPath(); x.arc(c, c, r1, 0, 2 * Math.PI); x.arc(c, c, r0, 0, 2 * Math.PI, true); x.fillStyle = fill; x.fill('evenodd'); }
    // Bowl (wood) and ball track
    var g = x.createRadialGradient(c, c * 0.8, Rr * 0.2, c, c, Rr);
    g.addColorStop(0, '#8a5530'); g.addColorStop(0.85, '#5a3118'); g.addColorStop(1, '#2e170a');
    x.beginPath(); x.arc(c, c, Rr, 0, 2 * Math.PI); x.fillStyle = g; x.fill();
    var t = x.createRadialGradient(c, c, Rr * 0.8, c, c, Rr * 0.95);
    t.addColorStop(0, '#2a160a'); t.addColorStop(0.55, '#4a2a15'); t.addColorStop(1, '#1c0e06');
    ring(Rr * 0.8, Rr * 0.95, t);
    x.strokeStyle = 'rgba(255,220,160,.35)'; x.lineWidth = 1; x.beginPath(); x.arc(c, c, Rr * 0.95, 0, 2 * Math.PI); x.stroke();
    // Deflector diamonds (fixed to the bowl)
    for (var k = 0; k < 8; k++) {
      var a = k * Math.PI / 4 + Math.PI / 8, dr = Rr * 0.865;
      x.save(); x.translate(c + dr * Math.cos(a), c + dr * Math.sin(a)); x.rotate(a);
      x.beginPath(); x.moveTo(-Rr * 0.03, 0); x.lineTo(0, -Rr * 0.016); x.lineTo(Rr * 0.03, 0); x.lineTo(0, Rr * 0.016); x.closePath();
      x.fillStyle = '#e8c56a'; x.fill(); x.restore();
    }
    // Rotating wheel head: numbers, pockets, frets
    x.save(); x.translate(c, c); x.rotate(wAng);
    for (var i = 0; i < N; i++) {
      var n = order[i], s0 = i * sl - sl / 2, s1 = s0 + sl, col = colorOf(n);
      var base = col === 'green' ? '#12924f' : col === 'red' ? '#c4242f' : '#17171b';
      x.beginPath(); x.arc(0, 0, Rr * 0.8, s0, s1); x.arc(0, 0, Rr * 0.54, s1, s0, true); x.closePath();
      x.fillStyle = i === hlIdx ? '#ffd54a' : base; x.fill();
      // pocket floor (darker inner band)
      x.beginPath(); x.arc(0, 0, Rr * 0.665, s0, s1); x.arc(0, 0, Rr * 0.54, s1, s0, true); x.closePath();
      x.fillStyle = 'rgba(0,0,0,.28)'; x.fill();
      x.save(); x.rotate(i * sl); x.translate(Rr * 0.735, 0); x.rotate(Math.PI / 2);
      x.fillStyle = i === hlIdx ? '#2a1a00' : '#fff';
      x.font = '700 ' + Math.max(7, Rr * 0.075) + 'px ' + (sizeCss > 200 ? '"Lilita One",' : '') + 'system-ui,sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(lbl(n), 0, 0); x.restore();
    }
    // Frets
    x.strokeStyle = '#d9c08a'; x.lineWidth = Math.max(0.8, Rr * 0.008);
    for (i = 0; i < N; i++) { var fa = i * sl - sl / 2; x.beginPath(); x.moveTo(Rr * 0.54 * Math.cos(fa), Rr * 0.54 * Math.sin(fa)); x.lineTo(Rr * 0.8 * Math.cos(fa), Rr * 0.8 * Math.sin(fa)); x.stroke(); }
    x.beginPath(); x.arc(0, 0, Rr * 0.665, 0, 2 * Math.PI); x.stroke();
    x.lineWidth = Math.max(1, Rr * 0.012); x.beginPath(); x.arc(0, 0, Rr * 0.8, 0, 2 * Math.PI); x.stroke();
    // Cone
    var cg = x.createRadialGradient(-Rr * 0.12, -Rr * 0.15, Rr * 0.05, 0, 0, Rr * 0.54);
    cg.addColorStop(0, '#b77a45'); cg.addColorStop(0.7, '#7a4522'); cg.addColorStop(1, '#4a2611');
    x.beginPath(); x.arc(0, 0, Rr * 0.54, 0, 2 * Math.PI); x.fillStyle = cg; x.fill();
    x.strokeStyle = '#e2c271'; x.lineWidth = Math.max(1, Rr * 0.015); x.stroke();
    // Turret
    x.lineCap = 'round';
    for (k = 0; k < 4; k++) {
      x.save(); x.rotate(k * Math.PI / 2);
      x.strokeStyle = '#d8b65a'; x.lineWidth = Rr * 0.035; x.beginPath(); x.moveTo(0, 0); x.lineTo(Rr * 0.3, 0); x.stroke();
      x.beginPath(); x.arc(Rr * 0.32, 0, Rr * 0.04, 0, 2 * Math.PI); x.fillStyle = '#f0d488'; x.fill();
      x.restore();
    }
    var tg = x.createRadialGradient(-Rr * 0.03, -Rr * 0.03, 1, 0, 0, Rr * 0.1);
    tg.addColorStop(0, '#fff3c4'); tg.addColorStop(1, '#b8902f');
    x.beginPath(); x.arc(0, 0, Rr * 0.1, 0, 2 * Math.PI); x.fillStyle = tg; x.fill();
    x.restore();
    // Ball
    if (ball) {
      var bx = c + ball.r * Rr * Math.cos(ball.a), by = c + ball.r * Rr * Math.sin(ball.a), br = Math.max(3, Rr * 0.04);
      x.beginPath(); x.arc(bx + br * 0.25, by + br * 0.35, br, 0, 2 * Math.PI); x.fillStyle = 'rgba(0,0,0,.4)'; x.fill();
      var bg = x.createRadialGradient(bx - br * 0.35, by - br * 0.35, br * 0.1, bx, by, br);
      bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.6, '#ecebe6'); bg.addColorStop(1, '#a9a7a0');
      x.beginPath(); x.arc(bx, by, br, 0, 2 * Math.PI); x.fillStyle = bg; x.fill();
    }
  }
  function lastBall() {
    if (!S.recent.length) return { a: -Math.PI / 2 + 0.6, r: 0.875 };
    var i = ORDER[S.wheel].indexOf(S.recent[0]);
    return { a: S.wAng + i * 2 * Math.PI / ORDER[S.wheel].length, r: 0.6 };
  }
  function drawMini() {
    if (!R.mini) return;
    drawWheel(R.mini, R.mini.clientWidth || 118, S.wAng, lastBall(), -1);
  }

  // Spin animation. The wheel turns clockwise and slows; the ball runs the
  // other way round the track, drops, bounces over a few frets and settles.
  var ov = null;
  function animateSpin(idx, done) {
    var order = ORDER[S.wheel], N = order.length, sl = 2 * Math.PI / N;
    var cv = el('canvas'), res = el('div', { class: 'res' }), tip = el('div', { class: 'tip', text: 'Tap to skip' });
    ov = el('div', { class: 'spinov', role: 'dialog', 'aria-label': 'Spinning' }, [cv, res, tip]);
    document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.classList.add('show'); });
    var size = Math.min(window.innerWidth * 0.92, 520, window.innerHeight * 0.66);
    var w0 = S.wAng, dW = 2 * Math.PI * (1.4 + Math.random() * 0.5) + Math.random() * 2 * Math.PI;
    var K = 2 * Math.PI * (5 + Math.floor(Math.random() * 3)) + Math.random() * 2 * Math.PI;   // ball laps
    var DUR = 6200, t0 = null, skip = false, lastPocket = null, lastTick = 0, settled = false, ended = false;
    ov.addEventListener('click', function () { if (!ended) skip = true; else close(); });
    function easeOut(u, p) { return 1 - Math.pow(1 - u, p); }
    function at(t) {
      var w = w0 + dW * easeOut(t, 3);
      var u = Math.min(1, t / 0.84);
      var rel = -K * (1 - easeOut(u, 2.3));
      var r;
      if (t < 0.5) r = 0.875;
      else if (t < 0.7) { var v = (t - 0.5) / 0.2; r = 0.875 - 0.275 * (v * v * (3 - 2 * v)) + 0.05 * Math.abs(Math.sin(v * Math.PI * 3)) * (1 - v); }
      else if (t < 0.86) { v = (t - 0.7) / 0.16; r = 0.6 + 0.035 * Math.abs(Math.sin(v * Math.PI * 4)) * (1 - v); }
      else r = 0.6;
      if (t > 0.6 && t < 0.86) rel += 0.05 * Math.sin((t - 0.6) * 60) * (0.86 - t) * 4;
      return { w: w, ball: { a: w + idx * sl + rel, r: r }, rel: rel };
    }
    function frame(now) {
      if (t0 === null) t0 = now;
      var t = skip ? 1 : Math.min(1, (now - t0) / DUR);
      var st = at(t);
      drawWheel(cv, size, st.w, st.ball, t >= 1 ? idx : -1);
      // clicks as the ball crosses frets
      if (!skip && t > 0.5 && t < 0.9) {
        var pk = Math.floor((st.ball.a - st.w) / sl + 0.5);
        if (pk !== lastPocket && now - lastTick > 55) { if (lastPocket !== null) Kit.sfx('tick'); lastPocket = pk; lastTick = now; }
      }
      if (!settled && t > 0.86) { settled = true; Kit.sfx('flip'); Kit.haptic('light'); }
      if (t < 1) { requestAnimationFrame(frame); return; }
      S.wAng = st.w % (2 * Math.PI); save();
      ended = true;
      var n = order[idx];
      res.innerHTML = '';
      res.appendChild(el('div', { class: 'nb ' + colorOf(n), text: lbl(n) }));
      res.appendChild(el('span', { text: cap(colorOf(n)) }));
      tip.textContent = 'Tap to close';
      setTimeout(close, skip ? 700 : 1300);
    }
    var closed = false;
    function close() {
      if (closed) return; closed = true;
      ov.classList.remove('show');
      var o = ov; setTimeout(function () { o.remove(); }, 300);
      done();
    }
    requestAnimationFrame(frame);
  }
  // Tap the little wheel to watch the last result again (no money moves)
  function replayLast() {
    var n = S.recent[0], i = ORDER[S.wheel].indexOf(n);
    var cv = el('canvas'), res = el('div', { class: 'res' }, [el('div', { class: 'nb ' + colorOf(n), text: lbl(n) }), el('span', { text: cap(colorOf(n)) })]);
    var o = el('div', { class: 'spinov', onclick: function () { o.classList.remove('show'); setTimeout(function () { o.remove(); }, 300); } }, [cv, res, el('div', { class: 'tip', text: 'Last spin · tap to close' })]);
    document.body.appendChild(o);
    var size = Math.min(window.innerWidth * 0.92, 520, window.innerHeight * 0.66);
    drawWheel(cv, size, S.wAng, lastBall(), i);
    requestAnimationFrame(function () { o.classList.add('show'); });
  }

  // ── Bankroll & sessions ──────────────────────────────────────────────────
  function brokeSheet() {
    Kit.sheet({ title: 'Out of chips', html: '<p class="muted">Your bankroll is empty. Start fresh with $1,000?</p>',
      actions: [{ label: 'Reset bankroll to $1,000', primary: true, onClick: function () { Casino.reset(); if (S) { S.sess.hi = Math.max(S.sess.hi, 1000); paintBank(); save(); } Kit.toast('Bankroll is $1,000'); } }, { label: 'Not now', cls: 'btn-ghost' }] });
  }
  function resetBank() {
    if (busy) return;
    Kit.confirm('Reset bankroll to $1,000?', { ok: 'Reset', danger: true, body: 'The bankroll is shared with every casino game. Chips on the table go back first.' }).then(function (ok) {
      if (!ok) return;
      if (S) { S.bets = {}; S.undo = []; }
      Casino.reset(); if (S) { save(); paintStacks(); paintBank(); hintMsg(); }
      Kit.toast('Bankroll reset to $1,000'); Kit.sfx('good');
    });
  }
  function highlights(ss) {
    var h = [];
    if (ss.best) h.push('Biggest win: ' + signed(ss.best.amt) + ' on ' + lbl(ss.best.n) + ' ' + colorOf(ss.best.n));
    ss.straights.slice(0, 2).forEach(function (s) { h.push('Hit ' + lbl(s.n) + ' straight up for ' + money(s.won)); });
    var hot = null; for (var k in ss.counts) if (ss.counts[k] >= 2 && (!hot || ss.counts[k] > hot.c)) hot = { n: +k, c: ss.counts[k] };
    if (hot) h.push('Hottest number: ' + lbl(hot.n) + ', ' + hot.c + ' times');
    if (ss.bestStreak && ss.bestStreak.len >= 4) h.push(cap(ss.bestStreak.col) + ' came up ' + ss.bestStreak.len + ' times in a row');
    if (ss.hi > ss.startBank) h.push('Bankroll peaked at ' + money(ss.hi));
    h.push(money(ss.wagered) + ' bet over ' + ss.spins + ' spin' + (ss.spins === 1 ? '' : 's'));
    return h.slice(0, 6);
  }
  function recordSession(st) {
    var ss = st.sess; if (!ss.spins) return null;
    var labels = [], scores = [];
    var step = Math.ceil(ss.series.length / 40);
    for (var i = 0; i < ss.series.length; i += step) {
      var sum = 0; for (var j = i; j < Math.min(ss.series.length, i + step); j++) sum += ss.series[j];
      labels.push(step === 1 ? 'Spin ' + (i + 1) : 'Spins ' + (i + 1) + '-' + Math.min(ss.series.length, i + step)); scores.push([sum]);
    }
    return Kit.record(HKEY, {
      started: ss.started, mode: st.wheel === 'us' ? 'American wheel' : 'European wheel',
      players: [{ name: st.player, score: ss.net }], winner: null,
      summary: st.player + ' ' + (ss.net > 0 ? 'up ' + money(ss.net) : ss.net < 0 ? 'down ' + money(-ss.net) : 'broke even') + ' · ' + ss.spins + ' spins',
      rounds: { labels: labels, scores: scores }, highlights: highlights(ss),
      meta: { net: ss.net, spins: ss.spins, wagered: ss.wagered, biggest: ss.best ? ss.best.amt : 0 },
      detail: { wheel: st.wheel, bank: { s: ss.startBank, e: Casino.balance(), hi: ss.hi }, spins: ss.spins, bet: ss.wagered, log: ss.slog || [], from: Math.max(1, ss.spins - (ss.slog || []).length + 1),
        best: ss.bestSpin || null, last: ss.lastSpin && ss.lastSpin !== ss.bestSpin && (!ss.bestSpin || ss.bestSpin.no !== ss.lastSpin.no) ? ss.lastSpin : null }
    });
  }
  // Cash out (toSetup=false) or start a new session (toSetup=true)
  function endSession(toSetup) {
    if (busy || !S) { if (!S) showSetup(); return; }
    var ss = S.sess;
    var go = function () {
      var t = total(S.bets); if (t) Casino.win(t);
      var st = S; recordSession(st); clearSave();
      if (toSetup || !ss.spins) { showSetup(); return; }
      var net = ss.net;
      Kit.win({
        icon: net >= 0 ? 'coins' : 'meh', lose: net < 0,
        title: net > 0 ? 'Up ' + money(net) + '!' : net < 0 ? 'Down ' + money(-net) : 'Broke even',
        sub: ss.spins + ' spin' + (ss.spins === 1 ? '' : 's') + (ss.best ? ' · biggest win ' + signed(ss.best.amt) : '') + ' · bankroll ' + money(Casino.balance()),
        againLabel: 'New session', again: function () { start(st.wheel, st.player, st.coach); },
        extra: [{ label: 'Past sessions', onClick: function () { showSetup(); Kit.history(HKEY, { title: 'Roulette: past sessions' }); } }],
        onClose: undefined
      });
      app.innerHTML = ''; rail(false);
      if (net > 0) Kit.callout(signed(net));
    };
    if (!ss.spins) { go(); return; }
    Kit.confirm(toSetup ? 'End this session?' : 'Cash out?', { ok: toSetup ? 'End session' : 'Cash out', body: 'Your session (' + signed(ss.net) + ' over ' + ss.spins + ' spins) is saved to Past sessions. Chips on the table go back to your bankroll.' }).then(function (ok) { if (ok) go(); });
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  var saved = load();
  if (saved) {
    S = saved; buildBets(S.wheel);
    // Chips that point at bets that no longer exist go back to the bankroll
    Object.keys(S.bets).forEach(function (id) { if (!BETS[id]) { Casino.win(S.bets[id]); delete S.bets[id]; } });
    // A session left idle for 8+ hours is saved and a fresh one starts
    if (S.sess.spins && Date.now() - S.sess.last > 8 * 3600 * 1000 && !S.spin) {
      recordSession(S);
      S.sess = newSess(); S.recent = []; save();
    }
    render();
  } else showSetup();

  // Re-fit the table when the screen size or orientation changes (or the
  // iOS toolbars come and go)
  var rz = null;
  var fitLater = false;
  function refit() {
    clearTimeout(rz); rz = setTimeout(function () {
      if (!S || !R.lay || !document.body.contains(R.lay)) return;
      if (busy || (R.rack && R.rack.dragging())) { fitLater = true; return; }   // turned mid-spin: refit when it lands
      fitLater = false; arrange(); layout(); R.stacks = {}; paintStacks(); drawMini();
    }, 120);
  }
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', refit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  window.addEventListener('pageshow', function () { if (S && R.bal && !busy) paintBank(); });
})();
</script>
</body>

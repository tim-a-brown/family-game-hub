<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Dice Roller</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
body{background:radial-gradient(700px 460px at 50% -8%, rgba(239,68,68,.12), transparent 62%), var(--bg);}
.page{padding-bottom:calc(110px + var(--safe-b));}
.sec-lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:0 4px 8px;}
/* Die type picker */
.die-types{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px;}
.dt-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:66px;padding:6px 0;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .1s;}
.dt-btn:active{transform:scale(.94);}
.dt-btn.active{border-color:rgba(245,200,66,.6);background:rgba(245,200,66,.12);color:var(--gold);}
.dt-icon svg{width:26px;height:26px;display:block;}
.dt-label{font-size:.8rem;font-weight:800;}
/* Grouped inset row */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:8px 10px 8px 16px;}
.row-lbl{font-size:1rem;font-weight:600;}
.row-sub{font-size:.82rem;color:var(--text-3);}
.stepper{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;}
.cnt-btn{width:48px;height:44px;border:0;background:transparent;color:var(--text);font-size:1.4rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cnt-btn:active{background:var(--surface-3);}
.cnt-btn:disabled{opacity:.3;}
.cnt-val{font-family:var(--display);font-size:1.3rem;font-weight:800;min-width:40px;text-align:center;font-variant-numeric:tabular-nums;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:44px;}
/* Tray */
.tray{position:relative;min-height:220px;padding:22px 14px;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;}
.dice-results{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;perspective:600px;}
.tray-empty{color:rgba(255,255,255,.55);font-weight:600;font-size:.95rem;text-align:center;}
.tray-empty b{display:block;font-size:2.4rem;margin-bottom:6px;}
@keyframes die-tumble{0%{transform:translateY(-60px) rotateX(260deg) rotateZ(-140deg) scale(.6);opacity:0}
  55%{transform:translateY(6px) rotateX(-10deg) rotateZ(14deg) scale(1.06);opacity:1}
  75%{transform:translateY(-4px) rotateZ(-5deg)}100%{transform:none;opacity:1}}
@keyframes die-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateY(-2px)}75%{transform:rotate(8deg) translateY(2px)}}
.die-result{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;
  background:linear-gradient(145deg,#fdfdfd,#d9dbe3);color:#15161c;font-family:var(--display);font-size:1.5rem;font-weight:800;
  box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.12),inset 0 2px 0 #fff;}
.die-result.poly{background:linear-gradient(145deg,#fbbf24,#ea580c);color:#1a0f02;box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.5);}
.die-result.poly.d4{clip-path:polygon(50% 2%,98% 92%,2% 92%);border-radius:0;padding-top:16px;}
.die-result.poly.d8{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border-radius:0;}
.die-result.poly.d10{clip-path:polygon(50% 0,100% 40%,82% 100%,18% 100%,0 40%);border-radius:0;padding-top:8px;}
.die-result.poly.d12{clip-path:polygon(50% 0,98% 35%,80% 98%,20% 98%,2% 35%);border-radius:0;padding-top:6px;}
.die-result.poly.d20{clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);border-radius:0;}
.die-result.poly.d100{border-radius:50%;font-size:1.2rem;}
.die-result.shaking{animation:die-shake .12s linear infinite;}
.die-result.rolling{animation:die-tumble .55s cubic-bezier(.22,.68,0,1) both;}
.die-result.max{box-shadow:0 0 0 3px var(--gold),0 8px 22px rgba(245,200,66,.45);}
.pips{display:grid;grid-template-columns:repeat(3,10px);grid-template-rows:repeat(3,10px);gap:4px;}
.pips i{width:10px;height:10px;border-radius:50%;background:#15161c;visibility:hidden;}
.pips i.on{visibility:visible;}
.d6-1 .pips i.on{background:#dc2626;}
.total-display{text-align:center;margin-top:18px;}
.total-label{font-size:.75rem;color:rgba(255,255,255,.6);font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.total-val{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--gold);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.total-val.pop{animation:gn-pop .35s var(--spring) both;}
/* History */
.hist-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px;}
.hist-head .sec-lbl{margin:0;}
.history-list .hist-item{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border-bottom:1px solid var(--line);}
.hist-item:last-child{border-bottom:none;}
.hist-dice{display:flex;flex-direction:column;min-width:0;}
.hist-dice b{font-size:.95rem;font-weight:700;}
.hist-dice span{font-size:.82rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-total{font-family:var(--display);font-size:1.3rem;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;}
/* Docked action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
  padding:12px max(16px,var(--safe-r)) calc(12px + var(--safe-b)) max(16px,var(--safe-l));
  background:rgba(11,13,18,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);}
.bar .btn{width:100%;max-width:688px;min-height:54px;font-size:1.08rem;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Dice Roller</span>
</nav>
<div class="page">

<div class="sec-lbl">Die</div>
<div class="die-types" id="die-types"></div>

<div class="group">
  <div class="row">
    <div><div class="row-lbl">Number of dice</div><div class="row-sub" id="cnt-sub">2d6</div></div>
    <div class="stepper">
      <button class="cnt-btn" id="minus-btn" aria-label="Fewer dice">−</button>
      <div class="cnt-val" id="cnt-val">2</div>
      <button class="cnt-btn" id="plus-btn" aria-label="More dice">+</button>
    </div>
  </div>
</div>

<div class="tray felt" id="tray" role="button" aria-label="Roll">
  <div class="dice-results" id="dice-results"><div class="tray-empty"><b>🎲</b>Tap Roll — or tap the table</div></div>
  <div class="total-display" id="total-display" style="display:none;">
    <div class="total-label">Total</div>
    <div class="total-val" id="total-val">0</div>
  </div>
</div>

<div id="history-card" style="display:none;">
  <div class="hist-head">
    <span class="sec-lbl">Roll history</span>
    <button class="btn-ghost" id="clear-hist">Clear</button>
  </div>
  <div class="group"><div id="history-list" class="history-list"></div></div>
</div>

</div>
<div class="bar"><button class="btn btn-gold" id="roll-btn">Roll 2d6</button></div>
<script>
'use strict';
const ICONS={
  4:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 21.5 20h-19z"/></svg>',
  6:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/></svg>',
  8:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 22 12 12 22 2 12z"/><path d="M2 12h20"/></svg>',
  10:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 22 10 18 21H6L2 10z"/></svg>',
  12:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 21.5 9 18 21H6L2.5 9z"/><path d="M12 7 16 10 14.5 15h-5L8 10z"/></svg>',
  20:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 7 17 15H7z"/></svg>',
  100:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><text x="12" y="15.5" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" stroke="none" font-family="Inter,system-ui">%</text></svg>',
};
const DICE=[
  {faces:4, label:'d4'},
  {faces:6, label:'d6'},
  {faces:8, label:'d8'},
  {faces:10,label:'d10'},
  {faces:12,label:'d12'},
  {faces:20,label:'d20'},
  {faces:100,label:'d100'},
];
const haptic=k=>{try{window.GN&&GN.haptic(k);}catch(e){}};

let selDie=1; // index (d6 default)
let dieCount=2;
let history=[];
let rolling=false;

// Build die type buttons
const dtEl=document.getElementById('die-types');
DICE.forEach((d,i)=>{
  const b=document.createElement('button');
  b.className='dt-btn'+(i===selDie?' active':'');
  b.innerHTML=`<span class="dt-icon">${ICONS[d.faces]}</span><span class="dt-label">${d.label}</span>`;
  b.addEventListener('click',()=>{
    selDie=i;haptic('select');
    document.querySelectorAll('.dt-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    syncLabels();
  });
  dtEl.appendChild(b);
});

function syncLabels(){
  const lbl=dieCount+DICE[selDie].label;
  document.getElementById('cnt-val').textContent=dieCount;
  document.getElementById('cnt-sub').textContent=lbl;
  document.getElementById('roll-btn').textContent='Roll '+lbl;
  document.getElementById('minus-btn').disabled=dieCount<=1;
  document.getElementById('plus-btn').disabled=dieCount>=20;
}
document.getElementById('minus-btn').addEventListener('click',()=>{
  if(dieCount>1){dieCount--;haptic('select');syncLabels();}
});
document.getElementById('plus-btn').addEventListener('click',()=>{
  if(dieCount<20){dieCount++;haptic('select');syncLabels();}
});

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function faceHTML(v,faces){
  if(faces===6){let h='<div class="pips">';for(let k=0;k<9;k++)h+=`<i class="${PIPS[v].includes(k)?'on':''}"></i>`;return h+'</div>';}
  return String(v);
}
function setFace(d,v,faces){
  d.innerHTML=faceHTML(v,faces);
  d.classList.toggle('d6-1',faces===6&&v===1);
}

function roll(){
  if(rolling)return;
  rolling=true;
  const faces=DICE[selDie].faces;
  const rolls=Array.from({length:dieCount},()=>Math.ceil(Math.random()*faces));
  const total=rolls.reduce((a,b)=>a+b,0);

  // Sound: rattle shake at roll start
  try{sRollShake();}catch(e){}
  haptic('medium');

  // Render dice: shake with flickering faces, then tumble onto the table
  const dr=document.getElementById('dice-results');dr.innerHTML='';
  const els=rolls.map(()=>{
    const d=document.createElement('div');
    d.className='die-result shaking'+(faces===6?'':' poly d'+faces);
    setFace(d,Math.ceil(Math.random()*faces),faces);
    dr.appendChild(d);return d;
  });
  const flick=setInterval(()=>els.forEach(d=>{ if(d.classList.contains('shaking'))setFace(d,Math.ceil(Math.random()*faces),faces); }),70);
  const td=document.getElementById('total-display');
  td.style.display='block';
  document.getElementById('total-val').textContent='…';
  els.forEach((d,i)=>{
    setTimeout(()=>{
      d.classList.remove('shaking');
      setFace(d,rolls[i],faces);
      void d.offsetWidth;
      d.classList.add('rolling');
      if(rolls[i]===faces&&faces>2)d.classList.add('max');
      try{sDieLand(rolls[i],faces);}catch(e){} // click as each die lands
    },280+i*60);
  });
  const done=280+dieCount*60+260;
  setTimeout(()=>clearInterval(flick),280+dieCount*60);

  // Special result sounds (after all dice land)
  const allMax=rolls.every(v=>v===faces), allMin=rolls.every(v=>v===1);
  setTimeout(()=>{
    if(allMax){try{sRollMax();}catch(e){}haptic('success');}
    else if(allMin){try{sRollMin();}catch(e){}haptic('error');}
    else haptic('light');
  }, done+160);

  // Total
  setTimeout(()=>{
    const tv=document.getElementById('total-val');
    tv.textContent=total;tv.classList.remove('pop');void tv.offsetWidth;tv.classList.add('pop');
    rolling=false;
    // History
    history.unshift({dice:DICE[selDie].label,count:dieCount,rolls,total});
    if(history.length>12)history.pop();
    document.getElementById('history-card').style.display='';
    renderHistory();
  },done);
}
document.getElementById('roll-btn').addEventListener('click',roll);
document.getElementById('tray').addEventListener('click',roll);
document.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter')&&e.target===document.body){e.preventDefault();roll();} });

// ── Sound ────────────────────────────────────────────────────────────────────
let _ac=null;
function sac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function sTone(freq,start,dur,vol,type,ramp){
  const ctx=sac(),t=ctx.currentTime+start,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(ramp)o.frequency.exponentialRampToValueAtTime(ramp,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.18,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.05);
}
function sNoise(start,dur,fc,q,vol,decay){
  const ctx=sac(),t=ctx.currentTime+start;
  const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*(decay||0.5)));
  const src=ctx.createBufferSource();src.buffer=buf;
  const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=fc||1000;filt.Q.value=q||2;
  const g=ctx.createGain();g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(filt);filt.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+dur+0.05);
}

// Dice rattle — tumbling noise burst with a little pitch shimmy
function sRollShake(){
  sNoise(0,.12,300,1,.22,.35);        // low wooden rumble
  sNoise(.04,.10,900,3,.14,.2);       // surface texture
  sTone(200,.02,.12,.08,'sawtooth',90); // short thud undertone
}

// Each die landing — sharp click; pitch scales with die value (high roll = brighter)
function sDieLand(value,faces){
  const pct=value/faces;             // 0=low, 1=max
  const freq=500+pct*800;            // 500 Hz low → 1300 Hz high
  sNoise(0,.04,freq,5,.16,.1);
  sTone(freq*.6,0,.06,.06,'triangle',freq*.3);
}

// All max — triumphant ascending fanfare
function sRollMax(){
  [523,659,784,1047].forEach((f,i)=>sTone(f,i*.08,.5,.22));
  sTone(262,0,.55,.09,'triangle');
}

// All min (all 1s) — descending sad trombone
function sRollMin(){
  [350,278,220,175].forEach((f,i)=>sTone(f,i*.1,.32,.18,'sawtooth'));
}

function renderHistory(){
  const el=document.getElementById('history-list');el.innerHTML='';
  history.forEach(h=>{
    const item=document.createElement('div');item.className='hist-item';
    item.innerHTML=`<span class="hist-dice"><b>${h.count}${h.dice}</b><span>${h.rolls.join(' · ')}</span></span><span class="hist-total">${h.total}</span>`;
    el.appendChild(item);
  });
}

document.getElementById('clear-hist').addEventListener('click',()=>{
  history=[];document.getElementById('history-list').innerHTML='';
  document.getElementById('history-card').style.display='none';
});
syncLabels();
</script>
</body>
</html>

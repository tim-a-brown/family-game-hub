<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearts Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null;
  var SETUP = 'hearts_pad_setup';

  Kit.init({
    id: 'hearts', title: 'Hearts score',
    onNew: function () { if (pad) pad.clear(); localStorage.removeItem(SETUP); showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history('hearts', { keys: ['ht'], title: 'Hearts: past games' }); } }],
    rules:
      '<p class="goal">Play Hearts with a real deck and keep score here. When someone reaches the target, the <b>lowest score wins</b>.</p>' +
      '<h3>After each hand</h3><p>Enter how many <b>hearts</b> each player took and who took the <b>Queen of Spades</b>. Hearts are 1 point each and the Queen is 13.</p>' +
      '<h3>Shooting the moon</h3><p>If one player takes all 13 hearts and the Queen, they score 0 and everyone else gets 26. This is detected automatically.</p>' +
      '<h3>Player counts</h3><ul><li><b>4 players:</b> full deck, 13 cards each.</li><li><b>3 players:</b> remove the 2♦.</li><li><b>5 players:</b> remove the 2♦ and 2♣.</li><li><b>6 players:</b> remove the 2♦, 2♣, 3♦ and 3♣.</li></ul><p>Passing rotates left, right, across, then no pass (with 3 or 5+ players, just alternate left and right).</p>'
  });

  function showSetup() {
    Kit.setup(app, {
      players: { min: 3, max: 6, count: 4 },
      options: [{ id: 'target', label: 'Play to', value: 100, choices: [[50, '50'], [100, '100']] }],
      start: 'Start scoring',
      onStart: function (cfg) {
        localStorage.setItem(SETUP, JSON.stringify({ names: cfg.players.map(function (p) { return p.name; }), target: +cfg.options.target || 100 }));
        startPad();
      }
    });
  }

  function startPad() {
    var cfg = JSON.parse(localStorage.getItem(SETUP));
    pad = Scorepad(app, {
      key: 'ht', title: 'Hearts', mode: 'Scorekeeper', lowWins: true, target: cfg.target,
      sides: cfg.names.map(function (n) { return { name: n }; }),
      goal: 'Lowest score wins · game ends at ' + cfg.target,
      form: function (ctx) {
        var n = ctx.sides.length, prevQ = -1, prevHearts = null;
        if (ctx.prev) {
          var sc = ctx.prev.scores, moon = sc.filter(function (v) { return v === 26; }).length === n - 1 && sc.indexOf(0) >= 0;
          if (moon) { prevQ = sc.indexOf(0); prevHearts = sc.map(function (v, i) { return i === prevQ ? 13 : 0; }); }
          else {
            sc.forEach(function (v, i) { if (v >= 13) prevQ = i; });
            prevHearts = sc.map(function (v, i) { return i === prevQ ? v - 13 : v; });
          }
        }
        ctx.node.appendChild(el('div', { class: 'label', text: 'Hearts taken' }));
        var rows = ctx.sides.map(function (s, i) {
          var r = ctx.number(i, { min: 0, max: 13, neg: false, value: prevHearts ? prevHearts[i] : 0 });
          r.input.addEventListener('input', check);
          ctx.node.appendChild(r); return r;
        });
        ctx.node.appendChild(el('div', { class: 'label', style: { 'margin-top': '6px' }, text: 'Who took the Queen of Spades?' }));
        var q = prevQ, seg = el('div', { class: 'seg', style: { 'flex-wrap': 'wrap' } });
        ctx.sides.forEach(function (s, i) {
          seg.appendChild(el('button', { type: 'button', text: s.name, class: i === q ? 'on' : '', onclick: function () {
            q = i; Array.prototype.forEach.call(seg.children, function (b, j) { b.classList.toggle('on', j === i); }); Kit.sfx('tap'); check();
          } }));
        });
        ctx.node.appendChild(seg);
        var note = el('div', { class: 'rnote' }); ctx.node.appendChild(note);
        var btn = el('button', { type: 'button', class: 'btn btn-primary btn-block', text: ctx.prev ? 'Save changes' : 'Score this hand' });
        ctx.node.appendChild(btn);
        function hearts() { return rows.map(function (r) { return Math.max(0, Math.min(13, r.value())); }); }
        function check() {
          var h = hearts(), sum = h.reduce(function (a, b) { return a + b; }, 0);
          var ok = sum === 13 && q >= 0;
          note.className = 'rnote' + (ok ? '' : ' bad');
          note.textContent = sum !== 13 ? 'Hearts add up to ' + sum + '. There are 13.' : q < 0 ? 'Pick who took the Queen' : (h[q] === 13 ? ctx.sides[q].name + ' shot the moon!' : 'Looks right');
          btn.disabled = !ok;
          return ok;
        }
        btn.addEventListener('click', function () {
          if (!check()) return;
          var h = hearts(), scores, extra = { highlights: [] };
          if (h[q] === 13) {
            scores = ctx.sides.map(function (s, i) { return i === q ? 0 : 26; });
            extra.highlights.push(ctx.sides[q].name + ' shot the moon in hand ' + ctx.round + '!');
            extra.callout = 'Shot the moon!'; Kit.confetti({ count: 90 });
          } else scores = h.map(function (v, i) { return v + (i === q ? 13 : 0); });
          ctx.done(scores, extra);
        });
        check();
      }
    });
  }

  if (localStorage.getItem(SETUP)) startPad(); else showSetup();
})();
</script>
</body>
</html>

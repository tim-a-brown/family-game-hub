<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donkey Kong</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<style>
/* ── Arcade page shell: fills the screen, never scrolls ─────────────────── */
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 45% at 50% 0%, rgba(255,70,80,.10) 0%, rgba(255,70,80,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;padding:0 8px calc(var(--safe-b) + 8px);display:flex;}
.dk-view{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:none;}
.dk-view[hidden]{display:none;}
.hud{flex:none;display:flex;align-items:stretch;gap:6px;width:100%;}
/* the cabinet's own score line is on the screen, so only the pause button sits above it */
.hud{justify-content:flex-end;}
.hud .plate{display:none;}
.plate{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 8px;border-radius:14px;
  background:linear-gradient(180deg,#22142a,#120a18);box-shadow:inset 0 0 0 1.5px rgba(255,120,110,.3),0 6px 14px rgba(0,0,0,.35);}
.plate small{font-size:.6rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,180,170,.65);white-space:nowrap;}
.plate b{font-family:var(--display);font-weight:400;font-size:1.4rem;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;}
.plate.sc b{color:#ff6b6b;text-shadow:0 0 12px rgba(255,80,80,.45);}
.plate.bump b{animation:bounce .4s var(--spring);}
.pbtn{flex:none;width:48px;border:0;border-radius:14px;display:grid;place-items:center;color:#ffd0c8;
  background:linear-gradient(180deg,#22142a,#120a18);box-shadow:inset 0 0 0 1.5px rgba(255,120,110,.3),0 6px 14px rgba(0,0,0,.35);}
.pbtn:active{transform:scale(.94);}
.pbtn svg{width:22px;height:22px;}
/* Cabinet: a wooden bezel round a dark glass screen */
.cab{flex:none;width:100%;display:flex;align-items:center;justify-content:center;}
.bezel{position:relative;padding:7px;border-radius:20px;}
.scr{position:relative;border-radius:13px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 2px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);}
.scr canvas{display:block;touch-action:none;image-rendering:pixelated;}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),
    radial-gradient(120% 100% at 50% 50%,transparent 62%,rgba(0,0,0,.45) 100%);}
/* Overlay cards inside the screen */
.ov{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(8,2,10,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
.ov[hidden]{display:none;}
.ov .card{width:100%;max-width:300px;text-align:center;animation:pop .35s var(--spring);}
.ov h2{font-family:var(--display);font-weight:400;font-size:2.3rem;line-height:1;color:#ff6b6b;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 22px rgba(255,60,60,.35);}
.ov .sub{color:var(--text-2);font-weight:700;font-size:.92rem;margin:6px 0 12px;line-height:1.35;}
.ov .btn-lg{width:100%;}
.ov .row2{display:flex;gap:8px;margin-top:10px;}
.ov .row2 .btn{flex:1;min-height:42px;padding:0 10px;font-size:.9rem;}
/* Controls: a 4-way stick on the left, a big jump button on the right (arcade cabinet layout) */
.ctrls{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 6px;}
.pad{position:relative;width:170px;height:170px;border-radius:50%;touch-action:none;-webkit-user-select:none;user-select:none;flex:none;
  background:radial-gradient(circle at 50% 40%,#3a2340 0%,#22142a 60%,#140a18 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.1),inset 0 -6px 14px rgba(0,0,0,.45),0 0 0 6px rgba(0,0,0,.25),0 14px 28px rgba(0,0,0,.45);}
.pad i{position:absolute;width:52px;height:52px;display:grid;place-items:center;color:rgba(255,200,190,.5);transition:color .1s,transform .1s;}
.pad i svg{width:28px;height:28px;}
.pad i.u{left:59px;top:6px;} .pad i.d{left:59px;bottom:6px;} .pad i.l{left:6px;top:59px;} .pad i.r{right:6px;top:59px;}
.pad i.on{color:#ff8a7a;transform:scale(1.15);filter:drop-shadow(0 0 8px rgba(255,90,70,.7));}
.pad .nub{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#ff9a8a,#e0302a 55%,#8a1010);box-shadow:0 4px 0 #5a0808,0 8px 16px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.55);
  transition:transform .08s;}
.jbtn{flex:none;width:118px;height:118px;border-radius:50%;border:0;touch-action:none;-webkit-user-select:none;user-select:none;
  font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.06em;color:#fff4d8;text-shadow:0 2px 0 rgba(0,0,0,.4);
  background:radial-gradient(circle at 42% 34%,#ffe27a,#f2a81c 55%,#a8620a);box-shadow:0 7px 0 #6b3c04,0 12px 22px rgba(0,0,0,.5),inset 0 3px 0 rgba(255,255,255,.55);
  transition:transform .06s,box-shadow .06s;}
.jbtn.down{transform:translateY(5px);box-shadow:0 2px 0 #6b3c04,0 6px 12px rgba(0,0,0,.5),inset 0 3px 0 rgba(255,255,255,.4);}
.hint{flex:none;font-size:.82rem;font-weight:700;color:var(--text-3);text-align:center;}
@media (hover:hover) and (pointer:fine){ .ctrls{display:none;} }
@media (hover:none),(pointer:coarse){ .hint{display:none;} }
@media (max-height:720px){ .pad{width:140px;height:140px;} .pad i{width:44px;height:44px;} .pad i.u{left:48px;top:3px;} .pad i.d{left:48px;bottom:3px;} .pad i.l{left:3px;top:48px;} .pad i.r{right:3px;top:48px;}
  .pad .nub{width:48px;height:48px;margin:-24px 0 0 -24px;} .jbtn{width:96px;height:96px;font-size:1.1rem;} }
/* Tablet landscape: the screen takes the full height, the stick bottom-left and the button bottom-right, under the thumbs */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px) and (pointer:coarse){
  html.ar-on #app{max-width:none;position:relative;}
  .ctrls{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 22px);padding:0 26px;pointer-events:none;}
  .ctrls > *{pointer-events:auto;}
  .pad{width:200px;height:200px;} .pad i{width:60px;height:60px;} .pad i.u{left:70px;top:8px;} .pad i.d{left:70px;bottom:8px;} .pad i.l{left:8px;top:70px;} .pad i.r{right:8px;top:70px;}
  .pad .nub{width:68px;height:68px;margin:-34px 0 0 -34px;} .jbtn{width:140px;height:140px;font-size:1.6rem;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<div class="dk-view" id="view" hidden>
  <div class="hud">
    <div class="plate sc" id="p-score"><small>Score</small><b id="h-score">0</b></div>
    <div class="plate"><small>High score</small><b id="h-hi">0</b></div>
    <button class="pbtn" id="btn-pause" type="button" aria-label="Pause"></button>
  </div>
  <div class="cab" id="cab">
    <div class="bezel wood" id="bezel">
      <div class="scr" id="scr">
        <canvas id="cv"></canvas>
        <div class="ov" id="ov" hidden><div class="card" id="ov-card"></div></div>
      </div>
    </div>
  </div>
  <div class="ctrls">
    <div class="pad" id="pad" aria-label="Joystick">
      <i class="u"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5 4 16h16z"/></svg></i>
      <i class="l"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 12 16 4v16z"/></svg></i>
      <i class="d"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 19 4 8h16z"/></svg></i>
      <i class="r"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 12 8 4v16z"/></svg></i>
      <span class="nub" id="nub"></span>
    </div>
    <button class="jbtn" id="jbtn" type="button" aria-label="Jump">JUMP</button>
  </div>
  <div class="hint">Arrow keys or WASD to move and climb · Space to jump · P to pause</div>
</div>

  function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  // ═══ Pause card, setup, start ═══════════════════════════════════════════
  var PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>';
  var PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  var welcome = false;
  function syncOverlay() {
    $('btn-pause').innerHTML = paused ? PLAY_SVG : PAUSE_SVG;
    $('btn-pause').style.visibility = G && phase !== 'over' && phase !== 'idle' ? 'visible' : 'hidden';
    var ov = $('ov'), card = $('ov-card'), h = '';
    if (paused && G && phase !== 'over') {
      h = '<h2>' + (welcome ? 'Welcome back' : 'Paused') + '</h2><div class="sub">Level ' + G.level + ', ' + heightNow() + ' m · ' + G.score.toLocaleString() + ' points</div>' +
        '<button class="btn btn-primary btn-lg" id="ov-resume" type="button">' + Kit.icon('play') + (welcome ? 'Continue' : 'Resume') + '</button>' +
        '<div class="row2"><button class="btn btn-soft" id="ov-quit" type="button">New game</button><button class="btn btn-soft" id="ov-rules" type="button">' + Kit.icon('book') + 'Rules</button></div>';
    }
    if (!h) { ov.hidden = true; return; }
    card.innerHTML = h; ov.hidden = false;
    bind('ov-resume', function () { setPaused(false); });
    bind('ov-quit', function () { Kit.confirm('Start a new game?', { ok: 'New game', body: 'This game will be lost.' }).then(function (ok) { if (ok) { clearSave(); showSetup(); } }); });
    bind('ov-rules', function () { Kit.rules(); });
  }
  function bind(id, fn) { var b = $(id); if (b) b.addEventListener('click', function (e) { e.stopPropagation(); Kit.sfx('tap'); fn(); }); }
  function showPast() { setPaused(true); Kit.history(KEY, { title: 'Donkey Kong: past games' }); }
  function showSetup() {
    leaveGame();
    Kit.setup($('app'), {
      intro: 'Climb to the top, jump the barrels, rescue Pauline',
      options: [{ id: 'lives', label: 'Lives', help: 'How many tries you get before the game ends.',
        choices: [[3, '3 lives', 'Same as the arcade game.'], [5, '5 lives', 'Two extra tries, good for learning the stages.']], value: 3 }],
      players: { min: 1, max: 1, count: 1, label: 'Player' },
      start: 'Play',
      onStart: function (cfg) { var o = cfg.options || {}; startGame({ who: (cfg.players[0] && cfg.players[0].name) || 'Player', lives: +o.lives || 3 }); }
    });
    window.scrollTo(0, 0);
  }
  function leaveGame() {
    Snd.loop(null); Snd.hush(); paused = false; welcome = false; G = null; ST = null; phase = 'idle';
    document.documentElement.classList.remove('ar-on');
    var v = $('view'); if (v.parentNode === $('app')) document.body.appendChild(v);
    v.hidden = true;
  }
  function buildView() {
    var app = $('app'), v = $('view');
    app.className = ''; app.innerHTML = '';
    document.documentElement.classList.add('ar-on');
    v.hidden = false; app.appendChild(v);
    fit();
  }
  function startGame(cfg, saved) {
    paused = false; welcome = false; overDone = false;
    newGame(cfg, saved);
    buildView();
    Snd.unlock();
    if (saved) { startStage(false); welcome = true; paused = true; }
    else startIntro();
    hud(); syncOverlay(); kick();
  }
  function setPaused(v) {
    if (!G || phase === 'over' || phase === 'idle') return;
    if (paused === v) return;
    paused = v; if (v) { Snd.loop(null); Snd.hush(); save(); } else { welcome = false; Snd.unlock(); if (phase === 'play') Snd.loop(bgm()); last = 0; acc = 0; kick(); }
    syncOverlay();
  }

  // ═══ Input ══════════════════════════════════════════════════════════════
  var ctl = { l: false, r: false, u: false, d: false, jumpQ: false };
  var keyDir = { l: false, r: false, u: false, d: false }, padDir = { l: false, r: false, u: false, d: false };
  function syncCtl() { ['l', 'r', 'u', 'd'].forEach(function (k) { ctl[k] = keyDir[k] || padDir[k]; }); }
  var KEYS = { ArrowUp: 'u', KeyW: 'u', ArrowLeft: 'l', KeyA: 'l', ArrowDown: 'd', KeyS: 'd', ArrowRight: 'r', KeyD: 'r' };
  function skipIntro() { if (phase === 'intro') { pt = 1; Snd.hush(); return true; } if (phase === 'howhigh' && pt > 20) { pt = 20; return true; } return false; }
  document.addEventListener('keydown', function (e) {
    if (!G || document.querySelector('.ahi-overlay, .k-scrim, .k-win')) return;
    if (KEYS[e.code]) { e.preventDefault(); keyDir[KEYS[e.code]] = true; syncCtl(); if (paused) setPaused(false); return; }
    if (e.code === 'KeyP' || e.code === 'Escape') { if (phase !== 'over') setPaused(!paused); return; }
    if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyX' || e.code === 'Enter') {
      e.preventDefault(); if (e.repeat) return;
      if (paused) { setPaused(false); return; }
      if (skipIntro()) return;
      ctl.jumpQ = true;
    }
  });
  document.addEventListener('keyup', function (e) { if (KEYS[e.code]) { keyDir[KEYS[e.code]] = false; syncCtl(); } });
  var pad = $('pad'), nub = $('nub'), padId = null, padIs = pad.querySelectorAll('i');
  function padAt(e) {
    var r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    var len = Math.hypot(dx, dy), lim = r.width * .2;
    nub.style.transform = 'translate(' + (len > lim ? dx / len * lim : dx) + 'px,' + (len > lim ? dy / len * lim : dy) + 'px)';
    var was = JSON.stringify(padDir);
    padDir = { l: false, r: false, u: false, d: false };
    if (len >= r.width * .1) { if (Math.abs(dx) > Math.abs(dy) * .8) padDir[dx > 0 ? 'r' : 'l'] = true; if (Math.abs(dy) > Math.abs(dx) * .8) padDir[dy > 0 ? 'd' : 'u'] = true; }
    if (JSON.stringify(padDir) !== was) Kit.haptic('tick');
    syncCtl(); padShow();
  }
  function padShow() { ['u', 'l', 'd', 'r'].forEach(function (k, i) { padIs[i].classList.toggle('on', !!ctl[k]); }); }
  pad.addEventListener('pointerdown', function (e) { e.preventDefault(); if (paused) setPaused(false); if (skipIntro()) return; padId = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch (x) {} padAt(e); });
  pad.addEventListener('pointermove', function (e) { if (e.pointerId === padId) padAt(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { pad.addEventListener(t, function (e) { if (e.pointerId !== padId) return; padId = null; nub.style.transform = ''; padDir = { l: false, r: false, u: false, d: false }; syncCtl(); padShow(); }); });
  var jb = $('jbtn');
  jb.addEventListener('pointerdown', function (e) { e.preventDefault(); jb.classList.add('down'); Kit.haptic('tick'); if (paused) { setPaused(false); return; } if (skipIntro()) return; ctl.jumpQ = true; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { jb.addEventListener(t, function () { jb.classList.remove('down'); }); });
  $('scr').addEventListener('pointerdown', function () { skipIntro(); });
  $('view').addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  $('btn-pause').addEventListener('click', function () { Kit.sfx('tap'); setPaused(!paused); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { setPaused(true); save(); } else kick(); });
  document.addEventListener('kit:orient', function (e) { if (!e.detail.ok) { setPaused(true); save(); } });
  window.addEventListener('blur', function () { setPaused(true); });
  window.addEventListener('pagehide', save);

  // ═══ Main loop (fixed 60 Hz) ════════════════════════════════════════════
  var last = 0, acc = 0, DT = 1000 / 60, raf = 0, testHold = false;
  function loop(t) {
    raf = 0;
    if (!last) last = t;
    acc += Math.min(100, t - last); last = t;
    Snd.poll();
    var n = 0;
    while (acc >= DT) { acc -= DT; n++; if (!G || phase === 'idle' || paused || phase === 'over' || testHold) continue; step(); }
    if (G && (n || paused || overDone)) render();
    if (G && phase !== 'idle' && !paused && !overDone && !document.hidden) raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf && G && phase !== 'idle' && !paused && !overDone && !document.hidden) { last = 0; acc = 0; raf = requestAnimationFrame(loop); } }

  // ═══ Kit shell ══════════════════════════════════════════════════════════
  buildSprites(function () { if (G) render(); });
  Kit.init({ orient: 'portrait',
    id: 'donkeykong',
    theme: { wood: ['#4a2a1a', '#2a160c'] },
    onNew: function () { clearSave(); showSetup(); },
    menu: [
      { icon: 'trophy', label: 'High scores', onClick: function () { setPaused(true); ArcadeHi.show(HI, 'Donkey Kong'); } },
      { icon: 'history', label: 'Past games', onClick: showPast }
    ],
    rules:
      '<p class="goal">Donkey Kong has carried Pauline to the top of a building site. Climb up to her before the bonus timer runs out. Each level has a few different stages.</p>' +
      '<h3>Moving</h3><ul><li>Use the <b>stick</b> to walk and to climb ladders (stand at the bottom or top of one and push up or down). The <b>Jump</b> button jumps.</li>' +
      '<li>On a computer: <b>arrow keys</b> or <b>WASD</b>, <b>Space</b> to jump, <b>P</b> to pause.</li>' +
      '<li>A jump goes the way you were walking and can’t be steered once you’re in the air.</li>' +
      '<li>Broken ladders only go part of the way up.</li></ul>' +
      '<h3>What costs a life</h3><ul><li>Touching a barrel, fireball, cement pan, spring or Donkey Kong.</li><li>Falling further than a short hop (walking off a girder, or into a hole).</li><li>Riding the left elevator to the very top.</li><li>The bonus timer reaching zero.</li></ul>' +
      '<h3>The stages</h3><ul><li><b>Girders (25 m):</b> Donkey Kong rolls barrels down the slopes. Some roll down ladders; a blue one lights the oil drum and starts a fireball.</li>' +
      '<li><b>Conveyors (50 m):</b> cement pans ride the belts, the top ladders slide in and out, and fireballs come out of the burning drum.</li>' +
      '<li><b>Elevators (75 m):</b> ride the lifts up and down and dodge the bouncing springs near the top.</li>' +
      '<li><b>Rivets (100 m):</b> walk or jump over all eight yellow rivets to bring Donkey Kong down.</li></ul>' +
      '<h3>The hammer</h3><p>Jump up into a hammer to grab it. For about ten seconds you smash whatever touches it, but you can’t jump or climb. It flashes just before it runs out.</p>' +
      '<h3>Points</h3><ul><li>Jump over a barrel, fireball or pan: <b>100</b> (two at once <b>300</b>, three or more <b>800</b>).</li>' +
      '<li>Smash with the hammer: <b>300</b> for a barrel, <b>500</b> or <b>800</b> for anything else.</li>' +
      '<li>Pauline’s hat, parasol and purse: <b>300</b> on level 1, <b>500</b> on level 2, <b>800</b> after that.</li>' +
      '<li>Each rivet: <b>100</b>. Finishing a stage adds what’s left on the bonus timer.</li><li>One extra life at <b>7,000</b> points.</li></ul>'
  });

  // Testing hooks
  window.__dk = {
    G: function () { return G; }, ST: function () { return ST; }, phase: function () { return phase; },
    stage: function (kind, level) { if (!G) return; G.level = level || G.level; var l = stageList(G.level), i = l.indexOf(kind); G.si = i >= 0 ? i : 0; if (i < 0) { G.level = 3; G.si = [1, 2, 3, 4].indexOf(kind); } startStage(false); pt = 1; },
    god: function (v) { if (G) G.god = !!v; }, ctl: ctl, step: function (n) { for (var i = 0; i < (n || 1); i++) step(); render(); },
    put: function (x, pi) { if (!G) return; var p = ST.plats[pi]; G.m.x = x; G.m.y = surf(p, x); G.m.p = p; G.m.st = 'ground'; },
    render: render, surf: surf, phaseSet: function (p, t) { setPhase(p, t); },
    start: function (cfg) { startGame(cfg || { who: 'Tim', lives: 3 }); },
    hold: function (v) { testHold = !!v; }, pt: function () { return pt; },
    frameImg: function () { render(); return scr.toDataURL(); }, ready: function () { return artReady; }, sndReady: Snd.ready
  };

  new ResizeObserver(function () { fit(); }).observe($('view'));
  var saved0 = loadSave();
  if (saved0) startGame({ who: saved0.who, lives: saved0.startLives || 3 }, saved0);
  else showSetup();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twixt</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="twixt-core.js"></script>
<style>
.tw-credit{margin:-6px 0 2px;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-3);}
@media (max-height:600px){.tw-credit{display:none;}}
.cb-col{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
/* A player's plate: their peg, their name and whose turn, how many more pegs they need to join their borders, and
   under them the longest chain they have, drawn across the board's width */
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-height:48px;padding:5px 12px 5px 10px;border-radius:16px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s, background .2s;}
.pbar.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 18%,transparent);}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;}
.pbar .nm{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.pbar .nm .ico{width:15px;height:15px;color:var(--text-3);flex:none;}
.pbar .nm span{overflow:hidden;text-overflow:ellipsis;}
.pbar .sub{font-size:.72rem;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pbar.on .sub{color:var(--lit-ink);}
.pbar .tg{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:3.6em;}
.pbar .tg b{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.pbar .tg small{font-size:.7rem;font-weight:700;color:var(--text-3);white-space:nowrap;}
.pbar .tg.done b{color:var(--lit-ink);}
.pbar .tg b.bump{animation:pop .45s var(--spring);}
.peg{width:26px;height:26px;flex:none;border-radius:50%;position:relative;}
.peg.r{background:radial-gradient(circle at 36% 30%,#ff9c8a 0,#e0352b 30%,#9e1a14 72%,#5a0b08 100%);box-shadow:0 2px 0 #4a0a07,0 3px 6px rgba(0,0,0,.5);}
.peg.k{background:radial-gradient(circle at 36% 30%,#8f9098 0,#3a3b42 30%,#17171b 72%,#050506 100%);box-shadow:0 2px 0 #000,0 3px 6px rgba(0,0,0,.55);}
.pbar .span{flex-basis:100%;display:none;position:relative;height:8px;border-radius:5px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);margin:2px 0 1px;}
.pbar .span i{position:absolute;top:0;bottom:0;border-radius:5px;transition:left .4s var(--spring),width .4s var(--spring);}
.pbar .span i.r{background:linear-gradient(180deg,#f0574b,#a51b14);}
.pbar .span i.k{background:linear-gradient(180deg,#6d6e78,#1d1d22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
.pbar .span em{position:absolute;top:-1px;bottom:-1px;width:2px;background:rgba(255,255,255,.22);}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* The board: a walnut frame round a maple pegboard; Red's border rows at the top and bottom, Black's at the sides */
.frame{--rim:clamp(8px,2.4vw,15px);position:relative;padding:var(--rim);border-radius:14px;
  background:
    repeating-linear-gradient(91deg,rgba(255,255,255,.035) 0 2px,transparent 2px 8px),
    repeating-linear-gradient(87deg,rgba(0,0,0,.12) 0 1px,transparent 1px 13px),
    linear-gradient(180deg,#5a3720,#33200f);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.4),0 16px 34px rgba(0,0,0,.5);}
.bd{position:relative;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;}
.bd>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;}
.bd.shake{animation:shake .4s;}
.bd .hz{fill:transparent;}
.bd .pg.drop{animation:pdrop .42s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:center;}
@keyframes pdrop{0%{transform:translateY(-.9px) scale(1.7);opacity:0;}55%{opacity:1;}100%{transform:none;opacity:1;}}
.bd .lk.snap{stroke-dasharray:2.3;stroke-dashoffset:2.3;animation:lsnap .26s ease-out forwards;}
@keyframes lsnap{to{stroke-dashoffset:0;}}
.bd .lk.won,.bd .lkh.won{stroke:#ffd75a!important;filter:drop-shadow(0 0 .18px #ffd75a);transition:stroke .2s;}
.bd .pg.won .pb{filter:drop-shadow(0 0 .2px #ffd75a) brightness(1.2);}
.bd .ripple{fill:none;stroke:#ffd75a;stroke-width:.08;animation:rip .7s ease-out forwards;transform-box:fill-box;transform-origin:center;}
.bd .ripple.bad{stroke:#ff6a4d;}
@keyframes rip{from{transform:scale(.4);opacity:1;}to{transform:scale(2.6);opacity:0;}}
.bd .ghost{animation:gin .16s ease-out both;transform-box:fill-box;transform-origin:center;}
@keyframes gin{from{opacity:0;transform:scale(.6);}}
.bd .pv{stroke-dasharray:.18 .12;animation:pvm .8s linear infinite;}
@keyframes pvm{to{stroke-dashoffset:-.3;}}
.bd .lastr{fill:none;stroke:#ffd75a;stroke-width:.07;}
/* the loupe: the holes under a finger, three times larger, over the board */
.loupe{position:absolute;z-index:8;width:var(--ls,132px);height:var(--ls,132px);border-radius:50%;overflow:hidden;pointer-events:none;
  box-shadow:0 0 0 3px rgba(255,226,140,.9),0 10px 26px rgba(0,0,0,.55);background:#e2cda0;display:none;}
.loupe.on{display:block;}
.loupe svg{width:100%;height:100%;display:block;}
.turn{margin:2px 0 0;min-height:34px;}
.acts{display:flex;gap:10px;justify-content:center;margin-top:2px;}
.acts .btn{flex:1;max-width:200px;}
.acts .btn.place{animation:pop .35s var(--spring);}

/* A layout for each shape (fit() sizes the board to the room). Upright: the players over and under the board, the
   board as wide as the screen allows. Sideways: the players, whose turn and the buttons in a column at the left, the
   board you play on at the right, as tall as the room */
#app.stage.ipl{max-width:none;box-sizing:border-box;height:var(--avh,auto);display:flex;flex-direction:column;align-items:center;
  padding:4px max(10px,var(--corner-x,0px)) max(calc(var(--safe-b) + 10px),18px);}
#app.ipl>.cb-col{width:var(--cw,100%);max-width:none;flex:none;margin:auto 0;}
#app.tw-port>.cb-col{height:100%;margin:0;gap:var(--gp,10px);justify-content:center;}
#app.tw-port .pbar{min-height:56px;padding:7px 14px 7px 11px;}
#app.tw-port .pbar .nm{font-size:1.02rem;}
#app.tw-port .pbar .sub{font-size:.78rem;}
#app.tw-port .pbar .tg b{font-size:1.75rem;}
#app.tw-port .peg{width:32px;height:32px;}
#app.tw-port>.cb-col>.turn{font-size:1.05rem;margin:0;}
#app.tw-port>.cb-col>.acts{margin:0;}
#app.tw-port:not(.tw-short) .pbar .span,#app.tw-land:not(.tw-low) .pbar .span{display:block;}
#app.tw-port.tw-short .pbar{min-height:44px;padding:3px 10px;}
#app.tw-port.tw-short .pbar .tg b{font-size:1.35rem;}
#app.tw-port.tw-short .peg{width:26px;height:26px;}
#app.tw-port.tw-short>.cb-col>.turn{min-height:26px;font-size:.92rem;}
#app.tw-tall .frame{--rim:18px;}
#app.tw-tall .pbar{min-height:62px;padding:8px 16px 8px 12px;}
#app.tw-tall .pbar .nm{font-size:1.1rem;}
#app.tw-tall .pbar .sub{font-size:.85rem;}
#app.tw-tall .pbar .tg b{font-size:2rem;}
#app.tw-tall .peg{width:36px;height:36px;}
#app.tw-tall .pbar .span{height:10px;}
#app.tw-land>.cb-col{width:auto;height:var(--bsz);display:grid;grid-template-columns:var(--sw,300px) var(--bsz);
  grid-template-rows:max-content max-content minmax(0,1fr) max-content max-content;
  grid-template-areas:"t b" "s b" ". b" "a b" "p b";column-gap:var(--cg,24px);row-gap:10px;justify-content:center;}
#app.tw-land>.cb-col>.frame{grid-area:b;--rim:clamp(8px,2vh,20px);}
#app.tw-land>.cb-col>.pbar.top{grid-area:t;}
#app.tw-land>.cb-col>.pbar.bot{grid-area:p;}
#app.tw-land>.cb-col>.turn{grid-area:s;justify-self:start;}
#app.tw-land>.cb-col>.acts{grid-area:a;justify-content:flex-start;flex-wrap:wrap;}
#app.tw-land:not(.tw-low) .pbar{min-height:58px;}
#app.tw-land:not(.tw-low) .pbar .tg b{font-size:1.9rem;}
#app.tw-low>.cb-col{row-gap:6px;}
#app.tw-low .pbar{min-height:42px;padding:3px 9px;}
#app.tw-low .peg{width:24px;height:24px;}
#app.tw-low>.cb-col>.turn{min-height:26px;font-size:.92rem;margin:0;}
#app.tw-low>.cb-col>.acts .btn{min-height:40px;}
/* A large window: the room in the column at the left, between whose turn it is and the buttons */
.room{display:none;}
#app.tw-land.tw-desk>.cb-col{grid-template-areas:"t b" "s b" "m b" "a b" "p b";}
#app.tw-land.tw-desk.tw-two>.cb-col{grid-template-columns:var(--sw) var(--rw) var(--bsz);grid-template-rows:max-content max-content minmax(0,1fr) max-content max-content;grid-template-areas:"t m b" "s m b" ". m b" "a m b" "p m b";}
#app.tw-land.tw-desk>.cb-col>.room{grid-area:m;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden;}
#app.tw-desk .pbar{min-height:calc(62px * var(--dk,1));padding:calc(8px * var(--dk,1)) calc(16px * var(--dk,1));}
#app.tw-desk .pbar .nm{font-size:calc(1.05rem * var(--dk,1));}
#app.tw-desk .pbar .sub{font-size:calc(.8rem * var(--dk,1));}
#app.tw-desk .pbar .tg b{font-size:calc(1.9rem * var(--dk,1));}
#app.tw-desk .peg{width:calc(34px * var(--dk,1));height:calc(34px * var(--dk,1));}
#app.tw-desk .pbar .span{height:calc(10px * var(--dk,1));}
#app.tw-desk>.cb-col>.turn{font-size:calc(1rem * var(--dk,1));}
.room .pn{background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;flex:none;font-size:calc(.92rem * var(--dk,1));}
.room .pn.mv{flex:0 1 auto;}
.room h4{margin:0;font-size:.88em;font-weight:800;color:var(--text-3);}
.room .say{margin:0;font-weight:600;line-height:1.35;}
.room .say b{font-weight:800;}
.room .tgt{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:6px 10px;}
#app .room .tgt .peg{width:1.3em;height:1.3em;}
.room .tgt .n{font-weight:700;overflow-wrap:anywhere;}
.room .tgt b{font-family:var(--display);font-size:1.5em;line-height:1;font-variant-numeric:tabular-nums;text-align:right;}
.room .tgt small{color:var(--text-3);font-weight:700;white-space:nowrap;}
.room .chart svg{width:100%;height:calc(74px * var(--dk,1));display:block;}
.room .key{margin:0;font-size:.85em;color:var(--text-3);}
.room .mvl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-height:0;}
.room .mvl li{display:grid;grid-template-columns:2.2em 1.1em minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 4px;border-radius:9px;}
.room .mvl li:first-child{background:color-mix(in srgb,var(--lit) 12%,transparent);}
.room .mvl li .no{color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:700;text-align:right;}
#app .room .mvl li .peg{width:1em;height:1em;}
.room .mvl li .who{font-weight:700;overflow-wrap:anywhere;}
.room .mvl li b{font-variant-numeric:tabular-nums;white-space:nowrap;}
.room .mvl li .tag{font-size:.8em;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--lit) 20%,transparent);color:var(--lit-ink);}
.room .mvl li .tag.blk{background:rgba(255,122,89,.18);color:#ffb39f;}
.room .mvl li.none{display:block;color:var(--text-3);}
.room .wins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.room .wins li{display:flex;justify-content:space-between;gap:10px;}
.room .wins li span{font-weight:700;overflow-wrap:anywhere;}
.frame{view-transition-name:tw-board;}
.pbar.top{view-transition-name:tw-top;}
.pbar.bot{view-transition-name:tw-bot;}
.cb-col>.turn{view-transition-name:tw-turn;}
.cb-col>.acts{view-transition-name:tw-acts;}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,.7,.25,1);}
::view-transition-old(root),::view-transition-new(root){animation:none;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), C = window.TwixtCore;
  var SAVE = 'twixt_state', KEY = 'twixt', N = 24, H = N * N;
  var RED = 1, BLACK = 2;
  var NUM = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight'];
  function num(n) { return NUM[n] || String(n); }
  function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  var CREDIT = 'Twixt was designed by Alex Randolph.';

  // ── The computer thinks in a Web Worker (twixt-core.js again), or on the page where a worker can't start ──
  var worker = null, workerOk = true, reqId = 0, pending = null;
  function getWorker() {
    if (worker || !workerOk) return worker;
    try {
      var url = new URL('twixt-core.js', location.href).href;
      var src = 'importScripts(' + JSON.stringify(url) + ');onmessage=function(e){var d=e.data;postMessage({id:d.id,res:self.TwixtCore.search(d.st,d.o)});};';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = function (e) { if (pending && e.data.id === pending.id) { var p = pending; pending = null; p.cb(e.data.res); } };
      worker.onerror = function () { workerOk = false; worker = null; if (pending) { var p = pending; pending = null; p.cb(C.search(p.st, p.o)); } };
    } catch (e) { workerOk = false; worker = null; }
    return worker;
  }
  function think(st, o, cb) {
    var id = ++reqId, w = getWorker();
    pending = { id: id, cb: cb, st: st, o: o };
    if (w) w.postMessage({ id: id, st: st, o: o });
    else setTimeout(function () { if (pending && pending.id === id) { pending = null; cb(C.search(st, o)); } }, 30);
  }
  function cancelThink() { pending = null; }

  // ── State ────────────────────────────────────────────────────────────────
  // S = the core's state (twixt-core.js) and {mode, level, cover, players: [{name, cpu, side}], hist (undo snapshots),
  //   started, tg: ['13.12', ...] (each side's pegs to go after every move, red's first; x = no way through left),
  //   ev: ['r2b', ...] (for each move: r/b who moved, how many links it made, b when it blocked), span: {1, 2} (the
  //   longest chain each side has had, in rows or columns), lo: {1, 2} (how far behind each side has been), offer}
  var S = null, AIM = -1, HOV = -1;
  var LEVEL_NAME = { easy: 'Easy', normal: 'Normal', hard: 'Hard' };
  var NET = null, LEFT = null, WINO = null, NETREC = {}, SHOWN = 0, OFFERSH = null, HOLD = false;
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && !S.over) Kit.resume.set(S.n ? 'Move ' + (S.n + 1) : 'Ready');
  }
  function clearSave() { if (NET) return; try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function pl(side) { return S.players[0].side === side ? S.players[0] : S.players[1]; }
  function vsCpu() { return S.players.some(function (p) { return p.cpu; }); }
  function colorName(side) { return side === RED ? 'Red' : 'Black'; }
  function isMe(p) { return NET ? NET.seat >= 0 && S.players[NET.seat] === p : !p.cpu && vsCpu(); }
  function nm(p) { return isMe(p) ? 'You' : p.name; }
  function poss(p) { return isMe(p) ? 'your' : Kit.poss(p.name); }
  function way(side) { return side === RED ? 'the top to the bottom' : 'the left side to the right'; }
  function pegCls(side) { return side === RED ? 'r' : 'k'; }

  function rulesHtml() {
    return '<p class="goal">Join <b>your two border rows</b> with an unbroken chain of your pegs and links. Red joins the top to the bottom, Black the left side to the right.</p>' +
      '<h3>Your turn</h3><ul><li><b>Red goes first.</b> On your turn, put one peg in any empty hole. The four corner holes aren’t used.</li>' +
      '<li>Red’s border rows are the top and bottom rows, and Black’s are the left and right columns. You can’t put a peg in the other player’s border rows.</li>' +
      '<li>Two of your pegs a <b>knight’s move</b> apart (two holes one way and one hole across, as a chess knight moves) are joined by a link at once.</li>' +
      '<li><b>Links never cross.</b> If a link would cross one already on the board, of either color, it isn’t made. Links stay for the rest of the game.</li>' +
      '<li>Touch and hold the board to see a hole up close. The ghost peg shows the links it would make, and a red dashed line shows a link that would be blocked. Tap Place, or tap the ghost peg again, to put your peg there.</li></ul>' +
      '<h3>Swap</h3><ul><li>Red moving first is an advantage, so after Red’s first peg, Black may <b>swap sides</b> instead of placing a peg. That peg stays red and becomes Black’s player’s, the players change colors, and the new Black moves next. You can turn the swap rule off in setup.</li></ul>' +
      '<h3>Winning</h3><ul><li>The first player whose links join a peg in one of their border rows to a peg in the other wins.</li>' +
      '<li>If neither player can join their border rows any more, the game is a draw. Players can also agree to a draw from the menu.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b> opens a table, and the other player joins on their own device. Take your turn whenever you like: the home screen shows when it’s your move. Each new game at the table swaps colors.</li></ul>' +
      '<h3>Tips</h3><ul><li>The number on your plate counts the pegs you still need to join your borders.</li>' +
      '<li>Two of your pegs placed two knight’s moves apart in a straight line are hard to cut off: there are two ways to join them.</li>' +
      '<li>Block early. A peg a few holes in front of the other player’s chain, joined to one of yours, turns them aside.</li></ul>' +
      '<p class="src">The first rules of 1962 let you add links when you chose and take your own links away again. This game uses the rules most people play today: links are made at once and never removed.</p>' +
      '<p class="credit">' + CREDIT + '</p>';
  }

  Kit.init({
    id: KEY, mark: false, snap: '.frame', snapY: 0.5,
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } cancelThink(); clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'hand', label: 'Offer a draw', when: function () { return !!(S && S.b && !S.over); }, onClick: function () { offerDraw(); } },
      { icon: 'flag', label: 'Resign', when: function () { return !!(S && S.b && !S.over); }, onClick: function () { resign(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Twixt: past games' }); } }]),
    rules: rulesHtml()
  });

  function showSetup() {
    S = null; AIM = HOV = -1;
    app.classList.remove('ipl', 'tw-land', 'tw-low', 'tw-tall', 'tw-port', 'tw-short', 'tw-desk', 'tw-deskp');
    Kit.setup(app, {
      modes: Kit.modes([{ id: 'cpu', desc: 'Easy, Normal or Hard' }, { id: '2p', kind: 'local' }]),
      options: [
        { id: 'level', robot: true, label: 'Computer skill', value: 'normal', choices: [['easy', 'Easy', 'Looks only at its own move, and often picks a weaker one.'], ['normal', 'Normal', 'Looks at your answer and its next move, and blocks your way through.'], ['hard', 'Hard', 'Looks five moves ahead and rarely lets a chain past.']], when: function (m) { return m === 'cpu'; } },
        { id: 'side', label: 'You play', value: 'r', choices: [['r', 'Red\nMoves first', 'Red always moves first, so you start. You join the top to the bottom.'], ['b', 'Black', 'The computer plays Red and moves first. You join the left side to the right.']], when: function (m) { return m === 'cpu'; } },
        { id: 'swap', label: 'Swap rule', value: 'on', choices: [['on', 'On', 'After Red’s first peg, Black may swap sides and take that peg, so Red’s first peg is best not too strong.'], ['off', 'Off', 'No swap: Red simply moves first.']] },
        { id: 'cover', label: 'Hand over between turns', value: 'off', choices: [['off', 'Off', 'Nothing in Twixt is hidden, so the device just goes across the table.'], ['on', 'On', 'A cover names whose turn it is before each move.']], when: function (m) { return m === '2p'; } }
      ],
      players: { min: 2, max: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },
      onStart: function (cfg) {
        var cpu = cfg.mode === 'cpu', hs = cpu && cfg.options.side === 'b' ? BLACK : RED;
        var pls = cfg.players.map(function (p, i) { return { name: p.name, cpu: p.cpu, side: i === 0 ? hs : 3 - hs }; });

  }
  function fit() {
    var col = app.querySelector('.cb-col'); if (!col || !app.classList.contains('ipl')) return;
    var W = window.innerWidth, Hh = window.innerHeight, land = W > Hh, low = land && Hh < 560;
    app.classList.toggle('tw-land', land); app.classList.toggle('tw-low', low); app.classList.toggle('tw-tall', !land && W >= 700);
    app.classList.toggle('tw-port', !land); app.classList.toggle('tw-short', !land && Hh < 640);
    var desk = deskWin(); app.classList.toggle('tw-desk', !!desk); app.classList.toggle('tw-deskp', !!desk && !land);
    app.style.setProperty('--dk', desk ? Math.max(1, Math.min(1.45, W / 1600, Hh / 1050)).toFixed(3) : '1');
    var top = app.getBoundingClientRect().top + (window.scrollY || 0);
    app.style.setProperty('--avh', Math.max(300, Hh - top) + 'px');
    var cs = getComputedStyle(app), iw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), ih = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var bsz;
    if (land) {
      var sw = low ? Math.min(250, Math.max(205, W * 0.27)) : Math.min(330, Math.max(250, W * 0.28)), cg = low ? 16 : 26;
      if (desk) { sw = Math.round(Math.min(560, Math.max(300, W * 0.25))); cg = 36; }
      app.style.setProperty('--sw', sw + 'px'); app.style.setProperty('--cg', cg + 'px');
      bsz = Math.floor(Math.max(200, Math.min(ih, iw - sw - cg)));
      // a wide strip of a window: the room stands in a column of its own between the players and the board
      var spare = iw - bsz - sw - cg, two = !!desk && spare >= 300 + cg;
      app.classList.toggle('tw-two', two);
      if (two) { var rw = Math.min(560, spare - cg); app.style.setProperty('--rw', rw + 'px'); }
      app.style.setProperty('--bsz', bsz + 'px');
    } else {
      app.style.setProperty('--gp', '10px');
      var other = 0, gap = 10;
      Array.prototype.forEach.call(col.children, function (c) { if (!c.classList.contains('frame') && getComputedStyle(c).display !== 'none') other += c.offsetHeight + gap; });
      var cw = Math.floor(Math.max(240, Math.min(iw, desk ? 1e5 : 820, ih - other)));
      app.style.setProperty('--cw', cw + 'px');
      var over = col.scrollHeight - ih;
      if (over > 0) app.style.setProperty('--cw', Math.max(180, cw - over) + 'px');
      // the room the board can't use goes into the gaps between the parts (up to 30px each), not into one empty band
      app.style.setProperty('--gp', '10px');
      var kids = Array.prototype.filter.call(col.children, function (c) { return getComputedStyle(c).display !== 'none'; }), used = 0;
      kids.forEach(function (c) { used += c.offsetHeight; });
      var free = ih - used - 10 * (kids.length - 1);
      if (free > 0) app.style.setProperty('--gp', Math.min(30, 10 + free / (kids.length + 1)) + 'px');
      bsz = parseFloat(getComputedStyle(app).getPropertyValue('--cw')) || cw;
    }
    // at a desk the board is large enough for its letters and numbers round the edge
    var lab = bsz / 25 >= 26;
    if (lab !== LABELS) { LABELS = lab; M = lab ? 0.95 : 0.3; if (svgEl) { buildBoard(); paintPieces(null); } }
    paintRoom();
  }
  var lastWH = window.innerWidth + 'x' + window.innerHeight;
  window.addEventListener('resize', function () {
    var wh = window.innerWidth + 'x' + window.innerHeight; if (wh === lastWH) return; lastWH = wh;
    if (app.classList.contains('ipl')) Kit.glide(fit); else fit();
  });

  // ── Online ───────────────────────────────────────────────────────────────
  // Seat 0 plays the setup's color in the first game; each new game at the table swaps colors. A swap trades the
  // players' colors in the table's state. The table's state is the core's with the players and the counts the room and
  // the history need; it has no undo snapshots.
  function netSeatOf(st, side) { return st.players[0].side === side ? 0 : 1; }
  function netOpts() {
    var o = { side: 'r', swap: 'on' };
    try { var g = JSON.parse(localStorage.getItem('gn_setup_' + KEY)); if (g && g.options) { if (g.options.side === 'b') o.side = 'b'; if (g.options.swap === 'off') o.swap = 'off'; } } catch (e) {}
    return o;
  }
  function netStart(players, opts, last) {
    var s0 = last && last.players ? (last.p0 ? 3 - last.p0 : 3 - last.players[0].side) : opts && opts.side === 'b' ? BLACK : RED;
    var st = C.newGame({ swap: !(opts && opts.swap === 'off') });
    st.mode = 'online'; st.level = 'normal';
    st.players = players.map(function (p, i) { return { name: p.name, cpu: false, side: i === 0 ? s0 : 3 - s0 }; });
    st.p0 = s0;   // (seat 0's color as the game began, so a swap doesn't decide the next game's colors)
    freshFields(st); delete st.hist; delete st.busy;
    st.wins = last && last.wins ? last.wins.slice() : [0, 0, 0];
    return st;
  }
  function netApply(st, mv) {
    if (st.over) return null;
    var before = st.tg[st.tg.length - 1], res = C.play(st, mv);
    if (!res) return null;
    st.offer = null;
    if (res.swap) st.players.forEach(function (p) { p.side = 3 - p.side; });
    note(st, res, before);
    if (st.ml.length > 600) return null;
    if (st.over) st.wins[st.win ? netSeatOf(st, st.win) : 2]++;
    return { state: st, mv: { h: res.swap ? 'swap' : res.h, side: res.side } };
  }
  function netEndOf(st, why, win) { C.end(st, why, win); st.wins[win ? netSeatOf(st, win) : 2]++; }
  function netMove(mv) { if (!S || S.over || LEFT || !NET.myTurn()) return; S.busy = true; paintActs(); NET.act(function (st) { return netApply(st, mv); }); setTimeout(function () { if (S) S.busy = false; }, 4000); }
  function netResign() {
    if (!S || S.over || LEFT) return;
    var me = NET.seat;
    Kit.confirm('Resign this game?', { ok: 'Resign', danger: true, body: S.players[1 - me].name + ' will win this game.' }).then(function (ok) {
      if (!ok || !NET) return;
      NET.act(function (st) { if (st.over) return null; netEndOf(st, 'resign', 3 - st.players[me].side); return { state: st, mv: { resign: me } }; });
    });
  }
  function netOfferDraw() {
    if (!S || S.over || LEFT) return;
    if (!NET.myTurn()) return Kit.toast('You can offer a draw on your turn');
    if (S.offer != null && S.offer !== NET.seat) return netAnswerOffer();
    var me = NET.seat;
    Kit.confirm('Offer ' + S.players[1 - me].name + ' a draw?', { ok: 'Offer a draw', body: 'Then place your peg. ' + S.players[1 - me].name + ' can agree on their turn, or play on.' }).then(function (ok) {
      if (!ok || !NET) return;
      NET.act(function (st) { if (st.over) return null; st.offer = me; return { state: st, mv: { offer: me } }; });
      Kit.toast('Your offer stands until ' + S.players[1 - me].name + ' moves. Now place your peg.');
    });
  }
  function netAnswerOffer() {
    if (!NET || !S || S.over || OFFERSH) return;
    var other = S.players[S.offer], me = NET.seat;
    OFFERSH = true;
    Kit.confirm(other.name + ' offered a draw', { ok: 'Agree to a draw', body: 'Agree and the game ends as a draw, or play on and place your peg.' }).then(function (ok) {
      OFFERSH = null;
      if (!ok || !NET) return;
      NET.act(function (st) { if (st.over || st.offer == null || st.offer === me) return null; netEndOf(st, 'agreed', 0); return { state: st, mv: { agreed: 1 } }; });
    });
  }
  function netAgain() { if (!NET) return; if (LEFT) { TurnNet.leave(); TurnNet.open(); } else NET.again(); }
  function netShow(net, info) {
    NET = net; cancelThink();
    if (WINO && (info.again || info.fresh)) { WINO.close(); WINO = null; }
    var prev = S;
    S = JSON.parse(JSON.stringify(net.state)); S.busy = false; S.hist = []; AIM = HOV = -1;
    LEFT = net.status === 'over' && !S.over && net.result && net.result.left != null ? net.result : null;
    var tok = ++SHOWN, mv = info.mv && info.mv.h != null && !info.fresh && !info.again ? info.mv : null;
    if (mv && prev && prev.b && prev.n === S.n - 1) {
      var res = mv.h === 'swap' ? { swap: true, side: mv.side, links: [] } : { h: mv.h, side: mv.side, links: S.last && S.last.links ? S.last.links : [] };
      var e = S.ev[S.ev.length - 1] || '', info2 = res.swap ? null : { blocked: /x$/.test(e), sealed: tgOf(S.tg[S.tg.length - 1], 3 - mv.side) >= 99 && tgOf(prev.tg[prev.tg.length - 1], 3 - mv.side) < 99, after: tgOf(S.tg[S.tg.length - 1], 3 - mv.side), before: tgOf(prev.tg[prev.tg.length - 1], 3 - mv.side), span: S.span[mv.side], mile: S.span[mv.side] >= 18 && prev.span[mv.side] < 18 ? 18 : S.span[mv.side] >= 12 && prev.span[mv.side] < 12 ? 12 : 0 };
      show(res, info2, true);
      if (!S.over && !info.mine && net.myTurn()) setTimeout(function () { if (tok === SHOWN) { Kit.haptic('light'); if (S.offer != null && S.offer !== net.seat) netAnswerOffer(); } }, moveT(res));
    } else {
      render(null);
      if (S.over || LEFT) setTimeout(function () { if (tok === SHOWN) netEnd(); }, 150);
      else if (S.offer != null && S.offer !== net.seat && net.myTurn()) setTimeout(function () { if (tok === SHOWN) netAnswerOffer(); }, 400);
    }
    if (info.again) { Kit.sfx('deal'); Kit.callout(isMe(pl(RED)) ? 'You start' : pl(RED).name + ' starts'); }
  }
  function netEnd() {
    if (!NET || !S) return;
    var left = LEFT;
    var wi = left ? (left.win && left.win.length ? left.win[0] : -1) : S.win ? netSeatOf(S, S.win) : -1;
    var w = wi >= 0 ? S.players[wi] : null, key = NET.code + ':' + S.started;
    var done = NETREC[key]; try { done = done || (JSON.parse(localStorage.getItem('twixt_net_rec')) || []).indexOf(key) >= 0; } catch (e) {}
    var wave = left ? 0 : S.why === 'connect' ? winWave() : 0;
    if (!done && !left) {
      NETREC[key] = 1;
      try { var rl = JSON.parse(localStorage.getItem('twixt_net_rec')) || []; rl.push(key); localStorage.setItem('twixt_net_rec', JSON.stringify(rl.slice(-30))); } catch (e) {}
      var hl = highlights(); hl.push('Played online at table ' + NET.code);
      Kit.record(KEY, {
        started: S.started, mode: 'Online',
        players: S.players.map(function (p) { var g = tgOf(S.tg[S.tg.length - 1], p.side); return { name: p.name + ' (' + colorName(p.side) + ')', score: S.win === p.side ? 'Joined' : g >= 99 ? 'Cut off' : g + ' to go', cpu: false }; }),
        winner: w ? w.name + ' (' + colorName(w.side) + ')' : null,
        highlights: hl, detail: detail()
      });
    }
    if (WINO) WINO.close();
    if (left) return netWin(w);
    endShow(w, wave, true);
  }
  function netWin(w) {
    if (!NET) return;
    var me = NET.seat, left = LEFT, wi = w ? S.players.indexOf(w) : -1;
    WINO = Kit.win({
      icon: !w ? 'users' : wi === me ? 'trophy' : 'users',
      title: left ? left.text : !w ? 'It’s a draw' : wi === me ? 'You win!' : w.name + ' wins',
      sub: left ? '' : endLine(),
      rank: left ? null : rankRows(),
      notes: left ? null : [S.players[0].name + ' has won ' + S.wins[0] + ' and ' + S.players[1].name + ' has won ' + S.wins[1] + (S.wins[2] ? ', with ' + S.wins[2] + (S.wins[2] === 1 ? ' draw' : ' draws') : '') + '.'], notesTitle: 'Games at this table',
      lose: !!w && wi !== me, againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { WINO = null; netAgain(); },
      look: { label: 'Look at the board', onClick: function () { WINO = null; } }
    });
  }
  function netLeave() {
    NET = null; LEFT = null; SHOWN++; if (WINO) { WINO.close(); WINO = null; }
    var sv = null; try { sv = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv && sv.b && sv.players && !sv.over) { S = sv; S.busy = false; S.hist = S.hist || []; render(); afterTurn(); }
    else showSetup();
  }

  // ── Test and demo hooks ──────────────────────────────────────────────────
  window.__twixt = {
    C: C, state: function () { return S; }, aim: function () { return AIM; },
    // a fresh game for these players: {mode: '2p' | 'cpu', level, swap, players: [{name, cpu, side}]}
    start: function (cfg) { cancelThink(); newGame({ mode: cfg.mode || '2p', level: cfg.level || 'normal', swap: cfg.swap !== false, cover: false, players: cfg.players }); },
    // a position from a list of moves ('D5 F6 swap ...', played in turn from an empty board), without the animations
    set: function (moves, keepTurn) {
      cancelThink(); S.busy = false;
      var st = C.newGame({ swap: S.swap }), list = Array.isArray(moves) ? moves : String(moves).split(/\s+/).filter(Boolean);
      var keep = { mode: S.mode, level: S.level, cover: S.cover, players: S.players, started: S.started };
      st.mode = keep.mode; st.level = keep.level; st.cover = keep.cover; st.players = keep.players;
      freshFields(st);
      list.forEach(function (m) { var before = st.tg[st.tg.length - 1], r = C.play(st, m); if (r) { if (r.swap) st.players.forEach(function (p) { p.side = 3 - p.side; }); note(st, r, before); } });
      if (keepTurn) st.turn = keepTurn;
      S = st; AIM = HOV = -1; save(); render(); afterTurn();
    },
    place: function (name) { place(typeof name === 'string' ? C.hole(name) : name); },
    hole: function (name) { var h = typeof name === 'string' ? C.hole(name) : name; return bdEl ? bdEl.querySelector('.hz[data-h="' + h + '"]') : null; },
    peg: function (name) { var h = typeof name === 'string' ? C.hole(name) : name; return bdEl ? bdEl.querySelector('.pg[data-h="' + h + '"]') : null; },
    swap: swapNow
  };

  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.b && saved.players && !saved.over) { S = saved; S.busy = false; S.hist = S.hist || []; render(); afterTurn(); }
  else showSetup();

  TurnNet.setup({
    game: KEY, title: 'Twixt', min: 2, max: 2,
    opts: netOpts, start: netStart,
    turn: function (st) { return st.over ? [] : [netSeatOf(st, st.turn)]; },
    over: function (st) {
      if (!st.over) return null;
      var w = st.win ? netSeatOf(st, st.win) : -1;
      return { win: w >= 0 ? [w] : [], text: w >= 0 ? st.players[w].name + (st.why === 'resign' ? ' wins by resignation' : ' joined their borders') : 'A draw' };
    },
    show: netShow, leave: netLeave
  });
})();
</script>
</body>

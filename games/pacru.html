<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pacru</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="pacru-core.js"></script>
<style>
.pc-credit{margin:-6px 0 2px;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-3);}
:root{--k1:#2c2f37;--k2:#d23a2f;--k3:#e9b322;--k4:#2f9a4f;}

/* ── The page: the plates (each player's markers toward the target and chevrons left), the board, the dock (whose turn,
   the choices a move leaves, the buttons), and at a desk the room. fit() picks the composition from the window ── */
#app.stage.ipl{max-width:none;box-sizing:border-box;height:var(--avh,auto);padding:4px max(10px,var(--corner-x,0px)) max(calc(var(--safe-b) + 10px),18px);display:flex;align-items:stretch;justify-content:center;}
.pg{display:grid;gap:var(--gp,10px);width:100%;height:100%;min-height:0;}
.pc-port .pg{grid-template-columns:var(--cw);grid-template-rows:max-content var(--fsz) minmax(0,1fr);grid-template-areas:"p" "b" "d";justify-content:center;align-content:center;}
.pc-land .pg{grid-template-columns:var(--lw) var(--fsz);grid-template-rows:var(--fsz);grid-template-areas:"l b";justify-content:center;align-content:center;column-gap:var(--cg,16px);}
.pc-w1 .pg{grid-template-columns:var(--lw) var(--fsz);grid-template-rows:minmax(0,1fr);grid-template-areas:"l b";justify-content:center;align-content:stretch;column-gap:var(--cg,28px);}
.pc-w2 .pg{grid-template-columns:var(--lw) var(--rw) var(--fsz);grid-template-rows:minmax(0,1fr);grid-template-areas:"l r b";justify-content:center;align-content:stretch;column-gap:var(--cg,28px);}
.pc-t .pg{grid-template-columns:var(--lw) minmax(0,1fr);grid-template-rows:var(--fsz) minmax(0,1fr);grid-template-areas:"b b" "l r";justify-content:center;column-gap:var(--cg,28px);row-gap:var(--gp,16px);}
.pc-t1 .pg{grid-template-columns:var(--lw);grid-template-rows:var(--fsz) max-content minmax(0,1fr);grid-template-areas:"b" "l" "r";}
.pg>.lcol{grid-area:l;min-height:0;min-width:0;display:flex;flex-direction:column;gap:var(--lg,10px);}
.pc-port .pg>.lcol{display:contents;}
.pc-port .plates{grid-area:p;}
.pc-port .dock{grid-area:d;}
.pg>.frame{grid-area:b;align-self:center;justify-self:center;}
.pg>.room{grid-area:r;}
.pc-land .lcol{justify-content:center;}
.pc-land.pc-short .lcol{justify-content:flex-start;}

/* the plates: a player's chevron in their color, their name, markers toward the target as a number and a meter, and
   one mark for each chevron they still have */
.plates{display:grid;gap:8px;align-content:start;}
.pc-port .plates{grid-template-columns:repeat(var(--pcols,2),minmax(0,1fr));}
.pc-land .plates,.pc-w1 .plates,.pc-w2 .plates,.pc-t .plates{grid-template-columns:repeat(var(--pcols,1),minmax(0,1fr));}
.plate{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"s w n" "m m m";align-items:center;column-gap:8px;row-gap:5px;padding:7px 10px 8px 8px;border-radius:14px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);transition:box-shadow .2s,background .2s,opacity .3s;}
.plate.on{background:color-mix(in srgb,var(--lit) 11%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lit) 65%,transparent),0 0 18px color-mix(in srgb,var(--lit) 16%,transparent);}
.plate.out{opacity:.6;}
.plate .sw{grid-area:s;width:30px;height:30px;display:block;}
.plate .who{grid-area:w;min-width:0;display:flex;flex-direction:column;line-height:1.15;}
.plate .nm{font-weight:800;font-size:.92rem;display:flex;align-items:center;gap:5px;min-width:0;}
.plate .nm>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.plate .nm .ico{width:14px;height:14px;color:var(--text-3);flex:none;}
.plate .sub{font-size:.72rem;font-weight:700;color:var(--text-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.plate.on .sub{color:var(--lit-ink);}
.plate .cvs{display:inline-flex;gap:2px;}
.plate .cvs i{width:9px;height:9px;display:block;background:var(--pc-l);clip-path:polygon(50% 0,100% 100%,50% 70%,0 100%);opacity:.95;}
.plate .cvs i.gone{background:rgba(255,255,255,.16);}
.plate .n{grid-area:n;display:flex;flex-direction:column;align-items:flex-end;line-height:1;}
.plate .n b{font-family:var(--display);font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;}
.plate .n small{font-size:.64rem;font-weight:700;color:var(--text-3);margin-top:2px;white-space:nowrap;}
.plate .n b.bump{animation:pop .45s var(--spring);}
.plate .mt{grid-area:m;position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;}
.plate .mt i{position:absolute;inset:0 auto 0 0;width:var(--f,0%);border-radius:99px;background:var(--pc-l);transition:width .6s cubic-bezier(.3,.8,.3,1);}
.plate.k1 .mt i{background:#9aa3b8;}
.pc-short .plate{padding:5px 8px 6px 6px;row-gap:3px;}
.pc-short .plate .sw{width:24px;height:24px;}
.pc-short .plate .n b{font-size:1.15rem;}
.pc-tiny .plate{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"s n" "m m";padding:4px 7px 5px;}
.pc-tiny .plate .who{display:none;}
.pc-tiny .plate .sw{width:22px;height:22px;}
.pc-tiny .plate .n b{font-size:1.05rem;}

/* the board: a pale ash field in a walnut rim, inlaid walnut lines between the borderlands */
.frame{--rim:clamp(6px,1.8vmin,16px);position:relative;padding:var(--rim);border-radius:18px;width:var(--fsz);height:var(--fsz);box-sizing:border-box;
  background:linear-gradient(160deg,#6b4429 0,#4a2c18 45%,#5a3620 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.45),0 18px 36px rgba(0,0,0,.5);view-transition-name:pc-board;}
.bd{position:relative;width:100%;height:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.bd>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;}
.bd .hz{fill:transparent;cursor:pointer;}
.bd .ovl,.bd .fx,.bd .tns,.bd .mks{pointer-events:none;}
.bd .cv{cursor:pointer;}
.bd .cv{transition:transform .42s cubic-bezier(.3,.9,.3,1);}
.bd .cv.lift{transition:none;}
.bd .cv.dead{animation:cvdie .7s ease-in forwards;}
@keyframes cvdie{40%{opacity:1;}100%{opacity:0;}}
.bd .mk.pop{animation:mkpop .45s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:center;}
@keyframes mkpop{0%{transform:scale(0);opacity:0;}100%{transform:none;opacity:1;}}
.bd .mk.gone{animation:mkgone .5s ease-in both;transform-box:fill-box;transform-origin:center;}
@keyframes mkgone{to{transform:scale(0);opacity:0;}}
.bd .tn.pop{animation:tnpop .5s ease-out both;}
@keyframes tnpop{0%{opacity:0;}100%{opacity:1;}}
.bd .dest{animation:dpulse 1.8s ease-in-out infinite;}
@keyframes dpulse{50%{opacity:.55;}}
.bd .aim{animation:none;}
.bd .threat{animation:thr 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes thr{50%{transform:scale(1.12);opacity:.5;}}
.bd .cand{animation:cand 1.1s ease-in-out infinite;}
@keyframes cand{50%{opacity:.45;}}
.bd .ripple{fill:none;stroke:#ffd75a;stroke-width:.08;animation:rip .8s ease-out forwards;transform-box:fill-box;transform-origin:center;}
.bd .ripple.bad{stroke:#ff5a3c;}
@keyframes rip{from{transform:scale(.4);opacity:1;}to{transform:scale(2.8);opacity:0;}}
.bd .spark{animation:spk 1s ease-out forwards;transform-box:fill-box;transform-origin:center;}
@keyframes spk{0%{transform:scale(.2);opacity:1;}100%{transform:scale(1.8);opacity:0;}}
.bd .wonmk{animation:wonmk 1.2s ease-in-out 2;}
@keyframes wonmk{50%{filter:brightness(1.5);}}
.bd.shake{animation:shake .4s;}

/* the dock: whose turn and what a move will do, the choices, the buttons */
.dock{display:flex;flex-direction:column;gap:8px;min-height:0;}
.dock .say0{margin:0;font-size:.95rem;font-weight:700;line-height:1.32;min-height:2.64em;}
.dock .say0 .sm{display:block;font-weight:600;font-size:.86em;color:var(--text-3);margin-top:2px;}
.dock .say0 b{color:var(--lit-ink);}
.choice{display:flex;flex-wrap:wrap;gap:8px;}
.choice:empty{display:none;}
.choice .btn{flex:1 1 0;min-width:0;}
.choice .btn small{display:block;font-weight:600;font-size:.74em;opacity:.8;margin-top:1px;}
.choice .btn.on{box-shadow:inset 0 0 0 2px var(--lit);}
.choice .rot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%;}
.choice .rot .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;font-size:.8rem;line-height:1.15;}
.choice .rot .btn svg{width:26px;height:26px;flex:none;}
.choice .rot .btn small{font-size:.68rem;}
.dock>*{flex:none;}
.lastmv{display:none;margin:0;padding:9px 12px;border-radius:14px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);font-size:.84rem;font-weight:600;line-height:1.35;color:var(--text-2);}
.lastmv b{display:block;font-size:.72rem;color:var(--text-3);font-weight:800;margin-bottom:2px;}
.pc-port:not(.pc-short) .lastmv.has,.pc-land:not(.pc-short) .lastmv.has{display:block;}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:auto;}
.acts .btn{flex:1 1 0;min-width:0;max-width:220px;}
.acts .btn .ico{width:18px;height:18px;}
.pc-land .acts,.pc-w1 .acts,.pc-w2 .acts,.pc-t .acts{margin-top:0;justify-content:flex-start;}
.pc-land .acts .btn,.pc-w1 .acts .btn,.pc-w2 .acts .btn,.pc-t .acts .btn{max-width:none;}
.pc-short .dock .say0{font-size:.85rem;min-height:2.5em;}
.pc-short .choice .rot .btn svg{display:none;}
.pc-short.pc-port .say0 .sm{display:none;}
.pc-tiny .acts .btn{font-size:.78rem;padding-left:6px;padding-right:6px;white-space:nowrap;}
.pc-short.pc-port .plates{gap:6px;}
.pc-short .choice .rot .btn{padding:5px 4px;}
.pc-short .choice .rot .btn svg{width:22px;height:22px;}
.think i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:currentColor;animation:th 1s infinite;}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes th{50%{opacity:.2;transform:translateY(-2px);}}

/* at a desk: words a step up, and the room */
.room{display:none;}
.pc-desk .plates{gap:12px;}
.pc-desk .plate{padding:calc(9px * var(--dk,1)) calc(12px * var(--dk,1));border-radius:18px;}
.pc-desk .plate .nm{font-size:calc(1rem * var(--dk,1));}
.pc-desk .plate .sub{font-size:calc(.78rem * var(--dk,1));}
.pc-desk .plate .n b{font-size:calc(1.65rem * var(--dk,1));}
.pc-desk .plate .n small{font-size:calc(.72rem * var(--dk,1));}
.pc-desk .plate .sw{width:calc(34px * var(--dk,1));height:calc(34px * var(--dk,1));}
.pc-desk .plate .cvs i{width:calc(10px * var(--dk,1));height:calc(10px * var(--dk,1));}
.pc-desk .acts .btn,.pc-desk .choice .btn{font-size:calc(.9rem * var(--dk,1));min-height:calc(42px * var(--dk,1));}
.pc-desk .dock .say0{font-size:calc(1.02rem * var(--dk,1));}
/* the room: columns of glass panels, each as tall as what it holds; the moves take what a column has left */
.pc-desk .room{display:flex;gap:var(--lg,12px);align-items:stretch;min-height:0;min-width:0;overflow:hidden;view-transition-name:pc-room;}
.pc-w1 .lcol>.room{flex:1 1 0;}
.room .rcol{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:var(--lg,12px);overflow:hidden;}
.room .pn{flex:none;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line);border-radius:18px;padding:calc(12px * var(--dk,1)) calc(14px * var(--dk,1));display:flex;flex-direction:column;gap:8px;min-height:0;font-size:calc(.92rem * var(--dk,1));}
.room .pn.mv{flex:0 1 auto;}
.room h4{margin:0;font-size:.88em;font-weight:800;color:var(--text-3);}
.room .say{margin:0;font-weight:600;line-height:1.38;}
.room .chart{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;}
.room .chart .ax{display:flex;flex-direction:column;justify-content:space-between;font-size:.74em;font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums;text-align:right;line-height:1;}
.room .chart .ax b{color:rgba(255,215,90,.85);font-weight:800;}
.room .race{display:block;width:100%;height:var(--ch,110px);}
.room .chart .tx{grid-column:2;display:flex;justify-content:space-between;font-size:.74em;font-weight:700;color:var(--text-3);margin-top:3px;}
/* the markers in each borderland, laid out as the board is drawn: a chevron starting there moves that many fields */
.room .bls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;}
.room .bls>div{min-height:2.3em;border-radius:9px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px 8px;padding:3px 4px;}
.room .bls span{display:inline-flex;align-items:center;gap:3px;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:1.05em;}
.room .bls span i{width:.75em;height:.75em;background:var(--pc);clip-path:polygon(50% 0,100% 100%,50% 70%,0 100%);}
.room .bls span.me{color:var(--lit-ink);}
.room .bls em{font-style:normal;color:var(--text-3);font-size:.85em;}
.room .note{margin:0;font-size:.82em;font-weight:600;color:var(--text-3);line-height:1.35;}
.room .rk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;}
.room .rk .pn2{display:flex;align-items:center;gap:7px;font-weight:700;overflow-wrap:anywhere;}
.room .rk .pn2 i{width:.95em;height:.95em;flex:none;background:var(--pc);clip-path:polygon(50% 0,100% 100%,50% 70%,0 100%);}
.room .rk b{font-family:var(--display);font-size:1.3em;font-variant-numeric:tabular-nums;text-align:right;}
.room .rk b small{font-size:.6em;color:var(--text-3);font-weight:700;margin-left:3px;}
.room .rk .lead b{color:var(--lit-ink);}
.room .mvl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-height:0;}
.room .mvl li{display:grid;grid-template-columns:2.2em .9em minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px;border-radius:9px;}
.room .mvl li:first-child{background:color-mix(in srgb,var(--lit) 12%,transparent);}
.room .mvl li .no{color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:700;text-align:right;}
.room .mvl li i{width:.9em;height:.9em;background:var(--pc);clip-path:polygon(50% 0,100% 100%,50% 70%,0 100%);}
.room .mvl li .t{font-weight:600;overflow-wrap:anywhere;}
.room .mvl li .tag{font-size:.8em;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--lit) 20%,transparent);color:var(--lit-ink);}
.room .mvl li .tag.bad{background:rgba(255,122,89,.18);color:#ffb39f;}
.room .mvl li.none{display:block;color:var(--text-3);}
.room .wins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.room .wins li{display:flex;justify-content:space-between;gap:10px;}
.room .wins li span{font-weight:700;overflow-wrap:anywhere;}
.plates{view-transition-name:pc-plates;}
.dock{view-transition-name:pc-dock;}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,.7,.25,1);}
::view-transition-old(root),::view-transition-new(root){animation:none;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), C = window.PacruCore;
  var SAVE = 'pacru_state', KEY = 'pacru', N = 9;
  var CREDIT = 'Pacru was designed by Mike Wellman.';
  // each color: its lacquer, a dark edge, a light edge, its tint on a field, and the meter's fill
  var HEX = [null, '#2c2f37', '#d23a2f', '#e9b322', '#2f9a4f'];
  var DARK = [null, '#0c0d10', '#7c140e', '#8a6200', '#0e5527'];
  var LIGHT = [null, '#8d93a3', '#ff9c8f', '#fff0a0', '#9be8b3'];
  var TINT = [null, 'rgba(30,32,40,.34)', 'rgba(210,58,47,.30)', 'rgba(233,179,34,.36)', 'rgba(47,154,79,.30)'];
  var METER = [null, '#9aa3b8', '#ff6f61', '#f6c94a', '#4cc46f'];
  var CNAME = C.COLORS;
  var NUM = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
  function num(n) { return NUM[n] || String(n); }
  function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many || one + 's'); }

  // ── The computer thinks in a Web Worker (pacru-core.js again), or on the page where a worker can't start ──
  var worker = null, workerOk = true, reqId = 0, pending = null;
  function getWorker() {
    if (worker || !workerOk) return worker;
    try {
      var url = new URL('pacru-core.js', location.href).href;
      var src = 'importScripts(' + JSON.stringify(url) + ');onmessage=function(e){var d=e.data;postMessage({id:d.id,res:self.PacruCore.search(d.st,d.o)});};';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = function (e) { if (pending && e.data.id === pending.id) { var p = pending; pending = null; p.cb(e.data.res); } };
      worker.onerror = function () { workerOk = false; worker = null; if (pending) { var p = pending; pending = null; p.cb(C.search(p.st, p.o)); } };
    } catch (e) { workerOk = false; worker = null; }
    return worker;
  }
  function think(st, o, cb) {
    var id = ++reqId, w = getWorker();
    pending = { id: id, cb: cb, st: st, o: o };
    if (w) w.postMessage({ id: id, st: st, o: o });
    else setTimeout(function () { if (pending && pending.id === id) { pending = null; cb(C.search(st, o)); } }, 30);
  }
  function cancelThink() { pending = null; }
  function coreOf(st) { return { np: st.np, b: st.b, ch: st.ch, turn: st.turn, out: st.out, target: st.target }; }

  // ── State ────────────────────────────────────────────────────────────────
  // S = the core's state (pacru-core.js) and {mode, cover, players: [{name, cpu, level}], hist (undo snapshots),
  //   started, ev: [{s, t (the move in words), tag, bad}] newest last, rot (online: which seat played first)}
  // The move being made: SEL (the chevron picked up), AIM (the field aimed at), PM (the choices made so far: kind,
  // mark, bonus), ROT (a reorientation being paid for: {r, rm})
  var S = null, SEL = -1, AIM = -1, PM = null, ROT = null;
  var LEVEL_NAME = { easy: 'Easy', normal: 'Normal', hard: 'Hard', expert: 'Expert' };
  var NET = null, LEFT = null, WINO = null, NETREC = {}, SHOWN = 0, HOLD = false, LASTP = -1;
  function save() {
    if (NET) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && !S.over) Kit.resume.set(S.n ? 'Move ' + (S.n + 1) : 'Ready');
  }
  function clearSave() { if (NET) return; try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function humans() { return S.players.filter(function (p) { return !p.cpu; }).length; }
  function vsCpu() { return S.players.some(function (p) { return p.cpu; }); }
  function solo() { return !NET && humans() === 1; }
  function isMe(i) { return NET ? NET.seat === i : solo() && !S.players[i].cpu; }
  function nmI(i) { return isMe(i) ? 'You' : S.players[i].name; }
  function nmL(i) { return isMe(i) ? 'you' : S.players[i].name; }
  function possI(i) { return isMe(i) ? 'your' : Kit.poss(S.players[i].name); }
  function colOf(s) { return S.col[s]; }
  // Hints (the setup's option, on unless turned off): what each move would turn, what it would change, chevrons in danger
  // and the markers a turn would best give up. Where a chevron can go is shown either way.
  function hints() { return !S || S.hints !== false; }
  function listAnd(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }

  // the board is turned so that the player this device belongs to sits at the bottom
  var VR = 0;
  function viewSeat() {
    if (!S) return 0;
    if (NET) return NET.seat;
    for (var i = 0; i < S.players.length; i++) if (!S.players[i].cpu) return i;
    return 0;
  }

      '<h3>Moving a chevron</h3><ul><li>On your turn you move one chevron, or turn one round (below). You can’t pass.</li>' +

      '<li><b>A full borderland:</b> if that borderland has no neutral fields at all, you change any field there that no chevron stands on to your color instead.</li>' +
      '<li><b>Connection:</b> a move of two or more fields that starts on your field and ends on your field changes every field in between to your color, other players’ fields too. If it jumps a chevron, nothing in between changes.</li>' +
      '<li>When a connection that changes fields also crosses a border, you choose one: the fields from the connection, or the marker from the border.</li></ul>' +
      '<h3>Pincers</h3><ul><li>A chevron <b>attacks</b> another player’s chevron when it could move onto its field this turn with no chevron in between.</li>' +

      '<h3>Turning a chevron</h3><ul><li>Instead of moving, you can turn one chevron 45 degrees by taking 2 of your markers off the board, or 90 degrees by taking 4. The markers must be on fields no chevron stands on.</li></ul>' +
      '<h3>Out of the game</h3><ul><li>If none of your chevrons can move at the start of your turn, you are out, and your chevrons come off the board. A player whose last chevron is taken is out too. Their markers stay on the board.</li></ul>' +

      '<li>Tap a field to see what the move would do, then tap it again, or Move, to make it. With a mouse, one click moves.</li>' +

      '<li>To turn a chevron, tap it, choose how far, then tap the markers you will take off, or let the game choose them.</li>' +
      '<li>A red pulsing ring round one of your chevrons means two of another player’s chevrons attack it.</li></ul>' +

    var plan = rc === 1 ? [[rk, blp, lm, mv, pst]] : rc === 2 ? [[rk, blp, pst], [lm, mv]] : [[rk], [lm, mv], [blp, pst]];
    plan.forEach(function (col, i) { col.forEach(function (p) { if (p) cols[i].appendChild(p); }); });
    // the chart as tall as its column's width allows
    var cw = cols[0].clientWidth;
    rk.style.setProperty('--ch', Math.round(Math.max(80, Math.min(220 * dk, cw * 0.42))) + 'px');
    var over = function (col) { return col.scrollHeight > col.clientHeight + 1 || list.scrollHeight > list.clientHeight + 1 && col.contains(list); };
    var C0 = null, rm = function (sel) { var x = C0.querySelector(sel); if (x) { x.remove(); return true; } return false; };
    var steps = [
      function () { return C0.contains(list) && list.children.length > 6 && list.removeChild(list.lastChild); },
      function () { var w = C0.querySelector('.pst .wins'); return w && w.children.length > 2 && w.removeChild(w.lastChild); },
      function () { return rm('.pst'); },
      function () { var h = parseFloat(rk.style.getPropertyValue('--ch')); if (h > 80 && C0.contains(rk) && rk.querySelector('.chart')) { rk.style.setProperty('--ch', Math.max(80, h - 30) + 'px'); return true; } return false; },
      function () { return rm('.bl .note'); },
      function () { return rm('.chart'); },
      function () { return rm('.bl'); },
      function () { return C0.contains(list) && list.children.length > 1 && list.removeChild(list.lastChild); },
      function () { return rm('.lm'); },
      function () { return rm('.mv'); },
      function () { return rm('.rkp'); }
    ];
    cols.forEach(function (col) {
      C0 = col;
      for (var i = 0; i < steps.length && over(col);) { if (!steps[i]()) i++; }
    });
    // the moves end on a whole row
    while (list.isConnected && list.children.length > 1 && list.scrollHeight > list.clientHeight + 1) list.removeChild(list.lastChild);
  }
  function sayShort(e) { return sayEv(e, true); }

  // ── Building the page ────────────────────────────────────────────────────
  function render(anim) {
    if (!S || !S.b) return;
    app.innerHTML = ''; app.classList.add('ipl');
    setView();
    var pg = el('div', { class: 'pg' });
    platesEl = el('div', { class: 'plates' });
    frameEl = el('div', { class: 'frame' });
    bdEl = el('div', { class: 'bd', role: 'grid', 'aria-label': 'Pacru board' });
    frameEl.appendChild(bdEl);
    dockEl = el('div', { class: 'dock' });
    turnEl = el('p', { class: 'say0', 'aria-live': 'polite' });
    choiceEl = el('div', { class: 'choice' });
    lastEl = el('p', { class: 'lastmv', 'aria-live': 'off' });
    actsEl = el('div', { class: 'acts' });
    dockEl.appendChild(turnEl); dockEl.appendChild(choiceEl); dockEl.appendChild(lastEl); dockEl.appendChild(actsEl);
    roomEl = el('div', { class: 'room', 'aria-label': 'This game and past games' });
    lcolEl = el('div', { class: 'lcol' });
    pg.appendChild(lcolEl); lcolEl.appendChild(platesEl); lcolEl.appendChild(dockEl); lcolEl.appendChild(roomEl);
    pg.appendChild(frameEl);
    app.appendChild(pg);
    fit(true);
    buildBoard();
    paintMarks(anim); paintChevrons(anim);
    paintAll();
    wireBoard();
    requestAnimationFrame(function () { if (app.classList.contains('ipl')) fit(); });
  }

  // ── Sizes for the shape of the screen ────────────────────────────────────
  function deskWin() {
    if (Kit.inDemo && Kit.inDemo()) return false;
    var W = window.innerWidth, Hh = window.innerHeight;
    return W >= 480 && Hh > 520 && (Math.max(W, Hh) > 1024 || Math.min(W, Hh) > 768);
  }
  function setV(k, v) { app.style.setProperty(k, v); }
  function fit(first) {
    var pg = app.querySelector('.pg'); if (!pg || !app.classList.contains('ipl')) return;
    var W = window.innerWidth, Hh = window.innerHeight, land = W > Hh, desk = deskWin();
    if (window.scrollY) window.scrollTo(0, 0);
    var top = app.getBoundingClientRect().top;
    setV('--avh', Math.max(300, Hh - top) + 'px');
    var cs = getComputedStyle(app), iw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), ih = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    app.classList.remove('pc-port', 'pc-land', 'pc-w1', 'pc-w2', 'pc-t', 'pc-t1', 'pc-desk', 'pc-short', 'pc-tiny');
    var cls = [], fsz, np = S.np;
    // the room lives in the left column, or in a column of its own in the widest windows
    if (roomEl.parentNode !== lcolEl) lcolEl.appendChild(roomEl);
    if (desk) {
      // Two ways to lay out a desk, whichever gives the larger board (Boku's and Abalone's): wide, the board the
      // window's height at the right with a column at the left for the plates, the dock and the room (the room in a
      // column of its own where there is width to spare); tall, the board across the top with the plates and dock under
      // it at the left and the room's panels side by side beside them (under them in a narrow window)
      var dk = Math.max(1, Math.min(1.45, W / 1600, Hh / 1050)), gap = Math.round(28 * dk), gp = Math.round(16 * dk);
      setV('--dk', dk.toFixed(3)); setV('--cg', gap + 'px'); setV('--gp', gp + 'px'); setV('--lg', Math.round(12 * dk) + 'px');
      cls.push('pc-desk');
      var side = Math.round(Math.max(320, Math.min(460, 300 * dk)));
      var bW = Math.floor(Math.min(ih, iw - side - gap));
      // under the board: a row of plates (two to a row with more players), whose turn and a choice, the buttons
      var strip = Math.round((np > 2 ? 375 : 355) * dk);
      // (a window under 900 wide stacks the room under the plates too, so it keeps room for at least the race)
      var bT = Math.floor(Math.min(iw, ih - strip - gp - (iw < 900 ? Math.round(200 * dk) + gp : 0)));
      if (bW >= bT) {
        fsz = bW;
        var lw = iw - fsz - gap;
        if (lw >= 2 * side + gap) {
          // a column of its own for the room
          cls.push('pc-w2');
          var lw1 = Math.round(Math.min(side * 1.2, lw * 0.45)), rw = Math.min(Math.round(side * 1.9), lw - lw1 - gap);
          setV('--lw', lw1 + 'px'); setV('--rw', rw + 'px'); pg.appendChild(roomEl);
          setV('--rc', rw >= 560 * dk ? '2' : '1'); setV('--pcols', np > 2 && Hh < 900 ? '2' : '1');
        } else {
          cls.push('pc-w1'); setV('--lw', lw + 'px');
          setV('--rc', lw >= 520 * dk ? '2' : '1'); setV('--pcols', (lw >= 520 || Hh < 900) && np > 2 ? '2' : '1');
        }
      } else {
        fsz = bT;
        cls.push('pc-t');
        if (iw < 900) {
          // narrow and tall: the plates and dock the window's width under the board, the room under them
          cls.push('pc-t1'); setV('--lw', iw + 'px'); setV('--pcols', '2');
          setV('--rc', iw >= 600 * dk ? '2' : '1');
        } else {
          var lwT = Math.round(Math.min(560 * dk, Math.max(np > 2 ? 400 : 340, iw * 0.36)));
          setV('--lw', lwT + 'px'); setV('--pcols', np > 2 ? '2' : '1');
          setV('--rc', String(Math.max(1, Math.min(3, Math.floor((iw - lwT - gap) / (320 * dk))))));
        }
        pg.appendChild(roomEl);
      }
    } else if (land) {
      cls.push('pc-land');
      var short = Hh < 500; if (short) cls.push('pc-short');
      var gap2 = short ? 12 : 18;
      fsz = Math.floor(ih);
      var lw2 = iw - fsz - gap2;
      if (lw2 < 230) { fsz = Math.floor(iw - 230 - gap2); lw2 = 230; }
      lw2 = Math.min(lw2, 420);
      setV('--lw', lw2 + 'px'); setV('--cg', gap2 + 'px');
      setV('--pcols', np > 2 && (short || lw2 >= 340) ? '2' : '1');
      setV('--lg', short ? '6px' : '10px');
    } else {
      cls.push('pc-port');
      var shortP = Hh < 700; if (shortP) cls.push('pc-short');
      if (shortP && W < 360) cls.push('pc-tiny');
      setV('--pcols', np === 2 ? '2' : W >= 600 || shortP ? String(np) : '2');
      setV('--gp', shortP ? '6px' : '10px');
      fsz = Math.floor(iw);
    }
    cls.forEach(function (k) { app.classList.add(k); });
    setV('--fsz', fsz + 'px');
    if (!desk && !land) {
      // the board as wide as the screen, smaller only as far as the dock needs
      paintPlates();
      var ph = platesEl.offsetHeight, gp = parseFloat(getComputedStyle(app).getPropertyValue('--gp')) || 10;
      var dockMin = W >= 600 ? 196 : Hh < 700 ? 166 : 160;
      var f = Math.min(fsz, Math.floor(ih - ph - 2 * gp - dockMin));
      fsz = Math.max(220, f);
      setV('--fsz', fsz + 'px'); setV('--cw', Math.max(fsz, Math.min(iw, 720)) + 'px');
    }
    // at a desk the board is large enough for its letters and numbers round the edge
    var lab = desk && fsz / 10 >= 70;
    if ((lab ? 0.55 : 0) !== M) { M = lab ? 0.55 : 0; if (svgEl) { buildBoard(); paintMarks(null); paintChevrons(null); } }
    if (!first) paintAll();
  }
  var lastWH = window.innerWidth + 'x' + window.innerHeight, RZT = 0;
  window.addEventListener('resize', function () {
    var wh = window.innerWidth + 'x' + window.innerHeight; if (wh === lastWH) return; lastWH = wh;
    if (!app.classList.contains('ipl')) return;
    if (!app.classList.contains('pc-desk') && !deskWin()) Kit.glide(function () { fit(); }); else fit();
    clearTimeout(RZT); RZT = setTimeout(function () { if (app.classList.contains('ipl')) fit(); }, 650);
  });

  // ── Online ───────────────────────────────────────────────────────────────
  // Two to four people, each on their own device; the seats nobody takes are the computer's, played from whichever
  // device has the table open. Each new game at the table moves the seats round one.
  function netOpts() {
    var o = { seats: 2, level: 'normal', hints: 'on' };
    try { var g = JSON.parse(localStorage.getItem('gn_setup_' + KEY)) || {}, op = g.options || {}; if (+g.count >= 2 && +g.count <= 4) o.seats = +g.count; if (LEVEL_NAME[op.level]) o.level = op.level; if (op.hints === 'off') o.hints = 'off'; } catch (e) {}
    return o;
  }
  function netStart(players, opts, last) {
    var ps = players.map(function (p) { return { name: p.name, cpu: !!p.bot, level: (opts && opts.level) || 'normal' }; });
    var rot = last && last.rot != null ? (last.rot + 1) % ps.length : 0;
    // the seats move round one each game: the players' list is turned so a different person moves first
    var order = ps.map(function (p, i) { return (i + rot) % ps.length; });
    var st = C.newGame(ps.length);
    st.mode = 'online'; st.hints = !(opts && opts.hints === 'off'); st.players = order.map(function (i) { return ps[i]; }); st.seatOf = order; st.rot = rot;
    freshFields(st); delete st.hist; delete st.busy;
    st.wins = last && last.wins ? last.wins.slice() : ps.map(function () { return 0; });
    return st;
  }
  // (TurnNet's seats are the table's; the game's seats are turned by rot: game seat g is table seat seatOf[g])
  function tSeat(st, g) { return st.seatOf ? st.seatOf[g] : g; }
  function gSeat(st, t) { return st.seatOf ? st.seatOf.indexOf(t) : t; }
  function netApply(st, str) {
    if (st.over) return null;
    var res = C.play(st, str);
    if (!res) return null;
    note(st, res);
    if (st.over) st.wins[tSeat(st, st.win)] = (st.wins[tSeat(st, st.win)] || 0) + 1;
    return { state: st, mv: { m: str } };
  }
  function netBot(st, seat) {
    var g = gSeat(st, seat), p = st.players[g], L = Object.assign({}, C.LEVELS[p.level] || C.LEVELS.normal, { seed: Math.floor(Math.random() * 1e9) });
    return new Promise(function (res) { think(coreOf(st), L, function (r) { res(r && r.move ? netApply(st, r.move) : null); }); });
  }
  function netMove(str) { if (!S || S.over || LEFT || !NET.myTurn()) return; S.busy = true; paintActs(); NET.act(function (st) { return netApply(st, str); }); setTimeout(function () { if (S) S.busy = false; }, 4000); }
  function netAgain() { if (!NET) return; if (LEFT) { TurnNet.leave(); TurnNet.open(); } else NET.again(); }
  function netShow(net, info) {
    var my = { seat: gSeat(net.state, net.seat) };
    NET = { seat: my.seat, code: net.code, myTurn: function () { return net.myTurn(); }, act: function (f) { return net.act(f); }, again: function () { return net.again(); } };
    cancelThink();
    if (WINO && (info.again || info.fresh)) { WINO.close(); WINO = null; }
    var prev = S;
    S = JSON.parse(JSON.stringify(net.state)); S.busy = false; S.hist = []; SEL = -1; AIM = -1; PM = null; ROT = null;
    LEFT = net.status === 'over' && !S.over && net.result && net.result.left != null ? net.result : null;
    var tok = ++SHOWN, mv = info.mv && info.mv.m && !info.fresh && !info.again ? info.mv : null;
    if (mv && prev && prev.b && prev.n === S.n - 1) {
      // play the move out from the state before it, with the animations
      var pst = JSON.parse(JSON.stringify(prev)), res = C.play(pst, mv.m);
      if (res) show(res, { b: prev.b.slice(), ch: prev.ch.slice() }, true); else render(null);
      if (!S.over && !info.mine && net.myTurn()) setTimeout(function () { if (tok === SHOWN) Kit.haptic('light'); }, 600);
    } else {
      render(null);
      if (S.over || LEFT) setTimeout(function () { if (tok === SHOWN) netEnd(); }, 150);
    }
    if (info.again) { Kit.sfx('deal'); Kit.callout(isMe(0) ? 'You start' : S.players[0].name + ' starts'); }
  }
  function netEnd() {
    if (!NET || !S) return;
    var left = LEFT, key = NET.code + ':' + S.started;
    var done = NETREC[key]; try { done = done || (JSON.parse(localStorage.getItem('pacru_net_rec')) || []).indexOf(key) >= 0; } catch (e) {}
    if (!done && !left) {
      NETREC[key] = 1;
      try { var rl = JSON.parse(localStorage.getItem('pacru_net_rec')) || []; rl.push(key); localStorage.setItem('pacru_net_rec', JSON.stringify(rl.slice(-30))); } catch (e) {}
      var hl = highlights(); hl.push('Played online at table ' + NET.code);
      Kit.record(KEY, { started: S.started, mode: 'Online', players: recPlayers(), winner: S.players[S.win].name, highlights: hl, detail: detail() });
    }
    if (WINO) WINO.close();
    if (left) return netWin();
    endShow(winWave(), true);
  }
  function netWin() {
    if (!NET) return;
    var me = NET.seat, left = LEFT;
    WINO = Kit.win({
      icon: left ? 'users' : S.win === me ? 'trophy' : 'users',
      title: left ? left.text : S.win === me ? 'You win!' : S.players[S.win].name + ' wins',
      sub: left ? '' : endLine(),
      rank: left ? null : rankRows(),
      notes: left ? null : [S.players.map(function (p, i) { return p.name + ' ' + (S.wins[tSeat(S, i)] || 0); }).join(', ')], notesTitle: 'Games won at this table',
      lose: !left && S.win !== me, againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { WINO = null; netAgain(); },
      look: { label: 'Look at the board', onClick: function () { WINO = null; } }
    });
  }
  function netLeave() {
    NET = null; LEFT = null; SHOWN++; if (WINO) { WINO.close(); WINO = null; }
    var sv = null; try { sv = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    if (sv && sv.b && sv.players && !sv.over) { S = sv; S.busy = false; S.hist = S.hist || []; render(); afterTurn(); }
    else showSetup();
  }

  // ── Test and demo hooks ──────────────────────────────────────────────────
  window.__pacru = {
    C: C, state: function () { return S; }, sel: function () { return { f: SEL, t: AIM, pm: PM, rot: ROT }; },
    // a fresh game for these players: {mode: 'pp' | 'cpu', players: [{name, cpu, level}]}
    start: function (cfg) { cancelThink(); newGame({ mode: cfg.mode || 'pp', cover: false, hints: cfg.hints !== false, players: cfg.players }); },
    // a position: {rows: 9 strings from the top (rank 9), '.' neutral or 'a' to 'd' a seat's marker, chev: {field:
    // 'seat,direction'} with directions N, NE, E, SE, S, SW, W, NW, turn}
    set: function (pos) {
      cancelThink();
      var D8 = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      var st = C.newGame(S.np);
      ['mode', 'cover', 'hints', 'players', 'started'].forEach(function (k) { st[k] = S[k]; });
      freshFields(st);
      if (pos.rows) for (var x = 0; x < 81; x++) { var ch = pos.rows[Math.floor(x / 9)].charAt(x % 9); st.b[x] = ch === '.' ? 0 : ch.charCodeAt(0) - 96; }
      if (pos.chev) { st.ch = st.ch.map(function () { return -1; }); Object.keys(pos.chev).forEach(function (n) { var q = pos.chev[n].split(','); st.ch[C.idx(n)] = +q[0] * 8 + D8.indexOf(q[1]); }); }
      if (pos.turn != null) st.turn = pos.turn;
      st.race = [st.players.map(function (p, i) { return C.markers(st, i); })];
      S = st; SEL = -1; AIM = -1; PM = null; ROT = null; save(); render(); afterTurn();
    },
    play: function (m) { if (NET) return netMove(m); return play(m); },
    tap: function (n) { tap(typeof n === 'string' ? C.idx(n) : n); },
    // the element for a field (its tap zone) and for a chevron, by field name
    sq: function (n) { return bdEl ? bdEl.querySelector('.hz[data-x="' + (typeof n === 'string' ? C.idx(n) : n) + '"]') : null; },
    chev: function (n) { return bdEl ? bdEl.querySelector('.cv[data-x="' + (typeof n === 'string' ? C.idx(n) : n) + '"]') : null; },
    fit: function () { fit(); }
  };

  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.b && saved.players && !saved.over) { S = saved; S.busy = false; S.hist = S.hist || []; S.ev = S.ev || []; render(); afterTurn(); }
  else showSetup();

  TurnNet.setup({
    game: KEY, title: 'Pacru', min: 2, max: 4, botMs: 600,
    seats: function (n, o) { return Math.max(n, Math.min(4, o && +o.seats || n)); },
    opts: netOpts, start: netStart, bot: netBot,
    turn: function (st) { return st.over ? [] : [tSeat(st, st.turn)]; },
    over: function (st) {
      if (!st.over) return null;
      return { win: [tSeat(st, st.win)], text: st.players[st.win].name + ' wins' };
    },
    show: netShow, leave: netLeave
  });
})();
</script>

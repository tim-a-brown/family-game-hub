<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Scramble</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../data/wordle-words.js"></script>
<style>
.sc{max-width:560px;margin:0 auto;padding:0 12px calc(var(--safe-b) + 18px);}
.sc .scores{margin-bottom:2px;}
.hud{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 8px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.07);
  font-weight:800;font-size:.9rem;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.pill .ico{width:16px;height:16px;color:var(--text-3);}
.pill b{color:var(--text);font-weight:900;}
.pill.hot{background:color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange);}
.pill.hot .ico{color:var(--orange);}
/* Sand-timer bar */
.clock{position:relative;height:12px;border-radius:999px;background:rgba(0,0,0,.35);box-shadow:inset 0 1px 3px rgba(0,0,0,.6);overflow:hidden;margin:0 6px 10px;}
.clock i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(180deg,#ffe08a,#e7a93a);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:width .25s linear;}
.clock.low i{background:linear-gradient(180deg,#ff8a8a,#e0353f);animation:blink .5s infinite alternate;}
@keyframes blink{to{opacity:.6;}}
/* The table */
.table{border-radius:22px;padding:10px;}
.felt{position:relative;border-radius:14px;padding:14px 10px 0;overflow:hidden;min-height:300px;display:flex;flex-direction:column;}
.clue{align-self:center;max-width:100%;min-height:36px;margin:0 6px 12px;padding:6px 14px;border-radius:3px;font-family:var(--hand);font-size:1.15rem;line-height:1.2;text-align:center;
  color:#3a3a50;background:linear-gradient(180deg,#fffaf0,#f3ead3);box-shadow:0 6px 12px rgba(0,0,0,.35);transform:rotate(-1deg);}
.clue.dim{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);box-shadow:none;transform:none;font-size:1.05rem;}
.row{--n:7;--g:clamp(3px,calc(40px / var(--n)),6px);--t:min(48px,calc((min(100vw,560px) - 66px - (var(--n) - 1) * var(--g)) / var(--n)));
  display:flex;justify-content:center;gap:var(--g);}
.slots{margin:4px 0 6px;}
.slot{position:relative;width:var(--t);height:var(--t);border-radius:7px;background:rgba(0,0,0,.22);box-shadow:inset 0 2px 5px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.08);flex:none;}
.slot.lock::after{content:"";position:absolute;left:50%;bottom:-7px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#ffd76a;}
.slots.bad{animation:shake .4s;}
.rackwrap{margin-top:auto;padding:16px 0 0;}
.rack{position:relative;padding:0 6px 14px;}
.rack::after{content:"";position:absolute;left:-10px;right:-10px;bottom:0;height:22px;border-radius:6px 6px 0 0;z-index:0;
  background:repeating-linear-gradient(92deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),linear-gradient(180deg,#b07a42,#7d4f24);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25), 0 -2px 6px rgba(0,0,0,.3);}
.rack .row{position:relative;z-index:1;}
.rspot{width:var(--t);height:var(--t);flex:none;position:relative;}
/* Wooden letter tiles */
.tile{position:absolute;inset:0;display:grid;place-items:center;border:0;padding:0;border-radius:6px;cursor:grab;touch-action:none;
  font-family:var(--font);font-weight:900;font-size:calc(var(--t) * .56);color:#2b2118;line-height:1;
  background:
    repeating-linear-gradient(100deg,rgba(120,70,20,.05) 0 2px,transparent 2px 7px),
    linear-gradient(160deg,#f7e2b8 0%,#ecc98f 55%,#ddb070 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(120,70,20,.35), 0 3px 0 #9a6a35, 0 5px 8px rgba(0,0,0,.35);
  transition:box-shadow .15s, background .3s, color .3s;}
.tile sub{position:absolute;right:9%;bottom:7%;font-size:calc(var(--t) * .22);font-weight:800;line-height:1;}
.tile:active{cursor:grabbing;}
.tile.lock{background:linear-gradient(160deg,#ffe9a8,#f2c64e);}
.tile.good{background:linear-gradient(160deg,#c8f7cf,#69d683);color:#0b3a17;box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 3px 0 #2f8f4a, 0 0 18px rgba(61,220,132,.6);}
.tile.wrong{background:linear-gradient(160deg,#ffd0d0,#f08a8a);}
.tile.reveal{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;}
.tile.dance{animation:dance .55s var(--spring) both;}
@keyframes dance{35%{transform:translateY(-16px) rotate(-4deg);}70%{transform:translateY(3px);}100%{transform:none;}}
.tile.drag{position:fixed;inset:auto;z-index:300;width:var(--t);height:var(--t);transform:scale(1.18) rotate(-4deg);box-shadow:0 14px 22px rgba(0,0,0,.45);transition:none;pointer-events:none;}
.slot.over{box-shadow:inset 0 0 0 3px #ffd76a, inset 0 2px 5px rgba(0,0,0,.45);}
.float{position:absolute;left:50%;top:38%;transform:translate(-50%,0);font-family:var(--display);font-size:2rem;color:#ffd76a;text-shadow:0 3px 0 rgba(0,0,0,.4);pointer-events:none;animation:floatup 1s ease-out forwards;z-index:5;}
@keyframes floatup{from{opacity:0;transform:translate(-50%,10px) scale(.6);}25%{opacity:1;transform:translate(-50%,0) scale(1.1);}to{opacity:0;transform:translate(-50%,-50px);}}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
.tools .btn{padding:0 4px;flex-direction:column;gap:2px;min-height:58px;font-size:.82rem;}
.tools .btn .ico{width:20px;height:20px;}
/* Overlays on the felt (ready, paused, turn summary) */
.cover{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;
  background:radial-gradient(120% 90% at 50% 35%,var(--felt-a),var(--felt-c));}
.cover h2{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.05;}
.cover p{color:rgba(255,255,255,.8);max-width:300px;}
.cover .big{font-family:var(--display);font-size:3.2rem;color:#ffd76a;line-height:1;}
.cover .btn{min-width:200px;margin-top:6px;}
.cats{display:flex;flex-wrap:wrap;gap:6px;}
.cats .chip.on{background:var(--accent);color:var(--accent-ink);}
</style>
</head>
<body>
<main class="sc" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var KEY = 'wordscramble', SAVE = 'wordscramble_state', CAT_KEY = 'wordscramble_cat';

  // word=clue; groups by length: 4-5 easy, 6-7 medium, 8+ hard
  var RAW = {
    Animals: 'BEAR=Big furry animal that loves honey;WOLF=Wild dog that howls at the moon;FROG=Green hopper that says ribbit;DUCK=Bird that quacks;GOAT=Farm animal with a little beard;LION=King of the jungle;TIGER=Big orange cat with black stripes;ZEBRA=Striped horse of Africa;MOOSE=Huge deer with flat antlers;SHARK=Ocean hunter with lots of teeth;HORSE=You can ride it and it neighs;SNAKE=Long reptile with no legs;KOALA=Australian tree-hugger;CAMEL=Desert animal with humps;PANDA=Black and white bear that eats bamboo;OTTER=Playful swimmer that floats on its back;' +
      'MONKEY=Swings through trees and loves bananas;RABBIT=Long ears and a fluffy tail;TURTLE=Carries its house on its back;PARROT=Colourful bird that can talk;DONKEY=Says hee-haw;GIRAFFE=Tallest animal on Earth;PENGUIN=Bird in a tuxedo that cannot fly;DOLPHIN=Smart ocean mammal that clicks;CHEETAH=Fastest land animal;GORILLA=Biggest of the great apes;LEOPARD=Spotted cat that climbs trees;WALRUS=Has long tusks and whiskers;OSTRICH=Biggest bird in the world;HAMSTER=Small pet that runs on a wheel;LOBSTER=Sea creature with big claws;' +
      'ELEPHANT=Largest land animal, with a trunk;FLAMINGO=Pink bird that stands on one leg;HEDGEHOG=Prickly little animal that rolls into a ball;KANGAROO=Hops around with a baby in its pouch;CROCODILE=Big reptile with a toothy grin;PORCUPINE=Covered in sharp quills;ARMADILLO=Wears a suit of armour;CHAMELEON=Lizard that changes colour;SQUIRREL=Bushy-tailed nut collector;TARANTULA=Big hairy spider;ALLIGATOR=Lives in swamps and has a wide snout;BUTTERFLY=Was once a caterpillar',
    Food: 'CAKE=Birthday treat with candles;SOUP=Hot meal you eat with a spoon;RICE=Tiny white grains;CORN=Yellow kernels on a cob;PEAR=Fruit shaped like a light bulb;LIME=Small green sour fruit;TACO=Folded shell with fillings;PIZZA=Round, cheesy and cut into slices;BREAD=You make toast from it;APPLE=Keeps the doctor away;LEMON=Sour yellow fruit;HONEY=Sweet stuff made by bees;BAGEL=Bread with a hole in it;GRAPE=Grows in bunches on a vine;MANGO=Sweet orange tropical fruit;' +
      'CHEESE=Mice love it;BANANA=Yellow fruit you peel;CARROT=Orange vegetable rabbits love;BUTTER=Spread it on toast;COOKIE=Sweet treat with chocolate chips;MUFFIN=Small cake baked in a cup;WAFFLE=Breakfast with little squares;POPCORN=Movie snack that pops;PANCAKE=Flat breakfast stacked with syrup;NOODLES=Long and slurpy;PRETZEL=Twisted salty snack;CUPCAKE=Little cake with frosting;SANDWICH=Filling between two slices of bread;SPAGHETTI=Long pasta with meatballs;' +
      'AVOCADO=Green fruit for guacamole;BROCCOLI=Green vegetable like a tiny tree;PINEAPPLE=Spiky tropical fruit;CHOCOLATE=Sweet treat made from cocoa;MEATBALL=Round and goes with spaghetti;HAMBURGER=Patty in a bun;BLUEBERRY=Small round blue fruit;STRAWBERRY=Red berry with seeds on the outside;WATERMELON=Big green fruit, red inside;CUCUMBER=Long green salad vegetable',
    Home: 'SOFA=Comfy seat for the whole family;LAMP=Turns on to light the room;DOOR=Open it to come inside;SINK=Where you wash your hands;OVEN=Bakes cakes and cookies;BATH=Fill it with bubbles;RUG=Soft mat on the floor;BROOM=Sweeps the floor;TABLE=Where you eat dinner;CHAIR=You sit on it;CLOCK=Tells the time;TOWEL=Dries you off;SPOON=Eat cereal with it;PLATE=Put your food on it;SHELF=Holds books;' +
      'PILLOW=Rest your head on it at night;MIRROR=Shows your reflection;WINDOW=Glass you look through;CARPET=Covers the whole floor;FRIDGE=Keeps food cold;BLANKET=Keeps you warm in bed;BATHTUB=Fill it with water and soak;TEAPOT=Pours hot drinks;KITCHEN=Room where food is made;BEDROOM=Where you sleep;CURTAIN=Closes over the window;TOASTER=Makes bread crispy;HAMMOCK=Swinging bed for the garden;' +
      'CUPBOARD=Where dishes are kept;STAIRCASE=Go up and down between floors;BOOKCASE=Furniture full of books;DOORBELL=Ding-dong, someone is here;FIREPLACE=Cozy spot with a fire;CALENDAR=Shows the days and months;BACKPACK=Bag you carry to school;TOOTHBRUSH=Use it twice a day;DISHWASHER=Machine that cleans plates;UMBRELLA=Keeps you dry in the rain;FLASHLIGHT=Light you carry in the dark',
    Sports: 'GOLF=Hit a small ball into a hole;SWIM=Move through water;DIVE=Jump into the pool head first;SKATE=Glide on ice or wheels;SKI=Slide down a snowy hill;RUGBY=Rough game with an oval ball;KICK=Hit the ball with your foot;GOAL=Score in soccer by getting one;BOXING=Fight with padded gloves;TENNIS=Hit a ball over a net with rackets;HOCKEY=Played with sticks and a puck;SOCCER=Kick the ball into the net;KARATE=Martial art with chops and kicks;SURF=Ride the waves;BALL=Round thing you throw or kick;' +
      'ARCHERY=Shoot arrows at a target;CYCLING=Racing on a bike;BOWLING=Knock down all ten pins;FENCING=Sword fighting sport;SPRINT=A short fast run;SKIING=Gliding down snowy slopes;SAILING=Using the wind to move a boat;REFEREE=Blows the whistle;TROPHY=Prize for the winner;PADDLE=Rows a canoe;STADIUM=Huge place to watch a game;JAVELIN=Throw this spear far;' +
      'BASEBALL=Hit a home run;FOOTBALL=Touchdown sport;SOFTBALL=Like baseball with a bigger ball;VOLLEYBALL=Bump, set and spike over a net;BASKETBALL=Shoot hoops;GYMNASTICS=Flips, cartwheels and balance beams;MARATHON=A very, very long run;TRAMPOLINE=Bounce up high;SKATEBOARD=Board with four wheels;BADMINTON=Hit a shuttlecock over a net;LACROSSE=Sport with a netted stick',
    Nature: 'TREE=Tall plant with a trunk;LEAF=Turns colours in autumn;RAIN=Water falling from clouds;SNOW=White flakes in winter;WIND=Air that blows;MOSS=Soft green plant on rocks;POND=Small lake for ducks;CLOUD=Fluffy white thing in the sky;STORM=Thunder and lightning;RIVER=Water flowing to the sea;BEACH=Sandy place by the sea;OCEAN=Huge salty water;STONE=A small rock;PETAL=Part of a flower;ACORN=Seed of an oak tree;' +
      'FOREST=Lots of trees together;FLOWER=Blooms in spring;GARDEN=Where you grow plants;MEADOW=Field of grass and flowers;SUNSET=When the sun goes down;THUNDER=Loud boom in a storm;RAINBOW=Colours in the sky after rain;VOLCANO=Mountain that erupts;BLOSSOM=Flowers on a fruit tree;PEBBLE=Small smooth stone;CANYON=Deep valley with steep sides;' +
      'MOUNTAIN=Very tall land;WATERFALL=Water dropping off a cliff;SUNFLOWER=Tall yellow flower that follows the sun;LIGHTNING=Flash in a storm;SNOWFLAKE=No two are alike;DANDELION=Blow its fluffy seeds;HURRICANE=Huge spinning storm;EARTHQUAKE=When the ground shakes;CATERPILLAR=Turns into a butterfly;TORNADO=Twisting funnel of wind',
    Science: 'ATOM=Tiny building block of everything;CELL=Smallest unit of life;GENE=Passes traits from parents;MASS=How much matter something has;HEAT=Energy that makes things warm;ACID=Sour chemical like lemon juice;ORBIT=Path around a planet or star;FORCE=A push or a pull;SOLID=Not a liquid or a gas;LASER=Very bright beam of light;SPACE=Out beyond the sky;PLANT=Makes food from sunlight;' +
      'GRAVITY=Force that pulls things down;ELECTRON=Negative particle in an atom;NUCLEUS=Centre of an atom or cell;PROTEIN=Muscles need it;ECLIPSE=When the moon blocks the sun;ELEMENT=Found on the periodic table;PHOTON=A particle of light;PROTON=Positive particle in an atom;NEUTRON=Particle with no charge;ENZYME=Helps break down food;MAGNET=Sticks to the fridge;ENERGY=Power to do work;FOSSIL=Ancient remains in rock;OXYGEN=Gas we breathe;' +
      'MOLECULE=Atoms joined together;TELESCOPE=Look at stars with it;MICROSCOPE=Makes tiny things look big;SKELETON=All the bones in your body;THERMOMETER=Measures temperature;EXPERIMENT=A scientific test;HYPOTHESIS=An educated guess;DINOSAUR=Ancient reptile;ASTRONAUT=Travels to space;BATTERY=Stores electric power',
    Geography: 'LAKE=Water with land all around;HILL=Smaller than a mountain;CAVE=Hollow in a rock;ISLE=A small island;COAST=Where land meets sea;DELTA=Where a river fans out;FJORD=Narrow sea inlet between cliffs;CAPE=Point of land in the sea;GULF=Big bay;OASIS=Water spring in the desert;MAP=Shows where places are;GLOBE=Round map of Earth;NORTH=Where a compass points;' +
      'DESERT=Hot, dry and sandy;ISLAND=Land surrounded by water;VALLEY=Low land between hills;GLACIER=Slow river of ice;JUNGLE=Thick hot rainforest;PLATEAU=Flat high land;EQUATOR=Line around Earth\'s middle;SAVANNA=Grassland with scattered trees;TUNDRA=Frozen treeless plain;COUNTRY=A nation;HARBOUR=Safe place for boats;' +
      'CONTINENT=Asia, Africa or Europe for example;PENINSULA=Land with water on three sides;ARCHIPELAGO=A group of islands;HEMISPHERE=Half of the Earth;LONGITUDE=Lines running north to south;LATITUDE=Lines running east to west;MOUNTAIN=Very tall land;COMPASS=Points north;VOLCANO=Can erupt with lava;CAPITAL=Main city of a country;RAINFOREST=Hot wet forest full of life;COASTLINE=Edge of the land along the sea;MERIDIAN=A line of longitude',
    Everyday: 'BOOK=You read it;GAME=Something you play;KITE=Flies on a string;SHOE=Goes on your foot;BELL=Rings ding-dong;DRUM=Bang it to make a beat;MUSIC=Songs and tunes;PAINT=Colours on a brush;TRAIN=Runs on tracks;CLOWN=Funny circus performer;ROBOT=Machine that can move by itself;MAGIC=Tricks and wands;PIANO=Instrument with black and white keys;' +
      'GUITAR=Instrument with six strings;COMPASS=Points the way;PYRAMID=Ancient Egyptian building;LANTERN=Light in a case;CAPTAIN=Leader of a ship or team;JOURNEY=A long trip;MYSTERY=Something unexplained;DIAMOND=Hardest natural gem;BALLOON=Fill it with air;PUZZLE=Fit the pieces together;CASTLE=Home for a king and queen;PIRATE=Sails the seas looking for treasure;ROCKET=Blasts off to space;' +
      'TREASURE=Pirates search for it;BIRTHDAY=Day with cake and candles;DINOSAUR=Ancient giant reptile;HOLIDAY=Time off from school;SCISSORS=Cut paper with them;PENGUIN=Tuxedo bird;CHAMPION=The winner;ADVENTURE=An exciting journey;FIREWORKS=Bangs and sparkles in the sky;PLAYGROUND=Swings and slides;SUPERHERO=Saves the day'
  };
  var WORDS = {}, ALL = {};
  Object.keys(RAW).forEach(function (cat) {
    var seen = {};
    WORDS[cat] = RAW[cat].split(';').map(function (x) { var p = x.split('='); return { w: p[0].trim(), clue: p[1] }; })
      .filter(function (o) { if (seen[o.w] || !/^[A-Z]{3,11}$/.test(o.w)) return false; seen[o.w] = 1; ALL[o.w] = 1; return true; });
  });
  var CATS = Object.keys(WORDS), CAT_NAME = { Home: 'Around the house' };
  var VALID5 = {}; try { WORDLE_ANSWERS.concat(WORDLE_EXTRA).forEach(function (w) { VALID5[w] = 1; }); } catch (e) {}
  var DIFF = { easy: [3, 5, 'Easy'], medium: [6, 7, 'Medium'], hard: [8, 11, 'Hard'] };
  var VAL = { A: 1, B: 3, C: 3, D: 2, E: 1, F: 4, G: 2, H: 4, I: 1, J: 8, K: 5, L: 1, M: 3, N: 1, O: 1, P: 3, Q: 10, R: 1, S: 1, T: 1, U: 1, V: 4, W: 4, X: 8, Y: 4, Z: 10 };
  var TIMES = { 60: '60 sec', 90: '90 sec', 120: '2 min', 0: 'Relaxed' };
  var RELAXED_WORDS = 10;

  Kit.init({
    id: 'wordscramble',
    theme: { felt: ['#167a72', '#0d524d', '#083b37'] },
    onNew: function () { showSetup(); },
    undo: function () { undoTile(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Word Scramble: past games' }); } }],
    rules:
      '<p class="goal">Unscramble the letter tiles to make the hidden word. Solve as many as you can before the sand runs out.</p>' +
      '<h3>Playing</h3><ul><li><b>Tap</b> a tile to put it in the next empty square, or <b>drag</b> it to any square.</li>' +
      '<li>Tap a placed tile (or drag it back to the rack) to take it out.</li>' +
      '<li>When every square is full the word is checked. Any real word that uses all the letters counts.</li>' +
      '<li><b>Shuffle</b> mixes up the rack to help you see the word.</li></ul>' +
      '<h3>Scoring</h3><ul><li>A word scores the <b>Scrabble value</b> of its tiles (the small number on each tile).</li>' +
      '<li><b>Letter</b> puts one correct tile in place. That tile scores nothing.</li>' +
      '<li><b>Clue</b> shows a hint. It halves the word\'s score.</li>' +
      '<li>Solve 3 or more in a row for a <b>+5 streak bonus</b> on each word. Skipping ends your streak.</li></ul>' +
      '<h3>Ways to play</h3><ul><li><b>Solo</b>: beat your best score.</li>' +
      '<li><b>Pass and play</b>: 2 to 4 players take turns with the same clock. Highest total after all rounds wins.</li>' +
      '<li><b>Relaxed</b> has no clock: ' + RELAXED_WORDS + ' words per turn.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  // S = {mode, cat, diff, time, rounds, players:[{name}], scores:[], roundScores:[[..]], turn, phase:'ready'|'play'|'turnover',
  //      deck:[idx], R: current word {w, clue, letters, slots, rack, locked, clueUsed}, left(ms), words:[...] per turn log, log:[]}
  var S = null, undoStack = [];
  function save() {
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'over') Kit.resume.set(catName(S.cat) + ' · ' + (S.mode === 'race' ? curP().name + "'s turn" : S.T.score + ' points'));
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }
  function catName(c) { return CAT_NAME[c] || c; }
  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function curP() { return S.players[S.turn % S.players.length]; }
  function curRound() { return Math.floor(S.turn / S.players.length); }
  function totalTurns() { return S.players.length * S.rounds; }

  // ── Setup ─────────────────────────────────────────────────────────────────
  function showSetup() {
    stopClock(); S = null; clearSave();
    var chosen = null; try { chosen = localStorage.getItem(CAT_KEY); } catch (e) {}
    if (chosen !== 'Surprise' && !WORDS[chosen]) chosen = 'Animals';
    var st = Kit.setup(app, {
      modes: [
        { id: 'solo', icon: 'user', title: 'Solo', desc: 'Beat the clock and your best score' },
        { id: 'race', icon: 'users', title: 'Pass and play', desc: '2 to 4 players race the same clock in turns' }
      ],
      options: [
        { id: 'diff', label: 'Word length', value: 'medium', choices: [['easy', 'Easy 4–5'], ['medium', 'Medium 6–7'], ['hard', 'Hard 8+']] },
        { id: 'time', label: 'Clock', value: 90, choices: [[60, '60 sec'], [90, '90 sec'], [120, '2 min'], [0, 'Relaxed']] },
        { id: 'rounds', label: 'Rounds', value: 1, choices: [[1, '1 round'], [2, '2 rounds'], [3, '3 rounds']], when: function (m) { return m === 'race'; } }
      ],
      players: { min: 1, max: 4, range: function (m) { return m === 'race' ? [2, 4] : [1, 1]; } },
      onStart: function (cfg) {
        var cat = chosen === 'Surprise' ? null : chosen;
        start(cfg, cat);
      }
    });
    var box = el('div', { class: 'cats' });
    function paint() {
      box.innerHTML = '';
      CATS.concat(['Surprise']).forEach(function (c) {
        box.appendChild(el('button', { type: 'button', class: 'chip' + (c === chosen ? ' on' : ''), html: c === 'Surprise' ? Kit.icon('shuffle') + '<span>Mix them all</span>' : Kit.esc(catName(c)),
          onclick: function () { chosen = c; try { localStorage.setItem(CAT_KEY, c); } catch (e) {} Kit.sfx('tap'); paint(); } }));
      });
    }
    paint();
    st.el.insertBefore(el('div', null, [el('div', { class: 'label', text: 'Words about' }), box]), st.el.querySelector('.btn-lg'));
  }

    c.appendChild(el('p', { text: last.solved + (last.solved === 1 ? ' word' : ' words') + (last.best >= 3 ? ' · best streak ' + last.best : '') }));
    c.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-lg', text: 'Next: ' + curP().name, onclick: function () { newTurn(); } }));
    feltEl.appendChild(c);
  }
  function coverOver() {
    var c = el('div', { class: 'cover' });
    c.appendChild(el('h2', { text: 'Game over' }));
    c.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-lg', text: 'Play again', onclick: again }));
    c.appendChild(el('button', { type: 'button', class: 'btn btn-soft', text: 'Change settings', onclick: showSetup }));
    feltEl.appendChild(c);
  }
  function coverPaused() {
    var c = el('div', { class: 'cover' });
    c.appendChild(el('h2', { text: 'Paused' }));
    c.appendChild(el('p', { text: 'The clock stopped. The letters are hidden so nobody peeks.' }));
    c.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-lg', text: 'Keep going', onclick: resume }));
    feltEl.appendChild(c);
  }
  function bestBefore() {
    var best = null;
    try { GameHistory.load(KEY).forEach(function (e) { if (e.solo && e.time === S.time && e.diff === S.diff && (best == null || e.top > best)) best = e.top; }); } catch (x) {}
    return best;
  }
  function finish() {
    var hl = [], P = S.players, solo = S.mode === 'solo';
    var all = []; S.log.forEach(function (L) { L.words.forEach(function (w) { if (!w.skipped) all.push({ p: L.p, w: w }); }); });
    var order = P.map(function (p, i) { return i; }).sort(function (a, b) { return S.scores[b] - S.scores[a]; });
    var top = S.scores[order[0]], tie = P.length > 1 && S.scores[order[1]] === top;
    var best = solo ? bestBefore() : null;
    if (solo) {
      var L0 = S.log[0];
      hl.push(P[0].name + ' unscrambled ' + L0.solved + (L0.solved === 1 ? ' word' : ' words') + ' for ' + top + ' points' + (S.time ? ' in ' + TIMES[S.time] : ''));
      if (best != null && top > best) hl.push('New best score! Beat ' + best);
    } else {
      if (tie) hl.push('A tie at ' + top + ' points!');
      else hl.push(P[order[0]].name + ' won by ' + (top - S.scores[order[1]]) + ' points');
    }
    var bw = all.slice().sort(function (a, b) { return b.w.pts - a.w.pts; })[0];
    if (bw) hl.push('Best word: ' + bw.w.mix + ' became ' + (bw.w.as || bw.w.w) + ' for ' + bw.w.pts + (solo ? '' : ' (' + P[bw.p].name + ')'));
    var streak = S.log.slice().sort(function (a, b) { return b.best - a.best; })[0];
    if (streak && streak.best >= 3) hl.push('Longest streak: ' + streak.best + ' in a row' + (solo ? '' : ' by ' + P[streak.p].name));
    var clean = all.filter(function (x) { return !x.w.clue && !x.w.help; }).length;
    if (clean >= 3) hl.push(clean + ' words solved with no help');
    var alt = all.filter(function (x) { return x.w.as; })[0];
    if (alt) hl.push('Found ' + alt.w.as + ' hiding in ' + alt.w.w);
    var skipped = 0; S.log.forEach(function (L) { L.words.forEach(function (w) { if (w.skipped) skipped++; }); });
    if (!all.length && skipped) hl.push('Tough letters: ' + skipped + ' skipped');
    var mode = (solo ? 'Solo' : 'Pass and play') + ' · ' + catName(S.cat) + ' · ' + DIFF[S.diff][2] + ' · ' + TIMES[S.time];
    Kit.record(KEY, {
      started: S.started, mode: mode,
      players: P.map(function (p, i) { return { name: p.name, score: S.scores[i] }; }),
      winner: solo ? P[0].name : tie ? null : P[order[0]].name,
      rounds: !solo && S.rounds > 1 ? { labels: S.roundScores.map(function (r, i) { return 'Round ' + (i + 1); }), scores: S.roundScores } : undefined,
      summary: solo ? P[0].name + ' scored ' + top : undefined,
      highlights: hl.slice(0, 6),
      meta: { solo: solo, time: S.time, diff: S.diff, cat: S.cat, top: top }
    });
    clearSave();
    Kit.win({
      title: solo ? (best != null && top > best ? 'New best!' : top + ' points!') : tie ? "It's a tie!" : (P[order[0]].name === 'You' ? 'You win!' : P[order[0]].name + ' wins!'),
      sub: solo ? S.log[0].solved + ' words unscrambled' + (best != null ? ' · best before: ' + best : '') : 'After ' + S.rounds + (S.rounds > 1 ? ' rounds' : ' round'),
      rank: solo ? null : order.map(function (i) { return { name: P[i].name, score: S.scores[i], color: Kit.color(i) }; }),
      againLabel: 'Play again', again: again,
      extra: [{ label: 'Change settings', onClick: showSetup }]
    });
  }
  function again() {
    var cfg = { mode: S.mode, players: S.players, options: { diff: S.diff, time: S.time, rounds: S.rounds } };
    start(cfg, S.cat === 'Mixed' ? null : S.cat);
  }

  document.addEventListener('visibilitychange', function () { if (document.hidden && S && S.phase === 'play' && S.time) pause(); });

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.players && saved.phase && saved.phase !== 'over') {
    S = saved; if (S.cat === 'Mixed') CAT_NAME.Mixed = 'Mixed';
    if (S.phase === 'play') { if (S.R) S.R.fresh = false; if (S.time) { paused = true; render(); } else { render(); } }
    else render();
  } else showSetup();
  window.__sc = { state: function () { return S; } };
})();
</script>

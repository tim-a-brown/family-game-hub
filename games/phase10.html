<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* ── Scorecard layout (shared look: Flip 7 · Five Crowns · Wizard · Rook · Phase 10) ── */
.page{max-width:640px;}
.sc-card,.setup-screen,.entry-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 16px;margin-bottom:14px;}
.sc-label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:2px 2px 10px;}
.cnt-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(40px,1fr));gap:4px;padding:4px;margin-bottom:20px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;}
.cnt-row .btn{min-height:42px;padding:0;border-radius:11px;background:transparent;border-color:transparent;color:var(--text-2);box-shadow:none;font-size:1rem;font-weight:700;}
.cnt-row .btn.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink);box-shadow:0 4px 14px rgba(240,165,0,.25);}
.names-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.player-setup-row{display:flex;align-items:flex-start;gap:12px;}
.player-setup-row .player-dot{width:12px;height:12px;margin-top:19px;box-shadow:0 0 0 3px rgba(255,255,255,.05);}
.name-field{flex:1;min-width:0;}
.fp-ai-cta{border-radius:16px !important;margin-bottom:18px !important;}

/* Scoreboard tiles */
.score-display{display:grid;gap:8px;margin-bottom:12px;}
.scorer{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 10px 10px;text-align:center;transition:border-color .3s,box-shadow .3s;min-width:0;}
.scorer.leading{box-shadow:0 8px 24px -6px var(--lc,rgba(245,200,66,.3));}
.scorer-name{font-size:.82rem;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.scorer-pts{font-family:var(--display);font-size:clamp(1.7rem,7vw,2.3rem);font-weight:800;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.scorer-sub,.scorer-foot{font-size:.72rem;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scorer .crown{position:absolute;top:8px;right:9px;font-size:.8rem;}
.pbar{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-top:8px;}
.pbar-fill{height:100%;border-radius:3px;transition:width .5s var(--ease);}

/* Round entry */
.entry-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;min-height:40px;}
.entry-title{font-family:var(--display);font-size:1.2rem;font-weight:700;letter-spacing:-.01em;}
.entry-meta{font-size:.8rem;font-weight:700;color:var(--gold);background:rgba(245,200,66,.1);border:1px solid rgba(245,200,66,.25);border-radius:999px;padding:4px 10px;white-space:nowrap;}
.entry-meta.muted{color:var(--text-2);background:var(--surface-2);border-color:var(--line);}
.entry-list{margin-bottom:14px;}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 96px;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.erow:first-child{border-top:0;}
.erow-name{display:flex;align-items:center;gap:9px;font-weight:600;font-size:.95rem;min-width:0;}
.erow-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.erow-sub{font-size:.75rem;color:var(--text-3);font-weight:500;}
.score-input,.bid-input{width:100%;min-height:46px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;color:var(--text);font-weight:700;text-align:center;padding:8px 4px;outline:none;font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s;}
.score-input:focus,.bid-input:focus{border-color:rgba(245,200,66,.6);box-shadow:0 0 0 4px rgba(245,200,66,.12);}
.score-input::placeholder,.bid-input::placeholder{color:var(--text-3);font-weight:500;}
.score-input:disabled{opacity:.3;}
.toggle-row{display:flex;gap:6px;}
.toggle-btn{flex:1;min-height:38px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:11px;color:var(--text-2);font-size:.8rem;font-weight:700;padding:0 8px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .1s;}
.toggle-btn:active{transform:scale(.96);}
.toggle-btn.on{background:rgba(245,200,66,.16);border-color:rgba(245,200,66,.6);color:var(--gold);}
.toggle-btn.bust-on{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.55);color:var(--red);}
.toggle-btn:disabled{opacity:.35;cursor:not-allowed;}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;}
.seg .toggle-btn{border-color:transparent;background:transparent;min-height:40px;}
.seg .toggle-btn.on,.seg .toggle-btn.bust-on{background:var(--surface-3);box-shadow:0 1px 3px rgba(0,0,0,.35);}
.form-err{color:var(--red);font-size:.88rem;font-weight:600;text-align:center;margin:0 0 12px;}
.preview{font-size:.85rem;color:var(--text-2);text-align:center;margin:0 0 12px;min-height:20px;line-height:1.5;}

/* Round history */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;}
.hist-head{padding:13px 14px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--line);}
.hist-row{display:grid;gap:4px;padding:9px 12px;align-items:center;border-bottom:1px solid var(--line);}
.hist-row:last-child{border-bottom:0;}
.hist-row.alt{background:rgba(255,255,255,.018);}
.hist-row.names .hist-val{font-size:.75rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-row.totals{background:var(--surface-2);border-top:1px solid var(--line-2);}
.hist-num{font-size:.78rem;color:var(--text-3);font-variant-numeric:tabular-nums;}
.hist-val{font-size:.92rem;font-weight:600;text-align:center;color:var(--text);font-variant-numeric:tabular-nums;}
.hist-val.neg{color:var(--red);}
.hist-total{font-family:var(--display);font-size:1.08rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;}

/* Footer actions + winner */
.sc-foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
.winner-banner{scroll-margin-top:calc(var(--nav-h) + var(--safe-t) + 12px);}
.winner-trophy{font-size:2.6rem;line-height:1;margin-bottom:6px;}
.winner-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.winner-actions .btn{flex:1 1 140px;max-width:220px;}
.winner-banner .gh-hist-btn{font-size:.85rem !important;padding:0 16px !important;margin-top:12px !important;}

/* Rules */
.rules-body p{margin:0 0 8px;}
.rules-body ul{margin:0 0 8px;padding-left:18px;}
.rules-body li{margin-bottom:4px;}
.rules-body strong{color:var(--text);}
/* Phase tracker */
.p10-tracker{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 10px;margin-bottom:14px;}
.trk{display:grid;gap:4px 6px;align-items:center;}
.trk-h{font-size:.75rem;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.trk-ph{font-size:.8rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trk-ph b{color:var(--text);font-variant-numeric:tabular-nums;margin-right:4px;}
.trk-c{height:26px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--surface-2);color:var(--text-3);border:1px solid transparent;}
.trk-c.done{background:rgba(74,222,128,.14);color:var(--green);border-color:rgba(74,222,128,.3);}
.trk-c.cur{background:color-mix(in srgb,var(--pc) 20%,transparent);color:var(--pc);border-color:color-mix(in srgb,var(--pc) 55%,transparent);}
.trk-tot{font-family:var(--display);font-weight:800;font-size:1.05rem;text-align:center;padding-top:6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;}
.trk-tot.lbl{font-family:var(--font);font-size:.75rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;text-align:left;}
/* Entry rows */
.erow.p10{grid-template-columns:minmax(0,1fr) auto 72px;gap:8px;}
.erow-name.stack{flex-direction:column;align-items:flex-start;gap:0;}
.erow-name.stack .nm{display:flex;align-items:center;gap:8px;max-width:100%;}
.erow-name.stack .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.erow-name.stack .erow-sub{padding-left:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.ph-toggle{margin:0;display:block;cursor:pointer;}
.ph-toggle input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}
.ph-toggle span{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;padding:0 10px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text-2);font-size:.8rem;font-weight:700;white-space:nowrap;transition:all .15s;}
.ph-toggle input:checked + span{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.5);color:var(--green);}
.ph-toggle input:focus-visible + span{outline:2px solid rgba(245,200,66,.7);outline-offset:2px;}
</style>
</head>

<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a>

  <div id="p10-setup" class="setup-screen">
    <div class="sc-label">Number of players</div>
    <div class="cnt-row">
      <button class="btn btn-outline btn-sm p10-cnt active-cnt" data-n="2">2</button>
      <button class="btn btn-outline btn-sm p10-cnt" data-n="3">3</button>
      <button class="btn btn-outline btn-sm p10-cnt" data-n="4">4</button>
      <button class="btn btn-outline btn-sm p10-cnt" data-n="5">5</button>
      <button class="btn btn-outline btn-sm p10-cnt" data-n="6">6</button>
    </div>
    <div class="sc-label">Players</div>

  </div>

      <div class="winner-actions">
        <button class="btn btn-gold" id="p10-again">Play Again</button>

      </div>

      <button class="btn btn-gold btn-block" id="p10-submit">Add Round</button>
    </div>
    <div class="sc-foot">
      <button class="btn btn-ghost" id="p10-reset-setup">New Setup</button>
      <button class="btn btn-ghost" id="p10-undo">↩ Undo Round</button>
    </div>

<script>
'use strict';
const COLORS=['#f5c842','#ff7a5a','#5ac8fa','#7ed47e','#c084fc','#fb923c','#f472b6'];
const CDARK=['#c49a10','#c94020','#1a88c4','#3a9a3a','#8b3fc8','#c45a10','#be185d'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function haptic(k){try{window.GN&&GN.haptic(k);}catch(e){}}
function ask(msg,opts){return (window.GN&&GN.confirm)?GN.confirm(msg,opts):Promise.resolve(true);}

function showWinner(banner,nameEl,ptsEl,name,pts){
  banner.classList.remove('hidden');
  nameEl.textContent=name+' Wins!';
  ptsEl.textContent=typeof pts==='number'?pts+' points':pts;
  if(!banner.querySelector('.gh-hist-btn')&&banner._histKey&&typeof GameHistory!=='undefined'){
    const b=GameHistory.btn(banner._histKey,banner._histTitle,banner._histRender);
    b.className+=' gh-hist-btn';
    banner.appendChild(b);
  }
  haptic('success');
  setTimeout(()=>{try{banner.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}},60);
}
// opts: {lowWins, target:false, sub:[...]}
function buildScorers(container,names,totals,win,colors,cdark,opts={}){
  const n=names.length;
  const cols=n<=3?n:n<=4?2:3;
  container.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  container.innerHTML='';
  const best=opts.lowWins?Math.min(...totals):Math.max(...totals);
  names.forEach((nm,i)=>{
    const leading=opts.lowWins?(totals[i]===best&&totals[i]!==0):(totals[i]===best&&totals[i]>0);
    const s=document.createElement('div');
    s.className='scorer'+(leading?' leading':'');
    s.style.setProperty('--lc',colors[i]+'66');
    if(leading)s.style.borderColor=colors[i];
    let foot='';
    if(opts.target!==false){
      const pct=Math.max(0,Math.min(100,(totals[i]/win)*100));
      foot=`<div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:linear-gradient(90deg,${cdark[i]},${colors[i]})"></div></div>
      <div class="scorer-foot">${win-totals[i]>0?(win-totals[i])+' to win':'🏆 Reached '+win}</div>`;
    }
    s.innerHTML=`${leading?'<span class="crown">👑</span>':''}<div class="scorer-name" style="color:${colors[i]}">${esc(nm)}</div>
      <div class="scorer-pts">${totals[i]}</div>
      ${opts.sub?`<div class="scorer-sub">${opts.sub[i]}</div>`:''}${foot}`;
    container.appendChild(s);
  });
}
function buildHistory(container,rounds,names,totals,colors,title='Round History'){
  if(!rounds.length){container.innerHTML='';return;}
  const n=names.length;
  const gtc=`26px repeat(${n},minmax(0,1fr))`;
  let html=`<div class="hist"><div class="hist-head">${title}</div>
    <div class="hist-row names" style="grid-template-columns:${gtc}">
      <div class="hist-num">#</div>
      ${names.map((nm,i)=>`<div class="hist-val" style="color:${colors[i]}">${esc(nm)}</div>`).join('')}
    </div>`;
  rounds.forEach((r,ri)=>{
    html+=`<div class="hist-row ${ri%2?'alt':''}" style="grid-template-columns:${gtc}">
      <div class="hist-num">${ri+1}</div>
      ${r.map(v=>`<div class="hist-val ${v<0?'neg':''}">${v>0?'+'+v:v}</div>`).join('')}
    </div>`;
  });
  html+=`<div class="hist-row totals" style="grid-template-columns:${gtc}">
    <div class="hist-num">Σ</div>
    ${totals.map((t,i)=>`<div class="hist-total" style="color:${colors[i]}">${t}</div>`).join('')}
  </div></div>`;
  container.innerHTML=html;
}
function nameRow(prefix,i,value,max=16){
  return `<div class="player-dot" style="background:${COLORS[i]}"></div>
    <div class="name-field"><input class="input" id="${prefix}${i}" value="${esc(value)}" maxlength="${max}" autocomplete="off"></div>`;
}
// ── PHASE 10 ───────────────────────────────────────────────────────────────
{
const P10_PHASES=[
  '2 sets of 3','1 set of 3 + 1 run of 4','1 set of 4 + 1 run of 4',
  '1 run of 7','1 run of 8','1 run of 9','2 sets of 4',
  '7 cards of one color','1 set of 5 + 1 set of 2','1 set of 5 + 1 set of 3'
];
const DFLT=['Player 1','Player 2','Player 3','Player 4','Player 5','Player 6'];
// p10Phases[i] = phase the player is working on (1–10); 11 = finished all ten.
let p10N=2, p10Names=[], p10Phases=[], p10Points=[], p10Rounds=[];

function p10BuildNames(){
  const c=document.getElementById('p10-names');c.innerHTML='';
  for(let i=0;i<p10N;i++){
    const row=document.createElement('div');row.className='player-setup-row';
    row.innerHTML=nameRow('p10n',i,DFLT[i]);
    c.appendChild(row);
  }
  if(typeof FrequentPlayers!=="undefined") FrequentPlayers.attachPickersByPrefix("p10n");
}
document.querySelectorAll('.p10-cnt').forEach(b=>{
  b.addEventListener('click',()=>{
    p10N=+b.dataset.n;
    document.querySelectorAll('.p10-cnt').forEach(x=>x.classList.remove('active-cnt','btn-gold'));
    b.classList.add('active-cnt','btn-gold');p10BuildNames();haptic('select');
  });
});
document.querySelector('.p10-cnt[data-n="2"]').classList.add('btn-gold');
p10BuildNames();

function p10Save(){try{sessionStorage.setItem('cs_p10',JSON.stringify({p10N,p10Names,p10Phases,p10Points,p10Rounds,_ts:Date.now()}));}catch(e){}}
function p10Done(){return p10Phases.some(ph=>ph>10);}

function p10Start(){
  p10Names=Array.from({length:p10N},(_,i)=>document.getElementById('p10n'+i).value.trim()||DFLT[i]);
  p10Phases=Array(p10N).fill(1);
  p10Points=Array(p10N).fill(0);
  p10Rounds=[];
  document.getElementById('p10-setup').classList.add('hidden');
  document.getElementById('p10-game').classList.remove('hidden');
  document.getElementById('p10-winner').classList.add('hidden');
  p10Render();window.scrollTo(0,0);
}

function p10Render(){
  // Phase tracker
  const tracker=document.getElementById('p10-tracker');
  const cw=p10N<=3?44:p10N<=4?38:32;
  let html=`<div class="trk" style="grid-template-columns:minmax(0,1fr) repeat(${p10N},${cw}px)">`;
  html+=`<div class="trk-ph" style="color:var(--text-3);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em">Phase</div>`;
  p10Names.forEach((nm,i)=>html+=`<div class="trk-h" style="color:${COLORS[i]}" title="${esc(nm)}">${esc(nm.length>4&&cw<40?nm.slice(0,3)+'…':nm)}</div>`);
  for(let ph=1;ph<=10;ph++){
    html+=`<div class="trk-ph"><b>${ph}</b>${P10_PHASES[ph-1]}</div>`;
    p10Names.forEach((_,i)=>{
      const done=p10Phases[i]>ph;
      const current=p10Phases[i]===ph;
      html+=`<div class="trk-c ${done?'done':current?'cur':''}" style="--pc:${COLORS[i]}">${done?'✓':current?'●':''}</div>`;
    });
  }
  html+=`<div class="trk-tot lbl">Points</div>`;
  p10Names.forEach((_,i)=>html+=`<div class="trk-tot" style="color:${COLORS[i]}">${p10Points[i]}</div>`);
  html+='</div>';
  tracker.innerHTML=html;

  // Round entry inputs
  const rd=p10Rounds.length+1;
  document.getElementById('p10-round-label').textContent=`Round ${rd}`;
  document.getElementById('p10-entry').classList.toggle('hidden',p10Done());
  const inp=document.getElementById('p10-inputs');inp.innerHTML='';
  p10Names.forEach((nm,i)=>{
    const div=document.createElement('div');
    div.className='erow p10';
    const ph=p10Phases[i];
    div.innerHTML=`<div class="erow-name stack"><div class="nm"><span class="player-dot" style="background:${COLORS[i]}"></span><span>${esc(nm)}</span></div><div class="erow-sub">Phase ${ph>10?'done':ph}</div></div>
      <label class="ph-toggle"><input type="checkbox" id="p10cp${i}"><span>✓ Made it</span></label>
      <input type="number" inputmode="numeric" class="score-input" id="p10pt${i}" placeholder="pts" min="0">`;
    inp.appendChild(div);
  });
  inp.querySelectorAll('.ph-toggle input').forEach(el=>el.addEventListener('change',()=>haptic('select')));
}

document.getElementById('p10-submit').addEventListener('click',()=>{
  if(p10Done()) return;
  const err=document.getElementById('p10-err');
  const roundData=p10Names.map((_,i)=>{
    const completed=document.getElementById(`p10cp${i}`).checked;
    const pts=parseInt(document.getElementById(`p10pt${i}`).value);
    return{completed,pts:isNaN(pts)?null:pts};
  });
  if(roundData.some(r=>r.pts===null)){err.textContent='Enter points for all players (0 if they went out).';err.style.display='block';haptic('error');return;}
  err.style.display='none';
  p10Rounds.push(roundData);
  roundData.forEach((r,i)=>{
    // Completing phase 10 moves the player to 11 (= finished) so a winner can be found.
    if(r.completed&&p10Phases[i]<=10)p10Phases[i]++;
    p10Points[i]+=r.pts;
  });
  p10Render();
  // Winner: completed phase 10; ties broken by lowest points.
  const winner10=p10Phases.findIndex(ph=>ph>10);
  if(winner10>=0){
    const minPts=Math.min(...p10Names.map((_,i)=>p10Phases[i]>10?p10Points[i]:Infinity));
    const wi=p10Points.findIndex((pt,i)=>p10Phases[i]>10&&pt===minPts);
    const wb=document.getElementById('p10-winner');
    GameHistory.save('p10',{_summary:`${p10Names[wi]} wins · ${p10Rounds.length} rounds`,_badge:p10Points[wi]+'pts',winner:p10Names[wi],names:p10Names,rounds:p10Rounds.length,points:p10Points,phases:p10Phases});
    wb._histKey='p10';wb._histTitle='Phase 10';
    wb._histRender=e=>{const div=document.createElement('div');div.appendChild(GameHistory.renderStatGrid([{val:e.winner,lbl:'Winner'},{val:e.rounds,lbl:'Rounds'},{val:e.points[wi]+'pts',lbl:'Score'}]));return div;};
    showWinner(wb,document.getElementById('p10-wname'),document.getElementById('p10-wpts'),p10Names[wi],`Completed all 10 phases · ${p10Points[wi]} pts`);
  } else haptic('light');
  p10Save();
});

document.getElementById('p10-undo').addEventListener('click',()=>{
  if(!p10Rounds.length)return;
  const last=p10Rounds.pop();
  last.forEach((r,i)=>{
    if(r.completed&&p10Phases[i]>1)p10Phases[i]--;
    p10Points[i]-=r.pts;
  });
  document.getElementById('p10-winner').classList.add('hidden');
  haptic('light');p10Render();p10Save();
});
function p10ToSetup(){document.getElementById('p10-game').classList.add('hidden');document.getElementById('p10-setup').classList.remove('hidden');try{sessionStorage.removeItem('cs_p10');}catch(e){}window.scrollTo(0,0);}
document.getElementById('p10-start').addEventListener('click',()=>{haptic('light');p10Start();try{sessionStorage.removeItem('cs_p10');}catch(e){}});
document.getElementById('p10-again').addEventListener('click',()=>{p10Start();try{sessionStorage.removeItem('cs_p10');}catch(e){}});
document.getElementById('p10-newsetup').addEventListener('click',p10ToSetup);
document.getElementById('p10-reset-setup').addEventListener('click',async()=>{
  if(p10Rounds.length&&!p10Done()&&!(await ask('Start a new setup?',{title:'New setup?',body:'This clears the current game.',ok:'New Setup',danger:true})))return;
  p10ToSetup();
});
try{const raw=sessionStorage.getItem('cs_p10');if(raw){const s=JSON.parse(raw);if(s.p10Names&&s.p10Rounds.length){p10N=s.p10N||s.p10Names.length;p10Names=s.p10Names;p10Phases=s.p10Phases;p10Points=s.p10Points;p10Rounds=s.p10Rounds;document.getElementById('p10-setup').classList.add('hidden');document.getElementById('p10-game').classList.remove('hidden');p10Render();if(p10Done()){const m=Math.min(...p10Names.map((_,i)=>p10Phases[i]>10?p10Points[i]:Infinity));const wi=p10Points.findIndex((pt,i)=>p10Phases[i]>10&&pt===m);document.getElementById('p10-winner').classList.remove('hidden');document.getElementById('p10-wname').textContent=p10Names[wi]+' Wins!';document.getElementById('p10-wpts').textContent=`Completed all 10 phases · ${p10Points[wi]} pts`;}}}}catch(e){}
}
</script>
</body>
</html>

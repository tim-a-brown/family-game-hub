<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 10 Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
/* Phase row under the names on the paper pad */
.spad thead tr.phrow th{height:auto;padding:2px 2px 6px;border-bottom:2px solid rgba(60,80,160,.3);}
.spad thead tr.phrow th.rn{font-size:.62rem;}
.spad thead tr.phrow .pn{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:50%;font-family:var(--display);font-weight:400;font-size:1.25rem;color:#fff;background:#c8102e;box-shadow:0 2px 0 rgba(0,0,0,.15);}
.spad thead tr.phrow .pn.done{background:#137a3e;font-size:.8rem;border-radius:999px;}
.spad thead tr.phrow small{display:block;font-family:var(--hand);font-size:.85rem;color:#6a6a80;line-height:1.1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.spad thead tr:first-child th{border-bottom:0;}
.spad tbody tr:not(.open) td > small:not(.eq){font-family:var(--font);font-weight:800;font-size:.62rem !important;letter-spacing:.02em;margin-top:0 !important;}
/* The open hand: points left per column, then Made / Missed (or Out, which is 0 and made) */
.spad td .eq.ph{color:#c8102e;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null;
  var SETUP = 'phase10_pad_setup', KEY = 'p10';
  var PH = ['2 sets of 3', '1 set of 3 + 1 run of 4', '1 set of 4 + 1 run of 4', '1 run of 7', '1 run of 8', '1 run of 9',
    '2 sets of 4', '7 cards of one color', '1 set of 5 + 1 set of 2', '1 set of 5 + 1 set of 3'];

  Kit.init({
    id: 'phase10', title: 'Phase 10 score',
    onNew: function () { if (pad) pad.clear(); localStorage.removeItem(SETUP); showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Phase 10: past games' }); } }],
    rules:
      '<p class="goal">Play Phase 10 with a real deck and keep score here. The first player to finish <b>Phase 10</b> wins. If two players finish it in the same hand, the one with the <b>fewest points</b> wins.</p>' +
      '<h3>The phases</h3><ol>' + PH.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ol>' +
      '<p>A <b>set</b> is cards of the same number. A <b>run</b> is numbers in a row. Wilds can be anything; Skips make someone lose a turn.</p>' +
      '<h3>After each hand</h3><ul><li>The open rows on the sheet are this hand. In each player\'s column tap <b>Made</b> if they laid down their phase, or <b>Missed</b> if not. Tap <b>Out</b> for whoever went out: that is 0 points and a made phase.</li>' +
      '<li>Set the points left in their hand: <b>1–9 are 5 points</b>, <b>10–12 are 10</b>, <b>Skip 15</b>, <b>Wild 25</b>. Then tap <b>Lock hand</b>; tap a hand on the sheet to change or delete it right there.</li>' +
      '<li>The pad shows everyone\'s phase number. Players who made it move on; everyone else tries again.</li></ul>' +
      '<h3>Dealing</h3><p>10 cards each. The deal passes to the left every hand.</p>'
  });

  function showSetup() {
    Kit.setup(app, {
      players: { min: 2, max: 6, count: 3 },
      options: [{ id: 'last', label: 'Game length', value: 10, choices: [[10, 'All 10 phases', 'The full game: the first to finish phase 10 wins.'], [5, 'Quick · phases 1–5', 'A shorter game: the first to finish phase 5 wins.']] }],
      start: 'Start scoring',
      onStart: function (cfg) {
        localStorage.setItem(SETUP, JSON.stringify({ names: cfg.players.map(function (p) { return p.name; }), last: +cfg.options.last || 10 }));
        startPad();
      }
    });
  }

  // Each round stores detail[i] = 'made N' or 'missed N'. Completion is the source of truth;
  // the phase numbers are rewritten whenever rounds change so edits stay consistent.
  function made(r, i) { return !!(r.detail && String(r.detail[i] || '').indexOf('made') === 0); }
  function phasesAfter(rounds, n) {
    var ph = []; for (var i = 0; i < n; i++) ph.push(1);
    rounds.forEach(function (r) { for (var i = 0; i < n; i++) if (made(r, i)) ph[i]++; });
    return ph; // phase each player is now on (last + 1 = finished)
  }
  function normalize(rounds, n) {
    var ph = []; for (var i = 0; i < n; i++) ph.push(1);
    rounds.forEach(function (r) {
      var d = [];
      for (var i = 0; i < n; i++) { var m = made(r, i); d.push((m ? 'made ' : 'missed ') + ph[i]); if (m) ph[i]++; }
      r.detail = d;
    });
  }

  function startPad() {
    var cfg = JSON.parse(localStorage.getItem(SETUP)), LAST = cfg.last || 10, n = cfg.names.length;
    function finishers(rounds) { var ph = phasesAfter(rounds, n); return ph.map(function (v, i) { return v > LAST ? i : -1; }).filter(function (i) { return i >= 0; }); }
    pad = Scorepad(app, {
      key: KEY, title: 'Phase 10', mode: 'Scorekeeper' + (LAST < 10 ? ' · phases 1–' + LAST : ''), lowWins: true,
      sides: cfg.names.map(function (nm) { return { name: nm }; }),
      goal: 'First to finish phase ' + LAST + ' wins · fewest points breaks a tie',
      isOver: function (t, rounds) {
        normalize(rounds, n);
        var f = finishers(rounds);
        if (f.length && pad) pad.state().highlights = highlights(rounds, t);
        return f.length > 0;
      },
      winner: function (t, rounds) {
        var f = finishers(rounds);
        if (f.length) {
          f.sort(function (a, b) { return t[a] - t[b]; });
          return f.length > 1 && t[f[0]] === t[f[1]] ? -1 : f[0];
        }
        var ph = phasesAfter(rounds, n), best = -1;
        for (var i = 0; i < n; i++) if (best < 0 || ph[i] > ph[best] || (ph[i] === ph[best] && t[i] < t[best])) best = i;
        var ties = 0; for (var j = 0; j < n; j++) if (ph[j] === ph[best] && t[j] === t[best]) ties++;
        return ties > 1 ? -1 : best;
      },
      entryRows: entryRows, onLock: lockHand, lockLabel: 'Lock hand'
    });
    // ── The open hand on the sheet: points left, then Made / Missed / Out per player ──
    function entryRows(ctx) {
      var ph = phasesAfter(ctx.rounds.slice(0, ctx.index), n), st;
      if (ctx.editing) st = { res: ctx.sides.map(function (s, i) { return made(ctx.prev, i); }), v: ctx.prev.scores.slice() };
      else st = ctx.draft() || { res: ctx.sides.map(function () { return null; }), v: ctx.sides.map(function () { return null; }) };
      var rowA = el('tr', { class: 'open' }, [el('th', { class: 'rn' }, [String(ctx.round), el('small', { text: 'LEFT' })])]);
      var rowB = el('tr', { class: 'sub' }, [el('th', { class: 'rn', text: 'PHASE' })]);
      var steps = [], eqs = [], yes = [], no = [], outB = [];
      ctx.sides.forEach(function (s, i) {
        steps[i] = Scorepad.step({ value: st.v[i], min: 0, step: 5, label: s.name + ' points left', onChange: function (v) { st.v[i] = v; refresh(); } });
        eqs[i] = el('small', { class: 'eq ph', text: ph[i] > LAST ? 'done' : 'phase ' + ph[i] });
        rowA.appendChild(el('td', null, [steps[i], eqs[i]]));
        yes[i] = Scorepad.tog('Made', { cls: 'good', aria: s.name + ' made phase ' + ph[i], html: Kit.icon('check') + '<span>Made</span>', onClick: function () { st.res[i] = st.res[i] === true ? null : true; refresh(); } });
        no[i] = Scorepad.tog('Missed', { aria: s.name + ' missed phase ' + ph[i], onClick: function () { st.res[i] = st.res[i] === false ? null : false; refresh(); } });
        outB[i] = Scorepad.tog('Out', { cls: 'gold', aria: s.name + ' went out', onClick: function () {
          var on = st.v[i] === 0 && st.res[i] === true;
          if (on) { st.v[i] = null; steps[i].set(null); }
          else { st.v[i] = 0; st.res[i] = true; steps[i].set(0); }
          refresh();
        } });
        rowB.appendChild(el('td', null, [el('div', { class: 'sp-col' }, [yes[i], no[i], outB[i]])]));
      });
      function vals() { return st.v.map(function (x) { return Math.max(0, Number(x) || 0); }); }
      function refresh() {
        var v = vals(), zero = v.filter(function (x, i) { return x === 0 && st.v[i] != null; }).length, msg = '', bad = false;
        ctx.sides.forEach(function (s, i) { yes[i].set(st.res[i] === true); no[i].set(st.res[i] === false); outB[i].set(st.v[i] === 0 && st.res[i] === true); });
        if (v.some(function (x) { return x % 5; })) { msg = 'Points go up in 5s (cards are 5, 10, 15 or 25).'; bad = true; }
        else if (zero > 1) { msg = 'Only one player can go out (0 points).'; bad = true; }
        else if (zero === 1 && st.res[v.indexOf(0)] === false) { msg = ctx.sides[v.indexOf(0)].name + ' went out, so they must have made their phase.'; bad = true; }
        else if (st.res.some(function (x) { return x === null; })) msg = 'Tap Made or Missed for everyone.';
        else if (st.v.some(function (x) { return x == null; })) msg = 'Set the points left for everyone (0 for whoever went out).';
        else if (zero === 0) msg = 'Whoever went out has 0 points.';
        ctx.pending(v);
        ctx.status(msg || ctx.sides[v.indexOf(0)].name + ' went out. Looks right.', msg ? (bad ? false : 'wait') : true);
        if (!ctx.editing) ctx.draft(st);
      }
      refresh();
      ctx.entry = { st: st, ph: ph, vals: vals };
      return [rowA, rowB];
    }
    function lockHand(ctx) {
      var res = ctx.entry.st.res, ph = ctx.entry.ph, v = ctx.entry.vals();
      var extra = { detail: res.map(function (m, i) { return (m ? 'made ' : 'missed ') + ph[i]; }), highlights: [] };
      var fin = res.map(function (m, i) { return m && ph[i] >= LAST ? i : -1; }).filter(function (i) { return i >= 0; });
      if (!ctx.editing) {
        if (fin.length) extra.callout = 'Phase ' + LAST + ' done!';
        else if (res.every(function (m) { return m; })) extra.callout = 'Everyone made it!';
      }
      ctx.done(v, extra);
    }
    function highlights(rounds, t) {
      var names = cfg.names, out = [], ph = [], streak = [], stuck = null, outs = [], missed = [], big = null, firstDone = null;
      for (var i = 0; i < n; i++) { ph.push(1); streak.push(0); outs.push(0); missed.push(0); }
      rounds.forEach(function (r, ri) {
        for (var i = 0; i < n; i++) {
          if (made(r, i)) { if (ph[i] === LAST && !firstDone) firstDone = { i: i, hand: ri + 1 }; ph[i]++; streak[i] = 0; }
          else { streak[i]++; missed[i]++; if (!stuck || streak[i] > stuck.n) stuck = { i: i, ph: ph[i], n: streak[i] }; }
          if (r.scores[i] === 0) outs[i]++;
          if (!big || r.scores[i] > big.pts) big = { i: i, pts: r.scores[i], hand: ri + 1 };
        }
      });
      if (firstDone) out.push(names[firstDone.i] + ' laid down Phase ' + LAST + ' in hand ' + firstDone.hand);
      if (stuck && stuck.n >= 2) out.push(names[stuck.i] + ' was stuck on phase ' + stuck.ph + ' for ' + stuck.n + ' hands');
      var mo = outs.indexOf(Math.max.apply(null, outs));
      if (outs[mo] >= 2) out.push(names[mo] + ' went out ' + outs[mo] + ' times');
      for (var k = 0; k < n; k++) if (!missed[k] && rounds.length >= 3) out.push(names[k] + ' never missed a phase');
      if (big && big.pts >= 50) out.push(names[big.i] + ' got caught with ' + big.pts + ' points in hand ' + big.hand);
      out.push('Final phases: ' + names.map(function (nm, i) { return nm + ' ' + (ph[i] > LAST ? 'done' : ph[i]); }).join(', '));
      return out;
    }
    // Phase numbers under each name on the pad
    function addPhaseRow() {
      var thead = app.querySelector('.spad thead'); if (!thead || thead.querySelector('.phrow')) return;
      var rounds = pad ? pad.state().rounds : [], ph = phasesAfter(rounds, n);
      var tr = el('tr', { class: 'phrow' }, [el('th', { class: 'rn', text: 'PH' })]);
      ph.forEach(function (v) {
        tr.appendChild(el('th', null, [
          el('span', { class: 'pn' + (v > LAST ? ' done' : ''), text: v > LAST ? 'Done' : String(v) }),
          el('small', { text: v > LAST ? 'finished' : PH[v - 1].replace(/^1 /, '') })
        ]));
      });
      thead.appendChild(tr);
    }
    new MutationObserver(addPhaseRow).observe(app, { childList: true, subtree: true });
    addPhaseRow();
  }

  if (localStorage.getItem(SETUP)) startPad(); else showSetup();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d12">
<title>Backgammon</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
:root{--bw:min(100vw - 32px,560px);}
.site-nav button.icon-btn{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;display:inline-grid;place-items:center;}
.icon-btn svg{width:18px;height:18px;}
.gk{width:var(--bw);max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;}

/* Player tiles */
.bg-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bg-chip{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:border-color .25s var(--ease),background .25s,box-shadow .25s;}
.bg-chip.active{border-color:rgba(245,200,66,.5);background:linear-gradient(180deg,rgba(245,200,66,.1),rgba(245,200,66,.02)),var(--surface);box-shadow:0 0 0 3px rgba(245,200,66,.07);}
.bg-chip .who{flex:1;min-width:0;}
.bg-chip-val{font-weight:700;font-size:.92rem;line-height:1.2;}
.bg-chip-lbl{font-size:.74rem;font-weight:600;color:var(--text-3);white-space:nowrap;}
.bg-chip.active .bg-chip-lbl{color:var(--gold);}
.bg-chip .off{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1;font-variant-numeric:tabular-nums;text-align:right;}
.bg-chip .off small{display:block;font-family:var(--font);font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
.bg-chip .mini{width:22px;height:22px;border-radius:50%;flex:none;margin:0;}

/* Dice + roll */
.turn-row{display:flex;align-items:center;gap:10px;min-height:52px;}
.dice-row{display:flex;gap:8px;flex:1;align-items:center;min-height:48px;}
.die{width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,#fff,#e6e2d8);box-shadow:0 4px 0 #b9b2a3,0 6px 12px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;transition:opacity .2s,transform .2s var(--ease);}
.die.b-die{background:linear-gradient(160deg,#3a3f4a,#1b1e24);box-shadow:0 4px 0 #0c0d10,0 6px 12px rgba(0,0,0,.35);}
.die i{width:8px;height:8px;border-radius:50%;background:#1d1a15;place-self:center;}
.die.b-die i{background:#f2efe8;}
.die.used{opacity:.3;transform:scale(.86);}
.die.roll{animation:roll .45s var(--spring);}
@keyframes roll{0%{transform:rotate(-30deg) scale(.6);opacity:.3;}100%{transform:none;opacity:1;}}
.dice-hint{font-size:.85rem;color:var(--text-3);font-weight:600;}
#roll-btn{min-width:132px;}

.bg-status{text-align:center;font-size:.9rem;font-weight:600;min-height:22px;color:var(--text-2);}
.bg-status b{color:var(--text);}

/* Board */
.bg-outer{border-radius:18px;padding:8px;background:linear-gradient(145deg,#5a3a24,#2c1a0e);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;gap:6px;}
.bearoff-row{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 6px;border-radius:10px;border:1px dashed transparent;background:rgba(0,0,0,.18);cursor:default;transition:background .2s,border-color .2s;}
.bearoff-row .lbl{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.55);white-space:nowrap;}
.bearoff-row.can{border-color:rgba(245,200,66,.8);background:rgba(245,200,66,.18);cursor:pointer;animation:pulse 1.2s ease-in-out infinite;}
.bearoff-row.can .lbl{color:var(--gold);}
@keyframes pulse{50%{background:rgba(245,200,66,.3);}}
.bearoff{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-left:auto;}
.bearoff .bg-checker{width:8px;height:20px;border-radius:3px;margin:0;}
.bg-board{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:radial-gradient(120% 90% at 50% 50%,#2a6a4a,#1a4a33);position:relative;}
.bg-row{display:grid;grid-template-columns:repeat(6,1fr) 26px repeat(6,1fr);}
.bg-point{display:flex;align-items:center;padding:3px 1px;height:min(calc(var(--bw) * .4),calc((100dvh - 430px) / 2));min-height:140px;position:relative;cursor:pointer;}
.bg-point.top{flex-direction:column;}
.bg-point.bottom{flex-direction:column-reverse;}
.bg-tri{position:absolute;left:4%;right:4%;height:84%;pointer-events:none;transition:background .15s;}
.bg-point.top .bg-tri{top:0;clip-path:polygon(50% 100%,0 0,100% 0);}
.bg-point.bottom .bg-tri{bottom:0;clip-path:polygon(50% 0,0 100%,100% 100%);}
.bg-point.dk .bg-tri{background:linear-gradient(var(--dir,180deg),#c2533a,#8f3020);}
.bg-point.lt .bg-tri{background:linear-gradient(var(--dir,180deg),#efe3c8,#cbb994);}
.bg-point.bottom{--dir:0deg;}
.bg-point.highlight .bg-tri{background:linear-gradient(var(--dir,180deg),#ffe27a,#f0a500)!important;}
.bg-point.selected{background:rgba(245,200,66,.16);}
.bg-checker{position:relative;z-index:1;width:min(92%,30px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;flex-shrink:0;margin:.5px 0;}
.bg-checker.w{background:radial-gradient(circle at 38% 32%,#fff,#e8e4da 55%,#bdb6a6);color:#3a3328;box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.06);}
.bg-checker.b{background:radial-gradient(circle at 38% 32%,#5a5f68,#25282e 55%,#0d0e11);color:#e8e4da;box-shadow:0 2px 3px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.07);}
.bg-checker.lift{transform:scale(1.12);box-shadow:0 0 0 2px var(--gold),0 4px 10px rgba(0,0,0,.5);}
.bg-checker.can-move{box-shadow:0 0 0 2px rgba(245,200,66,.75),0 2px 3px rgba(0,0,0,.45);}
.bg-bar{background:linear-gradient(90deg,#3d2616,#4f321d,#3d2616);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 1px;}
.bg-bar .bg-checker{width:22px;}
.bg-bar.can-move .bg-checker{box-shadow:0 0 0 2px var(--gold);}
.bg-middle{height:22px;background:linear-gradient(180deg,#3d2616,#4f321d,#3d2616);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:.7rem;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.28);}
.bg-pointnum{position:absolute;font-size:10px;color:rgba(255,255,255,.4);font-weight:700;left:0;right:0;text-align:center;pointer-events:none;z-index:2;}
.bg-point.top .bg-pointnum{bottom:2px;}
.bg-point.bottom .bg-pointnum{top:2px;}
.rules{text-align:left;}
.rules h4{font-family:var(--display);font-size:.95rem;color:var(--text);margin:12px 0 3px;}
.rules h4:first-child{margin-top:0;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Backgammon</span>
  <button class="icon-btn" id="rules-toggle" aria-label="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6"/><path d="M12 17.2h.01"/></svg></button>
  <button class="icon-btn" id="new-btn" aria-label="New game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</nav>
<template id="rules-box">
  <div class="rules">
  <h4>Objective</h4>
  Be the first to move all 15 of your checkers off the board (bear off).
  <h4>Moving</h4>
  White moves from point 24 → 1, Black from 1 → 24. Roll two dice and move checkers that many points — split the roll between two checkers or use both on one. Doubles give four moves.
  <h4>Hitting &amp; the bar</h4>
  Land on a point with exactly one opponent checker (a "blot") to send it to the bar. A checker on the bar must re-enter before anything else moves. Two or more checkers block a point.
  <h4>Bearing off</h4>
  Once all your checkers are in your home board (1–6 for White, 19–24 for Black), tap a checker then the glowing tray to bear it off. A higher roll can bear off from your farthest point.
  </div>
</template>
<div class="page">
<div class="gk">
  <div class="bg-info">
    <div class="bg-chip active" id="chip-w"><span class="mini bg-checker w"></span><div class="who"><div class="bg-chip-val">White</div><div class="bg-chip-lbl" id="pip-w">Pips 167</div></div><div class="off"><span id="bore-w">0</span><small>off</small></div></div>
    <div class="bg-chip" id="chip-b"><span class="mini bg-checker b"></span><div class="who"><div class="bg-chip-val">Black</div><div class="bg-chip-lbl" id="pip-b">Pips 167</div></div><div class="off"><span id="bore-b">0</span><small>off</small></div></div>
  </div>

  <div class="turn-row">
    <div class="dice-row" id="dice-row"></div>
    <button class="btn btn-gold" id="roll-btn">Roll dice</button>
  </div>
  <div class="bg-status" id="bg-status">Roll to start!</div>

  <div class="bg-outer">
    <div class="bearoff-row" id="tray-b"><span class="lbl">Black bears off ↗</span><div class="bearoff" id="bearoff-b"></div></div>
    <div class="bg-board" id="bg-board"></div>
    <div class="bearoff-row" id="tray-w"><span class="lbl">White bears off ↘</span><div class="bearoff" id="bearoff-w"></div></div>
  </div>
</div>
</div>
<script>
'use strict';
window.GN=window.GN||{haptic(){},toast(){},sheet(){return{close(){},el:document.createElement('div')};},confirm:()=>Promise.resolve(true)};
// Points 1-24, index 0=point1. White moves 24→1, Black moves 1→24.
// points[i] = {count, color} or null
let points, bar, bearOff, turn, dice, diceLeft, selected, gameOver;
let justRolled=false, turnTimer=null;
const NAME={w:'White',b:'Black'};

function newGame(){
  clearTimeout(turnTimer);
  points=Array.from({length:24},()=>({count:0,color:null}));
  // Standard backgammon setup
  const setup=[[0,2,'b'],[5,5,'w'],[7,3,'w'],[11,5,'b'],[12,5,'w'],[16,3,'b'],[18,5,'b'],[23,2,'w']];
  setup.forEach(([i,n,c])=>{points[i]={count:n,color:c};});
  bar={w:0,b:0};bearOff={w:0,b:0};
  turn='w';dice=[];diceLeft=[];selected=null;gameOver=false;
  setStatus('<b>White</b> rolls first');
  renderAll();
}
function freshGame(){try{sessionStorage.removeItem('bg');}catch(e){}newGame();}
function setStatus(h){document.getElementById('bg-status').innerHTML=h;}

function rollDice(){
  if(gameOver||diceLeft.length>0)return;
  const d1=Math.ceil(Math.random()*6),d2=Math.ceil(Math.random()*6);
  dice=[d1,d2];
  diceLeft=d1===d2?[d1,d1,d1,d1]:[d1,d2];
  justRolled=true;GN.haptic('medium');
  const moves=getLegalMoves();
  if(!moves.length){
    setStatus(`<b>${NAME[turn]}</b> rolled ${d1}–${d2} · no legal moves`);
    GN.toast(`No legal moves — ${NAME[turn==='w'?'b':'w']}'s turn`);
    turnTimer=setTimeout(endTurn,1400);
  } else {
    setStatus(`<b>${NAME[turn]}</b> rolled ${d1===d2?`double ${d1}s`:`${d1} and ${d2}`} · ${bar[turn]?'enter from the bar':'tap a checker'}`);
  }
  renderAll();
}

function endTurn(){
  if(gameOver)return;
  turn=turn==='w'?'b':'w';
  diceLeft=[];dice=[];selected=null;
  setStatus(`<b>${NAME[turn]}</b>'s turn · roll the dice`);
  renderAll();
}

function pointIdx(displayNum){return displayNum-1;}// 1-based → 0-based

function getDir(t){return t==='w'?-1:1;}// white goes 24→1 (index 23→0), black goes 1→24 (index 0→23)

function isHome(t,i){
  if(t==='w')return i<=5;// points 1-6
  return i>=18;// points 19-24
}

function allHome(t){
  let total=bearOff[t];
  for(let i=0;i<24;i++){if(points[i].color===t)total+=points[i].count;}
  return total+bar[t]===15&&bar[t]===0&&(()=>{
    for(let i=0;i<24;i++){if(points[i].color===t&&!isHome(t,i))return false;}
    return true;
  })();
}

function getLegalMoves(){
  const moves=[];
  if(!diceLeft.length)return moves;
  // If on bar, must enter first
  if(bar[turn]>0){
    const opp=turn==='w'?'b':'w';
    diceLeft.forEach(d=>{
      const enterPt=turn==='w'?24-d:d-1;// white enters at 24-d (0-indexed)
      const pt=points[enterPt];
      if(pt.color!==opp||pt.count<=1)moves.push({from:-1,to:enterPt,die:d});
    });
    return[...new Map(moves.map(m=>[`${m.from},${m.to},${m.die}`,m])).values()];
  }
  // Bear off
  const home=allHome(turn);
  const dieset=[...new Set(diceLeft)];
  dieset.forEach(d=>{
    for(let i=0;i<24;i++){
      if(points[i].color!==turn||points[i].count===0)continue;
      const dest=turn==='w'?i-d:i+d;
      if(dest>=0&&dest<24){
        const pt=points[dest];
        const opp=turn==='w'?'b':'w';
        if(pt.color!==opp||pt.count<=1)moves.push({from:i,to:dest,die:d});
      } else if(home){
        // Bearing off: an exact roll always works; a larger roll only from the farthest occupied point
        if(turn==='w'){
          if(dest===-1)moves.push({from:i,to:-2,die:d});
          else if(!points.some((p,j)=>p.color==='w'&&p.count>0&&j>i))moves.push({from:i,to:-2,die:d});
        } else {
          if(dest===24)moves.push({from:i,to:-2,die:d});
          else if(!points.some((p,j)=>p.color==='b'&&p.count>0&&j<i))moves.push({from:i,to:-2,die:d});
        }
      }
    }
  });
  return[...new Map(moves.map(m=>[`${m.from},${m.to},${m.die}`,m])).values()];
}

function applyMove(m){
  const opp=turn==='w'?'b':'w';
  let hit=false;
  // Remove from source
  if(m.from===-1){bar[turn]--;} else {points[m.from].count--;if(points[m.from].count===0)points[m.from].color=null;}
  // Apply to dest
  if(m.to===-2){bearOff[turn]++;} else {
    if(points[m.to].color===opp&&points[m.to].count===1){bar[opp]++;points[m.to]={count:0,color:null};hit=true;}
    points[m.to].count++;points[m.to].color=turn;
  }
  GN.haptic(hit?'heavy':'light');
  if(hit)GN.toast(`Hit! ${NAME[opp]} goes to the bar`);
  // Remove die used
  const di=diceLeft.indexOf(m.die);if(di>=0)diceLeft.splice(di,1);
  justRolled=false;
  // Check win
  if(bearOff[turn]===15){
    gameOver=true;selected=null;
    setStatus(`<b style="color:var(--gold)">${NAME[turn]} wins! 🎉</b>`);
    GN.haptic('success');
    const loser=turn==='w'?'b':'w';
    const gammon=bearOff[loser]===0;
    setTimeout(()=>GN.sheet({title:`${NAME[turn]} wins! 🏆`,body:gammon?`A gammon — ${NAME[loser]} didn't bear off a single checker.`:`${NAME[loser]} bore off ${bearOff[loser]} of 15.`,
      actions:[{label:'Play again',primary:true,onClick:freshGame},{label:'View board'}]}),500);
    return;
  }
  selected=null;
  if(!diceLeft.length||!getLegalMoves().length){
    if(diceLeft.length)setStatus('No more legal moves');
    turnTimer=setTimeout(endTurn,700);
  } else {
    setStatus(`<b>${NAME[turn]}</b> · ${diceLeft.length} move${diceLeft.length>1?'s':''} left`);
  }
}

function clickPoint(i){
  if(gameOver)return;
  if(!diceLeft.length){GN.haptic('error');GN.toast('Roll the dice first');return;}
  const legal=getLegalMoves();
  // Check if selecting own piece
  if(bar[turn]>0){
    // Must enter from bar
    const dest=legal.find(m=>m.to===i);
    if(dest){applyMove(dest);renderAll();return;}
    GN.haptic('error');GN.toast('Enter your checker from the bar first');
    return;
  }
  if(selected!==null){
    // Prefer the smaller die when two dice reach the same point? Keep first legal match.
    const move=legal.find(m=>m.from===selected&&m.to===i);
    if(move){applyMove(move);renderAll();return;}
  }
  if(points[i].color===turn&&points[i].count>0&&selected!==i){
    if(!legal.some(m=>m.from===i)){GN.haptic('error');selected=null;renderBoard();return;}
    selected=i;GN.haptic('select');renderBoard();renderTrays();return;
  }
  selected=null;renderBoard();renderTrays();
}

function clickBearOff(){
  if(selected===null)return;
  const legal=getLegalMoves();
  // Use the smallest die that bears off
  const move=legal.filter(m=>m.from===selected&&m.to===-2).sort((a,b)=>a.die-b.die)[0];
  if(move){applyMove(move);renderAll();}
}

function makePoint(idx,pos,legalTos,legalFroms){
  const pt=document.createElement('div');
  pt.className='bg-point '+pos+' '+(idx%2===0?'lt':'dk');
  const tri=document.createElement('div');tri.className='bg-tri';pt.appendChild(tri);
  if(selected===idx)pt.classList.add('selected');
  else if(legalTos.has(idx))pt.classList.add('highlight');
  const p=points[idx];
  const MAX_SHOW=5;
  const count=Math.min(p.count,MAX_SHOW);
  for(let k=0;k<count;k++){
    const c=document.createElement('div');c.className='bg-checker '+p.color;
    if(k===count-1){
      if(p.count>MAX_SHOW)c.textContent=p.count;
      if(selected===idx)c.classList.add('lift');
      else if(selected===null&&legalFroms.has(idx))c.classList.add('can-move');
    }
    pt.appendChild(c);
  }
  const num=document.createElement('div');num.className='bg-pointnum';num.textContent=idx+1;pt.appendChild(num);
  pt.addEventListener('click',()=>clickPoint(idx));
  return pt;
}

function renderBoard(){
  const el=document.getElementById('bg-board');
  el.innerHTML='';
  const legal=getLegalMoves();
  // Destinations: for the selected checker, or entry points when on the bar
  const legalTos=new Set(legal.filter(m=>bar[turn]>0?m.from===-1:(selected!==null&&m.from===selected)).map(m=>m.to));
  const legalFroms=new Set(legal.map(m=>m.from));

  // Top row: points 13-18 left to right, bar, points 19-24
  const topRow=document.createElement('div');topRow.className='bg-row';
  [12,13,14,15,16,17,'bar',18,19,20,21,22,23].forEach(idx=>{
    if(idx==='bar'){
      const bar_el=document.createElement('div');bar_el.className='bg-bar'+(bar[turn]>0&&diceLeft.length&&!gameOver?' can-move':'');
      if(bar.b>0){const c=document.createElement('div');c.className='bg-checker b';c.textContent=bar.b>1?bar.b:'';bar_el.appendChild(c);}
      topRow.appendChild(bar_el);return;
    }
    topRow.appendChild(makePoint(idx,'top',legalTos,legalFroms));
  });

  const mid=document.createElement('div');mid.className='bg-middle';mid.textContent='BACKGAMMON';

  // Bottom row: points 12-7 left to right, bar, points 6-1
  const botRow=document.createElement('div');botRow.className='bg-row';
  [11,10,9,8,7,6,'bar',5,4,3,2,1,0].forEach(idx=>{
    if(idx==='bar'){
      const b2=document.createElement('div');b2.className='bg-bar'+(bar[turn]>0&&diceLeft.length&&!gameOver?' can-move':'');
      if(bar.w>0){const c=document.createElement('div');c.className='bg-checker w';c.textContent=bar.w>1?bar.w:'';b2.appendChild(c);}
      botRow.appendChild(b2);return;
    }
    botRow.appendChild(makePoint(idx,'bottom',legalTos,legalFroms));
  });

  el.appendChild(topRow);el.appendChild(mid);el.appendChild(botRow);
}

function renderDice(){
  const el=document.getElementById('dice-row');el.innerHTML='';
  const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  // Mark used dice: count how many of each value remain
  const left=diceLeft.slice();
  const shown=dice.length===2&&dice[0]===dice[1]?[dice[0],dice[0],dice[0],dice[0]]:dice;
  const usedFlags=shown.map(d=>{const k=left.indexOf(d);if(k>=0){left.splice(k,1);return false;}return true;});
  shown.forEach((d,n)=>{
    const die=document.createElement('div');
    die.className='die'+(turn==='b'?' b-die':'')+(usedFlags[n]?' used':'')+(justRolled?' roll':'');
    if(shown.length===4){die.style.width=die.style.height='38px';die.style.padding='6px';}
    for(let k=0;k<9;k++){const s=document.createElement('span');if(PIPS[d].includes(k))s.innerHTML='<i></i>';else s.innerHTML='';die.appendChild(s);}
    die.querySelectorAll('span').forEach(s=>{s.style.display='grid';});
    el.appendChild(die);
  });
  justRolled=false;
  if(!dice.length){const hint=document.createElement('div');hint.className='dice-hint';hint.textContent=gameOver?'Game over':`${NAME[turn]} to roll`;el.appendChild(hint);}
  const rb=document.getElementById('roll-btn');
  rb.disabled=gameOver||diceLeft.length>0;
}

function renderTrays(){
  const legal=selected!==null?getLegalMoves():[];
  const canOff=legal.some(m=>m.from===selected&&m.to===-2);
  ['w','b'].forEach(c=>{
    const el=document.getElementById('bearoff-'+c);
    el.innerHTML='';
    for(let i=0;i<bearOff[c];i++){const ch=document.createElement('div');ch.className='bg-checker '+c;el.appendChild(ch);}
    document.getElementById('bore-'+c).textContent=bearOff[c];
    document.getElementById('tray-'+c).classList.toggle('can',canOff&&turn===c);
  });
}

function pips(t){
  let s=bar[t]*25;
  for(let i=0;i<24;i++)if(points[i].color===t)s+=points[i].count*(t==='w'?i+1:24-i);
  return s;
}
function updateChips(){
  document.getElementById('chip-w').classList.toggle('active',turn==='w'&&!gameOver);
  document.getElementById('chip-b').classList.toggle('active',turn==='b'&&!gameOver);
  document.getElementById('pip-w').textContent='Pips '+pips('w');
  document.getElementById('pip-b').textContent='Pips '+pips('b');
}
function renderAll(){updateChips();renderBoard();renderDice();renderTrays();}

document.getElementById('tray-w').addEventListener('click',()=>{if(turn==='w')clickBearOff();});
document.getElementById('tray-b').addEventListener('click',()=>{if(turn==='b')clickBearOff();});
document.getElementById('roll-btn').addEventListener('click',rollDice);
document.getElementById('new-btn').addEventListener('click',async()=>{
  if(!gameOver&&!(await GN.confirm('The current game will be lost.',{title:'Start a new game?',ok:'New game',danger:true})))return;
  freshGame();
});
document.getElementById('rules-toggle').addEventListener('click',()=>{
  GN.sheet({title:'How to play',body:document.getElementById('rules-box').content.cloneNode(true).firstElementChild,actions:[{label:'Got it',primary:true}]});
});

newGame();

// ── Session persistence ────────────────────────────────────────────────────
function _save_bg(){if(gameOver)return;
  try{sessionStorage.setItem('bg',JSON.stringify({points,bar,bearOff,turn,dice,diceLeft,gameOver,_ts:Date.now()}));}catch(e){}
}
function _load_bg(){
  try{
    const raw=sessionStorage.getItem('bg');if(!raw)return false;
    const s=JSON.parse(raw);if(!s||!Array.isArray(s.points))return false;
    points=s.points;bar=s.bar;bearOff=s.bearOff;turn=s.turn;dice=s.dice||[];diceLeft=s.diceLeft||[];gameOver=s.gameOver||false;selected=null;
    setStatus(diceLeft.length?`<b>${NAME[turn]}</b> · ${diceLeft.length} move${diceLeft.length>1?'s':''} left`:`<b>${NAME[turn]}</b>'s turn · roll the dice`);
    renderAll();
    if(diceLeft.length&&!getLegalMoves().length)turnTimer=setTimeout(endTurn,900);
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_bg);
window.addEventListener('pagehide',_save_bg);
_load_bg();
</script>
</body>
</html>

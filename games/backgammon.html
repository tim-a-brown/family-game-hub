<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backgammon</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.bgw{display:flex;flex-direction:column;align-items:center;gap:8px;}
/* Player strips above and below the board */
.btag{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;min-height:46px;padding:4px 12px 4px 6px;border-radius:16px;background:rgba(255,255,255,.05);border:2px solid transparent;transition:border-color .2s, background .2s;}
.btag.on{border-color:var(--yellow);background:rgba(255,200,61,.1);}
.btag .chk{position:relative;width:30px;height:30px;flex:none;}
.btag .nm{font-weight:900;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btag .st{font-size:.76rem;font-weight:800;color:var(--text-3);white-space:nowrap;}
.btag.on .st{color:var(--yellow);}
.btag .col{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1;}
.btag .nums{display:flex;gap:6px;flex:none;}
.btag .num{display:flex;flex-direction:column;align-items:center;min-width:40px;padding:2px 6px;border-radius:10px;background:rgba(0,0,0,.22);}
.btag .num b{font-family:var(--display);font-weight:400;font-size:1.15rem;line-height:1.1;font-variant-numeric:tabular-nums;}
.btag .num small{font-size:.6rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}

/* Board: wooden case, felt field, felt points */
.bboard{position:relative;border-radius:14px;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 1px, transparent 1px 15px),
    linear-gradient(180deg,#8a5428,#5e3517);
  box-shadow:inset 0 2px 0 rgba(255,220,180,.28), inset 0 -3px 0 rgba(0,0,0,.3), 0 16px 30px rgba(0,0,0,.5);}
.field{position:absolute;border-radius:4px;overflow:hidden;
  background:radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px) 0 0/4px 4px, radial-gradient(120% 90% at 50% 50%, #1d6f4c, #0f4d33);
  box-shadow:inset 0 3px 10px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.4);}
.barstrip,.traystrip{position:absolute;background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 2px, transparent 2px 9px),
    linear-gradient(90deg,#6e3f1c,#8a5428 50%,#6e3f1c);
  box-shadow:inset 2px 0 3px rgba(0,0,0,.35), inset -2px 0 3px rgba(0,0,0,.35);}
.traystrip .well{position:absolute;left:3px;right:3px;border-radius:4px;background:linear-gradient(180deg,#2a170a,#3a2210);box-shadow:inset 0 2px 6px rgba(0,0,0,.7);}
.tri{position:absolute;pointer-events:none;}
.tri i{position:absolute;inset:0;}
.tri.up i{clip-path:polygon(50% 0,100% 100%,0 100%);}
.tri.dn i{clip-path:polygon(0 0,100% 0,50% 100%);}
.tri.a i{background:linear-gradient(var(--d),#efe2c0,#d4c194);}
.tri.b i{background:linear-gradient(var(--d),#a3302a,#741b17);}
.tri.dn{--d:180deg;} .tri.up{--d:0deg;}
.tri.dest i{background:linear-gradient(var(--d),#ffe58a,#f2b31c);}
.tri.dest::after{content:"";position:absolute;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 10px #ffd84a;animation:dotp 1s ease-in-out infinite;}
.tri.dn.dest::after{bottom:-14px;} .tri.up.dest::after{top:-14px;}
@keyframes dotp{50%{transform:scale(.6);opacity:.6;}}
.pnum{position:absolute;font-size:9px;font-weight:900;color:rgba(255,255,255,.38);transform:translateX(-50%);pointer-events:none;}
.hit{position:absolute;background:transparent;border:0;padding:0;}
.hit:focus-visible{outline:2px solid #fff;outline-offset:-2px;}
/* Stone checkers */
.ck{position:absolute;left:0;top:0;width:var(--cd);height:var(--cd);border-radius:50%;pointer-events:none;z-index:2;
  transition:transform .42s cubic-bezier(.3,.8,.3,1), box-shadow .2s;display:grid;place-items:center;font-weight:900;font-size:calc(var(--cd) * .42);}
.ck.w{color:#5b4a35;background:
    radial-gradient(circle at 50% 50%, transparent 52%, rgba(0,0,0,.08) 54%, transparent 58%),
    radial-gradient(circle at 35% 28%, #ffffff 0%, #f3ead8 38%, #d7c9ae 80%, #b8a684 100%);
  box-shadow:0 2px 3px rgba(0,0,0,.5), inset 0 -2px 2px rgba(0,0,0,.18), inset 0 1px 1px rgba(255,255,255,.9);}
.ck.b{color:#e8d8c0;background:
    radial-gradient(circle at 50% 50%, transparent 52%, rgba(255,255,255,.07) 54%, transparent 58%),
    radial-gradient(circle at 35% 28%, #6f6a66 0%, #3a3532 38%, #1d1a18 80%, #0c0a09 100%);
  box-shadow:0 2px 3px rgba(0,0,0,.6), inset 0 -2px 2px rgba(0,0,0,.4), inset 0 1px 1px rgba(255,255,255,.22);}
.ck.can{box-shadow:0 0 0 2px rgba(255,216,74,.85), 0 2px 3px rgba(0,0,0,.5);}
.ck.sel{box-shadow:0 0 0 3px #ffd84a, 0 0 16px rgba(255,216,74,.8), 0 8px 10px rgba(0,0,0,.5);}
.ck.fly{transition:none;z-index:30;}
.slab{position:absolute;left:4px;right:4px;height:var(--sh);border-radius:2px;}
.slab.w{background:linear-gradient(180deg,#fffaf0,#d6c7a7);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.slab.b{background:linear-gradient(180deg,#5a5450,#151210);box-shadow:0 1px 0 rgba(0,0,0,.5);}
.offhit{position:absolute;border:0;background:transparent;border-radius:6px;padding:0;}
.offhit.dest{box-shadow:0 0 0 3px #ffd84a, 0 0 18px rgba(255,216,74,.7);animation:glowb 1.1s ease-in-out infinite;}
@keyframes glowb{50%{box-shadow:0 0 0 3px rgba(255,216,74,.4), 0 0 6px rgba(255,216,74,.3);}}
.dicebox{position:absolute;display:flex;align-items:center;justify-content:center;gap:6px;pointer-events:none;z-index:5;}
.dicebox .die{--ds:30px;pointer-events:none;}
.dicebox .die.used{opacity:.3;transform:scale(.85);filter:grayscale(.5);}
.dicebox .die.bd{background:radial-gradient(120% 120% at 28% 22%, #5d5550 0%, #2e2926 50%, #151210 100%);}
.dicebox .die.bd i{background:radial-gradient(circle at 35% 30%, #fff 0%, #e2d8c8 70%);}
.dicebox.blk .die{background:radial-gradient(120% 120% at 28% 22%, #5d5550 0%, #2e2926 50%, #151210 100%);}
.dicebox.blk .die i{background:radial-gradient(circle at 35% 30%, #fff 0%, #e2d8c8 70%);}
.dicebox.blk .die[data-v="1"] i:nth-child(5){background:radial-gradient(circle at 35% 30%, #ff6b7a 0%, #c8102e 70%);}
.cube{position:absolute;display:grid;place-items:center;border-radius:5px;font-family:var(--display);color:#3a2a14;z-index:6;pointer-events:none;
  background:linear-gradient(145deg,#fffdf5,#e8dcc0);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15), 0 3px 5px rgba(0,0,0,.5);transition:top .5s var(--spring), left .5s var(--spring);}
.cube.pop{animation:bounce .6s var(--spring);}
.msg{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-size:.82rem;color:rgba(255,255,255,.75);pointer-events:none;z-index:4;text-shadow:0 1px 2px rgba(0,0,0,.6);}
.ctrl{display:flex;gap:10px;justify-content:center;width:100%;max-width:560px;min-height:52px;}
.ctrl .btn{flex:1;max-width:240px;}
.ctrl .btn .ico{width:20px;height:20px;}
.hint{text-align:center;color:var(--text-2);font-weight:700;font-size:.92rem;min-height:22px;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var SAVE = 'backgammon_state', KEY = 'backgammon';
  var BAR = -1, OFF = -2;

  Kit.init({
    id: 'backgammon',
    onNew: function () { cpuToken++; clearSave(); undoStack = []; showSetup(); },
    undo: function () { undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(KEY, { title: 'Backgammon: past games' }); } }],
    rules:
      '<p class="goal">Race all <b>15 of your checkers</b> around the board, into your home corner, and then off the board. First to bear off all 15 wins.</p>' +
      '<h3>Moving</h3><ul><li>Roll two dice. Move one checker the number on one die, and a checker (the same one or another) the number on the other die.</li>' +
      '<li><b>Doubles</b> (like 4 and 4) give you <b>four moves</b> of that number.</li>' +
      '<li>You can land on an empty point, your own checkers, or a point with just <b>one</b> of the other player\'s checkers. Two or more of theirs <b>blocks</b> the point.</li>' +
      '<li>You must use both dice if you can. If only one can be used, you must use the <b>bigger</b> one when possible.</li></ul>' +
      '<h3>Hitting and the bar</h3><ul><li>Landing on a single enemy checker (a <b>blot</b>) <b>hits</b> it: it goes to the bar in the middle.</li>' +
      '<li>A checker on the bar must come back in, in the other player\'s home corner, before any other move.</li></ul>' +
      '<h3>Bearing off</h3><ul><li>Once all 15 of your checkers are in your home corner, you can move them off. A die can take off a checker from the matching point, or from your farthest point if the die is bigger.</li></ul>' +
      '<h3>Winning big</h3><ul><li><b>Gammon</b> (2 points): the loser hasn\'t borne off any checkers.</li>' +
      '<li><b>Backgammon</b> (3 points): the loser hasn\'t borne off any and still has a checker on the bar or in the winner\'s home corner.</li></ul>' +
      '<h3>The doubling cube (optional)</h3><ul><li>Before rolling, you can <b>double</b> the stakes. The other player either <b>takes</b> (the game is now worth twice as much and they own the cube) or <b>drops</b> (and loses the game at the current value).</li>' +
      '<li>Only the cube\'s owner can double next. In a match, no doubling the game right after someone gets one point from winning (the Crawford rule).</li></ul>' +
      '<h3>How to move here</h3><p>Tap a glowing checker, then tap a gold point. To bear off, tap the glowing tray on the right.</p>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  // pts[i] (i = 0..23 is point i+1 from White's side): + = White (player 0) checkers, − = Black (player 1).
  // White moves 24 → 1 and bears off below point 1; Black moves 1 → 24.
  var S = null, undoStack = [], cpuToken = 0, sel = null, rolling = false;
  function save() {
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S && S.phase !== 'over') Kit.resume.set(S.target > 1 ? 'Game ' + S.gameNo + ' · ' + S.score[0] + '–' + S.score[1] + ' (to ' + S.target + ')' : 'Game in progress');
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  function showSetup() {
    S = null; app.innerHTML = '';
    Kit.setup(app, {
      modes: [
        { id: 'cpu', icon: 'bot', title: 'vs Computer', desc: 'You play White against the computer' },
        { id: '2p', icon: 'users', title: 'Two players', desc: 'Pass the phone back and forth' }
      ],
      options: [
        { id: 'target', label: 'Match length', value: '1', choices: [['1', 'One game'], ['3', 'To 3'], ['5', 'To 5'], ['7', 'To 7']] },
        { id: 'cube', label: 'Doubling cube', value: 'on', choices: [['on', 'On'], ['off', 'Off']] },
        { id: 'level', label: 'Computer skill', value: 'med', choices: [['easy', 'Easy'], ['med', 'Medium'], ['hard', 'Hard']], when: function (m) { return m === 'cpu'; } }
      ],
      players: { min: 2, max: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },
      onStart: function (cfg) {
        S = {
          mode: cfg.mode, level: cfg.options.level || 'med', cubeOn: cfg.options.cube !== 'off', target: +cfg.options.target || 1,
          players: cfg.players.map(function (p) { return { name: p.name, cpu: p.cpu }; }),
          score: [0, 0], games: [], gameNo: 0, crawfordUsed: false, started: Date.now(),
          ms: { hits: [0, 0], doubles: [0, 0], maxCube: 1, drops: [], gammons: [] }
        };
        newGame();
      }
    });
  }

  function newGame() {
    cpuToken++; undoStack = []; sel = null;
    var p = []; for (var i = 0; i < 24; i++) p.push(0);
    p[23] = 2; p[12] = 5; p[7] = 3; p[5] = 5;        // White: 24, 13, 8, 6
    p[0] = -2; p[11] = -5; p[16] = -3; p[18] = -5;   // Black: 1, 12, 17, 19
    S.pos = { p: p, bar: [0, 0], off: [0, 0] };
    S.gameNo++; S.cube = 1; S.owner = -1; S.left = []; S.dice = [];
    S.crawford = false;
    if (S.target > 1 && !S.crawfordUsed && (S.score[0] === S.target - 1 || S.score[1] === S.target - 1)) { S.crawford = true; S.crawfordUsed = true; }
    S.gs = { hits: [0, 0] };
    // Opening roll: one die each, higher goes first and plays both
    var a, b; do { a = rnd(); b = rnd(); } while (a === b);
    S.cur = a > b ? 0 : 1; S.dice = [a, b].sort(function (x, y) { return y - x; }); S.left = S.dice.slice();
    S.phase = 'move'; S.opening = [a, b];
    save(); render(true);
    var first = S.players[S.cur];
    setTimeout(function () { Kit.callout((first.name === 'You' ? 'You go' : first.name + ' goes') + ' first'); }, 650);
    afterRollCheck(900);
  }
  function rnd() { return 1 + Math.floor(Math.random() * 6); }

  // ── Rules engine ──────────────────────────────────────────────────────────
  function own(pos, s, i) { var v = pos.p[i]; return s === 0 ? (v > 0 ? v : 0) : (v < 0 ? -v : 0); }
  function oppCount(pos, s, i) { return own(pos, 1 - s, i); }
  function allHome(pos, s) {
    if (pos.bar[s]) return false;
    for (var i = 0; i < 24; i++) if (own(pos, s, i) && (s === 0 ? i > 5 : i < 18)) return false;
    return true;
  }
  function singleMoves(pos, s, d) {
    var out = [];
    if (pos.bar[s]) {
      var e = s === 0 ? 24 - d : d - 1;
      if (oppCount(pos, s, e) < 2) out.push({ from: BAR, to: e, d: d });
      return out;
    }
    var home = allHome(pos, s);
    for (var i = 0; i < 24; i++) {
      if (!own(pos, s, i)) continue;
      var t = s === 0 ? i - d : i + d;
      if (t >= 0 && t <= 23) { if (oppCount(pos, s, t) < 2) out.push({ from: i, to: t, d: d }); }
      else if (home) {
        if (t === -1 || t === 24) out.push({ from: i, to: OFF, d: d });
        else {
          var further = false;
          for (var j = 0; j < 24; j++) if (own(pos, s, j) && (s === 0 ? j > i : j < i)) { further = true; break; }
          if (!further) out.push({ from: i, to: OFF, d: d });
        }
      }
    }
    return out;
  }
  function apply(pos, s, m) {
    var q = { p: pos.p.slice(), bar: pos.bar.slice(), off: pos.off.slice() }, sg = s === 0 ? 1 : -1, hit = false;
    if (m.from === BAR) q.bar[s]--; else q.p[m.from] -= sg;
    if (m.to === OFF) q.off[s]++;
    else {
      if (own(q, 1 - s, m.to) === 1) { q.p[m.to] = 0; q.bar[1 - s]++; hit = true; }
      q.p[m.to] += sg;
    }
    q.hit = hit;
    return q;
  }
  function without(arr, i) { var a = arr.slice(); a.splice(i, 1); return a; }
  function maxUse(pos, s, dice) {
    if (!dice.length) return 0;
    var best = 0, tried = {};
    for (var i = 0; i < dice.length; i++) {
      var d = dice[i]; if (tried[d]) continue; tried[d] = 1;
      var ms = singleMoves(pos, s, d);
      for (var k = 0; k < ms.length; k++) {
        var v = 1 + maxUse(apply(pos, s, ms[k]), s, without(dice, i));
        if (v > best) { best = v; if (best === dice.length) return best; }
      }
    }
    return best;
  }
  // Moves allowed right now: each must be the start of a play that uses as many dice as possible
  // (and the larger die when only one of two can be played).
  function legalMoves(pos, s, dice) {
    var need = maxUse(pos, s, dice); if (!need) return [];
    var res = [], tried = {};
    for (var i = 0; i < dice.length; i++) {
      var d = dice[i]; if (tried[d]) continue; tried[d] = 1;
      singleMoves(pos, s, d).forEach(function (m) {
        if (1 + maxUse(apply(pos, s, m), s, without(dice, i)) === need) res.push(m);
      });
    }
    if (need === 1 && dice.length === 2 && dice[0] !== dice[1]) {
      var hi = Math.max(dice[0], dice[1]);
      if (res.some(function (m) { return m.d === hi; })) res = res.filter(function (m) { return m.d === hi; });
    }
    return res;
  }
  function posKey(q) { return q.p.join(',') + '|' + q.bar.join(',') + '|' + q.off.join(','); }
  // Every distinct end position reachable with a full legal play (for the computer)
  function allPlays(pos, s, dice) {
    var need = maxUse(pos, s, dice), out = {}, seen = {};
    if (!need) return [];
    var hi = Math.max.apply(null, dice), mustHi = need === 1 && dice.length === 2 && dice[0] !== dice[1] && singleMoves(pos, s, hi).length > 0;
    (function rec(q, rem, path) {
      if (path.length === need) {
        if (mustHi && path[0].d !== hi) return;
        var k = posKey(q); if (!out[k]) out[k] = { pos: q, moves: path };
        return;
      }
      var sk = posKey(q) + '#' + rem.join(''); if (seen[sk]) return; seen[sk] = 1;
      var tried = {};
      for (var i = 0; i < rem.length; i++) {
        var d = rem[i]; if (tried[d]) continue; tried[d] = 1;
        singleMoves(q, s, d).forEach(function (m) { rec(apply(q, s, m), without(rem, i), path.concat([m])); });
      }
    })(pos, dice.slice(), []);
    return Object.keys(out).map(function (k) { return out[k]; });
  }
  function pips(pos, s) {
    var t = pos.bar[s] * 25;
    for (var i = 0; i < 24; i++) { var c = own(pos, s, i); if (c) t += c * (s === 0 ? i + 1 : 24 - i); }
    return t;
  }
  function contact(pos) {
    // any White checker still behind (higher index than) a Black checker?
    if (pos.bar[0] || pos.bar[1]) return true;
    var maxW = -1, minB = 24;
    for (var i = 0; i < 24; i++) { if (pos.p[i] > 0) maxW = Math.max(maxW, i); if (pos.p[i] < 0) minB = Math.min(minB, i); }
    return maxW > minB;
  }

  // ── Computer evaluation (from side s) ─────────────────────────────────────
  function dist(s, i) { return s === 0 ? i + 1 : 24 - i; }   // pips to bear off from point index i
  function evaluate(q, s) {
    var o = 1 - s, v = (pips(q, o) - pips(q, s)) * 1.0;
    v += (q.off[s] - q.off[o]) * 1.5;
    if (!contact(q)) return v * 1.6;
    var homeMade = 0, oppHomeMade = 0, run = 0, bestRun = 0, i;
    for (var k = 1; k <= 24; k++) {           // walk from s's home outwards
      i = s === 0 ? k - 1 : 24 - k;
      var c = own(q, s, i);
      if (c >= 2) {
        run++; bestRun = Math.max(bestRun, run);
        if (k <= 6) { homeMade++; v += 2.6 + (k === 5 || k === 4 ? 1 : 0); }
        else if (k === 7) v += 2.4;
        else if (k >= 19) v += 1.6;        // anchor in their home
        else v += 1.2;
        if (c > 4) v -= (c - 4) * 0.4;      // stacking
      } else run = 0;
      if (own(q, o, i) >= 2 && (k >= 19)) oppHomeMade++;
      if (c === 1) {
        // how many enemy checkers can hit this blot next turn
        var shots = 0;
        for (var j = 0; j < 24; j++) {
          var oc = own(q, o, j); if (!oc) continue;
          var gap = o === 0 ? j - i : i - j;
          if (gap >= 1 && gap <= 6) shots += 2; else if (gap > 6 && gap <= 12) shots += 0.6;
        }
        if (q.bar[o]) { var eg = o === 0 ? 24 - i : i + 1; if (eg >= 1 && eg <= 6) shots += 2.5; }
        var lost = 25 - k;   // pips we'd lose if hit
        v -= Math.min(shots, 8) * (0.55 + lost / 20);
      }
    }
    if (bestRun >= 3) v += (bestRun - 2) * (bestRun - 2) * 1.6;
    v += q.bar[o] * (3 + homeMade * 1.8);
    v -= q.bar[s] * (3 + oppHomeMade * 1.8);
    return v;
  }
  function bestPlay(s) {
    var plays = allPlays(S.pos, s, S.left);
    if (!plays.length) return null;
    var noise = S.level === 'easy' ? 9 : S.level === 'med' ? 2.2 : 0.3;
    var best = null, bv = -Infinity;
    plays.forEach(function (pl) {
      var v = evaluate(pl.pos, s) + Math.random() * noise;
      if (v > bv) { bv = v; best = pl; }
    });
    return best;
  }
  // Rough chance the side to roll wins, for cube decisions
  function winChance(s) {
    var q = S.pos, o = 1 - s;
    if (!contact(q)) {
      var a = pips(q, s), b = pips(q, o) + 4;  // being on roll is worth ~4 pips
      var lead = (b - a) / Math.max(a, 1);
      return 1 / (1 + Math.exp(-lead * 22));
    }
    var v = evaluate(q, s) - evaluate(q, o) * 0.3 + 4;
    return 1 / (1 + Math.exp(-v / 14));
  }

  // ── Turn flow ─────────────────────────────────────────────────────────────
  function curP() { return S.players[S.cur]; }
  function canDouble() {

  function roll(byCpu) {

  function afterRollCheck(wait) {

      if (!lm.length) {
        Kit.toast((curP().name === 'You' ? 'You have' : curP().name + ' has') + ' no legal moves');

  }
  function autoSelect() {

  function endTurn() {

  }

  function doMove(m, byCpu) {
    var s = S.cur, before = S.pos, fromXY = checkerXY(m.from, s, stackTop(before, s, m.from));
    var victimFrom = m.to !== OFF && own(before, 1 - s, m.to) === 1 ? checkerXY(m.to, 1 - s, 0) : null;

  // ── Computer turn ─────────────────────────────────────────────────────────

    var tk = ++cpuToken, s = S.cur;

      var done = doMove(play.moves[i++], true);

  }

  // ── Doubling cube ─────────────────────────────────────────────────────────

  function offerDouble(s) {

    Kit.callout((S.players[s].name === 'You' ? 'You double' : S.players[s].name + ' doubles') + ' to ' + S.cube * 2);
    if (S.players[o].cpu) {

    } else askDouble();
  }
  function askDouble() {
    var s = S.doubler, o = 1 - s, P = S.players;
    if (dblSheet) dblSheet.close();
    dblSheet = Kit.sheet({
      title: (P[s].name === 'You' ? 'You offer' : P[s].name + ' offers') + ' a double',
      html: '<p class="muted">' + Kit.esc(P[o].name) + ': <b>take</b> and play on for ' + (S.cube * 2) + ' points (you then own the cube), or <b>drop</b> and lose this game for ' + S.cube + (S.cube === 1 ? ' point' : ' points') + '.</p>',
      dismissible: false,
      actions: [
        { label: 'Take (play for ' + S.cube * 2 + ')', primary: true, onClick: function () { dblSheet = null; answerDouble(true); } },
        { label: 'Drop', cls: 'btn-soft', onClick: function () { dblSheet = null; answerDouble(false); } }

      Kit.sfx('good');

    } else {
      S.ms.drops.push({ who: o, cube: S.cube, game: S.gameNo });
      Kit.toast(P[o].name === 'You' ? 'You drop' : P[o].name + ' drops');
      finishGame(s, 1, 'drop');
    }
  }

  // ── Game and match end ───────────────────────────────────────────────────
  function gameOver(w) {
    var l = 1 - w, q = S.pos, mult = 1, how = 'single';
    if (q.off[l] === 0) {

    finishGame(w, mult, how);
  }
  function finishGame(w, mult, how) {

    var row = [0, 0]; row[w] = pts;
    S.games.push({ w: w, pts: pts, how: how, cube: S.cube, row: row, hits: S.gs.hits.slice(), pipsLeft: pips(S.pos, 1 - w) });
    if (how === 'gammon' || how === 'backgammon') S.ms.gammons.push({ w: w, how: how, game: S.gameNo, pts: pts });

    setTimeout(function () {
      Kit.sfx(P[w].cpu ? 'lose' : 'win');

        title: (name === 'You' ? 'You win' : name + ' wins') + ' game ' + S.gameNo,
        html: '<p class="muted">' + (how === 'drop' ? 'Double dropped. ' : how === 'single' ? '' : how === 'gammon' ? 'A gammon (double points). ' : 'A backgammon (triple points). ') +

          '<p style="margin-top:10px;font-weight:900;font-size:1.1rem">Match: ' + Kit.esc(P[0].name) + ' ' + S.score[0] + ' – ' + S.score[1] + ' ' + Kit.esc(P[1].name) + ' <span class="muted" style="font-weight:700">(first to ' + S.target + ')</span></p>',

  function endMatch() {

    if (S.ms.maxCube >= 2) hl.push('The cube went up to ' + S.ms.maxCube);
    S.ms.drops.forEach(function (d) { hl.push(P[d.who].name + ' dropped a double' + (S.games.length > 1 ? ' in game ' + d.game : '')); });
    var h = S.ms.hits;
    if (h[0] + h[1]) {
      var hw = h[0] >= h[1] ? 0 : 1;
      hl.push(P[hw].name + ' hit ' + h[hw] + ' checker' + (h[hw] === 1 ? '' : 's') + (h[1 - hw] ? ' (' + P[1 - hw].name + ' ' + h[1 - hw] + ')' : ''));
    }
    var dbl = S.ms.doubles;
    if (dbl[0] + dbl[1] >= 3) hl.push('Doubles rolled: ' + P[0].name + ' ' + dbl[0] + ', ' + P[1].name + ' ' + dbl[1]);
    var last = S.games[S.games.length - 1];
    if (last && last.how === 'single' && last.pipsLeft <= 12) hl.push('Close finish: ' + P[1 - last.w].name + ' had only ' + last.pipsLeft + ' pips to go');
    if (S.target > 1) hl.push('Match to ' + S.target + ', won ' + S.score[w] + '–' + S.score[1 - w] + ' over ' + S.games.length + ' games');

      started: S.started, mode: (S.mode === 'cpu' ? 'vs Computer' : 'Two players') + (S.target > 1 ? ' · match to ' + S.target : ''),
      players: P.map(function (p, i) { return { name: p.name, score: S.score[i], cpu: p.cpu }; }),
      winner: P[w].name,

      lose: lose, againLabel: 'Play again',

  // ── Undo ──────────────────────────────────────────────────────────────────
  function snapshot() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 60) undoStack.shift(); }
  function undo() {
    if (!S || !undoStack.length || S.phase === 'over') return Kit.toast('Nothing to undo');
    cpuToken++; rolling = false;
    if (dblSheet) { dblSheet.close(); dblSheet = null; }
    S = JSON.parse(undoStack.pop()); sel = null;
    if (S.phase === 'wait') S.phase = 'move';

    if (S.phase === 'move') autoSelect();
    save(); render();
    resumeFlow();
  }

  // ── Geometry ──────────────────────────────────────────────────────────────
  var G = null;
  function geometry() {
    var W = Math.min(app.clientWidth || 358, 600);
    var fw = Math.round(Math.max(8, W * 0.025)), bw = Math.round(W * 0.07), tw = Math.round(W * 0.085), dv = 3;
    var pw = (W - 2 * fw - bw - tw - dv) / 12, cd = Math.floor(pw * 0.96);
    var avail = (window.innerHeight || 800) - 58 - 2 * 56 - 26 - 62 - 34;
    var mg = Math.round(Math.max(cd * 1.9, 44)), pad = 3;
    var th = Math.round(Math.max(cd * 5, Math.min(cd * 6.2, (avail - 2 * fw - 2 * pad - mg) / 2)));
    var H = 2 * fw + 2 * pad + 2 * th + mg;
    var g = { W: W, H: H, fw: fw, bw: bw, tw: tw, pw: pw, cd: cd, th: th, mg: mg, pad: pad };
    g.fieldL = fw; g.barX = fw + 6 * pw; g.fieldR = g.barX + bw; g.trayX = g.fieldR + 6 * pw + dv;
    g.topY = fw + pad; g.botY = H - fw - pad;

  }
  // column (0-11, left to right) and row (top/bottom) of point index i
  function colOf(i) { if (i >= 12) return i <= 17 ? { c: i - 12, top: true } : { c: i - 12, top: true }; return i >= 6 ? { c: 11 - i, top: false } : { c: 11 - i, top: false }; }
  function colX(c) { return c < 6 ? G.fieldL + c * G.pw : G.fieldR + (c - 6) * G.pw; }
  function checkerXY(where, s, k) {
    var cd = G.cd;
    if (where === BAR) {
      var x = G.barX + G.bw / 2, mid = G.H / 2;
      // White's bar checkers sit in the upper half (they come back in top right), Black's lower
      var y = s === 0 ? mid - G.mg / 2 - cd / 2 - k * cd * 0.8 : mid + G.mg / 2 + cd / 2 + k * cd * 0.8;
      return { x: x, y: y };
    }
    if (where === OFF) {
      var tx = G.trayX + G.tw / 2, sh = Math.max(4, Math.floor(G.th / 16));
      return s === 0 ? { x: tx, y: G.botY - 2 - k * sh - sh / 2 } : { x: tx, y: G.topY + 2 + k * sh + sh / 2 };
    }
    var cc = colOf(where), n = Math.max(1, own(S.pos, s, where) || 1);
    var step = n <= 5 ? cd : (G.th - cd) / (n - 1);
    var px = colX(cc.c) + G.pw / 2;
    return cc.top ? { x: px, y: G.topY + cd / 2 + k * step } : { x: px, y: G.botY - cd / 2 - k * step };
  }

  // ── Render ────────────────────────────────────────────────────────────────
  var boardEl;
  function render(diceRoll, anim) {
    if (!S) return;
    G = geometry();
    var s = S.cur, me = curP(), q = S.pos, P = S.players;
    var human = !me.cpu && S.phase === 'move' && !rolling;
    var lm = human ? legalMoves(q, s, S.left) : [];
    var froms = {}, dests = {};
    lm.forEach(function (m) { froms[m.from] = 1; if (sel != null && m.from === sel) dests[m.to] = 1; });

    app.innerHTML = '';
    var wrap = el('div', { class: 'bgw' });
    wrap.appendChild(tag(1));
    boardEl = el('div', { class: 'bboard', style: { width: G.W + 'px', height: G.H + 'px', '--cd': G.cd + 'px' } });
    // felt halves, bar, tray
    boardEl.appendChild(el('div', { class: 'field', style: { left: G.fieldL + 'px', top: G.fw + 'px', width: 6 * G.pw + 'px', height: (G.H - 2 * G.fw) + 'px' } }));
    boardEl.appendChild(el('div', { class: 'field', style: { left: G.fieldR + 'px', top: G.fw + 'px', width: 6 * G.pw + 'px', height: (G.H - 2 * G.fw) + 'px' } }));
    boardEl.appendChild(el('div', { class: 'barstrip', style: { left: G.barX + 'px', top: 0, width: G.bw + 'px', height: G.H + 'px' } }));
    var tray = el('div', { class: 'traystrip', style: { left: G.trayX + 'px', top: G.fw + 'px', width: G.tw + 'px', height: (G.H - 2 * G.fw) + 'px', 'border-radius': '4px' } });
    var wellH = G.th + G.pad;
    tray.appendChild(el('div', { class: 'well', style: { top: '0px', height: wellH + 'px' } }));
    tray.appendChild(el('div', { class: 'well', style: { bottom: '0px', height: wellH + 'px' } }));
    boardEl.appendChild(tray);
    // points
    for (var i = 0; i < 24; i++) {
      (function (i) {
        var cc = colOf(i), x = colX(cc.c);
        var t = el('div', { class: 'tri ' + (cc.top ? 'dn ' : 'up ') + ((cc.c + (cc.top ? 0 : 1)) % 2 ? 'b' : 'a') + (dests[i] ? ' dest' : ''),
          style: { left: (x + 1) + 'px', width: (G.pw - 2) + 'px', top: (cc.top ? G.topY - G.pad + 1 : G.botY - G.th * 1.02) + 'px', height: (G.th * 1.02) + 'px' } }, [el('i')]);
        boardEl.appendChild(t);
        boardEl.appendChild(el('div', { class: 'pnum', text: String(i + 1), style: { left: (x + G.pw / 2) + 'px', top: (cc.top ? G.topY + G.th + 3 : G.botY - G.th - 13) + 'px' } }));
        var hit = el('button', { type: 'button', class: 'hit', 'aria-label': 'Point ' + (i + 1),
          style: { left: x + 'px', width: G.pw + 'px', top: (cc.top ? G.fw : G.H / 2) + 'px', height: (G.H / 2 - G.fw) + 'px' } });
        hit.addEventListener('click', function () { tapPoint(i); });
        boardEl.appendChild(hit);
      })(i);
    }
    var barHit = el('button', { type: 'button', class: 'hit', 'aria-label': 'Bar', style: { left: G.barX + 'px', width: G.bw + 'px', top: 0, height: G.H + 'px' } });
    barHit.addEventListener('click', function () { tapPoint(BAR); });
    boardEl.appendChild(barHit);
    // borne-off slabs + bear-off target
    var sh = Math.max(4, Math.floor(G.th / 16));
    [0, 1].forEach(function (pl) {
      for (var k = 0; k < q.off[pl]; k++) {
        var c = checkerXY(OFF, pl, k);
        boardEl.appendChild(el('div', { class: 'slab ' + (pl ? 'b' : 'w'), style: { left: (G.trayX + 3) + 'px', width: (G.tw - 6) + 'px', top: (c.y - sh / 2) + 'px', '--sh': (sh - 1) + 'px' } }));
      }
    });
    var offEl = el('button', { type: 'button', class: 'offhit' + (dests[OFF] ? ' dest' : ''), 'aria-label': 'Bear off',
      style: { left: G.trayX + 'px', width: G.tw + 'px', top: (s === 0 ? G.H / 2 : G.fw) + 'px', height: (G.H / 2 - G.fw) + 'px' } });
    offEl.addEventListener('click', tapOff);
    boardEl.appendChild(offEl);
    // checkers
    var moved = null, victim = null;
    for (i = 0; i < 24; i++) {
      [0, 1].forEach(function (pl) {
        var n = own(q, pl, i); if (!n) return;
        for (var k = 0; k < n; k++) {
          var c = checkerXY(i, pl, k), top = k === n - 1;
          var e = mkChecker(pl, c, top && n > 5 ? n : '');
          if (top && pl === s && human) { if (sel === i) e.classList.add('sel'); else if (sel == null && froms[i]) e.classList.add('can'); }
          if (anim && top && pl === anim.s && anim.m.to === i) moved = e;
          boardEl.appendChild(e);
        }
      });
    }
    [0, 1].forEach(function (pl) {
      for (var k = 0; k < q.bar[pl]; k++) {
        var c = checkerXY(BAR, pl, Math.min(k, 3)), top = k === q.bar[pl] - 1;
        var e = mkChecker(pl, c, top && q.bar[pl] > 1 ? q.bar[pl] : '');
        if (top && pl === s && human) e.classList.add(sel === BAR ? 'sel' : 'can');
        if (anim && anim.victim && pl !== anim.s && top) victim = e;
        boardEl.appendChild(e);
      }
    });
    if (anim && anim.m.to === OFF) {
      var oc = checkerXY(OFF, anim.s, q.off[anim.s] - 1);
      moved = mkChecker(anim.s, oc, ''); moved.style.opacity = '0'; moved.style.transition = 'transform .42s, opacity .42s .2s';
      boardEl.appendChild(moved);
    }
    // dice
    if (S.dice.length && (S.phase === 'move' || S.phase === 'wait')) boardEl.appendChild(diceBox(diceRoll));
    if (S.phase === 'roll' || S.phase === 'double' || S.phase === 'over') {
      var msg = S.phase === 'over' ? 'Game over' : S.phase === 'double' ? '' : me.cpu ? '' : '';
      if (msg) boardEl.appendChild(el('div', { class: 'msg', text: msg, style: { top: (G.H / 2 - 9) + 'px' } }));
    }
    // cube
    if (S.cubeOn && !S.crawford) {
      var cs = Math.round(Math.min(G.tw - 4, 28)), cy = S.owner === -1 ? G.H / 2 - cs / 2 : S.owner === 0 ? G.H / 2 + 2 : G.H / 2 - cs - 2;
      if (S.phase === 'double') cy = S.doubler === 0 ? G.H / 2 - cs - 2 : G.H / 2 + 2;
      var cube = el('div', { class: 'cube' + (S.phase === 'double' ? ' pop' : ''), text: String(S.phase === 'double' ? S.cube * 2 : S.cube === 1 ? 64 : S.cube),
        style: { width: cs + 'px', height: cs + 'px', left: (G.trayX + (G.tw - cs) / 2) + 'px', top: cy + 'px', 'font-size': (cs * 0.5) + 'px' } });
      boardEl.appendChild(cube);
    }
    wrap.appendChild(boardEl);
    wrap.appendChild(tag(0));
    wrap.appendChild(hintLine(human, lm));
    wrap.appendChild(controls(human));
    app.appendChild(wrap);

    // fly animations (FLIP)
    if (anim && moved) fly(moved, anim.from);
    if (anim && victim && anim.victim) fly(victim, anim.victim);
  }
  function fly(e, from) {
    var to = { x: parseFloat(e.dataset.x), y: parseFloat(e.dataset.y) };
    e.classList.add('fly');
    e.style.transform = 'translate(' + (from.x - G.cd / 2) + 'px,' + (from.y - G.cd / 2) + 'px)';
    void e.offsetWidth;
    e.classList.remove('fly');
    e.style.zIndex = 30;
    e.style.transform = 'translate(' + (to.x - G.cd / 2) + 'px,' + (to.y - G.cd / 2) + 'px)';
    setTimeout(function () { e.style.zIndex = ''; }, 450);
  }
  function mkChecker(pl, c, label) {
    var e = el('div', { class: 'ck ' + (pl ? 'b' : 'w'), text: label ? String(label) : '' });
    e.dataset.x = c.x; e.dataset.y = c.y;
    e.style.transform = 'translate(' + (c.x - G.cd / 2) + 'px,' + (c.y - G.cd / 2) + 'px)';
    return e;
  }
  function diceBox(rollAnim) {
    var s = S.cur, dice = S.dice[0] === S.dice[1] ? [S.dice[0], S.dice[0], S.dice[0], S.dice[0]] : S.dice.slice();
    var opening = S.opening;
    var left = S.left.slice(), used = dice.map(function (d) { var k = left.indexOf(d); if (k >= 0) { left.splice(k, 1); return false; } return true; });
    var ds = Math.min(G.mg - 8, dice.length === 4 ? G.pw * 1.15 : 36);
    // each player rolls into the half on their right: White (bottom) the right half, Black the left half
    var x = s === 0 ? G.fieldR : G.fieldL;
    var box = el('div', { class: 'dicebox' + (s && !opening ? ' blk' : ''), style: { left: x + 'px', width: 6 * G.pw + 'px', top: (G.H / 2 - G.mg / 2) + 'px', height: G.mg + 'px', gap: (ds * 0.22) + 'px' } });
    dice.forEach(function (v, i) {
      var d = Kit.die(v); d.tabIndex = -1; d.style.setProperty('--ds', ds + 'px');
      if (opening) {   // opening roll: one die each, coloured by who threw it (the higher one is the starter's)
        var who = i === 0 ? s : 1 - s;
        d.classList.add(who ? 'bd' : 'wd');
      }
      if (used[i]) d.classList.add('used');
      if (rollAnim) {
        d.classList.add('rolling'); d.style.animationDelay = (i * 60) + 'ms';
        d.style.setProperty('--dx', ((s === 0 ? -1 : 1) * (40 + Math.random() * 60)) + 'px');
        d.style.setProperty('--dr', ((Math.random() > .5 ? 1 : -1) * (260 + Math.random() * 300)) + 'deg');
      }
      box.appendChild(d);
    });
    return box;
  }
  function tag(pl) {
    var p = S.players[pl], on = S.phase !== 'over' && S.cur === pl;
    var chk = el('span', { class: 'chk' }, [el('span', { class: 'ck ' + (pl ? 'b' : 'w'), style: { '--cd': '30px', transform: 'none', position: 'absolute' } })]);
    var st = S.phase === 'over' ? (S.games.length && S.games[S.games.length - 1].w === pl ? 'Won this game' : '') :
      !on ? (pl === 0 ? 'White · home bottom right' : 'Black · home top right') :
      S.phase === 'double' ? (S.doubler === pl ? 'Doubling…' : 'Take or drop?') :
      p.cpu ? (S.phase === 'roll' ? 'Thinking…' : 'Moving…') : S.phase === 'roll' ? 'Your roll' : 'Your move';
    if (S.phase === 'double' && S.doubler !== pl) st = p.cpu ? 'Deciding…' : 'Take or drop?';
    var nums = el('span', { class: 'nums' }, [
      el('span', { class: 'num' }, [el('b', { text: String(pips(S.pos, pl)) }), el('small', { text: 'pips' })]),
      el('span', { class: 'num' }, [el('b', { text: S.pos.off[pl] + '' }), el('small', { text: 'off' })])
    ]);
    if (S.target > 1) nums.appendChild(el('span', { class: 'num' }, [el('b', { text: String(S.score[pl]) }), el('small', { text: 'of ' + S.target })]));
    return el('div', { class: 'btag' + (on ? ' on' : '') }, [chk, el('span', { class: 'col' }, [el('span', { class: 'nm', text: p.name }), el('span', { class: 'st', text: st })]), nums]);
  }
  function hintLine(human, lm) {
    var t = '';
    if (S.crawford && S.phase !== 'over') t = 'Crawford game: no doubling';
    if (human) {
      if (S.pos.bar[S.cur]) t = 'Tap a gold point to come in from the bar';
      else if (sel != null) t = lm.some(function (m) { return m.from === sel && m.to === OFF; }) ? (lm.some(function (m) { return m.from === sel && m.to !== OFF; }) ? 'Tap a gold point, or the tray to bear off' : 'Tap the glowing tray to bear off') : 'Tap a gold point';
      else t = 'Tap a glowing checker';
    } else if (S.phase === 'roll' && !curP().cpu) t = S.mode === '2p' ? Kit.poss(curP().name) + ' roll' : '';
    return el('div', { class: 'hint', text: t });
  }
  function controls(human) {
    var c = el('div', { class: 'ctrl' }), me = curP();
    if (S.phase === 'roll' && !me.cpu) {
      if (S.cubeOn && !S.crawford && S.mode) {
        var db = el('button', { type: 'button', class: 'btn btn-soft', html: '<span>Double</span>', onclick: humanDouble });
        db.disabled = !canDouble();
        c.appendChild(db);
      }
      c.appendChild(el('button', { type: 'button', class: 'btn btn-primary', html: Kit.icon('dice') + '<span>Roll</span>', onclick: function () { roll(false); } }));
    } else if (S.phase === 'over') {
      if (S.score[0] < S.target && S.score[1] < S.target) c.appendChild(el('button', { type: 'button', class: 'btn btn-primary', text: 'Next game', onclick: newGame }));
    } else if (human && undoStack.length) {
      c.appendChild(el('button', { type: 'button', class: 'btn btn-soft', html: Kit.icon('undo') + '<span>Undo move</span>', onclick: undo }));
    }
    return c;
  }

  // ── Resume ────────────────────────────────────────────────────────────────
  function resumeFlow() {
    if (!S || S.phase === 'over') return;
    if (S.phase === 'double') {
      if (S.players[1 - S.doubler].cpu) { var tk = ++cpuToken; setTimeout(function () { if (tk === cpuToken) answerDouble(winChance(S.doubler) < 0.78); }, 900); }
      else askDouble();
      return;
    }
    if (S.phase === 'wait') { S.phase = 'move'; }
    if (S.phase === 'roll') { if (curP().cpu) cpuTurn(); return; }
    if (S.phase === 'move') {
      var lm = legalMoves(S.pos, S.cur, S.left);
      if (!lm.length) { var tk2 = cpuToken; setTimeout(function () { if (tk2 === cpuToken) endTurn(); }, 600); return; }
      if (curP().cpu) cpuMoves(); else { autoSelect(); render(); }
    }
  }
  var rT = null;
  window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(function () { if (S && S.pos) render(); }, 150); });

  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.pos && saved.players && (saved.phase !== 'over' || (saved.score[0] < saved.target && saved.score[1] < saved.target))) { S = saved; render(); resumeFlow(); }
  else showSetup();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spades Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.spad .goal b{color:#c8102e;font-weight:400;}
/* Nil calls under each team's bid: a toggle per partner, Blind, then the Nil player's tricks */
.sp-nil{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.sp-nil .full{grid-column:1/-1;}
.sp-nil .tk{display:flex;flex-direction:column;gap:1px;}
.sp-nil .tk small{font-family:var(--hand);font-size:.8rem;line-height:1;color:#6a6a80;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp-nil .tk .sp-step > button{height:24px;}
.spad td .sp-nil .sp-step input.cell{height:30px;font-size:1.15rem;}
.spad td .who{display:block;font-family:var(--hand);font-size:.82rem;line-height:1;color:#6a6a80;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null, cfg = null;
  var SETUP = 'spades_pad_setup';

  Kit.init({
    id: 'spades', title: 'Spades score',
    onNew: function () { if (pad) pad.clear(); try { localStorage.removeItem(SETUP); } catch (e) {} pad = null; showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history('sp', { keys: ['spades'], title: 'Spades: past games' }); } }],
    rules:
      '<p class="goal">Play Spades with a real deck and keep score here. Two teams of two, partners sit across from each other. First team to the target wins.</p>' +
      '<h3>Each hand</h3><ul><li>Deal all 52 cards, 13 each. Starting left of the dealer, everyone bids how many tricks they will win.</li>' +
      '<li>A team\'s goal is both partners\' bids added together.</li>' +
      '<li>Spades are trump. You must follow suit if you can. Spades can\'t be led until one has been played on another suit (unless you only have spades).</li></ul>' +
      '<h3>Keeping score</h3><p>The open rows on the sheet are this hand, one column per team.</p><ul><li><b>Bid</b>: the team\'s total bid (if someone bid Nil, just the partner\'s bid). Set it after bidding.</li>' +
      '<li><b>Nil</b>: tap the name of anyone who bid Nil (both names if both did), and <b>Blind</b> if it was Blind Nil. Then set how many tricks the Nil player took.</li>' +
      '<li><b>Won</b>: all the tricks the team took, including any the Nil player took. Fill one team and the other gets the rest of the 13.</li>' +
      '<li>Tap <b>Lock hand</b> to write it in. Made a mistake? Tap a hand on the sheet to change or delete it right there.</li></ul>' +
      '<h3>Scoring</h3><ul><li><b>Make it:</b> 10 per trick bid, +1 for each extra trick (a <b>bag</b>).</li>' +
      '<li><b>Set:</b> lose 10 per trick bid.</li>' +
      '<li><b>Bags:</b> every 10 bags costs 100 points (can be turned off at setup).</li>' +
      '<li><b>Nil:</b> +100 if they take no tricks, −100 if they take any. <b>Blind Nil</b> (called before looking at your cards) is ±200. The Nil player\'s tricks don\'t help the partner\'s bid but count as bags.</li></ul>'
  });

  function showSetup() {
    Kit.setup(app, {
      intro: 'Keep score for a real game. Players 1 & 2 are one team, 3 & 4 the other.',
      players: { min: 4, max: 4, count: 4, label: 'Team 1: players 1 & 2 · Team 2: players 3 & 4' },
      options: [
        { id: 'target', label: 'Play to', help: 'The first team to reach this many points wins.', value: 500, choices: [[300, '300'], [500, '500']] },
        { id: 'bags', label: 'Bag penalty (10 bags = −100)', help: 'Bags are extra tricks a team takes beyond its bid.', value: 1, choices: [[1, 'On', 'Every 10 bags a team collects costs them 100 points.'], [0, 'Off', 'Extra tricks are worth 1 point each with no penalty.']] }
      ],
      start: 'Start scoring',
      onStart: function (c) {
        var n = c.players.map(function (p) { return p.name; });
        try { localStorage.setItem(SETUP, JSON.stringify({ teams: [[n[0], n[1]], [n[2], n[3]]], target: +c.options.target || 500, bags: +c.options.bags !== 0 })); } catch (e) {}
        startPad();
      }
    });
  }

  // ── Scoring one team's hand ───────────────────────────────────────────────
  // in = {bid, tricks, nil: -1|0|1 (which partner), blind, nilTook}; prevBags = bags carried in
  function score(inp, prevBags, bagRule) {
    var r = { pts: 0, bags: 0, penalty: 0, set: false, made: false, nilOk: null };
    if (inp.nil === 2) { // both partners bid Nil: each Nil scores on its own, every trick is a bag
      var v2 = inp.blind ? 200 : 100;
      [inp.nilTook, inp.nilTook2].forEach(function (t) { r.pts += t === 0 ? v2 : -v2; });
      r.nilOk = inp.nilTook === 0 && inp.nilTook2 === 0;
      r.pts += inp.tricks; r.bags += inp.tricks;
      if (bagRule) { var tb = prevBags + r.bags; r.penalty = Math.floor(tb / 10) - Math.floor(prevBags / 10); r.pts -= 100 * r.penalty; }
      return r;
    }
    var forBid = inp.tricks - (inp.nil >= 0 ? inp.nilTook : 0);
    if (inp.bid > 0) {
      if (forBid >= inp.bid) { r.made = true; r.pts += 10 * inp.bid + (forBid - inp.bid); r.bags += forBid - inp.bid; }
      else { r.set = true; r.pts -= 10 * inp.bid; }
    } else if (forBid > 0) { r.pts += forBid; r.bags += forBid; }
    if (inp.nil >= 0) {
      var v = inp.blind ? 200 : 100;
      r.nilOk = inp.nilTook === 0;
      r.pts += r.nilOk ? v : -v;
      r.pts += inp.nilTook; r.bags += inp.nilTook;
    }
    if (bagRule) { var total = prevBags + r.bags; r.penalty = Math.floor(total / 10) - Math.floor(prevBags / 10); r.pts -= 100 * r.penalty; }
    return r;
  }
  // Each round's per-team note doubles as the record of what was entered.
  function detail(inp, r, names) {
    var parts = [];
    if (inp.nil === 2) parts.push('both' + (inp.blind ? ' blind' : '') + ' nil ' + inp.nilTook + '/' + inp.nilTook2);
    else if (inp.nil >= 0) parts.push(names[inp.nil] + (inp.blind ? ' blind nil' : ' nil') + (inp.nilTook ? ' took ' + inp.nilTook : ' made'));
    parts.push(inp.bid + ' bid, ' + inp.tricks + ' won');
    if (r.bags) parts.push('+' + r.bags + ' bag' + (r.bags === 1 ? '' : 's'));
    if (r.penalty) parts.push('bag penalty');
    return parts.join(' · ');
  }
  function parse(d, names) {
    var inp = { bid: 0, tricks: 0, nil: -1, blind: false, nilTook: 0 };
    if (!d) return null;
    var m = /(\d+) bid, (\d+) won/.exec(d); if (!m) return null;
    inp.bid = +m[1]; inp.tricks = +m[2];
    var both = /^both( blind)? nil (\d+)\/(\d+)/.exec(d);
    if (both) { inp.nil = 2; inp.blind = !!both[1]; inp.nilTook = +both[2]; inp.nilTook2 = +both[3]; return inp; }
    names.forEach(function (n, j) {
      var k = d.indexOf(n + ' blind nil') === 0 ? 'b' : d.indexOf(n + ' nil') === 0 ? 'n' : '';
      if (k && inp.nil < 0) { inp.nil = j; inp.blind = k === 'b'; var t = /nil took (\d+)/.exec(d); inp.nilTook = t ? +t[1] : 0; }
    });
    return inp;
  }
  function bagsOf(d) { var m = /\+(\d+) bags?/.exec(d || ''); return m ? +m[1] : 0; }
  function bagsBefore(roundIdx, rounds) {
    var b = [0, 0], rs = rounds || (pad ? pad.state().rounds : []);
    rs.slice(0, roundIdx).forEach(function (r) { [0, 1].forEach(function (i) { b[i] += bagsOf(r.detail && r.detail[i]); }); });
    return b;
  }

  function startPad() {
    try { cfg = JSON.parse(localStorage.getItem(SETUP)); } catch (e) { cfg = null; }
    if (!cfg || !cfg.teams) return showSetup();
    var teamNames = cfg.teams.map(function (t) { return t[0] + ' & ' + t[1]; });
    pad = Scorepad(app, {
      key: 'sp', title: 'Spades', mode: 'Scorekeeper', target: cfg.target,
      sides: teamNames.map(function (n) { return { name: n }; }),
      goal: 'First to ' + cfg.target,
      isOver: function (t) { return Math.max(t[0], t[1]) >= cfg.target && t[0] !== t[1]; },
      entryRows: entryRows, onLock: lockHand, lockLabel: 'Lock hand'
    });
    watchGoal();
  }

  // Show current bags under the pad (Scorepad re-renders, so watch for it)
  var obs = null;
  function watchGoal() {
    if (obs) obs.disconnect();
    function paint() {
      var g = app.querySelector('.spad .goal'); if (!g || !pad) return;
      var n = pad.state().rounds.length, b = bagsBefore(n);
      var txt = 'First to ' + cfg.target + (cfg.bags ? ' · bags ' + (b[0] % 10) + ' and ' + (b[1] % 10) + ' (10 = −100)' : '');
      if (g.textContent !== txt) g.textContent = txt;
    }
    obs = new MutationObserver(paint);
    obs.observe(app, { childList: true, subtree: true });
    paint();
  }

  // ── The open hand on the sheet: per team a Bid, the Nil calls, and tricks Won ──
  // st = {bid:[b,b], tr:[t,t], nil:[-1|0|1|2,…], blind:[bool,bool], tk:[[a,b],[a,b]], touched:[bool,bool]}
  function blankEntry() { return { bid: [null, null], tr: [null, null], nil: [-1, -1], blind: [false, false], tk: [[0, 0], [0, 0]], touched: [false, false] }; }
  function fromRound(r) {
    var st = blankEntry();
    [0, 1].forEach(function (i) {
      var p = parse(r.detail && r.detail[i], cfg.teams[i]); if (!p) return;
      st.bid[i] = p.nil === 2 ? 0 : p.bid; st.tr[i] = p.tricks; st.nil[i] = p.nil; st.blind[i] = p.nil >= 0 && p.blind;
      if (p.nil === 2) st.tk[i] = [p.nilTook, p.nilTook2 || 0];
      else if (p.nil >= 0) st.tk[i][p.nil] = p.nilTook;
      st.touched[i] = true;
    });
    return st;
  }
  function inputOf(st, i) {
    var nil = st.nil[i], tk = st.tk[i];
    return { bid: nil === 2 ? 0 : Math.max(0, Math.min(13, st.bid[i] || 0)), tricks: Math.max(0, Math.min(13, st.tr[i] || 0)), nil: nil, blind: nil >= 0 && st.blind[i],
      nilTook: nil === 2 ? tk[0] : nil >= 0 ? tk[nil] : 0, nilTook2: nil === 2 ? tk[1] : 0,
      empty: (nil !== 2 && st.bid[i] == null) || st.tr[i] == null };
  }
  function nilSet(v) { return v === 2 ? [true, true] : v === 0 ? [true, false] : v === 1 ? [false, true] : [false, false]; }
  function nilVal(a) { return a[0] && a[1] ? 2 : a[0] ? 0 : a[1] ? 1 : -1; }

  function entryRows(ctx) {
    var st = ctx.editing ? fromRound(ctx.prev) : (ctx.draft() || blankEntry());
    var prevBags = bagsBefore(ctx.index, ctx.rounds);
    var rowBid = el('tr', { class: 'open' }, [el('th', { class: 'rn' }, [String(ctx.round), el('small', { text: 'BID' })])]);
    var rowNil = el('tr', { class: 'sub' }, [el('th', { class: 'rn', text: 'NIL' })]);
    var rowWon = el('tr', { class: 'open' }, [el('th', { class: 'rn' }, [el('small', { text: 'WON' })])]);
    var cols = [0, 1].map(function (i) {
      var names = cfg.teams[i], c = {};
      c.who = el('small', { class: 'who' });
      c.bid = Scorepad.step({ value: st.bid[i], min: 0, max: 13, label: ctx.sides[i].name + ' bid', onChange: function (v) { st.bid[i] = v; refresh(); } });
      c.beq = el('small', { class: 'eq' });
      rowBid.appendChild(el('td', null, [c.who, c.bid, c.beq]));
      var box = el('div', { class: 'sp-nil' });
      c.nilB = names.map(function (nm, j) {
        var b = Scorepad.tog(nm + ' nil', { cls: 'gold', aria: nm + ' bid Nil', onClick: function () { var a = nilSet(st.nil[i]); a[j] = !a[j]; st.nil[i] = nilVal(a); if (st.nil[i] === 2) st.bid[i] = 0; refresh(); } });
        box.appendChild(b); return b;
      });
      c.blind = Scorepad.tog('Blind Nil (±200)', { cls: 'bad full', aria: ctx.sides[i].name + ' Blind Nil', onClick: function () { st.blind[i] = !st.blind[i]; refresh(); } });
      box.appendChild(c.blind);
      c.tk = names.map(function (nm, j) {
        var w = el('div', { class: 'tk' }, [el('small', { text: nm + ' took' })]);
        var stp = Scorepad.step({ value: st.tk[i][j], min: 0, max: 13, label: nm + ' Nil tricks taken', onChange: function (v) { st.tk[i][j] = v || 0; refresh(); } });
        w.appendChild(stp); box.appendChild(w); return w;
      });
      rowNil.appendChild(el('td', null, [box]));
      c.tr = Scorepad.step({ value: st.tr[i], min: 0, max: 13, label: ctx.sides[i].name + ' tricks won', onChange: function (v) {
        st.tr[i] = v; st.touched[i] = true;
        var o = 1 - i; // fill in the other team's tricks so they add up to 13
        if (!st.touched[o] && v != null) { st.tr[o] = Math.max(0, 13 - Math.min(13, v)); cols[o].tr.set(st.tr[o]); }
        refresh();
      } });
      c.weq = el('small', { class: 'eq' });
      rowWon.appendChild(el('td', null, [c.tr, c.weq]));
      return c;
    });
    function refresh() {
      var ins = [0, 1].map(function (i) { return inputOf(st, i); }), pts = [0, 0];
      ins.forEach(function (inp, i) {
        var c = cols[i], names = cfg.teams[i], on = nilSet(st.nil[i]);
        c.nilB.forEach(function (b, j) { b.set(on[j]); });
        c.blind.hidden = st.nil[i] < 0; c.blind.set(st.blind[i] && st.nil[i] >= 0);
        c.tk.forEach(function (w, j) { w.hidden = !on[j]; });
        c.bid.disable(st.nil[i] === 2); if (st.nil[i] === 2) c.bid.set(0);
        c.who.textContent = st.nil[i] === 2 ? 'both Nil' : st.nil[i] >= 0 ? names[1 - st.nil[i]] + ' bid' : 'team bid';
        c.beq.textContent = '';
        c.weq.className = 'eq';
        if (inp.empty) { c.weq.textContent = ''; return; }
        var r = score(inp, prevBags[i], cfg.bags);
        pts[i] = r.pts;
        c.weq.textContent = (r.set ? 'set ' : '') + (r.pts > 0 ? '+' : r.pts < 0 ? '−' : '') + Math.abs(r.pts) + (r.bags ? ' · ' + r.bags + ' bag' + (r.bags === 1 ? '' : 's') : '') + (r.penalty ? ' · −100!' : '');
        c.weq.classList.add(r.pts < 0 ? 'bad' : 'good');
        if (st.nil[i] >= 0) c.beq.textContent = r.nilOk ? 'nil made' : 'nil broken';
      });
      ctx.pending(pts);
      var sum = ins[0].tricks + ins[1].tricks;
      if (ins.some(function (x) { return x.empty; })) ctx.status('Enter each team\'s bid and tricks won.', 'wait');
      else if (sum !== 13) ctx.status('Tricks add up to ' + sum + '. There are 13.', sum > 13 ? false : 'wait');
      else if (ins.some(function (x) { return x.nil === 2 && x.nilTook + x.nilTook2 !== x.tricks; })) ctx.status('With both on Nil, their tricks must add up to the team\'s tricks.', false);
      else if (ins.some(function (x) { return x.nil >= 0 && x.nil < 2 && x.nilTook > x.tricks; })) ctx.status('The Nil player can\'t take more tricks than their team.', false);
      else if (ins.some(function (x) { return x.nil < 0 && x.bid < 1; })) ctx.status('A team bid of 0 needs a Nil. Tap who bid Nil.', false);
      else ctx.status('Looks right.', true);
      if (!ctx.editing) ctx.draft(st);
    }
    refresh();
    ctx.entry = { st: st, prevBags: prevBags };
    return [rowBid, rowNil, rowWon];
  }

  function lockHand(ctx) {
    var st = ctx.entry.st, prevBags = ctx.entry.prevBags;
    var ins = [0, 1].map(function (i) { return inputOf(st, i); });
    var res = ins.map(function (inp, i) { return score(inp, prevBags[i], cfg.bags); });
    var extra = { highlights: [], detail: ins.map(function (inp, i) { return detail(inp, res[i], cfg.teams[i]); }) };
    var n = ctx.round, callout = null;
    res.forEach(function (r, i) {
      var team = ctx.sides[i].name, inp = ins[i];
      if (r.set) { extra.highlights.push(team + ' went set bidding ' + inp.bid + ' in round ' + n); callout = callout || 'Set!'; }
      else if (r.made && inp.bid >= 9 && !pad.state().rounds.some(function (rr) { return (rr.highlights || []).some(function (h) { return h.indexOf(team + ' made a big bid') === 0; }); })) extra.highlights.push(team + ' made a big bid of ' + inp.bid + ' in round ' + n);
      if (inp.nil === 2) {
        var k2 = inp.blind ? 'Blind Nil' : 'Nil';
        extra.highlights.push(ctx.sides[i].name + ' both bid ' + k2 + ' in round ' + n + (r.nilOk ? ' and both made it!' : ''));
        if (r.nilOk) callout = 'Double ' + k2 + '!';
      } else if (inp.nil >= 0) {
        var who = cfg.teams[i][inp.nil], kind = inp.blind ? 'Blind Nil' : 'Nil';
        if (r.nilOk) { extra.highlights.push(who + ' made ' + kind + ' in round ' + n); callout = kind + ' made!'; }
        else extra.highlights.push(Kit.poss(who) + ' ' + kind + ' was broken in round ' + n);
      }
      if (r.penalty) { extra.highlights.push('Bag penalty hit ' + team + ' in round ' + n); callout = callout || 'Bag penalty!'; }
      if (inp.tricks === 13) extra.highlights.push(team + ' took all 13 tricks in round ' + n);
    });
    if (!ctx.editing && callout) extra.callout = callout;
    ctx.done(res.map(function (r) { return r.pts; }), extra);
  }

  var hasSetup = false; try { hasSetup = !!localStorage.getItem(SETUP); } catch (e) {}
  if (hasSetup) startPad(); else showSetup();
})();
</script>
</body>
</html>

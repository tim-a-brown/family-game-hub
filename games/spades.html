<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spades Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.tblock{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r);background:var(--w04);border-left:4px solid var(--c);}
.tblock h3{font-size:1.05rem;font-weight:900;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tblock .label{margin:2px 0 0;}
.tblock .seg{flex-wrap:wrap;}
.tblock .seg > button{min-height:40px;}
.tblock .res{font-weight:800;font-size:.9rem;color:var(--text-2);}
.tblock .res b{color:var(--text);}
.tblock .res b.neg{color:var(--red);}
.tblock .res b.pos{color:var(--green);}
.spad .goal b{color:#c8102e;font-weight:400;}
.tblock .rrow{padding:6px 8px;gap:8px;}
.tblock .rrow .avatar{display:none;}
.tblock .rrow .num{width:64px;}
/* Wide, short screens (iPad landscape): the two teams side by side so the form fits without scrolling */
@media (orientation:landscape) and (min-width:700px) and (max-height:900px){
  .rform:has(> .tblock){display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:10px;}
  .rform:has(> .tblock) > :not(.tblock){grid-column:1/-1;}
  .tblock{min-width:0;padding:10px;gap:6px;}
  .tblock .seg > button{padding:0 6px;font-size:.86rem;}
  .tblock .rrow{flex-wrap:wrap;justify-content:center;padding:5px 8px 6px;gap:3px 6px;}
  .tblock .rrow .nm{flex:1 0 100%;font-size:.88rem;}
  .tblock .rrow .num{width:64px;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null, cfg = null;
  var SETUP = 'spades_pad_setup';

  Kit.init({
    id: 'spades', title: 'Spades score',
    onNew: function () { if (pad) pad.clear(); try { localStorage.removeItem(SETUP); } catch (e) {} pad = null; showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history('sp', { keys: ['spades'], title: 'Spades: past games' }); } }],
    rules:
      '<p class="goal">Play Spades with a real deck and keep score here. Two teams of two, partners sit across from each other. First team to the target wins.</p>' +
      '<h3>Each hand</h3><ul><li>Deal all 52 cards, 13 each. Starting left of the dealer, everyone bids how many tricks they will win.</li>' +
      '<li>A team\'s goal is both partners\' bids added together.</li>' +
      '<li>Spades are trump. You must follow suit if you can. Spades can\'t be led until one has been played on another suit (unless you only have spades).</li></ul>' +
      '<h3>What to enter</h3><ul><li><b>Bid</b>: the team\'s total bid (if someone bid Nil, just the partner\'s bid).</li>' +
      '<li><b>Tricks won</b>: all the tricks the team took, including any the Nil player took. Both teams together must add up to 13.</li>' +
      '<li>If someone bid <b>Nil</b> or <b>Blind Nil</b>, pick them and enter how many tricks they took.</li></ul>' +
      '<h3>Scoring</h3><ul><li><b>Make it:</b> 10 per trick bid, +1 for each extra trick (a <b>bag</b>).</li>' +
      '<li><b>Set:</b> lose 10 per trick bid.</li>' +
      '<li><b>Bags:</b> every 10 bags costs 100 points (can be turned off at setup).</li>' +
      '<li><b>Nil:</b> +100 if they take no tricks, −100 if they take any. <b>Blind Nil</b> (called before looking at your cards) is ±200. The Nil player\'s tricks don\'t help the partner\'s bid but count as bags.</li></ul>'
  });

  function showSetup() {
    Kit.setup(app, {
      intro: 'Keep score for a real game. Players 1 & 2 are one team, 3 & 4 the other.',
      players: { min: 4, max: 4, count: 4, label: 'Team 1: players 1 & 2 · Team 2: players 3 & 4' },
      options: [
        { id: 'target', label: 'Play to', help: 'The first team to reach this many points wins.', value: 500, choices: [[300, '300'], [500, '500']] },
        { id: 'bags', label: 'Bag penalty (10 bags = −100)', help: 'Bags are extra tricks a team takes beyond its bid.', value: 1, choices: [[1, 'On', 'Every 10 bags a team collects costs them 100 points.'], [0, 'Off', 'Extra tricks are worth 1 point each with no penalty.']] }
      ],
      start: 'Start scoring',
      onStart: function (c) {
        var n = c.players.map(function (p) { return p.name; });
        try { localStorage.setItem(SETUP, JSON.stringify({ teams: [[n[0], n[1]], [n[2], n[3]]], target: +c.options.target || 500, bags: +c.options.bags !== 0 })); } catch (e) {}
        startPad();
      }
    });
  }

  // ── Scoring one team's hand ───────────────────────────────────────────────
  // in = {bid, tricks, nil: -1|0|1 (which partner), blind, nilTook}; prevBags = bags carried in
  function score(inp, prevBags, bagRule) {
    var r = { pts: 0, bags: 0, penalty: 0, set: false, made: false, nilOk: null };
    if (inp.nil === 2) { // both partners bid Nil: each Nil scores on its own, every trick is a bag
      var v2 = inp.blind ? 200 : 100;
      [inp.nilTook, inp.nilTook2].forEach(function (t) { r.pts += t === 0 ? v2 : -v2; });
      r.nilOk = inp.nilTook === 0 && inp.nilTook2 === 0;
      r.pts += inp.tricks; r.bags += inp.tricks;
      if (bagRule) { var tb = prevBags + r.bags; r.penalty = Math.floor(tb / 10) - Math.floor(prevBags / 10); r.pts -= 100 * r.penalty; }
      return r;
    }
    var forBid = inp.tricks - (inp.nil >= 0 ? inp.nilTook : 0);
    if (inp.bid > 0) {
      if (forBid >= inp.bid) { r.made = true; r.pts += 10 * inp.bid + (forBid - inp.bid); r.bags += forBid - inp.bid; }
      else { r.set = true; r.pts -= 10 * inp.bid; }
    } else if (forBid > 0) { r.pts += forBid; r.bags += forBid; }
    if (inp.nil >= 0) {
      var v = inp.blind ? 200 : 100;
      r.nilOk = inp.nilTook === 0;
      r.pts += r.nilOk ? v : -v;
      r.pts += inp.nilTook; r.bags += inp.nilTook;
    }
    if (bagRule) { var total = prevBags + r.bags; r.penalty = Math.floor(total / 10) - Math.floor(prevBags / 10); r.pts -= 100 * r.penalty; }
    return r;
  }
  // Each round's per-team note doubles as the record of what was entered.
  function detail(inp, r, names) {
    var parts = [];
    if (inp.nil === 2) parts.push('both' + (inp.blind ? ' blind' : '') + ' nil ' + inp.nilTook + '/' + inp.nilTook2);
    else if (inp.nil >= 0) parts.push(names[inp.nil] + (inp.blind ? ' blind nil' : ' nil') + (inp.nilTook ? ' took ' + inp.nilTook : ' made'));
    parts.push(inp.bid + ' bid, ' + inp.tricks + ' won');
    if (r.bags) parts.push('+' + r.bags + ' bag' + (r.bags === 1 ? '' : 's'));
    if (r.penalty) parts.push('bag penalty');
    return parts.join(' · ');
  }
  function parse(d, names) {
    var inp = { bid: 0, tricks: 0, nil: -1, blind: false, nilTook: 0 };
    if (!d) return null;
    var m = /(\d+) bid, (\d+) won/.exec(d); if (!m) return null;
    inp.bid = +m[1]; inp.tricks = +m[2];
    var both = /^both( blind)? nil (\d+)\/(\d+)/.exec(d);
    if (both) { inp.nil = 2; inp.blind = !!both[1]; inp.nilTook = +both[2]; inp.nilTook2 = +both[3]; return inp; }
    names.forEach(function (n, j) {
      var k = d.indexOf(n + ' blind nil') === 0 ? 'b' : d.indexOf(n + ' nil') === 0 ? 'n' : '';
      if (k && inp.nil < 0) { inp.nil = j; inp.blind = k === 'b'; var t = /nil took (\d+)/.exec(d); inp.nilTook = t ? +t[1] : 0; }
    });
    return inp;
  }
  function bagsOf(d) { var m = /\+(\d+) bags?/.exec(d || ''); return m ? +m[1] : 0; }
  function bagsBefore(roundIdx) {
    var b = [0, 0], rs = pad ? pad.state().rounds : [];
    rs.slice(0, roundIdx).forEach(function (r) { [0, 1].forEach(function (i) { b[i] += bagsOf(r.detail && r.detail[i]); }); });
    return b;
  }

  function startPad() {
    try { cfg = JSON.parse(localStorage.getItem(SETUP)); } catch (e) { cfg = null; }
    if (!cfg || !cfg.teams) return showSetup();
    var teamNames = cfg.teams.map(function (t) { return t[0] + ' & ' + t[1]; });
    pad = Scorepad(app, {
      key: 'sp', title: 'Spades', mode: 'Scorekeeper', target: cfg.target,
      sides: teamNames.map(function (n) { return { name: n }; }),
      goal: 'First to ' + cfg.target,
      isOver: function (t) { return Math.max(t[0], t[1]) >= cfg.target && t[0] !== t[1]; },
      form: form
    });
    watchGoal();
  }

  // Show current bags under the pad (Scorepad re-renders, so watch for it)
  var obs = null;
  function watchGoal() {
    if (obs) obs.disconnect();
    function paint() {
      var g = app.querySelector('.spad .goal'); if (!g || !pad) return;
      var n = pad.state().rounds.length, b = bagsBefore(n);
      var txt = 'First to ' + cfg.target + (cfg.bags ? ' · bags ' + (b[0] % 10) + ' and ' + (b[1] % 10) + ' (10 = −100)' : '');
      if (g.textContent !== txt) g.textContent = txt;
    }
    obs = new MutationObserver(paint);
    obs.observe(app, { childList: true, subtree: true });
    paint();
  }

  function form(ctx) {
    var ri = ctx.round - 1, prevBags = bagsBefore(ri);
    var prevIn = ctx.prev ? [0, 1].map(function (i) { return parse(ctx.prev.detail && ctx.prev.detail[i], cfg.teams[i]); }) : [null, null];
    var blocks = [0, 1].map(function (i) { return block(i, prevIn[i]); });
    var note = el('div', { class: 'rnote' });
    var btn = el('button', { type: 'button', class: 'btn btn-primary btn-block', text: ctx.prev ? 'Save changes' : 'Score this hand' });
    ctx.node.appendChild(note); ctx.node.appendChild(btn);
    var touched = [!!ctx.prev, !!ctx.prev];

    function block(i, p) {
      var st = { nil: p ? p.nil : -1, blind: p ? p.blind : false };
      var names = cfg.teams[i];
      var box = el('div', { class: 'tblock', style: { '--c': Kit.color(i) } }, [el('h3', { text: ctx.sides[i].name })]);
      box.appendChild(el('div', { class: 'label', text: 'Did anyone bid Nil?' }));
      var nilSeg = el('div', { class: 'seg' });
      [['No', -1], [names[0], 0], [names[1], 1], ['Both', 2]].forEach(function (o) {
        nilSeg.appendChild(el('button', { type: 'button', text: o[0], class: st.nil === o[1] ? 'on' : '', onclick: function () { st.nil = o[1]; Kit.sfx('tap'); sync(); } }));
      });
      box.appendChild(nilSeg);
      var kindSeg = el('div', { class: 'seg' });
      [['Nil (±100)', false], ['Blind Nil (±200)', true]].forEach(function (o) {
        kindSeg.appendChild(el('button', { type: 'button', text: o[0], onclick: function () { st.blind = o[1]; Kit.sfx('tap'); sync(); } }));
      });
      box.appendChild(kindSeg);
      var nilRow = ctx.number(i, { min: 0, max: 13, neg: false, value: p ? p.nilTook : 0, label: 'Nil took' });
      box.appendChild(nilRow);
      var nilRow2 = ctx.number(i, { min: 0, max: 13, neg: false, value: p && p.nil === 2 ? p.nilTook2 : 0, label: names[1] + ' took' });
      box.appendChild(nilRow2);
      var bidRow = ctx.number(i, { min: 0, max: 13, neg: false, value: p ? p.bid : '', placeholder: '–', label: 'Bid' });
      var trRow = ctx.number(i, { min: 0, max: 13, neg: false, value: p ? p.tricks : '', placeholder: '–', label: 'Tricks' });
      box.appendChild(bidRow); box.appendChild(trRow);
      var res = el('div', { class: 'res' }); box.appendChild(res);
      [nilRow, nilRow2, bidRow].forEach(function (r) { r.input.addEventListener('input', check); });
      trRow.input.addEventListener('input', function () {
        touched[i] = true;
        var o = blocks[1 - i]; // fill in the other team's tricks so they add up to 13
        if (o && !touched[1 - i] && String(trRow.input.value).trim() !== '') o.trRow.input.value = String(Math.max(0, 13 - Math.min(13, trRow.value())));
        check();
      });
      ctx.node.appendChild(box);
      function sync() {
        Array.prototype.forEach.call(nilSeg.children, function (b, j) { b.classList.toggle('on', [-1, 0, 1, 2][j] === st.nil); });
        Array.prototype.forEach.call(kindSeg.children, function (b, j) { b.classList.toggle('on', [false, true][j] === st.blind); });
        kindSeg.hidden = st.nil < 0; nilRow.hidden = st.nil < 0;
        nilRow2.hidden = st.nil !== 2; bidRow.hidden = st.nil === 2;
        if (st.nil >= 0) nilRow.querySelector('.nm').textContent = (st.nil === 2 ? names[0] : names[st.nil]) + ' took';
        if (st.nil === 2) bidRow.input.value = '0';
        bidRow.querySelector('.nm').textContent = st.nil >= 0 && st.nil < 2 ? names[1 - st.nil] + ' bid' : 'Team bid';
        check();
      }
      function input() {
        var bidTxt = String(bidRow.input.value).trim(), trTxt = String(trRow.input.value).trim();
        return { bid: Math.max(0, Math.min(13, bidRow.value())), tricks: Math.max(0, Math.min(13, trRow.value())), nil: st.nil, blind: st.nil >= 0 && st.blind,
          nilTook: st.nil >= 0 ? Math.max(0, Math.min(13, nilRow.value())) : 0, nilTook2: st.nil === 2 ? Math.max(0, Math.min(13, nilRow2.value())) : 0,
          empty: (st.nil !== 2 && bidTxt === '') || trTxt === '' };
      }
      var api = { box: box, trRow: trRow, res: res, input: input, sync: sync };
      setTimeout(sync, 0);
      return api;
    }

    function check() {
      if (!blocks || blocks.length < 2) return false;
      var ins = blocks.map(function (b) { return b.input(); }), msg = '', ok = true;
      ins.forEach(function (inp, i) {
        var r = score(inp, prevBags[i], cfg.bags), b = blocks[i];
        if (inp.empty) { b.res.innerHTML = ''; return; }
        b.res.innerHTML = 'This hand: <b class="' + (r.pts < 0 ? 'neg' : 'pos') + '">' + (r.pts > 0 ? '+' : r.pts < 0 ? '−' : '') + Math.abs(r.pts) + '</b>' +
          (r.set ? ' · set' : '') + (r.bags ? ' · ' + r.bags + ' bag' + (r.bags === 1 ? '' : 's') : '') + (r.penalty ? ' · bag penalty!' : '');
      });
      if (ins.some(function (x) { return x.empty; })) { ok = false; msg = 'Enter each team\'s bid and tricks won'; }
      else if (ins[0].tricks + ins[1].tricks !== 13) { ok = false; msg = 'Tricks add up to ' + (ins[0].tricks + ins[1].tricks) + '. There are 13.'; }
      else if (ins.some(function (x) { return x.nil === 2 && x.nilTook + x.nilTook2 !== x.tricks; })) { ok = false; msg = 'With both on Nil, their tricks must add up to the team\'s tricks'; }
      else if (ins.some(function (x) { return x.nil >= 0 && x.nil < 2 && x.nilTook > x.tricks; })) { ok = false; msg = 'The Nil player can\'t take more tricks than their team'; }
      else if (ins.some(function (x) { return x.nil < 0 && x.bid < 1; })) { ok = false; msg = 'A team bid of 0 needs a Nil. Pick who bid Nil.'; }
      else msg = 'Looks right';
      note.className = 'rnote' + (ok ? '' : ' bad'); note.textContent = msg;
      btn.disabled = !ok;
      return ok;
    }

    btn.addEventListener('click', function () {
      if (!check()) return;
      var ins = blocks.map(function (b) { return b.input(); });
      var res = ins.map(function (inp, i) { return score(inp, prevBags[i], cfg.bags); });
      var extra = { highlights: [], detail: ins.map(function (inp, i) { return detail(inp, res[i], cfg.teams[i]); }) };
      var n = ctx.round, callout = null;
      res.forEach(function (r, i) {
        var team = ctx.sides[i].name, inp = ins[i];
        if (r.set) { extra.highlights.push(team + ' went set bidding ' + inp.bid + ' in round ' + n); callout = callout || 'Set!'; }
        else if (r.made && inp.bid >= 9 && !pad.state().rounds.some(function (rr) { return (rr.highlights || []).some(function (h) { return h.indexOf(team + ' made a big bid') === 0; }); })) extra.highlights.push(team + ' made a big bid of ' + inp.bid + ' in round ' + n);
        if (inp.nil === 2) {
          var k2 = inp.blind ? 'Blind Nil' : 'Nil';
          extra.highlights.push(ctx.sides[i].name + ' both bid ' + k2 + ' in round ' + n + (r.nilOk ? ' and both made it!' : ''));
          if (r.nilOk) callout = 'Double ' + k2 + '!';
        } else if (inp.nil >= 0) {
          var who = cfg.teams[i][inp.nil], kind = inp.blind ? 'Blind Nil' : 'Nil';
          if (r.nilOk) { extra.highlights.push(who + ' made ' + kind + ' in round ' + n); callout = kind + ' made!'; }
          else extra.highlights.push(Kit.poss(who) + ' ' + kind + ' was broken in round ' + n);
        }
        if (r.penalty) { extra.highlights.push('Bag penalty hit ' + team + ' in round ' + n); callout = callout || 'Bag penalty!'; }
        if (inp.tricks === 13) extra.highlights.push(team + ' took all 13 tricks in round ' + n);
      });
      if (!ctx.prev && callout) extra.callout = callout;
      ctx.done(res.map(function (r) { return r.pts; }), extra);
    });
    setTimeout(check, 0);
  }

  var hasSetup = false; try { hasSetup = !!localStorage.getItem(SETUP); } catch (e) {}
  if (hasSetup) startPad(); else showSetup();
})();
</script>
</body>
</html>

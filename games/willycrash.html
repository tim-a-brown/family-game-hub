<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willy Crash</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<script src="../arcade-music.js"></script>
<style>
html.ar-on,html.ar-on body{height:100%;overflow:hidden;overscroll-behavior:none;}
html.ar-on body{display:flex;flex-direction:column;
  background:radial-gradient(90% 45% at 50% 0%, rgba(255,140,90,.15) 0%, rgba(255,140,90,0) 70%),var(--bg);}
html.ar-on #app{flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;padding:0 8px calc(var(--safe-b) + 8px);display:flex;}
.wc-view{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.wc-view[hidden]{display:none;}
.hud{flex:none;display:flex;align-items:stretch;gap:6px;width:100%;}
.plate{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 8px;border-radius:14px;
  background:linear-gradient(180deg,#3a2140,#1c0f22);box-shadow:inset 0 0 0 1.5px rgba(255,180,140,.3),0 6px 14px rgba(0,0,0,.35);}
.plate small{font-size:.6rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,205,180,.7);white-space:nowrap;}
.plate b{font-family:var(--display);font-weight:400;font-size:1.4rem;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;}
.plate.gold{flex:1.4;}
.plate.gold b{color:#ffd84a;text-shadow:0 0 12px rgba(255,200,40,.4);}
.plate.bump b{animation:bounce .45s var(--spring);}
.pbtn{flex:none;width:48px;border:0;border-radius:14px;display:grid;place-items:center;color:#ffd9c8;
  background:linear-gradient(180deg,#3a2140,#1c0f22);box-shadow:inset 0 0 0 1.5px rgba(255,180,140,.3),0 6px 14px rgba(0,0,0,.35);}
.pbtn:active{transform:scale(.94);}
.pbtn svg{width:22px;height:22px;}
.cab{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.bezel{position:relative;padding:7px;border-radius:22px;}
.scr{position:relative;border-radius:15px;overflow:hidden;background:#2a2560;box-shadow:inset 0 0 0 2px rgba(0,0,0,.45);}
.scr canvas{display:block;touch-action:none;}
.deck{flex:none;width:100%;height:136px;padding:6px;border-radius:22px;position:relative;}
.deck canvas{display:block;width:100%;height:100%;border-radius:16px;touch-action:none;cursor:grab;}
.deck canvas:active{cursor:grabbing;}
@media (max-height:760px){ .deck{height:118px;} .plate b{font-size:1.2rem;} }
.ov{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;pointer-events:none;}
.ov[hidden]{display:none;}
.ov button{pointer-events:auto;}
.ov h2{font-family:var(--display);font-weight:400;font-size:2.6rem;line-height:1;color:#fff;
  -webkit-text-stroke:2px #3a1630;paint-order:stroke fill;text-shadow:0 4px 0 #3a1630,0 8px 18px rgba(0,0,0,.25);}
.pausecard{background:rgba(20,8,30,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);pointer-events:auto;}
.pausecard .btn{min-width:200px;margin-top:14px;}
.pausecard .btn-ghost{margin-top:8px;color:#fff;}
.hint{flex:none;font-size:.8rem;font-weight:700;color:var(--text-3);text-align:center;}
@media (hover:none),(pointer:coarse){ .hint{display:none;} }
</style>
</head>
<body>
<main class="stage" id="app"></main>
<div class="wc-view" id="view" hidden>
  <div class="hud" id="hud">
    <div class="plate"><small>Shot</small><b id="h-shot">1/5</b></div>
    <div class="plate gold" id="p-score"><small>Score</small><b id="h-score">0</b></div>
    <div class="plate"><small>Best</small><b id="h-best">0</b></div>
    <button class="pbtn" id="btn-pause" type="button" aria-label="Pause"></button>
  </div>
  <div class="cab" id="cab">
    <div class="bezel wood">
      <div class="scr" id="scr">
        <canvas id="cv" aria-label="Willy Crash city"></canvas>
        <div class="ov" id="ov" hidden></div>
      </div>
    </div>
  </div>
  <div class="deck wood" id="deck"><canvas id="dk" aria-label="TNT plunger: drag down and let go to fire"></canvas></div>
  <div class="hint">Hold Space (or drag down) to load the TNT, let go to fire. Slide back up to cancel. P pauses.</div>
</div>
<script>
(function () {

  // ═══ Sound (all synthesized) ════════════════════════════════════════════
  var Snd = (function () {
    var ac = null, master = null, nbuf = null, fuseN = null, windN = null;

      var a = ctx(); if (!a) return;

      g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 1.5); s.stop(t + dur + .02);
    }
    function loop(type, freq, q) {
      var a = ctx(); if (!a) return null;
      var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();

      unlock: ctx, out: function () { return master; },
      fuse: function (lvl) {

      whee: function () {

        o.type = 'sawtooth'; f.type = 'bandpass'; f.frequency.value = 1300; f.Q.value = 1.4;
        o.frequency.setValueAtTime(380, t); o.frequency.exponentialRampToValueAtTime(720, t + .3); o.frequency.exponentialRampToValueAtTime(520, t + 1.1);

        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .05); g.gain.setValueAtTime(.09, t + .8); g.gain.exponentialRampToValueAtTime(.0001, t + 1.15);

      thud: function (v) { noise(0, .22, .28 * v + .05, 240, 'lowpass', .7); tone(105, 0, .2, 'sine', .22 * v + .04, 45); },
      bonk: function () { tone(880, 0, .16, 'square', .045, 330); tone(1320, .02, .1, 'sine', .04, 600); },
      splat: function () { noise(0, .35, .45, 900, 'lowpass', .8, 140); tone(300, 0, .3, 'sawtooth', .06, 70); },
      glass: function () { for (var i = 0; i < 8; i++) tone(2400 + Math.random() * 3200, i * .022 + Math.random() * .02, .22 + Math.random() * .2, 'sine', .035); noise(0, .28, .2, 5200, 'highpass', .5); },
      boing: function () { tone(150, 0, .5, 'sine', .2, 560, 16); tone(300, 0, .3, 'triangle', .05, 900); },
      clang: function () { [430, 611, 887, 1257].forEach(function (f, i) { tone(f, 0, .7 - i * .1, 'triangle', .05); }); noise(0, .08, .15, 2000, 'bandpass'); },
      thwack: function () { noise(0, .16, .3, 600, 'bandpass', 1.2); tone(210, 0, .14, 'square', .05, 120); },
      splash: function () { noise(0, 1.0, .4, 1600, 'lowpass', .6, 180); noise(.04, .55, .18, 3200, 'bandpass', .6); for (var i = 0; i < 5; i++) tone(600 + Math.random() * 900, .2 + i * .09, .08, 'sine', .03, 1400); },
      flap: function () { for (var i = 0; i < 4; i++) noise(i * .055, .045, .09, 2000 + Math.random() * 800, 'bandpass', 1.5); },
      coo: function () { tone(440, 0, .16, 'sine', .05, 360, 22); tone(400, .18, .2, 'sine', .04, 330, 22); },
      star: function () { tone(1319, 0, .12, 'square', .035); tone(1760, .07, .22, 'square', .035); },
      pop: function () { noise(0, .07, .35, 1900, 'bandpass', 1); tone(700, 0, .06, 'square', .05, 220); },
      alarm: function () { for (var i = 0; i < 8; i++) tone(i % 2 ? 660 : 880, i * .17, .15, 'square', .03); },
      swoosh: function () { noise(0, .45, .09, 900, 'bandpass', .8, 2600); },
      cheer: function () {
        for (var i = 0; i < 18; i++) noise(i * .07 + Math.random() * .05, .35 + Math.random() * .3, .05, 600 + Math.random() * 1200, 'bandpass', 1.6);
        tone(1900, .2, .45, 'sine', .04, 2700); tone(2700, .7, .35, 'sine', .035, 1900);
      },
      fanfare: function (big) {
        var N = big ? [523, 659, 784, 1047, 784, 1047, 1319, 1568] : [523, 659, 784, 1047];
        N.forEach(function (f, i) { tone(f, i * (big ? .11 : .1), big && i === N.length - 1 ? .7 : .22, 'triangle', .1); });
        if (big) N.forEach(function (f, i) { tone(f * 2, i * .11 + .02, .15, 'square', .025); });
      },
      wahwah: function () { [[392, 370], [370, 349], [349, 330], [330, 262]].forEach(function (p, i) { tone(p[0], i * .32, i === 3 ? .8 : .3, 'sawtooth', .045, p[1], i === 3 ? 6 : 0); }); },
      count: function () { tone(988, 0, .08, 'square', .03); },
      // crash effects
      crunch: function (v) { v = v || 1; noise(0, .2, .3 * v, 520, 'lowpass', .9, 110); noise(0, .07, .18 * v, 2300, 'bandpass', .8); tone(80, 0, .14, 'sine', .12 * v, 45); },
      zap: function () { noise(0, .14, .14, 4600, 'highpass', .6); tone(1900, 0, .07, 'square', .025, 500); tone(118, 0, .16, 'sawtooth', .035, 60); },
      twang: function () { tone(440, 0, .5, 'triangle', .07, 330, 11); tone(1180, 0, .22, 'sine', .025, 900); },
      smash: function () { noise(0, .05, .3, 1800, 'bandpass', 1.2); for (var i = 0; i < 6; i++) tone(2600 + Math.random() * 2600, .02 + i * .025, .18, 'sine', .03); noise(.01, .2, .14, 6000, 'highpass', .5); },
      crumple: function () { noise(0, .28, .3, 800, 'bandpass', .7, 260); tone(95, 0, .2, 'sine', .14, 48); noise(.05, .1, .1, 2600, 'bandpass', 1); },
      scrape: function (v) { noise(0, .16, .05 + .07 * (v || 1), 1300, 'bandpass', .7, 700); },
      hiss: function () { noise(0, .7, .1, 5200, 'highpass', .4, 2500); }
    };
  })();

  // ═══ World constants ════════════════════════════════════════════════════
  var G = 600;                         // gravity, world units / s²
  var VMIN = 260, VMAX = 1360;         // launch speed at 0% and 100% plunger
  var PIV = { x: 72, y: -60 }, BARREL = 66;
  var WS = 1.5;                        // Willy's size
  var VW0 = 400;                       // world units across the screen at zoom 1
  var DT = 1 / 120, SUB = 2, HS = DT / SUB;

  // ═══ Canvas setup ═══════════════════════════════════════════════════════
  var cv = $('cv'), g = cv.getContext('2d'), scr = $('scr'), cab = $('cab'), dk = $('dk'), dg = dk.getContext('2d'), deckEl = $('deck');
  var W = 360, H = 600, DPR = 1, K = 1, DW = 360, DH = 120;
  function fit() {
    var r = cab.getBoundingClientRect(), aw = Math.floor(r.width - 14), ah = Math.floor(r.height - 14);
    if (aw < 50 || ah < 50) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = aw; H = ah; K = W / VW0;
    scr.style.width = W + 'px'; scr.style.height = H + 'px';
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    $('hud').style.maxWidth = (W + 14) + 'px'; deckEl.style.maxWidth = (W + 14) + 'px';
    var dr = dk.getBoundingClientRect(); DW = Math.max(100, Math.round(dr.width)); DH = Math.max(60, Math.round(dr.height));
    dk.width = Math.round(DW * DPR); dk.height = Math.round(DH * DPR);
    strips = null;
    if (state === 'aim' || state === 'idle') { var c = camAim(); cam.x = c.x; cam.y = c.y; cam.z = c.z; }
    render(); drawDeck();
  }

  // ═══ City ═══════════════════════════════════════════════════════════════
  var B = [], COL = [], cars = [], cans = [], lamps = [], ants = [], perches = [], jack = null, SEA_X = 2700, WORLD_END = 3200, citySeed = 1;
  var PAL = [['#ec7f62', '#b9553f'], ['#5cbab2', '#3a8b84'], ['#f3c66c', '#c8973a'], ['#a08bdc', '#7660b8'], ['#f0a3b6', '#c97590'],
             ['#73a8ea', '#4d7fc6'], ['#e3d6bd', '#b4a383'], ['#93d27e', '#64a552']];
  var AWN = [['#e5263f', '#fff3e0'], ['#2f7dff', '#fff3e0'], ['#22a866', '#fff3e0'], ['#ff8a1f', '#fff3e0']];
  var ADS = [['SODA POP', '#e5263f', '#fff'], ['DONUTS', '#ff8ab4', '#5a1838'], ['TACOS', '#ffc22e', '#5a2a00'], ['PIZZA', '#ff6a2b', '#fff'],
             ['MOVIES', '#2b2d6e', '#ffd84a'], ['BURGERS', '#2fbf71', '#fff'], ['GYM', '#3a3a48', '#ffd84a'], ['ICE CREAM', '#7ad7ff', '#1b3d6b']];
  var CARC = ['#e5263f', '#2f7dff', '#ffc22e', '#22b866', '#8b55ff', '#ff7a29', '#e8e8f0'];
  function buildCity(seed) {
    var R = rng(seed);
    B = []; COL = []; cars = []; cans = []; lamps = []; ants = []; perches = [];
    var x = 250, last = -1, adI = (R() * ADS.length) | 0;
    while (x < 2140) {
      var tt = (x - 250) / 1890, w = Math.round(132 + R() * 96), h = Math.round(118 + R() * 100 + tt * 175), pi;
      do { pi = (R() * PAL.length) | 0; } while (pi === last); last = pi;
      var b = mkB(x, w, h, PAL[pi], R, false);

      else if (room >= 58) { var bw = Math.min(78, room), ad = ADS[adI++ % ADS.length]; var bl = { x0: rx1 - bw, x1: rx1, y0: -h - 54, y1: -h - 18, k: 'bill', ad: ad, ang: 0, av: 0 }; COL.push(bl); b.props.push(bl); }
      else if (room >= 20) { var ax = rx0 + (room - 18) * R(); var ac = { x0: ax, x1: ax + 18, y0: -h - 12, y1: -h, k: 'ac' }; COL.push(ac); b.props.push(ac); }
      var lx0 = b.x0 + 9, lx1 = b.padX - b.hw - 8;
      if (lx1 - lx0 > 24 && R() < .55) { var ax2 = lx0 + (lx1 - lx0 - 20) * R(); var ac2 = { x0: ax2, x1: ax2 + 20, y0: -h - 11, y1: -h, k: 'ac' }; COL.push(ac2); b.props.push(ac2); }
      // a TV antenna on about half the roofs, clear of the pad and the other props (it bends, it doesn't block)
      if (R() < .55) {
        var spots = [b.x0 + 14 + R() * 20, b.x1 - 14 - R() * 20, b.padX + (R() < .5 ? -1 : 1) * (b.hw + 12)];
        for (var si = 0; si < spots.length; si++) {
          var sx = spots[si];
          if (Math.abs(sx - b.padX) < b.hw + 8 || sx < b.x0 + 10 || sx > b.x1 - 10) continue;
          if (b.props.some(function (pp) { return sx > pp.x0 - 8 && sx < pp.x1 + 8; })) continue;
          ants.push({ x: sx, y: -h, h: 30 + R() * 12, ang: 0, av: 0, bent: 0, cool: 0, hs: -1, ph: R() * 6 }); break;
        }
      }
      perches.push({ x: b.x0 + 6, y: -h - 6 }); if (R() < .5) perches.push({ x: b.x0 + 14, y: -h - 6 });
      if (b.awn) perches.push({ x: b.awn.x0 + 8, y: b.awn.y0 });

      x += w + Math.round(38 + R() * 48);

    jack = mkB(Math.max(x + 20, 2320), 156, 560, ['#2f7392', '#1f4f68'], R, true);
    B.push(jack); perches.push({ x: jack.x0 + 6, y: jack.y0 - 6 });

    // Street furniture
    for (var lx = 190; lx < SEA_X - 40; lx += 175 + R() * 40) { lamps.push({ x: lx, out: 0, ang: 0, av: 0, cool: 0, hs: -1 }); if (R() < .4) perches.push({ x: lx + 12, y: -86 }); }
    var cx2 = 170 + R() * 120;

  });
  document.addEventListener('keyup', function (e) {
    if (!keyHold) return;
    if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'KeyS') { keyHold = false; release(); }
  });
  $('btn-pause').addEventListener('click', function (e) { e.stopPropagation(); Kit.sfx('tap'); if (paused) resume(); else pause(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); else kick(); });
  document.addEventListener('kit:orient', function (e) { if (!e.detail.ok) pause(); });
  window.addEventListener('blur', pause);

  var PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>';
  var PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  function overlay() {
    $('btn-pause').innerHTML = paused ? PLAY_SVG : PAUSE_SVG;
    $('btn-pause').style.visibility = live && state !== 'over' ? 'visible' : 'hidden';
    var ov = $('ov');
    if (!paused) { ov.hidden = true; ov.innerHTML = ''; ov.className = 'ov'; return; }
    ov.className = 'ov pausecard'; ov.hidden = false;
    ov.innerHTML = '<h2>Paused</h2><div style="color:#ffd9c8;font-weight:800;margin-top:6px">Shot ' + Math.min(SHOTS, shotIdx + 1) + ' of ' + SHOTS + ' · ' + fmt(total) + ' points</div>' +
      '<button class="btn btn-primary btn-lg" type="button" id="ov-resume">' + Kit.icon('play') + 'Keep playing</button>' +
      '<button class="btn btn-ghost" type="button" id="ov-new">New game</button>';
    $('ov-resume').addEventListener('click', function (e) { e.stopPropagation(); Kit.sfx('tap'); resume(); });
    $('ov-new').addEventListener('click', function (e) { e.stopPropagation(); Kit.confirm('Start a new game?', { ok: 'New game', body: 'This game will be lost.' }).then(function (ok) { if (ok) { paused = false; overlay(); newGame(); } }); });
  }
  function pause() {
    if (!live || paused || state === 'over' || state === 'idle') return;
    paused = true; drag = null; keyHold = false; depth = 0; Snd.quiet(); Mus.stop(true); overlay();
  }
  function resume() { if (!paused) return; paused = false; overlay(); kick(); }

  // ═══ Game over ══════════════════════════════════════════════════════════
  var LNAME = { bull: 'Bullseye', great: 'Great landing', nice: 'Nice landing', roof: 'On the target roof', wrong: 'Wrong roof', crash: 'Crash', splash: 'Splash', jackpot: 'JACKPOT', jackpad: 'Tower pad', jackroof: 'Top of the tower' };
  function finish() {
    state = 'over'; Snd.quiet(); Mus.stop(false); overlay();
    var bulls = shots.filter(function (s) { return s.land === 'bull'; }).length, jp = shots.filter(function (s) { return s.land === 'jackpot'; }).length;
    var tower = shots.filter(function (s) { return /^jack/.test(s.land); }).length;
    var landed = shots.filter(function (s) { return /^(bull|great|nice|roof|jack)/.test(s.land); }).length;
    var ev = { win: 0, pig: 0, bird: 0, bill: 0, tank: 0, car: 0, splat: 0, awn: 0, lamp: 0, ant: 0, ac: 0 }, stars = 0;
    shots.forEach(function (s) { for (var k in ev) ev[k] += s.ev[k] || 0; stars += s.stars; });
    var bestShot = shots.slice().sort(function (a, b) { return b.total - a.total; })[0];
    var hl = [];
    if (jp) hl.push('Hit the JACKPOT' + (jp > 1 ? ' ' + jp + ' times' : '') + '!');
    else if (tower) hl.push('Landed on top of the jackpot tower');
    if (bulls) hl.push(bulls + (bulls === 1 ? ' bullseye' : ' bullseyes'));
    hl.push('Landed ' + landed + ' of ' + SHOTS + ' shots on a target');
    if (bestShot) hl.push('Best shot: ' + fmt(bestShot.total) + ' on shot ' + bestShot.n + ' (' + (LNAME[bestShot.land] || bestShot.land).toLowerCase() + ')');
    if (ev.win) hl.push('Smashed ' + ev.win + (ev.win === 1 ? ' window' : ' windows'));
    if (ev.splat) hl.push('Splatted into a wall ' + (ev.splat === 1 ? 'once' : ev.splat + ' times'));
    if (ev.pig + ev.bird) hl.push('Scared ' + (ev.pig + ev.bird) + ' pigeons');
    if (ev.car) hl.push('Set off ' + ev.car + (ev.car === 1 ? ' car alarm' : ' car alarms'));
    if (ev.tank) hl.push('Burst ' + ev.tank + (ev.tank === 1 ? ' water tower' : ' water towers'));
    if (ev.lamp) hl.push('Knocked into ' + ev.lamp + (ev.lamp === 1 ? ' street lamp' : ' street lamps'));
    if (ev.ant) hl.push('Bent ' + ev.ant + (ev.ant === 1 ? ' TV antenna' : ' TV antennas'));
    if (stars) hl.push('Grabbed ' + stars + (stars === 1 ? ' star' : ' stars'));
    var isBest = total > 0 && total > best0;
    if (isBest) hl.push('New high score' + (best0 ? ' (old best ' + fmt(best0) + ')' : ''));
    var hiL = ArcadeHi.list(HI);
    var detail = {
      ls: shots.map(function (s) { return s.land; }).join(','), ps: shots.map(function (s) { return s.total; }).join(','),
      ag: shots.map(function (s) { return s.angle + '/' + s.power; }).join(','),
      bu: bulls, jp: jp, wn: ev.win, pg: ev.pig + ev.bird, st: stars,
      hr: total > 0 && (hiL.length < ArcadeHi.max || total > hiL[hiL.length - 1].score) ? hiL.filter(function (x) { return x.score >= total; }).length + 1 : 0, hb: best0 || 0
    };
    try {
      Kit.record(KEY, {
        detail: detail, started: started, mode: jp ? 'Jackpot' : '',
        players: [{ name: who, score: total }], winner: null,
        rounds: { labels: shots.map(function (s) { return 'S' + s.n; }), scores: shots.map(function (s) { return [s.total]; }) },
        highlights: hl.slice(0, 10), summary: fmt(total) + ' points' + (jp ? ' · jackpot' : bulls ? ' · ' + bulls + (bulls === 1 ? ' bullseye' : ' bullseyes') : ''), badge: fmt(total),
        meta: { score: total, bulls: bulls, jackpot: jp }
      });
    } catch (e) {}
    var notes = shots.map(function (s) { return 'Shot ' + s.n + ': ' + (LNAME[s.land] || s.land) + ' · ' + fmt(s.total); });
    hud();
    ArcadeHi.check(HI, total, function () {
      hud();
      Kit.win({
        lose: !(isBest || jp || bulls), icon: isBest || jp || bulls ? 'trophy' : 'meh',
        title: jp ? 'Jackpot!' : isBest ? 'New high score!' : bulls ? 'Bullseye!' : 'Show’s over',
        sub: fmt(total) + ' points · ' + landed + ' of ' + SHOTS + ' landed',
        notes: notes, notesTitle: 'Your shots',
        again: function () { newGame(); }, againLabel: 'Launch again',
        extra: [{ label: 'High scores', onClick: function () { ArcadeHi.show(HI, 'Willy Crash'); showSetup(); } }, { label: 'Change player', onClick: showSetup }]
      });
    });
  }

  // ═══ Music (an original circus-surf romp in G) ══════════════════════════
  var SONG = {
    eighth: 0.155, swing: 0.16, leadVol: 0.034, leadLp: 2500, bassVol: 0.1, drumVol: 0.75,
    lead: [67, 0, 71, 74, 79, 0, 78, 79,  76, 0, 72, 0, 76, 74, 72, 0,  71, 0, 74, 0, 79, 0, 81, 79,  78, 0, 74, 0, 69, 0, 0, 0,
           79, 79, 0, 79, 81, 0, 79, 78,  76, 0, 79, 0, 84, 0, 83, 81,  79, 0, 74, 0, 71, 74, 79, 0,  78, 76, 74, 72, 74, 0, 0, 0],
    bass: [43, 0, 50, 0, 43, 0, 50, 47,  48, 0, 55, 0, 48, 0, 55, 52,  43, 0, 50, 0, 43, 0, 50, 47,  38, 0, 45, 0, 38, 0, 45, 42],
    drums: 'khskkhsh'
  };
  var Mus = ArcadeMusic.create({ key: 'willycrash_music', song: SONG, ctx: Snd.unlock, out: Snd.out });

  // ═══ Loop ═══════════════════════════════════════════════════════════════
  var last = 0, acc = 0, raf = 0;
  function loop(ts) {
    raf = 0;
    if (!last) last = ts;
    var real = Math.min(.1, (ts - last) / 1000); last = ts;
    if (!live) { acc = 0; Mus.stop(true); return; }
    if (!paused) {
      acc += real * timeScale * testSpeed;
      var n = 0;
      while (acc >= DT && n++ < 40 * testSpeed) { acc -= DT; update(DT); }
    }
    if (!paused && !document.hidden && state !== 'over' && state !== 'idle') Mus.tick(); else Mus.stop(true);
    render(); drawDeck();
    // Battery: no frames while paused, on the setup screen, once the game is over, or with the page hidden (kick() restarts)
    if (live && !paused && !document.hidden && state !== 'over' && state !== 'idle') raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf && live && !paused && !document.hidden && state !== 'over' && state !== 'idle') { last = 0; raf = requestAnimationFrame(loop); } }

  // ═══ Kit shell ══════════════════════════════════════════════════════════
  Kit.init({ orient: 'portrait', orientTablets: true,
    id: 'willycrash',
    theme: { wood: ['#7a3a2a', '#4a1e14'] },
    onNew: showSetup, confirmNew: false,
    menu: [
      { icon: 'trophy', label: 'High scores', onClick: function () { pause(); ArcadeHi.show(HI, 'Willy Crash'); } },
      { icon: 'history', label: 'Past games', onClick: function () { pause(); Kit.history(KEY, { title: 'Willy Crash: past games' }); } },
      Mus.menuItem
    ],
    rules:
      '<p class="goal">Blast Willy the daredevil out of the cannon and land him on the target rooftop. You get 5 shots. Highest total wins a spot on the high-score board.</p>' +
      '<h3>Launching</h3><ul><li>The cannon swings up and down on its own.</li>' +
      '<li><b>Drag the TNT plunger down</b> (anywhere on the screen works too). The further you pull, the harder the blast. The gauge on the left shows your power.</li>' +
      '<li><b>Let go to fire.</b> Willy flies at whatever angle the cannon is pointing at that moment, so time your release. The dial on the right shows the angle.</li>' +
      '<li>Changed your mind? <b>Slide back up</b> before you let go and nothing fires.</li>' +
      '<li>White dots show the start of the flight while you pull. The marks on the gauge and dial show your last shot.</li>' +
      '<li>Tap during the fly-over to skip it and start pulling straight away. Tap after a shot to go to the next one.</li>' +
      '<li>On a computer, hold <b>Space</b> (or the Down arrow) to pull and let go to fire. <b>P</b> pauses.</li></ul>' +
      '<h3>Landing</h3><p>Each shot has a target building with a bullseye pad on the roof (the red arrow, and the red building on the map at the top). Where Willy first touches the roof counts, as long as he stays up there. He comes in hot, so he can skid and tumble a little after touchdown; if he slides right off the roof, it is a crash.</p>' +
      '<ul><li><b>Bullseye</b> (center): 1,000</li><li><b>Inner ring</b>: 500</li><li><b>Outer ring</b>: 250</li><li>Anywhere else on the target roof: 100</li><li>Some other roof: 50</li></ul>' +
      '<h3>The jackpot tower</h3><p>The tall gold-topped tower at the far end of the city is always there. Land on it for 1,500, on its pad for 2,500, or hit its bullseye for the <b>5,000 point jackpot</b>.</p>' +
      '<h3>Crashing</h3><p>Miss, and Willy crashes into the city. Everything he hits scores a little (once per thing per shot): windows 25, water towers 60, billboards 40, car alarms 30, street lamps 20, TV antennas 15, air-conditioning units 15, awnings (they bounce him) 15, trash cans 15, pigeons 10, a hard landing 20, a wall splat 50.</p>' +
      '<h3>Bonuses</h3><ul><li>Fly through a <b>star</b> for 100.</li><li>Pop the <b>2X balloons</b> to double that shot.</li><li>From shot 3 the <b>wind</b> blows (top left). It pushes Willy a little left or right.</li></ul>'
  });
  window.__willy = {
    state: function () { return state; }, score: function () { return total; }, shot: function () { return shotIdx; }, shots: function () { return shots; },
    target: function () { return tgt && { padX: tgt.padX, y0: tgt.y0, hw: tgt.hw, x0: tgt.x0, x1: tgt.x1 }; },
    jack: function () { return jack && { padX: jack.padX, y0: jack.y0, hw: jack.hw }; },
    buildings: function () { return B.map(function (b) { return { x0: b.x0, x1: b.x1, y0: b.y0 }; }); },
    skip: function () { if (state === 'intro') toAim(); else if (state === 'result') nextShot(); },
    fire: function (a, p) { if (state === 'intro') toAim(); fire(a, p); },
    aim: function (which, a, dx) { var b = which === 'jack' ? jack : tgt; var s = solve(b.padX + (dx || 0), b.y0 - 16, a || 50); return s && s.p; },
    calm: function () { wind = 0; }, wind: function () { return wind; },
    speed: function (n) { testSpeed = n || 1; },
    rag: function () { return rag && rag.P.map(function (p) { return [Math.round(p.x), Math.round(p.y)]; }); },
    hold: function (d) { if (state === 'intro') toAim(); depth = d; },
    freeze: function (on) { if (on) { live = false; } else { live = true; kick(); } },
    render: function () { render(); drawDeck(); },
    result: function () { return res; },
    cam: function () { return cam; }
  };
  // Deterministic test hook: freeze the real-time loop and step the simulation by hand
  window.__wc = {
    seed: function (s) { citySeed = s; buildCity(s); shotIdx = 0; shots = []; total = 0; startShot(); },
    step: function (sec, draw) { var n = Math.round((sec || 0) / DT); for (var i = 0; i < n; i++) update(DT); if (draw) { render(); drawDeck(); } return state; },
    // drop Willy (standing pose, pelvis at x,y) with a velocity, as if fired
    drop: function (x, y, vx, vy, spin) {
      if (state === 'intro') toAim();
      state = 'aim'; fire(45, .5);
      var P = rag.P;
      for (var i = 0; i < 11; i++) { P[i].x = x + STAND[i][0] * WS; P[i].y = y + STAND[i][1] * WS; }
      var c = P[PEL], w = spin || 0;
      P.forEach(function (p) { p.px = p.x - (vx - w * (p.y - c.y)) * HS; p.py = p.y - (vy + w * (p.x - c.x)) * HS; });
      rag.sc.forEach(function (q) { q.x = P[NECK].x; q.y = P[NECK].y; q.px = q.x - vx * HS; q.py = q.y - vy * HS; });
      wind = 0; return true;
    },
    pel: function () { var p = rag.P[PEL]; return { x: p.x, y: p.y, vx: (p.x - p.px) / HS, vy: (p.y - p.py) / HS }; },
    parts: function () { return rag.P.map(function (p) { return { x: p.x, y: p.y, vx: (p.x - p.px) / HS, vy: (p.y - p.py) / HS }; }); },
    jack: function () { return jack && { x0: jack.x0, x1: jack.x1, y0: jack.y0, padX: jack.padX, hw: jack.hw }; },
    tgt: function () { return tgt && { x0: tgt.x0, x1: tgt.x1, y0: tgt.y0, padX: tgt.padX, hw: tgt.hw }; },
    sea: function () { return SEA_X; },
    state: function () { return state; }, res: function () { return res; }, cur: function () { return cur; },
    nparts: function () { return parts.length; },
    dragk: function (k) { DRAGK = k; },
    ragInfo: function () { return rag && { pinT: rag.pinT, airT: rag.airT, restT: rag.restT, noCol: rag.noCol, dance: !!rag.dance, sticky: rag.sticky, wet: rag.wet, landed: rag.landed }; },
    cam: function (x, y, z) { cam.x = x; cam.y = y; cam.z = z || 1; render(); },
    col: function () { return COL.map(function (c) { return { k: c.k, x0: c.x0, x1: c.x1, y0: c.y0, y1: c.y1 }; }); }
  };

  // ═══ Setup ══════════════════════════════════════════════════════════════
  function showSetup() {
    live = false; paused = false; state = 'idle'; Mus.stop(true); Snd.quiet();
    document.documentElement.classList.remove('ar-on');
    var v = $('view'); if (v.parentNode === $('app')) document.body.appendChild(v);
    v.hidden = true;
    Kit.setup($('app'), {
      intro: 'Launch the daredevil onto the rooftops',
      players: { min: 1, max: 1, count: 1, label: 'Player' },
      start: 'Launch',
      onStart: function (cfg) {
        who = (cfg.players[0] && cfg.players[0].name) || 'Player';
        var app = $('app'); app.className = ''; app.innerHTML = '';
        document.documentElement.classList.add('ar-on');
        v.hidden = false; app.appendChild(v); live = true;
        Snd.unlock(); fit(); newGame(); fit(); overlay();
      }
    });
    window.scrollTo(0, 0);
  }

  new ResizeObserver(function () { if (live) fit(); }).observe(cab);
  showSetup();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gin Rummy Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.spad th.rn{width:54px;letter-spacing:.02em;}
.rform [hidden]{display:none !important;}
.rform .seg{flex-wrap:wrap;}
.rform .seg > button{min-height:44px;}
.rform .label{margin:6px 0 -2px;}
.rrow.off{opacity:.45;}
.rrow .sub{display:block;font-size:.72rem;font-weight:700;color:var(--text-3);}
.res{padding:12px;border-radius:var(--r);background:rgba(255,255,255,.06);text-align:center;}
.res .big{font-size:1.45rem;color:var(--yellow);line-height:1.15;}
.res small{display:block;margin-top:2px;color:var(--text-2);font-weight:700;}
.res.bad .big{color:var(--red);font-size:1.05rem;font-family:var(--font);font-weight:800;}
.bon{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.bon th,.bon td{padding:8px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);}
.bon th:first-child,.bon td:first-child{text-align:left;}
.bon td.big{font-weight:900;font-size:1.15rem;color:var(--yellow);}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null;
  var SETUP = 'gin_pad_setup', KEY = 'rm', AI_KEY = 'gin';

  Kit.init({
    id: 'gin-rummy', title: 'Gin score',
    onNew: function () { if (pad) pad.clear(); localStorage.removeItem(SETUP); showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(AI_KEY, { keys: [KEY], title: 'Gin Rummy: past games' }); } }],
    rules:
      '<p class="goal">Play Gin Rummy with a real deck and keep score here. First to <b>100</b> wins the game.</p>' +
      '<h3>The game</h3><ul><li>Deal 10 cards each. Turn the next card face up to start the discard pile. The rest is the stock.</li>' +
      '<li>The non-dealer may take the first upcard. If they pass, the dealer may. If both pass, the non-dealer draws from the stock.</li>' +
      '<li>On your turn, draw from the stock or the discard pile, then discard one card. You can\'t throw back a card you just picked up.</li>' +
      '<li>Make <b>sets</b> (3 or 4 of a rank) and <b>runs</b> (3+ in a row, same suit, ace low). Cards not in a meld are <b>deadwood</b>: Ace 1, number cards face value, J Q K 10.</li></ul>' +
      '<h3>Knocking</h3><ul><li>When your deadwood is <b>10 or less</b>, you may knock: discard, then lay down your hand.</li>' +
      '<li>The other player lays down their melds and <b>lays off</b> deadwood on the knocker\'s melds.</li>' +
      '<li>The knocker scores the difference in deadwood.</li>' +
      '<li><b>Undercut:</b> if the other player has the same or less deadwood, they score the difference <b>+ 25</b>.</li>' +
      '<li><b>Gin:</b> knock with no deadwood at all. You score their deadwood <b>+ 25</b> and they can\'t lay off.</li>' +
      '<li>If the stock is down to 2 cards and nobody has knocked, the hand is a draw.</li></ul>' +
      '<h3>Using this scorepad</h3><p>After each hand, tap <b>Add round</b>, say how it ended and who went out, and enter each player\'s deadwood (the other player\'s count is <b>after</b> laying off). The points are worked out for you.</p>' +
      '<h3>End of the game</h3><p>When someone reaches the target, each player gets a <b>25 line bonus</b> for every hand they won, and the winner gets a <b>100 game bonus</b>.</p>'
  });

  function showSetup() {
    Kit.setup(app, {
      players: { min: 2, max: 2, count: 2 },
      options: [{ id: 'target', label: 'Play to', help: 'The game ends when someone reaches this many points; then bonuses are added.', value: 100, choices: [[100, '100 · standard'], [50, '50 · quick']] }],
      start: 'Start scoring',
      onStart: function (cfg) {
        localStorage.setItem(SETUP, JSON.stringify({ names: cfg.players.map(function (p) { return p.name; }), target: +cfg.options.target || 100 }));
        startPad();
      }
    });
  }

  function handRounds() { return pad ? pad.state().rounds.filter(function (r) { return r.label !== 'Bonus'; }) : []; }
  function handTotals(rounds) {
    var t = [0, 0];
    rounds.forEach(function (r) { if (r.label !== 'Bonus') r.scores.forEach(function (v, i) { t[i] += Number(v) || 0; }); });
    return t;
  }
  function wins(rounds) {
    var w = [0, 0];
    rounds.forEach(function (r) { if (r.label === 'Bonus') return; r.scores.forEach(function (v, i) { if (v > 0) w[i]++; }); });
    return w;
  }

  function startPad() {
    var cfg = JSON.parse(localStorage.getItem(SETUP));
    var target = cfg.target;
    function reached() { var t = handTotals(handRounds()); return t[0] >= target || t[1] >= target; }
    pad = Scorepad(app, {
      key: KEY, title: 'Gin Rummy', mode: 'Scorekeeper', target: target,
      sides: cfg.names.map(function (n) { return { name: n }; }),
      goal: 'First to ' + target + ' · 25 per hand won · 100 game bonus',
      isOver: function (t, rounds) { return rounds.length > 0 && rounds[rounds.length - 1].label === 'Bonus'; },
      winner: function (t, rounds) { var h = handTotals(rounds); return h[0] === h[1] ? -1 : h[0] > h[1] ? 0 : 1; },
      form: function (ctx) {
        if ((ctx.prev && ctx.prev.label === 'Bonus') || (!ctx.prev && reached())) bonusForm(ctx);
        else handForm(ctx);
      }
    });

    // ── One hand: how it ended, who went out, deadwood counts ──
    function handForm(ctx) {
      var names = ctx.sides.map(function (s) { return s.name; });
      var how = 'knock', out = -1, pre = null;
      if (ctx.prev) {
        var d = ctx.prev.detail || [], sc = ctx.prev.scores;
        var wi = sc[0] > 0 ? 0 : sc[1] > 0 ? 1 : -1;
        if (d[0] === 'draw' || wi < 0) how = 'draw';
        else if (d[wi] === 'gin') { how = 'gin'; out = wi; pre = [0, 0]; pre[1 - wi] = sc[wi] - 25; }
        else if (d[wi] === 'undercut') { how = 'knock'; out = 1 - wi; pre = [0, 0]; pre[out] = sc[wi] - 25; }
        else { how = 'knock'; out = wi; pre = [0, 0]; pre[1 - wi] = sc[wi]; }
      }
      ctx.node.appendChild(el('div', { class: 'label', text: 'How did the hand end?' }));
      var segHow = el('div', { class: 'seg' });
      [['knock', 'Knock'], ['gin', 'Gin'], ['draw', 'No winner']].forEach(function (c) {
        segHow.appendChild(el('button', { type: 'button', text: c[1], class: how === c[0] ? 'on' : '', onclick: function () {
          how = c[0]; Array.prototype.forEach.call(segHow.children, function (b) { b.classList.toggle('on', b.textContent === c[1]); }); Kit.sfx('tap'); update();
        } }));
      });
      ctx.node.appendChild(segHow);
      var outLbl = el('div', { class: 'label', text: 'Who went out?' });
      var segOut = el('div', { class: 'seg' });
      names.forEach(function (n, i) {
        segOut.appendChild(el('button', { type: 'button', text: n, class: i === out ? 'on' : '', onclick: function () {
          out = i; Array.prototype.forEach.call(segOut.children, function (b, j) { b.classList.toggle('on', j === i); }); Kit.sfx('tap'); update();
        } }));
      });
      ctx.node.appendChild(outLbl); ctx.node.appendChild(segOut);
      var dwLbl = el('div', { class: 'label', text: 'Deadwood' });
      ctx.node.appendChild(dwLbl);
      var rows = names.map(function (n, i) {
        var r = ctx.number(i, { min: 0, max: 100, neg: false, value: pre ? pre[i] : '' });
        r.input.addEventListener('input', update);
        r.querySelectorAll('.pm button').forEach(function (b) { b.addEventListener('click', function () { setTimeout(update, 0); }); });
        ctx.node.appendChild(r); return r;
      });
      var res = el('div', { class: 'res' }); ctx.node.appendChild(res);
      var btn = el('button', { type: 'button', class: 'btn btn-primary btn-block', text: ctx.prev ? 'Save changes' : 'Score this hand' });
      ctx.node.appendChild(btn);

      function calc() {
        if (how === 'draw') return { ok: true, scores: [0, 0], detail: ['draw', 'draw'], big: 'No score', small: 'The stock ran out. Same dealer deals again.' };
        if (out < 0) return { ok: false, msg: 'Pick who went out' };
        var df = 1 - out, k = rows[out].value(), dv = rows[df].value();
        if (how === 'gin') k = 0;
        if (k < 0 || dv < 0) return { ok: false, msg: 'Deadwood can\'t be negative' };
        if (how === 'knock' && k > 10) return { ok: false, msg: 'A knock needs 10 or less deadwood. ' + names[out] + ' has ' + k + '.' };
        if (how === 'knock' && k === 0) return { ok: false, msg: 'No deadwood is gin. Pick Gin above.' };
        if (dv > 98) return { ok: false, msg: 'That deadwood count is too high' };
        var s = [0, 0], det = ['', ''], hl = [];
        if (how === 'gin') {
          s[out] = dv + 25; det[out] = 'gin';
          hl.push(names[out] + ' went gin in hand ' + ctx.round + (dv >= 30 ? ', catching ' + names[df] + ' with ' + dv + ' deadwood' : ''));
          return { ok: true, scores: s, detail: det, hl: hl, gin: true, big: names[out] + ' scores ' + s[out], small: dv + ' deadwood + 25 gin bonus' };
        }
        if (dv <= k) {
          s[df] = k - dv + 25; det[df] = 'undercut';
          hl.push('Undercut! ' + names[df] + ' caught ' + names[out] + ' knocking with ' + k + ' in hand ' + ctx.round);
          return { ok: true, scores: s, detail: det, hl: hl, under: true, big: 'Undercut! ' + names[df] + ' scores ' + s[df], small: k + ' − ' + dv + ' + 25 undercut bonus' };
        }
        s[out] = dv - k; det[out] = 'knock';
        if (k <= 2) hl.push(names[out] + ' knocked with just ' + k + ' deadwood in hand ' + ctx.round);
        return { ok: true, scores: s, detail: det, hl: hl, big: names[out] + ' scores ' + s[out], small: dv + ' − ' + k + ' deadwood' };
      }
      function update() {
        var draw = how === 'draw';
        outLbl.hidden = draw; segOut.hidden = draw; dwLbl.hidden = draw;
        rows.forEach(function (r, i) {
          r.hidden = draw;
          var ginK = how === 'gin' && i === out;
          r.classList.toggle('off', ginK); r.input.disabled = ginK;
          if (ginK) r.input.value = '0';
          var nmEl = r.querySelector('.nm');
          nmEl.innerHTML = Kit.esc(names[i]) + (out < 0 ? '' : '<span class="sub">' + (i === out ? (how === 'gin' ? 'went gin' : 'knocked') : how === 'gin' ? 'all cards count' : 'after laying off') + '</span>');
        });
        var c = calc();
        res.className = 'res' + (c.ok ? '' : ' bad');
        res.innerHTML = c.ok ? '<div class="big display">' + Kit.esc(c.big) + '</div><small>' + Kit.esc(c.small) + '</small>' : '<div class="big">' + Kit.esc(c.msg) + '</div>';
        btn.disabled = !c.ok;
        return c;
      }
      btn.addEventListener('click', function () {
        var c = update(); if (!c.ok) return;
        var extra = { detail: c.detail, highlights: ctx.prev ? [] : (c.hl || []) };
        if (c.gin) { extra.callout = 'Gin!'; Kit.confetti({ count: 80 }); }
        else if (c.under) extra.callout = 'Undercut!';
        ctx.done(c.scores, extra);
        if (!ctx.prev && reached()) setTimeout(function () { Kit.callout('Game!'); setTimeout(function () { pad.addRound(); }, 900); }, 500);
      });
      update();
    }

    // ── End of game: line bonuses and game bonus ──
    function bonusForm(ctx) {
      var rounds = handRounds(), t = handTotals(rounds), w = wins(rounds), names = ctx.sides.map(function (s) { return s.name; });
      var win = t[0] === t[1] ? -1 : t[0] > t[1] ? 0 : 1;
      var bonus = [0, 1].map(function (i) { return w[i] * 25 + (i === win ? 100 : 0); });
      ctx.node.appendChild(el('p', { class: 'muted', text: win >= 0 ? names[win] + ' reached ' + target + '. Time for the bonuses.' : 'Hand points are tied.' }));
      var tb = el('table', { class: 'bon' });
      tb.appendChild(el('tr', null, [el('th', { text: '' }), el('th', { text: 'Hands' }), el('th', { text: 'Line' }), el('th', { text: 'Game' }), el('th', { text: 'Final' })]));
      names.forEach(function (n, i) {
        tb.appendChild(el('tr', null, [el('td', { text: n }), el('td', { text: String(t[i]) }), el('td', { text: w[i] + ' × 25' }), el('td', { text: i === win ? '100' : '0' }), el('td', { class: 'big', text: String(t[i] + bonus[i]) })]));
      });
      ctx.node.appendChild(tb);
      ctx.node.appendChild(el('button', { type: 'button', class: 'btn btn-primary btn-block', html: Kit.icon('trophy') + '<span>Add bonuses and finish</span>', onclick: function () {
        var hl = [];
        if (win >= 0 && !w[1 - win]) hl.push(names[win] + ' won every hand: a shutout');
        var streak = 0, sp = -1, bestS = 0, bestP = -1;
        rounds.forEach(function (r) { var p = r.scores[0] > 0 ? 0 : r.scores[1] > 0 ? 1 : -1; if (p < 0) return; if (p === sp) streak++; else { sp = p; streak = 1; } if (streak > bestS) { bestS = streak; bestP = p; } });
        if (bestS >= 3) hl.push('Longest winning streak: ' + names[bestP] + ', ' + bestS + ' hands');
        if (win >= 0) hl.push(names[win] + ' won ' + w[win] + ' hands to ' + w[1 - win]);
        ctx.done(bonus, { label: 'Bonus', detail: [w[0] + ' won', w[1] + ' won'], highlights: ctx.prev ? [] : hl });
      } }));
    }
  }

  if (localStorage.getItem(SETUP)) startPad(); else showSetup();
})();
</script>
</body>
</html>

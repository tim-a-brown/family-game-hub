<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gin Rummy Scorekeeper</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
.spad th.rn{width:54px;letter-spacing:.02em;}
/* The open hand: who went out (Knock or Gin) in their column, then deadwood */
.gr-out{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.spad td.gr-span{text-align:center;padding:4px 6px 6px;}
.gr-span .sp-tg{width:auto;display:inline-flex;padding:2px 14px;}
.gr-bon{display:flex;flex-direction:column;gap:1px;font-family:var(--hand);font-size:.95rem;line-height:1.15;color:#6a6a80;padding:4px 0 2px;}
.gr-bon b{font-weight:400;font-size:1.5rem;color:var(--ink);}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app'), pad = null;
  var SETUP = 'gin_pad_setup', KEY = 'rm', AI_KEY = 'gin';

  Kit.init({
    id: 'gin-rummy', title: 'Gin score',
    onNew: function () { if (pad) pad.clear(); localStorage.removeItem(SETUP); showSetup(); },
    undo: function () { if (pad) pad.undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history(AI_KEY, { keys: [KEY], title: 'Gin Rummy: past games' }); } }],
    rules:
      '<p class="goal">Play Gin Rummy with a real deck and keep score here. First to <b>100</b> wins the game.</p>' +
      '<h3>The game</h3><ul><li>Deal 10 cards each. Turn the next card face up to start the discard pile. The rest is the stock.</li>' +
      '<li>The non-dealer may take the first upcard. If they pass, the dealer may. If both pass, the non-dealer draws from the stock.</li>' +
      '<li>On your turn, draw from the stock or the discard pile, then discard one card. You can\'t throw back a card you just picked up.</li>' +
      '<li>Make <b>sets</b> (3 or 4 of a rank) and <b>runs</b> (3+ in a row, same suit, ace low). Cards not in a meld are <b>deadwood</b>: Ace 1, number cards face value, J Q K 10.</li></ul>' +
      '<h3>Knocking</h3><ul><li>When your deadwood is <b>10 or less</b>, you may knock: discard, then lay down your hand.</li>' +
      '<li>The other player lays down their melds and <b>lays off</b> deadwood on the knocker\'s melds.</li>' +
      '<li>The knocker scores the difference in deadwood.</li>' +
      '<li><b>Undercut:</b> if the other player has the same or less deadwood, they score the difference <b>+ 25</b>.</li>' +
      '<li><b>Gin:</b> knock with no deadwood at all. You score their deadwood <b>+ 25</b> and they can\'t lay off.</li>' +
      '<li>If the stock is down to 2 cards and nobody has knocked, the hand is a draw.</li></ul>' +
      '<h3>Using this scorepad</h3><p>The open rows on the sheet are this hand. In the column of whoever went out, tap <b>Knock</b> or <b>Gin</b>, then set each player\'s deadwood (the other player\'s count is <b>after</b> laying off). Undercuts are spotted for you. If the stock ran out, tap <b>No winner</b>. Tap <b>Lock hand</b> to write it in; tap a hand on the sheet to change or delete it right there.</p>' +
      '<h3>End of the game</h3><p>When someone reaches the target, each player gets a <b>25 line bonus</b> for every hand they won, and the winner gets a <b>100 game bonus</b>.</p>'
  });

  function showSetup() {
    Kit.setup(app, {
      players: { min: 2, max: 2, count: 2 },
      options: [{ id: 'target', label: 'Play to', help: 'The game ends when someone reaches this many points; then bonuses are added.', value: 100, choices: [[100, '100 · standard'], [50, '50 · quick']] }],
      start: 'Start scoring',
      onStart: function (cfg) {
        localStorage.setItem(SETUP, JSON.stringify({ names: cfg.players.map(function (p) { return p.name; }), target: +cfg.options.target || 100 }));
        startPad();
      }
    });
  }

  function handRounds(rs) { rs = rs || (pad ? pad.state().rounds : []); return rs.filter(function (r) { return r.label !== 'Bonus'; }); }
  function handTotals(rounds) {
    var t = [0, 0];
    rounds.forEach(function (r) { if (r.label !== 'Bonus') r.scores.forEach(function (v, i) { t[i] += Number(v) || 0; }); });
    return t;
  }
  function wins(rounds) {
    var w = [0, 0];
    rounds.forEach(function (r) { if (r.label === 'Bonus') return; r.scores.forEach(function (v, i) { if (v > 0) w[i]++; }); });
    return w;
  }

  function startPad() {
    var cfg = JSON.parse(localStorage.getItem(SETUP));
    var target = cfg.target;
    function reached(rs) { var t = handTotals(handRounds(rs)); return t[0] >= target || t[1] >= target; }
    pad = Scorepad(app, {
      key: KEY, title: 'Gin Rummy', mode: 'Scorekeeper', target: target,
      sides: cfg.names.map(function (n) { return { name: n }; }),
      goal: 'First to ' + target + ' · 25 per hand won · 100 game bonus',
      isOver: function (t, rounds) { return rounds.length > 0 && rounds[rounds.length - 1].label === 'Bonus'; },
      winner: function (t, rounds) { var h = handTotals(rounds); return h[0] === h[1] ? -1 : h[0] > h[1] ? 0 : 1; },
      entryRows: function (ctx) {
        if ((ctx.editing && ctx.prev.label === 'Bonus') || (!ctx.editing && reached(ctx.rounds))) return bonusRows(ctx);
        return handRows(ctx);
      },
      onLock: function (ctx) { ctx.entry.lock(); },
      lockLabel: function (ctx) { return ctx.entry && ctx.entry.bonus ? 'Add bonuses and finish' : 'Lock hand ' + ctx.round; }
    });

    // ── One hand on the sheet: who went out and how, then deadwood ──
    // st = {how: 'knock'|'gin'|'draw', out: -1|0|1, dw: [n|null, n|null]}
    function handRows(ctx) {
      var names = ctx.sides.map(function (s) { return s.name; }), st = null;
      if (ctx.editing) {
        var d = ctx.prev.detail || [], sc = ctx.prev.scores, how = 'knock', out = -1, pre = [null, null];
        var wi = sc[0] > 0 ? 0 : sc[1] > 0 ? 1 : -1;
        if (d[0] === 'draw' || wi < 0) how = 'draw';
        else if (d[wi] === 'gin') { how = 'gin'; out = wi; pre = [0, 0]; pre[1 - wi] = sc[wi] - 25; }
        else if (d[wi] === 'undercut') { how = 'knock'; out = 1 - wi; pre = [0, 0]; pre[out] = sc[wi] - 25; }
        else { how = 'knock'; out = wi; pre = [0, 0]; pre[1 - wi] = sc[wi]; }
        st = { how: how, out: out, dw: pre };
        // Hands entered on the sheet also keep the real deadwood counts (only the difference is in the score)
        var dd = ctx.prev.data;
        if (dd && dd.how && Array.isArray(dd.dw)) st = { how: dd.how, out: dd.out, dw: dd.dw.slice() };
      } else st = ctx.draft() || { how: 'knock', out: -1, dw: [null, null] };
      var rowOut = el('tr', { class: 'open' }, [el('th', { class: 'rn' }, [String(ctx.round), el('small', { text: 'WENT OUT' })])]);
      var rowDraw = el('tr', { class: 'sub' }, [el('th', { class: 'rn', text: '' })]);
      var rowDw = el('tr', { class: 'open' }, [el('th', { class: 'rn' }, [el('small', { text: 'DEAD' + '­WOOD' })])]);
      var kB = [], gB = [], steps = [], eqs = [];
      names.forEach(function (nm, i) {
        kB[i] = Scorepad.tog('Knock', { cls: 'gold', aria: nm + ' knocked', onClick: function () { if (st.how === 'knock' && st.out === i) st.out = -1; else { st.how = 'knock'; st.out = i; } refresh(); } });
        gB[i] = Scorepad.tog('Gin', { cls: 'good', aria: nm + ' went gin', onClick: function () { if (st.how === 'gin' && st.out === i) st.out = -1; else { st.how = 'gin'; st.out = i; } refresh(); } });
        rowOut.appendChild(el('td', null, [el('div', { class: 'gr-out' }, [kB[i], gB[i]])]));
        steps[i] = Scorepad.step({ value: st.dw[i], min: 0, max: 100, label: nm + ' deadwood', onChange: function (v) { st.dw[i] = v; refresh(); } });
        eqs[i] = el('small', { class: 'eq' });
        rowDw.appendChild(el('td', null, [steps[i], eqs[i]]));
      });
      var drawB = Scorepad.tog('No winner (stock ran out)', { aria: 'No winner: the stock ran out', onClick: function () { st.how = st.how === 'draw' ? 'knock' : 'draw'; refresh(); } });
      rowDraw.appendChild(el('td', { class: 'gr-span', colspan: '2' }, [drawB]));
      function val(i) { return Number(st.dw[i]) || 0; }
      // Same scoring as always: knock = difference, undercut = difference + 25, gin = their deadwood + 25
      function calc() {
        var how = st.how, out = st.out;
        if (how === 'draw') return { ok: true, scores: [0, 0], detail: ['draw', 'draw'], msg: 'No score. The same dealer deals again.' };
        if (out < 0) return { ok: 'wait', msg: 'Tap Knock or Gin for whoever went out.' };
        var df = 1 - out, k = val(out), dv = val(df);
        if (how === 'gin') k = 0;
        if ((how !== 'gin' && st.dw[out] == null) || st.dw[df] == null) return { ok: 'wait', msg: 'Set both players\' deadwood' + (how === 'gin' ? '.' : ' (' + names[df] + '\'s after laying off).') };
        if (k < 0 || dv < 0) return { ok: false, msg: 'Deadwood can\'t be negative.' };
        if (how === 'knock' && k > 10) return { ok: false, msg: 'A knock needs 10 or less deadwood. ' + names[out] + ' has ' + k + '.' };
        if (how === 'knock' && k === 0) return { ok: false, msg: 'No deadwood is gin. Tap Gin instead.' };
        if (dv > 98) return { ok: false, msg: 'That deadwood count is too high.' };
        var s = [0, 0], det = ['', ''], hl = [];
        if (how === 'gin') {
          s[out] = dv + 25; det[out] = 'gin';
          hl.push(names[out] + ' went gin in hand ' + ctx.round + (dv >= 30 ? ', catching ' + names[df] + ' with ' + dv + ' deadwood' : ''));
          return { ok: true, scores: s, detail: det, hl: hl, gin: true, msg: 'Gin! ' + names[out] + ' scores ' + s[out] + ' (' + dv + ' + 25).' };
        }
        if (dv <= k) {
          s[df] = k - dv + 25; det[df] = 'undercut';
          hl.push('Undercut! ' + names[df] + ' caught ' + names[out] + ' knocking with ' + k + ' in hand ' + ctx.round);
          return { ok: true, scores: s, detail: det, hl: hl, under: true, msg: 'Undercut! ' + names[df] + ' scores ' + s[df] + ' (' + k + ' − ' + dv + ' + 25).' };
        }
        s[out] = dv - k; det[out] = 'knock';
        if (k <= 2) hl.push(names[out] + ' knocked with just ' + k + ' deadwood in hand ' + ctx.round);
        return { ok: true, scores: s, detail: det, hl: hl, msg: names[out] + ' scores ' + s[out] + ' (' + dv + ' − ' + k + ').' };
      }
      function refresh() {
        var draw = st.how === 'draw';
        names.forEach(function (nm, i) {
          kB[i].set(!draw && st.how === 'knock' && st.out === i); gB[i].set(!draw && st.how === 'gin' && st.out === i);
          kB[i].disabled = gB[i].disabled = draw;
          var ginK = !draw && st.how === 'gin' && st.out === i;
          if (ginK) { st.dw[i] = 0; steps[i].set(0); }
          steps[i].disable(draw || ginK);
        });
        drawB.set(draw);
        var c = calc();
        eqs.forEach(function (e, i) {
          e.className = 'eq';
          if (draw) { e.textContent = ''; return; }
          if (st.out >= 0) e.textContent = i === st.out ? (st.how === 'gin' ? 'went gin' : 'knocked') : st.how === 'gin' ? 'all count' : 'after lay-off';
          if (c.ok === true && c.scores[i] > 0) { e.textContent = '+' + c.scores[i] + (c.under ? ' undercut' : c.gin ? ' gin' : ''); e.classList.add('good'); }
        });
        ctx.pending(c.ok === true ? c.scores : null);
        ctx.status(c.msg, c.ok);
        if (!ctx.editing) ctx.draft(st);
        return c;
      }
      refresh();
      ctx.entry = { lock: function () {
        var c = refresh(); if (c.ok !== true) return;
        var extra = { detail: c.detail, highlights: ctx.editing ? [] : (c.hl || []), data: { how: st.how, out: st.out, dw: st.how === 'draw' ? [null, null] : st.dw.slice() } };
        if (c.gin) { extra.callout = 'Gin!'; if (!ctx.editing) Kit.confetti({ count: 80 }); }
        else if (c.under) extra.callout = 'Undercut!';
        var rs = ctx.rounds.slice(); rs.push({ scores: c.scores, label: '' });
        ctx.done(c.scores, extra);
        // Someone reached the target: the bonus row opens on the sheet
        if (!ctx.editing && reached(rs)) setTimeout(function () { Kit.callout('Game!'); }, extra.callout ? 1100 : 300);
      } };
      return [rowOut, rowDraw, rowDw];
    }

    // ── End of game: line bonuses and game bonus, written in as the last row ──
    function bonusRows(ctx) {
      var rounds = handRounds(ctx.rounds), t = handTotals(rounds), w = wins(rounds), names = ctx.sides.map(function (s) { return s.name; });
      var win = t[0] === t[1] ? -1 : t[0] > t[1] ? 0 : 1;
      var bonus = [0, 1].map(function (i) { return w[i] * 25 + (i === win ? 100 : 0); });
      var row = el('tr', { class: 'open' }, [el('th', { class: 'rn', text: 'BONUS' })]);
      names.forEach(function (n, i) {
        row.appendChild(el('td', null, [el('div', { class: 'gr-bon' }, [
          el('b', { text: '+' + bonus[i] }),
          el('span', { text: w[i] + ' × 25 line' }),
          el('span', { text: i === win ? '+ 100 game' : '' })
        ])]));
      });
      ctx.pending(bonus);
      ctx.status(win >= 0 ? names[win] + ' reached ' + target + '. Add the bonuses to finish.' : 'Hand points are tied.', true);
      ctx.entry = { bonus: true, lock: function () {
        var hl = [];
        if (win >= 0 && !w[1 - win]) hl.push(names[win] + ' won every hand: a shutout');
        var streak = 0, sp = -1, bestS = 0, bestP = -1;
        rounds.forEach(function (r) { var p = r.scores[0] > 0 ? 0 : r.scores[1] > 0 ? 1 : -1; if (p < 0) return; if (p === sp) streak++; else { sp = p; streak = 1; } if (streak > bestS) { bestS = streak; bestP = p; } });
        if (bestS >= 3) hl.push('Longest winning streak: ' + names[bestP] + ', ' + bestS + ' hands');
        if (win >= 0) hl.push(names[win] + ' won ' + w[win] + ' hands to ' + w[1 - win]);
        ctx.done(bonus, { label: 'Bonus', detail: [w[0] + ' won', w[1] + ' won'], highlights: ctx.editing ? [] : hl });
      } };
      return [row];
    }
  }

  if (localStorage.getItem(SETUP)) startPad(); else showSetup();
})();
</script>
</body>
</html>

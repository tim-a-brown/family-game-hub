<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d12">
<title>Connect Four</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
:root{--R:#ff5a4f;--Y:#f5c842;--bs:clamp(260px,min(100vw - 32px,(100vh - 360px) * 7 / 6),500px);}
@supports (height:100dvh){:root{--bs:clamp(260px,min(100vw - 32px,(100dvh - 360px) * 7 / 6),500px);}}
.site-nav button.icon-btn{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;display:inline-grid;place-items:center;}
.icon-btn svg{width:18px;height:18px;}
.gk{width:var(--bs);max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
.gk .tabs{margin:0;}
.score-row{display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px;}
.score-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:border-color .25s var(--ease),background .25s,box-shadow .25s;}
.score-chip.on{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,transparent),transparent),var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 12%,transparent);}
.sc-lbl{display:flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;color:var(--text-2);}
.sc-lbl .dot{width:12px;height:12px;border-radius:50%;background:var(--c);}
.sc-val{font-family:var(--display);font-size:1.55rem;font-weight:800;line-height:1;color:var(--c);font-variant-numeric:tabular-nums;}
.status-bar{text-align:center;font-size:.95rem;font-weight:600;color:var(--text-2);min-height:24px;}
.status-bar b{color:var(--text);}

/* Drop row */
.cf-drops{display:grid;grid-template-columns:repeat(7,1fr);padding:0 calc(var(--bs) * .025);gap:calc(var(--bs) * .012);}
.drop-btn{height:40px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:12px;padding:0;}
.drop-btn .ghost{width:62%;aspect-ratio:1;border-radius:50%;background:var(--pc);opacity:.22;transition:opacity .15s,transform .15s var(--spring);}
.drop-btn:active .ghost,.drop-btn.hot .ghost{opacity:.9;transform:translateY(3px);}
@media (hover:hover){.drop-btn:hover .ghost{opacity:.9;}}
.drop-btn:disabled{cursor:default;}
.drop-btn:disabled .ghost{opacity:0;}

/* Board */
.cf-wrap{position:relative;}
.cf-board{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:calc(var(--bs) * .012);padding:calc(var(--bs) * .025);border-radius:18px;
  background:linear-gradient(180deg,#2f5bd8,#2147b5);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.2);cursor:pointer;touch-action:manipulation;}
.cf-cell{aspect-ratio:1;border-radius:50%;background:#0f1424;box-shadow:inset 0 3px 6px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.12);position:relative;}
.cf-cell .disc{position:absolute;inset:4%;border-radius:50%;}
.cf-cell.R .disc{background:radial-gradient(circle at 36% 32%,#ff9a90,var(--R) 50%,#b32118);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 0 0 4px rgba(0,0,0,.08);}
.cf-cell.Y .disc{background:radial-gradient(circle at 36% 32%,#fff0b0,var(--Y) 50%,#c98a00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 0 0 4px rgba(0,0,0,.06);}
.cf-cell.last .disc::after{content:'';position:absolute;inset:34%;border-radius:50%;border:2px solid rgba(255,255,255,.45);}
.cf-cell.win .disc{animation:cf-win .9s ease-in-out infinite alternate;box-shadow:0 0 0 3px #fff,0 0 18px 4px rgba(255,255,255,.55);}
.cf-board.done .cf-cell:not(.win) .disc{opacity:.55;}
@keyframes cf-win{to{transform:scale(.9);}}
@keyframes cf-drop{
  0%{transform:translateY(var(--dy,-200px));}
  70%{transform:translateY(0);}
  82%{transform:translateY(-8%);}
  100%{transform:translateY(0);}
}
.cf-dropping .disc{animation:cf-drop var(--dd,.38s) cubic-bezier(.45,0,.75,1);z-index:3;}
.cf-col-hl{position:absolute;top:0;bottom:0;border-radius:14px;background:rgba(255,255,255,.07);pointer-events:none;transition:left .12s var(--ease);}
.btn-row{display:flex;justify-content:center;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Connect Four</span>
  <button class="icon-btn" id="newgame" aria-label="New game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
</nav>
<div class="page">
<div class="gk">
  <div class="tabs" role="tablist">
    <button class="tab active" id="vsAI">vs Computer</button>
    <button class="tab" id="vs2p">2 Players</button>
  </div>
  <div class="score-row">
    <div class="score-chip" id="chip-R" style="--c:var(--R)"><div class="sc-lbl"><span class="dot"></span><span id="p1lbl">You</span></div><div class="sc-val" id="rscore">0</div></div>
    <div class="score-chip" style="--c:var(--text-2)"><div class="sc-lbl">Draws</div><div class="sc-val" id="dscore">0</div></div>
    <div class="score-chip" id="chip-Y" style="--c:var(--Y)"><div class="sc-lbl"><span class="dot"></span><span id="p2lbl">Computer</span></div><div class="sc-val" id="yscore">0</div></div>
  </div>
  <div class="status-bar" id="status">Your turn</div>
  <div>
    <div class="cf-drops" id="drops"></div>
    <div class="cf-wrap"><div class="cf-board" id="board"></div></div>
  </div>
</div>
</div>
<script>
'use strict';
window.GN=window.GN||{haptic(){},toast(){},sheet(){return{close(){},el:document.createElement('div')};},confirm:()=>Promise.resolve(true)};
const ROWS=6,COLS=7;
let grid,cur,over,ai=true,scores={R:0,Y:0,D:0};
let lastDrop=null; // {r,c} for animation
let lastCell=null, aiTimer=null, busy=false;

function emptyGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(''));}
function pname(p){return ai?(p==='R'?'You':'Computer'):(p==='R'?'Red':'Yellow');}
function setStatus(h){document.getElementById('status').innerHTML=h;}
function turnStatus(){
  if(over)return;
  if(ai)setStatus(cur==='R'?'<b>Your turn</b> · tap a column':'Computer is thinking…');
  else setStatus(`<b style="color:var(--${cur})">${pname(cur)}</b>'s turn`);
}

function init(){clearTimeout(aiTimer);grid=emptyGrid();cur='R';over=false;lastCell=null;busy=false;render();turnStatus();}

function colFull(col){return !!grid[0][col];}
function canHumanDrop(){return !over&&!busy&&!(ai&&cur==='Y');}

function drop(col){
  if(over)return;
  let landRow=-1;
  for(let r=ROWS-1;r>=0;r--){
    if(!grid[r][col]){sDrop();grid[r][col]=cur;landRow=r;break;}
    else if(r===0){GN.haptic('error');return;}
  }
  lastDrop={r:landRow,c:col};lastCell={r:landRow,c:col};
  GN.haptic('light');
  const w=checkWin();
  if(w){over=true;scores[cur]++;updateScores();
    const lost=ai&&cur==='Y';
    lost?sLose():sWin();
    setTimeout(()=>GN.haptic(lost?'error':'success'),300);
    setStatus(`<b style="color:var(--${cur})">${ai?(lost?'Computer wins':'You win! 🎉'):pname(cur)+' wins! 🎉'}</b>`);
    render(w);
    endSheet(ai?(lost?'Computer wins':'You win! 🏆'):`${pname(cur)} wins! 🏆`,'Four in a row.');
    return;}
  if(grid[0].every(v=>v)){
    over=true;scores.D++;updateScores();
    sDraw();GN.haptic('medium');setStatus('<b>Board full — it\'s a draw</b>');render();
    endSheet("It's a draw",'The board is full with no four in a row.');
    return;}
  cur=cur==='R'?'Y':'R';
  render();
  turnStatus();
  if(ai&&cur==='Y'&&!over){
    busy=true;
    aiTimer=setTimeout(()=>{busy=false;aiMove();},550);
  }
}

function endSheet(title,body){
  setTimeout(()=>GN.sheet({title,body:`${body}<br><span style="color:var(--text-3);font-size:.85rem">Score · ${pname('R')} ${scores.R} – ${scores.Y} ${pname('Y')}${scores.D?` · ${scores.D} draw${scores.D>1?'s':''}`:''}</span>`,
    actions:[{label:'Play again',primary:true,onClick:()=>{try{sessionStorage.removeItem('c4');}catch(e){}init();}},{label:'View board'}]}),900);
}

function checkWin(g=grid){
  const check=(r,c,dr,dc)=>{
    const p=g[r][c];if(!p)return null;
    const cells=[[r,c]];
    for(let k=1;k<4;k++){
      const nr=r+dr*k,nc=c+dc*k;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS||g[nr][nc]!==p)return null;
      cells.push([nr,nc]);
    }
    return cells;
  };
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
      const w=check(r,c,dr,dc);if(w)return w;
    }
  }
  return null;
}

function score(g,p){
  let s=0;
  const other=p==='Y'?'R':'Y';
  const eval4=(cells)=>{
    const mine=cells.filter(([r,c])=>g[r][c]===p).length;
    const opp=cells.filter(([r,c])=>g[r][c]===other).length;
    if(opp>0)return 0;
    return [0,1,10,50,1000][mine];
  };
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
      const cells=[];let valid=true;
      for(let k=0;k<4;k++){const nr=r+dr*k,nc=c+dc*k;if(nr<0||nr>=ROWS||nc<0||nc>=COLS){valid=false;break;}cells.push([nr,nc]);}
      if(valid)s+=eval4(cells);
    }
  }
  return s;
}

function aiMove(){
  if(over||!ai||cur!=='Y')return;
  let best=-Infinity,bestCol=-1;
  for(let c=0;c<COLS;c++){
    if(colFull(c))continue; // never pick a full column
    const g=grid.map(r=>[...r]);
    for(let r=ROWS-1;r>=0;r--){if(!g[r][c]){g[r][c]='Y';break;}}
    if(checkWin(g)){bestCol=c;break;}
    const s=score(g,'Y')-score(g,'R');
    if(s>best){best=s;bestCol=c;}
  }
  if(bestCol<0)return;
  drop(bestCol);
}

function render(winCells=null){
  const b=document.getElementById('board');b.innerHTML='';
  b.classList.toggle('done',!!winCells);
  const wset=winCells?new Set(winCells.map(([r,c])=>r*COLS+c)):new Set();
  grid.forEach((row,r)=>row.forEach((v,c)=>{
    const cell=document.createElement('div');
    cell.className='cf-cell'+(v?' '+v:'')+(wset.has(r*COLS+c)?' win':'')+(lastCell&&lastCell.r===r&&lastCell.c===c&&!winCells?' last':'');
    if(v)cell.innerHTML='<div class="disc"></div>';
    b.appendChild(cell);
  }));
  // Animate last-dropped piece
  if(lastDrop){
    const {r,c}=lastDrop;lastDrop=null;
    const cells=b.querySelectorAll('.cf-cell');
    const cell=cells[r*COLS+c];
    if(cell&&grid[r][c]){
      const cellH=cell.offsetHeight||48;
      const gap=parseFloat(getComputedStyle(b).rowGap)||6;
      const dy=-((r+1)*(cellH+gap)+12);
      const dur=Math.max(0.22,0.16+r*0.06);
      cell.style.setProperty('--dy',dy+'px');
      cell.style.setProperty('--dd',dur+'s');
      cell.classList.add('cf-dropping');
      cell.addEventListener('animationend',()=>cell.classList.remove('cf-dropping'),{once:true});
    }
  }
  const drops=document.getElementById('drops');drops.innerHTML='';
  for(let c=0;c<COLS;c++){
    const btn=document.createElement('button');
    btn.className='drop-btn';btn.dataset.col=c;btn.setAttribute('aria-label','Drop in column '+(c+1));
    btn.style.setProperty('--pc',`var(--${cur})`);
    btn.innerHTML='<span class="ghost"></span>';
    btn.disabled=over||colFull(c)||(ai&&cur==='Y');
    btn.addEventListener('click',()=>{if(canHumanDrop())drop(+btn.dataset.col);});
    drops.appendChild(btn);
  }
  document.getElementById('chip-R').classList.toggle('on',!over&&cur==='R');
  document.getElementById('chip-Y').classList.toggle('on',!over&&cur==='Y');
}

// Tap anywhere in a column on the board to drop there
document.getElementById('board').addEventListener('click',e=>{
  if(!canHumanDrop())return;
  const rc=e.currentTarget.getBoundingClientRect();
  const c=Math.floor((e.clientX-rc.left)/rc.width*COLS);
  if(c<0||c>=COLS)return;
  if(colFull(c)){GN.haptic('error');return;}
  drop(c);
});

function updateScores(){
  document.getElementById('rscore').textContent=scores.R;
  document.getElementById('yscore').textContent=scores.Y;
  document.getElementById('dscore').textContent=scores.D;
}
function syncMode(){
  document.getElementById('vsAI').classList.toggle('active',ai);
  document.getElementById('vs2p').classList.toggle('active',!ai);
  document.getElementById('p1lbl').textContent=ai?'You':'Red';
  document.getElementById('p2lbl').textContent=ai?'Computer':'Yellow';
}
function inProgress(){return !over&&grid.some(r=>r.some(v=>v));}
async function setMode(a){
  if(a===ai)return;
  if(inProgress()&&!(await GN.confirm('Switching modes resets the game and score.',{title:'Switch mode?',ok:'Switch'})))return;
  ai=a;scores={R:0,Y:0,D:0};updateScores();syncMode();
  try{sessionStorage.removeItem('c4');}catch(e){}
  init();
}
document.getElementById('newgame').addEventListener('click',async()=>{
  if(inProgress()&&!(await GN.confirm('The current board will be cleared.',{title:'Start a new game?',ok:'New game'})))return;
  try{sessionStorage.removeItem('c4');}catch(e){}
  init();
});
document.getElementById('vsAI').addEventListener('click',()=>setMode(true));
document.getElementById('vs2p').addEventListener('click',()=>setMode(false));

init();

// ── Sound ────────────────────────────────────────────────────────────────────
let _ac=null,_muted=false;
function sac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function sTone(freq,start,dur,vol,type,ramp){
  try{
  const ctx=sac(),t=ctx.currentTime+start,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(ramp)o.frequency.exponentialRampToValueAtTime(ramp,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.18,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function sNoise(start,dur,fc,q,vol,decay){
  try{
  const ctx=sac(),t=ctx.currentTime+start;
  const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*(decay||0.5)));
  const src=ctx.createBufferSource();src.buffer=buf;
  const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=fc||1000;filt.Q.value=q||2;
  const g=ctx.createGain();g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(filt);filt.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+dur+0.05);
  }catch(e){}
}
function sWin(){if(_muted)return;[523,659,784,1047].forEach((f,i)=>sTone(f,i*.08,.5,.2));}
function sLose(){if(_muted)return;[400,320,240].forEach((f,i)=>sTone(f,i*.1,.35,.18,'triangle'));}
function sClick(pitch){if(_muted)return;sNoise(0,.035,pitch||900,5,.15,.15);}
function sDing(freq,vol){if(_muted)return;sTone(freq||660,0,.35,vol||.18);}

function sDrop(){if(_muted)return;sNoise(0,.05,600,4,.18,.15);sTone(220,.03,.12,.1,'triangle');}
function sDraw(){if(_muted)return;[330,370,330].forEach((f,i)=>sTone(f,i*.08,.25,.14));}

// ── Session persistence ────────────────────────────────────────────────────
function _save_c4(){if(over)return;
  try{sessionStorage.setItem('c4',JSON.stringify({grid,cur,over,ai,scores,lastDrop,_ts:Date.now()}));}catch(e){}
}
function _load_c4(){
  try{
    const raw=sessionStorage.getItem('c4');if(!raw)return false;
    const s=JSON.parse(raw);if(!s||!Array.isArray(s.grid))return false;
    grid=s.grid;cur=s.cur;over=s.over||false;ai=s.ai!==false;scores=s.scores||{R:0,Y:0,D:0};lastDrop=null;
    syncMode();updateScores();render();turnStatus();
    if(!over&&ai&&cur==='Y'){busy=true;aiTimer=setTimeout(()=>{busy=false;aiMove();},600);}
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',_save_c4);
window.addEventListener('pagehide',_save_c4);
_load_c4();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect Four</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<style>
:root{--red-disc:#ff4d5e;--yel-disc:#ffc83d;}
.board-wrap{position:relative;margin:4px auto 0;max-width:460px;}
.drops{display:grid;grid-template-columns:repeat(7,1fr);gap:0;height:44px;margin:0 10px;}
.drops .ghost{width:78%;aspect-ratio:1;margin:auto;border-radius:50%;opacity:0;transition:opacity .15s, transform .2s var(--spring);}
.drops .ghost.show{opacity:.9;transform:translateY(4px);}
.board{
  position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;border-radius:22px;
  background:linear-gradient(180deg,#3b6bff,#2649d6);box-shadow:inset 0 -8px 0 rgba(0,0,0,.2), 0 10px 0 #1b3399, 0 20px 30px rgba(0,0,0,.35);
  touch-action:manipulation;
}
.col{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;border:0;padding:0;background:none;border-radius:14px;}
.col:focus-visible{outline:3px solid #fff;}
.hole{position:relative;aspect-ratio:1;border-radius:50%;background:#140f2e;box-shadow:inset 0 5px 8px rgba(0,0,0,.6);overflow:visible;}
.disc{position:absolute;inset:6%;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.35);}
.disc.r{background:var(--red-disc);}
.disc.y{background:var(--yel-disc);}
.disc.fall{animation:fall var(--t,.4s) cubic-bezier(.5,0,.75,0) both, land .3s var(--spring) var(--t,.4s);}
@keyframes fall{from{transform:translateY(var(--from));}to{transform:translateY(0);}}
@keyframes land{0%{transform:scaleY(.85) scaleX(1.08);}100%{transform:none;}}
.disc.win{animation:winpulse .8s ease-in-out infinite alternate;box-shadow:0 0 0 4px #fff, 0 0 22px #fff;}
@keyframes winpulse{to{transform:scale(1.1);}}
.legs{display:flex;justify-content:space-between;margin:0 18px;}
.legs i{width:22px;height:26px;background:#1b3399;border-radius:0 0 8px 8px;}
.who{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 6px;}
.mini{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
.mini.r{background:var(--red-disc);} .mini.y{background:var(--yel-disc);}
.series{text-align:center;color:var(--text-3);font-weight:800;font-size:.85rem;margin-top:16px;}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px;}

/* iPad / large screens: bigger board; landscape puts scores and status beside it */
@media (min-width:700px) and (orientation:portrait){
  #app.stage.ipl{max-width:760px;}
  .board-wrap{max-width:min(680px,calc((100dvh - 420px) * 7 / 6));}
  .board{gap:8px;padding:12px;border-radius:26px;}
  .col{gap:8px;}
  .drops{height:76px;margin:0 12px;}
  .drops .ghost{width:auto;height:92%;margin:auto;}
  .score .nm{max-width:200px;font-size:.9rem;}
}
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  #app.stage.ipl{max-width:none;display:grid;grid-template-columns:auto minmax(240px,300px);grid-template-rows:auto auto auto 1fr;
    column-gap:32px;justify-content:center;align-content:start;padding-bottom:calc(var(--safe-b) + 12px);}
  #app.ipl>.board-wrap{grid-column:1;grid-row:1 / span 4;width:min(720px,calc((100dvh - 206px) * 7 / 6 + 20px),calc(100vw - 400px));max-width:none;margin:0;}
  #app.ipl>.board-wrap .drops{height:60px;}
  #app.ipl>.board-wrap .drops .ghost{width:auto;height:92%;}
  #app.ipl>.scores{grid-column:2;flex-direction:column;margin-top:44px;overflow:visible;}
  #app.ipl>.scores .score .nm{max-width:220px;font-size:.9rem;}
  #app.ipl>.turn{grid-column:2;justify-self:start;}
  #app.ipl>.series{grid-column:2;text-align:left;}
  #app.ipl>.actions{grid-column:2;justify-content:flex-start;}
}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  var el = Kit.el, app = document.getElementById('app');
  var ROWS = 6, COLS = 7, SAVE = 'c4_state';

  Kit.init({
    id: 'connectfour',
    onNew: function () { clearSave(); showSetup(); },
    undo: function () { undo(); },
    menu: [{ icon: 'history', label: 'Past games', onClick: function () { Kit.history('c4', { title: 'Connect Four: past games' }); } }],
    rules:
      '<p class="goal">Be the first to line up <b>four of your discs</b> in a row: across, up and down, or diagonally.</p>' +
      '<h3>How it works</h3><ul><li>Players take turns dropping one disc into any column. It falls to the lowest empty spot.</li>' +
      '<li>Tap a column to drop your disc.</li><li>If the board fills up with no four in a row, it\'s a draw.</li><li>The starting player switches every game.</li></ul>' +
      '<h3>Tips</h3><ul><li>The middle column is the strongest. It\'s part of the most possible lines.</li><li>Watch for "traps": two ways to win at once.</li></ul>'
  });

  var S = null; // {players:[{name,cpu,color,disc}], grid[r][c] 0/1/2, cur, first, moves:[c], over, wins:[a,b,draws], level}
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} if (!S.over) Kit.resume.set(S.moves.length ? 'Game ' + (S.wins[0] + S.wins[1] + S.wins[2] + 1) : 'Ready'); }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  function showSetup() {
    S = null;
    app.classList.remove('ipl');
    Kit.setup(app, {
      modes: [
        { id: 'cpu', icon: 'bot', title: 'vs Computer', desc: 'Can you outsmart it?' },
        { id: '2p', icon: 'users', title: 'Two players', desc: 'Pass the phone back and forth' }
      ],
      options: [{ id: 'level', label: 'Computer skill', value: 'med', choices: [['easy', 'Easy', 'Looks a little ahead and sometimes drops a disc anywhere.'], ['med', 'Medium', 'Looks a few moves ahead.'], ['hard', 'Hard', 'Looks far ahead and rarely misses a threat.']], when: function (m) { return m === 'cpu'; } }],
      players: { min: 2, max: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },
      onStart: function (cfg) {
        S = {
          players: cfg.players.map(function (p, i) { return { name: p.name, cpu: p.cpu, disc: i === 0 ? 'r' : 'y' }; }),
          level: cfg.options.level || 'med', wins: [0, 0, 0], first: 0
        };
        newRound();
      }
    });
  }

  function newRound() {
    S.grid = []; for (var r = 0; r < ROWS; r++) S.grid.push([0, 0, 0, 0, 0, 0, 0]);
    S.cur = S.first; S.moves = []; S.over = false; S.line = null; S.started = Date.now();
    save(); render(); maybeCpu();
  }

  // ── Board logic ───────────────────────────────────────────────────────────
  function openRow(g, c) { for (var r = ROWS - 1; r >= 0; r--) if (!g[r][c]) return r; return -1; }
  function findLine(g, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      if (g[r][c] !== who) continue;
      for (var d = 0; d < 4; d++) {
        var line = [[r, c]], k;
        for (k = 1; k < 4; k++) {
          var rr = r + dirs[d][0] * k, cc = c + dirs[d][1] * k;
          if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || g[rr][cc] !== who) break;
          line.push([rr, cc]);
        }
        if (k === 4) return line;
      }
    }
    return null;
  }
  function full(g) { return g[0].every(Boolean); }

  // ── AI: alpha-beta minimax with a window-count heuristic ──────────────────
  function scoreWindow(w, me) {
    var mine = 0, theirs = 0, empty = 0, opp = 3 - me;
    w.forEach(function (v) { if (v === me) mine++; else if (v === opp) theirs++; else empty++; });
    if (mine === 4) return 1000;
    if (mine === 3 && empty === 1) return 6;
    if (mine === 2 && empty === 2) return 2;
    if (theirs === 3 && empty === 1) return -8;
    return 0;
  }
  function evaluate(g, me) {
    var s = 0, r, c;
    for (r = 0; r < ROWS; r++) if (g[r][3] === me) s += 4;
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
      if (c + 3 < COLS) s += scoreWindow([g[r][c], g[r][c + 1], g[r][c + 2], g[r][c + 3]], me);
      if (r + 3 < ROWS) s += scoreWindow([g[r][c], g[r + 1][c], g[r + 2][c], g[r + 3][c]], me);
      if (r + 3 < ROWS && c + 3 < COLS) s += scoreWindow([g[r][c], g[r + 1][c + 1], g[r + 2][c + 2], g[r + 3][c + 3]], me);
      if (r + 3 < ROWS && c - 3 >= 0) s += scoreWindow([g[r][c], g[r + 1][c - 1], g[r + 2][c - 2], g[r + 3][c - 3]], me);
    }
    return s;
  }
  var ORDER = [3, 2, 4, 1, 5, 0, 6];
  function minimax(g, depth, a, b, maxing, me) {
    var opp = 3 - me;
    if (findLine(g, me)) return 100000 + depth;
    if (findLine(g, opp)) return -100000 - depth;
    if (depth === 0 || full(g)) return evaluate(g, me);
    var who = maxing ? me : opp, best = maxing ? -Infinity : Infinity;
    for (var i = 0; i < 7; i++) {
      var c = ORDER[i], r = openRow(g, c); if (r < 0) continue;
      g[r][c] = who;
      var v = minimax(g, depth - 1, a, b, !maxing, me);
      g[r][c] = 0;
      if (maxing) { if (v > best) best = v; if (best > a) a = best; }
      else { if (v < best) best = v; if (best < b) b = best; }
      if (a >= b) break;
    }
    return best;
  }
  function cpuMove() {
    var me = S.cur + 1, g = S.grid.map(function (r) { return r.slice(); });
    var depth = S.level === 'easy' ? 2 : S.level === 'med' ? 4 : 7;
    var cols = ORDER.filter(function (c) { return openRow(g, c) >= 0; });
    if (S.level === 'easy' && Math.random() < 0.35) return cols[Math.floor(Math.random() * cols.length)];
    var best = cols[0], bestV = -Infinity;
    cols.forEach(function (c) {
      var r = openRow(g, c); g[r][c] = me;
      var v = minimax(g, depth - 1, -Infinity, Infinity, false, me) + (S.level === 'med' ? Math.random() * 3 : 0);
      g[r][c] = 0;
      if (v > bestV) { bestV = v; best = c; }
    });
    return best;
  }
  function maybeCpu() {
    if (!S || S.over || !S.players[S.cur].cpu) return;
    S.busy = true; paintTurn();
    setTimeout(function () { var c = cpuMove(); S.busy = false; drop(c, true); }, 550);
  }

  // ── Moves ─────────────────────────────────────────────────────────────────
  var cells = [], ghosts = [];
  function drop(c, byCpu) {
    if (!S || S.over || (S.busy && !byCpu)) return;
    if (S.players[S.cur].cpu && !byCpu) return;
    var r = openRow(S.grid, c);
    if (r < 0) { Kit.haptic('error'); Kit.sfx('bad'); boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake'); return; }
    var who = S.cur + 1;
    S.grid[r][c] = who; S.moves.push(c);
    var d = el('div', { class: 'disc fall ' + S.players[S.cur].disc });
    d.style.setProperty('--from', 'calc(' + (-(r + 1) * 100) + '% - ' + ((r + 1) * 6 + 50) + 'px)');
    d.style.setProperty('--t', (0.18 + r * 0.06) + 's');
    cells[r][c].appendChild(d);
    Kit.sfx('pop');
    setTimeout(function () { Kit.sfx('tap'); Kit.haptic('light'); }, (180 + r * 60));
    var line = findLine(S.grid, who);
    if (line) {
      S.over = true; S.line = line; S.wins[S.cur]++; S.first = 1 - S.first;
      setTimeout(function () { paintWin(); }, 250 + r * 60);
      setTimeout(function () { endGame(S.cur); }, 1300 + r * 60);
    } else if (full(S.grid)) {
      S.over = true; S.wins[2]++; S.first = 1 - S.first;
      setTimeout(function () { endGame(-1); }, 700);
    } else {
      S.cur = 1 - S.cur;
      paintTurn();
      setTimeout(maybeCpu, 200 + r * 60);
    }
    save();
  }
  function undo() {
    if (!S || !S.moves.length || S.over) return Kit.toast('Nothing to undo');
    var vsCpu = S.players.some(function (p) { return p.cpu; });
    var n = vsCpu ? (S.players[S.cur].cpu ? 1 : 2) : 1;
    for (var i = 0; i < n && S.moves.length; i++) {
      var c = S.moves.pop();
      for (var r = 0; r < ROWS; r++) if (S.grid[r][c]) { S.grid[r][c] = 0; break; }
      S.cur = 1 - S.cur;
    }
    Kit.sfx('whoosh'); save(); render(); maybeCpu();
  }
  function endGame(winner) {
    render();
    var p = winner >= 0 ? S.players[winner] : null;
    var hl = [], vsCpu = S.players.some(function (q) { return q.cpu; });
    if (p && S.line) {
      var a = S.line[0], b = S.line[1], dir = a[0] === b[0] ? 'across' : a[1] === b[1] ? 'up and down' : 'diagonally';
      hl.push(p.name + ' connected four ' + dir + ' in ' + S.moves.length + ' moves');
    } else if (!p) hl.push('The board filled up: a draw after 42 moves');
    if (vsCpu) hl.push('Computer skill: ' + ({ easy: 'Easy', med: 'Medium', hard: 'Hard' }[S.level] || S.level));
    hl.push('Series so far: ' + S.players[0].name + ' ' + S.wins[0] + ' – ' + S.wins[1] + ' ' + S.players[1].name);
    Kit.record('c4', {
      started: S.started, mode: vsCpu ? 'vs Computer' : 'Two players',
      players: S.players.map(function (q, i) { return { name: q.name, score: i === winner ? 1 : 0, cpu: q.cpu }; }),
      winner: p ? p.name : null, summary: p ? p.name + ' won in ' + S.moves.length + ' moves' : 'Draw', highlights: hl
    });
    var lose = p && p.cpu;
    Kit.win({
      icon: !p ? 'users' : lose ? 'bot' : 'trophy',
      title: !p ? "It's a draw!" : lose ? p.name + ' wins this one' : p.name === 'You' ? 'You win!' : p.name + ' wins!',
      sub: 'Series: ' + S.players[0].name + ' ' + S.wins[0] + ' – ' + S.wins[1] + ' ' + S.players[1].name + (S.wins[2] ? ' · ' + S.wins[2] + ' draw' + (S.wins[2] > 1 ? 's' : '') : ''),
      lose: !!lose, againLabel: 'Next game',
      again: function () { newRound(); },
      extra: [{ label: 'View the board', onClick: function () {} }],
      closeLabel: 'Back to games'
    });
  }

  // ── Render ────────────────────────────────────────────────────────────────
  var boardEl, turnEl, stripEl;
  function render() {
    app.innerHTML = ''; app.classList.add('ipl');
    stripEl = el('div', { class: 'scores' });
    app.appendChild(stripEl);
    turnEl = el('div', { class: 'turn' });
    app.appendChild(turnEl);

    var wrap = el('div', { class: 'board-wrap' });
    var dropsRow = el('div', { class: 'drops' });
    ghosts = [];
    for (var c = 0; c < COLS; c++) { var gh = el('div', { class: 'ghost' }); ghosts.push(gh); dropsRow.appendChild(gh); }
    wrap.appendChild(dropsRow);
    boardEl = el('div', { class: 'board', role: 'grid', 'aria-label': 'Connect Four board' });
    cells = []; for (var r = 0; r < ROWS; r++) cells.push([]);
    for (c = 0; c < COLS; c++) {
      (function (c) {
        var col = el('button', { type: 'button', class: 'col', 'aria-label': 'Drop in column ' + (c + 1) });
        for (var r = 0; r < ROWS; r++) {
          var h = el('div', { class: 'hole' });
          if (S.grid[r][c]) h.appendChild(el('div', { class: 'disc ' + S.players[S.grid[r][c] - 1].disc }));
          cells[r][c] = h; col.appendChild(h);
        }
        col.addEventListener('click', function () { drop(c); });
        col.addEventListener('pointerenter', function () { hover(c); });
        col.addEventListener('pointerleave', function () { hover(-1); });
        boardEl.appendChild(col);
      })(c);
    }
    wrap.appendChild(boardEl);
    wrap.appendChild(el('div', { class: 'legs' }, [el('i'), el('i')]));
    app.appendChild(wrap);
    app.appendChild(el('div', { class: 'series', text: 'Series  ' + S.wins[0] + ' – ' + S.wins[1] + (S.wins[2] ? '  ·  ' + S.wins[2] + ' draws' : '') }));
    if (S.over) app.appendChild(el('div', { class: 'actions' }, [el('button', { type: 'button', class: 'btn btn-primary', text: 'Next game', onclick: newRound })]));
    paintTurn();
    if (S.line) paintWin();
  }
  function hover(c) {
    var p = S && S.players[S.cur];
    ghosts.forEach(function (g, i) { g.className = 'ghost' + (i === c && !S.over && !p.cpu ? ' show disc ' + p.disc : ''); g.style.position = 'relative'; });
  }
  function paintTurn() {
    stripEl.innerHTML = '';
    S.players.forEach(function (p, i) {
      stripEl.appendChild(el('div', { class: 'score' + (i === S.cur && !S.over ? ' on' : ''), style: { '--c': p.disc === 'r' ? '#ff4d5e' : '#ffc83d' } }, [
        el('span', { class: 'nm', text: p.name }),
        el('span', { class: 'mini ' + p.disc }),
        el('span', { class: 'sub', text: S.wins[i] + ' win' + (S.wins[i] === 1 ? '' : 's') })
      ]));
    });
    var p = S.players[S.cur];
    turnEl.style.setProperty('--c', p.disc === 'r' ? '#ff4d5e' : '#ffc83d');
    turnEl.innerHTML = '';
    if (S.over) { turnEl.appendChild(el('span', { text: S.line ? S.players[S.grid[S.line[0][0]][S.line[0][1]] - 1].name + ' connected four!' : 'Board full: draw' })); return; }
    turnEl.appendChild(el('span', { class: 'dot' }));
    turnEl.appendChild(el('span', { text: p.cpu ? p.name + ' is thinking…' : Kit.poss(p.name) + ' turn' }));
  }
  function paintWin() {
    (S.line || []).forEach(function (rc) { var d = cells[rc[0]][rc[1]].querySelector('.disc'); if (d) d.classList.add('win'); });
    paintTurn();
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
  if (saved && saved.grid && saved.players) { S = saved; S.busy = false; render(); maybeCpu(); }
  else showSetup();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect Four</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<style>
:root{--red-disc:#ff4d5e;--yel-disc:#ffc83d;}
.board-wrap{position:relative;margin:4px auto 0;max-width:460px;}
.drops{display:grid;grid-template-columns:repeat(7,1fr);gap:0;height:44px;margin:0 10px;}
.drops .ghost{width:78%;aspect-ratio:1;margin:auto;border-radius:50%;opacity:0;transition:opacity .15s, transform .2s var(--spring);}
.drops .ghost.show{opacity:.9;transform:translateY(4px);}
.board{
  position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;border-radius:22px;
  background:linear-gradient(180deg,#3b6bff,#2649d6);box-shadow:inset 0 -8px 0 rgba(0,0,0,.2), 0 10px 0 #1b3399, 0 20px 30px rgba(0,0,0,.35);
  touch-action:manipulation;
}
.face{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,#3b6bff,#2649d6);box-shadow:inset 0 -8px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.18);
  -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
.face.hidden{visibility:hidden;}
.col{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;border:0;padding:0;background:none;border-radius:14px;}
.col:focus-visible{outline:3px solid #fff;}
.hole{position:relative;aspect-ratio:1;border-radius:50%;background:#140f2e;box-shadow:inset 0 5px 8px rgba(0,0,0,.6);overflow:visible;}
.disc{position:absolute;inset:6%;border-radius:50%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.35);}
.disc.r{background:var(--red-disc);}
.disc.y{background:var(--yel-disc);}
.disc.win{animation:winpulse .8s ease-in-out infinite alternate;box-shadow:0 0 0 4px #fff, 0 0 22px #fff;}
@keyframes winpulse{to{transform:scale(1.1);}}
/* a disc that blocks the other player's four: a gold ring goes out from it */
.disc.block{animation:c4block .9s ease-out;}
@keyframes c4block{0%{box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 4px 0 rgba(255,255,255,.35),0 0 0 0 rgba(255,214,90,.95);}
  100%{box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 4px 0 rgba(255,255,255,.35),0 0 0 14px rgba(255,214,90,0);}}
/* a column you press answers at once: the holes dip a little */
.col:active .hole{transform:translateY(1px);}
.hole{transition:transform .08s;}
.legs{display:flex;justify-content:space-between;margin:0 18px;}
.legs i{width:22px;height:26px;background:#1b3399;border-radius:0 0 8px 8px;}
.who{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 6px;}
.mini{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
.mini.r{background:var(--red-disc);} .mini.y{background:var(--yel-disc);}
.series{text-align:center;color:var(--text-3);font-weight:800;font-size:.85rem;margin-top:16px;}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px;}
.turn.nudge{animation:c4nudge .4s;}
@keyframes c4nudge{20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}

/* A layout for each shape (fit() sizes the board to the room): upright, the players over the board and the series
   under it, the board as wide as the screen allows; sideways, the players, whose turn and the series in a column at
   the left and the board you drop into at the right, as tall as the screen allows */
#app.stage.ipl{max-width:none;box-sizing:border-box;height:var(--c4h,auto);display:flex;flex-direction:column;align-items:center;
  padding:4px max(17px,var(--corner-x)) max(calc(var(--safe-b) + 10px),18px);}
#app.ipl>*{flex:none;}
#app.ipl>.scores{width:min(100%,560px);padding-bottom:4px;}
#app.ipl>.turn{margin:4px 0 2px;}
#app.ipl>.board-wrap{width:var(--bw,100%);max-width:none;margin:0;}
#app.ipl:not(.c4-land)>.turn{margin-top:auto;}
#app.ipl:not(.c4-land)>:last-child{margin-bottom:auto;}
#app.ipl>.series{margin-top:6px;}
#app.ipl>.actions{margin-top:8px;}
#app.c4-tall>.board-wrap .board{gap:8px;padding:12px;border-radius:26px;}
#app.c4-tall>.board-wrap .col{gap:8px;}
#app.c4-tall>.board-wrap .drops{height:64px;margin:0 12px;}
#app.c4-tall>.board-wrap .drops .ghost{width:auto;height:92%;}
#app.c4-tall .score .nm{max-width:200px;font-size:.9rem;}
#app.stage.ipl.c4-land{display:grid;grid-template-columns:var(--sw,280px) var(--bw);grid-template-rows:max-content max-content max-content max-content 1fr;
  grid-template-areas:"s b" "t b" "e b" "a b" ". b";column-gap:var(--cg,28px);justify-content:center;align-content:center;align-items:start;}
#app.c4-land>.scores{grid-area:s;flex-direction:column;width:100%;overflow:visible;padding-top:0;}
#app.c4-land>.scores .score{flex:none;}
#app.c4-land>.turn{grid-area:t;justify-self:start;}
#app.c4-land>.series{grid-area:e;text-align:left;}
#app.c4-land>.actions{grid-area:a;justify-content:flex-start;}
#app.c4-land>.board-wrap{grid-area:b;align-self:center;margin:0;}
/* a phone on its side: little height, so the drop row and the legs are slim and the players are compact */
#app.c4-low>.board-wrap .drops{height:26px;}
#app.c4-low>.board-wrap .legs i{height:12px;width:18px;}
#app.c4-low .score{padding:5px 10px 6px;flex-direction:row;justify-content:space-between;}
#app.c4-low>.turn{min-height:30px;font-size:.95rem;}
#app.c4-low>.series{margin-top:2px;}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,.7,.25,1);}
::view-transition-old(root),::view-transition-new(root){animation:none;}
</style>
</head>
<body>
<main class="stage" id="app"></main>
<script>
(function () {
  'use strict';
  // a View Transition whose promises can't end up unhandled (a turn mid-turn cancels the one before)
  function vtGo(fn) { var t = document.startViewTransition(fn); ['ready', 'finished', 'updateCallbackDone'].forEach(function (k) { if (t && t[k] && t[k].catch) t[k].catch(function () {}); }); }
  var el = Kit.el, app = document.getElementById('app');
  var ROWS = 6, COLS = 7, SAVE = 'c4_state';

  Kit.init({
    id: 'connectfour',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([{ icon: 'history', label: 'Past games', onClick: function () { Kit.history('c4', { title: 'Connect Four: past games' }); } }]),
    rules:
      '<p class="goal">Be the first to line up <b>four of your discs</b> in a row: across, up and down, or diagonally.</p>' +
      '<h3>How it works</h3><ul><li>Players take turns dropping one disc into any column. It falls to the lowest empty spot.</li>' +
      '<li>Tap a column to drop your disc.</li><li>If the board fills up with no four in a row, it\'s a draw.</li><li>The starting player switches every game.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b> in the menu: open a table and the other player joins on their own device. Take your turn whenever you like; the home screen shows when it’s your move.</li></ul>' +
      '<h3>Tips</h3><ul><li>The middle column is the strongest. It\'s part of the most possible lines.</li><li>Watch for "traps": two ways to win at once.</li></ul>'
  });

  var S = null; // {players:[{name,cpu,color,disc}], grid[r][c] 0/1/2, cur, first, moves:[c], over, wins:[a,b,draws], level}
  // Online (turnnet.js): the table holds the game (S without the local bits); NET is the table while playing at one
  var NET = null, NETREC = {};
  function save() { if (NET) return; try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} if (!S.over) Kit.resume.set(S.moves.length ? 'Game ' + (S.wins[0] + S.wins[1] + S.wins[2] + 1) : 'Ready'); }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); }

  function showSetup() {
    S = null;
    app.classList.remove('ipl', 'c4-land', 'c4-tall', 'c4-low');
    Kit.setup(app, {
      modes: Kit.modes([{ id: 'cpu', desc: 'Easy, Medium or Hard' }, { id: '2p', kind: 'local' }]),
      options: [{ id: 'level', robot: true, label: 'Computer skill', value: 'med', choices: [['easy', 'Easy', 'Looks a little ahead, but often drops a disc anywhere.'], ['med', 'Medium', 'Looks a few moves ahead.'], ['hard', 'Hard', 'Looks far ahead and rarely misses a threat.'], ['expert', 'Expert', 'Looks as far ahead as it can in a second, and sees traps long before they close.']], when: function (m) { return m === 'cpu'; } },
        { id: 'hints', label: 'Hints', value: 'on', choices: [['on', 'On', 'A disc that blocks four lights up as it lands, and a move that leaves two places to finish four is called out.'], ['off', 'Off', 'No light on a block and no call when someone has two ways to win: read the board yourself.']] }],
      players: { min: 2, max: 2, cpu: function (m) { return m === 'cpu' ? 'seats' : false; } },
      onStart: function (cfg) {
        S = {
          players: cfg.players.map(function (p, i) { return { name: p.name, cpu: p.cpu, disc: i === 0 ? 'r' : 'y' }; }),
          level: cfg.options.level || 'med', wins: [0, 0, 0], first: 0
        };
        if (cfg.options.hints === 'off') S.hints = false;   // (an older save without it plays with hints on)
        newRound();
      }
    });
  }

  function newRound() {
    S.grid = []; for (var r = 0; r < ROWS; r++) S.grid.push([0, 0, 0, 0, 0, 0, 0]);
    S.cur = S.first; S.moves = []; S.over = false; S.line = null; S.ev = []; S.special = null; S.started = Date.now();
    save(); render(); maybeCpu();
  }

  // ── Board logic ───────────────────────────────────────────────────────────
  function openRow(g, c) { for (var r = ROWS - 1; r >= 0; r--) if (!g[r][c]) return r; return -1; }
  function findLine(g, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      if (g[r][c] !== who) continue;
      for (var d = 0; d < 4; d++) {
        var line = [[r, c]], k;
        for (k = 1; k < 4; k++) {
          var rr = r + dirs[d][0] * k, cc = c + dirs[d][1] * k;
          if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || g[rr][cc] !== who) break;
          line.push([rr, cc]);
        }
        if (k === 4) return line;
      }
    }
    return null;
  }
  function full(g) { return g[0].every(Boolean); }
  // columns where a disc of who's would make four right now
  function winCols(g, who) {
    var out = [];
    for (var c = 0; c < COLS; c++) { var r = openRow(g, c); if (r < 0) continue; g[r][c] = who; if (findLine(g, who)) out.push(c); g[r][c] = 0; }
    return out;
  }
  // how long the winning line really is (a disc can finish five or more in a row) and whether it made two lines at once
  function lineInfo(g, line, who) {
    var a = line[0], b = line[1], dr = b[0] - a[0], dc = b[1] - a[1], n = 0, r, c, cells = [];
    for (r = a[0], c = a[1]; r >= 0 && r < ROWS && c >= 0 && c < COLS && g[r][c] === who; r -= dr, c -= dc) {}
    for (r += dr, c += dc; r >= 0 && r < ROWS && c >= 0 && c < COLS && g[r][c] === who; r += dr, c += dc) { n++; cells.push([r, c]); }
    return { len: n, cells: cells };
  }
  function linesThrough(g, r0, c0, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]], k = 0;
    dirs.forEach(function (d) { var n = 1, r, c;
      for (r = r0 + d[0], c = c0 + d[1]; r >= 0 && r < ROWS && c >= 0 && c < COLS && g[r][c] === who; r += d[0], c += d[1]) n++;
      for (r = r0 - d[0], c = c0 - d[1]; r >= 0 && r < ROWS && c >= 0 && c < COLS && g[r][c] === who; r -= d[0], c -= d[1]) n++;
      if (n >= 4) k++; });
    return k;
  }

  // ── AI: alpha-beta minimax with a window-count heuristic ──────────────────
  function scoreWindow(w, me) {
    var mine = 0, theirs = 0, empty = 0, opp = 3 - me;
    w.forEach(function (v) { if (v === me) mine++; else if (v === opp) theirs++; else empty++; });
    if (mine === 4) return 1000;
    if (mine === 3 && empty === 1) return 6;
    if (mine === 2 && empty === 2) return 2;
    if (theirs === 3 && empty === 1) return -8;
    return 0;
  }
  function evaluate(g, me) {
    var s = 0, r, c;
    for (r = 0; r < ROWS; r++) if (g[r][3] === me) s += 4;
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
      if (c + 3 < COLS) s += scoreWindow([g[r][c], g[r][c + 1], g[r][c + 2], g[r][c + 3]], me);
      if (r + 3 < ROWS) s += scoreWindow([g[r][c], g[r + 1][c], g[r + 2][c], g[r + 3][c]], me);
      if (r + 3 < ROWS && c + 3 < COLS) s += scoreWindow([g[r][c], g[r + 1][c + 1], g[r + 2][c + 2], g[r + 3][c + 3]], me);
      if (r + 3 < ROWS && c - 3 >= 0) s += scoreWindow([g[r][c], g[r + 1][c - 1], g[r + 2][c - 2], g[r + 3][c - 3]], me);
    }
    return s;
  }
  var ORDER = [3, 2, 4, 1, 5, 0, 6];
  var DEADLINE = 0, NODES = 0, STOP = {};
  function minimax(g, depth, a, b, maxing, me) {
    if (DEADLINE && (++NODES & 255) === 0 && Date.now() > DEADLINE) throw STOP;
    var opp = 3 - me;
    if (findLine(g, me)) return 100000 + depth;
    if (findLine(g, opp)) return -100000 - depth;
    if (depth === 0 || full(g)) return evaluate(g, me);
    var who = maxing ? me : opp, best = maxing ? -Infinity : Infinity;
    for (var i = 0; i < 7; i++) {
      var c = ORDER[i], r = openRow(g, c); if (r < 0) continue;
      g[r][c] = who;
      var v = minimax(g, depth - 1, a, b, !maxing, me);
      g[r][c] = 0;
      if (maxing) { if (v > best) best = v; if (best > a) a = best; }
      else { if (v < best) best = v; if (best < b) b = best; }
      if (a >= b) break;
    }
    return best;
  }
  // Expert: the same search, deeper and deeper while there is time (about a second), each pass trying the columns in the
  // order the pass before ranked them; a win it can see it takes at once
  function expertMove(g, me, cols) {
    var order = cols.slice(), best = order[0], t0 = Date.now();
    DEADLINE = t0 + 900; NODES = 0;
    try {
      for (var d = 2; d <= 42; d++) {
        var sc = {}, curB = null, curV = -Infinity, a = -Infinity;
        for (var i = 0; i < order.length; i++) {
          var c = order[i], r = openRow(g, c); g[r][c] = me;
          var v;
          try { v = minimax(g, d - 1, a, Infinity, false, me); } finally { g[r][c] = 0; }
          sc[c] = v;
          if (v > curV) { curV = v; curB = c; }
          if (v > a) a = v;
        }
        best = curB;
        order.sort(function (x, y) { return (sc[y] === undefined ? -1e9 : sc[y]) - (sc[x] === undefined ? -1e9 : sc[x]); });
        if (curV >= 100000 || d >= 42 - S.moves.length) break;
        if (Date.now() - t0 > 450) break;
      }
    } catch (e) { if (e !== STOP) throw e; }
    DEADLINE = 0;
    return best;
  }
  function cpuMove() {
    var me = S.cur + 1, g = S.grid.map(function (r) { return r.slice(); });
    var depth = S.level === 'easy' ? 2 : S.level === 'med' ? 4 : 7;
    var cols = ORDER.filter(function (c) { return openRow(g, c) >= 0; });
    if (S.level === 'expert') return expertMove(g, me, cols);
    if (S.level === 'easy' && Math.random() < 0.5) return cols[Math.floor(Math.random() * cols.length)];
    var best = cols[0], bestV = -Infinity;
    cols.forEach(function (c) {
      var r = openRow(g, c); g[r][c] = me;
      var v = minimax(g, depth - 1, -Infinity, Infinity, false, me) + (S.level === 'med' ? Math.random() * 3 : 0);
      g[r][c] = 0;
      if (v > bestV) { bestV = v; best = c; }
    });
    return best;
  }
  function maybeCpu() {
    if (NET || !S || S.over || !S.players[S.cur].cpu) return;
    S.busy = true; paintTurn();
    setTimeout(function () { var c = cpuMove(); S.busy = false; drop(c, true); }, 550);
  }

  // ── Moves ─────────────────────────────────────────────────────────────────
  var cells = [], ghosts = [];
  function drop(c, byCpu) {
    if (NET) { netDrop(c); return; }
    if (!S || S.over || (S.busy && !byCpu)) return;
    if (S.players[S.cur].cpu && !byCpu) return;
    var r = openRow(S.grid, c);
    if (r < 0) { Kit.haptic('error'); Kit.sfx('bad'); boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake'); return; }
    var who = S.cur + 1, threats = winCols(S.grid, 3 - who);
    S.grid[r][c] = who; S.moves.push(c);
    var d = el('div', { class: 'disc ' + S.players[S.cur].disc });
    cells[r][c].appendChild(d);
    Kit.sfx('pop');
    var line = findLine(S.grid, who), me = S.cur, mover = S.players[S.cur];
    // what this move did (a block, a trap), shown when the disc lands
    var blocked = !line && threats.indexOf(c) >= 0, trap = !line && !full(S.grid) && !winCols(S.grid, 3 - who).length && winCols(S.grid, who).length >= 2;
    if (!S.ev) S.ev = [];
    if (trap && S.ev.some(function (e) { return e.k === 'trap' && e.p === me; })) trap = false;
    if (trap) S.ev.push({ k: 'trap', p: me, n: S.moves.length });
    if (line) { S.over = true; S.line = line; S.wins[S.cur]++; S.first = 1 - S.first; S.busy = true; S.run = S.run && S.run.p === me ? { p: me, n: S.run.n + 1 } : { p: me, n: 1 }; }
    else if (full(S.grid)) { S.over = true; S.wins[2]++; S.first = 1 - S.first; S.busy = true; S.run = null; }
    else { S.cur = 1 - S.cur; paintTurn(); }
    save();
    fallDisc(d, r, c, function () {
      var hon = S.hints !== false;
      if (blocked && hon) { d.classList.add('block'); Kit.sfx('good', 0.6); if (!mover.cpu) Kit.haptic('light'); }
      if (trap && hon) {
        var meH = !mover.cpu;
        Kit.moment({ title: 'Two ways to win', line: meH ? (mover.name === 'You' ? 'You have' : mover.name + ' has') + ' two places to finish four, and only one can be blocked.' : mover.name + ' has two places to finish four. You can only block one.',
          icon: 'sparkle', color: mover.disc === 'r' ? 'var(--red-disc)' : 'var(--yel-disc)', tone: meH ? '' : 'bad', at: boardEl, ms: 2200 });
        Kit.sfx(meH ? 'sparkle' : 'bad'); Kit.haptic(meH ? 'success' : 'medium');
      }
      if (line) { paintWin(); var big = winMoment(me, r, c); setTimeout(function () { S.busy = false; endGame(me); }, big ? 2300 : 1000); }
      else if (S.over) setTimeout(function () { S.busy = false; endGame(-1); }, 500);
      else setTimeout(maybeCpu, trap && hon ? 500 : 120);
    });
  }
  // The rarer wins get their moment on the board before the results: five in a row, two lines with one disc,
  // a win with your first four discs, beating the Hard computer, a third win in a row
  function winSpecial(me, r, c) {
    var who = me + 1, p = S.players[me], li = lineInfo(S.grid, S.line, who), out = [];
    var mine = S.moves.filter(function (x, i) { return i % 2 === (S.moves.length - 1) % 2; }).length;
    var foe = S.players[1 - me];
    if (linesThrough(S.grid, r, c, who) >= 2) out.push({ t: 'Two lines at once', l: 'That disc finished four in two directions.', h: p.name + ' finished two lines with one disc' });
    else if (li.len >= 5) out.push({ t: li.len + ' in a row', l: 'The winning line runs ' + li.len + ' discs long.', h: p.name + ' connected ' + li.len + ' in a row' });
    if (mine === 4) out.push({ t: 'Four for four', l: p.name + ' won with the first four discs.', h: p.name + ' won with the first four discs played' });
    if (foe.cpu && !p.cpu && (S.level === 'hard' || S.level === 'expert')) { var lvN = S.level === 'hard' ? 'Hard' : 'Expert'; out.push({ t: lvN + ' computer beaten', l: p.name + ' beat ' + foe.name + ' on ' + lvN + '.', h: p.name + ' beat ' + foe.name + ' on ' + lvN }); }
    if (S.run && S.run.n >= 3) out.push({ t: S.run.n + ' wins in a row', l: p.name + ' has won the last ' + S.run.n + ' games.', h: p.name + ' won ' + S.run.n + ' games in a row' });
    return out;
  }
  function winMoment(me, r, c) {
    var sp = winSpecial(me, r, c); S.special = sp.map(function (x) { return x.h; });
    if (!sp.length) return false;
    var p = S.players[me], bad = p.cpu;
    Kit.moment({ big: sp.length > 1 || /Hard|Two lines|in a row$/.test(sp[0].t), title: sp[0].t, line: sp.map(function (x) { return x.l; }).join(' '), icon: bad ? 'bot' : 'trophy',
      color: p.disc === 'r' ? 'var(--red-disc)' : 'var(--yel-disc)', tone: bad ? 'bad' : '', at: boardEl, ms: 2100 });
    Kit.sfx(bad ? 'lose' : 'sparkle'); Kit.haptic(bad ? 'heavy' : 'success');
    return true;
  }
  // A disc falls under gravity from above the board, clacks onto the disc (or

        moves: S.moves.join(''), discs: S.players.map(function (q) { return q.disc; }).join(''), first: 1 - S.first, series: S.wins.slice(), level: vsCpu ? S.level : '' }

  // ── Render ────────────────────────────────────────────────────────────────

    turnEl = el('div', { class: 'turn', style: { 'view-transition-name': 'c4-turn' } });

          cells[r][c] = h; col.appendChild(h);

    boardEl.appendChild(faceEl);

    wrap.appendChild(el('div', { class: 'legs' }, [el('i'), el('i')]));
    app.appendChild(wrap);
    app.appendChild(el('div', { class: 'series', text: 'Series ' + S.wins[0] + ' – ' + S.wins[1] + (S.wins[2] ? ', with ' + S.wins[2] + ' draws' : '') }));
    if (S.over) app.appendChild(el('div', { class: 'actions' }, [el('button', { type: 'button', class: 'btn btn-primary', text: NET ? 'Play again' : 'Next game', onclick: NET ? function () { NET.again(); } : newRound })]));
    paintTurn();

  // ── Online ────────────────────────────────────────────────────────────────

  if (saved && saved.grid && saved.players) { S = saved; S.busy = false; render(); maybeCpu(); }
  else showSetup();
})();

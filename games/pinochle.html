<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinochle</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../cards.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../online.js"></script>
<script src="../turnnet.js"></script>
<script src="pinochle-core.js"></script>
<style>
/* ── The page is laid out to the screen: four shapes (phone and iPad, upright and sideways), set by fit() ── */
.pn{position:relative;display:grid;gap:8px;padding:4px 8px 0;box-sizing:border-box;margin:0 auto;width:100%;
  height:var(--ph,calc(100dvh - var(--bar,64px)));padding-bottom:max(calc(var(--safe-b) + 6px),12px);}
.pn.L-pu{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "tbl" "act" "hand";}
.pn.L-tu{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"top" "info" "tbl" "act" "hand";}
.pn.L-tu{max-width:860px;padding-left:14px;padding-right:14px;gap:10px;}
.pn.L-ps{grid-template-columns:minmax(0,1fr) var(--side,400px);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"tbl top" "tbl info" "tbl act" "tbl hand";column-gap:10px;row-gap:6px;
  padding-left:max(var(--safe-l,0px),10px);padding-right:max(var(--safe-r,0px),14px);}
.pn.L-ts{grid-template-columns:minmax(0,1fr) var(--side,380px);grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"tbl top" "tbl info" "tbl pad" "tbl act" "hand hand";column-gap:14px;row-gap:8px;padding-left:16px;padding-right:18px;}
.pn > .tblbg,.pn > .tbl{grid-area:tbl;min-height:0;min-width:0;}
.pn > .top{grid-area:top;min-width:0;}
.pn > .act{grid-area:act;min-width:0;}
.pn > .hand{grid-area:hand;min-width:0;}
.pn > .lpad{display:none;}
/* An iPad held sideways: the setup in two columns, the players beside the options, a little larger */
@media (orientation:landscape) and (min-width:900px) and (min-height:600px){
  .stage:has(> .setup){max-width:min(1000px,94vw);display:flex;flex-direction:column;justify-content:center;min-height:calc(100dvh - var(--bar,64px) - 30px);}
  .stage > .setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;row-gap:22px;align-items:start;zoom:1.22;}
  .stage > .setup > .setup-hero,.stage > .setup > .k-joins,.stage > .setup > .k-startdock{grid-column:1 / -1;}
  .stage > .setup > .k-seats{grid-column:1;}
  .stage > .setup > .k-opts{grid-column:2;}
}
/* The side panel (iPads, and a phone held sideways when there is room): the bidding by seat while it goes on, then
   the last trick and everyone's meld as it was laid (cards since played are dimmed) */
.pn > .info{display:none;}
.pn.L-ts > .info,.pn.L-tu > .info,.pn.L-ps > .info{display:flex;grid-area:info;min-height:0;min-width:0;}
.pn.L-ts > .info{max-height:calc(var(--ph,700px) * .56);}
/* with two things to show the panel has the column (the score pad is a tap on the score strip away) */
.pn.L-ts.nopad{grid-template-rows:auto minmax(0,1fr) 0 auto auto;}
.pn.L-ts.nopad > .lpad{display:none;}
.pn.L-ts.nopad > .info{max-height:none;justify-content:space-around;}
.info{flex-direction:column;gap:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);color:#fff;overflow:hidden;transform-origin:0 0;}
.info:empty{display:none !important;}
.pn.L-tu > .info{flex-direction:row;align-items:stretch;gap:16px;}
.pn.L-tu > .info > .ib{flex:1 1 0;min-width:0;}
.pn.L-tu > .info > .ib:has(.ib-ml){flex:3 1 0;}
.pn.L-tu .ib-ml,.pn.L-ps .ib-ml{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 16px;}
.pn.L-ps .ib-ml{gap:3px 10px;} .pn .ib-ml.c1{grid-template-columns:minmax(0,1fr);} .pn.L-ps .ib-ml .r .nm{font-size:.64rem;} .pn.L-ps .ib-h{font-size:.7rem;} .pn.L-ps .ib-ml .r .t{font-size:.8rem;}
.pn.L-ps > .info{padding:4px 8px;gap:4px;}
.pn.L-ps > .info .ib{gap:3px;}
.pn.L-ps > .info .ib-h{display:none;}
.pn.L-ps .ib-lt{justify-content:center;gap:10px;}
.pn.L-ps .ib-lt .w1 small{font-size:.58rem;}
.ib{display:flex;flex-direction:column;gap:6px;min-width:0;}
.ib-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.8rem;font-weight:650;color:rgba(255,255,255,.7);}
.ib-h b{font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--lit);}
.ib-auc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:fixed;}
.ib-auc th{font-size:.72rem;font-weight:900;padding:2px 2px 4px;border-bottom:1px solid rgba(255,255,255,.14);line-height:1.1;overflow-wrap:anywhere;}
.ib-auc th.on{color:#ffd166;}
.ib-auc td{text-align:center;padding:3px 2px;font-weight:900;font-size:.95rem;}
.ib-auc td.p{color:rgba(255,255,255,.4);font-size:.78rem;}
.ib-auc td.w{color:#2b1a00;background:#ffd166;border-radius:7px;}
.ib-auc td.new{animation:pnpop .35s var(--spring);}
.ib-su{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.ib-su .c{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 5px;border-radius:12px;background:rgba(255,250,235,.08);}
.ib-su .c.best{background:rgba(255,209,102,.16);box-shadow:inset 0 0 0 1.5px #ffd166;}
.ib-su .c .g{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fffaf0;color:#1b1b22;font-size:19px;line-height:1;font-family:Georgia,serif;}
.ib-su .c .g.red{color:#d81e3a;}
.ib-su .c b{font-family:var(--display);font-weight:400;font-size:1.25rem;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums;}
.ib-su .c.best b{color:#ffd166;}
.ib-su .c small{font-size:.66rem;font-weight:800;color:rgba(255,255,255,.6);}
.pn.L-ps .ib-su .c{padding:3px 2px;} .pn.L-ps .ib-su .c .g{width:20px;height:20px;font-size:14px;} .pn.L-ps .ib-su .c b{font-size:1rem;}
.ib-lt{display:flex;gap:6px;--cw:var(--icw,42px);}
.ib-lt .w1{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;}
.ib-lt .w1 small{font-size:.66rem;font-weight:800;color:rgba(255,255,255,.75);width:min-content;min-width:100%;text-align:center;line-height:1.1;}
.ib-lt .w1.win .pcard{box-shadow:0 0 0 2px #ffd166,0 0 12px rgba(255,209,102,.6);}
.ib-lt .w1.win small{color:#ffd166;}
.ib-ml{display:flex;flex-direction:column;gap:5px;}
.ib-ml .r{display:flex;align-items:center;gap:8px;min-width:0;}
.ib-ml .r .nm{flex:none;display:flex;align-items:center;gap:4px;width:var(--nmw,5.6em);font-size:.72rem;font-weight:900;line-height:1.1;color:rgba(255,255,255,.85);}
.ib-ml .r .nm i{flex:none;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc);}
.ib-ml .r .gs{display:flex;flex-wrap:wrap;gap:3px 7px;min-width:0;flex:1;--cw:var(--imw,18px);}
.ib-ml .r .g{display:flex;}
.ib-ml .r .g .pcard+.pcard{margin-left:calc(var(--cw) * -.45);}
.ib-ml .r .g .pcard.gone{filter:brightness(.45) saturate(.4);}
.ib-ml .r .t{flex:none;font-family:var(--display);font-size:.95rem;color:#ffd166;}
.ib-ml .r .none{font-size:.72rem;font-weight:800;color:rgba(255,255,255,.45);}
.pn.L-ts > .lpad{display:block;grid-area:pad;min-height:0;overflow:auto;border-radius:6px 6px 14px 14px;-webkit-overflow-scrolling:touch;}
.lpad .spad{box-shadow:0 8px 20px rgba(0,0,0,.4);}
.lpad .spad th,.lpad .spad td{height:34px;} .lpad .spad td{font-size:1.2rem;} .lpad .spad tfoot td{font-size:1.5rem;height:42px;} .lpad .spad-h h2{font-size:1.2rem;} .lpad .spad-h{padding:8px 12px 6px;}
.pn.L-ps > .act,.pn.L-ts > .act{align-self:end;}
.pn.L-pu > .act{min-height:96px;} .pn.L-tu > .act{min-height:96px;}

/* ── The table: wood and felt behind (its own layer, so it can glide when the shape changes), the play area over it ── */
.tblbg{position:relative;border-radius:26px;padding:8px;z-index:0;transform-origin:0 0;}
.tblbg .felt-in{position:absolute;inset:8px;border-radius:19px;}
.tbl{position:relative;z-index:1;margin:8px;border-radius:19px;--u:1;}
.tbl .wm{position:absolute;left:50%;top:50%;translate:-50% -50%;font-size:calc(var(--u) * 190px);line-height:1;opacity:.07;color:#fff;pointer-events:none;transition:opacity .6s;font-family:Georgia,serif;}
.tbl .wm.red{color:#ffb3b3;opacity:.09;}
/* seats */
.st{position:absolute;z-index:4;display:flex;flex-direction:column;align-items:center;gap:3px;transform-origin:0 0;}
.st.p-s{left:50%;bottom:4px;translate:-50% 0;}
.st.p-n{left:50%;top:4px;translate:-50% 0;}
.st.p-w{left:4px;top:40%;translate:0 -50%;align-items:flex-start;}
.st.p-e{right:4px;top:40%;translate:0 -50%;align-items:flex-end;}
.tbl.n3 .st.p-w,.tbl.n3 .st.p-e{top:max(70px,24%,calc(var(--plh,40px) + 14px));}   /* (under the trick piles in the top corners) */
.st .tg{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:rgba(10,8,6,.55);color:#fff;font-weight:800;font-size:calc(.78rem * var(--fz,1));white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:box-shadow .25s,scale .3s var(--spring);}
.st .tg .avatar{width:calc(24px * var(--fz,1));height:calc(24px * var(--fz,1));font-size:calc(.7rem * var(--fz,1));flex:none;}
.st .tg .avatar .ico{width:60%;height:60%;}
.st .tg .nm{max-width:9.5em;overflow:hidden;text-overflow:ellipsis;}
.st .tg .dl{font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:5px;background:#f3e6c4;color:#3a2a14;}
.st.turn .tg{box-shadow:0 0 0 3px var(--yellow),0 0 18px rgba(255,200,61,.55);scale:1.06;}
.st.away .tg{opacity:.6;}
.st .chs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.st.p-w .chs{justify-content:flex-start;} .st.p-e .chs{justify-content:flex-end;}
.st .chip{padding:1px 8px;border-radius:999px;background:rgba(255,250,235,.92);color:#2a1d10;font-size:calc(.7rem * var(--fz,1));font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;}
.st .chip.pass{background:rgba(255,255,255,.18);color:rgba(255,255,255,.7);text-decoration:line-through;text-decoration-thickness:1.5px;}
.st .chip.hi{background:var(--yellow);color:#2b1a00;}
.st .chip.bidr{background:#b3202e;color:#fff;}
.st .chip.saved{background:#1f8a4c;color:#fff;}
.st .chip.lost{background:rgba(0,0,0,.35);color:rgba(255,255,255,.7);}
.st .bk{display:flex;--cw:calc(20px * var(--fz,1));height:calc(var(--cw) * 1.4);}
.st .bk .pcard{flex:none;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.st .bk .pcard+.pcard{margin-left:calc(var(--cw) * -.62);}
.st .tm{display:flex;--cw:calc(19px * var(--fz,1));gap:0;}
.st .tm .pcard+.pcard{margin-left:calc(var(--cw) * -.45);}
.st .say{position:absolute;top:100%;margin-top:4px;padding:5px 11px;border-radius:12px;background:#fffaf0;color:#2a1d10;font-weight:900;font-size:calc(.86rem * var(--fz,1));white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.35);animation:pnpop .35s var(--spring);z-index:6;}
.st.p-s .say{top:auto;bottom:100%;margin:0 0 4px;}
.st.p-w .say{top:0;left:100%;margin:0 0 0 6px;} .st.p-e .say{top:0;right:100%;margin:0 6px 0 0;}
.st .say.big{background:var(--yellow);color:#2b1a00;}
@keyframes pnpop{from{scale:.5;opacity:0;}to{scale:1;opacity:1;}}
/* trick */
.trk{position:absolute;left:50%;top:47%;width:0;height:0;z-index:3;}
.trk .pcard{--cw:var(--tcw,64px);position:absolute;left:0;top:0;box-shadow:0 3px 10px rgba(0,0,0,.4);}
.trk .pcard.t-s{translate:-50% 2%;rotate:3deg;}
.trk .pcard.t-n{translate:-50% -102%;rotate:-4deg;}
.trk .pcard.t-w{translate:-114% -50%;rotate:-8deg;}
.trk .pcard.t-e{translate:14% -50%;rotate:7deg;}
.trk.n3 .pcard.t-w{translate:-104% -64%;} .trk.n3 .pcard.t-e{translate:4% -64%;} .trk.n3 .pcard.t-s{translate:-50% -14%;}
.trk.n2 .pcard.t-s{translate:-50% -14%;rotate:4deg;} .trk.n2 .pcard.t-n{translate:-50% -88%;}
.trk .pcard.win{box-shadow:0 0 0 3px var(--lit),0 0 24px var(--litg);}
/* the stacks of tricks each side has taken */
.pile{position:absolute;z-index:2;display:flex;align-items:flex-end;gap:6px;--cw:calc(26px * var(--fz,1));transform-origin:0 0;}
.pile.bl{left:8px;bottom:8px;} .pile.tr{right:8px;top:8px;flex-direction:row-reverse;} .pile.tl{left:8px;top:8px;} .pile.br{right:8px;bottom:8px;flex-direction:row-reverse;}
.pile .stk{position:relative;width:calc(var(--cw) + 10px);height:calc(var(--cw) * 1.4 + 10px);}
.pile .stk .pcard{position:absolute;left:0;bottom:0;box-shadow:0 1px 2px rgba(0,0,0,.45);}
.pile .stk.empty{outline:1.5px dashed rgba(255,255,255,.18);outline-offset:-2px;border-radius:6px;width:var(--cw);height:calc(var(--cw) * 1.4);}
.pile .n{display:flex;flex-direction:column;line-height:1.05;color:#fff;font-weight:900;font-size:calc(.95rem * var(--fz,1));font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.5);}
.pile .n small{font-size:.74em;font-weight:650;opacity:.78;}
.pile.tr .n,.pile.br .n{text-align:right;}
.pile .rb{position:absolute;inset:auto 0 -4px 0;height:3px;border-radius:2px;background:var(--pc);}
.pile.bump .stk{animation:pnbump .35s var(--spring);}
@keyframes pnbump{40%{scale:1.14;}}
/* the middle of the table: the auction plate, the widow, the stock */
.ctr{position:absolute;left:50%;top:47%;translate:-50% -50%;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;transform-origin:0 0;}
.plate{display:flex;flex-direction:column;align-items:center;padding:8px 18px 9px;border-radius:16px;background:linear-gradient(180deg,#fbf3dd,#eadcb4);color:#3a2a14;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 8px 20px rgba(0,0,0,.4),0 0 0 3px rgba(120,80,30,.35);min-width:calc(110px * var(--fz,1));}
.plate small{font-size:calc(.76rem * var(--fz,1));font-weight:700;color:#7a6440;}
.plate b{font-family:var(--display);font-weight:400;font-size:calc(2rem * var(--fz,1));line-height:1.05;font-variant-numeric:tabular-nums;}
.plate i{font-style:normal;font-weight:800;font-size:calc(.82rem * var(--fz,1));}
.plate.pop b{animation:pnpop .35s var(--spring);}
.widow{display:flex;gap:6px;--cw:calc(var(--tcw,64px) * .82);}
.widow .pcard{box-shadow:0 3px 8px rgba(0,0,0,.45);}
.stock{position:absolute;left:12%;top:47%;translate:0 -50%;z-index:2;--cw:calc(var(--tcw,64px) * .8);width:calc(var(--cw) * 1.75);height:calc(var(--cw) * 1.4);transform-origin:0 0;}
.stock .up{position:absolute;left:calc(var(--cw) * .5);top:calc(var(--cw) * .2);rotate:90deg;box-shadow:0 2px 6px rgba(0,0,0,.4);}
.stock .pile2{position:absolute;left:0;top:0;}
.stock .pile2 .pcard{position:absolute;left:0;top:0;box-shadow:0 1px 2px rgba(0,0,0,.5);}
.stock .cnt{position:absolute;left:0;top:100%;margin-top:6px;width:calc(var(--cw) * 1.75);text-align:center;color:#fff;font-weight:900;font-size:calc(.72rem * var(--fz,1));text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;}
/* the meld, laid face up in front of each player */
.mb{position:absolute;inset:6px;z-index:5;pointer-events:none;display:grid;gap:6px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"n n" "w e" "s s";}
.mb:empty{display:none;}
.mb.n3{grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"w e" "s s";}
.mb.n2{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"n" "." "s";}
.tbl.melding .st,.tbl.melding .pile,.tbl.melding .ctr{opacity:0;transition:opacity .3s;pointer-events:none;}
.mp{position:relative;display:flex;flex-direction:column;gap:4px;padding:6px 8px 7px;border-radius:14px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--plate-line),0 6px 18px rgba(0,0,0,.35);color:#fff;transform-origin:0 0;animation:pnin .3s ease-out;--mcw:24px;}
@keyframes pnin{from{opacity:0;}to{opacity:1;}}
.mp{min-width:0;max-width:100%;}
.mp.m-s{grid-area:s;justify-self:center;align-self:end;}
.mp.m-n{grid-area:n;justify-self:center;align-self:start;}
.mp.m-w{grid-area:w;justify-self:start;align-self:center;}
.mp.m-e{grid-area:e;justify-self:end;align-self:center;}
.mp .mh .who{display:flex;align-items:center;gap:6px;}
.mp .mh .avatar{width:20px;height:20px;font-size:.62rem;}
.mp .mh .avatar .ico{width:60%;height:60%;}
.mp.turn{box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.75),0 0 18px var(--litg),0 6px 18px rgba(0,0,0,.35);}
.mp .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.85);}
.mp .mh b{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--lit);font-variant-numeric:tabular-nums;}
.mp .gs{display:flex;flex-wrap:wrap;gap:5px 8px;}
.mp .none{font-size:.78rem;font-weight:800;color:rgba(255,255,255,.6);}
.mg{display:flex;flex-direction:column;align-items:center;gap:2px;animation:pnmg .45s var(--spring) both;}
@keyframes pnmg{from{opacity:0;translate:0 10px;scale:.8;}to{opacity:1;translate:0 0;scale:1;}}
.mg .cs{display:flex;--cw:var(--mcw);}
.mg .cs .pcard{flex:none;box-shadow:0 1px 3px rgba(0,0,0,.45);}
.mg .cs .pcard+.pcard{margin-left:calc(var(--mcw) * -.55);}
.mg .lb{font-size:.7rem;font-weight:700;white-space:nowrap;color:#fff;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:8px;}
.mg.big .lb{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--gold-ink);}
.mg.big .cs{filter:drop-shadow(0 0 8px rgba(255,209,102,.9));}
.mb .tot{position:absolute;left:50%;top:47%;translate:-50% -50%;display:flex;gap:8px;}
/* floating points and the glow on a big moment */
.fl{position:absolute;z-index:9;pointer-events:none;font-family:var(--display);font-size:calc(1.35rem * var(--fz,1));color:#ffd166;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:pnfl 1.2s ease-out forwards;white-space:nowrap;}
.fl.g{color:#8ff0b0;} .fl.r{color:#ff9aa5;}
@keyframes pnfl{0%{opacity:0;translate:-50% 0;scale:.6;}15%{opacity:1;scale:1.1;}100%{opacity:0;translate:-50% -46px;scale:1;}}
.flash{position:absolute;left:50%;bottom:calc(var(--sh,60px) + 10px);translate:-50% 0;z-index:7;padding:6px 14px;border-radius:14px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--plate-line);color:#fff;font-weight:700;font-size:calc(.86rem * var(--fz,1));width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.25;animation:pnin .25s;}

/* ── The score strip: a paper pad for each side and the trump plaque between ── */
.top{display:flex;gap:6px;align-items:stretch;transform-origin:0 0;cursor:pointer;}
.sd{flex:1 1 0;min-width:0;position:relative;border-radius:9px;padding:4px 9px 5px;background:linear-gradient(180deg,#fffaf0,#f1e6cc);color:#2a2a3a;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 5px 12px rgba(0,0,0,.35);border-top:4px solid var(--sc);
  background-image:repeating-linear-gradient(180deg,transparent 0 17px,rgba(60,80,160,.12) 17px 18px),linear-gradient(180deg,#fffaf0,#f1e6cc);}
.sd .nm{display:block;font-size:.66rem;font-weight:900;letter-spacing:.02em;line-height:1.15;color:#6a6a80;overflow-wrap:anywhere;}
.sd .row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
.sd .tot{font-family:var(--hand);font-size:1.6rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
.sd .tot.neg{color:#c8102e;}
.sd .now{font-family:var(--hand);font-size:.98rem;line-height:1;color:#3a7d4a;white-space:nowrap;}
.sd .now.bad{color:#c8102e;}
.sd .bar{position:relative;height:5px;border-radius:3px;background:rgba(0,0,0,.1);margin-top:3px;overflow:hidden;}
.sd .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--sc);transition:width .5s ease;}
.sd .bar.made i{background:#1f8a4c;}
.sd.bidd::after{content:'Bid';position:absolute;top:3px;right:7px;font-size:.7rem;font-weight:800;color:#c8102e;}
.sd.bidd .nm{padding-right:22px;}
.sd.won{box-shadow:0 0 0 3px #1f8a4c,0 5px 12px rgba(0,0,0,.35);}
.tp{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:76px;padding:3px 8px;border-radius:10px;background:radial-gradient(circle at 50% 35%,#3a2a1a,#1e140b);box-shadow:inset 0 0 0 1.5px rgba(220,180,110,.45),0 4px 10px rgba(0,0,0,.35);color:#f3e6c4;}
.tp .k{font-size:.72rem;font-weight:700;color:rgba(243,230,196,.78);}
.tp .su{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fffaf0;color:#1b1b22;font-size:21px;line-height:1;box-shadow:0 0 0 2px #c9a24a;font-family:Georgia,serif;}
.tp .su.red{color:#d81e3a;}
.tp .su.none{background:rgba(255,255,255,.12);box-shadow:0 0 0 1.5px rgba(243,230,196,.35);color:rgba(243,230,196,.5);font-size:14px;}
.tp .bd{font-weight:900;font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tp.pop .su{animation:pnpop .45s var(--spring);}

/* ── The action bar ── */
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:52px;transform-origin:0 0;}
.act .hint{color:var(--text-2);font-weight:800;text-align:center;font-size:.95rem;}
.act .sub{color:var(--text-3);font-weight:700;font-size:.8rem;text-align:center;}
.act .row{display:flex;gap:8px;width:100%;max-width:440px;justify-content:center;}
.act .row .btn{flex:1;min-width:0;}
.bidbar{display:flex;align-items:center;gap:8px;width:100%;max-width:440px;}
.bidbar .amt{flex:1.3;display:flex;align-items:center;justify-content:center;gap:4px;min-height:52px;border-radius:var(--r);background:var(--well);box-shadow:inset 0 0 0 1px var(--gl-line);}
.bidbar .amt output{min-width:56px;text-align:center;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;}
.bidbar .amt button{width:42px;height:42px;border:0;border-radius:13px;background:var(--gl-2);box-shadow:inset 0 0 0 1px var(--gl-line);color:var(--text);font-weight:900;font-size:1.3rem;transition:transform .12s var(--spring);}
.bidbar .amt button:active{transform:scale(.88);}
.bidbar .amt button:disabled{opacity:.3;}
.bidbar > .btn{flex:1;min-width:0;padding-left:10px;padding-right:10px;}
.trumps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:460px;}
.trumps button{min-height:58px;border:0;border-radius:var(--r);background:var(--gl-2);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:inset 0 0 0 1px var(--gl-line),0 10px 22px -16px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .12s var(--spring),filter .15s;}
.trumps button .g{font-size:1.7rem;font-family:Georgia,serif;}
.trumps button.red .g{color:#ff5a72;}
.trumps button small{font-size:.76rem;font-weight:650;color:var(--text-2);}
.trumps button.best{background:rgba(255,211,77,.14);box-shadow:inset 0 0 0 1.5px rgba(255,211,77,.65),0 0 16px rgba(255,190,60,.2);}
.trumps button.best small{color:var(--lit-ink);}
.trumps button:active{transform:translateY(1px) scale(.96);filter:brightness(.94);}
.melds{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;max-width:460px;}
.melds .btn{flex:1 1 auto;min-width:0;}
/* ── Your hand ── */
.hand{position:relative;display:flex;justify-content:center;align-items:flex-end;padding:18px 6px 2px;--cw:64px;min-height:calc(var(--cw) * 1.4 + 22px);touch-action:none;}
.hand > .pcard{flex:none;transform-origin:0 0;transition:translate .18s var(--spring),box-shadow .2s,filter .2s;}
.hand > .pcard + .pcard{margin-left:var(--ov,-24px);}
.hand > .pcard.dim{filter:brightness(.6) saturate(.7);}
.hand > .pcard.ok{box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 0 0 1px rgba(0,0,0,.08),0 6px 14px rgba(0,0,0,.35);}
.hand > .pcard.sel{translate:0 -16px;box-shadow:0 0 0 3px var(--lit),0 10px 18px rgba(0,0,0,.4);}
.hand > .pcard.hl{translate:0 -12px;box-shadow:0 0 0 3px #8ff0b0,0 10px 18px rgba(0,0,0,.4);}
.hand > .pcard.tr::after{content:'';position:absolute;left:12%;right:12%;bottom:3px;height:3px;border-radius:2px;background:linear-gradient(90deg,#c9a24a,#ffe3a0,#c9a24a);}
.hand > .pcard.tab::before{content:'';position:absolute;inset:-3px;border-radius:inherit;box-shadow:0 0 0 2px rgba(143,240,176,.85);pointer-events:none;}
.hand > .pcard.new{box-shadow:0 0 0 3px #8ff0b0,0 8px 18px rgba(0,0,0,.35);}
.hand > .pcard.drag{transition:none;z-index:40;box-shadow:0 18px 30px rgba(0,0,0,.5);}
.hand > .pcard:active{filter:brightness(.97);}
.hand > .pcard.ok:active{translate:0 -8px;}
.pile.mine.bump .stk{filter:drop-shadow(0 0 10px rgba(143,240,176,.9));}
/* a small table (a 320-wide phone, a short window): seats on one line, no fans of backs, smaller plates */
.tbl.tight .st .bk{display:none;}
.tbl.tight .st.p-n,.tbl.tight .st.p-s{flex-direction:row;}
.tbl.tight .st .tg{font-size:.72rem;padding:2px 8px 2px 2px;}
.tbl.tight .st .tg .avatar{width:20px;height:20px;}
.tbl.tight .st .chip{font-size:.64rem;padding:0 6px;}
.tbl.tight .st .say{font-size:.74rem;padding:3px 8px;}
.tbl.tight .pile .n small{display:none;} .tbl.tight .pile .n{font-size:.74rem;}
.tbl.tight .pile{--cw:20px;}
.tbl.tight .plate{padding:4px 12px 5px;min-width:0;} .tbl.tight .plate b{font-size:1.4rem;} .tbl.tight .plate small{font-size:.66rem;} .tbl.tight .plate i{font-size:.7rem;}
.tbl.tight .widow{--cw:34px;}
@media (max-height:700px){ .pn.L-pu > .act{min-height:74px;} .pn.L-pu .tp{min-width:64px;} .pn.L-pu .tp .su{width:24px;height:24px;font-size:16px;} .pn.L-pu .sd .tot{font-size:1.3rem;} .pn.L-pu .sd{padding:3px 8px;} .pn.L-pu{gap:6px;} }
.sd .bar i.g{background:repeating-linear-gradient(135deg,var(--sc) 0 3px,transparent 3px 6px);opacity:.55;}
/* phone sideways: a slimmer score strip and bar */
.pn.L-ps .sd{padding:3px 8px 4px;} .pn.L-ps .sd .tot{font-size:1.35rem;}
.pn.L-ps .tp{min-width:64px;padding:2px 6px;} .pn.L-ps .tp .su{width:26px;height:26px;font-size:18px;}
.pn.L-ps .act{min-height:34px;gap:4px;} .pn.L-ps .act .hint{font-size:.88rem;} .pn.L-ps .act .sub{display:none;}
.pn.L-ps .bidbar .amt{min-height:46px;} .pn.L-ps .bidbar .amt button{width:38px;height:38px;}
.pn.L-ps .trumps button{min-height:50px;}
.pn.L-ps .hand{padding-top:16px;}
/* iPad: bigger pieces */
.pn.L-tu .sd .nm,.pn.L-ts .sd .nm{font-size:.78rem;}
.pn.L-tu .sd .tot,.pn.L-ts .sd .tot{font-size:2rem;}
.pn.L-tu .tp,.pn.L-ts .tp{min-width:96px;} .pn.L-tu .tp .su,.pn.L-ts .tp .su{width:38px;height:38px;font-size:27px;}
.pn.L-tu .bidbar,.pn.L-tu .trumps,.pn.L-tu .act .row{max-width:560px;}
.pn.L-tu .act .hint,.pn.L-ts .act .hint{font-size:1.05rem;}
.pn.L-tu .bidbar .amt output{font-size:1.9rem;}
.pn.L-tu .mp,.pn.L-ts .mp{padding:8px 10px 9px;}
.pn.L-tu .mp .mh,.pn.L-ts .mp .mh{font-size:.8rem;} .pn.L-tu .mp .mh b,.pn.L-ts .mp .mh b{font-size:1.4rem;}
.pn.L-tu .mg .lb,.pn.L-ts .mg .lb{font-size:.74rem;}
/* online: a tap out of turn nudges whoever's move it is */
.act.nudge .hint,.st.turn.nudge .tg{animation:pnnudge .4s;}
@keyframes pnnudge{20%{translate:-6px 0;}40%{translate:6px 0;}60%{translate:-4px 0;}80%{translate:3px 0;}}
/* the hand's count, in the sheet */
.cnt{display:flex;flex-direction:column;gap:10px;}
.cr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border-radius:15px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--gl-line),inset 4px 0 0 var(--sc);position:relative;overflow:hidden;}
.cr .who{font-weight:900;font-size:.95rem;min-width:0;}
.cr .who small{display:block;font-size:.74rem;font-weight:800;color:var(--text-3);}
.cr .pts{font-family:var(--display);font-size:1.7rem;line-height:1;text-align:right;font-variant-numeric:tabular-nums;}
.cr .pts.neg{color:var(--red);}
.cr .ln{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.8rem;font-weight:800;color:var(--text-2);}
.cr .ln .k{display:inline-flex;flex-direction:column;line-height:1.1;}
.cr .ln .k small{font-size:.74rem;font-weight:600;color:var(--text-3);}
.cr .ln .k b{font-size:1.05rem;font-variant-numeric:tabular-nums;}
.cr .ln .k.lost b{text-decoration:line-through;color:var(--text-3);}
.cr .cc{grid-column:1 / -1;display:flex;flex-wrap:wrap;--cw:24px;min-height:34px;}
.cr .cc .pcard{flex:none;margin-right:-10px;box-shadow:0 1px 3px rgba(0,0,0,.4);animation:pnmg .35s var(--spring) both;}
.cr .stamp{position:absolute;right:12px;bottom:12px;rotate:-10deg;padding:3px 12px;border:3px solid currentColor;border-radius:8px;font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;text-transform:uppercase;opacity:0;scale:2;transition:opacity .25s,scale .35s var(--spring);pointer-events:none;background:rgba(20,16,10,.6);}
.cr .stamp.on{opacity:1;scale:1;}
.cr .stamp.good{color:#4ade80;} .cr .stamp.bad{color:#ff6b7a;}
.padw{margin-top:12px;}
.spad td.made{color:#17703c;} .spad td.set{color:#c8102e;}
.spad td small.k{font-size:.7rem;color:#7a7a90;display:block;line-height:1;}
.spad thead th{font-size:1rem;}
.spad tbody tr{cursor:default;}
/* The table's signage (kit.css --plate-bg, --lit): name plates, a seat's chips and what a player says are the moment
   strip's smoked glass; a turn is lit along the top edge; the bid sits on the strip's red square */
.st .tg{position:relative;border-radius:8px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px) saturate(.7);backdrop-filter:blur(10px) saturate(.7);font-family:var(--type-sign);font-weight:650;box-shadow:var(--plate-line),0 2px 8px rgba(0,0,0,.3);}
.st .tg .dl{text-transform:none;letter-spacing:0;font-weight:650;padding:0;background:none;color:var(--lit);font-size:.7rem;}
.st.turn .tg{box-shadow:inset 0 0 0 1px rgba(255,211,77,.7),0 0 18px var(--litg),0 2px 8px rgba(0,0,0,.3);}
.st.turn .tg::before{content:"";position:absolute;left:7px;right:7px;top:-1px;height:2px;border-radius:2px;background:var(--lit);box-shadow:0 0 8px 1px var(--litg);}
.st .chip{border-radius:6px;background:var(--plate-bg);color:#fff;font-family:var(--type-sign);font-weight:700;box-shadow:var(--plate-line);padding:2px 8px;}
.st .chip.hi{background:var(--plate-bg);color:var(--lit);box-shadow:inset 0 0 0 1px rgba(255,211,77,.6),0 0 10px var(--litg);}
.st .chip.bidr{background:rgba(213,50,42,.9);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
.st .chip.saved{box-shadow:var(--plate-line),inset 3px 0 0 #49c47f;}
.st .chip.pass{background:rgba(38,40,44,.5);color:rgba(255,255,255,.62);}
.st .say{border-radius:8px;background:var(--plate-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-family:var(--type-sign);font-weight:650;box-shadow:var(--plate-line),0 4px 12px rgba(0,0,0,.35);}
.st .say.big{background:var(--plate-bg);color:var(--lit);box-shadow:inset 0 0 0 1px rgba(255,211,77,.7),0 0 16px var(--litg);}
</style>
</head>
<body>
<main class="pn k-hold" id="app"></main>
<script>
(function () {
  'use strict';
  var Core = window.PinoCore, el = Kit.el, app = document.getElementById('app');
  var SAVE = 'pinochle_state', HKEY = 'pinochle';
  var GL = { s: '♠', h: '♥', d: '♦', c: '♣' }, SN = Core.SNAME;
  var POS = { 4: ['s', 'w', 'n', 'e'], 3: ['s', 'w', 'e'], 2: ['s', 'n'] };

  Kit.init({
    id: 'pinochle',
    onNew: function () { if (NET) { Kit.toast('Leave the online game first (in the menu)'); return; } clearSave(); showSetup(); },
    undo: function () { if (NET) { Kit.toast('Moves can’t be taken back online'); return; } undo(); },
    menu: TurnNet.menu().concat([
      { icon: 'chart', label: 'Score pad', onClick: function () { if (S && S.players) showPad(); } },
      { icon: 'history', label: 'Past games', onClick: function () { Kit.history(HKEY, { title: 'Pinochle: past games' }); } }
    ]),
    rules:
      '<p class="goal">Pinochle is played with a 48-card deck: two of each 9, jack, queen, king, ten and ace in every suit. In each suit the ace is highest, then the ten, king, queen, jack and nine. You score for <b>meld</b> (sets of cards you show) and for the <b>counters</b> you take in tricks. The first side to 1,500 wins (two-handed: 1,000).</p>' +
      '<h3>How many play</h3><ul><li><b>Four players</b> play in two partnerships, partners sitting across from each other. This is the main game.</li><li><b>Three players</b> play Cutthroat: everyone for themselves, 15 cards each, and 3 cards go face down as the widow.</li><li><b>Two players</b> play Two-handed Pinochle, with a stock to draw from.</li></ul>' +
      '<h3>The bidding</h3><ul><li>Starting to the dealer’s left, each player bids how many points their side will score in the hand, meld and counters together, or passes. The first bid is at least 250, and each bid is 10 more than the last. Once you pass, you are out of the bidding.</li>' +
      '<li>If everyone else passes and nobody has bid, the dealer is stuck with a bid of 250.</li>' +
      '<li>The highest bidder names trump. With three players, the bidder first turns up the widow for everyone to see, takes it, names trump and buries 3 cards face down. Counters in the buried cards count for the bidder.</li>' +
      '<li>With four players, the bidder’s partner passes the bidder 4 cards, and the bidder passes 4 cards back (3 each way if you choose 3 in the setup).</li></ul>' +
      '<h3>Meld</h3><p>Everyone lays their meld face up for the others to see, then picks it back up to play. A card can count in two melds of different kinds, but not twice in the same kind, so the king and queen in a run aren’t also a royal marriage.</p><ul>' +
      '<li><b>Run</b> (ace, ten, king, queen and jack of trump): 150. A double run is 1,500.</li><li><b>Royal marriage</b> (king and queen of trump): 40. A <b>marriage</b> in another suit: 20.</li><li><b>Dix</b> (the nine of trump): 10 each.</li>' +
      '<li><b>Aces around</b> (an ace of every suit): 100. Kings around 80, queens around 60, jacks around 40. Twice around is ten times as much: a thousand aces, 800 kings, 600 queens, 400 jacks.</li>' +
      '<li><b>Pinochle</b> (the queen of spades and the jack of diamonds): 40. Double pinochle: 300.</li></ul><p>A side’s meld only counts if that side takes at least one trick.</p>' +
      '<h3>The play</h3><ul><li>The bidder leads the first trick. You have to follow suit, and you have to beat the best card in the trick if you can. If you can’t follow suit, you have to play a trump, and beat any trump already played if you can. If the trick has already been trumped, you can follow suit with any card.</li>' +
      '<li>The best trump wins the trick, or the best card of the suit led. If two identical cards are played, the first one wins.</li>' +
      '<li><b>Counters:</b> every ace, ten and king you take is worth 10. The last trick is worth 10 more, so there are 250 in every hand.</li></ul>' +
      '<h3>Scoring</h3><ul><li>If the bidding side’s meld and counters reach its bid, it scores them all. If they fall short, the side <b>goes set</b>: it scores nothing for the hand and loses the amount of the bid.</li>' +
      '<li>Every other side scores its meld (if it took a trick) and its counters.</li>' +
      '<li>After seeing the meld, the bidder can <b>throw in</b> the hand instead of playing it. The bidding side loses its bid, and the others score their meld.</li>' +
      '<li>When a side reaches 1,500, the game ends. If two sides get there in the same hand, the bidding side wins.</li></ul>' +
      '<h3>Two-handed</h3><ul><li>Each player gets 12 cards. The next card is turned up for trump, and the rest are the stock. If the turned card is a nine, the dealer scores 10.</li>' +
      '<li>While the stock lasts, you don’t have to follow suit. The winner of each trick can lay one meld on the table, then the winner draws from the stock and the other player draws next. Cards laid on the table can still be played.</li>' +
      '<li>Each meld has to add at least one card from your hand. A royal marriage can later grow into a run for 150 more. If you hold the nine of trump, you can swap it for the turned-up card as your meld, for 10.</li>' +
      '<li>When the stock is gone, everyone picks up their meld and the last 12 tricks are played with the full rules: follow suit, beat the trick, and trump if you can’t follow. The game is to 1,000.</li></ul>' +
      '<h3>Online</h3><ul><li><b>Play online</b> in the menu: open a table and the others join on their own devices. With four, the first two people to sit are partners. The computer plays any empty seat.</li></ul>'
  });

  // ── State ─────────────────────────────────────────────────────────────────
  var S = null, token = 0, undoStack = [], busy = false, sel = [], madeShown = {}, setShown = {}, savedShown = {};
  var NET = null, MYSEAT = 0, LME = 0, BLIND = false;
  function me() { return NET ? MYSEAT : LME; }
  function N() { return S ? S.n : 4; }
  function posOf(p) { return POS[N()][(p - me() + N()) % N()]; }
  function sideOf(p) { return Core.sideOf(S, p); }
  function MS() { return sideOf(me()); }
  function person(p) { return p >= 0 && S.players[p] && !S.players[p].cpu; }
  function people() { return S.players.filter(function (x) { return !x.cpu; }).length; }
  function onePerson() { return !!NET || people() < 2; }
  function nm(p) { return S.players[p].name; }
  function first(n) { return String(n || '').split(' ')[0]; }
  // a person by their first name ("Kathleen M." is Kathleen); a computer player by its whole name ("Number 5")
  function fn(p) { var pl = S.players[p]; return pl.cpu ? pl.name : first(pl.name); }
  function fshort(p) { return fn(p); }   // (a label names the player, yours too: never "You")
  function short(p) { return p === me() && onePerson() && (!NET || MYSEAT >= 0) ? 'You' : nm(p); }
  function sideCount() { return Core.nSides(S); }
  function sideSeats(s) { return Core.seatsOf(S, s); }
  function sideName(s) { return sideSeats(s).map(function (p) { return fn(p); }).join(' & '); }
  function sideColor(s) { return Kit.color(s); }
  function seatColor(p) { return Kit.color(sideOf(p)); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function save() {
    if (NET || !S) return;
    try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {}
    if (S.phase !== 'over') Kit.resume.set('Hand ' + S.round + ' · ' + S.scores.map(function (v, s) { return sideName(s) + ' ' + v; }).join(' · '));
  }
  function clearSave() { try { localStorage.removeItem(SAVE); } catch (e) {} Kit.resume.clear(); token++; busy = false; }

  var LEVELS = [['easy', 'Easy', 'Bids by feel and forgets which cards have gone.'],
    ['normal', 'Normal', 'Counts its meld, bids what its hand is worth and keeps track of the high cards.'],
    ['hard', 'Hard', 'Remembers every card and the meld on the table, and thinks each play through.']];

  // ── Setup ─────────────────────────────────────────────────────────────────
  function kindFor(n) { return n === 2 ? 'two' : n === 3 ? 'cut' : 'part'; }
  function showSetup() {
    S = null; token++; BLIND = false; LME = 0; sel = []; Kit.handoff.close();
    app.className = 'stage'; app.innerHTML = ''; app.removeAttribute('style'); tbl = null;
    Kit.setup(app, {
      modes: Kit.modes(['cpu', 'local']),
      players: { min: 2, max: 4, count: 4, cpu: function (m) { return m === 'cpu' ? 'seats' : 'mix'; }, teams: function (n) { return n === 4 ? [[0, 2], [1, 3]] : null; } },

          el('span', { class: 'k' }, [el('small', { text: 'Counters' }), el('b', { class: 'cv', text: '0', 'data-v': String(r.cpts) })]),
          el('span', { class: 'k' }, [el('small', { text: 'Tricks' }), el('b', { text: String(r.tricks) })]),
          el('span', { class: 'k svd', hidden: true }, [el('small', { text: 'Saved with' }), el('b', { text: 'one trick' })])
        ]),
        cc,
        el('span', { class: 'stamp ' + (r.set ? 'bad' : 'good'), text: r.set ? (L.conceded ? 'Thrown in' : 'Set') : r.made ? 'Made' : '' })

    });

  }
  function animateCount(node, st, L, after) {
    var rows = node.querySelectorAll('.cr'), t = 120, step = 70;
    rows.forEach(function (row, s) {
      var cs = String(L.piles[s] || '').match(/(10|[2-9TJQKA])[shdc]/g) || [], cc = row.querySelector('.cc'), cv = row.querySelector('.cv'), pts = row.querySelector('.pts');
      var counters = cs.filter(function (c) { return /^[AKT]/.test(c); }), running = 0;
      counters.forEach(function (c, i) {
        setTimeout(function () {
          var r = c.charAt(0) === 'T' ? '10' : c.charAt(0), card = Kit.card(r, c.charAt(1)); cc.appendChild(card);

  // The score pad: a column for each side, a row for each hand (meld and counters in it), the bid marked made or set

      var meldBy = []; for (var q = 0; q < S2; q++) meldBy.push(0);

        var note = q === bs ? (h.r === 'm' ? 'made ' + h.b : h.r === 'c' ? 'threw in ' + h.b : 'set ' + h.b) : (st.kind === 'two' ? '' : 'meld ' + meldBy[q] + ' + ' + cp[q]);
        if (st.kind === 'two') note = 'meld ' + meldBy[q] + ' + ' + cp[q];
        tr.appendChild(el('td', { class: q === bs ? (h.r === 'm' ? 'made' : 'set') : '' }, [document.createTextNode(String(run[q])), el('small', { class: 'k', text: note })]));
      }

    t.appendChild(thead); t.appendChild(tb);
    var ft = el('tr', null, [el('th', { class: 'rn', text: 'Total' })]), lead = Math.max.apply(null, st.scores);
    st.scores.forEach(function (v) { ft.appendChild(el('td', { class: v === lead ? 'lead' : '', text: String(v) })); });

  }
  function showPad() {
    var node = el('div', null, [padTable(S), el('p', { class: 'muted', style: { 'margin-top': '10px', 'font-size': '.85rem' }, text: 'This is hand ' + S.round + '. The first side to ' + S.target.toLocaleString('en-US') + ' wins.' })]);
    Kit.sheet({ title: 'Score pad', node: node, actions: [{ label: 'Close', cls: 'btn-soft' }] });
  }
  // The new hand dealt round the table, a card at a time
  function dealIn(done) {
    render();
    var cards = handEl ? [].slice.call(handEl.querySelectorAll('.pcard')) : [];
    var src = seatAnchor(S.dealer);
    cards.forEach(function (n, i) { n.style.opacity = '0'; setTimeout(function () { n.style.opacity = ''; Cards.fly(n, src, { ms: 300 }); if (i % 3 === 0) Kit.sfx('deal', 0.7); }, 40 + i * 45); });
    seatEls.forEach(function (s, p) { if (p === me()) return; var bk = s.querySelector('.bk'); if (bk) { bk.style.opacity = '0'; setTimeout(function () { bk.style.opacity = ''; Cards.fly(bk, src, { ms: 320 }); }, 80 + p * 90); } });

  function startHand(first0) {

    }

    busy = true; var t = token;
    dealIn(function () { if (t !== token) return; busy = false; next(); });
  }

  // ═══ The end of the game ═════════════════════════════════════════════════════════════════════════
  function recordGame(st, mode, extraHl) {
    var nS = Core.nSides(st), w = st.winner, names = st.players.map(function (p) { return p.name; });
    var seen = {}, hl = st.highlights.slice().reverse().filter(function (h) { var k = h.replace(/ in hand \d+$/, ''); if (seen[k]) return false; seen[k] = 1; return true; }).slice(0, 8).reverse();
    var best = st.stats.bestMeld; if (best && best.pts >= 150) hl.push('Best meld: ' + names[best.p] + ', ' + best.pts + ' in hand ' + best.r);
    hl.push(st.hx.length + ' hands, played to ' + st.target);

      started: st.started, mode: mode,
      players: sides, winner: Core.sideName(st, w),
      rounds: { labels: st.rounds.map(function (r, i) { return 'H' + (i + 1); }), scores: st.rounds },
      highlights: hl, detail: detail

  }
  function finish() {
    var st = S, w = st.winner;
    recordGame(st, (st.kind === 'part' ? 'Partnership' : st.kind === 'cut' ? 'Cutthroat' : 'Two-handed') + ' · ' + (st.mode === 'local' ? 'Pass & play' : 'Against the computer'));
    var cfg = { players: st.players, target: st.target, passN: st.passN, level: st.level, mode: st.mode, kind: st.kind };
    var mine = w === MS() && onePerson(), lose = Core.seatsOf(st, w).every(function (p) { return !person(p); });

      rank: ranks.map(function (s) { return { name: sideName(s), score: st.scores[s], color: sideColor(s), cpu: Core.seatsOf(st, s).every(function (p) { return st.players[p].cpu; }), me: s === MS() && onePerson() }; }),
      lose: lose, icon: lose ? 'bot' : 'trophy',
      again: function () { S = Core.newGame(cfg); S.mode = cfg.mode; S.seen = 0; LME = 0; Kit.gameStart(); undoStack = []; startHand(true); },
      look: 'Look at the table',
      extra: [{ label: 'Score pad', onClick: function () { showPad(); } }],
      setup: function () { clearSave(); showSetup(); }

  }

  // ── Undo (your last move this hand) ──

  }

  // ═══ Online (turnnet.js) ═════════════════════════════════════════════════════════════════════════
  // The table holds the whole game in fixed seats. With four, people take the seats in the order 0, 2, 1, 3, so the
  // first two to sit are partners (PS turns a table seat into a game seat and back). Each device draws the table from
  // its own seat with only its own hand face up. The rules and the computer players are the same as here.

  }

  }
  function netNudge() {

    [actEl].concat(seatEls.filter(function (s) { return s.classList.contains('turn'); })).forEach(function (e) { e.classList.remove('nudge'); void e.offsetWidth; e.classList.add('nudge'); });
  }
  function netShow(net, info) {
    NET = net;
    if (info.fresh || info.again) { NQ = []; NGEN++; busy = false; netCloseOver(); }
    NQ.push({ st: clone(net.state), prev: info.prev ? clone(info.prev) : null, mv: info.mv, info: info });

  function netPump() {

  }
  function netStep(it, done) {
    var st = it.st, prev = it.prev, mv = it.mv, info = it.info;

  // a move as the table recorded it, back into the action that made it (to check it follows from what's on screen)

      rank: ranks.map(function (s) { return { name: sideName(s), score: st.scores[s], color: sideColor(s), me: !watching && s === Core.sideOf(st, MYSEAT) }; }),
      lose: !won, icon: won ? 'trophy' : 'users',
      againLabel: left ? 'Back to the lobby' : 'Play again',
      again: function () { if (left) { TurnNet.leave(); TurnNet.open(); } else NET.again(); },
      look: 'Look at the table',

    // (a demo: a new game, {players, level, target}, with fix(S) arranging the first deal; set(fn) arranges the table)
    start: function (cfg, fix) {
      token++; busy = false; BLIND = false; sel = [];
      S = Core.newGame({ kind: kindFor(cfg.players.length), players: cfg.players, target: cfg.target || 1500, passN: 4, level: cfg.level || 'normal' });
      S.mode = 'cpu'; S.me = 0; S.seen = 0;

})();

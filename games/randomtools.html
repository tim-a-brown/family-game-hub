<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Random Tools</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<style>
body{background:radial-gradient(700px 460px at 50% -8%, rgba(96,165,250,.13), transparent 62%), var(--bg);}
.wrap{max-width:520px;margin:0 auto;}
.tabs{display:grid;grid-template-columns:1fr 1fr;}
.tab{min-height:40px;font-size:.92rem;}
.sec-lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:0 4px 8px;}
/* Hero result */
.hero{min-height:170px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);margin-bottom:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 14px;text-align:center;}
.hero-empty{color:var(--text-3);font-size:.95rem;font-weight:600;}
.hero-empty b{display:block;font-size:2.2rem;margin-bottom:4px;}
.big-num{font-family:var(--display);font-size:clamp(4rem,22vw,6.5rem);font-weight:800;color:var(--gold);line-height:1;letter-spacing:-.04em;
  text-shadow:0 0 40px rgba(245,200,66,.3);font-variant-numeric:tabular-nums;}
.big-num.spin{opacity:.55;filter:blur(.5px);}
.big-num.pop,.num-chip.pop{animation:gn-pop .38s var(--spring) both;}
.hero-sub{font-size:.85rem;color:var(--text-3);margin-top:6px;}
.num-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.num-chip{min-width:64px;height:56px;padding:0 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:rgba(245,200,66,.12);border:1px solid rgba(245,200,66,.3);font-family:var(--display);font-size:1.6rem;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;}
/* Grouped inset form */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.row{margin:0;color:var(--text);letter-spacing:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:0;}
.row-lbl{font-size:1rem;font-weight:600;flex:none;}
.row input.input{width:130px;flex:none;min-height:44px;text-align:right;background:transparent;border-color:transparent;padding:8px 10px;font-weight:600;}
.row input.input:focus{background:var(--surface-2);border-color:rgba(245,200,66,.5);box-shadow:none;}
.seg{display:flex;gap:4px;padding:3px;background:var(--surface-2);border-radius:12px;}
.seg button{min-width:34px;padding:0 6px;height:38px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-weight:700;font-size:.95rem;cursor:pointer;font-variant-numeric:tabular-nums;}
.seg button.on{background:var(--surface-3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.35);}
.btn-xl{min-height:54px;font-size:1.05rem;}
/* History */
.hist-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;}
.hist-chip{min-width:40px;height:34px;padding:0 12px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line);font-size:.9rem;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums;}
/* Teams */
textarea.input{resize:vertical;min-height:150px;line-height:1.6;border-radius:0;border:0;background:transparent;padding:14px 16px;}
textarea.input:focus{box-shadow:none;background:transparent;}
.names-meta{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px;font-size:.82rem;color:var(--text-3);}
.team-display{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px;}
.team-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:var(--radius);padding:12px 14px;
  animation:gn-pop .35s var(--spring) both;}
.team-name{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:800;margin-bottom:6px;font-size:1.05rem;color:var(--tc);}
.team-name span{font-family:var(--font);font-size:.78rem;font-weight:700;color:var(--text-3);}
.team-member{padding:7px 0;font-size:.95rem;color:var(--text);border-bottom:1px solid var(--line);}
.team-member:last-child{border-bottom:none;}
.err{color:var(--red);text-align:center;font-size:.9rem;font-weight:600;grid-column:1/-1;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a><span class="nav-title">Random Tools</span>
</nav>
<div class="page"><div class="wrap">

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="rng">🎲 Numbers</button>
  <button class="tab" data-tab="teams">👥 Teams</button>
</div>

<!-- RNG PANEL -->
<div id="tab-rng">
  <div class="hero" id="rng-output"><div class="hero-empty"><b>✦</b>Pick a range and tap Generate</div></div>
  <div class="group">
    <label class="row" for="rng-min"><span class="row-lbl">From</span><input class="input" type="number" inputmode="numeric" id="rng-min" value="1"></label>
    <label class="row" for="rng-max"><span class="row-lbl">To</span><input class="input" type="number" inputmode="numeric" id="rng-max" value="100"></label>
    <div class="row"><span class="row-lbl">How many</span>
      <div class="seg" data-target="rng-count"><button class="on">1</button><button>2</button><button>3</button><button>5</button><button>10</button></div>
      <input type="hidden" id="rng-count" value="1">
    </div>
  </div>
  <button class="btn btn-gold btn-block btn-xl" id="rng-btn">Generate</button>
  <div class="hist-chips" id="rng-hist"></div>
</div>

<!-- TEAMS PANEL -->
<div id="tab-teams" class="hidden">
  <div class="sec-lbl">Names · one per line</div>
  <div class="group">
    <textarea class="input" id="names-input" placeholder="Alice&#10;Bob&#10;Cameron&#10;Jamie&#10;…" rows="6"></textarea>
    <div class="names-meta"><span id="names-count">0 names</span><button class="btn-ghost" id="names-clear" style="min-height:36px">Clear</button></div>
  </div>
  <div class="group">
    <div class="row"><span class="row-lbl">Teams</span>
      <div class="seg" data-target="team-count"><button>2</button><button class="on">3</button><button>4</button><button>5</button><button>6</button></div>
      <input type="hidden" id="team-count" value="3">
    </div>
  </div>
  <button class="btn btn-gold btn-block btn-xl" id="teams-btn">Randomize teams</button>
  <div id="teams-output" class="team-display"></div>
</div>

</div></div>
<script>
'use strict';
const TEAM_COLORS=['#f5c842','#5ac8fa','#ff6b6b','#7ed47e','#c084fc','#fb923c'];
const haptic=k=>{try{window.GN&&GN.haptic(k);}catch(e){}};
const toast=m=>{ if(window.GN)GN.toast(m); };

// Tabs
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');haptic('select');
    ['rng','teams'].forEach(id=>document.getElementById('tab-'+id).classList.toggle('hidden',id!==t.dataset.tab));
  });
});
// Segmented pickers write into their hidden input
document.querySelectorAll('.seg').forEach(seg=>{
  seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');haptic('select');
    document.getElementById(seg.dataset.target).value=b.textContent;
  }));
});

// ── RNG ────────────────────────────────────────────────────────────────────
let rngHistory=[];
let spinning=false;
document.getElementById('rng-btn').addEventListener('click',()=>{
  if(spinning)return;
  const min=parseInt(document.getElementById('rng-min').value)||1;
  const max=parseInt(document.getElementById('rng-max').value)||100;
  const count=parseInt(document.getElementById('rng-count').value)||1;
  if(min>max){toast('“From” must be less than or equal to “To”');haptic('error');return;}
  document.activeElement&&document.activeElement.blur&&document.activeElement.blur();

  const nums=Array.from({length:count},()=>Math.floor(Math.random()*(max-min+1))+min);
  const out=document.getElementById('rng-output');
  const rnd=()=>Math.floor(Math.random()*(max-min+1))+min;

  // Slot-machine spin, then land on the result
  spinning=true;haptic('light');
  if(count===1){
    out.innerHTML=`<div class="big-num spin">${rnd()}</div><div class="hero-sub">${min} – ${max}</div>`;
  } else {
    out.innerHTML=`<div class="num-grid">${nums.map(()=>`<div class="num-chip">${rnd()}</div>`).join('')}</div><div class="hero-sub">${count} numbers · ${min} – ${max}</div>`;
  }
  const t0=performance.now();
  const iv=setInterval(()=>{
    if(count===1)out.querySelector('.big-num').textContent=rnd();
    else out.querySelectorAll('.num-chip').forEach(c=>c.textContent=rnd());
    if(performance.now()-t0>480){
      clearInterval(iv);spinning=false;
      if(count===1){const b=out.querySelector('.big-num');b.textContent=nums[0];b.classList.remove('spin');b.classList.add('pop');}
      else out.querySelectorAll('.num-chip').forEach((c,i)=>{c.textContent=nums[i];c.classList.add('pop');c.style.animationDelay=(i*40)+'ms';});
      haptic('medium');
      if(count===1){rngHistory.unshift(nums[0]);if(rngHistory.length>20)rngHistory.pop();}
      else{nums.forEach(n=>{rngHistory.unshift(n);});if(rngHistory.length>20)rngHistory.length=20;}
      const hist=document.getElementById('rng-hist');
      hist.innerHTML=rngHistory.map(n=>`<div class="hist-chip">${n}</div>`).join('');
    }
  },55);
});

// ── Team Generator ─────────────────────────────────────────────────────────
const namesEl=document.getElementById('names-input');
function countNames(){const n=namesEl.value.split('\n').map(x=>x.trim()).filter(Boolean).length;document.getElementById('names-count').textContent=n+(n===1?' name':' names');}
namesEl.addEventListener('input',countNames);
document.getElementById('names-clear').addEventListener('click',()=>{namesEl.value='';countNames();document.getElementById('teams-output').innerHTML='';});
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

document.getElementById('teams-btn').addEventListener('click',()=>{
  const raw=namesEl.value;
  const names=raw.split('\n').map(n=>n.trim()).filter(Boolean);
  if(names.length<2){toast('Enter at least 2 names');haptic('error');return;}

  const numTeams=parseInt(document.getElementById('team-count').value);
  if(numTeams>names.length){toast('More teams than names!');haptic('error');return;}
  namesEl.blur();

  // Shuffle
  const shuffled=[...names];
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}

  // Distribute
  const teams=Array.from({length:numTeams},()=>[]);
  shuffled.forEach((name,i)=>teams[i%numTeams].push(name));

  const out=document.getElementById('teams-output');
  out.innerHTML=teams.map((members,ti)=>`
    <div class="team-card" style="--tc:${TEAM_COLORS[ti]};animation-delay:${ti*60}ms">
      <div class="team-name">Team ${ti+1}<span>${members.length}</span></div>
      ${members.map(m=>`<div class="team-member">${escapeHTML(m)}</div>`).join('')}
    </div>`).join('');
  haptic('success');
  setTimeout(()=>out.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
});
</script>
</body>
</html>

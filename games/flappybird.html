<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Flappy Bird</title>
<link rel="stylesheet" href="../shared.css">
<script src="../sync.js"></script>
<script src="../app.js" defer></script>
<script src="../arcade-hi.js"></script>
<style>
html,body{height:100%;}
body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(700px 420px at 50% -10%, rgba(78,192,202,.14), transparent 60%), var(--bg);}
.site-nav{flex:none;}
.site-nav .icon-btn{width:38px;height:38px;min-height:38px;padding:0;font-size:1rem;border-radius:50%;}
.arc{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:10px max(12px,var(--safe-r)) calc(12px + var(--safe-b)) max(12px,var(--safe-l));touch-action:none;}
.hud{flex:none;display:flex;gap:8px;justify-content:center;width:100%;}
.pill{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);}
.pill span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
.pill b{font-family:var(--display);font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;}
.pill.accent b{color:var(--gold);}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
.board{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--line-2),0 20px 50px rgba(0,0,0,.55);}
#cv{display:block;touch-action:none;}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(6,14,24,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:gn-fade .2s ease both;z-index:5;}
.ov.hidden{display:none;}
.ov.passthru{pointer-events:none;background:rgba(6,14,24,.35);-webkit-backdrop-filter:none;backdrop-filter:none;}
.ov.passthru{align-items:stretch;}
.ov.passthru .ov-card{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:6% 0 84px;max-width:none;}
.ov-card{text-align:center;width:100%;max-width:280px;animation:gn-pop .3s var(--spring) both;}
.ov-emoji{font-size:2.6rem;line-height:1;margin-bottom:6px;}
.ov-title{font-family:var(--display);font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;text-shadow:0 2px 12px rgba(0,0,0,.4);}
.ov-sub{color:rgba(255,255,255,.85);font-size:.95rem;margin-top:8px;line-height:1.45;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.ov-tap{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);
  font-weight:700;font-size:.92rem;animation:fb-pulse 1.4s ease-in-out infinite;}
@keyframes fb-pulse{50%{transform:scale(1.06);}}
.ov-stats{display:flex;gap:8px;justify-content:center;margin:16px 0 4px;}
.ov-stat{flex:1;max-width:110px;padding:8px 6px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line-2);}
.ov-stat b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;}
.ov-stat span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);}
.ov .btn{min-width:180px;margin-top:16px;}
.hint{flex:none;font-size:.82rem;color:var(--text-3);text-align:center;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-back" href="../index.html">← Home</a>
  <span class="nav-title">Flappy Bird</span>
  <button class="icon-btn" onclick="ArcadeHi.show('flappy','Flappy Bird')" aria-label="High scores">🏆</button>
</nav>
<main class="arc" id="arc">
  <div class="hud">
    <div class="pill accent"><span>Score</span><b id="fb-score">0</b></div>
    <div class="pill"><span>Best</span><b id="fb-best">0</b></div>
  </div>
  <div class="stage" id="stage">
    <div class="board" id="board">
      <canvas id="cv"></canvas>
      <div class="ov hidden" id="ov"><div class="ov-card" id="ov-card"></div></div>
    </div>
  </div>
  <div class="hint">Tap anywhere — or press Space — to flap</div>
</main>
<script>
'use strict';
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const stage=document.getElementById('stage'),boardEl=document.getElementById('board');
const haptic=k=>{try{window.GN&&GN.haptic(k);}catch(e){}};
// Logical size in CSS px (as originally tuned); backing store scaled for retina.
let W=360,H=540;
function fit(){
  const r=stage.getBoundingClientRect();
  if(state!=='play'&&state!=='paused'){
    W=Math.max(240,Math.floor(Math.min(390,r.width)));
    H=Math.max(300,Math.floor(Math.min(r.height,Math.floor(W*1.5))));
    if(bird&&state==='idle')bird.y=H/2;
  }
  const d=Math.min(window.devicePixelRatio||1,3);
  boardEl.style.width=W+'px';boardEl.style.height=H+'px';
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);
  ctx.setTransform(d,0,0,d,0,0);
  if(bird)render();
}

const GRAV=0.28,FLAP=-6.2,PIPE_W=52,PIPE_SPEED=3.2,BIRD_R=16;
const PIPE_SPACING=220; // pixels between pipes (consistent spacing regardless of speed)
const PIPE_GAP_MIN=150,PIPE_GAP_MAX=200;
let bird=null,pipes=[],score=0,best=parseInt(localStorage.getItem('flappyBest')||'0'),state='idle',frame=0;

const COLORS={sky:'#4ec0ca',ground:'#ded895',pipe:'#74bf2e',pipeDark:'#558c1e',bird:'#f5c842',beak:'#f97316'};

function reset(){
  bird={x:90,y:H/2,vy:0,angle:0,flap:0};
  pipes=[];score=0;frame=0;
  document.getElementById('fb-score').textContent=0;
}
let deadAt=0;
function flap(){
  if(state==='paused'){state='play';syncOverlay();return;}
  if(state==='idle'){state='play';reset();bird.vy=FLAP;haptic('select');syncOverlay();return;}
  if(state==='dead'){ if(performance.now()-deadAt>450){state='idle';reset();syncOverlay();} return; }
  bird.vy=FLAP;bird.flap=8;
}

// Fixed 60 Hz simulation so the bird flies the same on 60/120 Hz screens
let lastT=0,acc=0;const DT=1000/60;
function loop(t){
  if(!lastT)lastT=t;
  acc+=Math.min(100,t-lastT);lastT=t;
  while(acc>=DT){update();acc-=DT;}
  render();requestAnimationFrame(loop);
}
function update(){
  if(state!=='play')return;
  frame++;
  // Bird physics
  bird.vy+=GRAV;bird.vy=Math.min(bird.vy,7);
  bird.y+=bird.vy;
  bird.angle=Math.max(-25,Math.min(70,bird.vy*5));
  if(bird.flap>0)bird.flap--;
  // Pipes
  // Pipes — spawn when rightmost pipe has scrolled PIPE_SPACING pixels from right edge
  const lastPipe=pipes.length?pipes[pipes.length-1]:null;
  if(!lastPipe||lastPipe.x<W-PIPE_SPACING){
    const gap=PIPE_GAP_MIN+Math.floor(Math.random()*(PIPE_GAP_MAX-PIPE_GAP_MIN+1));
    const top=70+Math.random()*(H-gap-160);
    pipes.push({x:W+10,top,gap,passed:false});
  }
  pipes.forEach(p=>p.x-=PIPE_SPEED);
  pipes=pipes.filter(p=>p.x>-PIPE_W-10);
  // Score
  pipes.forEach(p=>{
    if(!p.passed&&p.x+PIPE_W<bird.x){p.passed=true;score++;haptic('light');document.getElementById('fb-score').textContent=score;
      if(score>best){best=score;localStorage.setItem('flappyBest',best);document.getElementById('fb-best').textContent=best;}
    }
  });
  // Collision
  const GROUND=H-60;
  if(bird.y+BIRD_R>GROUND||bird.y-BIRD_R<0){die();return;}
  for(const p of pipes){
    const inX=bird.x+BIRD_R-6>p.x&&bird.x-BIRD_R+6<p.x+PIPE_W;
    const inY=bird.y-BIRD_R+6<p.top||bird.y+BIRD_R-6>p.top+p.gap;
    if(inX&&inY){die();return;}
  }
}

function die(){
  state='dead';deadAt=performance.now();
  haptic('error');
  const isBest=score>0&&score>=best;
  if(score>best){best=score;localStorage.setItem('flappyBest',best);}
  document.getElementById('fb-best').textContent=best;
  syncOverlay(isBest);
  ArcadeHi.check('flappy',score,()=>{});
}

function render(){
  const GROUND=H-60;
  // Sky gradient
  const grad=ctx.createLinearGradient(0,0,0,GROUND);
  grad.addColorStop(0,'#1a3a5c');grad.addColorStop(1,'#4ec0ca');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,GROUND);
  // Clouds (static decoration)
  ctx.fillStyle='rgba(255,255,255,.3)';
  [[60,80],[180,50],[290,100],[120,160]].forEach(([x,y])=>{
    ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.arc(x+18,y-8,14,0,Math.PI*2);ctx.arc(x+34,y,18,0,Math.PI*2);ctx.fill();
  });
  // Pipes
  pipes.forEach(p=>{
    // Top pipe
    ctx.fillStyle=COLORS.pipe;
    ctx.fillRect(p.x,0,PIPE_W,p.top);
    ctx.fillStyle=COLORS.pipeDark;
    ctx.fillRect(p.x-4,p.top-22,PIPE_W+8,22);
    // Bottom pipe
    const botY=p.top+p.gap;
    ctx.fillStyle=COLORS.pipe;
    ctx.fillRect(p.x,botY,PIPE_W,H-botY);
    ctx.fillStyle=COLORS.pipeDark;
    ctx.fillRect(p.x-4,botY,PIPE_W+8,22);
  });
  // Ground
  ctx.fillStyle=COLORS.ground;ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#c8b060';ctx.fillRect(0,GROUND,W,8);
  // Bird
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.angle*Math.PI/180);
  // Body
  ctx.fillStyle=COLORS.bird;
  ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=4;
  ctx.beginPath();ctx.ellipse(0,0,BIRD_R,BIRD_R*0.85,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // Wing
  const wingY=bird.flap>0?4:-2;
  ctx.fillStyle='#e0a830';
  ctx.beginPath();ctx.ellipse(-4,wingY,10,5,bird.flap>0?0.4:-0.2,0,Math.PI*2);ctx.fill();
  // Eye
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-5,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(8,-5,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(9,-6,1,0,Math.PI*2);ctx.fill();
  // Beak
  ctx.fillStyle=COLORS.beak;
  ctx.beginPath();ctx.moveTo(12,-2);ctx.lineTo(20,0);ctx.lineTo(12,3);ctx.closePath();ctx.fill();
  ctx.restore();
  // Big in-game score
  if(state==='play'||state==='paused'){
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='800 44px "Bricolage Grotesque",Inter,system-ui,sans-serif';
    ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.strokeText(score,W/2,52);
    ctx.fillStyle='#fff';ctx.fillText(score,W/2,52);
  }
}

// ── HTML overlays ──
function syncOverlay(isBest){
  const ov=document.getElementById('ov'),card=document.getElementById('ov-card');
  ov.classList.remove('passthru');
  if(state==='idle'){
    card.innerHTML=`<div><div class="ov-title" style="color:var(--gold)">Flappy Bird</div>
      <div class="ov-sub">Fly through the gaps.<br>Don't touch the pipes!</div></div><div class="ov-tap">👆 Tap to start</div>`;
    ov.classList.add('passthru');
  }else if(state==='paused'){
    card.innerHTML=`<div><div class="ov-title">Paused</div><div class="ov-sub">Score ${score}</div></div><div class="ov-tap">👆 Tap to resume</div>`;
    ov.classList.add('passthru');
  }else if(state==='dead'){
    card.innerHTML=`<div class="ov-title">Game over</div>
      <div class="ov-sub">${isBest?'🎉 New personal best!':'So close!'}</div>
      <div class="ov-stats"><div class="ov-stat"><b>${score}</b><span>Score</span></div><div class="ov-stat"><b>${best}</b><span>Best</span></div></div>
      <button class="btn btn-gold" id="ov-go">Play again</button>`;
    document.getElementById('ov-go').onclick=e=>{e.stopPropagation();state='idle';reset();flap();};
  }else{ov.classList.add('hidden');return;}
  ov.classList.remove('hidden');
}

// Tap anywhere on the play area (not on buttons)
const arc=document.getElementById('arc');
arc.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  if(state==='dead')return; // use the Play again button
  e.preventDefault();flap();
});
document.addEventListener('keydown',e=>{
  if(document.querySelector('.ahi-overlay'))return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'){e.preventDefault();
    if(state==='dead'){ if(performance.now()-deadAt>450){state='idle';reset();flap();} }
    else flap();
  }
  if(e.code==='KeyP'||e.code==='Escape'){ if(state==='play'){state='paused';syncOverlay();} }
});
// Auto-pause when the app is backgrounded
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play'){state='paused';syncOverlay();} });
window.addEventListener('blur',()=>{ if(state==='play'){state='paused';syncOverlay();} });
document.getElementById('fb-best').textContent=best;
fit();reset();syncOverlay();
new ResizeObserver(fit).observe(stage);
requestAnimationFrame(loop);
</script>
</body>
</html>

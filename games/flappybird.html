<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Bird</title>
<link rel="stylesheet" href="../kit.css">
<script src="../sync.js"></script>
<script src="../games.js"></script>
<script src="../game-icons.js"></script>
<script src="../kit.js"></script>
<script src="../hist.js"></script>
<script src="../players.js"></script>
<script src="../arcade-hi.js"></script>
<style>
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{display:flex;flex-direction:column;
  background:radial-gradient(90% 45% at 50% 0%, rgba(80,190,255,.14) 0%, rgba(80,190,255,0) 70%),var(--bg);}
#app{flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;align-items:center;
  padding:0 8px calc(var(--safe-b) + 10px);gap:8px;touch-action:none;-webkit-user-select:none;user-select:none;}
.hud{flex:none;display:flex;align-items:stretch;gap:6px;width:100%;}
.plate{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 8px;border-radius:14px;
  background:linear-gradient(180deg,#1b2440,#0e1428);box-shadow:inset 0 0 0 1.5px rgba(140,210,255,.28),0 6px 14px rgba(0,0,0,.35);}
.plate small{font-size:.6rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(170,225,255,.65);white-space:nowrap;}
.plate b{font-family:var(--display);font-weight:400;font-size:1.4rem;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;}
.plate.gold b{color:#ffd84a;text-shadow:0 0 12px rgba(255,200,40,.4);}
.pbtn{flex:none;width:48px;border:0;border-radius:14px;display:grid;place-items:center;color:#cdeeff;
  background:linear-gradient(180deg,#1b2440,#0e1428);box-shadow:inset 0 0 0 1.5px rgba(140,210,255,.28),0 6px 14px rgba(0,0,0,.35);}
.pbtn:active{transform:scale(.94);}
.pbtn svg{width:22px;height:22px;}
.cab{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.bezel{position:relative;padding:7px;border-radius:22px;}
.scr{position:relative;border-radius:15px;overflow:hidden;background:#6ec6f0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.45);}
.scr canvas{display:block;touch-action:none;}
.scr.shake{animation:fb-shake .3s;}
@keyframes fb-shake{0%,100%{transform:none}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2;}
.flash.go{animation:fb-flash .35s ease-out;}
@keyframes fb-flash{0%{opacity:.9}100%{opacity:0}}
/* Overlays inside the screen */
.ov{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;pointer-events:none;}
.ov[hidden]{display:none;}
.ov button,.ov .card{pointer-events:auto;}
.ov h2{font-family:var(--display);font-weight:400;font-size:2.6rem;line-height:1;color:#fff;letter-spacing:.01em;
  -webkit-text-stroke:2px #3a2410;paint-order:stroke fill;text-shadow:0 4px 0 #3a2410,0 8px 18px rgba(0,0,0,.25);}
.ov h2.gold{color:#ffd84a;}
.ov h2.red{color:#ff8a5c;}
.ready{justify-content:space-between;padding:12% 16px 18px;}
.ready .mid{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:auto;margin-bottom:auto;padding-top:34%;}
.tapme{position:relative;width:74px;height:74px;display:grid;place-items:center;color:#fff;}
.tapme .ico{width:44px;height:44px;stroke-width:2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35));animation:fb-tap 1.1s ease-in-out infinite;}
.tapme::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.8);animation:fb-ring 1.1s ease-out infinite;}
@keyframes fb-tap{0%,100%{transform:translateY(0)}45%{transform:translateY(5px) scale(.94)}}
@keyframes fb-ring{0%{transform:scale(.5);opacity:0}45%{transform:scale(.6);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.ready .tip{font-weight:900;color:#fff;font-size:1rem;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.25);}
.who{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border:0;border-radius:999px;font-weight:800;font-size:.92rem;
  background:rgba(10,20,40,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.who .avatar{width:28px;height:28px;font-size:.8rem;}
.who .ico{width:15px;height:15px;color:rgba(255,255,255,.6);}
/* Scorecard */
.sc-wrap{background:rgba(8,14,30,.28);}
.sc-wrap h2{margin-bottom:12px;animation:fb-drop .45s var(--spring) both;}
@keyframes fb-drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.card{width:100%;max-width:300px;border-radius:20px;padding:14px 14px 12px;
  background:linear-gradient(180deg,#fff8e4,#f3e2b8);color:#5a3d16;
  box-shadow:inset 0 0 0 3px #d7b56b,inset 0 0 0 5px #fff4d4,0 6px 0 #a17a32,0 18px 34px rgba(0,0,0,.35);
  animation:fb-up .5s var(--spring) .1s both;}
@keyframes fb-up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.card .top{display:flex;align-items:center;gap:14px;}
.medal{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.medal .disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,#e6d3a8 0 55%,#d2bb8a 56% 100%);box-shadow:inset 0 3px 6px rgba(0,0,0,.25);}
.medal .disc .ico{width:34px;height:34px;opacity:.25;}
.medal.m1 .disc{background:radial-gradient(circle at 38% 30%,#ffd2a0 0%,#d98a45 40%,#9b5a22 100%);box-shadow:0 0 0 3px #7a4518,0 4px 10px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.5);color:#6a3510;}
.medal.m2 .disc{background:radial-gradient(circle at 38% 30%,#ffffff 0%,#c6cfdb 40%,#8692a3 100%);box-shadow:0 0 0 3px #66707e,0 4px 10px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.7);color:#4a5462;}
.medal.m3 .disc{background:radial-gradient(circle at 38% 30%,#fff6c4 0%,#ffcf3a 40%,#c48a00 100%);box-shadow:0 0 0 3px #8f6400,0 4px 10px rgba(0,0,0,.3),0 0 22px rgba(255,200,40,.6),inset 0 2px 0 rgba(255,255,255,.7);color:#7a5200;}
.medal.m4 .disc{background:radial-gradient(circle at 38% 30%,#ffffff 0%,#d9f4ff 35%,#8fc6e0 70%,#6aa3c4 100%);box-shadow:0 0 0 3px #4d86a6,0 4px 10px rgba(0,0,0,.3),0 0 26px rgba(160,230,255,.8),inset 0 2px 0 #fff;color:#2d6283;}
.medal[class*="m"] .disc .ico{opacity:1;fill:currentColor;filter:drop-shadow(0 1px 0 rgba(255,255,255,.6));}
.medal.m0 .disc .ico{fill:none;}
.medal.shine .disc{animation:fb-medal .7s var(--spring) .45s both;}
@keyframes fb-medal{from{transform:scale(0) rotate(-120deg)}to{transform:none}}
.medal small{font-size:.66rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#a07a3a;white-space:nowrap;}
.nums{flex:1;display:flex;flex-direction:column;gap:6px;text-align:right;}
.nums small{display:block;font-size:.66rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#c0702a;}
.nums b{display:block;font-family:var(--display);font-weight:400;font-size:2rem;line-height:1;color:#fff;-webkit-text-stroke:1.5px #5a3d16;paint-order:stroke fill;text-shadow:0 2px 0 #5a3d16;font-variant-numeric:tabular-nums;}
.nums .new{display:inline-block;margin-right:6px;padding:2px 7px;border-radius:6px;background:#ff5d4a;color:#fff;font-size:.62rem;font-weight:900;letter-spacing:.08em;vertical-align:3px;-webkit-text-stroke:0;text-shadow:none;}
.card .next{margin-top:8px;font-size:.78rem;font-weight:800;color:#a07a3a;text-align:center;}
.acts{width:100%;max-width:300px;margin-top:14px;display:flex;flex-direction:column;gap:8px;animation:fb-up .5s var(--spring) .25s both;}
.acts .row2{display:flex;gap:8px;}
.acts .row2 .btn{flex:1;min-height:42px;padding:0 10px;font-size:.9rem;}
.pausecard{background:rgba(8,14,30,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.pausecard .btn{min-width:200px;margin-top:14px;}
.count{font-family:var(--display);font-size:5rem;color:#fff;-webkit-text-stroke:3px #3a2410;paint-order:stroke fill;text-shadow:0 5px 0 #3a2410;animation:pop .45s var(--spring);}
.hint{flex:none;font-size:.82rem;font-weight:700;color:var(--text-3);text-align:center;}
@media (hover:none),(pointer:coarse){ .hint{display:none;} }
</style>
</head>
<body>
<main id="app">
  <div class="hud">
    <div class="plate gold"><small>Best</small><b id="h-best">0</b></div>
    <div class="plate"><small>Last flight</small><b id="h-last">–</b></div>
    <button class="pbtn" id="btn-pause" type="button" aria-label="Pause"></button>
  </div>
  <div class="cab" id="cab">
    <div class="bezel wood">
      <div class="scr" id="scr">
        <canvas id="cv"></canvas>
        <div class="flash" id="flash"></div>
        <div class="ov" id="ov" hidden></div>
      </div>
    </div>
  </div>
  <div class="hint">Space, Up arrow or click to flap · P to pause</div>
</main>
<script>
(function () {
  'use strict';
  var HI = 'flappy', KEY = 'flappybird', WHO = 'gn_arcade_who';
  var $ = function (id) { return document.getElementById(id); };
  var PI = Math.PI, TAU = PI * 2;

  // ═══ World (logical px; width fixed, height follows the screen) ═════════
  var W = 288, H = 512, GROUND = 72;
  var GRAV = 1250, FLAP = -335, MAXFALL = 540;           // px/s², px/s
  var SPEED = 118, PIPE_W = 52, SPACING = 170, GAP = 112; // px/s, px
  var BIRD_X = 0.3, BR = 11.5;                          // bird x (fraction of W), hit radius
  var MEDALS = [{ at: 10, n: 'Bronze' }, { at: 20, n: 'Silver' }, { at: 30, n: 'Gold' }, { at: 40, n: 'Platinum' }];
  function medalFor(s) { var m = 0; for (var i = 0; i < 4; i++) if (s >= MEDALS[i].at) m = i + 1; return m; }

  // ═══ Sound ══════════════════════════════════════════════════════════════
  var Snd = (function () {
    var ac = null, master = null, nbuf = null;
    function on() { try { return localStorage.getItem('gn_sound') !== '0'; } catch (e) { return true; } }
    function ctx() {
      if (!on()) return null;
      if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ac = new C(); } catch (e) { return null; } master = ac.createGain(); master.gain.value = .6; master.connect(ac.destination); }
      if (ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
      return ac;
    }
    function tone(f, t0, dur, type, vol, f2) {
      var a = ctx(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (t0 || 0);
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .08, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .03);
    }
    function noise(t0, dur, vol, freq, type) {
      var a = ctx(); if (!a) return;
      if (!nbuf) { nbuf = a.createBuffer(1, a.sampleRate, a.sampleRate); var d = nbuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + (t0 || 0);
      s.buffer = nbuf; f.type = type || 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = .8;
      g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
    }
    return {
      unlock: ctx,
      flap: function () { noise(0, .12, .16, 900); tone(380, 0, .08, 'triangle', .04, 620); },
      point: function () { tone(1047, 0, .09, 'square', .035); tone(1568, .08, .22, 'square', .035); },
      hit: function () { noise(0, .18, .35, 300, 'lowpass'); tone(140, 0, .18, 'square', .06, 60); },
      fall: function () { tone(900, .05, .55, 'sine', .07, 180); },
      swoosh: function () { noise(0, .3, .1, 1800); },
      medal: function (m) { var N = [[659, 784], [784, 988], [988, 1319], [1175, 1568, 2093]][m - 1] || [523]; N.forEach(function (f, i) { tone(f, i * .1, .25, 'triangle', .09); }); }
    };
  })();

  // ═══ Canvas fit ═════════════════════════════════════════════════════════
  var cv = $('cv'), g = cv.getContext('2d'), scr = $('scr'), cab = $('cab'), DPR = 1, SC = 1, layers = null;
  function fit() {
    var r = cab.getBoundingClientRect(), aw = r.width - 14, ah = r.height - 14;
    var newH = Math.round(Math.max(430, Math.min(640, W * ah / aw)));
    if (state !== 'play' && state !== 'dead') H = newH;     // never change the world mid-flight
    var s = Math.min(aw / W, ah / H), w = Math.floor(W * s), h = Math.floor(H * s);
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    scr.style.width = w + 'px'; scr.style.height = h + 'px';
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR); SC = cv.width / W;
    buildLayers();
    if (bird && state === 'ready') bird.y = H * .42;
    render();
  }

  // ═══ Scenery (pre-rendered parallax strips) ══════════════════════════════
  var THEMES = {
    day: { sky: ['#4fb4ea', '#8fd6f5', '#d6f3ff'], far: '#a9d9c9', far2: '#8cc7b4', city: '#b9e3ef', cloud: 'rgba(255,255,255,.95)', bush: '#5fbf4a', bush2: '#4aa83a', sun: '#fff6c4', stars: false },
    dusk: { sky: ['#3a3a8c', '#d0739a', '#ffc27a'], far: '#7d5a8f', far2: '#5e4479', city: '#a06b93', cloud: 'rgba(255,214,200,.85)', bush: '#3f8f52', bush2: '#2f7444', sun: '#ffe08a', stars: false },
    night: { sky: ['#0b1636', '#1d3466', '#3b5a8c'], far: '#26406e', far2: '#1c3158', city: '#2e4b7c', cloud: 'rgba(170,190,240,.35)', bush: '#2c6a48', bush2: '#21553a', sun: '#f2f6ff', stars: true }
  };
  var theme = THEMES.day, themeName = 'day';
  var COLORS = [
    { body: ['#fff27a', '#ffcc2e', '#e89a10'], belly: '#fff8d0', wing: '#ffe680', beak: '#ff7a1f' },
    { body: ['#a8e8ff', '#4fb8ff', '#1f7fd1'], belly: '#e8f8ff', wing: '#c8f0ff', beak: '#ffb02e' },
    { body: ['#ffb0a0', '#ff6a55', '#d6362a'], belly: '#ffe6dc', wing: '#ffd0c4', beak: '#ffc23a' }
  ];
  var bc = COLORS[0];
  function mk(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * SC)); c.height = Math.max(1, Math.round(h * SC)); var x = c.getContext('2d'); x.setTransform(SC, 0, 0, SC, 0, 0); return { c: c, x: x }; }
  function rnd(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  function buildLayers() {
    var t = theme, R = rnd(7), base = H - GROUND, L = {};
    // Sky
    var sk = mk(W, H), x = sk.x, gr = x.createLinearGradient(0, 0, 0, base);
    gr.addColorStop(0, t.sky[0]); gr.addColorStop(.6, t.sky[1]); gr.addColorStop(1, t.sky[2]);
    x.fillStyle = gr; x.fillRect(0, 0, W, H);
    if (t.stars) { for (var i = 0; i < 70; i++) { x.fillStyle = 'rgba(255,255,255,' + (.3 + R() * .6) + ')'; var sz = R() < .15 ? 1.6 : 1; x.fillRect(R() * W, R() * base * .7, sz, sz); } }
    var sg = x.createRadialGradient(W * .78, base * .22, 2, W * .78, base * .22, 60); sg.addColorStop(0, t.sun); sg.addColorStop(.3, t.sun); sg.addColorStop(.32, 'rgba(255,255,255,.25)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = sg; x.beginPath(); x.arc(W * .78, base * .22, 60, 0, TAU); x.fill();
    L.sky = sk.c;
    // Far hills + skyline (repeat every 2W)
    var fw = W * 2, far = mk(fw, H), y0 = base - 70;
    x = far.x;
    x.fillStyle = t.city;
    for (var bx = 0; bx < fw;) { var bw = 14 + R() * 22, bh = 18 + R() * 46; x.fillRect(bx, base - 40 - bh, bw, bh + 40); if (R() < .6) { x.fillStyle = 'rgba(255,255,255,.18)'; for (var wy = base - 40 - bh + 5; wy < base - 44; wy += 7) for (var wx = bx + 3; wx < bx + bw - 4; wx += 6) if (R() < .5) x.fillRect(wx, wy, 2.5, 3); x.fillStyle = t.city; } bx += bw + 2 + R() * 6; }
    x.fillStyle = t.far;
    x.beginPath(); x.moveTo(0, base);
    for (var hx = 0; hx <= fw; hx += 8) x.lineTo(hx, y0 + 24 + Math.sin(hx / fw * TAU * 3) * 10 + Math.sin(hx / fw * TAU * 7) * 5);
    x.lineTo(fw, base); x.closePath(); x.fill();
    L.far = far.c;
    // Clouds
    var cl = mk(fw, H); x = cl.x; x.fillStyle = t.cloud;
    for (var k = 0; k < 7; k++) {
      var cx = k * fw / 7 + R() * 30, cy = base - 110 - R() * 70 - (k % 2) * 40, s = .7 + R() * .6;
      [[0, 0, 16], [16, -8, 14], [30, 0, 15], [14, 6, 13], [-12, 4, 10]].forEach(function (p) { x.beginPath(); x.arc(cx + p[0] * s, cy + p[1] * s, p[2] * s, 0, TAU); x.fill(); });
    }
    L.cloud = cl.c;
    // Near bushes
    var bu = mk(fw, H); x = bu.x;
    x.fillStyle = t.bush2; x.beginPath(); x.moveTo(0, base);
    for (var b2 = 0; b2 <= fw; b2 += 12) x.arc(b2, base - 8 - (Math.sin(b2 * .11) + 1) * 6, 14, PI, 0);
    x.lineTo(fw, base); x.fill();
    x.fillStyle = t.bush; x.beginPath(); x.moveTo(0, base);
    for (var b3 = 6; b3 <= fw + 12; b3 += 14) x.arc(b3, base - 2 - (Math.sin(b3 * .07 + 1) + 1) * 4, 11, PI, 0);
    x.lineTo(fw, base); x.fill();
    L.bush = bu.c;
    // Ground tile (repeats every 24px)
    var gw = W + 48, gd = mk(gw, GROUND); x = gd.x;
    var gg = x.createLinearGradient(0, 0, 0, GROUND); gg.addColorStop(0, '#e8d792'); gg.addColorStop(1, '#d2b86a');
    x.fillStyle = gg; x.fillRect(0, 0, gw, GROUND);
    x.fillStyle = '#5a3d16'; x.fillRect(0, 0, gw, 2);
    x.fillStyle = '#8fd34a'; x.fillRect(0, 2, gw, 12);
    x.fillStyle = '#74bd34'; for (var s2 = 0; s2 < gw; s2 += 12) { x.beginPath(); x.moveTo(s2, 14); x.lineTo(s2 + 6, 2); x.lineTo(s2 + 12, 2); x.lineTo(s2 + 6, 14); x.fill(); }
    x.fillStyle = '#b4e070'; x.fillRect(0, 2, gw, 2);
    x.fillStyle = '#5c9a28'; x.fillRect(0, 14, gw, 2);
    x.fillStyle = 'rgba(160,120,50,.25)'; for (var d = 0; d < 26; d++) x.fillRect(R() * gw, 22 + R() * (GROUND - 26), 2 + R() * 3, 2);
    L.ground = gd.c;
    // Pipe body + cap (vertical slices drawn once)
    var pb = mk(PIPE_W, 4), pc = mk(PIPE_W + 6, 24);
    pipeShade(pb.x, 0, 0, PIPE_W, 4);
    pipeShade(pc.x, 0, 0, PIPE_W + 6, 24);
    pc.x.strokeStyle = '#2f5a12'; pc.x.lineWidth = 2; pc.x.strokeRect(1, 1, PIPE_W + 4, 22);
    L.pipe = pb.c; L.cap = pc.c;
    layers = L;
  }
  function pipeShade(x, a, b, w, h) {
    var gr = x.createLinearGradient(0, 0, w, 0);
    gr.addColorStop(0, '#4f8f1f'); gr.addColorStop(.12, '#9be05a'); gr.addColorStop(.3, '#c6f27e'); gr.addColorStop(.45, '#86cf3e'); gr.addColorStop(.85, '#5ea528'); gr.addColorStop(1, '#3e7616');
    x.fillStyle = gr; x.fillRect(0, 0, w, h);
    x.fillStyle = '#2f5a12'; x.fillRect(0, 0, 2, h); x.fillRect(w - 2, 0, 2, h);
  }

  // ═══ State ══════════════════════════════════════════════════════════════
  var state = 'ready', paused = false, countdown = 0, bird = null, pipes = [], score = 0, t = 0, deadT = 0, scroll = 0;
  var who = (function () { try { return localStorage.getItem(WHO) || ''; } catch (e) { return ''; } })();
  var session = { runs: 0, best: 0 }, runStart = 0, lastPipeY = 0, deathCause = '', bestAtStart = 0, lastFlight = null;

      if (m) hl.push('Earned a ' + MEDALS[m - 1].n.toLowerCase() + ' medal');
      if (isBest) hl.push('New personal best' + (oldBest ? ' (old best ' + oldBest + ')' : ''));
      if (session.runs > 1) hl.push('Flight ' + session.runs + ' this sitting, best of the sitting: ' + session.best);
      hl.push('Flying ' + (themeName === 'day' ? 'by day' : themeName === 'dusk' ? 'at sunset' : 'at night'));
      try {
        Kit.record(KEY, {
          started: runStart, mode: m ? MEDALS[m - 1].n + ' medal' : '',
          players: [{ name: who || 'Player', score: score }], winner: null, highlights: hl,
          summary: score + (score === 1 ? ' pipe' : ' pipes') + (m ? ' · ' + MEDALS[m - 1].n : ''), badge: String(score),
          meta: { score: score, medal: m ? MEDALS[m - 1].n : '', cause: deathCause }

      state = 'over'; hud(); overlay();
      if (lastFlight.medal) setTimeout(function () { Snd.medal(lastFlight.medal); }, 450);
      if (isBest) setTimeout(function () { Kit.confetti(); }, 500);

  }

  // ═══ Render ═════════════════════════════════════════════════════════════
  function tile(img, off, y) {
    var w = img.width, x = -((off * SC) % w);
    g.drawImage(img, Math.round(x), y); g.drawImage(img, Math.round(x + w), y);
    if (x + 2 * w < cv.width) g.drawImage(img, Math.round(x + 2 * w), y);
  }
  function render() {
    if (!layers) return;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(layers.sky, 0, 0);
    tile(layers.cloud, scroll * .12, 0);
    tile(layers.far, scroll * .25, 0);
    tile(layers.bush, scroll * .55, 0);
    g.setTransform(SC, 0, 0, SC, 0, 0);
    pipes.forEach(drawPipe);
    g.setTransform(1, 0, 0, 1, 0, 0);
    var gy = Math.round((H - GROUND) * SC), off = (scroll % 12) * SC;
    g.drawImage(layers.ground, -Math.round(off), gy);
    g.setTransform(SC, 0, 0, SC, 0, 0);
    if (bird) drawBird();
    if (state === 'play' || (state === 'dead' && !cardShown)) bigScore(score);
  }
  function drawPipe(p) {
    var top = p.y - GAP / 2, bot = p.y + GAP / 2, x = Math.round(p.x * SC) / SC;
    g.drawImage(layers.pipe, x, -2, PIPE_W, top - 22);
    g.drawImage(layers.cap, x - 3, top - 24, PIPE_W + 6, 24);
    g.drawImage(layers.pipe, x, bot + 22, PIPE_W, H - GROUND - bot - 20);
    g.drawImage(layers.cap, x - 3, bot, PIPE_W + 6, 24);

  }
  function drawBird() {

    g.fillStyle = bc.body[2]; g.beginPath(); g.moveTo(-12, -2); g.lineTo(-19, -7); g.lineTo(-18, 1); g.lineTo(-19, 6); g.lineTo(-11, 4); g.closePath(); g.fill();

    g.restore();

    g.fillStyle = '#1b1530'; g.beginPath(); g.ellipse(9, -4.4, 2.4, 3, 0, 0, TAU); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(9.8, -5.6, .9, 0, TAU); g.fill();

    g.beginPath(); g.moveTo(9.5, 3.2); g.quadraticCurveTo(17, 4, 17, 6.4); g.quadraticCurveTo(13, 7.4, 9, 5.6); g.closePath(); g.fill(); g.stroke();

  }
  function bigScore(n) {
    g.font = '400 46px "Lilita One", system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineJoin = 'round'; g.lineWidth = 8; g.strokeStyle = '#3a2410'; g.strokeText(n, W / 2, 58);

  }

  // ═══ Overlays ═══════════════════════════════════════════════════════════
  var PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>';
  var PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  function whoBtn() {
    return '<button class="who" type="button" id="ov-who"><span class="avatar sm" style="--c:var(--surface-3)">' + Kit.esc((who || '?').charAt(0).toUpperCase()) + '</span><span>' + Kit.esc(who || 'Who is flying?') + '</span>' + Kit.icon('down') + '</button>';
  }
  function overlay() {
    $('btn-pause').innerHTML = paused ? PLAY_SVG : PAUSE_SVG;
    $('btn-pause').style.visibility = state === 'play' ? 'visible' : 'hidden';
    var ov = $('ov'), h = '', cls = 'ov';
    if (state === 'ready') {
      cls += ' ready';
      h = '<h2 class="gold">Get ready</h2><div class="mid"><div class="tapme">' + Kit.icon('hand') + '</div><div class="tip">Tap to flap</div></div>' + whoBtn();
    } else if (state === 'play' && paused) {
      cls += ' pausecard';
      h = '<h2>Paused</h2><button class="btn btn-primary btn-lg" type="button" id="ov-resume">' + Kit.icon('play') + 'Keep flying</button>';
    } else if (state === 'play' && countdown) {
      h = '<div class="count">' + Math.ceil(countdown / .6) + '</div>';
    } else if (state === 'over' && lastFlight) {
      var r = lastFlight, m = r.medal, nx = MEDALS[m];
      cls += ' sc-wrap';
      h = '<h2 class="red">Game over</h2>' +
        '<div class="card"><div class="top"><div class="medal m' + m + (m ? ' shine' : '') + '"><div class="disc">' + Kit.icon('star') + '</div><small>' + (m ? MEDALS[m - 1].n : 'No medal') + '</small></div>' +
        '<div class="nums"><div><small>Score</small><b id="cnt">0</b></div><div><small>Best</small><b>' + (r.isBest ? '<span class="new">New</span>' : '') + Math.max(best(), r.score) + '</b></div></div></div>' +
        (nx ? '<div class="next">' + (nx.at - r.score) + ' more for ' + nx.n.toLowerCase() + '</div>' : '<div class="next">Top medal. Amazing flying!</div>') + '</div>' +

        '<div class="row2"><button class="btn btn-soft" type="button" id="ov-hi">' + Kit.icon('trophy') + 'Scores</button><button class="btn btn-soft" type="button" id="ov-past">' + Kit.icon('history') + 'Past flights</button></div></div>';
    }

    if (!h) { ov.hidden = true; ov.innerHTML = ''; return; }

    bind('ov-who', function () { Kit.pickName(function (n) { who = n; try { localStorage.setItem(WHO, n); } catch (e) {} overlay(); }, { title: 'Who is flying?' }); });
    bind('ov-resume', function () { resume(); });
    bind('ov-again', function () { Snd.swoosh(); toReady(); });
    bind('ov-hi', function () { ArcadeHi.show(HI, 'Flappy Bird'); });

  // ═══ Input ══════════════════════════════════════════════════════════════

  $('app').addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

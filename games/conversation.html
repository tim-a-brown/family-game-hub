body{background:radial-gradient(ellipse at 50% 0%,#0a0a1a 0%,#0d1117 70%);}
.wrap{max-width:480px;margin:0 auto;padding:0 12px 60px;}
/* Category pills */
.cat-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
.cat-btn{padding:7px 13px;border-radius:20px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--muted);font-size:.75rem;font-weight:700;cursor:pointer;transition:all .15s;touch-action:manipulation;}
.cat-btn.active{color:#fff;}
.cat-btn.all.active{border-color:var(--gold);background:rgba(245,200,66,.12);color:var(--gold);}
/* Card */
.cs-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px 22px;margin-bottom:14px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;cursor:pointer;}
.cs-card::before{content:'';position:absolute;inset:0;background:var(--card-grad,linear-gradient(135deg,rgba(90,200,250,.06),rgba(168,85,247,.06)));border-radius:20px;}
.cs-cat-label{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;margin-bottom:12px;opacity:.7;position:relative;}
.cs-question{font-family:var(--serif);font-size:clamp(1.05rem,4vw,1.35rem);font-weight:700;line-height:1.45;color:#fff;position:relative;}
/* Depth badge */
.cs-depth{position:absolute;top:14px;right:14px;font-size:.6rem;font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.08em;}
.depth-light{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.25);}
.depth-medium{background:rgba(245,200,66,.12);color:var(--gold);border:1px solid rgba(245,200,66,.22);}
.depth-deep{background:rgba(168,85,247,.12);color:#a855f7;border:1px solid rgba(168,85,247,.22);}
/* Controls */
.cs-controls{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;}
/* Stats */
.cs-stats{text-align:center;font-size:.72rem;color:var(--muted);margin-bottom:14px;}
/* Swipe hint */
.cs-hint{text-align:center;font-size:.68rem;color:rgba(255,255,255,.2);margin-top:6px;}
/* Animate */
@keyframes cs-in{0%{opacity:0;transform:translateY(18px) scale(.97);}100%{opacity:1;transform:translateY(0) scale(1);}}
.cs-card.animating{animation:cs-in .22s ease;}
/* Depth filter */
.depth-row{display:flex;gap:6px;justify-content:center;margin-bottom:10px;}
.depth-btn{padding:5px 11px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--muted);font-size:.7rem;font-weight:700;cursor:pointer;transition:all .15s;}
.depth-btn.active{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);}
</style>

  const catRow=document.getElementById('cat-row');
  const allBtn=document.createElement('button');
  allBtn.className='cat-btn all active';allBtn.textContent='✨ All';allBtn.style.borderColor='var(--gold)';allBtn.style.background='rgba(245,200,66,.12)';allBtn.style.color='var(--gold)';
  allBtn.addEventListener('click',()=>setCat('All'));
  catRow.appendChild(allBtn);
  CAT_NAMES.forEach(name=>{
    const btn=document.createElement('button');
    btn.className='cat-btn';btn.textContent=name;
    btn.style.setProperty('--c',CATEGORIES[name].color);
    btn.addEventListener('click',()=>setCat(name));
    catRow.appendChild(btn);
  });
  // Depth filter
  const dr=document.getElementById('depth-row');
  [{k:'all',l:'All Depths'},{k:'light',l:'😄 Lighthearted'},{k:'medium',l:'💛 Thoughtful'},{k:'deep',l:'🌙 Deep'}].forEach(({k,l})=>{
    const btn=document.createElement('button');
    btn.className='depth-btn'+(k==='all'?' active':'');btn.textContent=l;btn.dataset.k=k;
    btn.addEventListener('click',()=>{
      depthFilter=k;
      document.querySelectorAll('.depth-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      buildPool();showCard();
    });
    dr.appendChild(btn);
  });
}

function setCat(name){
  activeCat=name;
  document.querySelectorAll('.cat-btn').forEach(b=>{
    b.classList.remove('active');
    b.style.borderColor='';b.style.background='';b.style.color='';
  });
  const all=document.querySelectorAll('.cat-btn');
  if(name==='All'){
    all[0].classList.add('active');
    all[0].style.borderColor='var(--gold)';all[0].style.background='rgba(245,200,66,.12)';all[0].style.color='var(--gold)';
  } else {
    all.forEach(b=>{
      if(b.textContent===name){
        b.classList.add('active');
        const c=CATEGORIES[name].color;
        b.style.borderColor=c;b.style.background=`rgba(${hexToRgb(c)},.12)`;b.style.color=c;
      }
    });
  }
  buildPool();showCard();
}

function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`${r},${g},${b}`;}

function buildPool(){
  pool=[];
  const cats=activeCat==='All'?CAT_NAMES:[activeCat];
  cats.forEach(cat=>{
    CATEGORIES[cat].questions.forEach(q=>{
      if(depthFilter==='all'||q.d===depthFilter)
        pool.push({...q,cat});
    });
  });
  // Shuffle
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  idx=0;history=[];
}

function showCard(animate=true){
  if(!pool.length){
    document.getElementById('cs-question').textContent='No questions match that filter. Try a different depth!';
    document.getElementById('cs-cat-label').textContent='';
    document.getElementById('cs-depth-badge').textContent='';
    document.getElementById('cs-stats').textContent='';
    return;
  }
  const item=pool[idx];
  const catInfo=CATEGORIES[item.cat];
  const card=document.getElementById('cs-card');
  card.style.setProperty('--card-grad',catInfo.grad);
  if(animate){card.classList.remove('animating');void card.offsetWidth;card.classList.add('animating');}
  document.getElementById('cs-cat-label').textContent=item.cat;
  document.getElementById('cs-cat-label').style.color=catInfo.color;
  document.getElementById('cs-question').textContent=item.q;
  const badge=document.getElementById('cs-depth-badge');
  badge.textContent=DEPTH_LABELS[item.d];
  badge.className='cs-depth '+DEPTH_CLASSES[item.d];
  document.getElementById('cs-stats').textContent=`${idx+1} of ${pool.length} questions`;
}

function nextCard(){
  if(!pool.length)return;
  history.push(idx);
  idx=(idx+1)%pool.length;
  showCard();
}

function prevCard(){
  if(history.length){idx=history.pop();showCard();}
}

function shufflePool(){buildPool();showCard();}

document.getElementById('next-btn').addEventListener('click',nextCard);
document.getElementById('prev-btn').addEventListener('click',prevCard);
document.getElementById('shuffle-btn').addEventListener('click',shufflePool);

// Swipe support
let tx=0;
document.getElementById('cs-card').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('cs-card').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40){if(dx<0)nextCard();else prevCard();}
},{passive:true});

buildUI();buildPool();showCard(false);
</script>
</body>
</html>

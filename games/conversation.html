<style>
.stage{padding-bottom:calc(var(--dock-h,calc(var(--safe-b) + 84px)) + 16px);}
/* Category chips */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:2px 16px 4px;}
.cats::-webkit-scrollbar{display:none;}
.cats .chip{min-height:40px;padding:0 13px;font-size:.9rem;}
.cats .chip .ico{width:16px;height:16px;}
.cats .chip.on{background:var(--cc,var(--text));color:#16102e;}
@media (min-width:900px){.cats{flex-wrap:wrap;justify-content:center;overflow:visible;margin:0 0 10px;padding:0;}}
/* Touch landscape (iPad): wrapped chip rows would push the table under the dock, so keep one swipeable row */
@media (min-width:900px) and (orientation:landscape) and (max-height:900px) and (pointer:coarse){
  .cats{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;margin:0 -16px 8px;padding:2px 16px 4px;}
  .cats .chip{flex:none;}
}

/* Table */
.table{border-radius:24px;padding:8px;}
.table .felt-in{position:relative;border-radius:18px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;}
.tl{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:330px;margin-bottom:10px;font-weight:800;font-size:.85rem;color:rgba(255,255,255,.7);}
.tl .ico{width:15px;height:15px;}
.tl span{display:inline-flex;align-items:center;gap:5px;}

/* The deck and the drawn card */
.deckwrap{position:relative;width:min(80vw,330px);height:clamp(270px,calc(100dvh - 440px - var(--tx,0px)),430px);}
.has-timer .deckwrap{--tx:56px;}
.pile{position:absolute;inset:0;}
.pile i{position:absolute;inset:0;border-radius:20px;transform:translate(calc(var(--k) * 2px),calc(var(--k) * 3px));
  background:linear-gradient(135deg,#0e6b52,#0a4d3b);box-shadow:inset 0 0 0 1px var(--w12),0 2px 3px rgba(0,0,0,.35);}
.ccard{position:absolute;inset:0;perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y;}
.ccard .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s var(--ease);}
.ccard.down .in{transform:rotateY(180deg);}
.ccard .face,.ccard .back{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;}
.ccard .back{transform:rotateY(180deg);display:grid;place-items:center;
  background:
    radial-gradient(circle at 50% 50%,var(--w14) 0 22%,transparent 23%),
    repeating-linear-gradient(45deg,var(--w07) 0 4px,transparent 4px 11px),
    repeating-linear-gradient(-45deg,var(--w07) 0 4px,transparent 4px 11px),
    linear-gradient(135deg,#13a07a,#0b5f48);
  box-shadow:inset 0 0 0 8px #f7f1e3,inset 0 0 0 10px rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.45);}
.ccard .back b{font-family:var(--display);font-weight:400;font-size:1.6rem;color:#f7f1e3;text-align:center;line-height:1.05;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.25);}
.ccard .face{display:flex;flex-direction:column;color:#24203a;
  background:linear-gradient(165deg,#fffdf7 0%,#faf4e6 60%,#f2e9d4 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 0 0 1px rgba(0,0,0,.06),0 16px 30px rgba(0,0,0,.45);}
.ccard .band{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;background:var(--cc);color:#fff;font-weight:900;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;}
.ccard .band .ico{width:18px;height:18px;}
.ccard .band .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ccard .star{display:grid;place-items:center;width:44px;height:44px;margin:-10px -10px -10px 0;border:0;border-radius:50%;background:transparent;color:rgba(255,255,255,.8);}
.ccard .star .ico{width:24px;height:24px;}
.ccard .star.on{color:#ffd54a;}
.ccard .star.on .ico{fill:currentColor;}
.ccard .star.on.pop{animation:bounce .5s var(--spring);}
.ccard .q{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 20px;
  font-family:var(--display);font-weight:400;font-size:clamp(1.35rem,6.4vw,1.85rem);line-height:1.2;letter-spacing:.01em;color:#2a2440;text-wrap:balance;}
.ccard .foot{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9a917a;}
.ccard .depth{display:inline-flex;gap:4px;align-items:center;}
.ccard .depth i{width:8px;height:8px;border-radius:50%;background:#d8cfb8;}
.ccard .depth i.on{background:var(--cc);}
.ccard.out{animation:card-out .38s cubic-bezier(.5,0,.75,0) forwards;}
@keyframes card-out{to{transform:translate(-115%,-6%) rotate(-14deg);opacity:0;}}
.ccard.lift .in{animation:lift .32s var(--ease);}
@keyframes lift{from{transform:rotateY(180deg) translateY(10px);}}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;border-radius:20px;border:2px dashed var(--w2);color:rgba(255,255,255,.7);font-weight:800;}

/* Who answers */
.who{width:100%;max-width:340px;margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.who .ring{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;}
.who .pp{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 5px;border-radius:999px;background:rgba(0,0,0,.22);color:rgba(255,255,255,.75);font-weight:800;font-size:.92rem;
  border:2px solid transparent;transition:transform .12s, background .12s, border-color .12s;}
.who .pp .avatar{width:28px;height:28px;font-size:.8rem;}
.who .pp.hot{background:color-mix(in srgb,var(--c) 35%,rgba(0,0,0,.2));border-color:var(--c);color:#fff;transform:scale(1.06);}
.who .pp.pick{background:var(--c);color:#16102e;border-color:#fff;transform:scale(1.1);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 6px 14px rgba(0,0,0,.35);}
.who .pp.pick .avatar{background:#fff !important;}
.who .say{font-family:var(--display);font-size:1.35rem;color:#fff;min-height:1.6rem;text-align:center;}
.who .say.dim{font-family:var(--font);font-size:.95rem;font-weight:800;color:rgba(255,255,255,.6);}

/* Timer */
.timer{display:flex;align-items:center;gap:10px;}
.timer > svg{width:44px;height:44px;transform:rotate(-90deg);}
.timer circle{fill:none;stroke-width:5;}
.timer .bg{stroke:var(--w15);}
.timer .fg{stroke:var(--yellow);stroke-linecap:round;transition:stroke-dashoffset .25s linear;}
.timer .t{font-weight:900;font-size:1.25rem;font-variant-numeric:tabular-nums;min-width:52px;color:#fff;}
.timer.done .fg{stroke:var(--red);}
.timer .btn{min-height:42px;}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:14px 16px calc(var(--safe-b) + 14px);background:linear-gradient(180deg,rgba(20,16,41,0),rgba(20,16,41,.94) 28%);}
.dock-in{max-width:588px;margin:0 auto;display:flex;gap:10px;}
.dock .btn{min-height:54px;}
.dock .draw{flex:1;}
.dock .sq{flex:0 0 auto;width:58px;padding:0;}

/* Session summary in history */
.cv-list{display:flex;flex-direction:column;gap:6px;}
.cv-list div{padding:8px 10px;border-radius:10px;background:var(--w04);font-size:.88rem;font-weight:700;color:var(--text-2);}
.cv-list b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:2px;}
.cv-list .ico{width:13px;height:13px;color:var(--yellow);fill:currentColor;vertical-align:-2px;margin-right:3px;}
/* Tablet portrait: a bigger card */
@media (min-width:700px) and (min-height:900px){
  .stage{max-width:700px;}
  .dock-in{max-width:668px;}
  .dock .btn{min-height:60px;font-size:1.1rem;}
  .dock .sq{width:64px;}
  .cats .chip{min-height:46px;font-size:1rem;padding:0 16px;}
  .tl{max-width:440px;font-size:.95rem;}
  .deckwrap{width:440px;height:clamp(300px,calc(100dvh - 560px - var(--tx,0px)),600px);}
  .ccard .q{font-size:2.3rem;padding:18px 28px;}
  .ccard .band{font-size:.92rem;padding:16px 20px 14px;}
  .ccard .back b{font-size:2.1rem;}
  .who{max-width:460px;}
  .who .pp{min-height:46px;font-size:1rem;}
  .who .pp .avatar{width:34px;height:34px;}
  .who .say{font-size:1.6rem;}
}
</style>

    var t = el('span', { class: 't', text: fmt(total) });
    var b = el('button', { type: 'button', class: 'btn btn-soft btn-sm', html: Kit.icon('play') + '<span>Start</span>' });
    wrap.appendChild(t); wrap.appendChild(b);
    var fg = wrap.querySelector('.fg');
    function paint(left) { t.textContent = fmt(left); fg.setAttribute('stroke-dashoffset', String(C * (1 - left / total))); }
    b.addEventListener('click', function () {
      if (tState.id) { stopTimer(); b.innerHTML = Kit.icon('play') + '<span>Start</span>'; return; }
      if (tState.left <= 0 || wrap.classList.contains('done')) { tState.left = total; wrap.classList.remove('done'); }
      Kit.sfx('tap');
      b.innerHTML = '<span>Pause</span>';
      tState.id = setInterval(function () {
        tState.left--; paint(tState.left);
        if (tState.left <= 5 && tState.left > 0) Kit.sfx('tick');
        if (tState.left <= 0) {
          stopTimer(); wrap.classList.add('done'); b.innerHTML = Kit.icon('undo') + '<span>Again</span>';
          Kit.sfx('bad'); Kit.haptic('heavy'); Kit.toast("Time's up!");
        }
      }, 1000);
    });
    tState.left = total;
    return wrap;
  }
  function fmt(s) { s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

  function renderDock() {
    dockIn.innerHTML = '';
    if (!dock.parentNode) document.body.appendChild(dock);
    var empty = !S.deck.length;
    dockIn.appendChild(el('button', { type: 'button', class: 'btn btn-soft sq', 'aria-label': 'Back one card', html: Kit.icon('undo'), disabled: undoStack.length ? null : true, onclick: undo }));
    dockIn.appendChild(el('button', { type: 'button', class: 'btn btn-primary draw', html: Kit.icon('cards') + '<span>' + (empty ? 'Pile is empty' : S.cur ? 'Next card' : 'Draw a card') + '</span>', disabled: empty ? true : null, onclick: draw }));
    dockIn.appendChild(el('button', { type: 'button', class: 'btn btn-soft sq', 'aria-label': 'Finish and save', html: Kit.icon('check'), onclick: function () { endSession(false); } }));
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  function pickAnswerer() {
    var n = S.players.length;
    if (S.who === 'all' || n < 2) return null;
    if (S.who === 'turns') { var t = S.turn % n; S.turn++; return t; }
    // Spin: never the same person twice, and favor people who've answered less
    var last = S.answerer, min = Infinity;
    S.players.forEach(function (p, i) { if (i !== last) min = Math.min(min, p.n); });
    var pool = [];
    S.players.forEach(function (p, i) { if (i === last) return; pool.push(i); if (p.n === min) pool.push(i, i); });
    return pool[Math.floor(Math.random() * pool.length)];
  }
  var busy = false;
  function draw() {
    if (!S || busy) return;
    if (!S.deck.length) { Kit.toast(S.cat === 'star' ? 'No more starred cards' : 'This pile is empty'); return; }
    snapshot();
    stopTimer(); clearTimeout(spinTimer);
    var id = S.deck.shift();
    S.cur = id; S.answerer = pickAnswerer();
    if (S.answerer != null) S.players[S.answerer].n++;
    else S.players.forEach(function (p) { p.n++; });
    S.drawn.push({ id: id, who: S.answerer, star: isFav(BYID[id]) });
    save();
    var old = cardEl;
    busy = true;
    function show() { busy = false; render({ flip: true, spin: S.answerer != null && S.who === 'spin' }); Kit.sfx('flip'); Kit.haptic('light'); }
    if (old && old.parentNode && !old.classList.contains('down')) { old.classList.add('out'); Kit.sfx('whoosh'); setTimeout(show, 300); }
    else show();
  }
  function setCat(id) {
    if (S.cat === id) return;
    snapshot();
    S.cat = id; buildDeck(); S.cur = null; stopTimer();
    save(); Kit.sfx('deal'); Kit.haptic('light'); render();
  }

  // ── Finish: save the talk to history ─────────────────────────────────────
  function endSession(thenSetup) {
    if (!S) { showSetup(); return; }
    if (!S.drawn.length) { clearSave(); undoStack = []; showSetup(); return; }
    var go = function () {
      stopTimer(); clearTimeout(spinTimer);
      var f = favs(), P = S.players, D = S.drawn;
      D.forEach(function (d) { d.star = f.indexOf(BYID[d.id].q) >= 0; });
      var hl = [];
      var seenQ = {};
      D.filter(function (d) { if (!d.star || seenQ[d.id]) return false; seenQ[d.id] = 1; return true; }).slice(0, 3).forEach(function (d) {
        hl.push('Starred: "' + BYID[d.id].q + '"' + (d.who != null && P[d.who] ? ' (' + P[d.who].name + ')' : ''));
      });
      var byCat = {}; D.forEach(function (d) { var c = BYID[d.id].c; byCat[c] = (byCat[c] || 0) + 1; });
      var topCat = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; })[0];
      if (topCat && D.length >= 3) hl.push('Most talked about: ' + CAT[topCat].name + ' (' + byCat[topCat] + ' cards)');
      var deep = D.filter(function (d) { return BYID[d.id].d === 'd'; }).length;
      if (deep >= 2) hl.push(deep + ' deep questions');
      if (!hl.length || hl.length < 2) {
        var first = D[0]; hl.push('First card: "' + BYID[first.id].q + '"');
      }
      var mins = Math.round((Date.now() - S.started) / 60000);
      Kit.record(KEY, {
        started: S.started, mode: Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; }).slice(0, 2).map(function (c) { return CAT[c].name; }).join(', '),
        players: P.length > 1 ? P.map(function (p) { return { name: p.name, score: S.who === 'all' ? undefined : p.n }; }) : P.map(function (p) { return { name: p.name }; }),
        winner: null,
        summary: D.length + (D.length === 1 ? ' card' : ' cards') + ' talked about',
        badge: String(D.length),
        highlights: hl,
        meta: { cards: D.slice(0, 60).map(function (d) { return { q: BYID[d.id].q, c: BYID[d.id].c, who: d.who != null && P[d.who] ? P[d.who].name : '', star: !!d.star }; }) }
      });
      var stars = D.filter(function (d) { return d.star; }).length;
      var again = { players: P.map(function (p) { return { name: p.name, color: p.color }; }), options: { who: S.who, timer: S.timer, depth: S.depth } };
      clearSave(); undoStack = [];
      Kit.win({
        icon: 'party', title: 'Great talk!',
        sub: D.length + (D.length === 1 ? ' card' : ' cards') + (mins >= 1 ? ' in ' + mins + ' min' : '') + (stars ? ' · ' + stars + ' starred' : ''),
        rank: S.who === 'all' || P.length < 2 ? null : P.map(function (p) { return { name: p.name, score: p.n + (p.n === 1 ? ' answer' : ' answers'), color: p.color }; }),
        againLabel: 'Keep talking', again: function () { start(again); },
        extra: [{ label: 'Change who is playing', onClick: showSetup }]
      });
      S = null; dock.remove();
    };
    if (thenSetup) { go(); return; }
    Kit.confirm('Finish this talk?', { ok: 'Finish and save', body: S.drawn.length + ' cards will be saved in Past talks.' }).then(function (ok) { if (ok) go(); });
  }

  function histExtra(e) {
    if (!e || !Array.isArray(e.cards) || !e.cards.length) return null;
    var box = el('div', { class: 'cv-list' });
    e.cards.slice(0, 30).forEach(function (c) {
      var cat = CAT[c.c];
      box.appendChild(el('div', { html: '<b>' + (c.star ? Kit.icon('star') : '') + esc(cat ? cat.name : '') + (c.who ? ' · ' + esc(c.who) : '') + '</b>' + esc(c.q) }));
    });
    return box;
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  var saved = lsGet(SAVE, null);
  if (saved && saved.players && Array.isArray(saved.deck) && Array.isArray(saved.drawn)) {
    S = saved;
    if (S.cur && !BYID[S.cur]) S.cur = null;
    S.deck = S.deck.filter(function (id) { return BYID[id]; });
    render();
  } else showSetup();
})();
</script>
</body>

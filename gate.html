<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="/manifest.json">
<title>Game Night — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared.css">
<script src="./sync.js"></script>
<style>
  :root{
    --bg:#0b0d12; --surface:#12151c; --surface-2:#191d26; --surface-3:#222734;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
    --text:#f2f4f8; --text-2:#a2abbb; --text-3:#6b7486;
    --gold:#f5c842; --gold2:#f0a500; --gold-ink:#1a1405; --bad:#f87171;
    --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
    --font:'Inter',system-ui,-apple-system,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  html{background:var(--bg);}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(800px 480px at 80% -10%, rgba(245,200,66,.14), transparent 60%),
      radial-gradient(700px 520px at -10% 110%, rgba(99,102,241,.16), transparent 60%),
      var(--bg);
    -webkit-user-select:none;user-select:none;
  }
  .shell{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;}

  .mark{
    width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:2rem;
    background:linear-gradient(140deg,var(--gold),var(--gold2));
    box-shadow:0 14px 36px rgba(245,170,0,.32), inset 0 1px 0 rgba(255,255,255,.45);
    margin-bottom:18px;
  }
  h1{font-family:var(--display);font-weight:800;font-size:2.1rem;letter-spacing:-.03em;line-height:1;}
  .sub{color:var(--text-2);font-size:.92rem;margin:10px 0 28px;text-align:center;line-height:1.45;}

  /* PIN slots */
  .slots{display:flex;gap:12px;margin-bottom:10px;}
  .slot{
    width:56px;height:64px;border-radius:18px;display:grid;place-items:center;
    background:var(--surface);border:1.5px solid var(--line-2);
    font-family:var(--display);font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;
    transition:border-color .15s,background .15s,transform .15s var(--ease);
  }
  .slot.filled{border-color:rgba(245,200,66,.55);background:rgba(245,200,66,.08);color:var(--gold);}
  .slot.filled{animation:pop .18s var(--ease);}
  @keyframes pop{0%{transform:scale(.88);}100%{transform:scale(1);}}
  .slot.cursor{border-color:var(--text-2);}
  .slot.cursor::after{content:'';width:2px;height:26px;border-radius:1px;background:var(--gold);animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .slots.shake{animation:shake .4s;}
  .slots.shake .slot{border-color:rgba(248,113,113,.6);background:rgba(248,113,113,.08);color:#fecaca;}
  @keyframes shake{0%,100%{transform:none;}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
  .slots.busy .slot{animation:wave 1s ease-in-out infinite;}
  .slots.busy .slot:nth-child(2){animation-delay:.1s;}
  .slots.busy .slot:nth-child(3){animation-delay:.2s;}
  .slots.busy .slot:nth-child(4){animation-delay:.3s;}
  @keyframes wave{0%,100%{transform:none;}50%{transform:translateY(-5px);}}

  .status{min-height:20px;font-size:.84rem;margin-bottom:14px;text-align:center;color:var(--text-2);}
  .status.err{color:#fca5a5;}

  /* Keypad */
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;}
  .key{
    all:unset;cursor:pointer;box-sizing:border-box;
    height:64px;border-radius:20px;display:grid;place-items:center;
    background:var(--surface);border:1px solid var(--line);
    font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--text);
    transition:background .12s,transform .08s;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .key:hover{background:var(--surface-2);}
  .key:active,.key.pressed{background:var(--surface-3);transform:scale(.95);}
  .key.ghost{background:transparent;border-color:transparent;font-family:var(--font);font-size:.9rem;font-weight:600;color:var(--text-2);}
  .key.ghost:active{background:var(--surface);}
  .key[disabled]{opacity:.4;pointer-events:none;}

  .guest{
    all:unset;cursor:pointer;margin-top:26px;
    display:inline-flex;align-items:center;gap:8px;
    padding:12px 20px;border-radius:999px;border:1px solid var(--line-2);
    color:var(--text);font-weight:600;font-size:.92rem;background:rgba(255,255,255,.03);
  }
  .guest:hover{background:rgba(255,255,255,.07);}
  .hint{color:var(--text-3);font-size:.76rem;margin-top:14px;text-align:center;line-height:1.5;max-width:300px;}

  /* Name sheet */
  .sheet-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .sheet-overlay.show{opacity:1;pointer-events:auto;}
  .sheet{
    width:100%;max-width:480px;background:var(--surface);border:1px solid var(--line-2);border-bottom:0;
    border-radius:28px 28px 0 0;padding:10px 22px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(30px);transition:transform .3s var(--ease);
    -webkit-user-select:text;user-select:text;
  }
  .sheet-overlay.show .sheet{transform:none;}
  @media(min-width:600px){.sheet-overlay{align-items:center;}.sheet{border-radius:26px;border-bottom:1px solid var(--line-2);}}
  .grabber{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 18px;}
  .sheet-badge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--gold);background:rgba(245,200,66,.12);border:1px solid rgba(245,200,66,.3);padding:4px 10px;border-radius:999px;margin-bottom:12px;}
  .sheet h2{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin-bottom:6px;}
  .sheet p{color:var(--text-2);font-size:.88rem;line-height:1.5;margin-bottom:18px;}
  .label-input{
    width:100%;height:54px;border-radius:16px;padding:0 16px;
    background:var(--surface-2);border:1.5px solid var(--line-2);color:var(--text);
    outline:none;margin-bottom:14px;transition:border-color .15s,box-shadow .15s;
  }
  .label-input:focus{border-color:rgba(245,200,66,.6);box-shadow:0 0 0 4px rgba(245,200,66,.12);}
  .label-input::placeholder{color:var(--text-3);}
  .label-go{
    all:unset;cursor:pointer;box-sizing:border-box;display:block;width:100%;text-align:center;
    height:54px;line-height:54px;border-radius:16px;font-weight:700;font-size:1rem;
    background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink);
    box-shadow:0 10px 24px rgba(245,170,0,.22);
  }
  .label-skip{all:unset;cursor:pointer;display:block;margin:12px auto 0;color:var(--text-2);font-size:.88rem;font-weight:600;padding:8px 16px;}

  @media (max-height:640px){
    .mark{width:48px;height:48px;font-size:1.5rem;border-radius:16px;margin-bottom:12px;}
    h1{font-size:1.7rem;} .sub{margin:8px 0 18px;}
    .key{height:56px;} .guest{margin-top:16px;}
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
</style>
</head>
<body>
<main class="shell">
  <div class="mark" aria-hidden="true">🎲</div>
  <h1>Game Night</h1>
  <p class="sub">Enter your family PIN to sync scores<br>across every device.</p>

  <div class="slots" id="slots" aria-live="polite" aria-label="PIN">
    <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
  </div>
  <div class="status" id="status" role="status"></div>

  <div class="keypad" id="keypad">
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key ghost" data-k="clear">Clear</button>
    <button class="key" data-k="0">0</button>
    <button class="key ghost" data-k="back" aria-label="Delete">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z"/><path d="m17 9-5 6M12 9l5 6"/></svg>
    </button>
  </div>

  <button class="guest" id="guest">Continue as guest <span aria-hidden="true">→</span></button>
  <p class="hint">Guest mode keeps scores on this device only. A new PIN creates a new shared space.</p>
</main>

<!-- Name sheet (shown only for NEW PINs) -->
<div class="sheet-overlay" id="labelOverlay" role="dialog" aria-modal="true" aria-labelledby="labelTitle">
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-badge">✨ New PIN created</div>
    <h2 id="labelTitle">Name this space</h2>
    <p>This shows at the top of the home screen on every device that uses this PIN. You can change it later.</p>
    <input class="label-input" id="labelInput" type="text" maxlength="24" placeholder="e.g. Brown Family" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <button class="label-go" id="labelGo">Save &amp; continue</button>
    <button class="label-skip" id="labelSkip">Skip for now</button>
  </div>
</div>

<script>
(function(){
  // If already signed in, skip straight to hub
  var m = FGHSync.mode();
  if(m === 'pin' || m === 'guest'){ location.replace('./index.html'); return; }

  var _pin = '';
  var busy = false;
  var slotsEl = document.getElementById('slots');
  var slots   = slotsEl.querySelectorAll('.slot');
  var status  = document.getElementById('status');
  var keys    = document.querySelectorAll('.key');

  function render(){
    for(var i=0;i<4;i++){
      var had = slots[i].classList.contains('filled');
      slots[i].textContent = _pin[i] || '';
      slots[i].classList.toggle('filled', !!_pin[i]);
      if(!had && _pin[i]){ slots[i].style.animation='none'; slots[i].offsetWidth; slots[i].style.animation=''; }
      slots[i].classList.toggle('cursor', !busy && i === _pin.length);
    }
  }
  function setStatus(msg, isErr){ status.textContent = msg || ''; status.classList.toggle('err', !!isErr); }
  function setBusy(b){
    busy = b;
    slotsEl.classList.toggle('busy', b);
    keys.forEach(function(k){ k.disabled = b; });
    render();
  }
  function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  function press(k){
    if(busy) return;
    if(status.classList.contains('err')) setStatus('');
    if(k === 'clear'){ _pin = ''; }
    else if(k === 'back'){ _pin = _pin.slice(0,-1); }
    else if(/^[0-9]$/.test(k) && _pin.length < 4){ _pin += k; buzz(8); }
    render();
    if(_pin.length === 4) setTimeout(doSignIn, 140);
  }

  document.getElementById('keypad').addEventListener('click', function(e){
    var b = e.target.closest('button[data-k]'); if(!b) return;
    press(b.getAttribute('data-k'));
  });

  window.addEventListener('keydown', function(e){
    if(document.getElementById('labelOverlay').classList.contains('show')) return;
    var k = null;
    if(/^[0-9]$/.test(e.key)) k = e.key;
    else if(e.key === 'Backspace') k = 'back';
    else if(e.key === 'Escape') k = 'clear';
    if(!k) return;
    var btn = document.querySelector('.key[data-k="'+k+'"]');
    if(btn){ btn.classList.add('pressed'); setTimeout(function(){ btn.classList.remove('pressed'); }, 110); }
    press(k);
  });

  function doSignIn(){
    if(_pin.length !== 4 || busy) return;
    setBusy(true);
    setStatus('Signing in…');
    FGHSync.signInWithPin(_pin).then(function(result){
      if(result && result.isNew){
        setStatus('');
        showLabelPrompt();
      } else {
        setStatus('Welcome back ✓');
        location.replace('./index.html');
      }
    }).catch(function(e){
      setBusy(false);
      buzz([30,40,30]);
      slotsEl.classList.remove('shake'); slotsEl.offsetWidth; slotsEl.classList.add('shake');
      setStatus((e && e.message) ? 'Sign-in failed: ' + e.message : 'Couldn’t sign in. Check your connection and try again.', true);
      setTimeout(function(){ slotsEl.classList.remove('shake'); _pin = ''; render(); }, 650);
    });
  }

  document.getElementById('guest').addEventListener('click', function(){
    FGHSync.continueAsGuest();
    location.replace('./index.html');
  });

  // ── Name sheet ──────────────────────────────────────────────────────────
  function showLabelPrompt(){
    var overlay = document.getElementById('labelOverlay');
    var inp = document.getElementById('labelInput');
    overlay.classList.add('show');
    setTimeout(function(){ inp.focus(); }, 250);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') saveLabel(); });
    document.getElementById('labelGo').addEventListener('click', saveLabel);
    document.getElementById('labelSkip').addEventListener('click', function(){ location.replace('./index.html'); });
  }
  function saveLabel(){
    var val = document.getElementById('labelInput').value.trim();
    if(val) FGHSync.setLabel(val);
    location.replace('./index.html');
  }

  render();
})();
</script>
</body>
</html>

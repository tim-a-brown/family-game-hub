<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Games">
<title>Family Games  Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared.css">
<script src="./sync.js"></script>
<style>
  body{
    background: radial-gradient(ellipse at 50% 0%, #1a2a1a 0%, #0d1117 55%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family: Inter, system-ui, sans-serif; padding: 20px;
  }
  .card{
    width: 100%; max-width: 420px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px; padding: 28px 24px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  h1{ font-family: 'Playfair Display', serif; font-size: 2.2rem; margin:.2em 0 .4em; font-weight: 900; }
  h1 span{ color:#f5c842; }
  .sub{ color: rgba(255,255,255,.65); margin-bottom: 22px; font-size: .95rem; line-height: 1.45;}
  .pin-display{
    display:flex; justify-content:center; gap:10px; margin: 8px 0 18px;
  }
  .pin-dot{
    width: 44px; height: 54px; border-radius: 10px;
    background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center;
    font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .pin-dot.filled{ background: rgba(245,200,66,.15); border-color: #f5c842; color: #f5c842; }
  .keypad{
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 14px;
  }
  .key{
    all: unset; cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 16px 0; text-align: center;
    font-size: 1.4rem; font-weight: 600; transition: transform .08s, background .15s;
  }
  .key:active{ transform: scale(.96); background: rgba(255,255,255,.12); }
  .key.wide{ grid-column: span 1; }
  .submit{
    all: unset; cursor: pointer; text-align: center;
    display: block; width: 100%; box-sizing: border-box;
    background: linear-gradient(135deg,#f5c842,#f0a500); color:#0d1117;
    font-weight: 700; padding: 14px 0; border-radius: 14px;
    margin-top: 4px;
  }
  .submit[disabled]{ opacity:.4; cursor: not-allowed; }
  .divider{ display:flex; align-items:center; gap:10px; color: rgba(255,255,255,.3); font-size:.75rem; margin: 20px 0 12px;}
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background: rgba(255,255,255,.1);}
  .guest{
    all: unset; display: block; width: 100%; box-sizing: border-box;
    text-align: center; cursor: pointer;
    padding: 12px 0; border-radius: 14px; border: 1px solid rgba(255,255,255,.15);
    color: rgba(255,255,255,.85); font-weight: 500;
  }
  .guest:hover{ background: rgba(255,255,255,.05); }
  .err{ color: #ff8080; font-size: .85rem; min-height: 1.2em; margin-top: 8px;}
  .hint{ color: rgba(255,255,255,.4); font-size: .75rem; margin-top: 14px; line-height:1.5;}
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid rgba(0,0,0,.25); border-top-color:#0d1117; border-radius:50%; animation: spin .6s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes spin { to { transform: rotate(360deg);} }
</style>
</head>
<body>
  <div class="card">
    <h1>Game <span>Night</span></h1>
    <p class="sub">Enter a 4-digit PIN to sync scores across devices,<br>or continue as a guest (this device only).</p>

    <div class="pin-display" id="pinDisplay">
      <div class="pin-dot" data-idx="0"></div>
      <div class="pin-dot" data-idx="1"></div>
      <div class="pin-dot" data-idx="2"></div>
      <div class="pin-dot" data-idx="3"></div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key" data-k="clear">Clear</button>
      <button class="key" data-k="0">0</button>
      <button class="key" data-k="back"></button>
    </div>

    <button class="submit" id="submit" disabled>Sign in</button>
    <div class="err" id="err"></div>

    <div class="divider">or</div>
    <button class="guest" id="guest">Continue as Guest</button>

    <p class="hint">Guest mode saves scores on this device only. PIN mode syncs across every device that uses the same PIN.</p>
  </div>

<script>
(function(){
  var pin = '';
  var dots = document.querySelectorAll('.pin-dot');
  var submit = document.getElementById('submit');
  var err = document.getElementById('err');
  function render(){
    for(var i=0; i<4; i++){
      dots[i].textContent = pin[i] || '';
      dots[i].classList.toggle('filled', !!pin[i]);
    }
    submit.disabled = pin.length !== 4;
  }
  document.getElementById('keypad').addEventListener('click', function(e){
    var b = e.target.closest('button[data-k]'); if(!b) return;
    var k = b.getAttribute('data-k');
    err.textContent = '';
    if(k === 'clear'){ pin = ''; }
    else if(k === 'back'){ pin = pin.slice(0, -1); }
    else if(/^[0-9]$/.test(k) && pin.length < 4){ pin += k; }
    render();
  });
  // keyboard support
  window.addEventListener('keydown', function(e){
    err.textContent = '';
    if(/^[0-9]$/.test(e.key) && pin.length < 4){ pin += e.key; render(); }
    else if(e.key === 'Backspace'){ pin = pin.slice(0,-1); render(); }
    else if(e.key === 'Enter' && pin.length === 4){ doSignIn(); }
  });
  function doSignIn(){
    if(pin.length !== 4) return;
    submit.disabled = true;
    submit.innerHTML = '<span class="spinner"></span>Signing in';
    FGHSync.signInWithPin(pin).then(function(){
      location.replace('hub.html');
    }).catch(function(e){
      err.textContent = (e && e.message) ? ('Sign-in failed: ' + e.message) : 'Sign-in failed. Check your connection and try again.';
      submit.disabled = false;
      submit.textContent = 'Sign in';
    });
  }
  submit.addEventListener('click', doSignIn);
  document.getElementById('guest').addEventListener('click', function(){
    FGHSync.continueAsGuest();
    location.replace('hub.html');
  });
  render();
})();
</script>
</body>
</html>

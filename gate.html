<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="theme-color" content="#141029">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/img/home-icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=489">
<title>Game Night</title>
<link rel="stylesheet" href="kit.css">
<script src="sync.js"></script>
<script src="games.js"></script>
<script src="kit.js"></script>
<style>
body{display:flex;min-height:100dvh;}
.gate{margin:auto;width:100%;max-width:400px;padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;}
.logo{display:grid;place-items:center;width:84px;height:84px;border-radius:26px;margin-bottom:10px;overflow:hidden;
  background:linear-gradient(180deg,#171530,#0b0a1c);box-shadow:inset 0 0 0 1px var(--w08), 0 14px 30px rgba(20,16,41,.55);transform:rotate(-6deg);animation:float 3.2s ease-in-out infinite;}
.logo svg{width:84px;height:84px;display:block;}
@keyframes float{50%{transform:translateY(-6px) rotate(-2deg);}}
h1{font-family:var(--display);font-weight:400;font-size:2.6rem;}
.sub{color:var(--text-2);margin-bottom:18px;}
.slots{display:flex;gap:12px;margin:6px 0 4px;}
.slot{width:58px;height:68px;border-radius:18px;display:grid;place-items:center;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 2px var(--w1);
  font-family:var(--display);font-size:2rem;transition:box-shadow .2s, transform .2s var(--spring);}
.slot.filled{box-shadow:inset 0 0 0 2px var(--yellow);animation:pop .3s var(--spring);}
.slot.cursor{box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);}
.slots.busy .slot{opacity:.6;}
.status{min-height:1.4em;max-width:330px;text-align:center;font-weight:800;color:var(--text-2);margin:6px 0 10px;line-height:1.35;}
.status.err{color:var(--red);}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin:6px 0 18px;}
.key{height:64px;border:0;border-radius:20px;background:var(--surface-2);color:var(--text);font-size:1.6rem;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.35);}
.key:active,.key.pressed{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.key.ghost{background:transparent;box-shadow:none;color:var(--text-3);font-size:.95rem;}
.key .ico{width:24px;height:24px;}
.hint{color:var(--text-3);font-size:.85rem;font-weight:700;max-width:300px;margin-top:4px;}
/* Signed in: the keypad fades away, and the Game Night mark builds itself: the four dots fly in from the corners of
   the screen, the four arcs swirl in and lock into a ring, the ring flashes, and you pop into the middle of it */
.gate{transition:opacity .35s ease,transform .45s cubic-bezier(.5,0,.75,0),filter .35s;}
.gate.out{opacity:0;transform:scale(.94);filter:blur(3px);pointer-events:none;}
.hello{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;overflow:hidden;transition:opacity .35s ease,transform .45s cubic-bezier(.5,0,.75,0);}
.hello.bye{opacity:0;transform:scale(1.25);}
.hello .mk{position:relative;width:min(270px,64vw);aspect-ratio:1;}
.hello .mk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.hello .mk path,.hello .mk circle{transform-box:view-box;transform-origin:50% 50%;}
.hello .mk path{filter:drop-shadow(0 0 6px currentColor);}
.hello .flash{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;margin:-31% 0 0 -31%;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0 30%,rgba(255,220,140,.45) 45%,rgba(255,220,140,0) 70%);}
.hello .hav{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);}
.hello .hav .avatar{width:100%;height:100%;font-size:clamp(2rem,10vw,3rem);box-shadow:0 0 0 4px rgba(255,255,255,.92),0 14px 34px rgba(0,0,0,.55);}
.hello .sp{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:3px;background:var(--c);opacity:0;box-shadow:0 0 10px var(--c);}
.hello h2{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,9vw,3.4rem);line-height:1;text-align:center;padding:0 20px;margin-top:6px;opacity:0;}
.hello p{color:var(--text-2);font-weight:800;opacity:0;}
</style>
</head>
<body>
<div class="gate">
  <div class="logo" id="logo"></div>
  <h1>Game Night</h1>
  <p class="sub">Enter your family PIN to sync scores across your devices.</p>
  <div class="slots" id="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
  <div class="status" id="status" role="status"></div>
  <div class="pad" id="keypad"></div>
  <button class="btn btn-ghost" id="guest" type="button">Play as a guest on this device</button>
  <p class="hint">New PIN? Pick any 4 digits that aren't easy to guess (no 1234, 0000 or 2580). The same PIN on another phone shares your scores and history.</p>
</div>
<script>
(function () {
  'use strict';
  var m = FGHSync.mode();
  if (m === 'pin' || m === 'guest') { location.replace('./index.html'); return; }
  var $ = function (id) { return document.getElementById(id); };
  $('logo').innerHTML = '<svg viewBox="40 40 176 176" aria-hidden="true"><g fill="none" stroke-width="18" stroke-linecap="round"><path d="M148 72A58 58 0 0 1 184 108" stroke="#ffd166"/><path d="M184 148A58 58 0 0 1 148 184" stroke="#ff7a8a"/><path d="M108 184A58 58 0 0 1 72 148" stroke="#4fd1c5"/><path d="M72 108A58 58 0 0 1 108 72" stroke="#8b7cff"/></g><g fill="#fff"><circle cx="79" cy="79" r="16"/><circle cx="177" cy="79" r="16"/><circle cx="177" cy="177" r="16"/><circle cx="79" cy="177" r="16"/></g></svg>';

  var pin = '', busy = false, slots = $('slots').children;
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'back'].forEach(function (k) {
    var b = Kit.el('button', { type: 'button', class: 'key' + (k === 'clear' || k === 'back' ? ' ghost' : ''), 'data-k': k, 'aria-label': k === 'back' ? 'Delete' : k === 'clear' ? 'Clear' : k });
    if (k === 'back') b.innerHTML = Kit.icon('back'); else b.textContent = k === 'clear' ? 'Clear' : k;
    $('keypad').appendChild(b);
  });
  var keys = document.querySelectorAll('.key');

  function render() {
    for (var i = 0; i < 4; i++) {
      slots[i].textContent = pin[i] || '';
      slots[i].classList.toggle('filled', !!pin[i]);
      slots[i].classList.toggle('cursor', !busy && i === pin.length);
    }
  }
  function status(msg, err) { $('status').textContent = msg || ''; $('status').classList.toggle('err', !!err); }
  function setBusy(b) { busy = b; $('slots').classList.toggle('busy', b); keys.forEach(function (k) { k.disabled = b; }); render(); }

  function press(k) {
    if (busy) return;
    if ($('status').classList.contains('err')) status('');
    if (k === 'clear') pin = '';
    else if (k === 'back') pin = pin.slice(0, -1);
    else if (/^[0-9]$/.test(k) && pin.length < 4) { pin += k; Kit.haptic('tick'); Kit.sfx('tick'); }
    render();
    if (pin.length === 4) setTimeout(signIn, 140);
  }
  $('keypad').addEventListener('click', function (e) { var b = e.target.closest('button[data-k]'); if (b) press(b.getAttribute('data-k')); });
  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.k-scrim')) return;
    var k = /^[0-9]$/.test(e.key) ? e.key : e.key === 'Backspace' ? 'back' : e.key === 'Escape' ? 'clear' : null;
    if (!k) return;
    var b = document.querySelector('.key[data-k="' + k + '"]');
    if (b) { b.classList.add('pressed'); setTimeout(function () { b.classList.remove('pressed'); }, 110); }
    press(k);
  });

  function signIn() {
    if (pin.length !== 4 || busy) return;
    setBusy(true); status('Signing in…');
    FGHSync.signInWithPin(pin).then(function (r) {
      if (r && r.isNew) { status(''); askName(); }
      else { status(''); hello(true); }
    }).catch(function (e) {
      setBusy(false); Kit.haptic('error'); Kit.sfx('bad');
      $('slots').classList.remove('shake'); void $('slots').offsetWidth; $('slots').classList.add('shake');
      if (e && e.code === 'weak') status('That PIN is too easy to guess. Pick a less common one. If it was your PIN, change it on a device that is still signed in: tap your avatar, then Change PIN.', true);
      else if (e && e.code === 'moved') status('That PIN was changed. Sign in with the new one.', true);
      else status(e && e.message ? 'Sign-in failed: ' + e.message : "Couldn't sign in. Check your connection and try again.", true);
      setTimeout(function () { $('slots').classList.remove('shake'); pin = ''; render(); }, 650);
    });
  }
  $('guest').addEventListener('click', function () { FGHSync.continueAsGuest(); location.replace('./index.html'); });

  function askName() {
    var inp = Kit.el('input', { class: 'input', maxlength: 14, placeholder: 'e.g. Tim', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'done' });
    // a PIN is one person's account: its name is your name in every game
    function go() { var v = inp.value.trim(); if (v) { FGHSync.setLabel(v); try { localStorage.setItem('my_name', v); } catch (e) {} } closeSheet(); hello(false); }
    function closeSheet() { document.querySelectorAll('.k-scrim').forEach(function (x) { x.remove(); }); }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    Kit.sheet({
      title: 'New PIN! What’s your name?', node: Kit.el('div', null, [Kit.el('p', { class: 'muted', style: { 'margin-bottom': '12px' }, text: 'This PIN is your account: your name, avatar and games on every device you sign in on. Everyone in the family gets their own PIN.' }), inp]),
      dismissible: false,
      actions: [{ label: 'Save and continue', primary: true, onClick: go }, { label: 'Skip for now', cls: 'btn-ghost', onClick: function () { closeSheet(); hello(false); } }]
    });
    setTimeout(function () { inp.focus(); }, 350);
  }
  // Signed in: fade the keypad away, build the Game Night mark around your avatar, say hello, then home
  var MARK_ARCS = [['M148 72A58 58 0 0 1 184 108', '#ffd166'], ['M184 148A58 58 0 0 1 148 184', '#ff7a8a'], ['M108 184A58 58 0 0 1 72 148', '#4fd1c5'], ['M72 108A58 58 0 0 1 108 72', '#8b7cff']];
  var MARK_DOTS = [[79, 79], [177, 79], [177, 177], [79, 177]];
  function hello(back) {
    var name = '';
    try { name = (localStorage.getItem('my_name') || (FGHSync.label && FGHSync.label()) || '').trim(); } catch (e) {}
    $('logo').style.animation = 'none';
    document.querySelector('.gate').classList.add('out');
    var NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '40 40 176 176'); svg.setAttribute('aria-hidden', 'true');
    var arcs = MARK_ARCS.map(function (a) { var p = document.createElementNS(NS, 'path'); p.setAttribute('d', a[0]); p.setAttribute('fill', 'none'); p.setAttribute('stroke', a[1]); p.setAttribute('stroke-width', '18'); p.setAttribute('stroke-linecap', 'round'); p.style.color = a[1]; p.style.opacity = '0'; svg.appendChild(p); return p; });
    var dots = MARK_DOTS.map(function (d) { var c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', d[0]); c.setAttribute('cy', d[1]); c.setAttribute('r', '16'); c.setAttribute('fill', '#fff'); c.style.opacity = '0'; svg.appendChild(c); return c; });
    var flash = Kit.el('i', { class: 'flash' });
    var hav = Kit.el('div', { class: 'hav' }, [name ? Kit.avatar.el(name, 'xl') : Kit.el('span', { class: 'avatar xl', html: Kit.icon('dice') })]);
    var mk = Kit.el('div', { class: 'mk' }, [flash, svg, hav]);
    var cols = ['#ffd166', '#ff7a8a', '#4fd1c5', '#8b7cff'], sparks = [];
    for (var i = 0; i < 16; i++) { var sp = Kit.el('i', { class: 'sp', style: { '--c': cols[i % 4] } }); sparks.push(sp); mk.appendChild(sp); }
    var h2 = Kit.el('h2', { text: name ? 'Hi, ' + name + '!' : 'Welcome!' }), sub = Kit.el('p', { text: back ? 'Good to see you again' : 'Let’s play' });
    var box = Kit.el('div', { class: 'hello', role: 'status', 'aria-label': h2.textContent }, [mk, h2, sub]);
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
    var A = function (n, k, o) { return n.animate ? n.animate(k, Object.assign({ fill: 'both' }, o)) : null; };
    setTimeout(function () {
      document.body.appendChild(box);
      if (still) { arcs.concat(dots, [h2, sub]).forEach(function (n) { n.style.opacity = '1'; }); hav.style.transform = 'translate(-50%,-50%)'; Kit.sfx('good'); return; }
      // the dots: each flies in from its own corner of the screen, overshoots toward the middle and settles
      dots.forEach(function (c, k) {
        var dx = MARK_DOTS[k][0] < 128 ? -1 : 1, dy = MARK_DOTS[k][1] < 128 ? -1 : 1;
        A(c, [{ opacity: 0, transform: 'translate(' + dx * 330 + 'px,' + dy * 420 + 'px) scale(.5)' },
              { opacity: 1, transform: 'translate(' + dx * -10 + 'px,' + dy * -10 + 'px) scale(1.25)', offset: .62 },
              { opacity: 1, transform: 'translate(' + dx * 3 + 'px,' + dy * 3 + 'px) scale(.92)', offset: .82 },
              { opacity: 1, transform: 'none' }], { duration: 620, delay: k * 80, easing: 'cubic-bezier(.3,.7,.4,1)' });
      });
      // the arcs: each swirls in from a wide spin, drawing itself as it closes into the ring
      arcs.forEach(function (p, k) {
        var L = p.getTotalLength ? p.getTotalLength() : 60; p.style.strokeDasharray = L;
        A(p, [{ opacity: 0, strokeDashoffset: L, transform: 'rotate(-' + (240 + k * 30) + 'deg) scale(2.2)' },
              { opacity: 1, strokeDashoffset: 0, transform: 'rotate(14deg) scale(.94)', offset: .78 },
              { opacity: 1, strokeDashoffset: 0, transform: 'none' }], { duration: 760, delay: 140 + k * 90, easing: 'cubic-bezier(.22,.8,.3,1)' });
      });
      Kit.sfx('whoosh');
    }, 260);
    // locked: the mark pulses, a flash and a burst of sparks, and you pop into the middle
    setTimeout(function () {
      if (still) return;
      Kit.sfx('good'); Kit.haptic('success');
      A(svg, [{ transform: 'none' }, { transform: 'scale(1.1) rotate(-4deg)', offset: .35 }, { transform: 'none' }], { duration: 420, easing: 'ease-out' });
      A(flash, [{ opacity: .95, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(2.3)' }], { duration: 650, easing: 'ease-out' });
      sparks.forEach(function (sp, k) {
        var a = k * 360 / sparks.length + (k % 2) * 8, r = 150 + (k % 3) * 40;
        A(sp, [{ opacity: 1, transform: 'rotate(' + a + 'deg) translateY(-70px) rotate(45deg) scale(.8)' }, { opacity: 0, transform: 'rotate(' + a + 'deg) translateY(-' + r + 'px) rotate(225deg) scale(.3)' }], { duration: 850, delay: (k % 4) * 25, easing: 'cubic-bezier(.15,.7,.3,1)' });
      });
      A(hav, [{ transform: 'translate(-50%,-50%) scale(0) rotate(-20deg)' }, { transform: 'translate(-50%,-50%) scale(1.14) rotate(4deg)', offset: .6 }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 560, delay: 60, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
      A(h2, [{ opacity: 0, transform: 'scale(.6) translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 520, delay: 220, easing: 'cubic-bezier(.2,1.4,.4,1)' });
      A(sub, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 420, easing: 'ease' });
    }, 260 + 1000);
    setTimeout(function () { box.classList.add('bye'); }, 2750);
    setTimeout(function () { location.replace('./index.html'); }, 3150);
  }
  render();
  // Signed out because this account's PIN was changed on another device
  try { if (localStorage.getItem('fgh_pin_moved')) { localStorage.removeItem('fgh_pin_moved'); status('Your PIN was changed on another device. Sign in with the new PIN.', true); } } catch (e) {}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="theme-color" content="#141029">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/img/home-icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=489">
<title>Game Night</title>
<link rel="stylesheet" href="kit.css">
<script src="sync.js"></script>
<script src="games.js"></script>
<script src="kit.js"></script>
<style>
body{display:flex;min-height:100dvh;}
.gate{margin:auto;width:100%;max-width:400px;padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;}
.logo{display:grid;place-items:center;width:84px;height:84px;border-radius:26px;color:#2b1a00;margin-bottom:10px;
  background:linear-gradient(135deg,var(--yellow),var(--orange));box-shadow:inset 0 -6px 0 rgba(0,0,0,.18), 0 14px 30px rgba(255,138,61,.35);transform:rotate(-6deg);animation:float 3.2s ease-in-out infinite;}
.logo .ico{width:46px;height:46px;}
@keyframes float{50%{transform:translateY(-6px) rotate(-2deg);}}
h1{font-family:var(--display);font-weight:400;font-size:2.6rem;}
.sub{color:var(--text-2);margin-bottom:18px;}
.slots{display:flex;gap:12px;margin:6px 0 4px;}
.slot{width:58px;height:68px;border-radius:18px;display:grid;place-items:center;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 2px var(--w1);
  font-family:var(--display);font-size:2rem;transition:box-shadow .2s, transform .2s var(--spring);}
.slot.filled{box-shadow:inset 0 0 0 2px var(--yellow);animation:pop .3s var(--spring);}
.slot.cursor{box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);}
.slots.busy .slot{opacity:.6;}
.status{min-height:1.4em;max-width:330px;text-align:center;font-weight:800;color:var(--text-2);margin:6px 0 10px;line-height:1.35;}
.status.err{color:var(--red);}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin:6px 0 18px;}
.key{height:64px;border:0;border-radius:20px;background:var(--surface-2);color:var(--text);font-size:1.6rem;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.35);}
.key:active,.key.pressed{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.key.ghost{background:transparent;box-shadow:none;color:var(--text-3);font-size:.95rem;}
.key .ico{width:24px;height:24px;}
.hint{color:var(--text-3);font-size:.85rem;font-weight:700;max-width:300px;margin-top:4px;}
</style>
</head>
<body>
<div class="gate">
  <div class="logo" id="logo"></div>
  <h1>Game Night</h1>
  <p class="sub">Enter your family PIN to sync scores across your devices.</p>
  <div class="slots" id="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
  <div class="status" id="status" role="status"></div>
  <div class="pad" id="keypad"></div>
  <button class="btn btn-ghost" id="guest" type="button">Play as a guest on this device</button>
  <p class="hint">New PIN? Pick any 4 digits that aren't easy to guess (no 1234, 0000 or 2580). The same PIN on another phone shares your scores and history.</p>
</div>
<script>
(function () {
  'use strict';
  var m = FGHSync.mode();
  if (m === 'pin' || m === 'guest') { location.replace('./index.html'); return; }
  var $ = function (id) { return document.getElementById(id); };
  $('logo').innerHTML = Kit.icon('dice');

  var pin = '', busy = false, slots = $('slots').children;
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'back'].forEach(function (k) {
    var b = Kit.el('button', { type: 'button', class: 'key' + (k === 'clear' || k === 'back' ? ' ghost' : ''), 'data-k': k, 'aria-label': k === 'back' ? 'Delete' : k === 'clear' ? 'Clear' : k });
    if (k === 'back') b.innerHTML = Kit.icon('back'); else b.textContent = k === 'clear' ? 'Clear' : k;
    $('keypad').appendChild(b);
  });
  var keys = document.querySelectorAll('.key');

  function render() {
    for (var i = 0; i < 4; i++) {
      slots[i].textContent = pin[i] || '';
      slots[i].classList.toggle('filled', !!pin[i]);
      slots[i].classList.toggle('cursor', !busy && i === pin.length);
    }
  }
  function status(msg, err) { $('status').textContent = msg || ''; $('status').classList.toggle('err', !!err); }
  function setBusy(b) { busy = b; $('slots').classList.toggle('busy', b); keys.forEach(function (k) { k.disabled = b; }); render(); }

  function press(k) {
    if (busy) return;
    if ($('status').classList.contains('err')) status('');
    if (k === 'clear') pin = '';
    else if (k === 'back') pin = pin.slice(0, -1);
    else if (/^[0-9]$/.test(k) && pin.length < 4) { pin += k; Kit.haptic('tick'); Kit.sfx('tick'); }
    render();
    if (pin.length === 4) setTimeout(signIn, 140);
  }
  $('keypad').addEventListener('click', function (e) { var b = e.target.closest('button[data-k]'); if (b) press(b.getAttribute('data-k')); });
  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.k-scrim')) return;
    var k = /^[0-9]$/.test(e.key) ? e.key : e.key === 'Backspace' ? 'back' : e.key === 'Escape' ? 'clear' : null;
    if (!k) return;
    var b = document.querySelector('.key[data-k="' + k + '"]');
    if (b) { b.classList.add('pressed'); setTimeout(function () { b.classList.remove('pressed'); }, 110); }
    press(k);
  });

  function signIn() {
    if (pin.length !== 4 || busy) return;
    setBusy(true); status('Signing in…');
    FGHSync.signInWithPin(pin).then(function (r) {
      if (r && r.isNew) { status(''); askName(); }
      else { status('Welcome back!'); Kit.sfx('good'); location.replace('./index.html'); }
    }).catch(function (e) {
      setBusy(false); Kit.haptic('error'); Kit.sfx('bad');
      $('slots').classList.remove('shake'); void $('slots').offsetWidth; $('slots').classList.add('shake');
      if (e && e.code === 'weak') status('That PIN is too easy to guess. Pick a less common one. If it was your PIN, change it on a device that is still signed in: tap your avatar, then Change PIN.', true);
      else if (e && e.code === 'moved') status('That PIN was changed. Sign in with the new one.', true);
      else status(e && e.message ? 'Sign-in failed: ' + e.message : "Couldn't sign in. Check your connection and try again.", true);
      setTimeout(function () { $('slots').classList.remove('shake'); pin = ''; render(); }, 650);
    });
  }
  $('guest').addEventListener('click', function () { FGHSync.continueAsGuest(); location.replace('./index.html'); });

  function askName() {
    var inp = Kit.el('input', { class: 'input', maxlength: 14, placeholder: 'e.g. Tim', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'done' });
    // a PIN is one person's account: its name is your name in every game
    function go() { var v = inp.value.trim(); if (v) { FGHSync.setLabel(v); try { localStorage.setItem('my_name', v); } catch (e) {} } location.replace('./index.html'); }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    Kit.sheet({
      title: 'New PIN! What’s your name?', node: Kit.el('div', null, [Kit.el('p', { class: 'muted', style: { 'margin-bottom': '12px' }, text: 'This PIN is your account: your name, avatar and games on every device you sign in on. Everyone in the family gets their own PIN.' }), inp]),
      dismissible: false,
      actions: [{ label: 'Save and continue', primary: true, onClick: go }, { label: 'Skip for now', cls: 'btn-ghost', onClick: function () { location.replace('./index.html'); } }]
    });
    setTimeout(function () { inp.focus(); }, 350);
  }
  render();
  // Signed out because this account's PIN was changed on another device
  try { if (localStorage.getItem('fgh_pin_moved')) { localStorage.removeItem('fgh_pin_moved'); status('Your PIN was changed on another device. Sign in with the new PIN.', true); } } catch (e) {}
})();
</script>
</body>
</html>

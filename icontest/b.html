<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Test B</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body style="font:18px -apple-system,sans-serif;padding:24px;background:#fff;color:#111">
<h1 style="font-size:22px">Icon test B</h1>
<p id="s">Removing the app's offline service worker on this site…</p>
<p>When it says done, tap Share, then Add to Home Screen, and look at the icon.</p>
<script>
(navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))
  .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })).then(function () { return rs.length; }); })
  .then(function (n) { document.getElementById('s').textContent = 'Done: removed ' + n + ' service worker(s). If this page was opened before the removal, reload it once.'; })
  .catch(function (e) { document.getElementById('s').textContent = 'Could not check: ' + e; });
</script>
</body>
</html>

# Deploys the site to Firebase Hosting (games.timbrown.xyz) on every push to main.
# One-time setup: add a repo secret FIREBASE_SERVICE_ACCOUNT containing the JSON
# key of a service account with the "Firebase Hosting Admin" role on the
# familygames-da3e5 project (or run `firebase init hosting:github`, which
# creates both the account and the secret for you).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Which film or show each Lorcana card is from, refreshed for new sets
      # (keeps the bundled list if LorcanaJSON can't be reached)
      - name: Refresh Lorcana film list
        run: node scripts/build-lorcana-stories.js
      # Copy any new Lorcana card pictures to Firebase Storage (Google Cloud),
      # so the game still has art if Lorcast goes away. Never blocks the deploy.
      - name: Back up Lorcana card art
        run: node scripts/mirror-lorcana-art.js
        continue-on-error: true
        timeout-minutes: 30
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Fresh TURN logins for online games (also every six hours in turn-credentials.yml). Never blocks the deploy.
      - name: Refresh TURN logins
        run: node scripts/turn-credentials.js
        continue-on-error: true
        timeout-minutes: 3
        env:
          CF_TURN_KEY_ID: ${{ secrets.CF_TURN_KEY_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # The list of files "Offline" in the menu saves on the device (music, crosswords, Sandlot stats...)
      - name: List files for offline
        run: python3 scripts/build-offline-list.py
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: familygames-da3e5
          channelId: live

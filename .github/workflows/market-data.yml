# Prices for the Stock Market game, three times a day in New York (stocks only move on weekdays; crypto trades every
# day): soon after the open, midday and after the close. The times are UTC, picked to land right in both EDT and EST:
# 14:45 = 10:45 / 9:45 AM, 17:05 = 1:05 PM / 12:05 PM, 21:17 = 5:17 / 4:17 PM. See scripts/market-data.js.
# Run it any time from the Actions tab.
name: Market prices

on:
  schedule:
    - cron: '45 14 * * *'
    - cron: '5 17 * * *'
    - cron: '17 21 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/market-data.js
      - .github/workflows/market-data.yml

permissions:
  contents: read

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest prices and save them
        run: node scripts/market-data.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

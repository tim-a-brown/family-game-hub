# One-time Yahoo sign-in for the fantasy scores: open the sign-in link, approve, and paste the code Yahoo shows into
# this Action's "code" box (Actions tab, Yahoo sign-in, Run workflow). It saves the login privately and gets the
# first scores. Run it again only if Yahoo ever asks you to sign in again.
name: Yahoo sign-in

on:
  workflow_dispatch:
    inputs:
      code:
        description: The code Yahoo showed after you approved
        required: true

permissions:
  contents: read

concurrency:
  group: yahoo-fantasy
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep the code out of the log
        run: echo "::add-mask::${{ github.event.inputs.code }}"
      - uses: actions/checkout@v4
      - name: Sign in and get the first scores
        run: node scripts/yahoo-fantasy.js
        env:
          CODE: ${{ github.event.inputs.code }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}

# Fresh TURN logins for online games, every six hours and on every deploy (they last two days). See scripts/turn-credentials.js.
# Needs the CF_TURN_KEY_ID and CF_TURN_API_TOKEN secrets (Cloudflare dashboard → Realtime → TURN Server).
# Run it any time from the Actions tab (Run workflow).
name: TURN logins

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/turn-credentials.js
      - .github/workflows/turn-credentials.yml

permissions:
  contents: read

concurrency:
  group: turn-credentials
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Get new logins from Cloudflare and save them
        run: node scripts/turn-credentials.js
        env:
          CF_TURN_KEY_ID: ${{ secrets.CF_TURN_KEY_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

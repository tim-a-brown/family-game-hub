# Temporary: checks the TURN server carries a connection. Removed after one run.
name: TURN test
on:
  push:
    paths: [.github/workflows/turn-test.yml, scripts/turn-test.js]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save puppeteer-core@22 && node scripts/turn-test.js

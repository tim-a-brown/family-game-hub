# Temporary: checks the app loads the TURN logins and connects through them. Removed after it runs.
name: TURN test
on:
  push:
    paths: [.github/workflows/turn-test.yml, scripts/turn-test.js]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          (python3 -m http.server 8000 >/dev/null 2>&1 &)
          npm i --no-save puppeteer-core@22 && node scripts/turn-test.js

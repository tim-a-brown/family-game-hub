# Temporary (approved by Tim): one sample of ESPN's public sports data for building the sportsbook. Deleted before shipping.
name: ESPN sample
on:
  push:
    branches: [claude/happy-hamilton-8hf2d3]
    paths: ['.github/workflows/espn-probe.yml']
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples
        run: |
          mkdir -p espn-sample
          cat > /tmp/probe.js <<'EOF'
          const fs = require('fs');
          const S = 'https://site.api.espn.com/apis/site/v2/sports/';
          const out = (n, v) => fs.writeFileSync('espn-sample/' + n + '.json', JSON.stringify(v, null, 1));
          async function get(u) { try { const r = await fetch(u); const txt = await r.text(); let b = null; try { b = JSON.parse(txt); } catch (e) { b = txt.slice(0, 500); } return { url: u, status: r.status, body: b }; } catch (e) { return { url: u, err: String(e) }; } }
          (async () => {
            const ymd = d => d.toISOString().slice(0, 10).replace(/-/g, ''), d0 = new Date(), d3 = new Date(Date.now() + 3 * 864e5), d6 = new Date(Date.now() + 6 * 864e5);
            const res = [];
            for (const q of ['', '?limit=100', '?limit=500', '?limit=1000', '?dates=' + ymd(d0), '?dates=' + ymd(d0) + '-' + ymd(d3), '?dates=' + ymd(d0) + '-' + ymd(d6), '?dates=' + ymd(d0) + '-' + ymd(d6) + '&limit=300', '?dates=' + ymd(d0) + '-' + ymd(d6) + '&limit=100']) {
              const r = await get(S + 'football/nfl/scoreboard' + q);
              res.push({ q, status: r.status, n: r.body && r.body.events ? r.body.events.length : null, err: r.body && !r.body.events ? r.body : null });
            }
            out('variants_nfl', res);
            for (const p of ['football/nfl', 'basketball/nba', 'hockey/nhl', 'basketball/wnba', 'baseball/mlb']) {
              const r = await get(S + p + '/scoreboard?dates=' + ymd(d0) + '-' + ymd(d3));
              const ev = r.body && r.body.events || [];
              out('team2_' + p.replace('/', '_'), { status: r.status, n: ev.length, withOdds: ev.filter(e => e.competitions[0].odds).length, sample: ev.filter(e => e.competitions[0].odds).slice(0, 2).concat(ev.filter(e => !e.competitions[0].odds).slice(0, 1)), err: r.body && !r.body.events ? r.body : null });
            }
            for (const [p, g] of [['football/college-football', 80], ['basketball/mens-college-basketball', 50]]) {
              const r = await get(S + p + '/scoreboard?groups=' + g + '&dates=' + ymd(d0) + '-' + ymd(d3) + '&limit=300');
              const ev = r.body && r.body.events || [];
              out('team2_' + p.replace('/', '_'), { status: r.status, n: ev.length, withOdds: ev.filter(e => e.competitions[0].odds).length, sample: ev.filter(e => e.competitions[0].odds).slice(0, 2), err: r.body && !r.body.events ? r.body : null });
            }
            const tm = await get(S + 'football/college-football/teams?limit=1000');
            out('teams_cfb', { status: tm.status, n: tm.body && tm.body.sports ? tm.body.sports[0].leagues[0].teams.length : null, first: tm.body && tm.body.sports ? tm.body.sports[0].leagues[0].teams.slice(0, 2) : tm.body });
            // golf: last finished events for player form
            const g = await get(S + 'golf/pga/scoreboard?dates=20261015');
            out('golf_prev', { status: g.status, events: g.body && g.body.events ? g.body.events.map(e => ({ id: e.id, name: e.name, status: e.status, n: e.competitions[0].competitors.length, top: e.competitions[0].competitors.slice(0, 3).map(c => ({ order: c.order, name: c.athlete.displayName, score: c.score, ls: c.linescores.map(l => l.value) })), last: e.competitions[0].competitors.slice(-3).map(c => ({ order: c.order, name: c.athlete.displayName, score: c.score, ls: c.linescores.map(l => l.value) })) })) : g.body });
          })();
          EOF
          node /tmp/probe.js
          ls -la espn-sample
      - name: Commit
        run: |
          git config user.name "espn-sample"; git config user.email "espn-sample@users.noreply.github.com"
          git add espn-sample && git commit -m "ESPN data sample 2 (temporary, for building the sportsbook)" && git push

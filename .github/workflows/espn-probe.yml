# Temporary (approved by Tim): one sample of ESPN's public sports data for building the sportsbook. Deleted before shipping.
name: ESPN sample
on:
  push:
    branches: [claude/happy-hamilton-8hf2d3]
    paths: ['.github/workflows/espn-probe.yml']
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples
        run: |
          mkdir -p espn-sample
          cat > /tmp/probe.js <<'EOF'
          const fs = require('fs');
          const S = 'https://site.api.espn.com/apis/site/v2/sports/';
          const out = (n, v) => fs.writeFileSync('espn-sample/' + n + '.json', JSON.stringify(v, null, 1));
          async function get(u) { try { const r = await fetch(u); const txt = await r.text(); let b = null; try { b = JSON.parse(txt); } catch (e) { b = txt.slice(0, 500); } return { url: u, status: r.status, body: b }; } catch (e) { return { url: u, err: String(e) }; } }
          (async () => {
            const ymd = d => d.toISOString().slice(0, 10).replace(/-/g, ''), d0 = new Date(), d1 = new Date(Date.now() + 864e5);
            const keep = async (n, u) => { const r = await get(u); const ev = r.body && r.body.events || []; out(n, { url: u, status: r.status, n: ev.length, withOdds: ev.filter(e => e.competitions && e.competitions[0].odds).length, sample: ev.filter(e => e.competitions[0].odds).slice(0, 2).concat(ev.filter(e => !e.competitions[0].odds).slice(0, 1)), err: r.body && !r.body.events ? r.body : null }); };
            await keep('t3_nfl', S + 'football/nfl/scoreboard');
            await keep('t3_cfb', S + 'football/college-football/scoreboard?groups=80&limit=300');
            await keep('t3_nba', S + 'basketball/nba/scoreboard?dates=' + ymd(d0));
            await keep('t3_nba_tmrw', S + 'basketball/nba/scoreboard?dates=' + ymd(d1));
            await keep('t3_nhl', S + 'hockey/nhl/scoreboard?dates=' + ymd(d1));
            await keep('t3_cbb', S + 'basketball/mens-college-basketball/scoreboard?groups=50&limit=300&dates=20261104');
            await keep('t3_mlb', S + 'baseball/mlb/scoreboard');
            await keep('t3_wnba', S + 'basketball/wnba/scoreboard');
            const g = await get(S + 'golf/pga/scoreboard?dates=20261008');
            out('t3_golf_prev', { status: g.status, events: g.body && g.body.events ? g.body.events.map(e => ({ id: e.id, name: e.name, status: e.status, n: e.competitions[0].competitors.length, top: e.competitions[0].competitors.slice(0, 3).map(c => ({ order: c.order, name: c.athlete.displayName, score: c.score, ls: c.linescores.map(l => l.value) })), last: e.competitions[0].competitors.slice(-4).map(c => ({ order: c.order, name: c.athlete.displayName, score: c.score, ls: c.linescores.map(l => l.value) })) })) : g.body });
          })();
          EOF
          node /tmp/probe.js
          ls -la espn-sample
      - name: Commit
        run: |
          git config user.name "espn-sample"; git config user.email "espn-sample@users.noreply.github.com"
          git add espn-sample && git commit -m "ESPN data sample 3 (temporary, for building the sportsbook)" && git push
